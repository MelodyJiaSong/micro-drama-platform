  [[shot.lines]]
  en = "Nine o'clock. That's the curfew bell. The word comes from old French — couvre-feu. Cover fire. For centuries that bell has meant one thing: damp down your hearth before you sleep, so the city doesn't burn while nobody's watching. The bell ringing tonight is at St Mary-le-Bow. Bow Bells. It burns tomorrow."
  kind = "画外"
  window = "4–28s"

