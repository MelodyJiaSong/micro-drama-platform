note = "笑点来自妮娅的转述与她憋笑的脸，不来自皮普斯的表演——他只有背影矮下去半头，全程不开口、不对口型、不给特写（casting §0）。躲的是 Young Killigrew 一伙（皮普斯 1666-09-01 日记原文，T0）。本镜落幅 0.70 近景、机位「木偶棚侧后方近景」是跨段接缝的固定边界值，下一段从这里跳档"
mood = "憋着笑"

[[shot.lines]]
en = "Oh, this is my favourite thing that happens today. A group of young men just walked in, and Pepys has spotted one he knows and is now actively hiding. From a puppet show. In a field. A senior naval administrator, crouching. He writes it down tonight, by the way. He writes down that they hid."
