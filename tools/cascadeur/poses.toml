# Cascadeur 共享姿势库（follow-up 032 起步：ep01 shot02 溪边打狼）。每镜 `cascadeur/choreo.toml` 用 `部件+部件` 拼姿势，
# 后写的覆盖先写的；镜头自己的 [parts] 只放本镜独有的部件，**不许与本库重名**（choreo.py 会拦）。
# 关节角定义见 tools/cascadeur/casc_fk.py 头注（度）：armL/armR = [前举, 外展, 扭转]、elbowL/R = 屈、hipL/R = [前屈, 外展]、
# kneeL/R = 屈、lean = 躯干前倾、twist = 躯干转、head = 低头(+)/抬头(-)、drop / lift = 骨盆额外下沉 / 抬起(cm)、ground = "knee" 跪地贴地。
# 新增部件：先在本库找近似的改一份另起名，截静帧看过再用；数值只写在这里一处。

