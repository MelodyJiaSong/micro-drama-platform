[project]
name = "clip-library"
version = "0.1.0"
description = "YouTube 素材库：按授权搜索、批量下载、字幕检索、截取片段"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]>=2026.10.26", "dependency-injector>=4.41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
