[project]
name = "suno-browser-service"
version = "0.3.0"
description = "Suno 网页生成与官方下载服务"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "dependency-injector>=4.41", "playwright>=1.55,<2", "python-multipart>=0.0.20", "httpx>=0.27", "mcp>=1.27,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]

[tool.uv]
package = false
