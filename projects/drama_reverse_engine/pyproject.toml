[project]
name = "drama_reverse_engine"
version = "0.1.0"
description = "Short-drama reverse engineering + regeneration service (mp4 -> novel/script/shot prompts -> Seedance remake)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "dependency-injector>=4.41",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
