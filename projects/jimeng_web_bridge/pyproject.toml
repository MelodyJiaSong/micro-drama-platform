[project]
name = "jimeng_web_bridge"
version = "0.1.0"
description = "Local-only bridge that drives the logged-in 即梦 web page (video) and the official dreamina CLI (images) behind HTTP + MCP + a management UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "starlette>=0.40",
    "dependency-injector>=4.46",
    "playwright>=1.49",
    "mcp>=1.23.0",
    "tomlkit>=0.13",
    "pillow>=10.4",
    "windows-toasts>=1.3; sys_platform == 'win32'",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_probe: depends on fixtures captured by the stage-6 read-only site probe",
    "requires_real_repo: reads the real ai_videos/ tree",
    "requires_ffprobe: needs ffprobe on PATH",
    "perf: performance budget checks (make test-perf)",
    "soak: long-running soak (make test-soak)",
]
