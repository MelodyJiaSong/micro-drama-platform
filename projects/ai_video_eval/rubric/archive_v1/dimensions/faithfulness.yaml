dimension_id: faithfulness
name_cn: 忠实剧本
description_cn: 评 shot prompt 对本集 script.md/dialogue.md 的忠实度：该镜承载的剧本 beat 是否完整落地且不越界、台词是否逐字一致（说话人/类型标注正确、不漏句不加句）、有无擅自增删剧情、重场戏的时长与呈现规格是否与剧本相符不缩水。
subcategories:
- id: beat_landing
  name_cn: 剧本 beat 落地
  weight: 1.0
  fields:
  - id: beat_full_landing
    name_cn: 剧本 beat 完整落地
    evaluator: llm
    judge_instruction_cn: 对照本集 script.md/dialogue.md 中该镜（或该镜所属拆分段）对应 beat 的「画面动作」描述，逐项核对关键要素是否全部落进 shot 的 情节/动作/走位/镜头
      字段：事件本体（如天雷劈金柱）、关键人物动作（主角避闪抬臂回望）、在场者反应（长老声浪一滞）、伏笔元素（远处黑影静观）、特效及其限制注（体表不出现纹样/光柱照人本人）。任何有戏剧功能的要素被静默丢失即扣分——典型反例：剧本写主角在台上避闪回望，shot
      里主角整个消失（真实事故：EP8 shot01 主角站位丢失）。本项只查「漏/删」；白描扩写与镜头语言加工不算漏。若该 beat 按拆镜注拆成多镜，只核对分给本镜的那一段要素。
    weight: 5.0
    anchors:
      g1: beat 的核心事件或核心人物在 shot 中缺席（剧本的主角避闪段整段消失、验灵光柱没照人），或多个关键反应/伏笔要素被砍，成片将讲不通这一步剧情。
      g3: 事件主体与关键动作都在，但丢了 1-2 个次要要素（远处黑影伏笔、配角往后缩的反应），或剧本括注的特效限制（体表不出现纹样）未带入 prompt/负面词。
      g5: 剧本该 beat 的事件、动作、反应、伏笔、特效限制逐项可在 情节/动作/镜头/负面词 中找到对应落点，拆镜段分工与剧本拆镜注吻合。
    gate: true
    gate_min_grade: 3.0
    sources:
    - stage5 §1/§4
    - follow-up 101
    - P1
  - id: beat_scope_no_spill
    name_cn: 镜界匹配不越界
    evaluator: llm
    judge_instruction_cn: 核对该 shot 承载的剧情范围是否恰好是剧本/拆镜注分配给它的那一段：①不提前把下一镜的 beat 演掉（本镜只到「请出法镜」，却把下一镜「光柱照人」也演完，等于高潮提前泄掉）；②不重演上一镜已完成的关键转折（上一镜已「霍地起身宣告」，本镜又从起身宣告重演一遍）；③承接处只延续已发生状态、不倒带重跑（上一镜特效已
      ramp 起，本镜不得从无到有再来一次）。用相邻 shot 全文与 script 的镜号映射注判断。衔接契约允许的约 1 秒承接续动/动作重叠不算越界。
    weight: 3.0
    anchors:
      g1: 本镜大段重演上一镜已完成的转折，或把下一镜的核心 beat 提前演完，成片将出现同一件事看两遍或高潮提前泄底。
      g3: 界线基本对，但开头/结尾有超出承接需要的重叠——重复了一句已完成的宣告，或把上一镜已建立的特效态从零重起。
      g5: 起点＝上一镜末状态的自然延续，终点恰好停在剧本分给本镜的 beat 完成处，与相邻镜零重演零抢戏。
    sources:
    - N1
    - N3
    - N6
  - id: no_invented_plot
    name_cn: 不擅自增设剧情
    evaluator: llm
    judge_instruction_cn: 检查 shot 的 情节/动作/台词 中是否出现剧本没有的新剧情元素：新事件（剧本未写的打斗/夺镜/救场）、新角色登场、新道具法宝、新设定规则，以及提前出现要后续剧情才登场的人物/门派/专名（剧透）。允许的加工：不改变剧情走向的白描细节（微表情、衣袂、环境微动、光影氛围）、镜头语言、剧本括注隐含的合理反应。反例：剧本只写「长老提议复验」，shot
      却加了「另一宗主拍案夺镜」；台词提到此刻尚未入场的角色名。用 world.md/角色卡切片核对新元素——即便 canon 里存在，剧本本 beat 未安排的事件仍算擅自增。
    weight: 4.0
    anchors:
      g1: 新增了改变剧情走向的事件/角色/宣告，或提前泄露后续 arc 的专名与底牌，观众看到的已不是剧本这一步的剧情。
      g3: 出现 1 处不影响主线的小增设（一段剧本未写的路人动作、一件未安排的道具亮相），主线仍与剧本一致。
      g5: 全部内容可回溯到剧本该 beat 或其合理白描展开，无任何新事件/新角色/新专名/新设定。
    sources:
    - P6
    - S3
    - N4
  - id: novel_prompt_source_consistency
    name_cn: 小说原文与情节同源一致
    evaluator: llm
    judge_instruction_cn: shot 顶部 `## 小说原文` 段、`情节:` 字段、script.md 的 beat 描述，三者必须讲同一件事、无事实矛盾。重点抓「改版漂移」：剧情经修订升级后，一处已更新、另一处仍是旧版。真实反例：`##
      小说原文` 仍写「从怀里取出一面古朴铜镜、铜锈斑驳」，而 script 与 `情节:` 已升级为「单手掐诀请出仙品法镜、悬浮空中从不落手」——道具形态与召唤方式互相矛盾，模型可能按旧版事实生成。允许：小说原文保留文学措辞、情节字段做白描化改写（措辞差异不算矛盾）；只判事实层——谁、做了什么、道具/特效形态、事件方式与结果。
    weight: 2.0
    anchors:
      g1: 小说原文与 情节/剧本 在关键事实上对立（道具形态、事件方式、结果相反），照小说原文拍出来就是另一场戏。
      g3: 事实主体一致，但有次要细节两处说法不一（动作先后不同步、道具修饰性状不一致）。
      g5: 三处同讲一个事实版本，只有文学措辞与可拍白描之间的合理差异。
    sources:
    - ai_video.md rule 5
    - stage6 §3 层3
- id: dialogue_fidelity
  name_cn: 台词逐字忠实
  weight: 1.0
  fields:
  - id: dialogue_verbatim
    name_cn: 台词正文逐字一致
    evaluator: llm
    judge_instruction_cn: '把 shot `台词:` 块与 `## 台词配音 prompt` 中每句台词正文，与本集 dialogue.md（及 script.md 台词栏）分配给该镜的对应句逐字对照。标准：正文逐字一致——用户后期按
      dialogue.md 加字幕、TTS 按配音块出声，两边不一致会造成字幕与口型/配音对不上。反例：dialogue.md 写「用宗门至宝''验灵镜''再验一下吧！万一只是表象呢！」，shot 写成「再验一次吧！万一只是看走了眼呢！」——语义近似但已是改写，扣分。不扣：标点/感叹号数量的微小出入、配音块把阿拉伯数字改口语中文（契约允许）。同一句在
      台词: 块与配音块之间也须互相一致。若 dialogue.md 有 follow-up 注说明台词已改版，以其最新正文为准。'
    weight: 4.0
    anchors:
      g1: '有台词句被明显改写（换词、换句式、信息增删），或 shot 内 台词: 块与配音块两处正文互不一致，字幕/配音/口型三方必对不上。'
      g3: 正文与剧本仅个别字/标点漂移（逗号变叹号、多一个语气词），语义与句式未变。
      g5: '每句正文与 dialogue.md 逐字一致（仅契约允许的数字口语化差异），台词: 块与配音块互相也逐字一致。'
    applies_when: has_dialogue
    sources:
    - stage6 §5
    - ai_video.md 12.4
  - id: no_missing_lines
    name_cn: 台词不漏句不清空
    evaluator: llm
    judge_instruction_cn: 对照 dialogue.md/script.md 中标注分配给该镜的每一句台词（对白/内心独白/旁白/系统全算），核对是否都出现在 shot 的 `台词:` 块与 `##
      台词配音 prompt` 中。任何一句被静默删除即重大缺陷：生成器从 `台词:` 文本出声，成片将对该句变哑，字幕与配音断档。特别注意：①同一 beat 多说话人时常漏第二说话人的短应答（如长老进言后云鹤标注同镜的「好……那就再验一次吧……」缺失）；②因「念不完/时长不够」砍词——契约规定语速超标应加时长或拆镜、绝不删台词，砍词照判缺陷；③剧本明确标「本镜无台词」的静默镜不适用本项，直接给
      5 分。
    weight: 5.0
    anchors:
      g1: '剧本分配给该镜的台词有整句缺失，或 台词: 被清空/写成「无」而剧本明明有词，成片该句必哑。'
      g3: 主句都在，但漏了剧本标注的一句短应答或半句咽回式碎句，或配音块少列了一个发声单元。
      g5: '剧本分给该镜的每一句（含短应答、语气词句）都在 台词: 块与配音块中逐句可见；静默镜与剧本「无台词」标注吻合。'
    gate: true
    gate_min_grade: 3.0
    sources:
    - stage6 §8
    - follow-up 101
    - ai_video.md 12.4
  - id: no_added_lines
    name_cn: 不擅自加台词
    evaluator: llm
    judge_instruction_cn: 检查 shot `台词:` 块与配音块中是否出现 dialogue.md/script.md 没有分配给该镜的台词句：①整句新增（给角色编了一句剧本没有的宣告/嘲讽/起哄）；②把剧本分给其他镜的台词挪进本镜且无拆镜注授权；③把剧本的舞台指示/旁注升格成台词念出来。反例：剧本该镜只有长老一句进言，shot
      却给围观群众加了一句起哄词。允许：拆镜注/follow-up 注明确把某句移到本镜；语气词级别的极小补充（一个「哼」）算轻微瑕疵、不算整句新增。新增句会连带用户后期字幕与配音对不上，且可能与本集其他镜的宣告措辞重复，从严判。
    weight: 3.0
    anchors:
      g1: 出现≥1 句剧本没有的完整新台词，或无依据地把别镜的关键句挪来，剧情信息与后期字幕基准已被改动。
      g3: 无整句新增，但有一处语气词/称呼级的小补充，或半句舞台指示被当台词念了出来。
      g5: 台词句集合与剧本分配完全吻合、一句不多；有挪句处均有拆镜注/follow-up 依据。
    applies_when: has_dialogue
    sources:
    - N2
    - derived
  - id: speaker_attribution_correct
    name_cn: 说话人归属正确
    evaluator: llm
    judge_instruction_cn: '逐句核对 shot 中每句台词的说话人与剧本一致：①不得张冠李戴（剧本是甲说的，shot 标成乙）；②说话人不在画/画外/OS 的句子必须显式归属说话人（「台词系某某·画外」）并给全部在画人物闭口注——否则视频模型会把这句
      lip-sync 到画面里最显眼的脸上，等于换了说话人（真实事故：太监的宣旨词被对到国公嘴上）；③`## 台词配音 prompt` 的 角色: 行与 台词: 块说话人一致；④多说话人镜每句各归其主，不得把两人的词合并到一人嘴里。正例：`·
      某长老〔对白〕：……`＋「无台词露脸角色闭口不动嘴」写进 动作/负面词。'
    weight: 4.0
    anchors:
      g1: 有台词句说话人标错，或画外/OS 句缺归属与在画闭口注、必然被错误对到别人脸上；配音块角色与台词块也对不上。
      g3: 说话人标签都对，但某句画外/OS 的防错注不全（只有类型标、缺「严禁对到在画人物嘴上」类指向）。
      g5: 每句说话人与剧本一致、台词块与配音块互相一致；画外/OS 句归属＋在画闭口注双写死，多人镜逐句归主清晰。
    applies_when: has_dialogue
    gate: true
    gate_min_grade: 3.0
    sources:
    - ai_video.md 2026-05-30 OS 归属
    - ai_video.md 12.4
  - id: dialogue_type_label_correct
    name_cn: 台词类型标注正确
    evaluator: llm
    judge_instruction_cn: dialogue.md 给每句台词标了类型（对白 / 内心独白·OS / 旁白 / 系统），shot 必须忠实映射：对白→〔正常台词/对白〕且口型对说话人；内心独白/OS→〔内心独白〕且嘴唇不动、画外配音；旁白/系统→对应类型且不对任何在画人物口型；配音块
      `类型:` 行（正常台词(对口型)/内心独白/系统提示音）与之逐句同步。重点抓两类错：①剧本标内心独白、shot 标成正常台词——成片角色会开口念内心戏，穿帮；②剧本标对白、shot 标成内心独白/画外——成片嘴不动却出声。混排镜须逐句各标各的类型，不得一个标签盖全部。反例：剧本「裴霆（内心独白·OS·嘴不动）」句在
      shot 里写成〔对白〕。
    weight: 3.0
    anchors:
      g1: 有句子类型标反（内心独白标成对白或反之），或系统/旁白句被标成在画对白，口型契约必然渲染错。
      g3: '类型都标对，但 台词: 块与配音块的类型行有一处不同步，或混排镜某句类型标注含糊。'
      g5: '每句类型与 dialogue.md 完全对应、口型语义正确；台词: 块与配音块类型逐句同步。'
    applies_when: has_dialogue
    sources:
    - ai_video.md 12.4 台词契约 v2
    - nvdi 027
  - id: monologue_lip_directive_present
    name_cn: 独白/旁白/系统句带闭口指令
    evaluator: rule
    judge_instruction_cn: 机械校验：当该镜台词含内心独白/旁白/系统句时，`台词:` 块中必须出现闭口指令字样——「嘴唇不动」「嘴不动」「不对口型」「全程闭口」至少其一。这是类型标注的落地保障：内心独白＝画外心声，说话人自己的嘴不能动；旁白/系统句不得对到任何在画人物嘴上。缺少该指令时，视频模型默认给在画人脸自动叠加说话口型，内心戏会被渲染成开口自言自语。正例：〔内心独白·OS·嘴不动〕，或台词块注「在画人物全程闭口、嘴唇不动」。反例：只标〔内心独白〕四个字、通篇无任何闭口字样。
    weight: 2.0
    anchors:
      g1: 台词块含内心独白/旁白/系统句，却通篇找不到任何闭口/不对口型字样，模型将给在画脸自动配口型。
      g3: 有闭口字样但只覆盖部分独白句，或写在远离对应句的位置、指向不明。
      g5: 每个独白/旁白/系统发声单元的标签或紧邻注中都带明确闭口指令。
    applies_when: '''内心独白'' in dialogue_types or ''旁白'' in dialogue_types or ''系统'' in dialogue_types'
    sources:
    - ai_video.md 12.4 台词契约 v2
    - nvdi 007
    rule_id: required_pattern
    rule_params:
      pattern: 嘴唇不动|嘴不动|不对口型|全程闭口
      scope: dialogue_field
      description: 台词含内心独白/旁白/系统句时，台词块必须出现闭口指令字样
- id: beat_weight
  name_cn: 规格配重与表演指示
  weight: 1.0
  fields:
  - id: beat_duration_weight
    name_cn: 时长配得上 beat 规格
    evaluator: llm
    judge_instruction_cn: '判断该镜时长与内部分秒分配是否给足剧本 beat 的规格：①剧本/拆镜注明写「给足 N 秒/悬空亮相给足分量/慢嗓给足念白」的重点段，shot 的 时长 与 动作: 0–Ns
      分段必须真的给到，不得把重点段压成一瞥；②台词量与秒数匹配——批文/宣判级长念白塞进小窗等于变相缩水（契约规定语速超标应加时长或拆镜，而非压缩内容）；③反向也判：剧本轻过场被注水拖成超长镜同样是规格失真。用 Duration/时长
      与 动作: 分秒窗对照剧本该 beat 的时长栏和强调语。反例：剧本给至宝亮相「给足几秒」，shot 只给 1-2s 扫过；正例：13s 内 0-7s 进言台词窗、7-13s 特效亮相窗，与剧本分工一致。'
    weight: 4.0
    anchors:
      g1: 剧本明写要给足秒数的重场 beat 被压到匆匆带过（重点段不足所需一半），或台词窗根本装不下剧本台词量、只能靠删词赶完。
      g3: 时长大体合理，但重点段秒数略紧（亮相/念白窗短 1-2s），或过场段有轻度注水。
      g5: 每个剧本强调的重点段都有与其规格相称的秒数窗，台词量·动作量·秒数三者自洽，与剧本时长栏/拆镜注对得上。
    sources:
    - P7
    - follow-up 101
    - PA1
  - id: staging_weight_match
    name_cn: 呈现规格不缩水不加冕
    evaluator: llm
    judge_instruction_cn: 对照剧本对该 beat 的强调程度，判断 shot 的 镜头/动作/情节/节奏 呈现规格是否相称：①重场戏（至宝亮相、判词宣判、爆点登场、石破天惊的开口）应有对应强调手段——特写/仰拍/推近/群体反应铺排/屏息节奏，不得平拍带过；剧本写「全场哗然/人人惋惜恐惧」的群反应不得缩成无人反应；②反向：剧本轻描淡写的过场不得擅自加冕成大场面（加特效、加史诗仰拍），挤占真正高潮的规格。只在本镜范围内判，以剧本该
      beat 的文字分量、情绪栏、「给足分量」类注为基准。反例：剧本「悬空亮相给足分量」，shot 远景平拍一扫；正例：低角度微仰特写＋屏息节奏承接「至宝仰角亮相」。
    weight: 3.0
    anchors:
      g1: 剧本重笔墨的高潮 beat 被呈现成普通过场（无任何强调手段、群反应消失），或普通过场被拔成压过高潮的大场面。
      g3: 强调方向对但力度打折（该特写的只给到中景、群反应只剩一句带过），或有轻微过度渲染。
      g5: 呈现规格与剧本强调一一相称：重场有特写/仰拍/反应铺排/节奏留白，过场收敛克制，剧本情绪栏语义在 镜头/节奏 字段中可见。
    sources:
    - P7
    - stage5 §3
  - id: emotion_direction_match
    name_cn: 情绪与表演指示忠实
    evaluator: llm
    judge_instruction_cn: 'dialogue.md/script.md 在台词后括注了表演指示（语气、情绪、微动作：「不甘心、提出建议」「霍地起身、脸色骤变」「极轻开口、半句咽回、垂眸」），核对这些指示是否忠实落进
      shot 的 动作:/节奏: 与 `## 台词配音 prompt` 的 情绪:/语速: 行：①情绪种类不得被替换（剧本「又惊又疑」不得变成「愤怒」）；②情绪演进方向保留（激动→僵住→血色渐褪的单向过程不得丢层或倒序）；③标志性微动作（咽回半句、抹嘴、拱手）不得丢失；④配音块情绪/语速与括注语气一致。反例：剧本注「极轻、半句咽回」，配音块却写「高声质问、语速快」。静默镜依
      script 情绪栏判 动作/节奏 字段是否同形。'
    weight: 3.0
    anchors:
      g1: 情绪种类被替换或演进被砍层（多层复合内心变成单一情绪），配音块情绪/语速与剧本括注相反。
      g3: 主情绪对，但丢了 1 处标志性微动作或情绪演进的一个层次，配音块语速与括注略有出入。
      g5: 剧本每条括注的情绪、演进层次、微动作在 动作/节奏/配音块 中逐条可寻，情绪弧与剧本同形。
    sources:
    - stage6 §5
    - ai_video.md 12.4 纯默剧边界
    - derived
