dimension_id: cinematography
name_cn: 运镜与站位
description_cn: 评单镜镜头语言与空间逻辑：景别/角度/运镜是否由情绪目的推导、9:16 竖屏原生构图、一镜内运镜一主一辅不打架；站位/朝向/视线是否写死（谁面向谁、对谁说=视线落点、内心独白眼神处理）、不对空气说话、防同角色重复渲染、单镜朝向体系与空间核验自洽、画外物与背景由机位反推、高台人物接地。跨镜轴线/景别节奏等整集层面问题不在本维度（归
  rollup）。
subcategories:
- id: camera_language
  name_cn: 镜头语言
  weight: 1.0
  fields:
  - id: emotion_driven_camera
    name_cn: 情绪驱动运镜
    evaluator: llm
    judge_instruction_cn: 读 `镜头:` 行与 Shot context 的情绪脉络，判定：①本镜是否有明确情绪/戏剧目的（镜头行括注或 context 可读出，如「不甘进言→郑重请镜→至宝仰角亮相」）；②景别/角度/运镜是否由该情绪推导：反应·顿悟→面部特写极缓微推；压抑渺小→低位远景缓慢后拉；对峙压制→高低角度差固定；嚣张睥睨→低角度微仰；至宝/权威亮相→仰拍衬威仪；留白→刻意凝滞且写明动机；③角度（俯/仰/平）贴合权力关系（高座者被仰拍、下位者被俯拍）。反例：无缘由的推拉摇移堆砌、「固定机位」无动机、情绪高点却用远景平拍错过表情。纯静止锁机位仅在「刻意凝滞/留白」且写明动机时合格。
    weight: 5.0
    anchors:
      g1: 镜头行只罗列运镜名词（推近、环绕、拉远）无任何情绪目的；或觉醒/惊变等情绪高点配远景平拍观众看不清表情；死板固定机位无动机说明。
      g3: 有情绪目的且大方向匹配（反应给了特写），但角度未贴权力关系（高座权威用平拍）或运镜速度/落点与情绪强度不完全匹配，个别段落运镜像装饰而非情绪手段。
      g5: 镜头行明写情绪目的并逐段兑现：如「双人中景起·同轴缓推收向掐诀手、终至悬空法镜低角度微仰特写（仰拍衬至宝威仪）」——景别行程、角度、速度全部服务「进言→郑重→亮相」的情绪弧。
    sources:
    - stage5_分镜 §3 情绪→运镜映射表
    - 运镜·单镜审查（运镜有动机）
    - yunjing §3a
  - id: shot_grammar_three_stage
    name_cn: 镜头行三段式语法
    evaluator: llm
    judge_instruction_cn: 检查 `镜头:` 行写法语法：①三段式连续语态——「起幅景别→运镜（含速度词）→落幅景别」（如「起幅双人中景…缓慢匀速推近…落幅低角度微仰特写」），禁景别罗列句（「全景。特写。」会触发视频模型隐式分镜切换）；②景别词取自五级阶梯——远景（环境全貌）/全景（全身+空间）/中景（膝上）/近景（胸上）/特写（脸手细节），不用自造含混词；③机位高度用定性锚（贴地/膝盖高度/半空/低角度），清除物理数值参数（快门、f值、变焦速度、「3米」类米数）；④人物近景/特写段注明「背景浅景深虚化柔焦、主体清晰」。注意：`渲染样式:`
      行中「35mm电影镜头/浅景深」等风格词不算违规，只查镜头行。
    weight: 3.0
    anchors:
      g1: 镜头行是景别名词罗列（「中景。特写。俯拍。」）或含「f/1.8、快门1/50、推近2米」类物理参数；景别词含混自造（「半身大概位置」）。
      g3: 三段式基本成立但缺速度词或落幅景别未写明；景别词在阶梯内但起落幅之一含混；近景/特写段漏注浅景深虚化。
      g5: 完整三段式连续语态：起幅景别+白名单速度词+落幅景别一气呵成，高度用定性锚，特写段注明「背景浅景深虚化柔焦、主体清晰」，全行无物理数值参数。
    sources:
    - yunjing 铁律1
    - jingbie 五级阶梯
    - 运镜·单镜审查（镜头语言精度）
  - id: single_master_move_no_conflict
    name_cn: 一主运镜不打架
    evaluator: llm
    judge_instruction_cn: 检查一镜内运镜是否「一主一辅、不打架」：①一镜只配 1 个主运镜（推/拉/摇/移/跟/升降选一），至多叠 1 个修饰层（手持呼吸感或荷兰角构图）；②禁指令冲突——「固定机位」与「推进」同镜、「推」完又「拉」来回打架、多段运镜无过渡并列堆砌（「推+拉+摇+移」塞满一镜的炫技）；③镜内连续变化须写成「同轴连续渐变（非切换）」类连续语态；④单镜应带防切镜声明（「一镜到底不切镜」「全程无镜头切换」或等义），镜头行内不得出现切镜触发词（「切至」「镜头二」「转场」——负面词行里挂「禁转场跳切」属防护、不算违规）。反例：「先推近再环绕再拉远」三连堆砌；「固定机位，缓缓推进」自相矛盾。
    weight: 4.0
    anchors:
      g1: 「推近+环绕+拉升」三种主运镜塞一镜，或「固定机位，缓缓推进」自相矛盾；镜头行出现「切至特写」「镜头二」等切镜触发词，模型必然切镜穿帮。
      g3: 主运镜唯一但修饰层叠了两个（手持+荷兰角+微推），或漏写「一镜到底」防切镜声明，段间过渡语态含混（未注「非切换」）。
      g5: 一镜一主运镜（同轴缓推）+至多一修饰层，段间用「同轴连续渐变收向…（非切换）」连续语态，带「一镜到底不切镜」声明，全行无切镜触发词。
    sources:
    - yunjing 铁律（单主运镜/防切镜三层）
    - stage5_分镜 §7 避坑
    - 运镜·单镜审查
  - id: no_blacklist_speed_words
    name_cn: 速度词黑名单
    evaluator: rule
    judge_instruction_cn: 机械校验：`镜头:` 行不得出现速度黑名单词「快速/急速/fast」。Seedance 与 Kling 官方指南一致判定这些词为头号降质词——会引发运动模糊、时间不一致与画面噪声。速度词只许用白名单：缓慢、匀速、平稳、流畅、轻微；需要表达高速感时用结果描述代替（拖影、拉丝、风压、背景放射状模糊+主体清晰锁定），而非直接命令模型「快速」。本项仅检查镜头行；`动作:`
      行中「快步上前」类人物动作速度词不在本项范围。
    weight: 2.0
    anchors:
      g1: 镜头行含「快速推近」「急速拉远」「fast pan」等黑名单词——命中即不合格。
      g3: 镜头行无黑名单词，但用了白名单外的同义变体（「飞快」「疾速」）——机械规则未命中但属临界写法。
      g5: 镜头行速度词全部取自白名单（缓慢/匀速/平稳/流畅/轻微），高速感用结果描述（背景放射拉丝模糊+主体清晰锁定）表达。
    sources:
    - yunjing 铁律4
    rule_id: forbidden_pattern
    rule_params:
      pattern: 镜头:[^\n]*(快速|急速|fast)
      scope: prompt_body
      description: 镜头行禁用速度黑名单词（快速/急速/fast）——双平台官方判定的头号降质词；速度词只许白名单（缓慢/匀速/平稳/流畅/轻微）。
  - id: vertical_916_composition
    name_cn: 9:16 竖屏构图
    evaluator: llm
    judge_instruction_cn: 判定构图是否为 9:16 竖屏原生设计而非横屏思路硬塞：①画面信息沿纵轴组织——人脸情绪与关键动作居画面主导位，善用上下分区（高台在上/人物在下）、前后景纵深错位、低/仰角度制造纵向张力；②多人一字横排、依赖画面左右两翼铺信息的横屏构图＝失配；③远景交代环境时人物在竖画幅中的占位有设计（如低位远景人物占画很小、环境压上方强化压迫）。参考锚点：对峙用上下分割双区构图、隔场对话用对角构图而非左右平分、暗藏杀机用前后景错位藏反派。注意：`比例:`
      行本身是否等于 9:16 属格式校验，不在本项；本项只评构图设计是否吃透竖画幅。
    weight: 3.0
    anchors:
      g1: 横屏思维：五人一字横排、关键信息挤在画面左右两缘，竖画幅上下三分之二空置无设计；或对峙双方左右平分毫无纵向层次。
      g3: 主体居中、人脸动作可见，构图成立但未利用纵轴（无高台压迫/上下分区/纵深错位），竖屏只是「能看」而非「为竖屏设计」。
      g5: 纵轴叙事：低角度微仰让悬空法镜占画面上部、人物居中下部；或上下双区拉对峙、前后景错位暗部藏反派——竖画幅每一段高度都有信息。
    sources:
    - 运镜·单镜审查（比例 9:16）
    - yunjing 竖屏适配
    - stage5_分镜 §3
- id: blocking_orientation
  name_cn: 站位与朝向
  weight: 1.0
  fields:
  - id: speaker_facing_locked
    name_cn: 说话人朝向写死
    evaluator: llm
    judge_instruction_cn: 逐句检查在画对白（视频模型无跨镜记忆、不会自动推断说话人该看谁，朝向必须在 prompt 里写死，否则人物正对镜头自言自语或背对对方说话）：①`走位:`/`动作:` 是否写死说话人此刻的身体朝向+面朝对象+视线落点（「某长老上前半步面向云鹤」「转身正脸朝向X」）；②「对谁说=视线落点」——对象在画内则眼神落其身/脸，对象在画外则标明朝画外某方向；③禁「偏头/只回头」式含混写法（模型常渲成转头背对对方）——要正脸就写「整身转过来、胸口与脸正对X、绝不背对」；④说话人不得背对对象或对空气说话；无台词露脸角色注明闭口不动嘴。任一句在画对白缺朝向锚定即属重大缺陷。
    weight: 5.0
    anchors:
      g1: 对白句完全没写朝向——两人同框但无「谁看着谁说」，模型必让人物正对镜头自说自话；或写了「偏头对身旁人说」这类必渲成背对的含混词；说话对象已离场仍对其位置讲话无处理。
      g3: 主要对白写了「面向X」但视线落点未落到脸/身（只写「朝东侧」）；或次要一句对白漏锚定；朝向写在走位但动作段未复述、三处不一致。
      g5: 每句对白三处一致写死：走位「某长老上前半步面向云鹤（同框相向·侧脸相向）」、动作段复述该朝向、Shot context 朝向核对行确认「某长老→云鹤＝同框相向」——无一句对空气、无背对。
    applies_when: '''对白'' in dialogue_types'
    gate: true
    gate_min_grade: 3.0
    sources:
    - C1
    - C2
    - stage5_分镜 §7 避坑
  - id: relative_position_locked
    name_cn: 相对位置钉死
    evaluator: llm
    judge_instruction_cn: 检查多人（≥2 在画角色）镜的空间关系写法：①`走位:` 写清每人相对位置（前景/侧位/谁在谁身后半步/谁居中）+互相朝向（俯睨/相向/侧身避视），而非只写各自绝对站位；②多
      beat/反打镜钉死「全程相对位置固定不变、换 beat 不挪位」并在 `动作:` 每个 beat 复述该关系——否则模型把每个 beat 当独立画面重新摆人、镜内位置乱跳；③贴身护人类动作写防脑补限定（「横臂虚拦、不搂不抱、不接触对方身体」，防止「挡在身前」被渲成拥抱）；④多人同框上传多张参考图时把「哪张参考图=画面哪个位置的人」绑定写死（画面左·X=参考图A·清瘦少年）。单人镜只需人物与机位的朝向关系明确即可给高分。
    weight: 4.0
    anchors:
      g1: 三人镜只写「甲在台上、乙丙在台下」无互相朝向；多 beat 镜未锁相对位——一个 beat 后第三人挤进两人中间、下 beat 又换位；「挡在身前护住」无防搂抱限定被渲成拥抱。
      g3: 相对位置写了但互相朝向不全（谁俯谁仰缺失）；「全程不变」只在走位开头写一次、动作段各 beat 未复述；多张参考图未与画面位置逐一绑定。
      g5: 走位从左到右列死每人定位+相对朝向+「全程相对位置固定不变·反打换beat不挪位」，动作段逐 beat 复述关系，参考图逐一绑定画面位置，贴身动作带「虚拦不搂抱」限定。
    sources:
    - C3
    - C9
    - C6
  - id: os_monologue_gaze_control
    name_cn: 独白/画外音眼神口型
    evaluator: llm
    judge_instruction_cn: 检查内心独白（OS）/旁白镜的口型与眼神处理：①内心独白=画外声，在画人物必须不对口型、嘴唇不动（prompt 应明写，负面词宜挂「无台词角色开口动嘴」）；②独白/失神时视线必须写死一个具体落点（「目光垂落身前地面、不乱飘、不看任何人」），禁只写「眼神迷茫/望向远方」这类虚写——模型会渲成眼神乱瞟；③独白时不与他人对视（虚焦、望向别处可）；④画外旁白/画外人声：在画人物不对口型，若剧情要求反应则按真实反应写朝向（闻声转头望向声源方向），画外音绝不安到在画人物脸上开口。反例：内心独白写成「他对着弟弟说出心里话」（变成开口对人说）；失神镜只写「眼神空洞」无落点。
    weight: 3.0
    anchors:
      g1: 内心独白被写成开口对人说、无「嘴唇不动」约束——渲出来口型全动穿帮；或失神镜视线只写「茫然四顾」，必然眼神乱飘。
      g3: 口型契约写了（不对口型）但视线落点虚写（「望向远处」无具体锚点）；或正文约束齐全但负面词未挂「无台词角色开口动嘴」防漂。
      g5: 明写「内心独白·嘴唇不动不对口型」，视线钉死具体落点「目光垂落身前青石板、不乱飘、不看任何人」，负面词挂「无台词角色开口动嘴」双保险。
    applies_when: '''内心独白'' in dialogue_types or ''旁白'' in dialogue_types'
    sources:
    - C4
    - C2
    - ai_video.md 12.4-F 口型契约
  - id: character_duplication_guard
    name_cn: 防同角色克隆
    evaluator: llm
    judge_instruction_cn: 检查防同角色重复渲染的写法（实测教训：被动角色多次具名+多位置短语会让模型渲出两个同人）：①同一角色在走位/动作/情节叙述中只具名定位一次（首次在 `走位:` 定位），其余用「他/兄长/该长老」等称谓——注意
      `角色:`/`角色识别:` 行各提一次同名属正常结构不算违规，看的是叙述内「重复具名+新位置短语」；②有总人数锁（「全画面有且仅有X与Y二人」「全画面共N人各一名」）并在负面词挂「同一角色出现两次/分身/镜像双人/背景凭空多出人物」；③路人/配角有「压声嘀咕/对身旁人说」beat
      时必须指定一个外形明显不同的具名听者（描述符/年龄/服色一眼可分），否则模型克隆说话人当听者渲出两个同脸路人；④单主体移动镜同样要防分身。
    weight: 4.0
    anchors:
      g1: 被动角色在走位、动作各 beat 反复具名并各带位置短语（「裴知秋站在左侧…裴知秋在门边…」），无总人数锁、负面词无防分身项——实测必渲双人；嘀咕 beat 无具名听者、必克隆。
      g3: 有总人数锁或负面词防分身之一，但叙述里仍多处「具名+位置」冗余；嘀咕听者有指定但外形区分度不足（两路人描述符雷同易同脸）。
      g5: 「全画面有且仅有云鹤与某长老二人、背景不出现任何其他道长」+负面词「同一角色出现两次/分身/镜像双人/背景凭空多出长老」双保险，叙述内角色首次定位后改用称谓，嘀咕听者为外形一眼可分的具名卡角色。
    gate: true
    gate_min_grade: 3.0
    sources:
    - C5
    - C11
    - M6
  - id: authority_and_group_blocking
    name_cn: 权威锚定与群体位次
    evaluator: llm
    judge_instruction_cn: 查三类「礼序空间」写法；若本镜无权威在场、无群体行礼、无高台位次区则本项不适用、给 5 分：①下位者锚定权威——跪/受责/下位者的身体与跪向锁死朝权威方（「身体始终跪向高台上的父亲、绝不背对」），回应侧旁人只写「转头/转视线」，严禁整身转开背对权威；②群体姿态统一——人群对临场权威行礼时全体姿态写死一种（全体躬身/全体跪/肃立）且全体（含说话配角）朝向权威不背对；列队让道场景写「分列中道两侧、各自转身朝中央行礼」，禁「头皆朝X方向」的单一方向写法（两侧列队下必有半数背对权威）；旁观评论者钉在人群后排/侧缘、不入中道不挡路；③位次区铁律——高台/看台权威（评委/长老/贵宾）隔空互动不下场：写「凭栏隔台扬声、不离旗台、不下场」，中央作业区只留应在的人（受测者+执事）。
    weight: 3.0
    anchors:
      g1: 跪着受责的主角为回应兄长整身转向、背对高座上的父亲；或让道人群「头皆朝步辇方向」（两侧列队半数必背对权威）；招揽的长老被写成走下旗台站到受测者身旁——评委下场调度穿帮。
      g3: 权威锚定写了主体（跪向不变）但回应旁人未限定「只转头、身体不转」；群体姿态统一但说话配角的朝向未单独钉死；高台权威守位但缺「不离台不下场」明写与对应负面词。
      g5: 跪者「身体始终朝北跪向高台、仅头颈转向东看兄长、绝不背对」；人群「全体欠身分列中道两侧朝中央行礼、旁观甲乙钉在人群最后排不上前不入中道」；长老「立于旗台高座凭栏隔台扬声招揽、不离台不下场」并配负面词。
    sources:
    - C7
    - C12
    - C13
  - id: reverse_focus_composition
    name_cn: 回身/隔场/反应镜构图
    evaluator: llm
    judge_instruction_cn: 查「朝向与构图能否同帧成立」的三种高危场景；本镜无此类场景则给 5 分：①回身对话——说话人的行动目标/身体动量（要登的高台、要按的巨碑、行进方向）与说话对象反向时，必须写「整身回转、背朝{强焦点}、胸口与脸正对{对象}」，严禁只写「面朝X」或「只回头」（模型必把人物锚回强焦点自说自话），机位宜架对象一侧拍正脸；②隔场/远距对象——对象在画面深处远景时，朝向必须锚定画面内可见对象并写画面坐标（「面朝画面左下的少年」而非只写罗盘方位），构图二选一：机位架对象一侧让「朝对象=朝镜」，或侧面对角构图双方侧脸相向；严禁「前景说话人正面朝镜+对象在其身后深处」；③观看/反应镜——机位架被观看对象一侧朝人群拍、被观看对象留画外不入画（负面词挂「X入画」），或改侧面构图；禁沿观看轴从人群背后拍（模型为露脸会把人群翻转成背对对象）。
    weight: 4.0
    anchors:
      g1: 临台回身讨赏只写「面朝爹娘」，身后是要登的神碑——必渲成面朝碑自说自话；反应镜为带光柱入画把机位架人群同侧，人群被翻转成集体背对光柱、方向全反。
      g3: 构图选对了（机位架对象一侧）但朝向只写罗盘方位（「朝东南」）无画面内可见锚点；或写法齐全但负面词未挂「面朝镜头说话/对象入画」防漂项。
      g5: 「整个身子转过来、背朝身后神碑、胸口正对画面下方爹娘」+机位架爹娘一侧拍正脸；隔场招揽用侧面对角构图双方侧脸相向；反应镜「光柱在镜头后方不入画」+负面词齐备。
    sources:
    - C14
    - C15
    - C16
- id: spatial_selfconsistency
  name_cn: 空间核验与机位自洽
  weight: 1.0
  fields:
  - id: spatial_verification_line_present
    name_cn: 空间核验行存在
    evaluator: rule
    judge_instruction_cn: 机械校验：`## Shot context` 必须含 `空间核验:` 行。该行是写 shot 前完成时序推演的落点凭证——推演内容应覆盖：机位在哪、每个在画人物起→末位置+朝向、每个剧情物件的在框态（全高入画/彻底画外）、说话窗几何（谁对谁说·距离带·时段）。缺行=空间推演未做或未落凭证，判不合格。行内容的推演质量由本子类其他
      llm 项评，本项只判存在性。
    weight: 2.0
    anchors:
      g1: Shot context 无「空间核验:」行——空间时序推演未落凭证。
      g3: 有该行但内容仅一句敷衍（只写「机位=旗台一侧」，无人物起末位、无画外物处置、无说话窗）——机械判存在但接近失职。
      g5: 空间核验行完整覆盖：机位、每个在画人物位置+朝向、画外物处置、说话窗时段（如「机位=旗台一侧·二人同框相向·场心/巨碑画外·说话窗0-7s近距同框」）。
    sources:
    - C19
    - ai_video.md 空间核验 amendment（K33）
    rule_id: shot_context_required
    rule_params:
      keys:
      - 空间核验
  - id: no_dual_reverse_subjects
    name_cn: 禁双反向主体
    evaluator: llm
    judge_instruction_cn: 检查单镜朝向体系是否自洽——单一机位不可能同时给两个朝向相反的主体正脸，模型会强行把其中一方翻脸朝镜造成穿帮：①识别危险信号：「说话人朝镜唱报/喊话」+「末段镜头带到/横移到X一僵/掩唇/起身」拼在同一镜；或「机位在台下/观众一侧」与「前景人群清晰可见反应」同镜共现（人群不可能既朝场心又朝镜）——反向主体可以是具名角色也可以是群像/集体；②合格写法：同镜多人必须同一朝向体系（全员朝镜/全员同框相向/侧面构图双方侧脸相对/前景背影锚，四选一并明写机位在哪侧）；③具名反应角色与喊话人朝向相反时应拆镜（反应独立成镜、机位架被观看对象一侧）；群像与说话人需同镜共存时改侧面构图（机位架侧翼、各居一侧侧脸相对）。凡有主体只能以背面入画却被要求表情表演＝重大缺陷。
    weight: 4.0
    anchors:
      g1: 执事「转身朝镜唱报」+末段镜头横移到「面朝场心的裴昭一僵」——两个反向主体同镜，模型必把裴昭翻脸朝镜、渲成背对测灵碑而惊；或机位在台下一侧却要求前景人群正脸反应。
      g3: 朝向体系基本统一但有一处边缘含混：前景人群写了「背影入画」却又要求「可见惊愕表情」的小冲突；或机位在哪一侧未明写、需读者自行推断。
      g5: 全镜一套朝向体系并明写：「二人同框相向（侧脸相向）、机位架旗台一侧、一镜到底」——每个需要表情的主体都能被该机位拍到脸；反应戏另拆独立镜处理。
    gate: true
    gate_min_grade: 3.0
    sources:
    - C18
  - id: offscreen_background_time_logic
    name_cn: 画外物/背景/时序自洽
    evaluator: llm
    judge_instruction_cn: 检查画外物、背景与说话窗的机位自洽：①画外奇观零具名——设定留在镜头外的巨碑/光柱/异象，不得在情节/场景/镜头行具名描写（哪怕带「留镜头外」括注也会被模型召唤入画、且常错置到人物身后方向全反），其信息靠上一镜与台词承载，负面词宜挂「X入画」；②通天巨物要么全高入画、要么彻底画外——只露局部会被渲成桶/柱状杂物；③背景内容由机位朝向反推——人物背对场心时背景应是其面朝方向的景（如阁楼牌坊），不得写场心方向的奇观；④说话窗时序——长台词期间说话对象须仍在框内/合理距离带（移动目标按步速约1.2-1.5米/秒推演），不得对已走远/已出框的人讲完整段话；⑤与相邻镜位置承接——上镜末位=本镜起位、已离场者不瞬移回位（对照
      grounding 中的相邻 shot 判定）。
    weight: 4.0
    anchors:
      g1: 人物背对场心、背景却写着场心巨碑光柱（方向全反）；或「光柱（留镜头外）」被具名描写后渲在人物身后；对象3秒前已走出画、说话人仍对其讲完8秒台词——对空气讲话。
      g3: 背景与机位大体自洽但一处剧情物件在框态含混（巨碑「远处隐约可见」未明确全高入画或彻底画外）；说话窗压线（对象恰在末字时出框）；上镜末位承接未明写但可推断。
      g5: 机位反推背景严密：「场心/巨碑画外；背景=旗台阁楼牌坊」；画外物零具名、负面词挂防入画；说话窗写死「0-7s 同框相向近距」，人物起位承接上镜末位，移动/离场时序全对齐。
    sources:
    - C19
    - ai_video.md 空间核验 S1/S3/S4/S5
  - id: elevated_figure_grounding
    name_cn: 高台人物接地
    evaluator: llm
    judge_instruction_cn: 检查高处人物的接地写法；本镜无高台/看台/高座人物则本项不适用、给 5 分。实测教训：只写「旗台高座/凭栏」抽象概念，模型会把高处的人直接渲成悬空漂浮站在空中。三层写法：①`场景:`
      写实体台体结构——「木构高台自地面立起、立柱斗拱扎实落地、台上铺板围雕栏」，不许只有抽象概念词；②`走位:` 给每个高台人物写脚踏点——「脚踏台板立于雕栏后（不悬空、不离台）」；③负面词挂「人物悬空漂浮/飞在空中脚不落地/高台悬空无支撑」。三层齐备为满分；抽象台体+无脚踏点为不合格；缺任一层按缺口多少降档。
    weight: 2.0
    anchors:
      g1: 只写「两长老立于旗台高座」——无台体实体落地结构、无脚踏点、负面词无悬空防漂项，实测渲成两人飘在半空。
      g3: 台体写了实体落地结构但人物无「脚踏台板」句；或正文两层齐了、负面词漏挂「悬空漂浮脚不落地」防漂项。
      g5: 「木构旗台自地面立起、立柱斗拱扎实落地」+「脚踏台板立于雕栏后、不悬空不离台」+负面词「人物悬空漂浮飞在空中脚不落地/高台悬空无支撑」三层齐备。
    sources:
    - C17
