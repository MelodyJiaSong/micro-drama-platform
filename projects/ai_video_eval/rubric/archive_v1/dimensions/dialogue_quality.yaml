dimension_id: dialogue_quality
name_cn: 台词质量
description_cn: 评 shot 台词块与配音块的台词措辞质量：是否为真人脱口而出的中文大白话（零文言/公文腔/对仗格言/翻译腔），有因果有信息量、说话人认知与层级归属正确、贴角色声口、情绪真实且贴事件时效、人称正确、长串拆短句、语速可念（字数÷时长≤5字/秒）、内心独白与对白类型使用得当。只评本
  shot 内可判定的台词问题；跨集重复与全剧序列问题不在本维度。
subcategories:
- id: vernacular_spoken
  name_cn: 白话口语·说人话
  weight: 1.0
  fields:
  - id: read_aloud_naturalness
    name_cn: 朗读测试·像活人说话
    evaluator: llm
    judge_instruction_cn: 对 shot 内每一个发声单元（对白、内心独白OS、旁白、系统提示音）逐句做朗读测试：想象一个真人在该处境下，会不会原样把这句话说出口。不合格信号：像标语口号、念稿/演讲稿感、规整书面长句、要换气才念完、拗口绕嘴、公文唱礼腔（反例：「众家新苗按序上前，不得喧哗」「此乃天赐良机」）。合格标准：短句、有停顿气口（…/——）、有称呼、有语气起伏，情绪靠语气词和停顿带出而非工整修辞。正例改写：「救他的是这具身子，弃他的也是这一家人」→「我替他挨了那一掌，换来的却是全家拿我当废物」。注意：内心独白是念头不是台词金句，必须更
      raw、更具体、不抽象；系统/旁白可以冷、简，但仍须是自然中文（禁「潜伏待显」式半文四字格）。宗师/长老等角色可带少量身份词（老夫/根骨），但每句先过「真人会这么说吗」。
    weight: 5.0
    anchors:
      g1: 多句台词是公文腔或念稿腔：出现「众家新苗按序上前，不得喧哗」式唱礼句、需要换气才念得完的规整书面长句，或 OS 写成抽象宣言，通篇像编剧写的漂亮话不像人说的
      g3: 大部分句子念得顺、像口语，但仍有一两句书面味明显——如一句工整长句没有气口、系统音夹一个「蓄势待发」式半文四字格，观众能听出「写出来的」痕迹
      g5: 每句默念都像活人脱口而出：短句为主、有…/——停顿、有称呼和语气起伏，OS 是具体贴当下的念头，长老声口只带一两个身份词不堆腔，通篇零念稿感
    applies_when: has_dialogue
    sources:
    - D1
    - B1
    - CLAUDE.md 台词白话 self-check
  - id: no_classical_markers
    name_cn: 零文言虚词（机械筛查）
    evaluator: rule
    judge_instruction_cn: 机械正则筛查：shot 的台词字段（含对白、OS、旁白、系统各行）不得命中任何明确文言/公文标志词——吾、汝、尔等、之乎、者也、此乃、岂能、岂敢、安能、焉能、速速、休得、不得喧哗、无需、除尔、尔速、何曾。这些词在现代真人口语中不存在，仙侠/古装题材也不例外（身份年代感只靠用词分寸、语气、称谓体现，不靠说文言）。命中任意一处即不合格。反例：「除尔族籍」「尔等速速退下」；正确写法：「除你族籍」「你们都退下」。
    weight: 3.0
    anchors:
      g1: 台词命中两处及以上文言标志词，如同一 shot 里既有「此乃」又有「尔等」，明显整段按古文腔写
      g3: 台词命中一处文言标志词（如一句里夹了个「无需」），其余全部是白话
      g5: 全部台词行零命中：没有任何文言虚词或公文唱礼词，指代全用你/我/他们、否定全用不用/别/不必
    applies_when: has_dialogue
    gate: true
    gate_min_grade: 3.0
    sources:
    - D1b
    - B2
    rule_id: forbidden_pattern
    rule_params:
      pattern: 吾|汝|尔等|之乎|者也|此乃|岂能|岂敢|安能|焉能|速速|休得|不得喧哗|无需|除尔|尔速|何曾
      scope: dialogue_field
      description: 台词字段不得出现明确的文言虚词/公文唱礼标志词（吾/汝/尔等/此乃/岂能/速速/休得/不得喧哗/无需/除尔 等）
  - id: no_couplet_slogan
    name_cn: 禁对仗金句·排比格言·口头禅
    evaluator: llm
    judge_instruction_cn: 检查台词里是否出现：①「X的是…，Y的也是…」对称句、「不劳…」「先…不急…」式文绉句、工整排比；②文艺比喻式金句（反例：「找个落脚的地方，也找条往上走的路」——排比+比喻，像编剧写的漂亮话，应降成具体白话「找个宗门落脚、安心练功」）；③给角色安的签名口头禅式
      slogan（如反复可用的「锋，藏着」这类定调短句），或单镜里硬塞一句对仗 slogan 当记忆点。合格标准：真人散句，有长有短不工整；决意/狠话也用大白话说（「这族籍，不劳谁动手，我自己除」→「这个姓，不用你们动手，我自己不要了」）。角色辨识靠声口和造型，不靠金句。
    weight: 4.0
    anchors:
      g1: 出现明显的对仗金句或 slogan：如决绝台词写成「我的路自己走，我的债自己还」式工整对偶，或硬塞一句「锋，藏着」当记忆点，念着像喊口号
      g3: 没有整句对仗，但仍有半句格言腔残留——如一句里带「不劳谁动手」式文绉结构，或比喻偏文艺（「往上走的路」），离真人散句差一口气
      g5: 全部台词是真人散句：长短不一、不工整、零排比零格言，狠话决意也是具体大白话（「他这条老路，我不走」），没有任何可摘出来当海报文案的句子
    applies_when: has_dialogue
    sources:
    - D1
    - D8
    - B3
  - id: no_translationese_bookish
    name_cn: 去翻译腔·书面词换口语
    evaluator: llm
    judge_instruction_cn: 逐句检查三类书面残留：①翻译腔——长定语套娃、「做一个…的人」「对…进行…」「当…的时候」、被字句堆叠，以及「能V的N」式定语（反例：「找个能练身子的地方落脚」→应拆成「找个地方落脚，把功夫练起来」）；②书面/公文词——将/其/此/或许/为何/无需/即可/前往/二人/皆/亦/方才/莫要/落得…下场（应换成：把/他/这/说不定/为啥/不用/就行/去/俩人/都/也/刚才/别/落个…样）；③单字文言动词带具体宾语的电报式缩略——「离裴家」「归府」「赴京」「出府」应补成双音节白话「离开裴家」「回府里」「去京城」「走出府门」；已成词的双字组合（回家/出门）不算。注意：setting
      专名与术语（丹田/宗门/验灵镜/武神躯/修为）保留，不算书面词。
    weight: 3.0
    anchors:
      g1: 翻译腔或电报缩略成片出现：一句里「当他意识到…的时候」套长定语，系统音写「宿主已离裴家」，多个书面词（无需/即可/前往）密集残留
      g3: 主体是口语，但残留一两处——如一个「能御寒的衣裳」式定语没拆，或一处「二人」没换成「俩人」，听感基本自然但细看有书面尾巴
      g5: 零翻译腔零缩略：主谓靠前、定语拆成独立小句，动词全是双音节白话（离开/回到/走出），书面词全部换成口语对应词，只有 setting 术语保留
    applies_when: has_dialogue
    sources:
    - B4
    - B5
    - B2b
  - id: register_fit
    name_cn: 白话贴境·不出戏
    evaluator: llm
    judge_instruction_cn: 白话≠俗词，检查两个反方向的出戏：①过俗/过现代的词汇在古风仙侠语境里出戏——反例：「练身子」「身子骨」（应换成「调养根基」「把功夫练起来」「这副底子」），以及网络梗（卧槽/绝了/yyds）绝对禁止；②生死/决绝的重场戏里用轻佻赌气小词（「我偏不」「哼」「切」）——显得像赌气小孩，重场要「冷而决」不「轻而赌气」，正例：「他这条老路，我不走」。另外核称呼是否贴真实身份关系：地痞叫路人「几位大爷/好汉」而不是「官爷」，平民对宗门长老的敬称要对。日常轻松戏里「行/算了/没准/这会儿」等口语小词是加分项不是问题。
    weight: 3.0
    anchors:
      g1: 重场决绝戏写了「我偏不」式赌气小词或出现现代网络梗，或仙侠语境里连用「练身子」式出戏俗词，一听就跳戏
      g3: 整体贴境，但有一处轻微不称——如一个「身子骨」在庄重场合略显俗白，或一个称呼（对长老的敬称）差半档，不致跳戏但可再贴
      g5: 每个词都又口语又在戏里：俗而不出戏（「这副病躯」「把劲压着」）、重场冷而决、称呼精确贴身份关系（混混叫「几位好汉」、弟子称「长老」），语气词用在轻松处不用在生死处
    applies_when: has_dialogue
    sources:
    - D1b
    - B6
    - B7
- id: content_information
  name_cn: 内容与信息量
  weight: 1.0
  fields:
  - id: causality_info_density
    name_cn: 因果交代与信息量
    evaluator: llm
    judge_instruction_cn: 每句台词过三问：①因果——只下结论不讲缘由的判词要补因果链（反例：「裴家不养废物」孤零零一句；正例带因果：「你丹田碎了，修不了武，裴家以武立命，容不下废人」）；②信息量——这句是否推进剧情、揭示人物动机/关系/利害、或埋下一个钩？纯寒暄、纯情绪铺垫、空泛感慨（「现在闹、现在求，都没用」）、以及纯复述观众刚看过画面的解说句＝水词，应删；每句要么给信息、要么给情绪、要么推剧情，三者占其一，最好一句话还能引出下一个冲突或转折；③长度配功能——交代关键因果/情绪的句子可以长（自然口语），废话必须砍，不许为凑情绪硬留，也不许一律砍到干瘪。
    weight: 4.0
    anchors:
      g1: 台词里有明显水词：孤立判词无因果（观众不知道为什么）、或整句是纯复述画面的解说（「灵石亮了七道光」——画面已演过）、空感慨凑情绪，删掉对剧情零影响
      g3: 没有整句水词，但因果链偏薄——如冲突判词给了一半缘由，或某句信息量低但还带点情绪功能，删掉略有损失但不痛
      g5: 每句都有活：判词带足因果链、句句推进剧情或揭示动机利害、关键句在收口处带出下一个钩（红果式「这句把剧情往前推了吗」全部答是），且长短与功能匹配
    applies_when: has_dialogue
    sources:
    - D2
    - D3
    - D6
    - 台词大师·红果台词法则
  - id: cognition_boundary
    name_cn: 认知与归属边界
    evaluator: llm
    judge_instruction_cn: 每句台词先核「说话人凭什么知道这个」，用 grounding 里的角色卡、world.md 切片和本集剧本判断谁知道什么：①角色不得说出他此刻不可能知道的结论——点破伏笔谜底、拿观众和角色都没见过的「上一次/之前」作比较（「这一次不一样」）、替编剧报答案（反例：刚开练的主角说「还差一样东西，那才是关键」；应降成可感知的不安：「总觉得还差点什么，又说不上来」）；②点破特定人物身份/关系/前史的话（「那个被赶出府的废物」），只能给认识他或刚在场亲历过的人说；陌生路人只能就眼前可见之事发言（资质档/异象/外形/场面），归属错了应换说话人或降为泛指（「这小子是谁？」）；③专业性结论（资质残缺的利害、功法品阶、伤势死活、阵法门道）不得由围观路人/杂役首次说出，只能由长老/宗师/执事等够格者首判；某知情者当众点破之后，旁人复述已公开论断才合法。
    weight: 4.0
    anchors:
      g1: 出现硬越界：陌生路人喊出主角的家世前史（「镇北王府逐出的大公子」），或路人一句点破「帝品残缺=根基必垮」这种专业判定，或角色笃定说出观众没见过的前情才成立的话
      g3: 归属基本正确，但有一句略越认知边界——如角色的猜测说得过于笃定（该是「总觉得不对劲」写成了「肯定有问题」），或路人复述的信息公开链交代得含糊
      g5: 每句知情前提全部成立：伏笔只留可感知的不安、身份点破全出自知情者之口、专业判定由德高者首判后路人只复述，整段台词的知识传播链自洽可追溯
    applies_when: has_dialogue
    sources:
    - D9
    - D9b
    - D9c
  - id: speaker_rank_fit
    name_cn: 反应声部分级
    evaluator: llm
    judge_instruction_cn: 本 shot 若涉及高规格事件（高档资质现世、至宝亮相、大人物到场、重大变故），检查反应台词的说话人层级配不配得上事件规格：官方读数/报档归执事，争抢/招揽/待遇评价归长老（事件规格越高、发声者身份越重、反应越失态），专业判定归德高望重者；围观路人只可惊叹场面、按常识认低档、复述已公开信息，不得首报或定夺。反例：围观路人评「几家顶宗抢着收、直接进核心」——王品级资质的待遇讨论轮不到路人（连玄品都是两位顶宗长老亲自争）。同时看反面：长老该发声的争抢/定夺场面里长老不能全程哑场只让路人说话。每句问：这个事件的规格，轮得到这个说话人来评吗？以
      grounding 的 world.md 声部体系切片为准。
    weight: 3.0
    anchors:
      g1: 规格倒挂：帝品/王品级事件的待遇评价或去向定夺出自围观路人之口，或至宝现世的定性由杂役说出，而在场长老一句台词没有
      g3: 声部大体归位（读数归执事、争抢归长老），但有一句路人反应略微越档——如路人的惊叹里带了半句待遇推测，不算定夺但压了长老的戏
      g5: 声部严格分级且随规格升调：执事报数、长老争抢失态、德高者定判，路人只有「老天爷…」式纯惊叹和常识性认知，事件越大发声者越重，层级感一听即明
    applies_when: has_dialogue
    sources:
    - D9d
- id: voice_emotion
  name_cn: 声口与情绪
  weight: 1.0
  fields:
  - id: character_voice_fit
    name_cn: 角色声口贴身份
    evaluator: llm
    judge_instruction_cn: 结合 grounding 的角色卡（身份/性格/人物灵魂/处境），判断台词是否「谁说都一样」：嚣张少主、威严家主、软弱母亲、恳切长老的措辞必须能区分——遮住说话人名字，凭措辞应能盲猜出是谁在说。声口差异靠用词分寸、语气、称谓、句长语速体现，且必须在白话范围内实现（不许靠说文言立身份，见零文言项）；带职业/身份感（执事有公事腔但仍是白话、痞子有痞气、老者有怯弱）。反例：所有角色都说同一种标准普通话式台词，少主的狠话和老仆的劝话句式雷同。同
      shot 多说话人时逐人核对声口是否互相区分且与角色卡一致。
    weight: 4.0
    anchors:
      g1: 声口雷同：遮住名字完全猜不出谁在说，嚣张少主与恭谨执事用同款句式，或角色说了明显违背其角色卡性格的话（软弱母亲突然满口狠词且无剧情理由）
      g3: 主要角色声口能区分，但配角略平——如两位长老的措辞几乎一致，或某句的用词分寸比角色卡设定轻了半档，不影响理解但少了辨识度
      g5: 每个说话人声口鲜明可盲猜：用词分寸/称谓/句长/语气各贴其人（长老「老夫」点到为止、痞子油滑、执事公事白话），与角色卡的身份性格处境完全咬合
    applies_when: has_dialogue
    sources:
    - D4
    - B7
  - id: emotion_authenticity
    name_cn: 情绪真实
    evaluator: llm
    judge_instruction_cn: 判断台词情绪是否贴合此刻处境与人物关系：不平（该激动处不冷漠）、不假（不喊与处境不符的高调）、不用力过猛（小事不嘶吼）；好的情绪有层次——恨里有由、护里有怯、决绝里带旧情。以
      grounding 的剧本上下文和人物灵魂判断「这个人此刻真实的心理状态是什么」，台词与之对得上才合格。同时核配音块的情绪/语速标注与台词文本一致：台词文本急切连问、配音块却标「平静/缓」＝失配；台词哀恸、标「愉悦」＝失配。反例：被当众夺走一切的角色说出四平八稳的客套话；正例：隐忍角色的恨意从压低的短句和称呼变化里露出来而不是直接喊出来。
    weight: 3.0
    anchors:
      g1: 情绪明显失真：巨变当前台词四平八稳像旁观者，或小冲突写成声嘶力竭的高调宣言，配音块情绪标注与台词文本互相打架
      g3: 情绪方向对但欠层次——恨就是纯恨、怕就是纯怕，少了「恨里有由、护里有怯」的复合感；配音块标注与文本基本一致
      g5: 情绪真实有层次：措辞、句长、停顿都在演此刻心理（隐忍的恨走短句和称呼降级、决绝里带一丝旧情），配音块情绪/语速标注与文本严丝合缝
    applies_when: has_dialogue
    sources:
    - D5
  - id: emotion_timing_tier
    name_cn: 情绪时效档
    evaluator: llm
    judge_instruction_cn: 台词语气必须贴「事件发生后几秒」的冲击档，用本 shot 与相邻 shot 的事件时间线判断：①突发巨变刚炸开（事件后约 0–10 秒窗口内）的第一反应＝惊/疑/急——短句、连问、语速快，德高望重者也会失从容（失态幅度按身份收着，但绝不能从容）；②信息坐实、众人缓过来之后，才轮到沉降情绪（惋惜/沉重/感慨，偏慢缓念）。角色的常态声口（沉稳/威严/慵懒）不是万能档，不得套用到冲击窗口内。反例：天雷刚灭金柱的下一拍，长老第一反应是偏慢郑重的「哎……诸位看——」（沉稳惋惜属于坐实后的档位，不属于爆点后几秒）。每句问：这句离事件爆点多远？语气档位对不对？配音块的情绪/语速是否同步换档（冲击窗内禁标「偏慢郑重」）？
    weight: 3.0
    anchors:
      g1: 冲击窗内写沉降档：巨变刚发生的第一反应台词是缓慢郑重的惋惜感慨，或配音块在爆点后几秒标「偏慢/沉稳」，像事件过去半天了
      g3: 首反应方向对（有惊疑）但档位不足——句子偏长偏整、少了连问和急促感，或配音块语速没跟着标快，冲击感打了折扣
      g5: 时效档精确：爆点后第一句是短促连问（「什么？！怎么会——」）、语速标急、身份重者失态而有分寸，后续 shot 信息坐实后才转入慢速惋惜，两档界限清晰
    applies_when: has_dialogue
    sources:
    - D12
- id: syntax_pacing
  name_cn: 句式与节奏
  weight: 1.0
  fields:
  - id: pronoun_address_correct
    name_cn: 人称与受话对象正确
    evaluator: llm
    judge_instruction_cn: 先判定每句台词的受话人是谁，再核人称：①当事人在场且这话是说给他听的→指代他必须用「你/你们」——反例：父亲当面对儿子宣判却说「今日起，除他族籍」（像在跟别人讲他），应为「除你族籍」；②当事人不在场、或话是说给第三方/众人听的（宣告、背后议论、对已转身离场的背影说话）→用「他/她」才对（对离场背影说「有他哭的」＝正确）；③自指用「我」，不得用第三人称自称（「这废物也不稀罕」听着像在说别人），刻意自嘲的明确语境除外；④本
      shot 内同一对受话关系的人称前后必须一致（上一句「你」下一句突然「他」＝错）。内心独白和旁白指代他人用第三人称属正常，不算违规。
    weight: 4.0
    anchors:
      g1: 当面对话用错第三人称：说话人面对受话人却通篇「他/她」指代对方（「除他族籍」式），或角色无自嘲语境地用「这废物」自称
      g3: 主要对话人称正确，但有一处摇摆——如同一段话里对同一人先「你」后「他」切了一次，语境勉强能圆（视线短暂转向众人）但没写清
      g5: 每句受话关系精确：当面全用「你/你们」、宣告与背影戏用「他/她」、自指用「我」，同一受话关系人称从头到尾一致，OS/旁白三人称使用规范
    applies_when: has_dialogue
    sources:
    - D7
    - D1
  - id: long_info_split
    name_cn: 长串信息拆短句
    evaluator: llm
    judge_instruction_cn: 检查规则/科普/枚举类台词是否一句塞满：一句话里塞进多条并列信息（一口气报完等级名录＋各档分档＋录取条件），靠逗号分号串成一长条，念着绕嘴、观众听一遍抓不住重点＝不合格。反例：「手按灵石，资质七品：废下中上玄王帝，废品回家、下中品外门、上品内门、玄品往上顶宗抢」。正确做法是拆成数个短句、一句一层意思，按「①做什么→②有哪些/枚举→③怎么分/条件」分段，每句独立成句、能单独念顺：「手按这块灵石，能测出你天赋几斤几两。资质分七等，从低到高——废、下、中、上、玄、王、帝。废品的趁早回家，下品中品进外门，上品才够内门；玄品以上金贵，顶宗抢着收。」信息确实多时应加时长或拆镜，不许压成一长句硬塞。非科普类的日常长句以能一口气念顺为准。
    weight: 3.0
    anchors:
      g1: 出现一句塞满的规则长串：等级表＋分档＋条件用逗号分号连成一条超长句，默念必须中途换气、信息层次糊成一团
      g3: 已做拆分但拆得不彻底——三层信息拆成了两句，其中一句仍并列两层意思（枚举和条件挤在一起），能听懂但重点略糊
      g5: 枚举/规则台词全部一句一层：做什么、有哪些、怎么分各自独立成句，每句单独念顺，观众一遍就能复述出分档逻辑
    applies_when: has_dialogue
    sources:
    - D10
  - id: monologue_dialogue_type_usage
    name_cn: 内心独白与对白类型使用得当
    evaluator: llm
    judge_instruction_cn: 核每行台词的类型标注（正常台词/对白 vs 内心独白/OS vs 旁白 vs 系统）与内容是否匹配：①说给在场他人听、期待对方回应的话，不得标成「内心独白」；反过来，纯私密念头、不可能说出口的算计盘算，不得标成「正常台词(对口型)」当面说出；②台词块与配音块的类型标注必须一致（台词行标〔对白〕、配音块标「内心独白(不对口型)」＝互相矛盾）；③内容形态要匹配类型——内心独白应是第一人称的具体念头（可指他人用第三人称），不是对空气演讲；④一场有对手的冲突戏不得通篇只有主角
      OS、在场配角零交流——关键冲突要有来有往的对白，主角该开口回话处要开口，不能全压成内心戏。嘴型指令、配音块字段齐全性等机械检查不在此项（归格式契约），此处只判「类型选得对不对、用得好不好」。
    weight: 3.0
    anchors:
      g1: 类型错用：一句明显在回应对方的话标成了内心独白（对手戏变自言自语），或角色把不可能出口的算计当面说了出来，或台词行与配音块类型互相矛盾
      g3: 类型标注全部正确，但使用偏科——对手戏里 OS 占比过高、配角只各甩一句，交流感偏薄；或某句 OS 写得偏「说给观众听」不够像念头
      g5: 类型精准且配比得当：当面冲突有来有往、私密算计走 OS 且是具体第一人称念头、宣告戏用对白面向众人，台词行与配音块类型逐条一致，OS 与对白互相衬托节奏
    applies_when: has_dialogue
    sources:
    - ai_video.md 12.4
    - D1
    - 台词大师·自然口语进阶
  - id: seam_no_action_recap
    name_cn: 承接镜禁复述已完成动作
    evaluator: llm
    judge_instruction_cn: 本 shot 是承接镜（首帧＝上一镜末帧，或运动承接上一镜）时适用：台词——尤其内心独白和旁白——不得以复述「已经在上一镜做完、已定格在本镜首帧上」的过渡动作开头，如：闭上眼、睁开眼、坐下、站起来、转过身、抬起头。否则画面的已完成态与台词打架：首帧人物已阖目，台词却以「闭上眼，把心神沉进丹田…」开头，成片像闭眼之后再蹦出来闭一次。正确写法是台词从交接帧的已到达状态往下说：「把心神慢慢沉进丹田…」。判定方法：对照
      grounding 里上一镜（相邻 shot）的末帧状态描述，逐一核对本镜台词开头是否复述了其中任何已完成动作。硬切镜（独立首帧）不受此限。
    weight: 2.0
    anchors:
      g1: 台词开头复述了首帧已定格的动作：上一镜末帧人物已阖目端坐，本镜 OS 第一句仍是「闭上眼，坐下来……」，画面与台词直接打架
      g3: 没有直接复述动作，但开头半句仍在描摹交接状态（「就这样坐着……」）而非往下推进，轻微原地踏步不算打架
      g5: 台词从已到达状态无缝往下说：上一镜收在阖目，本镜第一句直接「把心神慢慢沉进丹田……」，承接自然、动作零重演
    applies_when: has_dialogue and seam_mode != '硬切'
    sources:
    - D11
