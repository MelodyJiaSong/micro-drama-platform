dimension_id: groundedness
name_cn: 立足原文
description_cn: 评估 shotNN.md 分镜是否忠实立足于小说原文摘录与全剧 canon（world.md／角色卡／场景卡／prop 卡）：原文关键 beat 是否完整呈现、有无无中生有的事件与私设、角色行为是否符合其人物灵魂与当前实力线、场景与道具是否对卡、专名／境界／规格是否准确对位。只收单镜可判的立足性问题；台词措辞归台词维度、机械格式归格式维度、模型渲染视角归可渲染性维度。
subcategories:
- id: source_fidelity
  name_cn: 原文与剧本忠实
  weight: 1.0
  fields:
  - id: novel_beat_coverage
    name_cn: 原文关键beat呈现
    evaluator: llm
    judge_instruction_cn: 对照 shot 顶部『## 小说原文』段与提供的原文摘录，先列出该段的关键 beat：事件动作（如"提议复验""取出镜子"）、关键道具登场、情绪转折（如"不甘→郑重"）。逐一检查这些
      beat 是否在 Shot context 的 Summary、`情节:`、`动作:`、`台词:` 中有对应的可拍呈现。允许把一段原文拆到多个 shot——只要本镜声明覆盖的那部分 beat 完整落地即可（Summary
      常注明"拆分之一"并指向续镜）。反例：原文写"云鹤沉沉点头、取出铜镜"，shot 却只拍长老进言、镜子全程未出现。正例：进言、颔首、请镜、亮相逐拍落进动作时间轴。缺核心 beat 扣重；缺次要细节（衣着、环境点缀）轻扣。
    weight: 5.0
    anchors:
      g1: 原文核心事件在本镜丢失或被换掉：原文是"长老提议用验灵镜复验、云鹤取镜"，shot 拍成两人寒暄、镜子一拍未出，观众看完不知道"复验"这件事发生了
      g3: 主事件在（进言与镜子亮相都有），但原文的情绪转折或次级动作被吞掉——如"不甘心"的神态没进动作字段、"沉沉点头"没落拍，beat 链有可感的缺口
      g5: 原文每个可拍 beat 都能在 Summary／情节／动作／台词里找到落点：进言→颔首→掐诀→凝形→亮相逐拍呈现，情绪线"不甘→郑重→屏息"与原文一致，拆到相邻镜的部分有明确交代
    sources:
    - ai_video.md rule 5①
    - ai_video.md 12.4 字段2b
  - id: plot_field_derived_from_novel
    name_cn: 情节字段与原文同源
    evaluator: llm
    judge_instruction_cn: 检查 ```text 块内 `情节:` 字段与顶部『## 小说原文』段是否同源：`情节:` 应是该段原文的透传或忠实视觉化扩写——可补充动作细节、道具形制、光效白描（允许），但事件本身、因果顺序、行为主体必须与原文一致。反例：原文是"长老提议复验"，`情节:`
      写成"云鹤主动要求复验"（主体被换）；或 `情节:` 冒出原文与剧本都没有的新事件（有人闯场、天降异象）。正例：`情节:` 把"取出古朴铜镜"升格为"掐诀请出悬浮法镜"，且该升格在 Summary 里有 follow-up／canon
      依据标注。只判内容同源性；字数与措辞风格不评（归其他维度）。
    weight: 4.0
    anchors:
      g1: 情节字段与原文讲的是两件事：行为主体换人、因果颠倒或塞进全新事件，拿原文逐句对不上号
      g3: 主线同源，但扩写越了界——加了一个原文没有、也无 canon 依据标注的实质动作或反应（如让云鹤当场宣布结果），事件方向未变但内容掺水
      g5: 情节字段逐句可回溯到原文或有标注依据的 canon 升格，扩写只落在视觉细节层（形制／轨迹／神态），事件、主体、因果与原文严丝合缝
    sources:
    - ai_video.md 12.4 字段2b
  - id: no_fabricated_events
    name_cn: 无中生有事件检查
    evaluator: llm
    judge_instruction_cn: 全文扫描（Summary／情节／动作／台词／配音块）：本镜是否无中生有——添加了小说原文、本集 script.md/dialogue.md、相邻镜都找不到依据的实质性剧情内容？实质性指：新事件（打斗、闯入、宣判）、新登场具名角色、新关系宣告（认亲、拜师、决裂）、剧情结果剧透（提前泄露测验结果）。不算无中生有：动作细节、表情、运镜、光线等纯视觉化扩写，以及
      Summary 里标注了 follow-up／用户决定来源的改编。反例：原文只到"取出镜子"，shot 末尾却加"镜光照出金色异象、众人哗然"——把下一镜才发生的揭示提前演掉。正例：每个剧情元素都能指到原文句、剧本行或标注的依据。
    weight: 4.0
    anchors:
      g1: shot 里演了一段任何 grounding 材料都找不到出处的戏：凭空多出一个具名角色宣布结果、或把后续揭示提前演掉，剧情被篡改
      g3: 主线忠实，但夹带一处小型无出处内容——如给配角加了一句改变信息量的台词、或让原文未在场的角色入画反应，属越权补戏但未改变走向
      g5: 逐项核对无一处凭空内容：每个事件、每个角色、每句台词都能指到原文／剧本／标注来源，改编处均带 follow-up 号或用户决定注记
    gate: true
    gate_min_grade: 3.0
    sources:
    - P6
    - derived
  - id: dialogue_transposed_from_script
    name_cn: 台词与剧本透传一致
    evaluator: llm
    judge_instruction_cn: 把 shot `台词:` 行与配音块的台词正文，与本集 dialogue.md／script.md 对应位置逐句比对：shot 应是"透传"而非重写——说话人一致、句意与信息量一致、类型标注（对白／内心独白／旁白／系统）与剧本一致。允许：口语顺畅的微调（语气词、断句）、阿拉伯数字转口语中文。不允许：换说话人、增删整句、改变信息量或情绪立场、把剧本对白改成内心独白（或反之）而无标注依据。反例：dialogue.md
      里这句是长老说的，shot 写成云鹤说；或 shot 台词多出剧本没有的半句宣称。台词措辞好坏、白话程度不评（归台词维度），只评与剧本的同源一致性。
    weight: 3.0
    anchors:
      g1: 台词与剧本对不上：换了说话人、整句自创或漏掉剧本里的关键句，配音块与 dialogue.md 是两套词
      g3: 说话人与句意都对，但有一句被明显改写（信息量或情绪立场变了）或类型标注与剧本不符（对白被写成内心独白）
      g5: 逐句可在 dialogue.md/script.md 找到对应，说话人、类型、句意一致，仅有口语微调与数字转写层面的差异
    applies_when: has_dialogue
    sources:
    - ai_video.md 12.4 台词契约v2
- id: character_canon
  name_cn: 角色立足人设
  weight: 1.0
  fields:
  - id: character_soul_alignment
    name_cn: 角色行为符合人物灵魂
    evaluator: llm
    judge_instruction_cn: 读提供的角色卡『人物灵魂』段（动机根因／目标／恐惧／此刻决策逻辑／性格）与 relationships.md 人物网，检查本镜每个具名角色的行为、反应、决策是否像"这个人"会做的：与其动机和当前处境自洽、与其和在场者的关系相称。反例：人物灵魂写云鹤"持重求稳、敬畏至宝"，shot
      却让他不加思索随手抛镜；或某长老与主角家有旧怨，本镜却无缘由替主角说话。正例："不甘心的长老"急切拱手进言、云鹤"目光一凝、沉沉颔首"——神态与决策都对得上人设。若行为偏离但 Summary 标注了合理转变依据（成长／受激），不算违背。只评行为与人设匹配；台词措辞与声口归台词维度。
    weight: 4.0
    anchors:
      g1: 角色做出与其灵魂档案正相反的行为且无任何转变铺垫：睚眦必报的反派无缘由大度让贤、持重长者当众轻佻，人设当场崩掉
      g3: 行为大体在人设内，但有一处反应不对味——如与主角有旧怨的角色在本镜态度热络又无标注依据，观众会觉得"这人怎么突然变了"
      g5: 每个具名角色的动作、神态、决策都能从其人物灵魂与关系网推出来，急切者急切、持重者持重，连配角的反应分寸都对得上其身份与立场
    sources:
    - ai_video.md 12.11
    - P2
  - id: power_level_compliance
    name_cn: 实力线与外放规则合规
    evaluator: llm
    judge_instruction_cn: 对照 world.md 力量体系与外放规则（如藏锋期"无外放"铁律：主角禁金光／瞳光／剑气／威能光效，力量只靠内透暖意、物理副产、气场神态表达）与角色卡当前实力状态，检查本镜：①角色展现的能力是否越出其当前境界档位（低境界者施展高阶手段）；②藏锋期角色是否违规外放（人物自发光、金光气浪）；③法器／法术的档位表现是否符合
      canon（仙品至宝有仙家范式的分量、凡器不越档）；④实力有没有提前泄底（该藏的力量提前显露）。注意：光效措辞会不会被模型渲错归可渲染性维度，此处只判"设定上允不允许发生"。反例：藏锋期主角掌心凝出金色剑气。正例：光效只在法器、"人物不自发光"写死。
    weight: 4.0
    anchors:
      g1: 硬违 canon：藏锋期主角周身金光外放、或低境界角色施展 canon 里高层境界才有的手段，实力线被击穿
      g3: 无硬性违规，但有一处档位含糊——凡品道具被描绘出接近至宝的威仪、或配角展现略高于其境界的手段，未破铁律但档位感失准
      g5: 每处力量表现都能在 world.md 找到档位依据：藏锋者零外放、法器光效属器不属人、各角色手段严格落在自己境界档内，规格层次分明
    gate: true
    gate_min_grade: 3.0
    sources:
    - X2
    - X3
    - P6
  - id: named_character_grounded
    name_cn: 出场角色有据可依
    evaluator: llm
    judge_instruction_cn: 核对 Shot context `Characters:` 行与画面内所有具名角色：①此人此刻该不该在场——依原文、本集剧本与相邻镜，该角色在这个剧情时点确实身处此场景（上一镜已离场的人不能还在画）；②具名角色有
      canon 依据——主要角色应对应已建的角色卡，一次性路人／龙套须明确标注即兴属性（如"即兴生成不锁脸"），不冒充 canon 角色；③原文点名在场的关键角色不得无故缺席。反例：原文写云鹤取镜，Characters
      行却没有云鹤；或凭空引入一个有名有姓、任何卡里都查无此人的"李长老"当重要说话人。正例："某长老（旗台·即兴生成不锁脸）、云鹤真人"——一个标注即兴、一个有卡有 ref。
    weight: 3.0
    anchors:
      g1: 出场角色与剧情时点对不上：已离场／不在此地的角色赫然在画，或一个查无此卡的具名角色承担关键戏份且无即兴标注
      g3: 主要角色在场无误，但有边角瑕疵——如一个即兴龙套没标注即兴属性、或原文提及的次要在场者被悄悄省略而 Summary 未交代
      g5: Characters 行与原文／剧本／相邻镜的在场名单严格一致：有卡者用卡、即兴者标注即兴、离场者不入画，谁在谁不在都有出处
    sources:
    - K30
    - P6
  - id: voice_id_canon_match
    name_cn: 配音音色对齐角色卡
    evaluator: llm
    judge_instruction_cn: 对照角色卡『配音参考』段登记的 voice_id 与声线描述，检查 `## 台词配音 prompt` 块：①每个发声角色的音色使用其角色卡锁定的 voice_id（全剧同一角色只有一个
      voice_id，不同镜只改情绪／语速、不换音色）；②声线描述与卡内登记一致，不临时改音色设定；③即兴角色（grounding 中确无卡者）的音色描述应与其身份相称且不冒用他人 voice_id。反例：云鹤真人卡里锁
      TX-elder-01，本镜配音块却写别的 id、或把"沉稳苍老"换成"清亮青年音"。正例：Reference uploads 与配音块引用同一 voice_id，情绪／语速按本镜情境微调。配音块的存在性与字段齐全归格式维度，此处只评与
      canon 的一致性。
    weight: 2.0
    anchors:
      g1: 配音块音色与角色卡锁定的 voice_id 不符——同一角色在本镜被换了音色 id 或声线整体换人，跨镜声音必然跳变
      g3: voice_id 正确，但声线描述与卡内登记有出入（卡写"沉稳苍老"、块写"威严洪亮"），情绪微调与设定改写的界线被踩模糊
      g5: 每个发声单元的 voice_id、声线均与角色卡逐项对应，仅情绪／语速随本镜情境变化；即兴角色的音色设定与其身份自洽且不冒用他人 id
    applies_when: has_dialogue
    sources:
    - ai_video.md 12.4-H
- id: scene_prop_canon
  name_cn: 场景与道具对卡
  weight: 1.0
  fields:
  - id: scene_matches_card
    name_cn: 场景与场景卡一致
    evaluator: llm
    judge_instruction_cn: 对照提供的场景卡切片检查：①`场景:` 行与 Shot context `Scene:` 引用的 bg 代号在场景卡体系中真实存在，且与本镜机位／区域相配；②场景描述的空间要素（建筑形制、陈设、标志物）与场景卡一句话锁定一致——不添加卡里没有的显著元素（如给演武场加罗马柱环形看台）、不丢失卡内标志性元素；③风格与朝代定位一致——中式古风不混入西式或跨朝代元素。反例：场景卡锁"青石法坛＋飞檐宗门阁楼牌坊"，shot
      写成"环形石质看台"；或 bg 代号写了一个卡里不存在的 bg9。正例："bg2_旗台 — 镇演武场旗台长老席·飞檐宗门阁楼牌坊为背景"与卡逐项相符。
    weight: 4.0
    anchors:
      g1: 场景与卡对不上：bg 代号查无此板、或空间描述换了一套（演武场变斗兽场、私宅正厅变金殿），跨镜背景必然穿帮
      g3: bg 代号与主体空间正确，但描述掺了卡里没有的一处显著陈设、或漏写了卡内的标志性锚定物，背景细节有漂移风险
      g5: bg 代号、空间要素、朝代风格与场景卡逐项吻合，一句话锁定近乎原样引用，镜内提到的每个背景元素都能在卡里找到出处
    sources:
    - ai_video.md 12.10
    - ai_video.md 2026-06-21 铁律2
  - id: spatial_state_matches_plot
    name_cn: 空间状态对齐剧情
    evaluator: llm
    judge_instruction_cn: 依据本集 script.md 与相邻镜，检查本镜空间状态是否与剧情此刻一致：①人物位置——剧本此刻人在哪（台上／台下／碑旁／门口），shot 的走位与场景选择就该在哪；②此刻在场的关键剧情物（巨碑／法坛／测灵碑等）在或不在画内的处理与剧情一致，人物身后该有的剧情锚定物不无故失踪（可虚化或画外，但须显式交代，如"巨碑画外""碑在身后深处虚化"）；③场景不与剧情时点冲突（夜戏拍成白日、室内戏搬到室外）。反例：剧本写少年立于测灵碑旁受验，shot
      场景行漏掉碑、把他放到空地中央。正例：`空间核验:` 行明确"场心／巨碑画外"，与剧情空间对齐。只评与剧情的空间一致性；构图与朝向合理性归站位运镜维度。
    weight: 3.0
    anchors:
      g1: 空间与剧情脱节：人物出现在剧本此刻不可能在的位置，或该场戏的核心剧情物（受验的碑、被照的对象）在场景与走位里完全失踪且无交代
      g3: 主位置正确，但一处剧情锚定物的在／不在处理含糊——碑该在身后却既没写入画也没交代画外，空间状态留了模糊地带
      g5: 位置、剧情物、时刻三者与剧本严格对齐：谁在哪、锚定物在画内或画外都有显式交代，空间核验行与剧情逐项互证
    sources:
    - ai_video.md follow-up 120
    - P1
  - id: prop_canon_match
    name_cn: 道具形态与用法对卡
    evaluator: llm
    judge_instruction_cn: 对照 prop 卡与 world.md 法器规则，检查本镜出现的重要道具：①形态与卡一致（如验灵镜＝无柄圆镜、镜背符箓阵纹、镜缘古篆，不得渲成普通铜锈破镜或现代镜）；②用法范式符合档位——至宝／法器级须仙家范式：仙法召出（有凝形过程、不凭空闪现）、悬浮空中从不落于人手、法诀催动、化流光收回；不得掏兜取出、手持举用。随身凡器（玉佩／佩剑）按其登记承载方式（绳系颈间垂入衣内／鞘负于背）呈现、不越档升格；③道具登场状态与卡内当前状态一致（藏衣内的不无故外露）。反例：宗门至宝被写成"从怀里掏出一面铜镜、双手举起照碑"。正例："单手掐诀请出、悬浮半空从不落于人手"。本镜无重要道具时给满分。
    weight: 4.0
    anchors:
      g1: 至宝级道具被凡俗化：掏兜取出、手持举镜、凭空闪现无凝形过程，或形态与 prop 卡两样（仙品法镜写成铜锈破镜），道具档位感全失
      g3: 用法范式大体对（悬浮、召出都有），但一处细节偏卡——形态漏了卡内标志性特征（镜缘古篆没写）或收回方式没按范式交代
      g5: 形态逐项对卡，召出／持有／催动／收回四态全按仙家范式落笔且与 world.md 档位相称；凡器不越档、藏起的道具不无故露出
    sources:
    - X8
    - X9
    - ai_video.md rule 4b
- id: world_canon
  name_cn: 专名设定与规格
  weight: 1.0
  fields:
  - id: proper_noun_accuracy
    name_cn: 专名与品阶准确
    evaluator: llm
    judge_instruction_cn: 逐个核对 shot 全文（Summary、情节、台词、配音块）出现的专名：宗门名、境界／品阶名、功法名、法宝名、地名、人名，须与 world.md／角色卡／场景卡的写法完全一致：①不新造变体——"验灵镜"不得写成"验灵宝镜"或"灵验镜"；②不错档混用——王品级事件不得说成帝品级、境界称谓不跨体系混搭；③人名不错字、不串人。反例：world.md
      定名"天行宗"，shot 写"天衍宗"；角色卡是"云鹤真人"，配音块写"云鹤道人"。正例：所有专名与 canon 逐字相同、品阶引用与 world.md 阶梯对位、同一专名在 Summary／情节／台词各处写法统一。专名的多音字读音锁定标注归格式／配音维度，此处只评写法与档位正确性。
    weight: 3.0
    anchors:
      g1: 关键专名写错或错档：法宝名／宗门名与 canon 不同名，或把王品级事件说成帝品级，观众与后续镜对不上号
      g3: 核心专名无误，但有一处次要专名变体（境界称谓多了个字、地名简写不统一），不致误解但埋下跨镜不一致隐患
      g5: 全文每个专名与 world.md／各卡逐字一致、品阶档位引用准确，同一物在 Summary／情节／台词三处写法统一
    sources:
    - P6
    - derived
  - id: setting_no_invention
    name_cn: 不私设世界设定
    evaluator: llm
    judge_instruction_cn: 检查本镜是否临时发明了 canon（world.md／角色卡／场景卡／prop 卡）中不存在的设定：新境界或品阶、新势力、新法术机制、新道具能力、新规矩仪轨（如凭空出现"长老团三票裁定制"）。判定方法：把
      shot 里每条"世界如何运作"的陈述（谁有权做什么、法器能做什么、品阶意味着什么）在提供的 canon 切片中找依据；找不到且不属纯视觉细节的，即为私设。允许：不改变规则的视觉细节化（法镜凝形的流光轨迹）、Summary
      中标注了 follow-up 来源的新机制（说明已入 canon）。反例：canon 没有"验灵镜可测寿元"的说法，shot 台词却让长老宣称此用途。正例：验灵镜的用途、请镜仪轨均与 canon 或标注的 follow-up
      记录相符。
    weight: 3.0
    anchors:
      g1: shot 私设了一条改变世界规则的设定并让剧情依赖它：无出处的法器新能力、新品阶或新仪轨成为本镜关键，canon 被越权扩写
      g3: 无关键私设，但有一处边缘设定含糊越界——给法器补了 canon 未提的次要属性、或某仪轨细节与 canon 描述略有出入
      g5: 每条世界规则陈述都能指到 world.md／卡片／标注的 follow-up；新增内容全部停留在视觉细节层，canon 边界零越权
    sources:
    - P6
    - derived
  - id: reaction_hierarchy_compliance
    name_cn: 反应规格对位
    evaluator: llm
    judge_instruction_cn: 当本镜含"事件＋旁人反应"结构（测资、宣判、亮宝、比试等）时，对照 world.md 的反应规格体系（如声部阶梯：报档归执事、争抢／定夺归长老、专业判定归德高望重者、路人只惊叹复述不下判断），检查：①本镜谁开口、谁反应与事件规格相称——高规格事件不得由路人议论定性，低规格小事不得惊动高层全场；②反应强度与事件档位对位——至宝亮相配屏息仰视给足分量，寻常小事不配全场哗然。反例：王品级测灵结果由围观路人当场讨论评定、长老反而沉默。正例：提议复验由长老出面向云鹤进言、由云鹤（德高者）颔首定夺取镜。本镜无事件-反应结构时视为满足。反应台词的措辞归台词维度，此处只评"由谁、以什么规格反应"。
    weight: 2.0
    anchors:
      g1: 规格错位：本该长老定夺的至宝级事件让路人开口评定，或凡俗小事惊动掌门全场跪迎，事件档位与反应主体严重倒挂
      g3: 反应主体对（长老进言、云鹤定夺），但强度档略失准——至宝亮相配的反应平淡如常物，或次要事件的反应略显过格
      g5: 谁开口、谁定夺、旁人如何反应全部按 canon 阶梯对位，事件规格与反应强度同升同降，至宝亮相给足屏息与仰角分量
    sources:
    - world.md §1.5⑥
    - P7
    - D9c
