dimension_id: pacing
name_cn: 时长节奏
description_cn: 评该镜时长是否 make sense：台词/独白在该秒数里念得完（按角色声口分档算语速）、动作 beats 演得开不赶、无干站注水拖长、时长 4–15s 且按戏剧 beat 取值、台词窗与动作窗时间轴划分完整自洽、配音块时长目标与总时长自洽、镜内换气口与接缝端台词静默到位。只判单镜；整集节奏（90–120s、15s
  一反转等）归 rollup 层。
subcategories:
- id: speech_speed
  name_cn: 语速可念性
  weight: 1.0
  fields:
  - id: cps_hard_cap
    name_cn: 语速硬上限 5 字/秒
    evaluator: rule
    judge_instruction_cn: 对每个台词配音块，数其「台词」行的汉字字数（标点不计），除以该块「时长目标」的秒数，得字/秒。任何一块 > 5 字/秒即不合格——中文口语的物理极限约 5 字/秒，超了配音念不完、必吞字或音画错位。「时长目标」若带窗口括注（如「7秒（0–7s）」）取秒数数字部分。例：28
      字台词配 7 秒 = 4.0 通过；20 字配 3 秒 ≈ 6.7 不通过。多块各自独立判，任一超即整项不过。
    weight: 5.0
    anchors:
      g1: 有配音块字/秒 > 6（如 20 字塞进 3 秒），台词物理上念不完，成片必吞字或砍句。
      g3: 全部块 ≤ 5 但有块压在 4.8–5.0 边线（如 34 字配 7 秒），句末感叹或换气一吃就超。
      g5: 每块都 ≤ 4.5 字/秒且留有余量，慢嗓句更低，没有任何一块贴上限。
    applies_when: has_dialogue
    gate: true
    gate_min_grade: 3.0
    sources:
    - PA1
    rule_id: dialogue_speed_max
    rule_params:
      max_cps: 5
  - id: register_speed_fit
    name_cn: 分句分声口语速贴合
    evaluator: llm
    judge_instruction_cn: 不是全镜套一个「≤5」——每句台词按其角色/类型有各自的语速上限：普通快切对白 ≤5 字/秒、自然对白 ≈4、内心独白/情绪镜/慢镜 ≈3–3.5、慢嗓角色（老者、孩童、重伤虚弱、配音块音色标「偏慢/苍老/气虚/低声」）≈3–3.5。逐句用字数
      ÷ 该句时长窗算实际字/秒，对照该句应有的档位。反例：老者 17 字只给 3.4 秒（=5 字/秒），按慢嗓档应给约 5 秒；内心独白 21 字配 4 秒（5.25 字/秒）远超独白档。正例：情绪独白 14 字给
      4.5 秒（≈3.1）、自然对白 28 字给 7 秒（4.0）。任何一句按错档位配速即扣分，慢嗓/独白句被按 5 字/秒硬压是重扣项。
    weight: 5.0
    anchors:
      g1: 慢嗓或独白句按 5 字/秒天花板硬塞（老者 17 字 3.4 秒、独白 21 字 4 秒），成片像倍速播报、情绪全无。
      g3: 普通对白档位正确，但独白或慢嗓句按 4–4.5 字/秒配、略赶，情绪镜没真正慢下来。
      g5: 每句都按自身声口档位配速——对白 ≈4、独白/慢嗓 ≈3–3.5，情绪镜明显留了气口秒数。
    applies_when: has_dialogue
    sources:
    - PA1
    - PA2
  - id: speed_safety_margin
    name_cn: 不卡语速上限
    evaluator: llm
    judge_instruction_cn: 检查是否有台词句把语速卡在上限边缘（≥4.8 字/秒贴着 5 的天花板）。压线通过是作者化风险：句末感叹词、停顿、换气会吃掉实际发声时间，导致末字被吞（典型教训：一句 4.86
      字/秒的「小恩公」，「公」字被吞）。同时看配音块「语速」字段是否写了保护性指令（如「字字清楚、莫吞末字」）。正例：普通句目标 ≤4 字/秒、慢嗓 ≤3.5，明显低于天花板。反例：34 字配 7 秒（4.86）且句末带「呢！」类感叹语气词，无任何补救标注。
    weight: 3.0
    anchors:
      g1: 多句 ≥4.8 字/秒贴顶，且句末带感叹/语气词，配音必吞末字发哑。
      g3: 个别句 4.5–4.8 略贴顶但其余有余量；或有贴顶句但配音块写了「莫吞末字」类补救指令。
      g5: 全部句 ≤4.5 字/秒（慢嗓 ≤3.5），语速留足安全余量，无一句贴 5 的天花板。
    applies_when: has_dialogue
    sources:
    - PA2
- id: timeline_consistency
  name_cn: 时间轴自洽
  weight: 1.0
  fields:
  - id: voice_targets_sum_fit
    name_cn: 配音时长目标自洽
    evaluator: llm
    judge_instruction_cn: 把所有台词配音块的「时长目标」相加，与「时长:」总秒数比：之和必须 ≤ 总时长，且应给转场/停顿/无台词动作留余量（有纯动作或特效窗的镜，配音窗 + 无声窗合计应 = 总时长）。同时核对每块时长目标与动作时间轴上的台词窗一致——如配音块写
      7 秒、Duration 写「0–7s 进言窗」即一致。反例：总时长 10 秒，两块配音目标 6+5=11 秒，念不完且无停顿；或配音块写 5 秒但动作轴只给了 0–3s 说话窗。正例：13 秒镜，配音 7 秒对应
      0–7s 台词窗、7–13s 为无台词特效窗。
    weight: 4.0
    anchors:
      g1: 配音时长目标之和超过总时长（如 11s > 10s），或与台词窗直接矛盾（5 秒配音塞 3 秒窗），成片必砍词或音画错位。
      g3: 之和恰好等于总时长、零余量，转场停顿没处放；或某块目标与窗口有 1 秒内小出入。
      g5: 之和 ≤ 总时长且留 0.5 秒以上余量，每块目标与动作轴台词窗逐一对得上。
    applies_when: has_dialogue
    sources:
    - PA4
  - id: timeline_partition_coherent
    name_cn: 台词窗/动作窗时间轴划分
    evaluator: llm
    judge_instruction_cn: 检查该镜时间轴分窗是否完整自洽：①「动作:」各 beat 的时间窗（如 0-7s/7-10s/10-13s）应首尾相接覆盖全时长，不重叠、不留无内容真空段；②台词发生的秒段与动作里「开口/进言/说话」的
      beat 对位——说话人开口的窗 = 其台词窗；③ Shot context 的 Duration 括注分窗、「时长:」数字、动作轴三处一致。反例：时长 13 秒但动作轴只写到 10s、末 3 秒真空；台词窗 0–7s
      但动作写 5s 起说话人已转身离场。正例：0-7s 进言（台词窗）→ 7-13s 请镜特效（无台词窗），三处数字逐一吻合。
    weight: 4.0
    anchors:
      g1: 时间轴断档或互相矛盾——动作窗加起来不等于总时长、台词窗与动作 beat 对不上（人已闭嘴或离场还在出声）。
      g3: 分窗基本成立但有小缝：末 1–2 秒没写内容归属，或 Duration 括注与动作轴差 1 秒。
      g5: 全时长被 beat 窗无缝覆盖，台词窗与开口动作精确对位，时长/Duration/动作轴三处逐秒一致。
    sources:
    - PA3
    - PA4
    - derived
- id: action_capacity
  name_cn: 动作容量与拆镜
  weight: 1.0
  fields:
  - id: action_beats_playable
    name_cn: 动作演得开
    evaluator: llm
    judge_instruction_cn: 逐个看「动作:」里的关键物理动作（起身/转身/上前/拔刀/掐诀/召唤凝形/钩落/反转等），判断分到的秒数够不够「看得清」：一个完整关键动作被压进 1 秒内渲染出来会糊；连贯动作串（如
      袍袖一拂→流光腾起→盘旋凝形）需要 2–3 秒以上展开。同时看全部动作 beat 的秒数需求总和是否超出该镜时长——塞不下就是演不开。反例：3 秒内要完成「起身+转身+拔剑+挥出」四个动作；召唤法宝的凝形过程只给
      1 秒。正例：请镜三拍（起手/腾起/凝形）给足 3 秒、亮相特写再给 3 秒。
    weight: 5.0
    anchors:
      g1: 多个关键动作挤在 1–2 秒里（起身转身拔刀挥剑共 3 秒），渲染出来必是糊掉的快进。
      g3: 主动作秒数够但次要动作被挤压（转身只留半秒），或 beats 需求总和略超时长 1 秒。
      g5: 每个关键动作都有独立可读的秒窗（凝形 3 秒、亮相 3 秒），beats 总需求 ≤ 时长且有呼吸空间。
    sources:
    - PA3
  - id: capacity_split_threshold
    name_cn: 超载该拆镜
    evaluator: llm
    judge_instruction_cn: 估算该镜要承载的内容总需求：台词秒数（字数 ÷ 该句应有语速：对白 ≈4 字/秒、独白/慢嗓 ≈3–3.5）+ 动作秒数（每个关键动作给可读秒数）。若合计明显超过 15 秒容量，该镜属于超载——正确做法是拆成两镜（拆点选自然静止/换气处）或把台词/动作摊到相邻镜，而不是把语速压到上限、也绝不为塞时长删压硬
      exposition（世界观/规则类台词）。反例：60 字台词 + 召唤特效 + 三段走位硬塞 13 秒；本该 18 秒的内容靠 5 字/秒全程贴顶压进 15 秒。正例：内容需求与时长匹配，或长 beat 已按语义分摊到相邻镜、本镜只承载一个
      beat。
    weight: 3.0
    anchors:
      g1: 内容需求明显超 15 秒容量（台词按合理语速要 12 秒、动作还需 6 秒），靠飙语速或砍铺垫硬塞，成片又赶又乱。
      g3: 需求与容量勉强打平（差 1–2 秒靠贴上限语速消化），能出片但全程紧绷无余量。
      g5: 内容量与时长匹配从容，或可见长 beat 已被合理拆镜/摊到相邻镜，本镜承载量恰好。
    sources:
    - PA6
    - PA1
- id: beat_fit
  name_cn: 戏剧 beat 贴合
  weight: 1.0
  fields:
  - id: no_rush
    name_cn: 不赶（beat 给足）
    evaluator: llm
    judge_instruction_cn: 判断时长是否短于这个戏剧 beat 实际需要：高规格 beat（至宝亮相/觉醒破境/爆点反应/重大情绪转折/名场面）被压得太短，或反应链（听到→震惊→决断）被切掉中间环节直接跳结果。对照小说原文摘录与
      Shot context 的情绪线估：该 beat 的戏剧分量值几秒、实际给了几秒——快反应切镜 4–6 秒合理，铺陈/钩/亮相类 beat 该向 10–15 秒伸展。反例：全场哗然的爆点只给 4 秒还塞两句台词；主角觉醒瞬间
      2 秒带过；法宝亮相无特写停留。正例：至宝悬空亮相给足 6 秒特写；情绪三段（不甘→郑重→屏息）各有秒窗。
    weight: 4.0
    anchors:
      g1: 高规格 beat（至宝亮相/觉醒/爆点）被压进 1–2 秒或与多句台词挤在一起，戏剧分量完全没展开。
      g3: beat 基本演完但收得急——情绪转折停留不足 1 秒就切，亮相/反应特写偏短。
      g5: 每个 beat 按戏剧分量取秒（亮相给足 6 秒、反应有停留），情绪线在时长里从容走完。
    sources:
    - PA5
  - id: no_padding
    name_cn: 不拖（无干站注水）
    evaluator: llm
    judge_instruction_cn: 判断时长是否长于 beat 实际需要。注水信号：人物干站着的无信息量秒段、空镜/静止画面硬撑、「动作:」的 beat 内容铺不满时长（12 秒的镜动作只够 6 秒、剩余秒数无内容归属）、为凑渲染预算把短
      beat 拉长。注意：有持续可看内容支撑的长窗不算注水——如 6 秒法宝特写里有「古篆流转/缓缓自旋/微光收敛」的连续视觉内容。反例：两句共 4 秒的台词配 14 秒时长，剩 10 秒只写「二人对视」；空镜山景撑
      10 秒无叙事功能。正例：13 秒里每一秒都归属台词窗、动作窗或特效窗。
    weight: 4.0
    anchors:
      g1: 一半以上时长无内容支撑（4 秒的戏配 14 秒、剩余秒段干站/对视硬撑），成片明显拖沓注水。
      g3: 总体贴 beat 但尾部有 1–2 秒可有可无的停留，节奏略松。
      g5: 逐秒有内容——台词窗、动作窗、特效窗环环相扣，无一秒是为凑时长而存在。
    sources:
    - PA5
    - ai_video.md
- id: pause_and_seam
  name_cn: 气口与接缝静默
  weight: 1.0
  fields:
  - id: breath_gap
    name_cn: 镜内换气口
    evaluator: llm
    judge_instruction_cn: 同一镜内有两段以上台词、或对白后接内心独白、或情绪从 A 大转 B 时，检查两段之间是否留了 0.5–1 秒静默 beat：「动作:」里应有一段无台词的留白内容（垂眸/呼吸/目光落下/手部小动作），台词或配音块标出「前段结束→静默约
      1 秒→再起」。两段紧贴无停顿 = 像抢话、独白突兀（典型教训：主角答完「没事」立刻接内心独白，太快）。只有一段台词且无情绪大转折的镜，本项给 5。反例：0-4s 对白、4-8s 独白无缝相接。正例：对白 0-4s
      → 4-5s 垂眸静默 → 5-9s 独白起。
    weight: 3.0
    anchors:
      g1: 对白结束下一帧就起独白/下一句，情绪 A 直跳 B 无沉淀，配音两句无缝相接像抢话。
      g3: 段间有秒数间隔但未写死静默 beat（动作里没有对应的留白内容），气口是否真落地存疑。
      g5: 每处台词转换/情绪转折都插了 0.5–1 秒写明的静默动作 beat，配音块标了停顿后再起。
    applies_when: has_dialogue
    sources:
    - PA8
  - id: seam_end_silence
    name_cn: 接缝端 0.3 秒台词静默
    evaluator: llm
    judge_instruction_cn: 参与首尾帧承接的镜，接缝端 0.3 秒内不得有台词/独白/旁白发声——出片端接缝抹平会吃掉约 0.2 秒音频，把压在缝上的那句吞字发哑。检查两端：①本镜「衔接:」为「承接末帧」或「运动承接」→
      首 0.3 秒须无声，首拍只承接续动不开口；②相邻下一镜声明承接本镜末帧（或本镜标尾帧锁定）→ 本镜末 0.3 秒只留动作收势/定格，不出声。可用台词时长 = 时长 − 0.3s（单端承接）/ − 0.6s（两端），语速应按扣减后的时长重算仍达标。本镜为硬切且下一镜不承接本镜的，本项给
      5。反例：承接镜第 0 秒就开口；交接源镜台词顶到最后一帧才收。
    weight: 3.0
    anchors:
      g1: 接缝端 0.3 秒内正压着台词（承接镜第 0 秒开口，或源镜末帧还在收台词尾字），拼接后该句必吞字发哑。
      g3: 接缝端恰无台词但动作轴/配音块未标明静默缩进，可用台词时长也没按 −0.3s 重算，落地存疑。
      g5: 接缝端 0.3 秒写死为收势/定格/续动的无声段，台词起止明确缩进，语速按扣减后时长仍达标。
    applies_when: has_dialogue and (seam_mode != '硬切' or has_next_shot)
    sources:
    - PA9
    - ai_video.md
