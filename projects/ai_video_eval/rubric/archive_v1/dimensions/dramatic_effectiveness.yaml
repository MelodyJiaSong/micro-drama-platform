dimension_id: dramatic_effectiveness
name_cn: 戏剧效果
description_cn: 评单个分镜作为"戏"的成色：本镜的钩子/戏剧任务是否在画面里可见落地、爽点与情绪 beat 是否按"行动→反应"给足配重、人物表演密度与拟人化（macro动作+微表情+朝向视线+氛围四层，不干站不木偶）、在画配角与群像对眼前事件的合理可见反应、爆点人物
  beat 不一镜蒸发、打斗镜攻防有来有往有打击感且战力可视化（如适用）、首末帧反差成立。台词措辞质量归 dialogue_quality，机械格式契约归 format_compliance，模型可渲性/比喻词字面化归 renderability，跨集层面问题归全剧
  rollup，均不在本维度重复扣分。
subcategories:
- id: hook_and_beats
  name_cn: 钩子与情绪节拍
  weight: 1.0
  fields:
  - id: hook_landing
    name_cn: 钩子视觉落地
    evaluator: llm
    judge_instruction_cn: 每个分镜在剧作上有一个'该发生的事'（本镜钩子/戏剧任务，通常见 Shot context 的 Summary：反转、法宝亮相、宣判、悬念钩等）。判定该事件是否在 镜头/走位/动作/台词
      字段里'可见地发生'——有具体画面 beat 把它演出来，而不是只在 Summary 里宣称、或只靠台词口播。反例：Summary 写'至宝震撼亮相'，动作却只有'取出镜子看了看'，亮相没有任何编排；钩子只靠一句'此镜乃至宝'带过、画面上什么都没发生。正例：把'请镜'拆成
      袖袍起手→流光腾起→古篆一闪→凝形→亮环即敛 的可见过程并给足特写秒数。纯过渡镜（Summary 未标钩）则看它自身的小任务是否演到位。
    weight: 5.0
    anchors:
      g1: Summary 宣称的反转/亮相/宣判在 prompt 正文找不到对应画面 beat——法宝'震撼亮相'只写成'取出铜镜'，钩子全靠旁白口播，画面拍出来什么都没发生。
      g3: 钩子事件在动作里发生了，但编排潦草——亮相/反转只占一句、无起手无过程无特写收束，观众能看懂但没有'落锤感'。
      g5: 钩子被拆成带时间窗的可见编排（起手→过程→高光定格），关键拍给足秒数与特写，静音看画面也能读出'这一镜发生了什么大事'。
    sources:
    - A2
    - ai_video.md 12.4-D S1
  - id: beat_necessity
    name_cn: 非装饰情节 beat
    evaluator: llm
    judge_instruction_cn: 结合小说原文、script.md 与相邻 shot 判断：本镜是否是情节链上'不可跳过的一步'——删掉它剧情就断、信息就缺；还是纯装饰——人物站着摆姿势、只为凑时长的空镜表演、或把上一镜已演完的关键转折原样重演一遍。反例：13
      秒只有主角不同角度站立远眺、无任何新信息；上一镜已完成宣判、本镜再宣判一遍。正例：本镜引入新提议/新反应/新道具并直接引出下一镜。注意区分：承接上一镜'已发生状态'（如延续凝重气氛）不算重复；重演关键转折（气场反转再来一次）才算装饰性冗余。
    weight: 4.0
    anchors:
      g1: 整镜可删——无新信息无推进，或把上一镜已完成的转折原样重演，剪掉后前后镜直接可接、观众毫无损失。
      g3: 有推进但掺水——核心 beat 只需一半时长，其余是站桩、重复姿态或无信息量的填充表演。
      g5: 每一秒都在推进：新事件、新信息或情绪升级，与前后镜构成因→果链，删掉任何一段下一镜都接不上。
    sources:
    - A3
    - ai_video.md 12.4-D S2
  - id: payoff_sufficiency
    name_cn: 爽点/情绪高点给足
    evaluator: llm
    judge_instruction_cn: 若本镜承载爽点/打脸/反转/高光时刻（由 Summary、小说原文、script.md 判断），检查是否按'行动→反应'落地并给足配重：高光动作有具体画面拍、旁观者或对手有可见反应把爽点抬起来、关键拍给足秒数（特写/慢节奏/屏息/定格），而非一句带过或挤在镜尾被赶。若本镜是铺垫/压制型
      beat，则看压抑蓄势是否做足——憋得越狠后面越爽（受辱要拍出隐忍细节，不是轻描淡写）。反例：至宝亮相只给 1 秒顺手带过；打脸时刻在场无人反应；反转挤在最后半秒。正例：法镜亮相给足 6 秒仰角特写+屏息节奏。若本镜确实不承载任何爽点/情绪高点（纯功能过渡镜），给
      5 分。
    weight: 4.0
    anchors:
      g1: 爽点被一笔带过——高光动作一句话完事、无反应配重、无秒数倾斜，观众来不及爽画面就切走了。
      g3: 爽点有拍到、有基本反应，但配重平均主义——高光拍与普通拍秒数均分，缺特写/定格/节奏顿点，爽感打折。
      g5: 高光拍明显倾斜配重：动作有编排、给足秒数与特写、节奏线有'屏息→落锤'顿点、在场者反应烘托到位；铺垫镜则把压抑蓄得扎实。
    sources:
    - P3
  - id: first_last_frame_contrast
    name_cn: 首末帧反差成立
    evaluator: llm
    judge_instruction_cn: AI 视频单镜的运动量≈首帧与末帧的视觉差，首末几乎相同的镜渲出来像静止卡帧。对照 Shot context 的'首末帧反差'声明与 镜头/走位/动作 的实际设计，判定首末帧是否至少在一个强杠杆上有显著
      delta，杠杆按效力：景别推拉＞位置/姿态＞表情/面色＞光线。静态戏（打坐/对坐谈话）必须靠景别+姿态强造反差；承接镜首帧被锁定（=上镜末帧），delta 须由本镜末帧拉开。反例：声明'反差=表情由平静转凝重'但全镜固定机位中景人不动——微表情级
      delta 撑不起十几秒。正例：双人中景起幅→缓推至悬空法镜低角度特写，景别+画面主体双重反差。
    weight: 3.0
    anchors:
      g1: 首末帧基本同一画面——机位不动人不动，只靠'表情微变'或光线微调充数，全镜等于一张会呼吸的静帧。
      g3: 有反差但杠杆弱或与设计脱节——声明了推近却在镜头/动作里没写推近过程，或 delta 只有姿态小变、撑不满长镜。
      g5: 首末帧一眼可辨为两个画面：景别推拉或画面主体发生实质变化（如双人中景→法器仰角特写），且反差由镜内动作与运镜连续导出、非跳变。
    sources:
    - ai_video.md 衔接与接缝契约 §7
    - M9
- id: performance_density
  name_cn: 表演密度
  weight: 1.0
  fields:
  - id: action_concrete_timeline
    name_cn: 动作具体且配时间轴
    evaluator: llm
    judge_instruction_cn: '检查 动作: 字段三点：①每个 beat 是否为具体可拍的物理动作（谁、做什么、幅度/方向/对象），禁止''很生气/气势逼人/反应激烈''这类情绪概括词直接当动作；②是否带时间窗（如
      0-7s/7-10s）且 beats 铺满整个时长、无大段空白；③每个在画人物在每个时间窗里都有事做。反例：''主角愤怒地看着他''（无物理动作）；13 秒的镜只写了前 5 秒的动作；某在画配角整镜无任何动作指令。正例：''0-7s
      某长老上前一步拱手急切进言、云鹤听着眉头渐拢；7-10s 袍袖一拂单手掐诀、流光自袖间螺旋腾起''。动作彻底空泛的镜，模型只能自行乱演，属出片必炸级缺陷。'
    weight: 5.0
    anchors:
      g1: 动作字段以情绪概括词为主（'愤怒对峙''震惊不已'），无时间窗或大段时长无动作覆盖，模型只能即兴乱挥。
      g3: 动作具体、有时间窗，但有漏洞——某段时长没铺到、某个在画人物整镜没动作、个别 beat 仍是概括词。
      g5: 全时长被带时间窗的具体物理 beat 铺满，每个在画人物每段都有明确动作，写法可直接照拍（部位/幅度/方向/对象俱全）。
    gate: true
    gate_min_grade: 3.0
    sources:
    - A1
  - id: four_layer_density
    name_cn: 表演四层密度
    evaluator: llm
    judge_instruction_cn: '长镜（≥8 秒）的每个表演 beat 应有四层：macro 动作（上前/掐诀/转身）＋微表情（眉峰微沉/目光一凝/喉结滚动）＋身体朝向与视线目标（面向谁/看向哪）＋氛围随动（袍角被气流拂动/尘光浮动/光影随动作变化）；短镜（<8
      秒）至少 macro+微表情两层。检查 动作:/情节: 是否有这个密度，还是只有骨架级 macro 动作。反例：10 秒镜只写''长老进言、云鹤点头取镜''——无微表情、无视线、无氛围，渲出来人物面瘫走流程。正例：进言时''眉头渐拢、目光微沉''，请镜时''气流轻拂袍角''。密度以有效为准——堆砌重复形容词不算加层。'
    weight: 4.0
    anchors:
      g1: ≥8 秒的镜只有一两个 macro 动作骨架，零微表情零视线零氛围，人物渲出来面无表情走流程。
      g3: 有 macro+部分微表情，但长镜缺视线目标或氛围层，部分 beat 仍是光杆动作。
      g5: 每个 beat 四层齐备且互相呼应（动作-微表情-视线-环境随动），短镜也有 macro+微表情，画面信息密度像小说细描。
    sources:
    - A5
    - ai_video.md 12.4-E
  - id: humanized_emotion_layers
    name_cn: 表演拟人化·情绪有层次
    evaluator: llm
    judge_instruction_cn: 检查关键情绪拍是否有层次/转折，而非'一情绪配一动作'的机械对付：回望应'先一丝怅然→转瞬被决绝覆盖'，生疑应'先诧异→细辨→无果敛神'，嘲讽可'由轻佻→转狠戾'；同时动作要松弛像活人，不是走位规整节拍精准的机器人。反例：全镜每个情绪只配一个定格表情（点头=颔首、惊=瞪眼），无过渡无转折；或'神色不变/面无表情'贯穿全镜。正例：云鹤'目光一凝→眉峰微沉→沉沉颔首→眼中郑重更深一分'的递进。注意：层次要求落在关键情绪拍上，功能性小拍（递东西/走位）不必强行加戏。
    weight: 3.0
    anchors:
      g1: 人物像情绪开关——一个标签配一个定格表情，全镜无情绪流动，或明确写'面无表情/神色不变'贯穿，表演机械如提线木偶。
      g3: 主要情绪拍有变化但是跳变式（平静→暴怒无过渡），或只有主角有层次、其余角色全程单音。
      g5: 关键情绪拍写出递进/转折的完整弧（如 不甘→一凝→郑重渐深），过渡自然有人味，配角情绪也随事件流动。
    sources:
    - A7
  - id: action_readability
    name_cn: 动作可读性
    evaluator: llm
    judge_instruction_cn: 每个动作必须让不知前因的观众一眼读懂它在表达什么。检查是否存在孤立的功能性简写动作——'脚下一沉''借力一撑''一个用力''无端摆手/顿足'这类作者自己懂、画面渲出来却莫名其妙的碎动作。合格写法是因→果连贯的完整动作链：挨棍不写'脚下一沉'，写'身形被打得一个趔趄、踉跄退半步、急用前脚撑地、咬牙撑住没倒'——观众能读出这是受创强撑而非跺脚；发力要写清蹬地的对象和去向。反例：主角挨打后'跺脚'，观众分不清是踉跄、发力还是生气。判定标准：任何一拍单独截出来，观众能否说出'他在做什么、为什么'。
    weight: 3.0
    anchors:
      g1: 关键拍充斥孤立简写动作（脚下一沉/一个用力/无端摆手），渲染出来观众完全看不懂人物在干什么、像莫名抽动。
      g3: 主线动作可读，但夹杂一两处目的不明的碎动作，或因果链偶有跳步需要观众脑补。
      g5: 每个动作链条完整（起因→动作→物理结果），任何一拍单独截出来观众都能说出'他在做什么、为什么这么做'。
    sources:
    - A8
  - id: persona_projection
    name_cn: 表演气质贴人设
    evaluator: llm
    judge_instruction_cn: 对照 grounding 中的角色卡/人物灵魂：有鲜明性格身份的角色（骄纵公子/枭雄/清冷高手/威严宗师/跋扈恶少），本镜表演是否'演出了他是谁'——有招牌气质动作与起势第一拍（骄纵→下巴微抬睥睨扫场、折扇衣袖一甩再进事件动作；宗师→不疾不徐威仪自持；清冷→惜字懒态目光不多给），还是被中性化演成路人菜鸡（骄纵少年讨赏立威写成老实拱手作揖、宗师请宝写成慌忙掏兜）。反向同错：清冷人设写得情绪外露、慌张失态。反例：骄纵二公子对父母讨赏立威，被演成小心翼翼规规矩矩没半点气场。若本镜角色皆无强人设标签（路人/龙套/即兴角色），给
      5 分。
    weight: 3.0
    anchors:
      g1: 强人设角色表演与人设相反或彻底中性——骄纵者唯唯诺诺、宗师毛手毛脚、清冷者咋咋呼呼，看表演猜不出这是谁。
      g3: 人设大体不崩但没立起来——无招牌气质起势拍，动作是'任何角色都能这么演'的通用款。
      g5: 表演先立人再做事：起势一拍就带出身份气场（睥睨/威仪/惜字懒态），事件动作与人设丝丝入扣，换个角色就演不成这样。
    sources:
    - A10
- id: onscreen_reactions
  name_cn: 在场反应与群像
  weight: 1.0
  fields:
  - id: bystander_reaction
    name_cn: 在画配角反应合理
    evaluator: llm
    judge_instruction_cn: 逐一检查每个在画人物：对眼前正在发生的事件是否给出了符合处境的反应——被偷袭→惊呼/躲闪/踉跄/护人；目睹至宝亮相→屏息/瞪眼/后仰；当众受辱→变色/僵住。失败模式是配角像布景木头人：画面里站着却对冲击性事件零反应指令。同时姿态要贴权力关系与情绪：凉薄宣判可背对/负手/头也不回，冷酷下逐令不该端坐正脸絮叨，下位者不该对权威没有敬畏体态。反例：主角被当众打耳光、身旁同门无一人有任何反应。正例：请镜段无台词的长老虽'闭口不动嘴'但有注视与神情反应。若本镜只有单人且无外部事件，给
      5 分。
    weight: 4.0
    anchors:
      g1: 冲击性事件当前，在画配角集体无反应指令——被偷袭还呆站、至宝亮相无人抬眼，配角是纯背景板。
      g3: 主要配角有反应但潦草单一（统一'露出惊讶'），或姿态与权力关系不符（威压者姿态低微、宣判者絮叨）。
      g5: 每个在画人物按各自处境/身份给出量身反应，姿态贴权力关系，反应强度与事件规格匹配、无一人被遗漏。
    sources:
    - A4
    - P7
  - id: reaction_visible_in_frame
    name_cn: 反应画内可见·禁画外顶替
    evaluator: llm
    judge_instruction_cn: '若 镜头:/走位: 确认某群体在画内（前景人头入画/围观人群可见），检查 动作: 是否给了他们肉眼可见的表情+肢体 beat（瞪大双眼/张口倒抽气/下意识后仰半步/以手掩口），而不是只写''画外哗然/画外声浪/画外倒抽凉气''用音效顶替表演——观众看得见人却看不见任何反应，只剩来源不明的音效。背对镜头的在画群体：可见反应只准用背影肢体语言（肩膀一震/东西脱手/往后踉跄/抱头），绝不许为了露脸让群体回头转身（=背对事件源，空间穿帮）；脸部反应交给专门的反拍镜。音效可以叠加保留但不能替代画面表演。若本镜画内无群体，给
      5 分。'
    weight: 4.0
    anchors:
      g1: 画内明确有围观群体，反应却全写成'画外声浪/画外哗然'，或背对群体被写成集体回头看镜头——反应真空或空间穿帮。
      g3: 群体有可见反应但只有一个笼统词（'众人惊讶'），无具体表情肢体 beat；或背影群体的反应写法个别越界。
      g5: 画内群体反应全部落成可见的表情+肢体 beat，背对者用背影语言（肩一震/后仰/东西脱手），音效只作叠加，画面自身就能传达全场震动。
    sources:
    - A11
  - id: crowd_individuation
    name_cn: 群像差异化与拟真
    evaluator: llm
    judge_instruction_cn: 检查两点。①差异化：多个角色的反应须各自不同——不同视线目标/不同微表情/不同肢体姿态，而非'A 侧身惊呼/B 侧身惊呼/C 侧身惊呼'的同句换名字镜像复制。②群体行为拟真：'人群让路'类
      beat 必须写成被动、逐个、局部的反应——当事人自己侧身从人堆挤出、挨到的人被动侧避半步、个别人回头多看一眼；禁整齐划一的编舞式让道（人群齐刷刷分出笔直通道、被让者瞬间立在通道正中的红毯式出场）；只有有身份威慑者（帝王仪仗/宗师驾临）才允许人群主动让道，且须写'先认出→再让'的因果拍。若画内不足两个反应者且无群体行为，给
      5 分。
    weight: 2.0
    anchors:
      g1: 群像镜像复制（同句换名字），或人群齐刷刷同步动作如阅兵、无名之辈被红毯式让道——群体像一个提线整体。
      g3: 有部分差异化但仍现模板痕迹（两三人共用同一反应句式），让避写了'逐个'但过程含糊、仍偏整齐。
      g5: 每个群像个体承载不同信息（视线/表情/姿态各异），群体行为呈局部、渐次、有因果的自然涌动，像真实人群在事发现场。
    sources:
    - A6
    - A12
  - id: instinct_reaction_to_shock
    name_cn: 爆级突发本能反应
    evaluator: llm
    judge_instruction_cn: 若本镜有爆级突发事件（天雷/爆炸/巨响/异象骤变/近身攻击），检查落点近旁每个在场角色是否有 0.5-1 秒的生理本能反应拍（下意识侧身半步/抬臂挡脸/一缩/闭眼一瞬）。铁律：本能反应不归人设管——'沉稳/藏锋/淡定'人设决定的是反应之后的回收速度与姿态（高手=反应干脆、迅速回定、不狼狈不失态；慌张者=踉跄失声），而不是豁免反应本身。合格写法是两拍：'本能一避（快）→回定（人设拍）'。反例：天雷在主角头顶劈灭金柱，主角被写成'纹丝不动静静看着'——雷劈脸上都不躲，像木雕。若本镜无爆级突发事件，给
      5 分。
    weight: 3.0
    anchors:
      g1: 爆点落在角色近旁，角色被写成'纹丝不动/神色不变'零本能反应——木雕在渡劫，人设被当成免反应牌。
      g3: 有反应但逻辑写反——沉稳者直接跳到'淡定'没有本能拍、只有慌张者反应；或反应时机/幅度失真。
      g5: 每个近旁角色都有'本能一避→按人设回定'两拍：高手反应干脆迅速回定不狼狈，慌张者踉跄失态，层次分明真实可信。
    sources:
    - A13
  - id: burst_character_beat_closure
    name_cn: 爆点人物不蒸发
    evaluator: llm
    judge_instruction_cn: 结合相邻 shot 与 script.md 判断：若本镜（或紧邻前镜）出现爆点人物——刚做出惊人之举、刚获高规格判定（如测出王品资质）、刚成全场焦点——检查其 beat 是否在闭环推进：登场→各方反应→本人内心（OS/微表演）→去向交代。本镜在其在场期间必须维持其戏份，不许人一镜蒸发：上一镜全场哗然的焦点人物，本镜画面里还站着却零
      beat、无表情无内心无去向，像被剧情断电忘掉。反例：测出王品的天才'争抢+择家'挤一镜就完、人间蒸发再无交代。判定只看本镜职责：它该承接哪一环（反应/内心/去向），承没承接。若本镜无此类焦点人物，给 5 分。
    weight: 3.0
    anchors:
      g1: 上一镜的全场焦点人物本镜在画却零 beat——无反应无内心无去向，人像被剧情断电蒸发，观众心里悬空。
      g3: 焦点人物有 beat 但闭环缺环——有反应没内心、或没交代去向就切走，留下'那他/她呢？'的疙瘩。
      g5: 焦点人物 beat 环环相扣：本镜准确承接其闭环中该到的一环（各方反应/内心 OS/去向交代），观众视线全程跟得住。
    sources:
    - P7
- id: combat_effectiveness
  name_cn: 打斗效果
  weight: 1.0
  fields:
  - id: combat_moves_concrete
    name_cn: 招式具体配时间轴
    evaluator: llm
    judge_instruction_cn: 检查打斗是否写成具体招式+时间轴：每拍按'起-止秒 谁 出什么招→对方什么反应'展开（侧身闪/扣腕/错步/顶膝/沉肘/借力一摔/扫堂腿/点穴制动），招式风格贴角色武学设定。失败模式是空泛概括——'打了一架/几下放倒/一顿拳脚/身手不凡'，模型只能渲出两人乱挥乱打。正例：'0-2s
      地痞挥棍横扫、主角侧身半步让过；2-3s 主角扣其手腕顺势一带、地痞踉跄前扑'。判定标准：招式要可拍——有部位、有方向、有对象、有时间窗；整段能否直接当武指分解表照拍。
    weight: 4.0
    anchors:
      g1: 打斗写成'交手数招将其放倒'级概括，无具体招式无时间轴，渲染必成两人乱抡胳膊的糊戏。
      g3: 有具体招式但部分拍缺时间窗或缺对方反应，个别处仍是'一顿操作'式含混带过。
      g5: 每拍'起-止秒+谁+具体招+对方即时反应'齐全，招式贴角色武学风格，整段可直接当武指分解表照拍。
    applies_when: has_combat
    sources:
    - W1
  - id: attack_defense_rounds
    name_cn: 攻防有来有往
    evaluator: llm
    judge_instruction_cn: 检查打斗是否写成攻防回合：A 出招→B 格挡/闪避/卸力/中招→B 反击，至少 1-2 个完整来回，敌我双方都有动作。失败模式是单方面表演——一个人耍招、对方全程干站挨打，像打木桩。群战须写清主角逐个/连环处理各敌：谁先扑上、怎么接招、下一个怎么补位，而不是'众人一拥而上被尽数放倒'一句话。注意：强弱悬殊剧情（真高手一招制敌）允许回合极短，但对方也须有'出手→被瞬间破掉/反应不及'的动作拍，不是原地站桩等着被制服。
    weight: 5.0
    anchors:
      g1: 单方面耍招——对手无任何攻防动作、全程站桩挨打，或群战写成'一拥而上尽数放倒'的一句话糊弄。
      g3: 有攻防但回合残缺——对手只在挨打时有反应，无任何还手/闪避企图，来回感弱像半场表演。
      g5: 至少 1-2 个完整攻防回合（攻→应→反击），敌我每拍都有动作，群战逐个交代接敌顺序，打成'对话'而非独舞。
    applies_when: has_combat
    sources:
    - W2
  - id: hit_feedback
    name_cn: 受击反馈打击感
    evaluator: llm
    judge_instruction_cn: 检查每次命中是否给了物理反馈：闷哼/踉跄后退/捂住中招处/单膝跪地/摔翻扬尘/衣袂发丝一震/围观惊呼——打人不能像挠痒，命中无反馈整场打戏就没有'力'。打击瞬间可标注近景/顿帧/跟拍配合提示强化'疼'与'力'（镜头细节归运镜维度，此处只看有无提示意识）。同时反馈须含蓄合规：点到为止、不喷血断肢（最多嘴角一道血/闷哼），凶器不怼刃口特写。反例：主角一掌拍实、对方站着继续说话；连环命中而被打者身体状态毫无累积变化。正例：命中→'闷哼、踉跄退两步、捂肋弯腰、脚下扬起一片尘土'。
    weight: 4.0
    anchors:
      g1: 命中零反馈——被打者身体无任何变化继续行动，拳拳到肉打成拳拳挠痒，整场打戏毫无打击感。
      g3: 有基本反馈（踉跄/闷哼）但千篇一律，多次命中反馈不累积不递进，缺环境副产（扬尘/衣袂震）与镜头强化提示。
      g5: 每次命中反馈具体且递进（闷哼→踉跄→跪地），配环境副产与旁观反应烘托，关键一击有近景/顿帧提示，疼与力隔屏可感且含蓄合规。
    applies_when: has_combat
    sources:
    - W3
  - id: power_level_consistency
    name_cn: 战力可视化与分级
    evaluator: llm
    judge_instruction_cn: 对照 grounding 中角色卡/world.md 的修为设定，检查战力是否通过招式效率可视化且前后一致：谁强谁弱一眼可辨——弱者笨拙挨打；主角按当前修为发挥（刚觉醒=能制地痞但显吃力、会挨一记，绝不无双）；真高手一招制敌、对方反应不及；战力不许忽高忽低。若本剧设定为'藏锋无外放'（力量不可见外露），高手感须靠真身手传达：速度差（对手看不清、已欺身近前）、精准制敌（一扣一带正中关节）、借力卸力（四两拨千斤）、物理副产（风压鼓衣/脚下碾尘/劲力把人掀退——物理冲击而非能量波）、对手狼狈与旁人惊骇烘托，严禁金光/剑气/威能特效顶替力量感。反例：刚觉醒的主角打出宗师级无伤碾压。
    weight: 3.0
    anchors:
      g1: 战力乱套——看不出谁强谁弱、主角战力与修为设定脱节（新手无双碾压或高手被地痞逼平），或无外放剧靠金光特效硬撑场面。
      g3: 强弱可辨但传达手段单薄——只靠结果（对方倒了）不靠过程（怎么赢的），高手感缺速度差/精准/物理副产的具体呈现。
      g5: 招式效率精确映射战力设定：出手方式、对手反应、物理副产共同让观众读出'他什么水平'，藏锋高手不靠特效也压迫感十足，战力与设定分毫不差。
    applies_when: has_combat
    sources:
    - W4
    - W6
