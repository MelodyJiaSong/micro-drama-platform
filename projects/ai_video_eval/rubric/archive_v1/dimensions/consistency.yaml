dimension_id: consistency
name_cn: 一致性
description_cn: 评 shot 的跨镜/跨集一致性：具名角色锁定描述符与角色卡逐字节一致、voice_id 不漂移、场景/道具锁定串一致；衔接三态声明（硬切/承接末帧/运动承接）与相邻镜实际内容匹配、承接镜「延续不重演」、交接源末拍收势；站位朝向/服装道具/光线色调/在场人物跨镜连续；集首镜与前集结尾承接不重演、实力线不倒退不提前泄底、专名不早于登场时点。只收单镜可判项，整集/全剧层面归
  rollup。
subcategories:
- id: locked_assets
  name_cn: 锁定资产一致
  weight: 1.0
  fields:
  - id: voice_id_no_drift
    name_cn: voice_id 音色不漂移
    evaluator: llm
    judge_instruction_cn: 检查「## 台词配音 prompt」中每个说话人块的「音色」行：①具名角色必须带全剧锁定的 voice_id（形如 TX-elder-01），且与所给角色卡登记的 voice_id
      完全一致——同一角色全剧只用一个 voice_id，跨镜只允许改「情绪/语速」两行，绝不允许换音色 id 或改声线年龄感（音色一致性是视觉一致性的音频版）；②音色文字描述（如「中年宗门长老音、沉稳」）须与角色卡声口设定相符；③一次性即兴龙套可用临时音色但须标明「即兴」。同时核对
      Shot context 的 Reference uploads 里声音参考 voice_id 与配音块一致。反例：角色卡锁 TX-elder-01，本镜配音块写 TX-elder-02，或干脆无 id 只写「老者音」。
    weight: 4.0
    anchors:
      g1: 具名角色的配音块 voice_id 与角色卡不一致（换了 id）、或声线描述换了性别/年龄档（角色卡「苍老沙哑」本镜写「清朗青年音」）——成片该角色跨镜会换嗓子。
      g3: voice_id 本身正确，但音色描述行与角色卡措辞有出入或缺 voice_id 只在 Reference uploads 提及；情绪/语速之外多改了不该动的项，属可修的登记瑕疵。
      g5: 每个具名说话人块都带角色卡锁定的 voice_id，声线描述与卡一致，只有情绪/语速随本镜剧情变化；龙套音色标明即兴，Shot context 声音参考与配音块相互印证。
    applies_when: has_dialogue
    sources:
    - K7
    - ai_video.md 12.4-H
  - id: scene_prop_lock_consistency
    name_cn: 场景/道具锁定串一致
    evaluator: llm
    judge_instruction_cn: 对照所给场景卡与道具卡：①shot「场景:」行引用复用场景时，其一句话锁定串须与场景卡一致（byte-identical 引用，不得 shot 级自造改写场景描述的锁定部分）；②有锁定卡的道具/法宝/系统
      UI 本镜上画时，其外观描述须与卡上锁定串一致——形制、纹样、材质不得跨镜变样（上镜「无柄圆镜、镜背符箓阵纹」本镜不能变成「有柄铜镜」）；③锁定色名原样沿用不改写（「法镜莹白」不得写成「银白」）；④法器使用形态与卡上用法范式一致（卡定「悬空+法诀、从不落于人手」的至宝，本镜不得出现手持/托举）。反例：验灵镜卡锁「悬浮空中」，本镜写长老「双手捧镜」＝形态漂移。
    weight: 3.0
    anchors:
      g1: 场景锁定串被 shot 自造改写、或锁定道具外观/使用形态与卡明显冲突（悬空法宝被写成手持、符箓阵纹镜变普通铜镜）——同一物件跨镜会渲染成两个不同东西。
      g3: 场景与道具主体锁定一致，但有局部瑕疵：锁定色名被同义改写、某修饰语与卡略有出入、或场景锁定串少抄了尾部一小节。
      g5: 场景一句话锁定、道具外观串、锁定色名、法器用法形态全部与卡逐字对齐；ref 状态与本镜状态不同时按约定标注（「参考图为静置态·本镜为激发态」）而非改写锁定串。
    sources:
    - K20
    - K34
    - ai_video.md 12.3
    - L3
- id: seam_continuity
  name_cn: 衔接与接缝
  weight: 1.0
  fields:
  - id: seam_mode_matches_adjacent
    name_cn: 衔接三态与相邻镜实际匹配
    evaluator: llm
    judge_instruction_cn: 读 Shot context 的「衔接:」行（三态之一：硬切（独立首帧）／承接 shotNN 末帧／运动承接 shotNN（延续某动作）），对照 grounding 里上一镜的实际末拍内容判断声明是否成立：①「承接末帧」（模拟同一连续镜头）仅当三条件全满足——同场景同背景、机位连续或同轴渐变（推/拉/移/match
      cut）、动作情绪不间断——且上一镜末拍是静止收势帧（人在半步/半转/挥臂中途交接＝错配，接缝会动作相位重置跳帧）；②换场、时间跳、回忆进出、越轴、正反打、景别跳切都应是「硬切」，把这类强跳变声明成承接＝出片必跳帧；③「运动承接」只用于追逐/挥击/坠落等长动作拆段、且确需运动中过缝；④反向错配也扣分：同场景同机位轴上动作连续不断，却标了硬切，观众会读作跳帧。
    weight: 5.0
    anchors:
      g1: 声明「承接上镜末帧」但上一镜实际是另一场景、或末拍人在奔跑挥剑的运动中途——首帧接上了运动接不上，成片接缝处角色瞬移或动作重置。
      g3: 三态选择基本正确，但边界情况处理粗糙：同主体动作跨硬切没在首拍注「延续该动作」、或承接条件三条满足其二但仍标了承接、括注里的上镜末拍描述与上镜实际内容有出入。
      g5: 衔接声明与上一镜实际末拍严丝合缝：承接缝三条件全满足且交接帧为静止收势；该硬切的强跳变全部硬切并带人读括注说明剧情承接；运动承接仅用在真正的长动作拆段且喂了运动参考。
    sources:
    - M8
    - K26
    - ai_video.md 衔接与接缝契约v2 §1-§2
  - id: first_shot_hard_cut
    name_cn: 集首镜必硬切
    evaluator: rule
    judge_instruction_cn: 机械校验：本镜是全集第一镜时，Shot context 的「衔接:」行必须声明为「硬切（独立首帧）」。集首镜没有可承接的上一镜末帧，声明「承接末帧」或「运动承接」会让生成流程去找不存在的交接帧源，属出片必炸的硬契约。正例：「衔接：硬切（独立首帧·承上集结尾剧情态：……）」——括注里写剧情承接是允许且推荐的人读备注。反例：集首镜写「承接
      shot14 末帧（首帧＝上一镜末帧）」（跨集挂帧）＝不合格。
    weight: 2.0
    anchors:
      g1: 集首镜的衔接行声明为承接末帧或运动承接、挂了上集镜号的帧源——生成时无帧可接，或强行跨集接帧导致首镜起始画面错乱。
      g3: 衔接行含硬切但形式不完整（缺「独立首帧」标准形、或残留帧 handle 字段与硬切互斥共存）。
      g5: 衔接行为标准硬切形「硬切（独立首帧·…）」，无任何帧字段残留，括注用人读备注交代与上集结尾的剧情承接关系。
    applies_when: is_first_shot
    gate: true
    gate_min_grade: 3.0
    sources:
    - K26
    - ai_video.md 衔接与接缝契约v2 §1
    rule_id: required_pattern
    rule_params:
      pattern: 衔接\**[：:].{0,24}硬切
      scope: full_file
      description: 每集首镜的「衔接:」行必须声明为硬切（独立首帧）
  - id: continuation_no_replay
    name_cn: 承接镜首拍延续不重演
    evaluator: llm
    judge_instruction_cn: 本镜是承接镜（承接末帧或运动承接），检查其开头是否做到「延续，不重演、不冷启动」：①「动作:」首拍只延续上一镜末帧已到达的状态（如「首帧已是掐诀态·不重演掐诀」），禁止重演已完成的过渡动作（闭眼/坐下/转身/推门/拔剑再来一遍）、禁止再顿一下再起势；②先给约
      1 秒承接续动、再进新情节，不得首拍直接冷启动一个全新 beat；③「镜头:」起幅景别与机位须等于上一镜末帧的景别机位标签，明禁起始重新缩放/重新定位（否则第 1 帧画面尺寸突跳）；④台词（尤其内心独白/旁白）不复述刚完成的过渡动作；⑤运动承接镜首拍须写「起手即延续{动作}·已在进行中·非从静止起动」并与上镜末拍有约
      1 秒动作重叠。
    weight: 4.0
    anchors:
      g1: 上一镜末帧人已坐定/门已推开，本镜动作首拍又从「缓缓坐下」「伸手推门」写起——同一动作演两遍，成片接缝处观众看到动作回放；或起幅景别与上镜末帧不同致第 1 帧突然缩放。
      g3: 首拍状态延续正确，但缺「首帧已是 X 态」类括注、承接续动不足 1 秒直接进新 beat、或旁白顺嘴复述了一句刚完成的过渡动作——方向对但写法不到位。
      g5: 首拍明确标注延续已到达状态并禁重演，约 1 秒续动后自然进新情节，起幅景别机位与上镜末帧逐项对齐并明禁重新缩放，台词避开过渡动作复述；运动承接镜带「已在进行中」写法与 1 秒动作重叠设计。
    applies_when: seam_mode != '硬切'
    sources:
    - M8
    - ai_video.md 衔接与接缝契约v2 §3-§4
  - id: handoff_source_lockdown
    name_cn: 交接源末拍收势与尾帧锁定
    evaluator: llm
    judge_instruction_cn: 查 grounding 里下一镜的「衔接:」声明：若下一镜承接本镜末帧或运动承接本镜，本镜作为交接源须满足：①静止缝——「动作:」末拍写收势定格约 1 秒（锁站位/朝向/姿态与机位景别构图），且保留环境级微动（风掀衣摆、呼吸轻起伏），禁死冻成静态截图，更禁把交接点留在
      mid-stride/mid-turn 半步半转的运动中途；②Shot context 带「尾帧锁定:」行（重生本镜时锁末帧、免下游连环重生）；③运动承接——本镜末拍与下一镜首拍设计约 1 秒同一动作的重叠段（供出片端找精确剪点）。若下一镜声明为硬切，本条无交接义务、直接满分。反例：下一镜承接本镜，本镜末拍却是「转身大步离去」的运动中途。
    weight: 3.0
    anchors:
      g1: 下一镜声明承接本镜末帧，但本镜末拍人在转身/迈步/挥袖的运动中途，无收势定格——交接帧非静止收势，下一镜从静止起步必产生速度断层跳帧。
      g3: 末拍有收势定格但缺细节：没锁机位景别构图、写成完全死冻没有环境微动、或缺「尾帧锁定:」行——缝能接但重生会连环。
      g5: 末拍收势定格约 1 秒且站位/朝向/姿态/构图四锁齐全、保留环境级微动，Shot context 带尾帧锁定行；下一镜是运动承接时本镜末拍带 1 秒动作重叠设计；下一镜硬切时本镜无多余帧字段。
    applies_when: has_next_shot
    sources:
    - M8
    - K26
    - ai_video.md 衔接与接缝契约v2 §2/§5
- id: visual_continuity
  name_cn: 画面跨镜连续
  weight: 1.0
  fields:
  - id: blocking_orientation_continuity
    name_cn: 站位朝向跨镜连贯
    evaluator: llm
    judge_instruction_cn: 与 grounding 里同场景的上一镜对照人物空间状态：①同一角色的世界朝向与站位不得无故跳变——上镜面北而立、本镜整身朝东，或上镜在旗台东侧、本镜跳到西侧，都算断裂；②出画/入画方向承接：上镜从画左出，本镜应从画右入（出画侧＝下镜入画对侧）；③对话/对峙轴线一致：不得越轴导致人物左右互换（上镜
      A 左 B 右，本镜无机位交代不得变 A 右 B 左）、被仰拍的一方本镜仍应被仰拍；④确需变位必须有动作交代（走过去/转身的 beat 写在走位或动作里），不能瞬移。本镜为硬切换场（与上镜不同场景）时不做跨镜站位对照，按本镜内部自洽判。
    weight: 4.0
    anchors:
      g1: 同场景同段对峙里，角色上镜在台下仰视、本镜无任何交代出现在台上，或双方左右位置互换/朝向反转——观众瞬间失去空间方位感，读作穿帮。
      g3: 主要角色站位朝向承接正确，但次要角色换镜换了边、或走位有变化但动作交代写得含糊（只说「上前」没说从哪一侧）；轴线未破但高低角关系没延续。
      g5: 每个在画角色的站位、世界朝向、画面左右侧与上镜严格承接，出入画方向成对，轴线与仰俯关系稳定；所有位置变化都有明确的走位动作交代，空间核验行与上镜末位对得上。
    applies_when: has_prev_shot
    sources:
    - C8
    - M1
    - M5
  - id: costume_prop_continuity
    name_cn: 造型道具跨镜连续
    evaluator: llm
    judge_instruction_cn: 与相邻镜对照造型与持物状态：①同一角色的服装/发型/妆容/佩饰跨镜零变化——尤其变景别时（上镜远景本镜特写），服饰描述必须还是同一套、纹理不得突变，这是 AI 短剧第一穿帮点；确需变化（换装/血污/淋雨/伤妆）须有剧情交代；②道具持有与在画状态承接：上镜已收起/藏入衣内的物件本镜不得凭空在手，上镜悬浮空中的法器本镜不得落入人手，上镜掏出的信物本镜不得消失又无交代；③伤势/污渍/狼狈度等外观状态延续不重置（上镜血染衣襟本镜不能干干净净）。
    weight: 4.0
    anchors:
      g1: 同一角色相邻镜服装变了（上镜青袍本镜灰袍）、或上镜明写藏入衣内的玉佩本镜挂在胸前、悬空法镜被写进人手里——跨镜物件状态跳变，成片直接穿帮。
      g3: 主体造型与关键道具承接正确，但小件有出入：佩饰描述漏抄一件、伤妆浓淡描述与上镜不完全一致、或道具状态承接了但没在情节里点一句来路。
      g5: 所有在画角色造型逐项与上镜一致（含变景别镜），道具的持有/悬空/收纳状态与上镜末拍无缝承接，一切外观变化都有剧情动作交代且方向合理。
    applies_when: has_prev_shot
    sources:
    - K18
    - K20
    - ai_video.md 14.4
  - id: lighting_tone_scene_consistency
    name_cn: 光线色调同场景一致
    evaluator: llm
    judge_instruction_cn: 与同场景相邻镜对照「光线 / 色调」字段：①色温/光向/主光源/时辰一致——同一场戏不得上镜暖白日光、本镜冷蓝暮色，主光源方向不得跳变（上镜天光从左侧来、本镜无故改右侧）；②场景与人物的锁定色名一致沿用（「青石灰/日光暖白」等不得改写成近义色）；③剧情有动机的光变（法器亮起、入夜、特效激发）须在动作/情节时间轴里有渐变过程交代，不得跨镜突变无来由；④回忆段滤镜（做旧泛黄/低饱和）须与同段回忆的相邻镜一致，当下线不得误用回忆滤镜。本镜为换场硬切时按新场景基准判，不与旧场景比对。
    weight: 3.0
    anchors:
      g1: 同场景相邻两镜色温光向打架：上镜「白日天光通透暖白」、本镜写成「冷月清辉」，或回忆滤镜忽有忽无——成片同一场戏颜色忽冷忽暖，观众以为换了时空。
      g3: 主光源与色温承接正确，但个别锁定色名被同义改写、法器光效强度描述与上镜不完全衔接、或有动机的光变缺渐变过程只写了结果。
      g5: 同场景各镜色温/光向/主光源/时辰完全对齐，锁定色名逐字沿用，光效变化嵌在动作时间轴内有起点有过程，回忆滤镜段内一致且与当下线界限分明。
    applies_when: has_prev_shot or has_next_shot
    sources:
    - L2
    - L3
    - L4
  - id: presence_continuity
    name_cn: 在场人物跨镜承接
    evaluator: llm
    judge_instruction_cn: 与上一镜对照在场人物名单：①上一镜已明确离场/逃走的角色，本镜不得无交代复现（除非情节写明其返回）；②上一镜在场的具名关键角色本镜若不在画，须有合理交代——画外化、离场 beat、或景别/机位自然排除（如推近到双人特写），不得让爆点人物无声蒸发；③本镜声明的在画人数须与上一镜承接：上镜写死「台上仅二人」，本镜多出第三人必须有上场动作与来路；④群演规模承接（上镜满场围观、本镜不得空场）。判断时结合
      Shot context 的空间核验行与机位设定，机位造成的画外不算蒸发。
    weight: 3.0
    anchors:
      g1: 上一镜已仓皇逃出画的反派本镜又站在原地、或上镜在场且刚被点名的关键角色本镜凭空消失且全无交代——人物凭空出现/蒸发，剧情逻辑断裂。
      g3: 具名角色在离场承接正确，但群演规模跨镜有出入、或某配角不在画是机位所致但空间核验没写明其画外位置，留下歧义。
      g5: 在画名单与上一镜严格承接：离场者不复现、留场者有定位、新增者有上场动作，写死的在画人数跨镜自洽，画外角色在空间核验里有明确去向。
    applies_when: has_prev_shot
    sources:
    - C10
    - K33
    - P7
- id: narrative_line
  name_cn: 叙事线一致
  weight: 1.0
  fields:
  - id: episode_opening_no_replay
    name_cn: 集首承接前集不重演
    evaluator: llm
    judge_instruction_cn: 本镜为本集第一镜，对照 grounding 中上一集结尾内容（剧本/相邻镜）：①开场不得重演上一集已收尾的 beat——上集末已完成的决裂宣告/立誓/觉醒/离场，本镜只承接其后果继续往下走，不得再演一遍、不得再宣告一次（开场像把上集结局重启是跨集头号毛病）；②跨集进行中的连续事件（大会/测试/宴会/战斗）须用承接措辞（「接着/轮到/继续/按序/余下」），禁用「正式开始/揭幕/第一个上场」等重启词——上集大会已开幕已测过人，本集司仪不能再喊「正式开始」；③上集用过的签名台词/名场面宣告不得在本镜复用。反例：上集末主角撂下决裂狠话摔门而去，本集开场又演一段更长的决裂宣告。
    weight: 4.0
    anchors:
      g1: 开场整段重演上集已收尾的戏（同一宣告再来一遍）、或对跨集进行中的大会喊出「正式开始/第一位上场」——观众看到剧情倒带重启，前集白演。
      g3: 开场是新 beat 不重演，但承接措辞不够明确：没点明事件已进行到的环节、或有一句台词与上集签名句高度相似打了擦边。
      g5: 开场紧接上集结尾状态推进新内容，跨集事件用「接着/轮到」类续行措辞并与上集进度严格对上，无任何宣告重演与签名句复用，衔接括注写明承接的前集剧情态。
    applies_when: sub_type == 'novel' and is_first_shot
    sources:
    - R2
    - R8
    - R3
  - id: power_line_no_regress_no_leak
    name_cn: 实力线不倒退不泄底
    evaluator: llm
    judge_instruction_cn: 对照 grounding 中 world.md 的实力体系/境界档位与本集剧本进度：①不提前泄底——处于「藏锋」（隐藏实力）阶段的主角，画面不得出现金光外放/剑气/威能波动/瞳孔发光等暴露底牌的呈现，底牌/真实身份/至宝只能按剧本节点揭示，本镜不得抢跑；藏锋期表现强要靠身手、劲力、风压尘土、对手反应等物理侧写；②不倒退——角色已确立的境界/能力/资质评定在本镜不得消失或降格（上集已测出王品资质，本镜不能被当凡品对待且无剧情理由）；③实力对比与档位相称——低阶角色不得无剧本依据越级碾压高阶，权威角色的实力威仪不得无故失效。
    weight: 4.0
    anchors:
      g1: 藏锋期主角本镜周身金光爆发/剑气外放，或台词直接说破尚未揭示的真实身份/底牌——底牌提前掀了，后续揭示高潮全部报废；或已确立的境界被无理由降格。
      g3: 实力呈现方向正确，但边缘越界：藏锋期用了一处「气势如虹隐有威压」类擦边描写略显外露、或配角实力表现与其档位有轻微不符但不影响主线。
      g5: 实力呈现与当前剧情节点严丝合缝：藏锋期全靠物理侧写与他人反应衬强、零外放特效零口头泄底，各角色表现与境界档位一致，已确立的能力线单调不倒退。
    sources:
    - R4
    - X2
    - W4
  - id: proper_noun_timing
    name_cn: 专名时序不超前
    evaluator: llm
    judge_instruction_cn: 检查本镜台词与情节中出现的专有名词（人名/称号/宗门/功法/法宝/地名）的时序：①角色口中不得出现按剧情线此刻尚未登场、尚未被引荐或尚未揭晓的专名——角色叫不出还没见过的人的名字、说不出还没亮相的宝物名（应换成可指代的说法：「那位前辈」「那件东西」）；②称呼须符合角色此刻的认知——观众已知的秘密身份，不知情的角色仍按旧称呼叫；③设定名词与
      world.md 一致，不得自造同义新名（「验灵镜」不得随口写成「照灵镜」）。判断基准是 grounding 中的剧本进度与世界观资料：区分「观众视角已知」与「角色视角已知」，只有后者可入台词。
    weight: 2.0
    anchors:
      g1: 角色台词说出了剧情线上要数镜/数集之后才揭晓的人名或至宝名（如至宝还没请出，路人已直呼其名）、或不知情角色用了只有观众知道的秘密身份称呼——提前剧透，伏笔作废。
      g3: 专名时序基本正确，但有一处设定名词与 world.md 写法不一致（自造了近义变体）、或某称呼略超前于该角色的认知但语境可勉强圆过去。
      g5: 所有专名出现时点与剧本揭示节点一致，未揭晓者一律用可指代说法，各角色称呼严格贴自身认知层，设定名词与 world.md 逐字一致零自造。
    sources:
    - R6
    - ai_video.md 12.4-D S3
