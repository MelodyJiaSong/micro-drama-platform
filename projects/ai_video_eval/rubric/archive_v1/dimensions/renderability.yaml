dimension_id: renderability
name_cn: 可渲染性
description_cn: 以视频生成模型的"字面执行"视角评判 shot prompt 能否被照拍成预期画面：模型不懂修辞——比喻/成语会被渲染成实体特效，反复态措辞会被做成高频循环动画，无时间轴的动作会失控，超长 prompt
  会被截断或劣化理解，负面词缺兜底/防克隆写法缺失会直接穿帮，破"藏锋无外放"特效边界会毁掉人设与质感。本维度只收单镜内可判定的模型视角风险；台词措辞归 dialogue_quality、机械字段格式归 format_compliance。
subcategories:
- id: sc_literalization
  name_cn: 比喻词字面化风险
  weight: 1.0
  fields:
  - id: vfx_fabric_metaphor_ban
    name_cn: 光效织物比喻词禁令
    evaluator: rule
    judge_instruction_cn: 机械扫描 `## 视频 prompt` 的 ```text 体：不得出现「光帘/光纱/光幔/光瀑/光绸」等"光+织物名词"组合词。这类词在文学里是写意，视频生成模型会把它字面化成真实布料——实测「金色光帘漫落罩身」被渲染成一块白纱从天而降罩到主角头上，整镜报废。合规写法是纯光学词：「一道光柱自碑顶直照而下、主角笼罩于光柱之中」「光束投射/斜照」。注意两条白名单：`负面词:`
      行里出现「白纱/纱幔/布帘/织物」等反具象兜底词不算违规（那正是应补的防护）；`## 小说原文` 段保留文学措辞也不算。正向字段命中任一光织物词即不合格。
    weight: 4.0
    anchors:
      g1: 正向字段写「金色光帘自天漫落、如轻纱般罩住主角周身」——模型渲出一块真实白纱从天而降罩到人头上，画面彻底穿帮报废。
      g3: 主体已用「光柱照射」白描，但边缘残留一处「光纱般的微芒」，虽附了「非布料」注记，仍有被具象化成织物的抽卡概率。
      g5: 全文零"光+织物"词：「一道暖金光柱自镜面投下、将其笼罩于光中」，并在负面词补「白纱纱幔布帘织物从天而降」兜底。
    gate: true
    gate_min_grade: 3.0
    sources:
    - X10
    - K35
    - stage6 §3 模型视角自检
    - follow-up 117
    rule_id: forbidden_pattern
    rule_params:
      pattern: 光帘|光纱|光幔|光瀑|光绸
      scope: prompt_body
      description: 「光+织物名词」组合会被视频模型字面化成真实布料罩身（实测：光帘漫落→白纱从天而降罩到主角头上）
  - id: physio_idiom_ban
    name_cn: 表演/生理成语禁令
    evaluator: rule
    judge_instruction_cn: 机械扫描 ```text 体：不得出现汉语情绪/生理成语——「面如死灰、煞白如纸、心如刀绞、五内俱焚、肝肠寸断、火冒三丈、七窍生烟、眼冒金星、目眦欲裂、脸色数变、红一阵白一阵」。这些词在文学里是内心写意，在视频模型眼里是可执行画面指令，会被字面化：「七窍生烟」→头顶真冒烟；「面如死灰」→尸妆级惨白；「红一阵白一阵」→脸色高频跳变（实测翻车案例）。合规写法是可观测的生理白描：「血色从脸上一点点褪下去、喉结滚动、呼吸一滞、下颌咬紧、眼眶发热却不落泪」。`负面词:`
      行内的兜底词（如「面部颜色跳变闪烁」）与 `## 小说原文` 段不算命中。
    weight: 4.0
    anchors:
      g1: 动作字段写「他气得七窍生烟、脸色红一阵白一阵、片刻面如死灰」——渲出来是头顶冒烟+脸色高频跳变+尸妆惨白的怪片。
      g3: 主体已是生理白描，仅次要配角描写残留一处「眼冒金星」类成语，主画面大概率不受影响但仍是雷点。
      g5: 全部情绪用可观测白描承载：「血色一点点从脸上褪下去、喉结滚动、下颌咬紧、指节收紧又松开」，全文零情绪成语。
    gate: true
    gate_min_grade: 3.0
    sources:
    - A14
    - K35
    - follow-up 123
    rule_id: forbidden_pattern
    rule_params:
      pattern: 面如死灰|煞白如纸|心如刀绞|五内俱焚|肝肠寸断|火冒三丈|七窍生烟|眼冒金星|目眦欲裂|脸色数变|红一阵白一阵|白一阵红一阵
      scope: prompt_body
      description: 汉语情绪/生理成语会被模型当画面指令字面化成夸张特效（实测：红一阵白一阵→脸色高频跳变）
  - id: metaphor_model_view
    name_cn: 模型视角逐词判读（词表外比喻）
    evaluator: llm
    judge_instruction_cn: 把 ```text 体逐词以"视频模型视角"读一遍：模型不懂修辞，每个词都会被当画面指令照拍。审查固定词表之外的一切比喻/成语/写意措辞：「如{实体}般{动词}」句式（如水纹流过周身→渲出真水纹）、「光X」实体组合、眼部「锐光/冷光/瞳泛光」（→眼睛射出光束）、拟物词（心头大石落地、如遭雷击→可能渲出石头/闪电）。对每个可疑词问：这个词会被渲染成什么实体？渲出来是不是作者想要的画面？凡可能被具象化的都应改成纯白描——光效用「光柱/光束/照射/投射/笼罩」类纯光学词，神态用「瞳孔微缩/目光沉定」类可观测表演。白名单：「笼罩在光柱之中」等纯光学词合规；`##
      小说原文` 段与 `负面词:` 行内的词不算。残留 1-2 处边缘风险词给 3 分左右；出现会明显具象化成实体/超能力的措辞给低分。
    weight: 5.0
    anchors:
      g1: 通篇写意——「愤怒如烈焰在胸中燃烧」「目光似利剑出鞘」「灵气如潮水般涌动」，模型照字面渲出胸口火光、眼部剑光、洪水漫屏。
      g3: 主体白描合格，残留 1-2 处边缘比喻（「目光如刃扫过」），多数情况被理解为神态、但存在渲成实体刀光的抽卡概率。
      g5: 逐词都能照拍：「瞳孔骤缩、目光沉定」「一道流光自袖间螺旋腾起、于半空凝成法镜」，光效全用光柱/照射/笼罩类纯光学词。
    sources:
    - X10
    - A14
    - stage6 §3 模型视角自检
    - nvdi 012
- id: sc_state_timeline
  name_cn: 反复态与单向时间轴
  weight: 1.0
  fields:
  - id: repetitive_state_ban
    name_cn: 反复态句式禁令
    evaluator: rule
    judge_instruction_cn: 机械扫描 ```text 体：不得出现「一阵…一阵…」「时而…时而…」反复态句式（如「脸上红一阵白一阵」「灯火时而明时而暗」）。视频模型会把反复态做成高频循环动画——5 秒内来回十几次，成片一眼假。状态变化必须写成带时间轴的单向一次性过程：「0-0.8s
      脸上还挂着血色；0.8-5s 血色一点点往下褪；5-11.8s 褪尽、脸色发沉」。注意白名单：`负面词:` 行内的「忽红忽白反复变换」等兜底词、以及「绝不来回反复」「不忽冷忽暖」等否定语境不算命中——那正是本该补的防护写法。
    weight: 3.0
    anchors:
      g1: 动作写「灯笼时而明时而暗、他脸上红一阵白一阵」——成片 5 秒内脸色和灯光来回跳十几次、高频闪烁一眼假。
      g3: 正文无标准反复态句式，但有一处「烛火摇曳不定」类模糊往复暗示，未加单向/恒定锚定注。
      g5: 状态变化全部单向：「0-0.8s 还挂着血色；0.8-5s 一点点往下褪；5-11.8s 褪尽」，并显式注「单向一次·绝不来回反复」。
    gate: true
    gate_min_grade: 3.0
    sources:
    - A14
    - K35
    - follow-up 123
    rule_id: forbidden_pattern
    rule_params:
      pattern: 一阵[^/\n，。；、]{1,8}一阵|时而[^/\n，。；、]{1,8}时而
      scope: prompt_body
      description: 「一阵…一阵…/时而…时而…」反复态句式会被模型做成 5 秒内来回十几次的高频循环动画，成片一眼假
  - id: one_way_state_timeline
    name_cn: 状态变化单向时间轴
    evaluator: llm
    judge_instruction_cn: 检查 prompt 中每一处"状态随时间变化"的描写（脸色、光线、天色、法器光效、情绪外化）：①是否写成带时间轴的单向一次性过程（如「7-10s 流光盘旋收拢凝形；10-13s
      微光旋即收敛」），而非无方向的往复态——「不断变换」「忽明忽暗」「反复闪动」「交替」都是雷词，模型会做成高频循环动画（实测「红一阵白一阵」渲成脸色跳变）；②高风险变化处有没有显式锚定注「单向一次·幅度轻微自然·绝不来回反复也不闪烁」；③若变化靠打光实现，`光线:`
      是否补了「全镜光线恒定不闪不做冷暖跳变」类恒定注。白名单：`负面词:` 行内词与「绝不反复」等否定语境不算违规。本镜若无任何状态变化描写，给 5 分。有变化但缺时间轴或缺锚定注给 3 分左右；存在往复态措辞给低分。
    weight: 4.0
    anchors:
      g1: 写「镜面光芒不断变换、忽明忽暗、他神色反复变幻」——三处循环动画雷，成片法器闪烁如霓虹灯、脸部反复抽搐。
      g3: 变化方向写对了（血色渐褪、微光即敛），但没配时间轴、没注「单向一次不反复」，光线变化处也缺恒定锚，抽卡仍可能来回跳。
      g5: 每处变化＝时间轴+单向+锚定注：「7-10s 流光盘旋收拢凝形；10-13s 镜缘古篆亮一圈微光旋即收敛」+「单向一次·不闪烁」。
    sources:
    - A14
    - stage6 §3 模型视角自检
    - K35
- id: sc_action_exec
  name_cn: 动作可执行性
  weight: 1.0
  fields:
  - id: action_time_windows
    name_cn: 动作分秒时间窗在场
    evaluator: rule
    judge_instruction_cn: 机械检查 `动作:` 字段是否携带分秒时间窗（形如「0-7s 长老拱手进言；7-10s 云鹤掐诀请镜；10-13s 法镜亮相」）。无时间轴的动作描述（把全镜动作写成一整句不分段）模型无法安排节奏——会把所有动作挤在前几秒或随机分布，后段人物干站、动作与台词错位。合格形态：每个动作
      beat 一个时间窗、按时间顺序排列、覆盖全镜时长。只要 `动作:` 行出现至少一组「数字-数字s」分段即通过本项机械检查；时间窗是否铺满时长由另一 LLM 判定项评。
    weight: 3.0
    anchors:
      g1: '`动作:` 只有一句无分段的「长老进言、云鹤请镜、法镜亮相」——13 秒里模型自行分配节奏，后半段人物干站或动作错位。'
      g3: 有时间窗但只覆盖部分时长（只写 0-7s，7-13s 空窗），空窗段交给模型即兴发挥。
      g5: 「0-7s 长老上前拱手进言；7-10s 云鹤掐诀、流光腾起凝形；10-13s 镜成微光即敛、缓缓自旋」——beat 按窗铺满全部 13 秒。
    sources:
    - A1
    - ai_video.md 12.4
    rule_id: required_pattern
    rule_params:
      pattern: 动作:[^\n]*\d+(\.\d+)?\s*[-–—~]\s*\d+(\.\d+)?s
      scope: prompt_body
      description: '`动作:` 字段须含分秒时间窗（形如 0-7s / 7-13s 分段 beat）'
  - id: action_concrete_readable
    name_cn: 动作具体可拍且观众可读
    evaluator: llm
    judge_instruction_cn: 逐 beat 检查 `动作:`（结合 `情节:`）是否"具体可执行、观众一眼能读懂"：①每拍是可观测的物理动作（「袍袖一拂、单手于胸前掐诀一引」），而非抽象情绪词（「十分震惊」「气场全开」——模型拍不出抽象词）；②动作链有因果、可读——禁孤立功能性简写：挨打后只写「脚下一沉/跺脚」观众看不懂是踉跄还是发力，应展开成「被打得一个趔趄、踉跄退半步、前脚撑地、咬牙撑住没倒」；③beats
      大致铺满时长、无大段空窗（13s 镜只写 3s 动作，剩 10s 模型自由发挥必穿帮）；④关键在画人物每拍有事做、无"干站着"，无台词露脸角色也有闭口听戏等反应拍。注意：时长该不该加/该不该拆镜的裁决不在本项；只评动作本身写没写到可照拍、可读懂的程度。
    weight: 4.0
    anchors:
      g1: 动作写「云鹤很震惊，随后气场全开镇住全场」——全是抽象情绪无一个可拍的物理动作；或挨打只写「脚下一沉」，渲出来像莫名其妙的跺脚。
      g3: 主体动作链完整具体，但个别 beat 是孤立简写（「借力一撑」没写撑什么、往哪去），或 13s 中约 3s 无动作安排。
      g5: 每拍因果连贯可照拍：「目光一凝、眉峰微沉、沉沉颔首、袍袖一拂、单手掐诀一引——流光自袖间腾起」，无台词角色配「闭口不动嘴」听戏拍。
    sources:
    - A1
    - A8
  - id: prop_state_action_driven
    name_cn: 道具/法器状态动作驱动
    evaluator: llm
    judge_instruction_cn: 检查本镜道具/法器的每一次可见状态变化是否由动作 beat 驱动、写法能否防"凭空出现"：①道具从藏到露必须有连贯可见的取出动作（「探手入衣襟→捏住红绳→自衣内一点点掏出→提到眼前」）——只写「撩开衣襟看」或「一按胸口」，模型会让道具凭空跳到衣外贴在身上；佩戴/收回同理要有动作；②至宝/法器类须仙家范式四态：召出有凝形过程（掐诀→流光腾起→半空凝形，禁凭空闪现）、持有全程悬浮不落人手、催动凭法诀（写「双手举镜照碑」即凡俗用法穿帮）、收回化流光入袖；③一件道具在本镜只能三态取一：全程稳定在画/全程画外不提/有完整可见进出场轨迹且给足秒数——禁"入画一闪即消失"（实测渲成道具无端消失+渲成两件）。本镜无道具上画且无状态变化则给
      5 分。
    weight: 3.0
    anchors:
      g1: 玉佩前一拍藏在衣内、下一拍「手一按胸口玉佩已在掌心」无掏取动作；或至宝写「从怀里掏出双手举起照碑」——凭空出现+凡俗用法双雷。
      g3: 取出动作有但简写（「撩开衣襟看玉佩」，模型可能让玉佩跳到衣外）；法器悬浮写了但催动缺法诀描述。
      g5: 「探手入衣襟、捏住红绳、自衣内一点点掏出提到眼前」；法器＝掐诀召出、流光凝形、全程悬浮不落人手，负面词封「手持法镜/凭空闪现」。
    sources:
    - X8
    - X9
    - A9
- id: sc_length_negatives
  name_cn: 长度与负面词兜底
  weight: 1.0
  fields:
  - id: negative_words_risk_coverage
    name_cn: 负面词按本镜风险定制兜底
    evaluator: llm
    judge_instruction_cn: 对照本镜画面内容，检查 `负面词:` 是否"按本镜风险定制"兜住了高危穿帮，而非只贴通用基线（人脸变形/五官漂移/畸形肢体/现代服饰/字幕等）。定制对照表：有受光/光效→须封「白纱纱幔布帘织物从天而降」类反具象词；有脸色/状态变化→「面部颜色跳变闪烁/反复变换」；少人同框或单主体→分身组「同一角色出现两次/分身/镜像双人」；人物立于高台→「悬空漂浮」；法器上画→「手持{法器}/托举/凭空闪现」；唯一道具→「两件/多件/重复出现」；无台词露脸角色→「{角色}开口动嘴」；人群让道
      beat→「齐刷刷分道/红毯式让道」。同时查反向错误：负面词不得含本镜正需要的特效自身名词（会把特效压没）。逐项核对本镜实际风险点：每漏一个高危兜底降一档，通用基线也缺给 1 分。
    weight: 4.0
    anchors:
      g1: 特效镜负面词只有通用基线七件套，未封「法镜凭空闪现/手持法镜/两面镜子/分身」——本镜最高危的穿帮点全部裸奔。
      g3: 基线+部分定制在（分身组有），但漏了单项高危兜底：受光镜没封织物、或高台人物没封「悬空漂浮」。
      g5: 负面词按本镜画面逐风险定制：克隆组、法器复数组、凭空闪现组、无台词角色开口动嘴、字幕组一应俱全，且无与本镜特效冲突的自压制词。
    sources:
    - K15
    - K33
    - K35
    - A14
    - X8
  - id: dialogue_voice_not_suppressed
    name_cn: 有台词镜禁挂人声抑制
    evaluator: rule
    judge_instruction_cn: '机械扫描：有台词的 shot，```text 体（尤其 `负面词:`）不得出现整体人声抑制词——「no voiceover/no speech/no narration/不生成人声/无人声/人声音轨/视频静音」。生成模型正是从
      `台词:` 字段文本生成台词配音，挂了 blanket 人声抑制会把台词音一并压哑、成片变默片。人声抑制组只属于静默镜（`台词: 无`）。允许的写法是定向抑制：「画外他人笑声」「{某配角}开口动嘴」这类点名到具体来源/具体角色的负向不算违规。命中任一
      blanket 抑制词即不合格。'
    weight: 3.0
    anchors:
      g1: 有台词镜负面词挂「无人声/no speech」——台词配音被一并压哑，成片默片、长老进言张嘴无声。
      g3: 未挂 blanket 抑制词，但负向里有一条「画外人声」写得过宽未点名来源，有误伤台词音轨的抽卡风险。
      g5: 台词镜零人声抑制词；仅定向负向（「无台词角色开口动嘴」「画外他人笑声」），台词音轨安全。
    applies_when: has_dialogue
    gate: true
    gate_min_grade: 3.0
    sources:
    - K22
    - ai_video.md rule 704
    rule_id: forbidden_pattern
    rule_params:
      pattern: no voiceover|no speech|no narration|不生成人声|无人声|人声音轨|视频静音
      scope: prompt_body
      description: 有台词镜挂 blanket 人声抑制词会把台词配音一并压哑，成片变默片（rule 704：Seedance 从台词文本生成配音）
  - id: silent_shot_voice_negatives
    name_cn: 静默镜人声抑制组在场
    evaluator: rule
    judge_instruction_cn: '机械检查：静默镜（`台词: 无`）的 `负面词:` 必须含人声抑制词组——「人声/配音/旁白/念白/念出角色名/no voiceover/no speech」中的多项。只写
      `台词: 无` 挡不住：模型会从 `角色:`/`情节:` 字段里抓角色名或文字 TTS 念出来（实测：已写台词无，成片仍念出了角色名）。注意：抑制词只能写进 `负面词:`，不得塞进 `台词:` 槽——`台词:`
      槽里的任何 prose 都可能被当字幕烧进画面，静默镜 `台词:` 只准写「无」。'
    weight: 2.0
    anchors:
      g1: '静默镜只写「台词: 无」、负面词无任何人声抑制——成片模型抓角色名念了出来（实测翻车模式）。'
      g3: 负面词有「人声」一词但组不全（缺配音/旁白/no voiceover），部分平台仍可能生成念白。
      g5: 负面词含完整抑制组「人声/配音/旁白/念白/念出角色名或台词文字/no voiceover/no speech」，且抑制词未污染台词槽。
    applies_when: not has_dialogue
    sources:
    - K22
    - K21
    rule_id: required_pattern
    rule_params:
      pattern: 人声|配音|旁白|念白|no voiceover|no speech
      scope: prompt_body
      description: 静默镜负面词须含人声抑制组，否则模型会从角色/情节字段抓角色名 TTS 念出（实测翻车）
- id: sc_vfx_boundary
  name_cn: 特效边界与藏锋
  weight: 1.0
  fields:
  - id: no_self_glow
    name_cn: 人不自发光·眼不发光（藏锋铁律）
    evaluator: llm
    judge_instruction_cn: 以"藏锋无外放"铁律检查正向字段（角色/情节/动作/光线/渲染样式）：①人物不得自发光——禁「周身金光/金光爆发/威能光效/能量波/剑气/暖金裂纹」类外放描写；②眼睛不得发光——禁「瞳泛金/瞳孔发光/眼中锐光/眼内光效」，模型会字面渲染成眼睛射光；眼神变化只能靠表演（瞳孔微缩/眼睑收紧/目光沉定）；③力量感靠内敛呈现：内透暖意（贴身不外溢成光斑）、物理副产（风压鼓衣/地面微尘/气场压人）、神态（对手忌惮）；④光效只许属于法器/系统UI，且须注「柔和莹润非人放、不过曝」。`负面词:`
      行里列出这些词是兜底、不算违规。若世界观切片表明本镜处于力量释放期，则按设定放行外放特效、但仍须柔和分级不过曝。反面例：「主角双目金光暴涨、周身气浪金光冲天」——渲成廉价金光特效，人设与设定双穿帮。
    weight: 5.0
    anchors:
      g1: 藏锋期主角写「双目金光暴涨、周身气浪翻腾金光冲天」——字面渲出廉价金光特效，藏锋人设与力量外放规则双穿帮。
      g3: 无金光爆发，但残留一处「眼中精光一闪」或内透暖意写成了「胸口透出光斑」——轻度漏光，抽卡可能渲成发光。
      g5: 力量感全靠内敛三件套：「袍角被无形气流轻拂、地面浮尘微起、目光沉定如渊」；光效仅属法器且注「柔和莹润非人放、不过曝」。
    sources:
    - X2
    - X3
    - K13
    - stage6 §8 避坑
  - id: vfx_presentation_quality
    name_cn: 特效呈现可拍且合规
    evaluator: llm
    judge_instruction_cn: 检查本镜超自然视觉的呈现写法是否"模型能拍好、平台能过审"：①出现/消失有过程——法器/异象须写完整凝形/消散轨迹（「流光自袖间螺旋腾起、空中古篆一闪即散、盘旋收拢凝形」），禁「凭空闪现/凭空消失」（模型渲成物体瞬移穿帮）；②强度合规——禁过曝强光、满屏发光粒子/星点/bokeh光球（渲成廉价游戏感）、高频闪烁（触平台审核且观感不适）；氛围用真实感的淡仙气薄雾/暮霭/灯火晕，非发光粒子；③系统UI微光仅属自身、不外溢照亮人物；④特效声明内部不打架——`渲染样式`/`情节`
      声明了光柱/光效，`场景:` 不得整句写死「静置不发光」、`负面词:` 不得含该特效自身名词或色词（负向 token 会把特效本体压没渲不出来）。逐项核对，凭空闪现或声明自相矛盾给低分。
    weight: 3.0
    anchors:
      g1: 法器「凭空闪现」在半空、满屏金色发光粒子星点、镜面光高频闪烁——瞬移穿帮+廉价游戏感+触审核三连。
      g3: 凝形过程有但只一句带过（「流光一闪凝成」），氛围粒子未封，场景行与特效声明轻度打架（场景写「静置」）。
      g5: 「流光自袖间螺旋腾起、空中古篆一闪即散、盘旋收拢凝形」全程可见轨迹；光效柔和不过曝，负面词封「过曝刺眼」而不含特效自身名词。
    applies_when: has_vfx
    sources:
    - X4
    - X5
    - X6
    - X7
    - K33
- id: sc_multi_figure
  name_cn: 多人克隆与串脸防护
  weight: 1.0
  fields:
  - id: duplicate_figure_guard
    name_cn: 防同人克隆/凭空多人
    evaluator: llm
    judge_instruction_cn: 检查防"同人克隆/背景凭空多人"的写法是否齐备——视频模型极易把同一人渲成两个、或在背景克隆出成排同款人物（实测：主角身后克隆出成排同款道长）。逐项核对：①同一角色在整个
      prompt 中只具名描述一次，角色/走位/动作各字段对同一人的描述不得让模型误读成两个人；②少人同框镜（≤3 具名角色）须在 `场景:`/`走位:` 写死在画人数（「台上仅此二人、无其他人入画」「背景不出现任何其他道长长老」）；③`负面词:`
      须含分身组至少两项（「同一角色出现两次/两个相同人物/分身/镜像双人」）+「背景凭空多出{同类人物}」类克隆负向；④唯一地标/唯一道具在画须防复数：正向写「有且仅有一面镜·唯一镜源」+负向「两面镜子/多面镜子/重复出现」。四点全齐
      5 分；缺分身负向组或人数未写死降至 3 分以下；正文本身把同一人写重复（克隆必现）给 1 分。
    weight: 4.0
    anchors:
      g1: 少人同框未写死人数、无分身负向——成片主角身后克隆出成排同款道长；或同一角色在走位与动作里被写得像两个人。
      g3: 分身负向组只有一项、在画人数未在场景/走位写死；唯一道具写了「一面镜」但没封「两面镜子/重复出现」。
      g5: 「台上仅此二人、无其他人入画」写进场景+走位双处，负面词含「同一角色出现两次/分身/镜像双人/背景凭空多出道长」，唯一镜源+复数封死。
    gate: true
    gate_min_grade: 3.0
    sources:
    - K33
    - follow-up 113
    - stage6 §8 避坑
  - id: face_identity_guard
    name_cn: 防串脸/背影露脸写法
    evaluator: llm
    judge_instruction_cn: 检查多人同框的防串脸/防误露脸写法：①每个锁脸角色在 `角色识别 / 参考图:` 有「参考图↔画面位置或身份↔识别标签」的绑定消歧（「画面主体云鹤真人＝c16参考图(选角脸)」），防模型把
      A 的参考脸贴到 B 上；②不锁脸配角须显式标注（「即兴生成不锁脸、面孔各异不串脸」）并与锁脸主体区分开；③剪影/背影角色只写从背面可见的轮廓（衣色/发型/体态），禁写五官——写了五官模型会强行让其转脸露正面，暗线角色提前显形穿帮；④≥2
      个背影或同类群像须逐一给区分特征（衣色/发型各异）+「严禁雷同或渲成同一人」。本镜单人独占画面给 5 分。注意：识别标签与角色卡逐字节一致性归格式维度，本项只评防串脸写法的覆盖与有效性。
    weight: 3.0
    anchors:
      g1: 三人同框零绑定——只列三个名字与造型，模型把主角的参考脸贴到配角上；背影暗线角色还写了五官，被渲成转头露正脸提前显形。
      g3: 主体绑定有（主角＝参考图），但配角未标「不锁脸面孔各异」，两个背影群演未给区分特征、可能被渲成同一人复制。
      g5: 逐人绑定「画面主体云鹤＝c16参考图；某长老＝即兴不锁脸面孔各异」，剪影只写衣色轮廓禁五官，群像各给区分特征+「严禁雷同」。
    sources:
    - K8b
    - ai_video.md 12.4-B
    - stage6 §8 避坑
