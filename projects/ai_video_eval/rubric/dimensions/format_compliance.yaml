dimension_id: format_compliance
name_cn: 格式契约
description_cn: 机械格式契约维度：以确定性规则为主判定 shotNN.md 是否满足出片硬契约——YAML 信封与 canonical 段结构齐全、Shot context 必备行（衔接/空间核验）在场且衔接三态规范、视频
  prompt 必备字段行齐全且 ≤2000 全字符、时长 4–15s、比例 9:16、零 hex 色值、台词字段纯净（零字幕样式）、有台词必有配音块且语速 ≤5 字/秒、锁定描述符逐字节一致、参考行格式洁净且与上画内容双向一致、无字幕铁律双落点、字面化/敏感高危措辞零命中。只收单镜可判项；台词措辞质量、运镜/站位审美、剧情连贯均不在本维度。
subcategories:
- id: prompt_hard_params
  name_cn: 视频 prompt 硬参数
  weight: 1.0
  fields:
  - id: prompt_fields_complete
    name_cn: 必备字段行齐全
    evaluator: rule
    judge_instruction_cn: 检查「## 视频 prompt」的 ```text 块内必备字段行是否齐全：角色、情节、场景、镜头、走位、动作、光线 / 色调、渲染样式、负面词、比例、时长（另有 参考、角色识别
      / 参考图、台词、节奏 等常见行，缺失记次要缺陷）。每字段以「字段名:」行起头。任一必备字段行整体缺失即硬缺陷——生成模型按字段读取，漏一行等于该控制维度完全失控（漏「负面词」＝零负向约束、漏「时长」＝出片长度随机）。字段行在但内容空壳记部分缺陷；字段名错写（「灯光:」代替「光线
      / 色调:」）视同缺失。
    weight: 5.0
    anchors:
      g1: 缺 2 个及以上必备字段行（如既无负面词也无走位），prompt 结构残缺，多个控制维度失控。
      g3: 缺 1 个必备字段行，或 11 行全在但有一两行是空壳/字段名不标准需人工对号。
      g5: 11 个必备字段行全部在场、命名标准，另带参考/角色识别/台词/节奏行，各字段均有实际内容。
    gate: true
    gate_min_grade: 3.0
    sources:
    - K3
    rule_id: required_prompt_fields
    rule_params:
      fields:
      - 角色
      - 情节
      - 场景
      - 镜头
      - 走位
      - 动作
      - 光线 / 色调
      - 渲染样式
      - 负面词
      - 比例
      - 时长
  - id: prompt_char_count_within_limit
    name_cn: ≤2000 全字符上限
    evaluator: rule
    judge_instruction_cn: 统计「## 视频 prompt」```text 块的全字符数：去掉首尾空白后，中文、ASCII 字母、数字、标点、@符号每个字符各计 1，仅内部空白与换行不计。总数必须 ≤2000，无任何字段豁免（情节字段也全计）。这是生成模型的真实输入上限——超长会被
      Seedance/即梦截断或直接拒绝，属出片必炸级硬契约。超 2000 即不合格，超得越多越严重：通常意味着负面词/渲染样式堆砌、锁定描述在多字段重复粘贴、情节/动作/镜头跨字段复读未去重。1800–2000 贴顶但合格。
    weight: 5.0
    anchors:
      g1: 全字符数超 2400：负面词写了四五十项、渲染样式大段堆砌、同一段动作描述在情节/动作/镜头三处复读。
      g3: 全字符数在 2000–2100 之间轻微超顶，去掉一两处冗余罗列即可达标。
      g5: 全字符数 ≤2000：字段信息密度高、零跨字段复读、负面词收敛在约 22 项标准集规模、渲染样式为核心关键词集。
    gate: true
    gate_min_grade: 3.0
    sources:
    - K10
    - ai_video.md 12.4
    rule_id: char_count_max
    rule_params:
      max: 2000
- id: reference_locking
  name_cn: 参考与锁定一致性
  weight: 1.0
  fields:
  - id: locked_descriptor_byte_identical
    name_cn: 锁定描述符逐字节一致
    evaluator: rule
    judge_instruction_cn: 对照 grounding 提供的角色卡，检查每个具名锁定角色在「角色:」字段里的锁定描述符/识别标签是否逐字节一致——一字不改、一符不增删、标点不换。锁定描述符是跨镜跨集人脸与造型一致性的唯一机制，任何改写（同义替换、删短语、加形容词、调语序）都会造成生成漂移；同角色相邻镜变景别时造型字段也须与卡一致零变化。豁免：明确标注「即兴生成不锁脸」的一次性临时角色（群像龙套）。另注意描述符不应含文字五官/痣疤锚——脸由选角参考图承载，文字五官反而致漂移。
    weight: 4.0
    anchors:
      g1: 主角描述符被自由改写：语序调换+新加两个形容词+删了一个短语，或某锁定角色干脆没贴描述符。
      g3: 描述符主体与卡一致但有一两处标点/用词微差（「、」变「，」、「灰白道袍」变「灰白色道袍」），属复制走样。
      g5: 所有锁定角色描述符与角色卡逐字节相同，临时角色显式标「即兴生成不锁脸」，零文字五官描述。
    sources:
    - K8
    - K18
    rule_id: locked_descriptor_byte_match
    rule_params: {}
