dimension_id: cinematography
name_cn: 运镜与站位
description_cn: 评单镜镜头语言与空间逻辑：景别/角度/运镜是否由情绪目的推导、9:16 竖屏原生构图、一镜内运镜一主一辅不打架；站位/朝向/视线是否写死（谁面向谁、对谁说=视线落点、内心独白眼神处理）、不对空气说话、防同角色重复渲染、单镜朝向体系与空间核验自洽、画外物与背景由机位反推、高台人物接地。跨镜轴线/景别节奏等整集层面问题不在本维度（归
  rollup）。
subcategories:
- id: camera_language
  name_cn: 镜头语言
  weight: 1.0
  fields:
  - id: no_blacklist_speed_words
    name_cn: 速度词黑名单
    evaluator: rule
    judge_instruction_cn: 机械校验：`镜头:` 行不得出现速度黑名单词「快速/急速/fast」。Seedance 与 Kling 官方指南一致判定这些词为头号降质词——会引发运动模糊、时间不一致与画面噪声。速度词只许用白名单：缓慢、匀速、平稳、流畅、轻微；需要表达高速感时用结果描述代替（拖影、拉丝、风压、背景放射状模糊+主体清晰锁定），而非直接命令模型「快速」。本项仅检查镜头行；`动作:`
      行中「快步上前」类人物动作速度词不在本项范围。
    weight: 2.0
    anchors:
      g1: 镜头行含「快速推近」「急速拉远」「fast pan」等黑名单词——命中即不合格。
      g3: 镜头行无黑名单词，但用了白名单外的同义变体（「飞快」「疾速」）——机械规则未命中但属临界写法。
      g5: 镜头行速度词全部取自白名单（缓慢/匀速/平稳/流畅/轻微），高速感用结果描述（背景放射拉丝模糊+主体清晰锁定）表达。
    sources:
    - yunjing 铁律4
    rule_id: forbidden_pattern
    rule_params:
      pattern: 镜头:[^\n]*(快速|急速|fast)
      scope: prompt_body
      description: 镜头行禁用速度黑名单词（快速/急速/fast）——双平台官方判定的头号降质词；速度词只许白名单（缓慢/匀速/平稳/流畅/轻微）。
  - id: camera_timeline_explicit
    name_cn: 镜头明确与秒级时间轴
    evaluator: llm
    judge_instruction_cn: |-
      检查 `镜头:` 行是否把镜头语言写到「明确可执行」的程度：①【三段式】起幅景别 → 主运镜（含速度词）→ 落幅景别，景别变化用连续语态（如「从双人中景缓慢匀速推至面部特写」），不接受只写「中景拍摄」「跟着人物拍」这类单词式/空泛镜头行；②【秒级对位】凡镜头状态有阶段变化（起幅→推近→落幅，或 Shot context/`动作:` 已把本镜分成多个秒窗的多 beat 镜），`镜头:` 行须把各阶段对位到秒级窗口（如「0-7s 起幅双人中景；7s 起缓慢匀速推近；10-13s 落幅特写」），窗口连续不重叠、覆盖 `时长:` 全程；全程单一静止机位或单段连续运镜的短镜可免逐秒分窗，但须写明全程机位与起落景别；③【时长一致】秒窗与 `时长:` 数值一致——末窗不超过总时长、中段不留 3 秒以上未交代区间。本项只评「明确程度与时间对位」，不评运镜选择的审美好坏。
    weight: 4.0
    anchors:
      g1: 镜头行只有孤立景别词或空泛描述（「中景」「镜头跟随」），无起落幅、无运镜速度词、无任何时间对位——多 beat 镜完全靠模型自由发挥。
      g3: 三段式在、主运镜有速度词，但多阶段镜未标秒窗，或秒窗与时长/动作时间轴对不上（越界/留了 3s 以上空档）。
      g5: 起幅/主运镜/落幅齐全带白名单速度词，逐阶段标秒窗且与时长和动作时间轴严丝合缝——读完镜头行能逐秒复现机位状态。
    sources:
    - yunjing 铁律1
    - user 2026-07-29
  - id: intra_shot_cut_compliance
    name_cn: 镜内切换合规（运镜铁律）
    evaluator: llm
    judge_instruction_cn: |-
      依据运镜 reference 的镜内切换铁律逐项核对 `镜头:`（连带 `动作:` 与 `负面词:`）：①【单镜单机位】一个 shot 只允许一台机位的连续演化——镜头行不得出现真切镜语（切至/切换/快切/跳切/蒙太奇/转场/「镜头1、镜头2」式编号分镜），景别变化必须连续语态，禁景别罗列句（「全景。特写。」会触发 Seedance 隐式分镜）；②【一镜一主运镜】主运镜（推/拉/摇/移/跟/升降/环绕）只写一个；修饰层（轻微手持呼吸感/固定荷兰角构图/浅景深）至多叠一个；禁指令冲突组合（「固定镜头」+任何运动运镜互斥；荷兰角+推轨+环绕三件套必崩）；③【防切镜三层】多 beat/长镜（时长≥8s 或动作分了多个秒窗）应带「一镜到底不切镜」类声明，且 `负面词:` 挂「镜头切换/转场/跳切」兜底；④【运镜词归位】运镜指令只出现在 `镜头:` 字段，`动作:` 里不得夹运镜词（「镜头推近」写进动作行＝违规；人物自身动作速度词不算）。注意：否定/负向写法（「一镜到底不切镜」「无镜头切换」以及负面词字段里挂的「镜头切换」）是合规保护、不算违规命中。
    weight: 4.0
    anchors:
      g1: 镜头行出现真切镜语或编号分镜（「切至特写」「镜头2：」「随后转场」），或同镜并列互斥指令（固定机位+缓慢推近；荷兰角+推轨+环绕）——成片必切镜或必崩。
      g3: 无切镜语，但踩了一处软规则——两个主运镜并列（「边推近边环绕」且非修饰层）、修饰层叠了两个、≥8s 多 beat 镜缺「一镜到底」声明或负面词未挂切换组、动作行里夹了运镜词。
      g5: 单一主运镜+至多一个修饰层、景别连续语态、防切三层齐全（声明+无触发词+负面词兜底）、运镜词全部归位镜头行——完全符合 reference 铁律。
    sources:
    - yunjing 铁律1/2/6/7
    - S7
    - user 2026-07-29
- id: spatial_selfconsistency
  name_cn: 空间核验与机位自洽
  weight: 1.0
  fields:
  - id: spatial_verification_line_present
    name_cn: 空间核验行存在
    evaluator: rule
    judge_instruction_cn: 机械校验：`## Shot context` 必须含 `空间核验:` 行。该行是写 shot 前完成时序推演的落点凭证——推演内容应覆盖：机位在哪、每个在画人物起→末位置+朝向、每个剧情物件的在框态（全高入画/彻底画外）、说话窗几何（谁对谁说·距离带·时段）。缺行=空间推演未做或未落凭证，判不合格。行内容的推演质量由本子类其他
      llm 项评，本项只判存在性。
    weight: 2.0
    anchors:
      g1: Shot context 无「空间核验:」行——空间时序推演未落凭证。
      g3: 有该行但内容仅一句敷衍（只写「机位=旗台一侧」，无人物起末位、无画外物处置、无说话窗）——机械判存在但接近失职。
      g5: 空间核验行完整覆盖：机位、每个在画人物位置+朝向、画外物处置、说话窗时段（如「机位=旗台一侧·二人同框相向·场心/巨碑画外·说话窗0-7s近距同框」）。
    sources:
    - C19
    - ai_video.md 空间核验 amendment（K33）
    rule_id: shot_context_required
    rule_params:
      keys:
      - 空间核验
