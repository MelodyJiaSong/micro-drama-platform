dimension_id: dialogue_quality
name_cn: 台词质量
description_cn: 评 shot 台词块与配音块的台词措辞质量：是否为真人脱口而出的中文大白话（零文言/公文腔/对仗格言/翻译腔），有因果有信息量、说话人认知与层级归属正确、贴角色声口、情绪真实且贴事件时效、人称正确、长串拆短句、语速可念（字数÷时长≤5字/秒）、内心独白与对白类型使用得当。只评本
  shot 内可判定的台词问题；跨集重复与全剧序列问题不在本维度。
subcategories:
- id: vernacular_spoken
  name_cn: 白话口语·说人话
  weight: 1.0
  fields:
  - id: no_classical_markers
    name_cn: 零文言虚词（机械筛查）
    evaluator: rule
    judge_instruction_cn: 机械正则筛查：shot 的台词字段（含对白、OS、旁白、系统各行）不得命中任何明确文言/公文标志词——吾、汝、尔等、之乎、者也、此乃、岂能、岂敢、安能、焉能、速速、休得、不得喧哗、无需、除尔、尔速、何曾。这些词在现代真人口语中不存在，仙侠/古装题材也不例外（身份年代感只靠用词分寸、语气、称谓体现，不靠说文言）。命中任意一处即不合格。反例：「除尔族籍」「尔等速速退下」；正确写法：「除你族籍」「你们都退下」。
    weight: 3.0
    anchors:
      g1: 台词命中两处及以上文言标志词，如同一 shot 里既有「此乃」又有「尔等」，明显整段按古文腔写
      g3: 台词命中一处文言标志词（如一句里夹了个「无需」），其余全部是白话
      g5: 全部台词行零命中：没有任何文言虚词或公文唱礼词，指代全用你/我/他们、否定全用不用/别/不必
    applies_when: has_dialogue
    gate: true
    gate_min_grade: 3.0
    sources:
    - D1b
    - B2
    rule_id: forbidden_pattern
    rule_params:
      pattern: 吾|汝|尔等|之乎|者也|此乃|岂能|岂敢|安能|焉能|速速|休得|不得喧哗|无需|除尔|尔速|何曾
      scope: dialogue_field
      description: 台词字段不得出现明确的文言虚词/公文唱礼标志词（吾/汝/尔等/此乃/岂能/速速/休得/不得喧哗/无需/除尔 等）
- id: syntax_pacing
  name_cn: 句式与节奏
  weight: 1.0
  fields:
  - id: pronoun_address_correct
    name_cn: 人称与受话对象正确
    evaluator: llm
    judge_instruction_cn: 先判定每句台词的受话人是谁，再核人称：①当事人在场且这话是说给他听的→指代他必须用「你/你们」——反例：父亲当面对儿子宣判却说「今日起，除他族籍」（像在跟别人讲他），应为「除你族籍」；②当事人不在场、或话是说给第三方/众人听的（宣告、背后议论、对已转身离场的背影说话）→用「他/她」才对（对离场背影说「有他哭的」＝正确）；③自指用「我」，不得用第三人称自称（「这废物也不稀罕」听着像在说别人），刻意自嘲的明确语境除外；④本
      shot 内同一对受话关系的人称前后必须一致（上一句「你」下一句突然「他」＝错）。内心独白和旁白指代他人用第三人称属正常，不算违规。
    weight: 4.0
    anchors:
      g1: 当面对话用错第三人称：说话人面对受话人却通篇「他/她」指代对方（「除他族籍」式），或角色无自嘲语境地用「这废物」自称
      g3: 主要对话人称正确，但有一处摇摆——如同一段话里对同一人先「你」后「他」切了一次，语境勉强能圆（视线短暂转向众人）但没写清
      g5: 每句受话关系精确：当面全用「你/你们」、宣告与背影戏用「他/她」、自指用「我」，同一受话关系人称从头到尾一致，OS/旁白三人称使用规范
    applies_when: has_dialogue
    sources:
    - D7
    - D1
