# ai_video_eval runtime configuration. Self-contained: no reads of .claude/ or CLAUDE.md.
paths:
  videos_root: ../../ai_videos        # relative to this project's root
  runs_dir: runs
  disputes_dir: disputes
  golden_dir: golden

api_key_env: [AI_VIDEO_EVAL_ANTHROPIC_KEY, ANTHROPIC_API_KEY]

judge:
  # engine: api         -> Anthropic API direct (needs key in .env; strongest control: forced JSON schema, effort)
  # engine: claude_code -> headless `claude -p` subprocesses on your Claude subscription (no key needed;
  #                        runs from an empty temp dir: no CLAUDE.md/skills/MCP load; schema enforced by prompt+validation)
  engine: claude_code
  default:
    model: claude-opus-5
    effort: high
    samples: 3
    max_tokens: 16000
  per_dimension:
    format_compliance: { model: claude-sonnet-5, effort: medium, samples: 1 }
    pacing: { model: claude-sonnet-5, effort: medium, samples: 3 }
  concurrency: 8      # 单次评审调用级信号量：镜与镜、维度与维度、样本与样本全并行，只受此上限约束
  timeout_s: 600

budget:
  default_usd: 200.0

pricing:
  claude-opus-5: { input_per_mtok: 5.0, output_per_mtok: 25.0 }
  claude-sonnet-5: { input_per_mtok: 3.0, output_per_mtok: 15.0 }
  claude-haiku-4-5: { input_per_mtok: 1.0, output_per_mtok: 5.0 }

grounding:
  world_slice_max_chars: 6000
  card_max_chars: 4000
  script_max_chars: 20000
  dialogue_max_chars: 20000
  adjacent_prompt_max_chars: 5000
  prior_ep_ending_max_chars: 3000

# Per-project divergences from global rule defaults (documented in the drama's own docs).
project_overrides:
  # 仙剑一重制（2026-09-19 由 xianjian_yi_mv 重启为 xianjian_yi 系列）整片 16:9。
  # 注意：--project 传的是 videos_root 下的相对路径，系列剧集是 `xianjian_yi/xjN`，
  # 所以每集落地时要把该集的键补进来；本条目前只覆盖以系列名直接跑的情形。
  xianjian_yi:
    aspect_ratio: "16:9"
