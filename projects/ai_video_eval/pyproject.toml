[project]
name = "ai_video_eval"
version = "0.1.0"
description = "Standalone eval system for AI-video shot prompts: frozen rubric, LLM judges, deterministic aggregation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "dependency-injector>=4.41",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
