<style>
  /* 屏 A：「牺牲品」说法（评论，据香港 01 转述），两天的说法并排 */
  .say { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
  .say .h1 { margin-top: 14px; }
  .say .tagrow { margin-top: 22px; }
  .hu { position: absolute; left: var(--mx); top: 170px; display: flex; align-items: center; gap: 18px; }
  .days { position: absolute; left: var(--mx); right: var(--mx); top: 270px; display: flex; gap: 40px; }
  .days .card { flex: 1 1 0; min-width: 0; padding: 38px 44px; }
  .days .h2 { margin-top: 14px; }
  .aim { position: absolute; left: var(--mx); width: 820px; top: 640px; text-align: center; }

  /* 屏 B：记录时间轴 */
  #ax { position: absolute; left: 0; top: 0; }
  .pt { position: absolute; width: 400px; text-align: center; top: 250px; }
  .pt .slot { margin: 0 auto 10px; }
  .pt .h2 { white-space: nowrap; }
  html[lang=en] .pt .h2 { white-space: normal; }
  html[lang=en] .pt { top: 140px; }
  .pt .caption { color: var(--ink2); }
  .pt .role { display: block; font-size: var(--fs-caption); font-weight: 500; color: var(--sub); margin-top: 2px; }
  .band { position: absolute; left: 230px; width: 1460px; top: 630px; height: 84px; border-radius: 42px; background: var(--surface2);
          display: flex; align-items: center; gap: 18px; padding: 0 28px; }
  .band .body { white-space: nowrap; }
  .none { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }

  /* 屏 C：董事会自己的理由 */
  .rs { position: absolute; left: 0; right: 0; top: 180px; text-align: center; }
  .stack { position: absolute; left: 460px; width: 1000px; top: 290px; }
  .stack .card { display: flex; align-items: center; gap: 26px; padding: 26px 40px; margin-bottom: 22px; }
  .stack .h2 { white-space: nowrap; }
  .stack .pill { margin-left: auto; }
  html[lang=en] .stack { left: 420px; width: 1080px; }

  /* 屏 D：结论两句，一句打叉、一句半个勾 */
  .cc { position: absolute; left: 300px; width: 1320px; top: 280px; }
  .cc .ln { display: grid; grid-template-columns: 120px 1fr; align-items: center; padding: 34px 0; border-bottom: 1px solid var(--hair); }
  .cc .ln:last-child { border-bottom: 0; }
  .cc .mk svg { display: block; }
  .cc .caption { margin-top: 4px; }
</style>

<div class="eb eyebrow" data-ch="c4"></div>

<!-- 屏 A -->
<div class="say" id="say">
  <div class="eyebrow" data-zh="中文网上的流行说法" data-en="A popular take in Chinese commentary"></div>
  <div class="h1" data-zh="两党斗争的牺牲品？" data-en="A casualty of partisan war?"></div>
  <div class="tagrow" id="sayTag"></div>
</div>
<div class="hu" id="hu"><span class="h2" data-zh="胡锡进" data-en="Hu Xijin"></span><span id="huTag"></span></div>
<div class="days" id="days">
  <div class="card" id="d1"><div class="eyebrow" data-zh="11 月 9 日" data-en="Nov 9"></div>
    <div class="h2" data-zh="民主党和建制派<br>搞黄仁勋 → 搞特朗普" data-en="Democrats and the establishment<br>target Huang → Trump"></div></div>
  <div class="card" id="d2"><div class="eyebrow" data-zh="11 月 10 日" data-en="Nov 10"></div>
    <div class="h2" data-zh="两党恶斗的<br>政治牺牲品" data-en="Casualty of a<br>two-party feud"></div></div>
</div>
<div class="aim h2" id="aim" data-zh='矛头：<span class="accent">民主党</span>' data-en='First blamed: <span class="accent">Democrats</span>'></div>

<!-- 屏 B -->
<svg id="ax" width="1920" height="1080"></svg>
<div class="pt" id="p1" style="left:540px">
  <figure class="slot av" data-nocap data-src="img/source/commons/Kevin_Cramer__official_portrait__116th_congress_(cropped).jpg" style="--s:84px"></figure>
  <div class="h2" data-zh='克雷默<span class="role">共和党参议员</span>' data-en='Cramer<span class="role">Republican Senator</span>'></div>
  <div class="caption" id="p1c" data-zh="公开要他下台" data-en="Said he should go"></div></div>
<div class="pt" id="p3" style="left:1400px">
  <figure class="slot av" data-nocap data-src="img/source/commons/Rep-Hakeem-Jeffries-Official-Portrait_(cropped).jpg" style="--s:84px"></figure>
  <div class="h2" data-zh="民主党众院领袖" data-en="Top House Democrat"></div>
  <div class="caption" id="jq"></div></div>
<div class="band" id="band">
  <figure class="slot av" data-nocap data-src="img/source/commons/Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg" style="--s:60px; --pos:50% 18%"></figure>
  <span class="body" data-zh="特朗普（共和党）：一直力挺" data-en="Trump, a Republican: backed him"></span></div>
<div class="none h2" id="none" data-zh='哪一党推他下台：<span class="accent">无记录</span>' data-en='Party pushing him out: <span class="accent">no record</span>'></div>

<!-- 屏 C -->
<div class="rs h2" id="rs" data-zh="董事会的理由" data-en="The board’s own reasons"></div>
<div class="stack" id="stack">
  <div class="card" id="k1"><span data-icon="letter" data-size="56"></span><span class="h2" data-zh="认了不忠" data-en="His admission"></span><span class="pill ok" data-zh="已证实" data-en="Confirmed"></span></div>
  <div class="card" id="k2"><span data-icon="person" data-size="56"></span><span class="h2" data-zh="与下属的感情" data-en="Another relationship"></span><span id="k2t"></span></div>
  <div class="card" id="k3"><span data-icon="court" data-size="56"></span><span class="h2" data-zh="股东集体诉讼" data-en="Shareholder class action"></span><span class="pill ok" data-zh="已立案" data-en="Filed Nov 9"></span></div>
</div>

<!-- 屏 D -->
<div class="cc" id="cc">
  <div class="ln" id="c1"><span class="mk"><svg width="84" height="84" viewBox="0 0 84 84"><path id="xA" d="M18 18 L66 66" stroke="var(--d-bad)" stroke-width="9" stroke-linecap="round" fill="none"/><path id="xB" d="M66 18 L18 66" stroke="var(--d-bad)" stroke-width="9" stroke-linecap="round" fill="none"/></svg></span>
    <div><div class="h1" data-zh="有人故意牺牲他" data-en="Sacrificed on purpose"></div><div class="caption" data-zh="站不住" data-en="Doesn’t hold up"></div></div></div>
  <div class="ln" id="c2"><span class="mk"><svg width="84" height="84" viewBox="0 0 84 84"><path id="ck" d="M12 44 L34 66 L74 20" stroke="var(--d-good)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
    <div><div class="h1" data-zh="被卷进别人的争斗" data-en="Caught in others’ fight"></div><div class="caption" data-zh="属实，但无记录说他因此下台" data-en="True, but no sign it’s why he left"></div></div></div>
</div>

<script>
const T = EDU.tl, C = css;
document.getElementById("sayTag").innerHTML = pill("comment", "评论", "Commentary");
document.getElementById("huTag").innerHTML = pill("comment", "据香港 01 转述 · 评论", "As relayed by HK01 · commentary");
document.getElementById("k2t").innerHTML = pill("reported", "匿名报道", "Unnamed sources");
document.getElementById("jq").innerHTML = L("辞职后：说「是对的」", "After he quit:<br>“" + Q.jeffries.replace(/^was /, "") + "”");
const CR = "img/source/commons/Kevin_Cramer__official_portrait__116th_congress_(cropped).jpg", JF = "img/source/commons/Rep-Hakeem-Jeffries-Official-Portrait_(cropped).jpg",
      TR = "img/source/commons/Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg";

// 时间轴：11-09 → 11-12；11-11 辞职
const ax = document.getElementById("ax");
const X = d => 300 + (d - 9) * 440, AY = 540;
const axis = svgEl(ax, "line", { x1: 230, x2: 1690, y1: AY, y2: AY, class: "axis-base" });
const ticks = [9, 10, 11, 12].map(d => [svgEl(ax, "circle", { cx: X(d), cy: AY, r: 7, fill: C("--faint") }),
  svgText(ax, X(d), AY + 46, L(`11 月 ${d} 日`, `Nov ${d}`), 26, C("--sub"), "middle", 500)]);
const rz = svgEl(ax, "line", { x1: X(11), x2: X(11), y1: 230, y2: AY + 10, stroke: C("--ink"), "stroke-width": 4, "stroke-dasharray": "10 10" });
const rzT = svgText(ax, X(11), 214, L("辞职", "Resigns"), 34, C("--ink"), "middle", 700);
const pin = (d, col) => svgEl(ax, "circle", { cx: X(d), cy: AY, r: 14, fill: col, stroke: C("--surface"), "stroke-width": 4 });
const pin1 = pin(10, C("--accent")), pin3 = pin(12, C("--ink2"));
const st1 = svgEl(ax, "line", { x1: X(10), x2: X(10), y1: 470, y2: AY - 14, stroke: C("--accent"), "stroke-width": 3 });
const st3 = svgEl(ax, "line", { x1: X(12), x2: X(12), y1: 470, y2: AY - 14, stroke: C("--ink2"), "stroke-width": 3 });

gsap.set(["#say", "#sayTag", "#hu", "#days", "#d1", "#d2", "#aim", "#p1", "#p3", "#band", "#none", "#rs", "#stack", "#k1", "#k2", "#k3", "#cc", "#c1", "#c2"], { opacity: 0 });
gsap.set([axis, ...ticks.flat(), rz, rzT, pin1, pin3, st1, st3, "#xA", "#xB", "#ck"], { opacity: 0 });
EDU.in(".eb", 0);

// l49 流行说法：两党斗争的牺牲品
EDU.in("#say", EDU.t("l49", .05));
EDU.in("#sayTag", EDU.t("l49", .4), { y: 0 });
// l50 据香港 01 转述，胡锡进 11-09：民主党和建制派搞黄仁勋、进而搞特朗普
EDU.out("#say", EDU.t("l50", 0));
EDU.in("#hu", EDU.t("l50", .05));
EDU.in("#days", EDU.t("l50", 0), { y: 0, d: .01 });
EDU.in("#d1", EDU.t("l50", .2));
srcNote("香港 01 · 2026-11-09、11-10（转述，非原话）", "HK01, Nov 9 and 10, 2026 (paraphrased, not verbatim)", EDU.t("l50", .2), EDU.end("l52") + .1);
// l51 第二天：两党恶斗的政治牺牲品
EDU.dim("#d1", EDU.t("l51", 0), .15);
EDU.out("#huTag", EDU.t("l51", 0), { y: 0 });
EDU.in("#d2", EDU.t("l51", .05));
// l52 一开始的矛头指向民主党
EDU.dim("#d2", EDU.t("l52", 0), .28);
T.to("#d1", { opacity: 1, duration: .5, ease: "expo.out" }, EDU.t("l52", 0));
EDU.dim("#d2", EDU.t("l52", 0), .15);
EDU.in("#aim", EDU.t("l52", .15));

// l53 对记录：辞职前公开要他下台的议员只找到一位——共和党参议员克雷默
EDU.out(["#hu", "#days", "#aim"], EDU.t("l53", 0));
EDU.in([axis, ...ticks.flat()], EDU.t("l53", .05), { stagger: .03 });
EDU.in([rz, rzT], EDU.t("l53", .2));
EDU.in([st1, pin1], EDU.t("l53", .4));
EDU.in("#p1", EDU.t("l53", .45));
srcNote(withCred("克雷默 2026-11-10（对 Politico，经路透社）", CR), withCred("Cramer, Nov 10, 2026 (to Politico, via Reuters)", CR), EDU.t("l53", .3), EDU.end("l53") + .1);
// l54 共和党总统特朗普一直力挺（克雷默只留名字与党派）
EDU.out("#p1c", EDU.t("l54", 0), { y: 0 });
EDU.dim("#p1", EDU.t("l54", 0), .5);
EDU.in("#band", EDU.t("l54", .05));
srcNote(withCred("特朗普 2026-11-09（《纽约时报》）", TR), withCred("Trump, Nov 9, 2026 (The New York Times)", TR), EDU.t("l54", .2), EDU.end("l54") + .1);
// l55 民主党众院领袖说辞职「是对的」——在他辞职以后
EDU.dim("#band", EDU.t("l55", 0), .2);
EDU.in([st3, pin3], EDU.t("l55", .05));
EDU.in("#p3", EDU.t("l55", .1));
srcNote(withCred("民主党众院领袖 2026-11-12（经 CNBC）", JF), withCred("House Democratic leader, Nov 12, 2026 (via CNBC)", JF), EDU.t("l55", .2), EDU.end("l55") + .1);
// l56 没有记录显示哪一党在推他下台
EDU.out("#jq", EDU.t("l56", 0), { y: 0 });
EDU.dim("#p3", EDU.t("l56", 0), .5);
EDU.in("#none", EDU.t("l56", .1));

// l57 董事会自己的理由就够了：认了不忠、另一段关系的报道、股东集体诉讼
EDU.out(["#ax", "#p1", "#p3", "#band", "#none"], EDU.t("l57", 0));
EDU.in("#rs", EDU.t("l57", .03));
EDU.in("#stack", EDU.t("l57", 0), { y: 0, d: .01 });
EDU.in("#k1", EDU.t("l57", .15));
EDU.in("#k2", EDU.t("l57", .4));
EDU.in("#k3", EDU.t("l57", .68));
srcNote("致员工信 2026-11-08 ·《纽约时报》2026-11-11（匿名信源）· 加州北区联邦法院 5:26-cv-13448", "Staff letter, Nov 8 · The New York Times, Nov 11 (unnamed sources) · Northern District of California 5:26-cv-13448", EDU.t("l57", .2), EDU.end("l57") + .1);

// l58 结论：「有人故意牺牲他」站不住；「卷进别人的争斗、付了代价」只说得通一部分
EDU.out(["#rs", "#stack"], EDU.t("l58", 0));
EDU.in("#cc", EDU.t("l58", 0), { y: 0, d: .01 });
EDU.in("#c1", EDU.t("l58", .05));
drawPart("#xA", EDU.t("l58", .2), 1, .35); drawPart("#xB", EDU.t("l58", .2) + .3, 1, .35);
EDU.in("#c2", EDU.t("l58", .5));
drawPart("#ck", EDU.t("l58", .62), .5, .6);      // 半个勾
ourTake(["l56", "l58"]);
EDU.out("#cc", EDU.S.duration - .5);
</script>
