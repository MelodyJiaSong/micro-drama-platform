<style>
  /* 屏 A：国会两党（收紧）｜白宫（放行），黄仁勋在白宫一侧 */
  .two { position: absolute; left: var(--mx); right: var(--mx); top: 170px; display: flex; gap: 80px; align-items: flex-start; }
  .two .card { flex: 1 1 0; min-width: 0; padding: 34px 40px; }
  .hd { display: flex; align-items: center; gap: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--hair); }
  .hd .h2 { white-space: nowrap; }
  html[lang=en] .hd .h2 { white-space: normal; line-height: 1.15; }
  .thumb { width: 96px; flex: none; }
  .thumb img { height: 96px !important; border-radius: 18px !important; }
  .row { padding: 18px 0 16px; border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: 0; }
  .row .eyebrow { display: block; }
  .row .h1 { margin-top: 2px; white-space: nowrap; }
  .row .h2 { margin-top: 6px; }
  .row .caption { margin-top: 2px; color: var(--ink2); }
  .row .body { margin-top: 4px; }
  .who { display: flex; align-items: center; gap: 18px; }
  .who .avs { display: flex; gap: 10px; }
  .hu { display: flex; align-items: center; gap: 20px; }
  .hu .body { color: var(--ink2); }
  .hu .ring { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; flex: none; }
  .so { position: absolute; left: 0; right: 0; top: 800px; text-align: center; }
  .qt .h2 { font-weight: 700; }

  /* 屏 B：民主党｜共和党，交叉箭头，最后只剩一条线 */
  .bt { position: absolute; left: 0; right: 0; top: 160px; text-align: center; }
  .pp { position: absolute; top: 300px; width: 680px; padding: 36px 42px; }
  #pd { left: var(--mx); } #pr { right: var(--mx); }
  .pp .h2 { margin-top: 14px; }
  .pp .caption { margin-top: 6px; color: var(--ink2); }
  .pp .act { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
  #cx { position: absolute; left: 0; top: 0; }
  .wl { position: absolute; left: 640px; width: 640px; top: 690px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .wl .caption { color: var(--ink2); }
  .side { position: absolute; top: 560px; width: 680px; text-align: center; }
  #sd { left: var(--mx); } #sr { right: var(--mx); }
</style>

<div class="eb eyebrow" data-zh="03 · 两党都借它追问" data-en="03 · Both parties press"></div>

<!-- 屏 A -->
<div class="two" id="two">
  <div class="card" id="cg">
    <div class="hd"><figure class="slot thumb" data-nocap data-src="img/source/commons/United_States_Capitol_west_front_edit2.jpg"></figure>
      <span class="h2" data-zh="国会两党：有人要收紧" data-en="Congress, both parties: tighten"></span></div>
    <div class="row" id="g1">
      <span class="eyebrow" data-zh="2025 年 10 月 · 参议院" data-en="Oct 2025 · Senate"></span>
      <div class="h1"><span id="v77">—</span> : <span id="v20">—</span></div>
      <div class="caption" data-zh="限制对华卖芯片的条款" data-en="Limits on chip sales to China"></div></div>
    <div class="row" id="g2">
      <div class="who"><div class="avs">
          <figure class="slot av" data-nocap data-src="img/source/commons/Jim_Banks_Official_Senate_Portrait_(cropped).jpg" style="--s:72px"></figure>
          <figure class="slot av" data-nocap data-src="img/source/commons/Elizabeth_Warren__official_portrait__114th_Congress.jpg" style="--s:72px"></figure></div>
        <span class="eyebrow" data-zh="2026 年 3 月 · 两党各一位参议员" data-en="Mar 2026 · one senator per party"></span></div>
      <div class="body" data-zh="要商务部复审英伟达出口许可" data-en="Review Nvidia’s export licenses"></div></div>
  </div>
  <div class="card" id="cw">
    <div class="hd"><figure class="slot av" data-nocap data-src="img/source/commons/Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg" style="--pos:50% 18%"></figure>
      <span class="h2" data-zh="白宫：在放行" data-en="White House: loosening"></span></div>
    <div class="row hu" id="hu">
      <figure class="slot av" data-nocap data-src="img/source/commons/Jensen_Huang_Stanford_2026-04-30_010_(cropped).jpg" style="--s:80px; --pos:50% 25%"></figure>
      <span class="body" data-zh="黄仁勋：丑闻来时在这边" data-en="Huang: on this side"></span></div>
    <div class="row qt" id="w1">
      <span class="eyebrow" data-zh="特朗普 · 2025 年 8 月" data-en="Trump · Aug 2025"></span>
      <div class="h2"><span class="hlq" id="q1"></span></div>
      <div class="caption" data-zh="「给国家付钱」才放行一款对华芯片" data-en=""></div></div>
    <div class="row qt" id="w2">
      <span class="eyebrow" data-zh="特朗普 · 丑闻后 · 11 月 9 日" data-en="Trump · after the scandal · Nov 9"></span>
      <div class="h2"><span class="hlq" id="q2"></span></div>
      <div class="caption" data-zh="「一个非常正派的人」" data-en=""></div></div>
  </div>
</div>
<div class="so body sub" id="so" data-zh="→ 于是两党都借这件事追问" data-en="→ So both parties pressed"></div>

<!-- 屏 B -->
<div class="bt h2" id="bt" data-zh="丑闻之后" data-en="After the scandal"></div>
<svg id="cx" width="1920" height="1080"></svg>
<div class="pp card" id="pd">
  <div class="eyebrow" data-zh="民主党" data-en="Democrats"></div>
  <div class="act"><figure class="slot av" data-nocap data-src="img/source/commons/Chuck_Schumer_official_photo_(cropped).jpg" style="--s:80px"></figure>
    <div><div class="h2" data-zh="冲着特朗普" data-en="Aim at Trump"></div>
    <div class="caption" data-zh="追问：有官员被告知别查？" data-en="Were officials told not to probe?"></div></div></div>
</div>
<div class="pp card" id="pr">
  <div class="eyebrow" data-zh="共和党" data-en="Republicans"></div>
  <div class="h2" data-zh="追商务部" data-en="Go after Commerce"></div>
  <div class="caption" id="bill" data-zh="推出口管制法案" data-en="Push export control bills"></div>
</div>
<div class="wl" id="wl"><figure class="slot av" data-nocap data-src="img/source/commons/Elizabeth_Warren__official_portrait__114th_Congress.jpg" style="--s:64px"></figure>
  <span class="caption" data-zh="民主党沃伦：也挺共和党人的法案" data-en="Warren (D) backs a GOP bill too"></span></div>
<div class="side h1" id="sd" data-zh='<span class="accent">点名</span>特朗普' data-en='<span class="accent">Name</span> Trump'></div>
<div class="side h1" id="sr" data-zh="不点名" data-en="Don’t"></div>

<script>
const T = EDU.tl, C = css;
document.getElementById("q1").textContent = "“" + Q.trump1 + "”";
document.getElementById("q2").textContent = "“" + Q.trump2 + "”";
const HU = "img/source/commons/Jensen_Huang_Stanford_2026-04-30_010_(cropped).jpg", TR = "img/source/commons/Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg",
      CAP = "img/source/commons/United_States_Capitol_west_front_edit2.jpg", BK = "img/source/commons/Jim_Banks_Official_Senate_Portrait_(cropped).jpg", WR = "img/source/commons/Elizabeth_Warren__official_portrait__114th_Congress.jpg",
      SC = "img/source/commons/Chuck_Schumer_official_photo_(cropped).jpg";

gsap.set(["#two", "#cg", "#cw", "#g1", "#g2", "#hu", "#w1", "#w2", "#so", "#bt", "#pd", "#pr", "#wl", "#sd", "#sr"], { opacity: 0 });
EDU.in(".eb", 0);

// l39 我们的判断：国会两党都有人要收紧，白宫在放
EDU.in("#two", EDU.t("l39", 0), { y: 0, d: .01 });
EDU.in("#cg", EDU.t("l39", .15));
EDU.in("#cw", EDU.t("l39", .55));
srcNote(withCred("", CAP, TR).replace(/^ · /, ""), withCred("", CAP, TR).replace(/^ · /, ""), EDU.t("l39", .3), EDU.end("l39") + .1);
// l40 丑闻来时，黄仁勋站在白宫这边；于是两党都借这件事追问
EDU.in("#hu", EDU.t("l40", .05));
EDU.in("#so", EDU.t("l40", .55));
srcNote(cred(HU), cred(HU), EDU.t("l40", .2), EDU.end("l40") + .1);

// l41 收紧：2025-10 参议院 77:20
EDU.out("#so", EDU.t("l41", 0));
EDU.in("#g1", EDU.t("l41", .05));
EDU.count("#v77", EDU.t("l41", .3), N.senate[0], 1.0, v => String(Math.round(v)));
EDU.count("#v20", EDU.t("l41", .3), N.senate[1], 1.0, v => String(Math.round(v)));
srcNote("Washington Technology · 2025-10-14", "Washington Technology · Oct 14, 2025", EDU.t("l41", .2), EDU.end("l41") + .1);
// l42 2026-03 两党各一位参议员联名，要商务部复审英伟达出口许可
EDU.dim("#g1", EDU.t("l42", 0), .45);
EDU.in("#g2", EDU.t("l42", .05));
srcNote(withCred("参院银行委少数党新闻稿 · 2026-03-24", BK, WR), withCred("Senate Banking minority release · Mar 24, 2026", BK, WR), EDU.t("l42", .2), EDU.end("l42") + .1);

// l43 放行：特朗普「给国家付钱」
EDU.dim(["#cg", "#hu"], EDU.t("l43", 0), .28);
EDU.in("#w1", EDU.t("l43", .05));
brush("#q1", EDU.t("l43", .45));
srcNote("特朗普 2025-08-11（NPR，经 Ideastream）", "Trump, Aug 11, 2025 (NPR via Ideastream)", EDU.t("l43", .2), EDU.end("l43") + .1);
// l44 丑闻后：「一个非常正派的人」
EDU.dim("#w1", EDU.t("l44", 0), .28);
EDU.in("#w2", EDU.t("l44", .05));
brush("#q2", EDU.t("l44", .35));
srcNote("特朗普 2026-11-09（《纽约时报》，经 Star-Advertiser）", "Trump, Nov 9, 2026 (NYT via Star-Advertiser)", EDU.t("l44", .2), EDU.end("l44") + .1);

// l45 丑闻一来：民主党冲着特朗普，追问有没有官员被告知别查
EDU.out("#two", EDU.t("l45", 0));
EDU.in("#bt", EDU.t("l45", .03));
EDU.in("#pd", EDU.t("l45", .1));
srcNote(withCred("舒默 · 2026-11-12（经 CNBC 直播）", SC), withCred("Schumer · Nov 12, 2026 (via CNBC live)", SC), EDU.t("l45", .2), EDU.end("l45") + .1);
// l46 共和党追商务部，推出口管制法案
EDU.in("#pr", EDU.t("l46", .05));
srcNote("共和党几位委员会主席 · 2026-11-12（经 CNBC 直播）", "GOP committee chairs · Nov 12, 2026 (via CNBC live)", EDU.t("l46", .2), EDU.end("l46") + .1);
// l47 分不干净：民主党的沃伦也挺共和党人的收紧法案（交叉箭头）
const R = id => document.querySelector(id).getBoundingClientRect();
const cx = document.getElementById("cx");
const rd = R("#pd"), rr = R("#pr");
const x0 = rd.right - 60, y0 = rd.bottom, x1 = rr.left + 60, y1 = rr.bottom;
const cross = svgEl(cx, "path", { d: `M${x0},${y0 + 10} C${x0 + 60},${y0 + 150} ${x1 - 60},${y1 + 150} ${x1},${y1 + 16}`, fill: "none", stroke: C("--accent"), "stroke-width": 5, "stroke-linecap": "round", opacity: 0 });
const crossH = svgEl(cx, "path", { d: `M${x1},${y1 + 4} l-14,24 l26,4 Z`, fill: C("--accent"), opacity: 0 });
T.set(cross, { opacity: 1 }, EDU.t("l47", .1)); EDU.draw(cross, EDU.t("l47", .1), 1.0);
T.to(crossH, { opacity: 1, duration: .2 }, EDU.t("l47", .1) + .95);
EDU.in("#wl", EDU.t("l47", .3));
srcNote(withCred("沃伦 · 2026-11-12（经 CNBC 直播）", WR), withCred("Warren · Nov 12, 2026 (via CNBC live)", WR), EDU.t("l47", .2), EDU.end("l47") + .1);
// l48 真正分得开的只有一条：点不点名特朗普（其余退后，只剩一条线）
EDU.out(["#wl", cross, crossH], EDU.t("l48", 0));
EDU.dim(["#pd", "#pr"], EDU.t("l48", 0), .2);
const div = svgEl(cx, "path", { d: "M960,290 L960,800", stroke: C("--ink"), "stroke-width": 6, "stroke-linecap": "round", fill: "none", opacity: 0 });
T.set(div, { opacity: 1 }, EDU.t("l48", .1)); EDU.draw(div, EDU.t("l48", .1), .9);
EDU.in("#sd", EDU.t("l48", .3));
EDU.in("#sr", EDU.t("l48", .45));
ourTake(["l39", "l40", "l48"]);
EDU.out(["#bt", "#pd", "#pr", "#cx", "#sd", "#sr"], EDU.S.duration - .5);
</script>
