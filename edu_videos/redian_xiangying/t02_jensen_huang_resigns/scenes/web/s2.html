<script>
const T = EDU.tl, C = css;
document.getElementById("tkq").textContent = EN ? "“" + Q.tenk + "”" : "「实际上被排除在外」";
// 外交部原话只截关键词（台词审 lines_r1 I37）：「停止编造“间谍叙事”」与「科技封锁」，整句在口播里
if (!EN) {
  document.getElementById("mqq").innerHTML = "停止编造「" + Q.mfa2_kw + "」";
  document.getElementById("mqb").innerHTML = '为<span class="hlq" id="mqh">' + Q.mfa2_kw2 + "</span>找借口";
}

// ---- 闸门图 ----
const g = document.getElementById("gd");
const US = [110, 190], CN = [890, 190], SEA = [520, 470], GX = 650;
const node = ([x, y], zh, en) => {
  const c = svgEl(g, "circle", { cx: x, cy: y, r: 82, fill: C("--surface"), stroke: C("--hair"), "stroke-width": 3 });
  const t = svgText(g, x, y + 14, L(zh, en), 40, C("--ink"), "middle", 700);
  return [c, t];
};
const nUS = node(US, "美国", "US"), nCN = node(CN, "中国", "China");
const lane = svgEl(g, "path", { d: `M${US[0] + 90},${US[1]} L${CN[0] - 90},${CN[1]}`, stroke: C("--hair"), "stroke-width": 4, "stroke-dasharray": "2 12", "stroke-linecap": "round", fill: "none" });
const gate = svgEl(g, "rect", { x: GX - 9, y: 90, width: 18, height: 200, rx: 9, fill: C("--ink") });
const gateOpen = svgEl(g, "rect", { x: GX - 9, y: 90, width: 18, height: 200, rx: 9, fill: "none", stroke: C("--faint"), "stroke-width": 3, "stroke-dasharray": "8 8" });
const chipG = svgEl(g, "g", { transform: `translate(${US[0] + 120},${US[1] - 34})` });
chipG.innerHTML = `<svg width="68" height="68" viewBox="0 0 64 64" fill="${C("--accent-soft")}" stroke="${C("--accent")}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${ICONS.chip}</svg>`;
// 绕道东南亚的虚线箭头（示意）
const det = svgEl(g, "path", { d: `M${US[0] + 70},${US[1] + 60} C${US[0] + 120},${SEA[1]} ${SEA[0] - 200},${SEA[1]} ${SEA[0] - 70},${SEA[1]} M${SEA[0] + 70},${SEA[1]} C${SEA[0] + 220},${SEA[1]} ${CN[0] - 60},${CN[1] + 200} ${CN[0] - 30},${CN[1] + 92}`,
  fill: "none", stroke: C("--accent"), "stroke-width": 5, "stroke-linecap": "round" });
const detHead = svgEl(g, "path", { d: `M${CN[0] - 30},${CN[1] + 86} l-16,22 l26,4 Z`, fill: C("--accent") });
const nSEA = [svgEl(g, "circle", { cx: SEA[0], cy: SEA[1], r: 70, fill: C("--accent-soft"), stroke: C("--accent"), "stroke-width": 3 }),
              ...(EN ? [svgText(g, SEA[0], SEA[1] - 4, "Southeast", 26, C("--accent-text"), "middle", 700), svgText(g, SEA[0], SEA[1] + 26, "Asia", 26, C("--accent-text"), "middle", 700)]
                     : [svgText(g, SEA[0], SEA[1] + 12, "东南亚", 34, C("--accent-text"), "middle", 700)])];
const illTag = document.createElement("div");
illTag.id = "illTag"; illTag.innerHTML = pill("ill");
illTag.style.cssText = "position:absolute; left:" + (120 + 1000) + "px; top:820px; transform:translateX(-100%);";
STAGE.appendChild(illTag);
const ill = illTag;

gsap.set(["#ask", "#rc1", "#chipImg", "#rc1b", "#tk", "#rc3", "#sgc", "#sg", "#w0", "#w1", "#w2", "#w3", "#chain", "#mag", "#n1", "#n2", "#n3", "#lensT",
          "#hkT", "#hang", "#h1", "#h2", "#h3", "#h3b", "#mq", "#agree"], { opacity: 0 });
gsap.set([...nUS, ...nCN, lane, gate, gateOpen, chipG, det, detHead, ...nSEA, ill], { opacity: 0 });
EDU.in(".eb", 0);

// l24 凭什么惊动这么多机构？
EDU.in("#ask", EDU.t("l24", .05));

// l25 英伟达卖 AI 芯片；最先进的能否卖给中国 = 主战场（sd2 机房盖在闸门图上）
EDU.out("#ask", EDU.t("l25", 0));
EDU.in([...nUS, ...nCN, lane], EDU.t("l25", .05));
EDU.in(gateOpen, EDU.t("l25", .1));
EDU.in(chipG, EDU.t("l25", .1));
EDU.in("#rc1", EDU.t("l25", .05));
EDU.in("#chipImg", EDU.t("l25", .1));
EDU.in("#rc1b", EDU.t("l25", .45));
T.to(chipG, { attr: { transform: `translate(${GX - 110},${US[1] - 34})` }, duration: 1.4, ease: "power2.inOut" }, Math.max(EDU.t("l25", .62), footEnd("v2") - .2));
EDU.in(ill, EDU.t("l25", .3));
// l26 10-K：「effectively foreclosed」，闸门落下
EDU.out("#rc1", EDU.t("l26", 0));
EDU.in("#tk", EDU.t("l26", .05));
T.to(gateOpen, { opacity: 0, duration: .3 }, EDU.t("l26", .1));
T.fromTo(gate, { opacity: 0, attr: { height: 0 } }, { opacity: 1, attr: { height: 200 }, duration: .7, ease: "power3.out", immediateRender: false }, EDU.t("l26", .1));
brush("#tkq", EDU.t("l26", .4));
srcNote("英伟达 10-K 年报（截至 2026 财年末）· 原文 “" + Q.tenk + "”", "Nvidia 10-K (as of fiscal 2026 year-end)", EDU.t("l26", .2), EDU.end("l26") + .1);

// l27 美国最怕：绕道东南亚（sd3 港口盖在图上；箭头在下面画好）
EDU.out("#tk", EDU.t("l27", 0));
EDU.in("#rc3", EDU.t("l27", .05));
EDU.in(nSEA, EDU.t("l27", .2));
T.set([det, detHead], { opacity: 1 }, EDU.t("l27", .3));
EDU.draw(det, EDU.t("l27", .3), 1.4);
T.fromTo(detHead, { opacity: 0 }, { opacity: 1, duration: .3, immediateRender: false }, EDU.t("l27", .3) + 1.3);
// l28 那家新加坡公司：新加坡警方在查，美国出口管制部门上门核查过（左边闸门图退后，只看右卡：I33）
EDU.out("#rc3", EDU.t("l28", 0));
EDU.dim(["#gd", ill], EDU.t("l28", 0), .2);
EDU.in("#sgc", EDU.t("l28", .05));
EDU.in("#sg", EDU.t("l28", .1));
EDU.in("#w0", EDU.t("l28", .4));
EDU.in("#w1", EDU.t("l28", .65));
srcNote("新加坡内政部 · 2026-11-12", "Singapore Ministry of Home Affairs · Nov 12, 2026", EDU.t("l28", .2), EDU.end("l29") + .1);
// l29 美国出口管制部门核查过；公司否认违规（「无结论」口播说，不再另贴：I34、I9）。她本人那行退后
EDU.out("#w0", EDU.t("l29", 0), { y: 0 }); T.set("#w0", { display: "none" }, EDU.t("l29", 0) + .46);
EDU.out(["#gd", ill], EDU.t("l29", 0), { y: 0 });
EDU.in("#w2", EDU.t("l29", .05));
EDU.in("#w3", EDU.t("l29", .45));

// l30 线接上了：最要紧的芯片 → 被怀疑转运的客户 → 跟 CEO 走得近的人
EDU.out("#sgc", EDU.t("l30", 0));
EDU.in("#chain", EDU.t("l30", 0), { y: 0, d: .01 });
const cs = document.getElementById("chs");
const R = id => document.querySelector(id).getBoundingClientRect();
const arrows = [["#n1", "#n2"], ["#n2", "#n3"]].map(([a, b]) => {
  const ra = R(a), rb = R(b), y = ra.top + ra.height / 2;
  const p = svgEl(cs, "path", { d: `M${ra.right + 14},${y} L${rb.left - 26},${y}`, stroke: C("--accent"), "stroke-width": 5, "stroke-linecap": "round", fill: "none", opacity: 0 });
  const h = svgEl(cs, "path", { d: `M${rb.left - 12},${y} l-20,-12 l0,24 Z`, fill: C("--accent"), opacity: 0 });
  return [p, h];
});
EDU.in("#n1", EDU.t("l30", .25));
[[arrows[0], .45, "#n2"], [arrows[1], .7, "#n3"]].forEach(([[p, h], f, n]) => {
  T.set(p, { opacity: 1 }, EDU.t("l30", f)); EDU.draw(p, EDU.t("l30", f), .5);
  T.to(h, { opacity: 1, duration: .2 }, EDU.t("l30", f) + .45);
  EDU.in(n, EDU.t("l30", f) + .4);
});
// l31 放大镜罩上去：一件私事 → 国家安全的放大镜下
// 链条收起，换成放大镜画面（AI 生成）；没有图时链条留着、只退后
EDU.dim(["#chain", "#chs"], EDU.t("l31", 0), document.getElementById("mag") ? 0 : .35);
EDU.in("#mag", EDU.t("l31", .05));
EDU.in("#lensT", EDU.t("l31", .3));

// l32 各方的动作，挂的都是同一个钩子
EDU.out(["#chain", "#chs", "#mag", "#lensT"], EDU.t("l32", 0));
const hk = document.getElementById("hk");
const hook = svgEl(hk, "path", { d: "M960,96 L960,210 a42,42 0 0 1 -84,0 l0,-22", fill: "none", stroke: C("--accent"), "stroke-width": 12, "stroke-linecap": "round" });
const rail = svgEl(hk, "path", { d: "M300,300 L1620,300", stroke: C("--ink2"), "stroke-width": 5, "stroke-linecap": "round", fill: "none" });
const tie = svgEl(hk, "path", { d: "M918,252 L918,300", stroke: C("--ink2"), "stroke-width": 5, fill: "none" });
gsap.set([hook, rail, tie], { opacity: 0 });
T.set(hook, { opacity: 1 }, EDU.t("l32", .1)); EDU.draw(hook, EDU.t("l32", .1), .8);
T.set([tie, rail], { opacity: 1 }, EDU.t("l32", .35)); EDU.draw(tie, EDU.t("l32", .35), .3); EDU.draw(rail, EDU.t("l32", .45), .8);
EDU.in("#hkT", EDU.t("l32", .3));
EDU.in("#hang", EDU.t("l32", 0), { y: 0, d: .01 });
const hangs = ["#h1", "#h2", "#h3"].map(id => {
  const r = R(id), x = r.left + r.width / 2;
  return svgEl(hk, "path", { d: `M${x},300 L${x},${r.top}`, stroke: C("--ink2"), "stroke-width": 3, "stroke-dasharray": "6 8", fill: "none", opacity: 0 });
});
const hangAt = (i, cue) => { EDU.in(hangs[i], EDU.t(cue, .05)); EDU.in(["#h1", "#h2", "#h3"][i], EDU.t(cue, .1)); };
// l33 董事会：凭「外国情报活动」报道
hangAt(0, "l33");
srcNote("英伟达董事会声明 · 2026-11-08", "Nvidia board statement · Nov 8, 2026", EDU.t("l33", .2), EDU.end("l33") + .1);
// l34 国会三位共和党主席：以国家安全为由请他闭门简报
EDU.dim("#h1", EDU.t("l34", 0), .28);
hangAt(1, "l34");
const CAP = "img/source/commons/United_States_Capitol_west_front_edit2.jpg";
srcNote(withCred("众院三个委员会主席的邀请", CAP), withCred("Invitation from three House committee chairs", CAP), EDU.t("l34", .2), EDU.end("l34") + .1);
// l35 众院对华委员会主席：国家安全第一的领导层
EDU.dim("#h2", EDU.t("l35", 0), .28);
hangAt(2, "l35");
const MO = "img/source/commons/John_Moolenaar_portrait_(118th_Congress).jpg";
srcNote(withCred("众院对华特别委员会主席声明 · 2026-11-12", MO), withCred("House China committee chair, statement · Nov 12, 2026", MO), EDU.t("l35", .2), EDU.end("l36") + .1);
// l36 还催国会赶紧立法，管住芯片出口
EDU.dim("#h3a", EDU.t("l36", 0), .22);
EDU.in("#h3b", EDU.t("l36", .05));

// l37 中国外交部：停止编造「间谍叙事」，为科技封锁找借口
EDU.out(["#hang", ...hangs], EDU.t("l37", 0));
const mqs = svgEl(hk, "path", { d: "M960,300 L960,400", stroke: C("--ink2"), "stroke-width": 3, "stroke-dasharray": "6 8", fill: "none", opacity: 0 });
EDU.in(mqs, EDU.t("l37", .05));
