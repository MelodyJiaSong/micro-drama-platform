<style>
  #axis { position: absolute; left: var(--mx); top: 150px; }
  .thesis { position: absolute; left: 0; right: 0; top: 480px; text-align: center; }
  .thesis2 { position: absolute; right: var(--mx); top: 344px; color: var(--ink2); font-weight: 600; white-space: nowrap; }
  .panel { position: absolute; left: var(--mx); right: var(--mx); top: 330px; height: 540px; }
  .panel .head .h2 { margin-top: 8px; }
  .panel .dia { position: absolute; left: 0; top: 150px; }
  .panel .right { position: absolute; left: 1140px; top: 150px; width: 540px; }
  .panel .right .row { display: flex; align-items: baseline; gap: 20px; padding: 14px 0; }
  .panel .right .h1, .panel .right .h2 { white-space: nowrap; }
  .panel .lab { position: absolute; white-space: nowrap; }
  .n15 { position: absolute; left: 0; top: 420px; display: flex; gap: 72px; }
  .n15 .row { display: flex; align-items: baseline; gap: 18px; }
  .chk { display: inline-flex; align-items: center; gap: 10px; color: var(--d-good); font-weight: 600; }
  .doc { display: flex; align-items: flex-start; gap: 14px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .doc i { flex: none; margin-top: 8px; width: 26px; height: 32px; border: 3px solid var(--ink2); border-radius: 4px; display: inline-block; }
  .now { position: absolute; left: 0; right: 0; top: 470px; text-align: center; }
  .now .body { margin-top: 18px; }
</style>

<div class="eb eyebrow" data-zh="02 · 最严重的几次故障" data-en="02 · The worst outages"></div>
<svg id="axis" width="1680" height="130"></svg>
<div class="thesis h1" id="thesis" data-zh="共同点：都在改动中" data-en="Each time: a change in progress"></div>
<div class="thesis2 body" id="thesis2" data-zh="共同点：都在改动中" data-en="Each time: a change in progress"></div>

<!-- 2009 -->
<div class="panel" id="p09">
  <div class="head"><div class="eyebrow" data-zh="2009-11 · 全国通信中断" data-en="Nov 2009 · nationwide outage"></div>
    <div class="h2" data-zh="同一张 FTI 网 · 同一承包商" data-en="Same FTI network, same contractor"></div></div>
  <svg class="dia" id="d09" width="1060" height="360"></svg>
  <div class="right" id="r09" style="left:0; width:1000px">
    <div class="row" id="r09b"><span class="display c-bad">129</span><span class="h2" data-zh="个设施" data-en="facilities"></span></div>
    <div class="row" id="r09c"><span class="h2" data-zh="中断 5 小时" data-en="5 hours down"></span><span class="h2 sub">·</span><span class="h2" data-zh="延误 820 班" data-en="820 flights delayed"></span></div>
  </div>
</div>

<!-- 2015 -->
<div class="panel" id="p15">
  <div class="head"><div class="eyebrow" data-zh="2015-08 · 华盛顿管制中心" data-en="Aug 2015 · Washington Center"></div>
    <div class="h2" data-zh="软件升级" data-en="Software upgrade"></div></div>
  <svg class="dia" id="d15" width="1060" height="250"></svg>
  <div class="n15">
    <div class="row" id="r15a"><span class="body sub" data-zh="延误" data-en="Delayed"></span><span class="h1" id="v15a">—</span><span class="h2" data-zh="班" data-en=""></span></div>
    <div class="row" id="r15b"><span class="body sub" data-zh="取消" data-en="Canceled"></span><span class="h1" id="v15b">—</span><span class="h2" data-zh="班" data-en=""></span></div>
  </div>
  <div class="right" id="ph15">
    <figure class="slot" data-src="img/source/commons/AirTraffic-8.jpg" style="--h:330px">
      <figcaption data-zh="华盛顿管制中心 · 图：FAA / Wikimedia Commons" data-en="Washington Center · Photo: FAA / Wikimedia Commons"></figcaption></figure>
  </div>
</div>

<!-- 2023 -->
<div class="panel" id="p23">
  <div class="head"><div class="eyebrow" data-zh="2023-01 · 航行通告系统" data-en="Jan 2023 · pilot notice system"></div>
    <div class="h2" data-zh="全国停飞" data-en="Nationwide ground stop"></div></div>
  <svg class="dia" id="d23" width="1060" height="300"></svg>
  <div class="right">
    <div class="h2" id="r23a" data-zh="30 多年的老系统" data-en="30+ years old"></div>
    <div class="caption" id="r23b" data-zh="政府问责署（GAO）" data-en="GAO"></div>
    <div class="body chk" id="ck2" style="margin-top:22px" data-zh="✓ 太老" data-en="✓ “Too old”"></div>
  </div>
</div>

<div class="now" id="now">
  <div class="h1" data-zh='2026：<span class="accent">可能</span>同一个坑' data-en='2026: <span class="accent">a possible</span> repeat'></div>
  <div class="body sub" data-zh="原因：未公布" data-en="Cause: not public yet"></div>
</div>

<script>
const T = EDU.tl;
const C = k => css(k);
// ---- 时间轴 2009 / 2015 / 2023 / 2026? ----
const ax = document.getElementById("axis");
const xr = y => 90 + (y - 2009) / 17 * 1500;
const base = svgEl(ax, "line", { x1: 40, x2: 1640, y1: 92, y2: 92, stroke: C("--hair"), "stroke-width": 3 });
const YRS = [[2009, "2009"], [2015, "2015"], [2023, "2023"], [2026, "2026?"]];
const nodes = YRS.map(([y, t]) => ({
  dot: svgEl(ax, "circle", { cx: xr(y), cy: 92, r: 13, fill: C("--faint"), stroke: C("--bg"), "stroke-width": 5 }),
  lab: (() => { const e = svgEl(ax, "text", { x: xr(y), y: 52, "text-anchor": "middle", "font-size": 38, "font-weight": 600, fill: C("--sub") }); e.textContent = t; return e; })(),
}));
const on = (i, at) => nodes.forEach((n, k) => {
  T.to(n.dot, { attr: { fill: k === i ? C("--accent") : C("--faint"), r: k === i ? 17 : 13 }, duration: .5, ease: "power2.out" }, at);
  T.to(n.lab, { attr: { fill: k === i ? C("--accent-text") : C("--sub") }, duration: .5 }, at);
});

// ---- 2009 示意：旧网 → 过渡路由器（配错）→ 错误被复制到新路由器 → 新光纤网 ----
const d9 = document.getElementById("d09");
const box = (g, x, y, w, h, fill, stroke, dash) => svgEl(g, "rect", { x, y, width: w, height: h, rx: 18, fill, stroke, "stroke-width": 4, ...(dash ? { "stroke-dasharray": dash } : {}) });
const txt = (g, x, y, s, size = 30, fill = C("--ink"), anchor = "middle", w = 600) => { const e = svgEl(g, "text", { x, y, "text-anchor": anchor, "font-size": size, "font-weight": w, fill }); e.textContent = s; return e; };
const gOld = svgEl(d9, "g"), gNew = svgEl(d9, "g");
box(gOld, 0, 40, 220, 100, C("--surface2"), C("--hair")); txt(gOld, 110, 101, L("旧网", "Old network"));
box(gNew, 836, 40, 220, 100, C("--accent-soft"), C("--accent")); txt(gNew, 946, 101, L("光纤网", "Fiber"));
const mig = svgEl(d9, "path", { d: "M228,90 L830,90", stroke: C("--ink2"), "stroke-width": 4, fill: "none", "stroke-dasharray": "2 0" });
const migHead = svgEl(d9, "path", { d: "M832,90 l-20,-11 l0,22 Z", fill: C("--ink2") });
const router = (x, y) => {
  const g = svgEl(d9, "g", { transform: `translate(${x},${y})` });
  svgEl(g, "circle", { r: 44, fill: C("--surface"), stroke: C("--ink"), "stroke-width": 5 });
  svgEl(g, "path", { d: "M-20,-10 h34 m-9,-9 l9,9 l-9,9 M20,12 h-34 m9,-9 l-9,9 l9,9", stroke: C("--ink"), "stroke-width": 4, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" });
  return g;
};
const bad = (x, y) => { const g = svgEl(d9, "g", { transform: `translate(${x},${y})` });
  svgEl(g, "circle", { r: 19, fill: C("--d-bad") });
  svgEl(g, "path", { d: "M-8,-8 L8,8 M8,-8 L-8,8", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round" }); return g; };
const rA = router(430, 90), xA = bad(468, 54);
const lA = txt(d9, 430, 22, L("过渡路由器", "LA bridge"), 28, C("--ink2"), "middle", 500);
const copy = svgEl(d9, "path", { d: "M466,124 C520,230 560,262 600,262", stroke: C("--d-bad"), "stroke-width": 4, fill: "none", "stroke-dasharray": "10 10" });
const rB = router(650, 262), xB = bad(688, 226);
const lB = txt(d9, 760, 272, L("新路由器", "New router"), 28, C("--ink2"), "start", 500);
const lC = txt(d9, 470, 300, L("复制", "Error copied"), 28, C("--d-bad"), "end", 600);
const g9 = [gOld, gNew, mig, migHead, rA, xA, lA, copy, rB, xB, lB, lC];

// ---- 2015 示意：内存格一格格被塞满 ----
const d15 = document.getElementById("d15");
const memL = txt(d15, 0, 40, L("内存", "Memory"), 30, C("--sub"), "start", 500);
const cells = d3.range(20).map(i => svgEl(d15, "rect", { x: i * 52, y: 70, width: 44, height: 110, rx: 8, fill: C("--surface2") }));
const memFull = txt(d15, 1036, 230, L("满了", "Full"), 34, C("--d-bad"), "end", 700);

// ---- 2023 示意：文件被删 ----
const d23 = document.getElementById("d23");
const files = d3.range(8).map(i => {
  const g = svgEl(d23, "g", { transform: `translate(${i * 120},60)` });
  const p = svgEl(g, "path", { d: "M0,0 h58 l22,22 v84 h-80 Z", fill: C("--surface2"), stroke: C("--ink2"), "stroke-width": 4, "stroke-linejoin": "round" });
  svgEl(g, "path", { d: "M14,46 h52 M14,64 h52 M14,82 h36", stroke: C("--faint"), "stroke-width": 4, "stroke-linecap": "round" });
  return { g, p };
});
const gone = [2, 5].map(i => { const g = svgEl(d23, "g", { transform: `translate(${i * 120 + 40},113)` });
  svgEl(g, "circle", { r: 22, fill: C("--d-bad") });
  svgEl(g, "path", { d: "M-9,-9 L9,9 M9,-9 L-9,9", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round" }); return g; });
const delL = txt(d23, 0, 230, L("承包商误删文件", "Maintenance: files deleted"), 32, C("--ink2"), "start", 500);
const ck1 = txt(d23, 0, 285, L("✓ 被人动过", "✓ “Someone touched it”"), 38, C("--d-good"), "start", 600);

gsap.set(["#thesis", "#thesis2", "#p09", "#p15", "#p23", "#now", "#r09b", "#r09c", "#r15a", "#r15b", "#ph15", "#r23a", "#r23b", "#ck2"], { opacity: 0 });
gsap.set([base, ...nodes.flatMap(n => [n.dot, n.lab]), ...g9, memL, ...cells, memFull, ...files.map(f => f.g), ...gone, delL, ck1], { opacity: 0 });
EDU.in(".eb", 0);

// l25 往回翻：时间轴
EDU.in(base, EDU.t("l25", .05), { d: .5 });
nodes.forEach((n, i) => EDU.in([n.dot, n.lab], EDU.t("l25", .2 + i * .12)));
// l26 规律：出事时都有人正在动它
EDU.in("#thesis", EDU.t("l26", .05));

// l27 2009：同一张网、同一家公司
EDU.out("#thesis", EDU.t("l27", 0));
EDU.in("#thesis2", EDU.t("l27", .1), { y: 0 });   // 论点缩小留在右上，陪到 l39（lines_r2 I44）
on(0, EDU.t("l27", 0));
EDU.in("#p09", EDU.t("l27", .05));
srcNote("DOT 监察长 CC-2010-012（2010-06）", "DOT inspector general, CC-2010-012 (June 2010)", EDU.t("l27", .2), EDU.end("l33") + .1);
// l28 从旧网迁到新光纤网
EDU.in([gOld, gNew], EDU.t("l28", .02));
T.set([mig, migHead], { opacity: 1 }, EDU.t("l28", .2)); EDU.draw(mig, EDU.t("l28", .2), 1.0);
// l29 洛杉矶中心一台临时过渡路由器配错了
EDU.in([rA, lA], EDU.t("l29", .05));
EDU.in(xA, EDU.t("l29", .55));
// l30 错误被原样复制到新路由器
T.set(copy, { opacity: 1 }, EDU.t("l30", .05)); EDU.draw(copy, EDU.t("l30", .05), .9);
EDU.in(lC, EDU.t("l30", .2));
EDU.in([rB, lB], EDU.t("l30", .35)); EDU.in(xB, EDU.t("l30", .6));
// l31 本该 21 个，波及 129 个（示意图退后）
EDU.out(g9, EDU.t("l31", 0));          // 示意图撤下，换数字（台词审 r1 I90）
EDU.in("#r09b", EDU.t("l31", .1));
// l32 断了 5 小时，820 班延误
EDU.in("#r09c", EDU.t("l32", .1));
// l33 交通部监察长的调查结论
// l33 出处还原到页脚（lines_r3 I37）

// l34 2015：华盛顿中心刚做完软件升级
EDU.out("#p09", EDU.t("l34", 0));
on(1, EDU.t("l34", 0));
EDU.in("#p15", EDU.t("l34", .1));
EDU.in("#ph15", EDU.t("l34", .3));
EDU.in([memL, ...cells], EDU.t("l34", .4));
srcNote("FAA 声明（2015-08-18，经 Route Fifty）", "FAA statement, Aug 18, 2015 (via Route Fifty)", EDU.t("l34", .2), EDU.end("l35") + .1);
// l35 新功能把内存塞满；延误 492、取消 476
cells.forEach((c, i) => T.to(c, { attr: { fill: C("--ink2") }, duration: .12 }, EDU.t("l35", 0) + i * .07));
T.to(cells, { attr: { fill: C("--d-bad") }, duration: .4 }, EDU.t("l35", 0) + 20 * .07 + .05);
EDU.in(memFull, EDU.t("l35", 0) + 20 * .07 + .1);
EDU.in("#r15a", EDU.t("l35", .45)); countUp("#v15a", EDU.t("l35", .45), N.eram2015.delay, .9);
EDU.in("#r15b", EDU.t("l35", .65)); countUp("#v15b", EDU.t("l35", .65), N.eram2015.cancel, .9);

// l36 2023：航行通告系统崩了，全国停飞
EDU.out("#p15", EDU.t("l36", 0));
on(2, EDU.t("l36", 0));
EDU.in("#p23", EDU.t("l36", .1));
EDU.in(files.map(f => f.g), EDU.t("l36", .35), { stagger: .05 });
// l37 承包商维护时误删文件
[2, 5].forEach(i => T.to(files[i].g, { opacity: .25, duration: .5 }, EDU.t("l37", .1)));
EDU.in(gone, EDU.t("l37", .15), { stagger: .12 });
EDU.in(delL, EDU.t("l37", .3));
srcNote("FAA 初步调查（2023-01-19，经 CNBC）", "FAA preliminary review, Jan 19, 2023 (via CNBC)", EDU.t("l37", .1), EDU.end("l37") + .1);
// l38 政府问责署：30 多年的老系统
EDU.in(["#r23a", "#r23b"], EDU.t("l38", .1));
srcNote("GAO-25-108162", "GAO-25-108162", EDU.t("l38", .2), EDU.end("l38") + .1);
// l39 「太老」和「被人动过」同时成立；常驻论点此时收起，同屏不超 4 块（lines_r3 I37/I39）
EDU.out("#thesis2", EDU.t("l39", 0), { y: 0 });
EDU.in(ck1, EDU.t("l39", .1));
EDU.in("#ck2", EDU.t("l39", .35));

// l40 这一次可能也是，但原因还没公布
EDU.out("#p23", EDU.t("l40", 0));
on(3, EDU.t("l40", 0));
EDU.in("#now", EDU.t("l40", .1));
ourTake(["l25", "l26", "l39"]);
EDU.out(["#now"], EDU.S.duration - .5);
</script>
