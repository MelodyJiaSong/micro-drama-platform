<style>
  .head { position: absolute; left: var(--mx); top: var(--mt); }
  #wall { position: absolute; left: var(--mx); top: 230px; display: grid; grid-template-columns: repeat(10, auto); gap: 14px; }
  .count { position: absolute; left: 1390px; top: 230px; }
  .count .display { line-height: 1; }
  #big { position: absolute; left: 1400px; top: 420px; }
  .count2 { position: absolute; left: 1400px; top: 720px; }
  .credit { position: absolute; left: var(--mx); top: 860px; }
  .split { position: absolute; left: var(--mx); top: 300px; width: 1680px; }
  .bar { display: flex; height: 64px; border-radius: 16px; overflow: hidden; }
  .bar .p { background: var(--ink); } .bar .e { background: transparent; border: 3px solid var(--accent); border-left: 0; border-radius: 0 16px 16px 0; }
  .barlab { position: relative; height: 140px; margin-top: 18px; }
  .barlab > div { position: absolute; top: 0; }
  .barlab .lp { left: 0; } .barlab .le { right: 0; text-align: right; }
  html[lang="en"] .barlab .h2 { font-size: 44px; }
  .why { position: absolute; left: var(--mx); top: 600px; width: 1600px; }
  .guess { position: absolute; left: var(--mx); top: 330px; }
  .guess .display { margin-top: 20px; }
  #chips { position: absolute; left: var(--mx); top: 250px; display: flex; gap: 14px; }
  .chip { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
          font-size: 34px; font-weight: 700; background: var(--surface2); color: var(--faint); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chiplab { position: absolute; left: var(--mx); top: 340px; }
  #chart { position: absolute; left: 96px; top: 400px; }
  .method { position: absolute; left: var(--mx); top: 880px; }
  .side { position: absolute; left: 1250px; top: 430px; width: 570px; }
  .side .h2 + .h2 { margin-top: 18px; }
  .side .h2 { font-size: 42px; }
  #wrong { position: absolute; left: var(--mx); top: 300px; display: flex; gap: 40px; }
  .wrongt { position: absolute; left: var(--mx); top: 220px; }
  .hes { position: absolute; left: var(--mx); top: 700px; }
</style>

<div class="head"><div class="eyebrow" data-zh="03 · 亲手做个实验" data-en="03 · Let's run an experiment"></div></div>
<div id="wall"></div>
<div class="count"><div class="display" id="n1797">0</div><div class="h2 sub" id="nlab" data-zh="张手写数字（公开数据）" data-en="handwritten digits (public data)"></div></div>
<div id="big"></div>
<div class="count2 caption" id="g8" data-zh="每张：8 行 × 8 列" data-en="Each: 8 rows × 8 columns"></div>

<div class="split" id="split">
  <div class="bar"><div class="p" id="bp" style="width:83.3%"></div><div class="e" id="be" style="width:16.7%"></div></div>
  <div class="barlab"><div class="h2 lp" data-zh="练习用的例子 1497" data-en="Practice examples: 1,497"></div>
    <div class="h2 accent le" id="lock" data-zh="考试题 300<br><span class='caption'>训练时不许看</span>" data-en="Exam: 300<br><span class='caption'>never seen in training</span>"></div></div>
</div>
<div class="why h2 ink2" id="why" data-zh='只有考它<span class="accent">没见过的题</span>，才知道它是真会认了，还是只是记住了' data-en='Only <span class="accent">unseen questions</span> tell us if it really learned, or just remembered'></div>

<div class="guess" id="guess"><div class="eyebrow" data-zh="先猜一下" data-en="Take a guess"></div>
  <div class="display" data-zh='只看 <span class="accent">10</span> 个例子，<br>能答对多少？' data-en='With just <span class="accent">10</span> examples,<br>how many right?'></div></div>

<div id="chips"></div>
<div class="chiplab caption" id="chiplab" data-zh="随便抽 10 张（其中一次）：灰色的数字，一张都没抽到" data-en="One random draw of 10: the grey digits never showed up"></div>
<svg id="chart"></svg>
<div class="method micro" id="method" data-zh="每个点：随机抽 20 次取中位数（最后一点用全部例子）· 横轴每一大格，例子多 10 倍"
     data-en="Each point: median of 20 random draws (last point uses all examples) · each gridline = 10× more examples"></div>
<div class="credit micro" id="credit" data-zh="数据：UCI 手写数字（Alpaydin &amp; Kaynak，1998），CC BY 4.0 · 经 scikit-learn 加载，已改画"
     data-en="Data: Optical Recognition of Handwritten Digits, Alpaydin &amp; Kaynak (1998), UCI ML Repository, CC BY 4.0 · via scikit-learn, adapted"></div>
<div class="side" id="side">
  <div class="caption" id="sd0" style="margin-bottom:18px" data-zh="训练时它一直在做：猜 → 对照答案 → 差了就调" data-en="During training it keeps doing: guess → check against the answer → adjust"></div>
  <div class="h2 sub" id="sd1" data-zh="没人告诉它 3 长什么样，<br>只告诉它哪张是 3" data-en="No one said what a 3 looks like,<br>only which images were 3s"></div>
  <div class="h2" id="sd2" data-zh='这次实验里：例子<span class="accent">越多</span>，成绩越高' data-en='In this experiment: <span class="accent">more examples</span>, higher scores'></div>
</div>

<div class="wrongt h2" id="wrongt" data-zh='300 道考题，<span class="c-bad">错了 10 道</span>' data-en='300 exam questions, <span class="c-bad">10 wrong</span>'></div>
<div id="wrong"></div>
<div class="hes body sub" id="hes" data-zh="有几张，连人看了都要犹豫" data-en="A few would make a person hesitate too"></div>

<script>
const T = EDU.tl;
// 数据墙：每个数字 3 张
for (let j = 0; j < 3; j++) for (let k = 0; k < 10; k++) document.querySelector("#wall").appendChild(tileEl(D.samples[String(k)][j], 74));
document.querySelector("#big").appendChild(digitEl(D.threes[0], 280, true));
// 抽 10 张的覆盖
const seen = new Set(D.draw10);
for (let k = 0; k < 10; k++) { const c = document.createElement("div"); c.className = "chip" + (seen.has(k) ? " on" : ""); c.textContent = k; document.querySelector("#chips").appendChild(c); }
// 准确率曲线：横轴对数，只有一条基线
const W = 1080, H = 340, acc = D.sizes.map((n, i) => [n, D.accuracy[i]]);
const svg = d3.select("#chart").attr("width", W + 160).attr("height", H + 84);
const x = d3.scaleLog([10, 1600], [40, W]), y = d3.scaleLinear([0, 1], [H, 70]);
svg.append("line").attr("class", "axis-base").attr("x1", 40).attr("x2", W).attr("y1", H).attr("y2", H);
[10, 100, 1000].forEach(v => svg.append("text").attr("x", x(v)).attr("y", H + 40).attr("text-anchor", "middle").attr("font-size", 26)
  .attr("fill", css("--sub")).text(v.toLocaleString("en")));
svg.append("text").attr("x", W).attr("y", H + 76).attr("text-anchor", "end").attr("font-size", 24).attr("fill", css("--sub"))
  .text(L("看过的例子（张）", "Examples seen"));
const guessLine = svg.append("line").attr("x1", 40).attr("x2", W).attr("y1", y(0.1)).attr("y2", y(0.1)).attr("stroke", css("--faint"))
  .attr("stroke-width", 3).attr("stroke-dasharray", "6 10").node();
const guessLab = svg.append("text").attr("x", W).attr("y", y(0.1) - 14).attr("text-anchor", "end").attr("font-size", 26)
  .attr("fill", css("--sub")).text(L("瞎猜 10%", "Random guessing 10%")).node();
const line = d3.line().x(d => x(d[0])).y(d => y(d[1]));
const seg1 = svg.append("path").attr("d", line(acc.slice(0, 3))).attr("fill", "none").attr("stroke", css("--accent")).attr("stroke-width", 6).attr("stroke-linecap", "round").node();
const seg2 = svg.append("path").attr("d", line(acc.slice(2))).attr("fill", "none").attr("stroke", css("--accent")).attr("stroke-width", 6).attr("stroke-linecap", "round").node();
const dots = acc.map(d => svg.append("circle").attr("cx", x(d[0])).attr("cy", y(d[1])).attr("r", 11).attr("fill", css("--bg")).attr("stroke", css("--accent")).attr("stroke-width", 4).node());   // 考试成绩：琥珀空心（全片约定）
const call = (i, dx, dy, anchor = "start") => svg.append("text").attr("x", x(acc[i][0]) + dx).attr("y", y(acc[i][1]) + dy).attr("text-anchor", anchor)
  .attr("font-size", 64).attr("font-weight", 700).attr("fill", css("--accent")).text(pct(acc[i][1]) + "%").node();
const c10 = call(0, 26, 64), c100 = call(2, -20, -26, "end"), c1497 = call(5, 0, -30, "middle");
// 错题：4 张，标出那张潦草的 2
D.wrong_examples.forEach(w => {
  const t = tileEl(w.img, 190, L(`真：${w.true}　它猜：<span class="c-bad">${w.pred}</span>`, `Truth: ${w.true}　Guess: <span class="c-bad">${w.pred}</span>`));
  if (w.true === 2) t.id = "two";
  document.querySelector("#wrong").appendChild(t);
});

gsap.set(["#lock", "#credit", "#wall .tile", ".count", "#big", "#g8", "#split", "#lock", "#why", "#guess", "#chips", "#chiplab", "#chart", guessLine, guessLab,
          seg1, seg2, ...dots, c10, c100, c1497, "#method", "#side", "#sd0", "#sd1", "#sd2", "#wrongt", "#wrong .tile", "#hes"], { opacity: 0 });
// l26 公开数据集：1797 张、每张 8×8
EDU.in("#wall .tile", EDU.t("l26", 0.05), { stagger: 0.03 }); EDU.in("#credit", EDU.t("l26", 0.2));
EDU.in(".count", EDU.t("l26", 0.35)); EDU.count("#n1797", EDU.t("l26", 0.35), 1797, 1.2, v => Math.round(v).toLocaleString("en"));
EDU.dim("#wall .tile", EDU.t("l26", 0.72), 0.35);
EDU.out(".count", EDU.t("l26", 0.72)); EDU.in(["#big", "#g8"], EDU.t("l26", 0.74));
// l27 分出考试题，讲清为什么
EDU.out(["#wall", "#big", "#g8", "#credit"], EDU.t("l27"));
EDU.in("#split", EDU.t("l27", 0.05));
EDU.in("#lock", EDU.t("l27", 0.2));
EDU.in("#why", EDU.t("l27", 0.45));
// l28 先猜一下
EDU.out(["#split", "#why"], EDU.t("l28"));
EDU.in("#guess", EDU.t("l28", 0.1));
// l29 抽 10 张常缺数字 → 37%
EDU.out("#guess", EDU.t("l29"));
EDU.in(["#chips", "#chiplab"], EDU.t("l29", 0.05));
EDU.in(["#chart", guessLine, guessLab], EDU.t("l29", 0.35));
EDU.in([dots[0], c10], EDU.t("l29", 0.45));
EDU.in("#method", EDU.t("l29", 0.5));
// l30 100 → 88%
T.set(seg1, { opacity: 1 }, EDU.t("l30")); EDU.draw(seg1, EDU.t("l30"), 1.0);
EDU.in([dots[1], dots[2]], EDU.t("l30", 0.2), { stagger: 0.3 }); EDU.in(c100, EDU.t("l30", 0.55));
EDU.dim(c10, EDU.t("l30", 0.55), 0.35);
// l31 1497 → 97%
T.set(seg2, { opacity: 1 }, EDU.t("l31")); EDU.draw(seg2, EDU.t("l31"), 1.2);
EDU.in(dots.slice(3), EDU.t("l31", 0.15), { stagger: 0.25 }); EDU.in(c1497, EDU.t("l31", 0.6));
EDU.dim(c100, EDU.t("l31", 0.6), 0.35);
// l32 只告诉它哪张是 3；这一次越多越全越准
EDU.dim(["#chips", "#chiplab"], EDU.t("l32"), 0.25);
EDU.in("#side", EDU.t("l32", 0.02), { d: 0.01 }); EDU.in("#sd1", EDU.t("l32", 0.05)); EDU.in("#sd0", EDU.t("l32", 0.7)); EDU.in("#sd2", EDU.t("l32", 0.45));
// l33 错了十道，点名那张潦草的 2
EDU.out(["#chips", "#chiplab", "#chart", "#method", "#side"], EDU.t("l33"));
EDU.in("#wrongt", EDU.t("l33", 0.05));
EDU.in("#wrong .tile", EDU.t("l33", 0.15), { stagger: 0.12 });
EDU.dim("#wrong .tile:not(#two)", EDU.t("l33", 0.4), 0.35); EDU.focus("#two", EDU.t("l33", 0.4));
EDU.in("#hes", EDU.t("l33", 0.7));
// 潦草的 2 一直保持高亮，l52 要回扣它
EDU.out(["#wrongt", "#wrong", "#hes"], EDU.S.duration - 0.5);
</script>
