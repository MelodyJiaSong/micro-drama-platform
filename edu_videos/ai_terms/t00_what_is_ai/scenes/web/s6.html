<style>
  .head { position: absolute; left: var(--mx); top: var(--mt); }
  .title { position: absolute; left: var(--mx); top: 300px; width: 1680px; }
  .title .h2 { margin-top: 26px; }
  .probe { position: absolute; left: var(--mx); top: 300px; display: flex; align-items: center; gap: 44px; }
  .probe .box { font-size: var(--fs-h2); font-weight: 600; }
  #bars { position: relative; }
  .conf { position: absolute; left: 1290px; top: 230px; }
  .rows { position: absolute; left: var(--mx); top: 300px; }
  .rows .r { display: flex; align-items: center; gap: 36px; margin-bottom: 44px; }
  .rows .ic { width: 120px; height: 120px; border-radius: 28px; background: var(--surface2); display: flex; align-items: center; justify-content: center; }
  .rows .ic svg { stroke: var(--ink); fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .rows .box { font-size: var(--fs-body); font-weight: 600; padding: 22px 30px; }
  .words { position: absolute; left: var(--mx); top: 300px; width: 1680px; }
  .words .seq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 0; font-size: 72px; font-weight: 600; line-height: 1.3; }
  .words .seq .g { color: var(--accent-text); }
  html[lang="en"] .words .seq { gap: 6px 18px; }
  .words .note { margin-top: 26px; }
  .llm { position: absolute; left: var(--mx); top: 600px; width: 1680px; }
  .llm .h2 + .h1 { margin-top: 16px; }
</style>

<div class="head"><div class="eyebrow" data-zh="03 · 换个角度看" data-en="03 · A different lens"></div></div>
<div class="title" id="title"><div class="display" data-zh='今天的 AI，像台<span class="grad">预测机器</span>' data-en='Today’s AI:<br>a <span class="grad">prediction machine</span>'></div>
  <div class="h2 ink2" id="notfut" data-zh="不是看未来，是猜答案" data-en="Guesses answers, not the future"></div></div>

<div class="probe" id="probe"><div id="pimg"></div><span class="arrow">→</span>
  <div class="box" data-zh="模型" data-en="Model"></div><span class="arrow">→</span><div id="bars"></div></div>
<div class="conf" id="conf"><div class="eyebrow" data-zh="把握" data-en="Confidence"></div><div class="display accent" id="p96">0%</div>
  <div class="h2" data-zh="是 3" data-en="sure it’s a 3"></div></div>

<div class="rows" id="rows">
  <div class="r" id="r1"><div class="ic"><svg width="72" height="60" viewBox="0 0 72 60"><rect x="4" y="12" width="64" height="44" rx="10"/><circle cx="36" cy="34" r="13"/><path d="M22 12 l6 -8 h16 l6 8"/></svg></div>
    <span class="arrow">→</span><div class="box" data-zh="识图模型" data-en="Image model"></div><span class="arrow">→</span>
    <div class="h2" data-zh="里面有没有猫？" data-en="Is there a cat?"></div></div>
</div>

<div class="words" id="words"><div class="seq" id="seq"></div></div>
<div class="llm" id="llm"><div class="h2 ink2" id="llmh" data-zh='<span class="accent">大语言模型</span>：一词一词猜' data-en='<span class="accent">Large language models</span> (LLMs): word by word'></div>
  <div class="h1" id="notr" data-zh='猜得好 <span class="c-bad">≠</span> 说得对' data-en='A good guess <span class="c-bad">≠</span> a true answer'></div></div>

<script>
const T = EDU.tl;
document.querySelector("#pimg").appendChild(tileEl(D.probe.img, 200));
const PB = probBars(D.probe.proba, 3, 520, 300); document.querySelector("#bars").appendChild(PB.el);
// 逐词：前半句已给出，后面的词一个个猜出来
const words = EDU.lang === "en" ? ["The", "weather", "today", "is", "really", "nice."] : ["今天", "天气", "真", "不错", "，", "适合", "出去", "走走", "。"];
const given = EDU.lang === "en" ? 4 : 2;
words.forEach((w, i) => { const s = document.createElement("span"); s.textContent = w; if (i >= given) s.className = "g"; document.querySelector("#seq").appendChild(s); });
const gs = [...document.querySelectorAll("#seq .g")];
gsap.set(["#title", "#notfut", "#probe", "#probe > *", "#conf", "#rows", "#r1", "#words", "#seq span", "#llm", "#notr"], { opacity: 0 });
// l27 预测机器；预测 ≠ 看未来
EDU.in("#title", EDU.t("l27", 0.02)); EDU.in("#notfut", EDU.t("l27", 0.45));
// l28 一张图 → 十个数字的把握
EDU.out("#title", EDU.t("l28"));
EDU.in("#probe", EDU.t("l28", 0.02), { d: 0.01 });
EDU.in("#probe > *", EDU.t("l28", 0.05), { stagger: 0.18 });
EDU.in("#conf", EDU.t("l28", 0.5)); EDU.count("#p96", EDU.t("l28", 0.5), pct(D.probe.proba[3]), 1.0, v => Math.round(v) + "%");
// l30 半句话，一个词一个词猜
EDU.out(["#probe", "#conf"], EDU.t("l30"));
EDU.in("#words", EDU.t("l30", 0.02), { d: 0.01 });
EDU.in([...document.querySelectorAll("#seq span")].slice(0, given), EDU.t("l30", 0.05));
EDU.in(gs, EDU.t("l30", 0.3), { stagger: Math.min(0.45, (EDU.end("l30") - EDU.t("l30", 0.3)) / (gs.length + 1)), y: 0 });
// l31 大语言模型就是这样回答的；l32 猜得好不等于说得对
EDU.in("#llm", EDU.t("l31", 0.02)); EDU.out("#llmh", EDU.t("l32", 0.45)); EDU.dim("#words", EDU.t("l32", 0.45), 0.35); EDU.in("#notr", EDU.t("l32", 0.6));
EDU.out(["#words", "#llm"], EDU.S.duration - 0.5);
</script>
