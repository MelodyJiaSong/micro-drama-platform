<style>
  .ill { position: absolute; object-fit: contain;
         -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, #000 62%, transparent 100%);
                 mask-image: radial-gradient(ellipse 72% 70% at 50% 52%, #000 62%, transparent 100%); }
  .big-ill { left: 40px; top: 150px; width: 1060px; height: 596px; }
  .right { position: absolute; left: 1140px; top: 300px; width: 660px; }
  .right .display { margin-top: 10px; }
  .eyebrow-top { position: absolute; left: var(--mx); top: var(--mt); }
  .rule-line { position: absolute; left: var(--mx); top: 150px; }
  .tri { position: absolute; top: 330px; width: 520px; height: 292px; }
  .tri.a { left: 100px; } .tri.b { left: 700px; } .tri.c { left: 1300px; }
  .say { position: absolute; top: 650px; width: 520px; text-align: center; }
  .say.b { left: 700px; } .say.c { left: 1300px; } .say.a { left: 100px; }
  .final { position: absolute; left: 0; right: 0; top: 340px; text-align: center; }
  .final .h1 { margin-top: 26px; }
</style>

<div class="eyebrow-top eyebrow" data-zh="02 · 类比" data-en="02 · An analogy"></div>

<!-- 学生 -->
<img class="ill big-ill" id="stu" src="img/clay_student.png">
<img class="ill big-ill" id="exam" src="img/clay_exam.png">
<div class="right" id="r-a"><div class="eyebrow" data-zh="练习册" data-en="The workbook"></div>
  <div class="display c-good">100</div><div class="body ink2" data-zh="背下了全部答案，次次满分" data-en="Every answer memorized. A perfect score, every time."></div></div>
<div class="right" id="r-b"><div class="eyebrow" data-zh="考试" data-en="The exam"></div>
  <div class="h1 c-bad" data-zh="题目稍微一变，<br>就不会了" data-en="Change a question slightly,<br>and he's lost"></div></div>

<!-- 猫 -->
<img class="ill big-ill" id="cats" src="img/clay_cats.png">
<div class="right" id="r-c"><div class="eyebrow" data-zh="给小朋友看的照片" data-en="The photos you show a child"></div>
  <div class="h1" data-zh='猫，<span class="accent">全在沙发上</span>' data-en='Every cat is <span class="accent">on a sofa</span>'></div></div>
<div class="rule-line h1" id="rule" data-zh='他学到的规则：<span class="grad">沙发 = 猫</span>' data-en='The rule he learns: <span class="grad">sofa = cat</span>'></div>
<img class="ill tri a" id="t-cats" src="img/clay_cats.png">
<img class="ill tri b" id="t-dog" src="img/clay_dog.png">
<img class="ill tri c" id="t-grass" src="img/clay_grass.png">
<div class="say a caption" id="s-a" data-zh="见过的：全对" data-en="Photos he has seen: all right"></div>
<div class="say b h2 c-bad" id="s-b" data-zh="“是猫！”" data-en="“Cat!”"></div>
<div class="say c h2 c-bad" id="s-c" data-zh="“不是猫。”" data-en="“Not a cat.”"></div>

<div class="final" id="fin"><div class="h2 ink2" data-zh="背下来的答案 · 记住的巧合" data-en="Memorized answers. Memorized coincidences."></div>
  <div class="h1" data-zh='场景一换，<span class="c-bad">全失灵</span>' data-en='Change the setting, <span class="c-bad">and they fail</span>'></div></div>

<script>
const all = ["#stu", "#exam", "#r-a", "#r-b", "#cats", "#r-c", "#rule", "#t-cats", "#t-dog", "#t-grass", "#s-a", "#s-b", "#s-c", "#fin"];
gsap.set(all, { opacity: 0 });
EDU.in(".eyebrow-top", 0);
// l20 学生与满分
EDU.in("#stu", EDU.t("l20"), { y: 12, d: .9 });
EDU.in("#r-a", EDU.t("l20", .5));
// l21 考试
EDU.out(["#stu", "#r-a"], EDU.t("l21"));
EDU.in("#exam", EDU.t("l21", .02), { y: 12, d: .9 });
EDU.in("#r-b", EDU.t("l21", .3));
// l22 照片里的猫
EDU.out(["#exam", "#r-b"], EDU.t("l22"));
EDU.in("#cats", EDU.t("l22", .05), { y: 12, d: .9 });
EDU.in("#r-c", EDU.t("l22", .45));
// l23 学到的规则 → 小狗、草地上的猫
EDU.out(["#cats", "#r-c"], EDU.t("l23"));
EDU.in("#rule", EDU.t("l23", .02));
EDU.in(["#t-cats", "#s-a"], EDU.t("l23", .12), { stagger: .1 });
EDU.in(["#t-dog", "#s-b"], EDU.t("l23", .45), { stagger: .12 });
EDU.in(["#t-grass", "#s-c"], EDU.t("l23", .75), { stagger: .12 });
// l24 收束
EDU.out(["#rule", "#t-cats", "#t-dog", "#t-grass", "#s-a", "#s-b", "#s-c"], EDU.t("l24"));
EDU.in("#fin", EDU.t("l24", .08));
</script>
