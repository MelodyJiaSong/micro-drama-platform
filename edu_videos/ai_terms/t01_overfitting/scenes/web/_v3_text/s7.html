<style>
  .head { position: absolute; left: var(--mx); top: var(--mt); }
  .head .h1 { margin-top: 16px; white-space: nowrap; }
  .title { position: absolute; left: 0; right: 0; top: 380px; text-align: center; }
  #chart { position: absolute; left: 96px; top: 250px; }
  .side { position: absolute; left: 1220px; top: 270px; width: 580px; }
  .blk { padding: 20px 0 22px; border-top: 1px solid var(--hair); }
  .blk .k { font-size: var(--fs-caption); font-weight: 600; }
  .blk .v { margin-top: 10px; display: grid; gap: 6px 18px; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .blk .v.c5 { grid-template-columns: repeat(5, auto); } .blk .v.c4 { grid-template-columns: repeat(4, auto); }
  .verdict { margin-top: 8px; font-size: var(--fs-micro); font-weight: 600; }
  .end { position: absolute; left: 0; right: 0; top: 360px; text-align: center; }
  .end .h1 + .h1 { margin-top: 18px; }
</style>

<div class="title" id="title"><div class="eyebrow" data-zh="04 · 视角" data-en="04 · A different lens"></div>
  <div class="display" style="margin-top:18px" data-zh='学习 <span class="faint">≈</span> <span class="grad">压缩</span>' data-en='Learning <span class="faint">≈</span> <span class="grad">compression</span>'></div></div>
<div class="head" id="head"><div class="eyebrow" data-zh="04 · 视角" data-en="04 · A different lens"></div>
  <div class="h1" data-zh="记住这十个点，要几个数字？" data-en="How many numbers to remember ten points?"></div></div>
<svg id="chart"></svg>
<div class="side">
  <div class="blk" id="b1"><div class="k" data-zh="原样记住：10 个高度" data-en="Store exactly: 10 heights"></div><div class="v c5" id="v1"></div></div>
  <div class="blk" id="b2"><div class="k c-good" data-zh="② 平缓曲线：4 个数字" data-en="② Gentle curve: 4 numbers"></div><div class="v c4 c-good" id="v2"></div>
    <div class="verdict c-good" data-zh="压缩了：新点也估得不远" data-en="Compressed: stays close on new points"></div></div>
  <div class="blk" id="b3"><div class="k c-bad" data-zh="③ 弯曲线：10 个数字" data-en="③ Wiggly curve: 10 numbers"></div><div class="v c5 c-bad" id="v3"></div>
    <div class="verdict c-bad" data-zh="10 → 10：没压缩，噪声也存了下来" data-en="10 → 10: no compression, the noise is stored too"></div></div>
</div>
<div class="end" id="end"><div class="h1" data-zh='好的压缩：留住<span class="grad">规律</span>，少记<span class="c-bad">噪声</span>' data-en='Good compression keeps the <span class="grad">pattern</span> and leaves out the <span class="c-bad">noise</span>'></div>
  <div class="h2 sub" style="margin-top:24px" data-zh="压过了头（那条直线），连规律也丢了" data-en="Squeeze too hard, like the straight line, and you lose the pattern too"></div></div>

<script>
const C = makeChart("#chart", 1080, 620), T = EDU.tl;
const fmt = v => (Math.abs(v) >= 0.005 ? (v >= 0 ? "+" : "") + v.toFixed(2) : (v >= 0 ? "+" : "") + v.toFixed(3));
const fill = (sel, vals) => { const e = document.querySelector(sel); e.innerHTML = vals.map(v => `<span>${fmt(v)}</span>`).join(""); };
fill("#v1", D.train.map(p => p[1])); fill("#v2", D.coef["3"]); fill("#v3", D.coef["9"]);
const stems = C.gaps(D.train, () => 0, "--d-train", "2 6");
const c2 = C.curve(D.fits["3"], "--d-good", 6), c3 = C.curve(D.fits["9"], "--d-bad", 6);
const dots = C.dots(D.train), rings = C.dots(D.test, "test");

gsap.set(["#head", "#b1", "#b2", "#b3", "#end", "#chart", stems, c2, c3, ...rings], { opacity: 0 });
// l36 学习可以看成压缩
EDU.in("#title", EDU.t("l36"));
// l37 十个高度
EDU.out("#title", EDU.t("l37")); EDU.in("#head", EDU.t("l37", .05)); EDU.in("#chart", EDU.t("l37", .05));
EDU.in(stems, EDU.t("l37", .3)); EDU.in("#b1", EDU.t("l37", .4));
// l38 四个数字
EDU.dim(stems, EDU.t("l38"), 0); T.set(c2, { opacity: 1 }, EDU.t("l38")); EDU.draw(c2, EDU.t("l38"), 1.3);
EDU.in("#b2", EDU.t("l38", .3)); EDU.in(rings, EDU.t("l38", .65), { stagger: .06 });
// l39 十个数字，噪声也存了
EDU.dim(c2, EDU.t("l39"), .25); EDU.dim(rings, EDU.t("l39"), .35); T.set(c3, { opacity: 1 }, EDU.t("l39", .05)); EDU.draw(c3, EDU.t("l39", .05), 1.6);
EDU.in("#b3", EDU.t("l39", .35));
// l40 结论
EDU.out(["#head", "#chart", ".side"], EDU.t("l40")); EDU.in(["#end .h1", "#end .h2"], EDU.t("l40", .05), { stagger: 1.2 });
</script>
