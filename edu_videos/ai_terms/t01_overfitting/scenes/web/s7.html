<style>
  .head { position: absolute; left: var(--mx); top: var(--mt); }
  .head .h1 { margin-top: 16px; white-space: nowrap; }
  .title { position: absolute; left: 0; right: 0; top: 380px; text-align: center; }
  #chart { position: absolute; left: 96px; top: 250px; }
  .side { position: absolute; left: 1220px; top: 270px; width: 580px; }
  .blk { padding: 20px 0 22px; border-top: 1px solid var(--hair); }
  .blk .k { font-size: var(--fs-caption); font-weight: 600; }
  .blk .v { margin-top: 14px; display: flex; gap: 12px; }
  .blk .v i { width: 30px; height: 30px; border-radius: 8px; background: currentColor; opacity: .85; }
  #v1 { color: var(--d-train); }
  .end { position: absolute; left: 0; right: 0; top: 360px; text-align: center; }
  .end .h1 { margin-top: 18px; } .end .h2 { margin-top: 24px; }
</style>

<div class="title" id="title">
  <div class="display" data-zh='学习 <span class="faint">≈</span> <span class="grad">压缩</span>' data-en='Learning <span class="faint">≈</span> <span class="grad">compression</span>'></div></div>
<div class="head" id="head"><div class="eyebrow" data-zh="03 · 把学习看成压缩" data-en="03 · Learning as compression"></div>
  <div class="h1" data-zh="记住 10 个点，要几个数字？" data-en="How many numbers for 10 points?"></div></div>
<svg id="chart"></svg>
<div class="side">
  <div class="blk" id="b1"><div class="k" data-zh="原样记：10 个数字" data-en="Store as is: 10 numbers"></div><div class="v" id="v1"></div></div>
  <div class="blk" id="b2"><div class="k c-good" data-zh="② 4 个数字：压缩了" data-en="② 4 numbers: compressed"></div><div class="v c-good" id="v2"></div></div>
  <div class="blk" id="b3"><div class="k c-bad" data-zh="③ 10 个数字：没压缩" data-en="③ 10 numbers: no compression"></div><div class="v c-bad" id="v3"></div></div>
</div>
<div class="end" id="end"><div class="eyebrow" data-zh="好的压缩" data-en="Good compression"></div>
  <div class="h1" data-zh='留住<span class="grad">规律</span>，少记<span class="c-bad">噪声</span>' data-en='Keep the <span class="grad">pattern</span>, drop the <span class="c-bad">noise</span>'></div>
  <div class="h2 sub" data-zh="压过头：连规律也丢了" data-en="Squeeze too hard: lose the pattern"></div></div>

<script>
const C = makeChart("#chart", 1080, 620), T = EDU.tl;
// 要记几个数字：画成几个方块（不印具体数值，屏幕只放纲要）
const fill = (sel, n) => { document.querySelector(sel).innerHTML = "<i></i>".repeat(n); };
fill("#v1", D.train.length); fill("#v2", D.coef["3"].length); fill("#v3", D.coef["9"].length);
const stems = C.gaps(D.train, () => 0, "--d-train", "2 6");
const c2 = C.curve(D.fits["3"], "--d-good", 6), c3 = C.curve(D.fits["9"], "--d-bad", 6);
const dots = C.dots(D.train), rings = C.dots(D.test, "test");

gsap.set(["#head", "#b1", "#b2", "#b3", "#end", "#chart", stems, c2, c3, ...rings], { opacity: 0 });
// l24 学习可以看成压缩
EDU.in("#title", EDU.t("l24"));
// l25 十个高度
EDU.out("#title", EDU.t("l25")); EDU.in("#head", EDU.t("l25", .05)); EDU.in("#chart", EDU.t("l25", .05));
EDU.in(stems, EDU.t("l25", .3)); EDU.in("#b1", EDU.t("l25", .4));
// l26 四个数字
EDU.dim(stems, EDU.t("l26"), 0); T.set(c2, { opacity: 1 }, EDU.t("l26")); EDU.draw(c2, EDU.t("l26"), 1.3);
EDU.in("#b2", EDU.t("l26", .3)); EDU.in(rings, EDU.t("l26", .65), { stagger: .06 });
// l27 十个数字，噪声也存了
EDU.dim(c2, EDU.t("l27"), .25); EDU.dim(rings, EDU.t("l27"), .35); T.set(c3, { opacity: 1 }, EDU.t("l27", .05)); EDU.draw(c3, EDU.t("l27", .05), 1.6);
EDU.in("#b3", EDU.t("l27", .35));
// l29 结论（#end 本身一开始是透明的，要一起淡入，否则整屏空白——台词审 lines_r1 抓到）
EDU.out(["#head .h1", "#chart", ".side"], EDU.t("l29")); T.set("#end", { opacity: 1 }, EDU.t("l29", .05));
EDU.in(["#end .eyebrow", "#end .h1", "#end .h2"], EDU.t("l29", .05), { stagger: .9 });
</script>
