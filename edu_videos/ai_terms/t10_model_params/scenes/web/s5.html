<style>
  .eb { position: absolute; left: var(--mx); top: var(--mt); }
  .head { position: absolute; left: var(--mx); top: 190px; width: 1680px; }
  .head .t { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #two { position: absolute; left: 760px; top: 380px; width: 420px; height: 300px; }
  #wall { position: absolute; left: 150px; top: 330px; }
  .count { position: absolute; left: var(--mx); top: 380px; }
  .count .display { font-size: 168px; line-height: 1; margin-top: 18px; font-variant-numeric: tabular-nums; }
  .count .h2 { margin-top: 26px; }
  .src { position: absolute; left: var(--mx); top: 860px; }
  .years { position: absolute; left: var(--mx); top: 380px; }
  .years .display { font-size: 168px; line-height: 1; margin-top: 18px; }
  .pair { position: absolute; left: var(--mx); top: 400px; width: 900px; }
  .pair .row { display: grid; grid-template-columns: 1fr auto; column-gap: 40px; font-size: var(--fs-h2); align-items: baseline; padding: 24px 0; border-top: 1px solid var(--hair); }
  .pair .row .h2 { white-space: nowrap; }
  .pair .row b { font-size: var(--fs-h2); font-weight: 700; white-space: nowrap; }
  .file { position: absolute; left: 680px; top: 380px; width: 560px; height: 300px; overflow: hidden; padding: 34px 44px; }
  .file .win { position: absolute; left: 44px; right: 44px; top: 86px; bottom: 0; overflow: hidden; }
  .file .nums { font-size: 44px; font-weight: 500; color: var(--ink2); line-height: 1.6; font-variant-numeric: tabular-nums; white-space: pre; }
  .file::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: linear-gradient(transparent, var(--surface)); }
  .fin { position: absolute; left: var(--mx); top: 420px; }
  .fin .display { font-size: 120px; }
  html[lang=en] .fin .display { font-size: 96px; }
</style>

<div class="eb eyebrow" data-zh="04 · 上千亿个旋钮" data-en="04 · Billions of knobs"></div>
<div class="head">
  <div class="h1 t" id="ha" data-zh='写文章、聊天：<span class="accent">旋钮多得多</span>' data-en='More knobs <span class="accent">for chat</span>'></div>
  <div class="h1 t" id="hb" data-zh='不靠人拧，靠<span class="accent">训练</span>' data-en='Set by <span class="accent">training</span>, not by hand'></div>
  <div class="h1 t" id="hc" data-zh='模型文件 = <span class="accent">旋钮读数</span>' data-en='Model file = <span class="accent">knob settings</span>'></div>
</div>
<div id="two"></div>
<svg id="wall"></svg>

<div class="count" id="count"><div class="eyebrow" data-zh="GPT-3 · 参数个数" data-en="GPT-3 · Parameters"></div>
  <div class="display grad" id="num">0</div>
  <div class="h2" id="eq" data-zh='= 1750 亿个<span class="accent">旋钮</span>' data-en='= 175 billion <span class="accent">knobs</span>'></div></div>
<div class="src" id="src" data-zh="Brown 等 · OpenAI · 2020" data-en="Brown et al. · OpenAI · 2020"></div>

<div class="years" id="years"><div class="h2 ink2" data-zh="一秒念一个读数" data-en="One setting per second"></div>
  <div class="display grad" data-zh="≈ 5545 年" data-en="≈ 5,545 years"></div></div>

<div class="pair" id="pair">
  <div class="row" id="p1" data-zh='<span class="h2">怎么算</span><b class="sub">人定</b>' data-en='<span class="h2">Math</span><b class="sub">set by people</b>'></div>
  <div class="row" id="p2" data-zh='<span class="h2">拧到几</span><b class="accent">从例子里学</b>' data-en='<span class="h2">Settings</span><b class="accent">learned from examples</b>'></div>
</div>
<div class="card file" id="file"><div class="eyebrow" data-zh="示意" data-en="Illustration"></div>
  <div class="win"><div class="nums" id="nums"></div></div></div>

<div class="fin" id="fin"><div class="display" data-zh='千亿参数 = <span class="accent">千亿旋钮</span>' data-en='100B+ parameters = <span class="accent">100B+ knobs</span>'></div></div>

<script>
const T = EDU.tl, G3 = D.gpt3;
// 两个旋钮（打车费）
const K1 = knob("#two", { size: 170, min: 0, max: 20, value: D.steps.best.base, left: 0, top: 0, label: EDU.tr("起步价", "Base fare"), showReading: false });
const K2 = knob("#two", { size: 170, min: 0, max: 5, value: D.steps.best.per_km, left: 240, top: 0, label: EDU.tr("每公里", "Per km"), showReading: false });
// 一墙小旋钮：和旋钮同一画法（圆盘、琥珀弧、墨黑指针），太小就不标读数；角度用固定种子的伪随机
const COLS = 26, ROWS = 8, S = 52, GAP = 12;
const wall = d3.select("#wall").attr("width", COLS * (S + GAP)).attr("height", ROWS * (S + GAP));
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const minis = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const cx = c * (S + GAP) + S / 2, cy = r * (S + GAP) + S / 2, k = rnd(), a = -135 + 270 * k, g = wall.append("g");
  g.append("path").attr("d", arcPath(cx, cy, S * .47, -135, 135)).attr("fill", "none").attr("stroke", css("--hair")).attr("stroke-width", 3).attr("stroke-linecap", "round");
  g.append("path").attr("d", arcPath(cx, cy, S * .47, -135, a)).attr("fill", "none").attr("stroke", css("--accent")).attr("stroke-width", 3).attr("stroke-linecap", "round");
  g.append("circle").attr("cx", cx).attr("cy", cy).attr("r", S * .38).attr("fill", css("--surface")).attr("stroke", css("--hair")).attr("stroke-width", 1.5);
  const [px, py] = pol(cx, cy, S * .30, a);
  g.append("line").attr("x1", cx).attr("y1", cy).attr("x2", px).attr("y2", py).attr("stroke", css("--ink")).attr("stroke-width", 3.5).attr("stroke-linecap", "round");
  minis.push(g.node());
}
// 模型文件里的一长串读数（示意：固定种子的伪随机数）
let lines = [];
for (let i = 0; i < 60; i++) { const a = (rnd() * 2 - 1) * 1.6, b = (rnd() * 2 - 1) * 1.6; lines.push(`${a >= 0 ? " " : "−"}${Math.abs(a).toFixed(4)}   ${b >= 0 ? " " : "−"}${Math.abs(b).toFixed(4)}`); }
const NUMS = document.getElementById("nums"), VIS = 3;
NUMS.textContent = lines.slice(0, VIS).join("\n");
const NUM = document.getElementById("num");
const fmtBig = v => Math.round(v / 1e9) === 175 && v > 174.99e9 ? "175,000,000,000" : (Math.round(v / 1e8) * 1e8).toLocaleString("en-US");

gsap.set(["#ha", "#hb", "#hc", "#two", minis, "#count", "#eq", "#src", "#years", "#pair", "#p1", "#p2", "#file", "#fin"], { opacity: 0 });
EDU.in(".eb", 0);
// l32 两个旋钮够打车费；写文章、聊天要多得多
EDU.in("#two", EDU.t("l32", .02), { y: 0 });
EDU.out("#two", EDU.t("l32", .5)); EDU.in("#ha", EDU.t("l32", .5));
EDU.in(minis, EDU.t("l32", .52), { stagger: .006, d: .4 });
// l33 GPT-3：1750 亿个参数
EDU.out("#ha", EDU.t("l33")); EDU.dim(minis, EDU.t("l33"), .12);
EDU.in("#count", EDU.t("l33", .1)); countTo(NUM, EDU.t("l33", .35), 0, G3.params, 1.6, fmtBig); EDU.in("#src", EDU.t("l33", .5));
// l34 = 1750 亿个旋钮
EDU.in("#eq", EDU.t("l34", .1));
// l35 一秒念一个 → 5545 年
EDU.out(["#count", "#src"], EDU.t("l35")); EDU.dim(minis, EDU.t("l35"), .05); EDU.in("#years", EDU.t("l35", .3));
// l36 不是人拧的：训练拧的
EDU.out("#years", EDU.t("l36")); EDU.in("#hb", EDU.t("l36", .05)); EDU.dim(minis, EDU.t("l36", .1), .35);
// l37 怎么算：人定；拧到几：从例子里学
EDU.out(minis, EDU.t("l37")); EDU.in("#pair", EDU.t("l37", .02), { y: 0, d: .01 }); EDU.in("#p1", EDU.t("l37", .3)); EDU.in("#p2", EDU.t("l37", .6));
// l38 模型文件：一大串读数（往上滚）
EDU.out(["#hb", "#pair"], EDU.t("l38")); EDU.in("#hc", EDU.t("l38", .05)); EDU.in("#file", EDU.t("l38", .1));
const sc = { k: 0 };   // 一行一行往上滚（只放 VIS 行，不让卡片外的文字留在页面上）
T.fromTo(sc, { k: 0 }, { k: lines.length - VIS, duration: EDU.end("l38") - EDU.t("l38", .2) + 1, ease: "none", immediateRender: false,
  onUpdate: () => { const o = Math.floor(sc.k); NUMS.textContent = lines.slice(o, o + VIS).join("\n"); } }, EDU.t("l38", .2));
// l39 千亿参数 = 千亿旋钮
EDU.out(["#hc", "#file"], EDU.t("l39")); EDU.in("#fin", EDU.t("l39", .25));
</script>
