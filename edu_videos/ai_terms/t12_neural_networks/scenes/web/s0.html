<style>
  #km { position: absolute; left: var(--mx); top: 200px; }
  #day { position: absolute; left: var(--mx); top: 200px; }
  .knobs { position: absolute; left: 1330px; top: 250px; width: 470px; height: 330px; }
  .side { position: absolute; left: 1330px; width: 480px; }
  .say { top: 640px; white-space: nowrap; }
  .name { position: absolute; left: 1330px; top: 330px; }
  .name .h1 { margin-top: 12px; font-size: 96px; }
  html[lang=en] .name .h1 { font-size: 78px; }
</style>

<svg id="km"></svg>
<svg id="day"></svg>
<div class="knobs" id="knobs"></div>
<div class="side say h2" id="say1" data-zh="算得挺准" data-en="Good fit"></div>
<div class="side say h2 c-bad" id="say2" data-zh="只会画直线" data-en="Straight lines only"></div>
<div class="name" id="name"><div class="eyebrow" data-zh="学会拐弯" data-en="Curved patterns"></div>
  <div class="h1 grad" data-zh="神经网络" data-en="Neural networks"></div></div>

<script>
/* l01 距离—车费：前几期的两旋钮直线 */
const W = 1100, H = 620, m = { l: 96, r: 30, t: 40, b: 86 };
const ks = d3.select("#km").attr("width", W).attr("height", H);
const kx = d3.scaleLinear([0, 14], [m.l, W - m.r]), ky = d3.scaleLinear([0, 50], [H - m.b, m.t]);
ks.append("line").attr("class", "axis-base").attr("x1", m.l).attr("x2", W - m.r).attr("y1", ky(0)).attr("y2", ky(0));
const kt = (t, xx, yy, a) => ks.append("text").attr("x", xx).attr("y", yy).attr("text-anchor", a).attr("font-size", 24).attr("fill", css("--sub")).text(t);
[0, 4, 8, 12].forEach(k => kt(k, kx(k), ky(0) + 36, "middle")); [0, 20, 40].forEach(f => kt(f, m.l - 18, ky(f) + 8, "end"));
ks.append("text").attr("x", W - m.r).attr("y", ky(0) + 76).attr("text-anchor", "end").attr("font-size", 28).attr("font-weight", 600).attr("fill", css("--ink2")).text(EDU.tr("距离（公里）", "Distance (km)"));
ks.append("text").attr("x", m.l - 70).attr("y", m.t - 14).attr("font-size", 28).attr("font-weight", 600).attr("fill", css("--ink2")).text(EDU.tr("车费（元）", "Fare ($)"));
const kline = ks.append("line").attr("x1", kx(0)).attr("x2", kx(14)).attr("y1", ky(D.s1.base)).attr("y2", ky(D.s1.base + D.s1.per_km * 14))
  .attr("stroke", css("--accent")).attr("stroke-width", 7).attr("stroke-linecap", "round").node();
const kdots = D.s1.rides.map(r => ks.append("circle").attr("cx", kx(r.km)).attr("cy", ky(r.fare)).attr("r", 10).attr("fill", css("--ink")).node());
const k1 = knob("#knobs", { size: 170, min: 0, max: 20, value: D.s1.base, left: 10, top: 0, label: EDU.tr("起步价", "Base fare"), fmt: v => v.toFixed(1) });
const k2 = knob("#knobs", { size: 170, min: 0, max: 5, value: D.s1.per_km, left: 260, top: 0, label: EDU.tr("每公里", "Per km"), fmt: v => v.toFixed(2) });

/* l02–l03 一天的车费：弯的；直线平平穿过 */
const C = dayChart("#day", { W, H });
const labs = [
  C.note(EDU.tr("早高峰", "Morning rush"), 8.2, 33.5, -60, -62, "caption c-bad"),
  C.note(EDU.tr("晚高峰", "Evening rush"), 18.3, 37, -64, -62, "caption c-bad"),
  C.note(EDU.tr("半夜", "Late night"), 1.4, 30.5, -30, -62, "caption c-bad"),
];
gsap.set([ks.node(), kline, ...kdots, "#knobs", C.svg.node(), C.line, ...C.dots, ...C.gaps, ...labs, "#say1", "#say2", "#name"], { opacity: 0 });
// l01
EDU.in(ks.node(), EDU.t("l01", 0), { y: 0, d: .5 });
EDU.in(kdots, EDU.t("l01", .05), { stagger: .03 });
EDU.in(kline, EDU.t("l01", .35)); EDU.draw(kline, EDU.t("l01", .35), .9);
EDU.in("#knobs", EDU.t("l01", .45)); EDU.in("#say1", EDU.t("l01", .75));
// l02 换成一天里的时刻
EDU.out([ks.node(), "#knobs", "#say1"], EDU.t("l02", 0));
EDU.in(C.svg.node(), EDU.t("l02", .05), { y: 0, d: .5 });
EDU.in(C.dots, EDU.t("l02", .1), { stagger: .015 });
EDU.in(labs, EDU.t("l02", .55), { stagger: .25 });
// l03 只会画直线
EDU.in(C.line, EDU.t("l03", .25)); EDU.draw(C.line, EDU.t("l03", .25), .9);
EDU.in(C.gaps, EDU.t("l03", .5), { stagger: .01 }); EDU.in("#say2", EDU.t("l03", .55));
// l04 神经网络
EDU.out(["#say2"], EDU.t("l04", 0)); EDU.dim([C.svg.node(), ...labs], EDU.t("l04", .1), .25);
EDU.in("#name", EDU.t("l04", .45));
EDU.out([C.svg.node(), ...labs, "#name"], EDU.S.duration - .5);
</script>
