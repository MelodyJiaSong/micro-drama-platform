<style>
  .eb { position: absolute; left: var(--mx); top: var(--mt); }
  .mach { position: absolute; left: var(--mx); top: 300px; width: 760px; height: 400px; }
  .mach .tag { position: absolute; left: 34px; top: 22px; }
  .ttl { position: absolute; left: 960px; top: 220px; }
  .ttl .t { position: absolute; left: 0; top: 0; white-space: nowrap; }
  html[lang=en] .ttl .t { font-size: 60px; }
  #bars { position: absolute; left: 960px; top: 420px; }
  .cnt { position: absolute; left: 960px; top: 420px; }
  .cnt .v { font-size: 150px; font-weight: 700; line-height: 1; color: var(--d-bad); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cnt .note { font-size: var(--fs-h2); font-weight: 600; color: var(--ink2); margin-top: 18px; }
  .arw { position: absolute; font-size: 64px; font-weight: 700; line-height: 1; transform: translateX(-50%); }
</style>

<div class="eb eyebrow" data-zh="01 · 挨个试，行不通" data-en="01 · Too many knobs to try"></div>
<div class="mach card" id="mach"><div class="tag eyebrow" data-zh="模型" data-en="Model"></div></div>
<div class="ttl">
  <div class="h1 t" id="ta" data-zh="差多少 = 错误" data-en="The gap = error"></div>
  <div class="h1 t" id="tb" data-zh='训练：拧旋钮，<span class="accent">压低损失</span>' data-en='Training: <span class="accent">lower the loss</span>'></div>
  <div class="h1 t" id="tc" data-zh="坡度合起来 = 梯度" data-en="All slopes = gradient"></div>
  <div class="h1 t" id="td" data-zh="笨办法：挨个试" data-en="The slow way"></div>
</div>
<svg id="bars"></svg>
<div class="cnt" id="cnt"><div class="v"><span class="h2" data-zh="试了 " data-en=""></span><span id="cv">0</span><span class="h2" id="cu" data-zh=" 个" data-en=" knobs tried"></span></div>
  <div class="note" id="cn" data-zh="重算一遍，看错误变没变" data-en="Nudge → rerun → compare"></div></div>
<div class="cnt" id="cnt2"><div class="v" data-zh="几十亿遍" data-en="Billions"></div>
  <div class="note" data-zh="才走一步" data-en="of runs, per step"></div></div>

<script>
const T = EDU.tl, mach = document.getElementById("mach");
const ks = [0, 1, 2].map(i => knob(mach, { size: 170, left: 150 + i * 230, top: 210, min: 0, max: 10, value: [6, 3, 7.5][i], fmt: () => "", readingSize: 1 }));
/* 猜的 / 正确答案 两根横条，红色那段 = 错误 */
const svg = d3.select("#bars").attr("width", 820).attr("height", 300), sx = d3.scaleLinear([0, 40], [180, 800]);
const lab = (t, y, col = "--ink2") => svg.append("text").attr("x", 0).attr("y", y).attr("font-size", 40).attr("font-weight", 600).attr("fill", css(col)).text(t).node();
const lg = lab(EDU.tr("猜的", "Guess"), 70), la = lab(EDU.tr("正确答案", "Answer"), 190);
const bg = svg.append("rect").attr("x", sx(0)).attr("y", 30).attr("height", 56).attr("rx", 12).attr("fill", css("--accent")).attr("width", sx(34) - sx(0)).node();
const ba = svg.append("rect").attr("x", sx(0)).attr("y", 150).attr("height", 56).attr("rx", 12).attr("fill", css("--ink2")).attr("width", sx(23) - sx(0)).node();
const gap = svg.append("rect").attr("x", sx(23)).attr("y", 24).attr("height", 68).attr("rx", 8).attr("fill", "none").attr("stroke", css("--d-bad"))
  .attr("stroke-width", 6).attr("stroke-dasharray", "10 8").attr("width", sx(34) - sx(23)).node();
const ge = svg.append("text").attr("x", (sx(23) + sx(34)) / 2).attr("y", 270).attr("text-anchor", "middle").attr("font-size", 40).attr("font-weight", 700)
  .attr("fill", css("--d-bad")).text(EDU.tr("错误", "Error")).node();
const tick = svg.append("line").attr("x1", sx(23)).attr("x2", sx(23)).attr("y1", 20).attr("y2", 220).attr("stroke", css("--d-bad")).attr("stroke-width", 3).node();
const state = { g: 34 };
const setG = v => { bg.setAttribute("width", sx(v) - sx(0)); gap.setAttribute("width", Math.max(2, sx(v) - sx(23))); ge.setAttribute("x", (sx(23) + sx(v)) / 2); };
/* 每个旋钮上方的「往哪拧」箭头 */
const arr = ["↻", "↺", "↻"].map((a, i) => { const e = document.createElement("div"); e.className = "arw accent"; e.textContent = a;
  e.style.left = (150 + i * 230) + "px"; e.style.top = "300px"; mach.parentNode.append(e); return e; });
arr.forEach((e, i) => { e.style.left = (120 + 150 + i * 230) + "px"; e.style.top = "600px"; });
const CV = document.getElementById("cv");

gsap.set(["#mach", "#ta", "#tb", "#tc", "#td", "#bars", lg, la, bg, ba, gap, ge, tick, ...arr, "#cnt", "#cnt2"], { opacity: 0 });
EDU.in(".eb", 0);
// l07 模型猜个答案，跟正确答案一比：差多少就是错误
EDU.in("#mach", EDU.t("l07", .05)); EDU.in("#bars", EDU.t("l07", .1), { y: 0, d: .01 });
EDU.in([lg, bg], EDU.t("l07", .2)); EDU.in([la, ba], EDU.t("l07", .45)); EDU.in([gap, ge, tick], EDU.t("l07", .7)); EDU.in("#ta", EDU.t("l07", .7));
// l08 损失；训练 = 拧旋钮，让错误变小
EDU.out("#ta", EDU.t("l08", .35)); EDU.in("#tb", EDU.t("l08", .4));
ks[0].turn(EDU.t("l08", .5), 6, 4.2, 1.3); ks[1].turn(EDU.t("l08", .5), 3, 4.6, 1.3);
T.fromTo(state, { g: 34 }, { g: 28, duration: 1.3, ease: "power2.inOut", immediateRender: false, onUpdate: () => setG(state.g) }, EDU.t("l08", .5));
// l09 梯度：每个旋钮往哪拧，错误降得最快
EDU.out("#tb", EDU.t("l09")); EDU.in("#tc", EDU.t("l09", .05)); EDU.in(arr, EDU.t("l09", .3), { stagger: .2 });
// l10 笨办法：挨个试，拧一点点、重算一遍
EDU.out(["#tc", ...arr, "#bars"], EDU.t("l10")); EDU.in("#td", EDU.t("l10", .03)); EDU.in("#cnt", EDU.t("l10", .1));
[0, 1, 2].forEach(i => { const at = EDU.t("l10", .3 + i * .2); ks[i].wiggle(at, 1.2, .5); countTo(CV, at + .25, i, i + 1, .2, v => Math.round(v)); });
// l11 有多少旋钮就重算多少遍：几十亿遍，才走一步
EDU.out("#cnt", EDU.t("l11", .45)); EDU.in("#cnt2", EDU.t("l11", .5));
</script>
