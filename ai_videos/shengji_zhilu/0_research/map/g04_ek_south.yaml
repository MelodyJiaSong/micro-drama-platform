    note_zh: 【挂靠裁定】黑石山在旧世是独立地区（zone id 25），地理上同时接燃烧平原与灼热峡谷。本树把它作为 zone 挂在 khaz_modan 下（依据 warcraft.wiki.gg 的 Khaz Modan 地区条目明确把 Blackrock Mountain 列入），并在燃烧平原、灼热峡谷两侧各挂一个入口 poi 指向它——「一份几何，两道门」，避免同一座山被登记两次
    source_url: https://warcraft.wiki.gg/wiki/Blackrock_Mountain
