    look_zh: "铁炉堡东北高处一片被雪峰环抱的山间平谷，两条压实的雪地跑道并排铺开，旁边几栋石砌矮人营房与木塔，停机位上蹲着侏儒式的螺旋桨飞行器，天光冷白、雪面反光刺眼"
    note_zh: "1.12 里它在地图与美术上都存在（雪山上能看到跑道与飞机，飞铁炉堡—米奈希尔的狮鹫从上空掠过），但没有客户端子区域名、也无路可达（只能爬山卡上去）；「Ironforge Airfield」这个名字、飞行点与失火剧情都是 4.0.3a 才有的。入镜只能当作「远眺的高山机场」，不能写飞行点、不能写着火。name_zh 取正式服 AreaTable 5115"
