    name_zh: "萨多尔大桥"
    name_en: "Thandol Span"
    level: ""
    faction: "contested"
    coords: ""
    adjacent: []
    era: "vanilla"
    look_zh: "高地南缘峡谷上两座巨型灰白石拱桥的北端桥头，桥墩粗如塔楼，桥面宽可并行车马；从阿拉希一侧望去，桥对岸是湿地的雾气与暗绿沼林，脚下是深不见底的峡谷。"
    note_zh: "阿拉希高地通湿地的唯一陆路。客户端把大桥按所属 zone 拆成两条 AreaTable：880 挂阿拉希高地（45）、881 挂湿地（11），两条都在 1.15 Classic Era 表里，即 1.12 就有；湿地树已有 thandol_span（poi），本条是阿拉希一侧的同名子区域，沿用禁忌之海的「按 zone 各建一节点 + 限定后缀」惯例。旧世两桥之一已被黑铁矮人炸断、只余一桥可走（wiki 该节标 Classic only，4.0.3a 起改动）。"
    source_url: "https://warcraft.wiki.gg/wiki/Thandol_Span"
    quote: "The Thandol Span is a set of massive stone bridges connecting the Wetlands of northern Khaz Modan with the Arathi Highlands of southeastern Lordaeron."
    verified_by: "ai_read"

  # ── 荒芜之地 Badlands ──
