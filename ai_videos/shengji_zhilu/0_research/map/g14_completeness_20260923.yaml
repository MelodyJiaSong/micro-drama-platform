    look_zh: "铁趾挖掘场东南一座矮山顶上的无标记洞口，沿一条天然小径上去；洞底是一间昏暗石室，四壁堆着骨灰瓮、木箱与散落的骸骨，正中一具披甲骷髅端坐在石王座上，座旁竖着一柄长剑。"
    note_zh: "1.12 已存在的微型地下城（Badlands (Classic) 子区域表列出），没有 AreaTable 条目、地图上不显示名字，所以客户端无官方简中译名。剧情上是「野蛮人王之剑」的所在，向《野蛮人柯南》墓穴取剑一幕致敬；适合作探险者协会/盗宝的封闭小场景。页面提到的稀有怪 Zormus 是 5.1.0 才加的，旧世没有。〔2026-09-23 更正：简中名「墓穴」取自 Classic Era 1.15.9 客户端 WMOAreaTable zhCN〕"
    source_url: "https://warcraft.wiki.gg/wiki/Crypt_(Badlands)"
    quote: "The Badlands Crypt is located southeast of Hammertoe's Digsite, at the top of the hill behind Sigrun Ironhew. Its entrance is via a natural and unmarked path up the hill. The bottom of the Crypt contains a number of urns, chests, and skeletons, with the centerpiece being an armored skeleton seated on a throne with the Sword of the Barbarian King next to it."
    verified_by: "ai_read"

