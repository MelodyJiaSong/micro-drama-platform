# G03 · 暴风城（Stormwind City）地理树 —— 版本锚点：经典旧世 Vanilla / Classic Era（1.12）
# 本文件是本片区树数据的唯一出处。非树数据（自查对账 / 版本差异 / 存疑 / 图源 / 提醒）见 g03_stormwind_city_notes.md。
