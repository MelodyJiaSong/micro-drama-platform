  # ============================================================
  # L0 · 城市本体
  # ============================================================
  - id: stormwind_city
    parent: kingdom_of_stormwind
    type: city
    subtype: ""
    name_zh: 暴风城
    name_en: Stormwind City
    level: ""
    faction: alliance
    coords: ""
    adjacent: [elwynn_forest]
    era: vanilla
    look_zh: 白灰石砌的人类王城，若干近似矩形的街区被碧蓝深水运河切开，石拱桥横跨水面，屋顶蓝灰石板、旗幡蓝金配色，每个街区角落都长着结果的苹果树
    note_zh: 人类首都；旧世只有两个入口——英雄谷陆路正门与矮人区的矿道地铁（港口是 3.0.2 才有）；全城约 640×600 m、步行穿城 4–5 分钟（sk2:stormwind.city.047/048）；adjacent 只在本节点填（暴风城在世界地图上本身就是一个 zone），见 notes §5
    source_url: https://warcraft.wiki.gg/wiki/Stormwind_City
    quote: "The city is made up of roughly rectangular districts separated by canals."
    verified_by: ai_read

  - id: stormwind_city_walls
    parent: stormwind_city
    type: poi
    subtype: ""
    name_zh: 暴风城城墙
    name_en: Walls of Stormwind City
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 高厚的白石城墙环抱全城，墙顶是可通行的加宽平台，垛口连续，墙面无窗，蓝金旗幡沿垛口一字挂开
    note_zh: 狮鹫管理员、飞行训练师与坐骑商人都在城墙上（sk2:stormwind.city.033）；城墙上没有第二道城门，去赤脊山/西部荒野/暮色森林都得先出正门回艾尔文森林
    source_url: https://warcraft.wiki.gg/wiki/Stormwind_City
    quote: "The gryphon master, the flying trainer, and the mount vendor are on the walls of the city."
    verified_by: ai_read

  # ============================================================
  # L1 · 九个城区（旧世 6 个正式区名 + 暴风要塞 + 英雄谷 + 运河区）
  # ============================================================
  - id: valley_of_heroes
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 英雄谷
    name_en: The Valley of Heroes
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 城门内外一整块绿意盎然的天然盆地，一座宽阔石桥横跨谷底的窄护城水面，桥两侧立着远超真人尺度的巨型石雕像，主路尽头在雕像前分成左右两岔
    note_zh: 位于城市南侧，含城门本身；所有入城者看到的第一眼；旧世的骑马将军是马库斯·乔纳森，不是哈蒙德·克雷（sk2 版本错置清单第 10 条）
    source_url: https://warcraft.wiki.gg/wiki/Valley_of_Heroes
    quote: "The Valley of Heroes is a valley that lies before Stormwind Gate. A bridge of stone crosses the narrow moat and is the first sight of all who enter. This gloriously lush valley lies south of the city"
    verified_by: ai_read

  - id: trade_district
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 贸易区
    name_en: Trade District
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 全城最中心也最吵的街区，两三层白石商铺围合出一片开阔石板广场，底层开敞为铺面、上层住人，摊位与行商挤满街面，正中一座石砌圆喷泉
    note_zh: 又叫集市区（Bazaar District）；进正门后的第一块地方；银行/邮箱/旅店在西南侧，狮鹫管理员在东侧一道坡道上去（sk2:stormwind.district.011b）
    source_url: https://warcraft.wiki.gg/wiki/Trade_District
    quote: "The bank, mailbox, and inn are on the southwest side of the Trade District. The Gryphon Master is up a ramp on the east side."
    verified_by: ai_read

  - id: old_town
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 旧城区
    name_en: Old Town
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 墙体是发黄发灰的旧石与外露的深褐木构架，街道狭窄曲折、地面湿污，墙面爬着水渍霉斑，屋檐低垂几乎相接，晾衣绳横跨巷口
    note_zh: 贸易区以东，全城最老的一块（没被兽人烧过，所以从未真正重建）；也是全城穷人的居住区，乞丐窃贼都在这儿；走法：贸易区往东北 / 要塞往南 / 矮人区往东南
    source_url: https://warcraft.wiki.gg/wiki/Old_Town
    quote: "It is a rustic, downtrodden place, where the streets are described as far dirtier and smellier than the other districts."
    verified_by: ai_read

  - id: mage_quarter
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 法师区
    name_en: Mage Quarter
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 一座爬满深绿藤蔓的高塔统领全区，四周是两层的裁缝铺与仓库，门口堆着捆扎布匹与封蜡陶罐，沿街摆着露天咖啡座
    note_zh: 城市西南角（官方导览语）/ 南角（wiki 语）；从教堂广场或贸易区来都要向西南跨过运河；全城海拔最高的一块，巫师圣殿入口比花园区高约 40 码
    source_url: https://warcraft.wiki.gg/wiki/Mage_Quarter
    quote: "The Mage Quarter (also called the Mage District or the Mage's District) lies in the southern corner of Stormwind City."
    verified_by: ai_read

  - id: cathedral_square
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 教堂广场
    name_en: Cathedral Square
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 一片开阔石铺广场，北端被一座多侧翼、多尖塔的巨大教堂立面完全统治，广场两侧是较矮的市政厅与孤儿院，衬得教堂更高
    note_zh: 贸易区以北，圣光信徒的宗教中心；走法：贸易区往西北、矮人区往东南；【旧世红线】广场中心是阿隆索斯·法奥纪念碑，不是乌瑟尔雕像；旧世的教堂广场后面**没有**暴风湖与暴风城公墓（那两处是 4.0.3a 才加的，见 notes §2）
    source_url: https://warcraft.wiki.gg/wiki/Stormwind_City
    quote: "To the north of the Trade District is Cathedral Square, the religious center for all followers of the Holy Light."
    verified_by: ai_read

  - id: dwarven_district
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 矮人区
    name_en: Dwarven District
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 矮胖敦实的石构建筑，门窗比人类区低矮、比例更厚重，铁件与铆钉外露；数处露天广场上并排立着燃着炭火的锻炉与铁砧，橙红火星四溅，整个街区笼在一层不散的灰蓝烟雾里
    note_zh: 全城北角、教堂广场以东；第二次战争后为安置麦格尼国王派来的工匠而设；走法：教堂广场往东北 / 旧城区往西北 / 要塞往西 / 或直接坐矿道地铁到站；【旧世】区内没有拍卖行、没有皇家银行、旅店「黄金酒桶」也不存在（都是 4.0.3a）
    source_url: https://warcraft.wiki.gg/wiki/Dwarven_District
    quote: "The Dwarven District lies in the northern corner of Stormwind City. Here, the dwarves of Ironforge established an enclave after the Second War to house all the workers sent by King Magni."
    verified_by: ai_read

  - id: stormwind_park
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 花园区
    name_en: The Park
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 与全城的白石硬铺完全相反——地面是草与土径，高大乔木成荫、树影斑驳，建筑稀疏矮小依树而建，整体色调比别处更绿更柔；正中一口自发光的乳白偏冷蓝月亮井
    note_zh: 【旧世独有】城市西角；原是市民休闲地，后成了来访暗夜精灵的聚居处；东部王国唯一有德鲁伊训练师的地方；走法：教堂广场往西南 / 法师区往西北；4.0.3a 被死亡之翼整块掀飞，7.0.3 原址建雄狮之眠——正片里必须是**完好的绿地**
    source_url: https://warcraft.wiki.gg/wiki/Park
    quote: "The Park used to be the district located in the western corner of Stormwind City. It was once a place devoted to leisure activities for Stormwind's populace until it became a refuge for visiting night elves"
    verified_by: ai_read

  - id: stormwind_keep
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 暴风要塞
    name_en: Stormwind Keep
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 建在全城最高岩石台地上的多体量城堡群，主厅居中、四周簇拥方塔圆塔，塔顶覆深蓝灰石板，建筑之间以带连续券拱的高架廊道相连，明显高出周围街区一大截
    note_zh: 矮人区与旧城区之间，王国权力中枢；进法是沿运河一路往北、过一座**吊桥**进内庭院；【旧世】王座上坐的是幼年安度因，博瓦尔·弗塔根摄政、卡特拉娜·普瑞斯托任顾问；4.0.3a 内外全面重制（露天步道+大喷泉）——那个样子不得入画
    source_url: https://warcraft.wiki.gg/wiki/Stormwind_City
    quote: "Rising high between the Dwarven District and Old Town, the keep is the seat of power of the kingdom and serves as the residence of the Stormwindian kings"
    verified_by: ai_read

  - id: stormwind_canals
    parent: stormwind_city
    type: district
    subtype: ""
    name_zh: 运河区
    name_en: The Canals / Canal District
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 深而清澈的碧蓝水道穿城而过，两岸是大理石步道与系船石桩，堤顶到水面有明显落差，沿岸嵌着一排一两开间宽的小店门脸，石拱桥横跨水上
    note_zh: 不是一个环，而是若干段拼成的网，每段以「相邻两区之间」命名；【旧世是深水】——4.0.3a 才被淤泥半填成能趟过去的浅水，正片里不得出现淤泥/芦苇/露出水面的杂物；运河里还有一只传说中的白化巨鳄
    source_url: https://warcraft.wiki.gg/wiki/Canals_(Stormwind_City)
    quote: "The Canals, located in the Canal District, are a series of waterways that wind their way through Stormwind City, separating each of its various districts."
    verified_by: ai_read

