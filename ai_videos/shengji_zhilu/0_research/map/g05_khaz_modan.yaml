    subtype: village
    name_zh: 安威玛尔
    name_en: Anvilmar
    level: ""
    faction: alliance
    coords: "[29, 69]"
    adjacent: []
    era: vanilla
    look_zh: 山谷尽头一座半嵌进岩壁的石砌大屋，门口两盏铁灯笼、屋内一座常烧的火塘，门外雪地上排着一列训练假人
    note_zh: 玩家睁眼的第一个点：新手导师、第一批任务与职业训练师都在这里；名字来自铁炉堡的安威玛尔家族
    source_url: https://warcraft.wiki.gg/wiki/Coldridge_Valley
    quote: "The valley contains the settlement of Anvilmar and connects to the broader zone through Coldridge Pass."
