  - id: dun_morogh
    parent: khaz_modan
    type: zone
    subtype: ""
    name_zh: 丹莫罗
    name_en: Dun Morogh
    level: "1-10"
    faction: alliance
    coords: ""
    adjacent: [ironforge, loch_modan]
    era: vanilla
    look_zh: 终年积雪的高山盆地，深绿云杉压着厚雪，灰蓝天光下是冻住的湖面、石砌矮人小屋的红瓦斜顶与冒黑烟的矿车轨道
    note_zh: 矮人与侏儒共用的新手区；旧世里唯一的陆路出口是东边南北两条门径通往洛克莫丹，另有铁炉堡大门进城。4.0.3 后地貌大改（新增新工匠镇 / 冰雪谷塌陷等），本树一概不收
    source_url: https://warcraft.wiki.gg/wiki/Dun_Morogh
    quote: "Dun Morogh is a snowy, forested mountain range in western Khaz Modan."
    verified_by: ai_read

  - id: coldridge_valley
    parent: dun_morogh
    type: subzone
    subtype: ""
    name_zh: 寒脊山谷
    name_en: Coldridge Valley
    level: ""
    faction: alliance
    coords: "[32, 71]"
    adjacent: []
    era: vanilla
    look_zh: 丹莫罗西南角一处被雪山合围的小盆地，一条冻溪穿过缓坡，坡上散着小木屋与训练假人，雪地被踩成泥灰色的小路
    note_zh: 旧世矮人与侏儒共同的出生山谷（侏儒的新工匠镇是 4.0.3 才分出去的）；出口只有东边的寒脊山小径
    source_url: https://warcraft.wiki.gg/wiki/Coldridge_Valley
    quote: "The primary threats to the valley in the cataclysm era are earthquake hazards, troggs, and Frostmane trolls, the latter two of which have been stirred up by the quakes."
    verified_by: ai_read

  - id: anvilmar
