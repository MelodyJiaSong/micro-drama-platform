# G05 · 卡兹莫丹 + 铁炉堡 —— 经典旧世 Vanilla / Classic Era (1.12) 地理树
# 本文件是树数据的唯一出处；非树信息见 g05_khaz_modan_notes.md
#
# 主要取源：
#   A) wago.tools DBC 导出 —— Classic Era 构建 1.15.9.69722 的 AreaTable（enUS + zhCN）、
#      UiMap / UiMapAssignment / WorldMapOverlay / AreaPOI / TaxiNodes / LFGDungeons。
#      这是「哪些地名属于旧世」和「国服官方简体译名」的机器可核对底稿。
#   B) warcraft.wiki.gg 逐个 zone / 地点页（人眼读过，quote 为原句）。
#   C) 铁炉堡各区在 Classic AreaTable 里没有条目（城内分区是地图美术标签，不是 subzone），
#      其官方中文名取自正式服 AreaTable（构建 12.1.0.69875，zhCN）——同名同地，译名沿用。
#      正式服也查不到的，按规则保留英文原名并在 note_zh 标注。

