    subtype: ""
    name_zh: 寒脊山小径
    name_en: Coldridge Pass
    level: ""
    faction: alliance
    coords: "[37, 67]"
    adjacent: []
    era: vanilla
    look_zh: 一条凿穿山体的窄隧道，顶上垂着冰棱，洞壁架着木支撑与几盏油灯，尽头亮出丹莫罗的雪原
    note_zh: 新手山谷通往丹莫罗本体的唯一通道，洞里蹲着石腭穴居人（旧世第一个「必须打过去」的关口）。4.0.3 后此洞塌陷
    source_url: https://warcraft.wiki.gg/wiki/Coldridge_Valley
