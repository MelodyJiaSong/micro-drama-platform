# G12 · 交通网（飞行点 · 船 · 地铁 · 传送门）
# 版本锚点：经典旧世 Vanilla / Classic Era 1.12
# 树数据唯一出处 —— 非树信息一律在 g12_transport_notes.md，勿在此重复
nodes:

  # ============================================================
  # A. 矿道地铁 Deeprun Tram（暴风城 ↔ 铁炉堡）
  #    本段结论全部复用 sk2 既有调研，见 notes.md §1
  # ============================================================

  - id: deeprun_tram
    parent: eastern_kingdoms
    type: transport
    subtype: tram
    name_zh: 矿道地铁
    name_en: Deeprun Tram
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 全封闭地下双轨隧道，铁灰色窄轨嵌在深褐枕木上，青灰花岗岩凿面岩壁，无天光，照明只来自隧道自身
    note_zh: 免费；两列各三节车厢往返，单程 60 秒、每站停 12 秒；连接暴风城矮人区与铁炉堡机械侏儒区。官方简中译名是「矿道地铁」，不是「深铁矿道」。6 ADP 由 Magni 委托 Mekkatorque 开建，vanilla 当下（25 ADP）已通车约 19 年，是通勤日常而非新鲜事物。
    source_url: https://warcraft.wiki.gg/wiki/Deeprun_Tram
    quote: "The Deeprun Tram (or simply the Tram) is a long, fully enclosed, underground (and partially underwater) set of double tracks upon which rolls two sets of three wagons, all credited to the gnomes' technical engineering."
    verified_by: ai_read

  - id: deeprun_tram_stormwind_station
    parent: "dwarven_district"
    type: transport
    subtype: tram
    name_zh: 矿道地铁·暴风城站
    name_en: Deeprun Tram - Stormwind City Station
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 地下石砌站台，无闸机无售票窗口无收费员，站台端头一道带横向防滑凿槽的石坡接入轨道层，人流密集
    note_zh: 入口在矮人区东侧一条隧道；卫兵指路称它「在矮人区靠里面」。站台无卫兵驻守，PvE 服上属中立地界。掉下站台不会被碾——车从头顶无害驶过。vanilla 站上人物：侏儒小贩 Nipsy 卖「矿道鼠肉串」。比兹莫搏击俱乐部（Year 30 ADP）在 vanilla 不存在。
    source_url: https://warcraft.wiki.gg/wiki/Travel_guide_to_Deeprun_Tram_and_boats
    quote: "The Stormwind City end of the Deeprun Tram line is accessible through a tunnel on the east side of the district."
    verified_by: ai_read

  - id: deeprun_tram_ironforge_station
    parent: "tinker_town"
    type: transport
    subtype: tram
    name_zh: 矿道地铁·铁炉堡站
    name_en: Deeprun Tram - Ironforge Station
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 与暴风城站同形制的地下石砌站台，四周是侏儒机械区的黄铜管线与齿轮，蒸汽从接缝逸出
    note_zh: 位于铁炉堡东北的机械侏儒区（Tinker Town）。次序是先有车站、后有街区——侏儒失去诺莫瑞根后在已建成的车站所在区域造起机械侏儒区。站上人物：侏儒「灭鼠专家」Monty（海盗腔）、麻风侏儒 Haggle。
    source_url: https://warcraft.wiki.gg/wiki/Travel_guide_to_Deeprun_Tram_and_boats
    quote: "The gnomes constructed Tinker Town in the district where the Ironforge Deeprun Tram station had been built."
    verified_by: ai_read

  - id: deeprun_tram_stormwind_gear_gate
    parent: deeprun_tram_stormwind_station
    type: poi
    subtype: ""
    name_zh: 矿道地铁暴风城口·巨型齿轮门
    name_en: Deeprun Tram Stormwind Entrance Gear
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 洞口外圈一枚直径数倍于人高的巨型齿轮，铁灰铸铁齿牙、齿面黄铜镶边与铆钉，绕洞口缓慢转动，洞内漆黑
    note_zh: 两端入口同形制，绝不会认错；是「进城/出城」镜头最好用的视觉标记。
    source_url: https://warcraft.wiki.gg/wiki/Travel_guide_to_Deeprun_Tram_and_boats
    quote: "a tunnel surrounded by a great big rotating gear"
    verified_by: ai_read

  - id: deeprun_tram_ironforge_gear_gate
    parent: deeprun_tram_ironforge_station
    type: poi
    subtype: ""
    name_zh: 矿道地铁铁炉堡口·巨型齿轮门
    name_en: Deeprun Tram Ironforge Entrance Gear
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 同暴风城口形制的巨型转动齿轮框住隧道口，背景是机械侏儒区的暖黄炉火与铜管
    note_zh: 见 deeprun_tram_stormwind_gear_gate。
    source_url: https://warcraft.wiki.gg/wiki/Travel_guide_to_Deeprun_Tram_and_boats
    quote: "a tunnel surrounded by a great big rotating gear"
    verified_by: ai_read

  - id: deeprun_tram_underwater_lake
    parent: deeprun_tram
    type: poi
    subtype: ""
    name_zh: 矿道地铁水下段（地下湖）
    name_en: Deeprun Tram Underwater Section
    level: ""
    faction: neutral
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 隧道穿过一片幽闭水体，水色深墨绿转青黑，无天光，光只来自隧道自身，水面在上方看不见
    note_zh: 所谓「水下段」其实是施工期挖穿的那座地下湖，同一个东西。水里有宝箱、一名戴潜水头盔的侏儒 Deeprun Diver、数艘沉船、boss 级生物 Nessy（致敬尼斯湖水怪，玩家无法接近）、巨蚌、两只娜迦海妖、一条姥鲨。隧道确实从「大海」极小的一角底下穿过。
    source_url: https://warcraft.wiki.gg/wiki/Deeprun_Tram
    quote: "the Deeprun Tram actually passes under a very small portion of 'The Great Sea'."
    verified_by: ai_read

  # ============================================================
  # B. 船与码头（vanilla 共 5 条航线 / 10 个码头）
  # ============================================================

  - id: dock_menethil_to_theramore
    parent: menethil_harbor
    type: transport
    subtype: boat
    name_zh: 米奈希尔港·塞拉摩航线码头
    name_en: Menethil Harbor Dock - Theramore Isle
    level: ""
    faction: alliance
    coords: "[11, 52]"
    adjacent: []
    era: vanilla
    look_zh: 灰绿湿地水色上的木栈桥，桥头立着湿漉漉的系缆桩与油灯，远处是米奈希尔堡的方形石塔
    note_zh: 联盟。船名 The Lady Mehley（《美莉女士号》，官方中文译名未查到）。这是联盟「东部王国 → 卡利姆多主线」的标准航路：铁炉堡/暴风城 → 米奈希尔港 → 塞拉摩岛。
    source_url: https://warcraft.wiki.gg/wiki/Menethil_Harbor
    quote: "It has also The Lady Mehley boat that sails to the Ruins of Theramore in Dustwallow Marsh, on the continent of Kalimdor"
    verified_by: ai_read

  - id: dock_theramore_to_menethil
    parent: "theramore_isle"
    type: transport
    subtype: boat
    name_zh: 塞拉摩岛·米奈希尔港航线码头
    name_en: Theramore Isle Dock - Menethil Harbor
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 沼泽咸水边的木质深水码头，岸上一排弩炮与火炮对着海面，背后是塞拉摩的白石高塔
    note_zh: 联盟。与 dock_menethil_to_theramore 对开。塞拉摩岛靠一座桥与尘泥沼泽本土相连。注意：塞拉摩毁于《熊猫人之谜》的魔能炸弹，vanilla 时完好。
    source_url: https://warcraft.wiki.gg/wiki/Theramore_Isle
    quote: "numerous ballistae and cannons to sink enemy naval vessels"
    verified_by: ai_read

  - id: dock_menethil_to_auberdine
    parent: menethil_harbor
    type: transport
    subtype: boat
    name_zh: 米奈希尔港·奥伯丁航线码头
    name_en: Menethil Harbor Dock - Auberdine
    level: ""
    faction: alliance
    coords: "[11, 52]"
    adjacent: []
    era: vanilla
    look_zh: 与塞拉摩码头并列的另一座木栈桥，停靠一条人类样式的大帆船，桅索在海风里绷直
    note_zh: 联盟。船名 The Bravery（官方中文译名未查到）。3.0.2 起航线改为暴风城港口出发、4.0.3a 起终点改鲁瑟兰村——vanilla 的形态是 米奈希尔港 ↔ 奥伯丁。这是联盟去黑海岸/泰达希尔的唯一水路。
    source_url: https://warcraft.wiki.gg/wiki/The_Bravery
    quote: "between Menethil Harbor in the Eastern Kingdoms to Auberdine in Kalimdor"
    verified_by: ai_read

  - id: dock_auberdine_to_menethil
    parent: auberdine
    type: transport
    subtype: boat
    name_zh: 奥伯丁·南码头（米奈希尔港航线）
    name_en: Auberdine Southern Pier - Menethil Harbor
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 暗夜精灵风格的弯木码头，月蓝与紫灰调，栈道两侧立着叶形灯柱，背后是灰蓝海雾里的巨树剪影
    note_zh: 联盟。奥伯丁的南侧码头。奥伯丁在大地的裂变中被死亡之翼焚毁、港口沉入海中，由洛达内尔取代——vanilla 时完好。
    source_url: https://warcraft.wiki.gg/wiki/Auberdine
    quote: "Auberdine's port fell into the sea, and most of its buildings were wrecked."
    verified_by: ai_read

  - id: dock_auberdine_to_rutheran
    parent: auberdine
    type: transport
    subtype: boat
    name_zh: 奥伯丁·北码头（鲁瑟兰村航线）
    name_en: Auberdine Northern Dock - Rut'theran Village
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 同风格的第二座弯木码头，停着一条细长的暗夜精灵渡船，船身月白描银、帆为淡紫
    note_zh: 联盟。船名 The Moonspray（官方中文译名未查到），4.0.3a 移除。这是去泰达希尔/达纳苏斯的必经一段：奥伯丁 →（船）→ 鲁瑟兰村 →（传送门）→ 达纳苏斯。
    source_url: https://warcraft.wiki.gg/wiki/Boat
    quote: "The Moonspray (Alliance): Auberdine, Darkshore to Rut'theran Village, Teldrassil - Removed in patch 4.0.3a"
    verified_by: ai_read

  - id: dock_rutheran_to_auberdine
    parent: "rut_theran_village"
    type: transport
    subtype: boat
    name_zh: 鲁瑟兰村·奥伯丁航线码头
    name_en: Rut'theran Village Dock - Auberdine
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 世界树根部海面上的月白色码头群，头顶是遮天的泰达希尔树冠，水面浮着发光的花粉尘
    note_zh: 联盟。鲁瑟兰村是泰达希尔的港口村，坐落在世界树脚下；村里的传送门直通达纳苏斯。vanilla 达纳苏斯城内没有飞行管理员，进出城主要靠这座村子。
    source_url: https://warcraft.wiki.gg/wiki/Rut%27theran_Village
    quote: "There is a portal here that goes directly into Darnassus"
    verified_by: ai_read

  - id: dock_booty_bay_to_ratchet
    parent: booty_bay
    type: transport
    subtype: boat
    name_zh: 藏宝海湾·棘齿城航线码头
    name_en: Booty Bay Dock - Ratchet
    level: ""
    faction: neutral
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 层叠木板搭出的海盗港口，红漆大炮架在崖壁栈道上，桅杆与晾晒的渔网挤满暖黄灯火的海湾
    note_zh: 中立，双阵营通用，免费。船名 The Maiden's Fancy（官方中文译名未查到）。进城要从一条巨鲨的白骨颚骨底下穿过——是本条航线最好认的画面标记。vanilla 区名是荆棘谷（Stranglethorn Vale）；「藏宝海岸 Cape of Stranglethorn」是 4.0.3 拆分后的名字，不进本树。
    source_url: https://warcraft.wiki.gg/wiki/Booty_Bay
    quote: "The Maiden's Fancy in Booty Bay"
    verified_by: ai_read

  - id: dock_ratchet_to_booty_bay
    parent: ratchet
    type: transport
    subtype: boat
    name_zh: 棘齿城·藏宝海湾航线码头
    name_en: Ratchet Dock - Booty Bay
    level: ""
    faction: neutral
    coords: "[68, 71]"
    adjacent: []
    era: vanilla
    look_zh: 黄土海岸上钉出的哥布林木码头，锈铁吊臂与堆叠的货箱，港口小屋是拼补铁皮顶
    note_zh: 中立，双阵营通用。棘齿城属加基森商业联合会，位于贫瘠之地东岸，在奥格瑞玛与塞拉摩岛之间。这是双阵营跨大陆最省钱的一条路。
    source_url: https://warcraft.wiki.gg/wiki/Ratchet
    quote: "Part of the Steamwheedle Cartel, this goblin port city provides a neutral haven for those that wish to trade goods and services in the Barrens."
    verified_by: ai_read

  - id: dock_forgotten_coast_to_feathermoon
    parent: forgotten_coast
    type: transport
    subtype: boat
    name_zh: 被遗忘的海岸·羽月要塞渡口
    name_en: Forgotten Coast Dock - Feathermoon Stronghold
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 菲拉斯西海岸的简易木栈桥伸进浅海，背后是湿热的巨树雨林，海面对岸能看见要塞灯火
    note_zh: 联盟。渡船 Feathermoon Ferry（官方中文译名未查到），连接菲拉斯本土的被遗忘的海岸与萨多尔岛上的羽月要塞，**同一个 zone 内的短程摆渡**。2.3.0 才给它加了船员模型、4.0.3a 随羽月要塞迁到本土而移除——vanilla 已存在。
    source_url: https://warcraft.wiki.gg/wiki/Feathermoon_Ferry
    quote: "Feathermoon Stronghold and the Forgotten Coast in Feralas"
    verified_by: ai_read

  - id: dock_feathermoon_to_forgotten_coast
    parent: "feathermoon_stronghold"
    type: transport
    subtype: boat
    name_zh: 羽月要塞·渡口
    name_en: Feathermoon Stronghold Dock
    level: ""
    faction: alliance
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 海岛上的暗夜精灵哨站码头，紫蓝石阶接木栈桥，岸边立着哨兵雕像与月纹旗
    note_zh: 联盟。vanilla 的羽月要塞在**萨多尔岛（Sardor Isle）**，不在本土；大地的裂变中被海啸摧毁、迁到本土并改名遗址。会游泳也可以直接游过去。
    source_url: https://warcraft.wiki.gg/wiki/Boat
    quote: "Feathermoon Ferry (Alliance): Forgotten Coast, Feralas to Feathermoon Stronghold, Sardor Isle, Feralas - Removed in patch 4.0.3a"
    verified_by: ai_read

