  - id: zeppelin_tower_durotar
    parent: durotar
    type: transport
    subtype: boat
    name_zh: 杜隆塔尔飞艇塔（奥格瑞玛城外）
    name_en: Orgrimmar Zeppelin Tower
    level: ""
    faction: horde
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 红土荒原上一座高耸的原木与兽皮塔架，螺旋坡道绕塔而上，顶端两根挑出的系泊臂各拴一艘鼓胀的飞艇气囊
    note_zh: 部落。**vanilla 时在奥格瑞玛城外的杜隆塔尔地界，不在城内**——4.0.3a 才拆掉外塔、在城内新建两座。塔上两名哥布林飞艇管理员：Frezza（＜提瑞斯法林地飞艇管理员＞，去幽暗城）与 Snurk Bucksquick（＜荆棘谷飞艇管理员＞，去格罗姆高营地）；两人是兄妹。
    source_url: https://warcraft.wiki.gg/wiki/Snurk_Bucksquick
    quote: "Patch 4.0.3a (2010): Model updated and relocated from Durotar to Orgrimmar"
    verified_by: ai_read

  - id: zeppelin_berth_durotar_to_undercity
    parent: zeppelin_tower_durotar
    type: transport
    subtype: boat
    name_zh: 杜隆塔尔塔·幽暗城飞艇位
    name_en: Durotar Zeppelin Berth - Undercity
    level: ""
    faction: horde
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 木平台尽头的系泊臂，飞艇气囊贴着平台缓缓起伏，绳索吱呀作响，脚下是百米红土
    note_zh: 部落，免费。飞艇名 The Thundercaller（＜雷鸣者号＞，官方中文译名未查到），奥格瑞玛 ↔ 幽暗城，跨大海。管理员 Frezza，会提醒「船上禁止吸烟、禁止施放火焰法术」。
    source_url: https://warcraft.wiki.gg/wiki/Frezza
    quote: "This baby will get you to Undercity faster and safer than any boat, and the view is truly breathtaking."
    verified_by: ai_read

  - id: zeppelin_berth_durotar_to_gromgol
    parent: zeppelin_tower_durotar
    type: transport
    subtype: boat
    name_zh: 杜隆塔尔塔·格罗姆高飞艇位
    name_en: Durotar Zeppelin Berth - Grom'gol
    level: ""
    faction: horde
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 同塔另一侧的系泊臂，飞艇吊舱漆成兽皮暗红，舱口挂着部落狼头旗
    note_zh: 部落，免费。飞艇名 The Iron Eagle（＜铁鹰号＞，官方中文译名未查到），奥格瑞玛 ↔ 格罗姆高营地（荆棘谷）。管理员 Snurk Bucksquick。
    source_url: https://warcraft.wiki.gg/wiki/Snurk_Bucksquick
    quote: "The Iron Eagle, which travels to and from Grom'Gol Base Camp in Stranglethorn Vale."
    verified_by: ai_read

  - id: zeppelin_tower_tirisfal
    parent: tirisfal_glades
    type: transport
    subtype: boat
    name_zh: 提瑞斯法林地飞艇塔（幽暗城外）
    name_en: Tirisfal Glades Zeppelin Tower
    level: ""
    faction: horde
    coords: ""
    adjacent: []
