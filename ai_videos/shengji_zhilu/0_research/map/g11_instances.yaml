# G11 · 全副本 / 团本 / 战场总表
# 版本锚点：经典旧世 Vanilla / Classic Era (1.12)
# 本文件是树数据的唯一出处；非树数据（自查对账 / 版本差异 / 存疑 / 地图链接 / 下游提醒 / 副本推进表）
# 见 g11_instances_notes.md
#
# 取源：
#   · warcraft.wiki.gg 各副本条目（优先 "(Classic)" 后缀页，避免抓到大地裂变/熊猫人改版后的 boss 表）
#   · Classic Era 客户端 DBC（wago.tools，build 1.15.9.69722，enUS + zhCN）：
#       Map（副本官方中文名 + 人数上限）· LFGDungeons（官方准入等级带）
#       DungeonEncounter（**每个 boss 的国服官方简体名 + 官方战斗顺序**）
#       WMOAreaTable / AreaTable（副本内部分区的国服官方简体名）
#
# 重要约定（详见 notes.md § ②）：
#   1. `level` 取 wiki 的 classiclevel（怪物等级带 / 玩家口径的「几级打」）；
#      客户端 LFGDungeons 的准入带写在 `note_zh` 里，两者口径不同、不是矛盾。
#   2. boss 节点 type 一律 `poi`（schema 没有 boss 枚举），按官方 OrderIndex 排序，
#      `note_zh` 以「第 N 场」开头。
#   3. 副本内部分区节点，凡已由别的片区（G02/G04/G05/G06/G07）建好的一律不重建，
#      只在 notes.md 给出官方中文名对照表供他们回填。
#   4. 已存在于别的片区的副本根节点，本表按**同 id 同 parent** 重新发出（字段更全），
#      合龙时以本表为准；完整重名清单见 notes.md § ⑤。

