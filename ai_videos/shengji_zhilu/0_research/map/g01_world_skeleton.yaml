  - id: frozen_sea
    parent: the_great_sea
    type: region
    subtype: ""
    name_zh: 冰封之海
    name_en: The Frozen Sea
    level: ""
    faction: neutral
    coords: ""
    adjacent: []
    era: wotlk
    look_zh: 铅灰色极寒洋面，从房子大小到岛屿大小的浮冰与冰山漂在水上，寒风把水面刮成碎浪
    note_zh: G01-V 补入。诺森德以南、一路向南直到大漩涡的那片洋；与南海一样是无尽之海的组成部分（维基原文「Since it is found in between the continents, the Frozen Sea is a portion of the Great Sea」），作者原树漏了它与珊瑚之海两片。**era 记 wotlk 不是 vanilla**——它的游戏内 zone（zone id 3979）与全部内容都是 3.0 才有，vanilla 玩家看不到也去不到，列在这里只为水体层完整。维基自注：游戏里把它画在祖达克以东是摆错了，lore 上它在诺森德以南，诺森德东岸与北岸是「北海 North Sea」。中文名「冰封之海」为直译，国服官方译名未查到（灰机 403 / WebSearch 配额耗尽）
    source_url: https://warcraft.wiki.gg/wiki/Frozen_Sea
    quote: "The Frozen Sea is the large body of water found south of Northrend."
    verified_by: ai_read

  - id: coral_sea
    parent: the_great_sea
    type: region
    subtype: ""
    name_zh: 珊瑚之海
    name_en: The Coral Sea
    level: ""
    faction: neutral
    coords: ""
    adjacent: []
    era: vanilla
    look_zh: 艾萨拉外侧的一片暗色浅海，水下是迷宫般的珊瑚礁，有些礁体贴近水面甚至露出水面，礁间水体被发光的水草与鱼群映亮，天上常年压着暴风云
    note_zh: G01-V 补入。艾萨拉近海，无尽之海的第三个组成部分（维基原文「Since this sea is found in between the continents, it is a part of the Great Sea」）。水面下是上古之战塌陷的暗夜精灵旧都金萨卡拉（Zin-Azshari）与永恒之井旧址。**只是 lore 地名，游戏内没有对应可选中区域**，vanilla 玩家在艾萨拉岸边看到的就是它；名字最早出自 2003 年的 Warcraft RPG，故 era 记 vanilla。中文名「珊瑚之海」为直译，国服官方译名未查到（灰机 403 / WebSearch 配额耗尽）
    source_url: https://warcraft.wiki.gg/wiki/Coral_Sea
    quote: "The Coral Sea is a dark sea near Azshara."
    verified_by: ai_read

