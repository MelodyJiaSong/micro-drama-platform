# G13 · 北郡山谷 + 闪金镇（第 1–5 集拍摄地 · 建筑级地理树）
# 版本锚点：经典旧世 Vanilla / Classic Era（1.12）。大地的裂变（4.0.3a）新增或改动的一律不进本树。
# 坐标系：全部为【艾尔文森林地图帧】。旧世没有独立的北郡地图（北郡自己的地图是 **5.0.4 熊猫人之谜** 才加的，
#         `Northshire_Valley` 的 Patch changes 节原文「Northshire Valley receives its own world map」——
#         核验时修正：原稿写的 4.0.3a 是错的，但「旧世用艾尔文帧」这个结论不变），
#         所以旧世玩家看到的就是艾尔文帧；wiki 信息框里出现的第二组 Northshire 帧坐标一律不采用
#         （wiki 的 coords 模板第三参数会写明是 `Elwynn Forest` 还是 `Northshire`，照它取即可）。
#         细节与对账见 g13_northshire_goldshire_detail_notes.md § 坐标帧。
# 类型约定（本片区自定，已在 notes.md 说明）：settlement = 聚落；单体建筑 / 房间 / 路 / 地标 = poi；
#         会让小地图换名的正式子区域 = subzone。
# faction 约定：人类控制的地点填 alliance；被狗头人 / 迪菲亚占据的洞窟内部与窝点留空串。

nodes:

  # ==========================================================================
  # 一 · 北郡山谷 Northshire Valley
  # ==========================================================================

  - id: northshire_valley
    parent: elwynn_forest
    type: zone
    subtype: ""
    name_zh: 北郡山谷
    name_en: Northshire Valley
    level: ""
    faction: alliance
    coords: "[50.2, 42.2]"
    adjacent: [elwynn_forest]
    era: vanilla
    look_zh: 四面陡峭灰白石壁合围的碗形谷地，谷底是修剪整齐的亮绿草坡与金黄栎树林，一条清溪自北侧山壁跌落横贯谷底，全谷终年停在午后三四点的暖金斜光里
    note_zh: 人族唯一新手区，第 1–5 集主场。仅南端一个谷口通往艾尔文森林；wiki 信息框记统治者为 Marshal Douglas McBride（麦克布莱德元帅）、首府为北郡修道院、种族含人类/兽人/地精/狗头人。**等级带：核验时改空**——原稿填的 "1-10" 无出处，`Northshire_Valley` 的 Infobox zone 里 `level =` 是空字段（"1-10" 是大地的裂变后艾尔文森林整区的带宽，不是本谷的），wiki 全页也没有任何等级表述；要填得另找出处
    source_url: https://warcraft.wiki.gg/wiki/Northshire_Valley
    quote: "Northshire Valley is surrounded by impenetrable mountains, with the exception of a pass to the south which is protected by thick stone walls and a guarded entryway."
    verified_by: ai_read

  - id: northshire_valley_pass
