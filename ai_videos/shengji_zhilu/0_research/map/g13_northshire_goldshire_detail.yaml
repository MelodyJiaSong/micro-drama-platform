    note_zh: 非官方地名（描述性标签）。进出北郡山谷的唯一通路，南接艾尔文森林；wiki 只说这里有石墙与设卫的入口、北郡卫兵在此驻守
    source_url: https://warcraft.wiki.gg/wiki/Northshire_Guard
    quote: "A number of them can be found at the entrance to the valley, and more will arrive if Horde interlopers attack any members of the Alliance who dwell within the valley."
    verified_by: ai_read

