    note_zh: 非官方地名（描述性标签）。串起谷口关卡→修道院前庭的唯一主路，主角每集出入都会走它。核验时把 id 从 `northshire_abbey_road` 改成 `northshire_valley_road`：原 id 说「修道院路」、name_en 写 Northshire Valley Road，同一个节点两个名字
