# s9 st4（13 s）中景双人，固定机位：米莉边写边从推车那边走到亚伦面前站住，边写边低声念出那句话，写完把货单递给他；亚伦读完，把纸放在右大腿上，伸手借炭笔，米莉把炭笔放进他手心。
