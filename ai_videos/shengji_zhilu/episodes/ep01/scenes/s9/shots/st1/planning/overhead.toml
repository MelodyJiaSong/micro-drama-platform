# s9 st1（7 s）主镜头全景，固定机位：阴天傍晚的中庭，尼尔斯点筐（先车上六筐、再车尾东北地上两筐），米莉写货单，亚伦坐在石阶西段看着，杜克坐在同一道石阶东头歇着。
# 按 follow-up 049 新分镜重写（旧 overhead 是旧故事的，只沿用几何）。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）；内院空场 b10 占 x24–66、y13–29。
# 本场共用的场内陈设（s9 各镜同一套）：西墙（矮院墙西 b11 东墙面 x≈24.35）上的武器厅后门记在 (24.35, 20.2)（场景图里西侧背墙那道木门，平面图只有矮院墙）；
# 矮石阶加长到约 4 m：中心 (30.55, 20.6)、3.9 × 0.7 m、高 0.42 m（x 28.6–32.5）；亚伦坐西段 (29.5, 20.7)，杜克坐东头 (31.55, 20.7)，相距约 2 m；杜克的大圆木盾（直径约 0.7 m）立靠在他东边的石阶上 (32.15, 20.6)。
# 推车 p475（车斗 1.6 m 长、连两轮宽约 1.3 m、筐顶离地约 1.5 m；两根车把再往外伸约 1 m）东西向停在西墙后门南边：车斗中心 (27.15, 25.4)，车尾（车把一端）朝东，车把末端在 x≈28.95；
# 车上码六筐（下四上二）；车尾东北地上摞着另外两筐 (29.4, 25.45)，0.55 × 0.55 m、两筐摞起约 0.9 m 高（齐尼尔斯的胯）。
# 尼尔斯 0–3 s 站推车东头 (28.95, 24.45)，3–4 s 往东南挪半步到 (29.3, 24.7)，两筐在他正南约 0.75 m。

[meta]
scene = "bg2-8"
view = [23, 17, 38, 29]
note = "全景主镜头：机位在院子东南 (33.8, 28.9)、眼平 1.6 m、向西北（瞄 (30.11, 24.17)，方位 322°），28 mm 固定、深焦。从左到右：推车（u −0.94…−0.46，车尾两根车把朝东、对着镜头这边）、地上摞着的两筐（u −0.50…−0.27，比尼尔斯近，只遮到他小腿）、尼尔斯（u −0.26，离镜头 6.6 m，人约占画高三分之一多）、米莉（u +0.11，画中）、亚伦（u +0.28，画右偏中，9.3 m）、杜克（u +0.65，画右）和他身边立着的木盾（u +0.69…+0.87）。西墙与后门在后景、尼尔斯身后。机位从分镜的「东南」略偏南放：机位若在正东南偏东，尼尔斯 0–3 s 面朝西南点车上的筐是背影、看不见嘴唇默数，米莉也成了背影；现在尼尔斯 0–3 s 侧脸、4 s 起正脸偏 3/4，米莉侧脸。米莉面朝西南（看尼尔斯和地上两筐），分镜写「面朝西」：朝正西在这个机位下整个是背影，人站的位置不变。整场机位守在人物东侧与南侧，不越到西墙一侧（轴线：后门口的萨缪尔—石阶上的亚伦，各镜机位都在它南边）。亚伦、杜克整镜坐着不起身。"

