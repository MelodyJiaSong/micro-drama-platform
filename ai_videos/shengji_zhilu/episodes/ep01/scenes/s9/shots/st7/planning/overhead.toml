# s9 st7（7 s，新镜）中全景三人，固定机位：亚伦写完，抬眼看坐在石阶东头的杜克，杜克半闭着眼歇着、浑然不觉；米莉凑过来看货单，看到他添的字，嘴角一弯，也朝杜克看一眼，然后往西南退开、走出画左。
# 按 follow-up 049 新分镜新画。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）。
# 场内陈设与 st1 同一套：矮石阶中心 (30.55, 20.6)、3.9 × 0.7 m、高 0.42 m；亚伦坐西段 (29.5, 20.7)，杜克坐东头 (31.55, 20.7)（亚伦左手边约 2 m），木盾立靠在杜克东边的石阶上 (32.15, 20.6)。
# 货单在亚伦右大腿上（约 (29.39, 20.95)）；米莉接 st4 的位置 (29.35, 21.68) 起步，1 s 挪到他右前方 (28.95, 21.3) 弯腰看纸，5.4–6.6 s 往西南退到 (28.15, 22.05)、出画左（之后 st6 里她已回到推车那边）。

