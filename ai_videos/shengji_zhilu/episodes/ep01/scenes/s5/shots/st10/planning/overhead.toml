# s5 st10：远景起，固定机位，两人从背靠背处转身朝南（朝镜头、往修道院方向）并肩逃来，越跑越大，从镜头左右两侧冲出画；两群狗头人在他们身后汇成一片追来，始终在画内。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；营地 b08 占 x61–91、y45–67。
[meta]
scene = "bg1-9"
view = [94, 54, 112, 80]
note = "机位在两人正南约 15 m (102.6, 75.4)、眼平朝北、28 mm，固定。0–0.4 秒两人在背靠背处同时转身朝南起跑，亚伦在画左、杜克在画右（与 st9 左右一致），并肩约 3.5 m/s 朝镜头跑，渐渐拉开到 1.8 m，4.7 秒前后分别从机位左右 0.9 m 处擦过、出画。追亚伦的四只从画左（西）、追杜克的三只从画右（东）在 1 秒冲到两人刚站的地方，随即转向南追，两群在两人身后并成一片（中心相距约 3 m，比两人的跑道略宽，免得整群被两人身子挡住），约 2.2 m/s，5 秒时离机位约 6 m、仍在画内。逃跑方向从 st8 的画左→画右转为朝镜头，因为两人在 st9 背靠背后一起转身；往南＝回修道院，与 s6 从北角门进中庭一致"

