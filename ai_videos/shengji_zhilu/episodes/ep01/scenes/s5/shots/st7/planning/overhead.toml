# s5 st7：中近景，镜头在亚伦正前方倒退跟拍，他朝东撞开灌木逃；一只狗头人从他左前方的灌木里钻出来拦路，被锤柄顶开，蜡烛一歪、蜡油溅在他左袖和前襟。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；营地 b08 占 x61–91、y45–67。
[meta]
scene = "bg1-9"
view = [84, 56, 106, 68]
walkable = ["b08"]
note = "起幅亚伦已在跑（掉头在 st12）。机位始终在他正前方约 1.75 m、离地 1.55 m、35 mm 朝西倒退跟拍（他正对镜头）：画面高约 1 m，腰上至头顶；北＝画右、南＝画左。1–2 秒肩膀撞开齐腰的湿灌木（灌木在他路线南侧、他擦着它北沿过去——机位也要从这里倒退过去，不能让机位穿进灌木）；2.2–2.6 秒拦路那只从他左前方（东北）灌木钻出、2.5 秒前后从画右入画，挡在他身前偏左约 0.6 m；2.9 秒他用横在胸前的锤柄连撞带推把它顶开，它朝东北退出 0.6 m、3.5–4 秒滚回画右灌木（4 秒起不在场）。追兵：最近一只落后 2.4–2.6 m、偏他右肩（南、画左）约 0.7 m，从他右肩后露出来；其余四只在 7–9 m 外、偏北约 1.8 m（画右、不被他身子挡住），虚焦。跟拍路线与旧图同一条（约 9.4 m，未到 12 m 判据）"

