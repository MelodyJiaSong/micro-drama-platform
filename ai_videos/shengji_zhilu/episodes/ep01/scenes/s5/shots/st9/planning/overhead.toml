# s5 st9：全景略仰，两人背靠背站一秒；两边追来的狗头人见两个持械的人背靠背，前排刹住、后排撞上来挤成一团，再往前压；Your idea. / Run.。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；营地 b08 占 x61–91、y45–67。
