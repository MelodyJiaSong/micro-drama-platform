note = "亚伦面朝西，狗头人从西冲来；机位在两人正南约 3 m、35 mm，侧面看抽锤和整条短扫。起幅亚伦在树干旁、画右边缘外，0–0.8 秒跨出一步入画并抽锤；1.6–2.4 秒向北（离镜头稍远）错开半步到 (91.6, 62.6)；3 秒锤从右腰侧朝左前方短扫，打中狗头人左肩（相距约 1.1 m），它顺着扫的方向朝西偏南侧翻出去约 0.55 m、滚半圈，停在画左、离他约 1.7 m（st5 从这里接）。狗头人 1.2 秒前后才从画左入画（起幅它还在画左外冲过来）。机位比旧图往西挪 0.1 m、往南退 0.35 m：画面要同时装下倒地的狗头人（画左边缘）和 0.8 秒时亚伦背后的锤（画右边缘），画面高约 1.75 m、瞄点压低到 1.05 m（倒地的狗头人才不被画面下沿切掉），亚伦实际是脚踝以上，比「膝上」宽；仍在亚伦—营地连线南侧，不越轴"

