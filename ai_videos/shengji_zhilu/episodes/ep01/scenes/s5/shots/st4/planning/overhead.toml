# s5 st4：中景偏宽，亚伦从树后跨出一步、从背带里抽出锤，侧让半步，一记短扫打中扑来的狗头人左肩。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；营地 b08 占 x61–91、y45–67；亚伦藏身的老栎树在 (92.2, 62.9)。
