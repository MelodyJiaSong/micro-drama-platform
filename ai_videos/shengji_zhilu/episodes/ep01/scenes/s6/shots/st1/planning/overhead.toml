# s6 st1（9 s）全景·过肩，固定机位：葡萄园北头的西岸柳树下，亚伦弯着腰沿柳树走进来，蹲到水边柳条后，拨开一点看对岸——整片葡萄园、坡顶农舍门口没人、两个红面巾把头钻在藤叶底下搜。
# 坐标＝bg18 北郡葡萄园平面图（米，x 向东、y 向南）。北郡河（西界）中心 x≈5、宽约 7 m（西岸水边 x≈1.4、东岸水边 x≈8.6）；东岸陡坎 x≈9–12（一人多高，坎底往里凹）；藤垄区 x16.5–50、y13–43，垄东西向、自西向东抬升，架线 y≈15.1 / 19.4 / 23.7 / 28.0 …，垄行（走道）y≈17.3 / 21.6 / 25.9；农舍 (59, 12)；北侧林缘 y0.5–6.5（东岸林子长到河边）；石拱桥 (7, 30)。「坡上」＝东。
# 2026-10-18 follow-up 083（站位冷读 blocker）重写：原来机位在桥南下游朝北、亚伦在桥后从西岸下水（bg1-15）；故事改为他先藏在西岸柳条后看清再蹚过去，本镜改用 bg18-11（西岸柳下隔河朝东），原 overhead 备份在 scratchpad bak083。

