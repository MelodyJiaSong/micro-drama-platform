note = "机位在西岸柳树下 (-3.0, 8.8)、离地 1.0 m（蹲着的人肩后），28 mm 深焦，朝东略偏南（瞄 (37, 16)），与 bg18-11 背景图同向，固定。前景是垂下的柳条（虚，背景图自带）；亚伦 0 s 在画左外的柳树下 (-0.8, 5.5)，弯着腰朝南偏东沿柳树走来，约 1.9 s 从画左边缘入画，3 s 蹲到水边柳条后 (0.8, 8.6)（离镜头约 3.8 m，在画面左前方、背对镜头偏左侧，约占画高 45%）；3–5 s 左手拨开一点柳条；5–9 s 一动不动看对岸。对岸：画左是长到河边的林子，中间到右边是陡坎和一排排顺坡抬升的葡萄架，坡顶农舍在视线左约 8°、约 62 m，门口没人。两个红面巾在远处藤架间（离镜头约 35–40 m，很小），弯着腰把头钻在藤叶底下往西慢慢搜，头一直低于架顶，没有人朝河这边看。平面图与 previz 没有地形高差，红面巾在坡上、实际比画面里的绿幕站位高，出片核对他们在亚伦头的右侧、不被他挡住。"

