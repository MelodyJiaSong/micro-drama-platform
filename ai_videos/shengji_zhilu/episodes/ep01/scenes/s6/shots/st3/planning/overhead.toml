# s6 st3（30 s）双人中景，固定机位：葡萄园西头、最靠河那条垄行的尽头，离坎沿两三步。蹲着的红面巾在看地上的血迹；带头的从坡上沿垄行快步走下来、停在他旁边，压着嗓子说打算；蹲着的回话；带头的分派人手、朝坡上一挥手。亚伦就在他们脚下的坎底（本镜不入画）。
# 坐标＝bg18 北郡葡萄园平面图（米，x 向东、y 向南）。北郡河（西界）中心 x≈5、宽约 7 m（西岸水边 x≈1.4、东岸水边 x≈8.6）；东岸陡坎 x≈9–12（一人多高，坎底往里凹）；藤垄区 x16.5–50、y13–43，垄东西向、自西向东抬升，架线 y≈15.1 / 19.4 / 23.7 / 28.0 …，垄行（走道）y≈17.3 / 21.6 / 25.9；农舍 (59, 12)；北侧林缘 y0.5–6.5（东岸林子长到河边）；石拱桥 (7, 30)。「坡上」＝东。
# 2026-10-18 follow-up 083（站位冷读 major）重写：原来带头的隔一排藤架在坡上压着嗓子说话，坎下的亚伦听不见；改成他下到最靠河那排、停在坎沿上几步内说话（亚伦在 (9.0, 17.4) 的坎底，离他约 5 m、低一人多）。台词改：「A rider just went down the road to the gate」「She pulled Hale's mask off. She saw his face.」「Or that's the guard's blood…」。原 overhead 备份在 scratchpad bak083。

