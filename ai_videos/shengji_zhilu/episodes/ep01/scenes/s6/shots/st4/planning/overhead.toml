# s6 st4（11 s）近景·侧面，固定机位：东岸陡坎底下水边，亚伦背贴长草陡坎半蹲，屏着气不动，头顶坎沿上的脚步声走远；他这才压低声音自问「Hale? Mister Hale... from Stormwind?」；抬头望一眼坎沿，然后弯腰贴着陡坎往南摸、出画。
# 坐标＝bg18 北郡葡萄园平面图（米，x 向东、y 向南）。北郡河（西界）中心 x≈5、宽约 7 m（西岸水边 x≈1.4、东岸水边 x≈8.6）；东岸陡坎 x≈9–12（一人多高，坎底往里凹）；藤垄区 x16.5–50、y13–43，垄东西向、自西向东抬升，架线 y≈15.1 / 19.4 / 23.7 / 28.0 …，垄行（走道）y≈17.3 / 21.6 / 25.9；农舍 (59, 12)；北侧林缘 y0.5–6.5（东岸林子长到河边）；石拱桥 (7, 30)。「坡上」＝东。
# 2026-10-17 follow-up 068 后改：7 s → 10 s；嘴唇无声一动改为低声自问；抬头望坡顶；之后贴着陡坎往南摸，不再钻进藤架。机位位置不变，焦距 40→50 mm（见 note）。
# 2026-10-18 follow-up 083（站位冷读）：10 → 11 s。带头的就在他头顶坎沿上几步说话，他不能当场出声——0–4 s 屏着气不动、眼睛往上看，等坎上脚步声走远，4–7 s 才低声自问；机位与站位不变。

