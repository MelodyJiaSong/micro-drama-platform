note = "中景双人：机位在石阶东头 (46.9, 62.4)，两人东北约 2.5–2.7 m，离地 1.6 m（眼平）、瞄两人停下的位置中间 (45.62, 64.75) 离地 1.35 m，50 mm 固定，向西南偏南拍：杜克在画左（u≈−0.52）、亚伦在画右（u≈+0.51）；两人停下后画面是腰到头顶。亚伦面朝北偏西看告示，与机位方向差约 52°（3/4 侧脸），告示在画外右侧（机位身后）；杜克看告示时与机位方向差约 40°（接近 3/4 正面）。杜克的盾挎在左前臂，看告示时在他靠亚伦的一侧，与亚伦之间还隔约 2°，不挡亚伦；转头问话时盾转到他身后南侧。出入：杜克 5–8 s 转头看亚伦问话，亚伦在他西边、机位在他东北，他问话时是侧脸（与机位方向差约 78°），不是分镜写的「两人都是四分之三侧脸」——让他站在亚伦东边稍靠后已是最好的情形（站齐了就是 90°、往门那边凑过半步是 100° 以上近乎背影）；要杜克问话时 3/4 正脸，得把机位挪到两人北面偏东（亚伦就几乎正脸对镜头）、或让杜克只转头不转身。0–2 s 两人从南边走近（离镜头约 4.3 m，膝上入画），亚伦 1.2 s 抬眼看见告示、1.7 s 停住；杜克 2.0 s 停在他东边稍后，2.0–2.4 s 看他一眼，2.4–3.2 s 往门那边凑近半步、上身前探看告示，5.0–5.6 s 直起身转头看亚伦。上身前探只写在动作里，不加 [[pose]]（previz 的「半躬」是整个人斜过去约 28°，比「微微前探」大得多）。两人走路时面朝点给在门的方向（略偏西）：人偶朝向按角度直接插值，朝向一跨过正北（±180°）previz 里的人偶会反着转一大圈。"

