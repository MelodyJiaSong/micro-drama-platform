# s10 st4（8 s，新镜）中景双人，固定机位：阴天傍晚，亚伦和杜克并肩从门前石板地走向主厅南门的石阶，亚伦的目光碰上门上新钉的告示、停住；杜克跟着停下，凑近半步看告示，目光停在画像那条断成两截的右眉上，皱眉，再直起身转头问「You know him?」。
# 按 follow-up 049 新分镜新画。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）；主厅 b01 南立面外墙面在 y61，拱门居中 x45。
# 门前三级石阶示意同 st1：x 43.5–46.5、y 61.0–62.5。告示在西扇门板上 (44.4, 61.05)、中心离地约 1.6 m。
# 亚伦停在石阶下约 2 m (45.2, 64.5)，面朝北偏西盯着告示（与 st3 同一位置）；杜克最后停在他东边约 1 m、稍靠后 (46.05, 65.0)。
# 维里不入画（cast 没有他，不画站位）：他钉完告示从门里进去了，门在机位身后。

[meta]
scene = "bg2-7"
