# s3 st5：建立镜头，修道院南立面远景（24 mm 固定），亚伦与推葡萄车的米莉一起走近、在门前分开。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）：
# 主厅 b01 南立面 y61、x33–57（门洞居中 x45，左右各接一段矮一截的侧屋；西侧屋的墙角＝主厅西南角 (33,61)）；三级石阶 y61.1–63.5，顶阶西侧亚伦站位 (45,62.3)；门前石板地 b09 x31–59、y65–75。follow-up 049 按新分镜重画。
[meta]
