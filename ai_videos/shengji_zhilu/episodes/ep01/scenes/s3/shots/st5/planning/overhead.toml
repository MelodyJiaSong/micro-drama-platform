note = "机位＝bg2-9 锚点 (45,86)，眼平 1.65 m 微仰屋檐，24 mm 固定，南立面居中、离门约 25 m。亚伦和米莉从画左下一起走近（米莉在两根车把之间推车，车在她前面约 1.3 m，亚伦走在车的东侧），约 1.3 m/s；2 秒到门前石板地边，米莉把车头转向画左（西北，对着西侧屋的墙角），2–3.5 秒边转车边回头朝亚伦点头，3.5 秒起约 1.45 m/s 推着车往西侧屋外墙走去；亚伦与她分开继续往北，3.5 秒停在顶阶以南约 5 m (43.4,67.3) 抬头看门楣和屋顶，6.5–8 秒向北走两步到 (43.9,65.95)（顶阶以南约 3.65 m，接 st1 起点），仍未上阶。维里靠东门柱 (46.3,61.6)，看着走来的亚伦，很小。和分镜的出入：分镜写米莉 6.5–8 秒「绕过西侧屋的墙角出画」，可两人分手处离西侧屋墙角约 10 m，推着车 8 秒内走不到——8 秒时车在离墙角约 4 m 处，画面上车头正好到墙角的位置（u≈−0.56，墙角 −0.64），米莉还在画左；要在镜内拐过墙角出画需约 10 秒。"

