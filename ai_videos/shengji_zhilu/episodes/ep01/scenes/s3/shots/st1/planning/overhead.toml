# s3 st1：双人主镜头全景（35 mm 眼平，机位在石阶南侧、对话轴南侧）。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）：南立面 y61、门洞 x43.8–46.2，三级石阶 y61.1–63.5。follow-up 049 按新分镜重画。
[meta]
scene = "bg2-9"
view = [38, 58, 51, 72]
note = "机位与站位沿用旧图：机位 (44.6,69.6) 眼平朝北，在两人连线南侧，不越轴。亚伦从 st5 终点 (43.9,65.95) 走上三级石阶，2.5 秒在顶阶西侧 (45,62.3) 站定（3.8 m / 2.5 s ≈ 1.5 m/s，快步上阶），面朝东北的维里、右半身朝镜头：右袖口和两条溅泥的小腿都在镜头这一侧，不被石阶、门柱或维里挡住（他相对镜头是右后 3/4 背影）。维里靠东门柱 (46.3,61.6)，2.5–4 秒低眼看亚伦的右袖口和小腿，4–5 秒叹气，5–9 秒第一句、约 6.5 秒朝院外偏一下下巴，9–13 秒看回亚伦说第二句。时长 11→13 秒。"

