note = "起幅机位在车后偏西（画左）：路西沿外的草边 (103.6, 199.8)，离亚伦 4.2 m、米莉 4.2 m、车尾左角 4.6 m，在左轮以西 1.8 m；眼平 1.6 m，28 mm，朝北偏东 24°、略俯 9° 对着两人和推车：两人与推车从头到脚在画内，亚伦（车尾左角外）画中、米莉（两车把之间）画中偏右，都背对镜头；陷住的左轮从亚伦左侧（画左）露出来、不被他挡住，左轮旁泥里的葡萄在画面下部偏左。2.6 s 车轮出辙后机位一边升到 4.6 m 一边往南后拉 5.4 m（本镜唯一的运镜），朝向跟着走远的两人从北偏东 24° 收到北偏东约 5°，两人留在画面中央渐小，落幅离两人约 14 m、人占画高约 16%，成远景，修道院在画面上方偏左。推车出辙后顺着路的斜度往北略偏西走（0.85 m/s），两人与车的相对位置不变；两根车把画成跟车走的 [[prop]]（上一条出片从车后看不到车把）。取舍：①分镜「车后偏西约四米、眼平朝北」——弯腰顶车的亚伦就站在左轮正后方，机位要在左轮以西约 1.8 m，视线才从他左侧擦过、看得到左轮（previz 静帧把推车拆成车斗＋两只轮核过；上一条机位在路中央，左轮被他和车厢挡住）；在这里正朝北，米莉和东车把会出画右，所以起幅朝北偏东 24°，落幅回到近乎正北；②亚伦沿车尾左角外跟车走，正好从泥里那几串葡萄东沿擦过（葡萄在左轮旁、他走的就是左轮那一线），出片写他跨过、葡萄留在原地；③3–8 s「亚伦侧头看米莉一眼、米莉冲他点点头」只是转头和点头，平面面朝仍朝前、不加路点（加了参考图上每人沿路多出几个圆点和秒数，还会被读成停下来转身），写在 beat 与 actor note 里；④previz 判据都不触发（机位水平移动 5.4 m < 12 m），不推翻：上一条只用 overhead 图就出对了这个升降运镜。泥水洼只在他倒进去之后入参考，缩成 2.0 × 1.2 m（原 2.4 × 1.5 的方块在参考图里比推车还大，首轮出片推车被画成横的）。"

