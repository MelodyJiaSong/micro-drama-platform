# s2 st13（8 s）全景起 → 一个连续的摇臂运镜（升高＋后拉）落远景：两人推车出辙，沿大路朝北走向修道院；掉落的葡萄留在泥里。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）。这一段大路中线 x = 104 + (y − 182) × 6/44（往北略偏西 7.8°）；
# 路西是坡脚与林坡，路东草坡下到溪；修道院主厅在北面约 70 m（88, 128）。推车车头朝北，开场停在 (106.0, 194.8)，左轮陷在深辙里。

