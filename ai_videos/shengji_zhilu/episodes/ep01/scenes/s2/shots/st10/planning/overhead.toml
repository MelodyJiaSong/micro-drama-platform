[meta]
scene = "bg1-12"
view = [102, 193, 110, 201]
note = "机位在两人以南约 3 m (106.1,199.85)、肩高 1.45 m，朝北略偏西（方位 357°），40 mm：站起来后膝上至头顶（中全景），亚伦画左（x≈−0.26）、米莉画右（x≈+0.47），两人相距 0.9 m、各朝镜头侧开约 15°（亚伦面朝 108°、米莉面朝 252°，与镜头夹角都约 63°，两张脸都是 3/4）。起幅亚伦坐在泥里，上半身在画左下方（x≈−0.65）——站起后的双人中全景与起幅坐姿同框只差 0.6 个画宽，所以他在 st18→本镜之间的画外转身时往东挪了 0.3 m（见 actor moved），不然坐着的头会被画左边缘切掉；推车在两人正后方（画中偏右），不是分镜写的画右后方：T10 与米莉都在车尾正南。米莉 0–0.9 s 从车尾东南角绕过东车把末端走到他东侧 M10 (106.5,196.95)，俯身伸右手；他左手握住、1–2 s 两脚一蹬站到 T10（st11 的站处）。车把就在她身后偏北、南侧机位下一直在画内，分镜的「朝东北走回车把那头、从画右出画」照字面做不到：6.1–7 s 她朝东北偏东（方位 62°）走 1.5 m 绕向车尾东侧，7 s 整个人出画右；之后在画外回到东车把外侧（st11 不入画）。st18 末亚伦坐着望画左（西北），切到本镜前在画外转过身来朝东（见 actor moved）。只有一对牵手、相距 ≥ 0.85 m，不触发 previz。泥水洼只在他倒进去之后入参考，缩成 2.0 × 1.2 m（原 2.4 × 1.5 的方块在参考图里比推车还大，首轮出片推车被画成横的）。"

