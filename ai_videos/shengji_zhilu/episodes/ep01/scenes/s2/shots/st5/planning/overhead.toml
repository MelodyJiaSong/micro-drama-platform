# s2 st5（5 s）远景，固定机位：一声低嚎打断米莉的笑，两人转头望画左林坡，三只成年灰狼从西坡树间一只接一只钻出、小跑下坡。
# 按 follow-up 049 新分镜重写（推车已出辙、两人在车把旁；旧 overhead 的站位作废，只沿用几何）。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；路中线 x_c(y) = 104 + (y − 182) × 6/44。路西：坡脚线≈x_c − 3.3、林缘≈x_c − 6.9（高出路面约 1.2 m）、
# 再往上约 10 m 疏林带、密林边≈x_c − 17（previz 是平的绿幕，坡面高差只在 prompt 里交代）。推车（出辙后）(106.0, 193.8)，车把西 (105.65, 195.1)、东 (106.35, 195.1)。
# 三只狼同一张卡 m7_Wolf，用 label 区分：狼甲＝领头那只（个头最大），狼乙＝北边那只，狼丙＝南边那只（st24 绕向车尾的就是它）。

[meta]
scene = "bg1-12"
view = [84, 183, 111, 212]
note = "路南朝北的远景：机位在车尾后约 12 m 的路中央 (107.4, 207.6)、眼平 1.6 m、朝北偏西 20°，28 mm：推车与两人在画面中间偏右，从头到脚在画内（亚伦 12.0 m、u≈+0.35；米莉 11.6 m、u≈+0.47），人约占画高两成；修道院在画面上方偏右一点（u≈+0.2），很小；路边旧木栅在画左中前景、顶高 0.9 m 低于视线，不挡狼。0–1 s 两人还握着车把、侧脸相对（面朝只画到六七十度，真正只转头靠 prompt）；嚎声在 1 s 后，1.0–1.7 s 两人把头转向画左林坡；亚伦 2.4 s 起松开车把、身子慢慢转向画左（经北转，不对着镜头转）；米莉 4.2–5 s 往东南缩半步到东车把末端外。三只狼 2.0 / 2.4 / 2.8 s 从西北坡上的密林边（离亚伦约 25–28 步、18–20 m）一只接一只钻出（enter），约 3–4 m/s 斜着小跑下坡进疏林，5 s 散开在疏林里（离亚伦 10.4–11.9 m，分镜写约十五步），始终在画左（u −0.77…−0.15）。狼从西北（而不是正西）斜着下来，是为了 st6 的南侧机位能把三只狼都收进画左背景（正西来的狼在 st6 机位的画框外）。坡面高差、林缘与疏林只在 prompt 里交代（previz 不画林缘体块）。泥水洼不画（10-11 夜教训：画成比推车还大的方块会把推车画成横的），只画深辙。"

