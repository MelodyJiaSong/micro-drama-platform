# s2 st6（5 s）一步挡到米莉和狼之间，伸手过肩握柄、扳开背带扣、抽锤，「Behind the cart.」；米莉退到车尾东侧蹲下；头狼冲来。
# 按 follow-up 049 新分镜重写（旧 overhead 的长包、拆绳作废，只沿用几何）。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；
# 路中线 x_c(y) = 104 + (y − 182) × 6/44，坡脚线≈x_c − 3.3（y 196 处 x≈102.6），林缘≈x_c − 6.9。推车（出辙后）(106.0, 193.8)，车把西 (105.65, 195.1)、东 (106.35, 195.1)。
# 挡位 G6 (104.25, 196.15)：西车把旁 (105.6, 195.95) 往西偏南一大步；米莉蹲处 MH (107.0, 195.3)：东车把外侧、车尾东侧（st22–st18 都用这两个点）。

