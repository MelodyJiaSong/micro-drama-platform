note = "三方同框（画右米莉与车尾、中间亚伦、画左背景三只狼）水平要约 65° 视角：机位在挡位 G6 以南 4.5 m (104.4, 200.65)、胸口高 1.3 m、朝正北，24 mm 才装得下（亚伦约占画高一半），做不到分镜的中全景（膝上至头顶）；亚伦也只能在画中（u≈−0.03），再往左让，画左的狼就出画（与旧 st6 的结论相同）。亚伦 0–0.8 s 从西车把旁往西偏南跨一大步到 G6，面朝西北偏西、视线一直跟着领头的狼甲（镜头见他的左后侧身，与镜头夹角约 117°）；1.0–2.2 s 右手过肩握柄、左手扳开背带扣、抽锤，2.2 s 起双手握柄、锤头压低在身前；3–4 s 头也不回说「Behind the cart.」。米莉 0–1 s 原地倒吸一口气，1–2.6 s 往东南退半步（画右边缘），2.6–4.0 s 绕过东车把末端到车尾东侧 MH 蹲下，推车隔在她和狼之间。三只狼接 st5 末（离亚伦 10–12 m、在西北坡上），压低身子约 1.2 m/s 逼近到 4.0 s 离亚伦 5–5.9 m（分镜七八步；按坡的下部摆，十步外已在林缘），狼丙约 1 s 才从画左边缘进画；狼甲 4.2 s 低头起冲，5 s 离他约 2.7 m（扑击落在 st22）。护人格挡 1–5 s：亚伦在米莉与狼甲连线 37° 以内、离狼甲比米莉近、面朝狼甲。泥水洼不画，只画深辙。"

