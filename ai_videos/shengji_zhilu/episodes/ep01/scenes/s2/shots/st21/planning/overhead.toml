note = "机位在两人西南、车尾（两车把中点）西南约 4.4 m 的路边坡脚 (102.6, 198.9)，离地 0.5 m（膝高，瞄 1.0 m 微仰），28 mm，朝东北偏北（方位 52°）：全景，两人从头到脚在画内。起幅亚伦 u≈+0.15、米莉 u≈+0.39，左轮 u≈−0.54；出辙后亚伦 u≈−0.2（画面中间偏左）、米莉 u≈+0.05（在他右后方、比他远 0.5 m），左轮 u≈−0.71、在画左；车头朝北＝画左深处，车往画左前方冲出去。镜头看到亚伦的左后侧身；米莉 4.3 s 转头朝西看他，脸正对镜头（夹角约 36°）。与分镜的出入：分镜写「整只左轮…离镜头最近、机位在车尾西偏南」，但米莉在亚伦正东（各握一根车把），机位越往西两人越叠在一条视线上（西偏南机位米莉整个藏在他身后，r2/r3 要的「彼此不挡脸」做不到）；改到西南后两人分开约 8°，代价是左轮离镜头 5 m、比亚伦（3.6 m）远，只能做到「整只左轮在画左」。两人 0–3 s 原地压身推（车 1–3 s 一顿一顿往前拱 0.2 m，手跟着车把），3.0–3.8 s 跟着出辙的车往前迈一步（1.0 m），4 s 后停稳直起腰。泥水洼不画，只画深辙（出辙后西轮在深辙北端外 0.3 m）。"

