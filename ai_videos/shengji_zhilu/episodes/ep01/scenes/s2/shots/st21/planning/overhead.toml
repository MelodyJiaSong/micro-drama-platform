# s2 st21（6 s，新镜）全景，膝高固定机位：两人合推，左轮爬上辙沿、滚上平路，泥水溅到亚伦的裤脚和米莉的裙脚；米莉一笑。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；路中线 x_c(y) = 104 + (y − 182) × 6/44；坡脚线 ≈ x_c − 3.3。
# 推车起幅陷在辙里 (106.0, 194.8)，3.0–3.6 s 出辙往北冲约 0.8 m，连同 1–3 s 一顿一顿往上拱的 0.2 m，共往北前移 1.0 m，停在 (106.0, 193.8)；
# 本镜之后各镜都用出辙后的位置：车 (106.0, 193.8)，车把西 (105.65, 195.1)、东 (106.35, 195.1)，把手末端 y≈195.6，车斗尾 y≈194.6。

