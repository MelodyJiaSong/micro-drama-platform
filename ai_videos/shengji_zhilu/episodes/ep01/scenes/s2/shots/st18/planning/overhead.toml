# s2 st18（8 s，按分镜 v8）三人全景，固定机位：伊根走近、拔起亚伦身旁的箭一；亚伦道谢；伊根朝车尾南边走过去拔起箭二；看米莉一眼、弓梢一点，转身上坡出画左。
# 按 follow-up 049 新分镜重写（旧 overhead 的坐在泥里作废，只沿用几何）。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；
# 路中线 x_c(y) = 104 + (y − 182) × 6/44；路西边缘≈x_c − 2.5、坡脚线≈x_c − 3.3、林缘≈x_c − 6.9。推车 (106.0, 193.8)，车把西 (105.65, 195.1)、东 (106.35, 195.1)，把手末端 y≈195.6。
# 亚伦还站在 st17 的位置 A24 (105.75, 196.3)（车尾正南、深辙东边）。两支箭（st17 射出）：箭一 (104.13, 194.97)＝亚伦西北约 2.1 m；箭二 (105.95, 197.85)＝车尾南边、狼丙原来前爪前。伊根从 st9 的站处 E8 (102.97, 195.5) 起步。

[meta]
scene = "bg1-12"
view = [98.0, 191.5, 109.0, 205.5]
note = "机位在三人南侧约 9 m 的路面 (105.3, 204.6)、眼平 1.6 m、朝正北，55 mm 全景：伊根起初在画左（u≈−0.8）、亚伦在画中偏右一点（u≈+0.17）、米莉和推车在画右（u≈+0.57 / +0.12），三人从头到脚在画内，画左后方是西坡。伊根 0–1 s 从 E8 朝东走两步（1.56 m）到亚伦西边 Q1 (104.53, 195.6)，拔箭一时两人相距约 1.4 m（两步）；1.2–2.0 s 弯腰左手拔起箭一（1.7 s 离地），插回右腰箭袋；亚伦喘着气说「You saved us.」。2.2–3.5 s 伊根绕过亚伦西边（最近 1.0 m，不擦身）走到箭二西北侧 Q2 (105.4, 197.45)，3.5–4.0 s 弯腰拔起箭二（3.8 s 离地）、一并收进箭袋——这半秒他弯着腰在亚伦正前方（箭二就在亚伦正南），挡住亚伦下半身；4.0–4.5 s 直起身、往西退半步到 (104.9, 197.5)，让开亚伦，看画右车边的米莉、咧嘴一笑（视线从亚伦身边越过）；5–5.6 s 弓梢朝两人点了点；5.8–8 s 转身大步（约 2.2 m/s）往西北上坡，7.8 s 出画左。与分镜的出入：箭一在亚伦西北、箭二在车尾正南（st17 的落点），两支箭隔约 3.4 m，分镜「朝车尾南边走两步」实际是绕过亚伦走约 2.2 m（三步）、拔箭时再弯腰探身；亚伦和米莉相距约 1.6 m（两步多，分镜约三步）。亚伦整镜拄锤站着，头跟着伊根转（0–2 s 面朝西、镜头见他的左侧脸）。"

