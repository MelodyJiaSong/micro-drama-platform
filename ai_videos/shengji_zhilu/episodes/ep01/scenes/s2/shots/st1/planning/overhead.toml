note = "28 mm 远景主镜头：机位在车尾后约 10 m 的路中央 (107.1, 204.8)、眼平 1.6 m，朝北偏西 12°（顺着路的走向再往西一点，让米莉落在画面中间偏右、亚伦落在画左）。米莉在两根车把之间 (106.0, 196.4)，离镜头 8.6 m，u≈+0.15，人约占画高四分之一；修道院在画面上方近中线（u≈−0.05），路西林坡在画左、路东草坡在画右。亚伦：分镜「从镜头左后方约三米处走进画面」若当起点，要先走约 4 m 才入画，赶不上「1–3 秒入画、步子不快」，改为从机位左侧 1.65 m、略靠前起步（约 1.05 m/s），约 1.5 s 从画面左下角入画（离镜头约 2.5 m，只露膝上），约 3 s 全身入画、比米莉大；3.0–3.4 s 抬头、脚步一顿（面朝点改成米莉），3.4–5.4 s 加快到约 1.6 m/s 斜着走向车尾左后方，停在西车把末端西南约三步 (104.6, 198.3)，离镜头 7.0 m（分镜「约七米」），u≈−0.33，整镜在画左。泥水洼不画（10-11 夜教训：画成比推车还大的方块，首轮出片推车被画成横的），只画深辙；车轮挂水草、空转后滑回去只在 prompt。"

