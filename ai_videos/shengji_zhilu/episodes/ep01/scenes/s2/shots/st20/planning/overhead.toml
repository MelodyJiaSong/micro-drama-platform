note = "机位在两人正南 2.5 m (106.0, 199.5)、离地 1.35 m（肩高、略低于眼平，瞄 1.4 m 微仰），40 mm 朝正北：中景双人（主体处画面高约 1.3 m，腰上至头顶），亚伦 u≈−0.36（画左）、米莉 u≈+0.35（画右），两人后背、握车把的四只手和车尾都在画内，推车上的筐在两人头顶之间的画面上方。亚伦接 st1 末的站处 (104.6, 198.3)：0–1.2 s 从画左外侧身走进来（入画约 0.6 s）到西车把末端后，边走边把信插进腰带，眼睛看着左轮；米莉 0.5 s 转头看见他，1.0–2.0 s 往东南让半步到东车把末端后、两手换到东车把上。米莉 0.5 s 转头朝西看他（不是转向镜头）。说话时两人转头相对：亚伦 3.4–4.4 s 面朝点转到东偏北约 65°（看她，镜头见他的右侧脸，「Ready?」在这里），米莉 4.0–5.0 s 转到西偏北约 65°（看他、点头，镜头见她的左侧脸），之后两人转回正北、压身。面朝只画到六七十度：overhead 与 previz 里人偶只能整身转，画满 90° 会被读成转过身去对着人；真正只转头、手不离车把靠 prompt。机位在两人正南、不越轴（冷读 r2：过肩机位会越轴）。泥水洼不画，只画深辙。"

