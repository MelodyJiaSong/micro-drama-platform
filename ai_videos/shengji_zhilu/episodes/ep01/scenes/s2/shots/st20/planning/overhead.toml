# s2 st20（6 s，新镜）中景双人，从背后略偏低拍，固定机位：亚伦把信插进腰带、握住西侧车把，看一眼左轮，「Ready?」，米莉点头。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；路中线 x_c(y) = 104 + (y − 182) × 6/44。
# 推车仍陷在辙里 (106.0, 194.8)，车头朝北；车把西 (105.65, 196.1)、东 (106.35, 196.1)，把手末端 y≈196.6；深辙在西轮 x≈105.4。
# 推车站位（本镜起固定一左一右）：亚伦在西车把末端后 (105.6, 196.95)，米莉在东车把末端后、比他靠后半个身位 (106.4, 197.1)，相距约一步（0.8 m）。

