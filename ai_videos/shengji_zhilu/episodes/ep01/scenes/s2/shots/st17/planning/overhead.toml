# s2 st17（7 s）全景，约 2 m 高略俯，固定机位：画左前景的伊根拉弓——一箭擦伤第二只、一箭钉在第三只爪前，三只狼窜回林子；亚伦等最后一只进了林子才松肩，回头找米莉。
# 按 follow-up 049 新分镜（v7）重写（旧 overhead 的躺在泥里、头狼骑身上作废，只沿用几何）。坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；
# 路中线 x_c(y) = 104 + (y − 182) × 6/44，坡脚线≈x_c − 3.3（y 199.6 处 x≈103.1），林缘≈x_c − 6.9。
# 接 st25 的三面围：亚伦在车尾正南 A24 (105.75, 196.3)、面朝南；狼丙在他正南 (106.0, 198.35)；狼乙在他右后方（西北偏西）(104.0, 195.5)；狼甲在他右侧（正西）坡脚 (102.6, 196.45)；
# 米莉蹲在车尾东侧 MH (107.0, 195.3)；推车 (106.0, 193.8)。伊根接 st25 末的冲刺，停在西南坡脚 P17 (103.0, 199.6) 拉弓。

