note = "机位在打斗处南侧 7 m (105.4, 203.3)、离地 2.0 m、略俯（瞄 0.9 m），28 mm，朝正北：亚伦从头到脚在画面中间（u≈+0.09）；狼丙在他面前、离镜头 5 m，比镜头到亚伦的视线偏东 0.35 m，镜头越过它的背看到亚伦的脚；推车（u≈+0.11）和车后的米莉（u≈+0.35）在他身后偏右；狼乙 u≈−0.31、狼甲 u≈−0.68 在画左；伊根在画左前景边缘（离镜头 4.4 m，u≈−1.0，身子一半在画外），侧身朝东北拉弓，镜头看到他的右肩、右臂和伸进画里的弓；两支箭的落点都在画内。箭的弹道：箭一从 P17 朝北偏东 14° 射出，擦过狼乙肩胛，钉在它身后 0.55 m (104.13, 194.97)＝亚伦西北约 2.1 m（三步），离狼甲 1.1 m 以上、不穿人；箭二朝东北偏东 59° 射出，钉在狼丙前爪前 (105.95, 197.85)＝车尾南边，从亚伦南边 1.7 m 外掠过。1.5 s 箭一，狼乙惨叫往西北跳开；3.0 s 箭二，狼丙往后一缩；4.0 / 4.2 / 4.4 s 三只狼先后掉头、约 3.5–4 m/s 往画左上方（西北）的坡上窜，5.6 / 5.9 / 6.5 s 先后钻进林子（gone，最后一只狼丙 6.5 s 出画）；亚伦握锤一动不动、眼睛跟着它们（护人格挡到 4.2 s 狼丙掉头为止），6.3 s 才松肩、回头找米莉；米莉 6–7 s 从车后慢慢站起来迎上他的目光。伊根自始至终站着，4–6 s 放低弓。泥水洼不画，只画深辙。"

