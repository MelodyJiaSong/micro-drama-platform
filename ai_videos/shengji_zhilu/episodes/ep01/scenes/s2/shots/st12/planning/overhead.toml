# s2 st12（6 s）中全景（膝上至头顶）：背好长包走到车尾左角，弯腰用左肩顶车，字条从敞开的系带口滑出落在靴前，蹲下捡起；米莉在两车把之间看着。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）。这一段大路中线 x = 104 + (y − 182) × 6/44（向南略偏东）；
# 路西是坡脚与林坡，路东草坡下到溪。推车车头朝北，停在 (106.0, 194.8)，左轮陷在深辙里。

[meta]
