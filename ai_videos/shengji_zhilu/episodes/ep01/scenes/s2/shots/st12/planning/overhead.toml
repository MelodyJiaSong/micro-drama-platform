view = [101.5, 193.0, 107.5, 198.5]
skip = "与 st11 之间省略了亚伦从泥里拎起长包、背回右肩的时间（分镜：开场长包已经背好）"
note = "中全景（膝上至头顶）：机位在亚伦站处（车尾左角外）西南偏西 2.2 m（方位 256°）、离地 1.0 m 略仰 3°，28 mm 朝东偏北（方位 83°）。按「景别与距离」2.2 m × 20.25 ÷ 28 ≈ 1.6 m 画面高：站直时画框下沿在膝下约 0.1 m、上沿在头顶上约 0.17 m；弯腰顶车时脸与敞开的领口在画面中部偏左，字条从领口滑出、往下飘的大半段（领口到膝高）在画内，5.4 s 捡起后随右手回到画内。亚伦画中偏左、看得到左侧身与侧脸，米莉在他东侧 0.83 m 的两车把之间、画中偏右、比他远 0.6 m。取舍：①字条落点在靴尖前约 0.25 m 的泥里，在画框下沿外——落点和他的靴子几乎同一纵深，要把落点框进来，画框下沿就得到他的脚踝（成了偏紧的全景：约 2.1 m、26 mm、机位升到 1.6 m 俯 16°），与膝上至头顶不能同时成立，按分镜的中全景取；②「面朝北、左肩顶车尾车栏」与「站在西车把外」几何上不能同时成立（面朝北时车尾在他右前方，只有右肩够得着）——平面面朝写正北（机位才看得到左侧身和侧脸），出片写上身略向右拧、左肩抵住车尾左角；③分镜「米莉和车尾在画右稍远处」：从西南偏西看，车身在他身后、偏画左，画右只有车把末端与米莉；要让车尾也落到画右，机位得挪到他正西南以南，就只拍得到背影、看不到脸，以「看到左侧身、脸清楚」为准；④「从泥水洼边走到车尾左角」：从 st11 的站处（洼北沿内）走过来，在这个机位里会从米莉身前横穿、开场一秒亚伦在米莉画右，与「亚伦在画左」冲突——开场他已在洼边、离车尾左角一步（西南偏西 0.35 m），0–0.6 s 迈一步到位（挪位在背包的省略里，见 actor moved），开场离镜头 1.85 m，头顶仍在画内。泥水洼只在他倒进去之后入参考，缩成 2.0 × 1.2 m（原 2.4 × 1.5 的方块在参考图里比推车还大，首轮出片推车被画成横的）。"

