note = "亚伦 0.6 s 走下最后一步停在东岸桥头 (148.3, 143.47)，先朝东北的葡萄园看（对镜头是 3/4 侧身），1–2 s 回头回肩望向西头桥边的杜克，之后背对镜头；机位在他身后、东岸桥头偏南约 3 m，胸口高 1.4 m，80 mm 长焦正朝西（分镜写「朝西偏北」：石墩在桥西头南侧，要让亚伦落在画右前景、杜克落在画中偏左，机位只能几乎正朝西，偏南 1°）；亚伦后脑与肩在画右前景（约 +0.6），杜克离机位约 20 m、离亚伦约 17 m，画面中景偏左（约 −0.35），站着时占画高约 34%、坐下后约四分之一。杜克 0–1.2 s 背着盾沿西岸土路慢慢走到石墩前，1.2–2 s 取下盾竖靠在石墩北边（他坐下后的左手边），2–2.8 s 坐上石墩、脸朝东望着亚伦，之后不再起身。固定机位，焦点由亚伦移到杜克。"

