# s16 st1：西岸桥头固定机位（同 s14）——一直站在桥头的杜克听见对岸米莉的痛叫，抓起盾挽上左臂，冲上窄桥往东跑。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；石拱桥 b13（x132–148），桥面中线西头 (132, 144.40) → 东头 (148, 143.47)；
# 方石墩在桥西头南侧路旁 (131.2, 145.7)；杜克的起幅站位 (131.65, 145.0) 与盾 (131.7, 144.72) 接 s14 末。
[meta]
scene = "bg1-10"
view = [124, 136, 156, 152]
note = "机位与 s14 相同：西岸桥头南侧河岸 (130.85, 149.0)，胸口高 1.4 m，30 mm 朝北偏东约 27°，整镜不动。起幅杜克站在石墩旁、桥头边上 (131.65, 145.0)，离机位约 4.1 m，在画左三分之一，侧身朝画右（东）；盾底立在他左脚边、左手握着盾沿，盾入画。1 s 痛叫传来，1–1.5 s 左前臂穿进盾背的臂带把盾挽起，2–2.9 s 一大步跨上桥面，2.9–5 s 沿窄桥往东跑（约 2.8 m/s），落幅他在拱顶西侧的桥面上 (138.3, 144.03)，离机位约 9 m，全身背影、在画右边缘往对岸跑（再往东就出画）。和分镜的出入：同 s14，30 mm 才能把桥放进画右，起幅杜克是中全景（画面高约 2.8 m，头到脚），不是中景；对岸桥头在画外，落幅他跑到画右边缘（拱顶一带）。"

