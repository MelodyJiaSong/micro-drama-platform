# s1 st2（15 s）过肩中景，固定机位：机位在卫兵西左肩后、朝南（与 st1 同在两人连线东侧，不越轴）；亚伦平静地说去修道院、萨缪尔修士叫他来，把信递到卫兵面前、火漆朝上；卫兵低头看火漆、放行，侧过身朝门洞一摆手。另一名卫兵在画外。
# 坐标＝bg20 南墙隘口平面图（米，x 向东、y 向南）；南墙南面 y28.1，门洞 x20.6–23.4。
# 接 st1 末：亚伦停在 (22.2, 31.7) 面朝卫兵西；卫兵西在 (21.8, 30.3) 竖握长戟、面朝亚伦（南偏东）；卫兵东在岗位 (24.0, 29.6)。
# 2026-10-18 follow-up 081：改到门外；反打朝南，亚伦身后是往南下坡没入林子的土路（bg20-8）。卫兵最后只侧身摆手、脚不挪（不在镜头前横穿）。

