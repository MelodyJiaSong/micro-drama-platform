# s4 st15：双人中全景（32 mm、离地 2 m 略俯），亚伦走到杜克身边并排。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）；长桌 x19.8–22.2、y52.85–53.75，兵器架 b05 贴东墙。follow-up 049 按新分镜重画。
[meta]
scene = "bg2-6"
view = [12, 40, 30, 60]
note = "治安官在 (23,56)（不在本镜 cast，画外）。机位在治安官东侧 (25.6,56.2)、离地 2 m，朝西北（−44.5°）：亚伦起初在桌南沿 (21.3,54.3)、面朝东南的治安官（也就是朝着镜头这边），右手扶着身后的桌沿，0–1 秒先看他被打量后的脸；杜克在桌东头外 (24.3,53.6) 朝南看治安官、侧眼看着亚伦。1–3.5 秒亚伦松开桌沿，经 (22.6,54.1) 绕过桌东头到 (23.1,53.2)，约 0.95 m/s；两人最后并排朝治安官，亚伦画左、杜克画右，从起点到终点都在取景内。4.5–7 秒亚伦低眼看右袖口那点血，用左手把卷起的右袖口卷边理平，袖子仍卷着，再抬眼看治安官。机位由旧图的 (24.2,56.7) 东移 1.4 m：旧位置 32 mm 下杜克的盾被画右边切掉，画外的治安官身子也挤进画左边（离轴线只 26°）；现在亚伦起点在画左（u≈−0.6）、杜克连盾在画右（u≈+0.6），治安官离画左边还有约 6°。分镜写机位在治安官「东北侧」，按坐标是东侧略偏南；离杜克 2.9 m、终点的亚伦 3.9 m，32 mm 下两人近乎全身（分镜写膝部至头顶）。兵器架在机位右后方，不在画里。时长 6→7 秒。"

