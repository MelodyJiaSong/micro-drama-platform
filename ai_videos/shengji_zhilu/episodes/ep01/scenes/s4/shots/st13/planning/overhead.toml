# s4 st13：第二个动作主镜头（全景、固定、35 mm 眼平），治安官进门叫杜克。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）；武器厅南门 x19.8–22.2（南墙 y57.2–58），兵器架 b05 贴东墙 x26.8–27.8。follow-up 049 按新分镜重画。
[meta]
scene = "bg2-6"
view = [12, 40, 30, 60]
note = "机位在南门内东侧、贴着南墙 (23.4,57.1)，朝北略偏东（瞄 (23.89,49.1)），35 mm：治安官从画左外的南门进来，大步走到画左前景 (23,56) 站定（离镜头 1.2 m，是画左近处的大前景），面朝杜克；杜克起初在东墙兵器架前 (24.1,51.3) 面朝东对着训练师，听见喊声约 4 秒转过身，6–8 秒挺胸走两三步到长桌东头外 (24.3,53.6)，在画面中间；训练师起初在杜克东边一步 (25.3,51.0)、双臂抱胸，目光跟着治安官和杜克，6–7.2 秒退一步到兵器架前 (26.1,51.2)，在画右中景。长桌东头在画左、被治安官的背影挡住；桌边的亚伦 (21.3,54.3，约 −40°) 与已让到长桌西头南面的萨缪尔 (20.2,55.6，约 −65°) 都在画左外（35 mm 半视角 27°），不在本镜 cast。和分镜的出入：分镜写「南门与进来的治安官在画左近处」，但机位在南门内、朝北，南门在机位左后方（约 −100°），画里看不到门，看到的是从画左外进来的治安官。"

