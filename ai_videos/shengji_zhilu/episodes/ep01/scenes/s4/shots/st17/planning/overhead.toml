# s4 st17：全景（35 mm 眼平），机位在两名新兵身前朝西南看南门，治安官回身下禁令后出门。坐标＝bg2 北郡修道院平面图（米，x 向东、y 向南）；武器厅南门 x19.8–22.2（南墙 y57.2–58）。follow-up 049 按新分镜重画。
[meta]
scene = "bg2-6"
view = [12, 40, 30, 62]
note = "机位由旧图的南门外改到两名新兵身前 (23.7,53.9)（亚伦 (23.1,53.2)、杜克 (24.3,53.6) 在镜头后方，不在本镜 cast），眼平，朝西南（221°）看南门，35 mm。治安官 0–2.6 秒从画左 (23,56) 走到门槛内 (21,57.45)，3 秒回身面朝东北的厅里，目光落在镜头后方的两名新兵身上、略偏镜头（偏约 8°，不直视）；门在画面中间偏左（−4°），门框和门外的天光框住他；11–11.6 秒朝画右的萨缪尔点一下头，12 秒转身迈出门槛，沿门外往西南走远（约 1 m/s），14 秒时在门洞里已小、仍从门洞看得见，出了门槛。萨缪尔在长桌西头南面 (20.2,55.6)，画右（+24°，全身，35 mm 半视角 27°），面朝东南的门口，目光跟着治安官，点头回礼，不走动。机位仍在治安官与新兵连线的同一侧（与 st16 同侧），不越轴。和分镜的出入：「治安官在画面中间的门洞里」与「萨缪尔在画右、全身」两头够不着画面正中——门与萨缪尔从机位看相差 28°，门只能放在中间偏左（约 −0.15 个半幅）。时长 12→14 秒。"

