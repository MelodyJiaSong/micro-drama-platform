note = "治安官站在长桌东南面 (23,56)，0–3 秒看着画左外、刚走到桌东头 (24.3,53.6) 的杜克，3–4 秒转头低眼看向近前的亚伦；亚伦在桌南沿边 (21.3,54.3) 转过身来面朝东南的治安官，右手往后扶着桌沿，背对镜头。机位在亚伦身后偏右（西北偏西）、长桌西南角外 (19.74,53.88)、离地 1.42 m 略往上拍，60 mm：治安官在画面中间偏右（脸 u≈+0.25），脸不被挡；前景亚伦背对镜头在画左（虚焦）——后脑贴着画左边、右肩在画左下、右肩后上方的锤头在画左上角（下半截入画，上沿出画），锤头离治安官的脸约 0.6 个半幅；他的脸看不到。杜克（约 −30°）在画左外，萨缪尔 (20.2,55.6，约 +40°) 在画右外，训练师更远，都不在本镜 cast。和分镜的出入：分镜（及设计稿）写机位离亚伦不到一米、离地约 1.2 m，按锤头在右肩后上方离地 1.62–1.82 m 算，那样锤头和后脑都在画框上方很远处，画里只剩肩头一角，读不出前景是谁；改为离亚伦约 1.6 m、离地 1.42 m，锤头和后脑才进画，仰拍只剩约 2°。离治安官 4.2 m，60 mm 画面高约 1.4 m，他是腰上至头顶（分镜写胸口至头顶）。"

