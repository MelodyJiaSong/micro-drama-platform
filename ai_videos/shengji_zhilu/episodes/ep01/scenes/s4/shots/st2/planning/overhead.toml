note = "背景必须是南立面与石阶（bg2-9 场景图就是从石板地南缘朝北拍正门），所以机位朝北略偏东。068 分镜已采纳上一轮修改请求方案 A：修士在画左前景、离镜头约 2.5 m（画面左缘内），0–3.2 s 3/4 背对镜头朝东北对着两人（听亚伦喊话、放下水桶），3.6 s 转成侧身朝西、右臂朝画左一指并开口（说话时对镜头约 75°，看得见嘴）；亚伦与维里在他东北约 2.4 m、面朝西南对着修士，对镜头约 25°，近乎正对镜头，焦点在亚伦。机位在三人南侧、胸口高 1.6 m，40 mm，离亚伦约 4.5 m：画面高约 2.3 m（中景偏松，膝上到头顶），正门拱洞与石阶在亚伦与维里身后。亚伦在维里左侧扶着他（两人面朝西南时，亚伦在维里东南、离镜头稍近，画面上在维里右边；维里在亚伦右侧＝西北，好的左臂搭在亚伦肩上，左手捂着右上臂刀口，伤口在西北外侧）。静帧核对第 1 版：修士几乎全在画外、两人纯侧脸——已把修士拉近到左前景、机位左转。3.6–7 s 修士转身朝西一指（伸手）并说「In the Hall of Arms. That way, through the side door. I'll come with you.」；7–7.4 s 两人搭着肩作为一个整体右转约 45° 朝西（转完亚伦在维里左侧＝南、离镜头近，维里在北、离镜头远），随即从修士身后（北边）朝画左（西）快步走（约 1.8 m/s），约 9.0 s 出画左；修士 7.5 s 起跟在后面，约 9.6 s 出画左。（083 改：原来朝东、出画右。）屏幕方向接 st1：修士在画左、两人在画右，都朝北的机位，不越轴。"

