# s14 st1：西岸桥头固定中景——米莉抱着空筐要过桥，坐在石墩上的杜克起身拦，她挣开、指着对岸上了桥；杜克追到桥头，一脚踩上第一块石板又收回，摊手，抓起盾站在桥头。
# 坐标＝bg1 北郡山谷平面图（米，x 向东、y 向南）；石拱桥 b13（x132–148），桥面中线西头 (132, 144.40) → 东头 (148, 143.47)；西岸土路从 (124, 146) 来；
# 方石墩在桥西头南侧路旁 (131.2, 145.7)，盾竖靠在它北边 (131.25, 145.3)——与 s7 st2 / st4、s16 同一块石墩、同一座桥头；s16 用同一机位。
[meta]
scene = "bg1-10"
view = [124, 136, 156, 152]
note = "机位在西岸桥头南侧、离水边约 4 m 的河岸上 (130.85, 149.0)，胸口高 1.4 m，30 mm 朝北偏东（约北偏东 27°）平视，整镜不动。杜克在石墩上时离机位 3.3 m、在画左三分之一（约 −0.66），机位几乎在他正南，他朝东望桥，是侧身朝画右；窄桥从他右边往画右跨过河，画右边缘大约到拱顶（x≈139），再往东的对岸桥头在画外，画右后方远处是对岸葡萄园的西北角。和分镜的出入：分镜要「中景（坐着头到膝、站起头到大腿）」又要对岸在画右深处，同一个固定机位做不到——要桥和米莉上桥走远进画，只能 30 mm、离 3.3 m，杜克实际是中全景（画面高约 2.2 m：坐着头到脚、站着头到小腿）；对岸桥头在画外，米莉约 7 s 在拱顶西侧（x≈138.7）出画右。时序：米莉 0 s 从画左外沿土路快步（约 2 m/s）走来；杜克 1 s 看见、1.3 s 站起、1.8 s 跨到她前面伸手拦；她 1.9 s 停住半步、2.2–2.6 s 挣开、2.6–3 s 朝对岸指；3.3–3.8 s 从他北侧绕过去踏上窄桥往东走；杜克转身追一步，4.1 s 到桥头，4.6 s 右脚踩上第一块石板、5.4 s 收回；6.3–7.7 s 朝对岸摊手；8.6 s 退半步到石墩边，9–9.4 s 抓起盾、盾底立在左脚边握紧盾沿，站着盯园子，不坐回去。和分镜的出入：分镜 6–8 s 写米莉「走下桥那头，进了藤架」——桥 16 m、桥东头到葡萄园西沿还有 6 m，快步 8 s 时她只到拱顶，10 s 时快到对岸桥头（x≈144.6）；走下桥、进藤架都在镜头之后。"

