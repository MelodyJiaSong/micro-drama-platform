# s7 st5（9 s）近景·米莉·过肩·低机位·固定：米莉说手上没力气了；亚伦开口求她；她把没伤的右手搭到他手背上往下压。
# 坐标＝bg18 北郡葡萄园平面图（米，x 向东、y 向南）。s7 全场共用一套站位（藤垄 y19.4 那排的西头、最靠河的一端，垄西头 x≈16.5，再往西是河岸陡坎）：
# 断篱笆桩 (16.9, 19.25)；米莉背靠桩坐在 (16.9, 19.6)，身子朝南；亚伦在她左侧（东边）；Hale 从东南边的藤架口（y21.6 垄行一侧）出现，站在 (19.3, 21.0)。
# 轴线与机位：机位都在人物南侧（y21.6 垄行那一侧），朝北拍时画左＝西（河）、画右＝东（坡上）。米莉—亚伦一组：米莉画左、亚伦画右；亚伦—Hale 一组：亚伦画左、Hale 画右；全场不越轴。

