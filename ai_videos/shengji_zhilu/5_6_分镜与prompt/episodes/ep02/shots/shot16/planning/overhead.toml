# shot16 镜头平面图（overhead）的唯一出处：镜头与人各自在哪、往哪走、几秒到。
# 改走位 ＝ 改本文件重跑 `python tools/gen_shots_szzl_ep02.py --only S16`（闸门）；出审阅图 `python tools/shot_overhead.py <shot 目录>`。
# 坐标＝bg807 场地平面图坐标系（米；x 向东、y 向南）。path 路点 [t, x, y] 或 [t, x, y, 面朝x, 面朝y]。
# ⚠ 两层落差：本镜在下层洞厅（b07，x 8–22、y 3–15），地面比上层金砂巷低约 4 m。木栈斜坡 b08 贴东壁，
#   坡头在护栏东端 (21.2, 15)（上层地面），坡脚在洞厅东北角 (21.2, 3)（下层地面）——两人 0–2.8s 沿坡往北往下走，
#   平面图只有两维：坡上的点离下层地面的高度按 4 m × (y − 3) / 12 算（y 9 处约 2 m、y 5 处约 0.7 m）。
#   场景 blend 没有层高（build_scene 无坡道 kind）：previz 里两层同一地坪，斜坡是平的——previz 渲出来人走在平地上，这一段以 prompt 为准。
# 北壁 b09 ＝ 新凿的掌子面（金砂脉变粗分岔）；插火把的木柱 b10 在 (13, 5.6)，是下层唯一的固定光源；西壁脚下矮岔洞 b11 口在 (8, 9)。
# 9.5s 起杜克站在火把木柱西南、亚伦东南一步多（previz 静帧第 1 轮：原站位 (12.9, 5.2) 正好在木柱后面、又被亚伦挡住，挪开）。
# 冲锋（技能卡 k101）只在开打前：杜克从坡脚往西冲约六米，钢盾把金牙顶在掌子面岩壁上；它一僵、项链甩出去，挣开后往西钻进矮岔洞。

