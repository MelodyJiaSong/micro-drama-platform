# 改动作 ＝ 改本文件重跑 `python tools/cascadeur/choreo.py <shot 目录> --build`；部件都在共享库 tools/cascadeur/poses.toml。
# 时刻与 shot16.md `动作:` 时间轴、overhead 的 [[hit]] / [[cast]] 逐拍对齐（rule 4h ②）。亚伦与金牙不在这里：本镜只有杜克出手（冲锋），色块人偶够用。
# follow-up 052 G13：攻防镜的人体一律 Cascadeur。⚠ 0–2.8s 下坡那段 blend 里是平地（两层同一地坪），previz 只锁时刻与方向。

