# 杜克：0–2.8s 下坡（2.8s 钉一个站定键：只靠步态键插值，烘出来 2.8s 两脚中点比坡脚落后 0.58 m，build_previz 根偏差自检不过）；3.6s 坡脚站定、钢盾在前；4.4s 放低身子往前一冲（冲锋），5.6s 钢盾把金牙顶在岩壁上；
