# 接 shot14 末：杜克 (19.3, 33.2) 钢盾顶着监工 (20.0, 32.4)，亚伦 (18.5, 33.6) 在他身后；矿工缩在西壁墙根，小木箱一摞在 (17.7, 36.0)。
# 审判（技能卡 k202）没有飞行物：亚伦先绕到杜克右肩旁，从他肩侧朝监工一指——指向不越过杜克（[[cast]] 时杜克的盾在两者之间）。
# 监工是持械者（meta hostile）：够得着的距离里每 2 s 内得有它一下——0.8 / 2.4 / 3.6 / 4.9s 砸在盾上，7.9s 扑亚伦一棒落空。
