#   0–9.6 s 与 shot18 首段同一个街西侧两人对站（杜汉、杜克都 3/4），杜克听到 deputy 的脸、说 Tomorrow, then. 都在这一段里；
#   9.6 s 切西南街面迎面、机位缓缓后退跟两人：杜汉跟着走两步、冲背影追一句（交接表原意是 8.3 s 就切迎面，可 Tomorrow, then. 行尾是「对杜汉」，
#   迎面机位里他得背对镜头说——face_to 与背影两道闸门都过不去，所以留在首段）。杜汉始终在杜克画左、杜克在亚伦画左。

