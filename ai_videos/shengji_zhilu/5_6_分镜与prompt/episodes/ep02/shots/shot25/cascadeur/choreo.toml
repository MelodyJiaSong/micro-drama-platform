# shot25 人体动作表（Cascadeur 层）。位置与朝向一律从 ../planning/overhead.toml 读，这里只写「身体摆成什么样」。
# 改动作 ＝ 改本文件重跑 `python tools/cascadeur/choreo.py <shot 目录> --build`；部件都在共享库 tools/cascadeur/poses.toml。
# 时刻与 shot25.md `动作:` 时间轴、overhead 的 [[hit]] / [[cast]] 逐拍对齐（rule 4h ②）。五个鱼人不在这里：色块代理够用。
# follow-up 052 G13：攻防镜的人体一律 Cascadeur。5.5s / 9.9s / 12.5s 是镜内硬切，人没换位置。
# ⚠ 本文件只写了逐拍姿势；烘焙（--build，要开着 Cascadeur）与 previz 渲染都还没做（ep02 分段 c 本轮不跑 Cascadeur / Blender）。

[meta]
origin = [237.7, 178.3]        # 平面图坐标；Cascadeur 原点 ＝ 亚伦站的那一点（芦苇东缘的浅水里）
fps = 30

# 亚伦：0–1.2s 右手提锤拄在水里；1.2s 左手往前一推——什么也没有；3s 站稳攥锤，3.1s 左手举过头顶（光壳起）；
# 6.2s 转向东边，6.6 / 7.4s 左拳捶壳壁，8.3s 左掌平推壳壁；9.9s 光壳散、双手横锤护身；12.6s 转回西边、12.8s 横扫到底；
# 13.8s 左手伸进怀里，14.1s 掏出藻叶举到身前；14.2s 转向杜克，喘着气
