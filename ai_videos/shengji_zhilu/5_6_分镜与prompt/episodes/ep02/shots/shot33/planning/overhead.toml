# shot33 镜头平面图（overhead）的唯一出处：镜头与人各自在哪、往哪走、几秒到。
# 坐标＝bg178 场地平面图坐标系（米；x 向东、y 向南）；生成器见 spawns/shots-d2/scratch/build_ov2.py（2026-10-01 货车东挪 2.1 m 后重排）。
# 窄口喉部在 y≈133.6：西边农舍东墙 x = 204.9、东边翻倒货车的西角 (207.14, 133.61)，最窄 2.24 m；南瓜堆 x 205.5–209.5、y 139.4–142.4；苏伦娜的门口在农舍东墙 (205.98, 127.54)。
# 0–2.4s 亚伦掌心近景（聚光吟祷词，2.4s 那半句断了）｜2.4–3.9s 苏伦娜托火近景（口令 2.6–3.5s）｜3.9–12s 一条连着的运镜：3.9s 他手里的光一散（k201 断，0.5s 散尽），4.4s 罩壳（k205），
# 5.4s 她才推出火球、5.7s 炸在壳上（w28 ④ 两人放段错开 1s），刀砍在壳上（爆，亚伦西北侧中景）；6.2–9.3s 缓推到壳里亚伦的脸，一词一拍吟完（停）；9.3–9.7s 摇到杜克，光柱落下、左臂抬起，10.7s 壳散（爆）。
# 杜克回身朝着亚伦，把往前挣的沃尔特挡在身后（西北）——五个机位都不带到沃尔特，本镜平面图不放他；两个强盗从杜克北边绕过去，扑在亚伦东北侧。

