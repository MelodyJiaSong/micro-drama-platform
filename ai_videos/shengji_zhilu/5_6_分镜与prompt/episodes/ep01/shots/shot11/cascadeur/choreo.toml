# shot11 人体动作表（Cascadeur 层）。位置与朝向一律从 ../planning/overhead.toml 读，这里只写「身体摆成什么样」。
# 改动作 ＝ 改本文件重跑 `python tools/cascadeur/choreo.py <shot 目录> --build`；部件都在共享库 tools/cascadeur/poses.toml。
# 时刻与 shot11.md `动作:` 时间轴、overhead 的 [[hit]] / [[cast]] 逐拍对齐（rule 4h ②）。矿工不在这里：色块人偶够用。
# follow-up 052：两人走路、打斗原先是色块人偶（走路像机器人、打斗僵硬）——攻防镜的人体一律 Cascadeur（G13）。
# 6s / 25s 是镜内硬切、人换位置：切点前 0.1 s 各补一键，免得切前两帧人在滑。平面图每个路点时刻都钉一键（不钉会拖着走偏）。

[parts]
eyes_up = { head = -32 }     # 打斗里杜克抬头盯着对手（用户 2026-10-01：他全程低着头像傻子）
eyes_fwd = { head = -12 }

[meta]
origin = [30.0, 14.0]          # 平面图坐标；Cascadeur 原点 ＝ 过道口南一步（杜克被拖进岔口的那一段）
fps = 30

# 杜克：0–5.9s 钢盾举在身前压低身子往里走；6s（切）堵在过道口，7.2 / 9.0s 扛镐、8.2s 盾沿一顶；10s 左肩挨一镐、左臂一软；
# 11s 被撞得仰面坐倒，右手捂左肩；12.7–13.5s 坐着被拖进岔口；17.8s 光柱里长出一口气；18.3s 右膝撑地转身朝南、右胳膊搭上亚伦的肩，19s 站起来，19.7s 腿一软往下坠；
# 20–24.9s 被架着往南逃，左臂垂着；25s（切）洞口外踉跄两步，靠木撑滑坐下来
