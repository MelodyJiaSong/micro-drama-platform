# shot11 镜头平面图（overhead）的唯一出处：镜头与人各自在哪、往哪走、几秒到。
# 改走位 ＝ 改本文件重跑 `python tools/shot_overhead.py <shot 目录>`；shot blend 从同一份读，不重填坐标。
# 坐标＝本镜场景的场地平面图坐标系（米；x 向东、y 向南）。path 路点 [t, x, y] 或 [t, x, y, 面朝x, 面朝y]。
# follow-up 052 重排（用户：去掉「它们为什么冲你去」这条线，亚伦放圣光给杜克治、两人艰险逃出来就好；锤在逃跑时丢下）：
#   过道口两人并肩挡，杜克左肩挨一镐、被撞得坐倒起不来；亚伦一锤扫灭领头两只帽顶的蜡烛、把那群吓回过道口，揪着杜克后领
#   拖进岔口，跪在他西侧起光——那一群挤在过道口重新点火、谁也不敢先上，却被后面的推着一点点挪近；光柱罩住杜克，他长出一口气、
#   血止住、左臂仍垂着（没治完，S12 再治）；光一散已在两步外，一窝蜂冲过来；两人互相架着站起来，亚伦伸手去捡锤、刚碰到锤柄，
#   一镐擦过他后背、杜克往下坠，他缩回手两手架住人逃（丢锤是他选的）；随后那群全扑向地上那把锤——一只小矿工抢先抱住，
#   被挤得撞在石壁上、蜡烛灭了（S16 伏笔），把锤拖进掌子面的黑里（冷眼观众 / 对白通读 052）。

