# shot02 人体动作表（Cascadeur 层）。位置与朝向一律从 ../planning/overhead.toml 读，这里只写「身体摆成什么样」。
# 改动作 ＝ 改本文件重跑：
#   python tools/cascadeur/choreo.py <shot 目录>            # 出 keys_*.json（位置 × 姿态，逐键）
#   python tools/cascadeur/casc_run.py tools/cascadeur/choreo_run.py 之前先设 CHOREO_SHOT（见 choreo.py 打印的命令）
# 姿态是若干「部件」用 + 拼起来，后写的覆盖先写的；部件都在共享库 tools/cascadeur/poses.toml（本镜没有独有部件）。
