# 杜克每次横跨一步挡回他正前方；24s 仰面倒向北侧画外。站位接 S20 落幅（南北一条线，在空场西半、柴垛西南）。
# 两台机位都在西侧朝东拍（背景是木屋西门与柴垛）：北＝画左，绕东＝在杜克身后、绕西＝在杜克身前，
# 倒向北＝倒出画左。
# follow-up 065：施法时长按原典锁死（读条 2.5 s）——光晚起（14.9s）、照旧 17.4s 放；之前杜克多扛两斧，15.1s 加瑞克见光才扑。
# follow-up 049（打斗复审）：先有光再扑；每一斧写成 [[hit]]、全程 [[guard]]；10s 起机位移到西南，杜克两侧的挡都看得见；
#   开场斧刃卡在背上的圆木盾里到 0.8s；两半木盾与斧是会动的 [[prop]]，落点交给 S22；光从杜克身旁飞过（他先让开那条线）。

