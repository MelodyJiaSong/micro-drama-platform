# shot17 镜头平面图（overhead）的唯一出处：镜头与人各自在哪、往哪走、几秒到。
# 改走位 ＝ 改本文件重跑 `python tools/shot_overhead.py <shot 目录>`；shot blend 从同一份读，不重填坐标。
# 坐标＝本镜场景的场地平面图坐标系（米；x 向东、y 向南）。path 路点 [t, x, y] 或 [t, x, y, 面朝x, 面朝y]。
# ⚠ 镜表首个 plate 是 bg1-4（bg1 坐标系），但 bg1 上的葡萄园只是一整块 44×34 m、没有垄行，
#   「米莉顺垄沟跑来」「红面罩在架间晃」都摆不出来；bg18 的 b07 石拱桥就是同一座桥（见其 note），
#   故本镜挂 bg18。桥西岸在 bg18 上只剩约 3 m，桥头远景机位放在场地西缘外 4.5 m（闸门 5 m 容差内）。

