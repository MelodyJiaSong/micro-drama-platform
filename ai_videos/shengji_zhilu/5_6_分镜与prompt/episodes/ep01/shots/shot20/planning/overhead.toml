# ⚠ 镜表写「木屋在北、柴垛在东、两人从南侧林边进」；平面图 b01 木屋在空场东侧、门朝西，柴垛 b03 在中央偏北，
#   唯一出入口是西来土径。本镜人与人之间的方位照镜表（加瑞克北、两人在他南四步，杜克西、亚伦东；
#   暴徒靠在东北侧柴垛边），木屋与柴垛按平面图，两人从西边林隙进（bg19-1 的视点）。
#   劈柴墩按平面图「中央偏北＝柴垛与劈柴墩」放在柴垛西侧；S20–S22 共用这一套站位。
# follow-up 049（打斗复审）：四斧一斧退半步；暴徒一棒被架住、一锤撞回柴垛；亚伦从杜克身后绕到加瑞克右前；
