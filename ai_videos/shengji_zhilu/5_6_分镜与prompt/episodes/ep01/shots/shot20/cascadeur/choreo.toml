# shot20 人体动作表（Cascadeur 层）。位置与朝向一律从 ../planning/overhead.toml 读，这里只写「身体摆成什么样」。
# 改动作 ＝ 改本文件重跑 `python tools/cascadeur/choreo.py <shot 目录> --build`；部件都在共享库 tools/cascadeur/poses.toml。
# 时刻与 shot20.md `动作:` 时间轴、overhead 的 [[hit]] 逐拍对齐（rule 4h ②）。暴徒不在这里：色块人偶够用。
# follow-up 052 G13：攻防镜的人体一律 Cascadeur。加瑞克的阔刃斧是单手斧（e5113，全长约 70 cm）：一律右手握。

[meta]
origin = [11.3, 15.2]          # 平面图坐标；Cascadeur 原点 ＝ 杜克迎着加瑞克站定的那一点
fps = 30

# 加瑞克：0–14s 坐在劈柴墩上低头磨斧，7.5s 拇指把红面罩往上推、抬眼；14s 起身，15s 起贴到杜克面前，
# 16.2 / 17.4 / 18.6 / 19.8s 四斧专砍钢盾；20.3s 转向扑来的亚伦，20.5s 斧柄往右外一磕格开锤头，21s 一脚蹬在他肚子上；
