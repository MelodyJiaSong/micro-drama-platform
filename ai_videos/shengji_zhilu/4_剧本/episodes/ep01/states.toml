# ep01 跨镜状态账本（机读）：伤、衣物破损、身上带着的状态从哪一镜起、到哪一镜为止必须看得见。
# tools/beat_logic.py 在生成分镜时检查：(from, to] 里的每一镜，动作 / 走位 / 情节 / 本镜状态里得出现 show 里任一个词；
# 动作里有人被咬 / 被砍 / 擦伤…，就得有 who＝此人、from＝那一镜的一条——带不带到下一镜都要在这里声明（to＝from 即当场就没事）。
# 与 script.md 头部「状态轴」表对账：表给人读，这里给机器查（follow-up 034）。
# severity（follow-up 035，取值唯一出处 beat_logic.SEVERITY）：无碍＝挨了一下但当场没事（to＝from、show 空）｜皮外＝真伤、不碍行动｜
#   行动受限＝瘸、腿软、会自己摔的只能是这一档｜非伤＝衣物 / 物件。写着「挡住 / 没伤到」的只能是无碍。

