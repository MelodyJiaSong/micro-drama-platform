# bg 编号登记簿 —— 《圣光刚好够用》全剧 bg{N} 的唯一出处（rule 4i ①）。
#
# 规则：
# · `n` 分配一次、永不复用、永不改号；目录改名只改 `dir`。
# · `node` 是 0_research/map/world_tree.json 里的节点 id；"" ＝ 剧本自造的地点（世界树里没有对应节点）。
# · 新节点由 `python tools/gen_world_scenes_szzl.py` 按「大陆 → 区 → 全境 / 聚居点 / 子区域 / 城区」顺序追加，
#   从 `next` 起编号；手工只登记 bg1–bg22 这批阶段 2/3 早已定下的号（world.md §5）。
# · 目录落点：scenes/{continent}/{zone}/{dir}/

