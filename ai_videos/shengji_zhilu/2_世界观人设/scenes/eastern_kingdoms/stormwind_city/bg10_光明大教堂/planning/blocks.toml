# 光明大教堂 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 室内局部坐标：y 轴 ＝ 中殿纵轴（y 大的一端是正门，y 小的一端是祭坛与后殿）。**不代表罗盘方位**——区图上教堂体块是斜放的十字形。
# 十字形总外廓取区级平面图 b902（92 × 67.5 m）量级；内部分隔无一手平面出处，全部推定。

[meta]
bg = "bg10"
name_zh = "光明大教堂"
size_m = [110, 100]
px_per_m = 12.0
grid_m = 10
scale_src = "推定"
scale_note = "外廓按区级平面图 b902（地图量取 92 × 67.5 m）放大到 110 × 100 m 场地；中殿宽、柱距、拱顶高（约 30 m）与交叉穹窿高（约 42 m）按「全城最高的尖塔群」与常见十字形教堂比例推定，实机截图到手后校正"
# 世界树画面：极高的石造教堂，主体两侧伸出多组侧翼，屋脊上林立着数量众多的细长尖塔、越靠中心越高；内厅是浅暖白石砌筑、嵌着饱和钴蓝色石材条带，高窗斜落的光柱把空间切开
absent = [
    "任何人物（训练师、牧师、伤员都属 shot 层）",
    "点燃的蜡烛 / 烛台火 / 火盆 / 油灯（默认态唯一光源是高窗日光）",
    "玫瑰窗 / 彩绘人像花窗（sk2 核验：文字来源查无实据）",
    "全金内饰 / 木质内饰 / 暗色内饰",
    "持战锤的骑士雕像（那是 4.0.3a 后的广场雕像，殿内也不放）",
    "成排的训练假人（4.0.3a 以后）",
    "对外的第二道门（正门是唯一对外口；两侧下行石阶只通地下墓穴）",
    "可读的文字、碑铭、牌匾",
]

