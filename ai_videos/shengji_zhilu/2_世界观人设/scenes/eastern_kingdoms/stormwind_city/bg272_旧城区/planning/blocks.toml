# 旧城区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg272"
name_zh = "旧城区"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区级平面图 b905 量得旧城区约 145 × 145 m（地图量取），本图外扩到 200 m 以带上西侧运河、南墙下宽水与东城墙；街区内部布局无一手出处，全部推定"
# 世界树画面：墙体是发黄发灰的旧石与外露的深褐木构架，街道狭窄曲折、地面湿污，墙面爬着水渍霉斑，屋檐低垂几乎相接，晾衣绳横跨巷口
absent = [
    "旅店客房 / 可住宿的旅店（旧世这里只有一间酒馆，旅店老板 4.0.1 才加）",
    "集中全部职业训练师的训练大厅（9.0.1；旧世营院只是城军指挥所，训练师分散各区）",
    "升起或拆掉的铁闸门（旧世一直紧闭，4.0.3a 才移除）",
    "城墙与屋顶上的焦黑爪痕、塌毁的街区（4.0.3a 之后）",
    "港口 / 码头（3.0.2）；运河淤泥、芦苇、露出水面的杂物（4.0.3a）",
    "招牌上的文字；夜景 / 火光 / 灯笼（默认态是白天，唯一光源日光）",
    "任何人物、动物",
]

