# 花园区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ≈ 区级平面图 bg268 的 (355, 440) m；区级 b908 花园区 147 × 147 m，本图外扩到带上西 / 南城墙与东北那段运河。

[meta]
bg = "bg275"
name_zh = "花园区"
size_m = [210, 190]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "外廓按区级平面图 b908（147 × 147 m，地图量取）外扩；园内布局除「月亮井居中、入口挂旗幡、西南两面是城墙」外无一手出处，全部推定"
# 世界树画面：与全城的白石硬铺完全相反——地面是草与土径，高大乔木成荫、树影斑驳，建筑稀疏矮小依树而建，整体色调比别处更绿更柔；正中一口自发光的乳白偏冷蓝月亮井
absent = [
    "焦土大坑、倒伏断树、翻起的地皮、城墙焦黑爪痕（4.0.3a 死亡之翼掀飞本区之后）",
    "雄狮之眠纪念馆（7.0.3 原址新建）",
    "港口 / 码头 / 墙外海湾里的船（3.0.2；旧世西墙外是海崖，园内看不见海）",
    "白石硬铺广场、喷泉、雕像（本区地面是草与土径）",
    "精灵树屋 / 高耸弧形木构 / 发光的紫蓝植物（园内唯一的精灵式石作是圆池与四根藤柱）",
    "训练假人",
    "夜景 / 火光 / 灯笼 / 火把（默认态是傍晚前日光 + 池水微光）",
    "旗幡上的文字",
    "任何人物、动物（坐骑、豹类坐骑都不入画，木棚是空的）",
]

