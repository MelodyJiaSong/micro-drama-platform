# 矮人区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 街区外廓取区级平面图 b903（地图量取 157 × 132.5 m）；西缘运河、东缘要塞台地的相对方位取区级卡；
# 锻造广场、齿轮隧道口、北部水井、采矿店的相对方位取世界树（原典方位），落点与街巷走向全部推定。

[meta]
bg = "bg270"
name_zh = "矮人区"
size_m = [180, 150]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区级平面图 b903 矮人区 157 × 132.5 m（地图量取）外扩到 180 × 150 m，含西缘运河与东端石壁；街内布局无一手平面出处"
# 世界树画面：矮胖敦实的石构建筑，门窗比人类区低矮、比例更厚重，铁件与铆钉外露；数处露天广场上并排立着燃着炭火的锻炉与铁砧，橙红火星四溅，整个街区笼在一层不散的灰蓝烟雾里
absent = [
    "拍卖行、银行、旅店（4.0.3a 才进矮人区）",
    "任何人物（铁匠、矮人工匠、卫兵、地铁乘客都属 shot 层）",
    "火把、灯笼、窗内灯火（唯一人工光源是锻炉炭火）",
    "熔岩、明火火柱、爆燃（锻炉只是一层暗红炭火）",
    "可读的招牌、店名、文字（招牌板空白）",
    "绿地与树（全区石铺，只有烟）",
    "割喉小巷（技术上属本区但不与街区相连，另立 bg）",
    "港口、飞行坐骑（旧世没有）",
]

