# 法师区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 街区外廓取区级平面图 b904（地图量取 147.2 × 128.8 m）；东北运河、西北花园区、南西城墙的相对方位取区级卡与世界树；
# 高塔居中、水井在街心取世界树（原典方位），各店铺落位与街巷走向全部推定。

[meta]
bg = "bg271"
name_zh = "法师区"
size_m = [180, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区级平面图 b904 法师区 147.2 × 128.8 m（地图量取）外扩到 180 × 160 m，含东北角运河与南西两面城墙；坡顶比桥头高约 10 m 为推定（世界树：塔区入口比花园区高约 40 码）"
# 世界树画面：一座爬满深绿藤蔓的高塔统领全区，四周是两层的裁缝铺与仓库，门口堆着捆扎布匹与封蜡陶罐，沿街摆着露天咖啡座
absent = [
    "成排传送门的塔内大厅（8.1.5）",
    "发光符文、悬浮书本、法阵光、魔法粒子（街面默认态零魔法光）",
    "任何人物（法师、裁缝、食客都属 shot 层）",
    "火、烛火、灯笼、炼金炉火（都在室内，不入本档）",
    "可读的招牌与店名（招牌板空白）",
    "城门（南西两面只有城墙，没有门）",
    "港口、飞行坐骑（旧世没有）",
]

