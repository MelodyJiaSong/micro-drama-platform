# 暴风要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图 ＝ 区级平面图（bg268 terrain.toml）坐标平移 (-840, -190)；台地轮廓沿用区级推定值、南缘收到 y≈160 给内庭让位。

[meta]
bg = "bg274"
name_zh = "暴风要塞"
size_m = [260, 240]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "取区级平面图 x 840–1100、y 190–430 m 一窗；要塞体块总尺度按区级 b907（约 172 × 135 m，地图量取）；台地、吊桥、门楼、内庭与各厅室位置只有原典相对方位（右手 / 左手 / 正后方），全部推定"
# 世界树画面：建在全城最高岩石台地上的多体量城堡群，主厅居中、四周簇拥方塔圆塔，塔顶覆深蓝灰石板，建筑之间以带连续券拱的高架廊道相连，明显高出周围街区一大截
absent = [
    "露天步道＋大喷泉样式的内庭（4.0.3a 重制；旧世是吊桥 → 围合石庭 → 主厅）",
    "能俯瞰湖面的花园平台、要塞背后的湖与公墓（4.0.3a）",
    "第二道入口（旧世进要塞只有这一座吊桥）",
    "候见厅里的异族使者（TBC 之后才有）",
    "战火焦痕、爪痕、塌毁的塔（4.0.3a 之后）",
    "空中坐骑 / 飞艇（旧世天空不能飞）",
    "夜景 / 火光 / 火盆 / 灯笼（默认态是白天，唯一光源日光）",
    "披甲卫兵、幼王与摄政（人物归 shot，锚点图无人）",
    "任何人物、动物",
]

