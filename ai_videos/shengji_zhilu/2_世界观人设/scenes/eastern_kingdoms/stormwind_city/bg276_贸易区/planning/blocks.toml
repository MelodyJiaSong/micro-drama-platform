# 贸易区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。岛本体约 140×110 m（bg268 区级图 b909 量取），四周留出运河与对岸堤。
# 原典只给了方位（银行/旅店/邮箱在西南、拍卖厅在喷泉正北偏西、武器铺在拍卖厅旁、栖台在东侧坡道上）；尺寸与其余铺面全部推定。

[meta]
bg = "bg276"
name_zh = "贸易区"
size_m = [200, 170]
px_per_m = 7.0
scale_src = "地图量取"
scale_note = "岛状街区外廓取 bg268 区级平面图 b909（142.3×110.4 m，区图量取）；四周加一圈运河与对岸堤到 200×170 m。岛内各铺面尺寸无一手出处，一律推定"
# 世界树画面：全城最中心也最吵的街区，两三层白石商铺围合出一片开阔石板广场，底层开敞为铺面、上层住人，摊位与行商挤满街面，正中一座石砌圆喷泉
absent = [
    "港口 / 码头 / 泊船（旧世无港）",
    "第二家旅店（旧世全城只有这一家）",
    "4.0.3a 版拍卖厅名称与银行内饰",
    "淤泥半填的浅水运河、芦苇、露出水面的杂物",
    "传送门 / 训练假人 / 飞行坐骑",
    "人物、行商、动物（栖架默认空着）",
    "可读的招牌文字（招牌只画图案）",
    "夜景、窗口灯光、壁炉火光、灯笼",
    "山、森林、田野",
]

