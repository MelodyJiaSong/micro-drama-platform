# 暴风城（stormwind_city）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 城墙长墙 / 拱桥 / 洞口 / 水潭走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库（新立 30 件）。
# 去重：previz 白模只锁几何与剪影、材质会剥掉（rule 4d ①），剪影同类即共用一件——
#   铺子 / 酒馆 / 旅店 / 民居 / 仓库共用 a02（紫顶、暗红褐顶只是颜色）；银行 / 拍卖厅 / 接待厅 / 情报楼 / 营楼 / 图书馆 / 要塞侧厅共用 a05；
#   城堡圆塔 / 城门双塔 / 藤蔓高塔共用 a08；监狱与宝库两座水中石堡共用 a13；谷地五尊巨像共用 a28（暂无排镜，差别只在剪影细节）；
#   城门 a11 兼大教堂南正门拱洞；灯架 a22 兼殿内高烛架；刻纹石柱 a24 兼石堡门外立石；圆喷泉 a20 兼粗沿圆井。
# judgment calls：
#   bg10 是教堂中殿内景：中殿走 hall_shell（南面门洞＝正门一侧），侧廊 / 交叉穹窿 / 横翼 / 后殿走 chamber（室内壳体，image-to-3D 给不出可进入的内部）；
#     两排束柱与中殿侧壁重合、引擎没有开敞柱廊的 kind，先走 low_wall 当隔断；祭坛台走 altar、木长凳走 tables、下行石阶口与地面钴蓝条带是贴地标记走 plaza。
#   bg268 区级卡的城区块：有建筑的城区用单体资产 + count 散布出全城俯瞰的屋顶肌理（duskwood 把子区块判 yard，暴风城的俯瞰建场空镜要看得见街区体量，故不同）；
#     教堂广场 / 运河节点 / 英雄谷是空地或水网标记，走 plaza；要塞整体走远景整体件 a14，近景各体量在 bg274 另用单件。
#   坡道（bg274·b10 主坡道、bg276·b11 栖台坡道）与台阶（bg269·b03）走 plaza（stair 是旋梯）；bg271·b02 塔外螺旋坡道正好是 stair（绕中心柱盘上）。
#   木吊桥（bg274·b03）与小木码头（bg273·b07，h_m=0）：吊桥走 arch_bridge 取桥面 + 栏，码头贴水走 plaza。
#   露天木桌（bg271·b05）与广场空摊位环（bg276·b16）走 tables / stalls；兵器挂墙（bg270·b04）与临河铁闸墙（bg272·b02）走 low_wall；花园小庭院（bg274·b15）走 lawn（两侧石栏）。

