# 内禁锢法阵 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原版区图法阵图标（359, 387 px，约 [36, 58]）＝ 世界 (1180, 1271) m，落在本场地 (200, 160)（圈心）；本图原点 ＝ 世界 (980, 1111)。
# 主路与北 / 西 / 东 / 东南四段岩坎从原版区图 7× 裁切量取（区图 1 px ≈ 3.285 m，±15 m）；南面西南海岸山体山脚在场地南缘外约 30 m，要塞废墟在西南场外。
# 锚点机位：北坎顶 (190, 70)，朝南偏西。

[meta]
bg = "bg53"
name_zh = "内禁锢法阵"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "主路与四段岩坎（北坎在圈心北约 90 m、西坎约 170 m）从原版区图 7× 裁切量取；石柱环直径 30 m、九根、圈心石盘 8 m 按世界树画面推定，未实机量取"
grid_m = 50
# 世界树画面：草地上一圈等距立起的符文石柱，圈心地面刻着发微光的法阵纹，周围有元素生物游荡
absent = [
    "火、烟与任何人工光源",
    "光柱、发光石柱与外溢的魔法光（只有圈心阵纹槽底极淡的微光）",
    "任何人物、元素生物与动物（默认无人）",
    "倒伏、断裂或缺失的石柱（九根俱全）",
    "焦黑烧斑与积水洼",
    "贴近画面的要塞城墙（要塞废墟在西南约 380 m，只在西坎顶上露残影）",
    "成片树林（只有一棵孤树与零星灌木）",
    "4.0.3 新增的元素之环",
]

