# 西部禁锢法阵 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级图点位 (821.3, 657.1) m 落在本场地 (250, 170)（圈心）；古墙 = bg41 `b920` 平移、在豁口 (约 [20,31]) 处断开；
# 主路 / 农庄支路取自 bg41 terrain.toml 同名折线平移。北界山墙西端在圈心北约 300 m，出场地。

[meta]
bg = "bg55"
name_zh = "西部禁锢法阵"
size_m = [440, 360]
px_per_m = 3.5
scale_src = "推定"
scale_note = "古墙、豁口、主路与农庄支路是地图量取（bg41 平移）；石柱环直径 22 m、浅碟洼地、倒柱与水洼位置均按世界树画面推定，未实机量取"
grid_m = 50
# 世界树画面：高地西侧的符文石柱环，一侧石柱已倒伏，圈内积着小水洼
absent = [
    "火焰、烟与任何人工光源",
    "发光的符文、阵纹与石柱（本座一律不发光）",
    "任何人物、元素生物与动物（默认无人）",
    "正在下的雨与水面涟漪（雨后已晴）",
    "焦黑烧斑（那是东部法阵）",
    "草丘与断桩空坑（那是外法阵）",
    "完整无缺的城墙（古墙半塌、有豁口）",
    "成片树林（只有一棵老树与几丛灌木）",
    "北通邻区的山口（北面是封死的山墙）",
    "4.0.3 新增的元素之环",
]

