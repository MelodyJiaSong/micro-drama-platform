# 避难谷地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg47"
name_zh = "避难谷地"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.285 m（区级 terrain.toml 同口径）：REFUGE POINTE 字样外那道弧形崖线宽约 40 px ≈ 130 m，岩丘台面按它取约 150 × 145 m；主路岔口在点位以南约 58 px ≈ 190 m（在本场地南缘外）。营内帐篷、栅栏的尺寸与摆位是推定"
# 世界树画面：大路旁一圈木栅与帆布营帐围成的联盟驻地，篝火、拴马桩与伤兵帐篷挤在一起，栅栏外就是空旷草坡
# 机位（锚点图）：东门外上坡土路（约 [235, 124]）朝西略仰
absent = [
    "石砌城墙、城堡与石砌房屋（只有西缘一段半人高旧石墙基）",
    "燃着的篝火与炊烟（火塘是冷灰）",
    "任何人物、马匹、飞禽与坐骑（默认空营）",
    "战场传送门与任何魔法光",
    "旗帜上的纹章、徽记与文字（长幡无纹）",
    "北门、西门（北、西两面是断崖）",
    "成片树林",
    "空中飞行的坐骑与航线",
]

