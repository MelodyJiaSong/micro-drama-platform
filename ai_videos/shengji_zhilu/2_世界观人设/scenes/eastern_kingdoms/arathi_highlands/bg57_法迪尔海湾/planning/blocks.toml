# 法迪尔海湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 = 区级坐标 − (817, 1590)。bg41 的海湾折线 (985.6,1800.4)→(1100.6,1780.6)→(1209,1741.2) 落在本场地
# (169,210)→(284,191)→(392,151)：湾口朝西南偏西开向外海，湾头在东北偏东；区图帐篷小图标约在区级 (1173,1725) → 本场地 (356,135) 一带（湾头北岸）。
# 子节点：水下暗礁（湾口外水面下）与黑水湾沉船（近岸浅水的沉船带）都没有独立 bg，按世界树画面摆进本图。

[meta]
bg = "bg57"
name_zh = "法迪尔海湾"
size_m = [560, 360]
px_per_m = 2.8
scale_src = "推定"
scale_note = "海湾走向与湾头位置是地图量取（bg41 海湾折线平移）；湾宽 60–150 m、崖高约 70 m、沙滩、帐篷、破船与沉船带的位置均按世界树画面推定，未实机量取"
# 世界树画面：西南海岸悬崖下的隐蔽沙滩海湾，浅绿海水、搁浅的破船与滩头的海盗帐篷
absent = [
    "通往崖顶的山路、台阶、栈道或绳梯（旧世只能跳崖或游泳进出，山路 4.0.3 才开）",
    "码头、栈桥与停泊完好的船（只有搁浅的破船与沉船）",
    "燃着的篝火、烟、灯笼与任何人工光源（火塘是冷灰）",
    "任何人物、鱼形生物与动物（默认无人）",
    "旗帜上的徽记与任何文字",
    "椰树、棕榈与热带植被（北方冷海岸，崖顶只有干草）",
    "巨浪、风暴与翻白的碎浪（湾内水面平缓）",
    "要塞废墟（在崖上以北，湾里看不到）",
    "积雪与冰",
]

