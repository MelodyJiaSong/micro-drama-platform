# 枯木村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg49"
name_zh = "枯木村"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.285 m（区级 terrain.toml 同口径）。场地原点 ＝ 区级坐标 (2100, 1320) m。湖（区级「巨魔村旁的湖」）与东界山墙边线按区级 terrain.toml 平移过来；主村按区图湖东南岸帐篷图标落位，湖西岸另一枚帐篷图标给一小撮帐篷。村内帐篷、图腾柱、晾架的尺寸与摆位是推定"
# 世界树画面：高地东北的丛林巨魔营地，圆锥形兽皮帐与插满骨头的图腾柱，地上是燃着的火坑与晾肉架
# 注：世界树写「东北」，区图与区级平面图都在东南（湖东南岸、东界山墙脚下），以区图为准
# 机位（锚点图）：湖南岸土路（约 [150, 185]）朝东
absent = [
    "石砌或木板房屋（只有兽皮帐）",
    "木栅寨墙与城门（只有村口一道骨饰拒马）",
    "除正中火坑外的任何火光、火把与灯笼（洞口漆黑）",
    "任何人物、巨魔、牲口与动物（默认空村）",
    "文字、符文招牌与旗帜纹章",
    "成片树林（只有几棵零星老阔叶树）",
    "东、南两面的出口（山墙封死）",
]

