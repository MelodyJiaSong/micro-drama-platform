# 诺斯弗德农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg41）世界坐标 (910, 480)；山墙坡脚边线与车路按 bg41 terrain.toml 的北界山墙 poly / 西北农庄支路折线平移（地图量取）。
# 区图 [32, 29] 围栏田地图标落在本图约 (141, 128)，南侧房屋小图标约 (158, 193)——方田按田地图标、主屋按房屋图标摆，稍向东移让出院子。
# 西约 240 m 的石柱环（bg55）、西约 400 m 的古墙（索拉丁之墙）、西南约 650 m 的双湖都在场地外，只写进锚点 prompt 的远景。
# 锚点机位：院子东北侧上坡 (240, 110)，朝西南（方位 235°）。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg45"
name_zh = "诺斯弗德农场"
size_m = [300, 300]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "山墙坡脚边线、车路与两个区图图标的相对位置按区图量取（1 px ≈ 3.3 m，±30 m）；主屋、谷仓、小棚、草垛、农具、岩坎与方田的尺寸与位置推定"
# 世界树画面：草坡上一组石基木构的农舍与谷仓，屋顶部分塌陷，院里堆着干草垛与废弃农具
absent = [
    "院墙与院门（这里是无墙空院）",
    "完好的屋顶（主屋东头与谷仓中段都塌了顶）",
    "风车 / 磨坊",
    "水井、溪流、水渠与池塘",
    "成片树林与孤树（坡上只有草与枯篱）",
    "任何火、烛火、灯笼与炊烟（烟囱是冷的）",
    "帐篷、营地与临时工事",
    "旗帜、徽记与带字的招牌",
    "任何人物、牲畜与飞鸟",
    "夜景、雨与雾",
]

