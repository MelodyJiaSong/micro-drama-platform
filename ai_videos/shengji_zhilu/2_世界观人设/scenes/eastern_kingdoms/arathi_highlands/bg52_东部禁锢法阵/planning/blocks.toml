# 东部禁锢法阵 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级图点位 (2053.3, 755.6) m 落在本场地 (150, 150)（圈心）；北界山墙山脚线取自 bg41 terrain.toml 同一段折线平移。

[meta]
bg = "bg52"
name_zh = "东部禁锢法阵"
size_m = [300, 260]
px_per_m = 5.0
scale_src = "推定"
scale_note = "只有北界山墙山脚线是地图量取（bg41 terrain.toml 平移，圈心北约 120–135 m）；石柱环直径 26 m、八根、焦黑地 56 × 44 m 均按世界树画面推定，未实机量取"
grid_m = 50
# 世界树画面：高地东侧的符文石柱环，立在一片被烧灼过的焦黑地面上
absent = [
    "火焰、烟与余烬（焦痕全是冷透多年的旧痕）",
    "发光的符文、阵纹与石柱（本座一律不发光）",
    "任何人物、元素生物与动物（默认无人）",
    "倒伏或缺失的石柱（八根俱全）",
    "水洼、溪流",
    "穿过法阵的道路（四面只有草坡）",
    "成片树林（只有一棵烧成黑桩的枯树与零星灌木）",
    "4.0.3 新增的元素之环",
]

