# 激流堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg48"
name_zh = "激流堡"
size_m = [600, 440]
px_per_m = 2.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.285 m（区级 terrain.toml 同口径）。场地原点 ＝ 区级坐标 (380, 1180) m。城堡图标 [25,65] 与塔楼图标 [18,69] 相距约 70 px ≈ 230 m，法师塔按塔楼图标落位（地图量取）；西岸海线、南侧山体、东北支路按区级 terrain.toml 平移过来。城墙轮廓、内堡与街区的尺寸与摆位是推定"
# 世界树画面：高地西南角的巨型石砌要塞废墟，塌陷的城墙与被投石弩打穿的塔楼，城内街巷长满野草、随处是碎石堆
# 机位（锚点图）：东北支路坡顶（约 [560, 60]）朝西南俯看
absent = [
    "任何新建或重修的工事（脚手架、新砌城墙、新立的营寨——都是很多年后的版本）",
    "通往西南海湾的山路（4.0.3 才开）",
    "城外其他阵营的新营地（4.0.3 后才有）",
    "完好的城门与门扇",
    "燃着的火把、火盆、篝火与炊烟（法师区火坑是冷灰）",
    "任何人物、食人魔与坐骑（默认空城）",
    "旗帜上的纹章与文字",
    "临城的水面（西墙外还隔一两百米草坡才到海崖）",
    "成片树林（只有墙缝里的小树）",
]

