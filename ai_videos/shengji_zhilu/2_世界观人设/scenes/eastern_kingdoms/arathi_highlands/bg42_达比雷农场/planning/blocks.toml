# 达比雷农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg41）世界坐标 (1680, 740)；山肩边线与车路按 bg41 terrain.toml 的北界山墙 poly / 中部农庄支路折线平移（地图量取）。
# 区图 [55, 40] 田地图标落在本图约 (120, 130)，东侧房屋小图标约 (200, 121)——院子按房屋图标、西侧小田按田地图标摆。
# 东约 250 m 的石柱环（bg52）、西南约 480 m 的木栅营地（bg47）都在场地外，只写进锚点 prompt 的远景。
# 锚点机位：院子东南角墙外 (250, 190)，朝西北。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg42"
name_zh = "达比雷农场"
size_m = [320, 260]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "山肩边线、车路与两个区图图标的相对位置按区图量取（1 px ≈ 3.3 m，±30 m）；院墙、农舍、谷仓、井与畜栏的尺寸与位置推定"
# 世界树画面：高地中部大路旁的农庄群，低矮石墙圈出的院落里有水井与畜栏，屋后是整片黄褐色的休耕地
absent = [
    "任何火、烛火、灯笼与炊烟（烟囱是冷的）",
    "成片树林（只有院外东北角一棵老树）",
    "风车 / 磨坊（那是东南方的另一处农庄）",
    "木栅围田（这里的围墙是干砌石墙）",
    "溪流、水渠与池塘（只有一口井）",
    "帐篷与营地",
    "旗帜、徽记与带字的招牌",
    "塌顶、大片塌墙与荒废痕迹（旧世这户人家还在经营）",
    "任何人物、牲畜与飞鸟",
    "夜景、雨与雾",
]

