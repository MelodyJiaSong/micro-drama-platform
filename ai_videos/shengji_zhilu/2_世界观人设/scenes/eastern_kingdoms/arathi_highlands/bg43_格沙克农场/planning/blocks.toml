# 格沙克农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg41）世界坐标 (1900, 1100)；车路按 bg41 terrain.toml「东侧农庄下路」折线平移，小水潭按「巨魔村西侧小水潭」平移，三面岩坎按区图农庄外那道弧形坎线量取（地图量取）。
# 区图 [62, 58] 农庄图标落在本图约 (137, 165)，主屋按图标摆；东界山体岩坡在东岩坎外约 300 m（世界 x≈2360–2480），巨魔村旁的湖在东南场外——都不画进本图。
# 锚点机位：院东荒田西侧木栅边 (184, 140)，朝正西。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg43"
name_zh = "格沙克农场"
size_m = [300, 340]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "车路、小水潭与农庄图标的相对位置按区图量取（1 px ≈ 3.3 m，±30 m）；主屋、风车、谷仓、荒田的尺寸与相对位置推定"
# 世界树画面：大路东侧的农庄，主屋与磨坊尚完整，木栅围出的田地已荒，谷仓阁楼可上人
absent = [
    "石砌院墙（这里只有木栅栏）",
    "水车 / 溪流（磨坊是风车，没有能推水车的流水）",
    "任何火、烛火、灯笼与炊烟（烟囱是冷的）",
    "倒塌的屋顶（主屋、谷仓、风车都还完整）",
    "成片树林（只有水潭边两棵树）",
    "帐篷与营地",
    "旗帜、徽记与带字的招牌",
    "任何人物、牲畜与飞鸟",
    "夜景、雨与雾",
]

