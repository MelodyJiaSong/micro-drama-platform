# 枯须峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级图点位 (2699, 812) m（坐标 [82,37]）落在本场地 (219, 146)，即谷轴上距西口约 110 m 处；场地 = 区级坐标 − (2480, 662)。
# 谷轴自西口 (120,100) 朝东偏南 25° 伸进东界山体，长约 390 m（走向按区图裁切里那道浅色谷底量取，长度推定）。
# 落锤镇寨心在本场地 (−44, 128)，出西界；东界山体再往东约 470 m 才到海，出场地。

