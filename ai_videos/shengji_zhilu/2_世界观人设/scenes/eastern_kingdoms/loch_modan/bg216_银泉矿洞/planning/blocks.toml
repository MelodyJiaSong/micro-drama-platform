# 银泉矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg216"
name_zh = "银泉矿洞"
size_m = [240, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "裁切图（约 300 × 200 m 视野）量取：矿洞图标挂在石丘北缘、北面一座小石丘、东约 110 m 湖岸石崖、西约 150 m 主干道；石丘外形按裁切图描出、高度推定；洞口与洞前遗留物尺寸无一手出处"
# 世界树画面：北岸崖壁上一个木框加固的矿洞口，洞外停着两辆翻倒的矿车，洞内壁面泛着银灰色的矿脉光
absent = [
    "任何人物、矿工、穴居怪物与动物（默认空矿）",
    "点着的火把、矿灯、烛火（洞内唯一的光是洞口透进的天光）",
    "自发光的矿石与晶体（矿线只反光）",
    "洞内深处的内景（另立 bg）",
    "建筑群与民居（只有一座塌半边的工具棚）",
    "湖床裸露、水位下降（4.0.3 后才有；旧世湖是满的）",
]

