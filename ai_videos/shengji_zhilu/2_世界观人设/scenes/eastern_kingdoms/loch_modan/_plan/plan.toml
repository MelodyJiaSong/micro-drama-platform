# 洛克莫丹（loch_modan）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 墙栅 / 洞口 / 岩台走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重（本区 12 件）：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用——
#   民居 / 窄高石楼 / 国王谷石哨屋共用 a01；旅店与狩猎大屋共用 a02；军需棚 / 铁匠棚 / 畜棚 / 储物棚 / 塌工具棚 / 门廊斜檐共用 a03；
#   瞭望塔与狮鹫栖台同为「粗原木高架台」共用 a05；三处火塘共用 a06；崩落大石 / 露头 / 碎岩滩 / 渣堆 / 界桩 / 长条石共用 a10。
# 额度所限走脚本的有界小件（各自 kind 正好对得上形制）：石砌圆井 → well（井圈 + 双柱 + 辘轳梁）；
#   拒马 → palisade（一排削尖木桩）；草靶 / 晾皮架 / 拴马桩 → post（木柱 + 挂板）；草料垛与鞍具架 → crates；
#   石烟囱 / 劈柴垛 / 支护原木垛是实心方体 → low_wall；窄轨 / 菜地 / 石器散落区贴地 → yard；国王谷石板台地 → plaza；
#   碎石怪之谷落脚窝 → rock_shelf。bg214 是区级主体（zone_whole），不在 bg_dirs 里，不写 use。

