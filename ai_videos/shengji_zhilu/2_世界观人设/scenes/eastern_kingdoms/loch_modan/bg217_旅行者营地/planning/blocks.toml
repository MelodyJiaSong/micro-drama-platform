# 旅行者营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg217"
name_zh = "旅行者营地"
size_m = [120, 100]
px_per_m = 10.0
scale_src = "推定"
scale_note = "点位按区图木屋图标 [82, 63] 取（世界树 [73, 52] 有误，ref 裁切图按错坐标裁出、不可用；与 bg214 terrain.toml 一致）；盆地四周山丘方位取区图，院落与各构件尺寸无一手出处，按「猎人木屋 + 草靶 + 晾皮架」推定"
# 世界树画面：湖东岸林边一座猎人木屋，门廊挂着兽皮与鹿角，屋前拴着猎犬，院里立着射箭靶
absent = [
    "任何人物、猎犬与动物（默认空院）",
    "飞行点、飞行坐骑栖架（4.0.3 才加）",
    "湖面（湖在西面五六百米外，院里只有顺来路豁口才远远望见一线）",
    "燃着的火、冒烟的烟囱、亮灯的窗",
    "其它民居与村镇（这里只有一座猎屋）",
    "训练假人等 4.0.3a 元素",
]

