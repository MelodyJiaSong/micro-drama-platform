# 巨槌要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg81"
name_zh = "巨槌要塞"
size_m = [220, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取区级平面图 b901 的 220 × 200 m：一圈约 120 × 105 m 的尖桩寨墙 + 西北背山 + 东南坡下建场机位的退让；无一手尺寸出处"
# 世界树画面：红土坡上的食人魔营寨，巨大的粗木尖桩围栏，兽皮帐篷比人还高，营中央一堆烧得发黑的骨头
# 区图：西、北两面是北缘山墙西段与西北山体合抱的弧，东面是开阔红原与主干道 → 寨门开东墙
absent = [
    "任何人物与动物（默认空营）",
    "燃着的火、火星与烟（营心骨堆冷透）",
    "石砌房屋、塔楼、城垛与门扇",
    "旗帜、纹章与文字标识",
    "草地、树木与任何绿色植被",
    "河流、水潭与任何水面",
    "4.0.3 后才有的部落据点与其营帐旗号",
    "铺装石板路（只有踩出来的土径）",
]

