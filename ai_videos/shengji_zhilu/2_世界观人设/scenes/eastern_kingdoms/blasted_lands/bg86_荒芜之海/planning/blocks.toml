# 荒芜之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg86"
name_zh = "荒芜之海"
size_m = [800, 600]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "取区级平面图东缘山墙与海岸带之间一段约 800 m 的岸线：西侧山墙脚、崖高约 45 m 取 terrain.toml 的 height_m；断崖到水线、塌落岩块离岸距离均为推定"
# 世界树画面：诅咒之地东缘的海面，被岸上的红尘染成浑浊的铁锈色，浪头低而钝，岸线是一路塌进海里的紫黑岩块
# 区图：东缘山墙（无缺口）紧贴海岸，山背直接陡降入海；区内唯一的水
absent = [
    "任何人物与动物（包括海鸟、鱼群与搁浅的活物）",
    "船只、码头、栈桥、灯塔、渔网与任何人造物",
    "沙滩、棕榈与任何绿色植被",
    "蓝绿色清澈海水、白色浪花排浪与晴朗碧空",
    "海中的岛屿与对岸陆地",
    "火、烟与任何人工光源",
    "上下断崖的路或台阶",
    "雪、雨、雷电、暴风浪与夜景",
    "4.0.3 之后本区新增的任何地貌与据点",
]

