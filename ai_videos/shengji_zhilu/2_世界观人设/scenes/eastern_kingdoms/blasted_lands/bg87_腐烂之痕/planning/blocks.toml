# 世界树画面：大地上一道巨大的焦黑裂痕，坑底冒着绿色毒雾，恶魔的骨骸与烧融的岩块混在一起
# 区图：西南一片灰色盆地，西 / 南 / 东三面外环山，北面隔一道矮脊接西北山体；东北角山缝通红原西南角与主干道尽头（2026-09-24 人审改）
absent = [
    "任何人物、动物与活着的怪物（默认空场）",
    "建筑、营帐、祭坛、传送门、旗帜与任何人造物",
    "会发光的雾、裂缝、骨头与符文（雾是冷的，不发光）",
    "火、火星、流动的熔岩与冒烟的余烬（熔岩早已冷凝）",
    "草、灌木、树与任何活的植被",
    "河流、湖泊与积水",
    "红原那种铁锈红龟裂地（这里是焦黑与灰）",
    "雪、雨、雷电与夜景",
    "4.0.3 之后本区新增的任何地貌与据点",
]

