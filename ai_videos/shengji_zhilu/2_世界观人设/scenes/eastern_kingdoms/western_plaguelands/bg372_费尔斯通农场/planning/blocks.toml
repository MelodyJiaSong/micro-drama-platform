# 费尔斯通农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区图像素 (340, 340)，区图 1 px ≈ 3.92 m（同 bg369 terrain.toml）。区图上房屋图标在 (391, 364)，
# 点格篱笆斜长方田四角约 (375, 360) / (404, 391) / (369, 396) / (354, 381)，中间另有一道篱笆；主干道贴南缘，南路在 (415, 392) 分岔南下。
# 长屋 / 谷仓 / 大锅的相对摆位与尺寸是推定。锚点机位：田东南边的大路边 (215, 222)，朝正北。原点左上角，x 向东、y 向南，单位 m。

