# 壁炉谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg374"
name_zh = "壁炉谷"
size_m = [480, 320]
px_per_m = 3.2
scale_src = "地图量取"
scale_note = "从原版区图量取（1002×668 px，≈3.924 m/px）：场地左上角 ＝ 区图 px (380, 70)，城堡图标 px (410, 104)、西南建筑图标 (421, 124)、东北建筑图标 (472, 90)、环路椭圆约 35×52 px；街区内的逐栋布局、石阶与门楼无一手出处，推定"
# 世界树画面：北部山坳里一座还完整的人类城镇，红瓦白墙的联排房屋沿坡而上，镇顶是一座带塔楼的石堡，血色十字军的红白旗帜到处都是
# 区图：城堡在西、街巷在东；出城路从环路南端往东南出山坳，路旁孤塔在场地外东南约 300 m（区图 px (551, 152)）
absent = [
    "焦黑烧斑、塌顶房屋与任何废墟（全区唯一完好的城镇）",
    "淡绿瘟疫薄雾与病态灰橙死地",
    "外城墙与城门（镇子没有外城墙，只靠三面山墙围合）",
    "河流、湖泊与任何水面（只有广场一口井）",
    "鲜绿草地与茂密绿林",
    "火把、灯笼、火盆与冒烟的烟囱",
    "旗面上的纹章与任何文字招牌",
    "任何人物、马匹与巡逻（默认空镇）",
    "大灾变后新增的营地、据点与飞行点",
]

