# 悔恨岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级 terrain.toml 坐标 (1760, 1840)；岭顶陵墓 ≈ 本图 (300, 325) ≈ 区图大陵墓图标 [52, 82]。

[meta]
bg = "bg380"
name_zh = "悔恨岭"
size_m = [520, 420]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "墓坡范围、陵墓与两座小墓室图标、墓园小径（区图点线）、湖岸与废城南侧水道从原版区图（1002×668 px，≈3.92 m/px，同区级 terrain.toml 换算）量取；墓碑群范围、地穴、火盆等为推定"
# 世界树画面：一整片缓坡墓地，成百上千的歪斜墓碑排到山脊线，坡顶是一座独立的圆形石砌陵墓
absent = ["完好的教堂、村舍与有人照看的墓园", "刻着可读文字的碑文与任何画面文字", "发光的圣徽、光柱与任何神圣光效", "除陵墓前两只火盆之外的火、烛火与灯笼", "地穴门里透出的光", "亡灵、骷髅与任何人物动物（属 shot 层）", "鲜绿草地、鲜花与茂密绿林", "4.0.3a 后新加的营地、据点与飞行点", "飞行坐骑与任何空中交通", "训练假人"]

