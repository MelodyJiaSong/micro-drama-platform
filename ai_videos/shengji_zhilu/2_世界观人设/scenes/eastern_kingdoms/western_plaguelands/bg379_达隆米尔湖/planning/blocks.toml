# 达隆米尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级 terrain.toml 坐标 (2150, 1500)；湖心岛 ≈ 本图 (600, 410) ≈ 区图 [70, 73]。
# 画法：floor plan 的水只能画成宽折线，湖面按「自北向南六条横带」拼成面（每条带的东西端点按区图量取的岸线），
# 湖心岛用 bg378 的块压在上面——岛的细部几何只在 bg378 那份图里，这里不重复。

[meta]
bg = "bg379"
name_zh = "达隆米尔湖"
size_m = [1100, 800]
px_per_m = 1.4
grid_m = 100
scale_src = "地图量取"
scale_note = "湖身约 1000 × 650 m、河口与湖岸线从原版区图（1002×668 px，≈3.92 m/px，同区级 terrain.toml 换算）量取；近岸泥坎、树桩林、芦苇湾等为推定"
# 世界树画面：一片灰绿色的大湖，湖面浮着薄雾与枯木，湖心是一座立着废墟城堡的孤岛
absent = ["码头、栈桥、船只与任何水上交通", "沿湖道路与湖边房屋", "第二条入湖河流（北岸河口是唯一一处）", "风浪、白浪与瀑布", "完整屋顶的城堡与岛上透出的光", "火光、烛火、灯笼与任何人工光源", "幽灵、亡灵与任何人物动物（属 shot 层）", "鲜绿草地、茂密绿林与清澈蓝水", "4.0.3a 后新加的营地、据点与飞行点", "飞行坐骑与任何空中交通", "训练假人"]

