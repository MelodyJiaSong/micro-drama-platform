# 巨牙谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [46, 56] 落在本场地 (300, 200)；区图 1 px ≈ 2.27 m，裁切图（×3）1 px ≈ 0.76 m。
# 锚点机位约在 (40, 185)，贴谷底朝东（方位 ~90°）：左 北壁 + 其后的中央高塔岩尖顶，右 南壁，前方 东口。

[meta]
bg = "bg75"
name_zh = "巨牙谷"
size_m = [600, 400]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取：北壁（中央高塔岩南麓）与南壁（中南岩柱群）的轮廓按裁切图 ×3 换算，裁切图外（x<95 / x>505）的延伸为推定；高塔岩主峰按区级 terrain.toml 平移后裁到场地内；岩牙、沙舌、倒伏岩柱与沙垄的尺寸与摆位为推定"
# 世界树画面：两侧岩壁上竖着一排排尖锥状风蚀岩柱的窄谷，像张开的牙口，谷底常有沙流顺坡淌下
absent = [
    "任何水体（沙流是干沙，不是水）",
    "任何人造物、道路与营地",
    "绿色植物与草地（只有一丛焦黑枯灌木）",
    "火、营火与任何人工光源",
    "任何人物、动物、坐骑与飞禽",
    "平顶方台岩出现在谷内（方台岩只在东口外的远景）",
    "4.0.3a 后改动的新地貌",
]

