# 埃格蒙德的营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg67"
name_zh = "埃格蒙德的营地"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 360 × 300 m：装得下一条约 150 m 的半埋脊椎、它南侧的山嘴与东侧 80 m 外的南北小路（区级 terrain 量取）；骨架尺寸无一手出处，按「比圣者之陵那具更大」推定"
# 世界树画面：一具更巨大的兽骨半埋在红土里，脊椎像一道天然山脊横过荒原，骨下阴影里扎着几顶考古帐篷
# 区图：红十字落在南缘山链伸出的山嘴北脚下，北面敞开；东侧是「区心→南部的小路」，向南在山脚断头
absent = [
    "完整的肋骨拱廊（肋骨从根部断掉，那是圣者之陵的样子）",
    "任何人物与动物（默认空营）",
    "燃着的火与炊烟（火塘是冷余烬）",
    "木栅、寨墙与固定房屋",
    "河流、水潭与任何水面",
    "草地、树林与任何绿色植被",
    "文字、招牌与旗帜",
    "4.0.3a 后新增的挖掘场与营地地名",
]

[[ridge]]
name = "南缘山嘴（南墙山链伸出的赭色山嘴）"
