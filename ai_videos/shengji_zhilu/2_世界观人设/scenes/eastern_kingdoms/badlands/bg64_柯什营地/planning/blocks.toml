# 柯什营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg64"
name_zh = "柯什营地"
size_m = [260, 230]
px_per_m = 5.0
scale_src = "推定"
scale_note = "营地（木桩排约 50 m、五顶长帐两排）按规模推定；场地取营地 + 背后陡坡 + 坡下锚点机位（营地西南约 90 m，约 [80, 180]）与坡脚冲沟的 260 × 230 m。山坡朝向与小路来向取区图裁切，尺寸无一手出处"
grid_m = 50
# 世界树画面：东北岩坡上的食人魔营，帐篷用整张兽皮撑开，营外插着一排削尖的木桩
# 区图：北、东两面是东北大山块；区级 terrain「堡前→东北营地的小路」从西南来、止于营地；红十字南侧一道干冲沟
# 木桩排沿等高线走向（约东南 25°），缺口中心 [128, 134]；帐篷按「缺口 + 沿排 t m + 向坡上 d m」摆
absent = [
    "任何人物、食人魔与动物（默认空营）",
    "燃着的火与炊烟（火塘冷灰）",
    "封闭寨墙与木门（只有坡下缘一排斜插木桩，留一道缺口）",
    "冲沟里的水（全区无水）",
    "旗帜纹章与任何文字标识",
    "草地、树林",
    "4.0.3a 后的任何改动",
]

