# 苦痛堡垒 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg61"
name_zh = "苦痛堡垒"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "堡体 44 m 见方按区级图 b061（60 m 格）内收推定；场地取堡南 150 m 锚点机位能落进来的 240 × 240 m。背崖 / 西岩嘴 / 东侧台地山块的相对方位取区图（terrain.toml 北墙与造物者台地山块之间的凹口），尺寸无一手出处"
# 世界树画面：荒原北部一座方正的黑石堡，墙头架着短炮，城垛被烟熏黑，堡内火盆燃着暗红的火
# 区图：图标在红十字东南、北缘山链南麓；堡前西南来主道、堡东上坡道通北端台地、贴山脚向东小路通东北营地
absent = [
    "任何人物、守卫与坐骑（默认空堡）",
    "北门与后门（北墙顶在崖脚，只有南门）",
    "火把、灯笼、窗内灯光（唯一人工光源是南墙城头两只火盆）",
    "熔岩与岩浆（那是西邻的灼热峡谷）",
    "旗帜纹章与任何文字标识",
    "水体、草地、树林",
    "4.0.3a 后的任何改动",
]

