# 漫尘盆地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [29, 50] 落在本场地 (400, 300)；区图 1 px ≈ 2.27 m，裁切图（×4）1 px ≈ 0.57 m。
# 锚点机位约在 (380, 330)，朝东北（方位 45°）：左 北缘碎岩丘，正中 冲沟分叉，右 中央高塔岩。

[meta]
bg = "bg73"
name_zh = "漫尘盆地"
size_m = [800, 480]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取：西北与正北的山脚、东北向的 Y 形枯冲沟（区图 [30–36, 42–47]）按裁切图 ×4 换算；中央高塔岩取区级 terrain.toml 同一多边形平移；南沿营地按坐标表 [29, 55]。下陷深度、盆沿缓坡、枯树桩与孤石为推定"
# 世界树画面：一整片下陷的平底沙盆，地表龟裂成六边形土块，风把细尘卷成低矮的旋涡贴地跑
absent = [
    "任何水体（冲沟是干的，没有水洼、没有积水反光）",
    "任何人造建筑（南沿营地另立档，锚点机位背对它）",
    "绿色植物、草地与活树（只有焦黑枯树桩与干灌木团）",
    "刀削高崖紧贴盆边（北缘是低矮圆钝的碎岩丘）",
    "火堆、营火与炊烟",
    "任何人物、动物、坐骑与飞禽",
    "盐碱白壳平原（那是南部另一档）",
    "4.0.3a 后被犁毁改建的新地貌与新营地",
]

