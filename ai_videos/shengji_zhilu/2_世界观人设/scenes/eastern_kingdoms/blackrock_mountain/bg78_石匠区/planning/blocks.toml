# 石匠区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 布局：北缘 y 0–8 是熔岩大厅环道的一段；y 8–62、x 8–92 是凹进岩壁的作业场（北面敞口），西 / 东 / 南三面岩壁。
# 头顶岩檐无法在平面上表示：敞口处约 3 人高（~5 m），南墙下约 2 人多高（~4 m）。h_m 以作业场地面为 0。

[meta]
bg = "bg78"
name_zh = "石匠区"
size_m = [100, 70]
px_per_m = 14.0
scale_src = "推定"
scale_note = "1.12 无本区独立区图，世界树只给「山腹里的石工作业区」：场子 84 × 54 m 由区级平面图 bg76 的 b903（36 × 20 m 推定框）放宽到能装下南墙采石面、东墙立柱列与中部作业物件推定；方位（大厅东南、北面敞口朝大厅）随 b903"
# 世界树画面：山腹里的石工作业区，半成形的石砖与立柱靠墙排开，地面积着厚厚的石粉
absent = ["天光与天井（顶上是岩檐）", "熔岩明渠与炉口（场内没有熔岩，光只从敞口灌入）", "火把灯笼火盆烛火等人工光源", "后门与侧洞（唯一出入口是北面敞口）", "木结构脚手架与木屋", "水与积水", "任何植被", "完工的雕像与带纹饰的成品建筑构件", "人物与动物"]

