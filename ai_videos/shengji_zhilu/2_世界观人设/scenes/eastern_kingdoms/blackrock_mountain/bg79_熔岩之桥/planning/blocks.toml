# 熔岩之桥 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 布局与区级平面图 bg76 同一份几何（大厅中心 bg76 (481,340) ↔ 本图 (80,80)）：环道半径 48 m / 宽 8 m，熔岩井半径 44 m，
# 岩壁内缘是半径约 56 m 的八边形。h_m 以环道路面为基准的构件自身高度；石柱塔 h_m 自熔岩面起算。
# 本图只画平面：东北石门高出环道三四层楼、西南岩台与矿道口低于环道一层，高差写在各块 note 里。

[meta]
bg = "bg79"
name_zh = "熔岩之桥"
size_m = [160, 160]
px_per_m = 9.0
scale_src = "推定"
scale_note = "1.12 无本区独立区图；尺度沿用区级平面图 bg76（其本身是 1000×667 码的估计框）：环道半径 ~48 m、熔岩井 ~88 m 直径、石柱塔 16 m 见方 / 高 ~60 m 均为推定，只保证与 bg76 一致"
# 世界树画面：山腹正中的巨型环形大厅，一圈宽阔的石道贴着岩壁盘绕，中央悬空一座石塔，下方是翻滚的熔岩海
absent = ["水与积水（井里只有熔岩）", "任何植被", "日光直射与蓝天（只有火山口漏下的一线冷光）", "火把灯笼火盆烛火等人工光源", "环道内沿的栏杆与护墙", "吊桥与木栈道（过井只有铁链）", "飞行点与飞行坐骑", "人物与动物"]

