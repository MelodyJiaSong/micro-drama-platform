# 尘火谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ≈ 区级平面图 (1020, 200)；山墙轮廓按区级 terrain.toml 的北山墙 / 东山墙平移描摹（区级数据里主干道压在山墙多边形上，
# 本档把窄谷让开、使主干道落在两道山体之间，岩嘴与窄谷细部因此记推定）。
# 锚点机位：谷口低岩 b15（≈262,388），离地两人高，朝正北。

[meta]
bg = "bg242"
name_zh = "尘火谷"
size_m = [600, 420]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "谷的外廓与主干道按区级平面图（区图 px×2.0362 m）平移量取；谷内火点、巨石、干沟与遗留物位置全为推定"
# 世界树画面：常年扬尘的浅谷，风把红色细尘卷成低矮的旋涡，地上零散烧着几处自燃的火点
absent = [
    "任何建筑、营地、帐篷、哨塔与高炉（本谷是无人野外，聚落属 bg240 / bg243 / bg238）",
    "熔岩、熔渣与任何红亮的流体（那是大矿坑与西侧岩台）",
    "水、积水、河道与湿地（全区没有一滴水）",
    "树、草与任何绿色植被",
    "火把、篝火、灯笼、炉火与人工光源（唯一的火是地缝里膝高的自燃火苗）",
    "北面、西面的出入口（谷只向南敞口）",
    "蓝天、白云、雨雪",
    "飞行坐骑与任何 4.0.3a 之后的设施",
]

