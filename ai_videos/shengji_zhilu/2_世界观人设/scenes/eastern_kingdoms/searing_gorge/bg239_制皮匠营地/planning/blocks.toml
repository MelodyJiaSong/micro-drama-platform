# 制皮匠营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg239"
name_zh = "制皮匠营地"
size_m = [160, 130]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图无图标，区级块 b902 本身即推定（盆地西南缘崖脚）；营地只有披棚、火塘、三架皮架与四口木桶，按一处单户手艺营地取 160×130 m 把石窝与东北小径框进来，尺寸无一手出处"
# 世界树画面：岩壁下的小营地，木架上绷着正在鞣制的兽皮，地上几口浸皮的木桶，烟从小火堆里直直升起
absent = [
    "任何人物、动物（兽皮是剥好的皮张，不是动物）",
    "房屋、帐篷城、寨墙（只有一座贴岩壁的兽皮单坡披棚）",
    "火把、灯笼、烛火（唯一人工光源是火塘里一小簇煤火）",
    "熔岩与熔渣（最近的熔岩坑在营地北偏西约 90 m 外，不在本场地内）",
    "任何水体、树木、草与绿色（木桶里是褐色鞣液，不是水）",
    "西南与西两面的出入口（唯一出入口是东北口小径）",
    "4.0.3a 后的任何改动",
]

