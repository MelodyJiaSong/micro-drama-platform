# 煤渣挖掘场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg238"
name_zh = "煤渣挖掘场"
size_m = [220, 180]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级图 b901 为 160×120 m 的营地块；本图外扩到 220×180 m，把东南山墙与西北主干道一并框进来。大坑 60×40 m、下陷 8 m 与各件尺寸按卡内描述推定，无一手出处"
# 世界树画面：侏儒/哥布林式的露天挖掘营地，蒸汽机械与木制吊架，成堆的碎石与翻倒的矿车，空气里全是粉尘
# 区图：东侧主干道旁孤立营地图标（63.7%, 60.9%）；东南贴东山墙（东北→西南走向），西北擦主干道
absent = [
    "任何人物、动物（默认停工空营）",
    "围墙、寨门、正经房屋（只有废木锈铁工具棚）",
    "火、炉火、烛火、灯笼、熔岩光（锅炉与钻塔熄火冷透、不冒汽）",
    "熔渣与熔岩（本档局部没有）",
    "任何水体、植被与绿色",
    "东南山墙一侧的路（进出只有西北主干道）",
    "坑沿护栏（只有几根歪木桩）",
    "4.0.3a 后的任何改动",
]

