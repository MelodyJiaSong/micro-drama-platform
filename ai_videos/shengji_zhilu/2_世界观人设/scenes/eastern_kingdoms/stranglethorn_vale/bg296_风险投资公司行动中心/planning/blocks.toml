# 风险投资公司行动中心 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图无本处图标：点位推定在北半部雨林与丘陵交界的红岩坡上（待核）；坡下东南远望湖面（湖在场地外）。
# 布局按世界树画面（铁皮屋 / 高架吊臂 / 蒸汽阀喷白雾）推定：北背山坡，上台地 y≈64–150，下台地 y≈150–272。

[meta]
bg = "bg296"
name_zh = "风险投资公司行动中心"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；世界树称『比营地更大』，按 bg295（260 × 230 m）放大、两级台地 + 背坡推定 360 × 300 m"
# 世界树画面：比营地更大的哥布林作业区，铁皮屋与高架吊臂，蒸汽阀不时喷出白雾
absent = [
    "火光、火把、灯笼与冒黑烟的烟囱（锅炉炉门紧闭）",
    "任何人物与动物（默认空场）",
    "黄漆木板棚与蒸汽锯木机（那是 bg295 营地的形制）",
    "码头与船（场地不临水，湖只在远景）",
    "飞行器、载具与现代机械",
    "招牌、标语与任何文字",
    "正在下的雨",
]

