# 米扎废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg286"
name_zh = "米扎废墟"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "遗址 120 × 100 m 无一手尺寸；wiki 只给「格罗姆高营地东南」，点位按区级平面图推定在北部河下游北岸、入海口以东约 150 m 的低洼地（旧世区图约 [35, 32]）。河段方位取区图，其余布局按世界树画面推定"
# 世界树画面：半没入沼泥的巨魔遗迹，断墙外露青砖，水面浮着落叶与残破的编织席
absent = [
    "台地、石阶与坡（全场平洼，高差只在半米上下）",
    "路与围墙（只有一条踩出的泥径）",
    "任何人物、巨魔、鳄鱼水蛇等动物",
    "火盆、火把与任何人工光源",
    "海面（入海口在西南，被红树挡住）",
    "4.0.3a 后的任何改动",
]

