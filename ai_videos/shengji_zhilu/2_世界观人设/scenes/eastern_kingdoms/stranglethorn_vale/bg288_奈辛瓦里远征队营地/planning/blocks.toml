# 奈辛瓦里远征队营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg288"
name_zh = "奈辛瓦里远征队营地"
size_m = [180, 150]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图无图标；按旧世常用坐标约 [35.6, 10.8] 落在北部河上游西南岸、离河中线约 45 m（区级 terrain.toml 河道折线量得）。营地是三顶帐一堆火的小营，空地按 80 × 60 m 推定，场地再装下北侧河滩机位与三面林墙"
# 世界树画面：林间空地上的猎人营，帆布帐与晾兽皮的木架，地上摊着虎皮与豹皮，篝火边靠着长枪
absent = [
    "任何人物与活的动物（兽皮、兽头骨只是器物）",
    "燃着的篝火与炊烟（篝火是冷灰余烬）",
    "木栅、寨墙、大门与瞭望塔（开放营地，那是北面叛军木寨的形制）",
    "石造建筑与废墟",
    "旗帜、纹章、告示牌与任何文字",
    "桥（河上没有桥，营地不跨河）",
    "4.0.3a 后的任何改动",
]

