# 蛮荒海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (600, 200) m（区图约 [10, 5]），取西北岸线从界山脚到暗礁海湾北岸这一段（wiki：本子区域是北部海岸，从西界一路到暗礁海东岸的营地）。
# 海面行直接取区级 terrain.toml 的扫描行（小岛与礁湾小岛自然留白）；界山与海岸丘陵由区级 terrain.toml 平移裁切。
# 沙滩上的破船板、空蟹壳、礁石与椰林按世界树画面推定。

[meta]
bg = "bg301"
name_zh = "蛮荒海岸"
size_m = [1000, 800]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 WorldMapArea 换算（x% × 58.35 m、y% × 38.9 m，与 bg278 区级平面图同一口径）；本场地取区图 [10–27, 5–26] 这一段岸线，1000 × 800 m"
# 世界树画面：荆棘谷西侧的白沙海岸线，椰树斜倚，浪拍礁石，沙上散着破船板与巨型蟹壳
absent = [
    "码头、栈桥、灯塔与任何成形的港口",
    "营地、帐篷与燃着的火堆（岸上没有人住）",
    "任何人物与动物（蟹只剩空壳）",
    "石砌城墙与城镇",
    "被海啸冲毁的海岸线（1.12 岸线完好）",
    "4.0.3 拆分后的北荆棘谷新地名与新营地",
    "暴风浪、夜景与雪",
    "发光的海水或任何神秘光",
]

