# 赞塔加废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标：按「依山而建」推定在中南部、斗兽场以东的东部山墙西麓（待核）。石台面朝西、逐级向东抬高。
# 四级石台做成互不重叠的南北向条带（x 60–214），中轴大阶梯画成 road（y≈130）；悬空断阶是第四级之后的独立块。

[meta]
bg = "bg298"
name_zh = "赞塔加废墟"
size_m = [280, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；按世界树『依山而建的多层石台、阶梯直通半空断口』推定四级石台共宽约 150 m、最上一级高出坡脚约 19 m，外带两翼侧坡与断口下山沟成 280 × 260 m"
# 世界树画面：依山而建的多层巨魔石台，阶梯直通半空断口，台面刻满褪色的血红纹样
absent = [
    "燃着的火盆、火把与烟（石火盆里只有积水落叶）",
    "任何人物与动物（荒废无人）",
    "完好的上层殿堂（早已塌进山沟，只剩悬空断阶）",
    "鲜红的新涂颜料与发光纹样（纹样已褪成锈红）",
    "帐篷、木栅与营地设施",
    "水面与海（本处是山嘴，不临水）",
    "正在下的雨",
]

