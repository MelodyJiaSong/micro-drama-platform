# 祖丹亚废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 落点：wiki 坐标 [21, 14]（西北部西海岸；世界树「南部海岬」一句与此矛盾，见主体卡场景定位）。
# 场地原点 ＝ 区级平面图 (1000, 420) m；岸线取区级 terrain.toml 的海面行（y=475/525/575/625/675）内插，每 20 m 一行铺海。
# 石台 / 断柱 / 塌屋 / 草棚的布局无一手出处，按世界树画面（石阶从海水里升起，断柱正对落日，浪花拍打基座）推定。

[meta]
bg = "bg299"
name_zh = "祖丹亚废墟"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图无废墟图标与一手尺寸；岸线与背后矮丘按区级平面图量取，废城本体（主台约 56 × 48 m）按『一座三层石台 + 两片塌屋 + 两座草棚』推定，场地取 320 × 300 m"
# 世界树画面：南部海岬上的巨魔废城，石阶从海水里升起，断柱正对落日，浪花拍打基座
absent = [
    "燃着的火盆、火把、灯笼与烟（默认态火盆是冷灰余烬）",
    "任何人物与动物（默认空场）",
    "码头、栈桥与停泊的船（海路没有任何设施）",
    "完整的屋顶与完好的神庙（石屋只剩墙根）",
    "寨墙、木栅与塔楼",
    "海港城与桅杆（南端海湾离这里两公里以上，看不到）",
    "正在下的雨、暴风浪与夜景",
    "绿焰或任何发光的神秘火",
    "4.0.3 拆分后的南北两区布局与切开半岛的漩涡",
]

