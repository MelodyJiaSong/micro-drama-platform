# 荆棘谷海角 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1300, 2150) m（区图约 [22, 55]），覆盖半岛南段到外海孤岛；海面行直接取区级 terrain.toml 的扫描行（每 50 m 一行，岛屿自然留白）。
# 山岭 / 窄水道 / 海港湾 / 大道由区级 terrain.toml 平移过来；海港城、营地、孤岛小塔等块的方位按区图与世界树推定。

[meta]
bg = "bg300"
name_zh = "荆棘谷海角"
size_m = [1200, 1250]
px_per_m = 1.2
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 WorldMapArea 换算（x% × 58.35 m、y% × 38.9 m，与 bg278 区级平面图同一口径）；本场地取区图 [22–43, 55–87] 这一块，1200 × 1250 m"
# 世界树画面：荆棘谷最南端的狭长海岬，雨林退成灌木与礁岩，海风把椰树吹得一边倒，远处是藏宝海湾的木栈桥
absent = [
    "切开半岛与北部雨林的海峡或漩涡（4.0.3 才有，1.12 半岛与北边连成一片）",
    "独立地图的边界线与南北两区的分界",
    "被海啸冲毁的海岸与被淹的港口（旧世海湾与栈桥完好）",
    "亮着的灯笼与港湾灯火（默认态白天，灯笼不点）",
    "任何人物、动物、坐骑与帆船上的水手",
    "飞艇、飞行坐骑与训练假人",
    "石砌大城、城墙与雪",
    "茂密到遮天的雨林（半岛南段雨林已退成灌木与稀疏椰林）",
]

