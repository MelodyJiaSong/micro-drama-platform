# 风险投资公司营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图无本营图标：点位按「伐木靠水运」推定在北部河沿岸林地（待核）。河在北，南口入林。
# 营内布局无一手出处，全部按世界树画面（黄漆木棚 / 蒸汽机械 / 成堆原木 / 锯末油污红土）推定。

[meta]
bg = "bg295"
name_zh = "风险投资公司营地"
size_m = [260, 230]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；按『一座锯木棚、一座锅炉、三座木棚、三垛原木』的伐木工地推定空地约 180 × 150 m，外带河岸与林缘成 260 × 230 m"
# 世界树画面：被推平的林地上搭起的哥布林工地，黄漆木棚、蒸汽机械与成堆原木，锯末与油污混在红土里
absent = [
    "运转中的机器、冒烟的烟囱与蒸汽（默认态停工、锅炉冷透）",
    "火堆、火把、灯笼等任何人工光源",
    "任何人物与动物（默认空场）",
    "高架吊臂、塔架与铁皮大屋（那是 bg296 行动中心的形制）",
    "码头、船与栈桥（水路只有一条原木滑道）",
    "寨墙与瞭望塔（四周只有林墙）",
    "招牌、标语与任何文字",
    "正在下的雨",
]

