# 约亚姆巴岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b904（区图约 15%, 16%，地图量取）：西北外海小岛，东隔海峡是雨林海岸。区级 b904 的 110 × 90 m ＝ 营地块；本图画整座岛。
# 岛上布局按世界树画面（岸边几顶蓝金帐篷 / 沙滩刻花木桩 / 海水清澈）推定。四周海面按 10 m 一行铺水带。

[meta]
bg = "bg297"
name_zh = "约亚姆巴岛"
size_m = [320, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上小岛图标约 30 × 25 px（≈ 1 px 5.8 m，折 170–200 m）；岛身取 190 × 140 m、四周留海成 320 × 260 m，与区级 b904（营地块 110 × 90 m）不冲突"
# 世界树画面：西岸外的小岛，岸边几顶赞达拉巨魔的蓝金色帐篷，沙滩上插着刻花木桩，海水清澈见底
absent = [
    "燃着的火盆、火把、灯笼与烟（默认态火盆是冷灰）",
    "任何人物与动物（默认空场）",
    "栈桥、码头与停泊的帆船（登岛只靠涉水）",
    "寨墙、木栅与石造建筑（只有布帐与木桩）",
    "旗帜纹章与任何文字",
    "浑浊的海水、暴风浪与正在下的雨",
    "大灾变后的改动与后续版本的新建筑",
]

