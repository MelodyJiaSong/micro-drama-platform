# 朱布瓦尔废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图海角无废墟图标：方位整体推定——取海角脊梁东坡直接入海的那一段（区级坐标约 2150, 2700 m）。
# 本场地 ＝ 区级坐标 − (1990, 2600)。岸线按 bg278 terrain.toml 的海面行（y=2575…2775 的东段起点）平移过来；
# 脊梁坡脚比区图山纹线往西收了 20–30 m，给坡脚乱石滩留出位置。遗迹本体全部推定。

[meta]
bg = "bg291"
name_zh = "朱布瓦尔废墟"
size_m = [260, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "世界树与区图都没有点位与尺寸；按『礁岩上的小片遗迹』取三级台基约 18 m、礁岬约 44 m，场地收进身后坡脚与岬外浅海"
# 世界树画面：礁岩上的小片巨魔遗迹，石柱斜插入海，浪打上来会没过最低一级台阶
absent = [
    "任何屋子、茅棚与屋顶（本档只有台基、门框与断柱）",
    "任何人物、动物与海鸟（默认空场）",
    "船、帆、栈桥与码头（崖缝海港城在西南约 700 m 外，被脊梁挡住）",
    "海上的岛（东面是开阔外海）",
    "火、火盆、火把与烟",
    "白色盐霜铺满台阶的浅水断墙（那是东北沿岸另一处遗迹的样子）",
    "文字、旗帜与纹章",
    "4.0.3 拆分后的独立海角地图与后加的营地",
]

