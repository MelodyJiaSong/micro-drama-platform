# 亚戈瓦萨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b917（区坐标 1623, 920，推定：河源大湖西南角的拱门图标）；原点 ＝ 区坐标 (1473, 770)。
# 山坡 / 湖 / 大路从 bg317 terrain.toml 平移换算（地图量取）；遗址内每一块都是推定（原典只给「断柱、矮台、藤蔓、碎陶、骨堆」）。

[meta]
bg = "bg324"
name_zh = "亚戈瓦萨"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.513 m（bg317 terrain.toml）；场地 300 m 见方把背后山坡、湖西南岸与大路北端都框进来；遗址本体约 60 m 见方，其尺寸为推定"
# 世界树画面：密林间的小型巨魔石砌遗迹，断柱与矮台被藤蔓吞没，地上散着碎陶与骨堆
absent = [
  "帐篷 / 木栅 / 旗帜 / 营火（这里是无人遗迹，不是营地）",
  "研究站 / 考古营地 / 脚手架（西利瓦萨研究站那类改建是 4.0.3a 之后，且不在本点）",
  "高墙 / 塔楼 / 多层石城（阶梯石城是东南的辛萨罗，不是这里）",
  "亮着的火盆 / 火把 / 灯笼 / 任何人工光源",
  "河流（东流河从湖东头出，不经过遗址）",
  "雪 / 冰 / 沙漠 / 熔岩 / 瘟疫化枯林",
  "人物、野兽、鸟等任何活物（属 shot 层）",
]

