# 禁忌之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区坐标 (2700, 1000)（bg317 terrain.toml，区图 1 px ≈ 3.513 m）。海崖边线、河口、离岸小礁岛从区图平移换算；
# 崖脚礁带宽度、礁群与暗礁线是推定。场地南界停在恶齿村（bg322）以北，渔村不入本档。

[meta]
bg = "bg325"
name_zh = "禁忌之海"
size_m = [1000, 700]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.513 m（bg317 terrain.toml）；取东海岸山脊临海一线到外海 1 km 宽、河口以南 700 m 一段；崖高取区级卡「高出海面五六十米」"
# 世界树画面：望海崖之外的开阔外海，灰蓝海面一直延伸到雾线，近岸有黑色礁石与浪花
absent = [
  "船只 / 帆 / 独木舟 / 码头 / 栈桥 / 灯塔（海上与本段海岸一概没有；渔村的栈桥属 bg322）",
  "海岸上的任何建筑（恶齿村在场地西南角以外）",
  "沙滩（崖根只有卵石与黑礁窄带）",
  "热带碧海 / 白沙 / 棕榈（这是北方温带冷海）",
  "冰山 / 浮冰 / 雪",
  "被淹没的遗迹 / 沉船残骸",
  "火 / 灯 / 任何人工光源",
  "海怪、鲸、海鸟等任何动物（属 shot 层）",
]

