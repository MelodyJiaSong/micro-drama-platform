# 恶齿村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 大格局（西崖 · 窄滩 · 东海）从区图裁切量取：区图 1 px ≈ 3.5 m，村点 [78, 79] 到海岸线约 25–30 px；
# 村内每一座屋的位置都是推定（原典只给「吊脚屋架在礁岩与浅水上、渔网鱼干面具、临海木台」）。

[meta]
bg = "bg322"
name_zh = "恶齿村"
size_m = [260, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：崖脚到海岸线约 100 m 窄滩（区图 1 px ≈ 3.513 m，见 bg317 terrain.toml）；场地取 260 m 见方把崖、滩、近海都框进来"
# 世界树画面：东南海岸线上的森林巨魔渔村，吊脚木屋架在礁岩与浅水之上，挂着渔网、鱼干与彩绘面具
absent = [
  "石砌码头 / 港口 / 帆船 / 大船（海上只有一条窄木栈桥与独木舟）",
  "石砌房屋 / 城墙 / 塔楼（全村是木桩茅草屋）",
  "村后的平地、农田、麦田（崖与海之间只有一条窄滩）",
  "亮着的火堆 / 火把 / 灯笼（默认态火塘是冷灰余烬）",
  "4.0.3a 后恶齿部族占据辛萨罗的旗帜与营帐（本档只有海边这一个村）",
  "雪 / 冰 / 沙漠 / 熔岩",
  "人物、双足飞龙、海鸟等任何动物（属 shot 层）",
]

