# 沙德拉洛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区级平面图 b918（区坐标 1229.5, 1714.3，推定）；原点 ＝ 区坐标 (1030, 1515)。
# 南山墙凹口的三面山脚与盆地北小湖从 bg317 terrain.toml 平移换算（地图量取）；
# 区图上这块绿地里有两处拱门图标（小湖东、盆地西南）——遗址内每一块都是推定（原典只给「环形石台、池上石桥、四角蛛形雕像、蛛网」）。

[meta]
bg = "bg330"
name_zh = "沙德拉洛"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.513 m（bg317 terrain.toml）；场地 400 m 见方框进南山墙凹口的整块盆地、北侧小湖与进来的小路；环形石台约 56 m 直径，为推定"
# 世界树画面：林中一处环形巨魔石台遗址，中央水面上架着石桥，四角立着蛛形雕像，地面结着大片蛛网
absent = [
  "活的蜘蛛 / 任何虫兽与人物（属 shot 层；本档只有蛛形石雕与蛛网）",
  "帐篷 / 木栅 / 营火 / 旗帜（这里是无人遗迹）",
  "亮着的火盆 / 火把 / 灯笼 / 发光符文 / 任何人工光源",
  "发光的池水 / 毒液绿光（中央池是普通的暗色静水）",
  "高墙 / 塔楼 / 阶梯石山（阶梯石城在东边的辛萨罗）",
  "穿过盆地的大路与河流（只有北口一条小路进来）",
  "雪 / 冰 / 沙漠 / 熔岩 / 瘟疫化枯林",
  "研究站 / 考古营地 / 脚手架（4.0.3a 之后的改建类元素）",
]

