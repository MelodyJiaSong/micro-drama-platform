# 望海崖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 大格局（西林 · 崖 · 东海）取自区级平面图 b915（崖面 110×300 m、崖高约 60 m）与东海岸山脊 [[ridge]]；
# 崖沿岩台、枯树、风倒木、落石滩、礁岛的具体位置都是推定。场地南缘再往南约 150 m 是海边渔村（bg322），不在本图内。

[meta]
bg = "bg334"
name_zh = "望海崖"
size_m = [480, 480]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区级平面图 b915：临海崖面约 110×300 m、崖高约 60 m（区图 1 px ≈ 3.513 m）；场地取 480 m 见方，把崖顶林沿、崖脚乱滩与近岸礁岛都框进来"
# 世界树画面：东南临海的高崖带，崖顶还是密林、崖下是拍岸白浪，断崖处可俯瞰整条海岸线
absent = [
  "任何建筑、栏杆、台阶、观景台、灯塔（崖顶只有林子与一条兽径）",
  "港口 / 石砌码头 / 帆船 / 大船",
  "沙滩浴场式的宽沙滩（崖脚只有几米宽的落石乱滩）",
  "海啸冲毁、坍塌成滩的海岸（1.12 崖线完好）",
  "雪 / 冰 / 沙漠 / 熔岩",
  "亮着的火堆 / 火把 / 灯笼 / 任何人工光源",
  "人物、海鸟、海兽等任何动物（属 shot 层）",
]

