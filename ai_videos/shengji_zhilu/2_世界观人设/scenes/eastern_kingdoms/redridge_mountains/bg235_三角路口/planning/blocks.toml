# 三角路口 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：场地原点 ＝ 区级平面图 bg222 的 (60, 800) m；三条路、西墙南端、南墙西端全部从 bg222/planning/terrain.toml 平移过来（区图量取 ±20 m）。
# 丫字分岔点 ＝ 区级 (198, 927)，场地 (138, 127)；湖边大道分岔 ＝ 区级 (347, 927)，场地 (287, 127)。

[meta]
bg = "bg235"
name_zh = "三角路口"
size_m = [420, 380]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "路网与山脚线由区级 terrain.toml（原版区图量取）平移裁切；跨河木桥、小河、林缘、哨位空地与机位小丘为推定"
# 世界树画面：西南角的三岔路口，一根木路牌立在中间；三条路分别没入艾尔文的暖金林、暮色的紫黑林与赤脊的红岩——一个机位能同时看到三种色调
absent = [
  "哨塔 / 瞭望塔 / 路障 / 拒马（4.0.3 才建；旧世路口空旷）",
  "围墙 / 帐篷 / 营火 / 驻防营地（旧世只有一名卫兵来回走）",
  "路牌上的任何文字 / 招牌 / 旗帜纹章",
  "火把 / 灯笼 / 篝火 / 任何人工光源",
  "修好的石桥（区界是低矮木桥）",
  "湖面 / 大片水域（湖在路口东北约三百米外，不入画）",
  "夜景 / 雨 / 浓雾",
  "任何人物 / 动物 / 车马",
]

