# 赤脊峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 整张图是推定：区图西北山群内部只画峰群、无路无名；按世界树画面推一段「主谷 → 谷心 → 西支 / 北支」的典型峡谷。

[meta]
bg = "bg228"
name_zh = "赤脊峡谷"
size_m = [800, 600]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "区图西北山群（区级 x≈60–715 m、y≈66–530 m）内部无坐标无路；谷宽 30–50 m、壁高 80–100 m、孤柱 55 m 均按世界树「垂直崖壁 + 谷底极深、只有正午进光」推定"
# 世界树画面：西北的红岩峡谷群，垂直崖壁一层层像被刀切过，谷底阴影极深、只有正午才进光
absent = [
  "水体 / 溪流 / 瀑布（谷底干透）",
  "人工道路 / 桥 / 建筑 / 栅栏 / 帐篷",
  "峡谷巨人及其骨骸（4.0.3 之后才加）",
  "湖面与湖岸（在东南谷口外的盆地里，本图看不到）",
  "燃着的火堆 / 火把 / 任何人工光源（火坑早已冷透）",
  "雪 / 雨 / 夜景",
  "任何人物 / 动物 / 文字",
]

[[ridge]]
name = "西北台地山块"
poly = [[0, 0], [358, 0], [365, 120], [330, 260], [200, 320], [0, 330]]
height_m = 90
src = "推定"

