# 石堡瀑布 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1300, 660) m。潭心取区级 terrain.toml「石堡瀑布潭」中点 (1489, 788) → 本图 (189, 128)；
# 石堡要塞在本图西北界外约 (-69, 55)，只从潭边仰望得见崖顶一角。

[meta]
bg = "bg234"
name_zh = "石堡瀑布"
size_m = [400, 320]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "潭径约 110 m 与出水河道取区级 terrain.toml（区图量取，精度约 ±20 m）；瀑布落差约 35 m、水帘宽约 40 m、环崖高度为推定"
# 世界树画面：从石堡下方的红岩断崖整幅跌落的大瀑布，水汽在崖壁前结成一条常驻的白雾带，逆光时会出彩虹
