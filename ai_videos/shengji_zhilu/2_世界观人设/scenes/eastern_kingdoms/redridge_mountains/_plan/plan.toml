# 赤脊山区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 25 件；成片的块用单体 + count 散布。blend 里材质会剥掉，所以按「形状」复用：
#   碎石堆兼骨堆 / 锯末堆，叉木架兼晾皮架 / 兵器架 / 锯架，栈道兼原木滑槽，高架平台兼望台，原木民居兼高脚屋。
# judgment calls：瀑布水帘走 proxy（竖直薄板正是 previz 要的遮挡体）、崖前雾带走 plaza（只标占地、不挡视线）；
#   平顶巨岩（撕裂者之石）走 rock_shelf（水平层状平顶岩台）；塔门三级石阶走 plaza（stair 是旋梯）；
#   bg222 的 h_m=0 子区域标记块一律走地坪 / 水面（asset 单件在 h_m=0 时会取 min(size) 当高度）。

