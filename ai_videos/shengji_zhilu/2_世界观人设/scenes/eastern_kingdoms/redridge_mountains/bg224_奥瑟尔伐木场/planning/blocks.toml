bg = "bg224"
name_zh = "奥瑟尔伐木场"
size_m = [400, 320]
px_per_m = 4.0
grid_m = 50
scale_src = "坐标表"
scale_note = "区 WorldMapArea 1985 × 1324 m × 区图裁切 18%；锯木图标、土路与两道崖坡地图量取，单件（锯木棚 / 原木垛 / 树桩地）体量推定"
# 世界树画面：湖东北的废弃伐木场，锯木架歪斜、原木散落发黑；黑石兽人在这里搭了大片木笼，笼里全是座狼
absent = [
    "座狼木笼 / 铁链笼门 / 啃碎的骨头（区地理页把笼舍节点标为 cata_plus，本档不画）",
    "水车 / 水力锯 / 蒸汽机械（旧世是人力长锯与木马架）",
    "寨墙 / 塔楼 / 旗帜（废弃的场子，无人设防）",
    "可见的火苗 / 营火 / 火把 / 灯笼（白天户外，零人工光源）",
    "林火 / 焦黑树桩 / 烧毁的棚子（原木发黑是雨水霉斑沤的，不是烧的）",
    "雪 / 秋色落叶",
    "任何人物 / 动物 / 文字 / 路牌字样",
]

