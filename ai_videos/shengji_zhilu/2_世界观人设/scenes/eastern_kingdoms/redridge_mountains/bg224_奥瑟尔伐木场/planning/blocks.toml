# 奥瑟尔伐木场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref/bg224_奥瑟尔伐木场_map_crop.png 1 px ≈ 0.66 m（裁切 18% 区宽 ＝ 357 m / 543 px）；坐标点 [51.6, 41.2] 落在 (240, 120)。
# 场地原点 ＝ 区坐标 (784, 425) m。锯木图标在坐标点西南约 100 m（裁切图 (135, 250)）；点线土路、两道湖北岸崖坡、北山按裁切图量取；湖岸在裁切图下缘外约 10 m，按原版区图量取。
# 锚点机位：北侧点线土路上 (200, 118)，朝正南穿过豁口望湖。坐标原点在场地左上角，x 向东、y 向南，单位 m。

