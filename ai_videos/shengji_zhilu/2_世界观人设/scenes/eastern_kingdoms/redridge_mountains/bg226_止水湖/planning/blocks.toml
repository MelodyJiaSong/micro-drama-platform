# 止水湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：原版区图 1 px ≈ 1.98 m（区 1985 × 1324 m / 1002 × 668 px）；场地原点 ＝ 区坐标 (540, 540) m，只框主湖段（湖口木桥以东、东尾出水口以西）。
# 湖岸轮廓、北岸崖坡、东岸台地西缘、北路与湖边大道按区图量取（与 bg222 terrain.toml 同一套数）；湖心三岛、窝棚组、树丛与滚石推定。
# 锚点机位：主湖西半南岸的卵石浅滩 (200, 338)，朝东北（约 45°）望湖；窝棚在右前方岸上、芦苇在左前方水边。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg226"
name_zh = "止水湖"
size_m = [640, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区 WorldMapArea 1985 × 1324 m × 原版区图量取：主湖东西约 550 m、南北约 350 m，南岸南湾鼓出约 60 m；湖心岛、窝棚与树丛体量推定"
# 世界树画面：群山围出的深蓝大湖，水面静到能整块映出红岩崖壁；浅滩边有鱼人搭的粗木窝棚，湖心有几座小岛
absent = [
    "修好的完整湖口木桥（旧世桥一直架着脚手架、修不完）",
    "湖面上的船只 / 帆 / 码头货栈（湖上空着，镇边空船属 bg223）",
    "亮着的火堆 / 烟柱 / 火把 / 灯笼（白天户外零人工光源，窝棚火坑是冷灰余烬）",
    "湖心岛上的建筑 / 灯塔 / 石桥（岛上只有树与石头）",
    "北岸沿水的步道或栈道（崖脚直接入水）",
    "风浪 / 白浪 / 急流（湖面无风如镜，只有东头出水口有缓流）",
    "冰面 / 雪 / 秋色落叶",
    "任何人物 / 动物 / 鱼 / 文字 / 路牌字样",
]

