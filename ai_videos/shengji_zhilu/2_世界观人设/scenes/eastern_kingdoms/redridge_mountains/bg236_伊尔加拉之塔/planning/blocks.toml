# 伊尔加拉之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：场地原点 ＝ 区级平面图 bg222 的 (1340, 490) m；塔 ＝ 坐标 [79.7, 49.3] → 区级 (1582, 653) → 场地 (242, 163)。
# 东墙坡脚线、东北断头路、谷中小径、瀑布潭从 bg222/planning/terrain.toml 平移过来（区图量取 ±20 m）。
# 区图上的塔图标画在坐标西侧约一百米、土径另一边；本图以坐标为准。

[meta]
bg = "bg236"
name_zh = "伊尔加拉之塔"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "塔位取坐标表，山墙坡脚与土径由区级 terrain.toml 平移裁切；塔身直径约 12 m、高约 30 m，窝棚、火坑、林块与滚石为推定"
# 世界树画面：孤立的法师塔，外墙上挂着一串串龙骨；顶层一张炼金台，台面摆着人类与巨龙的头骨，烛光冷白
absent = [
  "其他石造建筑 / 围墙 / 村舍（独塔，塔周只有兽皮窝棚）",
  "燃着的火坑 / 篝火 / 火把 / 灯笼（火坑冷灰；顶层窗内一点冷白烛光是唯一人工光源）",
  "外溢的法术光 / 光柱 / 符文 / 浮空物",
  "大魔导师那条线的营地、雕像或后加建筑（旧世没有）",
  "通往邻区的东侧山口（4.0.3 才开；土径在南面断头）",
  "湖面（瀑布潭在场地西南角，不入锚点画面）",
  "夜景 / 雨 / 浓雾",
  "任何人物 / 动物 / 文字 / 旗帜纹章",
]

