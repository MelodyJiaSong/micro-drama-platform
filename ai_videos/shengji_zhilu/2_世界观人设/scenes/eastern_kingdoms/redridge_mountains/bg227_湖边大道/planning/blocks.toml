# 湖边大道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图 bg222 的 (630, 800) m；路 / 湖 / 南墙三条线由区级 terrain.toml 平移而来。

[meta]
bg = "bg227"
name_zh = "湖边大道"
size_m = [480, 320]
px_per_m = 3.2
scale_src = "地图量取"
scale_note = "取区级 terrain.toml「湖边大道」x≈630–1110 m 一段（区图 x≈32–56%），长约 450 m；路—湖岸距离、南墙坡脚按区图量取（±20 m）"
# 世界树画面：沿湖铺开的土石主路，一侧是水一侧是红岩坡，路面被车辙压出两道深沟
absent = [
  "桥 / 分岔路口 / 路牌 / 界碑刻字（这一段不分岔、无桥、无字）",
  "铺石路面 / 石砌路缘（旧世是土石车辙路）",
  "农舍 / 栅栏 / 任何建筑（沿途无人居）",
  "路向东越过石堡继续延伸（旧世东侧山口未开，路到石堡为止）",
  "积水 / 雨 / 雪 / 夜景",
  "火堆 / 灯笼 / 任何人工光源",
  "任何人物 / 动物 / 车马 / 船只 / 文字",
]

