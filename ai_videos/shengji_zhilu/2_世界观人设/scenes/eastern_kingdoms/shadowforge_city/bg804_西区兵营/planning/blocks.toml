# 西区兵营 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（西区兵营＝城西南、制造厂正南那块带石阶符号的厅）与 bg246 块 b915 / b917 / 道路「西区兵营→制造厂隧道」。
# 北→南：北口隧道（往制造厂）· 上层营堂平台（高 6 m）· 两段宽石阶（铁甲武士像夹守）· 下庭石场 · 东南角石道 · 进城巨门背面。
# h_m 一律自下庭地面量起（平台上的栏杆 / 火盆 / 通铺 / 兵器架 ＝ 6 m + 自身高）。
# 本场地没有熔岩：光只来自四只压着炭火的铁火盆。陈设与尺寸无一手出处，推定。

[meta]
bg = "bg804"
name_zh = "西区兵营"
size_m = [100, 90]
px_per_m = 12.0
scale_src = "推定"
scale_note = "1.12 副本无区图；bg246 块 b915（40×33 m）只量到营堂外廓，巨门 b917 在其东南约 40 m（推定）；平台高 6 m、巨门高 14 m 与各陈设尺寸推定"
# 世界树画面：与东侧对称的黑石兵营，列队的矮人士兵与铁甲雕像守在石阶上，暗红火光照着粗粝的黑铁栏杆。
absent = ["天空、日光、月光与任何天气（山腹岩厅）", "熔岩与熔岩沟（本厅不临熔岩）", "射击孔与临空俯瞰大道的岩廊（那是东区兵营）", "木栅、帐篷、布幔与旗帜", "打开的进城巨门（默认紧闭，门闩在城内一侧）", "明亮的橙黄火焰、壁灯与冷色光源", "树木草地与任何植被、真正的水", "列队守军、守将、人物与动物（空营态，属 shot 层）", "文字、铭牌与纹章"]

