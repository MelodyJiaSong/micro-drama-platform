# 工艺之厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 方位：只在下层区图 WorldMap-BlackrockDepths.jpg 东北角（紫色十字块）；上层接城心东通道的位置按 bg246 块 b906 推定。
# 回旋梯一圈约升 24 m，平面上四段各记一个 h_m（＝该段梯面标高），实际盘旋约三圈，平面只画外圈一周。

[meta]
bg = "bg795"
name_zh = "工艺之厅"
size_m = [70, 70]
px_per_m = 16.0
scale_src = "推定"
scale_note = "1.12 副本无区图；方井外廓 36×36 m、井深约 24 m 按下层区图十字块形状与 bg246 块 b906（45×40 m）推定"
# 世界树画面：一座方形回旋大石梯从下方铁砧平台盘旋而上，梯道两侧是雕到一半的泥石魔像与工匠的凿具。
absent = ["天空、天井透光、日光与月光（山腹竖井）", "熔岩湖与熔岩沟（井里没有）", "任何植被与水面", "电弧蓝光与冷色光源", "完工的、能动的或发光的魔像", "升降机、绞盘吊篮等机械（只有石梯）", "人物、工匠与动物（空场态，属 shot 层）", "文字与招牌"]

