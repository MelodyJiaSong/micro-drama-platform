# 讲学厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（讲学厅＝北缘最大的方厅）：西南角斜甬道接召唤者之墓，东墙巨门接钢铁大厅。
# 厅内陈设（阶梯石席 / 讲台 / 列柱）无一手尺寸，全部推定。

[meta]
bg = "bg798"
name_zh = "讲学厅"
size_m = [150, 120]
px_per_m = 10.0
scale_src = "推定"
scale_note = "1.12 副本无区图；主厅 113×88 m 取自区级平面图 bg246 块 b909（上层区图量取，尺度本身推定），四周留出甬道口与东门外一段"
# 世界树画面：宽阔的黑石讲堂，成群矮人挤在阶梯席位间，尽头一对火盆夹着一扇封死的巨门。
absent = ["天空、日光、月光与任何天气（山腹室内）", "熔岩与熔岩沟（讲学厅不临熔岩）", "窗户与天井（岩体里没有对外开口）", "任何植被与水面", "木质长椅、布幔与旗帜", "人物、听众、守卫与动物（空场态，属 shot 层）", "门前两只大火盆的火焰（默认未点燃）", "电弧蓝光与冷色光源", "文字、铭牌与招牌"]

