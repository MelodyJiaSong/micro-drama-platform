# 住宅区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 西→东：三层民居台地（x 0–28，逐层退进岩壁）· 主街（x 28–46）· 街东矮屋（x 48–60）· 窄巷 · 铁栏观台（x 64–70）· 东熔岩海（x 72 起）。

[meta]
bg = "bg792"
name_zh = "住宅区"
size_m = [100, 70]
px_per_m = 14.0
scale_src = "推定"
scale_note = "1.12 副本无地图；相对方位取自现行区图上层（城心正南、东熔岩海西岸、南经石桥到神殿），绝对尺寸按区级图 b903（69 × 44 m）放大到含熔岩观台的 100 × 70 m 推定，三层台地每层高约 4 m 为推定"
# 世界树画面：沿岩壁层叠的黑石民居与回廊，窗洞里透出炉火橙光，狭窄石阶在住户门前折来折去。
absent = [
    "日光、天光、月光与任何露天（头顶是岩顶）",
    "木构民居、茅草顶与坡屋顶（全是平顶黑石方屋）",
    "树木草地与任何植被",
    "真正的水、水井与水渠（液体只有熔岩）",
    "蓝光与冷光",
    "任何人物、牲畜与动物（门扇半掩、街上无人）",
    "摊位招牌与带文字的门牌",
]

