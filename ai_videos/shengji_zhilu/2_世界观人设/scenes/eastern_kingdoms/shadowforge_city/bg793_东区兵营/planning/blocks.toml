# 东区兵营 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 西→东：对岸陡岩（x 0–10）· 大道（x 14–34，南低北高）· 台脚熔岩沟（x 37–41）· 岩坎 · 岩廊（x 46–54）· 营房（x 54–90）· 东门洞往法环。

[meta]
bg = "bg793"
name_zh = "东区兵营"
size_m = [100, 80]
px_per_m = 14.0
scale_src = "推定"
scale_note = "1.12 副本无地图；相对方位取自现行区图上层（城南西角、东邻法环、西北隔大道对西区兵营、两营夹巨门），绝对尺寸按区级图 b904（37 × 40 m）加上台下大道推定为 100 × 80 m；台地高 8 m、巨门高 14 m 为推定"
# 世界树画面：俯瞰下方宽阔石道的黑石兵营，厚重铁门两侧是带射击孔的岩壁走廊，火盆与熔岩红光从下方映上来。
absent = [
    "日光、天光、月光与任何露天（头顶是岩顶）",
    "打开的进城巨门（默认态巨门紧闭、锁箱锁着）",
    "木栅、帐篷与木构哨塔（全是黑石与黑铁）",
    "树木草地与任何植被",
    "真正的水与护城河（台脚沟里是熔岩）",
    "蓝光、冷光与魔法光",
    "任何守军、人物、坐骑与动物",
    "旗帜、纹章与带文字的牌匾",
]

