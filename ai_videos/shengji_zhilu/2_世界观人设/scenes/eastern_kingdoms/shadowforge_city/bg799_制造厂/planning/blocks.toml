# 制造厂 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（制造厂＝西缘、西区兵营正北带四个方点的厅）：南口隧道接西兵营，东口短甬道过西熔岩带接酒吧。
# 四根方柱取区图上的四个方点；熔炉、工作台、零件堆、凹室陈设无一手尺寸，全部推定。

[meta]
bg = "bg799"
name_zh = "制造厂"
size_m = [90, 72]
px_per_m = 16.0
scale_src = "推定"
scale_note = "1.12 副本无区图；车间 44×36 m + 北凹室 8 m 对应区级平面图 bg246 块 b910（44×48 m，上层区图量取，尺度本身推定），南加隧道一段、东加甬道与熔岩带西岸"
# 世界树画面：堆满齿轮、铜管与半装配机械人的黑石车间，矮小的侏儒技师在工作台间穿梭，电弧蓝光偶尔闪过。
absent = ["天空、日光、月光与任何天气（山腹室内）", "窗户与天井", "任何植被与水面", "火盆与铁壁灯（本档只有熔炉与电弧两种光）", "传送带、蒸汽机车与任何现代机床", "人物、技师、活动的魔像与动物（停工空场态，属 shot 层）", "文字、刻度数字与招牌"]

