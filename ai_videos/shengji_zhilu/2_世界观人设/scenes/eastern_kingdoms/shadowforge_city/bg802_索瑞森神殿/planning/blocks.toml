# 索瑞森神殿 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（神殿＝法环东北、住宅区正南隔南熔岩沟）与 bg246 块 b913 / 道路「神殿前石桥」。
# 南北中轴：北桥头 → 殿前平台 → 宽石阶 → 纪念碑 → 巨像（面朝北）→ 南墙下行门洞。殿内陈设无一手尺寸，全部推定。
# 本场地没有真正的水：[[water]] 是熔岩沟（名字带「熔岩」），借水系折线填面。

[meta]
bg = "bg802"
name_zh = "索瑞森神殿"
size_m = [120, 110]
px_per_m = 10.0
scale_src = "推定"
scale_note = "1.12 副本无区图；相对方位取自上层区图与 bg246 块 b913（40×35 m 只是殿心量取，尺度本身推定）；殿宽 100 m、桥头到南墙约百米、岩顶约 36 m 均为推定"
grid_m = 50
# 世界树画面：岩窟中的祭祀大殿，正中立着巨大的矮人先王黑石雕像，石阶两侧火盆长明，殿前一座石桥跨向对岸的住宅区。
absent = ["天空、日光、月光与任何天气（山腹岩窟）", "殿内的熔岩池与熔岩沟（熔岩只在桥下北沟）", "真正的水、植被与苔藓", "纪念碑凹槽里的铁锤（默认槽空着）", "壁龛里的神像、供品与布幔", "第五只火盆、壁灯与任何冷色光源", "旗帜、纹章与带文字的碑铭", "人物、守卫、祭司与动物（空殿态，属 shot 层）"]

