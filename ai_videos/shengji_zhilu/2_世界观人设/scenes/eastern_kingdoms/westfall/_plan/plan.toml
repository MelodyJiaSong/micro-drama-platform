# 西部荒野（westfall）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据（rule 4g）：贴地地坪（麦茬地 / 荒田 / 沙带 / 干沟 / 河岸草带 / 石阶 / 窄轨 / 导槽 / 砂模床）走 yard 或 plaza；
#   南瓜地与菜畦走 vineyard（成行）；木栅 / 削尖木桩 / 单根木桩与图腾杆走 palisade；矮院墙、残石围墙、
#   实心方体（水槽、倒扣石槽、桥头石墩、工具挂板）走 low_wall；石桥走 arch_bridge；矿洞口 / 坑道口 / 岔口走
#   mine_portal，通海岩拱走 cave_mouth，坑道转运段走 chamber，淬火池走 pool；门前木栅小院走 lawn（地坪 + 两侧栅）。
#   bg383 区级卡的块是子区占地，一律 yard（子区各自的 blend 才是几何），两座界桥走 arch_bridge。
# 去重：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用一件——
#   全区农舍 / 小镇石木屋 / 兵营式长屋 / 校舍 / 门廊大屋 / 灯塔小屋共用 a01；五处谷仓共用 a02；
#   各类单坡棚（含营地帆布棚、兽皮斜棚）共用 a05；木构栈架 a11 兼平台 / 坡道 / 栈桥 / 脚手架 / 栖架 / 晾架；
#   岩块 a33 兼礁石 / 落石 / 岩片 / 小礁岛 / 矿渣堆；杂物堆 a30 兼木犁 / 南瓜堆 / 方石料。
# 已知块数据问题（不改 blocks.toml，留给写入脚本的人）：
#   bg16·b01 战舰 h_m = 14 只算船壳，桅顶约 45 m，逐轴缩放会把桅杆压扁；
#   bg15·b17 洞顶蒸汽主管 h_m = 20 是离地高度而非管径，暂走 low_wall，会建成一堵 20 m 高的墙，需另给 z 偏移。

