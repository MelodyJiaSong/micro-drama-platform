# 死亡农地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级 [1880, 1180] m。田块、农舍图标、大道、界河、界桥按原版区图（1002 × 668 px，1 px ≈ 3.194 m）量取；
# 谷仓骨架、风车、石井、木栅、机械残壳、板车属推定（世界树画面只说「倒塌的谷仓只剩焦黑骨架」）。

[meta]
bg = "bg398"
name_zh = "死亡农地"
size_m = [460, 320]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图裁切：田块图标约 30 × 37 px（≈ 96 × 118 m）、斜放约 42°，中心 [62.4%, 60.6%]；界河与大道交点即界桥，量得在田块中心以东约 200 m。区级 terrain.toml 的界桥块比河中线偏西约 50 m，本图把桥对齐到河上"
# 世界树画面：东南角烧焦的农田，黑色残梗还在冒细烟，倒塌的谷仓只剩焦黑骨架横在地上（按 16.8 改为冷透不冒烟）
absent = [
    "燃烧中的火、火星、冒烟的残梗、红热的炭（火是几年前的事，只剩冷透的暗褐烧斑与炭黑残梗）",
    "完好的谷仓 / 带帆的风车 / 有屋顶的农舍（全部烧过）",
    "绿油油的麦田与收割机械在干活（田里只有一具锈蚀散架的机械残壳）",
    "第二座桥 / 渡口（出境只有这一座灰石拱桥）",
    "石墙要塞 / 塌陷巨坑 / 流民帐篷（4.0.3a 之后的西部荒野）",
    "飞行点 / 狮鹫栖架（旧世本区只有哨兵岭一处）",
    "海（海在区的西面与北面）",
    "河这岸的高林（高而暗的林子只在对岸）",
    "任何人物与动物（匪帮属 shot 层）",
]

