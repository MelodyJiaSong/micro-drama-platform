# 詹戈洛德矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg393"
name_zh = "詹戈洛德矿洞"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区级平面图：矿洞山丘多边形与西线土路按区图量取（1 px ≈ 3.2 m），洞口块 b905 在丘南脚；本图原点取区级 (1343, 416) m、裁 240 × 200 m。洞口与卸矿设施尺寸推定"
# 世界树画面：西北的矿洞口，木架与矿车轨道从洞里伸出来，洞内潮湿昏暗、岩壁颜色比外面的土黄深一个色阶
# 微型地下城图：坑道从南端入口往北绕，入口朝南 → 与区图洞口在丘南脚一致；坑道内景不画
absent = [
    "任何人物与动物（原典占据矿洞的匪徒与矿工小怪属 shot 层）",
    "亮着的提灯、蜡烛、火把与火堆（提灯全部熄灭）",
    "坑道内景（用到才另建 plate）",
    "露天采石坑与台阶岩壁（那是西南的另一处矿）",
    "水体（只有洞口一洼浑水与岩壁渗水）",
    "石砌矿场建筑与围墙（只有木板工具棚与木卸矿架）",
    "4.0.3a 后的新增营地与任务道具",
]

