# 月溪镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图裁切（1 px ≈ 1.06 m）量得：北来与东北来两条路在镇北汇合、五个屋舍图标的相对方位、镇背尖脊丘的走向。
# 屋舍图标不按比例，单栋尺寸推定；谷仓（竖井）在镇西南取世界树子节点原文。

[meta]
bg = "bg13"
name_zh = "月溪镇"
size_m = [260, 240]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区图裁切按 1 px ≈ 1.06 m 量取：五个屋舍图标散布约 120 × 130 m，镇背丘脚在镇中心南约 60–80 m；取 260 × 240 m 装下两条来路与丘坡"
# 世界树画面：西南角一座被占的小镇，灰扑扑的石木屋、破窗与倒了一半的栅栏；街上蒙红巾的迪菲亚来回走动，整条街的色相只剩土黄与暗红
absent = [
    "流民营与帐篷群（4.0.3 后才有；旧世是被匪帮占据的空镇）",
    "飞行点与坐骑栖架（4.0.3 才加）",
    "南面出镇的路（南面是尖脊丘，出入口只有北与东北）",
    "亮窗、炊烟、营火（默认态白天、窗全黑；匪帮营火属 shot 层）",
    "地面上可见的矿井口（竖井在谷仓地板中间，从街上看不见）",
    "任何人物与动物（匪帮成员属 shot 层）",
    "城墙与石砌大门",
    "绿地与树林",
]

