# 金海岸矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg392"
name_zh = "金海岸矿洞"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区级平面图 b904 按区图采石图标量得坑约 130 × 120 m（1 px ≈ 3.2 m）；本图取坑 140 × 150 m、外扩到西侧崖坎与海、东侧坡道口，场地 260 × 220 m。坑深 18 m 与台阶尺寸推定"
# 世界树画面：露天采石坑，层层台阶状岩壁泛黄白，坑底积着碎石与废弃吊架，正午时坑里几乎没有影子
# 微型地下城图：坑道内部呈 S 形，入口在图的东北角 → 坑道口摆在坑北壁东段（推定）；坑道内景不画
# 高度口径：ridge 的 height_m 以坑底为 0（坑壁 18 m；西侧崖坎顶再高出沙岸约 25 m）
absent = [
    "任何人物与动物（原典的巡守匪徒属 shot 层）",
    "燃着的火、火把、油灯与坑道口的灯光（坑道口纯黑，石圈灰烬冷透）",
    "水体与积水（坑底干燥；海只在崖坎外）",
    "现代工程机械与铁架起重机（只有木吊架与木脚手架）",
    "绿植与树木（只有坑沿几丛枯黄硬草与凿痕里的干苔）",
    "坑道内景（用到才另建 plate）",
    "下午逆光与长影（本档默认正午）",
]

