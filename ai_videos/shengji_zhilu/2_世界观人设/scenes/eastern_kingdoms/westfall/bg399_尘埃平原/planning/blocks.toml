# 尘埃平原 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级 [1700, 1340] m。丘陵、界河、大道由区级 terrain.toml 平移（区级坐标 − [1700, 1340]）裁入，记「地图量取」；
# 孤塔用 bg394 同一坐标（坐标表 [70, 74]）；营地、枯树、碎岩、旧田栅属推定（世界树只说「豺狼人的营火是唯一亮点」）。

[meta]
bg = "bg399"
name_zh = "尘埃平原"
size_m = [800, 560]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级 terrain.toml（原版区图 1 px ≈ 3.194 m）平移裁出；平原主体取南部丘陵北麓到东西大道之间这条平地，东缘到孤塔与界河。区级 blocks.toml 的落点块 b909 [1996, 1821] 大半压在丘陵多边形上，本图不跟它"
# 世界树画面：最南端的浮尘平原，地面裂成龟纹，起风时能见度骤降成一片黄白；豺狼人的营火是唯一亮点
absent = [
    "燃烧的营火、火苗、烟（默认态火塘是冷透的灰白余烬；要亮就另立夜景变体）",
    "麦田、风车、农舍（这里是龟裂荒地，不是农田；农场都在大道以北）",
    "鲜绿草坡与高林（只有东缘河岸一条灰绿窄带，高林在对岸）",
    "海（海在区的西面与北面）",
    "白色盐滩 / 石林 / 盐碱硬壳（那是别的区，这里是灰黄龟裂土）",
    "第二座塔 / 石墙 / 寨门（孤塔是唯一竖向建筑，营地只有兽皮棚与削尖木桩）",
    "塌陷巨坑 / 流民帐篷 / 焦黑哨塔（4.0.3a 之后的西部荒野）",
    "场地内的桥（界桥在场地北沿之外的河上，只作远景剪影）",
    "任何人物与动物（营地里的住户属 shot 层）",
]

