# 死亡矿井铁潮湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg16"
name_zh = "死亡矿井铁潮湾"
size_m = [260, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "副本内部洞窟，区图无坐标；取 260 × 200 m 通海洞窟（顶高约 50 m），入口在东壁高处、洞口朝西通外海——取自区地理页「地下海湾 + 半成型铁甲战舰」与副本路线（大门在最后）。水面以东（x > 185）即石码头岩面，不单列块。船长约 70 m 为推定。h_m 以水面为 0"
absent = [
    "日光直射 / 晴天蓝天（洞口只透进冷灰天光）",
    "船上的灯火 / 火把 / 魔法光（主光只有码头与栈桥的铁火盆）",
    "完工下水的铁壳巨轮 / 蒸汽明轮 / 现代军舰（是木壳三桅、下半截在钉铁甲）",
    "高炉 / 铁水（那是上游的铸造厂 bg15）",
    "入口大门的门扇完好态（本档默认门已被轰开、硝烟已散）",
    "海面上的其他船只",
    "任何人物、首领与船员（shot 层）",
]

