# 无尽之海（西部荒野外海） · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级 [0, 700] m。西岸土崖由区级 terrain.toml 平移（区级坐标 − [0, 700]）；水边线 ＝ 崖脚向西约 40 m（区级卡口径）。
# 海没有 polygon 可写，照区级做法用几条宽 [[water]] 带子填成面；三座小礁岛按原版区图（1 px ≈ 3.194 m）量取。

[meta]
bg = "bg400"
name_zh = "无尽之海（西部荒野外海）"
size_m = [1050, 700]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "只画近岸约 1 km 的海面 + 西岸崖与沙岸，用来给「朝西 / 朝东」两种机位定方位；海本身向西无边。崖与水边线取区级 terrain.toml，礁岛在区图 [23.7%, 41.9%]、[23.6%, 56.9%]、[22.7%, 64.2%] 量取"
# 世界树画面：西部荒野以西的开阔海面，深蓝转墨绿，浪涌平缓，天海之间没有任何遮挡物
absent = [
    "船只、帆影、港口码头、栈桥（旧世这片海上没有固定航线，船属 shot 层）",
    "朝西视野里的岛屿、礁石、陆地（天海之间没有任何遮挡；礁岛只在近岸、机位身后）",
    "灯塔光束（灯塔在南岸，是另一档；本档默认白天）",
    "暴风雨巨浪、浓雾墙、夜景",
    "冰山、浮冰、热带碧绿浅海（这里是冷色的温带外海）",
    "海鸟、鱼群与任何动物",
    "任何人物",
]

