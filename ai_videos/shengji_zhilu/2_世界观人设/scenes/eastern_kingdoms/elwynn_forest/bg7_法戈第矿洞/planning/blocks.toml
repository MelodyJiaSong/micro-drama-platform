# 法戈第矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图画**洞外**（外景锚点）。场地中心 (180, 150) ＝ 世界树坐标 [38.0, 83.6]；
# 丘、露头、冲沟、两片农田从 ref/bg7_法戈第矿洞_map_crop.png 量取（裁切图 1 px ≈ 0.79 m）。
# 洞内坑道另立 bg807（上层金砂巷 + 下层掌子面），不进本图。锚点机位在冲沟底 (186, 148)，朝北偏东看矿屋（bg7-c1）。
# 2026-09-30（floorplans-ep02）：b02 由「原木洞口框」改为半嵌进岩壁的暗红瓦木板矿屋（bg7 卡修订：r5 #255、ep02 S13、剧本硬约束 10）。

