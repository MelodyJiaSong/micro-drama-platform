# 回音山矿洞 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg3_回音山矿洞.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg3"
name_zh = "回音山矿洞"
size_m = [60, 56]
px_per_m = 10.0
interior = true
slope_m = 0
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "铁栅门",
    "封死的矿口（4.0.3a，patch.082）",
    "任何门扇",
    "均匀补光（3 米以后必须黑到看不见细节）",
]
scale_src = "原典"
scale_note = """
⚠ **尺度取自卡里的原文量**：净宽约 2.2 m、净高约 2 m、总纵深约 35 m。
这三个数是卡里写死的，**不是推的**；场地 60 × 56 m 只是给洞外留出余量。
`interior = true` 让地面取平、不生成谷地缓坡。
"""

# ── 坑道 ──────────────────────────────────────────────────────────────
# 卡里的纵深链：洞口（东南）→ 3 m 天光尽头 → 10 m 主巷 → 20 m 岔口（西出支巷）
# → 35 m 尽端掌子面。净宽约 2.2 m、净高约 2 m（成人须略低头）；西侧支巷净宽约一人（0.9 m）。
# ⚠ 本表把「洞口朝东南」简化成**朝南**——坑道走向是推定项（w02 §11 Q8：wiki 只有一句话），
#   轴对齐能让净宽净高的量尺对得上，而方位靠 shot 的 `走位:` 行承载。已在 divergence 留痕。
# ❌ 铁栅门 / 封死的矿口 ＝ 4.0.3a，整张作废（patch.082）。

