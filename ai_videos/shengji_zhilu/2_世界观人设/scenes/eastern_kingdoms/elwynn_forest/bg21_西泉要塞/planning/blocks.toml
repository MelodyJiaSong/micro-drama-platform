# 西泉要塞 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg21_西泉要塞.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg21"
name_zh = "西泉要塞"
size_m = [64, 52]
px_per_m = 10.0
slope_m = 3
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "城墙（只有齐腰的干砌矮石围墙）",
    "吊桥",
    "护城河",
]
scale_src = "推定"
scale_note = """
⚠ **尺度取自卡里「一进约二十步见方的方院」「哨塔约四层楼高」**（折约 15 m 见方 / 12 m 高）。
场地 64 × 52 m 是为了把大路、门外告示柱与两侧林缘一并画进来，**这一圈余量是推定的**。
"""

# ── 方院与大路 ────────────────────────────────────────────────────────
# 卡里的方位契约：大路自**东北**（闪金镇）来、向**西南**（西部荒野）去；
# 要塞在大路**西北侧**；齐腰干砌矮石围墙圈出一进约二十步见方的方院，
# 墙的**东南**面开一道两扇木栅门正对大路（唯一出入口）；
# 院内**西北**角立三层方形石哨塔（全场唯一制高点）；哨塔**东侧**贴一栋单层粗石营房；
# **门外东南侧路肩上立着一根通缉告示木柱**（离门约四步，柱正面朝东南）。

[[block]]
name = "石哨塔"
id = "b01"
xy = [20, 14]
size = [6.5, 6.5]
h_m = 12
kind = "tower"
src = "原典方位"
note = "三层、约四层楼高；塔顶木栈平台与四坡顶，旗杆挑出暴风城蓝底金狮旗。**全场最远可见的剪影**"

