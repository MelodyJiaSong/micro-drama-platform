# 墓地 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg17_墓地.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg17"
name_zh = "墓地"
size_m = [26, 26]
px_per_m = 22.0
slope_m = 2
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "天使（归 m6 角色卡，背景板留空）",
    "任何人物",
    "任何人影",
    "鬼魂",
    "可读的碑文（碑面只有磨平的浅刻凹痕）",
]
scale_src = "推定"
scale_note = """
⚠ **尺度取自卡里「约二十步见方」**：按一步 0.75 m 折约 15 m，
本表取 26 × 26 m 的场地，把西侧修道院外墙与门外土径一并画进来。
**「二十步」是卡里写的，26 m 场地是我为了留边界加的**，日后不必改。
"""

# ── 围合与碑群 ────────────────────────────────────────────────────────
# 卡里的方位契约：西＝修道院高外墙；南与东＝半人高粗砌矮石墙，南面墙中一道低矮黑铁栅；
# 北＝三两棵高阔叶树；正中十几块立碑，其中一块最高。
# ⚠ 天使**一笔都不画**（归 m6 角色卡）；本表在最高碑正上方留空。

[[block]]
name = "修道院东外墙"
id = "b01"
may_overlap = true
xy = [2.5, 13]
size = [22, 1.4]
h_m = 7
rot = 90
kind = "low_wall"
src = "原典方位"
note = "灰白琢石高外墙，墙根常春藤、墙头檐口露一线暗赭灰瓦（材质归 prompt，本层只给体量）"

[[block]]
name = "矮石墙南"
id = "b02"
may_overlap = true
xy = [13, 23.5]
size = [22, 0.8]
h_m = 1.1
gate_w = 1.8
kind = "low_wall"
src = "原典方位"
note = "墙中开一道口子，装低矮黑铁栅与一扇虚掩的小铁门（`gate_w` 即那道口子）"

[[block]]
name = "矮石墙东"
id = "b03"
may_overlap = true
xy = [23.5, 13]
size = [22, 0.8]
h_m = 1.1
rot = 90
