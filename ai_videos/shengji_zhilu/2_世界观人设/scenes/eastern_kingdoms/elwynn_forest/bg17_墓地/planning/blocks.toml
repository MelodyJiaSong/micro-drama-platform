size = [14, 12]
h_m = 1.6
kind = "graveyard"
src = "原典方位"
note = "十几块歪斜的朴素立式灰石碑。碑面只有磨平的浅刻凹痕、**无任何可读文字**"

[[block]]
name = "最高碑"
