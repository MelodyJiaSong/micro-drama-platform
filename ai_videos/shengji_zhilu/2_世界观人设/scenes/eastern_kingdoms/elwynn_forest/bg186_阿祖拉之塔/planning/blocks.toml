# 阿祖拉之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：塔 ＝ 坐标 [63, 70]，放在场地 (220, 170)；大道、东侧矮丘带、西北湖缘按 ref/bg186_阿祖拉之塔_map_crop.png 量取（1 crop px ≈ 1.06 m）。
# 场地东南外约 200 m 是另一处农田（区图南瓜田图标），不入本图。

[meta]
bg = "bg186"
name_zh = "阿祖拉之塔"
size_m = [500, 360]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图裁切像素 × 1.06 m/px 量取大道、矮丘带与湖缘相对塔的距离；塔身直径约 11 m、高约 24 m、小丘高约 10 m 为推定"
# 世界树画面：小丘上的圆柱石塔，顶层是铜蓝圆顶与观星阳台，塔身爬满常春藤；窗口透出冷蓝法术光，与周围的暖金林色正好反色
absent = [
    "其他建筑 / 村舍 / 围墙（独栋塔，四周只有林子与大路）",
    "火把 / 烛火 / 灯笼 / 营火（窗里的冷蓝幽光是唯一非日光光源）",
    "外溢的法术光效 / 光柱 / 符文 / 浮空物（冷蓝光只在窗洞里）",
    "秋色枯叶 / 金黄落叶（暖金来自光，叶子是饱和翠绿）",
    "训练假人 / 木桩靶",
    "飞行点 / 狮鹫栖木",
    "夜景 / 雨 / 浓雾",
    "文字 / 招牌 / 旗帜纹章",
]

