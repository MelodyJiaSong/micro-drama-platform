# 狮王之傲旅店 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图是 bg4 闪金镇平面图的**局部放大**：本图 (x, y) ＝ bg4 (x − 136, y − 80)；旅店 / 门廊 / 信箱 / 烟囱 / 酒桶 / 拴马横木 / 灯柱 / 路牌 / 前院 / 街心
# 与 bg4 同一组数，改一处两边一起改。铁匠铺在本图西界外（bg4 b02，本图 x ≈ −9…1）。
# 2026-09-30 按 1.12 新卡重排（floorplans-ep02）：旅店 38 × 13 m 含东端后厨与地窖；删马厩、红铜信箱、东南窄土路；加门廊、石墩信箱、门内药剂桌与吧台（S23）。
# 锚点机位：前院、离门廊约九米、齐人眼高朝东（bg5-c1）。

