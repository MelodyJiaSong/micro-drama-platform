# 北郡修道院 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg2_北郡修道院.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg2"
name_zh = "北郡修道院"
size_m = [90, 90]
px_per_m = 8.0
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "柱廊回廊",
    "钟楼",
    "地下室",
    "多层塔楼",
    "训练假人 / 木桩靶（4.0.3a 才加，黑名单第 15 条）",
    "起火 / 浓烟 / 兽人 / 战斗痕迹（旧世北郡是安宁的）",
]
scale_src = "推定"
scale_note = """
⚠ **尺度按卡里「紧凑的单层主厅 + 左右两翼、不是首都级纪念建筑」定**：
主厅取 24 × 26 m、檐高 9 m、脊高 15 m，两翼各 14–16 m 面宽。
`bg1` 的全谷底图里修道院占 26 × 20 m，本档放大到 90 × 90 m 的场地、把院墙与内院一起画进来。
**换算没有一手出处**，日后拿到实机坐标回来改这一处即可。
"""

# ── 建筑组 ────────────────────────────────────────────────────────────
# 卡里的分区：单层主厅 + 左右两翼（**西＝武器厅、东＝图书馆翼**），正门朝南，
# 北侧由两翼背墙与一圈矮院墙围出开阔内院空场。
# ❌ 无柱廊回廊 · 无钟楼 · 无地下室 · 无多层塔楼 · **无训练假人**（4.0.3a 才有）。

