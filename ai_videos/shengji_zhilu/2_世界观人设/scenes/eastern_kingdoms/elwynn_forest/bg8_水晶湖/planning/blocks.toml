# 水晶湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 场地 ＝ ref/bg8_水晶湖_map_crop.png 的整幅裁切（区图 18% × 18%，571 × 381 m），1 裁切 px ≈ 1.052 m；
# 湖心小岛（坐标 [49, 65.7]）落在 (286, 192)。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 湖是葫芦形：西半湖近圆（两条粗水线叠出）、中段窄水道、东半湖狭长——区图量取，不是正圆。
# 2026-09-30（floorplans-ep02）：加栈桥西南侧的岸边芦苇浅滩（ep02 S24 亚伦下到的芦苇边 / S25 鱼人从这里站起；锚点图右侧近处的芦苇与烂树桩即这一带）；锚点机位改到栈桥根（bg8-c1）。
# ⚠ 湖面是折线加宽：build_scene 按到折线的距离判水（端头是圆的），栈桥根与这片浅滩都落在「水里」——校验渲前先核机位 z。

