# 东谷伐木场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref/bg173_东谷伐木场_map_crop.png 1 px ≈ 0.793 m（裁切 18% 区宽 ＝ 571 m / 720 px）；坐标点 [81.4, 66.1] 落在 (230, 140)。
# 两枚房屋图标、河、大道、营地土路按裁切图量取；东北山脚取 bg172 terrain.toml「东界山墙」多边形换算。
# 锚点机位：西侧下山土路上 (130, 230)，朝东北。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg173"
name_zh = "东谷伐木场"
size_m = [380, 320]
px_per_m = 4.0
grid_m = 20
scale_src = "坐标表"
scale_note = "区 WorldMapArea 3173.7 × 2116.5 m × 区图裁切 18%；房屋图标与路网地图量取，原木垛 / 马栏 / 墓地 / 空地的体量推定"
# 世界树画面：东部林间的伐木营，成堆原木与锯木架，地面全是木屑与树皮；工棚烟囱冒淡烟，远处是砍出来的树桩空地
absent = [
    "狮鹫栖木 / 飞行点 / 飞行管理员（4.0.3a 才加，旧世这里没有）",
    "水力锯木厂 / 水车 / 蒸汽机械（旧世是人力长锯与木马架）",
    "寨墙 / 围墙 / 塔楼（营地不设防）",
    "旅店 / 铁匠铺 / 石砌房（只有原木工棚与敞棚）",
    "可见的火苗 / 营火 / 火把 / 灯笼（白天户外；只有烟囱一缕淡炊烟）",
    "林火 / 焦黑树桩（树桩截面是新鲜发白的）",
    "针叶林 / 雪 / 秋色落叶",
    "任何人物与马匹（马栏是空的）",
]

