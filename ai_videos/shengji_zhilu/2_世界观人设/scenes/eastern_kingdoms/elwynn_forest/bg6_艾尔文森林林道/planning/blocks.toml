# 艾尔文森林林道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 剧本自造的通用林道：取景原型是区级 terrain.toml「闪金镇—北郡谷口路」中段（区坐标约 (1425, 1156)–(1432, 1252)），
# 路西贴中西山块、路东是缓草坡——这两条是区图量得出的；桥、溪、岔口、孤树一律推定。锚点机位在主路上 (178, 30)，朝南顺路看（bg6-c1）。
# 2026-09-30（floorplans-ep02）：加 ep02 S01 的「隘口外路边坡顶」——北端路东一道矮草丘；机位在丘顶朝南，起幅扫的「身后那片林缘」是北边隘口方向、路西密林坡的林缘（ep01 S25 那人站过处在 bg20，不在本图）。

[meta]
bg = "bg6"
name_zh = "艾尔文森林林道"
size_m = [400, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "通用赶路场景，无世界树节点与坐标；400 × 300 m 取一段够装下「林坡—主路—石桥—草坡—林墙」五层纵深的路段，区图上该段路西距山块约 30–50 m"
absent = [
    "任何火 / 营火 / 火把 / 灯笼（白天户外零人工光源）",
    "秋色枯叶 / 光秃树枝 / 浓雾（那是南邻区的语言）",
    "针叶林 / 雪 / 高山岩壁（是阔叶橡林）",
    "石板铺路 / 路边栏杆 / 路灯（只有桥上两道矮石栏）",
    "路牌上的文字",
    "燃烧痕迹 / 焦黑树木（旧世这里是安宁的）",
    "任何人物与动物",
    "飞行点 / 狮鹫",
]

