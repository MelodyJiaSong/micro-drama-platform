# 北郡葡萄园 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg18_北郡葡萄园.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg18"
name_zh = "北郡葡萄园"
size_m = [72, 60]
px_per_m = 8.0
slope_m = 3
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "燃烧的葡萄园",
    "黑石战旗",
    "兽人",
    "浓烟",
    "地精刺客",
    "库尔托克·杀戮者",
    "被焚毁的农舍",
]
scale_src = "推定"
scale_note = """
⚠ **尺度为推定**：卡里只给方位（修道院正东、过河过桥）与功能（3–4 级迪菲亚暴徒盘踞的一片田），
没有给尺寸。本表取 72 × 60 m —— 够放七条垄 + 农舍 + 东界木栅，也够一条 35mm 镜头看穿。
日后拿到实机量测回来改这一处即可。
"""

# ── 田与界 ────────────────────────────────────────────────────────────
# 卡里的调度核心：**河从中间切过，西岸是修道院的秩序，东岸是红面罩。过桥＝越界。**
# 所以本表把河与桥画在**西界**，田在东，木栅东界之外通向 bg19。
# ❌ 葡萄园在燃烧 / 黑石兽人 / 地精刺客 / 浓烟 ＝ 4.0.3a 之后才有（patch.080/081）。
#    旧世北郡是安宁的，它就是**普通农田**的样子。

[[block]]
name = "藤垄区"
id = "b01"
xy = [32, 28]
size = [36, 30]
h_m = 2.6
rows = 7
kind = "vineyard"
src = "原典方位"
note = "木架葡萄藤垄，垄行**东西向**，人沿垄走即向东深入。田垄间散着被踩倒的藤蔓（属 shot 层）"

[[block]]
name = "葡萄园农舍"
id = "b02"
kind = "asset"
asset = "p464"
face = "south"
xy = [59, 12]
size = [10, 8]
h_m = 6
src = "原典方位"
note = "米莉·奥斯沃斯的农舍"

