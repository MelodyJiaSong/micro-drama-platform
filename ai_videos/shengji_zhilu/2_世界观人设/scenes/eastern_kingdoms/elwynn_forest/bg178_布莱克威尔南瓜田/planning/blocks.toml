# 布莱克威尔南瓜田 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg172，x%×31.737 / y%×21.165 m）的 (1981.6, 1513.2)，即田心 [70, 80] 减 (240, 180)；
# 溪 / 界河 / 大道由 bg172 terrain.toml 同名折线平移而来，方田的斜角与尺寸从 ref/ 裁切图量取。
# 方田在区图上是一块菱形：四个角大致朝北 (233, 102) / 东 (318, 173) / 南 (247, 258) / 西 (163, 187)。
#   卡说的「田西北角外」＝ 北角与西角之间那条边（西北边）的外侧；「田东北角外」＝ 北角与东角之间那条边的外侧。
# 2026-09-30（floorplans-ep02）按改卡与锚点图重排农庄（S30–S42）：屋前空地贴西北边外侧；大谷仓在空地北、门朝南；猪圈在谷仓东头；
#   小农舍在空地西南、门朝东开向空地，朝田的东南屋角正压在田栅线上；沿田栅线往东北：屋角 → 两人宽窄口（约 2.2 m）→ 侧翻的两轮货车（堵在栅线上）→ 田栅。
#   窄口里朝外（西北）是空地和农舍门，朝里（东南）是南瓜田：S37 杜克堵窄口、亚伦在他身后田里、沃尔特押着收货人在更后面的南瓜堆上。
#   锚点机位改到田东北边外的低坡朝西偏南（bg178-c1），删旧「机位缓坡」块 b07；田西与谷仓背后的橡树林挪近农庄（锚点图林线紧贴屋后）。
# 2026-10-01（shots-d2，qc5 站位 S37–S40 major）：货车原先 xy [207.1, 132.4]，西角离农舍东墙只有 0.14 m，窄口其实是堵死的；
#   往东挪 2.1 m 到 [209.2, 132.4]（西北长边正落在田栅线上），东墙到货车西角最窄处 2.24 m ＝ 卡上的「两人宽」。
#   窄口 b13 改成东西 2.2 m × 南北 3 m 的正放矩形（喉部在 y≈133.6，一侧是东墙、一侧是货车西角）。

