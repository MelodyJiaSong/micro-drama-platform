# 主厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 室内局部坐标：x 轴 ＝ 中厅纵轴（x 小的一端是正门，x 大的一端是祭台）；y 小的一侧通图书馆侧厅、y 大的一侧通武器大厅
# （世界树：图书馆在北、武器大厅在南）。**不代表精确罗盘方位**——bg2 v3 卡判为南北向长厅，见 md 场景定位。

[meta]
bg = "bg177"
name_zh = "主厅"
size_m = [40, 20]
interior = true
px_per_m = 30.0
grid_m = 5
scale_src = "推定"
scale_note = "室内尺寸无一手出处：中厅约 38×18 m、中殿脊高约 9 m、侧廊约为其一半高，按乡间修道院体量推定；实机截图到手后校正"
# 世界树画面：进门即是的长条中厅，两排灰石立柱撑起外露木桁架，高窗把斜光切成一道道光柱落在磨亮的石板地上，尽头墙面挂着暴风城纹章挂毯
absent = ["整面彩绘玫瑰窗 / 镀金（乡间修道院减等，只有巴掌大一块钴蓝玻璃）", "尖拱石穹顶（是外露木桁架）", "训练假人 / 木桩靶（4.0.3a 才加进北郡）", "火把 / 火盆 / 吊灯（唯一人工光源是祭台两座铁烛架）", "回廊庭院 / 地下室", "剧情道具（分面包的柳条筐、任务羊皮纸等归 shot 层）"]

