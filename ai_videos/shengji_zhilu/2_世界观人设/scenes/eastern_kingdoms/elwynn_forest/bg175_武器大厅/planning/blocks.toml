# 武器大厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 室内局部坐标：x 轴 ＝ 长厅纵轴（x 小的一端是通主厅的拱门），y 大的一侧 ＝ 进门右手。**不代表罗盘方位**
# （世界树判本厅在主厅南侧，bg2 v3 卡判在西侧，待实机核，见 md 场景定位）。

[meta]
bg = "bg175"
name_zh = "武器大厅"
size_m = [40, 24]
interior = true
px_per_m = 30.0
grid_m = 5
scale_src = "推定"
scale_note = "室内尺寸无一手出处：长厅约 36×14 m、净高约 4.5 m、右手三间小室各约 7×6 m，按剧本「低矮的武器厅」与乡间修道院体量推定；实机截图到手后校正"
# 世界树画面：修道院南翼的练武厅，粗石墙上挂满剑盾与长戟，地面铺深色木板，靠墙立一排稻草假人，角落的铁火盆把墙面烤出一圈暖橙
# ↑「稻草假人」是 4.0.3a 才加进北郡的（w02 patch.080），本图与锚点 prompt 均已删去。
absent = ["训练假人 / 草人靶 / 木桩靶（4.0.3a 才加进北郡）", "对院外开的门（唯一出入口是通主厅的拱门）", "烛台 / 火把 / 油灯（唯一人工光源是角落炭火盆）", "彩色玻璃窗", "高耸穹顶 / 石拱顶（是低平的外露木梁顶）", "二层 / 楼梯", "明火火苗与浓烟"]

