# 北郡山谷 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑 `python tools/build_floorplan.py <scene 目录>`。
# **不手改 PNG、不手改 blocks.md**（rule 4i ①：一份东西只有一个出处，副本必漂）。
#
# ── 为什么用方位契约建，而不是照搬坐标表 ────────────────────────────────
# w02 的核验员已判定：北郡那张 `coords` 表**方位与坐标自相矛盾**——
# 「迪菲亚暴徒区 ≈ [47.9, 41.5]」在修道院入口 [48.9, 41.6] 的**西边**，
# 而任务原文写的是 `have been seen across the river to the east`（河对岸的东边）。
# 结论（w02-V 原话）：**方位关系（东/西/南/北、过不过桥）可信，具体小数坐标一律 ⚠**。
#
# 所以本表的骨架来自三句**原文空间契约**（w02 §2.1）：
#   1. "Northshire Valley is surrounded by impenetrable mountains, with the exception of
#      a pass to the south which is protected by thick stone walls and a guarded entryway."
#   2. "A river runs through the valley, which eventually exits Northshire and empties into Crystal Lake."
#   3. 修道院与商人在**河西**，迪菲亚在**河东**（任务文本）
# 加上 c60 原图上量到的：修道院图标在西、河自北向南穿谷、路向西南出谷、东侧整片山脊。

[meta]
bg = "bg1"
name_zh = "北郡山谷"
size_m = [260, 300]
px_per_m = 3.0
scale_src = "推定"
scale_note = """
⚠ **尺度是推定的**：艾尔文森林整区按 WoW 标准区尺寸约 3470 × 2313 码，北郡在区图上约占
x 7% / y 12%，折算约 240 × 280 码 ≈ 220 × 256 m；本表取 **260 × 300 m** 留出边界山体。
**这个换算没有一手出处**，若日后拿到实测（在 Classic Era 里用坐标差量一次），回来改这一处即可——
全表都是相对布局，改 `size_m` 不会让内部关系失真。
"""

