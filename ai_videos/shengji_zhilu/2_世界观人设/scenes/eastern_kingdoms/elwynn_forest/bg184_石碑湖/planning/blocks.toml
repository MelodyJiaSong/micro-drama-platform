# 石碑湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：场地中心 [280, 280] ＝ 区级 terrain.toml 石碑湖环形水带的圆心 (2366, 1071)；水带、两侧山体、西南矮丘直接平移自区级 terrain.toml；
# 岛缘巨石按 ref/bg184_石碑湖_map_crop.png（1 crop px ≈ 0.8 m）量取。

[meta]
bg = "bg184"
name_zh = "石碑湖"
size_m = [560, 560]
px_per_m = 2.8
scale_src = "坐标表"
scale_note = "湖心坐标 [74.4, 51.9] × WorldMapArea 换算；水带半径 143/158 m、宽 82 m 取自区级 terrain.toml（区图量取）；石冢与窝棚尺寸为推定"
# 世界树画面：东北的环形湖，湖心一座大岛把水面挤成一圈环带；南岸是鱼人搭的粗木窝棚，岸边铜矿脉裸露
absent = [
    "路 / 桥 / 码头 / 栈桥（湖边无路，上岛只能涉水）",
    "房屋 / 农舍 / 石砌建筑（只有岛心石冢与南岸泥草窝棚）",
    "火堆 / 营火 / 烟（窝棚区没有火）",
    "墓碑 / 提灯 / 雕像（石冢只是粗石垒起的锥形冢）",
    "旗面纹章 / 文字（布旗褪成灰白、空白无纹样）",
    "瀑布（湖水只从南岸出水口流出）",
    "秋色枯叶 / 雪 / 浓雾",
    "飞行点 / 狮鹫栖木",
]

