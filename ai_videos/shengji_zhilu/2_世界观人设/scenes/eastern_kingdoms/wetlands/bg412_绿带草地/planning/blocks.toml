# 绿带草地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [55, 37] 落在本场地 (300, 220)；裁切图 1 px ≈ 1.258 m（区图 1 px ≈ 3.774 m，裁切放大 3 倍）。

[meta]
bg = "bg412"
name_zh = "绿带草地"
size_m = [560, 440]
px_per_m = 2.8
scale_src = "地图量取"
scale_note = "区图裁切量取：场地 ＝ 裁切图 (33.5..479, 5..355) px × 1.258 m；主干道双线、主河、南北两条池湾、西南丘陵北脚、东北岩山脚、南缘东路均从裁切图描出，并与区级 terrain.toml 对过（三岔口在点位正西约 200 m，恶铁岭在点位正东约 300 m、落在场地东缘外）。缓坡草带的轮廓与高度、五株阔叶树的位置为推定"
grid_m = 50
# 世界树画面：湿地中部少见的一条干爽草带，草色偏亮绿，几株高大的阔叶树成行立着，像一条穿过沼泽的绿色缓坡
absent = [
    "任何建筑、帐篷、围栏与人造物（草带上是空的）",
    "浓密成片的阔叶林（只有一行五株树）",
    "饱和翠绿的草坡与晴天蓝天（草色只比沼泽亮一档、天色阴）",
    "迅猛龙、人物与坐骑（属 shot 层）",
    "积水与烂泥（草带是干地，沼泽只在两侧坡下）",
    "火、灯笼与任何人工光源（东偏北裸岩小丘的炉火在这个距离看不见）",
    "4.0.3a 后新增的夜精灵据点与绿色守护者之林",
]

