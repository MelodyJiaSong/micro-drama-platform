# 恐龙岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg409"
name_zh = "恐龙岭"
size_m = [520, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图点位 [72, 38] 放在场地 (240, 200)；楔形谷地的两道山脊边线、东路位置、西北岩壁上的洞口图标按区图裁切量取（区图 3.774 m/px，裁切约 0.9 m/裁切 px）；窝群、巨石、岩台等谷内布置无一手出处，推定"
# 世界树画面：东侧一片高地岩坡，地上散着蛋壳与啃净的骨头，岩缝间能看到成群迅猛龙来回巡走
# 区图：红十字落在东北山区里一条向东收窄的绿色楔形谷地西段；南侧矮岩脊背后是东路
absent = [
    "任何动物与人物（迅猛龙群属 shot 层，本档只留爪印、窝与骨头）",
    "火、火堆与任何人工光源",
    "帐篷、木栅、房屋与营地（这里是兽窝，不是人的据点）",
    "河流与湖（只有爪印坑里的积水与鞍部岩壁的渗水痕）",
    "茂密森林（只有北坡零星几株被风吹偏的矮树）",
    "东端出口（鞍部陡碎、不走人，进出只有西口）",
    "晴天蓝天、雨雪与夜景",
    "4.0.3a 后的任何改动",
]

