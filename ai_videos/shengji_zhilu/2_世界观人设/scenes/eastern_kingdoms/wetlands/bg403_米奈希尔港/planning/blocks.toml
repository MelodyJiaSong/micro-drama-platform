# 米奈希尔港 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg403"
name_zh = "米奈希尔港"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 3.774 m/px：港岛在区图上宽约 55–60 px、高约 50–55 px（≈ 210 × 200 m），场地取 320 × 280 m 把西侧外海与栈桥、东北土堤与东南内湾一起框进来。岛内建筑数量、尺寸与相对位置只有「城堡居中 / 旅店在码头边 / 狮鹫台在镇南 / 两道栈桥在镇西」是原典方位，其余为推定"
# 世界树画面：建在沼泽尽头小岛上的石墙港镇，四座方塔拱着中央城堡，木栈桥伸进灰绿海水，桅杆与帆影挤在码头边
absent = [
    "沉入海里的半个镇子与倾斜倒塌的塔（4.0.3 才沉；旧世四塔俱在、镇子完整）",
    "第二条陆路或桥（陆上只有东北土堤一个入口）",
    "小岛背后的山（山在东南内湾对岸，岛上是平地）",
    "亮着的窗户、油灯、炉火与炊烟（白天默认零人工光源）",
    "任何人物、船员、狮鹫与牲口（默认空镇）",
    "旗帜纹章、招牌字样与任何文字",
    "暴风城港口一类的大型石砌军港（旧世联盟跨海只走这里的两道木栈桥）",
    "晴天蓝天与直射阳光",
]

