# 蓝腮沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg406"
name_zh = "蓝腮沼泽"
size_m = [600, 500]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "汊道交汇点 ＝ 坐标 [20, 35]（区 m ≈ 756, 882），场地原点 ＝ 区 m (456, 632)。海岸线与主干道西段由区级 terrain.toml 平移而来；汊道条数与走向按区图裁切量取（交汇点向西分出三四条细汊入海），宽度、泥洲上草棚与骨桩的数量和位置为推定"
# 世界树画面：西北一片浅水滩涂，泥岸上插着鱼人用的骨制尖桩与草棚，水面漂着成片浮萍
# 沉船群（区级 b908）在场地西北外约 100 m 的浅海里，图上只标一个远景桅杆剪影
absent = [
    "山、高树与任何高过一人的建筑（天际线只有海平线）",
    "寨墙、栅栏、码头与石砌房屋（只有贴地草棚与骨桩）",
    "进滩的路（主干道在南缘外，滩里只能蹚水走泥洲）",
    "墨黑油膜深水与成片枯树林（那是东边的深沼）",
    "火、炊烟、灯笼等任何人工光源",
    "人物、草棚的主人、鳄鱼与水鸟（默认空滩）",
    "晴天蓝天与直射阳光",
    "4.0.3a 后新增的据点与改动的海岸",
]

