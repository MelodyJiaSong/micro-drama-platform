# 怒牙营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg404"
name_zh = "怒牙营地"
size_m = [260, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图 3.774 m/px：营地图标在南界山墙北麓脚下、离山脚约 30–40 px（≈120–150 m）、东侧贴一道低岩坡；场地取 260 × 260 m 把山脚、岩坡与北门外泥路一起框进来。寨墙直径约 80 m、五顶帐篷一座长棚为按「一座营地」规模推定，无一手尺寸出处"
# 世界树画面：泥地上一圈尖木桩围起的兽人营，红黑兽皮帐篷、铁架火盆，营中央竖着龙喉氏族的旗与兽骨柱
absent = [
    "成片水面与沼泽（营地在山脚泥平地上，只有水洼与车辙坑）",
    "第二道寨门（只有北门）",
    "石砌或砖木房屋（全是兽皮帐篷、长棚与原木哨塔）",
    "燃着的火盆、火塘与炊烟（默认冷灰余烬）",
    "任何人物、座狼、迅猛龙与牲口（默认空营）",
    "幡面纹章与任何文字标识",
    "晴天蓝天与直射阳光",
    "4.0.3a 后新增的营地与据点",
]

