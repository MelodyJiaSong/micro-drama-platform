# 夜色镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref/bg128_夜色镇_map_crop.png 1 px ≈ 0.648 m（裁切 720 px ≈ 区图 190 px，区图 1 px ≈ 2.46 m）；
# 本图原点 ＝ 裁切图 (129, 39)，场地中心 ＝ 裁切中心（区图 [74, 45]）。三条路、西侧低脊、东北 / 东南矮山、三个房屋图标按裁切量取；
# 图标只给位置，功能归属（镇政厅 / 酒馆 / 民居）与其余建筑全部推定。
# 锚点机位：北路 (140, 40)，朝南偏东顺街看向路口。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg128"
name_zh = "夜色镇"
size_m = [300, 260]
px_per_m = 4.0
grid_m = 50
scale_src = "地图量取"
scale_note = "路网、低脊、矮山与三处房屋图标按区图裁切量取（±15 m）；单栋建筑尺寸、朝向与其余建筑推定"
# 世界树画面：东部路边的尖顶木屋小镇，木墙深棕近黑、屋顶陡而窄，门口挂着铁灯笼；灯光在雾里晕成一团团橙黄，是全区唯一持续的暖光源
absent = [
    "城墙 / 寨墙 / 门楼 / 石砌塔楼（镇子不设防墙）",
    "火把列队 / 篝火 / 路中间的火盆 / 大面积火光（暖光只有灯笼、窗烛与铁匠炉三种）",
    "河 / 桥 / 码头（镇子看不到河）",
    "太阳 / 蓝天 / 月亮圆盘",
    "白石墙蓝板岩顶的城市建筑（那是王城形制）",
    "挂着字的招牌 / 告示 / 门牌（招牌只画图案）",
    "任何人物、马、狮鹫、乌鸦与飞鸟",
    "狼人难民营 / 镇外新建营地（4.0.3a 之后）",
]

