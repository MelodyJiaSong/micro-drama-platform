# 暮色森林（duskwood）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 墙栅 / 洞口坑道 / 水潭 / 岩台走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用一件——
#   民居 / 酒馆 / 铺面屋共用 a01；枯林带、单棵枯树、岸边蛛网枯丛共用 a06；贴地小杂物（犁 / 木桶 / 干草 / 榨果机 / 散骨 / 碎瓦断梁）共用 a24。
# 其余：bg126 区级卡的块是子区占地，一律 yard（子区各自的 blend 才是几何）；bg140·b02 光门是光效不是实体，proxy 只占体积；
#   bg135·b02 坑道走 chamber（tunnel 沿 rot 走向，本块长轴南北而未写 rot）；方石柱 / 木台 / 石阶台 / 桥墩 / 花坛是实心方体，走 low_wall；
#   篱笆 / 木桩 / 锈铁栅门走 palisade。

