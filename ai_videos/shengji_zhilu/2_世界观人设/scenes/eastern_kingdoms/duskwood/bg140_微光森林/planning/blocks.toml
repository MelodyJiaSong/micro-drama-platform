# 微光森林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (870.3, 358.4)；本图 (300, 300) ＝ 区级 terrain.toml「中央环形山」圆心 (1170.3, 658.4)。
# 环形山按 terrain.toml 取内径 r≈170 m、外径收到 r≈290 m（场地边长 600 m 装得下），正南 84°–96° 留山口。
# 区图裁切：巨树 / 门图标在红十字 [47,44]（世界 1160, 724 → 本图 290, 366）以北约 150 m，取巨树 (282, 215)；
# 一条小径自南口弯两道 S 形爬到门前。锚点机位：南山口内 (300, 462)，离地约 1.6 m，朝正北看巨树与门。
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg140"
name_zh = "微光森林"
size_m = [600, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "环形山内外径与南口位置取自区级 terrain.toml（区图量取 ±50 m）；巨树相对红十字的方位按裁切量取（±20 m）；石台、石柱、枯林、倒木的尺寸与位置全部推定"
# 世界树画面：森林正中一个环形凹地，中央一棵不具名的巨树；树下一道翡翠绿的传送门，绿光是全区唯一的冷亮色，照得雾发荧光
absent = [
    "任何火、火堆、烛火、灯笼与暖色光源（门的绿光是唯一有色光）",
    "太阳 / 蓝天 / 月亮圆盘 / 硬直射光",
    "河流、水面与桥",
    "道路以外的人工建筑：房屋、围栏、帐篷、塔",
    "考古挖掘点、土坑与挖掘工具（那是 4.x 之后的东西）",
    "门里透出的另一个世界的风景（门面是看不透的旋转绿光）",
    "开花的树 / 翠绿健康的林子（只有巨树挂着近黑蓝绿的叶子）",
    "石柱与石台上可读的文字或符号",
    "任何人物、巨龙、野兽与飞鸟",
]

