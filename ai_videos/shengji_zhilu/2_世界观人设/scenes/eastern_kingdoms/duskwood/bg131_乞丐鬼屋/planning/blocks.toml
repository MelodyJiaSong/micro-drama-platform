# 乞丐鬼屋 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg126）的 (2020, 420) m；塔 ＝ 区图 (87.6%, 33.7%) → 本图 (143, 135)。

[meta]
bg = "bg131"
name_zh = "乞丐鬼屋"
size_m = [320, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地按区级平面图的米制截取（原点 = bg126 的 2020, 420 m），塔位取区图塔形图标；塔体、坟、石像、潭的尺寸无一手出处，按世界树文字与常识推定"
# 世界树画面：东北角一座废弃哨塔，一条小径绕上去通到一潭死水与小瀑布；塔边一座无名墓，两侧立着比人高的石像
absent = ["部落旗帜 / 药剂台 / 据点营火（1.12 的据点人员与陈设属 shot 层）", "隐士的棚屋与草药骨串（那是 4.0.3a 后搬来的布置）", "流出坡外的溪流（死水潭不下坡）", "夜色镇的灯笼与窗火（被山体挡住，不入画）", "任何火 / 火盆 / 人工光源", "太阳 / 蓝天 / 月亮圆盘", "第二座塔或围墙", "训练假人 / 飞行点"]

