# 密斯特曼托庄园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg126）的 (1760, 480) m；庄园 ＝ 坐标表 [78, 36] → 本图 (166, 112)。

[meta]
bg = "bg133"
name_zh = "密斯特曼托庄园"
size_m = [360, 320]
px_per_m = 4.0
scale_src = "坐标表"
scale_note = "点位取世界树坐标 [78, 36] 换算到 bg126 米制；北侧山体、南东钩形矮脊、西侧土路由区图裁切量取；院墙、主楼、马厩尺寸无一手出处，按两层宅院常识推定"
# 世界树画面：东北的没落庄园，主楼还立着但墙皮剥落、窗框歪斜，院子被荒草吞掉；全园只有一朵花是活的，颜色刺眼地亮
absent = ["亮着的窗 / 烛火 / 灯笼 / 任何人工光源（默认所有窗洞全黑）", "第二朵活花或任何其它鲜活植物", "会发光的花（它只是颜色亮）", "修剪整齐的草坪与在开的花圃", "水池 / 喷泉 / 溪流", "4.0.3a 后的吉尔尼斯来访者与改写后的布置", "太阳 / 蓝天 / 月亮圆盘", "食尸鬼与宅主本人（属 shot 层）"]

