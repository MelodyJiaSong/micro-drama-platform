# 约根农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (1080, 1090)；南路按 bg126 terrain.toml 折线平移（地图量取）。
# 区图 [50, 73] 田块图标在北、[51, 77] 房屋图标在东南，落在本图约 (127, 112) / (172, 181)。
# 南界山墙中段北缘在本图南边界外约 50–150 m（世界 y≈1300–1380），西面越过南路是食人魔盆地环山的东弧（场地外）——都不画进本图，写在锚点 prompt 的远景里。
# 锚点机位：院子西侧篱笆门外 (115, 165)，朝东偏南。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg130"
name_zh = "约根农场"
size_m = [260, 240]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "南路、田块与房屋两个区图图标的相对位置按区图量取（±30 m）；院子、井、柴棚、篱笆的尺寸与位置推定"
# 世界树画面：南部的空农庄，篱笆倒了一半，院里一口废井，屋里桌椅还摆着像是刚走开
absent = [
    "任何火、烛火、灯笼、窗火与炊烟（屋里桌椅只靠窗漏的冷光看出轮廓）",
    "烧毁 / 被砸烂的痕迹（人是自己走的，屋子完好）",
    "谷仓 / 风车 / 磨坊（这里只有一栋住屋和一间柴棚）",
    "帐篷 / 营地 / 路障",
    "带字的招牌 / 告示",
    "太阳 / 蓝天 / 月亮圆盘",
    "任何人物、牲畜、狗与飞鸟",
]

