# 阳光树林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg126）的 (1390, 640) m；点位取研究笔记世界坐标换算的区图 (64%, 49%) → 本图 (200, 170)。
# bg126 的块 b905 已于 2026-09-24 场景总审改到本卡点位 (1550, 760) m（原推定的 (65%, 68%) 与世界坐标不符）。

[meta]
bg = "bg132"
name_zh = "阳光树林"
size_m = [400, 360]
px_per_m = 4.0
scale_src = "坐标表"
scale_note = "点位由 g02_stormwind_kingdom_core_notes.md ③ 世界坐标（夜色镇 / 本地两点）换算到 bg126 米制；两侧山脊取 bg126 terrain.toml；田、废屋、窝棚的尺寸无一手出处，一律推定"
# 世界树画面：夜色镇西侧的林间空地，边缘立着几处房屋废墟，中间是连片黑田——名字叫阳光，画面里一丝阳光都没有，这个反差本身就是一个镜头
absent = ["阳光 / 太阳 / 光柱 / 蓝天（名字叫阳光，画面里一丝都没有）", "燃着的营火（默认冷灰余烬；要亮须在 shot 层立据）", "镇上的灯笼与窗火（被东脊挡住）", "在耕的庄稼 / 新鲜的绿", "完好的房屋 / 有人住的迹象", "河流与水面（只有垄沟里的黑泥水）", "狼人本体（属 shot 层）", "4.0.3a 后的新布置"]

