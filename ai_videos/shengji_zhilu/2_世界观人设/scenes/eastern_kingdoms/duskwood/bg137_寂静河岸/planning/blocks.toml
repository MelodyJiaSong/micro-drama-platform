# 寂静河岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 本档只取东岸带的**有顶木桥段**（主干道西端过河处）。换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (0, 780)；
# 西界河及其下游、主干道按 bg126 terrain.toml 平移（地图量取）。桥按区图主路西端过河处，略移到折弯以北河道笔直的一段（推定）。
# 锚点机位：东岸碎石滩、桥北约 50 m (195, 220)，朝南偏西平视。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg137"
name_zh = "寂静河岸"
size_m = [520, 440]
px_per_m = 3.0
grid_m = 20
scale_src = "地图量取"
scale_note = "界河走向、折弯点与主路过河处按区图量取（±50 m）；桥长、桥墩、岸带宽度与蛛网枯树丛推定"
# 世界树画面：西侧那条河的东岸带，黑水从北端三区交界的河汊一直向南流到荆棘谷方向；通往西部荒野的有顶木桥架在这段岸上，桥洞里一片漆黑，岸边蛛网挂在枯枝间
absent = [
    "任何火、烛火、灯笼与人工光（桥头无灯，桥洞全黑）",
    "第二座桥 / 渡船 / 码头（西界河上只有这一座桥）",
    "难民营与帐篷（在北面约 500 m，归 bg136）",
    "越过河面照到东岸的亮光（对岸灰黄天光只落在河西）",
    "4.0.3a 后的盗墓者营地、熊与猫头鹰",
    "蜘蛛本体（只有网）",
    "带字的桥牌 / 路牌 / 告示",
    "太阳 / 蓝天 / 月亮圆盘",
    "任何人物、动物与飞鸟",
]

