# 闪光湖岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：世界树坐标 [59, 18] → bg247 的 (2265.9, 460.9) m → 本图 (180, 150)，即原点 ＝ bg247 的 (2085.9, 310.9) m。
# 岸线、主道与湖心岛西岸从 ref/ 裁切图量取（裁切图约 1.35 m/px，红十字在 (272, 180) px）；湖面用 30 m 宽的横向水带从岸线铺到东缘。
# 注：量取出的岸线拐角在本图 (83, 150)，红十字（世界树点位）落在东北段岸线上、拐角以东约百米，两者都在砂岸上。

[meta]
bg = "bg266"
name_zh = "闪光湖岸"
size_m = [420, 320]
px_per_m = 3.6
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算）；裁切图放大约 2.8 倍（≈1.35 m/px，由湖心岛城堡图标与红十字的间距反算），岸线与主道量取，砂岸宽度与破船位置为推定"
# 世界树画面：洛丹米尔湖西岸的浅白砂岸，湖水反着冷光，岸边泊着破船
absent = ["金黄沙滩 / 热带海滩 / 椰林（砂是浅白偏灰的湖砂）", "码头 / 栈桥 / 船棚（本档零人造建筑）", "桥（湖心岛只能游过去）", "完好能用的船 / 帆船", "灯塔 / 窗灯 / 火堆 / 任何人工光", "芦苇丛（本段是白砂岸，芦苇泥岸在南边渡口）", "湖对岸（永远在雾里）", "雪", "阔叶林", "翠绿草地"]

