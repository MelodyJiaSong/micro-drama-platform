# 黎明岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地 ＝ 区图 (700, 85) px 起的 520 × 540 m 一块（1 px ≈ 3.833 m），即区级平面图 bg247 坐标 (2683, 326) m 起；
# 五座小岛的中心与轮廓按区图岛形量取；沙洲、芦苇、枯松、浮木为推定。

[meta]
bg = "bg265"
name_zh = "黎明岛"
size_m = [520, 540]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "五座小岛与西缘大岛两角按区图岛形量取（1 px ≈ 3.833 m）；区图岛形偏夸张，岛径可能偏大；沙洲走向、岛高与岛上植被为推定"
# 世界树画面：湖上几座无人小岛，芦苇与浅滩
absent = [
    "太阳 / 蓝天 / 直射阳光（本档阴天薄雾）",
    "桥 / 栈桥 / 码头 / 任何船只（区图上一座桥都没有）",
    "房屋 / 帐篷 / 篝火与任何人工痕迹（岛上从没人住过）",
    "对岸远山与雪山（东、南湖面尽头只有雾）",
    "庄园的窗灯与门窗细节（亮灯态属 bg250 自己的卡）",
    "水鸟 / 鱼 / 任何动物与人物",
    "热带植物 / 棕榈 / 睡莲 / 翠绿草地",
    "结冰湖面 / 积雪",
]

