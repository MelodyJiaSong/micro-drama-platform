# 芬里斯城堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原典：岛顶的石砌庄园，塔楼完好，院墙塌了一角，窗里有灯。区图：城堡图标在月牙形岛的北半部，图标以南一条线顺坡南下。
# 局部坐标；庄园中心 (120, 121) 对 bg247 区级平面图 b950 (2515, 632)。庄园内部布局无一手出处，一律推定。

[meta]
bg = "bg250"
name_zh = "芬里斯城堡"
size_m = [240, 260]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区级平面图 b950 给庄园 120 m 见方的外接范围（地图量取）；本图取庄园 + 四面坡 + 北面湖岸共 240 × 260 m。北岸距离按区图城堡图标到岛北缘约 40 px（≈150 m）折半取「约百米」，庄园内部尺寸全部推定"
# 世界树画面：岛顶的石砌庄园，塔楼完好，院墙塌了一角，窗里有灯
absent = [
    "人物、亡灵、法师与任何动物（窗里有灯但画面无人）",
    "吊桥、铁闸门、护城河与门口火盆（那是南部崖顶黑石城堡的标志）",
    "通往岛上的桥与完好的渡船（区图一座桥都没有，只能游过去）",
    "火把、灯笼、火堆与冒烟的烟囱（唯一人工光源是几扇窗里的烛光）",
    "坍塌的塔楼（原典：塔楼完好）",
    "湖对岸的山与建筑（对岸永远隐在雾里）",
    "攻城器械、营帐、军旗与战壕（4.0.3a 后的战线元素）",
    "晴天、蓝天与阳光",
    "阔叶林与翠绿草坪",
    "雪与积雪",
]

