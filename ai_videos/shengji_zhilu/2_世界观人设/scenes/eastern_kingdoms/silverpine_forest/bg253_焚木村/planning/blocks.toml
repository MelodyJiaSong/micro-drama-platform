# 焚木村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1590, 1720)。坐标表点位 [46, 76] → 本地 (177, 226)。
# 悬崖、南部山地、海岸、村路、南墙路、巨石墙全部取自 bg247 terrain.toml / blocks.toml（区图量取）。
# 裁切图上四枚房屋图标落在红十字以北 25–110 m、呈弧形排开；村内各栋的分工（议事厅 / 礼拜堂 / 铁匠棚 / 民居）按本区地理页三个地标推定。
# 场地向南拉到 560 m，是为了把「紧挨着高墙」的那道墙画进同一张图。

[meta]
bg = "bg253"
name_zh = "焚木村"
size_m = [330, 560]
px_per_m = 3.0
scale_src = "推定"
scale_note = "村子范围按裁切图四枚房屋图标的分布（约 150 × 100 m）推定；悬崖、山、路、墙的位置取区图量取，场地向南延到墙"
# 世界树画面：紧挨着高墙的人类村子，尖顶木屋一字排开，夜里家家闭户
absent = [
    "砖砌的高窄连排屋、铸铁路灯、烟囱林立的城镇街景（4.0.3a 后全村换了建筑样式）",
    "墙上被震开的缺口、墙后可见的城邦（4.0.3a；旧世闸门锁死）",
    "攻城器械、军营、壕沟与战火痕迹（4.0.3a 战役）",
    "废墟与塌房（村子完好、有人住）",
    "窗灯、炉火、炊烟、火把与任何人工光源",
    "码头、栈桥与船（海在崖下，村子不临水）",
    "大片农田（只有房前屋后的小菜园）",
    "晴天、蓝天与直射阳光",
]

