# 粘丝洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：世界树坐标 [38, 18] → bg247 的 (1459.4, 460.9) m → 本图 (220, 190)，即原点 ＝ bg247 的 (1239.4, 270.9) m。
# 裁切图 ≈0.958 m/px（区图 180 px 宽的窗口放大 4 倍），红十字在 (362, 240) px；崖脚线、海岸线、南边小石岭由裁切图量取。
# 裁切图崖脚 (265, 110) px 处有一枚小图标，推定即洞口 → 本图 (127, 74)。崖脚线在此段走向西北偏西—东南偏东（约 19°），洞口因此面朝南偏西。
# 海用 6 条横向水带从海岸线往西铺到场地西缘（场地西南角是海湾）。

[meta]
bg = "bg267"
name_zh = "粘丝洞"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算）；裁切图放大 4 倍（≈0.958 m/px），崖脚线、海岸线与南边小石岭由裁切图量取；洞口按崖脚小图标推定，洞喉进深、碎石坡与崖前树木为推定"
# 世界树画面：崖壁上的洞口，内壁糊满蛛网与卵囊，只有零星幽光
absent = ["任何建筑 / 棚屋 / 栅栏 / 帐篷（本档零人造物）", "蜘蛛与任何活物（只写网、卵囊与空卵壳）", "尸体 / 血迹 / 茧里裹着的人形", "火把 / 火堆 / 任何火光与人工光", "发光的卵囊 / 荧光菌 / 魔法光（洞里唯一的光是岩缝漏下的天光）", "平地上的洞口（洞口在崖壁半腰，要爬碎石坡）", "树桩空地（那是 bg259）", "遍地骨头（那是 bg261）", "路（草洼里只有兽径）", "雪", "阔叶林", "翠绿草地"]

