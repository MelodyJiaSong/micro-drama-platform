# 南流海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地 ＝ 区级平面图（bg247）坐标 (1400, 1700) 起的 460 × 700 m 一块：海岸线、北端高崖、南部山地、村路与南墙路都从 bg247/terrain.toml 平移过来。
# 区图 1 px ≈ 3.833 m；村子西缘木屋按区图 (440–470, 478–500) px 的房屋图标量取。

[meta]
bg = "bg264"
name_zh = "南流海岸"
size_m = [460, 700]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "海岸线 / 北端高崖 / 南部山地 / 村子房屋图标均从区图量取（1 px ≈ 3.833 m）；沙带宽 40 m、沙坡、松林带、礁石与海蚀柱为推定"
# 世界树画面：西南海岸，沙色更暗，海雾常年不散
absent = [
    "太阳 / 蓝天 / 晴朗海面（本档海雾常年不散）",
    "浅白或金黄的细沙滩（本档是深灰褐粗沙）",
    "棕榈 / 椰林 / 热带海滩",
    "码头 / 栈桥 / 灯塔 / 任何船只（这段海岸没有泊位）",
    "海鸟与任何动物、人物、脚印",
    "火光 / 窗灯 / 城堡门口的火盆（属 bg253 / bg263 各自的卡）",
    "战线营地、攻城器械、战壕与登陆艇（4.0.3a）",
    "南墙被震开的缺口（4.0.3a；南墙在南部山体背后，本场地看不到）",
    "积雪",
]

