# 瓦尔甘牧场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：原点 ＝ bg247 区级平面图的 (1900, 540) m（区图 px ≈ (496, 141)，3.83 m/px）。
# 主道与湖西岸取自 bg247 terrain.toml（地图量取）；牧场本身世界树无坐标，位置沿用 bg247 的推定块 b958，屋 / 栏布局全部推定。

[meta]
bg = "bg258"
name_zh = "瓦尔甘牧场"
size_m = [340, 240]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算）；主道、渡口土路与湖岸从 bg247 terrain.toml 平移而来，湖湾深度与屋栏布局为推定"
# 世界树画面：湖边牧场，木栅圈着空畜栏，草地泛黄
absent = ["任何牲口 / 牛羊马（畜栏是空的）", "稻草人", "麦田 / 活庄稼 / 田垄（本户只围牧草）", "果树与南瓜地（那是邻档的农场）", "谷仓（只有一间敞开的草棚）", "码头 / 栈桥 / 船（渡口在南面另一档）", "桥", "火堆 / 窗灯 / 烟囱冒烟 / 任何人工光", "雪", "阔叶林", "翠绿草地", "4.0.3a 后的军营帐篷与旗帜"]

