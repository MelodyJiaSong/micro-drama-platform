# 瑟伯切尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1620, 860)。坐标表点位 [46, 37] → 本地 (147, 87)。
# 北侧山体、南侧山脚与支路取自 bg247 terrain.toml（区图量取）；区图镇子图标在本地 (28, 182) 附近，支路在图标东侧到头。
# 镇内各件（墓室 / 碑群 / 栅栏 / 木屋 / 栖架）按世界树画面与地理页子节点推定摆放。

[meta]
bg = "bg257"
name_zh = "瑟伯切尔"
size_m = [260, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地 260 m 见方按「一坡墓园 + 坡脚支路」推定；无一手尺寸出处"
# 世界树画面：山坡上一座石砌墓室与一间小木屋，四周是成片墓碑与铁栅栏，火盆点着绿火
absent = [
    "暖橙火光、火把、烛火、灯笼与窗灯（唯一人工光源是墓室门前两盆幽绿火）",
    "教堂、钟楼、石墙城镇与多层建筑（这里只有一座墓室、一间木屋）",
    "湖面、河流与海面（湖在东北被林子挡住，海在西面山后只剩海雾）",
    "栖架上挂着的蝙蝠与任何动物（属 shot 层）",
    "旗帜与布幔上的纹章、骷髅徽记、文字",
    "晴天、蓝天与直射阳光",
    "新鲜的血迹、正在被掘开的墓（推开的墓盖是多年前的旧痕）",
    "4.0.3a 后整区战役重写加的营地、攻城器械与军旗",
]

