# 芬里斯岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：原点 ＝ 区图 px (620, 108)；x = (px − 620) × 3.83，y = (py − 108) × 3.83（与 bg247 同一比例）。
# 岛轮廓（开口朝东的月牙）从区图量取；湖面用逐行 [[water]] 把岛以外的部分铺满，地面底色即岛。

[meta]
bg = "bg260"
name_zh = "芬里斯岛"
size_m = [500, 580]
px_per_m = 2.8
grid_m = 50
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算，3.83 m/px）；岛轮廓量自区图 px x 630–742、y 118–251，东西约 430 m、南北约 510 m"
# 世界树画面：洛丹米尔湖心的岛，陡坡上长着黑松，山顶一座庄园的轮廓
absent = ["桥（全岛无桥，只能泅渡）", "码头 / 栈桥（渡口在西岸，属 bg255）", "渡船 / 帆船 / 任何船", "车辙道路", "农田与农舍", "村落", "雪", "阔叶林", "溪流 / 瀑布", "窗灯与任何火光（白天默认态；夜间窗灯属 bg250）", "对岸的山（永远隐在雾里）"]

