# 北流海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：原点 ＝ 区图 px (318, 100)；x = (px − 318) × 3.83，y = (py − 100) × 3.83（与 bg247 同一比例）。
# 海岸线从区图量取；海面用逐行 [[water]] 铺满海岸线以西。bg261 洼地与 bg267 洞口按世界树坐标换算落点。

[meta]
bg = "bg262"
name_zh = "北流海岸"
size_m = [400, 600]
px_per_m = 2.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算，3.83 m/px）；海岸线量自区图 px x 318–422、y 100–257；世界树无本子区域坐标，南北范围（界山脚→伸进海里的南岭）为推定"
# 世界树画面：西北海岸的碎石滩，浪灰白，崖上是松林
absent = ["船 / 帆 / 码头 / 栈桥", "灯塔与任何火光 / 人工光", "房屋与任何人造物", "道路（只有碎石滩可走）", "金黄沙滩与碧蓝海水", "沙滩椰林", "海平线（永远没进雾里）", "雪", "阔叶林", "翠绿草地"]

