# 伊瓦农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1625, 500)。西侧山坡与北边小径取自 bg247 terrain.toml（区图量取）。
# 木屋位置取 bg247 的推定块（区图死麦田西南那枚木屋图标）；屋内外各件的摆法按世界树画面「小块田地与一间歪斜木屋，屋后堆着南瓜」推定。

[meta]
bg = "bg256"
name_zh = "伊瓦农场"
size_m = [200, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地 200 m 见方按小农家 + 周边清地推定；区图上只有一枚木屋图标，无一手尺寸"
# 世界树画面：小块田地与一间歪斜木屋，屋后堆着南瓜
absent = [
    "水井、水塘、溪流与任何水体（湖在东北更远处的林子后面，本场地看不到）",
    "第二间木屋、谷仓与石砌建筑（这里只有一间屋和一个柴棚；塌谷仓属北边的死麦田）",
    "长着的活庄稼、丰收的南瓜田（瓜藤全枯，南瓜是没人收的旧瓜）",
    "稻草人（人形轮廓出图易被读成人物）",
    "炊烟、窗灯、火堆与任何人工光源",
    "晴天、蓝天与直射阳光",
    "大路路面（大路在东面缓坡外，不入画）",
    "4.0.3a 后北部改建的军营与营帐",
]

[[ridge]]
name = "西侧山坡（西北山地东麓）"
poly = [[0, 0], [81, 0], [54, 75], [61, 152], [132, 200], [0, 200]]
height_m = 45
src = "地图量取"

[[road]]
