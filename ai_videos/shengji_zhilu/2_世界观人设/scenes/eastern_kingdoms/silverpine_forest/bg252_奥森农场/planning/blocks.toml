# 奥森农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1620, 1210)。坐标表点位 [46, 52] → 本地 (147, 121)。
# 裁切图：红十字落在中西山地里一块颜色稍浅的洼地，屋子图标在其正南约 60 m；大路支路从东拐进来止于洼地东口（bg247 terrain 地图量取段）。
# 三面山坡的轮廓按裁切图的洼地推定；屋、井、晾衣绳的摆法按世界树画面「两间木屋一口井，院子里晾着破布」推定。

[meta]
bg = "bg252"
name_zh = "奥森农场"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地 300 × 260 m 取「山坳洼地 + 东口一段支路」；区图只有一枚屋子图标，无一手尺寸"
# 世界树画面：路西的小农庄，两间木屋一口井，院子里晾着破布
absent = [
    "湖、河、溪与水塘（湖在东北更远处；场地里唯一的水是井）",
    "大路路面（大路在东口外约两百米的林子后面，不入画）",
    "谷仓、大片麦田与南瓜堆（那是北部几座农场的标志，本档只有一块荒菜地）",
    "第三栋建筑、石砌房屋（这里只有两间原木屋）",
    "稻草人（人形轮廓出图易被读成人物）",
    "炊烟、窗灯、火堆与任何人工光源",
    "晴天、蓝天与直射阳光",
    "4.0.3a 后的营帐、战线工事与攻城器械",
]

