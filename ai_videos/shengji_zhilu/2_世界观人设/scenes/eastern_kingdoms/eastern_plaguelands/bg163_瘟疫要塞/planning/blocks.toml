# 瘟疫要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg163"
name_zh = "瘟疫要塞"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "推定"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (1215.8, 413.7)，石台落在 (200, 200)，即区级自动块 b163（坐标表 [40, 26]）；土路按 bg142 terrain.toml「病木林路」平移、城墙转角按区级块 b901 的东南角平移（±60 m）。石台 / 尖柱 / 骨垄尺寸与黑色尖塔位置无一手出处，推定"
grid_m = 50
# 世界树画面：病木林中一座露天的石砌传送尖塔，塔心地面刻着发绿光的符文圆环，塔外是成圈的骨堆
absent = [
    "任何人物与动物（默认空台）",
    "传送光柱、冲天绿光、发光的尖柱（唯一的光是台心符文圆环贴地的一层幽绿微光）",
    "太阳、蓝天与直射硬光（天空是整层暗红云）",
    "火堆、火把、烛火、灯笼",
    "绿叶、草地与活树（林子全部病死）",
    "屋顶或穹顶（石台露天，尖柱柱顶不合拢）",
    "第二座浮空要塞（3.0 的另一座浮空堡垒不属 1.12）",
    "冰雪、冰霜巨龙骨架（那是要塞内部，不在地面）",
    "文字、路牌与旗帜纹章",
]

