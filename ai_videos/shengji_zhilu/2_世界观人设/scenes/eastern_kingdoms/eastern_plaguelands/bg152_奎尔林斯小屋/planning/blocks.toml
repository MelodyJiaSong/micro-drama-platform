# 奎尔林斯小屋 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg152"
name_zh = "奎尔林斯小屋"
size_m = [240, 260]
px_per_m = 5.0
scale_src = "推定"
scale_note = "世界树无坐标；院子中心取区级平面图地图量取块 b904 (1679.6, 537.2)，落在本场地 (120, 170)，场地原点 ＝ 区级 (1559.6, 367.2)。北缘山地山脚按区级 terrain.toml 平移（±60 m）；院子与屋子尺寸按「一座长屋两间小屋」的规模推定"
# 世界树画面：北部林边的高等精灵木屋群，蓝金配色的尖顶与雕花立柱，院里立着精灵样式的灯柱
absent = [
    "任何人物与动物（默认空院）",
    "点亮的灯柱、透灯的窗、火堆、烛火（白天零人工光）",
    "废墟、塌房、烧痕（这是有人打理的完好聚落）",
    "太阳、蓝天与直射硬光",
    "训练假人（旧世没有）",
    "飞行点栖架与飞行坐骑",
    "文字、路牌与旗帜纹章",
]

[[ridge]]
name = "北缘山地山脚（锈红紫褐裸岩，区界封死）"
