# 北地哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标表点位 [57, 24] 落在本场地塔心 (80, 80)。区级平面图：北路在塔东约 60–70 m 南北纵贯（地图量取）；
# 中北小山北缘在塔南约 60–80 m（地图量取）；裁切图上塔图标东南有道路分岔，岔路向西南。

[meta]
bg = "bg150"
name_zh = "北地哨塔"
size_m = [200, 180]
px_per_m = 4.0
scale_src = "推定"
scale_note = "塔身 13 m 见方、五层约 22 m 按人类方石哨塔常规尺度推定（比东墙哨塔高一层，四塔中最完整）；塔与北路、南侧小山的距离为区图量取（±60 m）；井、石桩、马棚位置为推定"
# 世界树画面：北部路口的石塔，塔身最完整，塔前有一口废井与拴马的石桩
absent = [
    "任何人物、驻军、尸体、马匹与坐骑（默认空塔）",
    "飞行点栖架与飞行管理员（旧世四塔都不是飞行点，4.0.3 才是）",
    "塌落的垛口与塔身裂缝（四塔中唯一完整的一座）",
    "旗帜、纹章与路标上的任何文字",
    "火、火把、火盆、亮着的塔窗与炊烟",
    "太阳、蓝天与直射硬光",
    "绿草地与活着的树",
    "井里的清水与转动的辘轳",
    "北面出区的通路（北路止于封死的北缘山地）",
]

[[ridge]]
name = "北缘锈红山脊坡脚（区界北缘山地方向）"
poly = [[0, 0], [200, 0], [200, 22], [150, 30], [90, 26], [30, 20], [0, 24]]
height_m = 20
src = "推定"

[[ridge]]
name = "中北小山北坡（塔南紧贴的焦土小山）"
poly = [[0, 128], [40, 116], [90, 120], [126, 138], [130, 180], [0, 180]]
height_m = 14
src = "地图量取"
note = "区级 terrain「中北小山（北哨塔以南）」的北缘；北路从它东侧绕过"

[[road]]
name = "北路（北端止于北缘山地，南下接病木林路与考林路口）"
path = [[138, 0], [140, 50], [141, 90], [146, 130], [160, 180]]
width_m = 7
src = "地图量取"
note = "塔东约 60 m"

[[road]]
