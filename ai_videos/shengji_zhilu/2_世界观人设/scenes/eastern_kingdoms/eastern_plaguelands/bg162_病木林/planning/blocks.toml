# 病木林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg142）的 (600, 450)；城墙、林区外廓、两条土路、南侧山带与哨塔 / 石台的坐标都从区级 blocks / terrain.toml 平移过来。
# 两座黑色阶梯尖塔取自区图林中的尖塔图标（像素经区级 terrain.toml 的框差式换回世界树框）。

[meta]
bg = "bg162"
name_zh = "病木林"
size_m = [1000, 600]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "林区外廓按区图 (15–36%, 19–32%) 的病死林区经框差式换回世界树框 ≈ 840 × 350 m；哨塔（bg151）与尖柱石台（bg163）取自坐标表；城墙、土路、南侧山带取自区级平面图；雾洼、倒木、木栅、机位岩肩推定"
# 世界树画面：西北一片病死的森林，树干发黑、树冠只剩枯枝，林间浮着绿色孢子雾，抬头能看见天上悬着的黑色要塞
absent = [
    "任何活树 / 绿叶 / 草地 / 灌木（整片林子全死，只有枯枝）",
    "漫过林梢的浓雾（孢子雾只积在低洼、到树干半腰；吞没一切的浓雾是西边废镇 bg154 的标志）",
    "河 / 湖 / 溪流（林中没有水系）",
    "发光的符文圈 / 塔顶绿火 / 窗口绿光（分属 bg163 / bg164 / bg151，本档画面零发光）",
    "太阳 / 蓝天 / 直射光",
    "火 / 烛火 / 灯笼 / 炊烟 / 任何人工光源",
    "人物 / 骑兵 / 马 / 鸟 / 蜘蛛 / 任何生物",
    "飞行坐骑 / 飞行点栖架（旧世本区只有东南教堂旁一处）",
    "雪 / 冰 / 雨",
]

