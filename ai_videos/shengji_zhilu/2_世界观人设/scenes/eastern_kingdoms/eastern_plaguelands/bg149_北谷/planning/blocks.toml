# 北谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b906（区图两枚房屋图标，地图量取）落在本场地中部 (130, 110)。东缘大山坡脚、南缘小湖北岸按区图相对方位量取；
# 街巷走向与房屋数量是按世界树「成排的石墙房子只剩外壳，街道被塌下的屋梁堵住」推定。

[meta]
bg = "bg149"
name_zh = "北谷"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级块 b906 为 180 m 见方（区图两枚房屋图标的跨度，±60 m）；本场地外扩到 260 × 220 m 以装下东缘大山坡脚与南缘湖岸。墙壳单栋约 10–12 m 按人类乡镇石屋常规尺度推定"
# 世界树画面：北部山谷里的村镇废墟，成排的石墙房子只剩外壳，街道被塌下的屋梁堵住
absent = [
    "任何人物、亡灵、尸体与动物（默认空镇）",
    "完整的屋顶、亮着的窗、炊烟",
    "火、火把、火盆、烛火与任何人工光源",
    "太阳、蓝天与直射硬光",
    "绿草地、活着的树与在耕的菜园",
    "旗帜、招牌、纹章与任何文字",
    "东出镇子的路（主街东端撞上大山坡是死路）",
    "城墙与塔楼（镇子没有围墙）",
    "清澈的水面（坡下小湖是墨黑死水）",
]

[[ridge]]
name = "东缘大山坡脚（东北大山块西麓）"
poly = [[222, 0], [260, 0], [260, 220], [238, 220], [230, 170], [214, 120], [212, 70]]
height_m = 40
src = "地图量取"
note = "区图上房屋图标东侧紧贴大山块山影；主街东端撞坡即止"

[[ridge]]
name = "北缘缓坡（往上通阶梯石台遗迹所在的山肩）"
poly = [[0, 0], [222, 0], [212, 40], [150, 48], [60, 44], [0, 36]]
height_m = 15
src = "推定"

[[water]]
