# 达隆米尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取的是区级湖面（terrain.toml 达隆米尔湖 path）的东端：湖在区级是一条西北西—东南东走向的长湖，东端向西南回卷，
# 西南山地从北、东两面把它包住，界河在湖的西北角入湖。区级湖面与山地多边形有重叠（示意精度），本场地按
# 「河口在西北、山脚在东、湖向西与西南出场地」重摆，一律 src = 推定。
# 场地外、只作远景：北缘之外河上游的石桥（区唯一陆路入口，属 bg170）；西面极远湖心岛的残墙（属邻区）。

[meta]
bg = "bg158"
name_zh = "达隆米尔湖"
size_m = [600, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区级湖宽约 300 m、界河宽约 45 m；本场地取湖东端 600×480 m，岸线与芦苇滩宽度按区图左下那片水面的形状推定，待实机核"
# 世界树画面：达隆米尔湖伸进东瘟疫之地一侧的水面，灰绿色、岸边全是枯死的芦苇
absent = [
    "任何人物、动物、鱼与水鸟",
    "任何火与人工光源（湖水、薄雾、稠液都不发光）",
    "对岸（湖向西一眼望不到头）",
    "船、码头、栈桥、渔网",
    "绿草、活芦苇、活树（芦苇全枯、树全死）",
    "近在眼前的湖心小岛（那是东南的米雷达尔湖；本档湖心岛只在极远雾里）",
    "墨黑油膜死水与成片泡烂树桩林（那是东北的黑木湖）",
    "可以扎营的平地、帐篷、营火",
    "太阳、蓝天、直射硬光",
    "波浪、急流、瀑布（湖面只有极轻的涟漪）",
]

