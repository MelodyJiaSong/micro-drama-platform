# 黑木湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b911 湖心 (2561, 817) 落在本场地 (180, 170)；本场地原点 ＝ 区级 (2381, 646)。
# 区级本身就是推定（区图两片无名小湖二选一），所以本卡一律 src = 推定；东北大山块西麓按区级多边形平移。

[meta]
bg = "bg157"
name_zh = "黑木湖"
size_m = [360, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "湖形（十字形、中心宽约百米）按区图 (61–64%, 25.5–29%) 那片小水面的形状与区级平面图 90 m 水宽推定；湖的认定本身待实机核"
# 世界树画面：一潭近乎墨色的死水湖，湖面浮着一层油膜，岸边立着成片泡烂的枯树桩
absent = [
    "任何人物、动物、鱼与水鸟",
    "任何火与人工光源（湖水、油膜、稠液都不发光）",
    "波浪、流水、瀑布（水面死静）",
    "船、码头、桥",
    "绿草、芦苇、活树（岸边只有泡烂的枯桩）",
    "清澈的水与湖心小岛（那是东南的米雷达尔湖）",
    "一眼望不到头的大水面（那是西南的达隆米尔湖）",
    "太阳、蓝天、直射硬光",
]

