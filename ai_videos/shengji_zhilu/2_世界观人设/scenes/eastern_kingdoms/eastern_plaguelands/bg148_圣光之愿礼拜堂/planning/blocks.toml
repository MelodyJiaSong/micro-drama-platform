# 圣光之愿礼拜堂 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标表点位 [82, 59]（＝联盟飞行点 TaxiNodes 67）落在本场地教堂中心 (130, 88)；部落飞行点 TaxiNodes 68 [80, 57] 相对它
# 西 2% × 35.4 m ≈ 71 m、北 2% × 23.6 m ≈ 47 m → (60, 42)。整个场地在 bg142 东部斜脊多边形的北端之内（丘顶）。

[meta]
bg = "bg148"
name_zh = "圣光之愿礼拜堂"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "坐标表"
scale_note = "两处飞行点坐标差（≈71 × 47 m）定下营地跨度；教堂 26 × 14 m、帐篷 8 × 6 m、墓地 40 × 22 m 按形制推定；魔刃之痕东沿距教堂约 110 m 按 bg142 区级平面图量取"
# 世界树画面：焦土荒原中一小块仍是绿色的圣地，白石小教堂立在中央，彩窗透出暖光，四周围着银色黎明的帐篷与拒马
absent = [
    "任何人物、狮鹫、蝙蝠与坐骑（默认态两处栖架都空着）",
    "石墙要塞、塔楼、大型营房与城门（旧世只有小教堂 + 帐篷营地）",
    "旗帜、纹章、墓碑刻字与任何文字标识",
    "营火、火把、灯笼与户外烛台（唯一人工光是教堂彩窗里的烛光）",
    "太阳、蓝天与直射硬光",
    "繁茂的花草、绿树与鲜亮的翠绿（草色是发黄的暗绿）",
    "水面（本场地无水）",
]

