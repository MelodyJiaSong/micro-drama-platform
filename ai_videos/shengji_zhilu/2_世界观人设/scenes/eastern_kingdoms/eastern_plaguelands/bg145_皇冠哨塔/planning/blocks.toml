# 皇冠哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg145"
name_zh = "皇冠哨塔"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "塔本体约 10 × 10 m、三层约 14 m；场地放到 240 m 以装下塔西南约百米的岔口、南下支路与南面山地北麓。塔在区级平面图 b145 [1416, 1770]（坐标表 [40, 75]），本图原点 ≈ 区级 [1306, 1680]；西路与达隆郡支路按区级 terrain.toml 换算；无一手尺寸出处"
# 世界树画面：南部路边一座方形石塔，外墙有箭孔，塔基周围堆着沙袋与破损的旗杆
# 区级平面图：西路自西南来、贴塔南侧向东北去考林路口；达隆郡支路在区级 [1339, 1839] 岔出南下
absent = [
    "任何人物、坐骑与动物（默认无主空塔）",
    "阵营旗帜与纹章（旗杆上只剩褪色碎布）",
    "飞行栖架、驯养的飞兽（旧世这里不是飞行点）",
    "火盆、火把、灯笼、箭孔里的灯光与任何人工光源",
    "塌掉的垛口（本塔垛口完整；塌一角的是东墙哨塔）",
    "路牌文字与任何文字标识",
    "蓝天、太阳、直射硬光",
    "翠绿草地、活树、水面",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "南面山地北麓（锈红裸岩，山坳口在西南）"
poly = [[70, 240], [110, 222], [170, 210], [240, 200], [240, 240]]
height_m = 30
src = "推定"
note = "区级南界山墙与西南山地在塔南一两百米外；场地内只画北麓一角，山坳口在支路出场处"

[[road]]
