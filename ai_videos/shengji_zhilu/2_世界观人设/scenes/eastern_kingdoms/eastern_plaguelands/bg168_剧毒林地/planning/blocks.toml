# 剧毒林地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b912（500 × 360 m，推定）：区图东北只画了山影，按世界树「东北一片死林」放进东北大山块之中。
# 本场地整体都是推定：三面山墙 + 西南山口（朝北谷方向）的盆地形状，按「大山块里的林间开阔地」推定。

[meta]
bg = "bg168"
name_zh = "剧毒林地"
size_m = [600, 440]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区级块 b912 为 500 × 360 m（推定，位置未核）；本场地外扩到 600 × 440 m 以装下三面山墙与西南山口。树高 14–20 m、合抱粗细按温带阔叶林常规尺度推定"
# 世界树画面：东北一片死林，树皮剥落露出灰白木质，地面覆着一层黄绿色的毒粉
absent = [
    "任何人物、亡灵、尸体与动物",
    "任何建筑、营地、围栏、道路与人造物",
    "活着的树、绿叶、新芽、苔藓与菌伞",
    "焦黑树干与贴地绿色孢子雾（那是西北病死枯林的长相）",
    "发光的液体、荧光与任何自发光（稠液只湿亮）",
    "火、烛火、灯笼与任何人工光源",
    "太阳、蓝天与直射硬光",
    "流动的水（旧溪沟早已干涸）",
    "除西南山口之外的任何出入口",
]

