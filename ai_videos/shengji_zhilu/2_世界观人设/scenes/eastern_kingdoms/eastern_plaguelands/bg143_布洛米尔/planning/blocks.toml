# 布洛米尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg143"
name_zh = "布洛米尔"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "磨坊院落本体约 100 × 80 m（塔 + 碾房 + 农舍 + 谷仓 + 荒田）；场地放到 240 m 以装下东面斜脊西麓、南缘东路与西南角裂谷北端豁口。院落在区级平面图 b143 [2725, 1204]，本图原点 ≈ 区级 [2605, 1114]；无一手尺寸出处"
# 世界树画面：东部一座废弃的磨坊，风车叶片只剩骨架，磨坊旁堆着发霉的麦袋
# 区级平面图：东部斜脊（x ≥ 2822）在院子以东约 100 m；魔刃之痕北端在院子西南；东路在院子南缘东西向经过
absent = [
    "任何人物与动物（默认空院，不拴马、不养牲口）",
    "转动的风车叶片 / 完好的帆布叶面（只剩停住的木框骨架）",
    "在耕的田、青苗、炊烟",
    "亮着的窗火、火堆、灯笼与任何人工光源",
    "东南残绿草地与白石教堂（被斜脊挡在视线之外）",
    "蓝天、太阳、直射硬光",
    "水车、磨坊水渠、河流（这是风力磨坊，院里没有水）",
    "旗帜纹章与任何文字招牌",
    "4.0.3a 后的任何改动",
]

