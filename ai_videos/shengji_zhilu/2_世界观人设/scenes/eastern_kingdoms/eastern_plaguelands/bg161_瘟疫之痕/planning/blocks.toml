# 瘟疫之痕 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg142）的 (1680, 1440)；沟群外廓、北侧矮秃山与西路从区级 blocks / terrain.toml 平移过来。
# 裂沟用 [[water]] 表示「积着稠液的沟」：width_m ＝ 沟口宽，depth_m ＝ 沟深（沟底只积约半米稠液）。

[meta]
bg = "bg161"
name_zh = "瘟疫之痕"
size_m = [480, 360]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "沟群外廓按区图 (42–50%, 52–60%) 的树根状裂沟图案、经区级 terrain.toml 的框差式换回世界树框 ≈ 320 × 220 m；北侧矮秃山与西路位置取自区级平面图；主沟 / 支沟的走向与宽深、土丘与遗留物位置推定"
# 世界树画面：另一条较浅的瘟疫裂沟，沟沿翻起干裂的土块，沟里积着暗绿色的稠液
absent = [
    "深谷 / 陡崖 / 翻涌的脓浆（那是东部的大裂谷 bg167，本沟浅、斜坡壁、稠液静止）",
    "发光的绿色液体（本沟稠液暗绿、不发光，只映天色）",
    "流水 / 河 / 桥（沟底是死水般的稠液，不连任何水系）",
    "房屋 / 废墟 / 栅栏（四路交汇的废镇在场地东边界外，不入本档）",
    "活树 / 草地 / 灌木（只有枯焦倒木与树桩）",
    "太阳 / 蓝天 / 直射光",
    "火 / 烛火 / 灯笼 / 炊烟 / 任何人工光源",
    "人物 / 骑兵 / 马 / 鸟 / 任何生物",
    "雪 / 冰 / 雨",
]

[[ridge]]
name = "北侧矮秃山（区级「中部小山」南麓）"
poly = [[0, 0], [330, 0], [300, 30], [220, 74], [120, 62], [0, 50]]
height_m = 90
src = "地图量取"
note = "区级 terrain.toml「中部小山」平移后的南半；锈红与紫褐裸岩，无活树；沟群北缘紧挨它"

[[road]]
