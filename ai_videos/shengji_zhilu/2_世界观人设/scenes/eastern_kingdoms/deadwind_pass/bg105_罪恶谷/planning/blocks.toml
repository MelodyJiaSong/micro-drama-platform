# 罪恶谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg105"
name_zh = "罪恶谷"
size_m = [300, 420]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区图谷袋 56–61%,58–72%（区级 b901 约 260 × 300 m）外扩到两壁与南山墙：东西 300 m、南北 420 m；腰口约 30 m 宽按世界树「两侧崖壁向中间挤压、像被钳住」推定，无一手尺寸出处。场地原点 ≈ 区级坐标 (1180, 830)"
# 世界树画面：两侧崖壁向中间挤压的窄谷，像被钳住一样，谷底堆着滚落的碎石与食人魔的粗木栅
# 区图：东绕行道从西北口进袋、穿谷袋、从西南口折向塔下盆地；营寨图标 59%,61% 在袋口（另档 bg101）
absent = [
    "任何人物、动物与尸骨",
    "营寨的帐篷、兽皮棚与火塘（属 bg101，不入本档画面）",
    "火、营火、火把、烛火、灯笼与任何人工光源",
    "河、溪、水潭与桥",
    "南端高塔（被南山墙与西侧岩丘挡住）",
    "活的绿叶树、草地与灌木",
    "旗帜、图腾、徽记与任何文字",
    "4.0.3a 后的任何改动",
]

[[ridge]]
