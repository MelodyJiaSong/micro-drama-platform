# Newman's Landing · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg121"
name_zh = "Newman's Landing"
size_m = [220, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；区图上只是西缘海岸线的一小段（地图不显示此地）。湾宽约百米、码头约五十米按世界树画面与常识推定"
# 世界树画面：西海岸一处被雪山从内陆完全挡住的小海湾，灰绿海水拍着一座朽烂的木码头，岸上孤零零一栋人类样式的破木屋，门口一台锈蒸馏器、几只谷箱，路牌上还卡着一把斧头，水下沉着半条小船
absent = ["通往内陆的路（只能从海上到达）", "第二栋房屋 / 任何聚落", "任何驻扎者与营火", "亮着的灯 / 冒烟的烟囱 / 蒸馏器下的火", "新建或完好的船", "河流与冻湖", "人物与动物"]

