# 南门哨岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 路自西向东穿隘路口取自区级 terrain.toml（南门支路）与区图裁切；哨所院落、塔、炮、旗杆落位推定。

[meta]
bg = "bg114"
name_zh = "南门哨岗"
size_m = [160, 120]
px_per_m = 8.0
scale_src = "推定"
scale_note = "路口哨所：木栅小院约 34 × 19 m、圆塔 8 m 径；场地取 160 × 120 m 装下西侧来路与东侧隘路前段（隘路宽约 40 m，岩壁较低）；无一手尺寸出处"
# 世界树画面：隘路口一座石塔与木栅栏哨所，门口架着一门小火炮，旗杆上是铁炉堡旗
absent = [
    "炮口火光、硝烟与任何人工光源（白天默认态，火炮是冷的）",
    "正在下的雨与雪（泥浆是车轮碾化的旧雪）",
    "高耸岩壁与背阴冻雪道（那是北门小径；本隘路岩壁低、开阔）",
    "方形石塔与石砌矮墙（本哨所是圆筒塔 + 木栅）",
    "旗帜与炮身上的文字",
    "隧道口与大型石门",
    "任何人物与牲口（空哨所底图，守卫属 shot 层）",
]

