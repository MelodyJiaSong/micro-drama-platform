# 灰色洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 洞内各室是山体底下的地下空间：xy/size 为投影 footprint，h_m 为洞顶净高。

[meta]
bg = "bg123"
name_zh = "灰色洞穴"
size_m = [440, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区外环境（大路弯、东侧上行段、北侧岩丘）按区图裁切量取：裁切 1 px ≈ 1.4 m（以主镇相对坐标 [41,60] 的位移标定，区图 1 px ≈ 4.494 m）；洞内各室按微型地下城图的相对形状推定，洞体总跨度取约 120 m"
# 世界树画面：南坡林间一处敞口熊窟，洞口垂着冰凌与枯藤，洞内是踩实的泥地、散落的骨头与湿毛皮的腥气
absent = ["任何人造物（门、栅栏、火塘、帐篷、木支架）", "火光 / 火把 / 灯笼 / 洞内任何光源", "房屋（主镇在东北约 250 m 外）", "冻塘与水面（小冻塘在场地东外约 100 m）", "血迹与新鲜尸骸", "熊与任何动物（属 shot 层）", "第二个出入口"]

