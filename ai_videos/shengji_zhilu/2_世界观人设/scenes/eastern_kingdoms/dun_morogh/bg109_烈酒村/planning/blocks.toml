# 烈酒村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg109"
name_zh = "烈酒村"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "营地按四顶帐篷半圈 + 圈心铜锅的规模推定（帐篷圈约 40 m）；场地取营地 + 东北冻湖一角（区图裁切量得湖西岸距营地约 20–25 m、两座小岛在营地东北约 110–190 m）+ 南面锚点机位（圈心正南约 40 m 的车辙路上）。西北约 340 m 外岩壁上的金属圆门出场地，只入远景"
# 世界树画面：雪地上几顶帆布帐篷加一圈篝火，中间架着一口冒泡的酿酒铜锅，旁边横七竖八堆着空酒桶
# 「一圈篝火」与「中间架着铜锅」按同一处写：石圈火上吊着铜锅（唯一人工光源）
absent = [
    "任何房屋与石砌建筑（名为村、实为营地）",
    "任何人物、动物（默认空营，平板车卸了牲口）",
    "帐篷里的灯光、火把、灯笼（唯一人工光源是锅底一小堆柴火）",
    "木栅、寨墙与大门",
    "旗帜纹章、招牌与任何文字标识",
    "湖面化开的活水（湖面冻实）",
    "侏儒新城镇与机械建筑（4.0.3a 后）",
    "飞行点与狮鹫栖木",
]

