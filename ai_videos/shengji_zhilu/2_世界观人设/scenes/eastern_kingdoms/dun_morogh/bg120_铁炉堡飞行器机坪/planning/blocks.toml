# 铁炉堡飞行器机坪 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg120"
name_zh = "铁炉堡飞行器机坪"
size_m = [360, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "谷长取原版区图北墙山地里那道南北向细长条带（约 [70–72, 15–30]，≈ 15% × 3002 m ≈ 450 m）；谷宽与建筑尺寸无一手出处，按世界树画面推定"
# 世界树画面：铁炉堡东北高处一片被雪峰环抱的山间平谷，两条压实的雪地跑道并排铺开，旁边几栋石砌矮人营房与木塔，停机位上蹲着侏儒式的螺旋桨飞行器，天光冷白、雪面反光刺眼
absent = ["飞行点 / 狮鹫栖架（4.0.3a 才有）", "机场失火与烟柱（4.0.3a 剧情）", "通往这里的车路（1.12 无路可达，只能爬山）", "亮着的信号灯 / 窗内灯光 / 火", "河流与湖", "云杉林带（高处只有零星矮松）", "人物与动物"]

