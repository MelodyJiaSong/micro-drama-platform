# 寒风峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 坐标 [36, 54]；区图裁切约 1 px ≈ 1.1 m（裁切）：两道带岩洞图标的山影脊自西南斜向东北，西侧一条南北车道。
# 锚点机位：谷西南口雪路约 [200, 305]，离地一人高，顺谷轴朝东北。
# 东北端南脊上的岩洞口（裁切 [610, 225]）属灰色洞穴 bg123，出场地东缘，本档不画。

[meta]
bg = "bg116"
name_zh = "寒风峡谷"
size_m = [600, 420]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "两脊走向、岩洞口与西侧车道按区图裁切（约 1.1 m / 裁切像素）量取；谷宽一百来米、东北口收窄到约 60 m、北脊高约 35 m、南脊高约 60 m 为推定"
# 世界树画面：通往诺莫瑞根的那条风口谷地，两侧灰岩壁夹着一条被风吹净的雪路，谷底立着侏儒的废弃管道与歪掉的路标
absent = [
    "任何人物、动物与穴居生物（默认空谷）",
    "房屋、帐篷与营地（谷里没有聚落）",
    "路牌上的文字与任何字迹（牌面磨白）",
    "火、火把、灯笼与岩洞里的光",
    "漫天风雪与浓雾（只有贴地细雪流）",
    "绿草地、阔叶树与不结冰的流水",
    "训练假人与飞行点（4.0.3a 以后）",
]

[[ridge]]
name = "北脊（较矮较碎的灰岩脊，薄板状岩层）"
