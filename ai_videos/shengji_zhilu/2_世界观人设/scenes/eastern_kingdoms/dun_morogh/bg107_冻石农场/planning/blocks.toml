# 冻石农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [64, 51] 落在本场地 (120, 110)；区图裁切 1 px ≈ 1.1 m（区图 1 px ≈ 4.5 m，裁切放大约 4 倍）。

[meta]
bg = "bg107"
name_zh = "冻石农场"
size_m = [240, 220]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区图裁切量取：农舍图标在点位西北约 (−34, −50) m，北侧山脚距点位约 70–90 m，支路自南向北约 100 m 进场；栅栏 / 棚屋 / 草垛尺寸按矮人牧场常识推定"
# 世界树画面：雪坡上一圈木栅栏围出的牧场，棚屋顶压雪，围栏里站着长毛白羊与几头矮种山羊
absent = [
    "任何动物（默认空牧场，羊群属 shot 层）",
    "任何人物",
    "火、烛火、灯笼与烟囱冒烟（白天户外零人工光源）",
    "节庆帐篷、酒桶摊与赛道（季节活动不属默认态）",
    "水面（附近无湖，只有冻成冰的水槽）",
    "阔叶树与草地",
    "飞行点与狮鹫栖木",
    "文字、招牌与旗帜纹章",
]

