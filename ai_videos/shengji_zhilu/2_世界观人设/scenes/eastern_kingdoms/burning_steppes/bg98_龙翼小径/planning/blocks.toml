# 龙翼小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图（bg89）坐标 (2200, 470)：本地 x = 区 x − 2200，本地 y = 区 y − 470。
# 2026-09-25 场景总审：wiki 龙翼小径 ＝「燃烧平原东部的谷地」，北端通滑石小洞 → 巨槌石岩丘东崖与东山墙之间的南北向窄谷（区级 b909）。
#   岩丘东崖、东山墙、南山墙、东北角岩丘的轮廓由区级 terrain.toml 平移换算（地图量取）；小道、岩柱、蛋壳分布全部推定。
#   此前本图画的是东南角南山墙脚下的一条岩脊（≈1903,1122），已作废。

[meta]
bg = "bg98"
name_zh = "龙翼小径"
size_m = [400, 700]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "谷地范围取区级平面图 b909（推定，≈2405,820，110×600 m）外扩到 400×700 m；两侧山体轮廓取区级 terrain.toml（地图量取）；谷内一切布局无一手出处"
# 世界树画面：沿山脊延伸的窄道，两侧岩柱林立，黑龙与幼龙在头顶盘旋，地上散着新旧不一的龙蛋壳
absent = [
    "任何人物与动物（盘旋的龙与幼龙属 shot 层）",
    "熔岩、熔岩裂隙与任何暖色底光（谷里没有熔岩）",
    "火、篝火、火把、灯笼与任何人工光源",
    "护栏、石阶、营帐、建筑与任何人造物",
    "第三个出入口（只有南口与北端的小山洞）",
    "西北那座黑色火山锥（被岩丘挡住，谷里看不到）",
    "任何水体、草木与绿色",
    "4.0.3a 之后的改动（例如穿过谷地东南段的地精山口通道，1.12 没有）",
]

