# 烈焰峰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级平面图 b902 的范围（中心 ≈ 1759, 409，220×200 m）；本场地原点 ≈ 区级 (1649, 309)。
# 北山墙与熔岩河北源的相对方位按区图量取；岩台轮廓、帐篷布局、小道走向无一手出处，全部推定。

[meta]
bg = "bg91"
name_zh = "烈焰峰"
size_m = [220, 200]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地外框取区级平面图 b902（区图图标 65.7%, 22.9% 处 220×200 m）；岩台约 130×75 m、高出平原约 60 m 与营内各帐尺寸按小型前哨常识推定"
# 世界树画面：火山岩台地上的小型部落前哨，几顶兽皮帐与一根图腾柱，红旗被热风吹得笔直，脚下岩缝透出橘光
absent = [
    "任何人物、坐骑与动物（栖架上空无一物）",
    "火把、篝火、灯笼与明火（火塘默认是冷灰余烬）",
    "草、树与任何绿色植被",
    "任何水体（崖下那条是熔岩河，不是河水）",
    "围栏、城墙、石屋与铁刺寨墙（这是兽皮帐前哨，不是营寨）",
    "第二条上下岩台的路（唯一通道是西南角之字小道）",
    "4.0.3a 之后的营地改建与新增设施",
]

