# 滑石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图（bg89）坐标 (2380, 470)：本地 x = 区 x − 2380，本地 y = 区 y − 470。
# 2026-09-25 场景总审：wiki 滑石 ＝「燃烧平原最东北角的一个小山洞」（在龙翼小径谷地尽头），区图东北角东山墙脚下的小图标即它（b908 ≈ 2500,564）。
#   此前本图画的是平原中北那道无名熔岩裂隙（≈1296,762），已作废。蛇形岩脊保留世界树「盘曲如蛇身」的长相，作洞所在的岩体。

[meta]
bg = "bg97"
name_zh = "滑石"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "洞口位置取区图图标（94.2%, 31.6%，地图量取）；东山墙走向取区级 terrain.toml；岩脊形状、洞口宽约 10 m、洞室进深约 35 m 无一手出处，按「小山洞」与世界树画面推定"
# 世界树画面：平原上一块盘曲如蛇身的长条岩脊，表面布满横向裂纹，岩缝里透出暗红
absent = [
    "任何建筑、营帐、祭坛、石堆与雕刻（纯自然地貌）",
    "任何人物与动物（洞里的住户属 shot 层）",
    "火、火把、灯笼、营火、洞内任何发光物（洞里只靠洞口漫进的天光）",
    "熔岩流、熔岩池（本谷没有熔岩，暖色只有岩脊横裂纹里的一线暗红）",
    "第二个出入口（东、北两面都是山墙，来路只在西南谷地）",
    "任何水体、草木与绿色",
    "4.0.3a 之后的任何改动",
]

