# 黑石要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级平面图 b901 的范围（中心 ≈ 1083, 575，300×260 m）；本场地原点 ≈ 区级 (933, 445)。
# 北山墙、西侧熔岩环、火山锥东麓的相对方位按区图量取；营内布局无一手出处，全部推定。

[meta]
bg = "bg90"
name_zh = "黑石要塞"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地外框取区级平面图 b901（区图图标 40.4%, 32.2% 处的营寨范围 300×260 m）；围栏 210×170 m 与营内各屋尺寸按兽人驻军营常识推定"
# 世界树画面：山脚下的黑石兽人营寨，黑铁尖刺围栏与烧红的炉膛，营中竖着黑色狼头旗，地面被踩成焦黑硬土
absent = [
    "任何人物、坐骑与动物（活营，但锚点图里一个人都没有）",
    "火把、篝火、灯笼与明火（唯一人工光源是锻炉里压着的暗红炭火）",
    "草、树与任何绿色植被",
    "任何水体（西侧那道是熔岩沟，不是河）",
    "石砌城墙与城堡（这是铁刺围栏围的营寨，不是城）",
    "第二道寨门（唯一出入口在南）",
    "4.0.3a 之后的营地改建与新增设施",
]

