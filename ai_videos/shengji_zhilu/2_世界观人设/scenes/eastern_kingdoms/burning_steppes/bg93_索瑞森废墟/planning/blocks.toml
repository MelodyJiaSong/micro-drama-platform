# 索瑞森废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级平面图 b904 的范围（中心 ≈ 1743, 620，420×340 m）；本场地原点 ≈ 区级 (1533, 450)。
# Y 形熔岩河三支与旧都岔道由区级 terrain.toml 平移换算（地图量取）；城内各残构无一手出处，全部推定。

[meta]
bg = "bg93"
name_zh = "索瑞森废墟"
size_m = [420, 340]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地外框取区级平面图 b904（区图 Y 形熔岩河与废墟标签 65%, 35% 处 420×340 m）；城内拱门、大厅、方塔、街屋尺寸按矮人式石城常识推定"
# 世界树画面：大片被熔岩吞掉一半的矮人城市废墟，石砌拱门与方塔焦黑倾斜，街道被凝固的岩浆封死，缝隙里仍透出橘光
absent = [
    "任何人物、驻军、营帐、旗帜与动物（空城）",
    "火把、篝火、灯笼、炉火与任何人工光源",
    "完整的屋顶与可用的建筑（全城只剩残壳）",
    "草、树与任何绿色植被",
    "任何水体（Y 形那条是熔岩河；凝岩壳是冷的，只有细缝透光）",
    "木构建筑与兽皮帐（这是整石砌的矮人式城）",
    "西、北、东三面的入口（唯一入口在南，其余被熔岩河与崖隔断）",
    "4.0.3a 之后的废墟改建与新增设施",
]

