# 德拉考达尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图（bg89）坐标 (720, 860)：本地 x = 区 x − 720，本地 y = 区 y − 860。

[meta]
bg = "bg95"
name_zh = "德拉考达尔"
size_m = [500, 500]
px_per_m = 3.2
scale_src = "推定"
scale_note = "场地取区级平面图 b906（≈968,1109，480 × 420 m）外扩到 500 × 500 m。两面山墙、熔岩溪与主干道由区级图 terrain.toml 平移换算（地图量取）；三级岩台、蛋壳区、爪痕沟、骨堆的位置与尺寸无一手出处，按世界树「熔岩湖边 · 岩台 · 暗红玻璃质」推定"
# 世界树画面：熔岩湖边的黑龙聚集地，岩台上卧着成年黑龙，热浪让空气不断扭动，地面呈暗红玻璃质
absent = [
    "龙与任何活物（锚点是空巢；龙作为角色在 shot 里另行入镜）",
    "任何人造建筑、营寨、围栏、祭坛（巢是天然岩台，没有搭建物）",
    "向南或向西的山口与道路（两面山墙封死，只有北面开口）",
    "火把、营火、灯笼（光只来自熔岩湖与熔岩溪）",
    "任何水体、草木与绿色",
    "4.0.3a 之后的任何改动",
]

