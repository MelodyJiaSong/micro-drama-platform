# 摩根的岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级平面图 b903 的范围（中心 ≈ 2251, 1219，220×180 m，本身就是推定）；本场地原点 ≈ 区级 (2141, 1128)。
# 南山墙轮廓取自区级 terrain.toml（坳底边界）；出区山口在场地西外约 70 m（区级 ≈ 2058, 1322）。营内布局全部推定。

[meta]
bg = "bg92"
name_zh = "摩根的岗哨"
size_m = [220, 180]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图无图标；场地外框取区级平面图 b903（按世界树「东南角 · 营外就是山口」+ 原典坐标约 84,68 推定），营地约 170×110 m 与各残屋尺寸按小镇民居常识推定"
# 世界树画面：东南角残破小镇上的联盟营地，石墙只剩半截，帆布帐搭在废墟之间，蓝旗插在焦土上，营外就是通赤脊山的山口
absent = [
    "任何人物、坐骑与动物（栖架上空无一物）",
    "火把、篝火、灯笼与明火（火塘默认冷灰）",
    "完整的屋顶与完好的房屋（小镇烧毁多年，只剩残墙与石基）",
    "草、树与任何绿色植被",
    "任何水体（枯井是干的，山口脚下那一线是熔岩裂隙）",
    "兽皮帐、铁刺围栏与红黑旗（那是盆地西北兽人营的形制）",
    "4.0.3a 之后的营地改建与新增设施",
]

