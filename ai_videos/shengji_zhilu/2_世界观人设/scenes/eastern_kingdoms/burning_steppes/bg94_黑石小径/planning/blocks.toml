# 黑石小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图（bg89）坐标 (597, 560)：本地 x = 区 x − 597，本地 y = 区 y − 560。

# 2026-09-25 场景总审：门洞 / 两侧台阶的存在出自世界树文字，但位置是按区级推定块 b905 摆的，src 由「原典方位」改「推定」。

[meta]
bg = "bg94"
name_zh = "黑石小径"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地取区级平面图 b905（≈797,834）周边 400 × 400 m：南缘含主干道西段，北半场是山体南坡。主干道与西麓熔岩环由区级图（地图量取）平移换算；东麓熔岩环取区级图的环形，西缘东移约 40 m 让出栈道外沿的落差坡（推定）；五折栈道、门洞、门前岩台的尺寸无一手出处，按世界树「盘旋而上 · 尽头南侧门洞」推定"
# 世界树画面：从平原盘旋而上的黑岩栈道，一侧是岩壁一侧是深渊，路面被熔岩烤得发脆，尽头是黑石山的南侧门洞
absent = [
    "任何人物、坐骑与活物（默认空路）",
    "栈道护栏、护墩、围墙、吊桥、索道（外沿直接临空）",
    "火把、火盆、灯笼、营火（光只来自熔岩环与门洞深处）",
    "门洞内部的任何结构（进门另立 bg）",
    "任何水体、草木与绿色",
    "旗帜、路牌与任何文字标识",
    "4.0.3a 之后的任何改动",
]

