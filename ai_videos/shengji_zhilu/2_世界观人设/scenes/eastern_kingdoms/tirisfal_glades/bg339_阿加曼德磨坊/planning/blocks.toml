# 阿加曼德磨坊 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref 裁切图 1 px ≈ 1.42 m；区图 [46, 37] 红十字落在本图 (150, 200)。两枚风车图标、风车下方的环形小圈（墓地）、
# 南来的磨坊支路、西岭与东岭按裁切图量取（±25 m）；北缘贴海山脊按区级 terrain.toml「北岸东岭」平移。
# 谷仓 / 农舍 / 草料棚 / 院子 / 木栅 / 荒田 / 墓穴门脸的具体位置都是推定（原典只给了「风车与谷仓群」「坡下家族墓地」「磨坊背后的墓穴」）。
# 锚点机位：南坡下支路上 (170, 310)，朝北略偏东仰看。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg339"
name_zh = "阿加曼德磨坊"
size_m = [320, 320]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "风车图标、墓地环、支路与两侧山岭按区图裁切量取（1 px ≈ 1.42 m，±25 m）；建筑尺寸与院内布局推定"
# 世界树画面：山坡上的木制风车与谷仓群，风车叶片还在空转，坡下一片翻开的家族墓地
absent = [
    "河流、池塘与水车（这是风车磨坊，不是水磨）",
    "长着庄稼的麦田与金黄麦浪（田已撂荒，只剩麦茬）",
    "完好的新屋顶与新刷的墙（全庄荒弃多年）",
    "任何火、烛火、灯笼与炊烟（烟囱冷透，窗户与墓穴门洞全黑）",
    "骷髅、亡灵、人物与牲口（默认态庄子是空的）",
    "墓碑上的文字与任何标识",
    "海滩与海浪（海在北面山脊之后，只露一窄条海天）",
    "晴天、雨与雪",
]

