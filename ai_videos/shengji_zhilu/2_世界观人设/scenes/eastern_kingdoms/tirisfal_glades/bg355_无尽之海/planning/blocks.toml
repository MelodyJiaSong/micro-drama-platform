# 无尽之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg355"
name_zh = "无尽之海"
size_m = [1200, 800]
px_per_m = 1.2
grid_m = 100
scale_src = "推定"
scale_note = "无坐标的一整片水面：取机位（北岸外礁石）往北约 700 m、东西 1200 m 的一块海面作场地。区图上北岸在 b956 一带东西向展开、海面往北无边；礁石位置、暗礁与岸崖距离全为推定"
# 世界树画面：提瑞斯法北岸外铅灰色的开阔海面，浪头短而碎，远处水天一色没有地平线，近岸礁石上挂着海藻和腐烂的鱼。
# 机位：b01 礁石顶，朝正北。画面背后（南）的卵石滩属 bg356，只在南缘画一线断崖示意。
absent = [
    "船只、帆、桅杆、漂浮木板",
    "码头、栈桥、灯塔、任何港口设施",
    "岛屿（西北海湾的两座小岛在画框外）",
    "锐利的海平线与晴天蓝天",
    "大涌浪、卷浪（浪是短而碎的）",
    "海冰、浮冰",
    "人物、海兽、鱼群、海鸟",
    "火与任何人工光源",
    "雨、雪",
    "4.0.3a 后的任何新布局",
]

[[water]]
name = "北方开阔海面（铅灰短碎浪，往北与低云融成一片）"
path = [[0, 360], [1200, 360]]
width_m = 720
depth_m = 30
src = "地图量取"

[[ridge]]
name = "北岸草顶短断崖（画面左后方一抹，约 12 m 高；崖脚卵石滩属 bg356）"
poly = [[0, 740], [300, 732], [600, 748], [900, 736], [1200, 744], [1200, 800], [0, 800]]
height_m = 12
src = "推定"

[[block]]
id = "b01"
name = "机位礁石（蜂窝存水坑 + 挂海藻，高出水面 2–3 m）"
xy = [600, 650]
size = [16, 12]
h_m = 3
src = "推定"
note = "机位在礁顶朝正北；礁缘挂深褐海藻、藻丛里卡着发白鱼骨残渣"

[[block]]
id = "b02"
name = "左侧暗礁（半露水面）"
xy = [556, 628]
size = [18, 7]
h_m = 0.5
rot = -15
src = "推定"

[[block]]
id = "b03"
name = "右侧暗礁群（半露水面）"
xy = [650, 622]
size = [24, 9]
h_m = 0.5
rot = 10
src = "推定"

[[block]]
id = "b04"
name = "近岸乱浪带（浪撞礁石炸成白沫）"
xy = [600, 690]
size = [260, 40]
h_m = 0
src = "推定"
note = "礁石与断崖之间的浅水，浪最乱、泡沫线最密"
