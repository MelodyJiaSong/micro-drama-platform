# 亡灵壁垒 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图 (3170, 1800)；红十字 [81, 70] 落在本图 (177, 128)，区图上的门形图标落在 (305, 142)。
# 区图裁切 1 px ≈ 1 m：大路自西北沿谷底来，到门形图标处被南北两山夹成约 60 m 的山口。

[meta]
bg = "bg351"
name_zh = "亡灵壁垒"
size_m = [400, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "山口宽、路线走向与两山的相对方位按区图裁切量取（1 px ≈ 4.124 m）；墙高、帐篷与望台尺寸无一手出处，全部推定"
# 世界树画面：用碎石、断木与尸骨垒起的横向路障墙，两侧插满尖桩，墙后是黄灰色的瘟疫雾
absent = [
    "任何人物、守军、亡灵与坐骑（默认空营）",
    "飞行点与蝙蝠栖架（壁垒飞行点是 4.0.3 才加的）",
    "石砌堡垒、城楼与大型攻城器械（旧世只是粗陋的路障墙）",
    "火光、火把、灯笼与窗内灯光（火塘是冷灰余烬）",
    "旗帜纹章与任何文字标识（布幡是素色）",
    "河流与湖泊",
    "晴天蓝天、雨、雪",
    "4.0.3a 后的任何改建",
]

[[ridge]]
name = "北侧山坡（毒蛛峡谷南岭的南脚，缓坡长枯草）"
