# 休息区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标：朝向沿用区级图 b954「修道院正门前平台，按修道院图标正南推定」——正门朝南、中轴南北向。

[meta]
bg = "bg354"
name_zh = "休息区"
size_m = [160, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "世界树无坐标、无一手尺寸；高台 60×24 m、阶梯宽 20 m、高差约 4 m 全部推定，朝向取区级图 b954 的推定（门朝南）。待实机量取"
# 世界树画面：修道院前的石砌平台与阶梯，两侧立着圣光雕像
absent = [
    "任何人物、守卫、信徒与动物（默认空场）",
    "训练假人与木桩靶（4.0.3a 才加）",
    "点燃的火盆、火把、烛火与窗内灯光（火盆是空的）",
    "文字、铭文与带字的旗帜（长幡只有十字纹）",
    "杂草、垃圾、破损与熏黑（这里被维护得一丝不苟）",
    "晴天蓝天、雨、雪",
    "4.0.3a 后的任何改动",
]

