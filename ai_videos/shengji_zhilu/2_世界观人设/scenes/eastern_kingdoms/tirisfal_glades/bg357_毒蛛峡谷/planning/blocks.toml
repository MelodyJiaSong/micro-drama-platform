# 毒蛛峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg357"
name_zh = "毒蛛峡谷"
size_m = [800, 540]
px_per_m = 1.8
grid_m = 50
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [87, 47]（区 m ≈ 3595, 1295）。按裁切图量：裁切图左下角的营地塔形图标即十字军前哨 [78, 53]，与中心相距约 91 区图 px（≈375 m）→ 裁切图 1 px ≈ 1.1 m，整幅约 800 × 540 m。东山墙、西北矮岭、小道走向为地图量取；树、网帘、茧、巨石全为推定"
# 世界树画面：山谷两壁拉满灰白蛛网，树干上挂着裹尸茧，地面爬满蜘蛛（蜘蛛属 shot 层，不入底图）
# 机位：b01 西侧谷口，朝正东。谷口 → 谷底：枯草橡树 → 蛛网帘，越往东越暗越密。
absent = [
    "蜘蛛与任何活物（属 shot 层）",
    "茧里露出的尸体或人形（茧只画成看不出内容的纺锤丝团）",
    "进谷的路（小道只擦过谷口）",
    "房屋、营帐、围栏（谷口西南的营地在画框外）",
    "河、溪、湖（只有泥坑积水）",
    "火与任何人工光源、发光的眼睛",
    "夜景、雨、雪、晴天蓝天",
    "4.0.3a 后的任何新布局",
]

