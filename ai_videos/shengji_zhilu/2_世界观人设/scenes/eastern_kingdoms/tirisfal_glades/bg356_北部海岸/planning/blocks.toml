# 北部海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg356"
name_zh = "北部海岸"
size_m = [600, 400]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "无坐标；取北岸中段一截 600 m 长的岸线（区级平面图 b956 标在磨坊与修道院之间，岸线东西向）。海 / 滩 / 崖的南北分带按区图「山脊贴海」的画法推定：卵石滩宽 25–40 m、断崖 15–25 m 高；礁柱、落石、碎石坡位置全为推定"
# 世界树画面：灰黑色卵石海滩与断崖，浪打礁石，天色铅灰
# 机位：b01，卵石滩西段靠水线，朝东顺岸看——左（北）海、右（南）断崖。
absent = [
    "沙滩（这里是卵石，不是沙）",
    "码头、栈桥、船坞、渔村、任何房屋",
    "上下崖的台阶或步道（只有一处塌出来的碎石坡）",
    "灯塔、港口、停泊的船",
    "人物、海鸟、海兽、鱼群",
    "火、篝火余烬与任何人工光源",
    "雨、雪、晴天蓝天",
    "4.0.3a 后的任何新布局",
]

