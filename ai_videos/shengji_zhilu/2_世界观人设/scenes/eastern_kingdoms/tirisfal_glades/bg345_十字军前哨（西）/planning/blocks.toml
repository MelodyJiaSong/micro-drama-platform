# 十字军前哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg345"
name_zh = "十字军前哨"
size_m = [320, 260]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "塔形图标、海湾南岸、土路、农场方田与西南丘陵的相对位置按区图裁切量取（裁切约 1 px ≈ 1 m，场地原点＝裁切 [180, 80]）：塔在红十字西北约 65 m / 57 m、湾岸南约 50 m；棚、栏、南瓜地尺寸无一手出处，推定"
# 世界树画面：索利丹农场西侧一座孤立的木石哨塔，塔顶挑着血色十字军的红旗，塔脚拴着马、堆着补给箱，四周是荒了一半的南瓜田。
# 锚点机位：丘东坡脚土路上（约 [185, 150]），离塔约 70 m，朝西北偏西
absent = [
    "任何人物、马匹与动物（拴马栏是空的）",
    "木栅寨墙与围成一圈的营地（4.0.3a 才扎）",
    "帐篷（1.12 这里只有一座塔与塔脚木棚）",
    "燃着的篝火、火把与任何人工光源（塔窗全黑）",
    "码头、栈桥与船",
    "训练假人与靶场",
    "飞行坐骑",
    "旗面以外的纹章与任何文字标识",
    "4.0.3a 后的任何改动",
]

