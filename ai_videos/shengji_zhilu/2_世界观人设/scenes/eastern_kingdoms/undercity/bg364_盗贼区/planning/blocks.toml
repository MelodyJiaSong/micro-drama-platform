# 盗贼区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Undercity_c60.jpg（1002×668 px）上 x∈[700,900] px、y∈[340,540] px 一窗，
#   本地 m ＝ (px − 700, py − 340) × (0.8756, 0.8762)（与区级 terrain.toml 同一换算）。
#   外环运河按区级 terrain.toml 的圆（本地圆心 (−33.3, −50.8)、半径 162 m）截取东南弧。
# 区图上认得出：运河外侧一大块红粉色厅、东南凸出的六角厅（画着一顶六角形深紫篷顶）、厅里两道深色短条记号、
#   运河南端绿带在 px (742, 443) 的断口（＝进区的石拱桥，与 bg362 的 b02 是同一座）。暗巷隔墙按世界树画面推定。

[meta]
bg = "bg364"
name_zh = "盗贼区"
size_m = [175, 175]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "区图东南斜角一窗 200×200 px 量取（换算同区级 terrain.toml：0.8756 / 0.8762 m/px）；暗巷宽与矮拱高按推定"
# 世界树画面：低矮暗巷式拱厅，只点零星烛火，墙上挂着匕首靶与假人
absent = ["训练假人 / 木桩靶 / 飞刀靶（1.12 城里没有训练假人，世界树画面里这一条不采用）", "天空 / 日光 / 月光", "任何人物与动物", "活植被", "成排的火把与明亮的灯火（本区最暗，只有零星烛火）", "暖白圣光 / 金色光效", "电灯 / 现代锁具与金属柜", "有文字的招牌、价签与通缉令"]

