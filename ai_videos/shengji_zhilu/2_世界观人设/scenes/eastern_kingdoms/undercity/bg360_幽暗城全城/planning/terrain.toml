# 幽暗城全城 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/WorldMap-Undercity_c60.jpg，1002×668 px）量取：像素 × (0.8756, 0.8762) → m，原点区图左上角，x 向东 y 向南。
# 幽暗城是掏空旧都地下建成的环形城：[[ridge]] ＝ 各厅与甬道之间未凿开的实心土岩（height_m ＝ 岩顶到厅面的高差，推定）；
# [[water]] ＝ 环城的墨绿药水运河（外环 + 中庭内环）与城西的下水道污水；[[road]] ＝ 北入口甬道、中庭主廊、区间联廊与炼金房通皇家区的窄道。
# 世界树里所有下属节点都没有坐标，所以本文件用带 bg 键的 [[block]] 把区图上认得出的城区摆进去（id b9NN、src 地图量取）；
# 皇家区在区图上就是炼金房南面窄道尽头的那个圆厅（与地理页「从炼金房旁的窄道进入」一致），同样按图量取。

[meta]
absent = ["天空 / 日光 / 月光 / 天气与时辰（除北入口那片地表废墟庭院外，整城在地下）", "树木 / 草地 / 田野 / 任何活植被（只有霉斑、菌类与苔）", "清水河、湖泊与海岸线（只有墨绿药水运河与齐膝污水的下水道）", "木构民居 / 瓦顶 / 茅草 / 独立的房子（全城是拱顶石廊）", "露天广场 / 市集大街 / 城墙与护城河", "飞艇塔与飞艇（在城外地表，不在本区图内）", "飞行坐骑 / 通往黑暗之门的传送门（燃烧的远征之后才有）", "训练假人 / 木桩靶", "暖白圣光与金色光效（全城的光只有蜡黄火把、毒绿药水与紫蓝符文）", "现代机械 / 电灯 / 玻璃幕墙 / 混凝土"]

