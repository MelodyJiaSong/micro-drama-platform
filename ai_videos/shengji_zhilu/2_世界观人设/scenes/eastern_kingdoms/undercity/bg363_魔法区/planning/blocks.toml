# 魔法区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Undercity_c60.jpg（1002×668 px）上 x∈[690,900] px、y∈[50,280] px 一窗，
#   本地 m ＝ (px − 690, py − 50) × (0.8756, 0.8762)（与区级 terrain.toml 同一换算）。
#   外环运河按区级 terrain.toml 的圆（本地圆心 (−24.6, 203.3)、半径 162 m）截取东北弧。
# 区图上认得出：运河外侧一整块红褐色新月形厅、厅里两个虚线圆环记号（→ 地面大圆环）、东北凸出的附厅（画着一座方形建筑）。
# 圆环里哪个悬着光环、附厅里的阶梯方台与两张石案，按世界树画面推定。

[meta]
bg = "bg363"
name_zh = "魔法区"
size_m = [184, 202]
px_per_m = 5.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图东北斜角一窗 210×230 px 量取（换算同区级 terrain.toml：0.8756 / 0.8762 m/px）；圆环直径按区图虚线圆记号约 27 px ≈ 24 m 取整为 20 m"
# 世界树画面：紫蓝色符文光的拱厅，浮空法阵与传送门，地面刻着大圆环
absent = ["传送门 / 旋涡光门 / 传送宝珠（1.12 的这里没有任何传送门，燃烧的远征之后才加）", "天空 / 日光 / 月光", "任何人物、召唤物与动物", "活植被", "暖白圣光 / 金色光效", "铸造炉火与铁砧（在西北军事区）", "电灯 / 霓虹 / 全息光效", "有文字的铭牌、书页与招牌"]

