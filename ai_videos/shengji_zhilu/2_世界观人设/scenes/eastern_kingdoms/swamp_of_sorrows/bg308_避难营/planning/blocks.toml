# 避难营 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。营地方位取区图 (26%,31%) 棚屋符号；营内布局无一手出处，一律推定。

[meta]
bg = "bg308"
name_zh = "避难营"
size_m = [200, 180]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上只是一个棚屋符号（约 90×80 m 的绿地）；场地取 200×180 m 以装下背后的山嘴坡脚、东侧水面与南下的泥径，营内四棚一塘按「几间草顶棚屋围一堆篝火」推定"
# 世界树画面：沼泽西侧的小村落，几间草顶棚屋围着一堆篝火，木桩上晾着破布，四周积水没过脚踝
absent = [
  "木石房舍、旅店、铁匠铺、商铺（旧世这里只有四间草棚）",
  "飞行点 / 栖架 / 狮鹫或双足飞龙（旧世本区唯一飞行点在斯通纳德）",
  "哨塔、寨墙、栅栏围墙、阵营旗帜与布幡",
  "燃着的篝火、火把、灯笼、烛光、炊烟（默认态火塘是冷灰余烬）",
  "石板路 / 铺装地面 / 干燥地面（营地脚下全是浅水与黑泥）",
  "码头、船、栈桥",
  "晴天硬光、太阳与长影",
  "4.0.3a 后扩建的较大营地规模",
  "任何人物 / 动物 / 文字 / 路牌字样",
]

