# 荒芜之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1700, 850)；本图坐标 ＝ 区级坐标 − (1700, 850)。海岸线与两座小岛按区图 [86–93, 61–97] 量取；
# 区图东缘 (x 100% ＝ 本图 x 397) 以东的海面区图没画，一律推定。芦苇带、浑水带宽度推定。
# 锚点机位：b01 海滩靠海一侧湿沙，朝东偏北；两座小岛在画面右前方。南山墙入海处在场地西南外，不入锚点画面。

[meta]
bg = "bg315"
name_zh = "荒芜之海"
size_m = [700, 500]
px_per_m = 2.0
grid_m = 100
scale_src = "地图量取"
scale_note = "海岸线与小岛按区图（x%×20.974、y%×13.983 m）平移量取；区图东缘以东的海面、浑水带与芦苇带宽度推定"
# 世界树画面：沼泽东侧的灰绿海面，天色压得很低，浪不大但颜色浑浊，看不到对岸
absent = [
    "船、帆、木筏、码头、栈桥与港口（东北海岸的地精港口 4.0.3a 才有）",
    "对岸与任何远方陆地、灯塔、礁石群",
    "巨浪、卷成管的浪花、拍岸溅起的高浪与风暴",
    "清澈的蓝绿海水与白沙热带海滩",
    "火、烛火、灯笼、火把与任何人工光源",
    "阳光、光柱、投影、夕照与晴天",
    "滩上的贝壳窝与小屋（属 bg310 / bg305，不在本档）",
    "任何人物与动物（包括海鸟）",
]

