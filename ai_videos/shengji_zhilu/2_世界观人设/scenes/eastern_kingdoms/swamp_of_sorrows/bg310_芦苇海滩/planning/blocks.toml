# 芦苇海滩 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。取海滩中南段一段约 1 km（北段近南北直、南段向西南弯），
# 岸线走向按区图量取的形状示意；芦苇带宽、贝壳窝、漂木、枯树的位置无一手出处，推定。

[meta]
bg = "bg310"
name_zh = "芦苇海滩"
size_m = [500, 1000]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "区级平面图：海滩带 (73–92%,5–99%)，1 px ≈ 2.09 m；本图截取中南段约 1 km，岸线弯折按区图形状示意，滩宽与芦苇带宽推定"
# 世界树画面：悲伤沼泽东侧的泥沙海滩，成片高芦苇被风压出波纹，浅水里埋着鱼人的贝壳窝
absent = [
  "码头、栈桥、港口、船只、帆（东北海岸的地精港口 4.0.3a 才有；旧世这条岸线没有任何航运设施）",
  "金黄干沙、椰树、礁石、海崖（这里是湿泥沙低岸）",
  "晴天蓝海、海上日出 / 夕阳、太阳与长影",
  "火、篝火、火把、灯笼等人工光源",
  "穿过芦苇带进沼泽的路（滩只能沿岸线走）",
  "任何生物（贝壳窝是空的）、人物、文字、标记",
]

