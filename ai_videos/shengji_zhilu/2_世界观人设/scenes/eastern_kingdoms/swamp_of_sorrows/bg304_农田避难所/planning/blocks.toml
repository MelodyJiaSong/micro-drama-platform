# 农田避难所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地左上角 ＝ 区级平面图（bg303 terrain.toml）的 (1203, 214) m；山坡 / 水道 / 泥路由区级量取值平移而来，精度 ±20 m。

[meta]
bg = "bg304"
name_zh = "农田避难所"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图两处棚屋符号 (65%,19%) / (61%,25%) 相距约 125 m，北路终点、东侧水道、北山墙坡脚均从 bg303 terrain.toml 平移；田格、残垣、火塘无一手出处，按世界树画面推定"
# 世界树画面：荒废的农田与残垣，泥水漫过田埂，失落者搭的简陋窝棚散在田间，木栅东倒西歪
absent = [
    "完好的农舍、谷仓与任何有屋顶的石木房屋（只剩墙基与断墙）",
    "水道上的桥、码头与船",
    "在长的庄稼、麦田与菜畦（田早已荒废）",
    "燃着的火、火把、灯笼与任何人工光源（火塘是冷灰）",
    "石板路与铺装路面（只有一条泥路）",
    "晴天硬光与长影",
    "任何人物、牲口、动物与文字",
]

