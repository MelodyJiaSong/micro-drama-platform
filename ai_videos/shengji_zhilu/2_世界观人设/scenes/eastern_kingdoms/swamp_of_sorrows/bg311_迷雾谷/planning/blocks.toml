# 迷雾谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地 ＝ 区级 terrain.toml 坐标平移 (-150, -380)：场地 (0,0) 即区坐标 (150,380)。山墙轮廓、两潭位置由区级量取值换算；
# 谷内的枯树丛、乱石、苇带、渗流一律推定（区图上只看得到绿地与两个小潭）。

[meta]
bg = "bg311"
name_zh = "迷雾谷"
size_m = [360, 240]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 (9–20%,30–40%) 的山坳，按区级 terrain.toml 的换算（x%×20.974 m、y%×13.983 m，±20 m）量得谷底约 230×130 m；场地取 360×240 m 以装下北墙坡脚、西端崖壁、南墙坡脚与东口外那道隔开避难营的山嘴"
# 世界树画面：被岩壁夹住的狭长谷地，浓雾贴地不散，枯树只剩黑色剪影，能见度不足十步
absent = [
  "穿谷而过的道路 / 泥路 / 栈道（谷里没有路；通逆风小径的西路在谷南约 200 m 另一道窄谷里）",
  "西端通往逆风小径的山口（谷底尽头是封死的岩壁）",
  "任何建筑、棚屋、营地、火塘、帐篷、栅栏（避难营在东口外山嘴的另一侧，不入本场地）",
  "任何火、火把、灯笼、烛光与人工光源",
  "阳光、蓝天、晴天硬光与长影、光柱",
  "开阔的大片深水 / 湖（谷里只有两个小潭）",
  "有叶的活树、开花植物、鲜绿草坪",
  "焦土 / 赤红裂土（那是南邻诅咒之地）",
  "任何人物 / 动物 / 飞鸟 / 文字 / 路牌字样",
]

