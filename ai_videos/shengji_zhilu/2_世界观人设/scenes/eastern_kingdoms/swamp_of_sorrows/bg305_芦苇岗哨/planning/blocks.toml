# 芦苇岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地左上角 ＝ 区级平面图（bg303 terrain.toml）的 (1620, 1040) m；水道 / 海岸由区级量取值平移，精度 ±20 m。

[meta]
bg = "bg305"
name_zh = "芦苇岗哨"
size_m = [280, 180]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "哨所位置按区图东南滩头棚屋符号 (82%,80%)；东侧浅水道（东南水道二）、海滩与海面从 bg303 terrain.toml 平移；哨所、栈道、苇丛尺寸无一手出处，按世界树画面推定"
# 世界树画面：东岸滩头的小木哨所，苇丛齐肩，栈道通向水边，哨所顶上一盏未点的油灯
absent = [
    "码头、渡口、船只、帆与任何航运设施（栈道尽头只是一个小桩台）",
    "点着的油灯、火把、篝火与任何人工光源",
    "旗帜、纹章与任何阵营标识",
    "石砌建筑与铺装路面（周边没有正式道路）",
    "海岸上的港口与吊臂（4.0.3a 后才有）",
    "晴天硬光与长影",
    "任何人物、动物、鱼群、飞鸟与文字",
]

