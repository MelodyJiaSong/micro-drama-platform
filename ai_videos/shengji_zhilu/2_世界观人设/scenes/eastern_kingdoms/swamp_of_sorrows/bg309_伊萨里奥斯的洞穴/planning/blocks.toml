# 伊萨里奥斯的洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。北半是西南山坳坳底（湿草地 + 黑潭南端），南半是山体里的岩道与洞厅。
# 洞口方位取区级平面图 b905（区图 (13%,70%) 洞口符号，排除法推定）；洞内布局无一手出处，一律推定。

[meta]
bg = "bg309"
name_zh = "伊萨里奥斯的洞穴"
size_m = [120, 170]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图上只是坳底一个洞口符号；洞厅取约 40×30 m 的中型天然岩洞、岩道约 25 m，场地向北多留 60 m 装下洞外坳底湿地与黑潭南端"
# 世界树画面：藏在崖壁后的干燥洞窟，洞内比外面亮，一条绿龙化身盘踞在中央，鳞片泛着翡翠光
absent = [
  "龙 / 任何生物（角色属 shot 层；场景底图的洞厅是空的）",
  "自发光的晶石、鳞片光、符文、魔法光、传送门",
  "火、火把、火盆、烛火、灯笼等任何人工光源",
  "积水、泥沼、湿雾（洞内是干的，湿只到岩道口为止）",
  "第二出口 / 暗道 / 通往神庙的地道",
  "宝物堆、骨骸堆、营地、帐篷、家具",
  "4.0.3a 之后的任何新增设施",
  "任何人物 / 动物 / 文字 / 标记",
]

