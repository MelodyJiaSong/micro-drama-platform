# 奥特兰克山谷（入口） · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg32"
name_zh = "奥特兰克山谷（入口）"
size_m = [240, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标，区图上无入口图标，无一手尺寸出处；按「谷口 25 m、通道深 200 m 收到 10 m、两壁 40–50 m」的雪谷形制推定，谷口外留 130 m 丘陵缓坡"
# 世界树画面：山脉北端的雪谷谷口，两侧崖壁夹出一条通道，谷口立着双方的旗与传送法阵
# 方位 judgment call：备注与 wiki 写入口在区南缘（南海镇正北 / 塔伦米尔东北），取南缘山墙、口朝南、通道向北；两阵营两处入口合写成一处（见 md 场景定位）
# 通道尽头岩洞 ＝ 同区「丘陵洞穴」条目（洞深处有蓝白冷光），洞内光幕是本档唯一的非日光光源
absent = [
    "战场内部（征战平原、两端石堡与木寨、碉堡、墓地、矿洞一律不入本档）",
    "任何人物、坐骑与守卫（默认空谷口）",
    "旗面纹章与任何文字标识（两面长旗只有褪色布面）",
    "火、火把、火盆与任何暖色人工光源",
    "木寨门、石门楼、城墙等人造门禁（谷口只有两根旗杆与一个石堆）",
    "树林（谷内无树，只有坡下几丛枯灌木）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

