# 达伦德农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [42, 17] 落在本场地 (180, 150)；区图 1 px ≈ 2.555 m。

[meta]
bg = "bg26"
name_zh = "达伦德农场"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：农舍图标在点位西北偏西 ~22 px（≈57 m），矮石丘在西南 ~19 px（≈49 m）、宽 ~33 px（≈85 m），湖东岸在正西 ~47 px（≈120 m），北山脚在正北 ~30 px；农舍 / 谷仓 / 畜栏尺寸按人类农庄常识推定"
# 世界树画面：被雪埋了一半的农舍与畜栏，木头发黑，雪面没有脚印
absent = [
    "任何人物、牲畜与脚印车辙（雪面完全干净）",
    "炊烟、灯火与任何人工光源（农庄荒了二十来年）",
    "火烧痕迹（木头发黑是风吹雨淋的旧色）",
    "有人耕作的田（只剩雪下的旧田埂）",
    "厚积雪雪原（这里是雪线附近的薄雪缓坡）",
    "围墙、哨塔与守卫（只是一户农家）",
    "4.0.3a 后并入希尔斯布莱德丘陵的新布局",
]

