# 拉文霍德庄园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标，区级落位本身就是推定（bg23 b901）；「台地 + 盘山小道 + 山洞」取自世界树画面，具体落位全部推定。
# 南缘 y≈150 是十几米的陡坎，坎下（y>150）是向河谷倾斜的乱石坡，比台地低，故不画 ridge。

[meta]
bg = "bg28"
name_zh = "拉文霍德庄园"
size_m = [200, 180]
px_per_m = 6.0
scale_src = "推定"
scale_note = "单栋庄园 + 后院训练场 + 前庭的台地取 200 × 180 m（含三面崖脚与南坎下一段小径）；无一手尺寸出处"
# 世界树画面：山间台地上的橙顶石砌庄园，后院是训练场与靶子，只有一条盘山小道与一个山洞通进来
absent = [
    "任何人物（会馆成员属 shot 层，不进底图）",
    "人形训练假人（4.0.3a 才有；训练场只有圆形草靶与木桩）",
    "火把、灯笼、窗内灯火、炊烟（默认态全冷）",
    "积雪地面（台地在雪线以下，雪只在四周峰顶与背阴崖脚）",
    "第三条出入路（只有南坎小道与西北山洞）",
    "旗帜、招牌、纹章与任何文字",
    "飞行坐骑与飞行点设施",
]

