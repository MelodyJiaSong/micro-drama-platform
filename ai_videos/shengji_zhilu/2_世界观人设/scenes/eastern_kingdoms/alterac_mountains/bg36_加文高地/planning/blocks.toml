# 加文高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg36"
name_zh = "加文高地"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [30, 85]（区 m ≈ 768, 1451）。区图南缘最西那条台地舌宽约 60–80 px × 2.555 m/px ≈ 150–200 m；台地与谷地、东侧窄谷的相对位置按区级 terrain.toml「南缘台地舌」「达拉然南出口小路」量取；台地内的巨岩 / 枯松 / 水洼为推定"
# 世界树画面：南部的裸岩坡地，草与雪交界，能俯瞰洛丹米尔湖
# 西北远景的谷地 → 淡紫穹顶 → 湖湾在场地之外（约 500–900 m），只写在 md，不画
absent = [
    "任何建筑、营地、帐篷、围栏、路标",
    "人物、坐骑、动物",
    "燃着的火、炊烟、任何人工光源（岩窝旧石圈早已冷透）",
    "成片树林（只有一棵倒伏的枯松）",
    "上台地的路（只有北端一道浅沟）",
    "降雪与暴风雪（默认晴）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

