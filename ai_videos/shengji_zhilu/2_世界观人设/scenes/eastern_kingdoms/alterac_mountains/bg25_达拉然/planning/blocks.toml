# 达拉然 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (61, 678) m；区图点位 [18, 62] 落在本场地 (400, 380)；区图 1 px ≈ 2.555 m。

[meta]
bg = "bg25"
name_zh = "达拉然"
size_m = [880, 880]
px_per_m = 1.8
grid_m = 50
scale_src = "地图量取"
scale_note = "区图城廓东西 ~180 px（≈460 m）、南北连南端圆台 ~220 px（≈560 m），穹顶按罩住整座城取直径 550 m 正圆；南城门取区图出城小路起点（城廓东南缘，罩内）；湖岸、湖臂、东侧山脊与南出口小路按区级 terrain.toml 平移换算；城内塔位按区图图标量取，高度推定"
# 世界树画面：湖边一座巨大的半透明紫色魔法穹顶，罩着城市废墟的尖塔，穹顶表面有符文缓缓流动
absent = [
    "达拉然巨坑与悬在空中的城（巫妖王之怒以后的状态）",
    "穹顶上的门洞或缺口（穹顶完整封闭，城南门在罩内）",
    "任何人物、守卫与元素生物（默认空镜）",
    "火光、灯笼与城内亮着的窗（唯一非日光光源是穹顶的冷紫微光）",
    "被染紫的天空与湖面（紫色只在穹顶上）",
    "积雪雪原（本档在雪线以下，只有残雪）",
    "可读的文字（膜面光纹是抽象几何花纹）",
]

