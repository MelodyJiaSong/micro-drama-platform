# 冰风岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg33"
name_zh = "冰风岗"
size_m = [560, 400]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [80, 66]；河、南脊、东北山体的位置按区图裁切量取（区图 2.555 m/px，裁切约放大 2.9 倍）；岗顶与自然块为推定"
# 世界树画面：东侧的风口高地，积雪被风扫成波纹，几棵歪松
# 锚点机位：岗顶偏东背风处（约 [365, 200]）朝西北俯视河谷；视野约方位 -80° 到 -15°（正北为 0°），岗上小件都摆在这个扇面里
# 区图：红十字东北约 35 m（约 [314, 180] 以东）有建筑图标，区级平面图记作 bg28 庄园（推定）——本档不画、不入画（机位背对）
absent = [
    "任何建筑、营地、帐篷与围栏（西瘟疫之地的「冰风岗哨」是邻区另一处，不在这里）",
    "区图上东北侧的建筑图标（归 bg28，机位背对不入画）",
    "道路、桥与渡口（只有一道被雪填平一半的浅辙痕）",
    "火、炊烟与任何人工光源",
    "成片森林（只有三四棵旗形歪松与贴地矮刺柏）",
    "厚积雪与雪原（只剩薄雪壳，迎风坡露草）",
    "任何人物与动物",
]

