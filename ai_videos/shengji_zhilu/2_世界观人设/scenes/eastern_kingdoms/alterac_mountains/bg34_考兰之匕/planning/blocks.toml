# 考兰之匕 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg34"
name_zh = "考兰之匕"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [50, 78]；刀脊晕滃线、南口大道、次脊与北面山肩按区图裁切量取（区图 2.555 m/px，裁切约放大 2.9 倍）；刀脊高度与自然块为推定"
# 世界树画面：一道刀刃形的岩脊直插雪地，脊上一条窄路
# 区图：晕滃线画在刀脊东侧 → 陡面朝东；大道在刀脊以东约 90 m 平行北上
# 锚点机位：刀脊东南方谷道上（约 [290, 398]）朝西北偏北仰望；视野约方位 -69° 到 +1°（正北为 0°），刀尖、脊北端与北面豁口都在扇面里
absent = [
    "任何建筑、营地与人造围栏（纯自然地标）",
    "脊顶小路的栏杆、台阶与索桥",
    "大片积雪（只有东脚背阴一长条残雪，北端根部才进雪线）",
    "火与任何人工光源",
    "森林（只有东坡几棵矮歪松）",
    "任何人物、坐骑与车队（旧板车是散架的遗物）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

