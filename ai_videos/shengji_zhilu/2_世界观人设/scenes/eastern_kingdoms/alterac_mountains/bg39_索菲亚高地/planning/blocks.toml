# 索菲亚高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg39"
name_zh = "索菲亚高地"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [59, 70]（区 m ≈ 1511, 1195）。区图 2.555 m/px：裁切图上舌状台地东西约 45–50 px ≈ 120 m，点位在岬角内侧、距东缘陡坎约 25 m、南缘约 30 m；西侧南口大道约 60 px ≈ 150 m；东侧山群坡脚约 35 px ≈ 90 m。台面上的岩舌 / 巨石 / 灌丛 / 兽径为推定"
# 世界树画面：东南方的高地台，视野开阔，地上是碎石与低矮灌木
# 西南约 250 m 的刀脊（bg34）、正南的起伏低地与远丘都在场地之外，只写在 md，不画
absent = [
    "任何建筑、营地、帐篷、围栏、路标、石堆",
    "人物、坐骑、动物",
    "火、炊烟、任何人工光源",
    "台面与低地上的积雪（只有东面山顶残雪）",
    "河流与湖（东部山河在山群背后，看不到）",
    "成片森林（只有贴地刺柏、矮灌与零星松树、孤树）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

