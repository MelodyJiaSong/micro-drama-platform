# 斯坦恩布莱德 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 镇内布局无一手平面出处：主街东西走向与出镇拐向东北取自区图（地图量取），房屋落位全部推定。

[meta]
bg = "bg30"
name_zh = "斯坦恩布莱德"
size_m = [240, 180]
px_per_m = 5.0
scale_src = "推定"
scale_note = "东西向单街小镇取 240 × 180 m：区图上镇区图标约 6 px 宽（≈ 150 m），加两侧山脚；无一手尺寸出处"
# 世界树画面：山间的人类小镇，屋顶积雪，铁匠铺与镇政厅还在，街上没有平民只有持刀的强盗
absent = [
    "任何人物（平民已散尽；强盗与俘虏属 shot 层，不进底图）",
    "炊烟、亮着的锻炉、窗内灯火（默认态人走灶冷）",
    "城墙与城门（小镇只有路边木栅）",
    "文字招牌与可读的牌匾（招牌板面已冲光，牌匾只剩锈钉）",
    "有人耕作的田地（屋后只有荒掉的小菜园）",
    "4.0.3a 后并入希尔斯布莱德的新布局与新建筑",
]

