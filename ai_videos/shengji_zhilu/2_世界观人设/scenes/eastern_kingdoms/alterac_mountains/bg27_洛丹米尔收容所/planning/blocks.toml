# 洛丹米尔收容所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (407.7, 1255.5) m；区图点位 [21, 80] 落在本场地 (130, 110)；区图 1 px ≈ 2.555 m。
# 穹顶、南城门与出城小路归 bg25（几何唯一出处在 bg25/planning/blocks.toml）：穹顶是圆心在本场地 (25, -122)、半径 275 m 的圆，
#   本图的弧段与路按它换算，不另起一套。区图点位落在穹顶南缘以内约 20 m（城廓东南缘、出城小路起点旁），营寨只能摆在穹顶外——推定。
# 湖臂（推定）在场地以西约 350 m，不在图内（只入远景）。

[meta]
bg = "bg27"
name_zh = "洛丹米尔收容所"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：城南门（出城小路起点）在点位西北 ~24 px（≈61 m），小路过点位向东南 ~35 px（≈90 m）到一处圆形标记（直径 ~24 px ≈ 60 m）；穹顶弧按 bg25 的 550 m 正圆换算；营寨 90 × 70 m 与内部布局推定（区图无营寨图标）"
absent = [
    "4.0.3 以后此处的农场（布雷泽农场）",
    "任何人物、看守与被关押者（默认空营）",
    "燃着的火盆、灯火与炊烟（火盆是冷灰）",
    "积雪（本档在雪线以下的湖边低地）",
    "穹顶上的门洞（穹顶属 bg25，完整封闭）",
    "旗帜纹章与文字标识",
    "石砌城墙（营寨全是原木栅）",
]

