# 西部海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位 [35, 67] ＝ 区 m ≈ (1022, 1307) ＝ 本场地 (200, 130)。裁切图 4× 放大：1 裁切 px ≈ 0.73 m；场地 x = 200 + (cx-362)·0.73，y = 130 + (cy-242)·0.73。
# 锚点机位：缺口坡顶 ≈ (200, 118)，高出沙面 5–6 m，朝南偏西（约 200°）俯望。

[meta]
bg = "bg201"
name_zh = "西部海岸"
size_m = [400, 360]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1002 px ↔ 2926 m（2.920 m/px，与区级 terrain.toml 同一换算）。裁切图上：岸线（褐色双线）在点位正南约 58 裁切 px ≈ 42 m；点位西侧弧形刷线（土崖）兜出的沙湾宽约 95 裁切 px ≈ 70 m；东段长崖下沙带宽约 55 裁切 px ≈ 40 m；滨海小径（区级 terrain 量取）在点位北约 110 m；海湾西礁岛（区级 b902）在点位南偏东约 195 m。骨架、船骸、土径、崖高为推定"
# 世界树画面：西南沙滩，浪线平缓，滩上散着海怪骨与破船板
# 场地外：西北约 300 m 山体东麓的矿洞口（小径西端）；正东约 440 m 临海小镇的木栈码头（被东段长崖挡住）；西南约 600 m 海上螺旋孤岛（区图量取）
absent = [
  "成排黑礁、礁石岬角、卵石滩（那是对岸东滩的样子；这里沙细、浪缓、几乎无礁）",
  "码头、栈桥、渔船、晒网架、渔村（这一岸无人居住）",
  "芦苇或湿草扎的圆顶小棚、生物巢穴（生物与其营地属 shot 层 / 不入背景板）",
  "任何人物、鱼群、海兽活体、水鸟",
  "火、篝火、灯笼等任何人工光源",
  "棕榈、热带植物、红树林",
  "岩壁高崖（滩后只是十几米的草皮土崖）",
  "积雪、冰、浮冰",
  "被瘟疫炸毁的镇子废墟 / 绿色毒雾（4.0.3a）",
]

