# 希尔斯布莱德农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg190"
name_zh = "希尔斯布莱德农场"
size_m = [560, 460]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "区图 1 px ＝ 2.92 m；裁切图约 3.2 倍放大（1 裁切 px ≈ 0.91 m）。坐标表点位 [35, 44] 置于本图 (300, 250)，即东南田北缘；三块田、三座农舍与大路、农田小路按裁切图量取。谷仓、羊圈、圆井、干草垛为推定"
# 世界树画面：成片的麦田与三四座农舍，农夫与看门狗，背后是松树坡
absent = [
    "农夫、看门狗、牲畜（默认空庄）",
    "风车与水磨坊（本庄没有）",
    "城墙、石塔与任何防御工事",
    "烟囱冒烟、窗内灯光与任何人工光源",
    "泥浆农田、被毒化的枯田与瘟疫绿雾（4.0.3a）",
    "河流与池塘（河在东边十字路口以东）",
    "雪线与积雪",
    "4.0.3a 后的任何改动",
]

