# 索拉丁之墙 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 墙轴线：过门洞中心 (200,160)，走向北偏东 22°（块 size=[厚, 长]、rot=22）；沿墙坐标 t 向南偏西为正：(200-0.375t, 160+0.927t)。
# 锚点机位：东路上门洞西北约 120 m（≈ 89, 115），离地 2 m，朝东南略仰。

[meta]
bg = "bg200"
name_zh = "索拉丁之墙"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图未画墙体；走向按区界线（区图 px ≈ 905,285 → 760,500 的黄绿/金褐分界）与阿拉希侧全境卡「自东北斜向西南」推定为北偏东约 22°。墙高约 20 m、厚约 6 m、门洞宽约 10 m 高约 14 m、豁口位置与宽度均为推定；场地只取门洞前后一截，两端没入山体"
# 世界树画面：横贯东南山口的一道巨型古石墙，灰白巨石层层垒砌、多处坍成豁口，墙体爬满苔藓与枯藤，正中一座残破的拱形门洞就是通往山那边高地的路。
# 场地外：西北约 1 km 河东高坡上的要塞废墟（东路来处）；西南约 1 km 海边山坡上的方塔小要塞（墙脚小径去处）
absent = [
  "门扇、铁闸门、吊桥、新修的木栅关门（门洞是空拱）",
  "守军营帐、哨兵、旗帜、火盆、篝火等任何人工光源",
  "攻城车、投石机、攻城塔、拒马",
  "护城河、壕沟、城楼上的屋顶（墙顶只有残缺垛口）",
  "墙内侧的城镇或房屋（墙两边都是空旷的草坡与草甸）",
  "被瘟疫炸毁的废墟 / 绿色毒雾（4.0.3a）",
  "高大石砌新关门与门楼（那是西口的 4.0.3a 改建，不在这里）",
  "积雪、冰、雪线",
  "飞行坐骑 / 飞艇",
]

