# 军事区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[520,800] px、y∈[395,660] px 一窗，
#   本地 m ＝ (px − 520, py − 395) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 石室外形是区图上的蓝紫色小块（地图量取）；哪一间是旅店 / 酒吧台 / 铺面区图不标，按世界树备注推定（虚线）。
# 炭火盆、火塘是锚点 prompt 的陈设，区图不画，推定。锚点机位：西南石阶顶（约 14, 84）朝东偏北。

[meta]
bg = "bg211"
name_zh = "军事区"
size_m = [202, 191]
px_per_m = 7.0
scale_src = "地图量取"
scale_note = "区图东南蓝紫色区块一窗量取：斜长大厅约 110×60 m（长轴西南—东北），西南石阶、北侧甬道、东北圆坡道三口；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：墙上挂满盾牌与战斧的环形厅，地面铺深色石板，角落是训练假人与兵器架，灯光偏暗偏红（训练假人是 4.x 后加的，不入画）
absent = ["天空 / 日光 / 窗（山腹内厅）", "训练假人 / 木桩靶 / 稻草人靶（旧世城里没有）", "熔岩坑（在城心；本区只在北侧甬道深处见一线光）", "沙地擂台 / 战旗墙（在武器大厅 bg203 里，不在本厅）", "木构房屋 / 瓦顶", "玻璃 / 电灯 / 现代器物", "任何文字 / 可辨纹章", "狮鹫 / 坐骑 / 飞行坐骑", "任何人物与动物"]

