# 秘法区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[170,411] px、y∈[5,215] px 一窗，
#   本地 m ＝ (px − 170, py − 5) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 石室外形是区图上的紫色小块（地图量取）；哪间是铺面 / 训练间区图不标，推定。
# 石柱、悬挂水盆、壁槽是锚点 prompt 的陈设，区图不画，推定。锚点机位：西南石阶顶（约 60, 125）朝东北。

[meta]
bg = "bg212"
name_zh = "秘法区"
size_m = [174, 152]
px_per_m = 9.0
scale_src = "地图量取"
scale_note = "区图左上紫色区块一窗量取：斜长广场约 120×55 m（长轴西南—东北），中央螺纹水池外圈约 26 m 径；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：一圈安静的蓝调厅堂，石柱之间悬着发光的符文水盆，水从壁槽流下来，光线比别处冷得多
absent = ["天空 / 日光 / 窗（山腹内广场）", "火盆 / 炉火 / 熔岩 / 铁笼灯（本区只有冷蓝水光与大厅门口的烛光）", "传送门 / 悬浮光球 / 漫天光效", "可读的字与符文字母（刻纹只有几何螺纹与同心圈）", "训练假人 / 木桩靶", "木构房屋 / 瓦顶", "玻璃 / 电灯 / 现代器物", "任何人物与动物"]

