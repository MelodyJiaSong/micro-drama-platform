# 平民区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[150,560] px、y∈[180,610] px 一窗，
#   本地 m ＝ (px − 150, py − 180) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 店铺排、回纹石带、石阶、甬道口按区图量取；拍卖行 / 金库落在哪一块按旧世游戏内位置推定。

[meta]
bg = "bg207"
name_zh = "平民区"
size_m = [296, 311]
px_per_m = 5.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图黄色新月形区块量取：弧廊中线约 400 m 长、宽约 22 m（外排店铺面到内排店铺面）；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：进城后第一圈宽环廊，两侧一长排石砌商铺与摊位，穹顶垂下铁链吊灯，地面被人流踩出光亮的石板道
absent = ["天空 / 日光 / 窗（山腹内廊）", "熔岩与火塘（环廊里没有；熔岩只在斜廊尽头的城心）", "树木 / 草地 / 任何植被", "露天广场 / 城墙 / 护城河", "木构房屋 / 瓦顶 / 茅草", "招牌字 / 告示文字 / 任何文字", "玻璃橱窗 / 电灯 / 霓虹 / 现代器物", "训练假人 / 木桩靶", "4.0.3 后才有的黑铁大使馆"]

