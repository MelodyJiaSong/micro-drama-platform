# 秘法大厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[200,325] px、y∈[0,125] px 一窗，
#   本地 m ＝ (px − 200, py) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 区图上是秘法区北端一大团紫色：长轴西北—东南，西北头圆、东南口敞向秘法区地面。厅内陈设按世界树画面推定。

[meta]
bg = "bg205"
name_zh = "秘法大厅"
size_m = [90, 90]
px_per_m = 12.0
scale_src = "地图量取"
scale_note = "区图秘法区北端紫色大块量取：长轴约 72 m（西北后殿到东南门）、宽约 38 m；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：秘法区深处的高顶圣堂，中央一口圣光照亮的水池，两侧是雕着圣徽的石柱与长明烛台
absent = ["天空 / 日光 / 天窗 / 从上方射下的光柱（山腹内厅）", "熔岩 / 锻炉 / 火盆（本厅只有烛火与池光）", "兵器架 / 擂台（在军事区）", "彩色玻璃花窗 / 木构长椅（那是人类城市的教堂）", "任何文字与可读铭文", "夸张外放的金光与光柱"]

