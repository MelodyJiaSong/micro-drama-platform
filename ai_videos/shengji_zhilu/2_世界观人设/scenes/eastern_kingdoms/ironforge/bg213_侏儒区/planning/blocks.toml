# 侏儒区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[610,820] px、y∈[225,425] px 一窗，
#   本地 m ＝ (px − 610, py − 225) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 十字厅外形与四条甬道是区图绿色块（地图量取）；侧间功能、中央球形机械、工作台、熔炉按世界树推定（虚线）。
# 锚点机位：西端半圆厅门口平台（约 12, 62）朝东偏南，广角；要避开中央大球才看得到东头齿轮门。

[meta]
bg = "bg213"
name_zh = "侏儒区"
size_m = [152, 145]
px_per_m = 10.0
scale_src = "地图量取"
scale_note = "区图右侧绿色十字块一窗量取：主厅约 95×52 m（东西主轴），西端半圆厅约 33 m 径，东甬道约 60 m 长到齿轮门；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：挤满黄铜管道与蒸汽阀的侏儒区，中央一台巨大的球形机械上架着一把小王座，四周是零件摊与冒火花的工作台（火花要有人干活，空场不画）
absent = ["天空 / 日光 / 窗（山腹内厅）", "熔岩坑（在城心，不在本厅）", "冷蓝水光（在秘法区）", "工作台火花（空场无人干活）", "电灯 / 霓虹 / 玻璃幕墙 / 现代机器人", "可读的字与数字（表盘只有刻度线）", "木构房屋 / 瓦顶", "飞行器 / 飞行坐骑", "任何人物与动物"]

