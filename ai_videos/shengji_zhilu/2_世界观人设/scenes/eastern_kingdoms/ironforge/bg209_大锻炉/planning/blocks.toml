# 大锻炉 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[350,625] px、y∈[160,420] px 一窗，
#   本地 m ＝ (px − 350, py − 160) × (0.7215, 0.7222)；区级 terrain.toml 的 m 减 (252.5, 115.6) 即本地 m。
# 三块扇形熔岩坑是扇形，这里用外接矩形近似（真形看区图）；圆形炉台按区图带圈圆点量取。
# 环形铁桥、酒馆位置为推定；狮鹫场沿用区级 b923 的推定位置。

[meta]
bg = "bg209"
name_zh = "大锻炉"
size_m = [198.4, 187.8]
px_per_m = 7.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图正中熔炉场量取：内环廊中线直径约 170 m，西北扇外接约 80×44 m、东扇约 26×28 m、东南扇约 54×47 m；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：城心一口巨大的熔岩坑，橙红岩浆上架着环形铁桥，四周石台上立着一座座铁砧，火星与热浪把整片空气烤得发抖
absent = ["天空 / 日光 / 光柱（城心在山腹里）", "雪 / 树木 / 草地 / 任何植被", "木构房屋 / 瓦顶 / 茅草", "冷蓝光（只属于秘法区）", "熔岩喷发 / 岩浆瀑布（熔岩只在坑里缓慢翻涌）", "玻璃 / 电灯 / 霓虹 / 现代机械", "训练假人 / 木桩靶", "飞行坐骑（旧世只有狮鹫航线）", "4.0.3 后的改动（城心布局旧世即如此）"]

