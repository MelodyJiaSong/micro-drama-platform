# 多兰纳尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg694"
name_zh = "多兰纳尔"
size_m = [280, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "村子骑在主干道上、北有林丘南坡向湖取区图（区级图块 b902 200 m 格 + terrain 主干道折线）；屋子数量、尺寸、路北路南的分配与两条岔径均无一手出处，按锚点机位（村西路心朝东）能落进来的 280 × 240 m 推定"
# 世界树画面：林间十字路口的暗夜精灵村落，紫顶弧形木屋与藤蔓廊桥，路边立着发光的月亮石灯柱
# 区图：村屋图标在主干道南侧；主干道西来东去，东出几百米后折北进谷地、另岔虚线小径去东缘废弃小村；村南是细颈长湖
absent = [
    "任何人物、哨兵、商人与坐骑（默认空村）",
    "飞行点与角鹰兽栖架（4.0.3 才加，1.12 全区只有树根港口一处）",
    "围墙、木栅、寨门",
    "石砌房屋、茅草顶、人类式或兽人式建筑",
    "火、烛火、灯笼、火把与亮灯的窗（唯一人工光源是路边月亮石灯柱）",
    "训练假人",
    "焦黑或燃烧的树冠（8.x）",
    "4.0.3a 后的任何改动",
]

