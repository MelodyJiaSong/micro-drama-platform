# 奥拉密斯湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg700"
name_zh = "奥拉密斯湖"
size_m = [700, 360]
px_per_m = 2.2
grid_m = 50
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级 terrain.toml 坐标 (2220, 2000)；三段湖面直接平移自区级 [[water]]（区图 1 px ≈ 4.65 m）。北岸高坡与西北丘角量自区图；芦苇、白石滩、倒木、古树丛位置推定。十字路口村落在场地北缘外约 200 m，树冠外缘南段巨枝在南缘外约 80–140 m"
# 世界树画面：多兰纳尔以南的静水湖，湖面映出紫色树冠，岸边芦苇与倒伏的白木
absent = [
    "任何人物、动物与游鱼跃水（默认空湖）",
    "船、码头、栈桥与渔具",
    "湖心岛",
    "瀑布与急流（湖面是静水）",
    "屋舍、灯柱与任何人工光源",
    "燃烧或焦黑的林冠（8.x 焚毁，1.12 完好）",
    "飞行点与飞行坐骑",
    "4.0.3a 后的任何改动",
]

