# 班尼希尔山谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg697"
name_zh = "班尼希尔山谷"
size_m = [240, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "谷身南北约 300 m、谷底宽 40–70 m 按区图量推定：谷口在都城—十字路口那段主干道南侧（约 [44–47, 50]），谷尾是区图洞口图标 [43, 58]（兽穴），两点相距约 8% × 31 m ≈ 250–300 m；两壁高度无一手出处"
# 世界树画面：多兰纳尔到达纳苏斯大道以南的下凹峡谷，两壁树根裸露，谷底堆着熊怪的粗木图腾
# 区图：主干道在谷口北缘擦过；谷身向南切进中南丘；西南隔林丘是阶梯小潭群，东南是细颈长湖西湖段（都在场地外）
absent = [
    "任何人物、野兽人与野兽（默认空谷）",
    "溪流、积水与任何水面（谷底是干土槽）",
    "燃着的火、火把、灯笼与任何人工光源（火塘是冷灰余烬）",
    "兽穴洞内景（另属一档，本季无）",
    "精灵式屋舍、木桥与月亮石灯柱（那是十字路口村落）",
    "燃烧或焦黑的林冠（8.x 焚毁，1.12 完好）",
    "飞行点与飞行坐骑",
    "训练假人",
    "4.0.3a 后的任何改动",
]

