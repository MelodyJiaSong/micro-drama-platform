# 神谕林地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg704"
name_zh = "神谕林地"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区 m (1606, 835)，圣林图标（区级 b905，区 m ≈ 1756, 985）落在 (150, 150) 附近，林地圆心取 (165, 140)。西侧林丘取区级 terrain.toml「西北丘脊」东缘；北支路末端取区级 road 折线（止于区 m 1747, 1068 → 场地 141, 233）。北缘巨枝环北段在场地北外约 50–90 m 拔起、北部长湖在场地东外约 270 m，都不画。同心圆半径（井 5 m / 柱圈 25 m / 古树环 55–60 m）、石柱数与残损、新月形白石弧为推定"
# 世界树画面：西北端的圆形圣林，中央一口冷蓝月亮井，周围立着风化的精灵石柱与白色花海
absent = [
    "焦痕、枯死的树、燃烧或焦黑的树冠（8.x 焚毁，1.12 完好）",
    "火、烛火、灯笼、火盆等任何人工光源（唯一的非月光是井水微光）",
    "人物、祭司、动物、坐骑、显灵光效",
    "建筑、屋舍、木台、帐篷、营地",
    "第二条路（只有南面北支路一条）",
    "战争破坏的痕迹（石柱残损是多年风化）",
    "白昼、雨雪",
]

