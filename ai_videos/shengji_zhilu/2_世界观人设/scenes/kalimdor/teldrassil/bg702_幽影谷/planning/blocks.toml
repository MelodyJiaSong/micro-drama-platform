# 幽影谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg702"
name_zh = "幽影谷"
size_m = [500, 500]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "坐标 [58.4, 34.4]（区 m ≈ 2719, 1067）落在场地 (240, 210)；场地原点 ＝ 区 m (2479, 857)。区图 ≈ 4.65 m/px：巨树图标在该点东南约 16/32 px → (320, 360)；两口圆池图标在东北约 16/-10 px、西南约 -13/24 px；西北窄口洞穴图标约 -16/-22 px（区级 terrain.toml 称 [57,31] 的洞口，认定为黑丝洞）。主干道取区级 road 折线。三面丘坡轮廓、木台位置与大小为推定"
# 世界树画面：树冠东北的浅碗状林间谷地，紫蓝薄雾贴地，中央一株巨大发光金树，四周是新绿草坡与小木台
# 巨树本身另见 bg693（这里只画它在谷里的占地）；西面丘群背后的洞口 bg698 在场地外
absent = [
    "飞行点与飞行坐骑（1.12 全区只有树根港口一处）",
    "训练假人（1.12 没有）",
    "人物、训练师、坐骑、动物、蜘蛛、角色出生光效",
    "火、烛火、灯笼、篝火（唯一的暖光是巨树枝上的淡金光球）",
    "第二条出谷的路或桥（只有南面一条缓坡）",
    "石砌城墙、塔楼、人类式或兽人式建筑",
    "焦黑或燃烧的树冠（8.x 焚毁，1.12 完好）",
    "白昼、雨雪",
]

