# 盗羽洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：区级平面图坐标减 (1007, 1302) 即本图坐标（区图 [28, 53] ＝ 本图 (120, 120)）。
# 西南高崖的崖线照区级 terrain.toml「南墙」平移；区图洞穴图标落在崖线上 (87, 72) 附近，豁槽与洞厅按此向崖体内推定。
# 洞厅与岩架在崖体（ridge）之下，h_m 为净高或离地高度。

[meta]
bg = "bg748"
name_zh = "盗羽洞"
size_m = [240, 240]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "区图 1002 px ≈ 4023 m（每像素约 4.0 m，区级 terrain.toml 同口径）；崖线从区级平面图平移量取，豁槽、洞口与洞厅尺寸为推定"
# 世界树画面：峡谷南壁一处洞口不大的岩洞，洞内堆满鹰身人攒下的食物与骨头，岩壁被爪痕划得发白。
absent = ["任何火、火把、火盆与洞内照明", "发光水晶", "坍塌堵死的洞口（4.0.3a 南壁坍塌之后）", "第二个洞口 / 后门", "任何水面", "淹没峡谷的大水面", "建筑与木作", "绿色植被", "雪"]

[[ridge]]
name = "西南高崖（峡谷南壁，含向内凹进的豁槽）"
poly = [[0, 25], [72, 79], [84, 103], [89, 118], [102, 121], [106, 106], [112, 95], [157, 111], [240, 165], [240, 240], [0, 240]]
height_m = 240
src = "地图量取"

