# 高巢 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：区级平面图坐标减 (230, 730) 即本图坐标（区图 [11, 37] ＝ 本图 (213, 262)，中央鞍部）。
# 高台外缘、界外崖壁、针岩·12 照区级 terrain.toml 平移；三瓣岩墩按区图上三个巢图标的位置量取。
# ridge 的 height_m 一律是「高出峡谷谷底」的绝对高度：高台 70、岩墩 85、界外崖壁 240。

[meta]
bg = "bg747"
name_zh = "高巢"
size_m = [500, 450]
px_per_m = 3.2
scale_src = "地图量取"
scale_note = "区图 1002 px ≈ 4023 m（每像素约 4.0 m，区级 terrain.toml 同口径）；高台轮廓平移自区级「高巢台地」，岩墩半径与坡道为推定"
# 世界树画面：峡谷最西端一处高出谷底的封闭台地区，岩壁上层层叠叠全是双足飞龙的巢，蛋窝散在红岩平台上，上方是开阔的天。
absent = ["任何建筑、帐篷、围栏与栈道", "高台边缘的护栏", "任何水面", "淹没峡谷的大水面（4.0.3a 之后）", "火与人工光源", "森林与草地", "第二条上下高台的路", "雪"]

