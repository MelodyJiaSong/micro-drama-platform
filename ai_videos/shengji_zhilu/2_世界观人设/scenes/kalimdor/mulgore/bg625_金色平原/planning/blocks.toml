# 金色平原 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图 ＝ 区级 bg615 平面图（区图 4.688 m/px）平移截取：本地 (x, y) ＝ 区级 (x − 1880, y − 1060)。
# 高台、东缘山墙、北路、岔道、货车、石井位置照抄区级；巨石 / 孤树 / 兽道 / 头骨是本档推定。
# 区图上本子区域未标名，外框本身就是区级的推定框（区级 b925）。湖北岸在本图南缘外约 6 m，不画。
# 机位（锚点图）：南高台东南崖脚缓坡约 (140, 300)，朝东南偏东（方位角约 112°）。

[meta]
bg = "bg625"
name_zh = "金色平原"
size_m = [920, 640]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "从区级 bg615 平面图平移截取（区图 1002×668 px，两轴 4.688 m/px，出处见 bg615 terrain.toml）；子区域边界区图未标，属推定"
# 世界树画面：雷霆崖东南一大片草色偏金黄的开阔盆地，草浪一直铺到山脚，成群的科多兽在其中缓行
absent = ["帐篷与营地", "围栏与农田", "麦田 / 收割痕迹", "河流", "成片树林", "枯死的黄草（这里是活草）", "西北高台营地与通石爪山脉的山道（4.0.3a 后）", "雪", "飞行坐骑"]

