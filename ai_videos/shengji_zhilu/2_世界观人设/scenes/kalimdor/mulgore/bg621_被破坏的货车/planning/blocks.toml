# 被破坏的货车 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg621"
name_zh = "被破坏的货车"
size_m = [300, 300]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级平面图（bg615 terrain.toml，4.688 m/px）坐标 (2302, 1532)；土丘位置取区图图标 b921 (2452, 1632)，湖面与岔道从 terrain.toml 平移过来。丘、车、货物的尺寸是推定"
# 世界树画面：土丘上一辆烧塌的哥布林货车，还在往外冒黑烟，箱子散落一地，几个风险投资公司的人守着残骸
absent = [
    "任何人物与动物（守车的人、拉车的牲口都不入场景）",
    "火、烟、火星（默认态是烧后冷透；余烟态另立 bg）",
    "第二辆车（只有一辆）",
    "营地、帐篷、围栏、岗哨等任何建筑",
    "货箱上的文字、标记与徽记",
    "机械化载具（这是畜拉的厚木货车）",
    "4.0.3a 后的任何改动",
]

