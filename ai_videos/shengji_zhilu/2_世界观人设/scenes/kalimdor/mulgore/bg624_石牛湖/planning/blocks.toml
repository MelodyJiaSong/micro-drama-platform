# 石牛湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图 ＝ 区级 bg615 平面图（区图 4.688 m/px）平移截取：本地 (x, y) ＝ 区级 (x − 1980, y − 1560)。
# 湖形、村、货车、东路与岔道照抄区级 terrain.toml / blocks.toml；芦苇、浅滩、孤树、木桩是本档推定。
# 区级北路在湖颈处与水面重叠（区图精度所限），本档不画——锚点 prompt 里湖颈也没有路。
# 机位（锚点图）：东岸低坡约 (545, 250)，朝正西偏南。

[meta]
bg = "bg624"
name_zh = "石牛湖"
size_m = [620, 660]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "从区级 bg615 平面图平移截取（区图 1002×668 px，两轴 4.688 m/px，出处见 bg615 terrain.toml）；湖面宽度是区图上量的，岸线细节推定"
# 世界树画面：平原中央一汪清澈的浅蓝湖水，岸边是密实的草与芦苇，夜里湖面映着血蹄村的火光
absent = ["码头 / 栈桥 / 船只", "石砌堤岸", "河流入水口与出水口", "溪流与瀑布", "成片树林", "海岸线", "夜景火光（夜景是 shot 层条件分句）", "雪", "飞行坐骑"]

