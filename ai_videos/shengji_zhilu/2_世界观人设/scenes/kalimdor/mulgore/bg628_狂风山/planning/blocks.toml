# 狂风山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 锚点图机位：约 (60, 420)，站在西面草坡上朝东北（方位约 55°）略仰拍整面朝西的崖壁，离崖脚约两百米。

[meta]
bg = "bg628"
name_zh = "狂风山"
size_m = [480, 640]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区级平面图 bg615 把本档摆在东缘山块内侧、赤色石与矿洞之间（140×420 m 的推定条带）；本图外扩到西侧草坡与东侧山墙，边长为推定"
# 世界树画面：东部一道石脊，崖面上密布鹰身女妖的枝条巢穴，脊下草丛里藏着美洲狮与狼
absent = ["任何建筑、帐篷、围栏或井", "道路与车辙", "水面（河 / 湖 / 泉）", "火塘与任何人工光源", "矿洞口、脚手架与铁轨（属南侧 bg627）", "成片森林", "雪", "东口大门（旧世山口敞开无门）", "训练假人", "飞行坐骑"]

