# 黑海岸（darkshore）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 墙栅 / 洞口 / 水潭 / 岩台土坎走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重（本区新立 20 件）：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用一件——
#   木镇旅店 / 高脚屋 / 铁砧棚共用 a01；两艘泊船共用 a02；倒伏松 / 浮木 / 旧船料 / 倒伏断柱段共用 a07（横躺长柱）；
#   立柱 / 断柱墩 / 古碑 / 叶形灯柱共用 a10；巨石 / 落石堆 / 踏石 / 冷火塘围石共用 a09；三种布篷窝棚共用 a17。
# count>1 按资产自身 size_m 等比散布（不吃块的 h_m），所以老松林单列 a06（42 m），矮于资产的成排块不用 count。
# 判断记录（judgment call）：
#   bg483·b01 细瀑是水体不是实体，proxy 只占体积；bg481·b03 干涸井池走 pool（石圈 + 池底一层，previz 不分干湿）；
#   bg486·b01 阶梯大土坑无坑类 kind，走 yard，坑深由地形给；bg487·b09 青铜残器 / bg489·b09 兽骨散落 / bg490·b06 旧树桩带
#   都在齐膝以下、属 shot 层道具，走 yard；bg487·b05 南排矮断柱（齐胸）与 b06 弧形残墙是成排长条，走 low_wall；
#   bg478·b12 飞行木台、各处石阶 / 平台 / 基座 / 残破石台是实心台体，走 low_wall；bg478·b14 圈栏走 palisade；
#   土坎 / 陡土坡 / 退潮岩坪走 rock_shelf。

