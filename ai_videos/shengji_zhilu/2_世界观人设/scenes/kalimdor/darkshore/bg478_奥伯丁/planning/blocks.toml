# 奥伯丁 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg478"
name_zh = "奥伯丁"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级平面图 b901 取 240 × 220 m（区图两个屋形图标间距）；本图外扩到 360 × 300 m，把西侧海面与栈桥、东侧后坡与支路口装进来。镇内各屋位置与尺寸无一手出处，按 wiki「旅店 / 铁砧 / 马厩 / 镇北高台飞行点 / 两条栈桥」与区图朝西开口的海岸推定"
# 世界树画面：海岸边的暗夜精灵木镇，紫顶弧形屋与高脚木台沿沙滩排开，栈桥伸入灰雾海面
absent = [
    "任何人物、坐骑、角鹰兽与船员（默认空镇）",
    "石砌建筑、城墙、灯塔、石砌港池",
    "第三条码头与成排并泊的巨舰（只有两条栈桥、各泊一船）",
    "火、炉火、火盆、亮着的灯（叶形灯柱白天不亮）",
    "烧毁的废墟、塌屋、沉进海里的码头（4.0.3a 之后）",
    "燃烧中的巨树（8.x）",
    "晴空烈日与硬边阴影",
    "雪与冰",
]

