# 迷雾之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景：木镇外海的一片开阔水面。东缘是海岸（锚点图机位的背后），机位在 (960, 400) 离岸约 200 m、海面上方 3 m，朝正西。
# 画面左 ＝ 南（y 增大）、画面右 ＝ 北（y 减小）。

[meta]
bg = "bg493"
name_zh = "迷雾之海"
size_m = [1200, 800]
px_per_m = 1.2
grid_m = 100
scale_src = "推定"
scale_note = "海面本身无边界，场地只截取木镇外海一块 1200 × 800 m 的水面，把东缘的海岸、近岸礁屿与三根沉船桅杆装进来；区级平面图 terrain.toml 的「贴岸带」给出海岸线走向，其余礁屿与沉船位置无一手出处，按区图近岸散布的小礁屿与世界树画面「雾里偶露沉船桅杆」推定。机位 (960, 400) 朝正西"
# 世界树画面：黑海岸整条西岸外的灰色大海，浪头低而钝，海面上永远压着一层看不到尽头的白雾，雾里偶尔露出沉船桅杆的黑影
absent = [
    "任何人物、动物、海鸟、鱼群与海兽（默认空镜）",
    "航行中的船、泊船、码头、栈桥、灯塔（木镇与栈桥属相邻主体卡，在机位背后）",
    "对岸、海岛上的建筑、任何人造物（沉船残骸除外）",
    "太阳圆盘、蓝天、晴朗海面与硬边阴影（常年阴天、雾锁海面）",
    "大浪、风暴、雷暴、碎浪连片的白头浪（浪头低而钝）",
    "火、灯、火光与任何人工光源",
    "燃烧中的巨树（8.x）",
    "被海啸冲毁漂在海上的木镇残骸（4.0.3a 之后）",
    "雪、冰、浮冰",
]

