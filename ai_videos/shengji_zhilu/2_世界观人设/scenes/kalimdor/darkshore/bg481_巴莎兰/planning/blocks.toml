# 巴莎兰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：遗址中心 ＝ 坐标表 [45, 36] ≈ 区级平面图 (2695, 1437)；本场地原点 ≈ 区级 (2490, 1262)。1 区图 px ≈ 5.98 m。

[meta]
bg = "bg481"
name_zh = "巴莎兰"
size_m = [360, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "点位按坐标表 [45, 36]；主干道走向与擦边距离（西北约 50 m）从原版区图裁切量取，1 px ≈ 6 m，精度约 ±30 m；环形下沉台、井池、柱位与残壁尺寸为推定"
# 世界树画面：北部林间的环形遗址，残破石阶围着一口枯竭的月亮井，藤蔓爬满倾倒的立柱
absent = [
  "井里的水 / 发光的水面 / 蓝色或银白的井光 / 月光（井是干的）",
  "半透明的幽魂 / 发光符文 / 魔法阵（亡魂属 shot 层）",
  "海平线与海滩（海岸在西面约 300 m，被松林挡住）",
  "河 / 溪 / 瀑布（壁泉河在东北约 450 m 外）",
  "完整的建筑 / 屋顶 / 围墙 / 门楼 / 帐篷 / 营地",
  "坡地与台地（空地是平的，只有遗址向下沉）",
  "火 / 营火 / 火盆 / 烛火 / 灯笼 / 任何人工光源",
  "阳光光柱 / 蓝天 / 硬边阴影",
  "阔叶橡木林与暖金树冠 / 草甸 / 花田",
  "雪 / 冰 / 霜",
  "4.0.3a 之后的重建营地与毁损",
  "人物 / 动物",
]

