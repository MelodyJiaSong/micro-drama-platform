# 壁泉河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本档取主干道涉水过河段：原点 ＝ 区级平面图 (2712, 766)；河、路、山墙按区级 terrain.toml 平移量取。
# 源头细瀑（bg483）在场地外东南约 [540, 610]；河口在场地外北面约 500 m——两者都只作远景 / 不入画。
# 锚点机位：涉水口下游约 80 m 的平顶圆石 [282, 232]，离水面约 1.5 m，朝东南逆流平视。

[meta]
bg = "bg484"
name_zh = "壁泉河"
size_m = [600, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "河道、主干道与东山墙西缘按区级平面图（区图 x%×59.893、y%×39.929 m）平移量取，精度约 ±60 m；涉水浅滩宽约 30 m、土坎高约 1 m、倒松与河心洲的位置尺寸推定"
# 世界树画面：北部穿林而过的浅河，水色灰绿，河床遍布圆石，两岸是笔直的深色松林
absent = [
    "桥、磨坊、水车、码头与任何建筑（过河只有踏石浅滩）",
    "海与海滩（河口在场地外北面，这一段看不到海）",
    "近景瀑布（源头细瀑在东南几百米外，只作远景一根白线）",
    "营地、火与任何人工光源",
    "阔叶林、暖金树冠、草甸与农田",
    "湍急深谷、峡谷与深潭（这是一条及膝的浅河）",
    "晴空、太阳与硬边阴影",
    "雪、冰、熔岩",
]

