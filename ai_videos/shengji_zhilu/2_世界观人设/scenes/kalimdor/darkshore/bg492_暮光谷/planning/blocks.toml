# 暮光谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：世界树无坐标；本档取林带中段切片 ≈ 区图 (35.8–41.5%, 57.9–71.9%)，按区图 1 px ≈ 5.98 m 量取路、崖坎与山墙坡脚（约 ±20 m）。
# 北缘外是亚米萨兰（bg480），南缘外约 50 m 是急弯河（bg494）。

[meta]
bg = "bg492"
name_zh = "暮光谷"
size_m = [560, 560]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "林带宽度、主干道走向、西缘海岸崖坎与东缘山墙坡脚按区图量取；wiki 只给范围（亚米萨兰以南直到灰谷边界），这里只画中段一块切片；林下诸物（最粗老松、倒木、巨石、林窗）无一手出处，推定"
# 世界树画面：南部的密林谷地，树干更粗更暗，林下终日半明半暗，地面厚厚一层针叶
absent = ["任何建筑 / 废墟 / 营地 / 栅栏（林中熊怪营地属别卡与 shot 层）", "河 / 湖 / 海（海在西缘崖坎下看不到，河在南缘外）", "直射阳光 / 丁达尔光柱 / 硬边阴影", "阔叶林 / 秋色 / 花海", "第二条路或横穿林带的小径", "火 / 火堆 / 灯 / 任何人工光源", "4.0.3a 之后的烧林 / 被毁营地 / 新增哨站 / 裂谷", "人物 / 动物"]

[[ridge]]
