# 急弯河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：场地原点 ＝ 原版区图像素 (385, 452)；1 px ≈ 5.98 m（区图 1002 px ＝ 5989 m）。拐点 ≈ 区图 (45, 72)。

[meta]
bg = "bg494"
name_zh = "急弯河"
size_m = [700, 500]
px_per_m = 2.2
grid_m = 50
scale_src = "地图量取"
scale_note = "从原版区图裁切 (385–502, 452–536) px 量取，1 px ≈ 5.98 m，精度约 ±30 m；峡口宽、土坡高、圆石带大小为推定"
# 世界树画面：南部急转的浅河，水流湍急冲过圆石，两岸是陡起的土坡与裸露树根
absent = [
  "桥（任何形制的桥都没有；主干道在下游浅滩直接涉水）",
  "人工堤岸 / 石砌护坡 / 水坝 / 水车 / 磨坊 / 码头",
  "瀑布与跌水（出峡口是贴底的湍流，不是落差；本区的瀑布在北部另一条河的源头）",
  "海平线与海滩（海在下游浅滩再往西两三百米，被松林挡住）",
  "峡谷里的路（峡中只有湍流与贴水的崖壁，不通行）",
  "雪 / 冰 / 霜",
  "阔叶橡木林与暖金树冠",
  "直射阳光 / 蓝天 / 丁达尔光柱",
  "火 / 营火 / 火把 / 灯笼 / 任何人工光源",
  "被洪水冲毁的林子 / 地面裂开的深沟 / 泡在水里的枯死林（那是 4.0.3a 之后；1.12 的河岸完好）",
  "建筑 / 帐篷 / 营地（相邻林地营地在南岸林子后面，本档不拍）",
]

