# 提度斯阶梯 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (5820, 2380) m；岸线按 bg707 terrain.toml 外海岸线 x≈64–65% 换算；阶梯各级全部推定（区图未标）。
# 高差：西高东低，崖顶 30 m → 六级岩台（h_m ＝ 台面高出平潮海面的米数）→ 东侧浅海。

[meta]
bg = "bg735"
name_zh = "提度斯阶梯"
size_m = [400, 320]
px_per_m = 3.5
scale_src = "推定"
scale_note = "区图未标本地点；位置按世界树「棘齿城东南的海岸」推定在区级 (5992, 2460)，坐标待核；岸线位置取区图量取的 x≈64–65%，崖高按 bg707 东缘断崖 40 m 取 30 m，各级岩台尺寸推定"
# 世界树画面：海边一组天然形成的层层岩台，像被凿出的巨型石阶一级级落向海面
absent = ["人工台阶、砌缝、栏杆、石雕与台面上的任何建筑", "码头、栈桥、船只（港镇与栈桥只在北面远处作剪影）", "灯塔", "亮着的火、篝火与任何人工光源", "发光的水体 / 人形的水（水灵属 shot 层）", "大浪、风暴、海啸冲毁的海岸", "茂密树林与绿草地（崖顶只有枯草与稀疏伞树）", "沙滩上的营地与帐篷", "雨、雪、夜景", "人物、坐骑、垂钓者（属 shot 层）"]

[[ridge]]
name = "西侧黄土断崖台地（崖顶）"
poly = [[0, 0], [118, 0], [124, 90], [112, 180], [120, 262], [108, 320], [0, 320]]
height_m = 30
src = "推定"
note = "崖顶平坦，枯草与稀疏伞树；崖脚一片塌落多年的碎石坡"

[[water]]
name = "东侧青蓝浅海"
path = [[345, 0], [345, 320]]
width_m = 110
depth_m = 1.2
src = "地图量取"
note = "bg707 外海岸线 x≈64–65% 换算；外侧十几米后骤深"

[[road]]
