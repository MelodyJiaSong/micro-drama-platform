# 迅猛龙巢穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (5117, 3447) m；区图未标本子区域，中心取 bg707 的推定块 (5317, 3607)——东南山脊东端的东南脚、北方城堡西南约 400 m。

[meta]
bg = "bg726"
name_zh = "迅猛龙巢穴"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图未标；按世界树「北方城堡以西的一小块凹谷」摆在 bg707 东南山脊东端脚下，凹谷尺寸、窝棚与拾来物堆全部推定"
# 世界树画面：一小块凹下去的谷地，散着迅猛龙用树枝与骨头搭起来的粗糙窝棚，地上亮闪闪的拾来物堆成小丘
absent = ["水 / 水潭 / 溪（凹谷是干的）", "野猪人式草泥圆顶棚与刺藤（那是西南方的荆棘丘陵）", "石砌建筑与营帐（方堡在凹谷外东北，只作远景）", "大裂谷 / 地裂", "树林（凹谷只有两三棵伞状矮树）", "亮着的火与人工光源", "蛋里孵出来的活物 / 任何动物", "金币堆成的宝藏山（拾来物是破铜烂铁，不是财宝）"]

[[ridge]]
