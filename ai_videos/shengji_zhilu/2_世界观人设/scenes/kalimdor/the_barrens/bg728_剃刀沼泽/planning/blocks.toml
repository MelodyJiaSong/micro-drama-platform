# 剃刀沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (3450, 5200) m；区图标注 [41, 88] 落在场地中西部。

[meta]
bg = "bg728"
name_zh = "剃刀沼泽"
size_m = [800, 520]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区级平面图 bg707 的剃刀沼泽块（600×350 m，区图 [41, 88]）外扩到西侧山脚与东侧黄金之路；刺丛高度与拱门尺寸为推定"
# 世界树画面：南端西侧一大片高过人头的黑色荆棘丛，藤刺盘绕成拱与墙，中间只留一条勉强通过的窄道
absent = ["积水 / 沼泽水面（名为沼泽，1.12 这里只有干硬的泥浆壳）", "南缘崖外的水面（1.12 南邻是干涸石林与白色盐滩）", "大裂谷 / 地裂", "树林与绿地", "石砌建筑", "第二个入口（刺丛只有东北面一道拱门）", "亮着的火与人工光源", "被天灾污染的灰黑枯藤与鬼火（那是南邻的另一座副本入口）"]

[[ridge]]
name = "西墙南端山脚（界山南端）"
