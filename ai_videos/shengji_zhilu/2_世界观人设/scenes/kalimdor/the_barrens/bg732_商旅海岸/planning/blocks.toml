# 商旅海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan「商旅海岸」块（港镇以南、方堡以北的一截岸线，区图 x≈62–64%、y≈41–54%）外扩成 480 × 900 m。
# 「西高东低：崖顶草原 / 黄土断崖 / 贝壳沙滩 / 海」来自世界树画面（原典方位）；崖线弧形、豁口、旧营、礁石、树的位置全部推定。

[meta]
bg = "bg732"
name_zh = "商旅海岸"
size_m = [480, 900]
px_per_m = 1.6
grid_m = 100
scale_src = "推定"
scale_note = "区级 floor plan 把本块画成 200 × 800 m（区图量取岸线）；这里东西外扩到 480 m 以包进崖顶草原边缘与近岸海面。崖高 15–30 m、沙滩宽 40–60 m、外海小岛离岸约 500 m（在场地外东侧）为推定"
# 世界树画面：贫瘠之地的东侧海岸线，黄土断崖直落到青蓝浅海，崖下是细碎的贝壳沙滩
absent = [
    "港口、栈桥、码头、吊车与灯塔（栈桥只属北面港镇，不在本段）",
    "停泊或航行的船只（沙滩上只有一条翻扣的小划艇）",
    "任何人物、海盗、商人、海鸟与其他动物（默认空）",
    "燃着的火与烟（旧营火坑是冷灰余烬）",
    "黑色火山岩、白垩崖（断崖是松软的黄土层）",
    "风暴、巨浪、海啸冲毁的痕迹",
    "树林与绿地（崖顶只有赭黄干草与两棵歪伞树）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "雪、雨",
]

[[ridge]]
name = "崖顶草原台地（干草原东缘，东边被黄土断崖齐齐切断）"
poly = [[0, 0], [300, 0], [296, 150], [285, 300], [276, 450], [272, 600], [282, 750], [300, 900], [0, 900]]
height_m = 25
src = "原典方位"
note = "东缘即断崖线，向南弯成长弧（弧形推定）；崖高 15–30 m 起伏"

[[water]]
name = "近岸海面（浅青 → 深蓝，浪很小）"
path = [[420, 0], [420, 900]]
