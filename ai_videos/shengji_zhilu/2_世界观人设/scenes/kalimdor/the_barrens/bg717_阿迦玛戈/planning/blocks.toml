# 阿迦玛戈 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg717"
name_zh = "阿迦玛戈"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "营地按五座圆顶棚一圈的规模推定（圈墙直径约 110 m）；场地取营地 + 西侧界山坡脚 + 东南锚点机位所在的干草坡，无一手尺寸出处。区图量取：红十字紧贴西缘山影内缘，黄金之路在东南约 0.5–0.6 km（界外）"
# 世界树画面：路北一片荆棘环绕的野猪人营地，圆顶草棚与插地木刺围成圈，地上散落血色的碎晶
absent = [
    "任何人物、野猪人与动物（默认空营）",
    "燃着的火与炊烟（火塘是冷灰余烬）",
    "自发光的碎晶（碎晶只反光、不发光）",
    "石砌建筑、木板房与兽人式地穴（这里只有草泥圆顶棚）",
    "黄金之路路面（大路在东南界外约 0.5 km，本场地只有一条踩出来的土径）",
    "河流、溪水、水潭（冲沟是干的）",
    "树林与绿地（只有干草、刺藤与两三棵伞树）",
    "旗帜纹章与任何文字标识",
    "4.0.3a 后的任何改动（该子区域在大灾变被移除）",
]

