# 荣耀岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan（bg707 terrain.toml）坐标 x 3215–3575、y 1550–1850 一块，原点平移 (-3215, -1550)。
# 西路与南面界山北缘从区级 terrain 平移而来（地图量取）；北面西北丘群的南缘在场地以北约 200 m，不入图。
# 「路边、几座土穴、两座木塔、一座塌一半」来自世界树（原典方位）；具体摆位、尺寸与修补痕迹全部推定。

[meta]
bg = "bg724"
name_zh = "荣耀岗哨"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级 floor plan 把哨站画成 200 × 200 m（推定）；这里取西路进山口前 360 × 300 m 一段，道路与山缘量自区图（±90 m）；土穴 / 哨塔尺寸按十字路口同形制推定"
# 世界树画面：西路边上几座兽人地穴与两座木制哨塔，其中一部分被打塌了一半，苦工正在修补
absent = [
    "石砌城墙、砖房、石塔（只有土、木、兽皮、麻绳）",
    "投石车与狼栏（那是东边界河旁另一处哨点的特征）",
    "修好的西塔（默认态西塔塌了一半）",
    "任何人物、苦工、坐骑与动物（默认空站，只留修补痕迹）",
    "燃着的火与炊烟（火塘是冷灰余烬）",
    "河流、水塘、溪水",
    "成片树林（只有山口坡上几棵稀疏矮树）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "旗帜纹章与文字标识（旗杆布条无图案）",
]

