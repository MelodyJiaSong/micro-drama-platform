# 甜水绿洲 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (4059, 2158) m；主潭与北岸洞口按 bg707 terrain.toml（区图 [45–48, 38–40] / [46, 36]）平移换算。

[meta]
bg = "bg725"
name_zh = "甜水绿洲"
size_m = [640, 380]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "主潭位置与长度、北岸洞口、东侧黄金之路从区级平面图 bg707（地图量取，±90 m）换算；两处小潭、棕榈林、芦苇、岩丘尺寸为推定"
# 世界树画面：十字路口正南的绿洲，几潭深碧的水被高棕榈围住，水汽让空气比周围凉，池边有一处向下的黑洞口
absent = ["连成大湖、漫出绿洲淹没草原的水面（4.0.3a 后的样子；1.12 只有几潭小水）", "绿洲里的木屋、树屋、月牙形精灵式建筑与营地（1.12 这里没有据点）", "洞口外发光的青苔与荧光植物（洞里的光不外泄）", "河流与溪流（几潭水互不相连）", "大裂谷 / 地裂", "阔叶林与草甸（绿只贴着水边一圈）", "亮着的火与人工光源", "码头、木栈桥、船"]

