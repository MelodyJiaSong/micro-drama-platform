# 巨人旷野 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan（bg707 terrain.toml）坐标 x 3850–4650、y 3950–4750 一块，原点平移 (-3850, -3950)。
# 西缘界山内缘、东侧山带北段、黄金之路中南段与南部东向岔路从区级 terrain 平移并裁到场地内（地图量取）；
# 骨架、伞树、旧兽径、机位缓坡全部推定。

[meta]
bg = "bg722"
name_zh = "巨人旷野"
size_m = [800, 800]
px_per_m = 1.6
grid_m = 50
scale_src = "地图量取"
scale_note = "两侧山带与大道量自原版区图（1 px ≈ 9.25 m，±90 m）；草场南北取 800 m，覆盖区级「巨人旷野」块（700×700，推定）的主体；骨架尺寸按巨型四足兽推定"
# 世界树画面：南部一大片开阔草场，成群的巨型科多兽在其中缓慢游走，地上零星散着巨大的白骨
absent = [
    "部落战争堡垒、联盟前沿要塞、任何营地与围栏（4.0.3a 才建；1.12 草场上零建筑）",
    "把草原劈开的大裂谷与深沟（4.0.3a 后才有；1.12 南北连成一块）",
    "活的兽群与任何人物（锚点图空场，兽群属 shot 层）",
    "水塘、溪流、河（草场里没有一滴水）",
    "成片树林与绿草甸（只有零星伞树）",
    "火、炊烟与任何人工光源",
    "被烧毁的营地废墟（1.12 北边的圆锥大帐完好，且不在本档画面内）",
    "旗帜纹章与文字标识（路碑碑面光秃）",
]

