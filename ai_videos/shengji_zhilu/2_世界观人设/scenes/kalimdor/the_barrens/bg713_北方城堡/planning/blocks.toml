# 北方城堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位来自区图（城堡图标 [61, 55] 贴海岸、北侧山块、西来支路，见 bg707 terrain.toml）；城内外布局按世界树画面推定。

[meta]
bg = "bg713"
name_zh = "北方城堡"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "方堡边长 ~110 m 与墙外营区按联盟石砌要塞常识推定；区级平面图 b913 取 300 m 见方的体块，本图把崖头、海与墙外营区一并框进来"
absent = ["码头 / 栈桥 / 港口（全区只有北边海湾那一处港镇有栈桥）", "东墙城门（唯一城门在西墙）", "原木寨墙与兽皮帐篷（那是草原上的部落营地）", "大灾变后的焚毁城墙与攻城残骸", "雪 / 冰", "燃着的火盆、火把与灯笼", "任何人物、马匹与狮鹫", "飞行坐骑", "训练假人"]

[[ridge]]
name = "北侧褐色山体（死水绿洲—北方城堡之间山块的南脚）"
poly = [[0, 0], [400, 0], [330, 45], [250, 62], [150, 66], [60, 78], [0, 86]]
height_m = 60
src = "地图量取"
note = "区图 [56–63, 41–49] 山影压在城堡北侧；轮廓在本尺度下为示意"

