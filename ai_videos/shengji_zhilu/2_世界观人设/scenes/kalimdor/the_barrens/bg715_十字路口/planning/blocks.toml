# 十字路口 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 路网走向来自区图（黄金之路南北、西路向西、东南路去港镇；东路在镇北几百米处另岔，出本图，见 bg707 terrain.toml）；桩墙与墙内布局按世界树画面推定。

[meta]
bg = "bg715"
name_zh = "十字路口"
size_m = [240, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "桩墙约 110 m 见方按兽人式小镇常识推定；区级平面图 b915 取 250 m 见方"
absent = ["石墙与城门（1.12 只有尖头原木桩墙，豁口无门扇）", "大灾变后的加固扩建与被围攻的焚毁痕迹", "把草原劈成两半的大裂谷", "河流 / 溪流 / 水塘（最近的水在正南的绿洲）", "森林与农田", "燃着的火堆、火把与灯笼", "任何人物、双足飞龙、科多兽与狼", "飞行坐骑", "训练假人"]

