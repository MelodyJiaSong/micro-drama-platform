# 黑棘山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg718"
name_zh = "黑棘山"
size_m = [500, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区级平面图按区图西侧山脚的野猪人图标取 [42, 80]、给 500 × 300 m 的范围（地图量取）；本图在南侧多留 100 m 装下脊脚清潭与南岸锚点机位。支脊长宽、潭宽均为推定，无一手尺寸出处"
# 世界树画面：长满黑色带刺灌木的一道山脊，脊顶一处小营地，脊下有一汪格外清澈的水潭
absent = [
    "任何人物、野猪人与动物（默认空营）",
    "燃着的火与炊烟（火堆是冷灰余烬）",
    "野猪人草泥棚与刺藤圈墙（世界树只给脊顶一处单帐小营地）",
    "溪流、河道与第二处水体（只有脊脚这一汪清潭，岩脚细泉只流几步入潭）",
    "绿地与树林（绿只在潭边一圈芦苇水草）",
    "石砌建筑与木板房",
    "黄金之路路面（大路在东面界外约 0.3–0.4 km）",
    "旗帜纹章与任何文字标识",
    "4.0.3a 后的任何改动（该子区域在大灾变被移除）",
]

