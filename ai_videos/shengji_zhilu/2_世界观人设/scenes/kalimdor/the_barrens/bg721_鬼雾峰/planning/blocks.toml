# 鬼雾峰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan（bg707 terrain.toml）坐标 x 3830–4730、y 800–1400 一块，原点平移 (-3830, -800)。
# 山块外轮廓、黄金之路北段、绿洲水塘从区级 terrain 平移而来（地图量取）；主峰与山肩的分界、小径、岩台、窝棚、洞口全部推定。

[meta]
bg = "bg721"
name_zh = "鬼雾峰"
size_m = [900, 600]
px_per_m = 1.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区级 terrain「鬼雾峰山块」量自原版区图（1 px ≈ 9.25 m，±90 m）；主峰高出草原约 180 m 取区级 height_m；岩台 / 窝棚 / 小径尺寸按常识推定"
# 世界树画面：一座孤立的高岩峰，越往上空气越红越浊，峰顶被一层暗红雾罩住，能见度极低
absent = [
    "燃着的火、炊烟、洞口透出的火光（默认态火坑是冷灰，洞口只是暗红昏暗）",
    "洞内的深紫种子与任何紫色光外泄（属内景，不入本档）",
    "任何人物与动物（默认空营）",
    "罩住整片草原或山脚的雾（浊雾只在峰顶约上三分之一）",
    "石砌建筑、城墙、塔楼",
    "溪流、瀑布、湖（只有西南山脚外一处小绿洲水塘）",
    "树林与连片灌丛（只有近景一棵孤伞树与零星刺灌）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "旗帜纹章与文字标识",
]

[[ridge]]
name = "西段山肩（圆钝矮岩丘，无雾）"
poly = [[54, 125], [378, 79], [470, 102], [470, 420], [378, 421], [100, 402]]
height_m = 90
src = "地图量取"
note = "外轮廓取区级「鬼雾峰山块」西段；与主峰的分界 x≈470 为推定；高度取主峰一半（推定）"

[[ridge]]
