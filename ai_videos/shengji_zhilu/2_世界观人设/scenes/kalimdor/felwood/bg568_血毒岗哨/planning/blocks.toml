# 血毒岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1640, 1680)；世界树坐标 [34, 52] ＝ 区级 (1787.7, 1822.7) ＝ 本图 (148, 143)，即木桩圈中心。
# 西泄支流、区界湖、西南大山块按区级 terrain.toml 平移裁切；南面山梁、坡台挡土、营内布局为推定。
# 锚点机位：营地东侧坡上（约 (255, 150)，高出营地几米），平视略俯朝西北。

[meta]
bg = "bg568"
name_zh = "血毒岗哨"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "支流、湖岸与西侧山脚按区级平面图（区图 x%×52.578、y%×35.052 m）平移量取；木桩圈直径约 90 m 与营内帐篷、火塘、栖架、矮棚的位置尺寸均为推定"
# 世界树画面：污河边的部落小营，几顶皮帐与一圈尖木桩，火堆的烟被绿雾压得贴地
absent = [
    "任何人物、坐骑与动物（默认空营，栖架上没有飞兽）",
    "燃着的火与炊烟（火塘是冷灰余烬）",
    "石砌房屋、城墙与木门扇（只有尖木桩圈与一个无门豁口）",
    "旗帜纹章与任何文字标识",
    "瀑布本体（在东北方约三百米外，被山坡挡住）",
    "清澈的活水与健康绿林",
    "中立营地的飞行点与 4.0.3a 后的任何改动（此营大灾变后失守）",
]

