# 血毒河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg577"
name_zh = "血毒河"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标；取瀑布以南约 800 m 的代表河段，场地原点对应区级坐标 (2130, 2470) m。区级 terrain.toml 里这段河与主道本身就是「把区图上一串小潭连起来」的推定线，本图在其走廊内细化出一处涉水浅滩与一个河弯死水潭，同为推定"
# 世界树画面：纵贯全区的污染河流，水面浮着荧绿色油膜并不断冒泡，河岸的草全都枯白
absent = [
    "奔流的大河、急流与白浪（这是一条几乎不动的浅污水溪）",
    "清澈见底的水与健康的水草",
    "发光的河水、发光的油膜、照亮岸边的荧光",
    "石砌堤岸、桥梁、码头与水车（河上唯一的「桥」是一根半沉的倒木）",
    "建筑、营地、火堆与任何人工光源",
    "鲜绿草地（净土在东南场外）",
    "雪、冰与晴天蓝天",
    "鱼、水鸟与任何动物，任何人物",
    "文字",
    "4.0.3a 后的任何改建",
]

