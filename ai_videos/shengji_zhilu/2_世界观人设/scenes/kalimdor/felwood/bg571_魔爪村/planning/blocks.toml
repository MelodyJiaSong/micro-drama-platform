# 魔爪村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg571"
name_zh = "魔爪村"
size_m = [400, 320]
px_per_m = 4.0
grid_m = 50
scale_src = "推定"
scale_note = "场地原点对应区级坐标 (3057, 251) m，点位 [61, 14] 落在场地 (150, 240)。北缘山带、东北山嘴、北潭、隧道口按区级 terrain.toml 换算（地图量取）；土路按区图裁切放在村南（区级 terrain 的北端接线是推定、放在村北，两者冲突时从裁切）。十一座棚的密挤布局按世界树画面「棚屋密集」推定"
# 世界树画面：最北端的熊怪村落，棚屋密集，村口木架上挂着腐烂的战利品
absent = [
    "稀疏散开、歪斜塌顶的棚子（那是南部死木村的形制，本村密、整）",
    "点着的火塘、火把、烛火、灯笼与任何人工光源（火塘默认冷灰余烬）",
    "血肉与新鲜尸体（战利品只是旧皮子、锈刃、瘪头盔与兽牙）",
    "兽人式兽皮帐篷、拒马、寨墙与瞭望塔",
    "发光的腐化雾气与荧光特效（荧绿只是潭水与苔垢颜色）",
    "积雪与冰（那是隧道另一头的邻区）",
    "鲜绿健康的草木",
    "旅店、飞行点、任何石砌建筑",
    "任何人物、熊怪与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

