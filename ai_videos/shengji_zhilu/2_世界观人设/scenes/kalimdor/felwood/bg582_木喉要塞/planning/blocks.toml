# 木喉要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图画的是山体内部的隧道交汇洞厅，不是区图上那个南口（南口在区级平面图 b905）。
# 三向方位出自原典：南口通费伍德、东口通冬泉谷、北口通月光林地；洞厅尺寸与构架全部推定。

[meta]
bg = "bg582"
name_zh = "木喉要塞"
size_m = [180, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "洞厅按世界树画面「圆形洞厅、粗木梁撑顶、中央大火塘」推定为直径约 40 m、高约 14 m；场地取洞厅 + 三条隧道各一段能装下的 180 × 160 m，无一手尺寸出处"
# 世界树画面：凿在山体里的熊怪要塞隧道，圆形洞厅由粗木梁撑起，中央燃着大火塘，墙上挂满图腾与兽皮
absent = [
    "任何人物、熊怪守卫、商人与动物（默认空厅）",
    "天光、天井与洞口透光（三条隧道深处全黑）",
    "火把、灯笼、烛火与绿色火焰（唯一光源是中央火塘）",
    "腐化的荧绿苔垢、孢子雾与污水（那是洞外的颜色）",
    "石砌墙、砖拱与金属构件（全是夯土、岩面与原木）",
    "文字、旗帜与纹章",
    "4.0.3a 后的任何改动",
]

