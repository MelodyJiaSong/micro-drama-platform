# 铁木森林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg578"
name_zh = "铁木森林"
size_m = [560, 520]
px_per_m = 2.8
scale_src = "地图量取"
scale_note = "世界树无坐标；场地原点对应区级坐标 (2320, 500) m，覆盖区级块 b903。原版区图 5.247 m / 像素（区级 terrain.toml 同一换算），新月岩脊、三个圆坑、中部浅水潭、路西两潭与西北缘土路都从区图量取；树林范围与断树位置为推定"
# 世界树画面：北部林区，树干粗硬发灰像铁铸的柱子，地面覆着一层灰白木屑
absent = [
    "焦黑扭曲的枯树（本档的树是铁灰色笔直硬干，不许画成全区通用的扭树）",
    "黑泥与腐殖泥地面（这里一律是灰白木屑）",
    "冒泡的污水河（河在南边瀑布以下；这里只有坑底不动的死水）",
    "山洞洞口（铁木山洞的位置未核实，本档不画）",
    "营地、帐篷、建筑与火堆，任何人工光源",
    "发光的菌毯与发光水面",
    "鲜绿草地、雪与晴天蓝天",
    "任何人物、活动的树形怪物与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

