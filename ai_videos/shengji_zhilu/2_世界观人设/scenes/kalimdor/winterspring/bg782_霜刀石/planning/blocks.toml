# 霜刀石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg782"
name_zh = "霜刀石"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "岩峰、北路起点、北缘界山与西北山舌的相对位置取区级 terrain.toml（区图 x% × 64.922 m、y% × 43.282 m；岩峰图标约 [50.4, 10.8]）；岩架 / 崩石 / 雪坎尺寸无一手出处，推定"
grid_m = 50
# 世界树画面：雪原北部突起的巨大岩峰，岩缝里卧着白色霜刃豹，岩顶终年积雪
# 锚点机位：岩峰正南约 200 m 的缓雪坡上（约 [235, 350]），贴雪面略仰，朝正北
absent = [
    "任何人物与动物（豹卧岩架属 shot 层，底图空）",
    "建筑、营地、帐篷、围栏与任何人造物（只有一条窄雪道）",
    "火、烛火、灯笼与任何人工光源",
    "绕到岩峰背后或继续向北的路",
    "夜空、极光与暴风雪（默认态清晨晴）",
    "湖泊与开放水面",
    "阔叶林、草地与裸露泥土",
    "4.0.3a 后的任何改动",
]

