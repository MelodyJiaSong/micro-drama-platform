# 暗语峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 两壁与两座岩台从区级 terrain.toml 同名山脊平移过来（本图原点 ＝ 区图 m 坐标 [3510, 3312]）。

[meta]
bg = "bg779"
name_zh = "暗语峡谷"
size_m = [900, 600]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "区级平面图 bg773 b904（区图 DARKWHISPER GORGE 标注，约 [53–68, 74–92]）取 900×560 m，本图取 900×600 m；谷底再往南的一段在场地外"
# 世界树画面：南端的深黑峡谷，两壁几乎垂直，谷底没有雪、只有赤黑的裸岩与零星恶魔火光
absent = ["谷底积雪与冰面", "云杉与任何绿植", "河流、湖泊与积水", "熔岩与燃烧中的火（默认态零火光）", "营地、帐篷与建筑", "向南的开放通道（1.12 南端不可进入）", "第二个出入口（只有北口）", "飞行点", "训练假人", "大灾变后的新营地与新地名"]

