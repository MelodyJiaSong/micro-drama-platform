# 永望镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg774"
name_zh = "永望镇"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 18.8 m：EVERLOOK 围墙图标约 8×6 px ≈ 150×110 m，墙外留一圈雪地与两座飞行木台；墙内布局无一手出处，按旅店 / 货栈 / 杂货 / 铁匠 / 马厩 / 飞行点六项功能推定"
# 世界树画面：雪地里的哥布林贸易站，铁皮棚屋与冒黑烟的烟囱挤在一起，货箱与蒸汽管道堆在路边
# 1.12 区图：围墙图标在 [61, 37.6]，东路从西北三岔口进来接西门，南路自镇东南出发向南；镇北 ~350 m 孤岩丘，镇东 ~400 m 东墙山脚
absent = [
    "港口、码头、飞艇与飞艇塔（1.12 本区没有）",
    "石砌城墙、城门楼与石屋（全镇只有木板与铁皮）",
    "任何人物、坐骑与栖在木台上的飞兽（默认空镇）",
    "明火、火把、灯笼与亮着的窗户（默认白天）",
    "训练假人",
    "文字招牌",
    "草地、阔叶树与任何绿色植被（只有远山云杉）",
    "大灾变后新增的营地与建筑",
]

