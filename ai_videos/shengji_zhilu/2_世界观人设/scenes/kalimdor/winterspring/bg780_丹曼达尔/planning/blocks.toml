# 丹曼达尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树只有「石砌基座 + 半人高残墙 + 冰洞口」三样；方院尺寸、墙段残存与冰洞方位全部推定。

[meta]
bg = "bg780"
name_zh = "丹曼达尔"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标、区级平面图未落点；按「雪原上的小型石砌基座 + 一处冰洞口」推定 260×220 m，装下方院残墙、山脚冰洞与西北云杉"
# 世界树画面：雪原上的小型石砌基座与一处冰洞口，残墙只剩半人高
absent = ["完整的房屋与屋顶", "雕像、碑刻与祭坛（基座是空的）", "门扇与木构", "营地、帐篷与火堆", "灯笼与人工光源", "流动的水（溪已冻住）", "道路与路标", "飞行点", "训练假人", "港口与码头"]

[[ridge]]
name = "东墙濒海山链山脚（青灰岩坡，挂冰瀑）"
poly = [[190, 0], [260, 0], [260, 220], [212, 220], [198, 150], [176, 104], [182, 60]]
height_m = 110
src = "推定"

