# 惨月洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位本身是推定（区级平面图 b909：南路西侧山脚单个洞口图标），场地内一切布置同为推定。

[meta]
bg = "bg787"
name_zh = "惨月洞穴"
size_m = [200, 160]
px_per_m = 6.0
scale_src = "推定"
scale_note = "世界树无坐标；点位按 1.12 区图南路西侧山脚单个洞口图标（约 [58.4, 58.7]）推定，洞口尺寸与坡长按世界树画面「雪坡下的小洞」推定，未核"
# 世界树画面：雪坡下的小洞，洞口积雪被踩塌，洞内传出枭兽的低吼
absent = ["任何火、火堆、火把、灯笼与人工光源", "木构棚屋、帐篷、栅栏等营地设施", "成片的密林（坡上只有三五棵矮云杉）", "冻湖、温潭与流水", "石砌废墟与断柱", "直射阳光、极光与夜景", "文字与路牌", "大灾变后新增的营地与地名", "任何人物与动物（属 shot 层）"]

[[ridge]]
name = "西南山带山脚岩壁（洞口所在的覆雪陡崖）"
