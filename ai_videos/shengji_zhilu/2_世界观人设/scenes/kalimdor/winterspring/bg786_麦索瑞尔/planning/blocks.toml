# 麦索瑞尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 内景：场地 = 主厅 + 入口隧道所在的山腹水平切面；ridge = 洞壁以外的实心岩体。

[meta]
bg = "bg786"
name_zh = "麦索瑞尔"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "内景无一手尺寸出处：洞口朝东（区图南路西折支路尽头）按地图量取，主厅直径约 110 m、穹顶高约 40 m、入口隧道约 70 m 均按世界树画面「巨大的冰蓝洞窟」推定"
# 世界树画面：巨大的冰蓝洞窟，穹顶垂下成排冰柱，蓝龙盘踞在发光的冰台上
absent = ["任何火、火盆、火把、灯笼与暖色光源", "天井或穹顶透下的天光", "熔岩、温泉与流动的地下河（北壁瀑布已冻结）", "木构房屋、家具、宝箱与雕像陈设", "洞内植物与云杉", "积雪以外的泥地与草地", "文字、铭牌与旗帜", "大灾变后新增的洞室与结构", "龙、龙人与任何人物动物（属 shot 层）"]

[[ridge]]
name = "北侧岩体（主厅北壁与隧道北壁以外的山腹实心岩）"
poly = [[0, 0], [240, 0], [240, 95], [165, 95], [152, 64], [132, 50], [118, 46], [118, 8], [102, 8], [102, 46], [80, 52], [62, 70], [55, 100], [0, 100]]
height_m = 60
src = "推定"

[[ridge]]
