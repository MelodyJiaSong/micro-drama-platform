# 木喉岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg776"
name_zh = "木喉岗哨"
size_m = [160, 160]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 6.5 m：营地图标在西路南侧约 9 px ≈ 57 m，图标以南约 10 px ≈ 65 m 即山带山脚；三顶棚 + 火塘 + 柴垛 + 晾皮架的布局无一手出处，推定"
# 世界树画面：雪地路边的小熊怪营，几顶圆棚与一堆柴火，雪上印满宽大的掌印
# 1.12 区图：营地图标 [39.7,42.6]，西路南侧、西南山带山脚；西北 ~250 m 结冰小圆湖，正西 ~600 m 温潭群
absent = [
    "围栏、寨墙、望楼与大门（路边小营，敞开）",
    "旅店、商铺与飞行点",
    "燃烧的火、冒烟的火塘、火把与灯笼（默认冷火塘、白天）",
    "任何人物、兽形族群与动物（只留掌印）",
    "文字招牌",
    "草地、阔叶树与任何绿草（只有云杉）",
    "大灾变后新增的营地与建筑",
]

