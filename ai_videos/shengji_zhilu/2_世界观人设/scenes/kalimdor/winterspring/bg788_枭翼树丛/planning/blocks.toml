# 枭翼树丛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位本身是推定（区级平面图 b908：南路东侧一串相连的洞口图标），场地内布置同为推定；洞口串的南北走向按区图量取。

[meta]
bg = "bg788"
name_zh = "枭翼树丛"
size_m = [320, 420]
px_per_m = 3.0
grid_m = 50
scale_src = "推定"
scale_note = "世界树无坐标；点位与南北约 400 m 的洞口串长度按 1.12 区图南路东侧洞口图标（约 [64.4–66.6, 58.4–64.7]）量取，林带宽、空地宽、洞口尺寸推定，未核"
# 世界树画面：南部密集的雪松丛，树干间是一串相连的洞口，地上羽毛与骨头散落
absent = ["任何火、火堆、火把、灯笼与人工光源", "木构棚屋、帐篷、栅栏、图腾等营地设施", "冻湖、温潭与流水", "石砌废墟与断柱", "阔叶树与草地", "极光与夜景", "文字与路牌", "大灾变后新增的营地与地名", "任何人物与动物（属 shot 层）"]

[[ridge]]
name = "东墙·濒海山链山脚岩壁（洞口串所在）"
