# 坠星村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg775"
name_zh = "坠星村"
size_m = [200, 230]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 6.5 m：两处屋形图标相距约 22 px ≈ 140 m、各在北路以西约 16 px ≈ 105 m；屋体尺寸与小屋 / 灯柱 / 小亭无一手出处，推定"
# 世界树画面：雪线上的暗夜精灵小村，紫顶木屋被雪压着，屋檐下挂着蓝色灯笼
# 1.12 区图：两处屋形图标 [52.4,26.8] / [51.9,30.1]，都在南北向北路西侧；南屋门前一条短岔路向西；村背后是西北山块伸来的山舌
absent = [
    "旅店、马厩与飞行点（旧世坠星村没有）",
    "月井与任何水面",
    "城墙、寨墙与望塔",
    "火、火把、烛火与暖色灯笼（灯罩只发冷蓝光）",
    "任何人物、坐骑与豹（默认空村）",
    "文字招牌",
    "草地、阔叶树与任何绿草（只有云杉）",
    "大灾变后新增的营地与建筑",
]

