# 顶层高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级图（bg757 terrain.toml）的 (455, 235) m；区图 1 px ≈ 0.9525 m，两轴同比。

[meta]
bg = "bg761"
name_zh = "顶层高地"
size_m = [210, 185]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "本层环路轮廓、椭圆议事场、长条大帐、八顶小帐、两座桥头帐廊与两条吊桥从原版区图量取（1 px ≈ 0.9525 m，区级 terrain.toml 同一换算）；本层比低层高出几米、大帐门前图腾柱与场心火塘区图上看不出，推定"
# 世界树画面：中央主台的最顶层，正中一顶格外高大的酋长大帐，帐前是一圈露天的石阶议事场，四面全是天空
absent = [
    "任何人物与动物（默认空台）",
    "升降台（两部升降梯在主台西南 / 东北崖壁，都通低层）",
    "第三条吊桥或任何实心通道（本层只有东北、东南两条绳桥）",
    "石砌建筑、石墙与城墙（议事场台阶是在岩台上凿出的，不是砌的）",
    "火把、灯笼、帐内透出的火光（场心火塘是冷灰余烬）",
    "水池、溪流与任何水体（全城唯一的小水池在西半低层）",
    "成片的图腾柱林与彩布条（那是西北台地）",
    "活树桩与青绿草苔（那是正东台地）",
    "训练假人、飞行坐骑",
    "飞艇与飞艇塔（3.2.0 才加）",
    "4.0.3a 后的任何改建与陈设（含换主后的纪念物）",
]

