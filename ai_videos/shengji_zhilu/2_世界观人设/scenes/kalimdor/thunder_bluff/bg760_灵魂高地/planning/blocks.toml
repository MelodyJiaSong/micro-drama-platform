# 灵魂高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级图（bg757 terrain.toml）的 (140, 40) m；区图 1 px ≈ 0.9525 m，两轴同比。

[meta]
bg = "bg760"
name_zh = "灵魂高地"
size_m = [220, 200]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "台面轮廓、两座桥头、多瓣大帐、五顶小帐与南缘下沉坡道从原版区图量取（1 px ≈ 0.9525 m，区级 terrain.toml 同一换算）；图腾柱林、火塘与台脚冒汽岩缝区图上看不出，按世界树画面推定"
# 世界树画面：主台西北的一座台地，台面插满高矮不一的图腾柱，柱间系着招魂的彩布条，台下岩缝里冒出白色水汽
absent = [
    "任何人物与动物（默认空台）",
    "发光的图腾、符文光或任何法术光效（图腾柱是木雕彩绘）",
    "升降台（只在主台西南 / 东北两侧）",
    "东南以外方向的吊桥（只有东南两条绳桥）",
    "台面上冒汽（水汽只从台脚岩缝与坡底洞口出）",
    "洞内温泉的画面（属台体之下的地下空间，不进本图）",
    "石砌建筑与石墙",
    "火把、灯笼、洞口透出的火光（火塘是冷灰余烬）",
    "飞艇与飞艇塔（3.2.0 才加）",
    "4.0.3a 后的任何改建",
]

