# 佐拉虫巢 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地取区级平面图坐标 x 1040–2280、y 1940–3020 m（区图 1 px ≈ 6.342 m），框住西部整片巢区。坐标点 [32, 54] ＝ 本场地约 (952, 348)，落在巢区东北坎沿外侧。
# 区图巢区外廓齿线齿朝内 ＝ 坡朝内下降：巢区是比外侧白沙低 5–6 m 的洼地（同 bg636 区级卡、bg648）；外廓画成约 12 m 宽的环带 ridge（坎高 = 内外落差），环内洼地不画 ridge。
# 西墙与西南山块从 bg636 terrain.toml 取，西墙坡脚按区图退到巢区西缘之外（terrain.toml 的六边形近似会压进巢区）。
# 锚点机位约在 (955, 350)，东北坎沿外白沙上，离地一人高、略俯，朝西南（方位 ~241°）：身后东北约 140 m 是矮人军营（bg639，不入画），正前越过整片巢区是西面山墙。

[meta]
bg = "bg650"
name_zh = "佐拉虫巢"
size_m = [1240, 1080]
px_per_m = 1.25
grid_m = 100
scale_src = "地图量取"
scale_note = "巢区外廓、巢塔图标、东侧斜长岩丘、北侧小岩丘与军营图标位置按区图量取（与 bg636 terrain.toml 同一套坐标，1 px ≈ 6.342 m）；巢塔高度、隧道洞口、积沙与遗留物为推定"
# 世界树画面：西部沙地上的虫巢，巢口朝海一侧敞开，几丁质塔管间有幽暗的隧道洞口。
absent = [
    "任何人造建筑、帐篷、栅栏与旗帜（矮人军营在机位身后东北约 140 m，属 bg639，不入画）",
    "成团的虫卵与黏液滩（南片巢区的特征；本片偏干，积着风沙）",
    "海与任何水面（海在西面山墙之外，看不见）",
    "树、草与任何绿色植物",
    "燃着的火、火盆与任何人工光源",
    "虫群、人物与坐骑（默认空巢，全部属 shot 层）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
    "训练假人",
]

