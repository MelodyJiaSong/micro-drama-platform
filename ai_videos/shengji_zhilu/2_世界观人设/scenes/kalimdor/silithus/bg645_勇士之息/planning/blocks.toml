# 勇士之息 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg636 terrain.toml，1 px ≈ 6.342 m）上的 (4950, 600)。
# 营地按区图裁切上的营地图标摆：图标在红十字正南约 200 m、正落在区级「东北大道」尽头 (5106, 850) 旁 → 本图约 (200, 285)。
# 坐标表 [81, 16]（区级 (5148, 678) → 本图 (198, 78)）落在北侧山体的坡上，不摆营地，只在此记一笔。
# 北侧山体与东南环形山外壁由区级 terrain.toml 平移换算（地图量取），两者之间约 240 m 宽的东西向缺口就是通往环形山的东北山口；
# 石台、墓地、帐篷、巨石无一手尺寸，一律推定。
# 锚点机位：石台东缘外、山口小径上的巨石旁（约 290, 280，离地约 3 m），朝西南偏西。

[meta]
bg = "bg645"
name_zh = "勇士之息"
size_m = [450, 480]
px_per_m = 3.0
scale_src = "推定"
scale_note = "营地（石台约 120 × 75 m、墓地约 28 × 18 m、四顶帐篷）按世界树画面推定；山口两侧山体从区级 terrain.toml 平移量取，场地取到装下大道上坡段与山口西段"
# 世界树画面：环形山西北出口上方的一小片石台营地，几顶德鲁伊风格的帐篷围着一片墓地，墓碑歪斜，沙从坡下吹上来。
absent = [
    "任何人物、坐骑与飞行坐骑（1.8 起飞行点已移到要塞，这里没有飞行管理员）",
    "火、火塘、火把、灯笼与任何人工光源",
    "墓碑上的字迹、徽记与任何文字标识",
    "黑紫帐篷与教团旗帜（这里是中立营地）",
    "石墙、寨墙、大门与塔楼",
    "草地、活树与任何水体",
    "甲壳巢塔与虫巢洞口",
    "山口东侧环形山里的丛林（本图只到山口西段，看不见）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "4.0.3a 后的任何改动",
]

