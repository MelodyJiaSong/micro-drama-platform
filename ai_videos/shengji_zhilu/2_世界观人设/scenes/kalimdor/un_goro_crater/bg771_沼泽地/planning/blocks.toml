# 沼泽地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (2060, 1000)；区图 1 px ≈ 3.377 m。环形河、九个水洼与东墙内缘按区级 terrain.toml 平移、在场地边界处裁切。
# 小营的土丘、帐篷、晶体簇、枯立木、芦苇带的位置为推定（区图无标记；世界树只写「沼中一座土丘上两个牛头人的小营」）。
# 锚点机位：东墙脚崖屑坡 (548, 330)，离地约 15 m，朝西北偏西（方位约 290°）：前景 河湾自右向左横过，正中 东塘 → 远处火山锥，右 土丘小营。

[meta]
bg = "bg771"
name_zh = "沼泽地"
size_m = [560, 760]
px_per_m = 1.8
grid_m = 50
scale_src = "地图量取"
scale_note = "区图东南河湾与十来个浅水洼按区级 terrain.toml（区图量取）平移：场地 560×760 m 包住区级 b971；东墙内缘同源；小营与散件位置推定"
# 世界树画面：环形山东南一大片积水的沼泽低地，浑浊浅水与泥滩之间长满蕨丛与芦苇，水面漂着藻膜；沼中一座土丘上搭着两个牛头人的小营，岸边散落蓝色发光的水晶。
absent = [
    "旅店、飞行点、哨站、营寨与任何木石建筑（4.0.3a 的沼泽新营地 1.12 没有）",
    "桥、栈道与修过的路（只有兽径绕水边泥滩）",
    "亮着的火堆、火把、灯笼与任何人工光源（火塘是冷灰余烬）",
    "深水、急流与瀑布（水浅不过膝）",
    "熔岩流（从东面看不到火山南坡）",
    "雪、雨与夜景",
    "迅猛龙与任何人物（属 shot 层；小营是空的）",
]

