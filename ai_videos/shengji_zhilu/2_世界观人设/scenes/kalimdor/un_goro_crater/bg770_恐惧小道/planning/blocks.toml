# 恐惧小道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (900, 1360)；区图上本子区域无标记，场地范围按区级 b970「西南、温泉以南」的推定位置取。
# 南墙内缘按区级 terrain.toml 平移裁切（地图量取）；兽径、水晶柱、蕨树、脚印、断树的位置全部为推定。
# 锚点机位：南墙脚崖屑坡 (120, 360)，离地约 10 m，朝东北偏东（方位约 55°）：左缘 北侧林带后的温泉白汽，正中偏左 远处火山锥，右缘 东侧裂沟上沿。

[meta]
bg = "bg770"
name_zh = "恐惧小道"
size_m = [600, 420]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "区图上无标记，场地 600×420 m 按区级平面图 b970 推定框取整；南墙内缘按区级 terrain.toml 平移；场内一切物件位置与尺寸均为推定"
# 世界树画面：环形山西南一片被踩平的开阔草地与红土，高大蕨树稀疏，地面插着几根泛红光的水晶柱，巨大的魔暴龙与迅猛龙群在其间游走。
absent = [
    "任何建筑、营地、帐篷、栅栏与修过的路",
    "任何火、火把、灯笼与人工光源（红水晶只有内光、不照亮地面）",
    "密林（这里树稀，是开阔地）",
    "水面与河流（温泉在北边林带后，只见白汽）",
    "熔岩流（火山南坡的熔岩从这个方位看不到）",
    "雪、雨与夜景",
    "恐龙、翼手龙与任何人物（属 shot 层，底图只留脚印与断树）",
    "训练假人、飞行坐骑与 4.0.3a 后的一切改动",
]

