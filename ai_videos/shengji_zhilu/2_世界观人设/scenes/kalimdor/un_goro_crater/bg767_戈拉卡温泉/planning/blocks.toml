# 戈拉卡温泉 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg767"
name_zh = "戈拉卡温泉"
size_m = [540, 360]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "场地原点对到区级平面图 (780, 1030)；两池外廓从原版区图量取（3.38 m/px）：大池 px(310–376, 320–400) ≈ 223 × 268 m，小池 px(255–302, 320–352) ≈ 159 × 108 m；西缘岩壁内缘按区级 terrain.toml 西墙折线平移。石台、间歇泉、土梁为推定"
# 世界树画面：环形山西侧一片冒着白汽的地热池群，浅绿与乳白的温泉水在硫黄色石台间层层叠叠，不时有间歇泉喷起水柱，四周雾气缭绕。
absent = [
    "任何人物、甲壳怪与其他动物",
    "火、火把、营火与任何人工光源（温泉本身也不发光）",
    "栈道、石砌池沿、浴场、桥与任何人造物",
    "修过的路（只有丛林兽径）",
    "河流（绕山浅河在北面丛林之外，不入场地）",
    "焦油坑（在坑底北部）",
    "冰、雪与夜景",
    "任何文字与标识",
    "4.0.3a 后的任何改动",
]

