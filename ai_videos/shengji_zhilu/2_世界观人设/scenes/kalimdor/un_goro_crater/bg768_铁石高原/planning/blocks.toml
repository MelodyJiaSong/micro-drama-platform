# 铁石高原 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg768"
name_zh = "铁石高原"
size_m = [480, 480]
px_per_m = 2.5
scale_src = "推定"
scale_note = "场地原点对到区级平面图 (2360, 500)：坐标 [77, 33] → 区级 (2605, 744) → 场地 (245, 244)，岩壁内缘按区级 terrain.toml 北墙 / 东墙折线平移。台面 100 × 300 m、高出坑底约 50 m 为推定，无一手尺寸"
# 世界树画面：环形山东北角贴着岩壁的一块裸露高台，灰褐色的光秃岩石与稀疏蕨类，台面之上是环形山陡直的岩壁，幼年翼手龙在岩缝间盘旋。
# 裁切图：红十字落在东墙坡脚第一道山褶、绿地与岩壁交界 → 台面顺东墙南北狭长，西缘断崖朝坑底
absent = [
    "任何人物、翼手龙与其他动物（岩缝里只有空巢）",
    "火、火把、营火与任何人工光源",
    "路、石堆标记、护栏与任何人造物",
    "水体（台面只有雨季才淌水的干浅沟）",
    "茂密树林（台面只有稀疏矮蕨与一棵枯树）",
    "熔岩红光（远处火山锥白天只见锥顶与淡烟）",
    "飞行坐骑落点（1.12 没有飞行坐骑）",
    "4.0.3a 后的任何改动",
]

