# 废墟海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级坐标 (2476.5, 2663.4)。区级 b914（原典方位，南岬南岸）中心 → 本地 (300, 160)；
# 拉文凯斯雕像（坐标表 [65, 87]，区级 b466）→ 本地 (537, 27)，只作东北崖顶的远景剪影，属 bg466；
# 雷瑟斯圣所（世界树子节点，「拉文凯斯雕像西南」）按原典方位摆在雕像西南约 200 m 的滨海台地上；南面外海北缘按区级 [[water]] 量取。
# 滩上的倒塌石构、断柱、礁带全部推定。

[meta]
bg = "bg472"
name_zh = "废墟海岸"
size_m = [600, 320]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区级 b914 按原典方位取 500 × 160 m，无一手尺寸；本档放宽到 600 × 320 m，把北面崖坎与东北崖顶的巨像点位框进来。岸线位置按区级南面外海北缘（本地 y≈255）量取，精度约 ±60 m"
# 世界树画面：南部的乱石海岸，倒塌的石构半埋在沙中，海浪不断冲刷断柱
absent = [
    "任何人物、动物、海兽与鳞人（滩上登陆的生物属 shot 层）",
    "码头、栈桥、船坞、灯塔与停泊的船（旧世这段海岸没有任何港口设施）",
    "4.0.3a 之后的哥布林工程、铁轨、管道、起重机与爆破痕迹",
    "完整的建筑、屋顶与立着成排的柱廊（只有半埋的残构与断柱）",
    "巨像的近景（崖顶巨像属 bg466，本档只见远处剪影）",
    "圣所水池里的水（池是干的）",
    "火、篝火、灯笼与任何人工光源",
    "雪、冰、针叶林与翠绿夏林",
    "铺装道路（只有一条碎石坡道从崖坎下到台地）",
    "文字铭刻与招牌",
]

