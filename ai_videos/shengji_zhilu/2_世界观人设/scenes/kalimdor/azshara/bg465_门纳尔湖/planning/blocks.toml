# 门纳尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级图（bg453）的 (1554, 2230) m；湖 / 裸岩山脊东南尾 / 南部界山 / 东北台地由 bg453 terrain.toml 与 blocks.toml 平移得来。
# 锚点机位：西北岸碎石滩 (180, 215)，朝东南偏东（方位约 105°）。

[meta]
bg = "bg465"
name_zh = "门纳尔湖"
size_m = [640, 480]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "区图 (39–42%, 79–82%) 湖面量取（1 px ≈ 4.63 m，±60 m），湖约 260 × 120 m；南岸山墙凹口为贴合湖岸推定；台地高 25 m、巨石与枯木尺寸推定"
# 世界树画面：内陆的深蓝湖泊，湖面浮着淡蓝魔法光尘，蓝龙在湖上低空盘旋
absent = [
    "任何龙、龙人、人物与动物（龙属 shot 层）",
    "成片发光的湖面 / 光柱 / 能量波（光尘只微闪、不投光）",
    "码头 / 栈桥 / 小船 / 渔具 / 任何建筑（台地残柱属邻档 bg471，只作远景剪影）",
    "爆破口 / 开凿面 / 工程机械（4.0.3a 之后的改造）",
    "芦苇荡 / 睡莲 / 沼泽（湖岸是碎石、卵石与陡崖）",
    "火光与任何人工光源；夜景与月亮",
    "雾 / 雪 / 冰面",
]

