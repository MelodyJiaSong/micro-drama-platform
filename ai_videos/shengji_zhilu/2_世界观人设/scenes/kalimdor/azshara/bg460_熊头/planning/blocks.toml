# 熊头 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级坐标 (1330, 1250) m；崖脚线 ＝ 区级 terrain「西北界山 · 南带」南缘折线平移；东南角 ＝ 区级 b904 埃达拉斯废墟西北角。
# 2026-09-25 审校：旧版按区图 (73,86) 南岬东侧小图标推定成临海草盆地，与 wiki [33, 46]「群山东南缘」不符，整张重画。

[meta]
bg = "bg460"
name_zh = "熊头"
size_m = [400, 300]
px_per_m = 3.2
grid_m = 50
scale_src = "地图量取"
scale_note = "点位按 wiki 坐标 [33, 46] 与传送人站位 [28.1, 50.1]（崖脚）落在区级平面图上，崖脚线与废墟角从区级图量取（±60 m）；巨岩高 25 m、崖高 60 m、塔高 30 m 与塔的形制无一手出处（推定）"
# 世界树画面：东南山脉边缘一块形似熊首的巨岩，岩体赤褐，周围是稀疏的橙红矮树
absent = [
    "上崖的台阶、小路、绳梯与塔前台阶（旧世上塔只能由崖脚的学徒传送）",
    "雕刻出来的熊头像（巨岩是天然形成的）、任何真的熊与动物",
    "塔顶光环、法阵、塔窗灯火与任何人工光源",
    "营地、帐篷、围栏、小村",
    "海面、码头、船只（本档机位朝北，海在东面废墟之后）",
    "任何人物（塔上的法师与崖脚的学徒属 shot 层）",
    "雪、针叶林、翠绿草地",
    "4.0.3a 之后的哥布林改造痕迹",
]

