# 痛苦海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区图 px x 820–950、y 60–211（130 × 150 px，1 px ≈ 4.63 m）；场地 m ＝ (区图 px − 原点) × 4.63。
# 高地崖线、阶地（淡紫带）、海岸线、浅水带、外海、南面圆礁按区图描边；巨石、小湾、海蚀柱、漂木推定。

[meta]
bg = "bg461"
name_zh = "痛苦海岸"
size_m = [600, 700]
px_per_m = 2.2
grid_m = 50
scale_src = "地图量取"
scale_note = "区图量取（1 px ≈ 4.63 m，±60 m）：北岬高地东北崖线、崖外淡紫阶地、海岸线与淡青浅水带按区图描边；高地崖高 40 m、低海崖高 10 m 推定"
# 世界树画面：东北角的荒凉海岬，草色枯黄，崖下是终年拍打的冷灰海浪
absent = [
    "任何建筑、屋基、遗迹、碑与道路（旧世这一段海岸空无一物）",
    "码头 / 灯塔 / 灯标 / 船只（4.0.3a 之后的北岬改造，旧世无）",
    "营地与帐篷（高地上的营地不入本档）",
    "碧绿透亮的热带浅水、金色沙滩（本档海色冷灰，岸是低海崖与卵石）",
    "翠绿草地（阶地草色一律枯黄）",
    "黑色礁盘与成片尖礁（那是西北的锯齿暗礁 bg464）",
    "任何人物与动物、任何火与人工光源",
    "暴风雨 / 雪 / 浓雾",
]

