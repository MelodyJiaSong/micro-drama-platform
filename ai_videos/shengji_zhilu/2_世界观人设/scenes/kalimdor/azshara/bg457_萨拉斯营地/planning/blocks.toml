# 萨拉斯营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg457"
name_zh = "萨拉斯营地"
size_m = [420, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图裁切 3× 放大，1 裁切 px ≈ 1.54 m；本图原点 ＝ 裁切图 (136, 68) px，红十字 [57, 25] 落在 (210, 180) m（草丘北坡）。崖岸与海湾、丘南帐篷图标按裁切量取；草丘范围、各小营摆位与帐篷数量按原典「一座小山上散着好几处小营」推定"
# 世界树画面：北部高地上的考察营，方形帐篷与堆放的箱子、卷轴，旁边支着测绘用的三脚架
absent = [
    "围墙、栅栏、瞭望塔与任何石砌或木构房屋",
    "林冠顶棚（这里是开阔高地，只有零星孤树）",
    "兽皮帐篷、尖木寨墙、暗紫布幔与带刺图腾（那是同区别的营地）",
    "点着的火、火把、火盆与任何人工光源；发光的粉末、法阵与符文",
    "下崖的路、码头、船只与栈桥",
    "任何人物、坐骑与动物",
    "旗帜纹章与文字",
    "4.0.3a 后换成的联盟营地与任何哥布林工事",
]

