# 怒水河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg469"
name_zh = "怒水河"
size_m = [360, 520]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "取区级 terrain.toml 怒水河折线的出峡口以下一段（区图约 (10–15%, 45–62%)）；原点 ＝ 区级坐标 (470, 1380) m，河道中线、西界山东缘、北面山带南缘按区级平移量取。河宽按世界树画面「比灰谷段更宽」取 90 m（灰谷侧 bg417 记约 80 m），区级 terrain 的 45 m 只是示意线宽；两岸崖高、卵石滩、倒木等细节推定。东岸崖顶往东约 350 m 是瓦罗莫克旧世原址（区级 b458，已覆盖回 (22,52)），不入本图"
# 世界树画面：艾萨拉西南边界的河段，河面比灰谷段更宽更缓，两岸是橙红秋林压着的红土高崖
# 河自北缘峡口流入，南缘出图；西岸崖高（约 40 m）、东岸崖低（约 20 m）
absent = [
    "桥、渡口、码头、栈桥、船只、缆索（全区唯一的桥在下游河口，不在本段）",
    "道路与任何人工台阶（本段两岸无路）",
    "房屋、帐篷、营火（下游东岸的营地不入本档）",
    "水车、磨坊、伐木场、树桩与任何工业设施（4.0.3a 后的改造一概不收）",
    "湍急白浪与瀑布（本段是缓流，只有峡口里一级低矮跌水）",
    "清澈碧蓝的河水（河水浑黄）",
    "火把、灯笼、篝火与任何人工光源",
    "雪、针叶林、翠绿夏林",
    "任何人物与动物",
]

