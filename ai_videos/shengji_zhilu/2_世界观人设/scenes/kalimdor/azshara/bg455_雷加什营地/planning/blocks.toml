# 雷加什营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg455"
name_zh = "雷加什营地"
size_m = [300, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图 (51,19) 帐篷图标定营心（bg453 b903，地图量取）；海汊南端距营心约 170 m、方位西北偏西，按区级平面图量取（±60 m）。营地 70 × 60 m、布幔 / 帐篷 / 图腾的数量与摆位无一手出处，按世界树画面推定"
# 世界树画面：北部林中的萨特营地，暗紫布幔挂在橙红树冠下，地面插着带刺图腾
absent = [
    "寨墙、栅栏、瞭望塔与任何石砌或木构房屋",
    "兽皮斜棚、生皮帐篷与黄绿色火焰（那是同区西部的另一座营）",
    "点着的火、火把、火盆、烛台与任何人工光源（火塘默认冷灰）",
    "烟柱、火星与任何发光的符文或雾气",
    "下崖的路、栈道、码头与船只",
    "白石柱廊废墟（在西南约五百米外，不入本档）",
    "任何人物、坐骑与动物",
    "旗帜纹章与文字",
    "4.0.3a 后的任何改建（哥布林工事、火箭、管道）",
]

