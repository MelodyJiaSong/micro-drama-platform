# 塔伦迪斯营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg456"
name_zh = "塔伦迪斯营地"
size_m = [360, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切 4× 放大，1 裁切 px ≈ 1.16 m（区图 1 px ≈ 4.63 m）；本图原点 ＝ 裁切图 (205, 120) px，红十字 [10, 74] 落在 (180, 140) m（河面上）。河道、路、两岸山体按裁切量取；帐篷 / 空场 / 木台摆位无一手出处，推定"
# 世界树画面：西南河口的精灵哨站，紫顶帐篷依崖而建，木桥跨过下方湍流
# 区图：河自东北向西南流；路自西来、在红十字处跨河，过河后折向东南
absent = [
    "哨塔、瞭望塔、石砌或木构房屋与围墙（4.0.3a 扩建成要塞时才有）",
    "兽人式尖木寨墙、兽皮帐篷与红黑战旗",
    "第二座桥、渡口、码头与船只",
    "点亮的灯、火把、火盆与任何人工光源（灯柱白天不亮）",
    "月井、发光的井水与水池（4.0.3a 扩建后才有）",
    "路南的任何营帐",
    "任何人物、哨兵、角鹰兽与坐骑",
    "文字招牌与路牌上的字",
    "哥布林工事、火箭与任何 4.0.3a 后的改建",
]

