# 破碎海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级坐标 (3000, 940)。区级 b912（原典方位，海湾北岸东段）中心 → 本地 (239, 134)；
# 子节点亚考兰神殿（区级 b917，区图 (76,43) 柱廊图标，地图量取）→ 本地 (540, 402)，坐在东南一道伸进浅海的小岬尖外。
# 岸线：区级「北岸浅水带」宽 300 m 的带子把滩也盖住了（±60 m 误差），本档把岸线收在 y≈160–200；滩上方石的数量与摆位全部推定。

[meta]
bg = "bg473"
name_zh = "破碎海岸"
size_m = [700, 480]
px_per_m = 2.2
grid_m = 50
scale_src = "推定"
scale_note = "区级 b912 按原典方位取 300 × 120 m，无一手尺寸；本档放宽到 700 × 480 m，把东南小岬与岬尖外的半沉圆殿（区图量取）一起框进来。滩宽 30–50 m、方石大小按「大块方形石料散落在沙上」推定"
# 世界树画面：海湾北岸的碎石滩，大块方形石料散落在沙上，像被打碎的建筑残骸
absent = [
    "任何人物、动物、海兽与鳞人（圆殿水下的巨兽只写成发黑的深水，不画生物）",
    "码头、栈桥、港口、停泊的船与船坞（4.0.3a 之后海湾才被改造成港，旧世没有）",
    "4.0.3a 之后的哥布林工程、起重机、管道与被挖成徽记形状的海湾",
    "立着的完整建筑、屋顶与城墙（滩上只有散落的方石）",
    "红土高崖（这段北岸是低矮草坡，不是崖）",
    "火、篝火、灯笼与任何人工光源",
    "雪、冰、针叶林与翠绿夏林",
    "铺装道路（这一带没有任何路）",
    "文字铭刻与招牌",
]

