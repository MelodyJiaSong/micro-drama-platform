# 幽灵岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg505"
name_zh = "幽灵岗哨"
size_m = [300, 260]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "取 300 × 260 m：营地图标在骨碗东弧矮脊西侧约 30 m、最近拱骨图标在营地西偏南约 70–130 m（区图 1 px ≈ 4.1 m，±60 m）；帐篷直径与环径无一手出处，按「五顶两人多高的高锥帐围一口火塘」推定"
# 世界树画面：荒原正中一小片牛头人营地，几顶灰褐兽皮帐围着一堆火，帐外插着招魂布条，四周一览无遗、毫无遮蔽
# 区图：营地图标在骨碗那圈断续矮脊的东北角内侧，东弧矮脊外侧起一条车辙路向东南下到骨料营地
absent = [
    "任何人物与动物（默认空营，驮兽不入画）",
    "燃着的火与炊烟（火塘冷灰）",
    "寨墙、栅栏、箭塔与任何防御工事（这里极其暴露，四面无遮）",
    "木屋、石屋与任何永久建筑（只有五顶兽皮帐）",
    "第六顶帐篷或成排的帐篷街（固定五顶）",
    "草地、灌木林与任何绿色植被（只有枯成灰黑的矮刺草）",
    "水塘与流水（最近的死水塘在南边横路以南，场地外）",
    "飞行坐骑栖木与飞行点（本区部落飞行点在西岸渔村）",
    "文字、招牌与部族旗纹",
    "返绿的荒原与新长的树（4.0.3a 之后的样子）",
]

