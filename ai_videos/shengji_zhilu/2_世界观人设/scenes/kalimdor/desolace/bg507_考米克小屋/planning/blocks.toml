# 考米克小屋 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg507"
name_zh = "考米克小屋"
size_m = [320, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 320 × 260 m：装得下北侧约 90 m 的东西向土路与南侧约 70 m 的盆地北崖崖口（区图裁切量取，约 ±60 m）；屋与栅圈尺寸无一手出处，按「单间小屋 + 三十多米见方的栅圈」推定"
# 世界树画面：荒原中部一座孤零零的破木屋，屋外一圈木栅围着散落骨头的空地
# 区图：红十字在盆地北缘锯齿崖线正北的崖顶；北面一条东西向土路，东面约 200 m 外是南北向主路（在本场地以外）
absent = [
    "任何人物与动物（默认空屋空栏）",
    "燃着的火与炊烟（火坑是冷灰余烬）",
    "第二座房屋、帐篷或塔楼（这里只有一间屋）",
    "河流、水潭与任何水面",
    "草地、灌木林与任何绿色植被（只有一棵枯白树与几簇枯刺草）",
    "石墙、寨墙与围城式防御（只有一圈木栅）",
    "文字、招牌与旗帜",
    "返绿的荒原与新长的树（4.0.3a 之后的样子）",
]

[[ridge]]
name = "盆地北缘土崖崖面（朝南落差约 30 m，南侧为下陷盆地）"
