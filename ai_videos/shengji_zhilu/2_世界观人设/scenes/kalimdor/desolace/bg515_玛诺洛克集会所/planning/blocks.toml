# 玛诺洛克集会所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg515"
name_zh = "玛诺洛克集会所"
size_m = [520, 380]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "场地左上角 ＝ 区级平面图 (1920, 1960) m；两枚废墟图标（区图 [50.4, 74.8] / [54.4, 79.7]，相距约 210 m）、北缘横路、东南小塘与南墙山脚按区级 terrain.toml 平移换算（区图 1 px ≈ 4.1 m，±40 m）。石台、圆庭、柱数与焦坑的尺寸无一手出处，推定"
# 世界树画面：一片被邪能二次烧过的暗夜精灵废墟，断柱间浮着绿色的邪能雾，空气一进入就压得人发闷
# 机位：西北石台东南角残阶顶（x≈172, y≈105），略高于人眼朝东南斜俯；黄绿雾只伏在圆庭与焦坑等低处，本身不发光
absent = [
    "任何人物、恶魔与动物（默认无生物）",
    "燃着的火、邪能火焰、发光符文与任何人工光源（雾与石盘都不发光）",
    "冒烟或发红的焦坑（焦痕早已冷透多年）",
    "完整的屋顶与室内空间（全是露天残迹）",
    "活草、灌木与绿色树冠（只有焦黑炭桩）",
    "河流与流水（水只有东南一汪死水塘）",
    "文字、铭文与旗帜",
    "现代或粗木帐篷式建筑（这里只有上古石构残迹）",
    "返绿的荒原与新长的树（4.0.3a 之后的样子）",
]

