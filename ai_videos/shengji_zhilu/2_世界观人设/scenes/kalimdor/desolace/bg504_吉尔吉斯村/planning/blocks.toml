# 吉尔吉斯村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 深谷位置与「三面合山、北缘敞开」取自区图（[34–41, 80–93] 那圈锯齿崖线）；谷内石台 / 吊桥 / 帐篷按原典文字推定。
# h_m 对谷内物件指「高出谷底」：谷缘与石台顶都在谷底以上约 40 m。

[meta]
bg = "bg504"
name_zh = "吉尔吉斯村"
size_m = [480, 480]
px_per_m = 3.0
scale_src = "推定"
scale_note = "深谷直径约 200 m 由区图那圈崖线量取（约 5 × 7 个百分点，×41 m / ×27 m 取整）；谷深 40 m、帐篷 9–14 m、石台尺寸按原典文字与常识推定"
# 世界树画面：西南一圈沿着大裂谷边缘搭起的半人马村落，谷底的崖台之间用吊桥相连，帐篷挂在崖边
absent = [
    "任何人物、坐骑与动物",
    "亮着的火、烟、烛火、灯笼与任何人工光源（火塘冷透；洞里只有一点弱蓝晶光）",
    "谷缘栏杆与护墙（崖边只有拴桥绳的木桩）",
    "石砌或木构房屋、望塔（只有兽皮帐与崖边木挑台）",
    "谷底的水、溪流与水潭（谷底是干乱石与细砂）",
    "活草、绿树与返绿的地面（1.12 是灰黄死地）",
    "第四座完整的吊桥（它早断了，只剩残段）",
    "晴朗蓝天与硬边日影",
    "4.0.3a 之后的新营地与新地名",
]

