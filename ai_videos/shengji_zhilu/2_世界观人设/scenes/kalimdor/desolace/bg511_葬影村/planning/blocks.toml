# 葬影村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg511"
name_zh = "葬影村"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图上村子图标与裁切红十字之间是一段南北约 150 m 的窄岸带（西海、东山）；场地取岸带 + 东侧坡脚 + 南端弯钩沙岬与小湾，260 × 220 m，无一手尺寸出处"
# 世界树画面：海边一排高脚木桩托起的巨魔棚屋，屋前伸出几条窄栈桥直入海水，晾渔网与骨制风铃挂在檐下
# 区图：村子图标在岸线东侧、紧贴长矛谷南山块西麓；图标以南岸线伸出一道弯钩岬，岬南是小海湾
absent = [
    "任何人物、渔民、飞兽与动物（默认空村）",
    "燃着的火塘、火把与炊烟（火塘是冷灰余烬）",
    "码头大船、帆船、渡轮与船运航线（1.12 本村无船运）",
    "石砌建筑、城墙、寨墙大门",
    "绿坡、棕榈树与热带海滩",
    "北向出村的陆路（唯一陆路在东南）",
    "旗帜纹章与任何文字标识",
    "4.0.3a 后的任何改动",
]

