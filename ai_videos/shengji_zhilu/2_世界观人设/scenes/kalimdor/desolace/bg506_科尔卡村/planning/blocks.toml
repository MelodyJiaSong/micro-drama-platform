# 科尔卡村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg506"
name_zh = "科尔卡村"
size_m = [440, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "取 440 × 300 m：区图东墙山脚两枚帐篷图标（北簇 [74, 46]、南簇 [74, 49]）相距约 90 m，西侧南北土路离帐篷约 270 m（区图 1 px ≈ 4.1 m，±40 m）；帐篷直径、桩排长度无一手出处，按「宽矮穹顶帐、底径十来步」推定"
# 世界树画面：东缘一小片半人马营地，帐篷破旧、拴马桩东倒西歪，有被洗劫过的痕迹
# 机位：村子正西约 150 m 的浅土道上（x≈170, y≈150），人眼高朝东平视
absent = [
    "任何人物与动物（默认空村，人与牲口都不入画）",
    "燃着的火与炊烟（两口火坑都是冷灰）",
    "寨墙、栅栏、门楼与箭塔（村子朝西完全敞开）",
    "木屋、石屋与任何永久建筑（只有七顶兽皮帐）",
    "第八顶帐篷（固定北四南三共七顶）",
    "河流、水塘与泉眼（水只有翻倒的空水槽）",
    "草地、树木与任何绿色植被（只有枯死的灰色刺灌）",
    "文字、招牌与部族旗纹",
    "4.0.3a 之后取代本村的新营地（那一版不收）",
    "返绿的荒原与新长的树",
]

