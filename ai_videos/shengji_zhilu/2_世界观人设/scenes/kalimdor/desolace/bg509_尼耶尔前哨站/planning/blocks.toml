# 尼耶尔前哨站 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg509"
name_zh = "尼耶尔前哨站"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 300 × 240 m：山肩平台东西约 240 m、南北约 110 m，北接界山陡坡、南接 40 m 崖口（区图上两枚屋形图标相距约 70 m，区级 terrain 量取 ±60 m）；屋、墙、栖架尺寸无一手出处，按「小型驻军营地」推定"
# 世界树画面：北部山口上的联盟营地，石砌矮墙围着几座木屋与蓝白帐篷，塞纳里奥议会的绿色旗与联盟旗并排
# 区图（约 [65, 8]）：北墙山影里两枚屋形图标，南侧一条岔路向西南盘下山汇入北口主道
absent = [
    "任何人物、坐骑与动物（默认空营，栖架与栖台空着）",
    "燃着的火、炊烟与点亮的灯（清晨零人工光源）",
    "带纹章或文字的旗帜（两面旗只有素色底）",
    "城堡、塔楼与高大石墙（只有齐腰干垒矮墙）",
    "河流、瀑布、水井与任何水面",
    "草地、针叶林与任何绿色植被（坡上只有几棵枯白树）",
    "雪、冰与积雪山顶",
    "飞行坐骑、训练假人与 4.0.3a 后的新建筑",
]

