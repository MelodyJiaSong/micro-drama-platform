# 瑟卡布斯库的营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg510"
name_zh = "瑟卡布斯库的营地"
size_m = [440, 300]
px_per_m = 3.5
grid_m = 50
scale_src = "推定"
scale_note = "取 440 × 300 m：装得下营地南侧约 80 m 的东西横路、西南约 110 m 的路岔口与岔口南侧死水塘、东侧约 200 m 的盆地东崖（区图裁切量取，约 ±60 m）；帐与车尺寸无一手出处，按「一顶单人小帐 + 一辆大轮平板车」推定"
# 世界树画面：坟场边一顶小小的哥布林帐篷与一辆停着的科多兽拉车，车边堆着捆好的骨料
# 区图：红十字在盆地东南角、东崖西脚下；西南是两路交成的岔口，岔口以南两汪死水塘；骨碗在西北约 460 m（场地外）
absent = [
    "任何人物与动物（默认空营，拉车的牲口不入画）",
    "燃着的火与炊烟（火坑冷灰，烟囱不冒烟）",
    "第二顶帐篷、木屋或塔楼（这里只有一帐一车）",
    "围栏、寨墙与任何防御工事",
    "草地、灌木林与任何绿色植被（只有枯死的矮刺灌与崖顶一棵枯白树）",
    "清水与流动的河（只有岔口南边两汪发黄的死水塘）",
    "文字、招牌与旗帜",
    "返绿的荒原与新长的树（4.0.3a 之后的样子）",
]

