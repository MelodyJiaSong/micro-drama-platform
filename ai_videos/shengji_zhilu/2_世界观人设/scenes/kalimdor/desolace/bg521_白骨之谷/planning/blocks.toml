# 白骨之谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图南墙未标名：整张图的方位与尺度都是推定（区级 bg502 b521 暂摆在中南部老废墟正南的山里）。
# 谷轴南北向，北口朝向区心；图面 y 向南 ＝ 谷深处。

[meta]
bg = "bg521"
name_zh = "白骨之谷"
size_m = [320, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "原典只说「南缘一道石崖夹出的窄谷」，无坐标、无尺寸；谷长取约 520 m、谷底宽 70–90 m、两壁高约 100 m，沿用区级平面图 b521 的 200×500 m 量级加上两侧崖壁，全部推定"
# 世界树画面：南缘一道石崖夹出的窄谷，两侧崖壁下瘫着两具巨大到不成比例的骸骨，谷中骷髅与鬼火飘动
absent = [
    "任何人物、骷髅亡灵、鬼魂、动物（游荡的亡灵属 shot 层）",
    "鬼火、幽光、飘浮光点、发光的骨头",
    "火、烛火、灯笼、火把（本档零人工光源）",
    "河流、水塘、泉水（中线冲沟早已干透）",
    "绿草、活树、返绿（1.12 凄凉之地是灰黄死地）",
    "任何建筑、帐篷、营地",
    "北口以外的出入口（南端崖壁与碎石坡封死，两壁无路）",
    "成群的四足巨兽肋架（那是科多兽坟场 bg514 的形制）",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

