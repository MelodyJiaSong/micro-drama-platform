# 塔纳利斯全境 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/ · 1002×668 px）量取，单位 m：x% × 63.094、y% × 42.062，原点区图左上角（1 px ≈ 6.3 m）。
#
# 量取口径：区图上看得见的地物（山影 / 海岸线 / 虚线路 / 图标）写 src = "地图量取"，精度约 ±1%（±60 m）；
# 区图上没画、按空间逻辑摆的写 "推定"（图上画虚线）。
# 地貌骨架：一块被山墙三面围住的浅黄沙海——西北是把西邻环形山隔开的山墙（古城嵌在它的沙坳里），
# 北缘两段山链夹着一片界外暗红平地，东面一整条海岸线向东南伸出一个海岬（海岬上一座孤山藏着时光之穴），
# 南缘一整条山墙绕到东南海岸，把沙海封住；沙海中部散着十来座小岩丘与三处古石殿遗迹。
# 全区地表没有河：[[water]] 只有外海与一汪岗哨水潭。
# 界外：区图西北 [0–25, 0–44] 是西邻环形山的坑底，北缘 [44–58, 4–16] 是北邻方向的暗红平地，图上都留作空地；
#       区图东面与南面整片是外海（逐行填成面，热砂港外的小岛挖空）。

[meta]
absent = ["被海水倒灌的东部与南部沿海：热砂港水下废墟、淹没的清泉平原与热影废墟、被淹的破浪海滩（那是 4.0.3a 大灾变之后；1.12 海岸线在港口栈桥外，沿海沙滩完好）", "泰坦石门被震开、门后通往的新大区与门前的商队营地（4.0.3a；1.12 大门完好紧闭）", "天涯海滩西侧的陆路通道（4.0.3a 才开；1.12 只能沿东面海岸游过去）", "南海岸的海盗大营与新据点、砂槌征募营、岗哨东塔的中立营地（都是 4.0.3a 新增）", "河流 / 湖泊（全区地表没有河；淡水只有岗哨旁一汪小水潭、砂槌营地一汪浑潭和镇里的水塔）", "森林 / 草地 / 农田（全区唯一成片的绿是西南谷里的巨型仙人掌与带刺灌木）", "雪 / 冰 / 霜", "熔岩 / 火山（火山在西邻环形山的坑底，不在本区）", "时光之穴内部（1.12 只是洞口地标，不可进）", "石砌大城（区内唯一的城镇是土坯墙与铁皮棚屋；石头建筑只有古石殿遗迹、古城与泰坦石门）", "飞行坐骑"]

