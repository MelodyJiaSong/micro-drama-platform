# 砂槌营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg671"
name_zh = "砂槌营地"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 300 × 240 m：区图 [41, 57] 处小岩丘的暗色环圈直径约 10–12 px（≈60–75 m），营地按「四顶巨型帐篷环一潭」的规模铺开约 110 m；无一手尺寸出处"
# 世界树画面：沙漠南部几间兽皮大帐围着一汪浑浊水潭，帐外插着骨头旗杆，山壁上有一个黑洞洞的洞口。
# 场地外（只进远景，不画）：东约 350 m 更大的锯齿岩丘（区图 [46, 55]）、南面南月废墟断柱（区图 [40, 73]）、南缘山墙
# 营地整体坐在比四周低 1–2 m 的浅洼里，水潭在洼底；锚点机位在场地西南角沙坡 (60, 200) 朝东北
absent = [
    "围墙 / 寨门 / 木栅（营地四面敞开，只有西侧一道齐膝碎石矮障）",
    "燃着的火堆与炊烟（大火塘是冷透的余烬）",
    "洞内景（洞口全黑，洞内不属本档）",
    "树木与草地（唯一的绿是丘顶两丛刺灌木）",
    "东侧的新征募营与其营房（4.0.3a 新增）",
    "任何人物、坐骑与动物（默认空营）",
    "旗帜纹章与文字标识",
]

