# 祖尔法拉克外围 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
#
# 地貌骨架（区图 [34–38, 6–13] 古城图标 + 区级 terrain.toml）：古城嵌在西北山墙的沙坳里，
# 西、北两面是环形山东缘山墙，东面是北墙西段垂下来的山脚，**只有南面敞开**，一条沙路从南边的岗哨水潭方向
# 上来直抵城门。本图只画城墙以外（墙内属副本节点 g11_instances）；墙后阶梯塔只露上半截，作天际线标志。

[meta]
bg = "bg691"
name_zh = "祖尔法拉克外围"
size_m = [480, 420]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区级图把本子区域量成约 400×360 m（bg670 b906，地图量取）；本图外扩到 480×420 m 以装下三面山脚与南口沙路，内部布局全部推定"
# 世界树画面：沙丘中的巨魔石城，阶梯金字塔与插满头骨的木桩
absent = ["任何水体（墙外没有水潭；最近的淡水是南边岗哨旁那一汪，不在本图）", "河流 / 湖泊", "树木 / 草地 / 仙人掌林（成片的绿只在西南谷）", "土坯镇 / 铁皮棚屋 / 水塔（那是东边的小镇）", "中立营地 / 商队营地（4.0.3a 之后才有）", "城墙内的街巷、祭坛、水池与竞技场（属副本节点，不进外围底图）", "被海水淹没的沿海（本图离海很远，且 1.12 海岸完好）", "雪 / 冰", "熔岩 / 火山", "飞行坐骑 / 飞行点", "任何人物与动物"]

# ── 山脊：三面围合 ──
[[ridge]]
