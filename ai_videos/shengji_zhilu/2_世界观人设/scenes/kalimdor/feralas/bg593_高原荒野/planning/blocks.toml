# 高原荒野 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (3560, 2300) m：区图「高原荒野」标签一带的代表性林段；东缘山岭按 bg583 terrain.toml「中南分隔岭」平移换算。

[meta]
bg = "bg593"
name_zh = "高原荒野"
size_m = [800, 600]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "世界树无坐标；场地取区图标签一带，原点与东缘山岭按 bg583 terrain.toml（6.342 m/px）平移换算；溪沟、巨树、倒木、石柱段、林隙全部推定"
# 世界树画面：从西海岸一直铺到中部河谷的广阔雨林：参天巨树、垂挂的藤蔓与厚苔石块，林下光线偏绿、常年潮湿。
absent = ["任何人物与野兽（雪人 / 树人 / 食人魔属 shot 层）", "道路与桥（只有贴溪兽径）", "聚落、帐篷与建筑", "火、火堆与任何人工光源", "开阔草地与农田", "湖泊与海面", "雪与冰", "沙漠与戈壁", "枯黄的秋色林", "4.0.3a 后的新据点", "现代建筑"]

