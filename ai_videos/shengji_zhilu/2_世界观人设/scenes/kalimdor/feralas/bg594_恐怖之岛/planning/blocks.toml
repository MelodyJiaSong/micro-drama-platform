# 恐怖之岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (1430, 2620) m；岛身轮廓按 bg583 terrain.toml「外海南岛的岛山」平移换算，两道山脊与中央谷按区图裁切拆分。

[meta]
bg = "bg594"
name_zh = "恐怖之岛"
size_m = [1000, 1500]
px_per_m = 1.0
grid_m = 100
scale_src = "地图量取"
scale_note = "岛身外廓取 bg583 terrain.toml（区图 6.342 m/px 量取）：南北约 1.4 km、东西约 0.8 km；岛心 [30, 80] 在本场地 (476, 769)；东西山脊分界、谷宽、空地与骨堆推定"
# 世界树画面：西南外海一座多山的荒岛，礁岩海岸与稀疏的树，岛北端一条通向岩洞的海边小路，岛上盘踞着多头巨兽。
absent = ["任何人物与野兽（多头巨兽 / 蛇尾人形属 shot 层）", "聚落、营地、建筑与码头", "桥与栈道", "火、火堆与任何人工光源", "沙滩（只有礁岸）", "茂密雨林（岛上只有稀疏的树）", "雪与冰", "被海啸淹没的岛（4.0.3a）", "4.0.3a 后的任何新据点", "现代建筑"]

