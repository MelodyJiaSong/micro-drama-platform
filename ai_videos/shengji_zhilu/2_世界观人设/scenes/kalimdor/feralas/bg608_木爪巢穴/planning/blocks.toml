# 木爪巢穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg608"
name_zh = "木爪巢穴"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图无图标、世界树无坐标；按「丘陵间的洞穴营地」取小凹地尺度。洞口、斜棚、火塘、骨堆、沟口木桩全部按卡片推定。机位：南口窄沟 (130, 205) 朝正北"
# 世界树画面：丘陵间一处豺狼人洞穴营地，洞口堆着骨头与破布，火堆的烟从岩缝里冒出。
absent = [
    "寨墙、木屋与石砌房屋（只有兽皮斜棚）",
    "水面与溪流（凹地是干的）",
    "燃着的火堆、冒烟的岩缝、火把与任何人工光源（默认态全冷）",
    "洞内景（要拍另立 bg）",
    "紫色虫巢与硬壳（在更南的 bg610）",
    "雨、雪、夜景",
    "人物、坐骑与野兽",
    "大灾变之后的任何改建",
]

