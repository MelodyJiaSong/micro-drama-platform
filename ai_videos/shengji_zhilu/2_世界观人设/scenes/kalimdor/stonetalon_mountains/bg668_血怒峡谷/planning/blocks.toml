# 血怒峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图上本谷没有单独标名；区级 b968 按世界树「焦炭谷边缘」推定摆在焦炭谷西北角。谷身走向、宽窄、巢位一律推定。

[meta]
bg = "bg668"
name_zh = "血怒峡谷"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图无本谷独立轮廓；按区级 b968（223×160 m）与世界树「更窄的火谷」推定：谷身约 330 m 长、谷底宽 50–100 m"
# 世界树画面：焦炭谷边缘一段更窄的火谷，崖上密布鹰身女妖的骨枝巢，地面覆着黑灰
absent = ["第二个出入口（西北尽头是死崖）", "任何建筑、据点与营地", "河流 / 湖泊 / 任何水体", "活的树林与草地", "岩浆河与岩浆湖（岩浆只在一道细缝里）", "明火与冒烟的焦土", "成片的炭桩林（那是焦炭谷）", "道路与车辙", "雪", "4.0.3a 后新加的据点与地名"]

