# 烈日石居 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg662"
name_zh = "烈日石居"
size_m = [400, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上聚落图标到崖脚水潭约 60 m、到主路约 280 m（terrain.toml 支路量取）；场地 400 × 300 m 框住西崖、岩台、袋形谷与东出支路。岩台与帐篷尺寸按「一座长帐 + 四顶小帐」的小聚落推定，实机量取后校正"
# 世界树画面：藏在峰间的一小片部落聚落，兽皮尖顶帐与牛头人图腾柱贴着岩壁排开，一侧是直落的悬崖
absent = [
    "寨墙、木栅与瞭望塔（聚落无围墙，岩壁就是墙）",
    "石砌房屋与任何石屋",
    "旅店招牌、旗帜纹章与文字",
    "点着的火塘、火把、火盆、灯笼与任何人工光源（火塘默认冷灰）",
    "烟柱与火星",
    "停在栖架上的飞兽与坐骑",
    "任何人物与动物",
    "河流（本地唯一水面是崖脚小潭）",
    "伐木场、树桩与锯木架（那是东北方的伐木谷）",
    "4.0.3a 后的改建、炸弹坑与钢铁工事",
]

