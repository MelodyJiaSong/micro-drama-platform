# 焦炭谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 四壁与两条小路由区级 terrain.toml（bg657）平移而来：本图原点 ＝ 区图坐标 (1098, 1626) m。谷内每一块都是推定。

[meta]
bg = "bg667"
name_zh = "焦炭谷"
size_m = [700, 860]
px_per_m = 2.2
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 1002×668 px ↔ 4465×2978 m（≈4.46 m/px，见 bg657 terrain.toml）；谷在区图上约 130×140 px，四壁多边形按区级 terrain.toml 平移裁取"
# 世界树画面：西南一整片被烧成焦黑的谷地，地缝里淌着橙红岩浆，枯树只剩炭桩，空气被热浪扭曲
absent = ["任何建筑、据点与营地", "河流 / 湖泊 / 任何水体", "活的森林与草地", "岩浆湖与大面积岩浆流（岩浆只在细地缝里）", "明火与冒烟的焦土", "道路以外的车辙", "雪", "4.0.3a 后新加的据点与地名"]

