# 狂风峭壁 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 山块、湖、河、矿洞口、隧道口、进谷支路由区级 terrain.toml（bg657）平移而来：本图原点 ＝ 区图坐标 (2541, 1079) m。谷内伐木场设施一律推定。

[meta]
bg = "bg669"
name_zh = "狂风峭壁"
size_m = [1000, 740]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 1002×668 px ↔ 4465×2978 m（≈4.46 m/px，见 bg657 terrain.toml）；谷在区图上约 200×160 px，按区级 b969（891×713 m）外扩到东北隧道口"
# 世界树画面：曾是老龄巨木林的谷地，现在只剩成片齐腰的树桩与堆起的原木，哥布林的铁架厂房横跨在谷上
absent = ["完整的原始森林（只剩峰腰几片残林）", "清澈的溪流", "城墙、营寨与石砌建筑", "明火、冒烟的烟囱与运转的机器", "焦土与岩浆（那是焦炭谷）", "雪", "4.0.3a 后的联盟山寨与新营地", "4.0.3a 后的巨型炸弹坑", "飞行坐骑"]

