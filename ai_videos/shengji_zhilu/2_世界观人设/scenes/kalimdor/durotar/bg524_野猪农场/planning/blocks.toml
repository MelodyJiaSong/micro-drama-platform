# 野猪农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标；区级平面图 bg523 · b901 把它摆在城门东南约 150 m。本场地西缘 ≈ 城门南下主路，北缘 ≈ 北缘山墙崖根。

[meta]
bg = "bg524"
name_zh = "野猪农场"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标、区图上无图标；按区级平面图 b901（城门东南约 150 m、主路以东约 120 m）与原典「城门外东侧的大猪圈」推定。猪圈 / 棚 / 水塘尺寸按兽人猪场常识推定"
# 世界树画面：奥格瑞玛正门外东侧的大猪圈，一座粗木储物棚与一汪浑浊的小水塘，苦工赶着黑毛野猪
absent = [
    "任何人物、野猪与牲口（底图里猪圈是空的；苦工与黑毛野猪属 shot 层）",
    "任何火、火盆、火把与人工光源（棚边旧烧斑早已冷透）",
    "分排的多个小圈（本场是单个大圈；分排窄圈是西侧那座猪场的特征）",
    "草顶棚屋 / 住人的木屋（这里只有一座敞口储物棚）",
    "农田、麦浪、草地与树林（只有枯黄硬草、刺灌丛与一棵枯棕榈）",
    "石砌建筑、金属尖刺围墙（那是 4.0.3a 重建后的城门外观）",
    "区内飞行点与飞艇塔入画（飞艇塔在城门另一侧，不进本档）",
    "雨、雪、积水泥潭（地面是晒干的泥壳，唯一的水是那汪小水塘）",
]

[[ridge]]
name = "北缘山墙崖根（近乎垂直，约 150 m）"
poly = [[0, 0], [240, 0], [240, 20], [180, 26], [120, 28], [60, 25], [0, 20]]
height_m = 150
src = "原典方位"
note = "区级平面图北墙山体的南脚；镜头朝北只能拍到崖根与岩层纹"

[[ridge]]
name = "东北山块伸下来的缓坡"
poly = [[240, 110], [240, 200], [150, 200], [190, 165], [220, 130]]
height_m = 15
src = "推定"
note = "区级平面图东北山块的西北角落在场地东南；坡上散刺灌丛"

[[road]]
name = "城门南下主路（场地西缘）"
path = [[26, 20], [22, 110], [18, 200]]
width_m = 8
src = "推定"
note = "区级平面图主路在城门以南沿 x≈2224–2248 南下，距猪圈约 110 m"

[[road]]
name = "贴崖根往东北海湾去的窄土路"
