# 回音群岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 按区图裁切量取：裁切 720×480 px，本场地坐标 ＝ 裁切像素 × 1.4 m（实测裁切 1 px ≈ 1.48 m，取整后误差约 5%）。
# 点位 (504,340) ＝ 区图 [64,85] ＝ 区级平面图 (3094,2740)，落在主岛西岸；本场地原点 ≈ 区级 (2590,2400)。
# 岛 ＝ [[ridge]]（陆地轮廓 + 高度），岛间与外海 ＝ [[water]]；草屋群按裁切上主岛东北部的草屋图标摆。

[meta]
bg = "bg535"
name_zh = "回音群岛"
size_m = [1008, 672]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "各岛轮廓、水道宽度、草屋群位置按区图裁切量取（±10%）；草屋数量（六座）、雕刻木柱（三根）、火坑、弃船、倒伏棕榈的位置按原典「浓绿棕榈与藤蔓压住破败的草屋」推定"
# 世界树画面：东南外海一串热带小岛，浓绿棕榈与藤蔓压住破败的巨魔草屋，岛间是浅碧色的潟湖水道
absent = [
    "训练假人、训练场与整洁的新营地（那是 4.0.3 后改成出生地之后的东西；1.12 这里是敌占的破村）",
    "码头、栈桥、灯塔与船坞（岛间只有浅水道，靠涉水或独木舟）",
    "任何人物：敌对部族、村民（底图里岛上是空的）",
    "任何动物：鱼人、螃蟹、迅猛龙（属 shot 层）",
    "任何火、火把、灯笼、邪术光效与人工光源（村心火坑是冷灰）",
    "完好的新草屋（草屋一律塌顶、断桩、被藤蔓吞没）",
    "红土荒原与赭红山块（那是对岸半岛；群岛上全是浓绿）",
    "文字、招牌、旗面纹章",
    "雨、雪、风暴巨浪",
]

