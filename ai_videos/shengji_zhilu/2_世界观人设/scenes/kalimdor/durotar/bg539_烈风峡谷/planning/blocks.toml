# 烈风峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b539（2224.1, 967.0），原点 ＝ 区级 (1924.1, 667.0)。
# 主路与三块山体按区级 terrain.toml 平移过来（地图量取，±50 m）；两谷的收窄与东沟的切口是推定（区图不单画窄谷）。
# 区级 b530 托克雷农场落在本场地 [155, 300]——西谷西口外放宽处，不在锚点画面里，本图不画它（归 bg530）。
# 锚点机位：西谷底 [280, 306]，离地一人高，朝东偏北（约 70°）；东沟口在视线左偏约 11°。

[meta]
bg = "bg539"
name_zh = "烈风峡谷"
size_m = [600, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "主路与山体按区图量取（±50 m）；西谷宽约 90 m、东沟宽 15–45 m、壁高 30–40 m、岩龛离地约 10 m 均为推定"
# 世界树画面：剃刀岭以北主路两侧的两片红岩窄谷，崖壁上凿出一排哈比人巢穴，地上散着碎骨与羽毛
absent = [
    "任何建筑、帐篷、木栅、哨塔（两谷里只有崖壁岩龛里的枝巢）",
    "从谷底通上崖顶的坡道或台阶",
    "火、火盆、火把、灯笼与任何人工光源（洞口深处一片黑）",
    "积水、溪流、水潭与绿色草地",
    "树林与棕榈（只有零星枯死矮树与刺灌丛）",
    "雪、冰、霜",
    "训练假人",
]

