# 提拉加德城堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 堡心 (200,190) ＝ 区图 [58,57] ＝ 区级平面图 (2804,1837)；本场地原点 ≈ 区级 (2604,1647)。
# 裁切图 1 px ≈ 1.61 m（区图 1 px ≈ 4.825 m，放大 3 倍）：海岸线在堡东约 150 m、孤塔在北偏西约 150 m、
# 小水洼在西北约 240 m、南面山影自堡南约 90 m 起——均按裁切图量取（±30 m）。堡的外形与门朝向按微型地下城图。
# 锚点机位：堡西南山丘坡脚 (110,290)，比堡基略高，朝东北。

[meta]
bg = "bg529"
name_zh = "提拉加德城堡"
size_m = [440, 340]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "堡心按区图坐标 [58,57] 定；海岸线、孤塔、小水洼、南面山丘按区图裁切量取（±30 m）；堡的轮廓（南北长的方形、西侧外凸门厅）按微型地下城图，64×80 m 为推定；角塔、拒马、壕沟按海防小堡常识推定"
# 世界树画面：海岸上一座半塌的人类石砌堡垒，塔楼缺口、石墙被熏黑，残余的蓝白旗帜挂在断墙上
absent = [
    "任何人物、动物（底图里堡是空的；守军残部与来犯者属 shot 层）",
    "任何火、火把、灯笼、烛火与人工光源（烟熏痕是多年前的旧痕，早已冷透不冒烟）",
    "码头、栈桥、灯塔与停泊的船（1.12 本区没有海港；沉船只在东北礁滩里）",
    "完整无损的塔顶（临海南角塔塌了半截）",
    "兽人式尖木桩寨墙、兽皮帐篷（这是本区唯一的石砌堡）",
    "旗面纹章与文字（布幡只剩褪色的蓝白两色、无图案）",
    "区内飞行点、飞行坐骑",
    "高崖（海岸只是三四米的红岩坎）",
    "森林、草地（只有贴地盐草与碎石）",
    "雨、雪、夜景、积水",
]

