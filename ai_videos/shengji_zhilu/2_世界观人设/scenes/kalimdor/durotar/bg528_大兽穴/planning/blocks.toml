# 大兽穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地是试炼谷（bg542）西南角的放大：bg542 b01 营地 (234,424) ≈ 本图穴屋门前空地 (105,150)，原点 ≈ bg542 (129,274)。
# 锚点机位：空地东北约 60 m 的谷底 (160,100)，离地一人高，朝西南平视略俯。

[meta]
bg = "bg528"
name_zh = "大兽穴"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "营地位置与门朝向按 bg542 试炼谷平面图（区图 [42,68] 营地图标）换算；东北水潭距离按 bg542 量取（约 150 m）；穴屋、帐篷、火塘尺寸按兽人营地常识推定"
# 世界树画面：试炼谷西南角一处半掘进土坡的兽人营地，粗木门楣与兽皮门帘，几顶锥形帐篷围着一堆常燃的篝火
absent = [
    "任何人物、动物（底图里营地是空的；新兵、野猪、蝎子属 shot 层）",
    "训练假人（1.12 没有，4.0.3a 才加）",
    "飞行点、飞行坐骑",
    "石砌建筑、城墙、金属尖刺（营地只有土坡穴屋与兽皮帐篷）",
    "第五顶帐篷（帐篷数量锁定四顶）",
    "火把、灯笼、烛火（唯一人工光源是火塘那一小堆柴火）",
    "西南方向的天空（西、南两面是土坡与崖壁，天际线是崖顶）",
    "河流、积水（唯一的水是东北谷心那口小水潭）",
    "成片绿地、森林",
    "雨、雪、夜景",
    "文字招牌、旗面纹章",
]

