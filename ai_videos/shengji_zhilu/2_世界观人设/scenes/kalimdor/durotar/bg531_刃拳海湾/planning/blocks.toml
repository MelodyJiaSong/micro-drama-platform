# 刃拳海湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图 (2500, 0)（区图北缘）。北缘山墙东端、东北山块北肩、城门→海湾小路、
# 骷髅形巨岩 b909 (2654,318) 均按区级 blocks.toml / terrain.toml 换算；海岸线按区图（1 px ≈ 4.825 m）量取，±50 m。
# 锚点机位：南岸红岩岬角顶 (330,520)，比水面高二三十米，朝西北偏北（约 340°）。

[meta]
bg = "bg531"
name_zh = "刃拳海湾"
size_m = [1000, 700]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "山墙东端、东北山块北肩、小路与骷髅形巨岩按区级平面图换算；海岸线与湾面按区图量取（±50 m）；碎石滩、礁石、岬角细部为推定"
# 世界树画面：东北角一湾深蓝海水嵌在红岩岸之间，向北望得见艾萨拉那侧的绿色海岸线
absent = [
    "任何人物、动物与海里的生物（底图里湾是空的）",
    "码头、栈桥、灯塔、停泊或航行的船（1.12 本区没有海港）",
    "对岸的港口、工厂、火箭轨道等工业设施（那是 4.0.3a 之后的北邻区）",
    "飞艇与飞艇塔（在城门外，不入本档）",
    "巨岩洞口里的绿色火光（洞内的邪能火不入本档，洞口看过去是一团黑）",
    "任何火、火把、灯笼、烛火与人工光源",
    "湾内的岛屿（湾口外只有没出水的暗礁）",
    "白沙滩、棕榈林（那是南岸高脚村一带；本湾只有窄碎石滩）",
    "风暴巨浪、雨、雪、夜景",
    "文字、旗面纹章",
]

