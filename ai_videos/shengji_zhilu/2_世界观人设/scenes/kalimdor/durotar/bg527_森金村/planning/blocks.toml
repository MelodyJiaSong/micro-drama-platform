# 森金村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 村心 (120,130) ＝ 区图 [56,76] ＝ 区级平面图 (2707,2450)；本场地原点 ≈ 区级 (2587,2320)。
# 海岸线按区图裁切量取：自 (260,91) 向西南斜到 (144,260)，离村心约 93 m（岸线方向 ≈ 东偏北 55.5°）。支路按区级「南路→海边高脚村的支路」换算。

[meta]
bg = "bg527"
name_zh = "森金村"
size_m = [260, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "村心按区图坐标 [56,76] 定；海岸线走向与离村距离、西北水洼、东南外海小岛方位按区图裁切量取（±50 m）。六座高脚屋、沙滩宽度、独木舟尺寸按海边村常识推定"
# 世界树画面：海边一排高脚木桩托起的巨魔茅顶棚屋，屋檐挂着骨制风铃与彩绘面具，村前是白沙滩与停着的独木舟
absent = [
    "任何人物、村民、坐骑、鱼人与动物（底图里村子是空的）",
    "任何火、火盆、火把与人工光源（空地火坑只剩冷灰）",
    "码头、栈桥、灯塔与大船（海边只有沙滩与独木舟）",
    "区内飞行点与飞行坐骑栖木（1.12 本村没有飞行点）",
    "训练假人与训练场（那是 4.0.3 后外海群岛改成出生地之后的东西）",
    "外海小岛上的村落细节（1.12 群岛是被敌方占着的破败草屋，远景只见一团团深绿）",
    "石砌建筑、兽人式尖木桩寨墙（本村只有高脚茅顶棚屋，没有围墙）",
    "文字招牌、旗面纹章",
    "雨、雪、风暴巨浪",
]

