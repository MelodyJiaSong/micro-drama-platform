# 枯水谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 谷心 (215,165) ＝ 区图 [52,27] ＝ 区级平面图 (2514,870)；本场地原点 ≈ 区级 (2299,705)。
# 谷身中线：(60,260) 西南小洞 → (370,70) 东北死端，走向东偏北约 31.5°。烈风峡谷（bg539，区图 [46,30]）在小洞外西南约 250 m。

[meta]
bg = "bg534"
name_zh = "枯水谷"
size_m = [420, 320]
px_per_m = 3.5
scale_src = "推定"
scale_note = "谷心按区图坐标 [52,27] 定；区图上这一带只有山影、谷本身没画，谷的走向（小洞朝西南对着烈风峡谷）按原典「唯一入口从烈风峡谷穿小洞进来」推定；谷长、谷宽、崖高全部推定"
# 世界树画面：一条被高崖夹死的干涸河谷，谷底全是碎石与枯死的灌木，唯一的地面入口是一个贴着崖根的小洞
absent = [
    "任何水：流水、水潭、积水、湿泥（河床是干透多年的）",
    "任何人物、营地与有翼野兽本体（岩架上的巢是空的）",
    "任何火、火盆、火把与人工光源（峡谷崖顶点绿焰火盆的洞口是另一处地标，不在本谷）",
    "第二个出入口：谷口大路、台阶、栈道、绳梯、木桥（唯一地面入口是西南崖根的小洞）",
    "建筑、围栏、帐篷、旗帜",
    "成片的草与绿色植被（只有枯灌与一棵枯树）",
    "雨、雪、雾",
]

