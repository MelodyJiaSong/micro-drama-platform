# 灰谷（ashenvale）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据（rule 4g）：贴地地坪（营心泥地 / 秃洼 / 焦土 / 沙滩 / 卵石滩 / 泥滩 / 花毯 / 下沉石阶 / 干沟 / 机位点）走 yard，
#   石铺空地与镶嵌地坪走 plaza；石台基、台阶、墙基、矮石栏、桥头垫坡、石台残基走 low_wall（实心方体）；
#   尖木寨墙、拒马、拴缰桩列、桥下木桩墩走 palisade；两道门（寨门、尖拱石门）走 gate_wall；
#   木桥走 arch_bridge；嵌进山体 / 土丘的洞口（熊怪洞、兽穴洞、墓穴石门、隧道口、岩缝）走 cave_mouth；
#   湖底深潭、池子、浅水洼、湾外深水区走 pool；湖中岛身、机位岩坡 / 岩肩、陡坎、根墙、山脚碎土坡走 rock_shelf；
#   光门与贴地鬼火是光效不是实体，走 proxy 只占体积；bg444·b02 / bg452·b14 是另一张卡的整座营寨，场外不收，proxy 占体量。
#   bg426·b02 伐木机械是世界内专有机械，真实世界没有同类实物可搜照片（参考图只许真实实物），proxy 方盒占位。
# 去重：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用一件——
#   a01 银灰古树包揽全区林子 / 林缘 / 单棵古树；a02 板根巨树兼树居主干与各处最粗老树；a03 焦枯树兼焦林与枯白老树；
#   a04 树桩兼所有秃地 / 焦桩群 / 劈木墩；a06 倒木兼折枝 / 漂木 / 焦梁 / 横倒整柱；a07 巨石兼落石 / 碎石 / 碎骨堆 /
#   木屑山 / 石碑 / 湖心黑石；a08 兽皮圆顶帐篷兼熊怪村草棚与树皮锥棚；a09 长屋兼大屋 / 营房 / 棚屋 / 铁匠棚；
#   a14 半塌弧顶石屋兼烧塌弧梁木屋；a15 断柱兼柱础 / 石灯柱 / 石碑 / 石像 / 烟囱；a16 骨图腾兼骨杖 / 旗杆 / 火把 / 绳梯；
#   a17 火塘兼石盆 / 石钵 / 圆井 / 石础圈；a19 灌丛兼蕨 / 芦苇 / 鸢尾带 / 枯藤帘；
#   a20 高脚平台兼栖架 / 瞭望台 / 树居平台 / 旋梯 / 码头 / 隧道支架 / 锯木台 / 吊架 / 各类木架 / 板车。
# 已知块数据问题（不改 blocks.toml，留给写入脚本的人）：
#   bg420·b01 半圆残墙的占地 90 × 70 是整圈外廓，low_wall 会按长轴建成一块 90 × 70 × 4 的实心板、盖住广场，需拆成弧段；
#   bg423·b01 方寨木栅 100 × 95 同理，palisade 只出一条 100 m 的直线，需拆成四面墙；
#   bg419·b02–b05 树居平台与旋梯 h_m 是离地高度，a20 逐轴撑满后是「从地面立起的高脚台」，与树干 b01 平面重叠，需 may_overlap；
#   bg449·b10 / b11 伞菇群没有同类资产，暂走 yard（贴地），前景菌伞要靠出图补。

