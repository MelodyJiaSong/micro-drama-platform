# 血牙营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg415"
name_zh = "血牙营地"
size_m = [200, 160]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图无图标、wiki 无坐标；只知「弗伦河西侧、南月亮井西南」。营心 60 × 50 m 按「几顶帐篷围篝火」的小营规模推定，离河距离同属推定（河放在场地东缘），实机量取后校正"
# 世界树画面：林间的小型兽人营地，几顶兽皮帐篷围着篝火，木桩上挂着风干的兽头
absent = [
    "寨墙与瞭望塔（这是无围墙的小营，古树就是墙）",
    "旅店、飞行点与栖架",
    "点着的篝火、火把、火盆与任何人工光源（火塘默认冷灰余烬）",
    "烟柱与火星",
    "石砌建筑与精灵式木构",
    "木桥（桥在主干道上，不在本营）",
    "任何人物、狼、坐骑与挂着的新鲜猎物",
    "旗帜纹章与文字",
    "4.0.3a 后的任何改建",
]

