# 阿斯特兰纳 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg414"
name_zh = "阿斯特兰纳"
size_m = [400, 340]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "裁切图约放大 5.9 倍（ASTRANAAR 字样对照原图 61 px），1 裁切 px ≈ 0.89 m；本图原点 ＝ 裁切图 (150, 90) px。湖、岛身、两桥、东岸弧坡按裁切量取；岛上屋舍布局无一手出处，按旅店 / 驻所 / 塔楼 / 飞行点四项功能推定"
# 世界树画面：湖心小岛上的精灵小镇，两座木桥连向岸边，紫顶塔楼与哨兵驻所围着中央空地
# 区图：红十字 ＝ 岛心；旅店图标在红十字东南约 40 m；西来林道沿湖北岸到岛头，东南桥头接南岸林道先南后东
absent = [
    "城墙、城门楼与石砌大城（湖水就是围合，进出只有两座木桥）",
    "兽人式尖木寨墙、兽皮帐篷与红黑战旗",
    "被焚毁或塌落的屋舍（默认完好；突袭后的残破态须另立 bg）",
    "点亮的灯、火把、火盆与任何人工光源（白天默认，灯架全不亮）",
    "码头、船只与渡口",
    "发光的井水（岛上的井只是清水）",
    "任何人物、哨兵、角鹰兽与坐骑",
    "文字招牌与路牌上的字",
    "4.0.3a 后的任何改建",
]

