# 密斯特拉湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。场地左上角 ＝ 区级平面图 (2250, 2200)，即区图约 [42.7, 62.6]。
