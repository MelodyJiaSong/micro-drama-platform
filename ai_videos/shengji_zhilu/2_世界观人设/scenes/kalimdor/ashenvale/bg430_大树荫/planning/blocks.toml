# 大树荫 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图光门图标约 [93, 36.5]（区级 terrain b911）落在本场地 (225, 135)；区图 1 px ≈ 5.3 m。

[meta]
bg = "bg430"
name_zh = "大树荫"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上只有一个门图标、北东两面山地晕线与西南方向的林道，量不出空地尺寸；口袋 400×320 m、空地直径约 110 m（圆心 225,135）、巨树环半径约 68 m 均按原版梦境之门的通行形制推定"
# 世界树画面：东北角林间的圆形空地，中央浮着一道翠绿色的光门，门边盘踞着绿色巨龙守卫
absent = [
    "任何人物、巨龙、龙崽与动物（守门者属 shot 层）",
    "光门的石框、门柱、台阶与支架（光门凭空悬立）",
    "空地内的任何建筑、石台、遗迹与路面（林道到空地边缘即断）",
    "联盟哨站、飞行点与营火（旧世没有，4.0.3 之后才有）",
    "火、烛火、灯笼与任何人工光源（唯一非日光光源是光门微光）",
    "夜景、雨雪、秋黄落叶林",
]

