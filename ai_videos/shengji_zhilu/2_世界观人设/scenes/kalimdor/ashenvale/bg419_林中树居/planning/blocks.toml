# 林中树居 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [62, 50.5]（区级 b906，地图量取）；巨树东侧南北土路 = bg413 terrain「东北出路」、东与东南弧形矮坡 = 「林中树居环丘」、西北山体 = 「狼嚎谷山群」南缘，均平移换算后按区图相对方位摆；树上结构全部推定。

[meta]
bg = "bg419"
name_zh = "林中树居"
size_m = [360, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「参天巨树 + 多层木台与旋梯」；主干直径约 18 m、三层平台 8 / 20 / 34 m 为推定。场地放大到 360 × 360 m 把东侧土路、路外弧形矮坡与西北山脚一并框进来"
# 世界树画面：一株参天巨树周围搭起的多层木台与旋梯，树干上开出窗口，平台边缘垂下绳梯
absent = [
    "任何人物、坐骑与角鹰兽（平台上的居民属 shot 层，不进底图）",
    "任何火光：篝火、火把、灯笼、烛火，窗洞里没有灯",
    "树下另建的房屋、石砌建筑、围墙与寨门（整座据点就是这一棵树）",
    "第二株同等高度的巨树（全区只有这一株高出林冠）",
    "飞行点与栖架（旧世灰谷唯一的联盟飞行点在湖心小镇）",
    "河流与湖面（最近的河在东面矮坡之外）",
    "文字招牌、纹章旗帜与训练假人",
    "4.0.3 之后的新建筑与新营地",
]

