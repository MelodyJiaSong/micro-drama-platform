# 石爪小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 场地原点 ＝ 区图 [40, 69]（区级 (2109.2, 2425.1) m）；洞口图标 [42.75, 72.7] ＝ 本场地 (145, 130)。
# 隧道在山体里的走向只知「朝南再拐西南、通往南邻区」，洞内线形与支架间距全部推定。

[meta]
bg = "bg451"
name_zh = "石爪小径"
size_m = [300, 460]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "洞口、隧道路、东侧湖湾与山墙北缘按区图（1 px ≈ 5.26 m）量取；隧道宽六七米、高五六米、支架间距十来米无一手出处，推定"
# 世界树画面：凿穿山体的粗糙隧道，木支撑架顶着岩顶，洞内点着零星火把
absent = [
    "封堵隧道的石墙、铁栅与新近落石（4.0.3 后才封；1.12 畅通）",
    "铁轨、矿车、矿灯与采矿器械（这是通道不是矿）",
    "天光、天井与洞口透进的光（机位在第一道弯之后）",
    "发光水晶、熔岩与任何火把以外的光源",
    "任何人物、动物、坐骑与车辆",
    "旗帜、纹章、路标与刻字",
    "苔藓铺满的洞壁（洞内太暗，只有近洞口有少许地衣）",
]

