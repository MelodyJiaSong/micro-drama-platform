# 迈斯特拉岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 区图点位 [27, 36]（1 px ≈ 5.26 m）落在本场地 (200, 170)；路 / 小径 / 山脚 / 弧坡按区图放大 4 倍量取，营内布置按世界树画面推定。

[meta]
bg = "bg418"
name_zh = "迈斯特拉岗哨"
size_m = [400, 320]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图量取：南北向大路在点位正西约 13 px（≈70 m），海滩点线小径在点位西北约 28 px 并入大路，西南山脚在 ~20 px 外，东侧弧坡在东南 ~25 px 外；营内帐篷 / 瞭望台尺寸按精灵式行军营常识推定"
# 世界树画面：林间小丘上的哨兵营地，两三顶紫色帐篷与一座木质瞭望台，周围插着月形旗
absent = [
    "任何人物、坐骑与动物（营地空着）",
    "燃着的火堆、火把、灯笼与任何人工光源（火塘是冷灰）",
    "角鹰兽栖架与飞行点（旧世灰谷联盟唯一的飞行点在湖心小镇）",
    "围墙、寨墙、石屋、旅店与铁匠铺（这是只有帐篷的行军营）",
    "削尖原木寨墙、红黑战旗等兽人式营造（那是对面阵营）",
    "湖面与海岸（本点看不到水）",
    "雪、沙漠与草原",
]

