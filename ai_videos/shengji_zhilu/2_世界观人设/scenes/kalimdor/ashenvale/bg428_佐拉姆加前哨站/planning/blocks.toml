scale_src = "推定"
scale_note = "位置取坐标表 [12, 35]；海在西、山崖在南与东南、沙滩向北、密林在东北，按区图裁切量取。寨墙约 70 × 60 m 与院内各建筑尺寸无一手出处，按世界树「沙滩上的木栅营地 + 简易码头」推定"
