# 弗伦河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量法：原版区图（1002 × 668 px，1 px ≈ 5.26 m）裁 (570,380)-(760,560) 放大 4×，1 放大像素 ≈ 1.316 m。
# 桥位 ＝ 主路过河处，区图约 (637.5, 467.5) px ＝ [63.8, 69.8]；场地原点取桥位西北 250 m（区级约 (3105, 2210) m），桥落在本场地 (250, 250)。
# 注：区级「弗伦河」块与主干道已按路河交点复量改正（原 [67, 65] 偏北）。

[meta]
bg = "bg433"
name_zh = "弗伦河"
size_m = [500, 500]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "河道走向、主路与东岸三岔口、西北弧形林梁按区图 4× 放大量取；河面宽 45 m、桥长宽、桩墩排数、卵石滩与芦苇位置推定"
# 世界树画面：南北纵贯的宽河，水色墨绿，主干道在河上架着一座宽木桥
absent = [
    "石桥、铁索桥、吊桥与第二座桥（附近唯一的过河点就是这座木桥）",
    "渡口、码头、栈桥与船只",
    "桥上或桥头的灯柱、灯笼与任何人工光源",
    "瀑布、急流与白浪（本段水流平缓）",
    "营地帐篷、木寨与任何建筑（东南的营地与东北的木寨都在画外，另档）",
    "北面的参天巨树（被西北林梁挡住）",
    "干涸河床、洪水漫岸与被淹的桥",
    "飞行坐骑与空中航线",
    "雪、冰面、沙地与开阔草原",
    "任何人物与动物",
]

