# 屠魔峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (4130, 2560) m；区级「屠魔峡谷路」尽头的小圈（区级 (4403, 2794)）落在本场地 (273, 234) 一带，纪念碑取圈心。

[meta]
bg = "bg431"
name_zh = "屠魔峡谷"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "推定"
scale_note = "位置取区级平面图 b922（推定）与区图点线小路的走向、尽头小圈；谷底长约 300 m、宽 50–110 m、壁高 60–90 m 无一手出处，按区图灰色谷地的轮廓与世界树「两壁夹峙的深谷」推定。西壁即屠魔山（bg432）"
# 世界树画面：两壁夹峙的深谷，地面焦黑龟裂泛暗绿，谷底立着一座兽人纪念碑
absent = [
    "恶魔、人物与动物（属 shot 层）",
    "鬼火、绿色火焰、熔岩与任何发光的地面（暗绿只是矿锈冷痕）",
    "正在燃烧或冒烟的东西（烧痕早已冷透）",
    "活树、草地与苔藓",
    "流动的溪水与河（只有西壁脚一汪死水）",
    "营帐、哨站、栅栏与任何驻扎营地",
    "碑面文字与任何铭文",
    "第二条出路（南端封死，只有北口）",
]

