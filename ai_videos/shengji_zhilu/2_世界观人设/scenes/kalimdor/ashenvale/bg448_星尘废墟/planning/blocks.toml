name_zh = "星尘废墟"
size_m = [220, 220]
px_per_m = 7.0
scale_src = "推定"
scale_note = "位置取区级平面图 b916（区图图标量取）；湖外径约 150 m、岛宽 40 余 m、七柱半圆半径约 12 m 均无一手尺寸，按区图小湖图形与世界树「断柱排成半圆、星形地坪」推定"
# 世界树画面：林间空地上的白石遗址，断柱排成半圆，地面镶嵌着已磨平的星形图案
absent = [
    "桥、码头、栈道与伸进水里的石阶（岛与岸之间只能蹚水）",
    "屋顶、完整墙体与厅堂墙基（灰青墙基是西北另一处遗址）",
    "道路、营帐、瞭望台与任何近年人迹（脚印、灰烬、祭品）",
    "火光、火塘、烛火与发光的符文、发光的石头或湖水",
    "瀑布、急流与河道（湖水静止）",
    "任何人物、动物与水中生物",
]

