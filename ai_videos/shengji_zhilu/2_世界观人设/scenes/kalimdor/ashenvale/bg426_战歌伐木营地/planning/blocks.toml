# 战歌伐木营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级坐标 (4280, 1990)；世界树点位 [84.1, 62.6] → 本图 (155, 210)。
# 主干道 / 河汊 / 小潭 / 冥火岭 / 东部丘陵 从 bg413 terrain.toml 平移换算（地图量取）；营内落位全部推定。

[meta]
bg = "bg426"
name_zh = "战歌伐木营地"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "秃地取约 280 × 180 m（世界画面「被砍成秃地的一大片林区」），场地 480 × 400 m 把西端矮丘、北侧林坡与南侧冥火岭北麓一并框进来；卡加希亚要塞（bg417）在东缘外约 20 m，不入本图。营内尺度无一手出处"
# 世界树画面：被砍成秃地的一大片林区，树桩密布，中央立着伐木机与巨大的锯木台，浓烟自炉口冒出
absent = [
    "任何人物、坐骑与伐木机械的驾驶者",
    "炉口以外的任何火光：篝火、火把、灯笼；冥火岭的绿色鬼火（属 bg435）",
    "完整的原生林（秃地上只剩树桩，林子只在边缘成墙）",
    "寨墙与城门（尖木高墙属东缘外的要塞 bg417，只入远景）",
    "飞行点与双足飞龙栖架（在西边的碎木岗哨）",
    "4.0.3 之后新增的部落据点、攻城器与堡垒扩建",
    "战旗纹章与文字招牌",
]

