# 蓟皮村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [36, 36.5]（区级 b904，地图量取）；村台坡线与点线土径的走向读自区图，村内落位全部推定。

[meta]
bg = "bg424"
name_zh = "蓟皮村"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「山坡上锥形棚屋沿坡排布 + 村后洞口」；村台取约 80 × 60 m，场地放大到 260 × 220 m 把村后岩坡洞口与村前长坡一并框进来。村内尺度无一手出处"
# 世界树画面：山坡上的熊怪村，锥形树皮棚屋沿坡排布，村后是通向洞穴的黑色洞口
absent = [
    "任何人物与动物（熊怪属 shot 层，不进底图）",
    "任何火光：燃着的篝火、火把、灯笼、洞口里的火光",
    "寨墙、栅栏与寨门（村子只靠坡势与林子围合）",
    "石砌房屋、木板房与任何方正建筑",
    "湖面与河流（湖在坡下约 400 m 外，从村台看不见）",
    "道路以外的第二个入口",
    "飞行点、旅店与任何阵营据点",
    "文字招牌与纹章旗帜",
]

