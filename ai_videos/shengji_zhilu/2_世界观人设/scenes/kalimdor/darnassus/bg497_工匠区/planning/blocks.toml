# 工匠区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区图（WorldMap-Darnassus_c60.jpg，1002 px ＝ 967.7 m，0.966 m/px）像素 (455, 0)；m = (px − 455) × 0.966, py × 0.966。
# 按区图东北那片草绿色块取景（与区级图 bg495 的 b497 块一致）；坐标表 [54,38] 落在战士区西缘，不用。
# 草坪块的轮廓是地图量取（区图上的绿色地块），每块上的工棚用途是推定。

[meta]
bg = "bg497"
name_zh = "工匠区"
size_m = [280, 200]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "按原版区图 0.966 m/px 量取（区图 1002 px ＝ 967.7 m，WorldMapArea 口径）；草坪地块与路网按区图描出，工棚高度与用途推定"
# 世界树画面：东北侧的环形作坊台地，沿弧墙排开铁匠炉、织机与炼金台，炉火是全城唯一的暖色
absent = [
    "燃着的炉火 / 灯笼 / 亮灯的窗（白天默认态炉冷、树屋不点灯；开炉态与夜态另立 bg）",
    "4.0.3a 之后新建的建筑与通往别处的传送门",
    "训练用的假人靶（4.0.3a 之后才有）",
    "飞行点与角鹰兽（在树根下的码头村）",
    "封闭有墙有门的作坊（工棚一律四面敞开；只有空心树屋旅店有内部）",
    "城墙与城门（东、北两面是弧形矮墙 + 树体崖沿）",
    "山体与裸岩（台地是巨树枝台）",
    "车马与车辙（城内只有步行的木板路）",
    "针叶林与秋色枯叶",
    "人物与动物（底图全空）",
]

