# 战士区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Darnassus_c60.jpg（1002 × 668 px，0.966 m/px，同区级 terrain.toml），
#       本图原点 ＝ 区图像素 (555, 180)；场地 x = (px − 555) × 0.966，y = (py − 180) × 0.966。
# 区图上的品红色块是一整片南北长、东西窄的石台，西侧凸出一块接跨湖长桥，东面伸出两条细廊各通一座方亭；
# 东门大道从石台东脸一路向东到城缘门廊，半路两侧各一座小方台。
# 区图不画的三样按世界树文字推定：石台中央下沉的圆形沙地、东脸入台石阶、台外的树下墓园。

[meta]
bg = "bg501"
name_zh = "战士区"
size_m = [340, 180]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 967.7 × 645.3 m（AreaID 1657 的 WorldMapArea）按 0.966 m/px 量取；本场地框住区图像素 x 555–907、y 180–366：演武石台 + 东门大道 + 城缘门廊"
absent = [
    "训练用的假人靶（4.0.3a 之后才有；旧世演武场只有沙地与雕像）",
    "兵器架上的真兵器、盔甲架与任何人物（纯空间背景）",
    "任何点亮的火 / 火盆 / 火把 / 烛火（白天默认态不点灯，墓园碑前的小烛盏是冷的）",
    "石砌城墙、城垛、箭塔与吊桥（城的边界是树体与崖沿，东面只有一道门廊）",
    "旗帜与纹章上的文字、刻字的碑文（画面零文字，墓碑是素面）",
    "血迹、刀痕累累的战场残骸与废墟",
    "通别的大陆 / 位面的传送门（4.0.3a 之后才有）",
    "飞行点与角鹰兽栖架（在树根下的村）",
    "车马与车辙",
]

