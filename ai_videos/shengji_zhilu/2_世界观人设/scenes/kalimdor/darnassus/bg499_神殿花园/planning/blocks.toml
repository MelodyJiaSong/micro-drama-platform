# 神殿花园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区图（WorldMap-Darnassus_c60.jpg，1002 px ＝ 967.7 m，0.966 m/px）像素 (272, 160)；m = (px − 272) × 0.966, (py − 160) × 0.966。
# 与区级图 bg495 的 b999 块（湖心绿岛）一致；北岸圆形石台与 bg496 的 b07 是同一座（本图只画到它为止）。

[meta]
bg = "bg499"
name_zh = "神殿花园"
size_m = [200, 210]
px_per_m = 7.0
scale_src = "地图量取"
scale_note = "按原版区图 0.966 m/px 量取（区图 1002 px ＝ 967.7 m，WorldMapArea 口径）；岛、草洲、桥与圆台按区图描出，古树粗细、石框门尺寸与高度推定"
# 世界树画面：城市中央的开阔水景园，浅湖中一座圆形绿岛，环岛白石堤与低矮花丛，四面木桥辐射而出
absent = [
    "通往别的大陆 / 外域的传送门（4.0.3a 之后才有；旧世只有西水畔这一道去树下码头村的门）",
    "石框门里常亮的光膜（按镜条件的变体；默认态框内空着）",
    "飞行点与角鹰兽（在树根下的码头村）",
    "灯笼 / 烛火 / 亮灯的树洞（白天默认态零人工光源）",
    "夜态的萤火光点与发光植物",
    "穹顶神殿本体（在中轴长桥南端，另见 bg498）",
    "深水 / 海浪（湖浅到见底）",
    "城墙与城门",
    "人物与动物（底图全空）",
]

