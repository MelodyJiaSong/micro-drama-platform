# 火焰洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1566, 1866) m；坐标表点位 [38.5, 65.8] ＝ 区级 (1848, 2106) 落在本场地 (282, 240)。
# 区图裁切 ref/bg556_火焰洞穴_map_crop.png 约为原图 4 倍放大（裁切 1 px ≈ 1.2 m），土台、绕行土路与三面水系按裁切量取。

[meta]
bg = "bg556"
name_zh = "火焰洞穴"
size_m = [520, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "场地范围按区图裁切换算（裁切 1 px ≈ 1.2 m）；土丘直径约 60 m、高约 20 m 与门洞朝向无一手出处，推定"
# 世界树画面：石槌食人魔留下的巨大土丘式巢穴，粗木立柱与兽皮门帘被烟熏黑，洞口有黑龙人守卫。
absent = [
    "任何人物、守卫与生物（龙人守卫属 shot 层）",
    "火光、火把、火盆与燃着的火塘（名字里的火焰不入画；门前火塘是冷灰）",
    "熔岩、岩浆与冒烟的地缝",
    "石墙、石屋与第二座构筑物（土台上只有这一座土丘）",
    "海面、码头与船（本点位看不到海）",
    "桥与木栈道",
    "成片的高大树林（只有枯立木与沼生矮树）",
    "雪与沙漠",
]

