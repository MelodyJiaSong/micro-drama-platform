# 尘泥海湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (2400, 1450) m；岛块区级 (3144, 1616) 的西南大半落在本场地东北角，跨海长桥南头区级 (2960, 1500) ≈ 本场地 (560, 50)。
# 区级 terrain.toml 的中央长脊 / 东南山体 poly 是全区粗描，与海湾宽度对不齐；本图按卡片方位（西岸坡脚、东南山肩、湾宽三四百米）重排，推定为主。

[meta]
bg = "bg558"
name_zh = "尘泥海湾"
size_m = [1000, 800]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "场地范围按原版区图岛堡西南约 210 × 170 px 的窗口换算（1 px ≈ 4.8 m，精度有限）；浅洲、礁群、防波堤与灯塔的尺寸与位置无一手出处，推定"
# 世界树画面：塞拉摩岛西侧的一弯咸水海湾，泥沙浅滩与礁石，远处灯塔与白石城墙映在灰绿海面上。
absent = [
    "任何人物、海鸟、海龟与水中生物（属 shot 层）",
    "船、帆、码头、栈桥与浮标（泊船在岛东南岸，不在本湾）",
    "搁浅的破船（归南缘外的破船浅湾，另立 bg）",
    "火光、烛火、灯笼与亮着的灯塔（默认午前，灯塔不亮灯）",
    "岛上要塞的废墟、焦痕、弹坑与紫色裂口（5.0 之后的事，旧世城墙完好）",
    "钓鱼大师的命名码头（2.3 才命名）",
    "白沙热带海滩与棕榈（这里是灰黄泥沙浅洲）",
    "成片的高大树林（西岸只有稀疏枯树）",
    "大浪、雨、雪与夜景",
]

[[ridge]]
name = "中央长脊东南端坡脚（西岸，缓缓落到水边）"
poly = [[0, 0], [150, 0], [200, 200], [230, 420], [200, 640], [120, 800], [0, 800]]
height_m = 60
src = "推定"
note = "区级「中央长脊」的东南端；高度推定"

[[ridge]]
name = "东南山体北肩（直落海中）"
poly = [[640, 800], [700, 690], [800, 620], [1000, 600], [1000, 800]]
height_m = 130
src = "推定"
note = "区级「东南山体」的北肩；高出海面一百多米"

[[water]]
