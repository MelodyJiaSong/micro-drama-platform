# 警戒哨岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg547"
name_zh = "警戒哨岗"
size_m = [180, 180]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图裁切上塔图标落在东北半岛南段坡上、东半岛路西南侧，东北是海岸低脊、西南坡下是中央水道；场地取 180 m 见方装下下坡泥路、拒马、塔岗与坡下水道岸。塔身与拒马无一手尺寸，按路边警戒塔常规推定；远景的桥与岛在场地外（区级 bg551）"
# 世界树画面：塞拉摩桥头本土一侧的石基木哨塔，俯瞰通往塞拉摩的泥路，塔下有卫兵与拒马。
absent = [
    "岛上要塞的废墟、魔法弹坑与紫色裂口（5.0 之后的事，旧世完好）",
    "亮着的灯塔与任何火光、火盆、灯笼、人工光源",
    "旗面上的纹章图案与任何文字",
    "任何人物、卫兵、坐骑、船上的人与动物（全部属 shot 层）",
    "破损、烧痕与塌顶（驻守中的完好岗哨）",
    "成片的高大树林（只有坡上枯草、矮蕨与泥岛矮树）",
    "飞行坐骑与空中航线（旧世天空不能飞）",
]

