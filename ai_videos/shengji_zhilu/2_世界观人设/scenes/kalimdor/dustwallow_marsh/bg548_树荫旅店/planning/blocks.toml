# 树荫旅店 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg548"
name_zh = "树荫旅店"
size_m = [200, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图裁切上旅店图标紧贴大道南侧、夹在山墙缺口南北两道余脉之间；场地取 200 m 见方装下大道、土台与两侧岩坡。旅店地基 20×12 m 与院内附属物（马棚 / 井 / 货车）无一手尺寸，按路边旅店常规推定"
# 世界树画面：沼泽西缘大路旁一座烧成焦黑骨架的人类旅店，只剩石砌壁炉与几根炭化立柱，泥地里散着烧剩的杂物。
absent = [
    "任何火、余烬、烟与人工光源（焦痕全是冷透多年的旧痕）",
    "完好的屋顶、墙板与门窗（主楼只剩石基、烟囱与炭化立柱）",
    "成片水面与深沼（这里是山口，积水只在车辙与低洼）",
    "成片的高大树林（只有两侧岩坡上几棵灰白枯树）",
    "任何人物、坐骑、马匹与尸体",
    "文字招牌（招牌柱的牌面已烧没）",
    "营地帐篷与卫兵哨卡（旧世这里没有驻守）",
]

[[ridge]]
name = "北侧低岩坡（山墙缺口北余脉）"
poly = [[0, 0], [200, 0], [200, 22], [150, 30], [95, 40], [40, 44], [0, 48]]
height_m = 25
src = "地图量取"

[[ridge]]
name = "南侧低岩坡（山墙缺口南余脉，向东南延伸）"
poly = [[0, 150], [45, 145], [100, 150], [150, 160], [200, 172], [200, 200], [0, 200]]
height_m = 30
src = "地图量取"

[[road]]
