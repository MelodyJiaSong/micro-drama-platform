# 巨龙沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 原点 ＝ 区级平面图（bg543）坐标 (2200, 2150)；深沼水道、南支延伸路、东南山体取自 bg543 terrain.toml，
# 团本洞口取区图副本图标（≈[53.9, 76.6] → 区级 (2588, 2452)），小洞口取 bg559 坐标（[54.4, 84.4] → 区级 (2611, 2701)）；
# 南界山墙的前山、岩丘轮廓、骨骸、枯树与水洼位置无一手出处，一律推定。

[meta]
bg = "bg565"
name_zh = "巨龙沼泽"
size_m = [700, 650]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "盆地轮廓按区图「THE WYRMBOG」一带量取（北接深沼水道尽头、东抵东南山体西坡、南到山墙前山）；x 向东、y 向南，原点 ＝ 区级 (2200, 2150)"
# 世界树画面：沼泽最南端，黑龙与龙人盘踞的泥潭，地面散着巨大的骨骸
absent = [
    "熔岩、火山口与洞口透出的火光红光（洞内熔岩窟属副本内景，不外露）",
    "正在燃烧的火、冒烟的焦木与发烫的石头（烧斑都是冷透多年的旧痕）",
    "绿叶、花与成片的活树林（只有几棵焦黑枯树）",
    "深水水道与大片开阔水面（本档水只是浅洼；深沼属北邻黑龙谷）",
    "任何房屋、营地、帐篷与石砌建筑",
    "新鲜的尸体与血迹（骨骸全是多年的灰白旧骨）",
    "任何人物、黑龙、龙人、幼龙与动物（属 shot 层）",
    "空中航线与飞行的坐骑",
    "雪、冰与雨",
]

