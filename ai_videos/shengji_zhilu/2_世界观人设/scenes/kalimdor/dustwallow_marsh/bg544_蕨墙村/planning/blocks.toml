# 蕨墙村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg544"
name_zh = "蕨墙村"
size_m = [260, 260]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级平面图块 b944 取 220 m 见方（地图量取）；本档放宽到 260 m 装下西侧岩坡与东侧水道。寨墙 140×135 m 与寨内各建筑无一手尺寸，按区图营寨图标与旧世聚居点常规推定"
# 世界树画面：食人魔与部落共处的泥沼营地，木桩围墙与兽皮帐篷
absent = [
    "任何火光、烟与人工光源（寨心火塘是冷透的余烬）",
    "石砌城墙、砖瓦屋顶与人类式木屋（这里只有原木寨墙、兽皮帐篷与粗木长棚屋）",
    "海面与海平线（寨子在内陆西北角，看不到海）",
    "成片的高大树林（只有岩坡上的灰白枯树与寨外蕨丛）",
    "任何人物、食人魔、双足飞龙与坐骑（全部属 shot 层）",
    "旗帜上的纹章与任何文字",
    "码头与船只",
    "4.0.3a 之后的新建筑与重建布局",
]

