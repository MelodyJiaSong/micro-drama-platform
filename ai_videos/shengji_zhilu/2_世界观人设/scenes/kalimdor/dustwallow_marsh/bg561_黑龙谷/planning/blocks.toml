# 黑龙谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1700, 1960) m。坐标表点位：火焰洞穴 [38.5, 65.8] ＝ 区级 (1848, 2106) → 本场地 (148, 146)；
# 石槌废墟 [44.7, 66.1] ＝ 区级 (2146, 2116) → 本场地 (446, 156)。山墙、深沼水道、土路按区级 terrain.toml 平移过来。
# 默认机位 b01（西侧山脚缓坡台）朝东南偏东（约 110°），视野约 75°–145°：土丘巢穴在左后方、废村在左侧画外。

[meta]
bg = "bg561"
name_zh = "黑龙谷"
size_m = [800, 560]
px_per_m = 2.0
grid_m = 100
scale_src = "坐标表"
scale_note = "场地范围以坐标表两点（火焰洞穴、石槌废墟）与区级 terrain.toml 的山墙 / 水道定位；枯树林、泥墩等自然块按区级画面推定"
# 世界树画面：沼泽南部一片更黑更深的泥沼，水面冒着硫磺气泡，枯树间成群黑色幼龙与龙人游走。
absent = [
    "任何人物、黑龙、幼龙、龙人与生物（属 shot 层）",
    "火光、熔岩、岩浆与发红的余烬（焦痕全是多年前冷透的旧痕）",
    "冒起的浓烟（气泡上方只有极淡的黄灰水汽）",
    "活的绿叶树林与森林（只有整片死掉的焦黑沼生树）",
    "建筑、帐篷与营地（土丘巢穴与废村各有 bg 卡，不入本档画面）",
    "桥梁与码头（唯一的「桥」是横倒的枯树）",
    "海面与船（从这里看不到海）",
    "雪、沙漠与干旱草原",
]

[[ridge]]
name = "西—南合围山墙（区界山墙南段东麓连南界山墙北坡）"
poly = [[0, 190], [45, 215], [95, 330], [125, 380], [190, 470], [320, 530], [420, 560], [0, 560]]
height_m = 200
src = "地图量取"
note = "区级 terrain.toml 西界山墙 (1680,2176)(1824,2336) 与南界山墙 (1728,2400)(2016,2496) 两段平移"

[[water]]
name = "南部深沼水道（硫磺气泡的黑水，全谷主轴）"
