# 尘泥沼泽全境 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/WorldMap-DustwallowMarsh_c60.jpg，1002 × 668 px）量取：山脊 [[ridge]]（poly 多边形）/ 水系 [[water]]（path 折线）/ 道路 [[road]]（path 折线），单位 m。
# 换算见 blocks.toml 头两行：x% × 48.006 m（东西）、y% × 32.004 m（南北），原点区图左上角，x 向东 y 向南。
# 要覆盖某个自动块，写 [[block]] 且带同一个 bg 键；要加没坐标的块，写 [[block]] 用 b9NN 的 id 并带 bg 键。
# 海面用很宽的 width_m 折线填成面（岛屿以块画在海面上）；ridge 的 height_m 是相对沼泽地面的相对峰高，推定。
# 道路：区图上画出来的双线 / 虚线路写 地图量取，看不清的连接段写 推定。

[meta]
absent = [
    "积雪与冰面（湿热沼泽，全年无雪）",
    "成片的高大阔叶林或针叶林（只有枯立木、沼生树与高草蕨丛）",
    "麦田与成片农田（只有两处孤立的带菜地小屋）",
    "干旱草原与沙丘（西邻的草原在区界山墙之外，不入本区画面）",
    "空中航线与飞行的坐骑（旧世天空不能飞）",
    "岛上要塞的废墟、魔法弹坑与紫色裂口（5.0 之后的事，旧世要塞完好）",
    "钓鱼大师的命名码头（2.3 才命名的子区域）",
    "北部路口哨塔的囚犯剧情（2.3 才加）",
    "大都会级的石城（岛上要塞是军事堡垒，不是都城）",
    "熔岩与火山口（南部只有硫磺气泡与冷透的焦黑岩洞）",
]

