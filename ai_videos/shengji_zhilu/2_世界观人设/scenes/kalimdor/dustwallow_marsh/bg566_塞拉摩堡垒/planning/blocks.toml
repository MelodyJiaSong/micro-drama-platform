name_zh = "塞拉摩堡垒"
size_m = [170, 150]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图上只有岛心一枚城堡图标（约 [66, 53]），无一手尺寸；按卡面「堡垒约 120 m 见方」推定，西侧留出城区街口、东北留出墙外尖塔"
# 世界树画面：塞拉摩岛中央的白石军事堡垒，厚重城墙与拱门，内院停着武器架与训练用的靶子。
absent = [
    "人形训练假人与木桩靶（4.0.3a 之后才有；靶子只有稻草圆靶）",
    "废墟、破墙、弹坑与烧痕（旧世要塞完好）",
    "海面与码头（内院四面高墙，看不到海）",
    "亮着的火盆、火把、烛火与灯笼（默认白天零人工光源，窗里不亮灯）",
    "带纹章或图案的旗帜（旗一律纯深蓝无纹样）",
    "任何人物、卫兵、商人与动物（属 shot 层）",
    "树木、花坛与草坪（院内只有石板地与沙地，墙缝细草除外）",
    "雨雪与夜景",
]

