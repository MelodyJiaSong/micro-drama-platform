# 塞拉摩堡垒 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 堡垒内院无一手尺寸与朝向：大门朝西、主楼在东、营房在北、库房在南、尖塔在东北墙外，均按卡面推定；
# 原点在场地左上角，x 向东、y 向南，单位 m。堡垒外墙围 x 35–155、y 15–135，西侧留 35 m 城区街口。

