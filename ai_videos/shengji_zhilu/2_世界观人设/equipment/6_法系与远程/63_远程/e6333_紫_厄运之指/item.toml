subject = "单手魔杖，杖头大、杖身细，从杖头写到杖尾共八段。① 蝠翼杖头：一对蝙蝠翼左右对称张开，与杖身垂直；每片翼由三根细长的骨质翼指从翼根放射撑开，翼膜绷在骨间；翼的前缘是一根较粗的骨臂，向前弯出，末端收成一枚细尖，翼尖越过宝石朝前方斜指，两片翼合起来像一弯向前张开的新月；翼膜后缘在翼指之间剪成一个个锯齿状的弧口，边缘挂着破碎的薄絮。② 新月骨托与宝石：两翼根部之间是一只新月形骨托，托口朝前，两端向内弯成爪钩，把一颗长椭圆宝石卡在中间，宝石整颗磨圆抛光，表面光滑圆鼓，像一枚拉长的鸽蛋，只有一片柔和的弧形高光，宝石长轴与杖身同向，前半截探出托口。③ 花托钢座：骨托后面接一只短颈花托形钢座，把杖头与杖身连起来。④ 星形护环：钢座后一指处，一片薄钢星形护环套在杖身上，几个尖角向四周放射。⑤ 弯刺护颈：紧接一簇黑色弯刺，五六片长短不一的三角刺片围着杖身向外、向杖尾方向翘起，刺缘带倒钩。⑥ 扭绞钢带：一段约一掌长的两股扁钢条绞成螺旋，紧箍在杖身上。⑦ 杖身：细而直的黑紫色钢杆，是握手处。⑧ 杖尾：末端再一片同样的星形护环，护环后面嵌一枚短小的四棱尖水晶，尖端朝后。"
