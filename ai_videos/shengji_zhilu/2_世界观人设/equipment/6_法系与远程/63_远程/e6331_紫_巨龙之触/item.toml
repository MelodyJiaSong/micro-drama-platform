subject = "一根单手短魔杖，杖头竖直朝上时从下往上：杖尾是一枚深色锻铁的八棱尖锥帽，像一颗拉长的菱形钉头；杖杆是一根笔直的圆杆，深绯红，带深浅不匀的顺长纹理，靠杖头约四分之一的一段颜色更深，接近暗褐红；杖杆顶端套一只向上张开的喇叭形铁箍，箍上接一段缠紧的深色皮条短颈。短颈顶上托着杖头：一块厚重的八棱眼座，厚度接近它的宽度，像一只装在八角铁框里的眼球；眼座前后两个平面各嵌一颗半球形的黑红眼石，眼石外一圈打磨发亮的铜圈，眼石中央一道竖直的细长瞳缝；眼座侧边一圈是深红、锈红与骨白相间的人字纹。眼座左右两侧各盘出一条蛇形小龙：龙颈从眼座侧边伸出，先向外、再向上弯成一道 S 弧，龙头停在最外侧的高处；左边那条龙的吻部指向左上方，右边那条龙的吻部指向右上方，两只龙头各朝自己那一侧的外面张嘴，后脑勺都朝着中间的眼座，两只龙头之间隔着一大片空当；两条龙左右镜像、背对背，龙身约拇指粗、满是鳞片，脊背一排尖刺，头顶几根向后的尖冠刺，龙吻细长，张开的上下颚里各一排细小尖牙，眼窝深陷。整个杖头从正面看像一把两股叉，眼座在叉根处。"
