subject = "一支双管燧发喇叭口短枪，两根钢管左右并排焊成一体。从枪口往后：两根枪管的末端各自鼓成一个外扩的喇叭口，喇叭口外廓由六个平面拼成六棱形，口径约为管身的两倍，口沿翻出一道窄窄的厚唇，两个喇叭口左右紧贴并排，口里是黑洞洞的膛；喇叭口之后是笔直的圆钢管身，两管之间的上方夹着一条平直的钢脊，靠后膛处套一圈刻线钢箍，两管最后并进一块方钢后膛块。管身下方从全长约三分之一处起垫着一条平底的木制前托，前端斜切成方头，一直托到后膛。后膛左右两侧各装一套燧发机：一块两头收尖的长条锁板嵌在木托侧面，用两枚螺钉固定，锁板上立着一只 S 形弯颈击锤，钳口里夹一片燧石、上方一枚压紧燧石的螺钉，击锤前方是一片 L 形火镰，盖住下面的小药池，火镰下压着一根弯片弹簧；两只击锤一左一右竖在后膛上方。后膛之后木托向下弯折约二十度，收成一段细长的握颈，握颈下方一道弧形钢扳机护圈，两头用长条钢舌贴进木托，里面前后两枚弯钩扳机。握颈往后逐渐加深成枪托，托身高约握颈的三倍，下缘收成一道钝棱，托底端面包着一块钢板，钢板用两枚方头钉钉住。握颈到托身两侧嵌着银灰钢片镶成的卷草纹。"
