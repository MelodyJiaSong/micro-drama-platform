# 《圣光刚好够用》装备配置（tools/equipment_lib.py 读；ai_video.md rule 4m；follow-up 021）
# 槽位 = 魔兽 1.12 上角色模型的可见槽（颈 / 戒指 / 饰品 / 圣契不上模型，不建卡——W12 §4）。
# 品质 = 1.12 的六档。**画面上品质不发光**（用户 2026-09-25 裁定「照原典模型」）：做工逐档递进，
# 只有原典模型自带特效的才在 item.toml 写 effect。每档的做工语法出自 0_research/parts/w21_装备体系与逐件外观.md §2。

[meta]
# 出图引擎（follow-up 027 定、029 收紧）：这两类武器、蓝档及以上的三视图走 ElevenLabs（贵，省着用），其余一律即梦 CLI
elevenlabs_categories = ["近战武器", "法系与远程"]
elevenlabs_min_tier = "蓝"
min_per_tier = 10          # 每类每档（橙除外）至少几件——equipment_index.md 的缺口统计读它
# 层级码（follow-up 028）：键 ＝ e{分类 no}{槽位序号}{序号}，各段位数；目录 {no}_{分类} / {no}{槽位序号}_{槽位}
key_digits = [1, 1, 2]
drama = "shengji_zhilu"
style_guide = "../style_guide.md"
style_heading = "### 全片共用摄影串"
negative_heading = "## 5. 负向锁定"
gate = "tools.check_world_scenes_szzl"      # 黄级专名 / 红级 IP 词闸门（concept C3）

# ── 槽位：顺序 ＝ 目录顺序 ＝ 空槽反向声明的顺序 ──
