note = "法杖是双手主手；魔杖与弓枪弩在远程；副手物品（书、宝珠、火炬）在副手"

# ── 品质六档（1.12）：出自 0_research/parts/w21 §品质语法（W21-tiers，对照真实模型 + 真实甲胄档次）。
#    rule ＝ 画面总则（进卡）；positive ＝ 进正面 prompt「做工」行；negative ＝ 进负面词块；family ＝ 按材质族进「做工」行。
#    glow ＝ 这一档允许的光色（空 ＝ 不许发光）；glow_forbid ＝ 光里不许出现的别档颜色——发光就必须和品质色一致（follow-up 024）；
#    glow_required ＝ 这一档必须有特效光（蓝紫橙，follow-up 027），glow_grammar ＝ 这一档光芒的强度与形态，并进正面 prompt 的「光」行。
#    family 只写新旧与光洁程度，不写结构件，也不写任何能画出来的附加物（包边 / 压印 / 蚀刻 / 宝石 / 另一种金属色）——
#    写了「一字护手」斧头长出剑柄，写了「压印纹」手背压出文字，写了「黄铜包边」素面套装镶上金边（W21-QA r1 / r2）；特征一律由各件 item.toml 写，全部名词化、冷状态（ai_video.md 16.8），零发光；橙装 1.12 只有锤 / 剑 / 杖，其余材质族写「不适用」，从不上主角的身。

[[tier]]
name = "灰"
rank = 0
label = "粗糙 Poor"
rule = "粗糙 Poor＝旧货、报废件、从怪物身上扒下的东西。形制照原典，做工是全剧最低一档：材料低劣、多年无人保养、坏处用铁丝麻绳胡乱补过。痕迹一律写成冷的污损名词（ai_video.md 16.8 / 18.3）。"
positive = "做工粗糙的旧货，材料低劣，多年无人保养，坏处胡乱补过"
negative = "崭新，抛光，镜面反光，镀金，鎏金，宝石镶嵌，纹章，雕花，蚀刻，整洁，成套配色，发光"
