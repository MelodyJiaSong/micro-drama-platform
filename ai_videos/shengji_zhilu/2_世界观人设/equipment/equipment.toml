classes = "猎人 · 萨满（1.12 里战士 / 圣骑士 40 级前也穿）"
slots = ["头", "肩", "背", "胸", "腕", "手", "腰", "腿", "脚"]
note = "猎人与萨满的披风也归这里"

[[category]]
name = "板甲"
no = 4
classes = "战士 · 圣骑士（40 级起）"
slots = ["头", "肩", "背", "胸", "腕", "手", "腰", "腿", "脚"]
note = "力量与坦克属性的披风也归这里；灰档 1.12 全库只有 8 件（轻型板甲一套），白档只有 8 件商店板甲 + 锻造，缺口补不上（W22 两源交叉核过）"

[[category]]
name = "近战武器"
no = 5
classes = "剑 · 锤 · 斧 · 匕首 · 拳套 · 长柄 · 盾"
slots = ["主手", "副手"]
