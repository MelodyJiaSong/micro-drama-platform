subject = "整杆笔直细长，从尖到尾依次是：矛尖——一根细长的针状钢刃，细得像一根削尖的钢条：根部也只有钢杆的两倍宽，长度约为根部宽度的九倍，截面扁薄，正中一道棱线，两侧刃缘磨得锋利，从针尖向后只极缓地放宽，两条刃缘近乎平行，最宽处就在倒刺根部，长约一个小臂。倒刺——矛尖根部左右各伸出一枚扁平的细长三角倒刺，像鱼钩的倒钩：它和矛尖是同一整块钢片、在同一平面；外缘从矛尖根部斜着向后、向外掠下去，尖端朝后、指向握柄方向，内缘与凸台之间留一道朝后开口的窄 V 形缺口，两道边都平直光滑，尖端垂到与凸台中部齐平，每枚只向外伸出约三指宽；整个钢头上只有这一根矛尖和这恰好两枚倒刺，左右对称。凸台——两枚倒刺后缘之间是一枚菱形的小凸台，比钢杆宽出一圈，面上錾着一组人字形刻线，后面紧接一道窄钢箍。钢杆——凸台之后是一根很长的光面圆钢杆，长度约为矛尖的两倍，粗细全长一致，只有木杆一半粗，约占全长四分之一，是整杆最细的一段；木杆要到这根细钢杆之后才开始。铁箍——钢杆插进木杆顶端正中，接口处套一道铁箍收紧。木杆——一根笔直的硬木长杆，前半段是光面木头。缠握——木杆后段约四分之一长缠着深红褐色皮条，约八节，每节约一掌宽，节与节之间露出一线木头，每节里的皮条斜着一圈压一圈。杆尾——缠握之后留出约 5 厘米光木头，尾端就是平切的木头端面，边缘倒圆。从尖到尾的长度分配：矛尖连倒刺与凸台一成半，钢杆两成半，光面木杆三成，缠握两成半，尾端光木一小截；钢与木在全长约四成处交接。整杆极细极长：全长约是两枚倒刺合宽的十七倍，倒刺合宽约是木杆粗的近四倍，钢杆只有矛尖根部一半宽；缠握每节皮条比木杆鼓出一圈，节间凹下去露出木头。"
