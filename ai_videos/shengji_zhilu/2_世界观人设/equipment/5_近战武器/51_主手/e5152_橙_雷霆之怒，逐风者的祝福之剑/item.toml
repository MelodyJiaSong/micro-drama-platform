subject = "从剑尖到柄尾依次是：剑身——两根细长的平行刃片从护手并排伸出，中间隔着一道贯通到底的镂空缝，缝宽约半根刃片；两根刃片各自收成一个锋利的剑尖，一长一短，前后错开。每根刃片的截面是扁菱形，正中一道笔直的中脊从剑尖通到护手，中脊两侧各磨出一道宽斜面直到刃口，外侧与朝着镂空缝的内侧都开了刃。护手——两根刃片的根部并进一块厚钢板，钢板正中是一只圆毂，圆毂里嵌着一颗通透的水晶圆球，球的两面都露在外面；钢板向两侧展开成一对新月形的翼，翼的前缘顺着刃根斜向剑尖，每侧翼的后缘伸出两枚弯钩，前一枚大、后一枚小，钩尖都朝剑柄方向弯回。柄套——护手后一截暗铁柄套，约一掌长，同一条边上竖着并排两枚短尖锥，微微朝柄尾倾斜。缠握——黑色皮条斜向紧缠，每圈之间压着一道细窄的深蓝皮条，一圈压一圈。柄首——一只略扁的圆鼓形暗铁柄首，朝另一条边斜伸出一枚短尖锥；柄首末端顺着剑的中轴再伸出一枚长长的尾锥，柄脚穿过柄首，在尾锥根部铆平。刃片与护手、护手与柄套之间接缝严实，整把剑每个部件都是实打实的锻件。"
