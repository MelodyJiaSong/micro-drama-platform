subject = "斧柄竖起时从上到下：斧头端是一枚镀金的纺锤形端帽，棱面分明。端帽下是镀金的斧头套座，套座朝斧刃的一面嵌一枚菱形金框里的暗红弧面宝石，宝石下压一道 V 形金棱。套座朝斧背一侧竖起两根角：一根粗长的深灰褐公羊角，只泛一丝冷紫调，表面一圈圈横向生长棱，先向外伸再向上弯折，尖端往回勾；另一根较短的象牙米黄光滑兽角从它下方升起、向前弯，两根角尖几乎碰在一起，围成一个尖顶的环。套座下箍着三道叠在一起的钢灰色宽环。斧刃从套座向另一侧伸出，是一片宽大的新月形：离斧柄最远的外缘是一整条长弧形刃口；靠斧头端的一角伸成一根尖刺，向上超出端帽；靠柄尾的一角弯成长长的新月尖，朝柄尾方向伸、尖端微微回勾向斧柄；新月尖与斧颈之间凹进一个深弧口，弧口里再伸出一枚小尖。斧柄笔直，裹着暗红褐的巨蜥皮，皮面是细密的菱格鳞纹；柄上等距套着三枚镀金纺锤形箍，箍与箍之间各有一只镀金爪形扣：正中一根长尖顺着柄指向中间那枚箍，两侧各一只弯爪扣住蜥皮。柄尾接一根弯牙，向斧刃一侧弯下，尖端镀金。"
