subject = "单手宽刃弯刀，单刃，前重后轻。刀头前缘是一条向上外凸扫起的大弧，弧顶收成全刀最高的锐尖；这枚刀头锐尖后面，刀背上只再跟两枚尖鳍，一枚比一枚矮——连刀头锐尖在内，刀背轮廓从前到后一共只有三个尖，三个尖都斜向刀柄方向勾，尖与尖之间的刀背往下凹成弧形。刃口是一条从刀头一路扫到刃根的长弧，微微外鼓。刀身往后逐渐收窄，靠护手的一段是平直的暗色刃根，约占刀身三分之一，刀背平直，刃根中线錾着一行刻痕符纹。刀身截面是厚背薄刃的楔形：刀背一侧厚，刃口一侧磨出宽斜面，薄成一线。护手是一个竖立的菱形钢框（转了四十五度的方框），上下两个尖角分别对着刀背与刃口方向，框边是内外两层阶梯，框心嵌一颗大椭圆刻面宝石，长轴顺着刀身，坐在框心的斜面托座里，四周一圈细压边；刀根从菱形框中间穿过，框与刀身锻接成一体，接缝一圈细细的锻打痕。护手后面是短握把，木芯外斜缠暗红色皮条，每圈压住上一圈的一半，只够一只手；柄尾是一段向末端外扩的扁梯形钢柄头，末端平切、两角微翘，柄脚尾从柄头正中穿出后铆平成一个小圆帽。"
