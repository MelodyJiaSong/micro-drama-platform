subject = "锤柄竖直、锤头在上时看：锤头是一只顺着柄的方向拉长的凸缘锤头，由四片厚钢凸缘围着一根中心钢管组成。四片在中心钢管四周按十字等距排开，每片都是一块沿着柄的方向竖着焊上去的厚板，从中心向外只伸出约一掌，四片合起来像一只收拢的细长笼子，锤头整体的宽度略小于它的长度。每片凸缘是细长的六边形：外缘中段笔直、与柄平行，上端斜着收成一个朝上的锐尖，尖点落在凸缘宽度的中间；下端斜着收回锤头根部的套管。中心钢管顶端是一枚短锥尖，缩在四片凸缘尖端的里面。斜放时画面里露出宽面的是两片，另两片一片正对画面、一片在后面，都只露出一道窄棱。每片的宽面：外缘一圈鎏金窄边，中央是一块暗钢面，暗钢面正中嵌一枚竖长的暗钢椭圆，椭圆四周一圈鎏金冠齿形饰框。锤头根部是一只带几道凸棱的鎏金套管，下面接一段向下收细的暗钢锥颈，再是一枚八棱的鎏金算盘珠形结，结下一段鎏金短套；然后是长长的深铁黑柄杆，一条细细的鎏金线在柄杆上螺旋缠绕；柄杆下端一段鎏金短套，接一段向下张开的暗钢喇叭形柄头，末端包一圈鎏金唇边。"
