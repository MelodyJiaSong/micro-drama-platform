subject = "从刃尖到柄尾：刃身是一枚细长的焰形矛尖，笔直收成针一样的尖；刃身截面是扁菱形，正中一道隆起的中脊从刃尖贯通到刃根，中脊两侧各一条又长又浅的凹槽，两侧刃口磨出窄窄的研磨斜面。刃根一段突然变宽：上下两侧各翻出两枚向后弯的焰舌形倒钩，一大一小叠在一起，钩尖朝后，钩缘带一两道波浪缺刻，只是焰舌的形状，本身是冷硬的玻璃。护手是一团镀金的星形爪笼：六七枚三角尖角向四周张开成一颗星，尖角之间是几根弯爪形的镀金爪片，合抱着几块有棱面的暗紫近黑晶石，晶石从爪缝里露出来；玻璃刃根插进爪笼正中，被爪片根部夹紧。护手后面接一截镀金短套管，再接握柄：握柄裹着暗紫灰色的鲨鱼皮，外面绕四道凸起的细绳箍，把握柄分成五节，握柄末端一道窄镀金箍。柄头是一枚镀金四角星，四个尖角朝四个方向伸出、四边内凹，星心镶一块磨成弧面的暗紫近黑宝石。比例：刃身约占全长一半多，护手、握柄与柄头合起来与刃身差不多长；星形护手大、四角星柄头小，前后呼应。"
