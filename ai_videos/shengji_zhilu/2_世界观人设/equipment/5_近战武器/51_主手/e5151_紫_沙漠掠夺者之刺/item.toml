size = "全长约 195 厘米，比持矛者略高。骨锥矛头长约 42 厘米、根部粗约 11 厘米，约占全长五分之一；矛根两枚爪钩各长约 14 厘米；甲壳颈环长约 8 厘米；前段甲壳杆长约 52 厘米、粗约 6 厘米，两端鼓节粗到约 8 厘米；后段缠带杆长约 65 厘米、粗约 4.5 厘米，正好双手一前一后握；尾锤长约 22 厘米，爪瓣张开约 18 厘米宽。"
subject = "长矛式长柄武器，从矛尖到尾端依次是：矛头——一枚前尖后粗的骨质长锥，像一枚巨大的兽牙，截面是略扁的圆，表面顺着长度方向有一道道细长的生长纹；锥身左右两侧各起一道窄棱，棱上排着一溜细小的锯齿倒刺，齿尖一律朝后，从矛根一直排到离矛尖约三分之一处为止。矛根——骨锥根部磨出一圈台阶，严丝合缝地插进一圈甲壳颈环，颈环后缘翻起一圈短小的棘刺，棘尖朝后；颈环左右各伸出一枚爪钩，先向外横出、再向后弯，钩尖朝杆尾，一左一右对称。前段杆身——一整截光滑的甲壳管，中段略细、两端鼓起成节，鼓节处各有一道浅浅的环形接缝，像虫足的一节。中箍——甲壳管与后段交界处一道窄窄的甲壳箍。后段杆身——杆芯外斜向紧缠一条宽皮带，一圈压一圈，缠带正中一段斜纹对折成人字，两头用细皮绳扎紧收口。尾端——一只喇叭形甲壳尾锤，套在杆尾上、接口处压着一圈细皮绳，从杆尾向外张开，外沿是一圈厚唇，唇外再伸出四枚向外翻卷的爪瓣，像一朵张开的爪花，正中露出一枚短而钝的骨质尾尖。整杆是一根笔直的杆，各段严丝合缝地套接在一起。"
