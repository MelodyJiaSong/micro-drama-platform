subject = "长柄双手翼锤。锤端正中，沿柄的轴线向前伸出一枚圆锥形钢刺，长约一掌，根部一道细箍。锤头的芯是一只顺着柄轴线的短粗鼓形芯，外面一圈竖直凸条像鸟笼的笼条，上下各一道宽箍。锤芯四周等距伸出四片厚钢翼瓣，每片的根部嵌进锤芯侧面的一道竖槽，再由上下两道宽箍箍紧，像传统翼锤那样顺着柄的方向立着：每片瓣面所在的平面都穿过柄的中轴线，四片两两相对，从锤端顺着柄看过去排成 X 形的四角星；从侧面看，上下两片展开成完整的侧影，另两片一前一后叠在锤芯上。每片瓣的侧影像一枚倒钩：靠柄的后缘是一条笔直的竖边，贴着锤芯的后箍；外缘沿两三级阶梯状的锯折向前斜升，最前端收成一个朝锤端方向勾出的锐尖，锐尖与中间锥刺之间是一道向里凹的弧口。锤头往下依次是：一道厚箍，两颗菱形截面的算珠形铜节，节间一截细铜颈，再一道宽铜箍；然后是长长的柄杆，笔直匀称，占全长的四成，上下两端各一道窄箍收口；柄尾是一只外扩的钟形铜柄帽，由一枚横销穿过柄杆固定，末端再伸出一枚短锥刺。整把锤细长、头重，锤头只占全长的四分之一。"
