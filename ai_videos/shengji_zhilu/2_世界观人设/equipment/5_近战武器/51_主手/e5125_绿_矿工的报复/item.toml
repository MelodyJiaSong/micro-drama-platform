subject = "从镐头到柄尾：镐头是一整条锻钢，从正中的圆筒形銎向两侧对称伸出两条镐臂，整体弯成新月形，两臂长短一致；镐臂根部很宽，与銎筒同宽，从銎口起向外伸、同时朝握柄一侧弯下去，弯度均匀，越往外越窄越薄，末端各收成一个锐尖，两个尖都朝握柄方向回勾，尖的位置比銎低约五分之一柄长；每条镐臂从銎口到尖的长度约为木柄的四成；镐臂是实心钢，截面是扁菱形，根部厚、臂尖薄，外弧与内弧各起一道棱，臂面中间微微凹下一条浅槽，从銎口一直走到臂尖。銎是一只粗短的钢筒，比木柄粗一圈，上下口各有一圈窄沿，沿木柄方向的长度约为木柄粗的一倍半，套在木柄顶端，与木柄垂直成丁字，两尖的连线也与木柄垂直；木柄顶端从銎口另一头露出约 1 cm，端面看得见木材年轮和一枚打进去的木楔。木柄粗直，浅黄褐色，木纹笔直干净，从銎向下约一半长度粗细均匀，然后以一道短而平缓的斜坡收细一圈，进入握段，上段木柄约比握段粗四成。握段从上到下：两道并排的米白麻线箍；一整条深红褐皮条斜着一圈圈螺旋紧缠，约六圈，每圈斜向同一边；一道米白麻线箍，紧贴柄尾。最末是一枚削出来的双锥形木头柄尾：前半段从握段往外放粗，最粗处与上段木柄一样粗，后半段收成一个短尖，前后两段差不多一样长，表面削出八个窄棱面。从上到下恰好是：新月镐头与銎、粗木柄、收细斜坡、两道麻线箍、螺旋皮条、一道麻线箍、双锥形柄尾。比例：镐头弦长约为木柄的八成，是整件最宽最显眼的部分；握段约占木柄的三成，柄尾约占一成。"
