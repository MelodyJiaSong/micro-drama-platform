subject = "西洋杯柄细剑，从剑尖到柄尾：剑身极窄而笔直，两刃几乎平行等宽，截面是扁菱形，厚约为宽的四分之一，一道细中脊从剑尖直通刃根，中脊两侧的研磨斜面很窄；离剑尖约 8 cm 处两刃才同时内收，收成一个细长锐尖。剑身的宽度与握柄的粗细差不多，长度约为握柄的七倍，细长是它最显眼的地方。刃根从杯形护手的正中穿出，穿出处垫一片小小的方形钢垫片，比剑身略宽。护手是一只半球形的薄壁铜杯，杯底圆鼓的一面朝剑尖，杯口朝握柄、罩住持剑的手；杯口直径比握柄的长度略长、约为剑身宽度的五六倍，杯深约为杯口直径的一半，杯壁很薄，杯口边缘向外卷成一道约 5 mm 粗的圆棱；侧看半球杯的轮廓是一个半圆，圆弧朝剑尖，直边就是杯口。杯后是握柄：木芯外先缠粗绳打底，再用深褐近黑的皮条螺旋紧缠，于是整段握柄是约九道等距的横棱：每道横棱是一圈鼓起的皮条，棱与棱之间的凹缝里嵌一道细黄铜扭丝，只露出一线；握柄从杯口往柄尾略略加粗，正好一只手握满。握柄末端是一道黄铜细环，接一枚小小的实心黄铜尖顶柄帽，长约为握柄的三分之一：比握柄略粗，外沿一圈圆棱，然后收成一个短钝的圆锥尖，柄脚尾端铆在柄帽里。从剑尖到柄尾的顺序恰好是：细长剑身、方形垫片、半球铜杯、横棱握柄、黄铜细环、尖顶柄帽。整把剑轻而修长，重心靠近护手。"
