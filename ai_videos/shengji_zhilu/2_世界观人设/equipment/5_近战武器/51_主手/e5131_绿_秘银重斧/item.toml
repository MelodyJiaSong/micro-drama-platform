subject = "只在一侧开刃，从柄顶到柄尾依次是：柄顶——钢柄穿出斧头顶端约一掌长，端头一道窄箍、收成一枚短锥尖。斧身——一块发黑的锻铁厚块包住柄身，钢柄从它靠斧背的那一半横穿过去；斧背那一头越往外越窄，收成一只短短的三角尖角，尖角长只有钢刃宽的五分之一，尖端微微偏向握把一侧；斧身靠柄顶一侧的轮廓朝钢刃方向张开成一道内凹弧线，靠握把一侧的轮廓笔直。斧身上柄身穿过的地方横绕一道铁箍，宽与柄粗相当，两缘各一道亮钢细线，箍在这一面并排钉着恰好两颗圆头铆钉。斧刃——斧身朝开刃的一侧一路放宽，接上一大片亮银白的钢刃，接缝是一道起伏的波浪线；刃片展开得极宽，从上角到下角超过整把斧长的一半：上角越过柄顶向外斜挑成尖，下角顺着柄身向柄尾方向拖成一个长长的下垂尖角；两角之间的刃口外凸，最凸出的一点在离上角约三分之一处，研磨得雪亮，刃面从斧身向刃口均匀收薄；下角与斧身之间那道向里凹的内弧是光滑圆顺的钢边。柄身——斧身之后是一段光亮的圆钢杆，比握把细一圈，接握把处一道深色窄箍。握把——一段扁方的握把，两面夹着发黑的钢柄片，钉着两排交错的圆头铆钉：两排各恰好四颗、共八颗，靠斧刃那一排比另一排往斧头方向错前半个间距。柄尾——握把末端朝斧刃那一侧斜折下去约四十五度，收成一个斜切的尖角折钩。柄顶锥尖、斧身、圆钢杆、握把恰好四段排成一条直线，只有最后的柄尾折开；从柄顶到柄尾的长度分配：柄顶一成，斧身两成半，圆钢杆两成，握把三成，折角一成。"
