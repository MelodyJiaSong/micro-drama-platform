subject = "一把细长的双手长柄锤：锤柄长度是锤头横长的三倍，立起来到人胸口，锤头只占全长四分之一强，整把看上去是一根长杆顶着一块不大的锤头。长柄与锤头成 T 字，从锤头到柄尾依次是：锤头——一块横在柄顶、与锤柄垂直的扁厚方块，锤柄正对它靠柄那条长边的正中，锤头两侧各伸出一半、左右等长，厚度约为横长的三分之一。正对大侧面看是一个拉长的六边形：两端是平整的打击面，靠锤柄的那条长边笔直、只在两头倒小斜角，背离锤柄的那条长边由两道长斜边在正中合成一道钝脊。锤头外面整个包着一层黄铜：两端打击面各套一道宽铜箍，四条长棱包着窄铜边，把两个大侧面各框成一块下凹的嵌板。嵌板里是一幅用两种金属片拼嵌的对称折线星形：正中一个大三角，尖头指向锤柄、几乎顶到靠柄那条铜边；大三角靠外的底部横嵌一枚杏仁形紫红嵌石，长轴顺着锤柄方向；大三角上下各伸出一道折了两次的台阶状尖角，分别折向两端的打击面；图形里凸起的块面是乳白色金属片，凹下去填底的几块三角是银灰钢面，块与块之间一道深色细缝。整幅图形沿锤柄中线上下对称。套管——锤头下一只黄铜短套管包住木柄顶端，管口一圈深色细箍。木柄——长而直的光面圆木柄，占全长四成，粗细上下一致。握段——紫红色皮条斜向缠紧的一段，约六圈，每圈约五厘米宽，斜缝全朝同一方向；前端紧挨木柄是并排两道黄铜箍，后端一道黄铜箍收口。柄尾——握段之后一只倒锥形硬木柄头，越往外越粗，张成喇叭形；喇叭口最粗处套一道宽黄铜箍，箍外接一枚短短的黄铜四棱尖，尖比木喇叭短。从锤头到柄尾的长度分配：锤头不到两成，光木柄四成，握段两成半多，柄尾一成多。"
