subject = "正面朝前。外轮廓是一个竖放的椭圆，只是这个椭圆由十段笔直的短边折成：盾在正中高度最宽，往上往下都逐渐收窄；左右两侧各是两段长边，在正中高度相交成一个很钝的外凸角；顶端三段短边拱成钝圆头，中间那段短边只有盾宽的三分之一；底端三段短边拱成一模一样的钝圆头，上下对称。盾面从外往里敲成四层同形的十边形：最外一圈是加厚的宽钢边，外沿斜削一道倒角，十段边各是一块平面，每个转角处折出一道斜棱；往里退下一级，是一圈平的环带；环带内沿是两道紧挨着的细凸棱，围成一个内十边形，约在盾宽的六成处；两道细凸棱围住的整个内十边形就是盾心：一个很大、很低的十面棱锥，底边就是这两道细凸棱，顶点在盾的正中、只比四周高出约三指，看上去几乎是平的；十条细棱从顶点放射到内十边形的十个角，把盾心分成十个明暗略有不同的三角斜面。整面盾像一只锅那样由一整张钢板一体敲出，宽钢边是板边向后卷压加厚的圆滑厚边，整面钢面连续光洁，只有敲出来的台阶与棱线。"
