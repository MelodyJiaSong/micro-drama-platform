subject = "尖底盾：上缘略平，两侧先直后收，向下合成一个底尖。盾面是粗晶条交叉成的格栅：沿盾缘一圈宽厚的晶条外框；一道横条在上三分之一处横贯全盾；一道竖条从上缘正中一直落到底尖；横条以上、竖条两侧各一块小格，每块小格再由一道斜晶条对角分开；横条以下、竖条两侧各一块大的长三角格。每一格里嵌着两三块拼接的旧木板，木纹顺着格子的长边走，木板比晶条低约两指，边缘被晶条压住。外框外沿一圈十几枚锯齿状的晶刺向外放射，每枚都是扁平的三角形，像一片厚冰凌，根部嵌进外框：两侧与下缘一路排下来，越往底尖越大，底尖本身就是最大的一枚；上缘两角各一枚。上缘正中坐着一颗兽骨骷髅，下半压在横条与竖条的交点上：圆拱的颅顶，两个圆眼窝，一个倒三角鼻孔，只有上颌，一排长獠牙竖直朝下，盖住竖条的上段。颅顶两侧长出一对粗如手腕的大弯角，角面一圈圈横向环纹，先向外、再向上翘，角尖朝天；两颊再各伸出一枚小弯角，向外、向下勾。额头正中嵌着一枚由霜白冰晶碎片拼成的放射状星形饰。骷髅的后脑嵌进横条与竖条的交点，边缘被晶石包住一圈，牢牢固定在盾面上；晶条交接处是一个个厚实的晶石节块。"
