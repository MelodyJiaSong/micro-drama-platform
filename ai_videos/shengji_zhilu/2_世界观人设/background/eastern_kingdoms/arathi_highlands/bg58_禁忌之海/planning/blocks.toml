# 禁忌之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景：阿拉希东岸一段（区级图 b958 附近），西缘岩山直插海岸，东半部全是外海；机位在正中偏西的岩岬顶（b01）朝正东。

[meta]
bg = "bg58"
name_zh = "禁忌之海"
size_m = [800, 800]
px_per_m = 2.0
grid_m = 100
scale_src = "推定"
scale_note = "东岸在区图上只是右缘一条岩脚线，无一手尺寸；按「岩岬—碎石滩—礁带—外海」的镜头纵深取 800 m 见方，礁带离岸约百米、海蚀柱二十来米高均为推定"
# 世界树画面：高地东岸外的深色外海，灰绿浪涌拍在礁石上，远处只有海雾没有陆地
absent = ["任何道路（区图东岸无路）", "码头 / 栈桥 / 石阶 / 系船桩", "船只、船帆与桅杆", "海面上的岛屿或对岸陆地", "沙滩", "树林与任何树", "聚落、帐篷、营火", "海鸟与海兽", "灯塔", "冰山与浮冰", "人工光源", "4.0.3a 后的海岸改动（本段旧世与后世无差别，仍按 1.12 写）"]

