# 萨多尔大桥 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景：区级图 b959（北桥头，南下主路终点）为北部；深谷东西走向横在场地中部；机位在桥头石坪北端朝正南。
# 桥面标高 ＝ 高地谷沿；桥墩 h_m 自谷底量起（谷底比桥面低约百米）。

[meta]
bg = "bg59"
name_zh = "萨多尔大桥"
size_m = [500, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区图只给出桥头方位（南缘河口，约 [45,90]）；桥长约 270 m、两桥中心距约 60 m、谷深约百米均按原典「巨型双桥、塔楼般桥墩、深不见底的峡谷」推定，未实测"
# 世界树画面：高地南缘峡谷上两座巨型灰白石拱桥的北端桥头，桥墩粗如塔楼，桥面宽可并行车马；从阿拉希一侧望去，桥对岸是湿地的雾气与暗绿沼林，脚下是深不见底的峡谷。
absent = ["完整的双桥（旧世只余一桥可走）", "木桥 / 吊桥 / 尖拱桥", "桥头驻军营地、帐篷与旗帜", "任何聚落与房屋", "树林（两侧岩山只有矮灌木）", "高地的金褐草甸（被岩山挡在身后）", "人工光源与营火", "断口正在冒烟或起火", "4.0.3a 后的大桥改动（修复 / 重建）"]

