# 外禁锢法阵 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级图点位 (1715, 1110) m（区图法阵图标约 [52, 51]）落在本场地 (140, 120)（圈心），本图原点 ＝ 世界 (1575, 990)。
# 主路与东侧矮台地按原版区图 4× 裁切量取（与区级 terrain.toml 主路同一段）；避难谷地岩丘台地在场地西缘外（圈心西北约 220 m）。
# 锚点机位：(200, 125)，朝正西。

[meta]
bg = "bg54"
name_zh = "外禁锢法阵"
size_m = [280, 240]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "主路（圈心东南约 70 m）与东侧矮台地岩坎（约 90 m）从原版区图 4× 裁切量取；石柱环直径 24 m、草丘 50 × 46 m、断柱与空坑位置均按世界树画面推定，未实机量取"
grid_m = 50
# 世界树画面：与内法阵同构的石柱环，位置更靠外，石柱表面风化更重、缺了一两根
absent = [
    "火焰、烟与任何人工光源",
    "发光的符文、阵纹与石柱（本座一律不发光）",
    "任何人物、元素生物与动物（默认无人）",
    "焦黑烧斑（那是东部法阵）",
    "倒伏横卧的整根石柱与圈内积水（那是西部法阵）",
    "八根俱全的完好石柱环",
    "穿过法阵的道路与围墙",
    "成片树林（只有一棵偏冠老树与几丛灌木）",
    "近景里的营地帐篷与人（避难谷地另立 bg47，本档只在远景露木栅剪影）",
    "贴近的山体、碎石扇与河谷（这里是谷心开阔草甸）",
    "4.0.3 新增的元素之环",
]

