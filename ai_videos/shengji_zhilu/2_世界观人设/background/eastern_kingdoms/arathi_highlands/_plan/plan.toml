# 阿拉希高地区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 20 件（本区上限）。单件逐轴撑满块的占地与 h_m，所以按「形状」复用、不按用途：
#   长农舍兼两层主屋 / 贴墙小棚 / 废城塌顶石屋；兽皮长屋兼圆顶帐 / 铁匠棚 / 倚岩棚 / 食人魔大棚；
#   原木高台兼瞭望塔 / 栖架 / 晾架 / 拴马横杆 / 木栈道；图腾柱兼头骨桩 / 战旗杆 / 拴马桩 / 门柱 / 孤桅 / 黑桩枯树；
#   火塘兼石井井沿；灌木兼干草垛 / 灯芯草 / 芦苇；巨岩兼碎石堆 / 废石堆 / 礁石 / 海蚀柱；
#   方锥石柱兼石板柱 / 断桩 / 倒柱 / 洞厅原岩柱 / 矮石墩 / 水槽 / 石桌 / 界石；原木兼柴垛 / 骨堆 / 长凳；
#   木板车兼矿车；巨石方塔兼城门楼 / 桥台 / 桥墩 / 古墙残方墩。
# judgment calls：h_m = 0 的块一律走地坪 / 水面（asset 在 h_m = 0 时取 min(size) 当高度）；
#   木栅荒田、畜栏、枯篱方田走 yard（palisade 只沿长轴出一道栅，围不成圈）；2 m 缓草丘走 yard（丘高交给地形）；
#   避难谷地东门在南北向木栅上、gate_wall 只会东西向，改用图腾柱 count 2 当门柱（沿南北散布）；
#   洞厅岔道口（h_m = 0、本档不画）走 plaza 只占位。

