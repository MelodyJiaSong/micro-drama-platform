# 石拳大厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图是洞内：[[ridge]] ＝ 洞厅四周的实心岩体（height_m ＝ 岩体高出厅内地面的量，约等于洞顶厚度的示意）。

[meta]
bg = "bg51"
name_zh = "石拳大厅"
size_m = [60, 90]
px_per_m = 14.0
scale_src = "推定"
scale_note = "世界树无坐标、无尺寸出处；洞厅 60 × 35 m、顶高七八米、六根原岩柱按「食人魔主巢、低矮洞顶、粗大石柱」的原典画面与食人魔身量（约两人高）推定，洞口朝北亦为推定"
# 世界树画面：山体里开凿出的食人魔厅堂，粗大石柱撑着低矮洞顶，地上散着啃剩的大骨与破木桶
absent = [
    "燃着的火把、火盆、火堆与烟（默认态火塘冷灰）",
    "任何发光物（晶石、符文、熔岩）",
    "任何人物、食人魔与动物（默认空巢）",
    "天井、天窗或洞顶透光（唯一光源是北侧洞口）",
    "地下河、水潭",
    "砌筑的墙、门与木构房屋（全是凿岩）",
    "矿车轨道与矿工设施（这里不是矿洞）",
    "旗帜纹章与文字标识",
]

