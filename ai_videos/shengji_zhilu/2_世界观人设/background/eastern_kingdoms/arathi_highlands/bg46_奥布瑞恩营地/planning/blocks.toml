# 奥布瑞恩营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg46"
name_zh = "奥布瑞恩营地"
size_m = [160, 140]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地取 160 × 140 m：营地本身按三顶帐篷一口余烬坑的野营规模推定（约 25 m 见方），外扩到南山脚与坡下草甸边；点位本身也是区级平面图推定的（南山脚、石拳大厅洞口东侧；区图上没有它的图标），无一手尺寸出处"
# 世界树画面：荒坡上的小型盗匪营，两三顶破帆布帐围着一堆余烬，旁边拴着驮马
# 机位（锚点图）：站在 b01 巨岩顶上朝北俯看
absent = [
    "围栏、寨墙与大门（野营没有任何围合）",
    "车路与车辙（只有一条踩踏小径）",
    "燃着的篝火与炊烟（余烬坑是冷灰）",
    "任何人物、驮马与牲口（默认空营）",
    "旗帜、纹章与文字标识",
    "石砌或木构房屋",
    "成片树林（只有刺灌与硬草）",
    "4.0.3a 后营地被移除的空坡（本档是旧世有营地的版本）",
]

