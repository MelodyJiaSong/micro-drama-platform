# 落锤镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg41）世界坐标 (2290, 660)；北界山墙、东南山体与东西主路最后一段按 bg41 terrain.toml 平移（地图量取）。
# 区图 [74, 36] 镇子图标落在本图约 (146, 130)；ref 裁切图上图标外一圈岩坎只朝南开口，环半径约 50 m——西侧岩坎与东侧岩坡按此推定。
# 寨内各建筑、后门土路与战旗、岩台栖架都是推定（旧世原典只给了「尖木桩围栏、兽皮圆顶帐、红色旗幡、飞行点、战场入口在镇后」）。
# 锚点机位：正门外西南车路上 (118, 225)，朝东北偏北。坐标原点在场地左上角，x 向东、y 向南，单位 m。

