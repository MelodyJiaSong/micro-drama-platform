# 世界树画面：东部高地上的兽人聚落，尖木桩围栏内是兽皮圆顶帐与红色旗幡，脚下是赭红色的干裂岩地
absent = [
    "石砌城墙与石屋（寨子全是原木与兽皮）",
    "金褐草甸铺进寨内（寨内与门前是裸露的赭红岩土）",
    "任何火、火把、火盆、灯笼与炊烟（火塘与铁匠炉是冷灰余烬）",
    "栖架上的坐骑与飞行兽（默认态是空的）",
    "训练假人与木桩靶",
    "成片树林",
    "湖泊与溪流",
    "旗面上的徽记与任何文字",
    "任何人物与动物",
    "夜景、雨与雾",
]

