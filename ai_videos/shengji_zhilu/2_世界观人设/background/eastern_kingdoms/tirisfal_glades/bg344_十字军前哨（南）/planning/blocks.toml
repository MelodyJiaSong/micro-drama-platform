# 十字军前哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg344"
name_zh = "十字军前哨"
size_m = [400, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "wiki 无坐标、无裁切图；按区图噩梦谷东口塔形图标与谷北土坎、南下王城大路的相对位置推定（塔到大路约 180 m），帐篷、望台、出水口尺寸无一手出处"
# 世界树画面：幽暗城西侧下水道出口附近一座半塌的石砌哨塔，塔身缺了一角、爬满枯藤，塔下几顶红帆布帐篷与一架望台正对着城门方向。
# 区图：谷北带齿的土坎自西北斜伸向东，坎头即塔形图标；东是南下王城的大路；南是王城高地西坡
# 锚点机位：谷口死水洼边（约 [75, 205]），离坎头约 130 m，朝正东略偏北
absent = [
    "任何人物、马匹与动物（默认空营）",
    "栅栏与寨门（营地四面敞开）",
    "燃着的篝火、火把与任何人工光源（拱口、窗洞全黑）",
    "奔流的河与瀑布（出水口只渗出几乎不流的浑水）",
    "塔南坡的路与台阶（南坡陡，上塔只走北坡与东坡）",
    "飞行坐骑与航线平台",
    "训练假人与靶场",
    "4.0.3a 后改名的塔下新营地与领队",
    "旗面以外的纹章与任何文字标识",
]

