# 加伦鬼屋 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [58, 38] 落在本场地 (130, 190)；裁切图 1 px ≈ 1.06 m（区图 1 px ≈ 4.12 m）。

[meta]
bg = "bg347"
name_zh = "加伦鬼屋"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "裁切图量取：点位东北的木篱荒田图标约 80 × 130 m，西侧山岭坡脚距点位约 25 m，虚线小路在点位以东约 75 m 南北穿过；屋、仓、栏尺寸按人类农舍常识推定"
# 世界树画面：荒废的农舍与畜栏，木料发黑，院中立着稻草人
absent = [
    "燃着的火、炊烟与亮着的窗（默认态窗全黑）",
    "任何人物、幽灵、骷髅与活的牲畜（默认空场）",
    "完好的屋顶（茅草顶东北角塌落）",
    "湖面（在东面疏林后，本场地之外，朝西机位看不到）",
    "石砌围墙与门楼（院子只有木篱与路边木桩）",
    "招牌、旗帜与文字",
    "雪与雨",
]

[[ridge]]
name = "西侧土石山岭（西南—东北走向，岭那侧是磨坊）"
poly = [[0, 0], [70, 0], [95, 80], [105, 160], [100, 230], [80, 300], [0, 300]]
height_m = 70
src = "地图量取"

[[ridge]]
name = "北面上抬坡（接北岸山）"
poly = [[160, 0], [300, 0], [300, 30], [220, 22]]
height_m = 25
src = "推定"

[[road]]
