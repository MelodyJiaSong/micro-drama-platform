# 耳语花园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg358"
name_zh = "耳语花园"
size_m = [300, 320]
px_per_m = 4.5
scale_src = "推定"
scale_note = "坐标 [85, 33] 是区图上修道院图标所在；裁切图 1 px ≈ 1.2 m，修道院图标宽约 180 px 但那是符号尺寸，不是建筑尺寸。园林按「门外对称花园」约 180 × 200 m 推定，修道院正立面 80 m 宽、尖塔 45 m 高亦为推定；北、东两面界山与西侧小道的方位取自裁切图"
# 世界树画面：修道院围墙外的整齐花园与石径，修剪过的树篱在瘟疫天光下显得不合时宜
# 机位：b16 花园南端中轴石径，朝正北。西塔在左、东塔在右。门内台阶平台属 bg354。
absent = [
    "人物、守卫、骑兵、马匹、旗手（属 shot 层）",
    "喷泉、雕像群（门前雕像属 bg354 平台，不在花园）",
    "塌墙、焦痕、墓碑、杂草丛生的荒园（这是全区唯一被照料的园子）",
    "修道院内部四翼（各自的副本）",
    "火盆、火把、灯笼与任何人工光源；亮着的窗",
    "河流、湖泊（海在东北山背后，看不到）",
    "雨、雪、晴天蓝天",
    "4.0.3a 后的任何新布局",
]

