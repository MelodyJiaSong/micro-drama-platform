# 炉灰庄园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref 裁切图 1 px ≈ 1.42 m；区图 [55, 59] 红十字落在本图 (150, 140)。斜放的长方形围院图标（中心、长边方向）
# 与西北侧斜穿的中部主路按裁切图量取（±25 m）；围院图标尺寸是示意，本图把它收成 56 × 44 m。
# 围院内主宅 / 烟囱 / 前院 / 院门 / 菜畦 / 烧死的橡树的具体位置与尺寸都是推定（原典只给了「烧空的宅子、焦黑梁架、半截烟囱、院里家具残骸」）。
# 围院局部轴：u ＝ 顺大路方向（东北偏东，−32°），v ＝ 背离大路（东南）；主宅 −4v、前院 −16v、院门 −22v、菜畦 +12v。
# 锚点机位：院门外西北的大路上 (62, 70)，朝东南平视。坐标原点在场地左上角，x 向东、y 向南，单位 m。

