# Mass Graves · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图不显示地名：整张图都是推定（空地 140×110 m 居中，南面一条土径进出）。

[meta]
bg = "bg352"
name_zh = "Mass Graves"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标（wiki 页无 {{Coords}}，Classic 区页列为 Undisplayed location）；区内落点推定为布瑞尔以北、加伦鬼屋与澈水湖西岸之间的橡木林，待核。空地、坑排、林带尺寸全部推定"
# 世界树画面：林间一片被翻开的乱葬岗，成排的浅坑与歪倒的木牌，土堆上散着骨头和破布，豺狼人在坑边刨土。
absent = [
    "任何人物、盗掘者、亡灵与动物（默认空场）",
    "完整遗体（只有碎骨与破布，平台合规边界）",
    "石碑、墓穴、围墙、教堂与任何石砌建筑（这里是无名乱葬，不是家族墓园）",
    "木牌上的文字",
    "火光、火把、灯笼与篝火",
    "山、湖、海与河流（四周只有树墙）",
    "晴天蓝天、雨、雪",
    "4.0.3a 后的任何改动",
]

