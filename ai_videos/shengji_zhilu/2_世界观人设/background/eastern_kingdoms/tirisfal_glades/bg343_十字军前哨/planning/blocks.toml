# 十字军前哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg343"
name_zh = "十字军前哨"
size_m = [280, 240]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "塔与红十字、丘顶脊线、南坎、西北小道的相对位置按区图裁切量取（裁切约 1 px ≈ 1 m）：塔在红十字东南约 45 m / 45 m；帐篷、木栅、火塘尺寸无一手出处，按三顶帐篷的小营推定"
# 世界树画面：红白十字旗的帆布营帐与木栅，篝火边架着长枪
# 区图：塔形图标在红十字东南、丘南陡坎的坎沿；虚线小道绕丘西北脚北去；坎下（场外）农场围栏与东行大路
# 锚点机位：西栅口外约 40 m 的坡道上（约 [55, 100]），朝东偏南
absent = [
    "任何人物、马匹与动物（默认空营）",
    "燃着的篝火与炊烟（火塘是冷灰余烬）",
    "南面的路与台阶（南坎是 8–10 m 陡坎）",
    "东栅与南栅（只有北、西两面木栅，东南由坎与塔封住）",
    "训练假人与靶场",
    "旗面以外的纹章与任何文字标识",
    "湖面（湖在场地西约 300 m 外，锚点机位朝东拍不入画）",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "孤丘本体（营地所在，北高南陡，南沿是 8–10 m 陡坎）"
