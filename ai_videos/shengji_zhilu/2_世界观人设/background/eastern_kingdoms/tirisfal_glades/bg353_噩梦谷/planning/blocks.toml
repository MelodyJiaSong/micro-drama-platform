# 噩梦谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图 (1700, 1700)；红十字 [48, 67] 落在本图 (283, 146)，就在北坎脚下。
# 北坎取区级 terrain「噩梦谷北岭」南缘，南墙取「西南界山」北缘；坎中段支脊取区图裁切上那道斜伸的短齿线。

[meta]
bg = "bg353"
name_zh = "噩梦谷"
size_m = [560, 320]
px_per_m = 2.8
scale_src = "坐标表"
scale_note = "原点与红十字按 WorldMapArea 坐标换算（区级图 1 px ≈ 4.124 m）；北坎、南墙、支脊的走向取区图裁切量取；泥洼、死树群、墓碑位置无一手出处，全部推定"
# 世界树画面：低洼谷地，遍地沼泽色的软泥与枯藤，雾比别处更厚
absent = [
    "任何人物、亡灵与动物（默认空谷）",
    "道路与任何完整建筑（谷里只有兽径；东口外石塔属另档）",
    "河流与流水（只有不流动的积水泥洼）",
    "火光、磷火、灯笼与任何人工光源",
    "晴天蓝天、雨、雪",
    "绿叶茂盛的活树（谷底的树全是死的）",
    "4.0.3a 后的任何改动",
]

