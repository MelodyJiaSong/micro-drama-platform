# 耳语海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图上这一段是区东北角：北面是海，东端界山直落入海，南面坡上是修道院园林（在本场地以南约 270 m，不入场地）。

[meta]
bg = "bg359"
name_zh = "耳语海岸"
size_m = [480, 320]
px_per_m = 3.0
scale_src = "推定"
scale_note = "世界树无坐标；区级平面图把本档推定在修道院北侧海岸 200 m 一段。按「一段低平砂砾滩 + 东端岩岬 + 背后草坡」取 480×320 m"
# 世界树画面：东北角的砂砾海岸，风从海上来，草被压成一个方向
absent = ["码头与木栈桥", "停泊的船只（只有一具半埋的破船壳）", "渔村、房屋与任何屋顶", "高耸的海崖断壁（那是西边的北部海岸）", "白沙滩与棕榈", "灯塔", "火堆、营地与任何人工光源", "贴地厚雾（被海风撕成碎缕）", "雪与冰", "修道院建筑（在场地以南坡上，不入画）", "4.0.3a 后的新据点", "飞艇与飞行坐骑"]

[[water]]
name = "近岸海面（北面开阔海的边缘）"
path = [[0, 45], [180, 48], [300, 42], [370, 28]]
width_m = 90
depth_m = 6
src = "地图量取"

[[ridge]]
