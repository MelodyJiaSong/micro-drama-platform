# 巴尼尔农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：ref 裁切图 1 px ≈ 1.03 m；区图 [74, 62] 红十字落在本图 (130, 160)。带横栏的长方形围场图标、东行大路、
# 末端打弯的马场支路、北面锯齿状陡坎与西南山脚按裁切图量取（±20 m）。
# 农舍 / 马厩 / 井台 / 草垛 / 老橡树与围场栏门的位置都是推定（原典只给了「完整农舍与围栏，马匹散步」）。
# 锚点机位：马场支路岔口 (190, 292)，朝东北仰看。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg340"
name_zh = "巴尼尔农场"
size_m = [320, 320]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "围场图标、大路、支路、陡坎与山脚按区图裁切量取（1 px ≈ 1.03 m，±20 m）；屋舍尺寸与院内布局推定"
# 世界树画面：东部缓坡上的完整农舍与围栏，马匹散步，是提瑞斯法少见的「还像活人住处」的地方
absent = [
    "塌顶、焦痕、断栏与任何废墟感（本档是全区最完整的人居）",
    "马匹、人物、亡灵与任何动物（默认态马场是空的）",
    "任何火、烛火、灯笼与炊烟（烟囱冷着，窗户是暗的）",
    "墓碑与墓地（本档是区里少见没有坟的地方）",
    "河流与湖泊（只有井台与饮水槽）",
    "成片密林（场内只有农舍东北一棵大老橡树，西缘外是一片稀疏的老橡树林边）",
    "麦田与庄稼（这是马场，不是粮田）",
    "晴天蓝天、雨与雪",
]

[[ridge]]
