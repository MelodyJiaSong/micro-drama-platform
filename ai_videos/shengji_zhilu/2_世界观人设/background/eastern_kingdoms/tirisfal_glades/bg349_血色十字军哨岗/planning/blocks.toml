# 血色十字军哨岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [77, 34] 落在本场地 (130, 150)；裁切图 1 px ≈ 1.08 m（区图 1 px ≈ 4.12 m）。

[meta]
bg = "bg349"
name_zh = "血色十字军哨岗"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "裁切图量取：修道院小道（虚线）在点位以东约 50 m 南北穿过，东侧高岭坡脚距点位约 115 m，南侧山包坡脚约 85 m；塔与帐篷尺寸按原典「石砌方塔 + 两顶帐篷」与人类身量推定"
# 世界树画面：林间一座石砌方塔，塔顶挂血色十字军红旗，塔下扎着两顶帐篷
absent = [
    "燃着的火与炊烟（默认态火坑是冷灰余烬）",
    "任何人物、守卫、战马与坐骑（默认空岗）",
    "修道院本体（在东北坡顶，本场地外，只可能从山口露一抹屋角）",
    "石砌城墙（营地只有西面一小段木栅）",
    "塌顶、熏黑的废墟感（这座塔是新修整过的）",
    "文字标识",
    "雪与雨",
]

