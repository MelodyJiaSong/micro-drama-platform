# 丧钟镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg346"
name_zh = "丧钟镇"
size_m = [400, 360]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "谷的走向、两侧山岭、土路、两个房屋图标与南豁口的相对位置按区图裁切量取（裁切约 1 px ≈ 1 m，场地原点＝裁切 [60, 110]）；教堂、墓地与各木屋的尺寸无一手出处，推定"
# 世界树画面：灰白雾气锁住的小山谷，半塌的木屋与一座石砌小教堂，墓地就在村口，土是翻开的
# 区图：两个房屋图标一西一东夹着土路；土路南到山墙豁口（场外），北到村北口折向东北出谷；旧矿洞在西北山脚（场外）
# 锚点机位：村北口土路上（约 [185, 100]），朝南偏西
absent = [
    "任何人物、亡灵、动物（默认空村）",
    "燃着的火、烛光、磷光与任何人工光源（地穴磷烛属内景 bg）",
    "河与溪（谷里只有车辙积水与墓坑积水）",
    "东西向的出口（谷只有南北两个口）",
    "新掘的湿土（墓坑是早已掘开多时的旧坑，土堆干结发黑）",
    "4.0.3a 后的墓地唤醒场面与村外新营地",
    "旗面图案与任何文字标识",
    "训练假人",
]

