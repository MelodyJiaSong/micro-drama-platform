# 索利丹农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [37, 49] 落在本场地 (250, 170)；裁切图 1 px ≈ 1.08 m（区图 1 px ≈ 4.12 m）。

[meta]
bg = "bg350"
name_zh = "索利丹农场"
size_m = [400, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "裁切图量取：点位西南的方田图标约 150 × 110 m，大路贴田北缘东西向，海湾南岸在点位以北约 150 m，西北哨塔图标距点位约 200 m，点位东南一处圆形图标按饮牲水塘推定；屋、仓尺寸按人类农舍常识推定"
# 世界树画面：西部海边的一组农舍与麦垛，田埂荒了一半
absent = [
    "燃着的火、炊烟与亮着的窗（默认态烟囱冷、窗全黑）",
    "任何人物、农户、十字军与牲口（默认空院）",
    "塌顶熏黑的废弃感（这户还在种地，屋顶补过）",
    "石砌城墙与门楼",
    "旗帜纹章与文字（哨塔上的红旗只是远景一点红）",
    "西面封闭区的湖（在场地之外）",
    "雪与雨",
]

