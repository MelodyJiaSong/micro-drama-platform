# 南墙隘口 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg20_南墙隘口.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg20"
name_zh = "南墙隘口"
size_m = [44, 56]
px_per_m = 14.0
slope_m = 4
scale_src = "原典"
scale_note = """
⚠ **尺度全部取自卡里的原文量**（窄口约 30 m、墙高约 5 m、厚约 2 m、
门净宽约 2.8 m / 净高约 3.5 m / 门洞进深约 2 m），**不是推的**。
场地 44 × 56 m 只是给门外那二三十米的下坡林道留出纵深。
"""

# ── 关墙与两侧山脚 ────────────────────────────────────────────────────
# 卡里的原文量：窄口约三十米宽；墙高约五米、厚约两米；正中一道拱形窄门
# （净宽约二米八、净高约三米五），门洞是一条约两米深的短通道。**门朝南。**
# 门北＝谷内（黄土主路向北缓缓上坡）；门南＝谷外（同一条路向南缓缓下坡，
# 二三十米后没入艾尔文阔叶橡木高林）。

[[block]]
name = "南墙"
id = "b01"
xy = [22, 27]
size = [32, 2.2]
h_m = 5
gate_w = 2.8
kind = "gate_wall"
into_ridge = true
src = "原典方位"
note = "厚重灰石墙东西横跨窄口，**墙体两端直接咬进两侧山脚岩体封死**——所以 into_ridge"

