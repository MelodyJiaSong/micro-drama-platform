# 玉石矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg179"
name_zh = "玉石矿洞"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "只取矿口外景一块 240 m 见方：北半是山脊南坡，南半是口外缓坡到坡下大道；口朝南、位于山脊南麓取自区图裁切（矿口图标在红十字正南），场地内尺寸全为推定"
# 世界树画面：东北山坡上一个窄矿洞口，坑道越深越湿、岩壁渗水发亮，最深处结满灰白蛛网
absent = [
    "任何灯火 / 亮着的提灯 / 火把（洞内洞外都没有人工光源）",
    "封口的闸门 / 铁栅 / 钉死的木板（旧世矿口敞开可进）",
    "帐篷 / 营火 / 矿工营地",
    "湖面与湖岸（湖在东坡外与坡下远处，不入本场地）",
    "北郡山谷的院落与田垄（被山脊挡住，本场地看不到）",
    "训练假人 / 木桩靶",
    "飞行点",
]

