# 图书馆侧厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 室内局部坐标：x 轴 ＝ 阅览长厅纵轴（x 小的一端是通主厅的拱门），y 小的一侧 ＝ 进门左手（两间小室），
# y 大的一侧 ＝ 进门右手（外墙、高窗）。**不代表罗盘方位**（世界树判本厅在主厅北侧，bg2 v3 卡判在东侧，见 md 场景定位）。

[meta]
bg = "bg176"
name_zh = "图书馆侧厅"
size_m = [36, 22]
interior = true
px_per_m = 30.0
grid_m = 5
scale_src = "推定"
scale_note = "室内尺寸无一手出处：阅览长厅约 34×15 m、近半厅两层通高约 7 m、二层书阁下净高约 3.5 m、左手两间小室各约 6×6 m，按乡间修道院体量推定；实机截图到手后校正"
# 世界树画面：修道院北翼的两层图书馆，顶天立地的深色橡木书架塞满羊皮卷，长桌上摊着厚书与铜烛台，高窗的冷白光与烛火的暖黄在室内交错成两套色温
absent = ["对院外开的门（唯一出入口是通主厅的拱门）", "第二道楼梯（上楼只走左起第二间那一道）", "火把 / 壁炉 / 油灯（唯一人工光源是长桌铜烛台）", "彩绘玻璃 / 玫瑰窗", "发光的水晶球 / 魔法光效 / 漂浮的书", "正在燃烧的书（圣典上的是早已冷透的旧烧斑）", "书页上的可读文字"]

