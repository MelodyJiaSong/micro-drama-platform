# 杜克家农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 自造地点，区图上没有它：只按「镇南林丘（区图 y71–73）的南坡脚、去南边两家农场的路上」定方位，体量全是推定。
