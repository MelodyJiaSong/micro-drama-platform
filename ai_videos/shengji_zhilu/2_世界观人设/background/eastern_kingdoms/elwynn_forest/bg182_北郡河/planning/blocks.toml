# 北郡河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg182"
name_zh = "北郡河"
size_m = [300, 600]
px_per_m = 2.5
scale_src = "推定"
scale_note = "取北郡山谷内的整段河道（北壁跌水→南端隘口）约 600 m：河贴谷地东侧南流取自区级 terrain.toml；溪宽 4 m 取世界树画面（三四米宽），区级图上的 25 m 是全区尺度的绘图宽度，不是实宽；院落 / 葡萄园 / 桥的位置按 bg1、bg18 卡的相对方位推定"
# 世界树画面：谷底一条三四米宽的浅溪，水清见底露出卵石，两岸是齐膝湿草与低垂柳枝，水面把午后金光揉成一片晃动的亮斑
absent = [
    "大河 / 急流 / 瀑布式落差（谷底段是清浅缓流，只有北壁源头是跌水）",
    "第二座桥 / 渡船 / 码头（全段只有一座单拱石桥）",
    "石砌护岸 / 堤坝 / 水车 / 磨坊",
    "任何灯火 / 火把 / 营火",
    "燃烧的葡萄园 / 火场 / 浓烟（那是 4.0.3a 后的样子，旧世完好）",
    "谷外的平原 / 远处城市剪影（四面封山，视线出不了谷）",
    "训练假人 / 飞行点",
]

