# 加瑞克的小屋 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg19_加瑞克的小屋.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg19"
name_zh = "加瑞克的小屋"
size_m = [34, 34]
px_per_m = 18.0
slope_m = 1.5
scale_src = "原典"
scale_note = """
⚠ **尺度取自卡里**：空场约十二米见方、小屋约五米见方、北侧土坎高约两米——
三个数都是卡里写死的。场地取 34 × 34 m 只为把四周林缘一并画进来。
"""

# ── 林间空场 ──────────────────────────────────────────────────────────
# 卡里的方位契约：约十二米见方的林间空场；小屋在**正中偏东**、单层约五米见方、人字坡顶、
# **门朝西**正对自西边葡萄园踩出来的土径（空场唯一出入口）；
# 中央偏北＝柴垛与劈柴墩；西南角＝早已冷透的旧火塘；北侧＝高约两米的土坎；
# 东侧贴小屋后墙拴两顶破帐篷；南侧与东侧其余全是林缘树影。

[[block]]
name = "加瑞克的小屋"
id = "b01"
kind = "asset"
asset = "p170"
face = "west"
xy = [20, 17]
size = [5.4, 5.4]
h_m = 4.6
wall_t = 0.2
src = "原典方位"
note = "**门朝西**。竖向木板拼接外墙、人字坡顶、西墙一扇无玻璃方窗。空心建法，`bg19-5 门内` 靠它"

