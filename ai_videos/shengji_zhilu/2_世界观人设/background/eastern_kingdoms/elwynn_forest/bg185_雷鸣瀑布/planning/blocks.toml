# 雷鸣瀑布 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：区图 [25, 55] 周边全是西界山墙山纹；谷底长潭是区图上一道西北—东南走向的灰蓝长条（约 72 × 12 px ≈ 230 × 40 m，1 px ≈ 3.17 m）。
# 谷壁、瀑布、谷底设施的位置按世界树画面推定（区图不画这些）。

[meta]
bg = "bg185"
name_zh = "雷鸣瀑布"
size_m = [400, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "长潭长宽按区图灰蓝长条像素 × 3.17 m/px 量取；谷底宽约 80 m、两壁高约 60 m、设施尺寸为推定"
# 世界树画面：西北山间的窄峡谷，两侧岩壁对称跌下两道瀑布，谷底一栋小屋、一座铁砧、一个火堆与一条拴在木栈边的小船，水雾常驻
absent = [
    "燃着的火 / 火光 / 烟（火塘是冷灰余烬）",
    "桥 / 石砌建筑 / 围墙 / 塔",
    "第二个出入口（西端封死，只有东端谷口）",
    "开阔天空 / 远山全景（谷里只看得见头顶一条天）",
    "农田 / 草坡 / 大路",
    "旗帜 / 帮派标记 / 文字",
    "雨 / 雪 / 夜景",
    "飞行点 / 狮鹫栖木",
]

