# 霍格山 · 俯视布局的几何唯一出处
#
# 改布局 ＝ 改本文件重跑
#   blender -b --factory-startup --python tools/build_scene.py -- "<本 scene 目录>"
# **不手改 PNG、不手改 blocks.md、不拷引擎**（rule 4i ① / rule 4h ③/④）。
#
# 几何回指 `../bg22_霍格山.md` 的「## 锁定描述符」字段 2「空间结构 + 方位」——
# 那是原典方位契约。**方位关系可信、小数坐标一律 ⚠**（w02-V 裁定），所以本表只用方位与步距。
#
# `h_m` ＝ 体块高度（米），`kind` ＝ 用哪套构件建，`face` ＝ 正面朝哪（门与窗开在这一面）。
# **未登记的 kind 直接 raise**；扎进山脊 / 块压块 / 坐在河道上同样在生成时 raise。

[meta]
bg = "bg22"
name_zh = "霍格山"
size_m = [120, 120]
px_per_m = 5.0
slope_m = 2
# 这里**没有**什么 —— 原本躺在注释里，够不着任何读者与负面词生成器（rule 4k）
absent = [
    "山峰",
    "悬崖",
    "岩壁",
    "成林的高草（草只到脚踝到膝盖）",
]
scale_src = "推定"
scale_note = """
⚠ **尺度取自卡里**：相对高度约三十米、底径约一百四十步（折约 105 m）。
场地 120 × 120 m 刚好把丘体与四周林缘装下。
丘走 `[[ridge]]` 的隆起多边形而不是岩壁体块——卡里明写「**不是山峰、没有悬崖、没有岩壁**」。
"""

# ── 一座孤立矮丘 ──────────────────────────────────────────────────────
# 卡里写死的形制：相对高度约三十米、底径约一百四十步；
# **不是山峰、没有悬崖、没有岩壁**——所以丘走 `[[ridge]]` 的隆起多边形，不是岩壁体块。
# 北＝来路（西泉要塞方向，林最密、坡最缓，唯一的建场视角）；
# 西坡最缓，一条踩秃的黄土窄径自北脚斜绕上西坡直抵丘顶（**上山唯一的路**）；
# 南与东坡陡、直接扎进密林。丘顶是一块朝**西南**微倾的灰白裸岩台，约十来步见方。
# 半坡（西侧土径拐弯处）有一片约二十步见方的踩实平缓空地。
# 丘脚北侧与西侧的林隙里散着五六处河爪豺狼人营地。

[[block]]
name = "丘顶裸岩台"
id = "b01"
xy = [60, 58]
size = [13, 11]
h_m = 1.6
layers = 3
kind = "rock_shelf"
into_ridge = true
src = "原典方位"
note = "朝**西南**微倾，边缘有风化断口，浅坑里积着雨水；岩台四周一圈土被踩秃踏光"

