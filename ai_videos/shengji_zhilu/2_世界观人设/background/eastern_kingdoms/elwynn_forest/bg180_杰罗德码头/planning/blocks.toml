# 杰罗德码头 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg180"
name_zh = "杰罗德码头"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "取码头周边 240 × 200 m：屋在河北岸、栈桥在屋东南紧贴岸线，取自区图裁切（小屋 + 栈桥两个图标）；河宽 40 m 取区级 terrain.toml 南界大河；屋与桥的尺寸为推定"
# 世界树画面：纳菲瑞提河岸的小木码头，栈桥、系船桩与堆着的板条箱；河水墨绿、两岸林影把光压得很低
absent = [
    "桥（区图未画，过河点待实机核；本场地视野内没有桥）",
    "港口 / 仓库 / 大船 / 帆船 / 起重吊杆（这里只是一栋小屋一条栈桥）",
    "任何灯火 / 亮着的窗 / 火把 / 营火",
    "旗帜 / 纹章 / 招牌 / 箱子上的标记与文字",
    "海岸线 / 沙滩（这是内陆大河）",
    "训练假人 / 飞行点",
]

[[water]]
