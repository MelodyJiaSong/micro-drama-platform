# 山巅之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：区图 WorldMap-Elwynn_c60.jpg 塔图标约 [86, 78]（1 px ≈ 3.17 m）；大道在塔北约 40 px、大河在塔南约 45 px、东界山脚在塔东约 60 px。

[meta]
bg = "bg183"
name_zh = "山巅之塔"
size_m = [500, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图塔图标与北侧大道、南侧大河、东侧山脚的像素距离 × 3.17 m/px 量取；塔身尺寸（约 8 m 见方、塔顶平台约 18 m 高）为推定"
# 世界树画面：东南高地上的孤立哨塔，石基木顶，塔顶一盆常燃的火；塔下能俯瞰通往赤脊山与暮色森林的岔路
absent = [
    "桥（区图未画过河点，本档不出现任何桥）",
    "民居 / 农舍 / 旅店 / 聚落（孤塔，塔下无人家）",
    "飞行点 / 狮鹫栖木 / 飞行管理员（旧世本区零飞行点）",
    "城墙 / 城堡 / 石砌围墙（只有木桩栅栏小院）",
    "夜景 / 火把阵 / 营火（塔顶火盆是唯一人工光源）",
    "训练假人 / 木桩靶",
    "秋色枯叶 / 雪 / 浓雾（本区是正午偏午后的饱和翠绿）",
    "针叶林（是阔叶橡林）",
]

