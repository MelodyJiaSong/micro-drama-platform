# 明镜湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg181"
name_zh = "明镜湖"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "湖约 150 × 110 m：区级 terrain.toml 的明镜湖宽 110 m 为地图量取，长度按区图裁切的三角形湖面推定；湖北宽东南窄、东南角出水、西北抵山块取自裁切图；果园与小屋区图不标，位置推定"
# 世界树画面：西部林中小湖，水面平到几乎没有波纹，一道细瀑从岩壁跌进湖里，水声是这一带唯一的响动
absent = [
    "风浪 / 白浪 / 急流（除细瀑落点外全湖是静水）",
    "码头 / 栈桥 / 船（湖太小，没有）",
    "任何灯火 / 亮着的窗 / 营火 / 火把",
    "开阔水平线 / 远山全景（湖小，对岸都在眼前）",
    "帐篷 / 强盗营地的旗帜与标记（本档默认态无人无营）",
    "训练假人 / 飞行点",
]

