# 艾尔文森林（elwynn_forest）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 库里已有 p135…a10（闪金镇试点）；本区新立 a11…a34 共 24 件（≤25）。成片的块用单体 + count 散布。
# 判据：贴地地坪 / 墙栅 / 拱桥 / 洞口坑道 / 水潭走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重（白模只锁几何与剪影，blend 里材质会剥掉；出图从不拿白模当参考，rule 4d ①）：
#   白墙木构民居 a08 兼旅店后厨 / 农舍 / 小农舍 / 码头小屋 / 果园小屋 / 葡萄园小屋；两层大宅 a09 兼水晶湖岸民居（与 bg4·b13 同一栋）；
#   敞开马厩 a03 兼锯木棚 / 马栏敞棚 / 酒桶敞棚 / 柴棚；帆布篷货车 a10 兼田头木板车；四臂路牌 a04 兼两臂路牌；
#   橡树 a17 兼全区橡林与对岸暗林剪影；原木工棚 a11 兼峡谷木屋；栈桥 a24 兼溪上木板桥；树墩铁砧 a29 兼磨刀矮木墩；
#   原木垛 a27 兼塔下柴垛；楼梯 a33 兼哨塔外置折梯；拱门洞 a31 兼修道院五道拱门 / 正门；巨石 a21 兼崖脚落石 / 岩脚碎岩。
# judgment calls：
#   bg4 的 face 按库里 asset.toml 注释的试点定稿写（与 size_m 的宽 / 深对得上，逐轴缩放不失真）。
#   室内（bg175–177）：贴墙通长书架 / 兵器架 / 圆盾墙 ＝ 墙的衬里、平直重复，走 shelves；小室 / 耳房走 hall_shell（face 朝厅内开门洞）；
#     长桌 / 长凳走 tables；祭台 altar；挂毯 low_wall 薄板；石旋梯 stair；二层书阁走 guard_post（立柱 + 楼板）。
#   瀑布（bg181·b01、bg182·b02）走 proxy（竖直薄体正是 previz 要的遮挡体）；属别的 bg 的远景块（bg8·b08 镇子、bg174·b05 码头、
#     bg182·b03 修道院院落）走 proxy 只占体积，几何以各自的 bg 为准；bg182·b04 葡萄园坡走 vineyard。
#   湖岛（bg8·b01–b04）、机位缓坡（bg178·b07）、丘顶灰岩露头（bg7·b01）走 rock_shelf（抬高的平顶地块）。
#   h_m = 0 的块一律走地坪（asset 单件 h_m=0 会取 min(size) 当高度）：芦苇浅滩 / 泥滩 / 卵石滩 / 田 / 院 / 树桩空地 → yard，
#     瀑脚白沫区 → pool，冷灰火塘（bg185·b03）→ campfire（h=0 时柴堆退成一圈冷灰，正合默认态）。
#   狗头人草窝铺（bg7·b07/b08，h 0.6）与出洞断轨（bg179·b05，h 0.2）贴地 → yard；出水口垫脚石（bg181·b05）→ boulders。
#   围场 / 猪圈 / 残栏 / 桥头木栅 → palisade；石阶 / 塔脚台基 / 独立烟囱 → low_wall（实心方体）。
#   无顶旧工棚架（bg179·b07，四柱一横杆）→ guard_post（四柱 + 顶框）。
#   bg179·b02 入口坑道 h_m = 0（只示走向）→ tunnel，净高待作者补 h_m。

