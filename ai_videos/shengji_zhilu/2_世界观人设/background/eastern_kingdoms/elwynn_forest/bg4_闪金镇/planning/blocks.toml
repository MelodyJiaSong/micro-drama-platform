# 闪金镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：场地原点 ＝ 区图 [37.37, 60.23]；x% → (x − 37.37) × 31.737 m，y% → (y − 60.23) × 21.165 m（区级 blocks.toml 的 WorldMapArea）。
# 2026-09-30 按 1.12 新卡重排（floorplans-ep02）：骨架取 r5 §1.2（原点＝杜汉 [42.2, 65.8] → 本图 (153.3, 117.9)，相对坐标直接平移）——
#   西北路与东北路在镇北 Y 字汇合 (163, 84) → 主街南行约 60 m → 南端丁字口 (153, 148) 分出西路与东路；
#   镇心只有旅店（东）与铁匠铺（西）两栋 + 丁字口西南角的货车摊。旧稿的十字路口、马厩、石井、三栋民居、东南窄土路全部删除。
# bg5 狮王之傲旅店是本图的局部放大：bg5 (x, y) ＝ 本图 (x − 136, y − 80)；旅店、门廊、信箱、烟囱、酒桶、拴马横木、灯柱、路牌、前院两边同一组数，改一处两边一起改。
# 锚点机位：东北路上、Y 汇合口东北约 18 m、比街面高约 4 m，朝南偏西顺主街看（bg4-c1）。

