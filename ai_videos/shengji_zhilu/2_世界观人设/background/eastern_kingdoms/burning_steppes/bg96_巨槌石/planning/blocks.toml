# 巨槌石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级平面图（bg89）坐标 (1950, 520)：本地 x = 区 x − 1950，本地 y = 区 y − 520。

[meta]
bg = "bg96"
name_zh = "巨槌石"
size_m = [500, 500]
px_per_m = 3.2
scale_src = "推定"
# 2026-09-25 场景总审：删去「东山墙（隔窄沟）」——区级 terrain 的东山墙在本场地东缘外约 50–70 m，中间是南北窄谷 bg98；熔炉位置改 推定（原典只说「丘顶」）；熔岩溪延到丘脚外。
scale_note = "场地取区级平面图 b907（≈2170,754，380 × 360 m）外扩到 500 × 500 m。岩丘轮廓、熔岩溪与东南支路由区级图 terrain.toml 平移换算（地图量取）；熔炉、营棚、骨堆、坡道、台地的位置与尺寸无一手出处——区图两处图标（≈220,230 / ≈112,319）只给出营地大致落在丘顶与西坡，其余按世界树「坡上营棚与骨堆 · 丘顶熔炉」推定"
# 世界树画面：东北角一座顶部平坦的巨大岩丘，坡上散着食人魔的粗木营棚与骨堆，丘顶有一口熔炉
absent = [
    "任何人物、巨人住户与动物（默认空营）",
    "燃着的炉火、营火、火把、灯笼（熔炉与火塘是冷的；暖光只来自熔岩溪与泉眼）",
    "石砌城墙、塔楼、城门（营地只有粗木棚与木桩）",
    "南坡与东坡的上下路（只有西坡一条坡道）",
    "旗帜、图腾上的文字与任何标识",
    "任何水体、草木与绿色",
    "4.0.3a 之后的任何改动",
]

