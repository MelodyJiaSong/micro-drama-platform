# 燃烧平原区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 17 件（额度上限）；成片的块用单体 + count 散布。blend 里材质会剥掉，所以按「形状」复用：
#   长屋兼兵营长屋 / 锻炉棚，高脚木架兼木栖架，石圈火塘兼石砌枯井，兵器架兼剥皮木框 / 补给堆，
#   塌顶石屋残壳兼烧毁民居 / 柱列大厅空壳 / 街屋群，兽骨堆兼炭化木段残骸，竖裂岩柱兼蛇形岩脊段 / 倒伏断柱，
#   图腾柱兼坡道口绑骨粗木柱。
# 全区九个 bg 都「暂无排镜」，所以按去重硬要求激进合并；等排镜真拍到某件、形制又对不上时再另立。
# judgment calls：
#   - 天然岩台 / 半坡台地 / 被凝岩吞没的半城 / 门框粗凿台阶 / 碎岩坎 走 rock_shelf（地形，不是有界物体；层叠岩板也正好读成台阶）；
#   - h_m = 0 的地面标记（岩缝、爪痕沟、烧黑洼地、凝岩主街、门前岩台、风积灰坡）走 plaza；熔岩洼坑 / 泉眼走 pool；
#   - 黑石要塞南寨门走 gate_wall（它是围栏上的门，不是单体建筑）；黑石小径门洞走 cave_mouth（嵌在山体里）；
#   - 鞍部浅碟岩台（蛋壳最密处）用蛋壳资产散布表达——岩台本身是地面，画面里要读的是蛋壳。

