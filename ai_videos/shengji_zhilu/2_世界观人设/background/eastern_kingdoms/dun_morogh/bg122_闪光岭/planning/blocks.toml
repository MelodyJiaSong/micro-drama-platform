# 闪光岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg122"
name_zh = "闪光岭"
size_m = [400, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "岩脊长约 300 m：原版区图 [41, 39] 处涌冰湖出水冻溪北岸那道带营地图标的丘脊（1002 px ≈ 4503 m 换算）；脊宽、脊高与营地内部布局按世界树画面推定"
# 世界树画面：北侧一道结满冰晶的山脊，阳光下岩面泛出细碎反光，脊背上扎着霜鬃巨魔的兽皮帐篷与骨堆
absent = ["石砌房屋与木屋", "点着的火塘 / 火把 / 幽蓝火盆（那是西缘老巢洞里的）", "烟柱", "木笼与洞穴口", "湖面（涌冰湖在场地西南外）", "发光的冰晶 / 法术光效", "人物与动物"]

[[ridge]]
name = "闪光岭脊体（东西走向，南坡满覆冰晶）"
poly = [[40, 150], [70, 125], [150, 112], [260, 110], [340, 118], [372, 138], [345, 165], [250, 172], [140, 172], [70, 168]]
height_m = 35
src = "地图量取"

[[water]]
name = "冻溪（涌冰湖出水，贴南坡脚东流）"
path = [[0, 215], [100, 195], [200, 188], [300, 196], [400, 222]]
width_m = 10
depth_m = 1

[[road]]
