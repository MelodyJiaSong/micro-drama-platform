# 冻土岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg106）米制下的 (2382, 1531)；场地中心 (320, 210) ＝ 坐标 [60, 58]。

[meta]
bg = "bg125"
name_zh = "冻土岭"
size_m = [640, 420]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "主路取自 bg106 terrain.toml（区图 1 px ≈ 4.494 m）；南墙山脚与西北斜坡丘按区图裁切量取（裁切 1 px ≈ 1.06 m，以采掘场标注字宽标定）；雪丘个数、高度与矮松位置按世界树画面推定"
# 世界树画面：一串起伏的雪丘，雪层薄到露出深褐冻土与碎石，稀疏几棵被风压弯的矮松
absent = ["建筑与聚落", "河流、湖面与冻塘", "成片云杉林（林子在路北）", "火堆、炊烟与任何人工光源", "飞行点 / 狮鹫栖架（4.0.3a 才有）", "人物与动物"]

