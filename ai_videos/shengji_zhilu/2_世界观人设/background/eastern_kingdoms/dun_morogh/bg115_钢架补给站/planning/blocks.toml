# 钢架补给站 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 坐标 [50, 49]；区图裁切：主路东段贴场地北沿自西北斜向东南，东南一段短山影线 ＝ 低雪丘，主镇在西约 150 m（场外）。
# 锚点机位：场地西北角路肩约 [30, 40]，离地一人高，朝东南。

[meta]
bg = "bg115"
name_zh = "钢架补给站"
size_m = [200, 160]
px_per_m = 7.0
scale_src = "推定"
scale_note = "营地级机械停放场，按一座敞口大棚 + 一间小工坊 + 停放机械的规模推定；主路与东南雪丘的相对方位取自区图裁切，无一手尺寸出处"
# 世界树画面：卡拉诺斯东边路口的侏儒机械场，铁皮棚下停着几台漏油的蒸汽机械与机械陆行鸟，地上铺着油渍与零件
absent = [
    "任何人物、侏儒、矮人与动物（默认空场）",
    "运转中的机器、锅炉火光、蒸汽与点亮的灯",
    "围墙、大门与石砌房屋群（主镇在场外西侧）",
    "飞行点、狮鹫与飞行器（旧世本区零飞行点）",
    "训练假人（4.0.3a 才进新手区）",
    "招牌、路牌文字与任何字迹",
    "绿草地与阔叶树（只有雪、冻土与矮云杉）",
]

