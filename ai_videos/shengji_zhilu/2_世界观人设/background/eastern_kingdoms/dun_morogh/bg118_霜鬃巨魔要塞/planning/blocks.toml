# 霜鬃巨魔要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标 [28, 52] 落在场地 [200, 180]；区图裁切约 1 px ≈ 1.1 m：洞穴图标在红十字西北约 130 m、紧贴西墙山体东脚，
# 南北车道在东约 120 m，南面一道横山。洞内的火盆与木笼画在山体范围内（洞道向西伸进山里）。
# 锚点机位：洞前东面雪原约 [200, 150]，离地一人高，朝西。

[meta]
bg = "bg118"
name_zh = "霜鬃巨魔要塞"
size_m = [400, 360]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "洞口、车道与南侧横山按区图裁切（约 1.1 m / 裁切像素）量取；三洞口的间距与大小、洞前雪坪范围、雪坡高差 5–6 m 为推定"
# 世界树画面：雪坡下凿开的巨魔洞穴群，洞口插着骨制图腾与兽皮旗，里面燃着幽蓝的火盆与成排的木笼
absent = [
    "任何人物、巨魔、动物与笼中活物（默认空巢，木笼全空）",
    "人类头骨（图腾上只挂兽类头骨与弯角）",
    "旗帜纹章与任何文字标识",
    "洞外的火、篝火、火把与暖色光（旧火塘是冷灰余烬）",
    "寨墙、木栅、大门与房屋（这里只是山脚的洞口）",
    "绿草地、阔叶树与不结冰的水",
    "4.0.3a 后的任何改动",
]

