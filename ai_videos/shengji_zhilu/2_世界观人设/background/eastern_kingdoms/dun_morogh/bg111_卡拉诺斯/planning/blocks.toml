# 卡拉诺斯 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 四路走向取自区级 terrain.toml（主路西段 / 东段、石门坡道、寒脊山小径在镇西北交汇）；镇内房屋落位无一手平面出处，全部推定。

[meta]
bg = "bg111"
name_zh = "卡拉诺斯"
size_m = [240, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "镇区矮墙圈约 150 × 105 m：区图上两枚镇区图标连同路口约 35 px（≈ 160 m），外加镇南雪丘与北路起坡；无一手尺寸出处"
# 世界树画面：大路边一圈石墙围起的矮人小镇，陡坡屋顶压着厚雪，镇心一座露天铁砧与红火炉，旁边就是冒着麦芽热气的酿酒厂
absent = [
    "飞行点、狮鹫栖木与狮鹫（旧世本镇零飞行点，4.0.3a 才加）",
    "任何人物与牲口（空镇底图，人物属 shot 层）",
    "火把、灯笼、烛火、亮着的窗（白天默认态唯一人工光源是锻炉炭床）",
    "招牌文字与可读的牌匾",
    "白石墙与蓝板岩屋顶的城堡式建筑",
    "绿草地与阔叶树（只有云杉与冻土）",
    "河流与水面（冻河在镇北约两百米外，出场地）",
]

