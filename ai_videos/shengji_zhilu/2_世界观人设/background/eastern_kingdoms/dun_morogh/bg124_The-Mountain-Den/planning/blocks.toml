# The Mountain Den · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg106）米制下的 (3774, 1329)；洞内空间是山体底下的 footprint，h_m 为洞顶净高。

[meta]
bg = "bg124"
name_zh = "The Mountain Den"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "wiki 无坐标：洞口按原典「南门哨岗东北山坡」摆在哨所东北约 140 m（同 bg106 区级图 b924）；门径路与东墙山脚取自 bg106 terrain.toml（区图 1 px ≈ 4.494 m）；洞内岩道与圆室尺寸按世界树画面推定"
# 世界树画面：南门哨岗东北山坡上一个不起眼的黑洞口，洞内是一条短短的岩石通道与一间空荡的圆形石室，没有火光、没有任何摆设，只有积雪从洞口漫进来
absent = ["火光 / 火盆 / 火把 / 灯笼 / 发光水晶", "桌凳、床铺、箱笼等任何摆设", "骨头、兽迹与脚印", "人造门、栅栏或凿痕", "第二个出口或岔道", "任何驻扎者（1.12 洞内无 NPC）", "子区域名牌（名字 4.0.3a 才有）"]

