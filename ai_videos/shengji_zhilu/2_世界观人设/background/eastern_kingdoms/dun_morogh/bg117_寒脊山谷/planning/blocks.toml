# 寒脊山谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地只取谷的东半段：坐标 [32, 71] 落在场地 [450, 230]；区图裁切约 1 px ≈ 1.1 m——大屋图标在红十字西北、隧道图标在其东。
# 冻溪按区级 terrain.toml「寒脊冻溪」平移（区级坐标 − (991, 1901)）。
# 锚点机位：隧道口西南外侧略高的坡上约 [540, 222]，离地一人高，朝西。

[meta]
bg = "bg117"
name_zh = "寒脊山谷"
size_m = [700, 480]
px_per_m = 2.2
grid_m = 50
scale_src = "地图量取"
scale_note = "大屋、隧道口与小路按区图裁切（约 1.1 m / 裁切像素）量取，冻溪与北 / 南脊按区级 terrain.toml 平移；谷整体更长，西半段延伸出场地西缘"
# 世界树画面：丹莫罗西南角一处被雪山合围的小盆地，一条冻溪穿过缓坡，坡上散着小木屋与训练假人，雪地被踩成泥灰色的小路
absent = [
    "训练假人（4.0.3 才进新手谷，世界树画面里的这一项不画）",
    "侏儒新工匠镇与任何 4.0.3a 后的新建筑",
    "任何人物、动物与穴居生物（默认空谷）",
    "点亮的灯笼、窗内灯光、火把与可见的火焰（只有烟囱一缕细烟）",
    "第二条出谷的路（唯一出口是东坡脚的穿山隧道）",
    "主盆的主镇、冻湖与车道（都在北脊另一侧）",
    "海岸与海面（西头山墙挡住，不入画）",
    "绿草地与阔叶树",
]

