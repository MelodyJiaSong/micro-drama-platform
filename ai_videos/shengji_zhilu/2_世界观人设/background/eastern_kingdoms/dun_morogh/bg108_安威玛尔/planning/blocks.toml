# 安威玛尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg108"
name_zh = "安威玛尔"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "大屋按新手出生点一栋大厅的体量推定（正面约 48 m）；场地取大屋 + 门前石台 + 屋南约 60 m 的冻溪与锚点机位（溪边，大屋正南）能装下的 240 × 200 m。区图裁切：大屋图标贴北脊脚下，小路自门前向南再分东西两股，东股约 240 m 外是穿山隧道口（出场地东缘），西股通西南角小冻塘（约 340 m 外，出场地）"
# 世界树画面：山谷尽头一座半嵌进岩壁的石砌大屋，门口两盏铁灯笼、屋内一座常烧的火塘，门外雪地上排着一列训练假人
# 「训练假人」按版本红线剔除（4.0.3a 才加）
absent = [
    "训练假人与木桩靶（4.0.3a 才加，旧世没有）",
    "任何人物、动物（默认空场）",
    "点亮的灯笼、窗内灯光、看得见的火苗（火塘在屋里，只见烟囱细烟）",
    "塌陷的隧道口（旧世隧道完好）",
    "侏儒新城镇与机械建筑（4.0.3a 后才分出去）",
    "飞行点与狮鹫栖木",
    "开阔地平线、草地、阔叶树",
    "旗帜纹章与任何文字标识",
]

