# 铁环营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg110"
name_zh = "铁环营地"
size_m = [240, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "院墙 44 × 36 m 按一户人家的独门院推定；场地取院落 + 北面冻湖南岸（院门外约 60 m，锚点机位站在湖岸碎石滩上）+ 南面雪带与山脊脚 + 东侧向北弯来的山脊能装下的 240 × 220 m。区图裁切：湖在点位正北略偏西，南脊贴着点位南面，东面山脊向北合围，东北方留出通两条门径的主路缺口"
# 世界树画面：湖畔一座带矮石墙的独门院落，院里堆着木箱与考古工具，烟囱冒着细白烟
absent = [
    "任何人物、动物（默认空场）",
    "看得见的火苗、窗内灯光、灯笼与火把（只见烟囱细白烟）",
    "第二道院门（院子只有北面一道门）",
    "带文字的石碑、铭文与任何标识（出土残片只刻几何浮雕）",
    "发掘坑、探方与矿道口（那是另一处的挖掘场，本档只是住所兼整理场）",
    "飞行点与狮鹫栖木（旧世本区没有）",
    "化冻的湖面、草地与阔叶树",
    "高墙、塔楼与城堡式建筑（院墙只到齐腰）",
]

