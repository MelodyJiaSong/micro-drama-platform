# 北门哨岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 门径走向（自西南来、向北偏东钻进岩壁夹道）取自区图裁切；塔按坐标点摆路西，墙按区图图标位置横到路东岩脚。

[meta]
bg = "bg113"
name_zh = "北门哨岗"
size_m = [140, 180]
px_per_m = 8.0
scale_src = "推定"
scale_note = "门径口哨所：塔 9 m 见方、横墙约 40 m；场地取 140 × 180 m 装下来路雪坡与夹道前段（区图裁切量得夹道宽约 20–35 m）；无一手尺寸出处"
# 世界树画面：门径口的一座方形石塔加一段矮墙，塔顶挂着铁炉堡的铁砧旗，墙根堆着火药桶
absent = [
    "塔窗灯光、火把、火盆与任何人工光源（白天默认态）",
    "旗帜与桶身上的文字、标记",
    "泥浆路与低岩壁（那是南门小径；本门径背阴、雪厚、路面冻硬）",
    "飞行点与狮鹫",
    "任何人物与牲口（空哨所底图，守卫属 shot 层）",
    "隧道口（门径是露天岩壁夹道）",
]

[[ridge]]
