# 古博拉采掘场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg119"
name_zh = "古博拉采掘场"
size_m = [360, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "坑口约 230 × 140 m：原版区图 1002 px ≈ 4503 m（WorldMapArea 换算，见 bg106），坑的椭圆在区图上约 50 × 30 px；台阶级数与坑深按世界树画面推定"
# 世界树画面：被削成阶梯状的露天石坑，坑壁一层层灰白岩台，坑底停着矿车与木架，深处开着一个黑洞洞的矿道口
absent = ["飞行点 / 狮鹫栖架（4.0.3a 才加）", "房屋与聚落", "河流与湖面（冻湖在场地东外两三百米）", "熔岩与熔炉", "点着的火把 / 矿灯 / 火堆", "冒烟的烟囱", "蒸汽机械", "人物与动物"]

[[ridge]]
