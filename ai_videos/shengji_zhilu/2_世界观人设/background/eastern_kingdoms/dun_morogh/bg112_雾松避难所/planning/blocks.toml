# 雾松避难所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 冻湖湖尖、冻溪入湖、湖东陡坡、南侧小路取自区图裁切（红十字正落在湖尖西缘）；营地内部落位全部推定。

[meta]
bg = "bg112"
name_zh = "雾松避难所"
size_m = [160, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "林中空地约 30 m 见方；场地取 160 m 以装下北侧湖尖、西侧冻溪与南侧小路（区图裁切量得小路在点位以南约 50–60 m）；无一手尺寸出处"
# 世界树画面：雪松林里一小片空地，两顶帐篷围着一堆将熄的篝火，树影间常年吊着一层薄雾
absent = [
    "燃着的篝火、火苗、火星与烟（默认态火塘是冷灰余烬）",
    "房屋与任何石砌建筑（区图东侧山脚的房屋图标世界树未收，不画）",
    "任何人物与动物（空营地底图）",
    "开阔天际线与远景雪原（四面高松合围）",
    "浓雾与风雪（只有树干间一人高以下的薄雾）",
    "阔叶树与绿草地",
]

[[water]]
name = "窄长冻湖湖尖（湖身向北偏东伸出场地）"
path = [[86, 45], [100, 18], [110, 0]]
width_m = 30
depth_m = 4
src = "地图量取"

[[water]]
name = "冻溪（自西流进湖尖）"
path = [[0, 60], [40, 62], [66, 56], [80, 50]]
