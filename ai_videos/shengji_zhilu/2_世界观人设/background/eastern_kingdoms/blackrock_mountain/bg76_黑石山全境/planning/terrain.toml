# 从原版区图（ref/WorldMap-Blackrock.jpg，1002×668 px）量取：山脊 [[ridge]]（poly 多边形）/ 水系 [[water]]（path 折线）/ 道路 [[road]]（path 折线），单位 m。
# 换算见 blocks.toml 头两行：1 px ≈ 0.9126 m（x、y 同系数），原点区图左上角。
# ⚠ 1.12 无独立区图，ref 是东部王国大陆图的一块裁切：图上「地图量取」的是**相对方位与形状**，尺度随 [meta] scale_src=推定 一起挂 ⚠。
# ⚠ 本区没有真正的水：[[water]] 段全部是**熔岩**（名字带「熔岩」），借水系折线把它填成面；图上蓝色＝岩浆。
# ⚠ 两个高度层叠在一张平面上：山脚外溢的熔岩湖 / 流舌与南门在**山外地面层**；大厅、环道、石工场、矿道在**山腹里**，
#   比山脚高出数十米（南门进山后要沿山体一路爬上去）。石工场、矿道与山脚熔岩在平面上重叠是投影，不是坐在熔岩上；
#   山外地面层的构件（南门、两条通道的山外段）必须落在熔岩之间的空地上。大厅内部几何与 bg79 同一份（bg79 (80,80) ↔ 本图 (481,340)）。

