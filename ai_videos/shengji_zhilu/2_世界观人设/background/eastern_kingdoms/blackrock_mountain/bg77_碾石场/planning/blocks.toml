# 碾石场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 布局：东西向单线矿道（y 26.5–33.5，宽 7 m），东口 x=140 接熔岩大厅西南下层岩台（bg79），西端 x≈6 是深渊副本门。
# 矿道之外全是岩体（ridge）；h_m 以矿道地面为 0，地面自东向西缓降约一层楼不另画。

[meta]
bg = "bg77"
name_zh = "碾石场"
size_m = [140, 60]
px_per_m = 10.0
scale_src = "推定"
scale_note = "1.12 无本区独立区图，矿道长宽无一手出处：长度按区级平面图 bg76 的 b902（40 × 10 m 推定框）放大到能装下凹室与两端门洞的 ~130 m，宽 7 m / 高 5 m 按「能过矿车、两人并肩」的常识推定"
# 世界树画面：一条凿穿岩体的矿道，两壁留着粗糙的凿痕，地上铺着碎石与废弃轨道，尽头是黑石深渊的传送门
absent = ["天光与火山口开口（矿道是封闭岩体）", "熔岩与岩浆明渠（光只从东口透入）", "火把灯笼油灯烛火等人工光源", "木梁支架与坑木（顶部无支撑）", "岔路与侧洞（单线矿道）", "水与积水", "任何植被", "新凿的白茬与在用的工具（已废弃）", "人物与动物"]

