# 墓穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg102"
name_zh = "墓穴"
size_m = [160, 120]
px_per_m = 8.0
scale_src = "推定"
scale_note = "本档只拍墓门外：崖脚门洞（约 3 × 5 m）+ 约 20 m 长的下沉引道 + 门前石坪；场地取门前来路与两侧崖脚 160 × 120 m。墓在区图上认不出位置，整块都是推定"
# 世界树画面：崖壁里凿出的墓穴入口，铁栅半开，石阶向下没入黑暗，门楣刻着风化的人形浮雕
# 方位：推定挂在塔下盆地南侧的南山墙北脚（区级 b907 / b908 一带），墓门朝北；待实机核
absent = [
    "任何人物、动物与尸骨",
    "火把、烛火、灯笼、火盆与任何人工光源（门内全黑）",
    "完整可辨的浮雕面孔、铭文与任何文字",
    "完好关闭或崭新的墓门",
    "河、水潭与桥",
    "活的绿叶树与草地",
    "南端黑塔（在机位身后，锚点不拍）",
    "副本传送门与发光门框",
    "4.0.3a 后的任何改动",
]

