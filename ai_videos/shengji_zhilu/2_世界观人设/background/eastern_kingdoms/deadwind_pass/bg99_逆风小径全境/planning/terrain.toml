# 洼地南口开一条窄沟接主峡谷；主峡谷沿河向南到南端的塔下盆地（河在盆地北缘注进塔东的浅潭）；东侧另有一条绕行谷道，
# 被谷心东岭（北段在河与绕行道之间、南段在塔下盆地与绕行道之间）与主峡谷隔开，罪恶谷在绕行道东南段的东侧。
# 2026-09-24 人审重量：绕行道北段原画在岭的西脚、南段穿岭而过，与区图相反，已按区图改为岭在河与路之间；
# 河尾接上塔东浅潭、塔与浅潭之间留出空档；西山墙东缘退到河西道以西；西南山的东北尖伸到河边。
# 三个口：西口通暮色森林（约 27%,38%）、东北口通悲伤沼泽（约 64%,31%）、南面无口（南山墙隔着诅咒之地）。

