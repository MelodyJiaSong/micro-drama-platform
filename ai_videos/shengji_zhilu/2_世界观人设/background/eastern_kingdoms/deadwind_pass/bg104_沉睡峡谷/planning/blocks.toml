# 沉睡峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg104"
name_zh = "沉睡峡谷"
size_m = [360, 420]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区图峡谷河 42–45%,47–57% 一段（区级 b905，按 1 px ≈ 2.28 m 约 90 × 180 m 的河道）外扩到两岸崖脚与岭坡：东西 360 m 装下西崖—河—碎石滩—东岭，南北 420 m 装下上游窄口、静水段与南端崖角；静水面长宽按世界树「几乎不流的河床」推定，无一手尺寸出处"
# 世界树画面：谷中一段异常安静的河床，水几乎不流，两岸枯树倒影一动不动
# 区图：主峡谷中段、河道最宽最直处；河贴西崖、河西道走崖脚窄台；东岸碎石滩接谷心东岭北段；南端河道向东南拐过崖角
absent = [
    "任何人物、动物、水鸟与鱼",
    "桥、船、渡口、水车与码头",
    "任何建筑、营地、帐篷与木构",
    "流水、急滩、瀑布与水面涟漪（静水段）",
    "被风推着走的雾带（本档无风，雾平铺不动）",
    "南端高塔（被崖角挡住，任何机位都看不到）",
    "活的绿叶树、草地、芦苇与水草",
    "火、火堆、烛火、灯笼与任何人工光源",
    "4.0.3a 后的任何改动",
]

