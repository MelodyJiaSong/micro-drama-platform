# 格罗高克营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg101"
name_zh = "格罗高克营地"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "营寨栅墙约 80 × 80 m、四座巨人尺度兽皮棚；场地取罪恶谷袋北端两崖之间（约百来步宽）+ 门外来路 + 营后滚石段，共 200 × 200 m，无一手尺寸出处"
# 世界树画面：罪恶谷里的食人魔营地，歪斜的木栅与兽皮棚，营中一堆常年不灭的火，四周插满削尖的木桩
# 区图：罪恶谷袋北端 59%,61% 的圆顶营寨图标（区级 b902）→ 西邻谷心东岭、东贴东山墙，东绕行道自西北进袋贴西栅南下
absent = [
    "任何人物与动物（空营）",
    "营门门扇、石墙与石屋",
    "瞭望塔、木楼与高架平台",
    "火塘之外的任何火：火把、灯笼、烛火、第二堆营火",
    "旗帜、图腾柱、画有纹章的盾牌与任何文字",
    "河、水潭与井",
    "活的绿叶树与草地",
    "南端黑塔（被东岭挡住，不入画）",
    "4.0.3a 后的任何改动",
]

