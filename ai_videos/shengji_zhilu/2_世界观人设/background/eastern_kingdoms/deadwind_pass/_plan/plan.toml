# 逆风小径（deadwind_pass）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 墙栅 / 洞口坑道 / 水潭走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重：previz 白模只锁几何与剪影（出图从不拿白模当参考，rule 4d ①），剪影同类即共用一件——
#   三座残屋共用 a01（齐肩墙框 / 塌半边都是它按块高压扁）；全区枯树共用 a03；全区落石 / 滚石 / 碎石锥 / 石堆界标 / 河心黑石共用 a04；
#   横卡高处的树干、斜插进水的倒伏树干、劈柴垛共用 a07；营前晾皮架与营门两根门柱共用 a09（两根粗原木柱 + 一道横木）。
# 其余：bg100·b04 孤墙、b06 院墙与 bg102 挡墙走 low_wall；所有木栅 / 尖桩带 / 倒地原木栅 / 锈铁栅走 palisade；
#   bg102·b01 墓门嵌在崖脚走 cave_mouth；bg102·b03 门内石阶 h_m=0，按贴地走 plaza；
#   bg103·b03 两壁上沿错叠段＝沟顶被岩体盖住的一段，走 tunnel（沿南北长轴，净高 = h_m）；
#   bg103·b05 两根锈铁钉在西壁岩体内，走 palisade 占位即可；bg105·b01 是另档 bg101 的占地，走 yard。
# 注：bg103·b01 的 h_m=22 是悬石的离地高度而非石头自身高度，单件逐轴撑满会出一块 22 m 高的石头——blocks.toml 需另加离地字段，本 plan 不改它。

