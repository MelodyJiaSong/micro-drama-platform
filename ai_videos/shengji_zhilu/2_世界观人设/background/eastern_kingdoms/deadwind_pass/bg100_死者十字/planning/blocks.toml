# 死者十字 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg100"
name_zh = "死者十字"
size_m = [200, 160]
px_per_m = 6.0
scale_src = "推定"
scale_note = "四座小民房围一个路口的小村，村心约 60 × 60 m；场地取村子 + 南北两侧坡脚 + 西南机位来路能装下的 200 × 160 m，无一手尺寸出处"
# 世界树画面：谷中一处废弃的人类村落十字路口，石砌房屋只剩墙框，屋顶早塌，路边一座倒地的木制路牌
# 区图：推定为 52%,34% 东北口道旁的无标注小图标（区级 b903）→ 主路西南→东北斜穿，北贴北山陡坡、南邻东山墙西北端的矮岭
absent = [
    "任何人物、动物与尸骨（空村）",
    "完整的屋顶、门窗与烟囱冒烟",
    "燃着的火、壁炉火光、烛火与灯笼",
    "路牌上的任何文字、符号与纹章",
    "活的绿叶树、草地、菜园与农田",
    "河、井、水潭与桥",
    "卫兵、营地与任何新建的木构",
    "4.0.3a 后的任何改动",
]

