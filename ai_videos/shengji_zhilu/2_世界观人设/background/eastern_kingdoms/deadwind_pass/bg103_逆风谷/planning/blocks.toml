# 逆风谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg103"
name_zh = "逆风谷"
size_m = [160, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图量得洼地南口窄沟 43%,32% → 44%,37%，约 100–160 m 长（区级 b904 60×110 m）；场地取整条沟 + 北口死水潭南缘 + 南口谷心路口 160 × 240 m。沟底宽约 1 m 按世界树「只容一人通过」推定"
# 世界树画面：切进岩层的深沟，底部窄到只容一人通过，抬头只能看见一条灰色天缝
# 区级：推定为北端封闭洼地南口窄沟（b904）；区级 terrain 的峡谷河在本段按渗流处理（推定），出南口才汇成河
absent = [
    "任何人物与动物",
    "河面、瀑布与可涉水的溪（沟底只有一掌宽的渗流）",
    "桥、栈道、梯子与绳索（只剩两根锈钉）",
    "火、火把、烛火、灯笼与任何人工光源",
    "直射阳光与蓝天",
    "活的绿叶植被与草地",
    "南端黑塔（被山体完全遮住）",
    "4.0.3a 后的任何改动",
]

