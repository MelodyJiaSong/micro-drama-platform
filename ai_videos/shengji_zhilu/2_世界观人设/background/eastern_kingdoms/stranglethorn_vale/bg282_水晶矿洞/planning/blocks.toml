# 水晶矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标，区图上没有矿洞图标：点位与布局全部按世界树画面（木支架洞门 / 晶簇岩壁 / 轨道 / 翻倒的矿车）推定。
# 洞口朝东南；巷道只画进山的第一段（地下，示意）。

[meta]
bg = "bg282"
name_zh = "水晶矿洞"
size_m = [160, 140]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；洞口宽约 6 m、坡道二十米内降四五米按常识推定，场地取 160 × 140 m 收进洞外坡道、渣堆与坡下林缘"
# 世界树画面：山壁上的矿洞口，木支架撑着洞门，洞内岩壁嵌着泛蓝的晶簇，轨道与翻倒的矿车留在坡上
absent = [
    "点亮的提灯、火把、火盆与烟（默认态唯一光源是日光；提灯是空的）",
    "自己发光的晶体（晶簇只反光）",
    "任何人物与动物（默认空场）",
    "房屋、工棚与营地帐篷（场地里只有洞门、轨道、渣堆与备用圆木）",
    "河流、湖与海面（洞外只看得到林坡）",
    "正在下的雨（地上的积水是雨后旧水）",
    "文字、招牌与旗帜",
    "4.0.3 拆分后的独立海角地图布局",
]

