# 巴里亚曼废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图废墟图标 [42.4, 35.6] 落在本场地 (130, 120)；区图 1 px ≈ 5.8 m：南北大道在图标以西约 17–20 px（≈100 m），
# 本场地把大道收在西缘；东部山纹在图标以东 55 px 外，本场地只收进它最西的林覆山脚。

[meta]
bg = "bg280"
name_zh = "巴里亚曼废墟"
size_m = [240, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图只有一个废墟图标；五座屋基按『小片石屋遗址』推定每座 10–14 m，空地约 130 × 130 m，场地放宽到 240 × 220 以收进西缘大道与东缘山脚"
# 世界树画面：林间小片巨魔石屋遗迹，苔绿的方石基座与歪斜的图腾，地面积水映出树影
absent = [
    "任何屋顶、茅棚与完整建筑（屋基全部无顶）",
    "祭台、神像与阶梯金字塔（本档是住屋遗址，只有一座三级小方台）",
    "燃着的灶火、火把与烟（灶台是冷灰）",
    "任何人物与动物（默认空场）",
    "正在下的雨（地上是雨后积水）",
    "河与湖（河在西面约 400 m 外，场地里看不到）",
    "文字、旗帜与纹章",
    "4.0.3 拆分后的北荆棘谷新布局",
]

