# 莫什奥格食人魔山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg287"
name_zh = "莫什奥格食人魔山"
size_m = [400, 340]
px_per_m = 3.5
scale_src = "推定"
scale_note = "区级平面图 b902 量得土丘图标约 300 × 260 m（地图量取）；本图取土丘 + 背后山墙 + 西侧雨林边缘的锚点机位能装下的 400 × 340 m，丘内布局无一手尺寸出处"
# 世界树画面：林中隆起的土石丘，巨大的粗木栅与兽骨堆，洞口熏黑，食人魔的破布帐篷歪在坡上
# 区图：洞口图标开在东部山墙西脚的凹口里 → 山墙占场地东侧，南北两道山嘴包出口朝西的山坳
grid_m = 50
absent = [
    "任何人物、食人魔与动物（默认空营）",
    "燃着的火与炊烟（火塘是冷灰余烬，洞内漆黑不透光）",
    "石造建筑、石墙与城门（只有原木栅与破布帐篷）",
    "旗帜、纹章与任何文字标识",
    "河流、湖泊与水面（丘上只有脚窝里的积水）",
    "东、北、南三面的出路（东面是山墙，只有西面一条土路）",
    "4.0.3a 后的任何改动",
]

