# 反抗军营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg289"
name_zh = "反抗军营地"
size_m = [240, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图无图标；区级平面图 b906 按「雨林北口路边」推定 200 × 160 m。营地是五顶帐一堆火的小营，土台按 90 × 70 m 推定，场地再装下北面峡口、大道与东南大道上的锚点机位"
# 世界树画面：雨林北口路边的简陋帆布军帐群，木栅与火堆，士兵在泥地上擦拭刀剑，背后是通往暮色森林的峡口
absent = [
    "任何人物、士兵与马匹（默认空营）",
    "燃着的火堆与炊烟（火堆是冷灰余烬）",
    "木塔、吊桥、大门与高栅（那是东南方叛军营寨的形制）",
    "石墙、石屋与旅店",
    "旗帜、纹章与任何文字标识",
    "飞行点与狮鹫栖架（旧世这里没有）",
    "4.0.3a 后的任何改动",
]

