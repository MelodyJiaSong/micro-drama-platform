# 血帆营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图约 [27, 69]（目测、待核）：海角西岸，西侧近岸岛南端与窄水道出口在西北。海在西（x < 70 为水），林坡在东。
# 营内布局无一手出处，按世界树画面（破帆棚 / 插刀 / 骷髅旗 / 火堆边翻倒的酒桶）推定。

[meta]
bg = "bg281"
name_zh = "血帆营地"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图只有海岸线，无营地图标与一手尺寸；按『一百多米长的小海湾、三座棚一间屋』推定场地 240 × 200 m"
# 世界树画面：海滩上的海盗营，破帆搭成的棚子，沙地上插着弯刀与骷髅旗，火堆边翻着的酒桶
absent = [
    "燃着的火堆、火把、灯笼与烟（默认态火塘是冷灰余烬）",
    "任何人物与动物（默认空场）",
    "停泊的大帆船与码头建筑（只有一条窄木栈桥和两条小划艇）",
    "尖木寨墙与塔楼（只有半圈浮木矮栅）",
    "南端崖缝海港（被南侧岬角与林坡挡住，营地里看不到）",
    "旗面上的文字与纹章（骷髅旗只有粗笔骷髅与交叉骨）",
    "正在下的雨与暴风浪",
    "4.0.3 拆分后的独立海角地图布局",
]

