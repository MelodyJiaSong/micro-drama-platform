# 阿博拉兹废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg290"
name_zh = "阿博拉兹废墟"
size_m = [260, 220]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区级平面图 b907 按图标推定 200 × 160 m；区图上废墟图标坐在东岸一个朝东南凸出的小岬角上、背靠沿海山岭南脚。本图取岬角 + 背后山脚机位 + 岬外礁群能装下的 260 × 220 m，石台尺寸无一手出处"
# 世界树画面：南部海边的巨魔废墟，断墙一半泡在浅水里，石阶上覆着白色盐霜与海藻
# 区图：海岸线自东北向西南斜贯，岬角朝东南凸出 → 海占场地东南半，山岭占西北角
absent = [
    "任何人物、巨魔、海鸟与鱼群",
    "燃着的火盆、火把与炊烟（废墟里没有任何火）",
    "帐篷、营地、栈桥与船只",
    "旗帜、纹章与任何文字",
    "河流与淡水（只有海）",
    "被海啸冲毁的海岸（旧世海岸完好）",
    "4.0.3a 后的任何改动（含把这里划成独立「海角」地图的分界）",
]

