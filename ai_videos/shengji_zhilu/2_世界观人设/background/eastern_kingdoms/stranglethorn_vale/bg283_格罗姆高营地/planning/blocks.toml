# 格罗姆高营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg283"
name_zh = "格罗姆高营地"
size_m = [260, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级平面图 b901 给营地 240 × 220 m 的范围框（区图约 32%,28%，1 px ≈ 5.8 m）；寨墙椭圆 180 × 180 m 与内部布局无一手尺寸，按世界树画面与 wiki 设施清单（飞艇塔 / 塔下旅店 / 飞行点 / 铁匠铺）推定。西侧海、东北湖西岔路的方位取区图"
# 世界树画面：雨林里削尖圆木围成的兽人前哨，兽皮帐篷与图腾柱，营地正中一座高耸的木制飞艇塔，红色部落旗在湿风里垂着
absent = [
    "任何人物、守卫、商贩与坐骑（默认空营）",
    "停靠的飞艇与栖落的飞兽（属 shot 层）",
    "旗帜上的纹章与任何文字标识",
    "亮着的火、火把、灯笼（火塘冷灰、熔炉冷黑）",
    "西面与北面的门（只有东门）",
    "码头、栈桥与船（营地面海但没有港）",
    "石砌城墙与砖瓦房（全营只有圆木与兽皮）",
    "4.0.3a 后的任何改动",
]

