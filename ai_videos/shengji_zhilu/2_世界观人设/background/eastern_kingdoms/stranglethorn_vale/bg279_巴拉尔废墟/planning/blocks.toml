# 巴拉尔废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图废墟图标 [29.6, 19.5] 落在本场地祭台中心 (120, 95)；区图 1 px ≈ 5.8 m：北侧山纹线约在图标以北 30–45 px 外、
# 礁湾北岸在西南约 25 px（≈150 m）——本场地只收得下山纹的南缘与岸线一角。

[meta]
bg = "bg279"
name_zh = "巴拉尔废墟"
size_m = [220, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图只有一个废墟图标，无一手尺寸；石台直径按『小型祭址、六柱一圈』推定约 26 m，场地取 220 m 以收进北侧石脊南缘与西南岸线一角"
# 世界树画面：密林深处的小型巨魔祭址，环形石台中央立着断裂的蛇神石像，四周藤蔓垂落
absent = [
    "任何屋子、茅屋与屋顶（本档是祭台，不是村落）",
    "燃着的火盆、火把与烟（默认态火盆是冷透的旧灰）",
    "任何人物与动物（默认空场）",
    "正在下的雨（地上的水坑是积水）",
    "海面（礁湾在西南约 150 m 外，祭台上被树挡住看不到）",
    "营地圆木寨墙（在东南三四百米外，林中看不到）",
    "文字、旗帜与纹章",
    "4.0.3 拆分后的北荆棘谷新布局",
]

