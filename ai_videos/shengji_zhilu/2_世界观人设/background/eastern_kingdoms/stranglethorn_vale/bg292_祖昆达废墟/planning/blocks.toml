# 祖昆达废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图废墟图标 [24.7, 11.5]（区级坐标 ≈ 1444, 448 m）落在本场地 (420, 125)；本场地 ＝ 区级坐标 − (1024, 323)。
# 北缘界山西段、西北海岸矮丘、西南海面三条都从 bg278 的 terrain.toml 平移过来（地图量取，区图 1 px ≈ 5.8 m）。
# 城内布局（金字塔 / 广场 / 柱廊 / 石屋）区图上看不出，一律推定；金字塔略向西北挪到台地中线以避开矮丘北缘。

[meta]
bg = "bg292"
name_zh = "祖昆达废墟"
size_m = [560, 340]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区图只有一个废墟图标；地形按区图量取（±30 m），城内尺寸按『四层阶梯金字塔 + 前广场 + 三间石屋』的小废城推定"
# 世界树画面：海岸边的巨魔废城，倒塌的石阶金字塔与蛇头石雕，藤蔓爬满断柱，火盆仍燃着绿焰
absent = [
    "任何人物与动物（城是空的，默认态无人驻守）",
    "帐篷、新搭的棚子、晾架与营火（城里没有任何在用的营地设施）",
    "塔顶那一盆以外的任何火、火把、灯笼与烟（台阶脚两只火盆是冷灰）",
    "地面站位看得见的海（海在西南约 350 m 外，被矮丘与山脚挡住）",
    "完整的屋顶与木构（石屋全部无顶）",
    "正在下的雨（广场上的水是积水）",
    "文字、旗帜与纹章",
    "4.0.3 拆分后的北荆棘谷新布局与后加的营地",
]

