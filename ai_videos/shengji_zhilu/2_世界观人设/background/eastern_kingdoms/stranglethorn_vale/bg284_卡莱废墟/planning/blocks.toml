# 卡莱废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg284"
name_zh = "卡莱废墟"
size_m = [220, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "遗址 150 × 130 m 无一手尺寸；点位按 wiki 的北荆棘谷坐标 [43, 41] 经格罗姆高 / 祖尔格拉布两点线性换算为旧世区图约 [35, 22]，落在区级平面图湖西岔路西侧、格罗姆高营地北东北约 300 m。三级台地、朝西坡向与中轴石阶按世界树画面推定"
# 世界树画面：雨林坡地上的巨魔石屋群，屋顶塌陷露出焦黑梁木，石阶被树根撑裂
absent = [
    "积水、泡水、半没在水里的石屋（4.0.3 改海岸线之后才有；1.12 是干坡）",
    "海面与飞艇塔（被坡与树冠挡住，望不见）",
    "完整的屋顶（全部塌落，只剩焦黑断梁）",
    "围墙与大门（遗址四面敞开）",
    "亮着的火盆、火把与任何人工光源",
    "任何人物、野兽与祭品",
    "4.0.3a 后的任何改动",
]

