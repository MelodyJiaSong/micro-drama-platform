# 库尔森的营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg285"
name_zh = "库尔森的营地"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "营寨 175 × 160 m 无一手尺寸；点位按 wiki 的北荆棘谷坐标 [58, 20] 线性换算为旧世区图约 [44, 9]，落在区级平面图北口大道以东约 250 m、北缘界山东段南脚与东部大山墙之间的山坳。设施（锯木棚 / 兽笼 / 储藏室坑道）取 wiki，布局推定"
# 世界树画面：密林中被高木栅围死的叛军营寨，木塔与吊桥，营内火把通明，地上散着乱丢的补给箱
absent = [
    "任何人物、叛军士兵与驯养的猛兽（默认空营）",
    "东、南、北三面的门（只有西门）",
    "篝火、火盆、灯笼、窗内灯光（唯一人工光源是栅墙与门塔上的一圈火把）",
    "坑道内景（储藏室另立 bg）",
    "旗帜纹章与任何文字标识",
    "石墙与砖房（全营只有圆木、木板与帆布）",
    "4.0.3a 后的任何改动",
]

