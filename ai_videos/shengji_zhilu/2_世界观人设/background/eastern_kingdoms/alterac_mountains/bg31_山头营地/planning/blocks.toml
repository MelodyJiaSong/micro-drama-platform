# 山头营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg31"
name_zh = "山头营地"
size_m = [200, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "台地舌北端一段取 200 × 280 m：区图上中间那条台地舌宽约 60–80 px（≈150–200 m）；营地本身按三顶帐篷一口火塘的宿营规模推定，无一手尺寸出处"
# 世界树画面：南端伸进湖里的岬角，扎着辛迪加的帐篷与篝火
# 区图：坐标 [40, 85] 周围无水面（湖在西北，隔湖东岸山脊）→「岬角」取台地舌伸向低地之形，不画湖（见 md 场景定位）
# 区图：红十字正北约 80 m、雪山脚下有一个小图标 → 营地块摆在场地北部
absent = [
    "湖面与湖岸（世界树写「伸进湖里」，区图此处无水，judgment call 不画）",
    "任何人物与坐骑（默认空营）",
    "燃着的篝火与炊烟（火塘是冷余烬）",
    "木栅寨墙与城门（只是宿营地，没有围墙）",
    "旗帜纹章与文字标识",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

