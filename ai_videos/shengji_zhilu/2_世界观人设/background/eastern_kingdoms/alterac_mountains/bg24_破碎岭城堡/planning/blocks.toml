# 破碎岭城堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [47, 42] 落在本场地 (200, 150)；区图 1 px ≈ 2.555 m。

[meta]
bg = "bg24"
name_zh = "破碎岭城堡"
size_m = [360, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：点位西 ~57 px 方形塔图标（≈146 m）、北 ~49 px 与东南 ~25 px 两个营地图标，营寨据此摊成约 150 × 200 m；帐篷 / 柴堆尺寸按食人魔身量（约两人高）推定"
# 世界树画面：雪坡上的食人魔营地，粗木栅栏、兽皮帐篷与巨大的柴堆火
absent = [
    "燃着的柴堆火与炊烟（默认态柴堆未点，火坑是冷灰）",
    "任何人物、食人魔与坐骑（默认空营）",
    "石砌城墙与城楼（营寨全是木栅，名字里的「城堡」指山头）",
    "湖面（湖在西面，被山挡住，本场地任何机位都看不到）",
    "旗帜纹章与文字标识",
    "成片树林（只有栅桩与柴堆用的伐下松木）",
    "4.0.3a 后并入希尔斯布莱德丘陵的新布局",
]

