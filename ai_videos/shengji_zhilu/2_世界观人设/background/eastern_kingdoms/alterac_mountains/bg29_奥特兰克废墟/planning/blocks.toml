# 奥特兰克废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 城背靠西、北山坡、东敞雪原取自区图裁切（地图量取）；城门朝东来自区级平面图「废墟山道」（推定）的来向；城内落位全部推定。

[meta]
bg = "bg29"
name_zh = "奥特兰克废墟"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级平面图覆盖块 180 × 180 m 为城区本体，本图加上背后山坡与门外雪坡取 260 × 220 m；无一手尺寸出处"
# 世界树画面：雪中的石城废墟：还立着的宫殿主体、塌掉的教堂与议事厅、一道高大城门与两处墓地，散落着投石机残骸
absent = [
    "任何人物（占城的食人魔与城外强盗属 shot 层，不进底图）",
    "火堆、火把、窗内灯火、炊烟（默认态全冷）",
    "完整的门扇与完整城墙（城门空洞，城墙只剩残段）",
    "可读的碑文、匾额与纹章（碑面雪填平，纹章被凿花）",
    "湖面与紫色穹顶（被西面山群挡住，从城里看不见）",
    "新修的木构、帐篷与营地设施",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

