# 屠杀谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg38"
name_zh = "屠杀谷"
size_m = [300, 255]
px_per_m = 5.0
scale_src = "推定"
scale_note = "世界树无坐标；wiki 只说紧邻破碎岭城堡。推定中心约 [47, 25.5]（区 m ≈ 1203, 436）：营寨（bg24，[47, 42]）北栅外那道山（区级 terrain「中央雪山·北脊」西端与「高地内小山群」之间）上切进去的一道凹口，谷口距营寨北栅约 30 m；北墙顶止于高地（bg40）西臂窄谷南沿，不与两边的场地相叠。谷底约 100 × 210 m、岩壁高度与棚帐尺寸按食人魔身量（约两人高）推定"
# 世界树画面：夹在岩壁间的凹谷，地上尽是骨头与血迹，帐篷边插着战利品杆
# 南口外下坡的营寨（bg24）在场地之外，只写在 md
absent = [
    "木栅、寨门、巨型柴堆（那是南面营寨 bg24 的东西，本谷两壁就是墙）",
    "燃着的火、火堆、炊烟、任何人工光源（谷里没有烧过的痕迹）",
    "新鲜的、流淌的红血（只有多年冻透的暗褐旧渍）",
    "人物、坐骑、动物（木笼是空的）",
    "湖、河与任何远景地平线（三面岩壁封死，朝北只有后壁与窄天）",
    "第二个出入口（只有南口）",
    "正在下的雪、夜景",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

