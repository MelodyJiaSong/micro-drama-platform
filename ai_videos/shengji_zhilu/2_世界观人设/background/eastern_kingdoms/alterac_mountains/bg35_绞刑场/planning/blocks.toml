# 绞刑场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg35"
name_zh = "绞刑场"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [50, 57]；三岔路、路东褐岩山体、西南碎岩小丘与西北低岭按区图裁切量取（区图 2.555 m/px，裁切放大 3 倍，约 0.85 m/裁切像素）；绞刑架取红十字西侧建筑图标；山高与小件为推定"
# 世界树画面：山路岔口立着一座绞刑架，横木上吊着空绳圈，雪地被踩乱
# 区图：南口大道沿西侧雪原与东侧褐色山体的交界线北上，在红十字处分出西北岔与东北岔
# 锚点机位：南来大道正中（约 [195, 240]）朝正北平视略仰，绞刑架在画面中线偏左
absent = [
    "任何房屋、营地、帐篷与围栏（只有一座废弃绞刑架与一根指路桩）",
    "绳圈里吊着的任何东西（三只绳圈永远是空的）",
    "指路桩上的木板与任何文字（木板早已脱落）",
    "火与任何人工光源",
    "森林（只有路东坡脚几丛矮刺灌木）",
    "湖与河（本点位看不到）",
    "降雪与夜景",
    "任何人物、坐骑、动物与车队",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

