# 雾气湖岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg37"
name_zh = "雾气湖岸"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [31, 41]（区 m ≈ 794, 700）。区图 2.555 m/px：裁切图上湖水线到山脚的绿色岸带宽约 50–55 px ≈ 130–140 m，岸线东北—西南走向；湖中小岛：点位西北偏西约 80 px 与正西约 120 px 各一座（图上取正西那座、距离压进场地，推定）。卵石滩 / 草带分宽、枯苇、漂流木、破桶等为推定"
# 世界树画面：洛丹米尔湖北岸，水汽成团贴着湖面，岸边是灰石与枯苇（区图上点位在湖东岸，按区图写）
# 湖对岸的灰蓝山影、东南山脊背后的旧都废墟都在场地之外，只写在 md，不画
absent = [
    "任何建筑、码头、栈桥、小船、围栏、营地",
    "人物、坐骑、动物、水鸟",
    "火、炊烟、灯笼等任何人工光源",
    "成片树林（只有山坡上零星歪脖矮松）",
    "宽路与车辙（只有一条时断时续的踩出小径）",
    "湖面结冰封冻（只有水线处一圈薄冰壳）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

[[water]]
