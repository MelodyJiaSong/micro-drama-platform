# 奥特兰克山脉（alterac_mountains）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 墙栅 / 洞口 / 水洼走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库（Rodin GLB）。
# 新立 20 件（本区上限）。previz 白模只锁几何与剪影、材质会剥掉（rule 4d ①），所以按「剪影」复用：
#   a01 石基木架民居 兼 镇政厅 / 铁匠石屋 / 谷仓 / 收容所三排长条兵营屋 / 铁匠敞棚（都是双坡屋，靠块尺寸拉伸）；
#   a04 塌顶石墙残屋 兼 议事厅 / 三面墙教堂 / 宫殿侧翼 / 罩内方厅 / 旧方石塔残身；
#   a06 双塔拱门城门 兼 旧都东门与穹顶城南门（bg25·b09 与 bg27·b04 是同一道门）；
#   a07 四柱木瞭望塔 兼 空木笼（四柱框）/ 叉桩铁锅架 / 营门冷火盆架（四腿支架剪影）；
#   a08 兽皮大帐 兼 食人魔窝棚与强盗拼布帐（帐篷剪影同类）；a09 石圈火塘 兼 两口石井（石圈拉高＝井栏）；
#   a10 旧木桩 兼 拴马桩 / 指路桩 / 训练木桩群 / 三脚架草靶一排（count 散布的小竖件）；
#   a11 战利品杆 兼 谷口两根旗杆（横木挂垂物的高杆）；a12 木绞刑架 兼 屠案北侧空钩晾架（双柱横梁）；
#   a16 旗形歪松 兼 零星歪松与农场两棵枯树；a18 贴地灌丛 兼 刺柏 / 矮灌带 / 枯苇丛；
#   a19 花岗岩漂石 兼 屠案巨石 / 机位落石 / 平顶石；a20 碎石堆 兼 岩屑锥 / 碎石扇 / 落石堆 / 石堆路标 / 骨堆 / 柴堆 / 货箱木桶堆（锥形堆体）。
# judgment calls：
#   bg25·b01 与 bg27·b01–b03 是穹顶光膜（半透明光效，不是实体），走 proxy 只占体积（暮色森林 bg140·b02 光门同例）；
#   bg32·b02 洞内冷光幕、bg33·b07 冻细瀑 同为竖直薄板，走 proxy（赤脊山瀑布水帘同例）；
#   bg37·b02 湖中低岛、bg39·b01 岬角平顶岩舌 走 rock_shelf（水平层状低岩台）；
#   残雪区 / 旧血渍 / 草沟 / 冲沟 / 冻裂岩板 / 卵石滩 / 冷烧斑 / 圆形空地 走 plaza，田埂格 / 训练场 / 荒菜园 走 yard，结冰雪水洼 走 pool；
#   民居齐膝石基圈 / 石棚残基 / 宫前石阶 / 城墙残段 走 low_wall（实心矮体量，与暮色森林「石阶台走 low_wall」同例）；
#   畜栏 / 关押围栏 / 半埋拒马 / 界石歪栅 / 朽木栅残桩列 走 palisade；原木小桥 走 arch_bridge。

