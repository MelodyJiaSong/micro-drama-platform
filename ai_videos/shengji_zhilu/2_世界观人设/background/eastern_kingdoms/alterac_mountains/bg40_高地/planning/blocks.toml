# 高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 640 × 640 m，中心 ＝ 坐标 [58, 26]（区 m ≈ 1485, 444），原点 ＝ 区 m (1165, 124)。
# 四道山脊从区级 bg23 terrain.toml 平移 (-1165, -124) 后裁到场地内；田埂 / 石垄 / 歪松 / 巨石 / 石棚 / 农道全是推定。
# 场地外：西 ≈ 90 m 是雪埋农场（bg26，区 m 1075, 290），被西南小山挡住；东南出口外 ≈ 0–20 m 是山间小镇（bg30）。

[meta]
bg = "bg40"
name_zh = "高地"
size_m = [640, 640]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切上本点位是一条西北—东南走向的宽谷，夹在东北山群与西南小山之间；四道山脊按区级 terrain.toml（2.555 m/px 量取）平移裁切，谷宽约 90–250 m。场地内的田埂格、石垄、歪松、巨石、石棚残基与旧农道为推定"
# 世界树画面：山脉北部的开阔缓坡，积雪薄，残存着一格一格的旧田埂
absent = [
    "任何完好的建筑、农舍、谷仓（场地内只有一圈塌落石棚残基；雪埋农舍在场地外西侧，属 bg26）",
    "有人耕作的田、庄稼、新翻的土",
    "人物、坐骑、牲畜、动物、脚印",
    "燃着的火、炊烟、任何人工光源",
    "河流、湖面（只有几汪结冰的雪水洼）",
    "成片树林（只有拐弯处三棵歪松）",
    "路牌、界碑上的文字",
    "降雪、暴风雪、厚积雪（默认薄雪晴天）",
    "4.0.3a 后并入希尔斯布莱德的新布局",
]

