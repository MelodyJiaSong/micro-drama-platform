# 黑水沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg405"
name_zh = "黑水沼泽"
size_m = [500, 500]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [20, 50]（区 m ≈ 756, 1260），场地原点 ＝ 区 m (506, 1010)。主干道、三角洲南汊、港东内湾、南界山墙边线由区级 terrain.toml 平移而来；沼内支汊走向按区图裁切量取。积水块、枯树丛、泥埂、倒木的位置与大小为推定"
# 世界树画面：水色发墨的一片深沼，水面浮着油亮的黑膜，枯树根盘出水面，几乎没有光进得去
absent = [
    "任何建筑、栈桥、小船、营地与围栏",
    "穿过沼心的路（泥路只在西北边缘外）",
    "开阔明亮的水面与蓝天倒影（积水墨黑、被枯树与泥埂切碎）",
    "有叶子的树冠与鲜绿植被（树全是枯死的）",
    "穿透树冠的光束、光斑、发光植物与发光水面",
    "火、烛火、灯笼等任何人工光源",
    "人物、鳄鱼、水蛇、飞虫与水鸟（默认空沼）",
    "港镇四塔（在西南偏西，朝东南的本档机位看不到）",
]

