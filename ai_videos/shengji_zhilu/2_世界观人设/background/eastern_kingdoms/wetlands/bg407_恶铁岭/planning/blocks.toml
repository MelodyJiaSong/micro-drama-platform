# 恶铁岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg407"
name_zh = "恶铁岭"
size_m = [440, 340]
px_per_m = 3.5
scale_src = "推定"
scale_note = "区图点位 [63, 36] 放在场地 (170, 170)；区图矿道口图标在点位以东约 200 m、偏北约 25 m（按区图 3.774 m/px 量取）→ 场地东西取 440 m 装下坡脚到矿道口；台地、炉、棚的尺寸按一处小型采矿冶炼点推定，无一手尺寸出处"
# 世界树画面：东北一座裸岩小丘，坡上支着黑铁矮人的铁棚与熔炉，炉口喷着暗红火，坡面被熏得焦黑
# 区图：点位落在湿草甸与东北山区交界的坡脚 → 山区占场地东北，低地朝西南敞开
absent = [
    "任何人物、矮人与动物（默认空营）",
    "明火焰舌、飞溅火星与滚滚浓烟（只有主高炉炉口一团暗红炭火、炉顶一缕淡灰薄烟）",
    "火把、灯笼、烛火与其它人工光源",
    "正在燃烧的坡面（炭黑是冷的旧烟垢）",
    "树林与绿草坡（小丘是裸岩，坡脚是灰绿湿草甸）",
    "石砌城墙、塔楼与民居（只有炉、棚、挡土墙与矿道口）",
    "旗帜纹章与任何文字标识",
    "晴天蓝天、雨雪与夜景",
    "4.0.3a 后的任何改动",
]

