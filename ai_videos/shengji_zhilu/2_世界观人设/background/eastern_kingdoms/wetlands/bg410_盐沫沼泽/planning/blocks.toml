# 盐沫沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg410"
name_zh = "盐沫沼泽"
size_m = [600, 480]
px_per_m = 2.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区图点位 [34, 24] 放在场地 (320, 260)；两口圆塘、伸进谷里的支汊与南缘宽汊、东北临海丘陵边线、西北角海面按区图裁切量取（区图 3.774 m/px，裁切约 0.9 m/裁切 px），与区级 terrain.toml 的盐沫谷圆塘、巴拉丁海湾一致；浮木、盐斑、矮树等谷内布置无一手出处，推定"
# 世界树画面：北岸靠海的一段谷地，风大、草伏，海雾常年不散，地表结着一层白色盐霜
# 区图：红十字落在三角洲一条支汊东北端的岸上；北面两口圆塘，东北是北岸小山，西北角见海
absent = [
    "任何人物与动物",
    "雪、冰与霜冻（白色是粗粒盐霜，不是雪）",
    "火与任何人工光源",
    "房屋、码头、栈桥与船（谷里只有被浪冲进来的浮木与旧船桨）",
    "路（谷里没有成形的路，只有草地与泥面）",
    "逆向的风（草木一律朝东南倒伏，风恒从西北海上来）",
    "茂密树林与饱和翠绿草坡",
    "晴天蓝天、直射阳光与夜景",
    "4.0.3a 后的任何改动",
]

