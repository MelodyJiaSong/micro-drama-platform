# 藓皮沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg408"
name_zh = "藓皮沼泽"
size_m = [600, 480]
px_per_m = 2.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区图点位 [63, 58] 放在场地 (300, 240)；河道、两口圆塘、南段主干道与龙喉山块西麓按区图裁切量取（区图 3.774 m/px，裁切约 0.9 m/裁切 px）；湿林、草窝、火塘等林内布置无一手出处，推定"
# 世界树画面：东南一片长满厚苔的湿林，树干裹着绿毛，地面软塌，豺狼人的草窝散在树根之间
# 区图：红十字落在主河东岸；西岸是两口圆塘与南段主干道，东约 120 m 起是龙喉山块西坡
absent = [
    "任何人物、豺狼人与动物（默认空窝）",
    "燃着的火塘与炊烟（火塘是冷灰）",
    "火把、灯笼与任何人工光源",
    "木栅寨墙、帐篷与房屋（只有枯草芦秆堆的圆顶草窝）",
    "桥（过河只有一串踏石）",
    "凿成城门的黑色山体门脸（在东南山体拐角后，本档看不到）",
    "晴天蓝天、直射阳光、雨雪与夜景",
    "饱和翠绿的阔叶林（本区乔木扭曲、裹苔、垂须）",
    "4.0.3a 后的任何改动",
]

