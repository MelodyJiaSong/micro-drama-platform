# 丹莫德 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1600, 270) m；主干道与西侧岩丘从 bg401 terrain.toml 平移过来（地图量取），镇内房屋落位全部推定。

[meta]
bg = "bg402"
name_zh = "丹莫德"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上两枚房屋图标约占 60 × 60 m；取 320 × 280 m 把东侧主干道与西侧岩丘脚一并框进来。镇内尺度无一手出处"
# 世界树画面：北端路边一小片石砌矮人聚落，屋顶破损、墙上留着烟熏痕，街上走动的是穿黑甲的黑铁矮人，炉火烧成暗红
absent = [
    "任何人物（占据此地的敌对矮人属 shot 层，不进底图）",
    "锻炉炭床以外的一切火光：窗灯、火把、火盆、灯笼",
    "整修一新的屋顶与友方旗帜（4.0.3 才被夺回变友方）",
    "城墙与塔楼（只有齐腰矮墙与一座石拱门）",
    "海岸与船只（海峡在北面大桥下，不入本场地）",
    "文字招牌",
    "4.0.3a 后的新建筑与飞行点",
]

[[ridge]]
name = "西侧圆背岩丘（北岸临海丘陵的东脚）"
