# 日落沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [24, 30] 落在本场地 (300, 210)；裁切图 1 px ≈ 0.944 m（区图 1 px ≈ 3.774 m，裁切放大 4 倍）。

[meta]
bg = "bg411"
name_zh = "日落沼泽"
size_m = [600, 420]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取：场地 ＝ 裁切图 (42..678, 18..462) px × 0.944 m；三条汊道走向与间距、东北短汊、东南圆塘均从裁切图描出，宽度按区图线宽推定（汊道 22–35 m）。点位东北约 90 m 的无标注石构图标世界树未收录，不录。枯树、倒木、草墩、高草丛位置为推定"
# 世界树画面：西北的开阔湿草甸，水洼一块接一块反着灰天，几丛高草和枯木立在水中
absent = [
    "任何建筑、栅栏、骨桩、草棚与人造物（那是西南邻档的鱼人窝）",
    "道路与车辙（区级西段主路在本场地南缘以外）",
    "岩石、山坡与任何高差（最高的草墩高出水面不到 1 m）",
    "盐霜与伏地白草（那是北邻的临海谷地）",
    "墨色油膜深沼（那是港东的暗色沼泽）",
    "橙红落日与直射阳光（默认态是傍晚阴天，只有西天云底一条亮带）",
    "火、灯笼与任何人工光源",
    "人物、鱼人、鳄鱼、水鸟",
    "4.0.3a 后新增的夜精灵据点与沉入海里的港镇",
]

