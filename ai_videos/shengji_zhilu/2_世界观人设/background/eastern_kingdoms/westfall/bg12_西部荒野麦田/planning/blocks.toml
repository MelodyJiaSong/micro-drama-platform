# 西部荒野麦田 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 自造主体，无原典点位：落点沿用区级 bg383 的推定块（萨丁农场与哨兵岭之间、大道西侧）。
# 场地原点 ＝ 区级平面图 (1480, 700) m；大道与哨兵岭坡脚由区级 terrain.toml 平移过来（地图量取），田内一切推定。

[meta]
bg = "bg12"
name_zh = "西部荒野麦田"
size_m = [400, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "一块弃耕麦田取 400 × 280 m，东缘贴中央大道、南缘止于哨兵岭坡脚北缘；无一手尺寸出处"
# 世界树无画面描述；world.md §5：金黄麦浪、风车剪影、废弃农舍、黄沙；地里立着收割机
absent = [
    "饱满的金色麦浪（旱灾麦子稀疏发干，金色只来自逆光）",
    "绿色庄稼与青草",
    "收割机械、红面罩、任何人物与动物（属 shot 层）",
    "水面（灌溉沟是干的，界河在东面 400 m 外、机位身后）",
    "燃烧的麦田、烟与火星",
    "塌陷的巨坑与地裂（4.0.3a 才有）",
    "石砌大屋与围墙（只有一栋木板空农舍与谷仓骨架）",
]

