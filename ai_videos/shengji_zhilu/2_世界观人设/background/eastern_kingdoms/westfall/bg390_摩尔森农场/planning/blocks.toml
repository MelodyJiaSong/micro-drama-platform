# 摩尔森农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg390"
name_zh = "摩尔森农场"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级平面图 b903 给的田垄 + 屋舍范围约 180 × 200 m（区图 1 px ≈ 3.2 m）；本图原点 ＝ 区级 [1089, 994] m，外扩到东北侧土路、取 300 × 260 m。屋舍尺寸按两层农舍与高顶谷仓的常规规模推定，无一手尺寸出处"
# 世界树画面：荒田中的空农舍，门开着没人，麦茬地里机械收割傀儡一趟趟来回，动作规律得发瘆
# 区图：斜放的田垄图标在北、两枚屋舍图标在南，西线土路贴东缘南北走过（区级 terrain.toml 西线路段）
absent = [
    "任何人物与动物（收割机械是停住的静物，走动属 shot 层）",
    "燃着的火、炊烟、亮着的灯（马灯不点，烟囱不冒烟）",
    "风车帆布（本档风车只剩十字木臂，区别于还在转的破帆风车）",
    "绿色庄稼与青苗（田已荒成灰黄麦茬）",
    "石砌院墙与围墙（只有半倒的木栅）",
    "海岸与沙滩（在场地以西两三百米外，画面里只露崖坎上沿与一线海）",
    "4.0.3a 后的塌陷巨坑与流民帐篷",
    "飞行点与狮鹫栖架",
]

