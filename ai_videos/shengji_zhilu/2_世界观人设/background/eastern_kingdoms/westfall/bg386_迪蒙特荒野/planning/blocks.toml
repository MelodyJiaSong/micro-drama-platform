# 迪蒙特荒野 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本点位在区图上没有图标（区级 b911 就是推定），场地内所有摆放一律 src = "推定"；
# 相对方位（西 ≈100 m 土崖、南 60–90 m 起丘、东去镇子）取自区级 terrain.toml 与世界树文字。

[meta]
bg = "bg386"
name_zh = "迪蒙特荒野"
size_m = [220, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树只说「月溪镇西侧几乎只剩地基的农庄」，无一手尺寸；主屋 / 谷仓按西部荒野常见农庄尺度推定，崖与丘的距离按区级 terrain.toml 量出"
# 世界树画面：月溪镇西侧几乎只剩地基的农庄，断墙与半截烟囱立在平地上，看得很远
absent = [
    "屋顶 / 完整的房屋（只剩地基与断墙，不能拍内景）",
    "有人居住的痕迹：晾晒的衣物、新鲜的脚印、帐篷、营地（4.0.3 后的流民营也不在这里）",
    "火、火堆、冒烟（烟囱炉膛与烧斑都是冷透多年的旧痕）",
    "水面（海在西侧崖下，本场地内看不见水；丘脚浅沟是干的）",
    "树林、绿地、湿润草坡（只有枯草与干蓟）",
    "风车（本场地内没有，只在北面远景里有模糊细影）",
    "石砌大屋 / 城墙 / 塔",
]

