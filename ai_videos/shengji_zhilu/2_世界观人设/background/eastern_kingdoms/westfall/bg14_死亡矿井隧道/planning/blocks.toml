# 死亡矿井坑道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本档是副本里「有代表性的一段」坑道，无坐标、无一手尺寸：整段布局按锚点 prompt 推定。
# 坑道：西段直道 5 m 宽（x 0–39）→ 转运段 22 × 16 m（x 39–61）→ 东段收窄、折向东北、朝东缓缓下行。
# 岩体用 [[ridge]] 表示坑道两侧的实心岩（height_m 为推定的顶板以上岩层厚度，只作图示）。
# 木支撑框每 3–4 m 一道、油灯每一两道框一盏，逐道画会糊成一片，不入图；数量与节奏以锚点 prompt 为准。

[meta]
bg = "bg14"
name_zh = "死亡矿井坑道"
size_m = [110, 36]
px_per_m = 12.0
scale_src = "推定"
scale_note = "取副本通道里有代表性的一段约 100 m：西段直坑道约 5 m 宽、4 m 高（两人并肩、比人高一倍多），转运段约 22 × 16 m；无一手尺寸出处"
# 世界树画面：窄而长的木支撑矿道，轨道沿地面延伸，两侧是敲出来的岩壁与堆放的矿车
absent = [
    "天光、竖井透光（本段在地下深处，唯一光源是横梁油灯）",
    "火把、炉火、熔铁的红光（熔炉大厅是 bg15，不入本档）",
    "点着的火药桶、烟、爆破扬尘（爆破只在 shot 层写）",
    "发光水晶、发光的石头",
    "海水、船、船坞（地下船坞是 bg16，不入本档）",
    "伐木机、工头与任何匪帮成员（属 shot 层）",
    "任何人物与动物",
    "文字、标牌、编号",
]

