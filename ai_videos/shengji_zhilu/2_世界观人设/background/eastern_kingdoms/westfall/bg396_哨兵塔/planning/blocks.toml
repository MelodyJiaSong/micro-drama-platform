# 哨兵塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本档是 bg11_哨兵岭 坡顶那座塔的特写场地：130 × 140 m，塔放在 (60, 60)。
# 与 bg11 共用同一套落位——本文件坐标 ＝ bg11 blocks.toml 坐标 − [110, 58]；改其一必同步另一（塔、屋舍、大道都按它平移）。
# 塔门与木梯在西墙是本档新增的推定；锚点图默认机位约在 (36, 70)，朝东北偏东仰望（机位不是实物，不写成 block）。

[meta]
bg = "bg396"
name_zh = "哨兵塔"
size_m = [130, 140]
px_per_m = 10.0
scale_src = "地图量取"
scale_note = "塔位取坐标表 [56.2, 47.6]；周边落位全部由 bg11_哨兵岭 的平面图平移（区图裁切 1 px ≈ 1.06 m 量取：塔到东脚大道约五六十米、台地东沿约 40 m）。塔身 12 m 见方、高 22 m 与 bg11 一致（推定）"
# 世界树画面：坡顶方形哨塔，下层石砌上层木构，顶上瞭望台与旗杆；从塔顶能一眼看完半个西部荒野
absent = [
    "厚石墙 / 在建石墙 / 脚手架（4.0.3 后才有）",
    "焦黑的塔身与屋舍（旧世完好）",
    "塔内楼梯的外露旋梯 / 石砌外梯（上塔只有西墙两折外挂木梯）",
    "瞭望台上的火盆、灯笼、烽火（默认白天空台）",
    "亮着的炉火与烟（炉台冷灰）",
    "城门与寨墙",
    "塌陷巨坑与地裂（4.0.3a 才有）",
    "绿草坡与高林",
    "任何人物与动物（守卫、首领、坐骑属 shot 层）",
]

