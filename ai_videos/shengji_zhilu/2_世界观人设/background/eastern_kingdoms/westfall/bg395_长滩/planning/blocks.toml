# 长滩 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标。场地是整条西海岸中段一段有代表性的 1 km 沙岸（约区级 x 870–1270 / y 1000–2000 一带），
# 崖—沙—海的层次与宽度取区级 terrain.toml 的「西岸崖坎」与近岸海带（地图量取）；沙上的船骸、窝棚、漂流木逐件推定。

[meta]
bg = "bg395"
name_zh = "长滩"
size_m = [400, 1000]
px_per_m = 1.4
grid_m = 100
scale_src = "推定"
scale_note = "世界树无坐标；取西海岸中段 1 km 作代表段。崖高 25 m、崖脚到水边约 40–60 m 沙带按区级 terrain.toml（地图量取）；沙滩全长两公里多，本图只截一段"
# 世界树画面：西侧漫长的灰白沙岸，浪线笔直；沙上散着搁浅的沉船肋骨与断桅，海风把沙吹成流动的纹路
absent = [
    "码头 / 港口 / 栈桥 / 防波堤（长滩是荒岸，不是港）",
    "石砌建筑与城墙（人造物只有搁浅的船、窝棚与漂流木）",
    "下崖的台阶与木梯（只有几道冲沟）",
    "燃着的火堆与青烟（默认态火堆是冷灰余烬）",
    "亮着的灯塔光束（灯塔在南端、属 bg391，默认白天不亮）",
    "椰树 / 热带植被（沙上只有枯枝与干海藻）",
    "绿草坡（崖顶是枯黄平原）",
    "风暴巨浪 / 雨（默认晴朗下午、浪线平缓笔直）",
    "任何人物与动物（水栖怪物、渔民、海鸟属 shot 层）",
]

