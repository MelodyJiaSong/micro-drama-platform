# 哨兵岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图裁切（1 px ≈ 1.06 m）量得：大道在塔东约 45 m 贴坡脚弯过、塔西南一列矮脊、塔南下有路口分岔；
# 屋舍的相对方位取世界树子节点（旅店 / 炉 / 锯木场 / 栖架）的文字，落位推定。

[meta]
bg = "bg11"
name_zh = "哨兵岭"
size_m = [300, 300]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区图裁切按 1 px ≈ 1.06 m 量取：塔到东脚大道约 45 m、塔到坡西矮脊约 60–120 m；坡顶台地约 150 × 170 m 取 300 m 见方场地以装下坡脚大道与路口"
# 世界树画面：缓坡顶上一圈低矮石木屋与谷仓式长屋，坡顶立着方形木石哨塔；四周是收割后的空麦茬地，风大尘高，旗子一直在抖
absent = [
    "厚石墙 / 在建石墙 / 脚手架（4.0.3 后才有；旧世是简陋前哨）",
    "被烧黑的哨塔与屋舍（旧世完好）",
    "塌陷的巨坑与地裂（4.0.3a 才有）",
    "流民帐篷营（4.0.3 后才有）",
    "城门与寨墙（进出只有东脚大道与爬坡土路）",
    "亮着的炉火、烟、灯笼（默认态白天，炉膛冷灰）",
    "绿草坡与高林（四周只有枯黄麦茬地）",
    "任何人物与动物（飞禽坐骑、管理员、驻军属 shot 层）",
]

