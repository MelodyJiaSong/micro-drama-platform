# 萨丁农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标表点位 [56, 31] 落在场地 (180, 190)。裁切图（ref/bg388_萨丁农场_map_crop.png，1 crop px ≈ 1.2 m）量取：
# 屋舍图标在红十字西北约 30 m、斜长田块在屋西南（约 170×70 m）、中央大道在东约 58 m、西来土路在北约 150 m 并入大道、大道东北一片矮丘。
# 谷仓 / 风车 / 机械 / 水槽等区图不画的，一律推定。

[meta]
bg = "bg388"
name_zh = "萨丁农场"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "按区图裁切量取（区图 1 px ≈ 3.19 m，裁切放大约 2.67 倍）；田块、屋舍、道路的相对位置取自裁切，建筑尺寸推定"
# 世界树画面：少数还在耕作的农场，麦子半黄半青；木屋、谷仓与一座转动的风车，田里立着铁皮收割傀儡
absent = [
    "收割后的麦茬地（本档麦子未收，半黄半青立在田里）",
    "烧毁的谷仓 / 焦黑骨架（那是东南角另一处农地）",
    "火、炊烟、亮灯的窗、机械冒烟或发光",
    "河流与水面（界河在东面两百多米外，场地内只有屋前水槽）",
    "树林与绿地",
    "石砌大屋 / 围墙 / 哨塔",
    "马、牛与任何牲口（主人夫妇与牲口属 shot 层）",
]

