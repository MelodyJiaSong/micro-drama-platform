# 西部荒野灯塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg391"
name_zh = "西部荒野灯塔"
size_m = [160, 140]
px_per_m = 7.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.2 m：主礁岛约 15 px（≈50 m）、东南小礁约 9 px（≈30 m）、主岛到大陆岸约 5 px（≈15 m 窄湾）；场地取 160 × 140 m 把主岛、小礁、窄湾与一段大陆岸礁装进来。塔与小屋尺寸推定"
# 世界树画面：南岸礁石上的白色圆灯塔，夜里塔顶一束光缓慢扫过海面；塔下是石阶与一间小屋，海雾贴着地
# 裁切图：红十字落在一块离岸的圆形小岛上，东南另有一块更小的礁，东北隔一道窄水是大陆岸
absent = [
    "码头、栈桥与停靠的船（上岛只能涉水踩石阶）",
    "任何人物与动物（原典塔外的幽灵守塔人属 shot 层）",
    "第二个人工光源：小屋窗灯、火堆、火把、烛火（只有灯室那一束光）",
    "树木与草坡（只有石阶缝里的耐盐矮草）",
    "沙滩（灰白沙岸在北面画外，本场地是礁岩）",
    "围墙、栅栏与其他建筑（岛上只有塔与一间小屋）",
    "4.0.3a 后的新增营地与任务道具",
]

