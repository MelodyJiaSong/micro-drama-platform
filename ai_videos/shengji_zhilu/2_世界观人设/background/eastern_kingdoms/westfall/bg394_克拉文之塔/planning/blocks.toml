# 克拉文之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 320 m 见方、以塔（坐标表 [70, 74] → 区级 2240, 1579 m）为中心；河与丘陵由区级 terrain.toml 平移
# （区级坐标 − [2080, 1419]）得来，所以记「地图量取」；塔门朝向、残墙、木箱、小路属推定。

[meta]
bg = "bg394"
name_zh = "克拉文之塔"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "坐标表"
scale_note = "塔位取世界树坐标 [70, 74] × WorldMapArea（32.004 × 21.336 m/%）；河中线与南部丘陵东端按区级 terrain.toml 平移裁入。塔到河中线约 64 m、到丘脚约 40 m；塔身直径 10 m / 高 18 m 为推定"
# 世界树画面：东南河边一座孤塔，灰石圆身、顶层几扇窄窗，塔下水声与风声混在一起
absent = [
    "塔名改后的新版本塔 / 大灾变后的任何新建筑（4.0.3a 才改名 Mortwake's Tower）",
    "亮着的窗、烛火、火把、火盆（默认态窗洞全黑）",
    "烟与火星（北面烧过的田只剩冷透的暗褐烧斑）",
    "围墙与寨门（塔是孤塔，只有一段塌成膝高的残墙）",
    "第二座塔 / 石堡 / 城墙",
    "海（海在区的西面与北面，这里只有界河）",
    "桥（最近的界桥在北面约 300 m 外，出场地）",
    "鲜绿草坡与高林（本岸只有一条灰绿河岸带，高林在对岸）",
    "任何人物与动物（匪帮与施法者属 shot 层）",
]

