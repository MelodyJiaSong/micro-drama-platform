# 匕首岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标。场地 ＝ 区级坐标 x 1100–1900 / y 1400–1960（本文件坐标 ＝ 区级 − [1100, 1400]）：
# 包络是区级 terrain.toml「匕首岭」山脊多边形平移裁入（地图量取）；区图上的山纹是几列平行的波脊，
# 分成北 / 中 / 南三列与两道干沟的具体几何、营地与小径都是推定。

[meta]
bg = "bg397"
name_zh = "匕首岭"
size_m = [800, 560]
px_per_m = 1.8
grid_m = 100
scale_src = "地图量取"
scale_note = "包络按区级 terrain.toml 的匕首岭多边形（区图量取，WorldMapArea 32.004 × 21.336 m/%）平移；三列脊高 55 / 110 / 80 m 与沟、营地、小径为推定"
# 世界树画面：月溪镇背后一列尖脊土丘，岩色偏红褐，几乎寸草不生，脊线锋利得像刀背
absent = [
    "河流 / 溪水 / 水塘（沟全是干的）",
    "树林与绿草坡（只有枯草丛与死树桩）",
    "雪线与高山（这是一两百米的土丘，不是大山）",
    "翻岭去邻区的山路（翻过南列只有崖与海）",
    "石砌堡垒 / 塔 / 城墙（营地只是帆布棚与木箱）",
    "燃着的营火与烟（火堆冷灰）",
    "矿井入口（地下矿井的入口在小镇谷仓地板下，不在岭上）",
    "任何人物与动物（匪帮、野兽属 shot 层）",
]

