# 法布隆南瓜农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级坐标 (1523, 357) m；南瓜地、西去土路、北部岔路口、矿洞土丘东坡按区级 terrain.toml / 区图田垄图标量取，
# 农舍 / 板车 / 木栅等小件区图上没有，一律推定。北面临海土崖在场地外约 170 m（区级 y≈190）。

[meta]
bg = "bg387"
name_zh = "法布隆南瓜农场"
size_m = [200, 220]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地框按区图（1 px ≈ 3.19 m）量取：田垄图标约 70×45 m、土路与岔路口取区级 terrain.toml；农舍等小件尺寸推定"
# 世界树画面：北部路边的南瓜地，橙黄果实散在灰绿藤上；一栋小农舍、一辆板车，老白马拴在车辕边
absent = [
    "飞行点 / 狮鹫栖架（旧世这里没有，4.0.3 才加）",
    "马与任何牲口（老马属 shot 层，不入底图）",
    "火、炊烟、亮灯的窗（屋空着，烟囱是冷的）",
    "水面（海在北面场地外的土崖下）",
    "麦田（本块田种的是南瓜，不是麦）",
    "石砌大屋 / 围墙 / 塔",
]

