# 贾森农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标表点位 [60, 19.2] 落在场地 (170, 130)。裁切图（ref/bg389_贾森农场_map_crop.png，1 crop px ≈ 0.83 m）量取：
# 屋舍图标在红十字西约 120 m、斜块田在屋东北、大道自西南斜上到桥头、河在桥口收窄后折向东南、路南小丘、西北矮丘。
# 披棚 / 机械 / 石墩等区图不画的，一律推定。

[meta]
bg = "bg389"
name_zh = "贾森农场"
size_m = [300, 280]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "按区图裁切量取（区图 1 px ≈ 3.19 m，裁切放大约 3.87 倍）；屋、田、路、桥、河、丘的相对位置取自裁切，建筑尺寸推定"
# 世界树画面：西部荒野最北端的农场，麦田已荒成灰黄；屋旁就是跨河的石桥，桥那头的树色明显更绿
absent = [
    "木桥 / 断桥（这里是完好的低拱石桥）",
    "稻草人（旧世田里是铁皮收割机械）",
    "火、炊烟、亮灯的窗（屋被占过后空着）",
    "飞行点 / 狮鹫栖架",
    "石砌大屋 / 城墙 / 哨塔",
    "马、牛与任何牲口",
    "桥两头同色（桥西灰黄、桥东转绿是本档的硬约束）",
]

