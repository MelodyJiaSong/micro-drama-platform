name_zh = "达芙妮·斯迪威的农场"
size_m = [220, 220]
px_per_m = 6.0
scale_src = "推定"
scale_note = "取 220 m 见方：坐标 [42, 88] 落在南部尖脊丘陵的一处向南敞开的小谷地（裁切图红十字），谷口外是海——两道脊与海岸的相对方位是地图量取；屋、院、棚的尺寸与朝向全为推定"
# 世界树画面：西南海岸边一栋孤立农舍，背海一侧墙被风沙打得发白，院里有一架旧火枪靠在门边
absent = [
    "麦田 / 风车 / 平原（这里是山与海夹住的谷地，不是平原农场）",
    "第二栋房子 / 谷仓 / 牲口棚（只有一栋屋和一间工具棚）",
    "灯塔入画（灯塔在西南更远的海边礁石上，是 bg391）",
    "码头 / 船只（海面空无一船，只有漂来的旧船板）",
    "炊烟 / 燃着的火（烟囱不冒烟）",
    "鲜绿草地 / 树林（尖脊寸草不生）",
    "任何人物与牲口（屋主只在 shot 层出现）",
]

