# 死亡矿井铸造厂 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg15"
name_zh = "死亡矿井铸造厂"
size_m = [110, 80]
px_per_m = 12.0
scale_src = "推定"
scale_note = "副本内部大厅，区图无坐标；取一个 110 × 80 m 的下陷圆厅（顶高约 25 m），入口平台在西北高处、出口在东南底部，取自区地理页「高炉与熔铁槽的大厅」+ 副本路线（坑道 → 熔炉 → 桅杆厅 → 海湾大门）；厅内全部尺寸为推定。h_m 以厅底为 0"
absent = [
    "日光 / 天窗 / 任何通到地面的竖井透光（厅在月溪镇地底深处）",
    "火把 / 油灯 / 提灯 / 魔法光（唯一光源是高炉与铁水）",
    "海水 / 船体 / 船坞（那是下游的铁甲湾 bg16）",
    "堆放船桅的高厅本体（在东南出口坑道之外，只在坑道深处露一截圆木）",
    "海湾大门与轰门的炮（在桅杆厅之后，归 bg16 一侧）",
    "传送带 / 电灯 / 现代钢铁厂结构",
    "任何人物、首领与工人（shot 层）",
]

