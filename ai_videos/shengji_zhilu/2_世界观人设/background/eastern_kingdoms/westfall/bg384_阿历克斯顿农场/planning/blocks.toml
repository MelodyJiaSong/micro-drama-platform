# 阿历克斯顿农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg384"
name_zh = "阿历克斯顿农场"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "取 200 m 见方：区图上田垄图标在西北、屋舍图标在东南，北侧紧贴东西向土路（区级平面图 b901，约 44%,35%）——这三件事是地图量取；合院内各屋尺寸与朝向全为推定"
# 世界树画面：中北部的老农庄，土墙剥落、木梁裸露，院里一口砖井，井绳还在
absent = [
    "塌陷巨坑 / 地裂（4.0.3a 才有；1.12 农庄完整）",
    "收割机械 / 铁皮傀儡（本档田里没有，那是别家农场）",
    "南瓜地 / 还在耕作的青麦（麦田已荒）",
    "焦黑烧毁的谷仓（本档谷仓是塌顶，不是烧毁）",
    "红色面罩 / 匪帮旗帜（占过的痕迹只有冷火塘与撬开的空箱）",
    "燃着的火 / 炊烟（火塘是冷灰余烬）",
    "飞行点 / 狮鹫栖架",
    "任何人物与牲口",
]

