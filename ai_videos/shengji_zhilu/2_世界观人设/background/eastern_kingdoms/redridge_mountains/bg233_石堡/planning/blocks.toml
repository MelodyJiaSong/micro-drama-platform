# 石堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1060, 560) m。要塞图标 [62, 54] → 本图约 (171, 155)；高塔图标 [57.5, 49] → (81, 89)。
# 河道 / 南山 / 北路由区级 terrain.toml 平移而来；沿湖大道在区级数据里与河道重叠，本图按「河口浅滩涉水」推定。

[meta]
bg = "bg233"
name_zh = "石堡"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "要塞与高塔的相对位置取区图两个图标（区图精度约 ±20 m）；城墙圈 110 × 90 m、主楼 36 × 30 m、各建筑高度为推定"
# 世界树画面：湖东红岩高台上的人类要塞群，方正石墙与角楼层层叠上去；旧世墙头插的是黑石兽人的旗，墙根堆着攻城后的碎石
absent = ["白石墙 + 蓝板岩瓦的王城式建筑（这里是灰石山地要塞）", "旗面文字与纹章", "燃烧的火盆 / 浓烟（默认态冷灰）", "修好的完整木桥", "训练假人 / 4.0.3 后新增的营地与哨塔", "高塔与主楼相连的廊桥（两者分开）", "任何人物 / 动物 / 文字"]

