# 湖畔镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：原版区图 1 px ≈ 1.98 m（区 1985 × 1324 m / 1002 × 668 px）；场地原点 ＝ 区坐标 (240, 470) m。
# 湖湾、湖口木桥、北路、四枚房屋图标按区图量取（与 bg222 terrain.toml 同一套数）；单栋房子的归属与体量推定。
# 锚点机位：湖湾南岸草坡 (190, 290)，朝正北隔湾看镇。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg223"
name_zh = "湖畔镇"
size_m = [400, 300]
px_per_m = 4.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区 WorldMapArea 1985 × 1324 m × 原版区图量取；湖湾宽约 100 m、湖口木桥长约 110 m、四枚房屋图标散在湾北岸 60–120 m 纵深内；单栋房子推定"
# 世界树画面：止水湖西岸的木造小镇，深棕木屋、石砌烟囱与伸进水里的木栈道；镇边那座长木桥一直架着修桥的脚手架，湖面把整镇倒着映一遍
absent = [
    "修好的完整木桥（旧世桥一直缺板、架着脚手架）",
    "4.0.3a 后的新剧情建筑 / 营房 / 军旗 / 战地帐篷",
    "白石墙 + 蓝板岩瓦的王城式建筑（这里是深棕原木 + 灰石墙基）",
    "城墙 / 寨墙 / 石砌塔楼（小镇不设防）",
    "可见的火苗 / 炉火 / 烛光 / 灯笼（白天户外，炉膛是冷的、窗户是暗的）",
    "烟囱冒烟",
    "栖台上的坐骑与任何动物",
    "任何人物 / 文字招牌 / 路牌字样",
]

