# 瑞斯班洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 洞穴内景图：[[ridge]] ＝ 实心岩体（height_m 取岩体在洞底以上的厚度），洞厅 / 小洞块 h_m=0 表示可走的洞底；[[road]] ＝ 隧道与支洞。

[meta]
bg = "bg232"
name_zh = "瑞斯班洞穴"
size_m = [160, 130]
px_per_m = 8.0
scale_src = "推定"
scale_note = "洞内无一手尺寸；主厅 45 × 35 m、顶高七八米与入口隧道约 40 m 均按「中型天然洞穴 + 一个营地大小的主厅」推定。洞口位置取区级 terrain.toml（区图洞口图标约 [15, 27]，世界树无坐标）"
# 世界树画面：西北崖壁上的洞口，洞内岩壁泛铁锈红，深处有豺狼人的火堆与骨堆，回声很重
absent = ["日光 / 天窗透光（洞口在拐弯外，主厅见不到天光）", "发光矿石 / 发光水晶 / 荧光菌（矿脉只反光不发光）", "木支架矿道 / 铁轨 / 矿车（这是天然岩洞，不是人修的矿坑）", "熔岩 / 地下河", "火把 / 灯笼（主厅唯一光源是中央柴火）", "任何人物 / 动物 / 文字"]

