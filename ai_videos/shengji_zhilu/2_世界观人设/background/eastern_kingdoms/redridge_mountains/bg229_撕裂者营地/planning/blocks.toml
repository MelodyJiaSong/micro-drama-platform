# 撕裂者营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树给的只有：兽皮帐 / 削尖木栅 / 中央常燃大火堆 / 烟拖出山口；数量与布局全部推定（区图三个营地图标）。

[meta]
bg = "bg229"
name_zh = "撕裂者营地"
size_m = [240, 200]
px_per_m = 6.5
scale_src = "推定"
scale_note = "区级平面图块 b905（180×130 m，区图北缘营地图标）只给了落点；岩台 240×200 m、营区 120×110 m 按兽人野营常识推定。北路在本图东缘外约 250 m"
# 世界树画面：北部山口的兽人营地，兽皮帐与削尖的木栅，中央大火堆常年不灭，烟一直拖到山口外
absent = [
  "石墙 / 砖房 / 任何永久建筑（只有木栅与兽皮帐）",
  "寨门门扇 / 吊桥（寨门是无扇的缺口）",
  "第二处燃着的火 / 火把 / 灯笼（中央火堆是唯一人工光源；东北角旧火塘冷透）",
  "座狼笼（那是奥瑟尔伐木场）",
  "旗帜纹章 / 氏族徽记",
  "燃烧平原的熔岩与焦土（只在山口外一线天色里）",
  "雪 / 雨 / 夜景",
  "任何人物 / 动物 / 文字",
]

