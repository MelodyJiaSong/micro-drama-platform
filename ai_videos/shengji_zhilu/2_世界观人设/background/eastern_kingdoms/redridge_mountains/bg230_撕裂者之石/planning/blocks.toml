# 撕裂者之石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图 ＝ 撕裂者营地 bg229 场地的西北一角：本图 (x, y) ＝ bg229 场地 (x, y + 20)。巨岩与洞口落在区图营地帐篷图标西侧约 70 m 的洞穴图标上（区级约 (551, 89) m）。
# 世界树坐标 [63.4, 83]（区东南南墙山体）与父节点「撕裂者营地」、wiki「西北、燃烧平原入口附近的大洞穴」三方矛盾，判为录入错误，不用。
# 锚点机位：两顶西侧小帐之间偏东 (110, 72)，朝正西；两顶小帐分别落在画面左右边缘（约 ±40°），中央火塘在机位身后约 10 m。

[meta]
bg = "bg230"
name_zh = "撕裂者之石"
size_m = [160, 140]
px_per_m = 8.0
scale_src = "推定"
scale_note = "落点取区图营地旁的洞穴图标（区图精度约 ±20 m）；巨岩 24×26×18 m、洞口 8×6 m、栅墙与帐篷沿用 bg229 场地（推定）"
# 世界树画面：营地边一块突出的巨岩，顶上平坦，被兽人当成点将台
absent = [
  "上岩顶的梯子 / 石阶 / 小路（岩顶无路，进出只走洞口）",
  "洞里的火光 / 火把 / 灯笼（洞口几米后全黑）",
  "营地中央的火堆入画（它在机位身后）",
  "旗杆 / 旗帜 / 纹章",
  "东南南墙山脚的平顶孤岩（那是世界树错坐标的落点，不是本档）",
  "火山口 / 焦土 / 爆炸坑（4.0.3 后的东西）",
  "雨 / 雪 / 夜景",
  "任何人物 / 动物 / 文字",
]

