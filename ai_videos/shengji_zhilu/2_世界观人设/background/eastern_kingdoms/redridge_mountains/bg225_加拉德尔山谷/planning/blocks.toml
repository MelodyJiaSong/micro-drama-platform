# 加拉德尔山谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：原版区图 1 px ≈ 1.98 m；场地原点 ＝ 区坐标 (1200, 330) m。
# 谷北山 / 东北外墙 / 东墙的轮廓、东北断头路、谷中小径与谷北洞口取 bg222 terrain.toml 同名条目换算；石塔按世界树坐标 [79.7, 49.3]（区图图标偏西约 100 m，取坐标表）。
# 谷南红岩坡、营地痕迹、疏林与巨石推定。锚点机位：西口 (30, 222)，朝东北偏东进谷。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg225"
name_zh = "加拉德尔山谷"
size_m = [520, 440]
px_per_m = 3.0
grid_m = 50
scale_src = "坐标表"
scale_note = "区 WorldMapArea 1985 × 1324 m；山体与道路按 bg222 terrain.toml（地图量取）换算，谷口宽约 45 m；营地痕迹、疏林、巨石推定"
# 世界树画面：东北的谷地，坡上稀疏针叶林，谷中孤零零立着一座法师塔，谷口收得很窄
absent = [
    "通往东邻沼泽的东侧山口（4.0.3 才开；旧世东墙完整无缺口）",
    "塔顶或塔窗的烛光 / 灯火（白天默认态，塔窗全暗）",
    "营火燃着 / 冒烟（火塘是冷灰余烬）",
    "建成的村落 / 石屋 / 寨墙（只有几座兽皮矮棚的残迹）",
    "湖泊 / 河流穿谷（谷里无水，南坡外的瀑布潭属 bg234）",
    "雪 / 秋色落叶",
    "任何人物 / 动物 / 文字 / 路牌字样",
]

