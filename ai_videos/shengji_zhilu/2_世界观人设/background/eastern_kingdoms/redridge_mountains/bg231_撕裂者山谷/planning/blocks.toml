# 撕裂者山谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1189, 843) m；区图坐标 [71, 78] 落在本图 (220, 190)。河湾折线由区级 terrain.toml「河道南湾」平移而来。

[meta]
bg = "bg231"
name_zh = "撕裂者山谷"
size_m = [420, 360]
px_per_m = 3.5
scale_src = "推定"
scale_note = "边长按区图裁切目估（谷底约 240 × 180 m，东南山群与南墙夹出的西开口袋谷），区图本身精度约 ±20 m；帐篷与火塘位置无一手出处"
# 世界树画面：东南谷地里的兽人前哨，谷壁红褐、谷底是踩实的土场与几顶矮帐，规模比北面营地小
absent = ["火山口 / 焦土大坑 / 爆炸冲击痕（4.0.3 后的撕裂者火山口）", "寨墙与望塔（那是北山口的大营 bg229）", "燃烧的火堆与烟柱（默认态火塘冷灰）", "东端翻山的路或山口（旧世不通任何邻区）", "湖面（主湖在西北石堡南山背后，谷内看不见）", "北面的崖壁（北面是长草缓坡）", "桥", "任何人物 / 动物 / 文字"]

