bg = "bg362"
name_zh = "幽暗城运河"
size_m = [220, 110]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "外环运河圆与河宽取区级 terrain.toml（地图量取，0.8756 / 0.8762 m/px）；步道宽、拱顶高按推定"
# 世界树画面：环绕全城的墨绿色药水河道，河面浮着泡沫与残肢，石桥横跨
absent = ["天空 / 日光 / 月光（整条河道在地下拱廊里）", "清水 / 蓝色水面 / 倒映天空的水", "河面上的尸块、残肢与骨骸（默认态只有泡沫、烂布与木屑）", "船、渡口与码头", "活植被与水草（只有苔与霉斑）", "任何人物与动物（巡逻的缝合巨物属 shot 层）", "暖白圣光 / 金色光效", "电灯 / 现代管道 / 铁栏杆扶手", "有文字的路牌与铭文"]

