# 幽暗城运河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本卡取外环运河的**南段**（区级 b907 落点），两座桥之间的一整段弧。
# 圆按区级 terrain.toml 外环运河（圆心区图 (662, 282) px、半径 162 m）：本地圆心 (110, −92)，本地原点 ＝ 区级 m (469.6, 339.1)。
# 两座桥的方位角从区图量取：绿带在 px (575, 435) 与 (745, 433) 各断开一处（≈120° 与 61°，自正东顺时针）——断口即过河的桥。

