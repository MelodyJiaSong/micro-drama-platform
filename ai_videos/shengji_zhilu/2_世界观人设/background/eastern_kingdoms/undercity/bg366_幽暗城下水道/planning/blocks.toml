# 幽暗城下水道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。

[meta]
bg = "bg366"
name_zh = "幽暗城下水道"
size_m = [320, 150]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "按区级平面图 bg360 的量取比例（区图像素 × 0.8756 m）截取：本场地 ＝ 区图 x 100–420 m、y 120–270 m，含入城甬道、主管道、积水潭、回头弯与出城口"
