absent = ["天空 / 日光 / 月光（回头弯以西才是城外，本图内没有天光）", "清水 / 运河的墨绿药水（这里是浑浊的黄绿污水）", "摊位 / 房屋 / 任何建筑立面", "火把以外的暖色光（全管只有入城口一盏火把）", "树木 / 草地（只有苔藓与霉斑）", "人物 / 动物 / 软泥怪（生物属 shot 层）", "暖白圣光与金色光效", "现代管道 / 混凝土 / 电灯 / 铁皮"]

