# 炼金房 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Undercity_c60.jpg（1002×668 px）上 x∈[420,600] px、y∈[360,560] px 一窗，
#   本地 m ＝ (px − 420, py − 360) × (0.8756, 0.8762)（与区级 terrain.toml 同一换算）。
#   外环运河按区级 terrain.toml 的圆（圆心本地 (211.8, −68.3)、半径 162 m）截取。
# 区图只画出几间沿西南—东北轴错开的方室与一间圆室的外轮廓；哪间是主厅、哪间是解剖内室、釜与架怎么摆，按世界树画面推定。

[meta]
bg = "bg361"
name_zh = "炼金房"
size_m = [158, 176]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "区图西南斜角一窗 180×200 px 量取（换算同区级 terrain.toml：0.8756 / 0.8762 m/px）；室内陈设尺寸按『长厅宽约二十步、入口到内室约四十步』推定"
# 世界树画面：成排的铜釜与蒸馏架，毒绿蒸汽从釜口翻出，解剖台上摊着尸体
absent = ["天空 / 日光 / 月光 / 天窗（整片在地下）", "任何人物、尸体与试验体（默认态解剖台是空的）", "活的动物（鼠群属下水道 bg366）", "活植被（只有霉斑与苍白菌子）", "窗户与玻璃温室", "暖白圣光 / 金色光效 / 成排烛台", "电灯 / 现代实验器材 / 玻璃罩灯", "从主厅直通王座厅的大门（只能穿解剖内室南侧窄门）", "有文字的标签、招牌与药瓶贴纸"]

