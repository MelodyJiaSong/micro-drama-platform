# 武器大厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[630,782] px、y∈[520,631] px 一窗，
#   本地 m ＝ (px − 630, py − 520) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 厅内陈设（擂台 / 火盆 / 兵器架 / 石柱 / 战旗）区图上不画，按世界树画面推定。

[meta]
bg = "bg203"
name_zh = "武器大厅"
size_m = [110, 80]
px_per_m = 10.0
scale_src = "地图量取"
scale_note = "区图蓝紫色大块量取：西北斜向门厅约 30×16 m，主厅约 65×48 m，东端半圆后殿约 27 m 径；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：军事区里的大练武厅，中央一圈沙地擂台，四周兵器架列满长柄武器，墙上是历代矮人战旗
absent = ["天空 / 日光 / 窗（山腹内厅）", "训练假人 / 木桩靶（旧世城里没有）", "熔岩 / 锻炉（在城心，不在本厅）", "看台 / 观众席", "木构房屋 / 瓦顶", "玻璃 / 电灯 / 现代器物", "任何文字：旗面与墙上只有几何纹", "第二道出口：本厅只有西北门厅一个口"]

