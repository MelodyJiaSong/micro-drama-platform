# 旧铁炉堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 旧世区图上不画这一层（玩家不可进入），整张图都是推定：只有「在王座厅下方、从王座厅侧门下去」是原典方位。
# 布局故意只写到「一道下行阶 → 一段前窟 → 一座方厅」这一层，不补 4.0.3 开放后的陈设。

[meta]
bg = "bg206"
name_zh = "旧铁炉堡"
size_m = [60, 60]
px_per_m = 16.0
scale_src = "推定"
scale_note = "区图不显示本层；场地按区级平面图 b907「旧城石窟」50×50 m 外扩到 60 m，方位按「王座厅侧门之后、正下方」推定"
# 世界树画面：王座厅下方一层更古老的石窟，柱式粗笨、没有黄铜装饰，只有裸岩与旧火盆，空气里有陈年的冷
absent = ["黄铜管道 / 铁链吊灯 / 铁轨（上面那座城才有）", "熔岩与锻炉", "天空 / 日光", "王座 / 议事席 / 三座并列的高座（4.0.3 开放后的陈设）", "燃着的火盆（旧世默认态全部冷透）", "任何文字与铭文", "人物、守卫、动物"]

