# 铁炉堡区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 18 件（≤19）；bg202（区级主体 zone_whole）不在判定范围。blend 里材质会剥掉，所以按「形状」复用：
#   直跑宽石阶 ×10 段（各厅石阶，逐轴撑满占地与 h_m）；方肩拱石门洞兼 探险者大厅东南拱门 / 秘法大厅入口 / 王座厅通旧层厚石门；
#   方形叠涩石柱兼 武器大厅、秘法大厅、旧铁炉堡三处柱列（铁环 / 日轮浮雕是贴面细节，不进几何）；
#   粗凿石火盆兼 旧铁炉堡三只冷火盆 + 军事区旅店方形火塘（压扁拉宽）；三足黑铁火盆兼 武器大厅两只 + 军事区四只；
#   矮宽拱门店铺门脸兼 平民区四排店铺 + 拍卖行（锚点画面外，拉伸占形）；钝头矮石笋兼 石笋群 / 踏脚扁石 / 潭心圆背黑岩 / 石阶顶粗岩柱。
# judgment calls：
#   h_m = 0 的厅 / 广场 / 石室 / 甬道口 / 回纹石带一律 plaza（高度未记录，只铺地坪；黑石山同例）；有高度的掏岩石屋 / 岩室 / 炉边酒馆走 chamber；
#   熔岩坑 / 熔岩池 / 八角水池 / 螺纹水池走 pool；祭台、王座台、旧层空石台走 altar（抬高的叠层石台）；
#   后殿战旗弧墙与王座背后刻纹石壁走 low_wall（旗面平贴墙面、刻纹是浅浮雕，不改几何）；洞穴东口粗石阶走 rock_shelf（就着岩层凿出的台阶）；
#   狮鹫场是一段开放石台走 yard（栖架与干草暂不进几何，排镜要拍时再立件）；军事区圆形坡道口 h_m 仅 1.8 m，按地坪走 plaza。
#   石阶资产正面（南）是阶脚，face ＝ 阶脚朝向。

