# 探险者大厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[580,816] px、y∈[5,254] px 一窗，
#   本地 m ＝ (px − 580, py − 5) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 区图只画出「米色斜向长廊 + 青绿色大厅群」的外轮廓；哪一翼是书库、哪一翼是展廊，以及厅内陈设，按世界树画面推定。

[meta]
bg = "bg204"
name_zh = "探险者大厅"
size_m = [170, 180]
px_per_m = 8.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图右上青绿色大块 + 其前的米色斜向长廊量取：总外廓约 166×170 m；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：高穹顶的展陈大厅，中庭立着完整的恐龙骨架与泰坦石碑残块，四壁是书架与玻璃展柜
absent = ["天空 / 日光 / 天窗（山腹内厅）", "熔岩 / 锻炉 / 炉火（本厅只用油灯）", "活的动物（骨架是化石）", "有文字的招牌 / 标签 / 地图注记", "电灯 / 霓虹 / 现代展柜灯", "机械管道密集区（在南边的机械作坊区，不在本厅）", "4.0.3 之后新增的展品与考古工具台"]

