# 荒弃的洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[395,610] px、y∈[20,175] px 一窗，
#   本地 m ＝ (px − 395, py − 20) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 石屋 / 小岩室 / 水潭 / 东口石阶按区图褐色块与旋涡水面量取；暗河走向、南下窄道走哪一岸、钟乳石笋与扁石踏步为推定。

[meta]
bg = "bg208"
name_zh = "荒弃的洞穴"
size_m = [155.1, 111.9]
px_per_m = 8.0
grid_m = 25
scale_src = "地图量取"
scale_note = "区图正上方褐色区块量取：浅色洞底约 80×26 m，南端椭圆水潭约 40×54 m；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：一段刻意不加修饰的天然岩洞，顶上垂着钟乳，地下暗河从中间淌过，光源只有零星几支火把，是全城最暗的一块
absent = ["天空 / 日光 / 光柱（山腹深处）", "熔岩 / 火盆 / 铁链吊灯（唯一光源是壁上零星火把）", "黄铜管道 / 铁轨 / 斗车", "门框线脚 / 菱形纹 / 雕花石柱（本洞刻意不修饰）", "铺砌石板路面", "树木 / 草地 / 任何植被", "蝙蝠 / 任何动物", "招牌 / 任何文字", "训练假人 / 木桩靶"]

