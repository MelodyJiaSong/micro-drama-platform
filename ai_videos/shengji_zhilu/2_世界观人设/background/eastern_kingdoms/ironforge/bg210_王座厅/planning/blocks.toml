# 王座厅 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量取：原版区图 WorldMap-Ironforge_c60.jpg（1002×668 px）上 x∈[262,400] px、y∈[238,365] px 一窗，
#   本地 m ＝ (px − 262, py − 238) × (0.7215, 0.7222)（与区级 terrain.toml 同一换算）。
# 四块熔岩池（区图红色回纹）、北端王座凹室、南沿斜廊按区图量取；石阶宽度、王座台 / 王座 / 石门 / 火盆为推定。

[meta]
bg = "bg210"
name_zh = "王座厅"
size_m = [99.6, 91.7]
px_per_m = 12.0
grid_m = 25
scale_src = "地图量取"
scale_note = "区图大锻炉西侧橙色区块量取：正殿南北约 75 m、东西约 80 m，四块熔岩池按红色回纹外框；换算同区级 terrain.toml（0.7215 / 0.7222 m/px）"
# 世界树画面：大锻炉尽头抬高的王座厅，一条石阶直上，厅中一张黑铁王座背靠雕满符文的石壁，两侧立着持斧卫兵
absent = ["天空 / 日光 / 光柱（山腹正殿）", "成排铁链吊灯（本殿光来自熔岩池与两只火盆）", "卫兵 / 国王 / 任何人物（本卡只锁空间）", "石壁与垂幡上的可读文字 / 字母符文", "4.0.3 后的议事席与三座高座（那是旧铁炉堡开放后的布置）", "冷蓝光（只属于秘法区）", "雪 / 植被", "玻璃 / 电灯 / 现代器物"]

