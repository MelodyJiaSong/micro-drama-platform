name_zh = "污染者高地"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取区级默认 320 m 见方：约 160 × 140 m 的台地基座 + 东侧洼地与隔开坑地的山体 + 西坡上顶路；无一手尺寸出处"
# 世界树画面：荒原上突起的台地，顶部一圈焦黑的仪式石，紫色的余烬从地缝里往上飘
# 区级平面图 b904（推定，2026-09-24 人审移位）：红原通往腐烂之痕的豁口南侧；西坡脚＝豁口与主干道尽头，东侧山体背后 ~250 m 是坑地岩缘
absent = [
    "任何人物与动物",
    "火、火焰、火星与烟（立石与地面冷透；紫色光点不是火）",
    "建筑、营帐、祭坛台阶与任何人工铺装",
    "发光符文、法阵光圈与能量幕",
    "文字、旗帜与标识",
    "草地、树木与任何绿色植被",
    "河流、水潭与任何水面",
    "4.0.3a 之后新增的地貌与建筑",
]

