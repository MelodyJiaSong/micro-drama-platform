# 诅咒之地区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 14 件（上限 14）。blend 里材质会剥掉，所以按「形状」复用：
#   紫黑火成岩巨石兼 塌石坡 / 山脚塌石 / 崩落碎岩 / 塌进海里的岩块群 / 斜插入水的岩板 / 冷凝熔岩块群；
#   斜插岩柱兼 离岸海蚀岩柱；仪式立石压扁兼 倒伏断裂立石；方塔拉高兼 法师塔；三层主楼压矮兼 军械库；
#   兽皮巨帐压矮兼 塌了半边的破帐；骨堆杂物堆兼 营心焦骨堆 / 墙根破烂 / 炭黑粗木残段；有角骨骸兼 第二具散架肋笼。
# judgment calls：
#   h_m = 0 的地面标记块（冷灰滩 / 砂砾滩 / 泥壳滩 / 烧痕 / 雾池 / 裂痕 / 焦坑 / 山缝 / 鞍部）一律走 plaza / yard
#     （asset 单件在 h_m=0 时会取 min(size) 当高度，把地面标记立成墩子）；
#   bg82 的红岩围子三面壁是天然层状岩板，走 rock_shelf；bg83 的石砌栖台是空的平顶台，也走 rock_shelf；
#   bg83 城墙 12 m 走 low_wall（gate_wall 每段都会开人门）；西门双塔拱门走 gate_wall；城外拒马走 palisade；
#   bg83 西墙根空木箱与旧脚手架走 crates（背景小件，不值一件 Rodin 额度）；
#   bg81 南墙外浅沟木刺 h_m=0，走 yard。

