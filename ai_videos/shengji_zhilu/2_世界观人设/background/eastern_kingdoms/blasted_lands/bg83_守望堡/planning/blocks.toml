# 守望堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg83"
name_zh = "守望堡"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 300 × 260 m：约 150 × 130 m 的方城 + 北侧山脚 + 西侧支路与门前石板场 + 西南建场机位的退让；无一手尺寸出处"
# 世界树画面：荒原北缘的白石要塞，方形塔楼与雉堞在红土上格外突兀，蓝色旗帜猎猎，塔顶有法师的紫光结界
# 区级平面图 b903（地图量取）：北缘山墙东段山脚下；支路自主干道先东后北绕上来、从西侧来到要塞
absent = [
    "任何人物与动物（默认空城；栖台是空的，没有坐骑）",
    "火把、火盆、灯笼与任何明火（库房炉火关在门里看不到）",
    "旗面纹章与任何文字",
    "发光的符文、传送门与大面积能量幕（只有塔顶一层弱光罩）",
    "木构民居与帐篷（全城是石砌）",
    "草地、树木与任何绿色植被",
    "河流、水潭与任何水面",
    "4.0.3 之后的改建与新增建筑",
]

