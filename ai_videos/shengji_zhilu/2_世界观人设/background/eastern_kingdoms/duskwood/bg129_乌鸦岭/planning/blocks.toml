# 乌鸦岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (374, 810)；主干道与墓地岔路按 bg126 terrain.toml 的折线平移过来（地图量取）。
# 区图 [19, 55] / [21, 55] 两个房屋图标落在本图 (94, 102) / (156, 107)；其余木屋、板车、菜地为推定。
# 锚点机位：村口东侧主干道 (232, 140)，朝西北顺主街仰视。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg129"
name_zh = "乌鸦岭"
size_m = [240, 240]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "主干道、岔路与两个房屋图标按区图量取（±30 m）；单栋尺寸、其余建筑与菜地推定"
# 世界树画面：西部的空村，房子还立着但门窗全黑，没有炊烟没有人声，只有风吹旧木招牌的响动；村口一辆空的运棺板车
absent = [
    "任何亮着的窗、灯笼、烛火、炊烟与火（全村没有一盏灯）",
    "狼人难民营 / 帐篷 / 飞行点木台（都是 4.0.3a 之后才加的）",
    "棺材本身 / 车上的货物 / 挽车的牲口（板车是空的）",
    "带字的招牌 / 告示 / 路牌（招牌板面磨白无字）",
    "水井 / 磨坊 / 石砌教堂（村里只有木屋）",
    "太阳 / 蓝天 / 月亮圆盘",
    "任何人物、动物、乌鸦与飞鸟",
]

