# 腐草农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (400, 1015)，区图 1 px ≈ 2.46 m；区图 [21, 69] 处田的图标在北、房屋图标在南，
# 两者相距约 80 m——据此摆「田在北半、谷仓与小屋在南半」。主干道从本图西北角外擦过（世界 y≈1020），西界河与西南浅溪都在场地外。
# 锚点机位：田东北角地头 (195, 55)，朝西南。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg127"
name_zh = "腐草农场"
size_m = [260, 240]
px_per_m = 4.0
grid_m = 20
scale_src = "地图量取"
scale_note = "田与房屋两个区图图标的间距（约 80 m）按区图量取；谷仓 / 木屋 / 栅栏 / 车辙路的尺寸与位置全部推定"
# 世界树画面：西南的废弃农场，一座谷仓与一间小屋都空着，田里只剩黑色腐草，谷仓门在风里自己开合
absent = [
    "任何火、烛火、灯笼、窗火与炊烟（谷仓与木屋都是黑的）",
    "太阳 / 蓝天 / 月亮圆盘 / 直射光",
    "绿色作物 / 在耕的麦田 / 南瓜 / 转动的风车或磨坊",
    "院墙 / 石墙 / 塔楼 / 第三栋建筑",
    "水井（那是南部另一座农庄的标志）",
    "稻草人（远看像人影）",
    "挂着字的招牌 / 木牌文字",
    "任何人物、鬼影、牲畜、乌鸦与飞鸟",
]

