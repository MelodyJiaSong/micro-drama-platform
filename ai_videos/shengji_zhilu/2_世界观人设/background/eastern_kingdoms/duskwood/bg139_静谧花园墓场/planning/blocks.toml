#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (1870, 1060)；区图裁切 1 px ≈ 0.62 m（裁切 4× 放大，区图 1 px ≈ 2.46 m）。
# 裁切上教堂图标在 [81, 72]（世界 2000, 1185 → 本图 130, 125），五个墓碑图标在它北侧与西北侧 35–70 m；
# 东面山影离教堂约 45 m 起坡、南面矮岭约 35 m、西南一道低丘；墓园支路从西北角进来。
# 锚点机位：北墙铁门 (85, 40)，离地约 1.6 m，朝南偏东看教堂正门。坐标原点在场地左上角，x 向东、y 向南，单位 m。

