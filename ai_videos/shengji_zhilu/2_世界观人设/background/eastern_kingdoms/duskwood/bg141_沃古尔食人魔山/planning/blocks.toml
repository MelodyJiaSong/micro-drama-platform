# 世界树画面：南部一个下陷的盆地，中间是食人魔堆起的土丘与洞口；四周散着被拆掉的农舍木料与啃剩的黑熊骨架，火堆比人还高
absent = [
    "第二处火光：火把、灯笼、烛火、窗火（大火堆是唯一的人工光源）",
    "太阳 / 蓝天 / 月亮圆盘 / 硬直射光",
    "完好的房屋与屋顶（农舍只剩被拆下的木料）",
    "河流、水面与桥",
    "石砌建筑、城墙、塔",
    "带皮毛的活熊与任何动物（只有骨架）",
    "翡翠绿光（那只属于环形山里的凹地）",
    "新砍的白茬木料（木料都是旧房拆下来的深褐朽木）",
    "任何人物、巨人与飞鸟",
]

