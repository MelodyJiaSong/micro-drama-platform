# 沃古尔食人魔山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图 (220, 150) ＝ 区图坐标 [35, 73] ＝ 区级平面图（bg126）世界坐标 (864.1, 1201.5)；
# 区图裁切 720×480 px 覆盖区图 180×120 px（区图 1 px ≈ 2.46 m），故裁切 1 px ≈ 0.61 m，本图 x ≈ 裁切 x × 0.61、y ≈ 裁切 y × 0.62。
# 裁切所见：西、北两面一道弧形陡坎把盆地兜住；一条小径自东北角翻过陡坎、弯进盆地中央；东南另有一小段陡坎；
# 南面是南界山墙，山脚正中一团岩丘图标（土丘与洞口）。主路南折往荆棘谷的岔口在本图东北角外约 60 m。
# 锚点机位：东北小径翻过陡坎处 (360, 72)，离地约 1.6 m，朝西南俯看火堆、窝棚与南面土丘洞口。
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。

