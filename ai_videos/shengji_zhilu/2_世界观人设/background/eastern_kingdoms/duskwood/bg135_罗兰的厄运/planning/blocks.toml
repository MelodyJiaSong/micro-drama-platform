# 罗兰的厄运 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (1660, 1110)；南界山墙与果园钩形矮山东臂按 bg126 terrain.toml 平移（地图量取）。
# 坑口按坐标表 [73, 79]（世界 1802, 1300）落在本图约 (145, 190)；区图矿洞图标在 [73, 75]，偏北约 60 m，取两者之间贴山脚处。
# 锚点机位：废石平台北缘 (145, 165)，朝南略仰。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg135"
name_zh = "罗兰的厄运"
size_m = [300, 280]
px_per_m = 5.0
grid_m = 20
scale_src = "坐标表"
scale_note = "坑口位置取坐标表 [73, 79] 与区图矿洞图标之间（±40 m）；山墙与西侧矮山按 bg126 terrain.toml 平移；平台、废石堆、工具棚、窄轨、车辙路的尺寸与位置推定"
# 世界树画面：东南的矿洞，洞口低矮到要低头，坑道里旧木支撑已朽、地上散着骨骸；洞深处比外面的夜还黑
absent = [
    "任何火、火把、灯笼、矿灯与人工光源（横梁上挂灯的铁钩是空的）",
    "在用的矿场：新坑木、亮轨、装满矿石的车",
    "第二个洞口 / 通风井 / 竖井架",
    "发光的矿脉 / 水晶 / 宝石",
    "河、溪、水潭（只有岩缝里的渗水痕）",
    "果树行列（在西侧矮山背后，场地外）",
    "墓碑 / 十字架（小墓园在东北两百多米外，场地外）",
    "太阳 / 蓝天 / 月亮圆盘",
    "带字的木牌 / 告示",
    "任何人物、动物、蜘蛛与飞鸟",
]

