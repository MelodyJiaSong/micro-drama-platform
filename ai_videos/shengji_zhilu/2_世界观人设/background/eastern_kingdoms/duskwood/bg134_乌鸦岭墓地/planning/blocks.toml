# 乌鸦岭墓地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg126）的 (340, 500) m；世界树坐标 [16, 33] 落在西北角孤屋 → 本图 (55~75, 43~50)。
# 区图上的墓园范围约 (15–24%, 33–50%)；南缘外 (19%, 55%) 是空村 bg129。

[meta]
bg = "bg134"
name_zh = "乌鸦岭墓地"
size_m = [440, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图 1002×668 px 按 bg126 米制（x% × 24.689 m、y% × 16.459 m）量取：墓园图标群、两座墓室、西北孤屋、园心空场与五条岔路、东侧小山；碑区划分与空场中央石柱为推定"
# 世界树画面：一片望不到头的墓碑与歪斜十字架，地面起伏、枯树列队站在碑间；全区雾最厚的地方就在这里，能见度只有几十步
absent = ["空村的房屋与村口板车（南缘外，属 bg129）", "东侧小山背后的隐士棚屋与门缝绿光（场地外，属它自己的镜头）", "围墙 / 园门（北、西两面无墙，碑行直接没进黑林）", "任何火 / 灯笼 / 烛火 / 窗光（空铁灯架里没有灯）", "河流与水面（北界河在场地以北）", "鲜花 / 绿草 / 晴天 / 远景清晰", "亡灵、盗墓贼、巨蛛（属 shot 层）", "4.0.3a 后的狼人难民营与乌鸦岭飞行点"]

