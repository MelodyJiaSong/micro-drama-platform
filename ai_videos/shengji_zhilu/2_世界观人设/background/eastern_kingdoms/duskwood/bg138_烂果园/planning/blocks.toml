# 烂果园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区级平面图（bg126）世界坐标 (1420, 1040)；钩形矮山按 bg126 terrain.toml「烂果园环山」平移（地图量取）。
# 果树行走向按区图斜条纹图标取东北—西南（rot = -35°），行数 / 行距 / 行长推定；中央农舍、窝棚、榨果机推定。
# 锚点机位：西口旧农道 (20, 165)，朝东平视。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg138"
name_zh = "烂果园"
size_m = [320, 320]
px_per_m = 4.5
grid_m = 20
scale_src = "地图量取"
scale_note = "钩形矮山与果园田块按区图量取（±50 m）；树行、农舍、窝棚的尺寸与位置推定"
# 世界树画面：成行的果树全部枯死，树下落满发黑的果实，踩上去有声音；果园中央那栋旧屋塌了一半，狼人的窝棚就搭在残骸里
absent = [
    "任何火、烛火、灯笼与人工光（窝棚里全黑）",
    "活的果树、绿叶、新鲜果实",
    "在用的农具、新搭的篱笆、有人住的屋子",
    "东、北、南三面的出入口（只有西口敞开）",
    "谷仓 / 风车 / 水井（这里只有一栋农舍）",
    "河、溪、水潭",
    "带字的木牌 / 告示",
    "太阳 / 蓝天 / 月亮圆盘",
    "任何人物、动物与飞鸟（窝棚是空的，只留爪痕与碎骨）",
]

