# 无尽之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg197"
name_zh = "无尽之海"
size_m = [1600, 570]
px_per_m = 1.0
grid_m = 100
scale_src = "地图量取"
scale_note = "纯水面子区域，世界树无坐标。场地原点 ＝ 区级平面图 (250, 1380) m，向东 1600 m、向南到区图下缘；区图 2.920 m/px。孤岛按 bg199 坐标 [17, 80]、三块礁岛按区级 terrain.toml 的 b902–b904 平移换算；北缘海岸线与东缘山脚按区图量取。锚点机位约在 (1200, 380) 朝正西略偏南"
# 世界树画面：南岸两片沙滩之外一望无际的深蓝海面，浪头灰白翻卷，远处只剩一两块岛礁的黑色剪影，天水一色。
absent = [
  "船只、帆、渔船、浮标、航标、渔网（这片海没有人造物）",
  "灯塔（1.12 本区没有灯塔）",
  "任何人物、泳者、海兽、鱼群、水鸟",
  "火、灯笼、灯塔光等任何人工光源",
  "平静如镜的浅水、热带碧绿浅海、白沙浅滩（这里是深水长涌）",
  "冰山、浮冰、积雪",
  "飞行坐骑、飞艇",
  "被瘟疫炸毁的镇子废墟 / 绿色毒雾（4.0.3a）",
]

