# 塔伦米尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1580, 340) m；区图裁切 1 px ≈ 0.7 m。标点 [62, 23] → 本图 (234, 109)（果园东缘）。
# 三个房屋图标 → 教堂 / 旅店 / 谷仓（按地理页「谷仓在村外、挨着果园」分配）；其余木屋、水井、栖杆推定。

[meta]
bg = "bg194"
name_zh = "塔伦米尔"
size_m = [420, 340]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区级平面图（区图 1002 px × 2.920 m/px）与区图裁切（约 0.7 m/px）量取：北路、岔路、河、池塘、果园外廓、三个房屋图标与村东两道矮岭；房屋尺寸推定"
# 世界树画面：北部路口的小村：一座石教堂、几间歪斜木屋与枯死的果园，被遗忘者旗插在井边
