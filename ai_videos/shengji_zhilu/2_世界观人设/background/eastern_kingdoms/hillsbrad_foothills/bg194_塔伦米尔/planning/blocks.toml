    "4.0.3a 重建后的新村（新石墙、新屋、瘟疫设施）",
    "任何人物、蝙蝠与其它动物",
    "窗口里的绿灯、烛火、火把与任何人工光源（默认白天，窗暗）",
    "旗面纹章与任何文字",
    "河面（被村东两道矮岭挡住，村内平视不可见）",
