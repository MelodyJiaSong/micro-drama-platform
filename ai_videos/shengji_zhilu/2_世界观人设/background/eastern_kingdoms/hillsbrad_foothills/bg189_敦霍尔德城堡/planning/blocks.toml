# 敦霍尔德城堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg189"
name_zh = "敦霍尔德城堡"
size_m = [360, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "外墙约 200 × 160 m 无一手尺寸出处，按「大型要塞」推定；相对方位取区图：城堡图标在坐标表点位（[80, 39]）西南约 90 m，东路在图标以南约 130 m 自西北向东南经过，一条岔路北上到城堡；背靠东北山体。院内四处地标（营房 / 法师塔 / 角斗场 / 主楼）的相对位置为推定"
# 世界树画面：山坡上的大型石砌要塞废墟：外墙缺口、塌掉的法师塔与一圈竞技场地基，风把旗吹成破条
absent = [
    "任何人物、盗匪与坐骑（默认空堡）",
    "完好的屋顶、楼板与城门（全是废墟）",
    "任何火光与人工光源（院角旧火塘冷透）",
    "旗帜纹章与任何文字标识",
    "观众、角斗士、兵器陈列",
    "城堡完好的旧日时态（结构变体，另立 bg）",
    "护城河与吊桥",
    "雪线与积雪",
    "4.0.3a 后的任何改动",
]

