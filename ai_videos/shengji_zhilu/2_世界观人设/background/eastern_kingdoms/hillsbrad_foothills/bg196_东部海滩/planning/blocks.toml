# 东部海滩 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg196"
name_zh = "东部海滩"
size_m = [400, 400]
px_per_m = 3.6
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [64, 75]（区 m ≈ 1872, 1463）。区图 2.920 m/px：裁切图上岸线西北—东南走向（与正东约成 52°），黄色沙带宽 11–13 px ≈ 32–38 m，其后一排短刷线（岸崖）宽约 20 px；丹加洛克方塔在点位正东约 75 px（≈ 220 m，场地外）。礁石、潮洼、冲沟土径、旧船肋为推定"
# 世界树画面：东南沙滩，礁石更多，海水偏深蓝
# 场地外：正东约 220 m 的石砌小要塞（只从崖顶露塔顶）；西北隔湾约 400 m 的临水小镇与木栈码头；西南海上两座小礁岛（区图 [54, 82] / [57, 91]）
absent = [
  "码头、栈桥、船坞、渔村、晒网架（这一岸没人住）",
  "任何人物、船只、水鸟、海兽、鱼群",
  "火、篝火、火盆、灯笼等任何人工光源",
  "宽阔平缓的白沙滩（那是对岸的西滩；这里沙窄、礁多、卵石多）",
  "海兽骨架与成堆破船板（属西滩）",
  "棕榈、热带植物、红树林",
  "积雪、冰、浮冰",
  "被瘟疫炸毁的镇子废墟 / 绿色毒雾（4.0.3a）",
]

