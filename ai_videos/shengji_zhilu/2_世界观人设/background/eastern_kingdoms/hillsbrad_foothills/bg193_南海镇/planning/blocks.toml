# 南海镇 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1260, 1000) m。镇路、河、海岸线、滨海小径、镇西北小丘取自区级 terrain.toml；
# 标点 [53, 50] → 本图 (291, -25)（镇北草坡，场地外北缘）。镇内布局只有「镇政厅与旅店围一小块草地、码头伸进海湾」有原典，其余推定。

[meta]
bg = "bg193"
name_zh = "南海镇"
size_m = [460, 380]
px_per_m = 3.4
scale_src = "地图量取"
scale_note = "区级平面图（区图 1002 px × 2.920 m/px）量取镇路、河口、海岸线与码头根；镇内房屋尺寸与间距按两层石基木构小镇常识推定"
# 世界树画面：海湾边的人类小镇：白墙红瓦屋、码头木栈、镇政厅与旅店围着一小块草地，旗帜是联盟蓝金
absent = [
    "被瘟疫炸毁的废墟、焦黑断墙、绿色毒雾（4.0.3a 的南海镇废墟）",
    "城墙、城门与塔楼（镇子无墙）",
    "任何人物、狮鹫、马匹、狗与其它动物",
    "燃着的火、烛光、灯笼与任何人工光源（烟囱冷、窗暗）",
    "炊烟",
    "旗面纹章、招牌字与任何文字",
    "石砌大港、大船、帆船与起重架",
    "镇边过河的桥（过河走北面东路上的小桥）",
    "积雪",
]

