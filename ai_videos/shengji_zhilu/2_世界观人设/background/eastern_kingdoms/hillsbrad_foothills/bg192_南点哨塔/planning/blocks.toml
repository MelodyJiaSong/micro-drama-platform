# 南点哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (260, 760) m；区图裁切 1 px ≈ 0.7 m。标点 [15, 46] → 本图 (179, 137)（窄口最窄处），
# 区图塔形图标 → (340, 196)（路南）。营地内布局全部推定。

[meta]
bg = "bg192"
name_zh = "南点哨塔"
size_m = [440, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区级平面图（区图 1002 px × 2.920 m/px）量取：标点 [15,46] 与塔形图标相距约 170 m，山口两肩、岔路位置取自裁切图（约 0.7 m/px）；营地尺寸按常识推定"
# 世界树画面：西界路口的圆形石塔，塔顶哨兵，旁边一小片营地
absent = [
    "高大石砌关门 / 城门楼（4.0.3a 的南点大门）",
    "任何人物、哨兵、马匹与其它动物（默认空营）",
    "燃着的火堆、火把、灯笼与任何人工光源（火塘是冷灰）",
    "炊烟",
    "旗面纹章、招牌与任何文字",
    "训练假人 / 箭靶",
    "河流、池塘与任何水面（山口无水）",
    "积雪 / 雪山",
    "骨饰、尖刺铁栅等亡灵式装饰（4.0.3a 后的占领者风格）",
]

