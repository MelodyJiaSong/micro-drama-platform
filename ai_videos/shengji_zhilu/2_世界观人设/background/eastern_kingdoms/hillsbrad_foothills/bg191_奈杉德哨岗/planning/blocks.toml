# 奈杉德哨岗 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg191"
name_zh = "奈杉德哨岗"
size_m = [500, 500]
px_per_m = 2.8
scale_src = "地图量取"
scale_note = "区图 1 px ＝ 2.92 m；裁切图约 3.2 倍放大（1 裁切 px ≈ 0.91 m）。坐标表点位 [65, 53] 置于本图 (300, 250)；河、东路、路边石塔、院南田块与周边低丘按裁切图量取。农庄院落 60 × 50 m 及院内建筑布局为推定"
# 世界树画面：东部丘陵上的农庄，房子被熊/豺狼人占了，院墙塌了半边
absent = [
    "任何人物与野兽本体（熊与掠食者只留爪痕、干草窝、骨头等痕迹）",
    "完整的院墙（北段与东半边已坍）",
    "任何火光、窗内灯光与人工光源（旧火坑冷透）",
    "耕种中的庄稼（院南田已荒）",
    "旗帜纹章与任何文字标识",
    "雪线与积雪",
    "4.0.3a 后的任何改动",
]

