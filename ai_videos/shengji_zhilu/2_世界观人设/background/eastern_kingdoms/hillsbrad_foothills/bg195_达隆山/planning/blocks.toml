# 达隆山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1274, 516) m；区图裁切 1 px ≈ 0.91 m。标点 [52, 35] → 本图 (248, 167)（丘心偏南）。
# 岔口、塔形图标、乱石小图标、池塘南端按裁切图量取；丘的外廓、孤树位置推定（原典只说「坡顶几棵孤树」）。

[meta]
bg = "bg195"
name_zh = "达隆山"
size_m = [500, 340]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "区图裁切（约 0.91 m/px，以标点与塔形图标、池塘三点对齐区级平面图）量取道路、岔口、塔与乱石位置；丘高按区级 terrain 的 60 m 收成 45 m（相对丘脚农田）"
# 世界树画面：中部的圆丘，坡顶几棵孤树，能俯瞰整片农田
absent = [
    "建筑（丘顶只有孤树；路边小石塔在东坡脚岔口旁）",
    "灌木丛与密林（丘坡是光滑草坡）",
    "崖壁 / 裸岩山头",
    "丘上水面（池塘在东北坡外，属北村）",
    "任何人物与动物（牛羊马也不要）",
    "火与任何人工光源",
    "积雪",
    "泥浆农田、污泥地（4.0.3a 的污泥之地）",
]

