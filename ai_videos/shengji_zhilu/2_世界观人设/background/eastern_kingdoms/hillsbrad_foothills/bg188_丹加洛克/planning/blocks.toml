# 丹加洛克 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg188"
name_zh = "丹加洛克"
size_m = [360, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "要塞本体约 110 × 90 m 无一手尺寸出处，按「小要塞」推定；相对方位取区图：要塞图标在坐标表点位（[76, 65]）西南约 250 m 的东南山体北麓，坐标点落在门前小径上（本图东北角外）；海湾东岸在要塞以西约 200 m"
# 世界树画面：东南山口的矮人石砌要塞，方塔与拱门厚重，门口点着火盆
absent = [
    "任何人物、守卫、坐骑与狮鹫（默认空堡）",
    "南墙与后门（南面是山崖，唯一出入口是北门楼）",
    "除门前两只火盆以外的任何火光、火把、窗内灯光",
    "旗帜纹章与任何文字标识",
    "码头与船只（海湾只在远景）",
    "雪线与积雪",
    "4.0.3a 后的任何改动",
]

