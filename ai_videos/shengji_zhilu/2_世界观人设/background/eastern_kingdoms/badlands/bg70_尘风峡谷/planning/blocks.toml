# 尘风峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 坐标 [62, 47]，原点 ＝ 区级平面图 (1110, 513)；方台岩与小路按区级 terrain.toml 平移量取。
# 锚点机位：谷底中段约 [150, 282]，离地一人高，朝正东。
# 区图上双台岩西脚（约 [380, 150]）有一个骨骸图标，归属未核——本档不画、不入画。

[meta]
bg = "bg70"
name_zh = "尘风峡谷"
size_m = [600, 400]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "方台岩位置按区级平面图（区图 x%×22.746、y%×15.164 m）平移量取；谷底宽约 40 m、两壁高约 12 m、谷南壁那道带短齿的陡坎线在区图裁切上可见，其余尺度推定"
# 世界树画面：东部一条被风掏空的浅谷，谷壁上是一层层水平的沉积纹，风穿过时带起长条状的黄尘
absent = [
    "任何建筑、挖掘场、帐篷与营地（4.0.3 后的尘风挖掘场不收）",
    "水、积水、河道与湿地（全区没有一滴水，冲痕早已干透）",
    "绿色植被与活树（只有枯刺灌丛与枯树桩）",
    "火、炊烟与任何人工光源",
    "上到荒原的台阶或坡道（两壁无路，只有碎屑锥）",
    "龙、飞禽与任何动物",
    "熔岩与地热（那是西邻的灼热峡谷）",
]

