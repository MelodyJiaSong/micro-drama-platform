# 莱瑟罗峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 坐标 [79, 51]，原点 ＝ 区级平面图 (1397, 373)；四组山体按区级 terrain.toml 平移、在场地边界处裁切。
# 东崖西脚按区图量取：谷底是东墙西脚那条南北向橙色长槽（区图 x≈780–850 px），东崖从场地 x≈530 起。
# 读法：谷口朝西（双台岩与南侧山链之间），谷身向东北收成袋形谷头；谷底整体比口外盆地低二三十米（ridge 只画高出谷底的部分）。
# 锚点机位：西口岩棚 b01 顶上，微俯朝东。

[meta]
bg = "bg71"
name_zh = "莱瑟罗峡谷"
size_m = [800, 800]
px_per_m = 2.0
grid_m = 100
scale_src = "地图量取"
scale_note = "四面山体按区级平面图（区图 x%×22.746、y%×15.164 m）平移量取；崖高、谷底下陷深度、骨架与岩堆的尺寸均为推定"
# 世界树画面：东端一道深陷的大裂谷，谷底堆着焦黑岩块与龙骨，暗红色的龙群在谷上空盘旋，空气被热浪扭曲
absent = [
    "熔岩、岩浆裂缝与发红发光的岩石（本区没有熔岩，那是西邻的灼热峡谷）",
    "火、冒烟的火堆与任何人工光源",
    "任何建筑、营地与帐篷",
    "水、积水与任何植被（只有炭化枯树桩）",
    "第二个出入口（东、北、南三面都是崖，只有西口）",
    "龙蛋与孵化巢（旧世这里只有幼龙与龙骨）",
    "盘旋的龙群与任何动物（属 shot 层，不入底图）",
    "4.0.3a 后改动的地貌与新地名",
]

