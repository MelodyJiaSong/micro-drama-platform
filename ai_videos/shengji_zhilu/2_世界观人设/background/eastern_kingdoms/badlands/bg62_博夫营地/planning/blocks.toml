# 博夫营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg62"
name_zh = "博夫营地"
size_m = [200, 180]
px_per_m = 6.0
scale_src = "推定"
scale_note = "营地按四顶帐篷一小圈的规模推定（岩台约 56 × 44 m）；场地取岩台 + 背后山带坡脚 + 西北锚点机位（岩台西北约 40 m）能装下的 200 × 180 m，无一手尺寸出处"
# 世界树画面：岩台上一小圈食人魔帐篷，中央立着挂满头骨的木柱，火堆边横着一根包铁的大棒
# 区图：图标落在「裂谷西缘山链」西北脚下 → 山带占场地东南，盆地朝西北敞开
absent = [
    "任何人物、食人魔与动物（默认空营）",
    "燃着的火堆与炊烟（火堆是冷灰余烬）",
    "寨墙、木栅与大门（只是岩台上一圈帐篷）",
    "旗帜纹章与任何文字标识",
    "水体、草地、树林",
    "人类头骨（木柱上挂的只是兽类头骨与弯角）",
    "4.0.3a 后的任何改动",
]

