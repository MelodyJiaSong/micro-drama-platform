# 圣者之陵 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg68"
name_zh = "圣者之陵"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 320 m 见方：装得下约 110 m 的侧卧骨架、南侧干沟、西北来的小路收尾与东南方台岩的西壁；骨架尺寸无一手出处，按区图骨架图标宽度与「比埃格蒙德的营地那具小」推定"
# 世界树画面：荒原上一具横卧的巨大骨架，肋骨拱成天然的拱廊，骨面被风沙磨成灰白，骨架间搭着几顶破帐篷
# 区图：骨架图标东西向、在红十字东北；红十字南侧一条浅色干沟西北→东南；西北与西南是山体，东南一座方台岩
# 区级 terrain：「聚落→西南的小路」终点正落在本场地内（红十字以东约 90 m）
absent = [
    "任何人物、亡灵与动物（默认空营）",
    "燃着的火、火星与烟（石圈里只剩冷透残渣）",
    "水流与任何水面（干沟无水）",
    "木栅、寨墙与固定房屋",
    "草地、树林与任何绿色植被",
    "墓碑、文字与旗帜",
    "4.0.3a 后改动的地貌与新地名",
]

