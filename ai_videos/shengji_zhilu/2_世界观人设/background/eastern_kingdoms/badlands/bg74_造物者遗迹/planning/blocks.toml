# 造物者遗迹 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [51, 16] 落在本场地 (400, 260)；区图 1 px ≈ 2.27 m，裁切图（×3）1 px ≈ 0.76 m。
# 锚点机位约在 (500, 262)，朝西北偏西（方位 ~290°）仰看：三级石台一级级抬向西北山壁里的石门。

[meta]
bg = "bg74"
name_zh = "造物者遗迹"
size_m = [640, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取：四面山块轮廓按裁切图 ×3 换算，西北山壁上的遗迹图标（点位西 ~200 m）定石门位置，南来上坡道取区级 terrain.toml 同一折线平移；石台、断柱、探方、吊架的尺寸与摆位为推定（按「方形石阶与断柱直角排布」的原典画面推）"
# 世界树画面：北端一片从红土里露出来的泰坦台地，巨大的方形石阶与断柱按直角排布，与周围乱石的荒漠形成强烈反差
absent = [
    "门框与石面上发光的符纹（默认态纹路是冷的，发光属门内地下城段）",
    "门洞里的石像、石卫士与地图厅（全在门内，另档）",
    "点亮的矿灯、火把、火盆与营火",
    "任何人物、动物、坐骑与飞禽",
    "任何水体",
    "绿色植物与草地",
    "完好无损的柱子或屋顶（柱子全断、台地露天）",
    "4.0.3a 后的新挖掘营地与新布局",
]

