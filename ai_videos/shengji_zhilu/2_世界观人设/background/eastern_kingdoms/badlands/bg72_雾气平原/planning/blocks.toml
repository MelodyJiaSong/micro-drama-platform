# 雾气平原 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (160, 860)；世界树坐标 [29, 75] ＝ 区级 (660, 1137) ＝ 本图 (500, 277)，正落在南部低丘的北脚。
# 山体按区级 terrain.toml 平移、在场地边界处裁切。读法：盐碱平地铺在南部低丘以北、西部方台岩与中南岩柱群之间，
# 东南角延到南缘山链脚下；南部低丘是南缘山链向北伸出的一截矮丘（区图量取，区级 terrain 已按区图校正）。
# 锚点机位：b01 盐壳西缘小岩包（低丘西北脚），离地约 1.5 m，平视朝东；矮丘在右前方近处，正好挡住东南的巨兽脊椎。西南山块里的卡格营地（bg63）在机位背后，不入画、本图不标。

[meta]
bg = "bg72"
name_zh = "雾气平原"
size_m = [1000, 560]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "山体与小路按区级平面图（区图 x%×22.746、y%×15.164 m）平移量取；盐碱壳范围、冲沟、碎石带、岩包与灌木的位置尺寸均为推定"
# 世界树画面：南部一片被热浪蒸得发虚的平原，地平线抖动、远景像泡在水里，地面是浅色的盐碱壳
absent = [
    "真实的水面、湖泊、积水与湿亮的地面（远景的「水」只是热浪折射的天光）",
    "盐湖卤水与白色结晶的盐田（这里是薄薄一层浅色盐碱硬壳，不是雪白的盐滩）",
    "任何绿色植被、草地与活树",
    "近中景的任何建筑、帐篷、营地与路标",
    "火、烟与任何人工光源",
    "熔岩与冒红光的地裂（4.0.3a 后才有的焦土熔岩沟）",
    "雨、雪、云影与阴天",
    "任何人物与动物",
]

