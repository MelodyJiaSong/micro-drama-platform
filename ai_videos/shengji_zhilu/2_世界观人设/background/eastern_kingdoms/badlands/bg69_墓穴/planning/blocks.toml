# 墓穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景：一张图装下「挖掘场一角 → 小径 → 矮山 → 山顶洞口 → 地下坡道 → 石室」；锚点机位在坡底（约 [80, 79]）朝正南看王座。
# 方位：世界树文字写「挖掘场东南的矮山」，按文字把挖掘场摆在西北角；坐标 [51.3, 35] 在区图上落在挖掘场图标西南偏西几十米，二者不一致，待核。

[meta]
bg = "bg69"
name_zh = "墓穴"
size_m = [160, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图上只有挖掘场图标、没有矮山与洞口，无一手尺寸；矮山高约 18 m、坡道约 10 m、石室 12×14 m 均按「微型地下城」的体量推定"
# 世界树画面：铁趾挖掘场东南一座矮山顶上的无标记洞口，沿一条天然小径上去；洞底是一间昏暗石室，四壁堆着骨灰瓮、木箱与散落的骸骨，正中一具披甲骷髅端坐在石王座上，座旁竖着一柄长剑。
absent = [
    "窗、天井与第二个出口（石室只有北侧一道坡道）",
    "火把、火盆、蜡烛、灯笼与任何人工光源",
    "剑身或骸骨发光、符文光",
    "水、积水与地下河（全区没有一滴水）",
    "木梁支护与矿车轨道（那是挖掘场与副本口的形制，石室是粗凿岩体）",
    "洞口的门、栅栏、碑刻与任何标记",
    "任何活人、动物与后世才加的稀有怪",
]

