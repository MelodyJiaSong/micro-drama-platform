# 卡格营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg63"
name_zh = "卡格营地"
size_m = [360, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "营地与下挂巢洞口的相对位置取区级坐标表（营地 [14, 81] → 巢洞口 b902：西 ~150 m、南 ~45 m）；帐篷 / 黑灰堆 / 冲沟尺寸无一手出处，按三顶帐篷的散营推定"
grid_m = 50
# 世界树画面：荒原上几顶破烂兽皮帐篷围着一堆黑灰，地上扔着啃过的大骨头与粗木棒
# 下挂地标：火山洞穴（崖壁下大口岩洞，洞口熏黑）——洞口朝东，嵌在西南山块脚下
# 锚点机位：营地东北约 75 m、冲沟 A 的沟沿上（约 [285, 70]），朝西南
absent = [
    "任何人物、食人魔与动物（默认空营）",
    "燃着的火与炊烟（黑灰堆冷透；洞内的火从洞外看不见）",
    "寨墙、木栅与大门（平地散营，四面敞开）",
    "岩台（那是东南的另一座营地）",
    "冲沟里的水（全区无水，冲沟干涸）",
    "旗帜纹章与任何文字标识",
    "草地、树林",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "西南山块东脸（营地西侧崖壁，巢洞所在）"
