# 卡加斯 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg66"
name_zh = "卡加斯"
size_m = [260, 240]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "裁切图约放大 6.8 倍（KARGATH 字样对照原图），红十字到西缘崖壁 ≈50 m、到方台岩西壁 ≈50 m、方台岩宽 ≈100 m；寨内布局无一手出处，按旅店 / 飞行点 / 马厩 / 铁砧四项功能推定"
# 世界树画面：西端崖下一圈尖木寨墙围出的兽人镇，红黑兽皮帐篷与粗木望塔，寨心一堆常烧的火，旗上是破碎之手的爪印
# 区图：旅店图标在红十字以东约 35 m；飞行点图标在西北（寨墙外夯土高台）；小路在寨墙与方台岩之间南北向，北端向东绕方台岩北面
absent = [
    "银行与拍卖行（旧世卡加斯没有）",
    "石砌城墙、城门楼与石屋（全镇只有原木与兽皮）",
    "火把、灯笼、火盆（寨心火塘是唯一人工光源）",
    "任何人物、坐骑与栖架上的飞兽（默认空镇）",
    "河流、水井与任何水面",
    "树木、草地与任何绿色植被",
    "文字招牌",
    "4.0.3a 后的山崩废墟与新卡加斯",
]

