# 瓦格营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg65"
name_zh = "瓦格营地"
size_m = [160, 160]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 160 m 见方：三顶帐篷 + 一口火塘 + 一块巨岩的宿营规模，外加南侧建场机位的退让距离；无一手尺寸出处"
# 世界树画面：荒原中段的食人魔营，三两顶帐篷背着一块风蚀巨岩，火堆上架着一口熏黑的大锅
# 区图：[29, 55] 四周平坦红土，正北是漫尘盆地（盆心约 80 m），西北一两百米外是中西碎岩山链南麓的低丘（在本场地外），东北有冲沟裂纹、西南一座方台岩 → 巨岩摆营地正北，帐篷门朝南
absent = [
    "任何人物与动物（默认空营）",
    "燃着的火、火星与炊烟（火塘是冷余烬，锅是冷的）",
    "寨墙、木栅、门楼与望塔（只是宿营地）",
    "石砌或木构房屋",
    "河流、水潭与任何水面",
    "草地、树林与任何绿色植被",
    "旗帜纹章与文字标识",
    "4.0.3a 后被犁毁的焦土地貌",
]

