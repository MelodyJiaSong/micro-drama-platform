# 凯尔达隆 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 岛心 ≈ 本图 (380, 310) ≈ 区图 [70, 73]；岛身与桥长按区图裁切（≈3.92 m/px，同区级 terrain.toml 换算）量取。
# 画法：floor plan 的水只能画成宽折线且盖在岩台之上，所以湖面拆成「贴岛一圈（南端留口）+ 外延 + 南湾两段夹着石桥」，免得把岛尾和南岸盖掉。

[meta]
bg = "bg378"
name_zh = "凯尔达隆"
size_m = [760, 720]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "岛身约 400 × 420 m、南端石桥约 70 m，从原版区图（1002×668 px，≈3.92 m/px）量取；岛上建筑的位置与尺寸为推定（区图只给城堡在东北、民居在西南两枚图标）"
# 世界树画面：湖心孤岛上的城堡废墟，只剩外墙与几根断柱，岛上飘着半透明的幽灵村民，一条石桥从岸边通上岛
absent = ["湖滩、码头与船只（岩壁直插水中，无处登岸）", "第二座桥与任何涉水通道（南端石桥是唯一通道）", "完整的城堡屋顶、楼板与塔顶", "火光、烛火、灯笼与门洞里透出的光", "幽灵村民、亡灵与门内的幽绿光幕（属 shot 层）", "地底学院的内景（另立 bg）", "鲜绿草地与茂密绿林", "4.0.3a 后新加的营地、据点与飞行点", "飞行坐骑与任何空中交通", "训练假人"]

