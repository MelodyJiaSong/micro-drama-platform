# 哭泣之洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级 terrain.toml 坐标 (2420, 900)；洞口 ≈ 本图 (140, 120) ≈ 区图 [65, 39]。
# 洞内三块（通道 / 主洞厅 / 后口）在山体之下，h_m 记的是洞内净高，不是地面以上的高度。

[meta]
bg = "bg381"
name_zh = "哭泣之洞"
size_m = [320, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "洞口点位、山嘴、洞前岩坎与河道从原版区图（1002×668 px，≈3.92 m/px，同区级 terrain.toml 换算）及裁切图量取；洞内通道、洞厅与后口的尺寸与走向为推定（区图只有一枚洞口图标）"
# 世界树画面：岩壁下的低矮洞口，洞内常年滴水，地面积着浅水洼，钟乳上挂着灰绿色黏液
absent = ["火把、营火、烛火、灯笼与任何人工光源", "发光的晶体、菌类或黏液", "地下河、瀑布与深潭（洞里只有浅水洼与细流）", "第二个通到外面的洞口", "洞外的路、营地与任何建筑", "亡灵、人物与任何动物（属 shot 层）", "鲜绿草地与茂密绿林", "4.0.3a 后新加的营地、据点与飞行点", "训练假人"]

