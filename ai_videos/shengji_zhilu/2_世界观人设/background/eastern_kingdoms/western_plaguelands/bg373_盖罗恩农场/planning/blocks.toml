# 盖罗恩农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 换算：本图原点 ＝ 区图像素 (595, 345)，区图 1 px ≈ 3.92 m（同 bg369 terrain.toml）。区图上房屋图标在 (646, 375)，
# 点格篱笆斜方园四角约 (627, 371) / (647, 391) / (627, 406) / (610, 389)；主干道从西侧来、在场地西北弯向东北；
# 房屋东与东南紧贴山块（山块另一侧是索多里尔河），西南角下坡是湖北岸。世界树写「东北角」，区图实为区东半、湖北岸，以区图为准。
# 院中大锅 / 工具棚的摆位与尺寸推定。锚点机位：主干道弯道外侧 (110, 70)，朝东南。原点左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg373"
name_zh = "盖罗恩农场"
size_m = [300, 300]
px_per_m = 4.0
grid_m = 50
scale_src = "地图量取"
scale_note = "房屋图标、斜方果园四角、主干道、山脚线与湖岸按区图量取（1 px ≈ 3.92 m）；院内建筑尺寸与大锅摆位推定"
# 世界树画面：东北角最偏的一座农庄，果园的树全枯成黑色枝杈，院中大锅下的火还没灭
absent = [
    "锅底以外的任何火、烛火、灯笼与窗火",
    "带叶的果树、结着好果的枝头、鲜绿草地",
    "谷仓、院墙、石墙、塔楼",
    "画面里的河（被山块挡住）",
    "稻草人（远看像人影）",
    "任何人物、亡灵、牲畜与乌鸦",
    "文字招牌与木牌",
]

