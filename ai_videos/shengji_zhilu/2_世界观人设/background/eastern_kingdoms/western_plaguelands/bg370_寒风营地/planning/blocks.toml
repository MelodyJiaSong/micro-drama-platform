# 寒风营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 区图裁切 ref/bg370_寒风营地_map_crop.png：南路从西北弯过来，在点位东侧拐成一条南北向直路钻进山口，路西是西南界山坡脚、路东是另一道山肩。
# 营地本体约 90 × 80 m 居中偏西；帐篷 / 栅栏 / 拒马 / 栖架的尺寸与位置全部推定。
# 锚点机位：营地北侧大路边略高处 (135, 30)，朝正南。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg370"
name_zh = "寒风营地"
size_m = [240, 220]
px_per_m = 4.0
grid_m = 20
scale_src = "推定"
scale_note = "区图上路与两侧山肩的相对方位按裁切图量取；场地边长、营地本体 90 × 80 m 与全部帐篷尺寸为推定"
# 世界树画面：山口处一圈帆布军帐与木栅，中央一堆常燃的篝火，帐外堆着补给箱与拒马
absent = [
    "石墙、塔楼、石砌营房（那是 4.0.3 改名冷风哨站之后的样子）",
    "第二堆火、火把、灯笼、烛光与窗火",
    "旗帜上的纹章与任何文字招牌",
    "鲜绿草地与茂密绿林",
    "河流与湖面",
    "栖架上的飞禽与坐骑",
    "任何人物与动物",
    "训练假人等 4.0.3a 元素",
]

