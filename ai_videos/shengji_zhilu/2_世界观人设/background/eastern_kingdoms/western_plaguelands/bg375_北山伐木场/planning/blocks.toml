# 北山伐木场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg375"
name_zh = "北山伐木场"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "从原版区图量取（1002×668 px，≈3.924 m/px）：场地左上角 ＝ 区图 px (440, 180)，伐木场图标 px (481, 215)；谷底宽约 53 px（≈210 m），北、西、东三面山影、向南敞口。营内逐件布局无一手出处，推定"
# 世界树画面：山腰上的伐木营，倒伏的原木堆成小山，锯架与木屋散落在被砍秃的林地里
# 区图：北路在东侧山脊另一面（区图 px x≈545），与营地不直接相连；营地只向南敞口通盆谷中部
absent = [
    "河流、溪水与任何水面",
    "石屋、围栅与寨墙（全营只有木构）",
    "封闭厂房与水车（锯木棚是开放式棚架）",
    "新砍的白茬木头与鲜绿树林（全是枯木与灰色旧木）",
    "火堆、火把、灯笼与冒烟的烟囱",
    "任何人物、亡灵、伐木工与驮兽（默认空营）",
    "文字招牌",
    "大灾变后新增的营地、据点与飞行点",
]

[[ridge]]
name = "北坡（未砍的枯林把山谷封死）"
poly = [[0, 0], [300, 0], [300, 30], [200, 45], [100, 38], [0, 50]]
height_m = 100
src = "地图量取"

[[ridge]]
name = "西坡（被砍秃的缓坡，坡顶部分）"
