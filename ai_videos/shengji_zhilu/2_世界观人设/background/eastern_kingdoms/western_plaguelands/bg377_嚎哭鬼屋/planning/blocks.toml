# 嚎哭鬼屋 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg377"
name_zh = "嚎哭鬼屋"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "从原版区图量取（1002×668 px，≈3.924 m/px）：场地左上角 ＝ 区图 px (490, 392)；点格菱形田块约 37 px 宽（≈145 m 对角）、农舍图标 px (545, 430)、南侧陡坎齿线 px y≈455–465、湖西湾岸线 px x≈565。农舍 / 谷仓 / 锅的逐件位置无一手出处，推定"
# 世界树画面：一处被鬼影缠住的农庄，谷仓门大敞、屋里浮着惨绿的光，院中大锅旁排着一列尸堆
# 尸堆与鬼影按「底图无人物」不入本档；东西主干道在场地北边外约 60 m（区图 px y≈375）
absent = [
    "大锅下燃着的火与升空的绿烟（默认态柴灰冷透，活火态由 shot 层条件化）",
    "尸堆、鬼影、亡灵与任何人物动物",
    "完好的屋顶与有人住的迹象",
    "火把、灯笼与任何人工光源（窗里惨绿微光是唯一非天光）",
    "鲜绿草地、庄稼与果园",
    "石砌围墙与院门",
    "文字招牌",
    "4.0.3a 后的改名与新布局",
]

