# 安多哈尔废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg376"
name_zh = "安多哈尔废墟"
size_m = [560, 460]
px_per_m = 2.8
grid_m = 50
scale_src = "地图量取"
scale_note = "从原版区图量取（1002×668 px，≈3.924 m/px）：场地左上角 ＝ 区图 px (372, 395)；环城土坎（晕渲齿线）、北来大路与城心两条岔路、四个建筑图标、南侧长水塘与西南小湖都按图量取。钟楼、粮仓、民居的逐件位置无一手出处，推定"
# 世界树画面：一整座被烧空的人类城镇废墟，石墙焦黑、屋顶塌尽，街巷间立着倾斜的钟楼与成排的粮仓残架
# 区图：嚎哭鬼屋在东北土坎之外（场地外）；东南路通悔恨岭，西南路绕小湖通寒风营地
absent = [
    "重建完好的城镇、新城墙与营地（4.0.3 重建改名后的样子）",
    "任何完整屋顶与新建筑",
    "正在燃烧的火、冒烟的废墟与发红的余烬（烧痕全是多年旧痕）",
    "火把、灯笼与任何人工光源",
    "天灾的通灵塔等亡灵建筑（属 shot 层或另立 bg）",
    "任何人物、亡灵、尸骸与动物（默认空城）",
    "鲜绿草地与茂密绿林",
    "旗帜与文字招牌",
]

