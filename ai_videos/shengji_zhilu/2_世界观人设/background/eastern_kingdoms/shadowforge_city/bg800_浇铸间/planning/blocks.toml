# 浇铸间 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（浇铸间＝西熔岩带与北熔岩湖之间、南北长、北端带圆圈的厅）：东北口通召唤者之墓，东南口回魔法之厅。
# 圆熔炉取区图北端的圆圈；铁水槽、模架、空壳列无一手尺寸，全部推定。

[meta]
bg = "bg800"
name_zh = "浇铸间"
size_m = [80, 80]
px_per_m = 16.0
scale_src = "推定"
scale_note = "1.12 副本无区图；车间 47×51 m 取自区级平面图 bg246 块 b911（上层区图量取，尺度本身推定），东北、东南各留一段甬道"
# 世界树画面：低矮的铸造车间，铁水槽与铸模架排成几列，熔炉口喷出的橙光在黑铁魔像的躯壳上跳动。
absent = ["天空、日光、月光与任何天气（山腹室内）", "熔岩与熔岩沟（车间两侧是实心岩，看不到熔岩）", "铁水槽里流动的铁水（默认停浇态）", "火盆与铁壁灯（唯一光源是圆熔炉）", "窗户与天井", "任何植被与水面", "人物、工匠、活动的魔像与动物（停浇空场态，属 shot 层）", "高大空间与高穹顶（岩顶只有约六米）", "文字与招牌"]

