# 暗炉城（shadowforge_city）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪 / 长墙栏杆 / 桥 / 洞口甬道 / 凿进岩体的台阶平台与厅壳走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库（新立 17 件）。
# bg246（区级主体 zone_whole）不在判定范围。193 条 use：脚本 98、资产 95。
# 去重（白模剥材质、按剪影共用）：a02 魔像兼银库石魔像 / 铸造车间铁魔像空壳 / 机械车间吊架骨架；a03 兼暗柜门与门锁箱；
#   a04 铁门兼全区带门扇的门（巨门、封门、侧门、桥头门框）；a05 落地火盆兼墓室壁挂火盆；a06 方柱兼全区巨柱与仪仗通道壁柱；
#   a07 民居兼街东矮屋；a10 武士巨像兼西兵营铁甲像；a14 圆熔炉兼小熔炉与井底锻炉。
# judgment calls：
#   整间厅（酒馆大堂、王座殿、仪仗通道、讲堂、两座车间、酿酒间、王座殿壁龛）走 chamber（室内壳，image-to-3D 给不出可进入的内部）；
#   h_m=0 的地面块（库心方石、墓室地面与圆纹、烧斑、铁水槽、东西臂死端壁龛、台阶口）走 plaza；
#   凿在岩体里的台阶 / 平台 / 回廊 / 石席 / 回旋梯段走 rock_shelf（stair 是绕柱旋梯，形制不符）；
#   无门扇的门洞、隧道口、岩壁上的火红旋涡走 cave_mouth；有进深的甬道走 tunnel；桥墩列走 arch_bridge（墩＋拱，免得方柱 count 按 20 m 原高穿出桥面）；
#   射击孔岩廊、铁栏观台、平台铁栏杆、东墙浮雕、干涸水槽走 low_wall；纪念碑走 altar；吧台 / 工作台 / 木桌群走 tables；酒桶墙 / 铸模架 / 通铺 / 兵器架走 shelves；
#   零件堆 / 模具砂箱堆 / 石料车走 crates，碎石山与塌缺垛口的落石走 boulders。
# ⚠ bg804 平台上的块（阶顶火盆 b08/b09、栏杆、通铺、兵器架）h_m 写的是距下庭的顶标高，单件逐轴撑满会被拉高——建 blend 时留意。

