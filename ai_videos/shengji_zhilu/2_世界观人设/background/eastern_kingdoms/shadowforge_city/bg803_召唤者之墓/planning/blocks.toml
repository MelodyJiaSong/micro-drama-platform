# 召唤者之墓 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（墓室＝北部带放射状凹臂的灰色圆厅）与 bg246 块 b914 及三条接出道路：
#   西南口下坡往浇铸间（来路）· 东北口斜甬道往讲学厅 · 东南偏东口出去是熔火之桥。
# 圆厅按十等分排位（方位角自正北顺时针）：三门 54° / 126° / 234°，七具石棺 18° 90° 162° 198° 270° 306° 342°，四只壁挂火盆在 0° 108° 180° 288° 的龛间墙垛上。
# 等分排位、直径、穹顶高度均无一手尺寸，推定。

