# 熔火之桥 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位据上层区图 WorldMap-BlackrockDepths1.jpg（桥＝召唤者之墓东臂斜向东南、终点画旋涡图标的通道）；长度与走向取区级平面图 bg246 块 b912（81 m、rot 46，即桥向东南约 45°）。
# 本场地没有真正的水：[[water]] 是熔岩湖（名字带「熔岩」），借水系折线填面。桥墩数与间距推定。

[meta]
bg = "bg801"
name_zh = "熔火之桥"
size_m = [130, 110]
px_per_m = 10.0
scale_src = "推定"
scale_note = "1.12 副本无区图；桥长 81 m、走向东南约 45° 取自 bg246 块 b912（上层区图量取，尺度本身推定）；熔岩湖范围与两端岩台推定"
grid_m = 50
# 世界树画面：横跨熔岩湖的黑石长桥，桥面被下方岩浆映成暗红，远端是一团旋转的火红传送门。
absent = ["天空、日光、月光与任何天气（山腹熔岩洞）", "河流湖泊里的水（湖里只有熔岩）", "任何植被", "桥上的火盆、壁灯与任何人工光源", "桥两侧的建筑与房屋", "第二条桥或岔路（桥是死路，旋涡之外不通别处）", "人物、守卫、火焰生物与动物（空桥态，属 shot 层）", "冷色光与电弧", "文字与招牌"]

