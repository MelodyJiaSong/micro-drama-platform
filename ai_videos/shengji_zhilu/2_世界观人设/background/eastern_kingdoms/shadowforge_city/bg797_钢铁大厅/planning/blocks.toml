px_per_m = 16.0
scale_src = "推定"
scale_note = "通道长约 70 m 取区级平面图 bg246 块 b908（地图量取的相对长度 + 推定尺度）；净宽 12 m 取 bg246 仪仗轴线；龛深、巨像间距与净高（约 24 m）推定"
# 世界树画面：短而高的通道，两侧并排立着巨大的黑铁武士雕像，雕像口中不时喷出火舌，地面被烤得泛红。
