# 黑色宝库 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 石库内净 30 × 24 m 摆在 (15–45, 10–34)；x=10–15 是西墙厚度，门在西墙正中；x=0–10 是门外南北向石廊。

[meta]
bg = "bg790"
name_zh = "黑色宝库"
size_m = [56, 44]
px_per_m = 24.0
scale_src = "推定"
scale_note = "1.12 副本无地图，黑色宝库只画在现行区图下层且无比例尺；库内 30 × 24 m、顶高 9 m 按「十二口齐腰宝箱贴墙、箱间一步」加四角魔像的占地推算，与区级图 b901（30 × 24 m）同尺"
# 世界树画面：厚重铁门后的密闭石库，四壁排着十二口铁箍宝箱，四尊石魔像立在角落，只有壁灯的暗红光。
absent = [
    "熔岩、熔炉与火盆（库内唯一光源是八盏铁壁灯）",
    "日光、天光与任何窗洞",
    "第二道门与穿堂过道（死胡同石库）",
    "发光的符文、魔法光与魔像眼光（默认态魔像静止）",
    "打开的宝箱与散落的财宝（默认态十二箱全合）",
    "任何人物、看守与动物",
    "木构件、挂毯与旗帜纹章",
]

