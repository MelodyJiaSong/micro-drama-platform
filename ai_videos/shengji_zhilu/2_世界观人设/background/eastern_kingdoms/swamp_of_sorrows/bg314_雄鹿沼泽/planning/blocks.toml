# 雄鹿沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1300, 880)；本图坐标 ＝ 区级坐标 − (1300, 880)。南墙、湖南缘、两条东南水道按区级 terrain.toml 平移裁切（地图量取）。
# 洞口：区图洞口符号 (66%,77%) 换算为本图 (84, 197)，落在区级南墙多边形内约 90 m（多边形在这段画得偏北）；
#       本图按「东南水道一」末端贴山脚取 (172, 190)，推定，待实机核。睡莲片、泥岛、枯木、碎石带一律推定。
# 锚点机位：b01 北部泥岛南岸浅水边，朝西南望洞口。芦苇岗哨（bg305）在机位左后方约 75° 外，不入画。

[meta]
bg = "bg314"
name_zh = "雄鹿沼泽"
size_m = [560, 400]
px_per_m = 2.5
scale_src = "推定"
scale_note = "山体与水道按区级平面图（区图 x%×20.974、y%×13.983 m）平移量取，但本 bg 的区级落点本身是推定；洞口、睡莲片、泥岛位置尺寸推定"
# 世界树画面：南部的浅水湿地，成片的睡莲与浮草，水下能看到游动的鳄鱼背脊
absent = [
    "水下或水面的任何动物（世界树里的背脊属 shot 层，底图不放）",
    "深水与黑水（这里水只到小腿到膝盖，茶绿透亮）",
    "洞口里的任何光、火与发光物（洞内全黑；洞内景另议）",
    "路、桥、木桩、栈道与任何人工搭建物",
    "滩头小木哨所（bg305，在机位左后方，不入画）",
    "火、烛火、灯笼、火把与任何人工光源",
    "阳光、投影与晴天",
    "焦土与赤红裂土（那是南山外的邻区，本档山墙是土黄裸坡）",
    "任何人物",
]

