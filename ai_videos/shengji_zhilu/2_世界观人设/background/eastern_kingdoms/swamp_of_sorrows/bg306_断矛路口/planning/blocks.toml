# 断矛路口 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地左上角 ＝ 区级平面图（bg303 terrain.toml）的 (300, 560) m；山嘴 / 三条路 / 中央水道由区级量取值平移，精度 ±20 m。

[meta]
bg = "bg306"
name_zh = "断矛路口"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "分岔点按区图 (17–21%,50%) 西路分成北路 / 东路处；西墙山嘴、三条路、中央水道起头从 bg303 terrain.toml 平移；断矛、水草丛、倒树无一手出处，断矛位置按世界树「路中央」"
# 世界树画面：沼泽中的泥路交汇点，路中央插着一支折断的长矛做路标，四面都是齐腰水草
absent = [
    "路牌、木指示牌与任何文字标记（唯一的路标就是那支断矛）",
    "石板路、铺装路面与路边石（三条路都是黑泥路）",
    "房屋、帐篷、营火与任何聚落设施",
    "桥（水道在两路之间起头，路不跨水）",
    "旗帜、纹章与阵营标识",
    "火、火把、灯笼与任何人工光源",
    "晴天硬光与长影",
    "任何人物、坐骑、动物与文字",
]

