# 忧伤湿地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1330, 150)；本图坐标 ＝ 区级坐标 − (1330, 150)。水道与北墙尾端按区级 terrain.toml 平移裁切（地图量取）；
# 本 bg 本身在区级是推定落点（世界树无坐标），碎岛、枯树列、汇流黑水潭、树桩一律推定。
# 锚点机位：b01 西南部窄小泥岛岛尖，贴水低机位，顺东北水网二朝东北望。农田避难所（bg304）在西缘外、泪水之池（bg312）在南缘外，都不入画。

[meta]
bg = "bg313"
name_zh = "忧伤湿地"
size_m = [600, 400]
px_per_m = 2.5
scale_src = "推定"
scale_note = "水道与山坡按区级平面图（区图 x%×20.974、y%×13.983 m）平移量取，但本 bg 的区级落点本身是推定；碎岛、枯树列、汇流潭位置尺寸推定"
# 世界树画面：北部最深的黑水区，水几乎没胸，死树成排站在雾里，水面漂着一层油亮的膜
absent = [
    "浅滩、沙洲与清水（这里水深近胸、黑亮不见底）",
    "泥路、木桥、木桩、栈道与任何人工痕迹",
    "开阔的湖面与湖心石庙（在南面，被雾与枯树挡住）",
    "海面与船（海在东面，只透出一线更亮的雾）",
    "睡莲、开花植物与任何鲜绿色（那是南部浅水湿地）",
    "火、烛火、灯笼、火把与任何人工光源",
    "阳光、光束、投影与晴天",
    "任何人物与动物（水下的背脊也不要）",
]

