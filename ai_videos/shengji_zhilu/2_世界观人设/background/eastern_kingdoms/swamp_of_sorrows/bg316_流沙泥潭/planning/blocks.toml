# 流沙泥潭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地左上角 ＝ 区级平面图（bg303 terrain.toml）的 (530, 480) m；北路 / 西口北水道 / 中央水道由区级量取值平移，精度 ±20 m。
# 泥潭本身的位置是区级 b912 的推定落点（北路与中央水道之间），场地东缘外约 5 m 起是斯通纳德高泥地（bg307），不入本图。

[meta]
bg = "bg316"
name_zh = "流沙泥潭"
size_m = [320, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级 b912 推定落点；路与水道从 bg303 terrain.toml 平移（地图量取），泥潭尺寸、泥眼、倒树、枯枝、巨树无一手出处，按世界树画面「会吞人的灰褐泥沼 · 薄壳 · 冒泡 · 枯枝斜插」铺陈"
# 世界树画面：一片会吞人的灰褐泥沼，表面结着薄壳，踩下去咕嘟冒泡，枯枝从泥里斜插出来
absent = [
    "黄沙 / 沙漠流沙 / 沙丘（这里的「流沙」是灰褐稠泥，不是沙）",
    "木栈道、踏板、桥与任何跨泥设施（泥潭只能沿北缘泥路绕行）",
    "路牌、警示牌、木桩标记与任何文字",
    "房屋、帐篷、要塞木栅、营火与任何聚落设施（东南外的高泥地要塞不入画）",
    "火、火把、灯笼与任何人工光源",
    "晴天硬光、太阳与长影",
    "鳄鱼、蛇、飞鸟与任何动物（活物属 shot 层）",
    "泥里的骸骨、陷进去的人或坐骑",
    "石板路 / 铺装路面",
    "任何人物、坐骑与文字",
]

