# 斯通纳德 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地左上角 ＝ 区级平面图（bg303 terrain.toml）的 (825, 640) m；区图坐标 [46,55] 落在本场地 (140,129)。

[meta]
bg = "bg307"
name_zh = "斯通纳德"
size_m = [280, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "裁切图约放大 2.9 倍（STONARD 字样对照原图），1 px ≈ 0.72 m：东北棚屋符号在红十字 (+49,-61) m、大厅符号 (+36,+11) m、西南棚屋符号 (-24,+30) m、飞鸟符号 (-14,-54) m；南山墙脚、东侧水道、中央水道从 bg303 terrain.toml 平移；栅墙、火塘、旗杆无一手出处，推定"
# 世界树画面：沼泽高地上的兽人要塞，粗木与兽皮搭的圆顶大厅，两座土制地穴入口，红旗插在泥岸边，四周是死水与枯木
# 区图：东路从西面进来，在红十字西侧上台地
absent = [
    "石砌城墙、石屋、石塔（全寨只有原木、兽皮与夯泥）",
    "第二个飞行点、狮鹫栖木与飞艇塔（旧世本区唯一飞行点就是这座双足飞龙栖架）",
    "栖架上的飞兽、坐骑、牲口（默认空寨）",
    "点着的火把、火盆、篝火与灯笼（火塘是冷灰，地穴口内是黑的）",
    "旗面上的纹章、徽记与文字（长旗是素面暗红）",
    "4.0.3a 后的重建布局与北部的联盟哨站",
    "晴天硬光与长影",
    "任何人物与文字",
]

