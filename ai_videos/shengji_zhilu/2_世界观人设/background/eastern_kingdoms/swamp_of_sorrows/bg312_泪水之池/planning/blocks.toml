# 泪水之池 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1186, 500)；本图坐标 ＝ 区级坐标 − (1186, 500)。湖面、水道、南墙按区级 terrain.toml 平移裁切（地图量取）；
# 石庙位置按区图图标 [71, 53] 量取，尺寸与台阶朝向、环湖泥岛、断柱头一律推定。
# 锚点机位：b01 西岸低泥岛水边，朝东望湖心石庙。东岸之外的芦苇海滩（bg310）与海（bg315）在场地东缘以外，只作远景。

[meta]
bg = "bg312"
name_zh = "泪水之池"
size_m = [600, 480]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "湖面与水道按区级平面图（区图 x%×20.974、y%×13.983 m）平移量取；石庙尺寸、台阶朝向、泥岛与断柱头位置为推定"
# 世界树画面：沼泽东部的大片深水湖，水色近黑，湖心隐约露出淹没神庙的尖顶与破损石阶
absent = [
    "湖面上的任何光：绿色召唤火、发光符文、从水下透出的光（那是副本内景）",
    "码头、栈桥、船只、木筏与湖心的任何浮桥",
    "湖岸的营帐、哨塔与任何新建木构（4.0.3a 后才有的营地一概没有）",
    "巨龙虚影、蛇形巨像与任何立在水面上的雕像全身（石庙只露顶层两层台基）",
    "火、烛火、灯笼、火把与任何人工光源",
    "晴天、阳光、投影与夕照",
    "清澈见底的水与沙底（湖水近黑，看不见底）",
    "任何人物、潜水者与动物",
]

