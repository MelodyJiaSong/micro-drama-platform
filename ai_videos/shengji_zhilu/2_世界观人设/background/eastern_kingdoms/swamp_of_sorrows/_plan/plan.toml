# 悲伤沼泽（swamp_of_sorrows）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 判据：贴地地坪（田格 / 泥岛 / 泥沙滩 / 睡莲浅水 / 泥潭 / 机位点，h_m≈0）→ yard；墙栅土堤 → low_wall / palisade；
#   洞口 → cave_mouth，洞厅 → chamber，洞壁岩龛 → rock_shelf；断柱头与翘出的方石是实心方体 → low_wall；
#   要塞门廊旁的木桶矛捆 → crates；bg310·b14 / bg314·b10 是芦苇岗哨的子区占地（几何在 bg305 自己的 blend）→ yard。
# 去重（白模只锁几何与剪影，rule 4d ①）：所有枯死巨树 / 枯树丛 / 枯树列共用 a01；倒树、浮木、漂木与贴地碎木杂物共用 a02；
#   崩落巨石 / 乱石坡 / 碎石带 / 压石堆 / 碎岩堆 / 洞内石柱共用 a13；四座小岛共用 a05；三处火塘共用 a10；
#   栈道 / 屋前平台 / 桩台共用 a07；长旗兼哨屋屋脊挂灯木杆（a17）；石庙顶层兼外圈石阶（a18）。
#   芦苇（人高）与水草（齐腰）分立：count 散布按资产自身尺寸，共用会把齐腰水草长成一人高、挡住视线。
#   荒田斜搭窝棚（a08）与避难营圆顶草棚（a09）分立：两张卡明写「别拍混」。

