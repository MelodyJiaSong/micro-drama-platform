# 教堂广场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 广场与大教堂的尺度取区级平面图 b901 / b902（地图量取）；各公共建筑的相对方位取世界树（原典方位），落点与尺寸推定。
# 广场按「北端大教堂、南缘运河」摆正成南北纵深；区图上它其实略斜，镜头方位以本图为准。

[meta]
bg = "bg269"
name_zh = "教堂广场"
size_m = [200, 190]
px_per_m = 7.5
scale_src = "推定"
scale_note = "区级平面图 b901 广场 159.5 × 85.9 m、b902 大教堂 92 × 67.5 m（地图量取）拼成 200 × 190 m 场地；两侧建筑尺寸推定"
# 世界树画面：一片开阔石铺广场，北端被一座多侧翼、多尖塔的巨大教堂立面完全统治，广场两侧是较矮的市政厅与孤儿院，衬得教堂更高
absent = [
    "持战锤的骑士雕像 / 刻名铭牌（4.0.3a 才替换掉教士纪念碑）",
    "大教堂后面的湖与公墓（4.0.3a 才加）",
    "港口、码头、泊船（3.0.2 才有）",
    "任何人物（市民、卫兵、教士、孤儿都属 shot 层）",
    "点亮的街灯、烛火、火盆（默认态白天零人工光源）",
    "矮人区的锻炉火光（本档只见东北屋顶上方的灰蓝薄烟）",
    "碑面文字、人像浮雕、可读招牌",
    "淤泥浅水运河、芦苇（4.0.3a 后）",
]

