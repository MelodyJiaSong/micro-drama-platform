scale_src = "地图量取"
scale_note = "谷地外廓与主路走向取 bg268 区级平面图（b910 184×135 m、入城主路、b913 城门，均为区图量取），本图原点 ＝ 区级图 (770, 570)；桥长宽、水道宽度、雕像间距无出处，推定"
