# 英雄谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。本图原点 ＝ bg268 区级图的 (770, 570)，主路走向、城门与谷地外廓取自区级图（区图量取）。
# 主路是一条西北—东南的直线：P(s) = (80 + 0.707 s, 48 + 0.707 s)，s=0 为岔口、s≈185 为城门；雕像 / 水面按它的法向对称摆。

