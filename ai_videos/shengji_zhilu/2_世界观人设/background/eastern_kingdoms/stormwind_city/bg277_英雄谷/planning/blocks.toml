# 世界树画面：城门内外一整块绿意盎然的天然盆地，一座宽阔石桥横跨谷底的窄护城水面，桥两侧立着远超真人尺度的巨型石雕像，主路尽头在雕像前分成左右两岔
absent = [
    "塔身焦黑爪痕、塔基震裂（4.0.3a 之后）",
    "被撞落进水里的雕像（旧世五尊全部立着）",
    "后期继任的骑马将军形象",
    "第二道城门（全城陆路只此一口）",
    "门内的巨弩（巨弩只在门外）",
    "倒挂在城门拱下的巨龙头颅（事件景观，默认态不挂）",
    "基座铭牌上的任何文字",
    "港口 / 码头",
    "人物、卫兵、马匹、动物",
    "夜景、火把、灯笼、人工光源",
    "飞行坐骑、训练假人",
]

