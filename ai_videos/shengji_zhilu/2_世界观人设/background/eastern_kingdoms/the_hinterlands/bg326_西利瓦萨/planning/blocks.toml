# 西利瓦萨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b921（区坐标 1089, 1359.5，推定：岔口西北的巨魔拱门图标）；原点 ＝ 区坐标 (939, 1209.5)。
# 三条路与南山墙山脚从 bg317 terrain.toml 平移换算（地图量取）；遗址内每一块都是推定（原典只给「围起的坡地、低矮石墙、破损石雕、落叶」）。

[meta]
bg = "bg326"
name_zh = "西利瓦萨"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.513 m（bg317 terrain.toml）；场地 300 m 见方把东北的三岔路口与西南的南山墙山脚都框进来；遗址本体约 56 × 44 m，其尺寸为推定"
# 世界树画面：林间一块被围起的坡地遗迹，低矮石墙与破损的巨魔石雕半埋在落叶里
absent = [
  "研究站 / 帐篷 / 工作台 / 考古脚手架 / 挖掘探方（4.0.3a 在原址改建的版本）",
  "石拱门 / 柱列 / 塔楼 / 多层石台（这里只有矮围墙与一道石坎）",
  "营火 / 火盆 / 火把 / 灯笼 / 任何人工光源",
  "湖面 / 河流 / 溪水（最近的湖在北面和东面各三百米外，林中看不到）",
  "雪 / 冰 / 沙漠 / 熔岩 / 瘟疫化枯林",
  "秋季满树红黄叶（林冠仍是暗绿，落叶只在地上）",
  "人物、野兽、鸟等任何活物（属 shot 层）",
]

