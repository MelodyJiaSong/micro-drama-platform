# 鹰巢山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 地图量取口径：区图 1 px ≈ 3.5 m（区级 terrain.toml 同一换算）；十字 [14, 48] 落在本图 (170, 170)。

[meta]
bg = "bg318"
name_zh = "鹰巢山"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：主堡图标在十字西北约 70 m、柱廊长屋图标在十字以东约 90 m、之字路从西南角盘上（区图 1 px ≈ 3.5 m）；屋宇尺寸为推定"
# 世界树画面：建在山脊高处的矮人聚落，圆形石屋与木廊桥连成一串，狮鹫在崖边盘旋，脚下是整片墨绿林海
absent = [
  "第二个进镇口（旧世只有西南之字路一条）",
  "向东直通谷心的大路（区图上山镇与谷心之间没有画路）",
  "石砌城墙 / 城门楼 / 护城河（山镇靠断崖自守，没有环城墙）",
  "港口 / 河流 / 湖面（山肩上没有水体）",
  "雪线 / 积雪（温带高地林海）",
  "农田 / 风车 / 牧场",
  "燃着的火盆 / 灯笼 / 冒烟的烟囱（默认态白天零人工光源）",
  "飞艇 / 任何飞行器",
  "狮鹫 / 矮人 / 任何人物与动物（属 shot 层）",
  "旗帜纹章与任何文字",
]

