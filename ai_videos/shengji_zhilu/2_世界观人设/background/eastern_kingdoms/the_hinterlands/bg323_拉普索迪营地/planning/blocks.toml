# 拉普索迪营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标、区图无图标：营地在区里的位置不认定。原典只给「溪边 · 一顶帐篷 · 一堆篝火 · 几只酒桶 · 工具散在地上」，
# 其余（溪的走向、林墙、缓坡、每件东西的摆位）全部推定。

[meta]
bg = "bg323"
name_zh = "拉普索迪营地"
size_m = [120, 120]
px_per_m = 8.0
scale_src = "推定"
scale_note = "单帐篷营地本身约 20 m 见方（按帐篷、篝火、酒桶的常规尺寸推定）；场地取 120 m 把溪与四面林墙框进来。区内位置待核"
# 世界树画面：溪边的小营地，一顶帐篷、一堆篝火与几只酒桶，矮人的工具散在地上
absent = [
  "房屋 / 木屋 / 棚屋 / 栅栏 / 寨墙（营地只有一顶帐篷）",
  "第二顶帐篷、马车、货车",
  "桥（溪上只有垫脚石）",
  "远景天际线、山峰、湖面、海（营地四面是林墙）",
  "亮着的篝火 / 火把 / 灯笼（默认态冷灰余烬）",
  "雪 / 沙漠 / 枯黄死林（营地是苍翠潮湿的林谷）",
  "人物、驮兽、任何动物（属 shot 层）",
]

[[ridge]]
name = "东侧林坡"
poly = [[96, 0], [120, 0], [120, 120], [102, 120], [90, 88], [94, 50]]
height_m = 8
src = "推定"

