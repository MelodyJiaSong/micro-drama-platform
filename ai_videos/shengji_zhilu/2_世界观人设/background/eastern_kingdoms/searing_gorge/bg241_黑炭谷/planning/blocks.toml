# 黑炭谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg241"
name_zh = "黑炭谷"
size_m = [300, 260]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级图 b903 为 120×100 m 的洞口块（地图量取 ≈413,1100）；本图外扩到 300×260 m，把整条东北→西南走向的侧沟框进来。沟宽、崖高、洞口尺寸均按卡内描述推定，无一手出处"
# 世界树画面：崖壁上熏得全黑的洞口，洞内岩壁像木炭一样酥脆，深处透出微弱红光
# 区图：盆地西南山体里的洞穴图标，制皮匠营地（bg239）西南约 250 m；沟口朝东北对着盆地西南角
absent = [
    "任何人物、动物",
    "火、火把、篝火、灯笼、火星、冒烟（熏黑是多年前的旧痕，早已冷透；洞底暗红微光是天光以外唯一的光）",
    "任何建筑、寨墙、帐篷、营地设施（只有几截朽木撑与锈铁皮桶的残骸）",
    "任何水体、雨水痕、植被与绿色",
    "西南尽头墙以外的出口（洞是沟的终点，只有东北沟口敞开）",
    "蓝天、月光、雨雪",
    "4.0.3a 之后的任何改动",
]

