# 灼热峡谷区级资产规划（区级资产规划师写；tools/apply_asset_plan.py 只读）
# 新立 19 件（额度上限）；成片的块用单体 + count 散布。blend 里材质会剥掉，所以按「形状」复用：
#   铁皮棚屋兼工具棚 / 坑沿营棚，圆肚高炉兼脊上熔炉，平顶条石屋兼石营房 / 两处无名石哨屋，
#   木人字吊架兼挖掘营西界一角，锥形废石堆四处共用，翻倒矿车兼散架手推车，
#   崩落巨石兼挡风巨石 / 半埋岩块群 / 山墙脚碎岩裙，焦黑枯桩兼烤裂木桩，
#   倒伏原木兼横倒枯桩 / 倒伏焦木 / 刮皮圆木，铁箍木桶兼侧倒空桶 / 营房前铁桶，
#   铁砧石槽兼坩埚铁锭模，锈铁轨残骸兼洞口遗留物 / 灰下半露残骸。
# 全区八个 bg 都「暂无排镜」，所以按去重硬要求激进合并；等排镜真拍到某件、形制又对不上时再另立。
# judgment calls：
#   - 岩台 / 土坎 / 坡头 / 开凿面 / 碎屑坡锥 / 扇形缓坡 / 观坑岩嘴 / 石阶顶 / 谷口低岩 走 rock_shelf（地形，不是有界物体）；
#   - h_m ≤ 0.5 的地面标记（露天坑底、碎石斜坡、自燃火点地缝、余烬点、灰坑、沙垄 / 灰垄带、干沟、熔渣舌、坑沿、碎石槽）走 plaza；
#     下陷写在 blocks.toml 的 note 里，引擎按地面块处理；自燃火苗与余烬的光由卡与光线写，不进网格；
#   - 熔岩坑 / 熔渣池 走 pool；矿坑上的原木排架栈桥走 arch_bridge（线性跨越件）；
#   - 对崖方形矿洞口 / 木框试掘洞 走 mine_portal；熏黑洞口走 cave_mouth、洞内通道走 tunnel；
#   - 黑石圈火塘走 campfire（石圈 + 柴堆，形制吻合）；省下的额度给岩台唯一上下通道——之字形木坡道（没有能用的 kind）；
#   - 弯道小平台（待运矿石与空箩筐）走 yard；
#   - bg245·b14「挖掘营西界一角」只露吊架与碎石堆，用木吊架 ×2 表达。

