# 大熔炉 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ≈ 区级平面图 (840, 480)。坑口 ≈ 椭圆，中心 (240,215)、半轴 170×135 m（x 70–410、y 80–350），坑深约 100 m；
# 平面图画不出凹陷：坑口不画线，由螺旋坡道（外圈 ≈ 坑口、内圈 ≈ 坑底边）读出碗形。坡道点列按
#   r = 0.93→0.43、2.5 圈、顺时针、中心 (240,215)→(240,250) 生成。
# 区级 terrain.toml 的熔渣河落在坑壁中段、与坑底对不上——本档把它平移到坑底，记推定。
# 锚点机位：北沿观坑岩嘴 b17（≈236,76），离坑口两人高，朝正南俯瞰。

[meta]
bg = "bg244"
name_zh = "大熔炉"
size_m = [480, 400]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "坑口外廓、营棚群、坑内哨屋与主干道按区级平面图（区图 px×2.0362 m）平移量取；坑深、台阶级数、坡道圈数与坑底布置为推定"
# 世界树画面：峡谷中央巨大的圆形下沉矿坑，像一口锅，坑壁盘旋着一圈圈作业平台，坑底是发亮的熔渣与火光
absent = [
    "人物、奴工、守卫与任何动物（空场）",
    "火把、篝火、灯笼、炉火与任何人工光源（营棚与哨屋不点火，唯一的暖光是坑底熔渣）",
    "悬在坑上的栈桥与飞行栖台（那是北谷聚落 bg240）",
    "水、积水、河、湖（坑底发亮的是熔渣，不是水）",
    "树、草与任何绿色植被",
    "坡道以外的上下通路（坑壁陡直，只有螺旋坡道）",
    "旗帜、纹章与任何文字标牌",
    "蓝天、白云、雨雪",
    "飞行坐骑与任何 4.0.3a 之后的设施",
]

