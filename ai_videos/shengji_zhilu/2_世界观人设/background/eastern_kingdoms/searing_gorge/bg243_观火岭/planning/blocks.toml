# 观火岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ≈ 区级平面图 (470, 560)。岩台、熔岩溪、西北支路、熔岩坑、岔口哨屋按区级 terrain.toml / blocks 平移量取；
# 区图上塔 / 营图标散在 33–44% × 52–62%，「排成一线」的主脊走向与塔炉逐座位置为推定。
# 锚点机位：主脊西端石阶顶 b17（≈195,128），离地一人高，朝东偏南顺塔列望向盆地。

[meta]
bg = "bg243"
name_zh = "观火岭"
size_m = [500, 400]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "岩台轮廓、熔岩溪、支路与两处区图图标按区级平面图（区图 px×2.0362 m）平移量取；主脊宽约 30 m、塔 9 m 见方、炉径 7 m 为推定"
# 世界树画面：西侧高地上的黑铁矮人营区，石砌哨塔与熔炉排成一线，岩脊上望下去是整条冒烟的峡谷
absent = [
    "人物、守卫、奴工与任何动物（空营）",
    "火把、灯笼、篝火与炉口以外的任何人工光源（哨塔上不挂火）",
    "旗帜、纹章与任何文字标牌",
    "木栅栏、帐篷、兽皮棚（本营全是石与铁）",
    "水、河、湖（脊脚发亮的是熔岩溪，不是水）",
    "树、草与任何绿色植被",
    "西侧的出入口（身后只有封死的西山墙）",
    "蓝天、白云、雨雪",
    "飞行坐骑与任何 4.0.3a 之后的设施",
]

