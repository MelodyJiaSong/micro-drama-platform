# 瑟银哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg240"
name_zh = "瑟银哨塔"
size_m = [300, 300]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级图 b240 为 220×220 m；本图外扩到 300×300 m，把北谷两侧谷壁与东南谷底的熔岩坑（区级 b911，相对岩台约东 134 m、南 146 m）框进来。岩台 120×90 m、高 25 m，栈桥 60 m，矿坑深 30 m 与各件尺寸均按卡内描述推定，无一手出处"
# 世界树画面：建在岩台上的黑铁矮人聚落，铁皮棚屋与高炉挤在一起，炉火把矮人的脸映成橘色，栈桥悬在矿坑上方
# 区图：盆地西北北谷（36%, 27%），夹在北山墙伸进盆地的两道岩脊之间，北面合拢、南面敞开
absent = [
    "任何人物、动物（栖台空着，默认空场）",
    "火把、灯笼、烛火、篝火、点亮的矿灯（唯一人工光源是西高炉炉口的炉火；东高炉熄火）",
    "石砌城墙、城门、寨墙（岩台四面是天然陡崖）",
    "南坡道以外的上下通道（栈桥只通对崖矿洞，不是出口）",
    "任何水体、植被与绿色",
    "蓝天、月光、雨雪",
    "4.0.3a 之后扩建的建筑与设施",
]

