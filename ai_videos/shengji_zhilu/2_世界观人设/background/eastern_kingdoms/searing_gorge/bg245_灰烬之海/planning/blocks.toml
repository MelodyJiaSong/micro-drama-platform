# 灰烬之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ≈ 区级平面图 (900, 800)。南 / 东山墙、黑山与主干道按区级 terrain.toml 平移量取；
# 区级的挖掘场块（bg238）东南角压在东山墙多边形里，本档只画其西界一角、往北让开，记推定。
# 平地内的枯桩、灰坑、余烬、岩块全为推定。锚点机位：主干道弯口南沿低土坎 b09（≈205,62），朝南偏东。

[meta]
bg = "bg245"
name_zh = "灰烬之海"
size_m = [480, 300]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "山墙轮廓、黑山与主干道按区级平面图（区图 px×2.0362 m）平移量取；平地北宽约 400 m、南北深约 200 m；灰层厚度（没过脚踝）按世界树画面"
# 世界树画面：一整片没过脚踝的灰白炭灰平地，踩上去会扬起灰雾，偶有暗红余烬在灰下闪一下
absent = [
    "任何建筑、营地与帐篷（东北角挖掘营只露西界一角）",
    "火苗、篝火、火把、灯笼与人工光源（唯一的暖色是灰下极弱的暗红余烬）",
    "熔岩、熔渣与红亮的流体",
    "水、积水、河、湖",
    "活树、草与任何绿色植被（只有烧成炭的枯桩）",
    "路以外的车辙与脚印（灰一吹就平）",
    "南面、东面的出入口（两道山墙完整无缺口）",
    "蓝天、白云、雨雪",
    "飞行坐骑与任何 4.0.3a 之后的设施",
]

