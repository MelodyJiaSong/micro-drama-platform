# 祖玛沙尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg171"
name_zh = "祖玛沙尔"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "世界树无坐标；遗址中心取区级平面图地图量取块 b905 (2521.3, 333.7)，场地原点 ＝ 区级 (2281, 134)。西侧北缘山地、东侧东北大山块按区级 terrain.toml 平移；北侧区界山墙与遗址内各块的位置尺寸均为推定。地势北高南低（台基比入口高约 20 m），平面图不画坡度"
# 世界树画面：东北高地上的巨魔遗迹群，阶梯式石台与图腾柱立在枯黄的坡地上
absent = [
    "任何人物与动物（默认空遗址）",
    "点燃的火盆、火焰、火星、炊烟、火把、烛火（白天零人工光）",
    "太阳、蓝天与直射硬光",
    "翠绿草地、茂密丛林、藤蔓覆盖的绿色神庙（这里是枯黄草坡）",
    "水面（坡脚只有一线脓液细裂口）",
    "东、西、北三面的出入口（只有南面一道坡道）",
    "帐篷、木屋、完好的屋顶（全是塌废的石构）",
    "飞行点栖架与飞行坐骑",
    "文字、路牌与旗帜纹章",
    "4.0.3a 后的任何改动",
]

