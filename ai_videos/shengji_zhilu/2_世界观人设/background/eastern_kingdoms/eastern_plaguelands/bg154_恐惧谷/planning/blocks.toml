# 恐惧谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg154"
name_zh = "恐惧谷"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (357, 574)，镇心落在 (200, 180)，即区级块 b903 的中心；主街（恐惧谷路）、西界山地东麓、中央山带北缘均按区级 terrain.toml 平移过来，±60 m。镇域约 240 × 120 m 取自 b903 的图标簇范围；每座屋的位置与尺寸无一手出处，全部推定"
# 世界树画面：最北端的废镇，被浓密的灰绿毒雾整个罩住，只能看见房屋的黑色轮廓
absent = [
    "任何人物与动物（默认空镇）",
    "火堆、火把、烛火、灯笼与亮着的窗（所有窗洞都是黑的）",
    "太阳、蓝天与直射硬光（天光被暗红云层和毒雾双重滤过）",
    "发光的雾（毒雾本身不发光）",
    "绿叶、草地与活树（果树与林子全部枯死）",
    "城墙、城门楼、塔楼与营帐（这是一座没有防御工事的村镇）",
    "第二个出入口（西头是死路，贴着山脚到头）",
    "文字、招牌、路牌与旗帜",
]

