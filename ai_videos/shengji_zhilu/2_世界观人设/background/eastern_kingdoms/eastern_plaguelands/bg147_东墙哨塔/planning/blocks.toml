# 东墙哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 坐标表点位 [67, 48] 落在本场地塔心 (96, 70)。区图（按 bg142 拟合框）塔图标正南约 20 px（≈80 m）有一道东西向深色裂沟 → 画在场地南缘。

[meta]
bg = "bg147"
name_zh = "东墙哨塔"
size_m = [200, 160]
px_per_m = 4.0
scale_src = "推定"
scale_note = "塔身 12 m 见方、约四层 18 m 按人类方石哨塔常规尺度推定；裂沟距塔约 80 m 为区图量取（±60 m）；东墙大门距塔 80 m 为推定（区图上无图标）"
# 世界树画面：东部大路旁的石塔，塔顶垛口塌了一角，塔下是被压弯的木栅与散落的兵器
absent = [
    "任何人物、驻军、尸体与坐骑（默认空塔）",
    "飞行点栖架与飞行管理员（旧世四塔都不是飞行点，4.0.3 才是）",
    "塔顶旗帜、纹章与任何文字标识",
    "完整的城墙（门洞两侧只有齐腰矮墙残段）",
    "火、火把、火盆、亮着的塔窗与炊烟",
    "太阳、蓝天与直射硬光",
    "绿草地与活着的树",
    "门洞上的门扇",
]

[[ridge]]
name = "东北余坡（东北大山块的西南坡脚）"
poly = [[140, 0], [200, 0], [200, 60], [182, 44], [160, 22]]
height_m = 14
src = "推定"

[[road]]
name = "东部大路（西接考林路口方向，东出石门洞）"
path = [[0, 110], [50, 106], [96, 100], [140, 95], [178, 91], [200, 88]]
width_m = 7
src = "推定"
note = "世界树「东部大路旁」；区图上此段路被裂沟图案盖住，走向按两端连线"

