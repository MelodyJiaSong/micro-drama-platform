# 提尔之手 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b910（420 × 200 m，区图 66–78%, 59–66%）→ 本卡镇区取 360 × 220 m，镇心 (240, 190)。
# 区级「东部斜脊」多边形与 b910 重叠（示意精度），本卡把它当作镇西北外的一道坡。城内布局全部推定。

[meta]
bg = "bg156"
name_zh = "提尔之手"
size_m = [480, 360]
px_per_m = 3.0
scale_src = "推定"
scale_note = "镇区外廓按区级平面图 b910 的图标带（约 420 × 200 m）收成 360 × 220 m；城门数、教堂坐向、修道院位置按地理页描述推定，未实机核"
# 世界树画面：东南角一座保存完好的人类城镇，白墙红顶、街道整洁，血色十字军的红白旗挂满街口，中央是一座高耸的大教堂
absent = [
    "任何人物、骑兵、马匹与其它动物（默认空城）",
    "火盆、火把、烛火、灯笼与任何人工光源（教堂高窗是暗的）",
    "炊烟（烟囱全冷）",
    "旗面纹章、招牌与任何文字",
    "东墙与南墙上的城门",
    "港口、码头、船（海在东面约 580 m 外，只是远景一线）",
    "焦土裂口的绿脓（镇内地面是干净的石铺街）",
    "4.0.3a 后镇北平原上的新农庄与新聚落",
    "太阳、蓝天、直射硬光",
]

