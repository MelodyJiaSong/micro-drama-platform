# 玛瑞斯农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b909（区图 22, 63）院心 (938, 1785) 落在本场地 (130, 110)；本场地原点 ＝ 区级 (808, 1675)。
# 西路、西南山麓按区级平面图同名要素平移量取；院内布局与田块全部推定。

[meta]
bg = "bg155"
name_zh = "玛瑞斯农场"
size_m = [260, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "院心与西路 / 西南山麓的相对位置由区级平面图（区图 _c60 拟合）量取；院子 70 × 60 m、农舍 16 × 11 m、放射田块尺寸按洛丹伦乡间农庄常识推定，未实机核"
# 世界树画面：荒原上一座还立着的两层农舍，木栅围出的院子里拴着几匹瘦马，屋内点着灯
absent = [
    "任何人物、马匹、猎犬与其它动物（默认空院，拴马杆空着）",
    "火堆、营火、炊烟（烟囱是冷的）",
    "除一楼窗内一盏油灯外的任何人工光源",
    "风车与磨坊（那是东部的布洛米尔）",
    "活的庄稼、绿草、绿树",
    "石砌围墙与塔楼（院子只围木栅）",
    "河流与湖面（河桥在西面约 580 m，本场地任何机位都看不到水）",
    "太阳、蓝天、直射硬光",
    "文字、招牌、旗帜纹章",
]

