# 斯坦索姆 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg164"
name_zh = "斯坦索姆"
size_m = [640, 420]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (758.3, 281.2)，城墙圈 440 × 160 m 即区级块 b901（地图量取），落在 x 100–540、y 100–260；东南转角 (540, 260) 与 bg163 的城墙转角同一点。病木林路 / 恐惧谷路按 bg142 terrain.toml 平移、分岔口南移约 60 m（框差内）；北缘区界山按 terrain.toml 裁入。墙高、塔高、门位与塔楼位置无一手尺寸出处，推定"
grid_m = 50
# 世界树画面：北部一整座被高墙围死的城，墙内是黑紫色的街区与腐臭的橙色浓雾，塔楼顶端飘着天灾的绿火
absent = [
    "任何人物与动物（默认空城墙、空门前）",
    "墙外看得见的街面、街市与行人（墙高截断视线，只见屋顶以上）",
    "敞开的正门（默认两扇紧闭；侧门半掩但在东墙、本机位看不到）",
    "普通橙黄火焰、火把、烛火、灯笼、亮着的窗（唯一火光是三座塔顶的幽绿火）",
    "太阳、蓝天与直射硬光（天空是整层暗红云）",
    "浮空要塞（在城东南、机位身后，不入画）",
    "北墙与西墙上的门",
    "绿叶、草地与活树",
    "文字、路牌、旗帜纹章",
]

