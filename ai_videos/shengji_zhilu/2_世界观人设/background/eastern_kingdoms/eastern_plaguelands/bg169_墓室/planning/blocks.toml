# 墓室 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级平面图 b915（区图玛瑞斯农场正南一个陵屋样小图标，推定）落在本场地墓园中心 (70, 64)；该点在区级「西南山地」多边形内侧约 100 m，
# 即山地北麓的一个山坳——四周山坡按此推定。西路在北面约 150 m（场地外），小径向北出场地。

[meta]
bg = "bg169"
name_zh = "墓室"
size_m = [140, 120]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级块 b915 为 100 m 见方（推定）；墓园围墙 56 × 44 m、小陵屋 5–10 m 按人类乡间家族墓园常规尺度推定；场地外扩到 140 × 120 m 装下四周山坡"
# 世界树画面：南部一片下沉的家族墓园，石棺盖被掀开散落一地，围墙内立着几座小型陵屋
absent = [
    "任何人物、亡灵、骸骨、尸体与动物",
    "墓碑与陵屋上的任何文字、纹章（门楣刻字已被凿平）",
    "火、烛火、灯笼、长明灯与任何人工光源（地下墓室入口也不亮）",
    "地下墓室内部（本档只到铁栅门口）",
    "太阳、蓝天与直射硬光",
    "绿草、活着的树与鲜花供品",
    "北门之外的第二道院门（东墙塌口不是门）",
    "教堂、钟楼与大型石砌建筑",
]

