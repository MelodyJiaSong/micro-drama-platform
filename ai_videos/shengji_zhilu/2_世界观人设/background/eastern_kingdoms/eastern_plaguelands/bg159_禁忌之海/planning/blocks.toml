# 禁忌之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景段：区东缘南段（区图 x≈86–90%, y≈45–53%），东南残绿平原降到海的那一截；北端是东北大山块伸进海里的岩岬。
# 世界树没有坐标，区图上海岸只是一条示意线，场地内一切摆位都是推定。

[meta]
bg = "bg159"
name_zh = "禁忌之海"
size_m = [800, 500]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "区图上海岸线离东缘南北路约 3–4%（≈120–150 m，按区级 terrain.toml 的框差式换回）；滩宽、坎高、岩岬高度无一手出处，按区图山影与世界树画面推定"
# 世界树画面：东岸外的外海，海水颜色比南方更灰冷，近岸漂着从陆上冲下来的枯木
absent = [
    "港口 / 码头 / 栈桥 / 船 / 帆（旧世本区海岸无港，出入只有西面河桥）",
    "灯塔与任何岸上建筑",
    "对岸 / 岛屿（海天线上什么都没有）",
    "太阳 / 蓝天 / 直射光",
    "火 / 烛火 / 灯笼 / 任何人工光源",
    "沙质金色海滩 / 热带碧蓝海水 / 椰树",
    "大片健康绿地（坎后平原只剩残绿，本档只入坎顶一溜枯黄草）",
    "雪 / 冰",
    "人物 / 动物 / 海鸟 / 鱼群",
]

[[water]]
name = "外海（铅灰绿，低矮灰浪）"
path = [[545, 100], [545, 500]]
width_m = 510
depth_m = 15
src = "推定"
note = "水线在 x≈290；东界之外继续是海，看不见对岸"

