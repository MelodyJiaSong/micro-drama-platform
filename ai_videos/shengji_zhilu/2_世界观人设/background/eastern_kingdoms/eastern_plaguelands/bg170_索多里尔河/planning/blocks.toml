# 索多里尔河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区级 b920（区图桥位 7.5, 61.5 → 区级 (356.8, 1744.5)）；桥心在本图 (152, 210)，本场地原点 ≈ 区级 (205, 1535)。
# 本档是东岸那一侧（西岸那张是 bg382，形制对齐它：三孔石拱桥、西头塌顶岗亭、桥北东岸山坡压到水边、桥南两岸夹成峡口、东头山豁口）。
# 河道、大路、两侧山包按区图同名要素的相对方位摆；河滩、石阶、枯草坡、遗留物全部推定。
# 锚点机位：枯草坡上约 (235, 125)，离水面十二三米，朝西南（约 225°）俯看桥头、石阶、河滩与整座桥。

[meta]
bg = "bg170"
name_zh = "索多里尔河"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "河宽约 45 m 取区级 terrain.toml；桥长约 72 m 与 bg382 对齐；河滩、石阶、枯草坡与两侧山包的尺寸按区图桥位附近的山影形状推定，未实机核"
# 世界树画面：东岸一侧的河滩，河水浑灰，桥头石阶通向一片枯草坡
absent = [
    "任何人物、坐骑、亡灵与其它动物（默认空岸）",
    "第二座桥、渡口、浅滩与船（河上只有这一座桥）",
    "东岸桥头的岗亭、营帐、拒马与旗帜（岗亭只在西头，属 bg382）",
    "上游那间隐居小屋（位置待核，不入本档画面）",
    "任何火、火把、灯笼与人工光源",
    "瀑布、急流与跌水（本段河面平缓）",
    "鲜绿草地、活树与任何绿色植被",
    "太阳、蓝天、直射硬光",
    "4.0.3a 后新加的营地、据点与飞行点；飞行坐骑",
    "文字、路牌、界碑刻字",
]

