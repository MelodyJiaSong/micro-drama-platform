# 魔刃之痕 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图 (2300, 1150)；区级 b914 中心 (2665, 1490) 落在本场地 (365, 340)。
# 东路、东部斜脊、磨坊按区级平面图同名要素平移；裂谷主干 / 枝杈走向按区图树状图案量取；深度、宽度与谷内细节推定。

[meta]
bg = "bg167"
name_zh = "魔刃之痕"
size_m = [700, 800]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "主干长约 400 m 由区级平面图 b914（270 × 430 m）与区图树状图案量取；谷口宽 50 m、深 20–30 m、枝杈宽深均为推定，未实机核"
# 世界树画面：大地上一道被撕开的长条裂谷，谷底是翻涌的绿色脓浆，两壁的土是发黑的紫褐色
absent = [
    "任何人物、亡灵、软泥怪与其它动物（默认空谷）",
    "任何火、烛火、灯笼、人工光源（脓浆只有微弱荧光，不是光源）",
    "熔岩 / 发光的岩浆河（谷底是绿脓浆，不是岩浆）",
    "清水、溪流、绿草、活树",
    "桥梁、栏杆、栈道（唯一跨沟的是一棵天然倒木）",
    "房屋、围墙、营地、帐篷",
    "太阳、蓝天、直射硬光",
    "冒烟或发红的烧斑（旧烧斑早已冷透）",
    "文字、路牌、旗帜",
]

