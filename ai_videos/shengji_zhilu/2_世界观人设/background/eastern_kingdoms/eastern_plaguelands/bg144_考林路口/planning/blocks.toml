# 考林路口 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg144"
name_zh = "考林路口"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "四角四栋房子 + 路口的小镇核心约 80 × 80 m；场地取 200 m 以装下四条路的出镇段、西缘裂沟东沿与西北小山坡脚。路口在区级平面图 b907 [2160, 1650]（地图量取），本图原点 ≈ 区级 [2060, 1550]；无一手尺寸出处"
# 世界树画面：两条大路交汇处的小镇废墟，十字路口四角各一栋烧空的房子，路中央翻着一辆废弃货车
# 区级平面图：西路自正西来；北路朝北偏东；东路朝东北；东南路先南后东；瘟疫之痕 b913 东缘距路口约百米；中部小山在西北
absent = [
    "任何人物与动物（默认空镇）",
    "正在燃烧的房子、余火、火星与烟（火是多年前烧的，全部冷透）",
    "完好的屋顶、门窗与招牌文字（招牌架是空的）",
    "立着的、能走的货车（货车侧翻、轮子朝天）",
    "路牌与任何文字标识",
    "蓝天、太阳、直射硬光",
    "翠绿草地与活树",
    "南面的小湖（在场地之外，机位身后）",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "中部小山东南坡脚（锈红裸岩）"
poly = [[0, 0], [62, 0], [50, 26], [22, 40], [0, 44]]
height_m = 30
src = "地图量取"
note = "区级「中部小山」在路口西北；场地内只画坡脚一角"

[[water]]
