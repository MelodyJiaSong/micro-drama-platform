# 米雷达尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级平面图（bg142）的 (2000, 1640)；湖、路、山墙、营地与城墙都从区级 blocks / terrain.toml 平移过来。

[meta]
bg = "bg160"
name_zh = "米雷达尔湖"
size_m = [800, 480]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "区图湖面 (51–58%, 64–72%) 按区级 terrain.toml 的框差式换回世界树框 ≈ 300 × 220 m；东南路、南界山墙、营地（bg153）与城镇（bg156）的位置取自区级平面图；岸草、灌木、小岛尺寸推定"
# 世界树画面：东南部的大湖，水色比其他水面清一些，湖岸仍有零星绿草，对岸就是提尔之手的白墙
absent = [
    "码头 / 栈桥 / 船 / 渔网（静水湖，无人使用）",
    "河口与流水（湖不连任何河）",
    "大片健康绿地与茂盛树林（岸草零星、绿里夹黄）",
    "枯死芦苇荡（那是西南大湖 bg158 的标志，本湖没有）",
    "发光的绿色脓液（本湖水偏清，不带荧光）",
    "太阳 / 蓝天 / 直射光",
    "火 / 窗火 / 烛光 / 灯笼 / 炊烟（城与营地默认空、全暗）",
    "人物 / 骑兵 / 马 / 鸟",
    "雪 / 冰",
]

[[water]]
