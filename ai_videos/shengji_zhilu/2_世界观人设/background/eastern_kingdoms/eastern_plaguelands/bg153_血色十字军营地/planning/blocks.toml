# 血色十字军营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg153"
name_zh = "血色十字军营地"
size_m = [300, 300]
px_per_m = 5.0
scale_src = "推定"
scale_note = "世界树无坐标；营地中心取区级平面图推定块 b916 (2690, 1731) 再西移 30 m、北移 10 m（让出斜脊坡脚；b916 本身即推定），落在本场地 (150, 140)，场地原点 ＝ 区级 (2510, 1581)。东部斜脊西缘与东南大路按区级 terrain.toml 平移（±60 m）；营地规模按「一小片帐篷」推定为五顶方帐、约 64 × 52 m"
# 世界树画面：荒原上的一小片红白帐篷，中间竖着血色十字军的旗杆，外围是木尖桩与巡逻的骑兵
absent = [
    "任何人物、骑兵与马匹（默认空营，拴马横杆空着）",
    "燃着的火塘与炊烟（冷灰余烬）",
    "旗面纹章、徽记与任何文字",
    "房屋、石墙与城门（纯帐篷营）",
    "提尔之手的白墙红顶（被斜脊挡住，看不见）",
    "4.0.3 后的亡灵教派营地形态（紫黑帐、邪教符号）",
    "太阳、蓝天与直射硬光",
]

