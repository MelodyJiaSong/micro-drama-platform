# 蘑菇谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg166"
name_zh = "蘑菇谷"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (1019, 1028)，本场地中心对准区级块 b917（推定、位置未核：区图上只有山带、没画菌类图案）。北面主脊与东西矮坡按 bg142 terrain.toml「中央东西向山带」的走向推定；洼地尺度、南豁口、死水与三片菌伞均无一手出处，推定"
grid_m = 50
# 世界树画面：一整片长满巨型菌伞的洼地，菌盖呈病态的紫褐色，空气里飘满发光的孢子
absent = [
    "任何人物与动物（默认空谷）",
    "第二个出入口（东西北三面是坡，只有南豁口）",
    "道路、铺砌路面、桥（只有一道干冲沟穿出豁口）",
    "建筑、帐篷、营地、栅栏",
    "太阳、蓝天、直射硬光（天空是暗红云层）",
    "火、火把、营火、烛火、灯笼（孢子微光不照亮任何东西）",
    "自己发光的菌盖、荧光蘑菇林",
    "鲜红白点的童话毒蘑菇、蘑菇屋",
    "绿草地、清澈的水",
    "文字与标牌",
]

