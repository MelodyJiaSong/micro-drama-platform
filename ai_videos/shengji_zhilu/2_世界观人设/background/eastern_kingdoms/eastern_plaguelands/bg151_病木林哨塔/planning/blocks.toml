# 病木林哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg151"
name_zh = "病木林哨塔"
size_m = [360, 420]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (618.7, 595.3)，塔落在 (160, 160)，即区级自动块 b151 的位置；土路、山带北坡与东面黑色尖塔均按区级 terrain.toml / 区图量取平移过来，±60 m。塔本身尺寸（12 × 12 m、高 22 m）无一手出处，推定"
# 世界树画面：枯林中一座方形石塔，塔身爬满黑色霉斑，顶层的窗口透出绿光
absent = [
    "任何人物与动物（默认空塔）",
    "飞行点栖架、飞行管理员与飞行坐骑（四塔 4.0.3 才成飞行点）",
    "太阳、蓝天与直射硬光（天空是整层暗红云）",
    "火堆、火把、烛火、灯笼（唯一人工光是顶层北窗的一小团幽绿微光）",
    "绿叶、草地与活树（林子全部病死）",
    "第二座房屋、营帐或围墙（塔是单体，只有门前一圈半塌木栅）",
    "文字、路牌与旗帜纹章",
]

