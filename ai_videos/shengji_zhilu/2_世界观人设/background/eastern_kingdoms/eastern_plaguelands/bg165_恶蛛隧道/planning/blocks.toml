# 恶蛛隧道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg165"
name_zh = "恶蛛隧道"
size_m = [240, 240]
px_per_m = 6.0
scale_src = "推定"
scale_note = "场地原点 ＝ 区级平面图（bg142）坐标 (330, 640)。山体坡面按 bg142 terrain.toml「西界山地」东缘平移（地图量取，±60 m）；坐标表点 [15, 30]（区级块 b165）落在本场地 (201, 68)、与恐惧谷镇心同点，洞口按 bg154「洞口就在镇西山脚」推定在镇西头主街尽头往西约 30 m 的坡面上。隧道宽约 8 m、高约 7 m、直段 50 m 后左拐，均无一手出处，推定"
# 世界树画面：山体里被蛛丝糊满的隧道，洞壁挂着成串的茧，地面黏腻，深处有暗紫色的微光
absent = [
    "任何人物与动物（默认空洞，蛛怪不出镜）",
    "茧里露出的人形或肢体（只见裹紧的丝壳与撕开的空壳）",
    "火把、火盆、营火、烛火、灯笼（光源只有洞口天光与拐弯处的暗紫微光）",
    "开凿凿痕、木支架、铁轨、矿车（天然岩缝，不是矿道）",
    "铺砌的路面与台阶",
    "隧道另一头的出口（不在本场地，位置待核）",
    "发光的蛛丝、绿色荧光",
    "文字与标牌",
]

[[ridge]]
name = "西界山地（隧道所在山体，锈红裸岩坡朝东北）"
poly = [[0, 40], [127, 168], [157, 240], [0, 240]]
height_m = 140
src = "地图量取"
note = "bg142 terrain.toml「西界山地」东缘平移入本场地"

