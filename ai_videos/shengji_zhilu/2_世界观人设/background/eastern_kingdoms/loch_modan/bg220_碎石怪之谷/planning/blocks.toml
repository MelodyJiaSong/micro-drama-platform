# 碎石怪之谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 地形取自区级平面图 bg214 的 terrain.toml（区图量取）平移到本场地：本地坐标 ＝ 区坐标 − (640, 1080)；
# 三道山的边线按区图微调成连续的谷（区级几个多边形在这里本来就接不上）。洞口与谷底细节与锚点 prompt 一一对应。

[meta]
bg = "bg220"
name_zh = "碎石怪之谷"
size_m = [460, 480]
px_per_m = 3.2
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级平面图换算（区图 x% × 25.222 m、y% × 16.821 m）截取 [25.4–43.6, 64.2–92.7] 一块 460 × 480 m；原点 ＝ 区坐标 (640, 1080)"
# 世界树画面：西南一条乱石谷，谷壁裂出数个穴居人洞口，地上满是碎岩与粗糙的石制工具
absent = [
    "任何砌筑的建筑、木构、帐篷、栅栏与金属器物（这里只有石头敲出来、堆出来的东西）",
    "木框加固的矿洞口与矿车（那是北岸的 bg216）",
    "纵深洞厅与深层洞穴系统（4.0.3 才扩的；1.12 洞口几步就到黑）",
    "燃着的火、火把与洞内光源（冷灰堆早已冷透）",
    "湖面与任何水体（四面被山挡住）",
    "整片的松林（松树只零星长在山顶）",
    "住在洞里的生物与任何动物（属 shot 层）",
    "积雪",
]

