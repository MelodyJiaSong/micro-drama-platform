# 塞尔萨玛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg218"
name_zh = "塞尔萨玛"
size_m = [260, 240]
px_per_m = 6.0
scale_src = "推定"
scale_note = "裁切图（约 300 × 200 m 视野）量取：台地轮廓（约 85 × 90 m）、两枚建筑图标、主干道在台地西侧的走向与西南拐弯、东侧湖岸长条石崖、南面丘群；各建筑尺寸与台地外的民居 / 栖台 / 畜棚位置无一手出处，按原典功能清单推定"
# 世界树画面：湖西岸坡地上的矮人小镇，一排石基木墙的坡顶屋沿路展开，镇边一座敞篷狮鹫棚，屋后是马厩与铁砧
absent = [
    "任何人物、居民、守卫、狮鹫与牲畜（默认空镇、空栖台）",
    "燃着的炉火、冒烟的烟囱、亮灯的窗、火把灯笼",
    "带字的招牌与旗帜纹章",
    "港口码头与船（湖上没有航运）",
    "排干的湖床与决口的石坝（4.0.3 才有；旧世湖满坝完好）",
    "白石蓝瓦的人类式建筑",
    "训练假人等 4.0.3a 元素",
]

