# 奥加兹岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg215"
name_zh = "奥加兹岗哨"
size_m = [200, 180]
px_per_m = 6.0
scale_src = "推定"
scale_note = "裁切图（约 300 × 200 m 视野）量取两条路与岔口、营地背后弧坎、西北山体的相对方位；营地 52 × 42 m 与各帐 / 塔尺寸无一手出处，按「几顶军帐 + 一座瞭望塔」的驻防点常识推定"
# 世界树画面：山路边一处矮石墙围起的驻防点，几顶军帐加一座瞭望木塔，路障后站着披斗篷的矮人山地兵
# 区图：营地卡在北路（隧道南口来）与西北支路（北门小径来）之间，两路在营地东南汇合南下
absent = [
    "任何人物、守军与坐骑（默认空营）",
    "民居、旅店、商铺、铁匠铺（这是驻防点不是村镇）",
    "狮鹫与飞行栖架（本区唯一飞行点在主镇）",
    "湖面（被东侧石丘挡住，本档看不到湖）",
    "燃着的火、火把、灯笼（火塘是冷灰）",
    "旗帜纹章与任何文字标识",
    "训练假人等 4.0.3a 元素",
]

