# 国王谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 地形与道路取自区级平面图 bg214 的 terrain.toml（区图量取）平移到本场地：本地坐标 ＝ 区坐标 − (330, 1000)。
# 两尊王像：世界树只说「两侧崖壁雕着巨大的矮人王像」，没给位置——落点推定在谷最直的一段、隔路相对。

[meta]
bg = "bg221"
name_zh = "国王谷"
size_m = [400, 600]
px_per_m = 2.6
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级平面图换算（区图 x% × 25.222 m、y% × 16.821 m）截取 [13.1–29.0, 59.4–95.1] 一块 400 × 600 m；原点 ＝ 区坐标 (330, 1000)"
# 世界树画面：西南角一条笔直的石谷，两侧崖壁雕着巨大的矮人王像，谷底一条被车辙压实的商路直通南面山口
absent = [
    "城门、关卡、路障与收费亭（谷里只有路、两尊像、一座空哨屋）",
    "通往西南的石门（旧世有锁，不在本场地，不入画）",
    "像座上的刻字、符文、纹章与旗帜",
    "火盆、火把、灯笼与任何人工光源",
    "湖面、河流与任何水体",
    "积雪与雪线（残雪只在西侧山口的路面上）",
    "倒塌或残缺的王像（旧世两尊完好）",
    "行人、商队、驮兽与任何动物（属 shot 层）",
]

