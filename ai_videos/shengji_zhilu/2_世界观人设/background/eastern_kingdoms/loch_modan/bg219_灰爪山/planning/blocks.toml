# 灰爪山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 地形取自区级平面图 bg214 的 terrain.toml（区图量取）平移到本场地：本地坐标 ＝ 区坐标 − (860, 988)。
# 林中细节（爪痕老松 / 倒松 / 岩块 / 白桦带）区图不画，全部推定，与锚点 prompt 一一对应。

[meta]
bg = "bg219"
name_zh = "灰爪山"
size_m = [600, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级平面图换算（区图 x% × 25.222 m、y% × 16.821 m）截取以坐标 [46, 73] 为中心的 600 × 480 m；原点 ＝ 区坐标 (860, 988)"
# 世界树画面：南岸一道长满松林的缓岭，林下是厚厚的松针与倒木，常能看到熊与山猫在坡上活动
absent = [
    "任何建筑、木屋、帐篷、围栏（猎人木屋是东岸的 bg217，不在本岭）",
    "伐木桩、营火、火堆与任何人工光源",
    "尖锐岩脊与需要攀爬的陡崖（岭顶是缓圆的松林线）",
    "阔叶硬木林与秋色落叶（本区只有松与白桦）",
    "积雪与雪线（残雪只在西侧两条山口）",
    "熊、山猫与任何动物（属 shot 层）",
    "排干的湖床与裸露泥滩（4.0.3 才有；旧世湖是满的）",
    "石阶、路牌、栏杆等修整过的步道设施",
]

