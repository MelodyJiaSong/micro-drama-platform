# 北流谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：原点 ＝ 区图 px (360, 150)；x = (px − 360) × 3.83，y = (py − 150) × 3.83（与 bg247 同一比例）。
# 世界树坐标 [41, 29] → 区图 px (410.8, 193.7) → 本图 (195, 167)，落在洼地正中。

[meta]
bg = "bg261"
name_zh = "北流谷"
size_m = [440, 380]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算，3.83 m/px）；海岸线、北侧小山群与南岭从区图 px x 360–475、y 150–249 量取，洼地内的积水 / 骨滩 / 洞口位置为推定"
# 世界树画面：海岸边的洼地与一个洞口，遍地鱼人骨
