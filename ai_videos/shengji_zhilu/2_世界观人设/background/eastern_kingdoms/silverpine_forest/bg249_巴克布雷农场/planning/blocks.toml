# 巴克布雷农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原典只有「林边的小农场，两间木屋与南瓜地」，区图无点位 → 全部推定，局部坐标，不挂 bg247 坐标系。

[meta]
bg = "bg249"
name_zh = "巴克布雷农场"
size_m = [160, 140]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图无高亮块、坐标表无记录（客户端区域表有名、后被移除），位置与尺寸都没有一手出处；按「两间木屋 + 一块南瓜地」的小农场取 160 × 140 m 局部场地。排镜前须先在区图上定点位"
# 世界树画面：林边的小农场，两间木屋与南瓜地
absent = [
    "人物、牲畜与看门狗（默认态人去屋空）",
    "水井、谷仓、晾衣绳（本区另两处农庄的标志，本卡没有）",
    "稻草人与南瓜灯",
    "火光、烟囱冒烟与窗灯（白天零人工光源）",
    "饱满鲜亮的活南瓜与丰收景象（本区田地一律枯死）",
    "雪与积雪",
    "阔叶林与翠绿草地",
    "区级坐标（位置存疑，未挂 bg247 坐标系）",
]

