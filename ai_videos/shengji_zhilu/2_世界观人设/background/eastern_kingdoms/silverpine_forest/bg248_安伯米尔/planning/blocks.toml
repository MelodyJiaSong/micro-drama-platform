# 安伯米尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级 bg247 坐标 (2180, 1400)；山脊 / 村路按 bg247 terrain.toml 平移裁切，磨坊 / 石塔 / 农舍按区图图标量取。

[meta]
bg = "bg248"
name_zh = "安伯米尔"
size_m = [400, 360]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 3.833 m（bg247 WorldMapArea 换算）；场地取谷底盆地 400 × 360 m，原点 ＝ bg247 (2180, 1400)。坐标点 [61, 57] 落在北坡 (163, 59)；磨坊 / 城堡 / 农舍+田三枚图标在其东南谷底，按图标量取。民居八座的具体位置、溪流走向为推定"
# 世界树画面：山谷里的人类村落，石屋加木顶，中央一座水车磨坊，窗里透着灯火
absent = [
    "人物、牲畜与坐骑（默认态画面空无一人）",
    "烟囱冒烟、火堆、火把、灯笼与路灯（小窗里的暖黄灯光是唯一人工光源）",
    "桥（村路不跨溪，只在磨坊门前有一块压在水渠上的厚木板）",
    "环村城墙与城门（村子没有围墙）",
    "紫色魔法光、发光符文与地上法阵",
    "整村被传送走后的空谷（4.0.3a 剧情）",
    "雪与积雪",
    "阔叶林、翠绿草地与丰收的庄稼",
]

