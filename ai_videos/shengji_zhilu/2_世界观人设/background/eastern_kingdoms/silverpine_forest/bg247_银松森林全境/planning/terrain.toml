  "南墙被震开的缺口 / 墙后可见的城邦（4.0.3a）",
  "攻城车 / 瘟疫投射器 / 攻城塔 / 战线壕沟（4.0.3a）",
  "北部果园与死麦田原址上的军营（4.0.3a，旧世仍是果园与死麦田）",
  "精灵式弧形建筑 / 树屋",
  "飞行坐骑 / 飞艇",
  "桥（区图上一座桥都没画：湖心岛只能游过去，渡船已半沉）",
]

