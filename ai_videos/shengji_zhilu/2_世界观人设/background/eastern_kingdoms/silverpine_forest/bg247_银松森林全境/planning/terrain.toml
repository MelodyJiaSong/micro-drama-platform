# 银松森林全境 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/WorldMap-Silverpine_c60.jpg，1002 × 668 px）量取：山脊 [[ridge]]（poly 多边形）/ 水系 [[water]]（path 折线，海与湖用宽 width_m 铺成面）/ 道路 [[road]]（path 折线），单位 m。
# 换算见 blocks.toml 头两行（x% → ×38.405 m，y% → ×25.603 m；即 1 px ≈ 3.833 m，原点区图左上角）。
# 量取口径：区图上画得出的地物一律 `src = "地图量取"`；山脊边界取「山纹与草地的分界线」；湖用 8 条横向水带铺面，带宽取图上该纬线的湖宽。
# 西海岸线从区图顶边量起（顶边海岸在 x≈1300 m），北墙山体只从海岸线以东开始。
# 界外（北面邻区、湖东岸以外的山脉区、东南丘陵区、南墙以南）一并画成山体，免得像可走的空地。
# 带 bg 键的 [[block]] 覆盖世界树没坐标的 bg；不带 bg 键的是区图上有名的地标。
# 巴克布雷农场（bg249）原典明言「位置存疑、无地图高亮块」，不摆块。区图 (534, 90) px 处另有一组农舍 + 田地图标，对不上任何有名节点，不摆块。

