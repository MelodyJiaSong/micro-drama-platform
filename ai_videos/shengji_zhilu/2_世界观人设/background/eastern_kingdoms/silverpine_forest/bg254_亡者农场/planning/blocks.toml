# 亡者农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1700, 420)。坐标表点位 [49, 22] → 本地 (182, 143)。
# 西北山地、大路、死麦田小径取自 bg247 terrain.toml（区图量取）；裁切图上田块图标在红十字以西约 130 m，小径沿田北沿往东再拐向大路。
# 田块范围、谷仓与田中杂物的摆法按世界树画面「一大片死掉的麦田……田中立着一座塌了半边的谷仓」推定。
# 小径东端与大路之间差约 70 m（区图量取的两条线没接上），接头段按裁切图推定。

[meta]
bg = "bg254"
name_zh = "亡者农场"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "田块约 140 × 90 m 按裁切图田块图标到红十字的距离推定；山、路位置取区图量取"
# 世界树画面：一大片死掉的麦田，秸秆发黑倒伏，田中立着一座塌了半边的谷仓
absent = [
    "营帐、旗帜、拒马、攻城车与任何军营设施（4.0.3a 原址改成的后卫营）",
    "活的庄稼、金黄的麦浪、收割好的整齐麦垛（田里一根站着的麦子都没有）",
    "稻草人（人形轮廓出图易被读成人物）",
    "湖面与河（湖在东边一公里外的林子后面，看不到）",
    "风车、磨坊与石砌农舍（本档只有一座木板谷仓）",
    "乌鸦、牲口与任何动物",
    "炊烟、灯火、火堆与任何人工光源",
    "晴天、蓝天与直射阳光",
]

[[ridge]]
name = "西北山地·南麓（田北沿外陡起的松林坡）"
poly = [[0, 0], [130, 0], [94, 59], [6, 71], [0, 72]]
height_m = 120
src = "地图量取"

[[ridge]]
