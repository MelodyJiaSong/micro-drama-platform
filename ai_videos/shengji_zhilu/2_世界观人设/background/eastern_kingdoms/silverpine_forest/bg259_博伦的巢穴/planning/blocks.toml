# 博伦的巢穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：世界树坐标 [61, 76] → bg247 的 (2342.7, 1945.8) m → 本图 (240, 200)，即原点 ＝ bg247 的 (2102.7, 1745.8) m。
# 两条路与三面山从 ref/ 裁切图量取（裁切图约 0.91 m/px，红十字在 (362, 242) px）；洞口、空地、松林带为推定。

