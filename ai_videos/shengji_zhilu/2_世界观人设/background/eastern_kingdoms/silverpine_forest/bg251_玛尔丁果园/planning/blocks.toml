scale_src = "推定"
scale_note = "区级平面图 b251 给 140 m 见方的点位范围（坐标表）；果园本身尺寸无一手出处，按「六行 × 七八棵、株距约 12 m」的小果园取约 100 × 90 m，连同路与山脚取 180 × 180 m 局部场地"
# 世界树画面：北部路边的果园，果树全枯，篱笆倒了一半，木屋门开着
absent = [
    "人物、牲畜与看门狗（默认态人去屋空）",
    "挂满果子的活果树、绿叶与花（果树全枯，一片叶子也没有）",
    "水井、谷仓、晾衣绳、麦田与南瓜地（本区其他农庄的标志，本卡没有）",
    "军营、营帐、军旗、瞭望塔与攻城器械（4.0.3a 原址改建的指挥部）",
    "火光、烛火、窗灯与冒烟的烟囱（白天零人工光源）",
    "湖对岸的山与建筑（对岸隐在雾里）",
    "晴天、蓝天与阳光",
    "雪与积雪",
    "阔叶高林与翠绿草地",
]

