# 玛尔丁果园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原典：北部路边的果园，果树全枯，篱笆倒了一半，木屋门开着。裁切图：坐标点 [59, 12] 落在主道上，
# 带篱笆的果树图标在主道西北侧、背靠北面界山；路东南一侧缓坡下到湖（湖在场地外）。局部坐标，场地中心对 bg247 的 b251。

[meta]
bg = "bg251"
name_zh = "玛尔丁果园"
size_m = [180, 180]
