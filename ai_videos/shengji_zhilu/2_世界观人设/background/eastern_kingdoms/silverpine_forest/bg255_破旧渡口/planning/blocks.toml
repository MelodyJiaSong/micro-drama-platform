# 破旧渡口 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地挂在区级平面图 bg247 的坐标系上：本地坐标 ＝ 区坐标 − (1900, 720)。坐标表点位 [55, 35] → 本地 (212, 176)。
# 大路、北边通湖土路、南面山块取自 bg247 terrain.toml（区图量取）。
# 湖岸线按裁切图量：红十字东边约 120–150 m 是一道从北弯向东南的弧形岸，岸边一截伸向东北的深色短条（本地约 (350,170)→(378,140)）取作栈桥。
# bg247 用 140 m 宽的横向水带铺湖，岸线是锯齿；本档按裁切图重画岸线（折点 (240,0)→(300,100)→(350,170)→(410,250)→(460,290)），湖面用 20 m 宽的横向水带铺到场地东缘。
# 渡船、船棚、绞盘的摆法按世界树画面「朽木栈桥与一条半沉的渡船，桩子上缠着水草」推定。

[meta]
bg = "bg255"
name_zh = "破旧渡口"
size_m = [460, 320]
px_per_m = 3.0
scale_src = "推定"
scale_note = "场地取「大路 → 草坡 → 湖岸」一整段；栈桥长约 40 m 按裁切图短条长度推定"
# 世界树画面：洛丹米尔湖畔的朽木栈桥与一条半沉的渡船，桩子上缠着水草
absent = [
    "桥与任何通往湖心岛的陆路（区图一座桥都没有，只能游过去）",
    "能用的船、帆船、码头吊车与港口设施",
    "浅白砂岸（那是北边另一段湖岸；本档是灰黑泥滩与卵石）",
    "湖对岸的山与岸线（常年隐在雾里）",
    "农田、农舍与军营（4.0.3a 后此地改成农田）",
    "岛上庄园窗里的灯、渡口的灯笼与任何人工光源",
    "水鸟、鱼与任何动物",
    "晴天、蓝天与直射阳光",
]

