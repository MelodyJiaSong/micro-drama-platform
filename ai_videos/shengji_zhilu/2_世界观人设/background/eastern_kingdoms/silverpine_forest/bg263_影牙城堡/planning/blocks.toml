# 影牙城堡（户外区域与入口）· 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：原点 ＝ 区图 px (400, 425)；x = (px − 400) × 3.83，y = (py − 425) × 3.83（与 bg247 同一比例）。
# 世界树坐标 [47, 66] → 区图 px (470.9, 440.9) → 本图 (272, 61)，落在山道回头弯。城堡图标 px 412–446 × 437–454。
# 城堡内部（庭院 / 厨房 / 塔顶）属副本，本图只画外轮廓；院内块只为给门外镜头定塔楼位置。

[meta]
bg = "bg263"
name_zh = "影牙城堡"
size_m = [420, 300]
px_per_m = 3.6
grid_m = 50
scale_src = "地图量取"
scale_note = "区图 WorldMap-Silverpine_c60 宽 1002 px ＝ 区宽 3840 m（bg247 同一换算，3.83 m/px）；城堡位置、海岸线、山道回头弯、崖下村子量自区图 px x 400–510、y 425–503；城堡院落与塔楼尺寸为推定（区图图标是示意，不代表真实大小）"
# 世界树画面：悬崖顶上的黑石城堡剪影，吊桥、铁闸门与两侧火盆，山道盘旋而上
absent = ["第二道城门 / 后门 / 绕后的路", "注满水的护城河（岩沟是干的）", "窗灯、烛火、灯笼、火把（桥头两只火盆是唯一人工光）", "夜景与幽绿魔法光（属副本内景）", "旗帜与纹章", "攻城器械与城堡着火", "码头 / 船", "雪", "阔叶林", "翠绿草地", "白墙彩顶的童话城堡"]

