# 雷霆山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级 (1640, 440)；岩脊外廓、浑河、主路、北缘山墙、东北山块按区级 terrain.toml 平移（地图量取）。
# 脊线、雷击岩柱、孤岩、断树、兽径全是推定：世界树无坐标，区图只画了山影。
# 锚点机位：岩脊东端肩部约 [540, 335]，离地一人高，朝正西沿脊线望。

[meta]
bg = "bg541"
name_zh = "雷霆山"
size_m = [900, 600]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 4.825 m（区级 WorldMapArea 换算）；岩脊外廓按区级 terrain.toml「西北岩脊」平移，精度约 ±50 m；脊高约 110 m 取自同一条目 height_m"
# 世界树画面：西北部一道被雷暴常年劈打的高岩脊，岩面焦黑，雷霆蜥蜴在脊上游荡，空气里带静电感
absent = [
    "积水、被淹的峡谷、泡在水里的树与溺死的蜥蜴（那是 4.0.3a 大洪水之后的状态）",
    "溪流、水潭与任何水体（唯一的水是西坡下的浑河）",
    "森林、草甸与任何成片绿色（只有枯黄干草、带刺矮灌木与枯树）",
    "建筑、营地、帐篷（农场在东南坡脚，属另档）",
    "正在落下的闪电、雨与雪（默认态是干燥的阴天上午）",
    "火、烟、熔岩与任何人工光源（焦痕都是冷的）",
    "飞行点与飞行坐骑",
    "人物、动物（蜥蜴只留爪痕与鳞皮）",
]

