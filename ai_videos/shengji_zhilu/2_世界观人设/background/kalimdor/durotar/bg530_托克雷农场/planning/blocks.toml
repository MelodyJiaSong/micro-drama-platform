# 托克雷农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 圈心 (120,108) ＝ 区图 [43,30] ＝ 区级平面图 (2079,967)；本场地原点 ≈ 区级 (1959,859)。
# 北面岩脊南缘、南面矮丘北缘按区级 terrain.toml 的「西北岩脊」「西部中段山丘」换算；两汪水洼按裁切图（1 px ≈ 1.61 m）量取。
# 锚点机位：窄坳东口土径 (225,110)，人眼高，朝正西。

[meta]
bg = "bg530"
name_zh = "托克雷农场"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "农场位置按区图坐标 [43,30]；北岩脊、南矮丘的边缘按区级 terrain.toml 换算（±50 m）；两汪水洼按裁切图量取（±20 m）；猪圈、木屋、晾肉架尺寸按兽人小农场常识推定"
# 世界树画面：一小片木栅围出的猪圈与两座歪斜的兽人木屋，屋外晾着咸肉，地上是被拱翻的红土
absent = [
    "任何人物、猪与牲口、雷霆蜥蜴（底图里圈是空的、屋里没人）",
    "积水的峡谷、被淹没的树、溺死的蜥蜴（那是 4.0.3a 大洪水之后的雷霆山；1.12 是干燥高岩脊）",
    "闪电、雷暴、雨（默认态；焦痕是多年的冷痕）",
    "任何火、火把、灯笼、烛火与人工光源（熏肉火坑只剩冷灰）",
    "大面积多排猪圈、敞口储物棚（那是城门外另两座猪场的特征）",
    "石砌建筑、城墙",
    "农田、草地、树林",
    "飞行点、飞行坐骑",
    "文字招牌、旗面纹章",
]

[[ridge]]
name = "北面雷击焦黑高岩脊的南坡脚（脊顶约百米）"
