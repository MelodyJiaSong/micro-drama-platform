# 秘道 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b906（1930, 1698），原点 ＝ 区级 (1630, 1398)；西界大河按区级 terrain.toml 平移量取。
# 山体、小径、圣岩、峰顶石台全是推定：世界树无坐标，区图上没画这条路。
# 小径俯视顺时针盘升约 2.5 圈（山脚 → 峰顶），每圈抬高四五十米。
# 锚点机位：第二圈西侧山腰约 [212, 321]，离地一人高，朝正北；右手山壁、左手临空，左下方看得见第一圈的同一条小径。

[meta]
bg = "bg536"
name_zh = "秘道"
size_m = [600, 600]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "峰高约 150 m 取自区级 terrain.toml「中部高山块」height_m；山体直径约 480 m、小径宽约 1 m、圈距与圣岩 / 石台位置均为推定；西界大河按区级平面图平移（地图量取）"
# 世界树画面：绕着全区最高那座山盘旋而上的一线窄岩径，一侧贴壁一侧临空，路面碎石松动，登顶可俯瞰整个贫瘠之地
absent = [
    "护栏、铁链、石砌台阶与任何铺装路面（小径是踩出来的碎石岩架）",
    "树林、草坡与任何成片绿色（只有岩缝里的枯黄干草与刺灌木）",
    "火、燃着的火盆、炊烟与任何人工光源（峰顶火盆是空的、冷的）",
    "建筑、帐篷、营地（峰顶只有一小块石台与几根方石柱）",
    "积水、溪流、瀑布（山上没有水；唯一的水是山脚西面的浑河）",
    "雪、冰、霜",
    "飞行点、坐骑与任何可以骑上山的宽路（路只容一人）",
]

