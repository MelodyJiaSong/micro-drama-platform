# 石牙农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标；区级平面图 bg523 · b902 把场心摆在 (2017,511)。本场地原点 ≈ 区级 (1887,391)：
# 北墙崖根按区级 terrain 北墙 poly (2152,405)/(2050,444)/(1930,468) 换算；南缘岩脊按西北岩脊 (1978,598) 换算；
# 主路在场地东缘外约 60 m，浑河在西缘外约 130 m（均不入场地）。

[meta]
bg = "bg526"
name_zh = "石牙农场"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标；按区级平面图 b902（城门西南约 200 m、区图 (42,15) 水洼图标旁）与原典「城门外沿西面那条路、背靠北面红色山壁」推定。崖根走向按区级 terrain 北墙量取；圈 / 棚屋 / 晾草架尺寸按小猪场常识推定"
# 世界树画面：奥格瑞玛正门外西侧沿路的猪场，几排木栅圈与一座低矮草顶棚屋，背靠北面的红色山壁
absent = [
    "任何人物、猪群与牲口（底图里圈是空的；苦工与猪属 shot 层）",
    "任何火、火盆、火把与人工光源（棚屋门侧灶坑只剩冷灰）",
    "单个大圈、敞口储物棚、浑黄大水塘（那是城门东侧那座猪场的特征）",
    "城门、飞艇塔、飞行点入画（都在场地以东，不进本档）",
    "积水的峡谷、被淹的岩脊与溺死的树（南边岩脊 1.12 是干燥高岩）",
    "农田、麦浪、草地与树林（只有刺灌、枯树根与水洼边几丛草）",
    "石砌建筑、金属尖刺围墙（那是 4.0.3a 重建后的城门外观）",
    "雨、雪、泥潭（泥地是晒干的硬皮，唯一的水是崖根渗水洼）",
]

