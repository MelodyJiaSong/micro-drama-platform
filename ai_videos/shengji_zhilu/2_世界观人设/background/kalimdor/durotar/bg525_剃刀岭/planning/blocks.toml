# 剃刀岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 镇心 (150,150) ＝ 区图 [54,43] ＝ 区级平面图 (2611,1386)；本场地原点 ≈ 区级 (2461,1236)。山块 / 水洼 / 路按区级 terrain.toml 与裁切图换算。

[meta]
bg = "bg525"
name_zh = "剃刀岭"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "镇心按区图坐标 [54,43] 定；东北山块角、两汪水洼、三条路的走向按区级 terrain.toml 与区图裁切量取（±50 m）。寨墙 140×110 m、营房与地穴尺寸按兽人寨镇常识推定"
# 世界树画面：土路十字口上的兽人小镇，尖木桩围墙围着几座半掘进土丘的兽人地穴与一座高大木石兵营，门口立着红黑部落旗
absent = [
    "任何人物、守卫、狼坐骑与牲口（底图里镇子是空的）",
    "任何火、火盆、火把与人工光源（地穴出烟口与路边烧斑都冷透）",
    "区内飞行点、双足飞龙栖木（1.12 本镇没有飞行点）",
    "训练假人（营房前只是几根砍痕累累的粗木桩）",
    "石砌城墙、金属尖刺围墙、砖瓦房（寨墙是尖木桩，唯一的石头是营房墙基）",
    "旗面纹章、文字招牌（长旗只有红黑两色，无图案）",
    "东面寨门（东墙完整无门，海只能越墙远望）",
    "树林、草甸、农田（只有枯黄硬草与龟裂红土）",
    "雨、雪、泥泞（唯一的水是两汪小水洼）",
]

