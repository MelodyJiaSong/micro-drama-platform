# 科卡尔峭壁 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b907（2306.5, 2412.6），原点 ＝ 区级 (2106.5, 2212.6)；南路在场地北缘外约 20–40 m 东西横过。
# 世界树无坐标、区图上没画（4.0.3a 整块移除）——裂谷走向、宽度、帐篷与木桩的位置全是推定。
# 锚点机位：北口约 [205, 30]，离地一人高，朝正南；面南时左手 ＝ 东壁（向阳），右手 ＝ 西壁（午后落影）。

[meta]
bg = "bg537"
name_zh = "科卡尔峭壁"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "推定"
scale_note = "原典只有「南部一道嶙峋的红岩裂口，谷中散着兽皮帐与拴马桩」；谷长约 330 m、谷底宽 70–80 m、壁高 30–40 m、帐高约 8 m 均为推定（帐与桩按人身马躯的体型放大）"
# 世界树画面：杜隆塔尔南部一道嶙峋的红岩裂口，谷中散着半人马的兽皮帐与拴马桩
absent = [
    "木栅寨墙、哨塔、石屋与任何固定建筑（只有可拆的兽皮大帐）",
    "第二个出入口、上崖的坡道或台阶（南端封死，两壁无路）",
    "燃着的火塘、炊烟、火把与任何人工光源（火塘是冷灰）",
    "水潭、溪流、积水与绿色草地",
    "平顶方台岩式的天际线（这里的壁顶是竖裂的锯齿）",
    "人尺度的小帐篷与低矮拴马栏（帐与桩都按高于常人的体型放大）",
    "雪、冰、霜",
]

