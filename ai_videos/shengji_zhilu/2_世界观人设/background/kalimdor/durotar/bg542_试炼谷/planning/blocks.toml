# 试炼谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位 [44, 67]（区级 b542 = 2127, 2160）落在本图 (330, 380)，原点 ＝ 区级 (1797, 1780)。
# 营地图标、水潭与南侧圆形图标、谷内土路从 ref/ 裁切图量取（裁切图约 1.75 m / px）；崖线按裁切图山影 + 区级 terrain.toml 描。
# 锚点机位：东豁口土路上约 [545, 398]，离地一人高，朝正西望。

[meta]
bg = "bg542"
name_zh = "试炼谷"
size_m = [560, 560]
px_per_m = 2.6
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 4.825 m（区级 WorldMapArea 换算）；裁切图放大约 2.75 倍，营地 / 水潭 / 路按裁切图量取，精度约 ±20 m；崖线精度约 ±40 m"
# 世界树画面：四面被赭红高崖围死的封闭小谷，谷底一圈兽人兽皮尖顶帐篷与木架，中央一口小水潭，崖壁上开着两处黑洞口
absent = [
    "训练假人（1.12 没有，4.0.3a 才加）",
    "飞行点、飞行坐骑",
    "石砌建筑、城墙（谷里只有土坡穴屋与兽皮帐篷）",
    "第二个出口、第二条路（进出只有东豁口那一条土路）",
    "河流、湖泊（唯一的水是谷心那口小水潭）",
    "森林、草甸与任何成片绿色",
    "从洞口透出的光、火把、灯笼、烛火（唯一人工光源是营地火塘那一小堆柴火）",
    "雪、雨、夜景",
    "人物、动物",
]

