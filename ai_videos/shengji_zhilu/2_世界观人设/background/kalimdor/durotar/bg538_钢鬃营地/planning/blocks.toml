# 钢鬃营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区级平面图 b538（2272.4, 1482.7），原点 ＝ 区级 (2072.4, 1282.7)。
# 地形按 ref/ 裁切（4 倍放大，1 px ≈ 1.2 m）量取：西路在中心以北约 80 m；红岩山肩从东南斜插到中心东南；中心西南两座小丘。
# 营地内部（棚屋 / 火塘 / 木刺 / 骨堆）原典只有「兽骨、插地木刺、头顶红岩垂荆棘、歪斜草泥棚屋」四样，数量与位置全是推定。
# 锚点机位：西路南路肩约 [200, 120]，离地一人高，朝东南偏南；右后方西南偏上是午后日光。

[meta]
bg = "bg538"
name_zh = "钢鬃营地"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "路、山肩、小丘按区图裁切量取（±50 m）；棚屋直径约 7 m、高约 3 m，岩坎高 2–15 m，木刺高约 2 m 均为推定"
# 世界树画面：散落着剥净的兽骨与插地木刺的开阔红土地，荆棘从头顶的红岩上垂下来，野猪人的草泥棚屋歪斜地立着
absent = [
    "尖木桩寨墙、寨门、哨塔、木屋与任何兽人式建筑（营地敞开无墙，只有草泥棚屋）",
    "兽皮尖顶帐篷（这里的棚屋是低矮的草泥驼峰）",
    "燃着的火塘、炊烟、火把与任何人工光源（火塘是冷灰）",
    "水潭、溪流、积水与绿色草地",
    "树林与棕榈（只有枯草与刺灌丛）",
    "训练假人",
    "雪、冰、霜",
]

[[road]]
name = "西路（东通路口镇、西通过河栈桥）"
