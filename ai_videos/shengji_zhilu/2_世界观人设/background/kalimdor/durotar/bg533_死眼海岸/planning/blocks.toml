# 死眼海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树无坐标。原典「在枯水谷 [52,27] 正东」→ 场地中心 ≈ 区级平面图 (2789,878)（区级 b905），原点 ≈ 区级 (2549,638)。
# 沙地「像缺了一只眼的骷髅」：头顶朝东贴海、下颌朝西正对山麓机位；两只眼窝南北并列，北眼是红土斑、南眼是平沙。

[meta]
bg = "bg533"
name_zh = "死眼海岸"
size_m = [480, 480]
px_per_m = 3.2
scale_src = "推定"
scale_note = "世界树无坐标，只按原典「枯水谷正东」落在区图 y≈27% 的东岸；沙地尺寸、骷髅形各部位、海岸线位置全部推定（区级平面图上东北山块东麓与海岸几乎贴着，这里给沙地留出约 300 m 进深，待实机量取校正）"
# 世界树画面：东岸一大块与周围红土断开的浅色沙地，形状像缺了一只眼的骷髅，地上只有迅猛龙、蝎子和野猪
absent = [
    "任何人物、营地、帐篷、房屋、围栏与道路（这里是纯野外）",
    "任何动物本体：迅猛龙、蝎子、野猪都属 shot 层（底图只留爪印蹄印）",
    "任何火、火堆、火把与人工光源",
    "沉船、断桅、船肋（那是更南的 bg540 流亡海岸）",
    "码头、栈桥、灯塔与船只",
    "外海岛屿（这一段东岸外海一直空到天边）",
    "字面画出来的骷髅图案 / 巨型头骨雕塑（骷髅只是俯看时沙地轮廓的联想）",
    "积水、水塘、雨、雪",
    "成片的草地与树林（只有刺灌与三棵枯棕榈）",
]

