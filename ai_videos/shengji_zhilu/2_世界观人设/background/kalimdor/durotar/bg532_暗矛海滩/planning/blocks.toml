# 暗矛海滩 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位 (260,170) ＝ 区图 [55,81] ＝ 区级平面图 (2659,2611)；本场地原点 ≈ 区级 (2399,2441)。
# 海岸线按区图裁切量取（裁切 1 px ≈ 1.7 m）：自 (430,0) 向西南斜到点位，再拐成近东西向到 (0,228)。
# 森金村（bg527）在点位正北偏东约 240 m，落在场地北缘之外。

[meta]
bg = "bg532"
name_zh = "暗矛海滩"
size_m = [560, 360]
px_per_m = 2.8
scale_src = "地图量取"
scale_note = "点位按区图坐标 [55,81] 定；海岸线拐点、滩后山影、东缘小岛方位按区图裁切量取（±50 m）。沙带宽度、独木舟 / 渔网 / 火塘的数量与位置按原典「搁浅的独木舟与破渔网」推定"
# 世界树画面：森金村外一条细长白沙海滩，浅绿海水拍岸，滩上横着几条搁浅的独木舟与破渔网
absent = [
    "任何人物、村民、螃蟹、鱼人、迅猛龙与其它动物（底图里滩上是空的）",
    "任何火、火把、灯笼与人工光源（火塘只剩冷灰）",
    "码头、栈桥、灯塔、大船与帆船（海边只有搁浅的独木舟）",
    "训练假人与训练场（那是 4.0.3 后外海群岛改成出生地之后的东西）",
    "外海小岛上的村落细节（1.12 群岛是被敌方占着的破败草屋，远景只见一团团浓绿）",
    "高脚棚屋群（属东北方向的 bg527，本档只在远景露一座尖顶）",
    "成片的树林与草地（坡上只有三棵矮棕榈与枯草）",
    "文字、招牌、旗面纹章",
    "雨、雪、风暴巨浪",
]

