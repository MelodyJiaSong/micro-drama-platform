# 流亡海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位 [61, 52]（区级 b540 = 2949, 1676）落在本图 (190, 280)，原点 ＝ 区级 (2759, 1396)。
# 海岸线、礁屿、礁滩外缘从 ref/ 裁切图量取（裁切图约 1.3 m / px）；沉船位置与形态区图没画，全是推定。
# 锚点机位：北端岸坎顶约 [150, 40]，离地一人高，朝正南顺岸望；左手（东）礁滩与沉船，右手（西）红土岸地。

[meta]
bg = "bg540"
name_zh = "流亡海岸"
size_m = [560, 600]
px_per_m = 2.5
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 4.825 m（区级 WorldMapArea 换算）；裁切图放大约 3.7 倍，海岸线与礁屿按裁切图量取，精度约 ±15 m"
# 世界树画面：东岸乱礁滩，一艘艘库尔提拉斯战船的残骸撞碎在礁石上，断桅与船肋斜插出水面
absent = [
    "码头、栈桥、灯塔与任何港口设施（1.12 本区没有海港）",
    "还浮在水上的完好船只、帆装齐全的船",
    "高崖与海蚀崖（岸坎只有三四米）",
    "白沙滩与独木舟（那是南边高脚村前的海滩）",
    "成片棕榈林、草地与任何成片绿色",
    "海上的岛屿（视野内只有礁屿；群岛在东南外海、不在本段视野里）",
    "火、烟与任何人工光源",
    "风暴、巨浪、海啸冲毁的痕迹",
    "人物、动物",
]

