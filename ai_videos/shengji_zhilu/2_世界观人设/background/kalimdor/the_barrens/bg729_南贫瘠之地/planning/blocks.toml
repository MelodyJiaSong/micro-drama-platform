# 南贫瘠之地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本子区域是南半整片的标签、不是一个点；场地取其中代表性的一截：原点 ≈ 区级平面图 (3950, 4600) m，
# 即巨人旷野以南、剃刀沼泽以北，区图约 [43–54, 75–87]。路与山由 bg707 terrain.toml 平移换算。

[meta]
bg = "bg729"
name_zh = "南贫瘠之地"
size_m = [1100, 800]
px_per_m = 1.4
grid_m = 100
scale_src = "地图量取"
scale_note = "从区级平面图 bg707（terrain.toml 地图量取，±90 m）截取 1100×800 m 一截；树、巨石、路碑等小件为推定"
# 世界树画面：同一片赭黄草原的南半，草色更枯、红土裸露更多，地平线上是千针石林方向的台地剪影
absent = ["大裂谷 / 把草原劈成南北两半的地裂（4.0.3a）", "部落战争堡垒与联盟前沿要塞（4.0.3a 新建）", "烧毁的营地废墟（1.12 南部营地完好）", "南缘崖外的水面 / 洪水（1.12 是干涸石林与白色盐滩）", "河流、溪流、湖", "树林与草甸（只有三四棵伞状树）", "农田", "石砌建筑", "亮着的火与人工光源"]

