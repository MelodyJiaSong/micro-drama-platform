# 剃刀高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (4050, 5400) m；区图标注 [49, 92] 落在 (490, 284)。黄金之路南端与升降梯、东侧荆棘丘陵南段由 bg707 terrain.toml 平移换算。

[meta]
bg = "bg727"
name_zh = "剃刀高地"
size_m = [720, 540]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "丘陵范围、黄金之路南端、升降梯位置从区级平面图 bg707（地图量取，±90 m）换算；刺丘、骨冢、石冢与小径为推定"
# 世界树画面：更南端的荆棘丘陵，藤刺更黑更枯，丘顶露出插在荆棘里的白骨与低矮的石冢
absent = ["南缘崖外的水面 / 被淹的石林（1.12 崖外是干涸石林与白色盐滩）", "大裂谷 / 地裂", "被毁的升降梯（1.12 升降梯完好）", "副本内部的骨塔与发光召唤纹（不属本档）", "幽绿鬼火与任何发光物（丘外默认态不发光）", "树林与草甸", "石砌城堡与营帐", "亮着的火与人工光源", "积水"]

[[ridge]]
name = "荆棘丘陵（丘体，西坡朝黄金之路）"
poly = [[380, 0], [720, 0], [720, 450], [620, 480], [470, 440], [350, 330], [330, 180]]
height_m = 70
src = "地图量取"
note = "bg707 南部东侧山带南段的西半；丘顶在 (560, 200) 一带"

[[ridge]]
name = "南缘崖沿（崖外下落到南邻石林）"
poly = [[0, 470], [330, 455], [720, 470], [720, 540], [0, 540]]
height_m = 20
src = "推定"
note = "区图南端草原收口处；崖外是干涸石林与盐滩"

[[road]]
