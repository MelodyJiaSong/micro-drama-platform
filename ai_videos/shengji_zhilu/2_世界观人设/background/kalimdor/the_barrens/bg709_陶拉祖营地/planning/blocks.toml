# 陶拉祖营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg709"
name_zh = "陶拉祖营地"
size_m = [400, 300]
px_per_m = 3.5
scale_src = "推定"
scale_note = "场地原点 ＝ 区级 floor plan (4015, 3521)，大道 / 西路 / 西缘山带内缘按区级 terrain.toml 折算（地图量取，±90 m）；营地本体（七帐环径约 90 m、围栏、栖架、图腾柱）的尺寸无一手出处，一律推定"
# 世界树画面：草原上一片牛头人营地，高大的圆锥兽皮大帐围成环，帐顶垂着彩绘布条与羽饰，中央是长燃的篝火
# 区图：营地坐在黄金之路（东）与西路（北）交会处的西南角；西缘山带内缘离营地心约 220 m
absent = [
    "任何人物、科多兽、双足飞龙与坐骑（默认空营，栖架空着）",
    "烧毁的帐篷、焦黑的木杆、废墟（那是 4.0.3a 的状态；1.12 营地完好）",
    "尖木寨墙、石墙与城门（只有齐腰的木桩围栏）",
    "火把、灯笼、烛火（唯一人工光源是环心篝火）",
    "河流、湖泊与水塘（营地附近无水）",
    "树林、农田（只有干草与零星伞状矮树）",
    "旗面纹章与任何文字标识",
    "南部草场上的战争堡垒（4.0.3a 新建）",
]

[[ridge]]
name = "西缘褐色山带内缘（营地背后的山墙）"
poly = [[0, 110], [12, 160], [22, 210], [38, 300], [0, 300]]
height_m = 150
src = "地图量取"
note = "区级 terrain.toml 西墙山带内缘折算；北段在场地外，西路从 y≈80 处钻进山口"

