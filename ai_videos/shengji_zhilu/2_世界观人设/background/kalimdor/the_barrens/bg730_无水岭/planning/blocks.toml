# 无水岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan「无水岭」块（区图 [37–38, 12–16] 两枚枝巢图标）外扩一圈：西缘是石爪东麓山墙脚，东缘是下到草原的缓坡。
# 无坐标、无区图裁切；两座枝巢一北一南相距约 300 m 来自区图图标间距（地图量取），其余丘形 / 树 / 遗留物全部推定。

[meta]
bg = "bg730"
name_zh = "无水岭"
size_m = [640, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区级 floor plan 把本块画成 500 × 400 m（区图量取）；这里外扩到 640 × 480 m 以包进西面山墙脚与东坡脚机位。两巢间距约 300 m 按区图两枚图标量取（1 px ≈ 9.25 m，±90 m）；丘高 20–40 m、山墙高出丘顶百余米为推定"
# 世界树画面：西北角的一片矮丘，反而是全区最绿的地方，草色偏青，崖上是鹰身女妖的枝巢
absent = [
    "任何水面：溪流、水潭、湖、泉（本丘群无水，鞍部只有一道干冲沟）",
    "任何人物、鹰身人、鸟与其他动物（默认态枝巢是空的）",
    "房屋、帐篷、围栏、营火与铺装道路（这里不是聚落）",
    "燃着的火与烟（枝巢不冒烟）",
    "成片树林与农田（只有四棵伞状矮树）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "雪、雾、雨",
    "旗帜纹章与文字标识",
]

