# 前沿哨所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg710"
name_zh = "前沿哨所"
size_m = [300, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "场地原点 ＝ 区级 floor plan (5559, 1193)；东路、界河、东缘断崖按区级 terrain.toml 折算（地图量取，±90 m）。哨所各件按世界树文字（塔 + 地穴 + 两台投石车 + 南面狼栏）摆，离路距离收近到约 40 m，尺寸无一手出处，一律推定"
# 世界树画面：路边一座木石瞭望塔加一座兽人地穴，旁边立着两台蒙皮的投石车，南面有一圈狼栏
# 区图：塔图标在东路南侧、东缘黄土断崖顶；东北方向下坡即界河木桥，河对岸是东邻红土半岛
absent = [
    "任何人物、狼、坐骑（默认空哨，狼栏空着）",
    "寨墙、城门与石砌城堡（只有一排拒马与一圈狼栏）",
    "火把、灯笼与燃着的火（火塘是冷灰余烬）",
    "第二座桥、渡船与码头",
    "树林与绿地（只有短草与零星伞状矮树）",
    "旗面纹章与任何文字标识",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "崖顶黄土台地（哨所所在，东缘陡落河面）"
poly = [[0, 0], [202, 0], [210, 60], [212, 140], [206, 220], [0, 220]]
height_m = 35
src = "地图量取"
note = "区级 terrain.toml「东缘黄土断崖」；台地向西缓降接草原，东缘一刀切下"

[[ridge]]
name = "对岸红土岩丘（东邻半岛，土色更红）"
poly = [[280, 0], [300, 0], [300, 220], [276, 220], [278, 110]]
height_m = 30
src = "地图量取"

[[water]]
name = "界河（浑黄湍急）"
path = [[248, 0], [244, 110], [240, 220]]
width_m = 60
depth_m = 6
src = "地图量取"
note = "区级 terrain.toml 界河 x≈5800 折算"

[[road]]
name = "东路（自西向东北下坡去界河木桥）"
path = [[0, 68], [82, 37], [150, 22], [185, 10], [205, 0]]
width_m = 8
src = "地图量取"
note = "锚点机位在 x≈40 的路上朝东；木桥在场地东北角外"

