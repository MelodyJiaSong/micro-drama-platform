# 遗忘之池 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级 floor plan 的 (3900, 1150)：主池、西路、北面孤峰南麓山脚都按区级 terrain.toml 平移量取（1 px ≈ 9.25 m，±90 m）。
# 小水洼、棕榈、芦苇、大蘑菇的具体位置全部推定。

[meta]
bg = "bg731"
name_zh = "遗忘之池"
size_m = [520, 620]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区级 terrain：主池 [45, 23] 宽约 130 m、南北约 140 m；西路在池南约 300 m；孤峰山块南脚在池北约 120–150 m。本场地取原点 (3900, 1150) 的 520 × 620 m 平移切片；区图精度 ±90 m"
# 世界树画面：干草原上一小片突兀的翠绿绿洲，几汪清水围着高大的棕榈与芦苇，水边长着独有的沉重蘑菇
absent = [
    "流入或流出的溪流、水渠（池水静止，无进出水道）",
    "湖面（只是一汪狭长主池加两汪小水洼）",
    "房屋、帐篷、围栏、井与水车（这里不是聚落）",
    "任何人物、半人马与动物（默认空）",
    "燃着的火与烟",
    "连片树林（绿只在池周约百米一圈，圈外立刻是干草）",
    "晴朗无雾的峰顶（北面孤峰顶终年罩暗红浊雾）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "雪、雨",
]

