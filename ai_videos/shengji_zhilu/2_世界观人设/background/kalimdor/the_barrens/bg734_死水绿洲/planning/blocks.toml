# 死水绿洲 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ≈ 区级平面图 (4620, 2400) m；水塘、东侧石山西缘、红岩小丘、黄金之路按 bg707 terrain.toml 平移换算（区图 ±90 m）。

[meta]
bg = "bg734"
name_zh = "死水绿洲"
size_m = [700, 400]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "水塘位置、东侧石山西缘、西北红岩小丘、西侧黄金之路从区级平面图 bg707（地图量取，±90 m）换算；塘的长宽收窄到「约 140 × 75 m」、泥带 / 芦苇 / 棕榈 / 兽骨为推定"
# 世界树画面：水色发暗发绿的一片死水塘，浮着厚厚的水藻，岸边芦苇枯黄，几头瘦弱的科多兽独自饮水
absent = ["青草圈、嫩绿草甸与清水（这里是发绿死水，绿只剩藻毡与棕榈顶心）", "第二汪小潭 / 连着的溪流与河（只有一口塘，不外溢）", "海面与海岸（东边被石山挡住，看不到海）", "茂密高大的棕榈林（只有北岸四五棵半死的棕榈）", "任何建筑、营地、木屋、栈桥、帐篷", "亮着的火、火堆与任何人工光源", "大裂谷 / 地裂（1.12 贫瘠之地是一整片）", "洪水、漫出塘外的水面", "雨、雪、夜景", "人物、坐骑、科多兽（属 shot 层）"]

