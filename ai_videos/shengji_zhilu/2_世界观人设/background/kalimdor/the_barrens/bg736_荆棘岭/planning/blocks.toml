# 荆棘岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan「荆棘岭山块」北坡一段：北缘是东路，南缘是丘顶棱线以南一点。无坐标、无区图裁切，
# 营地布局全部推定；只有「营地在北坡、东路贴丘脚过、西面是十字路口」来自原典方位与区图。

[meta]
bg = "bg736"
name_zh = "荆棘岭"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级 floor plan 把本块画成 400 × 300 m（推定）；这里取北坡营地一段 400 × 320 m，丘顶高出坡脚约 55 m（区级山块 90 m 是整座山的最高处）；棚屋 / 木刺尺寸按野猪人身量推定"
# 世界树画面：山顶北坡上一大片野猪人聚落，草泥圆顶棚屋一座挨一座，四处插着削尖的木刺与骨制图腾
absent = [
    "燃着的火与炊烟（默认态火坑是冷灰）",
    "任何人物、野猪人与动物（默认空营）",
    "石砌房屋、木板屋与农田（全营只有泥、草、藤、骨、木刺）",
    "南坡上的建筑（营地只在北坡）",
    "河流、溪水与水潭（本丘无水）",
    "成片树林（丘顶只有一棵孤伞树）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "旗帜纹章与文字标识",
]

