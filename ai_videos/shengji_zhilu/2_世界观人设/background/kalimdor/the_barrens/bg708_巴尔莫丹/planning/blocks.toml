# 巴尔莫丹 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg708"
name_zh = "巴尔莫丹"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区级 floor plan 的 b908 取 400 m 见方（区图南端堡图标 [48, 84]）；本图东西放宽到 480 m，把西侧黄金之路与东侧山带坡脚都框进来。堡在北、坑在南、坑底门洞与巨炮取世界树文字；各块尺寸无一手出处，一律推定"
# 世界树画面：南端一座矮墩墩的矮人石堡加一门巨型火炮，堡下是层层掘开的露天矿坑，脚手架与矿车轨道盘绕而下
# 区图：堡图标在南部走廊黄金之路东侧，东贴南部东侧山带（剃刀高地丘陵北段），西南隔大道是剃刀沼泽
absent = [
    "任何人物、矿工、守卫与驮兽（默认空场）",
    "城镇、民居、城墙与街道（堡外只有帐篷与料棚）",
    "火把、灯笼、矿灯、坑底门洞里的光（白天户外零人工光源）",
    "水体、积水矿坑、溪流（坑底是干的）",
    "树林与绿地（只有稀疏干草与东侧枯荆棘）",
    "旗面纹章与任何文字标识",
    "蒸汽机车、飞行器与任何现代机械",
    "4.0.3a 后的任何改动（大裂谷、部落战争堡垒、烧毁的营地）",
]

