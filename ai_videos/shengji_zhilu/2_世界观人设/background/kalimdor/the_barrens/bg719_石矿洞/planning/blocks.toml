# 石矿洞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg719"
name_zh = "石矿洞"
size_m = [300, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级平面图按区图东北角山壁上的图标取 [62, 4]（地图量取）；洞口到东侧界河约 0.15–0.2 km 为区图量取，采掘场与设施尺寸按一座小矿的规模推定，无一手尺寸出处"
# 世界树画面：东北山壁上的矿洞口，洞外是兽人式的木架与红黑旗，矿车轨道从洞里伸出来
absent = [
    "任何人物、地精、兽人与动物（默认空场）",
    "亮着的油灯、火把与任何火光（洞内漆黑、油灯熄灭）",
    "带纹章或文字的旗帜（只有红黑两色素布旗）",
    "洞内景（要拍洞内另立 bg）",
    "石砌建筑与铁皮大厂房（只有兽人式木构工棚与木架）",
    "油泊与井塔本体（在西南界外约 0.5 km，属淤泥沼泽 bg733；锚点图机位朝东北，看不到它）",
    "桥（界河上的木桥在南面东路上，不在本场地）",
    "4.0.3a 后的任何改动",
]

