# 勇士岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区级 floor plan 块 b923（中心 [6362, 3006]，推定）周边 500 × 440 m 海面，岛居中。
# 岛轮廓、水道走向、石圈空地全部推定：原典只给「干燥小岛 · 一条贯穿全岛的石砌水道 · 沙土与零星干草」。
# 海面用四条宽水带画在岛外（ridge 先画、water 后画）；岛与水带之间残留的四角即沙岸浅滩。对岸大陆断崖在场地以西约 150 m 外，不入图。

[meta]
bg = "bg723"
name_zh = "勇士岛"
size_m = [500, 440]
px_per_m = 3.0
grid_m = 50
scale_src = "推定"
scale_note = "区级 floor plan 把本岛画成 300 × 300 m（推定，区图小岛约 30 px ≈ 280 m）；这里取东西约 320 m、南北约 220 m 的长岛；海峡宽取区图岛心到岸线约 430 m 减半岛宽"
# 世界树画面：东海岸外一座干燥小岛，一条贯穿全岛的石砌水道，岛上只有沙土与零星干草
absent = [
    "桥、码头、栈道与任何船只（只能游泳过去）",
    "房屋、帐篷、旗杆、围栏与任何建筑（石圈只是一圈膝高散石）",
    "树与棕榈（岛上只有干草与三丛刺灌）",
    "任何人物与动物（默认空岛）",
    "火、篝火与任何人工光源",
    "淡水池、溪流（水道里是通海的咸水）",
    "绿草地与湿地植被",
    "旗帜纹章与文字标识",
]

