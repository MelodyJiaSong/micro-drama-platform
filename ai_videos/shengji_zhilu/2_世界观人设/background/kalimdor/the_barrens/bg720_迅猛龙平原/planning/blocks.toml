# 迅猛龙平原 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg720"
name_zh = "迅猛龙平原"
size_m = [380, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标、区级平面图未摆块；本图推定在区图 [50, 53] 一带（黄金之路东南侧、东南山脊西北脚），路与山脊的相对位置按区级 terrain.toml 换算，营地规模按六座草棚推定，全部待核"
# 世界树画面：路南一片带刺灌木围出的野猪人营地，草棚低矮，四周是被刨开的干土与骨堆
absent = [
    "任何人物、野猪人与动物（默认空营；尽管译名如此，这里没有迅猛龙）",
    "燃着的火与炊烟（火坑是冷灰）",
    "木刺圈墙与圆顶草泥棚（那是路对面阿迦玛戈的形制）",
    "血色碎晶（阿迦玛戈的标志，这里没有）",
    "石砌建筑、木板房与帐篷",
    "水体（泥坑是干的）",
    "树林与绿地（只有坡脚两三棵伞树）",
    "旗帜纹章与任何文字标识",
    "4.0.3a 后的任何改动（该子区域在大灾变被移除）",
]

