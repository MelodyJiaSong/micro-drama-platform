# 莫尔杉壁垒 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 黄金之路北端出区的山口，以路头为中轴取 240 × 200 m（区级 x 4346–4586、y 170–370）。
# 两座山肩取自区级 terrain「西北丘群北段」东端与「北缘东段山岭」西端（地图量取）；寨墙 / 哨塔 / 拒马布局全部推定。

[meta]
bg = "bg716"
name_zh = "莫尔杉壁垒"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "豁口宽度取区级 terrain 两座山岭之间的间距（约 125–170 m，区图 1 px ≈ 9.25 m）；寨墙高 5 m、哨塔 12 m 按兽人式原木工事推定"
# 世界树画面：北端路口上的一道临时防御工事，削尖的原木栅栏配两座木制哨塔，塔上挂着部落旗，背后是灰谷的深绿林线
absent = [
    "石砌城墙、石塔与大型木堡（1.12 只有原木寨墙 + 两座哨塔；扩建是 4.0.3a 之后）",
    "燃着的火盆、火把与炊烟（默认态火盆冷灰）",
    "任何人物、守卫、坐骑与狼（默认空哨）",
    "营地帐篷与狼栏（属 bg712，在场地以南，本档不入画）",
    "旗面图案、纹章与文字",
    "河流与水潭（山口无水）",
    "墙南的树林（林子只在墙北，墙南是枯黄草原）",
    "把草原劈开的大裂谷（4.0.3a 后才有）",
    "训练假人",
]

[[ridge]]
name = "西侧山肩（西北丘群北段东端）"
poly = [[0, 0], [52, 0], [64, 55], [58, 125], [44, 200], [0, 200]]
height_m = 40
src = "地图量取"
note = "区级 terrain 该山岭东缘在 x≈4393；本档只取坡脚到肩部一段，高出路面约 40 m"

[[ridge]]
name = "东侧山肩（北缘东段山岭西端）"
poly = [[186, 0], [240, 0], [240, 200], [206, 200], [192, 130], [180, 55]]
height_m = 30
src = "地图量取"
note = "区级 terrain 该山岭西缘在 x≈4559；坡度比西侧缓"

[[road]]
