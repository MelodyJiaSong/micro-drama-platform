# 棘齿城 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 方位来自区图（标注 [62, 36]：黄土断崖脚下、海湾北岸、界河在北侧入海；东南路自西北下来，见 bg707 terrain.toml）；镇内布局按世界树画面推定。

[meta]
bg = "bg714"
name_zh = "棘齿城"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "港镇沿岸一长条约 200 m、栈桥约 100 m，按世界树画面与港镇常识推定；区级平面图 b914 取 250 m 见方"
absent = ["石砌城墙与石堡（区内石砌的只有南段海岸的方堡和南端矮人石堡）", "原木尖桩寨墙与兽皮帐篷", "第二道栈桥以外的码头与灯塔", "大灾变后的新港区与海啸冲毁痕迹", "雪 / 冰", "点着的油灯、火把与灯笼", "冒烟的烟囱", "任何人物、狮鹫与双足飞龙", "飞行坐骑", "训练假人"]

