# 格罗多姆农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg711"
name_zh = "格罗多姆农场"
size_m = [260, 240]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图无图标；世界树只说在十字路口北面的路上，区级 b911 按东路北侧推定。场地原点 ＝ 区级 floor plan (4965, 1170)，东路按区级 terrain.toml 折算；农场本体收近到路北约 50 m（区级块心离路约 170 m，精度内不可分），猪圈与棚屋尺寸无一手出处，一律推定"
# 世界树画面：路边一圈木栅围起的猪圈与两座兽人草顶棚屋，苦工赶着黑毛野猪，地上全是拱翻的干土
# 区级：东路（十字路口→前沿哨所）北侧；北面两三百米外是东北山地的低矮丘陵（在本场地之外）
absent = [
    "任何人物、苦工与野猪（默认空栏，没有牲口）",
    "寨墙、望塔、拒马与任何防御工事",
    "农田、麦垄、菜畦（养猪场，不种地；1.12 全区无农田）",
    "水塘里的水（泥塘是干的）",
    "火、炊烟、灯笼（棚屋里不点火）",
    "石砌房屋与木板房（只有泥砖矮墙草顶棚屋）",
    "旗面纹章与任何文字标识",
]

[[ridge]]
name = "北面缓升草坡（通往场地外的红褐丘陵）"
poly = [[0, 0], [260, 0], [260, 30], [130, 45], [0, 36]]
height_m = 8
src = "推定"
note = "东北山地的丘陵本体在场地以北约 150–250 m"

[[road]]
name = "东路（西回路口、东去界河木桥）"
path = [[0, 216], [121, 190], [260, 160]]
width_m = 8
src = "地图量取"
note = "锚点机位在 x≈130 的路南路肩上朝正北"

[[road]]
