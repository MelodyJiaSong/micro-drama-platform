# 怒风兽穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区图 px (617, 323)，换算同 bg611 terrain.toml（x_px × 2.106、y_px × 2.107）。
# 区图上：环湖南路尾端的圆形标记 px≈(683,402) ＝ 主穴口；三个小屋图标 px≈(687,343)/(717,370)/(722,413) ＝ 三处小穴口。

[meta]
bg = "bg614"
name_zh = "怒风兽穴"
size_m = [440, 280]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图 px × 2.106 m（bg611 terrain.toml 同一换算）；场地西缘贴湖东岸（px≈617），东缘越过东面山墙山脚（px≈826）"
# 世界树画面：山壁上并排的三个树根洞口，洞内是安静的圆形石室，中央石台上躺着沉睡的德鲁伊（石室与沉睡者属内景 / shot 层，不入本档）
absent = ["任何人物、沉睡者、守护者与动物", "洞内石室与石台（内景另立 bg）", "打开的门或可进入的洞口（1.12 入口封死）", "灯柱、火堆、火把、烛火与任何人工光源", "上山小径与东面山口", "村屋、帐篷、营地与围栏", "白天与日光", "雪、雨与雾", "4.0.3a 后才有的东西（醒来的大德鲁伊、新增营地与传送门）"]

