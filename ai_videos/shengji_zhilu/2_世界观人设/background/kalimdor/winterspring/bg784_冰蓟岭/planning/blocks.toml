# 冰蓟岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg784"
name_zh = "冰蓟岭"
size_m = [700, 600]
px_per_m = 2.0
scale_src = "推定"
scale_note = "区级平面图里本区的落点本身是推定（b907，寒水村以南、东墙山脚的土丘洞口图标约 [66–68.5, 40–44]，折合约 160 × 170 m 的图标簇）；按「连绵的雪丘」放大到 700 × 600 m，丘高 / 洞口位置与尺寸无一手出处，全部推定"
grid_m = 100
# 世界树画面：连绵的雪丘，坡上散落洞口，冰霜巨魔与雪怪的身影在丘脊上移动
# 锚点机位：西缘雪路边小高坡（约 [60, 300]），平视略俯，朝正东
absent = [
    "任何人物与动物（雪人 / 巨魔身影属 shot 层，底图空）",
    "建筑、营地、围栏与任何人造物",
    "火、烛火、灯笼与任何人工光源（洞里也没有火光）",
    "东侧出口（被东墙山链封死）",
    "海面（在东墙山链之外，丘间看不见）",
    "湖泊、温泉与开放水面",
    "阔叶林、草地与农田",
    "夜景、极光与暴风雪（默认态午后薄云）",
    "4.0.3a 后的任何改动",
]

