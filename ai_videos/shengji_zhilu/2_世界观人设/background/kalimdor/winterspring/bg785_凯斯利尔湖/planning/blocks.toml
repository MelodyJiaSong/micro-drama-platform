# 凯斯利尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg785"
name_zh = "凯斯利尔湖"
size_m = [720, 600]
px_per_m = 2.0
scale_src = "地图量取"
scale_note = "湖形、西南窄湾、东南岸残柱图标、西路 / 湖西支路 / 东路与南岸山带取区级 terrain.toml（区图 x% × 64.922 m、y% × 43.282 m；湖约 [50.4–56, 39.7–45]，残柱约 [55.9, 44.2]）；场地原点 ＝ 区图坐标 (3134, 1471) m。遗迹内部的柱列 / 台阶 / 冰下屋基无一手尺寸，推定"
grid_m = 50
# 世界树画面：中部的冻湖，冰面淡蓝透明，冰下可见沉没的白石建筑，湖面上飘着半透明的精灵亡魂
# 下挂：凯斯利尔废墟（湖畔与冰下的白石残城，断柱成排插出冰面，雪掩住了坍塌的台阶）——整湖建场含它，特写另立子 bg
# 锚点机位：北岸缓雪坡顶（约 [330, 130]），居高斜俯，朝南偏东
# 三岔口在场地北缘外约 60 m（约 [372, -64]）
absent = [
    "任何人物与动物（精灵亡魂属 shot 层，底图空）",
    "开放水面（整片湖封冻）",
    "火、烛火、灯笼与任何人工光源；冰下与白石的幽光、魂火",
    "北岸与西岸的遗迹（遗迹只在东南岸与近岸冰下）",
    "完好的建筑、营地、码头与船",
    "夜景与极光（默认态晴天近正午）",
    "阔叶林、草地与裸土",
    "4.0.3a 后的任何改动",
]

