# 寒水村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg777"
name_zh = "寒水村"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1 px ≈ 6.5 m：两处棚屋图标约 [67.9,35.9] / [66.9,37.6]，相距 ≈ 95 m；东墙山链内沿、进村小路按区图量取（原点 ＝ 区图坐标 [4225.7, 1472.8] m）；棚屋个数与空场、火堆位置无一手出处，推定"
# 世界树画面：东部雪坡上的大型熊怪村，锥形棚屋成群，村中大火堆边架着熬煮的铁锅
# 1.12 区图：两处棚屋图标在永望镇以东、东墙山脚；一条小路自镇北孤岩丘东脚绕来进村；南面 ~200 m 起是冰蓟岭雪丘
absent = [
    "寨墙、围栏、望楼与大门",
    "旅店、商铺与飞行点",
    "火把、灯笼与烛火（场心大火是唯一人工光源）",
    "任何人物、兽形族群与动物（默认空村）",
    "文字招牌",
    "草地、阔叶树与任何绿草（只有云杉）",
    "石砌房屋与木板房（只有兽皮尖顶棚）",
    "大灾变后新增的营地与建筑",
]

[[ridge]]
name = "东墙濒海山链内沿（村子背后的陡坡，长满云杉）"
poly = [[148, 0], [156, 20], [236, 120], [300, 197], [300, 0]]
height_m = 250
src = "地图量取"

[[ridge]]
