# 霜语峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg783"
name_zh = "霜语峡谷"
size_m = [400, 800]
px_per_m = 2.0
scale_src = "推定"
scale_note = "区级平面图里本谷的落点本身是推定（b905，南走廊尽头的岩环窄谷，约 [58.5–65.5, 63.5–72]）；谷长约 700 m 按岩环南北跨度量，谷宽 / 壁高 / 巨岩尺寸无一手出处，全部推定"
grid_m = 100
# 世界树画面：南部的窄长冰谷，谷壁结着厚冰层，风从谷口灌进来卷起雪粉
# 锚点机位：北谷口内侧谷底（约 [236, 75]），离地一人高平视，朝正南
absent = [
    "任何人物与动物",
    "建筑、营地、木架与任何人造物（只有一条踩实的窄道）",
    "火、烛火、灯笼与任何人工光源",
    "恶魔与恶魔火光（属南邻峡谷 bg779，从本谷看不见）",
    "流动的水（冰瀑与谷底全部冻住）",
    "侧向出口与可攀的谷壁",
    "晴空阳光、夜景与极光（默认态阴天）",
    "绿植与树林（只有一截冻在冰里的枯树干）",
    "熔岩",
    "4.0.3a 后的任何改动",
]

