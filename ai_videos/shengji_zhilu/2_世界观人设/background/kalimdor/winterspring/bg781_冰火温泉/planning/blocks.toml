name_zh = "冰火温泉"
size_m = [460, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区级平面图 bg773 b906 按「西雪谷西段的温潭与营帐图标」推定 420×300 m，本图扩到 460×400 m 以装下南侧的西路；潭的级数与大小除主潭外皆推定"
