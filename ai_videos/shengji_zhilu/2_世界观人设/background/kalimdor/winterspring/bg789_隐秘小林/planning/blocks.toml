# 隐秘小林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 点位按 1.12 区图东墙山脚扇形林丛（区级 b789）；洼地内部布置按世界树画面推定。

[meta]
bg = "bg789"
name_zh = "隐秘小林"
size_m = [400, 360]
px_per_m = 3.5
scale_src = "推定"
scale_note = "洼地直径约 250 m、小湖约 60 m 按世界树画面「群山环抱的圆形林间洼地」与区图扇形林丛（约 [61–66, 14–20]）推定；坐标表 [64.6, 27.3] 是新版区图百分比，已按区级平面图覆盖"
# 世界树画面：群山环抱的圆形林间洼地，中央是未结冰的深色小湖，四周立着高大的云杉
absent = ["任何火、火堆、火把、灯笼与人工光源", "房屋、帐篷、木棚、祭坛、月井等任何人工建造", "石砌废墟与断柱", "冰封的湖面（本档小湖不结冰，只有一圈薄冰边）", "温泉白汽与热水", "道路与车辙（只有一条兽径）", "阔叶树与草地", "极光、夜景与正午阳光", "文字与路牌", "大灾变后新增的营地与地名", "任何人物与动物（属 shot 层）"]

