# 巨痕谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区级平面图 (1430, 1620)；区图虫巢图标 px(500, 530) ＝ 本场地 (258, 170)。南墙内缘按区级 terrain.toml 平移裁切。
# 裂沟走向（北北西沟头 → 南南东抵南墙）按区级 b972 note「裂沟由此向南岩壁脚下陷」推定；沟宽、沟深、巢丘、支沟全部推定。
# 洞内隧道网（微型地下城图）不在本图：本档只画地面上的沟。
# 锚点机位：沟头北沿岩台 (212, 72)，比沟底高约 25 m，俯视朝南南东（方位约 165°）：左 东壁与东支沟，正中 三座巢丘 → 沟尾大洞口 → 南墙，右 西壁。

[meta]
bg = "bg772"
name_zh = "巨痕谷"
size_m = [520, 440]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "区图只有一枚虫巢图标、未画沟形；场地 520×440 m 包住区级 b972 并伸到南墙脚，主沟 70×325 m、深 20–30 m 为推定"
# 世界树画面：环形山南部地面上一道深陷的裂沟，沟壁是层层剥落的红褐岩石，沟底布满虫巢样的洞口与黏液，硅化虫在其间爬行。
absent = [
    "洞口或黏液发光（洞里一片漆黑，黏液不发光）",
    "任何火、火把、灯笼与人工光源",
    "任何建筑、营地、梯子、绳索与修过的路",
    "水面与河流（沟底只有几摊稠泥）",
    "后来扩建的大虫巢（1.12 规模小：一道主沟、三座巢丘）",
    "巨型金属剑、异界晶塔与 8.x 之后的一切改动",
    "雪、雨与夜景",
    "虫群、恐龙与任何人物（属 shot 层，底图只留空壳与黏液痕迹）",
]

