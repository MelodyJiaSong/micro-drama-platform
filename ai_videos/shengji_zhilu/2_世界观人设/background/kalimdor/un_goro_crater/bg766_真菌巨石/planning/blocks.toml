# 真菌巨石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg766"
name_zh = "真菌巨石"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地原点对到区级平面图 (1994, 238)：洞口 ≈ 区图 px(638,112) → 场地 (166, 122)；岩壁内缘按区级 terrain.toml 北墙折线平移量取。洞口 20 × 30 m、洞厅深约 60 m 为推定，无一手尺寸"
# 世界树画面：环形山东北岩壁上一个巨大的天然洞窟，洞口被藤蔓与巨型蕨叶半掩，洞内石壁上长满淡蓝发光的幽灵蘑菇，地面是潮湿的黑土与散落的骨头。
# 区图：北墙内缘在此由西北向东南斜走（壁面朝西南偏南）→ 洞口朝南偏西，洞厅向东北伸进岩壁
absent = [
    "任何人物、大猩猩与其他动物（默认空巢）",
    "火、火把、营火与任何人工光源（洞内唯一光源是蘑菇冷光）",
    "凿痕、木构、支撑梁、矿车轨道与任何人造物",
    "第二个洞口或穿山通道（洞厅深处是死胡同）",
    "焦油坑（在洞口正南一百多米外，场地南缘以外）",
    "河流与瀑布",
    "任何文字与标识",
    "4.0.3a 后的任何改动",
]

