# 马绍尔营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg765"
name_zh = "马绍尔营地"
size_m = [240, 200]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区级平面图块 b965 量得营地约 220 × 150 m（区图 3.38 m/px 量取）；场地取北墙凹处整个口袋 + 南沿坡径坡顶（锚点机位）+ 台下一线树冠，240 × 200 m；台内布局无一手尺寸出处"
# 世界树画面：藏在环形山岩壁凹处的科考营地，帆布帐篷与堆满标本箱的木架
# 区图：营地图标嵌在北墙里 → 岩壁占场地北、东、西三面，口袋朝南敞开，坡径由南沿下到油沼北缘
absent = [
    "任何人物、飞行坐骑、恐龙与其他动物（默认空营）",
    "燃着的火塘与炊烟（火塘是冷灰余烬）",
    "旅店、石砌房屋与寨墙（只有帐篷、木架与一间木板小棚）",
    "任何标签、招牌、旗帜与文字",
    "水晶塔（在坑底别处，不在营地里）",
    "被石头守卫攻占、营地残破（那是 4.0.3a 后）",
    "4.0.3a 后南迁到沼泽地的新营地",
    "焦油坑（在台下正南坡下，场地外）",
]

