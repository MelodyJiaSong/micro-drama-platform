# 拉卡利油沼 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 原点 ＝ 区图 px (405, 80) ＝ 区级平面图 (1368, 270)；区图 1 px ≈ 3.377 m。十五个坑位按区图深色斑点逐个量取。
# 北墙内缘按区图量取；环形河按区级 terrain.toml 平移、在场地边界处裁切。
# 锚点机位：营地坡径半腰 (118, 110)，离地约 15 m，朝东南偏南（方位约 160°）：左 东侧坑群，正中 曲尺大坑 → 远处火山锥，右 西南浅河。

[meta]
bg = "bg769"
name_zh = "拉卡利油沼"
size_m = [860, 620]
px_per_m = 1.8
grid_m = 50
scale_src = "地图量取"
scale_note = "区图（1002×668 px ＝ 3383×2256 m）北部深色斑点群逐个量取坑位与大小；北墙内缘按区图、环形河按区级 terrain.toml 平移；骨架、枯木、晶体簇的位置与尺寸为推定"
# 世界树画面：环形山北部一片粘稠发亮的黑色焦油湖，湖面缓缓冒泡、反射着暗哑的天光，岸边是被焦油浸黑的枯木与恐龙骨架，焦油怪从湖中拱起。
absent = [
    "焦油起火、冒烟、热浪（坑是凉的，只缓缓鼓泡）",
    "任何火、火把、灯笼与人工光源",
    "营地帐篷与木架（在北墙凹处，锚点机位背对它）",
    "修过的路、桥、栅栏与任何建筑",
    "熔岩流（从北面看不到火山南坡）",
    "雪、雨与夜景",
    "焦油怪、恐龙、翼手龙与任何人物（属 shot 层）",
    "焦油减速的后改设定与 4.0.3a 后的石头守卫占营",
]

