# 伊斯迪尔废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg600"
name_zh = "伊斯迪尔废墟"
size_m = [460, 420]
px_per_m = 3.4
grid_m = 50
scale_src = "推定"
scale_note = "无一手尺寸出处。场地按区图 [58, 71] 一带废墟图标周边量出的山脚凹地推定：南墙山脚约在图标以南 150 m、中南分隔岭支脉在东；岩台高差、石阶长度按世界树「长阶通向圆形神殿」推定"
# 世界树画面：西南山间一座倒塌的精灵城：长阶通向一座圆形神殿残骸，青白石柱与断拱被藤蔓缠满，东侧山壁有一处洞口。
absent = ["任何完好的屋顶或穹顶（神殿穹顶塌尽）", "城墙与城门（废墟四面无墙，只有北面一个开口）", "河流与湖（只有石板低洼积水与坡脚一小汪水）", "燃着的火与人工光源（火坑冷灰）", "紫色魔法灯、发光符文、浮空水晶", "木屋与石屋民居（食人魔只有兽皮遮棚）", "道路与路牌", "沙漠、雪、熔岩", "海面与海岸（西南海岸山挡在西边）", "4.0.3a 后的任何改动"]

