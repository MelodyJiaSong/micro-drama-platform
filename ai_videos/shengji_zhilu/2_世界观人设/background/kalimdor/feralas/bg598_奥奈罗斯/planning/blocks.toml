# 奥奈罗斯 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (3230, 500) m；坐标 [54, 16] 落在 (202, 178)。
# 湖南岸约在 y≈134、东岸约在 x≈226（区图量取）；北中大山墙西脚约在 x≈250–280。

[meta]
bg = "bg598"
name_zh = "奥奈罗斯"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "废墟核心按坐标表落点；湖岸与山墙脚按区图量取（6.342 m/px）；台基、柱段、单拱尺寸与位置推定"
# 世界树画面：湖南岸一片散落的精灵废墟：倒塌的白石柱与残拱嵌在苔草坡上，林间雾气偏绿。
absent = ["任何人物、龙类与野兽（属 shot 层）", "营地、帐篷、木平台与新建栖地（4.0.3a 才有）", "完整的屋顶与完好的建筑", "道路与桥", "火、烛火、魔法光与任何人工光源", "发光的雾或门户（门户属 bg589）", "河流（湖水从西南角流出，不在本场地）", "沙漠、雪与冰", "现代建筑"]

[[water]]
