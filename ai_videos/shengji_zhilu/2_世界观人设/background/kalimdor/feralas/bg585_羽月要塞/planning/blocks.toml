# 羽月要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg585"
name_zh = "羽月要塞"
size_m = [340, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区级平面图 b902 只给了北岛东北角的图标位置，无一手尺寸；按精灵式要塞形制推定墙内约 190 × 160 m，外扩到东、北两面海面与西侧林道取 340 × 260 m。弧形矮墙在图上按直段近似"
# 世界树画面：建在外海小岛上的夜精灵要塞，紫蓝色月形穹顶与吊桥
# 原典：码头紫蓝石阶接木栈桥，岸边哨兵雕像与月纹旗；1.12 在北岛上、不在本土
absent = [
    "本土海岸上的要塞（1.12 要塞在外海北岛，4.0.3a 才迁本土）",
    "海啸冲毁的废墟、倒塌的墙与积水的残殿",
    "任何人物、守军、角鹰兽与渡船（默认空台、空栈桥）",
    "亮着的石灯柱、火把、烛火与任何人工光源",
    "文字招牌与纹章以外的任何文字",
    "现代港口设施与铁制码头",
    "沙漠、枯黄秋色与雪",
]

