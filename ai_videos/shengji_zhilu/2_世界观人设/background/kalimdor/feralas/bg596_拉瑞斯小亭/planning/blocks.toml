# 拉瑞斯小亭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg596"
name_zh = "拉瑞斯小亭"
size_m = [200, 200]
px_per_m = 7.0
scale_src = "推定"
scale_note = "区图无独立图标、坐标待核；位置按世界树「莫沙彻营地以北」推定在营地与北面山地食人魔营之间。林隙直径约 70 m、台基直径约 22 m、八柱与台阶尺寸无一手出处，按世界树「一圈青白石柱托起弧形顶盖、台基下有暗门」推定。东缘小溪取区级平面图「营地北小湖→营地湖的溪流」的大致走向"
# 世界树画面：雨林里一座露天的精灵式大亭：一圈青白石柱托起弧形顶盖，台基下有一道通往地下的暗门，四周林间游荡着被腐化的树精。
absent = [
    "墙体与门窗（亭子八柱全敞，柱间无墙）",
    "塌成废墟的大片城区与成排断柱（那是西面山脚的废城）",
    "开阔草原与远眺的天际线（四面林墙，只在北面露出一道山坡）",
    "湖面（湖在南面营地脚下，不在本场地）",
    "兽皮帐篷、图腾柱、木栅栏与营火",
    "点亮的灯、火盆、发光符文、从暗门缝透出的光",
    "打开的暗门与向下的台阶（门始终关着）",
    "任何人物、树人与动物",
    "大灾变之后的任何改建",
]

