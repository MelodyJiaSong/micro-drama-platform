# 恐怖图腾营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg587"
name_zh = "恐怖图腾营地"
size_m = [440, 540]
px_per_m = 3.0
scale_src = "推定"
scale_note = "无一手尺寸；场地原点取区级平面图世界坐标 (4085, 1542)，十字 [69, 39] 落在本图 (300, 110)。两片的中心取区图裁切（约 1.6 m/px）上的两枚营地图标，水池与东西干道取区级平面图折线；山梁轮廓按裁切图量取（区级的「厄运之槌东侧山嘴」多边形偏东，未照搬）。帐篷数与布置推定"
# 世界树画面：雨林里的牛头人式帐篷村落分南北两片，黑白纹样的兽皮帐与黑色图腾柱立在树影里，南片有一座关着发光小飞龙的大木笼。
absent = [
    "任何人物、笼中的发光小飞龙与任何动物（底图的笼子是空的、门闩死）",
    "北片东侧的豺狼人营地（另一伙，不收入本档）",
    "寨墙、木栅与寨门（村落没有围墙）",
    "燃着的火塘、火把、灯笼与任何人工光源",
    "低矮圆穹顶的兽皮帐（那是湖畔营地的形制；这里是圆锥尖顶帐）",
    "赭红彩绘的图腾柱（这里的图腾柱是乌黑的）",
    "石砌房屋与精灵式石亭（石柱只在西面山梁背后远远露头）",
    "雪、沙漠、枯黄秋色林",
    "任何文字、招牌与现代器物",
]

