width_m = 6
src = "地图量取"

[[road]]
name = "渡口路·滩涂段（斜穿滩涂到栈桥根部）"
path = [[383, 345], [340, 350]]
width_m = 5
src = "推定"

[[ridge]]
name = "西南海岸山（伸到海边成断崖）"
