# 被遗忘的海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (2560, 1900) m；入海小河、渡口路、西南海岸山按 bg583 terrain.toml 平移换算。

[meta]
bg = "bg591"
name_zh = "被遗忘的海岸"
size_m = [600, 700]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "海岸线、小河入海口、渡口路终点与近岸小礁岛从原版区图量取（6.342 m/px），经 bg583 terrain.toml 换算；栈桥、渡船与滩涂宽度推定"
# 世界树画面：费拉斯西岸的滩涂与断崖，海雾常年不散，岸边泊着通往羽月要塞的小渡船
absent = ["本岸任何石砌建筑、塔楼、要塞与营地（1.12 要塞在对岸岛上；本土新要塞是 4.0.3a 的）", "任何人物与船员", "火、灯笼、船灯与任何灯火", "对岸要塞的灯火（白天看不见）", "帆船与大船", "沙漠与雪", "现代码头与现代建筑"]

[[water]]
name = "海峡浅海（常年海雾，对岸是外海北岛）"
path = [[160, 0], [160, 700]]
width_m = 320
depth_m = 25
src = "地图量取"

[[water]]
name = "入海小河（自东北来，在断崖北脚入海）"
path = [[497, 85], [465, 237], [433, 351], [357, 415], [300, 440]]
width_m = 32
depth_m = 2
src = "地图量取"

[[road]]
