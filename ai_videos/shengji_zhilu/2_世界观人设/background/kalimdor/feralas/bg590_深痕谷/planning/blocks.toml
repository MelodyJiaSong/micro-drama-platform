# 深痕谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (3230, 2200) m；坐标 [55.6, 56.1] 落在 (303, 177)。东西干道在场地北缘以外（谷口以北一两百米）。

[meta]
bg = "bg590"
name_zh = "深痕谷"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "谷心按坐标表落点；主洞口按区图洞穴图标（谷心以西约 21 px × 6.342 m/px ≈ 130 m）；谷长、谷宽与两侧岩坡形状推定"
# 世界树画面：雨林里一条被踩秃的山谷，尽头是几个相连的岩洞，洞口堆着骨头与撕碎的兽皮，洞内潮暗。
absent = ["任何人物、雪人与野兽（属 shot 层）", "火、火把、火堆与洞内任何光源", "建筑、帐篷与营地", "河流与湖（只有一道干冲沟）", "谷底的草、蕨与苔（踩秃的裸土）", "新鲜血迹", "第二条进出路（洞口是死路尽头）", "雪与冰", "现代建筑"]

