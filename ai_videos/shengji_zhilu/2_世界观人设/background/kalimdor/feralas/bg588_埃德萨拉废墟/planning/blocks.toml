# 埃德萨拉废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (3318, 1540) m；区图上废城弧线东西约 620 m（97 px × 6.342 m/px）。

[meta]
bg = "bg588"
name_zh = "埃德萨拉废墟"
size_m = [720, 560]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "原版区图上废城弧形挡墙东西约 97 px × 6.342 m/px ≈ 620 m；台地、长廊、广场与三翼的相对位置按地理页 dire_maul 子节点的原典方位摆，单体尺寸推定"
# 世界树画面：雨林中央的巨大夜精灵城废墟，高柱与断墙围出三块互不相通的区域
absent = ["任何人物与营地", "火把、火盆、火塘与任何火光", "完好的屋顶（横梁与穹顶大多塌落多年）", "东西两侧与山上的入城路（登城只有南面正中一道石阶）", "三翼内部的副本内景（温室、图书馆、王座厅、水晶牢笼）", "海、湖与大河", "沙漠与雪", "4.0.3a 后的任何新建筑", "现代建筑"]

