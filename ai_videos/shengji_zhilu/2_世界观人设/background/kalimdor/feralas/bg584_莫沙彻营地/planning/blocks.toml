# 莫沙彻营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg584"
name_zh = "莫沙彻营地"
size_m = [260, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图营地标识约 200 × 150 m（区级平面图 b901）；外扩到湖北岸与西缘细溪取 260 × 240 m。帐篷、长帐篷、栖台的尺寸按牛头人营地常规形制推定，无一手尺寸出处"
# 世界树画面：雨林深处的牛头人营地，圆顶兽皮帐篷绕着一根图腾柱
# 区图：营地在狂风湖北岸，北面小湖的溪流沿营地西侧入湖，东西干道从西南沿湖上来、向东出营（区级 terrain.toml）
absent = [
    "寨墙与城门（只有北缘、西缘的半人高木桩挡栏）",
    "石砌建筑与城墙",
    "任何人物、坐骑与飞行坐骑（默认空营、空栖台）",
    "燃着的火塘、炊烟与火把（火塘是冷灰余烬）",
    "旗帜纹章与文字标识",
    "沙漠、戈壁与枯黄秋色（本区常年湿绿）",
    "4.0.3a 后的新增建筑与任何现代建筑",
]

