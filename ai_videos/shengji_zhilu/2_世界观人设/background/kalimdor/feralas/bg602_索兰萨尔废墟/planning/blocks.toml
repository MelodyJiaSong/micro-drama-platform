# 索兰萨尔废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg602"
name_zh = "索兰萨尔废墟"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸出处。区图北岛西南角废墟图标（约 [26.5, 54.5]）距岛西岸、南岸各约 150–250 m（区级 terrain.toml：两岛间水道中线 y≈2524 m、宽 140 m）；殿基形制与尺寸按世界树「青白断柱与残墙半埋在草丛里、水边」推定"
# 世界树画面：岛西南的精灵废墟，青白断柱与残墙半埋在海风吹倒的草丛里，水边游动着蛇尾人形。
absent = ["任何完好的屋顶或穹顶", "城墙与城门", "营帐、木屋与篝火（占据者不留营地）", "燃着的火与人工光源", "紫色魔法灯、发光符文、浮空水晶", "码头、栈桥与船", "崖壁（西岸是缓坡与岸礁）", "沙漠、雪、熔岩", "被海啸淹没的岛与冲毁的海岸（4.0.3a）", "4.0.3a 后的任何改动"]

