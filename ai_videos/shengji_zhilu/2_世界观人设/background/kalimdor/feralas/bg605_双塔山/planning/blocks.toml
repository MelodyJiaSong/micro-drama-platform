# 双塔山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (2650, 560) m；两柱、北路、出水小溪与小池均取自 bg583/terrain.toml（区图量取，6.342 m/px）。

[meta]
bg = "bg605"
name_zh = "双塔山"
size_m = [600, 520]
px_per_m = 2.5
grid_m = 100
scale_src = "地图量取"
scale_note = "两柱轮廓、北路、小溪与小池按区图量取（bg583/terrain.toml 平移到本场地）；柱高 600 m 与落石坡、巨树位置推定"
# 世界树画面：西侧两座笔直拔起的巨大石柱山，顶部平坦、腰间缠云，通往北方荒漠的大路从两山之间穿过。
absent = ["任何人物、坐骑与野兽（属 shot 层）", "柱顶或柱身的任何建筑、栈道与阶梯", "火、烛火、灯笼与任何人工光源", "桥（路与溪并行不相交）", "营地与帐篷", "沙漠地面（北方的干黄只在天边）", "雪与冰", "现代建筑"]

