# 鸦风废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg601"
name_zh = "鸦风废墟"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸出处。区图 [41, 12] 的废墟图标紧贴西海岸山东麓（区级 terrain.toml 西海岸山东缘在 y≈508 m 处 x≈2600 m）；柱圈直径、崖脚位置、拱门与祭台按世界树「断柱围着中央大树与池水」推定"
# 世界树画面：北部山间一片上古精灵废墟，断柱围着中央一棵大树与一汪池水，崖壁上盘旋着鹰身女妖。
absent = ["任何完好的屋顶或穹顶", "城墙与城门（只有一道塌了拱的门柱）", "河流与湖（只有树脚一汪圆池）", "燃着的火与人工光源（祭台石盆冷空）", "紫色魔法灯、发光符文、浮空水晶", "木屋、帐篷与营地（占据者只有枯枝巢）", "道路与路牌（门外只有草地土路）", "沙漠、雪、熔岩", "海面与海岸（西海岸山挡在西边）", "4.0.3a 后的任何改动"]

