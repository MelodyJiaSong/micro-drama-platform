# 梦境之树 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (2860, 140) m；区图 6.342 m/px。环形湖由四段宽折线拼成，岛面留空。

[meta]
bg = "bg589"
name_zh = "梦境之树"
size_m = [720, 600]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "原版区图上湖外廓约 61 × 71 px、湖心岛约 36 × 52 px（× 6.342 m/px）；东岸山墙、西侧北路、西南出水溪按 bg583 terrain.toml 平移换算；巨树与门户尺寸推定"
# 世界树画面：湖心小岛上一棵高过整片雨林的巨树，树根盘成拱门，树干底部一道泛着绿光的门户，四周有龙裔守卫。
absent = ["通往湖心岛的桥或栈道", "任何人物、龙类与守卫（属 shot 层）", "开启中、喷涌或旋转的门户特效", "火、火把与任何营火", "建筑与营地（湖南岸只有倒伏的断柱）", "沙滩", "湖南岸 4.0.3a 后新建的栖地", "沙漠与雪", "现代建筑"]

