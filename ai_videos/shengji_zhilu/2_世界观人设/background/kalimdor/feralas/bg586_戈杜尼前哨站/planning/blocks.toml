# 戈杜尼前哨站 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg586"
name_zh = "戈杜尼前哨站"
size_m = [320, 340]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无一手尺寸；按区图裁切（约 1.6 m/px）量出山坳与西南小湖的相对位置，山坳底营寨约 190 × 200 m，外扩到北、东岩壁与西南湖岸取 320 × 340 m。围栏、洞口、棚、火坑按食人魔营地常规形制推定，巨人尺度（构件约常人用的两倍）"
# 世界树画面：山坳里的食人魔营地，草木被踩踏成枯黄褐色，粗木桩围栏与兽骨挂饰之间有两处洞口，最里面是一座土丘般的食人魔洞穴。
absent = [
    "任何人物、食人魔与被俘的雪人（全部属 shot 层，底图是空营）",
    "燃着的火坑、火把、灯笼与任何人工光源（火坑默认冷灰余烬、不冒烟）",
    "石砌房屋、城墙与砖瓦建筑（营寨只有木桩、兽皮与夯土）",
    "东面的木桩围栏（东面直接是岩壁）",
    "第二个寨口（唯一的口在南栅正中）",
    "被水淹没的山坳、积水成湖的营地",
    "雪、沙漠与枯黄秋色的整片林子（只有寨内被踩枯）",
    "任何文字、招牌与现代器物",
]

