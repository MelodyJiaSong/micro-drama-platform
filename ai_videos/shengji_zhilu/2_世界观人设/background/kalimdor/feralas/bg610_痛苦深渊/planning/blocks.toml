# 痛苦深渊 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg610"
name_zh = "痛苦深渊"
size_m = [440, 360]
px_per_m = 3.2
grid_m = 50
scale_src = "地图量取"
scale_note = "两坑、连沟与暗色小丘的位置按原版区图紫褐斑块量取（6.342 m/px）；坑的深度、巢丘高度、弯骨与枯树带均为推定。机位：北缘枯树带 (230, 18) 朝正南"
# 世界树画面：东南角一片紫色的虫巢地带，地面隆起硬壳与巨大的虫足状骨架，洞口向下延伸，空中有翅虫盘旋。
absent = [
    "草地、灌木与活树（地表寸草不生）",
    "水面与溪流",
    "帐篷、房屋、寨墙与任何人造建筑",
    "发光的巢洞、发光胶质、雾气与任何人工光源",
    "地下巢穴内景（要拍另立 bg）",
    "飞虫、虫群、人物与野兽（全部属 shot 层）",
    "雨、雪、夜景",
    "大灾变之后的任何改建",
]

