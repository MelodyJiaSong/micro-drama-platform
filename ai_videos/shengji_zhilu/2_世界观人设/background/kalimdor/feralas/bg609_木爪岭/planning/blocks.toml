# 木爪岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg609"
name_zh = "木爪岭"
size_m = [800, 560]
px_per_m = 1.8
grid_m = 100
scale_src = "地图量取"
scale_note = "范围取原版区图上湖两臂南端到紫褐虫巢斑块之间的绿色丘陵（6.342 m/px）；小水潭与东侧山带边线按区图量取，缓丘、营地、兽径、巢穴位置均为推定。机位：西北丘顶 (90, 80) 朝东南"
# 世界树画面：东南部起伏的林间丘陵，散布着豺狼人的兽皮帐篷与篝火，东南角地面裂开、露出紫色的虫巢。
absent = [
    "路与桥（丘陵里只有兽径）",
    "木屋、石屋与寨墙（只有兽皮帐篷与短木桩）",
    "燃着的篝火、火把与任何人工光源（默认态火堆全冷）",
    "悬崖与深谷（这里是缓丘）",
    "虫巢主体、塔状硬壳与洞口（在南缘外的 bg610，本档只露裂口边缘）",
    "雨、雪、夜景",
    "人物、坐骑、野兽与飞虫",
    "大灾变之后的任何改建",
]

