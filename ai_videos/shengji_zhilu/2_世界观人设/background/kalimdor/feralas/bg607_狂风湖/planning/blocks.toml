# 狂风湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg607"
name_zh = "狂风湖"
size_m = [560, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "湖的 V 字两臂按原版区图量取（6.342 m/px，区级平面图 b914 与营地湖两条 [[water]]）：西臂约 250 m 长、东臂约 350 m 长；宽度按区图描边推定。岸边巨树、倒木、芦苇湾、卵石滩均为推定。机位：陆舌南端 (268, 390) 朝正北"
# 世界树画面：东部营地脚下一面开阔的湖，湖面映着周围的巨树与远处石柱，岸边是缓坡草地。
absent = [
    "桥、码头、栈道、船与渡口（1.12 的这面湖是野湖）",
    "湖心岛与湖心任何建筑",
    "湖岸的房屋、帐篷与营火（营地在北岸丘顶，属 bg584）",
    "火、烛火、灯笼与任何人工光源",
    "雨、雪、夜景、冰面",
    "人物、坐骑、水中与岸上的动物",
    "大灾变之后的任何改建",
]

