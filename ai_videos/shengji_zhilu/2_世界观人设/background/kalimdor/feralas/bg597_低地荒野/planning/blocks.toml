# 低地荒野 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg597"
name_zh = "低地荒野"
size_m = [1000, 500]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "走廊东西长约 1 km 取自区级平面图 b907（区图巨树图标带约 [79–89]，按 63.55 m/% 折算后取走廊主段）；南北 500 m 含两侧山坡下缘。巨树位置、水潭、巨石均按卡片「沿路成列、间隔百来米」「中段路北一汪水潭」推定，区图上只看得出成列的六七枚树图标。机位：西段 (60, 258) 路心朝正东"
# 世界树画面：东部地势较低的雨林走廊，一条土路穿过巨树与蕨丛通向东边的红色峡谷，林间有树人与树精。
absent = [
    "房屋、营地、栅栏、帐篷与废墟（营地在走廊西口，属 bg584）",
    "豁口外峡谷里的水面与淹没的石林（那是 4.0.3a 之后）",
    "密不透光的连片林海（巨树稀疏成列，树间是开阔长草地）",
    "火、营火余烬、灯笼与任何人工光源",
    "雨、雪、夜景",
    "树人、树精、野兽、行人与坐骑",
    "石板路与桥（只有一条踩实的土路）",
    "大灾变之后的任何改建",
]

