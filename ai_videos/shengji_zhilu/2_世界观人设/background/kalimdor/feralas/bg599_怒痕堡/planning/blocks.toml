# 怒痕堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (3230, 1230) m；区图洞穴图标（区级块 b908，推定）落在 (131, 115)。
# 北路在场地西缘以外约 220 m；埃德萨拉废城在场地南缘以外。

[meta]
bg = "bg599"
name_zh = "怒痕堡"
size_m = [300, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "洞口按区图洞穴图标量取（是否即此处未核，见区级块 b908）；山墙西脚按区图量取；隧道长、洞厅尺寸与石雕墙位置推定"
# 世界树画面：西北山脚一处向内挖深的洞穴，洞口堆着骨骸，深处露出精灵式的石雕墙面与散落的书卷。
absent = ["任何人物、雪人与野兽（属 shot 层）", "火把、火盆、火堆、发光苔藓与洞内任何人工光源", "第二个洞口或第二条进出路", "新鲜血迹", "完整的地穴建筑（只露出一面墙）", "帐篷、营地与木构建筑", "河流与湖", "雪与冰（雪人住在雨林里，洞里不结冰）", "现代建筑"]

