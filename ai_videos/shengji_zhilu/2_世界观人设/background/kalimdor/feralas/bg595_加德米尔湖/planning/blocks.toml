# 加德米尔湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图（bg583）的 (2800, 60) m ＝ bg589 场地原点再向西 60 m、向北 80 m；湖、岛、山墙、北路与 bg589 同一套区图量取，坐标 ＝ bg589 + (60, 80)。

[meta]
bg = "bg595"
name_zh = "加德米尔湖"
size_m = [800, 720]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "原版区图上湖外廓约 61 × 71 px、湖心岛约 36 × 52 px（× 6.342 m/px），与 bg589 同一次量取；东岸山墙、西侧北路、西南出水溪按 bg583 terrain.toml 平移换算；西北岸浅滩与倒木推定"
# 世界树画面：北部一面平静的中型湖泊，湖心一座小岛，岛上一棵参天巨树；西北湖岸雾气里游荡着绿色小龙。
absent = ["通往湖心岛的桥或栈道", "码头、船只与渡口", "任何人物、龙类与守卫（属 shot 层）", "树根门户的光（属 bg589，从西北岸看不到）", "火、火把与任何营火", "建筑与营地（南岸只有倒伏的断柱）", "沙滩", "湖南岸 4.0.3a 后新建的栖地", "沙漠与雪", "现代建筑"]

