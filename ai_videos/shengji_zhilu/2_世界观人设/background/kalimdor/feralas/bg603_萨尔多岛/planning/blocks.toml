# 萨尔多岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg603"
name_zh = "萨尔多岛"
size_m = [900, 900]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "整岛建场。区图（约 6.4 m/px）上岛约 100 × 105 px ≈ 650–700 m 见方；区级 terrain.toml：北侧浅海带南沿 y≈1744、两岛间水道北沿 y≈2454、东侧海峡西沿 x≈2235，与之吻合。岛心取场地中心，四周各留约 100 m 海面"
# 世界树画面：西海岸外一座林木茂密的大岛，北侧是紫蓝顶的精灵要塞与码头，西南是被纳迦占据的废墟，岛上有狼群。
absent = ["崖岸（除东北角要塞脚下陡礁外全是低岸）", "岛上的村落、农田与第三处建筑群", "营帐与篝火", "燃着的火、点亮的石灯柱与任何人工光源", "停泊的船只（渡船属 shot 层）", "狼群与任何动物、人物（属 shot 层）", "沙漠、雪、熔岩", "被海啸淹没的岛、冲毁的要塞与迁到本土的新要塞（4.0.3a）", "飞行坐骑与训练假人", "4.0.3a 后的任何改动"]

