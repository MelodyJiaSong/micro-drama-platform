# 沙尔扎鲁的巢穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 北缘一窄条是岛北岸礁石滩与外海，其余是岛北端的岩体，洞道、主洞、水道、小岩腔都挖在岩体里（块画在其上）。
# 洞口方位取区级平面图 b911（区图南岛北端的洞穴符号）；洞内布局无一手出处，一律推定。

[meta]
bg = "bg604"
name_zh = "沙尔扎鲁的巢穴"
size_m = [180, 150]
px_per_m = 6.0
scale_src = "推定"
scale_note = "区图上只是南岛北端一个洞穴符号；主洞取约 45×35 m、小岩腔约 25×20 m 的中型海蚀洞，洞道约 40 m、水道约 60 m，场地向北多留一条装下洞外礁石滩与外海"
# 世界树画面：岛北端一座曲折的海蚀岩洞，主洞与小洞之间由一道水道相连，洞壁挂着海草与珊瑚，光线幽蓝。
absent = [
  "任何人物、蛇尾人形生物、海兽与任何动物（底图洞内是空的）",
  "火、火把、火盆、烛火、灯笼等任何人工光源",
  "自发光的珊瑚、水晶、符文、魔法光与传送门",
  "砌筑建筑、祭坛、王座、宝箱、宝物堆与家具",
  "可通行的第二出口（南端岩缝不通人）",
  "被海啸淹没的岛与洞（4.0.3a）",
  "沙漠、雪、熔岩与枯黄植被",
  "任何现代器物、文字与标记",
]

