# 碧火谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [42, 86] 落在本场地 (165, 160)；区图 1 px ≈ 5.247 m。

[meta]
bg = "bg572"
name_zh = "碧火谷"
size_m = [420, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "区图裁切量取：北侧山嘴与南侧大山体之间的低洼约 30 px（≈150 m）宽，谷口朝东；谷口外东北约 200 m 的小潭按区图位置画入。营地内火盆 / 布帐 / 符文圈尺寸按常识推定"
# 世界树画面：南端的萨特营地，绿色火盆排成弧形，地上画着发光的符文圈（本档裁定：符文是颜料，不发光）
absent = [
    "篝火、炊烟与火把（唯一的人工光是七只火盆的绿火）",
    "自发光的符文（符文圈是浅灰绿颜料，只接火盆的光）",
    "任何人物、恶魔与动物（默认空营）",
    "流动的河（河与主道都在谷外东侧，本场地只有谷口外一个小潭）",
    "石砌房屋与城墙",
    "健康的绿树与鲜草",
    "文字、旗帜纹章与木牌字迹",
    "积雪与晴天蓝天",
]

