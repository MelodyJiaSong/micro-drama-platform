# 翡翠圣地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg570"
name_zh = "翡翠圣地"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "场地原点对应区级坐标 (2581, 2704) m，点位 [51, 80] 落在场地 (100, 100)；南段主道在西南约 200 m 外（区级 terrain.toml），东墙中段山体在东北。净土直径约 110 m、石台与两顶帐篷、七棵古树按世界树画面推定"
# 世界树画面：腐化森林中一小块仍然鲜绿的林地，绿草与健康树木被一道看不见的界线圈住，中央立着德鲁伊的石台
absent = [
    "飞行栖架与飞行管理员（中立飞行点是 2.1.0 才加的）",
    "发光的结界、光罩、光柱与任何魔法特效（界线只是颜色的分界）",
    "火堆、火盆、烛火、灯笼与任何人工光源",
    "清澈的水池、溪流与月亮井式的圆池（本区没有干净的活水）",
    "石砌房屋、木屋、寨墙与瞭望塔",
    "兽皮帐篷、骨图腾（那是南边熊怪村的形制）",
    "界线内的枯树、黑泥与孢子雾",
    "任何人物、坐骑与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

