# 碧火小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图点位 [43.55, 17.96] 落在本场地 (160, 150)；裁切图 1 px ≈ 1.31 m（区图 1 px ≈ 5.247 m，裁切放大 4 倍）。

[meta]
bg = "bg573"
name_zh = "碧火小径"
size_m = [380, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：红十字东侧一道短陡坎，坎后东约 140 m 与东南约 90 m 各一小潭，东南约 180 m 为北段主道弯，西北约 90 m 起山墙。营地内帐幕 / 三脚架 / 屏风尺寸按常识推定"
grid_m = 50
# 世界树画面：北部林道旁的萨特营，帐幕挂在枯树之间，火光把绿雾照成一团团光晕
absent = [
    "立起来的帐篷（本营全是挂在枯树横枝间的单坡帐幕）",
    "篝火、火把、烛火与灯笼（唯一的人工光是三只吊火碗的绿火）",
    "任何人物、恶魔与动物（默认空营）",
    "石砌房屋、木屋与寨墙",
    "健康的绿树与鲜草",
    "开阔天空（林冠与山墙把营地压成封闭构图）",
    "月亮、星空、雨雪",
    "文字、旗帜纹章与木牌字迹",
]

