# 克斯特拉斯废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地窗口 ＝ 区级平面图（bg567 terrain.toml，区图像素 × 5.247 m）的 x 1915–2335、y 2198–2618 一块；
# 坐标表点 [42, 68] 落在场地 (293, 185)。主道、小溪沿用区级图的折线平移过来。

[meta]
bg = "bg580"
name_zh = "克斯特拉斯废墟"
size_m = [420, 420]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地窗口按区图比例尺（5.247 m/px）从区级平面图切出 420 × 420 m：西北 / 西南坡脚、两汪死水潭、南侧山嘴与东缘主道都从区图量取；废墟各块尺寸无一手出处，一律推定"
# 世界树画面：平地上的一片白石残墙，德鲁伊与萨特在废墟间对峙，地面散落断裂的法杖
absent = [
    "任何人物、德鲁伊、萨特与动物（默认空废墟）",
    "营火、火盆、法术光与任何人工光源",
    "完整的屋顶与可住人的房屋（全是塌空的墙框）",
    "高台、城墙与塔楼（废墟是平地残墙，最高是约 9 m 的拱墙）",
    "桥与台阶式路面（主道平地擦过废墟东缘）",
    "清澈活水与健康绿林",
    "晴天、直射阳光、雨雪",
    "文字、旗帜与纹章",
    "4.0.3a 后的任何改动",
]

