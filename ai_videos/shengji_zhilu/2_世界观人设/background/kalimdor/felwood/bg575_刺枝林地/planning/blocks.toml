# 刺枝林地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg575"
name_zh = "刺枝林地"
size_m = [240, 240]
px_per_m = 6.0
scale_src = "推定"
scale_note = "场地原点对应区级坐标 (3140, 721) m，点位 [62, 24] 落在场地 (120, 120)；山坳轮廓与西北小水潭按区图裁切（约 1.3 m / 裁切像素）量取，三顶帐篷、火塘、栖架的位置与尺寸按世界树画面推定"
# 世界树画面：北部林中的小块净土，紫顶帐篷立在尚未枯死的绿草上，角鹰兽栖在旁边木架上
absent = [
    "飞禽、坐骑与任何动物（栖架是空的，飞禽属 shot 层）",
    "一刀切的净土界线与发光结界（那是南边的翡翠圣地；这里的草是被慢慢蚕食的，边缘渐变发黄）",
    "燃着的火堆、火盆、烛火、灯笼与任何人工光源（火塘是冷灰余烬）",
    "石砌房屋、木屋、寨墙与瞭望塔",
    "兽皮帐篷、骨图腾（那是北边熊怪村的形制）",
    "冒泡发绿的污水（坳里的小潭是平静的灰绿浅水）",
    "雪与冰（那是东北隧道另一头的邻区）",
    "任何人物与文字",
    "4.0.3a 后的任何改建",
]

