# 碎痕谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地窗口 ＝ 区级平面图（bg567 terrain.toml，区图像素 × 5.247 m）的 x 1940–2400、y 1220–1620 一块；
# 区级 b904（坑群）中心 (2204, 1406) 落在本图 (264, 186)。主道与东侧山带沿用区级图的折线平移过来。

[meta]
bg = "bg581"
name_zh = "碎痕谷"
size_m = [460, 400]
px_per_m = 3.4
scale_src = "地图量取"
scale_note = "场地窗口按区图比例尺（5.247 m/px）从区级平面图切出 460 × 400 m：主道、东侧山带西坡与坑群范围（区图七个星形坑图标）量自区图；单个坑的直径与深度无一手出处，一律推定"
# 世界树画面：陨石砸出的浅坑群，坑底裸露出赤黑岩块，坑壁边缘的树全被推倒成放射状
absent = [
    "任何人物、恶魔、地狱火与动物",
    "燃烧、发红或冒烟的陨石（坑底岩块早已冷透）",
    "火、火星、熔岩与任何人工光源",
    "大型单一火山口或深井（这是一群浅坑，最深约 6 m）",
    "坑里的积水湖（坑底只沉着雾）",
    "建筑、营地、围栏与道路设施",
    "健康绿林与鲜嫩草地",
    "晴天、直射阳光、雨雪",
    "4.0.3a 后的任何改动",
]

