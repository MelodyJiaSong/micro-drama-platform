# 血毒瀑布 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地 ＝ 区级 terrain.toml 平移裁切：区级坐标 (1880, 1520) m 落在本场地 (0, 0)。

[meta]
bg = "bg576"
name_zh = "血毒瀑布"
size_m = [600, 420]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "从区级 bg567 terrain.toml（区图 1 px ≈ 5.247 m）平移裁切：山脊、河、主道沿用区级量取线；断崖与瀑布高度按区级卡「落差十余米」推定"
# 世界树画面：高处垂落的浑浊瀑布，水呈暗绿发黄，落点翻起厚厚的黄白泡沫
absent = [
    "任何人工建筑、桥与栈道（跌水口一带只有两条土路）",
    "火光、营火与任何人工光源（默认阴天漫射光）",
    "清澈透明的水（水全是浑浊暗绿发黄）",
    "发光的水面或发光苔藓（荧绿只是颜色）",
    "陨坑群（在台地北侧，潭边仰拍看不到）",
    "谷外那片湖的全貌（只在西泄缺口外露一角水面）",
    "鲜绿健康的树与草",
    "积雪、冰与雨",
    "任何人物与动物",
]

