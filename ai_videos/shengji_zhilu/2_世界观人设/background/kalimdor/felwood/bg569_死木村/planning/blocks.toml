# 死木村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg569"
name_zh = "死木村"
size_m = [260, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "场地原点对应区级坐标 (2510, 2897) m，点位 [50.22, 85.79] 落在场地 (130, 110)。主道走向按区级 terrain.toml 南段主道折线换算（地图量取）；洼地直径约 130 m、五座棚与火塘布局按世界树画面「歪斜的木棚与兽骨图腾插在泥地里」推定"
# 世界树画面：南部的熊怪营寨，歪斜的木棚与兽骨图腾插在泥地里，篝火烧着发绿的火苗
absent = [
    "密集挤在一起的棚屋（那是北端魔爪村的形制，本村稀、歪、塌）",
    "木雕图腾柱（本村的图腾是兽骨扎成、直接插泥）",
    "兽人式兽皮帐篷、削尖拒马、寨墙与瞭望塔",
    "火把、烛火、灯笼与火塘之外的任何人工光源",
    "发光的腐化雾气、荧光特效（荧绿只是苔垢颜色）",
    "河流与湖面（洼底只有泥坑积水）",
    "鲜绿健康的草木（净土在北边约 200 m 外，不入本场）",
    "旅店、飞行点、任何石砌建筑",
    "任何人物、熊怪与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

