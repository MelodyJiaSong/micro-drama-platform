# 加德纳尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg574"
name_zh = "加德纳尔"
size_m = [400, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树无坐标；场地原点对应区级坐标 (1752, 1927) m，区级卡推定的 [37, 59]（b901 中心 (1952, 2057)）落在场地 (200, 130)。东侧支路按区级 terrain「加德纳尔支路」换算（地图量取）；西、南山坡按西墙南段山块外缘推定。洞口放西侧山脚是推定（区级 b901 note 读成东侧图标，待实机坐标核）"
# 世界树画面：被改造成邪教据点的洼地聚落，木屋顶插着骨制旗杆，地面刻满巨大的召唤法阵
absent = [
    "发光的法阵、光柱、能量漩涡与任何魔法特效（刻槽里只有黑灰）",
    "铁杖小绿火之外的任何火光：火把、火盆、烛火、灯笼",
    "洞内的灯火与廊道（地下迷宫另立 bg，本档只拍洞口）",
    "旗帜上的纹章、图案与文字（破布无图案）",
    "湖面与河流（区界湖在西北三四百米外，不入画）",
    "寨墙、瞭望塔与石砌大房",
    "鲜绿健康的草木",
    "任何人物、邪教徒、恶魔、地狱犬与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

