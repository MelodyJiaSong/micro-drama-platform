# 恐怖图腾岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg659"
name_zh = "恐怖图腾岗哨"
size_m = [360, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图裁切：西头帐篷图标在坐标红十字处（本图约 150, 98），另一组帐篷图标在其东约 160 m；北面是东南山块南脸、南面一道碎石矮脊、矮脊外约 90–160 m 是东南出区小路，主路尽头在西南口外约 130 m（terrain.toml 量取）。帐篷、火塘、拒马尺寸按设防小营地推定，实机量取后校正"
# 世界树画面：山坳里一片牛头人营地，帐面是发暗的深色兽皮、图腾柱涂黑，营中来回走动的牛头人全副武装
absent = [
    "米黄与浅色兽皮帐、鲜艳彩绘帐面（本营帐面一律深褐近黑）",
    "点着的火塘、火把、火盆与任何人工光源（火塘默认冷灰）",
    "烟柱与火星",
    "石砌房屋、木板寨墙与瞭望塔（唯一的防御是西南口的尖木拒马）",
    "旗帜、招牌与文字",
    "任何人物、哨兵、坐骑与动物",
    "河流与水面",
    "树林（坳里只有岩壁脚的枯草与矮脊上几丛矮刺柏）",
    "4.0.3a 后的改建、炸弹坑与钢铁工事",
]

