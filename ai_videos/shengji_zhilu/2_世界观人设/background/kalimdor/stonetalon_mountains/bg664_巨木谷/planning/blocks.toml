# 巨木谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg664"
name_zh = "巨木谷"
size_m = [800, 600]
px_per_m = 2.0
grid_m = 100
scale_src = "推定"
scale_note = "世界树无坐标；方位与尺度沿用区级平面图的推定块（巨木谷 267 × 178 m，贴主路东南段北侧），场地放大到 800 × 600 m 以框住两侧山脚与主路进出林口。林块、倒木与老树位置全部推定，实机量取后校正"
# 世界树画面：东南山麓一片还没被砍的高针叶林谷，树干笔直高耸，林下光线很暗，地面铺着厚松针
absent = [
    "树桩、锯口、原木垛与锯木架（本谷从没被砍过）",
    "伐木机械与铁架构造",
    "溪流、水潭与湖",
    "聚落、营地、帐篷与任何建筑",
    "火、烛火、灯笼与任何人工光源",
    "开阔的天空（只从树冠缝里漏出碎片）",
    "任何人物与动物（蜘蛛属 shot 层）",
    "雪与冰",
    "4.0.3a 后的改建",
]

