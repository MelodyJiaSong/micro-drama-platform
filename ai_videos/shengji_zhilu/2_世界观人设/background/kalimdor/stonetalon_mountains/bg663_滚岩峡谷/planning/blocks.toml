# 滚岩峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg663"
name_zh = "滚岩峡谷"
size_m = [480, 360]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图裁切上主路到谷尽头洞口图标约 350 m（区图 4.46 m/px 量取）；谷宽、崖高与落石尺寸按「小峡谷」推定，实机量取后校正。区图谷南侧另有一个洞口图标，归属未核，本图不画"
# 世界树画面：一条落满滚石的小峡谷，谷壁碎裂、随时还在掉石头，山羊在石堆间跳跃
absent = [
    "河流、溪水与水潭",
    "成片树林（只有崖缝里零星矮松）",
    "聚落、营地、帐篷与任何建筑",
    "矿车轨道、木栈道与吊架",
    "火把、火盆、灯笼与任何人工光源",
    "洞口透出的紫光或任何光亮（晶簇在洞内深处，属洞内 bg）",
    "正在滚落的石头与扬起的尘土",
    "任何人物与动物（岩羊、狗头人属 shot 层）",
    "4.0.3a 后的改建",
]

