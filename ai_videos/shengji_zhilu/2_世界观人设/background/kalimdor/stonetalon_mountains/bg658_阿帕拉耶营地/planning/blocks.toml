# 阿帕拉耶营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg658"
name_zh = "阿帕拉耶营地"
size_m = [300, 250]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图裁切：坐标红十字落在东南出区小路上（本图约 150, 48），帐篷图标在其南约 70 m、偏西约 20 m，小路在东侧约 90 m 处拐向正南（terrain.toml 同名路段量取）。场地 300 × 250 m 框住北侧矮山脊、小路拐弯与西南岩坡脚；五顶帐篷与火塘的尺寸按小营地推定，实机量取后校正"
# 世界树画面：东部山坡上几顶被掀翻烧过的牛头人帐篷，帐架焦黑，地上散着打翻的器物
absent = [
    "完好的帐篷（五顶全部残损：两顶掀翻、两顶只剩帐架、一顶半塌烧穿）",
    "正在燃烧的火、烟柱、火星与红热炭火（烧痕早已冷透）",
    "寨墙、木栅、拒马与瞭望塔（营地四面敞开）",
    "石砌房屋与任何石屋",
    "旗帜、招牌与文字",
    "任何人物、遗体与动物",
    "河流与水面",
    "伐木场、树桩与锯木架",
    "4.0.3a 后的改建、炸弹坑与钢铁工事",
]

