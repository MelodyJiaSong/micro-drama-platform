# 玛拉卡金 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg660"
name_zh = "玛拉卡金"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图裁切：坐标红十字（本图约 110, 100）落在主路尽头西南的绿谷里，主路（蛛网小径）在其东北约 70 m 到头、往东接东南出区小路（terrain.toml 量取），茅棚图标在红十字东南约 150 m 的南山脚。场地 300 × 260 m 框住路尽头、台地与南山脚岩湾；茅棚、晾架尺寸按小猎户村推定，实机量取后校正"
# 世界树画面：山道旁一小片巨魔营地，兽骨与彩绘木杆撑起的低矮茅棚，架子上晾着猎来的兽皮与肉干
absent = [
    "高大的尖顶兽皮帐篷（本村是低矮兽骨茅棚）",
    "石砌房屋、木板寨墙、木栅与瞭望塔（村子不设围墙，只有獠牙拱门）",
    "点着的火塘、烟熏棚、烟柱与任何人工光源（肉干是风干的）",
    "热带棕榈、椰树与海滩",
    "旗帜、招牌与文字",
    "任何人物、猎物活体与动物",
    "河流（本地唯一的水是圆木水槽里的积水）",
    "伐木场、树桩与锯木架",
    "4.0.3a 后的改建、炸弹坑与钢铁工事",
]

