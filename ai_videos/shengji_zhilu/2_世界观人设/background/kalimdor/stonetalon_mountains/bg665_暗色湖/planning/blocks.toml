# 暗色湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg665"
name_zh = "暗色湖"
size_m = [600, 500]
px_per_m = 2.5
grid_m = 50
scale_src = "推定"
scale_note = "湖的尺寸从原版区图量取（约 45 × 40 px × 4.46 m/px ≈ 200 × 180 m），四条路的接点按区图裁切的相对方位摆；林带与山脊外缘、岛的尺寸推定，实机量取后校正"
# 世界树画面：群峰正中一潭墨绿色的静水，四周被高针叶林围死，水面几乎不起波，常年浮着一层薄雾
absent = [
    "房屋、码头、栈桥、渡船与哨站",
    "树桩、锯口与伐木痕迹",
    "流入或流出的河流（湖是静水）",
    "熔岩与焦土（那是西南方的火谷）",
    "火、烛火、灯笼与任何人工光源",
    "东岸与北岸的路（路全在西岸汇合）",
    "任何人物与动物（翼龙、软泥怪、雷霆蜥蜴属 shot 层）",
    "雪与冰封的湖面",
    "4.0.3a 后的改建与新营地",
]

