# 希塞尔山谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 谷走向（东西、口朝东接主路）按区图裁切量取；谷宽、谷长、壁高与谷内每一块都是推定。

[meta]
bg = "bg666"
name_zh = "希塞尔山谷"
size_m = [680, 360]
px_per_m = 2.3
grid_m = 50
scale_src = "推定"
scale_note = "区图裁切上这块灰绿平地东西约 120 px × 4.46 m/px ≈ 540 m，场地取 680 × 360 m 把谷口外的主路也框进来；谷宽 80–150–60 m 为推定"
# 世界树画面：一条从主路岔出去的空旷石谷，两侧是笔直的灰岩壁，谷底几乎什么都没有
absent = ["任何建筑与废墟（4.0.3a 后才加的精灵废墟）", "石柱 / 断墙 / 雕像", "营地与帐篷", "溪流 / 水潭 / 任何水体", "谷内道路与车辙", "茂密树林", "熔岩与焦土", "雪", "火堆与任何人工光源"]

