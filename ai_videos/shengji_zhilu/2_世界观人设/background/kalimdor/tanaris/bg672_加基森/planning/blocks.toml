# 加基森 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg672"
name_zh = "加基森"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "取 320 × 280 m：区级平面图（bg670 terrain.toml）把镇块量成 360 × 260 m（区图城墙图标约 55 × 40 px），镇墙按其内缩为 210 × 170 m；无一手尺寸出处"
# 世界树画面：沙漠中的地精铁皮棚屋镇，锈蚀的管道与风车，镇口立着火炮
# 场地外（只进远景，不画）：北约 250 m 起是北墙西段赭黄山链；东门沙路向东约 1 km 到热砂港；南面是深沙平原
# 锚点机位在东门外约 80 m 的沙丘顶 (315, 150) 朝西
absent = [
    "河 / 池塘 / 树木 / 草地（镇里的水只有中心水塔与井台）",
    "海面（被北墙东段山脚与沙丘挡住，本档看不到海）",
    "石砌大城墙与城楼（镇墙是土坯矮墙，东门没有门扇）",
    "飞行坐骑与平台上的飞兽（平台空着，飞兽属 shot 层）",
    "冒烟的烟囱、点着的灯与火盆（白天零人工光源）",
    "任何人物、守卫与动物（默认空镇）",
    "招牌 / 旗帜上的文字与纹章",
]

