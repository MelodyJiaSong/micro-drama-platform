# 长者高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级图（bg757 terrain.toml）的 (630, 110) m；区图 1 px ≈ 0.9525 m，两轴同比。

[meta]
bg = "bg758"
name_zh = "长者高地"
size_m = [200, 160]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "台面轮廓、八角内场、两顶小帐与两座桥头从原版区图量取（1 px ≈ 0.9525 m，区级 terrain.toml 同一换算）；台心大帐、活树桩、火塘与三顶中等大帐区图上看不出，按世界树画面推定"
# 世界树画面：主台正东的一座独立平顶台地，台上立着几顶绘满自然纹样的大帐与活着的树桩图腾，绿意比别处明显
absent = [
    "任何人物与动物（默认空台）",
    "升降台（升降台只在主台西南 / 东北两侧）",
    "第三条吊桥或任何实心通道（只有西端两条绳桥）",
    "石砌建筑、石墙与护墙（台缘只有稀疏矮木桩）",
    "火把、灯笼、帐内透出的火光（火塘是冷灰余烬）",
    "水池、溪流与任何水体",
    "高大乔木与森林（只有截断后抽新枝的树桩）",
    "飞艇与飞艇塔（3.2.0 才加）",
    "4.0.3a 后的任何改建",
]

