# 低层高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
#
# 场地 ＝ 区级平面图（bg757）上 x 290–490、y 270–470 那一块（本图坐标 ＝ 区图坐标 − [290, 270]）。
# 水池、栖木塔、两条吊桥的落点、台缘折线从区图量取；各帐位置区图上只有图标没有标字，一律推定。
# 锚点机位：西南升降台顶（b12）朝东北。

[meta]
bg = "bg762"
name_zh = "低层高地"
size_m = [200, 200]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "从 bg757 区级平面图（WorldMapArea 坐标表换算，1 px ≈ 0.95 m）裁出主台西半 200 × 200 m；层界区图无标字，按吊桥拓扑推定"
# 世界树画面：中央主台最低的一层，一圈摊位与挑高的兽皮商帐围着中心空地，地面是夯实的红土与铺开的编席
absent = ["飞艇与飞艇塔（3.2.0 才加）", "石砌建筑与城墙", "河流与瀑布", "树林", "火把街灯与点着的火", "训练假人", "飞行坐骑", "台面上的石桥或实心通道", "人物与动物", "4.0.3a 后的任何改建"]

