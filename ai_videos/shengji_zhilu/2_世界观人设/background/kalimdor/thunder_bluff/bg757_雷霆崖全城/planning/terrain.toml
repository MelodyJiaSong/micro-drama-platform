# 中央主台的三层（低 / 中 / 顶）区图上没有标字：按「每座外围台地两条桥各连哪一层」（地理页）反推——
# 灵魂高地连低层 + 中层、长者高地连顶层 + 中层、猎人高地连低层 + 顶层 ⇒ 中层在北缘、低层在西半、顶层在东半。故 src = 推定。

