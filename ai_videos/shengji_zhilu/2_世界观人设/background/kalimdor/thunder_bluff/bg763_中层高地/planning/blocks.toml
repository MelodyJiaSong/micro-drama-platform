# 中层高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
#
# 场地 ＝ 区级平面图（bg757）上 x 345–605、y 170–330 那一块（本图坐标 ＝ 区图坐标 − [345, 170]）。
# 台缘折线、两条吊桥的落点、栖木塔从区图量取；本层是主台北缘的一条弧形带，层界区图无标字（按吊桥拓扑推定），
# 各作坊帐 / 晾架位置一律推定。场地西南角往下是低层（bg762），东南角往上是顶层（bg761）。
# 锚点机位：西端桥头帐廊（b10）朝东。

[meta]
bg = "bg763"
name_zh = "中层高地"
size_m = [260, 160]
px_per_m = 4.0
label_mode = "number"
scale_src = "地图量取"
scale_note = "从 bg757 区级平面图（WorldMapArea 坐标表换算，1 px ≈ 0.95 m）裁出主台北缘 260 × 160 m；层界区图无标字，按吊桥拓扑推定"
# 世界树画面：主台的中间一层，沿崖边一圈作坊帐篷，架子上摊着皮子、草药与织物，风把布幡吹得笔直
absent = ["飞艇与飞艇塔（3.2.0 才加）", "升降梯（两部都在低层）", "水池与任何水面", "石砌建筑与城墙", "发光的法术器物与魔法光效", "点着的火与火把", "训练假人", "飞行坐骑", "人物与动物", "4.0.3a 后的任何改建"]

