# 猎人高地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本图原点 ＝ 区级图（bg757 terrain.toml）的 (470, 440) m；区图 1 px ≈ 0.9525 m，两轴同比。

[meta]
bg = "bg759"
name_zh = "猎人高地"
size_m = [180, 180]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "台面轮廓、两座桥头与六顶帐篷的落点 / 尺寸从原版区图量取（1 px ≈ 0.9525 m，区级 terrain.toml 同一换算）；练功木桩、晾皮架、拴兽木柱与火塘区图上看不出，按世界树画面推定"
# 世界树画面：主台正南的一座台地，台上立着成排的练功木桩与晾皮架，帐外拴着猎豹与巨狼
absent = [
    "任何人物与动物（世界树里拴着的猎豹 / 巨狼属 shot 层；底图里拴兽木柱是空的）",
    "训练假人（旧世没有；只有砍坑洼的木桩）",
    "升降台（只在主台西南 / 东北两侧）",
    "第三条吊桥或任何实心通道（只有西北、北缘偏东两条绳桥）",
    "青草台面（这里是踩实的红褐硬土，草极少）",
    "石砌建筑与石墙（台缘只有原木栅栏）",
    "火把、灯笼、帐内透出的火光（火塘是冷灰余烬）",
    "任何水体",
    "飞艇与飞艇塔（3.2.0 才加）",
    "4.0.3a 后的任何改建",
]

