# 红云台地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg622"
name_zh = "红云台地"
size_m = [1400, 560]
px_per_m = 1.1
grid_m = 100
scale_src = "地图量取"
scale_note = "场地原点 ＝ 区级平面图（bg615 terrain.toml，4.688 m/px）坐标 (1650, 2250)；北缘断崖、南缘山链、东南山块、西南圆顶孤台、南路与营地 / 峡谷位置都从 terrain.toml 与区级 blocks 平移过来。台面上的草丘、孤树、红岩与机位是推定"
# 世界树画面：南端高崖之上一块与下方平原隔绝的起伏草台，草色偏黄，边缘是直落的赤红砂岩断面
absent = [
    "任何人物与动物（营地里的人、台面上的野兽都属 shot 层）",
    "训练假人（4.0.3a 后才摆进营地）",
    "升降梯、吊桥、台阶等人造上下台设施（只有西端一道天然长草缓坡）",
    "火光与烟（营地火塘默认冷灰余烬）",
    "湖、河、水潭（台面上没有水）",
    "成片树林（台面只有零星孤树）",
    "石砌建筑、围墙、门楼",
    "飞行坐骑",
    "4.0.3a 后的任何改动",
]

