# 火石台地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg620"
name_zh = "火石台地"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "推定"
scale_note = "wiki 空壳、世界树无坐标、区级平面图无此块：孤台按「北部草原中一座空的孤立平顶台」推定为 150 × 100 m、高 45 m；场地取孤台 + 台脚碎岩带 + 东南约 200 m 外的锚点机位能装下的 400 × 400 m。实机量取后回填"
# 世界树画面：另一座孤立的平顶砂岩台地，岩色比周围更红，日照下像烧过一样
absent = [
    "任何人物与动物",
    "帐篷、图腾柱、火塘、绳桥、升降梯等任何人造物（这是一座空台，不是住人的高台）",
    "火、烟、发红发亮的热岩面（「像烧过」是岩石本色）",
    "树木（台顶与台脚都没有树）",
    "水体",
    "周边三百米内的其他岩体",
    "4.0.3a 后的任何改动",
]

