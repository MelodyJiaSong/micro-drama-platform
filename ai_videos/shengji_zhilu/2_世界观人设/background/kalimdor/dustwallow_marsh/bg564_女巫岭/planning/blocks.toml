# 女巫岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 原点 ＝ 区级平面图（bg543）坐标 (2400, 560)；岭脊、西麓水道、南麓大路、海岸取自 bg543 terrain.toml（地图量取），
# 孤屋取 AreaPOI 坐标（bg549 [55.6, 26.2] → 区级 (2669.1, 838.5)）；营地、枯树丛、遗留物位置无一手出处，一律推定。

[meta]
bg = "bg564"
name_zh = "女巫岭"
size_m = [600, 520]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "岭的轮廓取区级 terrain.toml「女巫岭」多边形（约 430 × 320 m），四周各留出水道、大路与海岸；x 向东、y 向南，原点 ＝ 区级 (2400, 560)"
# 世界树画面：通往塞拉摩的半岛上一处雾气缭绕的低岭，枯树下游荡着僵尸与幽魂，坡下散着鱼人营地。
absent = [
    "崖壁、裸岩与陡坎（这是缓坡圆脊，只有东坡落到泥滩处一道一人高的潮蚀土坎）",
    "活树、绿叶与花（岭上的树全是枯死多年的矮老树）",
    "亮着的火堆、火把、灯笼（营地火塘冷灰不冒烟；唯一人工光是孤屋窗里一粒油灯）",
    "孤屋以外的任何房子与石砌建筑",
    "任何人物、尸骸、幽魂、营地居民与动物（属 shot 层）",
    "晴天硬阴影与远景清晰的山墙（雾是常态）",
    "雪、冰与雨",
    "空中航线与飞行的坐骑",
]

