# 黑雾洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1449, 610) m；坐标表点位 [33.3, 22.8] ＝ 区级 (1599, 730) 落在本场地 (150, 120)。
# 区图裁切 ref/bg555_黑雾洞穴_map_crop.png 按 1 px ≈ 1.2 m 读：西、北山体与东侧湿地水道按裁切量取；
# 矿场、工棚残基、矿渣坡、矿车与车辙路无一手出处，推定。

[meta]
bg = "bg555"
name_zh = "黑雾洞穴"
size_m = [320, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地范围按区图裁切换算（裁切 1 px ≈ 1.2 m）；坑口尺寸（宽约 4 m、高约 3 m）与矿场大小推定"
# 世界树画面：沼泽西北角一座废弃小矿坑，洞口挂满厚重灰白蛛网，外面几间塌了半边的小屋残基。
absent = [
    "任何人物与动物（巢主蜘蛛属 shot 层）",
    "洞内景象与洞内光源（网后全黑）",
    "火光、火把、灯笼与燃着的火（塌屋烟熏痕冷透多年）",
    "完好的房屋、有人住的营地与炊烟（工棚全是塌顶残基）",
    "木桩寨与帐篷（南邻木桩寨在本场地以外，看不到）",
    "海面与岛上白城（被北中脊与山墙挡住）",
    "成片高大树林（只有几棵灰白枯立木）",
    "完整的矿车轨道与运转的矿井设备（轨道伸出三四米即断）",
    "雪、沙漠与熔岩",
]

