# 泥潭沼泽 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1650, 1400) m。坐标表点位：废弃哨塔 [35.9, 54.1] ＝ 区级 (1723, 1731) → 本场地 (73, 331) 一带（路边）；
# 西水道、中央长脊西南坡、南支土路按区级 terrain.toml 平移过来；塔贝萨小屋沿用区级推定位置 (2208, 1824) → (558, 424)。
# 飞艇残骸区图无图标、无坐标，位置推定。默认机位 b01 朝东北（约 45°），视野约 10°–80°：哨塔在左后方、小屋在右侧画外。

[meta]
bg = "bg562"
name_zh = "泥潭沼泽"
size_m = [1000, 700]
px_per_m = 1.6
grid_m = 100
scale_src = "地图量取"
scale_note = "场地范围按区级 terrain.toml 的西水道、中央长脊与南支土路换算；泥岛、细水道与残骸位置推定"
# 世界树画面：沼泽中央最泥泞的一片深沼，灰黑泥浆与浮萍水道，鳄鱼与软泥怪伏在浅水里。
absent = [
    "任何人物、鳄鱼、软泥怪与生物（属 shot 层）",
    "干硬的平地与耕地（除土路与泥岛顶外全是陷脚烂泥）",
    "火光、冒烟与燃烧的残骸（残骸多年前坠毁，焦痕冷透）",
    "完好的、飘在空中的飞艇（只有斜栽泥里的残骸）",
    "海面、码头与船（长脊挡住视线，看不到海）",
    "成片的高大树林（只有低矮灌丛与枯树桩）",
    "硫磺黄壳与墨黑焦死的树林（那是南面的深沼）",
    "雪、沙漠与干旱草原",
]

