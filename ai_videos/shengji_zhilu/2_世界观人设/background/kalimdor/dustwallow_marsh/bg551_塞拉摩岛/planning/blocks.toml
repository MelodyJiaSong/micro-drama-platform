# 塞拉摩岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg551"
name_zh = "塞拉摩岛"
size_m = [640, 640]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区图上岛约占 [62–69, 44–54]，折合约 350–420 m；区级平面图岛块 420 m 见方，本图沿用。四面海以四条边带示意（岛取 110–530 m 见方）。城内布局、城墙 300 m 见方、码头与灯塔位置无一手尺寸：桥在西北（本土桥头哨岗在岛西北）、码头在东南（区图码头图形）为地图量取，其余推定"
# 世界树画面：沼泽东侧的岛上要塞，石墙木桥与灯塔，港口停着往米奈希尔港的帆船
absent = [
    "废墟、破城墙、紫色魔法弹坑与裂口（5.0 之后的事，旧世要塞完好）",
    "任何火、火盆、灯笼与亮着的灯塔（白天零人工光源）",
    "天上飞行的坐骑与站在栖架上的飞兽（旧世天空不能飞，栖架空着）",
    "带纹章的旗帜（城头只挂纯色长旗，纹章属 shot 层）",
    "堡垒内院、武器架与训练靶（属 bg566）",
    "大都会级的石城与城中高楼群（这是军事堡垒与小港城）",
    "任何人物、卫兵、水手与动物",
    "文字招牌",
]

