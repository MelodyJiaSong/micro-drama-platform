# 世界树画面：沼泽北部一片开阔的浅水湿地，蓝灰雾气贴着水面，枯立木与蕨丛间蜘蛛网、鳄鱼与迅猛龙出没。
absent = [
    "任何人物与动物（鳄鱼、迅猛龙、蜘蛛属 shot 层）",
    "桥、渡口、木栈道与船",
    "湿地里的路（大路只擦过东南角）",
    "房屋、帐篷与营地（营寨在西南山脚外，不入本场地）",
    "成片活的高大树林（只有灰白枯立木与零星沼生矮树）",
    "蓝色的水（蓝的是贴水的雾，水是铅灰）",
    "火光、火把与任何人工光源",
    "海面与岛上白城（本点位看不到海）",
    "雪、雨与夜景",
]

