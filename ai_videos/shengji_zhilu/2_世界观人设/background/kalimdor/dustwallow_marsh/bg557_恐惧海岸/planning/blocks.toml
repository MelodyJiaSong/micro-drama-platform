# 恐惧海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (2720, 760) m；区级块「恐惧海岸」[2952, 960] 落在本场地 (232, 200)。
# 区图无坐标：岸线走向与近岸小岛（区图约 (640, 185) px ＝ 区级 (3066, 886) m → 本场地 (346, 126)）按原版区图量取，其余推定。

[meta]
bg = "bg557"
name_zh = "恐惧海岸"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "岸线与近岸小岛按原版区图量取（1 px ≈ 4.8 m，精度有限）；营地、礁石与泥滩宽度无一手尺寸，推定"
# 世界树画面：塞拉摩以北的泥滩海岸与近岸小岛，鱼人的木架与篝火散在礁石间，浅滩里有海龟。
absent = [
    "任何人物与生物（鱼人、海龟、海鸟属 shot 层）",
    "燃着的篝火、火把与烟（营地火塘默认冷灰）",
    "路、车辙与石板路（只有一条踩出来的泥径）",
    "码头、栈桥、船与搁浅的破船",
    "岛上白石要塞与灯塔（在机位身后以南，本档不入画）",
    "白沙热带海滩与棕榈（这里是灰黑泥滩）",
    "崖壁与裸露岩山（背后是三四十米的缓坡雾岭）",
    "成片的高大树林",
    "雪与冰",
]

