# 鲜血沼泽墓穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1270, 1926) m；坐标表点位 [31.7, 65.8] ＝ 区级 (1522, 2106) 落在本场地 (252, 180)。
# 区图裁切 ref/bg553_鲜血沼泽墓穴_map_crop.png 1 px ≈ 1.2 m；本场地 ＝ 裁切 x 150–520、y 90–390。
# 山梁走向、东侧水道按裁切量取；沟谷宽度、营地残迹与骨堆位置无一手出处，推定。

[meta]
bg = "bg553"
name_zh = "鲜血沼泽墓穴"
size_m = [444, 360]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "场地范围按区图裁切换算（裁切 1 px ≈ 1.2 m）；洞口尺寸（宽约 8 m、高 5–6 m）与沟谷宽度推定"
# 世界树画面：沼泽西南一处迅猛龙巢穴的岩洞，洞口外是被撕烂的小型营地残迹，泥地上满是爪印与骨头。
absent = [
    "任何人物与动物（巢主迅猛龙属 shot 层）",
    "墓碑、墓室、石棺与任何墓葬结构（名字里的墓穴是兽穴，不是坟）",
    "洞内景象与洞内光源（洞里三四米后全黑）",
    "火光、火把与燃着的火塘（残营火塘是冷灰）",
    "木门、栈道、矿车轨与任何人造通道",
    "成片高大树林（只有倒伏枯树与沟口两棵枯立木）",
    "鲜血、血泊与新鲜伤口（名字里的鲜血不入画）",
    "海面与岛上白城（本点位被山梁挡住，看不到海）",
    "雪与沙漠",
]

