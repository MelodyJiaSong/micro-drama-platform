# 石槌废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (1966, 1965) m；坐标表点位 [44.7, 66.1] ＝ 区级 (2146, 2116) 落在本场地 (180, 150) 一带（村心空场）。
# 区图裁切 ref/bg560_石槌废墟_map_crop.png 约为原图 4 倍放大（裁切 1 px ≈ 1.2 m）：泥岛、三面水道与东缘脊坡按裁切量取；残屋布局无一手出处，推定。

[meta]
bg = "bg560"
name_zh = "石槌废墟"
size_m = [400, 300]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "场地范围按区图裁切换算（裁切 1 px ≈ 1.2 m）；六座残屋尺寸按蕨墙村同形制长棚屋推定"
# 世界树画面：被烧毁的食人魔村落，塌陷的木石棚屋与倒下的图腾柱陷在泥里，龙人在废墟间巡逻。
absent = [
    "任何人物、龙人巡逻与生物（属 shot 层）",
    "火光、燃着的火塘、冒烟的焦木与发红的余烬（焦痕全是多年前冷透的旧痕）",
    "完好的屋顶与兽皮帐篷（屋顶全烧没了）",
    "立着的图腾柱（柱已横倒，原址只剩断桩）",
    "石墙城堡、砖瓦房与常人尺度的木屋",
    "海面、码头与船（本点位看不到海）",
    "熔岩与岩浆",
    "成片的高大树林（只有枯立木）",
    "雪与沙漠",
]

