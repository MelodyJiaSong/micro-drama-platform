# 北点哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg546"
name_zh = "北点哨塔"
size_m = [160, 160]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图裁切上塔图标落在东北支大路折向东半岛路的路口，北面贴一条东西向泥水道；场地取 160 m 见方装下三岔路口、塔后水道与对岸土岗。塔身 8×8 m 与塔脚附属物无一手尺寸，按驻守哨塔常规推定"
# 世界树画面：沼泽北部大路旁的塞拉摩石基木身哨塔，塔顶挂着塞拉摩旗，塔下站着一队披甲卫兵。
absent = [
    "旗面上的纹章图案与任何文字（旗是纯深蓝底窄金边，路标牌面空白）",
    "囚禁异族囚犯的笼子与囚犯（2.3 才加的剧情）",
    "破损、烧痕与塌顶（这是驻守中的完好哨塔）",
    "任何人物、卫兵、坐骑与动物（全部属 shot 层）",
    "任何火光、火盆、灯笼与人工光源",
    "海面与海平线、山墙压顶（路口四周是低平湿地与低岗）",
    "成片的高大树林（只有枯立木、矮树与高草蕨丛）",
]

