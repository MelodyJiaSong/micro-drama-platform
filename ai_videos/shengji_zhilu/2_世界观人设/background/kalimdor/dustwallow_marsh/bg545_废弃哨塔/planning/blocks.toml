# 废弃哨塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg545"
name_zh = "废弃哨塔"
size_m = [150, 150]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图裁切上塔图标紧贴南支大路东沿、东南两面绕着泥水道；场地取 150 m 见方装下大路、路西缓坡与塔后水道。塔身 7×7 m 与营地残迹各件无一手尺寸，按路边哨塔常规推定"
# 世界树画面：塞拉摩式的木石哨塔，塔身破败、木梯歪斜，塔下泥地上是逃兵的篝火与散乱行囊。
absent = [
    "任何火光、烟与人工光源（篝火是冷透的灰白木炭）",
    "完好的塔顶（四坡木瓦顶已塌大半）",
    "旗帜、纹章与任何文字",
    "任何人物、卫兵、逃兵、坐骑与动物（全部属 shot 层）",
    "海面与海平线（这里在内陆西南，看不到海）",
    "成片的高大树林（只有灰白枯立木、蕨丛与高草）",
    "石砌城墙与成片建筑（只有一座孤塔与营地残迹）",
]

