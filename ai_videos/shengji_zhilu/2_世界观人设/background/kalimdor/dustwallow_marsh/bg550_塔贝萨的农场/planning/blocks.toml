# 塔贝萨的农场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg550"
name_zh = "塔贝萨的农场"
size_m = [160, 160]
px_per_m = 6.0
scale_src = "推定"
scale_note = "世界树无坐标，区级平面图把本档推定在泥潭沼泽东部、中央长脊西南脚下；场地取 160 m 见方装下泥岛、栈桥与三面水道。小屋 7×6 m、栈桥约 20 m 无一手尺寸，推定。中央长脊在场地东北外约数百米，只作远景剪影、不入本图"
# 世界树画面：深沼中一间带小菜园的木屋，屋旁有一段供小船停靠的木栈桥，油灯的暖光映在黑水上。
absent = [
    "山坡、崖壁与任何高差（全场是平的；长脊只在东北远景）",
    "火堆、火把与窗里灯光（栈桥南头一盏油灯是唯一人工光源）",
    "成片的高大树林（只有矮壮的沼生树与香蒲丛）",
    "麦田与成片农田（只有一块木框菜畦）",
    "法术光效、魔法阵与发光物（施法属 shot 层）",
    "任何人物、学徒、鳄鱼与其他动物",
    "文字招牌",
]

