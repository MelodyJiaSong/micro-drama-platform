# 狂潮湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (2583, 1874) m；坐标表点位 [58.8, 64.8] ＝ 区级 (2823, 2074) 落在本场地 (240, 200)。
# 区图裁切 ref/bg563_狂潮湾_map_crop.png 按 1 px ≈ 1.2 m 读：西侧长脊陡岸、南侧大山北脚、浅水与东北深水、
# 小岛位置按裁切上的褐色小点量取；两艘破船、礁盘、卵石滩与机位无一手出处，推定。
# 岛堡（bg551）在本场地东北约五六百米外（区级 (3144, 1616)），不在场地内。

[meta]
bg = "bg563"
name_zh = "狂潮湾"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "场地范围按区图裁切换算（裁切 1 px ≈ 1.2 m）；小岛大小按裁切小点量取，破船尺寸推定"
# 世界树画面：海湾南端布满小岛与暗礁的浅海，两艘搁浅的破船斜插在礁石上，甲板上爬着螯虾。
absent = [
    "任何人物与动物（螯虾人、钓鱼人属 shot 层）",
    "码头、栈桥、帐篷与钓鱼营地（「纳特的码头」2.3 才命名，旧世不画）",
    "航行中的船、船帆与浮标（只有两艘搁浅破船）",
    "岛上白城（在画框右外，本镜看不到）",
    "火光、灯笼与任何人工光源",
    "沙滩度假感的白沙与椰树（这里是黑褐卵石滩）",
    "镜面般的静水（本档有海风小浪；静水镜面归 bg558）",
    "成片树林（只有陡岸上几棵灰白枯树）",
    "雪、冰与熔岩",
]

