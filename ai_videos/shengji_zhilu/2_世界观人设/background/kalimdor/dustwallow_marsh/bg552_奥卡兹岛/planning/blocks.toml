# 奥卡兹岛 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (3244, 148) m；岛心 (380, 380) ≈ 区级块 b952 奥卡兹岛 (3624, 528)。
# 岛廓按原版区图量取：约 95 × 105 px × 4.79 m/px ≈ 455 × 503 m，长轴北偏西—南偏东，南端收成一条尖尾。
# 本土在场地以西约 1 km 外，不入图；营帐、石雕、植被分带按卡片描述推定。

[meta]
bg = "bg552"
name_zh = "奥卡兹岛"
size_m = [760, 760]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "岛廓按原版区图量取（约 455 × 503 m）；岛心草丘高度、营帐与石雕位置无一手出处，推定"
# 世界树画面：沼泽东北外海的一座大岛，与灰绿沼泽截然不同的热带植被与白沙，岸线礁石间盘着娜迦的营帐与石雕。
absent = [
    "任何人物、水族、海龟、海鸟（属 shot 层）",
    "桥、码头、船坞、栈道与泊船（上岛只能渡水）",
    "人类建筑、城墙、灯塔与哨塔",
    "牢狱、地牢与铁栅（岛下囚人属后续版本剧情）",
    "泥浆、枯立木与灰绿死水（那是本土沼泽的样子）",
    "火光、火把与燃着的火塘（营帐火塘是冷灰）",
    "飞行坐骑与空中航线（旧世不能飞）",
    "雪、雨与夜景",
]

