# 水光庄园 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg549"
name_zh = "水光庄园"
size_m = [160, 160]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "区图裁切：小屋图标在红十字东北约 20 m 的丘头上，红十字落在西、南两道水道的交汇弯口；东北、东南各一小片水塘。场地取 160 m 见方；小屋 8×6 m、菜园与院内杂物无一手尺寸，推定"
# 世界树画面：女巫岭中心一栋孤零零的木板小屋，屋前有一小块菜地和一堆新翻的土，油灯光从窗里透出。
absent = [
    "火堆、火把、灯笼与烟（窗里一盏油灯是唯一人工光源；锅下是冷灰）",
    "第二栋房屋、围墙与大门（岭上只有这一栋小屋，院子四面敞开）",
    "成片的高大树林（只有稀疏的枯树与垂挂的灰须苔）",
    "晴天、强日光与清晰远景（雾是常态）",
    "任何人物、亡魂、游荡的尸骸与动物",
    "水边的营地木架与草棚（属女巫岭总卡与 shot 层）",
    "文字招牌与门牌",
]

