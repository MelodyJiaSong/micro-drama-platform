# 埃博斯塔夫的巢穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (2531, 2681) m；坐标表点位 [54.4, 84.4] ＝ 区级 (2611, 2701) 落在本场地 (80, 20)，即洞口。
# 与 bg565（巨龙沼泽）同一坐标系：bg565 的 b03「山墙脚小洞口」＝ 本场地的 b01。
# 洞口朝北（区图裁切：图标嵌在南缘两道山梁之间、口对北面的泥盆地）按地图量取；
# 洞内是室内，区图不画——甬道、洞厅轮廓、岩台、骨骸与石柱一律推定。

[meta]
bg = "bg559"
name_zh = "埃博斯塔夫的巢穴"
size_m = [160, 180]
px_per_m = 5.0
scale_src = "推定"
scale_note = "洞内尺寸无一手出处：按世界树「宽阔的岩洞」与需容下一条巨龙盘卧，推定洞厅约 70 × 80 m、穹顶二十多米；洞口位置取坐标表"
# 世界树画面：巨龙沼泽里一座宽阔的岩洞，洞壁焦黑，洞底散着龙骨与灰烬，一条黑色巨龙盘在深处。
absent = [
    "任何人物、黑龙、龙人、幼龙与动物（属 shot 层；岩台空着）",
    "熔岩、岩浆、地缝红光与火山口（区级 absent：南部没有熔岩）",
    "正在燃烧的火、火盆、火把、烛火与冒烟的灰烬（烧痕全是冷透多年的旧痕）",
    "第二条通道、向下的裂口与透光的天井（唯一光源是北面洞口）",
    "宝藏堆、金币与财宝（本档只有骨与灰）",
    "草、苔、流水与任何活植物",
    "人造建筑、祭坛、石阶与雕刻",
    "团本大洞口（在东北约 250 m 外的岩丘底，是另一个洞）",
    "雪、冰与雨",
]

