# 峭壁之泉 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：瀑布 ≈ 区图 (54.3, 34.5) ≈ 区级平面图 (3252, 1370)；本场地原点 ≈ 区级 (3002, 1180)。1 区图 px ≈ 5.98 m。
# 山体西缘按区级 terrain 的东界山墙折线 (3264,1238)→(3144,1358)→(3024,1477) 换算，峡谷为推定的切口。

[meta]
bg = "bg483"
name_zh = "峭壁之泉"
size_m = [320, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "瀑布点位与河流出峡方向从原版区图壁泉河起点 (54.3, 34.5) 量取，山体西缘取区级 terrain 东界山墙折线；1 px ≈ 6 m，精度约 ±30 m。峡谷长宽、瀑高约 40 m、潭径与洞口尺寸为推定"
# 世界树画面：崖壁间垂落的细瀑，水帘后是一处潮湿洞口，岩面挂满深绿苔藓
absent = [
  "路 / 桥 / 石阶 / 栈道（峡谷里无路，只能踩卵石进来；主干道在西面 500 多米外）",
  "任何建筑 / 屋顶 / 营地 / 帐篷 / 人造水渠",
  "宽大的瀑布 / 多级跌水（只有一股一臂来宽的细瀑）",
  "洞里透出的光 / 发光的水、苔或矿石 / 变色的毒水（污染属 shot 层）",
  "火 / 营火 / 火把 / 烛火 / 灯笼 / 任何人工光源",
  "阳光光柱 / 彩虹 / 蓝天 / 硬边阴影",
  "海平线与海滩（海在西北两公里外）",
  "阔叶橡木林与暖金树冠 / 草甸 / 花田",
  "雪 / 冰 / 霜 / 冰挂",
  "4.0.3a 之后的毁损与重建",
  "人物 / 动物",
]

