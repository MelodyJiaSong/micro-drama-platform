# 玛塞斯特拉废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ＝ 区图坐标 [61.2, 20.5]；区图裁切上拱门图标在红十字西南、东侧紧贴山影——据此定「西南正门、东靠山墙」。
# 锚点机位：西南角倒伏柱段断面 [75, 225]，离地约 2 m，朝东北平视略俯。北湾海面在场地西北三四百米外（场地外，只作远景）。

[meta]
bg = "bg487"
name_zh = "玛塞斯特拉废墟"
size_m = [380, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "场地 380 × 260 m 按区图裁切上拱门图标到山影的距离（约 250 m）放宽推定；平台 90 × 70 m、断柱高度、殿堂基座尺寸无一手出处，按世界树画面与空间逻辑推定"
# 世界树画面：东北高地上的大片石砌遗址，成排断柱与碎裂的地面浮雕，遍地散着青铜残器
absent = [
    "任何人物、营地、帐篷与营火（1.12 这里空无一人）",
    "大灾变后的巨魔战营与新式精灵建筑",
    "完整的屋顶与可住人的房屋（只剩骨架）",
    "东面山墙上的山路、台阶或隘口",
    "发光符文、魔法光与任何人工光源",
    "晴空、太阳与硬边阴影",
    "河流（壁泉河在西南方林中，不入本场地）",
    "雪、沙漠、熔岩",
]

