# 薄雾海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本档取木镇以北约 1 km 的海滩中段（区图约 (40, 32) 一带）；木镇在场地外南面约 1 km，北湾礁屿在场地外北面，只作远景。
# 海岸线（浪线）：(330,0)→(318,150)→(300,300)→(285,450)→(272,600)→(260,800)；以西是海，以东依次湿沙带 / 干沙坡 / 林缘。
# 锚点机位：湿沙带 [278, 700]，离地约 1.6 m，朝北顺滩平视。

[meta]
bg = "bg485"
name_zh = "薄雾海"
size_m = [500, 800]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "海岸走向按区图 (43,22)→(37,42) 的整段海岸线取近南北、北端略偏东；滩宽（湿沙约 20 m、干沙约 40 m）、礁岩与浮木的位置尺寸无一手出处，推定"
# 世界树画面：黑海岸最长的一段海滩，湿沙上散着贝壳与浮木，海面永远压着一层齐腰高的白雾
absent = [
    "任何建筑、栈桥、码头与船（木镇在场地外南面约 1 km）",
    "沉船残骸（本段不设）",
    "道路与小径（只有海滩本身）",
    "火、营火与任何人工光源",
    "清晰的海平线、晴空与太阳",
    "巨型贝壳与退潮大岩坪（那是南段暮光海岸）",
    "悬崖与高岸（全段是缓坡沙滩）",
    "热带棕榈、白沙与碧蓝海水",
    "雪、冰",
]

