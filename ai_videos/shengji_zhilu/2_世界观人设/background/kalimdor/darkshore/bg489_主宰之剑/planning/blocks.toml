# 主宰之剑 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：ref/bg489_主宰之剑_map_crop.png（区图 18% 见方 ≈ 1078 × 719 m，裁切图 1 px ≈ 1.5 m）；场地中心 (210, 210) ＝ 坐标 [39, 87]。

[meta]
bg = "bg489"
name_zh = "主宰之剑"
size_m = [420, 420]
px_per_m = 3.0
grid_m = 50
scale_src = "地图量取"
scale_note = "洼地轮廓与主干道、西南小径、西侧暗林丘、南面低丘按区图裁切量取（±1.5 m/px，约 ±20 m）；战刃高度、营地与兽骨位置无一手出处，按世界树画面「刃身高过树冠」与备注「旁有黑暗信徒营地」推定"
# 世界树画面：一柄巨大的黑色古神战刃斜插在荒地中央，刃身高过树冠，周围地面龟裂发黑，散落兽骨
absent = ["任何水体（河 / 湖 / 海都在场地外；坑底只有几小摊雨后积水）", "熔岩 / 火光 / 冒烟 / 焦土 / 深地裂（坑底是冷透的灰黑干裂硬土，裂缝只有手指宽）", "刃身发光 / 光晕 / 能量光效 / 漂浮符文", "石砌或木构建筑、塔、城墙（营地只有三顶布篷）", "亮着的火塘（默认冷灰）", "4.0.3a 之后的战营 / 被撕开的裂谷 / 洪水冲刷痕", "坑底的树木与草地（坑底寸草不生）", "人物 / 动物 / 旗帜"]

