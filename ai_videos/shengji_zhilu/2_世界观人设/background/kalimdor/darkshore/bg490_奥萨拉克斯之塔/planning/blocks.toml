# 奥萨拉克斯之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：ref/bg490_奥萨拉克斯之塔_map_crop.png（区图 18% 见方 ≈ 1078 × 719 m）；塔心 (120, 130) ＝ 坐标 [56, 26]。

[meta]
bg = "bg490"
name_zh = "奥萨拉克斯之塔"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "塔心按坐标表；主干道走向（塔北约 70 m、东北—西南）与东南山墙坡脚按区图裁切量取（约 ±20 m）；塔径 18 m / 高 36 m 与塔脚诸物无一手尺寸，推定"
# 世界树画面：林中一座孤立的圆形石塔，塔身爬满藤，塔顶露台上燃着幽绿的火盆
absent = ["河流 / 湖 / 海（壁泉河在场地西约 300 m 外，海更远）", "第二座塔或任何别的石砌 / 木构建筑", "城墙 / 围栏 / 寨墙", "暖色火光 / 灯笼 / 亮着的窗（唯一人工光源是塔顶一簇幽绿冷火）", "亮着或冒烟的营火（塔脚旧营火默认冷灰）", "山墙上的山路或隘口", "4.0.3a 之后的营地 / 船坞 / 被毁的塔 / 裂谷与洪水痕", "人物 / 动物 / 旗帜"]

