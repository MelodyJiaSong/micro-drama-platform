# 雷姆塔维尔挖掘场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg486"
name_zh = "雷姆塔维尔挖掘场"
size_m = [300, 180]
px_per_m = 5.0
scale_src = "推定"
scale_note = "坑心 (180,90) ＝ 坐标 [35,85] ＝ 区图 (2096,3394) m；区级平面图海岸线在坑心以西约 120 m → 本图 x≈60；坑与营地尺寸按一处小型考古工地推定，无一手尺寸出处"
# 世界树画面：南部海边的考古工地，木架与绳梯搭在半掘开的土坑上，散落着箱子、铲子与半埋的巨大骨骼
# 区图：红十字落在灰色滩涂与绿色林带交界；东侧约 120 m 一团深绿圆形林丛；东南偏东约 250 m 是黑刃所在的环形坑
absent = [
    "任何人物、动物（默认停工空营）",
    "燃着的火塘、点亮的提灯与炊烟（提灯熄灭、火塘冷灰）",
    "码头、栈桥、船只（本档只是海边台地上的工地）",
    "寨墙、木栅、石砌建筑（营地只有一顶帆布帐）",
    "矿车轨道、蒸汽机械、现代挖掘设备",
    "晴空烈日与硬边阴影（常年阴天海雾）",
    "4.0.3a 后的任何改动（被海浪冲毁的海岸等）",
]

