# 黑木洞穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 场地原点 ≈ 区级平面图 b911（推定点位）西北约 100 m；区图精度 ±60–90 m，本图不做逐米换算，只保证「东山壁 · 洞口朝西 · 北侧出山浅河 · 西南林」四个方位与区图一致。

[meta]
bg = "bg482"
name_zh = "黑木洞穴"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "推定"
scale_note = "世界树与区图都没有这个洞口的尺寸；洞口 20 × 12 m、前场 40 × 50 m 按「一个族群的巢穴前场」推定，东山壁与北侧浅河的方位按区级 terrain.toml 在 b911 附近的走向"
# 世界树画面：山壁上的熊怪洞口，洞前立着粗木栅与兽骨图腾，洞内火光摇晃
absent = [
    "任何人物与动物（默认空镜）",
    "洞外的火塘、火把、灯笼（唯一人工光源是洞内深处一小堆火）",
    "石砌建筑、弧顶木屋与月白暗紫的精灵式构件（那是西岸木镇的形制）",
    "海与沙滩（本档在东山脚，朝西只见林与雾）",
    "山壁上的山路或隘口（东山墙整条无隘口）",
    "积雪、冰霜",
    "直射阳光、蓝天、硬边阴影",
    "被海啸冲毁或被火烧毁的林地（1.12 完好）",
    "可读的文字、路牌与旗帜",
]

