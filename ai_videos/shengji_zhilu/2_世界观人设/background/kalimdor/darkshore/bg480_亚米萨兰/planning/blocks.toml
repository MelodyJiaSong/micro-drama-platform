# 亚米萨兰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：遗址中心 ＝ 坐标表 [43.6, 60.4] ≈ 区级平面图 (2611, 2412)；本场地原点 ≈ 区级 (2351, 2252)。1 区图 px ≈ 5.98 m。

[meta]
bg = "bg480"
name_zh = "亚米萨兰"
size_m = [440, 320]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "点位按坐标表 [43.6, 60.4]；主干道（西约 220 m）与东界山墙（东约 150 m）的距离从原版区图裁切量取，1 px ≈ 6 m，精度约 ±30 m；遗址内部的柱列、残殿、小屋与碑的摆位为推定"
# 世界树画面：海边草坡上的断柱废墟群，白石被海风蚀出凹坑，柱间飘着半透明的蓝色幽魂
absent = [
  "海滩 / 浪线 / 礁石（海在西面四百多米外，只作为松冠上的一条雾带出现）",
  "河 / 溪 / 水潭（遗址周边没有水面，只有石缝积的雨水）",
  "完整的屋顶 / 有人住的建筑 / 帐篷 / 营地",
  "围墙与城门（遗址四面敞开，只有西坡一条土径）",
  "半透明的幽魂 / 蓝色或绿色的幽光 / 发光符文 / 魔法阵（幽魂属 shot 层）",
  "火 / 营火 / 火盆 / 烛火 / 灯笼 / 任何人工光源",
  "阳光光柱 / 蓝天 / 硬边阴影",
  "阔叶橡木林与暖金树冠 / 花田",
  "雪 / 冰 / 霜",
  "4.0.3a 之后的海啸冲毁痕迹与重建营地",
  "人物 / 动物",
]

