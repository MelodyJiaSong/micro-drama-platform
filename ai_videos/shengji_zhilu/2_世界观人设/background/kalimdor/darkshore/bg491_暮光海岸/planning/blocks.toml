# 暮光海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取口径：世界树无坐标；场地取原版区图 (29.7–36.4%, 74.0–84.1%)，按区图 1 px ≈ 5.98 m 量取海岸线与水线（约 ±20 m）。
# 北缘外约 30 m 是急弯河口小湾（bg494），南缘外约 35 m 是挖掘场台地（bg486）。

[meta]
bg = "bg491"
name_zh = "暮光海岸"
size_m = [400, 400]
px_per_m = 3.5
scale_src = "地图量取"
scale_note = "海岸线（土坎脚）、水线、离岸孤礁与岩丘按区图灰白滩面与褐边礁岩斑量取；岩坪、巨贝、浮木的位置与尺寸无一手出处，按世界树画面「退潮后露出大片湿亮的岩坪与搁浅的巨型贝壳」推定"
# 世界树画面：南段海岸，沙色偏黑，退潮后露出大片湿亮的岩坪与搁浅的巨型贝壳
absent = ["任何建筑 / 码头 / 栈桥 / 船（唯一的港在北边木镇）", "道路（滩上与坎上都没有路，只有两端沿滩进出）", "浅色金黄沙滩（本段沙色深灰黑）", "齐腰高的厚雾贴满滩面（雾只压在海面、水线一带发虚）", "涨潮淹没岩坪（默认退潮态）", "火 / 灯 / 任何人工光源", "4.0.3a 之后的海啸冲刷痕 / 残骸堆 / 沉进海里的码头", "人物 / 动物 / 海龟 / 鱼人"]

