# 古树之林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：空地中心 ≈ 区图 (43,77) ≈ 区级平面图 (2587, 3082)；本场地原点 ≈ 区级 (2407, 2907)。1 区图 px ≈ 5.98 m。

[meta]
bg = "bg479"
name_zh = "古树之林"
size_m = [320, 330]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "空地、河弯、水汊、水潭的相对方位从原版区图 (43,77) 一带量取（1 px ≈ 6 m，精度约 ±30 m）；空地与神殿基座的尺寸、老树与石台的摆位为推定"
# 世界树画面：南端的神圣林地，几株会走动的远古树人静立在残破石台间，脚下青苔覆盖倒塌的神殿基座
absent = [
  "任何建筑 / 屋顶 / 帐篷 / 木构营地（空地里只有倒塌的石砌神殿基座与残破石台）",
  "火 / 营火 / 火盆 / 烛火 / 灯笼 / 任何人工光源",
  "发光的植物 / 发光的石头 / 发光的水面 / 月光井的蓝光",
  "阳光光柱 / 丁达尔光 / 蓝天 / 硬边阴影",
  "海平线与海滩（海在西面五六百米外，被林子挡住）",
  "桥（主干道在河弯西侧的小湖东缘直接涉水）",
  "东山墙上的山路或隘口",
  "阔叶橡木林与暖金树冠 / 草甸 / 花田",
  "雪 / 冰 / 霜",
  "4.0.3a 之后的重建营地、新哨站、被洪水冲毁或烧毁的林子",
  "人物 / 动物 / 会走动的树（shot 层才有）",
]

