# 雷戈虫巢 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地取巢区西南半（区级平面图坐标 x 3300–3940、y 3240–3800 m，区图 1 px ≈ 6.342 m）；坐标点 [55, 87] 落在本场地约 (195, 446)，即西南崖坎内沿 ＝ 锚点机位。
# 机位朝东北（右上角），画面左 ＝ 北、右 ＝ 东。

[meta]
bg = "bg649"
name_zh = "雷戈虫巢"
size_m = [640, 560]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "场地范围与西南崖坎走向按区图量取（巢区外廓带刺线，1 px ≈ 6.342 m）；巢塔簇、巢丘、隧道口的位置与尺寸按区图巢塔图标的疏密推定"
# 世界树画面：南部沙谷里最大的虫巢群落，成排甲壳巢口与地下隧道口，地表黏着虫卵与淡绿黏液。
absent = [
    "任何人造建筑、帐篷、栅栏与旗帜（部落军营在巢区西北角外约 300 m，不入本场地）",
    "任何水面（淡绿黏液滩不是水，也不反光发亮）",
    "树、草与任何绿色植物",
    "燃着的火、火盆与任何人工光源（虫卵与黏液不发光）",
    "虫群、人物与坐骑（默认空巢，全部属 shot 层）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
    "训练假人",
]

