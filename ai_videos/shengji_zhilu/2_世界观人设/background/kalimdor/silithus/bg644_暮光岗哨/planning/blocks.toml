# 暮光岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg636 terrain.toml，1 px ≈ 6.342 m）上的 (1150, 950)；营地中心 ＝ 区级 b644 帐篷图标 (1636, 1389) → 本图 (486, 439)。
# 坐标表 [32.9, 32.4] 落在图标以东约 450 m 的开阔沙地（本图 (941, 423)），按图标摆营地（与区级 b644 一致），坐标点只画成东去小径上的一个途经点。
# 西墙、水晶谷山脊、三座岩丘由区级 terrain.toml 平移换算（地图量取）；碎岩扇、帐篷、巨石、旗杆无一手尺寸，一律推定。
# 锚点机位：营地东南约 100 m 的沙地（约 560, 520），朝西北。

[meta]
bg = "bg644"
name_zh = "暮光岗哨"
size_m = [1050, 950]
px_per_m = 1.5
grid_m = 100
scale_src = "推定"
scale_note = "营地（三顶帐 + 两块巨石 + 冷锅灶）约 60 × 110 m、旗杆线约 180 m，按世界树画面推定；西墙、水晶谷山脊与三座岩丘从区级 terrain.toml 平移量取，场地取到装下西墙脚到坐标点"
# 世界树画面：西北沙地上的小型教团据点，几顶黑紫帐篷散在岩坡下，风沙里插着教团旗帜。
absent = [
    "任何人物、教徒与坐骑（默认空营）",
    "燃着的火与炊烟（锅灶下是冷灰）",
    "火把、火盆、灯笼与任何人工光源",
    "木栅、寨墙、大门与瞭望塔",
    "召唤石坛（属另一座营地）",
    "旗面纹章与任何文字标识",
    "草地、树林、河流与任何水体",
    "甲壳巢塔与虫巢洞口（虫巢远在南面与东北）",
    "晶柱（水晶谷在北面山脊背后）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "4.0.3a 后的任何改动",
]

