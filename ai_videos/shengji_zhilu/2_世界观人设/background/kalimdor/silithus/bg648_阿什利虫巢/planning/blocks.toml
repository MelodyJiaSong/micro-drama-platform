# 阿什利虫巢 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树未记坐标。场地取区级平面图坐标 x 2460–3260、y 620–1440 m（区图 1 px ≈ 6.342 m），框住要塞西北那整片巢区。
# 区图巢区外廓是一圈齿线，齿朝内 ＝ 坡朝内下降：巢区是比外侧白沙低 5–6 m 的洼地（与 bg636 区级卡「巢区硬壳比白沙略低、边缘一圈塌陷的浅坡」一致）。
# 外廓陡坎画成一圈约 10 m 宽的环带 ridge（坎高 = 内外落差）；环内的洼地本身不画成 ridge，免得被读成台地。北侧那道伸进巢区的白沙舌（顶点约 426, 363）把巢区分成西北叶与东叶。
# 锚点机位约在 (440, 718)，南缘坎顶外侧白沙上，离地一人高、略俯，朝北（方位 ~355°）：身后东南约 150 m 是要塞（不入画），正前越过巢区是北缘山链（场外北侧）。

[meta]
bg = "bg648"
name_zh = "阿什利虫巢"
size_m = [800, 820]
px_per_m = 1.9
grid_m = 50
scale_src = "地图量取"
scale_note = "巢区外廓、巢塔图标位置按区图量取（与 bg636 terrain.toml 同一套坐标，1 px ≈ 6.342 m）；巢塔高度、巨型巢口、下坡道与遗留物的位置尺寸为推定"
# 世界树画面：北部沙地被巨大的甲壳质巢口撕开，赭黄的几丁质塔管从地下拱出，巢口周围的沙被虫群踩成硬壳。
absent = [
    "任何人造建筑、帐篷、栅栏与旗帜（要塞在机位身后东南约 150 m，不入画）",
    "成团的虫卵与黏液滩（那是南片巢区的特征，本片是被踩实的干硬壳）",
    "任何水面",
    "树、草与任何绿色植物",
    "燃着的火、火盆与任何人工光源",
    "虫群、人物与坐骑（默认空巢，全部属 shot 层）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
    "训练假人",
]

