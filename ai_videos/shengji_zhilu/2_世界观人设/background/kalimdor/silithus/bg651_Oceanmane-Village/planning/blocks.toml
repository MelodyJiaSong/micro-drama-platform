# Oceanmane Village · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 取景：锚点机位在村子背后山坡脚（约 [80, 30]、离地 5 m）朝正南微俯：近景帐篷背面，中远景沙滩与海。
# 方位：坐标 [39, 95] 在区图南缘山链之外；海放在正南（judgment call，见主体 md 场景定位）。区图上没有村子的图标，布局全部推定。

[meta]
bg = "bg651"
name_zh = "Oceanmane Village"
size_m = [160, 130]
px_per_m = 8.0
scale_src = "推定"
scale_note = "区图上只有坐标、没有图标与轮廓，无一手尺寸；四顶帐篷约 5 m 高、火塘弧约 50 m 宽、沙台高 2 m 均按「几户人家的小村」体量推定"
# 世界树画面：西南尽头海岸边一处空无一人的牛头人小村：几座图腾与兽皮棚屋对着灰蓝的海，沙滩上没有脚印。
absent = [
    "路、码头、栈桥与船（这里没有路通进来）",
    "火、冒烟的火塘、火把与任何人工光源",
    "脚印、车辙与任何有人来过的新痕迹",
    "区内的惨白沙漠、甲壳巢塔与甲壳巨墙（都在山链另一面，看不到）",
    "石砌房屋与木板屋（村里只有兽皮帐篷）",
    "礁石群与海上的帆",
    "任何人物、动物与飞鸟",
]

