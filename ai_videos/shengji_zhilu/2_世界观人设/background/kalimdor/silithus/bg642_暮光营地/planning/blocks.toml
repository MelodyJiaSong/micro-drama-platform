# 暮光营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg636 terrain.toml，1 px ≈ 6.342 m）上的 (2173, 1558)；营地中心 ＝ 区级 b642 图标 (2473, 1858) → 本图 (300, 300)。
# 岩丘与大道由区级 terrain.toml 平移换算（地图量取）；帐篷圈、石坛、木箱、小径无一手尺寸，一律推定。
# 锚点机位：帐篷圈西南约 60 m（约 258, 342），朝东北。

[meta]
bg = "bg642"
name_zh = "暮光营地"
size_m = [800, 500]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "帐篷圈直径约 50 m 按「六顶尖帐围一圈」推定；岩丘（区级「要塞西岩丘」）与南北大道的相对位置从区级 terrain.toml 平移量取，场地 800 × 500 m 取到能装下营地、岩丘与大道"
# 世界树画面：要塞西侧沙地上的教团营地：黑紫帐篷围成一圈，中央立着一座召唤用的石坛。
absent = [
    "任何人物、教徒与坐骑（默认空营）",
    "石坛发光、召唤光效与法阵（属 shot 层）",
    "火堆、火盆、火把、灯笼与任何人工光源",
    "木栅、寨墙与大门（只是一圈帐篷）",
    "旗面纹章与任何文字标识",
    "水体、草地、树林",
    "甲壳巢塔（虫巢在东南与北面远处，不在营地里）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "4.0.3a 后的任何改动",
]

