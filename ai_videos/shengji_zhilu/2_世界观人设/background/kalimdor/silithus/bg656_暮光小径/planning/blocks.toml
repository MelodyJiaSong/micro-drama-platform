# 暮光小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 洞穴本体（室内）。走向按微型地下城图量取（约 0.18 m / 图像素）：洞口在西南，
# 入口隧道向东北 → 堆箱侧室 → 上层长廊向东绕过东北石柱 → 下坡道折回西南 → S 弯 → 南端圆室（尽头）。
# 锚点机位：入口隧道狗腿弯之后约 [40, 71]，离地一人高，顺隧道朝东北。
# 洞外山坡与山顶残塔属 bg654，本档不画。

[meta]
bg = "bg656"
name_zh = "暮光小径"
size_m = [180, 120]
px_per_m = 8.0
scale_src = "地图量取"
scale_note = "洞穴走向、侧室与圆室位置按微型地下城图量取（整洞东西约 160 m）；通道宽 5–7 m、洞顶高 5–8 m、火盆与旗帜位置为推定"
# 世界树画面：鹿盔之地山脚下一道洞口，洞内是狭长的石廊，火盆照着紫黑色的教团旗帜。
absent = [
    "任何人物、动物与虫类（默认空洞）",
    "天光、日光束与洞顶天井（洞内看不见天）",
    "油灯、蜡烛、火把与发光晶石（唯一光源是铁火盆）",
    "水面、积水、地下河与钟乳滴水",
    "绿色植物、苔藓与藤蔓（干燥沙岩洞）",
    "精灵石塔、帐篷与营地（在洞外山坡，属 bg654）",
    "旗面上的纹章文字与任何字迹",
    "8.x 巨剑与金色矿脉（4.0.3a 以后）",
]

