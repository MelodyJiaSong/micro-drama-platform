# 虫群之柱 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级坐标 [3027, 1749]（区级块 b915 中心 [3247, 1979] 落在本图 [220, 230]）。
# 出图的邻居：北缘外约 20 m 是要塞南墙（bg638）；西面约 150 m 外是南北大道（区级 x≈2875）；西南远处是巨龙骸骨（bg646）；东南约 1.5 km 是另一片巢塔群（bg649）。
# 取景：锚点机位在西北白沙上（约 [70, 35]、离地 2 m）朝东南略仰看峰，距峰心约 250 m。

[meta]
bg = "bg655"
name_zh = "虫群之柱"
size_m = [440, 460]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "场地按区图要塞正南那片粉紫色巢区斑块量取（区级 b915 为 349 × 412 m）；峰脚轮廓、峰高约 60 m、隧道口与甲壳管位置均为推定"
# 世界树画面：沙漠中央一座孤立的岩峰，峰体被虫巢蛀空，成群细小飞虫绕着峰顶嗡嗡打转。
absent = [
    "任何建筑、营地、帐篷与围墙（要塞在北缘外，不入画）",
    "道路与车辙（南北大道在西面场地外）",
    "火、火盆、火把、灯笼与任何人工光源（隧道口里全黑）",
    "水面、积水与湿亮的黏液（旧黏膜痕是干透的）",
    "草地、绿叶与活的植物",
    "上峰顶的台阶、栈道与绳梯",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "任何人物、动物与虫群（虫群属 shot 层）",
]

