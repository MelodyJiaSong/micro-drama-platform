# 奥泰尔藏身处 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地只框洞口前一小片沙地 + 洞本身（区级 b914 ＝ 区图东南山墙脚下的洞口图标 [4224, 2956]）；
# 东南最大虫巢区的东北角在洞口西南约百米外，不入本图。
# 取景：锚点机位在洞口内侧（约 [16, 15]、离地 1.5 m）朝正东往里看；岩室位于山体内（画在山墙多边形之上）。

[meta]
bg = "bg652"
name_zh = "奥泰尔藏身处"
size_m = [40, 30]
px_per_m = 30.0
scale_src = "推定"
scale_note = "区图只有一个洞口图标、无尺寸；岩室 8 × 5 m、顶高不到 3 m、窄口约 3 m 长按「一人独居的小洞」体量推定"
# 世界树画面：东南山脚下一个不起眼的小洞，洞里点着一盏油灯，堆着书卷与破译用的纸片。
absent = [
    "第二个出口、天井与洞顶透光",
    "火把、火盆、蜡烛与油灯以外的任何光源",
    "门、栅栏、招牌与洞口的任何标记",
    "凿过的石壁、砖砌、木梁支护",
    "可读的文字、符号与图案（纸片上只有糊开的墨迹）",
    "教团旗帜与帐篷（那是别处营地的形制）",
    "任何人物、动物与虫",
]

