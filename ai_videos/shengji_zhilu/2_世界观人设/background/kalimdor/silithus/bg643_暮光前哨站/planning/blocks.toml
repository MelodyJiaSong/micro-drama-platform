# 暮光前哨站 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图（bg636 terrain.toml，1 px ≈ 6.342 m）上的 (930, 3258)；营地中心 ＝ 区级 b643 图标 (1180, 3558) → 本图 (250, 300)。
# 西南山块与东侧岩丘由区级 terrain.toml 平移换算（地图量取）；沙丘、帐篷、旗杆、火塘无一手尺寸，一律推定。
# 场地外：甲壳巨墙在本图东南（本图坐标约 (477–1277, 725)），北面约 600 m 是佐拉虫巢南缘；海在西侧山块背后、区图框外。
# 锚点机位：沙丘脊上、帐篷弧西北（约 215, 262），朝东南偏东。

[meta]
bg = "bg643"
name_zh = "暮光前哨站"
size_m = [800, 620]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "营地（四顶帐 + 三旗杆 + 火塘）约 40 × 90 m 按世界树画面推定；山湾轮廓与东侧岩丘从区级 terrain.toml 平移量取，场地 800 × 620 m 取到装下整个山湾与湾口岩丘"
# 世界树画面：西南角靠海的教团营地，帐篷与旗杆立在沙丘背风面，东边望得见甲壳巨墙。
absent = [
    "任何人物、教徒与坐骑（默认空营）",
    "海面与海岸线（海在西侧山墙背后、区图框外，营地里看不见）",
    "燃着的火与炊烟（火塘是冷灰余烬）",
    "火把、灯笼与任何人工光源",
    "木栅、寨墙与大门",
    "旗面纹章与任何文字标识",
    "草地、树林与任何水体",
    "甲壳巢塔（虫巢在北面约 600 m 外）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "4.0.3a 后的任何改动",
]

