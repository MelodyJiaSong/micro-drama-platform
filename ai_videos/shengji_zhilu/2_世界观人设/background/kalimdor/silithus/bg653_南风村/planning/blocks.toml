# 南风村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图 1 px ≈ 6.342 m（裁切图再放大 4 倍，1 裁切 px ≈ 1.59 m）。坐标表点位 [64, 47] 落在本场地 (200, 110)；
# 区图村落图标在它西南 (97, 377)。废墟铺在两者之间，贴着东南山墙坡脚。

[meta]
bg = "bg653"
name_zh = "南风村"
size_m = [360, 420]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图裁切量取：坐标表点位东约 200 m 起山墙坡脚、坡脚线自东北斜向西南，村落图标在点位南约 270 m、西约 100 m，支路车辙在点位西北约 150 m 断掉；石台 / 空场 / 拱廊 / 屋址尺寸按精灵式村落常识推定"
# 世界树画面：沙地里的上古精灵村落废墟：断裂的白石柱与坍塌的拱廊半埋在沙中，夜里游荡着淡蓝的幽魂。
absent = [
    "任何人物与幽魂（夜里的亡灵属 shot 层）",
    "考古挖掘坑、探方与挖掘工具（考古学 4.0.3a 才有）",
    "完整的屋顶与门窗（全村塌毁）",
    "火、火盆、烛火与任何人工光源",
    "水面、水池与绿植（只有枯刺灌木与一棵枯树）",
    "甲壳巢塔与虫巢洞口（巢区在西南与南面远处）",
    "旗帜、帐篷与任何文字标识",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
]

