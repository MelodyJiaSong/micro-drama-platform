# 格拉卡隆之骨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树未记坐标：点位按区级卡「虫群之柱西南」推定，场内一切摆位都是推定。
# 骨架轴线 尾(124,188) → 颅(176,142)，全长约 70 m，方位约 48°（头朝东北）。
# 锚点机位约在 (160, 245)，离地一人高，朝北偏东（方位 ~20°）：左前 尾椎，右后 颅骨，颅骨背后远景 蛀空孤峰（场外东北）。

