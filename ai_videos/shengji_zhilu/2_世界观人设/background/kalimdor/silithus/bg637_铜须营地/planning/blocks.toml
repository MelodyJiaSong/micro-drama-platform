# 铜须营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 区图营地图标（≈ 区级平面图 b637 的 xy）落在本场地 (160, 125)；区图 1 px ≈ 6.342 m。

[meta]
bg = "bg637"
name_zh = "铜须营地"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图量取：营地图标紧贴其北一块岩丘轮廓（约 25 × 10 px ≈ 160 × 65 m），南墙山链坡脚在图标南约 18 px（≈ 110 m）；帐篷 / 探沟 / 吊架尺寸按矮人身量与考古营常识推定"
# 世界树画面：南部沙地上的矮人探险营：几顶帆布帐篷、木箱与挖掘工具堆在沙丘背风处，远处是高耸的甲壳巨墙。
absent = [
    "寨墙、栅栏与岗楼（考古营不设防）",
    "燃着的火与炊烟（火塘默认冷灰）",
    "任何人物与驮兽（默认空营，木车已卸牲口）",
    "水面、树与绿植（只有两丛枯刺灌木）",
    "旗帜、纹章与任何文字标识",
    "甲壳巢塔进入营地范围（东南巢区在东面 600 m 外，只作远景尖顶）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
]

