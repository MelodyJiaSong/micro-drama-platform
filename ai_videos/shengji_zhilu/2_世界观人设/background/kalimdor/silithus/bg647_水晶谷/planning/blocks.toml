# 水晶谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地取区级平面图坐标 x 1500–2140、y 380–860 m（区图 1 px ≈ 6.342 m）；坐标点 [32, 15] ＝ 区级 (2034, 636) ＝ 本场地 (534, 256)，即谷口东端。
# 锚点机位约在 (540, 270)，离地一人高，朝西（方位 ~275°）：右 ＝ 北崖，左 ＝ 谷中孤立山梁与谷口南侧矮岩脊，谷底一路向西抬升到场外约 800 m 的西面山墙。
# 被毁的教团营地（bg641，坐标 [29, 10]）在本场地约 (343, 44) 的北崖凹湾里，被岩嘴挡住，不入本档画面。

[meta]
bg = "bg647"
name_zh = "水晶谷"
size_m = [640, 480]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "北崖坡脚线、谷中孤立山梁与谷口南侧矮岩脊按区图量取（与 bg636 terrain.toml 同一套坐标，1 px ≈ 6.342 m）；晶柱簇、蘑菇石、岩嘴与矿脉的位置和尺寸都是推定"
# 世界树画面：西北角一条被风蚀的岩谷，谷底与崖壁上嵌着成簇的淡色晶柱，风元素与土元素在晶石间游荡。
absent = [
    "任何建筑、帐篷、栅栏与旗帜（被毁营地在北崖凹湾里，属 bg641，不入本档）",
    "道路与车辙",
    "任何水体",
    "树、草与绿色植物（只有几团灰白的干垫状矮植）",
    "发光的晶柱与任何光晕（晶柱只反光）",
    "火、营火与任何人工光源",
    "风与土的元素生物、人物、动物（全部属 shot 层）",
    "插在大地上的巨剑与金色矿脉（8.x）",
    "飞行坐骑",
    "训练假人",
]

