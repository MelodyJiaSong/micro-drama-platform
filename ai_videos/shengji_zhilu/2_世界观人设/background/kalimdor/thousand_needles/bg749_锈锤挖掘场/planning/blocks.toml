# 锈锤挖掘场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：区级平面图坐标减 (2616, 2147) 即本图坐标（区图 [70, 86] ＝ 本图 (200, 160)）。
# 西缘高崖照区级 terrain.toml「南墙」平移；坑群轮廓（主坑 + 北 / 西 / 南三道探沟）按区图上那块不规整的坑形量取。
# 坑与探沟都是下挖的，h_m=0 表示贴地，深度写在 note。锚点机位 ＝ b11 翻土堆顶，朝西。

[meta]
bg = "bg749"
name_zh = "锈锤挖掘场"
size_m = [400, 320]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1002 px ≈ 4023 m（每像素约 4.0 m，区级 terrain.toml 同口径）；崖线与坑群外廓从区图量取，坑内残墙、脚手架、营帐为推定"
# 世界树画面：盐滩西南角一片被挖开的考古坑：木脚手架、翻出的土堆、半露的石砌残墙，坑边一个黑洞不断爬出甲壳虫。
absent = ["任何积水与水面（4.0.3a 后才被淹成「沉没的挖掘场」；塔霍达旁的浅水在东约 300 m 外，画框外）", "码头与船", "燃烧中的营帐与浓烟", "火与人工光源", "现代工程机械 / 钢结构", "完整的古建筑（只有半人高的残墙）", "绿色植被", "雪"]

[[ridge]]
