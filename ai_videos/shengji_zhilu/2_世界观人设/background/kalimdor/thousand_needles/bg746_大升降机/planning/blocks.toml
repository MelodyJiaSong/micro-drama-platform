# 大升降机 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 换算：本场地中心 (200, 200) ＝ 区级平面图 (1287, 590)（区图 [32, 22]），区级坐标减 (1087, 390) 即本图坐标；
# 北壁崖线、V 形缺口、针岩·11 / ·19、升降机坡道都照区级 terrain.toml 平移过来。

[meta]
bg = "bg746"
name_zh = "大升降机"
size_m = [400, 400]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 1002 px ≈ 4023 m（每像素约 4.0 m，区级 terrain.toml 同口径）；崖线、缺口与两根石柱从区级平面图平移量取，升降机各构件尺寸为推定"
# 世界树画面：峡谷北壁上一架牛头人造的巨型木质升降机：粗木框架、绳索与配重，从贫瘠之地的崖顶直落到千针石林的谷底，下面有一小片墓地。
absent = ["任何水面（窄长浅湖在东南约 250 m 外，画框外）", "河流与瀑布", "淹没峡谷的大水面（4.0.3a 之后）", "码头与船", "损毁倒塌的升降机（大灾变后）", "铁质电梯 / 钢缆 / 齿轮机械", "第二条上下崖的路", "飞行坐骑与飞行点", "石砌建筑", "森林与草地", "雪"]

