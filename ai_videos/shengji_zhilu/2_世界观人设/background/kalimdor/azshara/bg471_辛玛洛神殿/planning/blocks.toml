# 辛玛洛神殿 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级坐标 (1807.5, 2274.4)。神殿 ≈ 区图 [42, 77]（区级 b905，地图量取）→ 本地 (150, 100)；
# 门纳尔湖 ≈ 区级 b906 (1874, 2490) → 本地 (67, 216)，只有东北一角入场；台地高度取 bg465「东北岸高约 25 m 的台地」。
# 殿基直径、柱数、法阵尺寸、台阶朝向全部推定（区图只有一个柱廊图标）。

[meta]
bg = "bg471"
name_zh = "辛玛洛神殿"
size_m = [260, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图只有一个柱廊图标（约 30 × 30 m 的图上尺寸，图标不是比例尺）；殿基直径 40 m、十二柱一圈按「山腰上的圆形神殿遗址」推定。场地 260 × 240 m 把西南的湖角与东南的山肩框进来，湖本体与对岸的裸岩山脊在场地西南、西北之外"
# 世界树画面：山腰上的圆形神殿遗址，中央基座空着，四周立柱残缺不齐，地面刻着巨大的法阵
absent = [
    "任何人物、动物与龙类（湖上盘旋的生物属 shot 层）",
    "基座上的任何物件、水晶、宝珠与供品（基座是空的）",
    "发光的法阵、发光的刻槽、光柱、符文浮空与任何魔法特效",
    "屋顶、穹顶、柱顶横梁与完整的围墙（只剩一圈高矮不一的立柱）",
    "火、火盆、烛火、灯笼与任何人工光源",
    "帐篷、营地陈设、木栅与旗帜",
    "铺装大道（只有一条残缺的石阶小径与林间兽径）",
    "雪、冰面与针叶林",
    "翠绿的夏日树冠（本区树冠一律橙红与金黄）",
    "4.0.3a 之后的哥布林工程痕迹、爆破坑、管道与机械",
    "文字铭刻与招牌（浮雕带已磨平，没有可读的字）",
]

[[ridge]]
name = "东南山肩（南部界山北坡伸出的支脊）"
