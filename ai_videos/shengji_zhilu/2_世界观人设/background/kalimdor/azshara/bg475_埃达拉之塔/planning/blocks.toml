# 埃达拉之塔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 塔 ＝ 区图 [89, 32]（坐标表，区级 b475）；窄岬、内湾、圆岛、圆礁的相对位置按 ref/ 裁切图量取（裁切约 1.8 m/px），场内细部推定。

[meta]
bg = "bg475"
name_zh = "埃达拉之塔"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "裁切图（720 px ≈ 区图 290 px ≈ 1.3 km）量得窄岬宽约 75 m、长约 120 m，塔与岬尖相距约 20 m；塔残高 28 m、底径 12 m 无一手出处，按「九层楼高的细长圆塔」推定。场地由默认 90 m 放大到 320 × 280 m，把内湾、圆岛与外海一起框进来"
# 世界树画面：东端海岬上的孤塔，白石塔身斜倚崖边，塔顶残缺，下方是碧蓝深海
absent = [
    "任何人物与动物（塔内外与海面上都是空的）",
    "完整的尖塔顶、笔直不倾斜的塔身、第二座塔",
    "塔窗灯火、发光法阵与任何人工光源",
    "灯塔、航标灯、码头、栈桥、停泊的船只（旧世这里没有港口）",
    "沙滩（岬尖与两侧都是岩崖，沙底只在内湾水下）",
    "崖沿护栏、旗帜、营帐",
    "雪、冰面与针叶林",
    "4.0.3a 之后的哥布林工业设施与改造痕迹",
    "文字招牌与纹章",
]

