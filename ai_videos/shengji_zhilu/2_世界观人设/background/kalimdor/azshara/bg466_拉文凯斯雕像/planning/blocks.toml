# 拉文凯斯雕像 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ ref/bg466_拉文凯斯雕像_map_crop.png 的整幅（区图 180 × 120 px，裁切图 720 × 480，裁切 1 px ≈ 1.157 m）；坐标 ＝ 裁切 px × 1.157。
# 红十字（区图 [65, 87]）＝ 场地 (416, 278) ＝ 石像。读图口径：淡紫 ＝ 岩质高地，金黄 ＝ 草谷 / 草盆地，带齿线 ＝ 崖沿（齿朝下坡）。

[meta]
bg = "bg466"
name_zh = "拉文凯斯雕像"
size_m = [830, 555]
px_per_m = 1.9
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取（1 px ≈ 4.63 m，±60 m）：岩脊高地、草谷、东侧草盆地、南岸海岸带与外海按裁切图描边；石像残高 22 m、断崖 20 m、基座尺寸推定。场地由默认 220 m 放大到整幅裁切，把崖下草谷与南面的海一起框进来"
# 世界树画面：崖顶上一座巨大的精灵战士石像残躯，只剩下半身与一只手，风化严重，脚下是悬崖与海
absent = [
    "完整的石像（头部与上半身早已塌落）、第二座石像",
    "石像上的发光纹样、铭文、旗帜与任何人工光源",
    "脚手架、修复痕迹、护栏、台阶式参观步道",
    "营地、帐篷、码头、船只（4.0.3a 之后南岬的改造，旧世无）",
    "任何人物与动物",
    "雪、针叶林、翠绿夏林（树冠一律橙红、草色金黄）",
]

