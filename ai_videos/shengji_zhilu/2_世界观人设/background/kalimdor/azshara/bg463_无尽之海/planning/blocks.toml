# 无尽之海 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级图（bg453）的 (3300, 1600) m：风暴海湾湾口外侧礁石岛带 + 其东的外海（区图 71–97% × 52–81%）。
# 锚点机位：b04 礁石岛顶，朝东北（方位约 45°）平视；区图上的礁石岛写 地图量取，为构图补的小礁与深礁写 推定。

[meta]
bg = "bg463"
name_zh = "无尽之海"
size_m = [1200, 900]
px_per_m = 1.3
grid_m = 100
scale_src = "地图量取"
scale_note = "礁石岛位置按区图 px × 4.628 m 量取（±60 m）；礁岛直径按区图圆圈 8–13 px 推算；船骸与构图小礁尺寸推定"
# 世界树画面：海岸线外一望无际的深蓝外海，近岸处水色转成碧绿，远处只剩海平线与翻卷的白浪，礁石与沉船残骸零星露出水面
absent = [
    "任何岸线设施：港口 / 码头 / 船坞 / 灯塔 / 灯标 / 系船铁环（4.0.3a 之后才有海港）",
    "任何航行中的船、帆、桅杆与船灯",
    "海里的类人种族、海巨人、海兽及任何动物",
    "风暴 / 巨浪 / 雾 / 雨",
    "火光与任何人工光源",
    "沙滩与近岸陆地（锚点图里只在左缘极远处露一截远岬）",
]

