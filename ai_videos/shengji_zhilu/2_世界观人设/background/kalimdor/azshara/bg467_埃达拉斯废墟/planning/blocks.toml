# 埃达拉斯废墟 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg467"
name_zh = "埃达拉斯废墟"
size_m = [640, 520]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "区级平面图 b904 量取：废墟占区图 (34–46%, 48–60%) ≈ 520 × 420 m，本图外扩到 640 × 520 m 以装下北缘山脚、西南来路与东缘海湾西岸；原点 ＝ 区级坐标 (1540, 1380) m。山脚、路、岸线按区级 terrain.toml 平移量取；台地层数、柱廊、殿基、石阶道等内部布局无一手尺寸出处，推定"
# 世界树画面：大片白色大理石城市废墟，成排立柱与台阶顺山势铺开，柱间长出橙红树木
# 地势西高东低：上台地（西北，路终点）→ 五层台地一级级向东落到海湾西岸
absent = [
    "码头、港口、栈桥、船只与任何水上设施（4.0.3a 后海湾才被改造成港）",
    "哥布林工事、起重机、铁皮房、火箭与任何工业机械",
    "完整的屋顶、完整的城墙与城门楼（本处只有残柱、断墙与殿基）",
    "拱门以东的任何道路（土路只到入口拱门）",
    "点亮的石灯座、火把、火盆、篝火与任何人工光源",
    "翠绿的夏林、雪、针叶林",
    "任何人物、守卫、水生怪物与动物",
    "文字碑刻与任何可读的字",
]

