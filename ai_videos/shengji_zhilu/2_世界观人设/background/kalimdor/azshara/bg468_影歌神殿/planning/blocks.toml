# 影歌神殿 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg468"
name_zh = "影歌神殿"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区级平面图 b468（坐标表 [15, 73]）为丘心；场地外扩到 360 × 300 m 以装下西侧怒水河与西界山脚、南脚土路弯道与西南角河口木桥。原点 ＝ 区级坐标 (420, 2110) m，河、路、山脚按区级 terrain.toml 平移量取；丘的尺寸、三道弧墙、石径、丘顶平台等内部布局无一手尺寸出处，推定。⚠ 区图 (20,61) 另有一个无人认领的柱廊图标（区级 b919），可能才是真位置，待实机核"
# 世界树画面：西部一座被废墟覆盖的小丘，残墙沿坡分布，顶上立着半截石碑
# 丘南缓北陡；正门在南坡，对着土路弯道；路不上丘
absent = [
    "海、海湾与任何海岸（本处在西部河谷，任何机位都看不到海）",
    "柱廊、宽台阶道、完整的神殿屋顶（本处只有三道弧形残墙与丘顶平台）",
    "可读的碑文与任何文字",
    "发光的石盆、泉水、魔法光尘（石盆干涸）",
    "帐篷、营火、兽皮棚（营地在西南角河口与东北林间，不在丘上）",
    "攻城器械、哥布林工事、伐木机械与任何工业设备（4.0.3a 后才有的战线改造）",
    "第二座桥（河口木桥属塔伦迪斯营地，是全区唯一一座）",
    "火把、灯笼、篝火与任何人工光源",
    "雪、针叶林、翠绿夏林",
    "任何人物与动物",
]

