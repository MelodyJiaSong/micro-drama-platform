# 风暴海湾 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ 区图 px x 470–730、y 250–449（260 × 200 px，1 px ≈ 4.63 m）；场地 m ＝ (区图 px − 原点) × 4.63。
# 浅水 / 深水 / 分界线 / 岛 / 露头斑点按区图描边；机位岩岬、洞口、漂木滩推定。

[meta]
bg = "bg459"
name_zh = "风暴海湾"
size_m = [1200, 920]
px_per_m = 1.3
grid_m = 100
scale_src = "地图量取"
scale_note = "区图量取（1 px ≈ 4.63 m，±60 m）：西岸线、浅水区（淡青带斑点）、深水区（横线纹）、深浅分界线、两座岛与环形礁按区图描边；水深、岛高、岩岬高度推定"
# 世界树画面：深深切入陆地的大海湾，湾口被高崖夹住，海面常年翻着白浪，水下可见沉没的石构
absent = [
    "码头 / 港口 / 栈桥 / 船坞 / 停泊或航行的船（4.0.3a 之后的哥布林港口，旧世无）",
    "被挖成徽记形状的人工海湾、起重机、工业机械（4.0.3a 的改造）",
    "露出水面的完整神殿（沉殿只露一圈柱顶的影）",
    "任何人物与动物（海中类人种族、多头蛇、巨龟都不画）",
    "风暴 / 暴雨 / 闪电 / 雾",
    "任何火与人工光源（白天户外）",
    "沙滩浴场式的宽阔黄沙滩（西岸是窄的灰白卵石浅滩）",
]

