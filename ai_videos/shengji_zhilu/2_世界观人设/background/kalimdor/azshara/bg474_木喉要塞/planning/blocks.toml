# 木喉要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 洞口 ≈ 区图 [38, 32]（区级 b902，地图量取）；洞口朝东与两壁形状按区级 terrain 两条山带的东端推定，场内落位全部推定。

[meta]
bg = "bg474"
name_zh = "木喉要塞"
size_m = [260, 220]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图只有一个门洞图标；洞口约 5 m 宽、岩凹口约 80 m 宽按「两人高三人宽的洞口 + 能容一片空地的岩凹」推定。场地 260 × 220 m 把南北两壁与东缘坡下秋林框进来，洞内纵深只画门帘后可见的一段"
# 世界树画面：西北山壁下的熊怪洞穴，洞口用原木加固，洞内火光与兽皮帐帘
absent = [
    "任何人物与动物（洞口内外都是空的）",
    "通往邻区的隧道出口（与费伍德的同名隧道互不连通）",
    "寨墙、栅栏、望塔、石砌或木构房屋",
    "洞外的明火、火把、灯笼与其它人工光源（洞外旧火塘冷透不冒烟）",
    "河、湖与任何水面（西北海臂的南端在场地以北三百多米外）",
    "雪、冰面与针叶林",
    "铺装道路（只有一条踩出的泥径）",
    "4.0.3a 之后改名改建的布景与哥布林工业痕迹",
    "文字招牌与纹章",
]

