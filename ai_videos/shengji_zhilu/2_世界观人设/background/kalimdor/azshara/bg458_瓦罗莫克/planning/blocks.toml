# 瓦罗莫克 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg458"
name_zh = "瓦罗莫克"
size_m = [260, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "按旧世原址写：区图 (22,52) 西部河谷的帐篷图标（经典服数据库 [22, 55]），不是页首坐标表的 [14, 65]（那是 4.0.3a 搬家后的新址）。北面山脚距营心约 100 m 按区级平面图「西北界山南带」南缘量取（±60 m）；桩圈 40 × 40 m 与帐篷数量按原典「小而光秃、几乎不设防」推定"
# 世界树画面：西部林间的兽人营地，兽皮帐篷围着一圈尖木桩，旗杆上挂着红黑战旗
absent = [
    "高寨墙、瞭望塔、石砌或木构房屋（旧世是几乎不设防的小营）",
    "路障、炸弹车、哥布林工事与上古白石废墟（4.0.3a 搬家后的新址才有）",
    "点着的篝火、火把、火盆与任何人工光源（火塘默认冷灰）",
    "烟柱与火星",
    "紫顶精灵帐篷、暗紫布幔与带刺弯角图腾（那是同区别的营地）",
    "河流与桥（怒水河在西面约 350 m 外，不入本档）",
    "任何人物、狼、双足飞龙与坐骑",
    "旗帜纹章与文字",
]

