# 乌索兰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级坐标 (1890, 710)。遗址 ≈ 区图 [45, 27]（区级 b901，地图量取）→ 本地 (184, 110)；
# 西面山脚、西南岩丘按区级 terrain 与区图量取；遗址内部布局（柱基两列、底座、倒伏石雕、残殿基）全部推定。

[meta]
bg = "bg476"
name_zh = "乌索兰"
size_m = [320, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图只有一个柱廊图标与西南一圈带陡坎线的椭圆；遗址本体约 50 × 40 m 按「一条两列八柱的短柱道 + 一方残殿基」推定。场地 320 × 300 m 把西面山脚与西南岩丘的北半框进来，西南角外约 350 m 是木喉洞口（bg474），北北东约 340 m 是西北海臂南端，都不入场"
# 世界树画面：西北林地里的小片遗址，熊形石雕倒在草中，残柱只剩底座
absent = [
    "任何人物与动物（倒伏的是石雕，不是活物）",
    "立着的完整石柱、柱顶横梁与屋顶（柱子只剩底座与散落的鼓段）",
    "帐篷、布幔、图腾、兽皮与任何营地陈设（那是以东北岬上的营地）",
    "火、火堆、烛火、灯笼与任何人工光源",
    "河、湖、海与任何水面（海臂南端在场地北北东约 340 m 外）",
    "铺装道路（只有一条草里踩出的兽径）",
    "雪、冰面与针叶林",
    "翠绿的夏日树冠（本区树冠一律橙红与金黄）",
    "4.0.3a 之后的哥布林工业痕迹、铁轨与机械",
    "文字铭刻、纹章与招牌",
]

