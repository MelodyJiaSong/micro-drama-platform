# 南山海滩 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg470"
name_zh = "南山海滩"
size_m = [800, 420]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "区图该段无图标：按世界树备注「风暴海湾南侧海岸」+ 区级 b913（原典方位）摆在海湾南带南岸；原点 ＝ 区级坐标 (2380, 2000) m，海湾南带水面按区级 terrain.toml 平移。沙滩长约 700 m、宽约 40 m、崖高约 35 m 及冲沟、礁岛、漂木等细节均无一手尺寸出处，推定"
# 世界树画面：海湾南岸的狭长沙滩，背后是陡直的橙红崖壁，沙面上散落漂木
# 海在北、崖在南；崖壁朝北，午后西南斜阳被崖顶挡住，崖脚落在冷影里
absent = [
    "码头、港口、栈桥、船只、渔网与任何水上设施（4.0.3a 后海湾才被改造成港）",
    "哥布林房屋、起重机、火箭轨道与任何工业机械",
    "建筑、遗址、石构残件（本段是纯自然海岸；沉没石构只在远处湾心）",
    "上下崖的台阶或道路（唯一能上下的是中段冲沟）",
    "热带棕榈、白色度假沙滩",
    "火把、灯笼、篝火与任何人工光源",
    "雪、针叶林、翠绿夏林",
    "任何人物、脚印、水生怪物与动物",
]

