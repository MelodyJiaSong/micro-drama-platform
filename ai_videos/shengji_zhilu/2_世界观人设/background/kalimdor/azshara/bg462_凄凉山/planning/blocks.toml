# 凄凉山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 本场地原点 ＝ 区级图（bg453）的 (900, 1850) m；山脊 / 土路 / 石径 / 湖 / 南界山的几何全部由 bg453 terrain.toml 平移得来。

[meta]
bg = "bg462"
name_zh = "凄凉山"
size_m = [1200, 800]
px_per_m = 1.3
grid_m = 100
scale_src = "地图量取"
scale_note = "区级图 terrain.toml 的「凄凉山（裸岩山脊）」多边形（区图 21–41% × 62–81%，1 px ≈ 4.63 m，±60 m）平移入本场地；山高 180 m 为区级图推定值；落石、圆石、枯木尺寸按常识推定"
# 世界树画面：西南的裸岩山脊，坡面寸草不生，脊线把西部林地与海岸隔开
absent = [
    "坡上的任何植被（树 / 灌木 / 草，林线在山脚一刀切断）",
    "爆破口 / 开凿面 / 矿道 / 轨道 / 工程机械（4.0.3a 之后的改造，旧世山体完整）",
    "任何建筑、营地、帐篷、篝火与人工光源",
    "任何人物与动物（含天上盘旋的龙）",
    "积雪 / 冰 / 雾",
    "铺装石板路（只有一条淡赭土路与一小段窄石径）",
    "翠绿的夏日林冠（本区树冠一律橙红与金黄）",
]

