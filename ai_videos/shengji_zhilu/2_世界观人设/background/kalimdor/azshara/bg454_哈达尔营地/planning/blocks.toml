# 哈达尔营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [20, 61]（wiki Classic 坐标，区级 b916 原典方位；2026-09-25 审校自 [22, 52] 改来——那里是旧世瓦罗莫克）。
# 营地扎在区图该处柱廊图标所示的白石残迹里；山脚（北约 370 m）、河崖（西约 240 m）、裸岩脊与土路（东南两三百米）都在场地外。营内落位全部推定。

[meta]
bg = "bg454"
name_zh = "哈达尔营地"
size_m = [200, 180]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「几处兽皮棚与冒绿烟的火堆」；空地（含边缘蕨丛）约 52 × 52 m，场地放大到 200 × 180 m 把四周林带框进来。营内尺度与残迹摆位无一手出处"
# 世界树画面：西部林间的萨特小营，几处兽皮棚与冒绿烟的火堆
absent = [
    "任何人物与动物（营地是空的）",
    "寨墙、栅栏、木塔、旗帜与任何石砌或木构房屋",
    "橙红色篝火或冲天火柱（本营唯一的火是膝高的黄绿色火焰）",
    "烛火、灯笼、火把与其它人工光源",
    "道路（土路在营地东南两三百米外，不入场地）",
    "河、湖与任何水面（怒水河在西面约 240 m 的林外）",
    "近处的山坡与崖壁（山脚在北面约 370 m 外，只在林冠之上露出山脊）",
    "完整的白石建筑、柱廊与台阶道（这里只有两柱、一段断墙与一截断柱）",
    "雪与针叶林",
    "4.0.3a 之后的哥布林工业设施与改造痕迹",
    "文字招牌与纹章",
]

