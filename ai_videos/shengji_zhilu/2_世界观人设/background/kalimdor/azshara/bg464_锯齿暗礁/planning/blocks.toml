# 锯齿暗礁 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地 ＝ ref/bg464_锯齿暗礁_map_crop.png 的整幅（区图 180 × 120 px，裁切图 720 × 480，裁切 1 px ≈ 1.157 m）；坐标 ＝ 裁切 px × 1.157。
# 红十字（区图 [68, 11]）＝ 场地 (416, 278)，落在崖顶 ＝ 锚点机位，朝正北。

[meta]
bg = "bg464"
name_zh = "锯齿暗礁"
size_m = [830, 550]
px_per_m = 1.9
grid_m = 50
scale_src = "地图量取"
scale_note = "区图裁切量取（1 px ≈ 4.63 m，±60 m）：崖线、礁盘（淡紫条）、礁带（浅青条）、外海、西南丘陵按裁切图描边；崖高 30 m、尖礁高 1–5 m、船骸尺寸推定"
# 世界树画面：北岸外密布的尖锐礁石，浪在礁间炸成白沫，水下可见船骸
absent = [
    "码头 / 栈桥 / 灯塔 / 灯标 / 停泊或航行的船（4.0.3a 之后的北岬改造，旧世无）",
    "搁浅在岸上的完整船（船骸大半沉在浅水下）",
    "沙滩（崖下是黑色礁盘，不是沙）",
    "任何建筑、营地、帐篷与人工光源（高地上的营地不入本档画面）",
    "任何人物与动物（海里的类人种族、海鸟、海兽都不画）",
    "翠绿草地（崖顶草色一律枯黄与橙褐）",
    "风暴 / 雾 / 雪",
]

