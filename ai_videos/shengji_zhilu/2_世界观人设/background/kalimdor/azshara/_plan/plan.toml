# 艾萨拉（azshara）区级资产规划 —— 区级资产规划师写，tools/apply_asset_plan.py 只读
# 库里原有 0 件；本区新立 p392…a18 共 18 件（≤20）。成片的块用单体 + count 散布。
# 判据：贴地地坪 / 墙坎 / 桥 / 洞口坑道 / 水潭走脚本 kind（rule 4g）；其余有边界的物体引用本区资产库。
# 去重（白模只锁几何与剪影，出图从不拿白模当参考，rule 4d ①）：同剪影的东西共用一件，外观差别由各卡的锁定描述符写。
#   秋树 a01 兼全区秋林 / 孤树 / 歪脖红枫 / 风压矮树 / 矮灌丛；兽皮帐 a02 兼三处营地的兽皮棚与尖顶帐；
#   布面帐 a03 兼紫顶帐 / 帆布方帐 / 卷轴小帐 / 遮阳棚 / 吊挂布幔；立杆 a04 兼图腾柱 / 头骨木杆 / 旗杆 / 不亮的弯木灯柱 / 弯月木桩 / 三脚架；
#   断柱残桩 a08 兼柱基 / 柱墩 / 圆石盆 / 不亮的石灯座 / 树桩带；巨石 a09 兼熊首巨岩 / 熊形石雕 / 巨像残块；
#   方形石料 a13 兼基座 / 石碑 / 门楣 / 沉没石构露头；圆塔 a15 兼熊头崖顶细塔与东岬孤塔；箱垛 a17 兼柴垛 / 木槽 / 碾台 / 骨堆。
# judgment calls：
#   h_m = 0 的块（机位点、崖沿线、滩、谷、石阶道、石径、探沟、烧斑、水下柱圈、深礁暗斑）一律 plaza；营心 / 踩实泥地 → yard；
#   礁石岛 / 岩岬 / 岩脊机位 / 草丘 / 潮池岩台 / 圆形殿基 / 残殿基（抬高平顶地块）→ rock_shelf；土坎与弧墙 / 半圆墙 / 月牙矮墙 / 断墙 → low_wall；
#   潮水坑、半沉圆殿中央深水 → pool；木喉洞口原木门框 → mine_portal、门帘后洞道 → tunnel；小岛岩洞口 → cave_mouth；两座木桥 → arch_bridge。
#   柱廊排成行、柱圈围成圈都用 a06 + count；风暴海湾水下柱圈（柱顶在水下一臂深）走 plaza 不立柱。
#   秋林 count ＝ 占地 ÷ 150 m²，夹在 3–40 之间。

