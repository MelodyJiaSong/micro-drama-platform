# 涌泉河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg706"
name_zh = "涌泉河"
size_m = [320, 420]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "按区级 terrain.toml 的换算（x_m = 区图 px × 4.6465、y_m = px × 4.6455）从原版区图量取：场地原点 ＝ 区图 px [405, 120]；河自巨枝深处到湖头约 130 m、裂口底宽约 40 m（区图细条 6–8 px）；泉眼、树洞、石坎的形制与尺寸属推定"
# 世界树画面：从树心涌出的细河，水流清亮带微光，沿林间石槽蜿蜒，两岸铺满蕨类
absent = ["瀑布或高落差跌水（全程只有一道齐膝石坎）", "桥、栈道、水车与任何建筑", "贯穿树冠的大河（1.12 区图上河只到湖头）", "裂口北端的出口或通道（北端被树身封死）", "发光的河水（水本身不发光，只映月光与苔斑）", "燃烧或焦黑的树冠与树皮（8.x 焚毁，1.12 完好）", "火、烛火、灯柱等人工光源", "雨雪", "树冠地面上的飞行点", "4.0.3a 后新增的任何建筑与地名"]

