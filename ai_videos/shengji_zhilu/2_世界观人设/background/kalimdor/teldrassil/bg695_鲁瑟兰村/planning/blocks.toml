# 鲁瑟兰村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg695"
name_zh = "鲁瑟兰村"
size_m = [320, 280]
px_per_m = 5.0
scale_src = "推定"
scale_note = "北靠主干树身、南临外海取区图（村图标在南段巨枝根脚下，区级图块 b903）；传送门 / 码头 / 飞行点三件的存在取原典，屋子数量、平台与栈桥的尺寸和朝向均无一手出处，按锚点机位（栈桥外端回望西北）能落进来的 320 × 280 m 推定"
# 世界树画面：世界树根部海面上的小码头村，贝壳形白顶木屋立在水中木桩上，长栈桥伸进灰蓝海雾
# 高程：本场地在海面，与树冠地面隔着上千米树身；h_m 均以海面为 0
absent = [
    "任何人物、船只、角鹰兽与海鸟（默认空港，泊位与栖架都空着）",
    "通往树冠的陆路、坡道、阶梯或桥（上树只有传送门）",
    "蒸汽船、铁甲船、地精飞艇",
    "火、烛火、灯笼、火把与亮灯的窗（唯一额外光源是传送门光膜）",
    "石砌码头与人类式港口建筑",
    "沙滩与陆地（除盘根与平台外全是海）",
    "焦黑或燃烧的树身与树冠（8.x）",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "主干树身（弧形木墙，往上一千多米看不到顶）"
