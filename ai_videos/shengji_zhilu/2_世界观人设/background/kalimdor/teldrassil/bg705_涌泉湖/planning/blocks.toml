# 涌泉湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg705"
name_zh = "涌泉湖"
size_m = [480, 720]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级 terrain.toml 的换算（x_m = 区图 px × 4.6465、y_m = px × 4.6455）从原版区图量取：场地原点 ＝ 区图 px [380, 145]，湖长约 570 m、细颈约 50 m、南湖湾约百米；湖心线位置 ±10 m"
# 世界树画面：达纳苏斯东北的小湖，水面极静如镜，映着树冠的紫光，岸边是平铺的白石滩
absent = ["从湖南端流出的河（区图湖南端无出水）", "任何建筑、屋舍、码头、栈桥、桥与船", "石井或月亮井（属西北圣林 bg704）", "树冠地面上的飞行点", "燃烧或焦黑的树冠（8.x 焚毁，1.12 完好）", "火、烛火、灯柱等人工光源", "风浪与雨雪", "瀑布", "训练假人", "4.0.3a 后新增的任何建筑与地名"]

