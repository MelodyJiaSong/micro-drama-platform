# 奥达希尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg693"
name_zh = "奥达希尔"
size_m = [240, 240]
px_per_m = 5.0
scale_src = "推定"
scale_note = "巨树居谷地正中取原典方位（区图 [60, 39]，区级图块 b901 80 m 格）；树干直径 36 m、三层环台高度与坡道绕向均无一手尺寸出处，按区图巨树图标与锚点机位（树根南约 100 m）能落进来的 240 × 240 m 推定"
# 世界树画面：幽影谷正中的巨树，树身裹着螺旋木梯与平台，枝上挂满淡金光球
# 区图：巨树图标南侧一条路出谷，下坡往西南去十字路口村落；谷缘北 / 东 / 西三面是林丘（区级 terrain 北部丘带 / 东北丘带 / 中部丘群）
absent = [
    "任何人物、训练师与野兽（默认空谷）",
    "飞行点与飞行坐骑（1.12 全区只有树根港口一处）",
    "训练假人",
    "旅店、铁匠铺与商铺建筑",
    "火、烛火、灯笼、火把（唯一额外光源是枝头淡金光球）",
    "围墙、栅栏与石砌建筑",
    "焦黑或燃烧的树冠（8.x）",
    "河流与湖面",
    "4.0.3a 后的任何改动",
]

