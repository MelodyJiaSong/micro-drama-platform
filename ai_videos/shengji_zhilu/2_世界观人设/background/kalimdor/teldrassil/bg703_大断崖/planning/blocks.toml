# 大断崖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg703"
name_zh = "大断崖"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界树未记坐标，只有「多兰纳尔西北的树身裂口」一句原典方位；区级 terrain.toml 在 [46, 51] 记有一处认不准的洞口图标，方位吻合，暂按它。缝长两百多米、上宽约 40 m、深约 30 m、东北—西南走向、西南口坡道与缝底营地布置全部为推定，待实机量取"
# 世界树画面：多兰纳尔西北的树身裂口，断面粗糙发黑，裂缝深处是熊怪的窝棚与骨堆
# 「断面发黑」＝巨树木质常年阴湿的本色，不是烧痕（泰达希尔燃烧是 8.x）
absent = [
    "焦痕、火星、烟、燃烧或焦黑的树冠（8.x 焚毁，1.12 完好）",
    "亮着的火、火把、烛火、灯笼（火塘是冷灰余烬）",
    "人物、熊怪、野兽、坐骑",
    "精灵式弧顶木屋、石柱、月亮井（这里只有粗枝兽皮窝棚）",
    "桥、栏杆、梯子（唯一的横跨物是一根天然倒伏的白木）",
    "第二个出入口（东北端封死）",
    "流水与水潭（只有低处几滩浅泥水）",
    "白昼、雨雪",
]

