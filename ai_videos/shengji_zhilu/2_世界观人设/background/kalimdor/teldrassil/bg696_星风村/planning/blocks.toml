# 星风村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg696"
name_zh = "星风村"
size_m = [240, 220]
px_per_m = 5.0
scale_src = "推定"
scale_note = "背靠东段巨枝、北有低林丘、西来一条虚线小径取区图裁切（坐标表 [65, 49.6] 落在村北丘上路弯，三枚村屋图标在 [67, 58.5]，区级图块 b696 160 m 格）；屋子尺寸与相对位置无一手出处，按锚点机位（村西路口朝东）能落进来的 240 × 220 m 推定"
# 世界树画面：东侧林中的废弃小村，几栋紫顶木屋空无一人，屋内外结满灰白蛛丝
absent = [
    "任何人物、蜘蛛、游魂与野兽（底图里只留蛛丝）",
    "火、烛火、灯笼、火把与发光的灯柱（默认零人工光源，石灯柱已倒且不亮）",
    "焦黑、烧痕与塌成瓦砾的废墟（荒废只靠蛛丝与落叶读出）",
    "第二条出入路、桥与围墙",
    "石砌房屋与人类式建筑",
    "水面（村里没有河湖）",
    "焦黑或燃烧的树冠（8.x）",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "北侧低林丘（坐标表点位所在的路弯丘）"
poly = [[0, 0], [190, 0], [184, 40], [130, 56], [70, 50], [0, 60]]
height_m = 12
src = "地图量取"

[[ridge]]
name = "东段巨枝木崖（村后直立，崖外即海）"
poly = [[190, 0], [240, 0], [240, 220], [206, 220], [192, 160], [188, 90]]
height_m = 150
src = "地图量取"

[[road]]
