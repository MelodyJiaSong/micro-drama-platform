# 阿里斯瑞恩之池 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg701"
name_zh = "阿里斯瑞恩之池"
size_m = [300, 300]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标 [40, 65]（区 m ≈ 1862, 2017）。区图 ≈ 4.65 m/px：上潭在区图上长约 20 px ≈ 90 m、西北—东南走向；其南两口小潭、东南角一口更小的潭（裁切图可辨）。两侧林丘取区级 terrain.toml 的西南丘陵 / 中南丘。潭的具体形状、落差、苔石门槛与遗留物为推定"
# 世界树画面：一串阶梯状的小水潭，水色青碧，潭间有细瀑跌落，周围铺满湿润的苔石
# 北面三百多米外的主干道、南面沟口外的熊怪主营（bg699）都在场地之外，只写在 md，不画
absent = [
    "任何建筑、木屋、石台、桥、围栏",
    "营地尖桩、兽皮帐篷、篝火与图腾（那是南面的 bg699）",
    "人物、坐骑、动物、水鸟、鱼跃",
    "火、烛火、灯笼、灯柱等任何人工光源",
    "铺石路与车辙（只有一条踩出的细草径）",
    "崖壁与大瀑布（落差只有一两人高的细瀑）",
    "焦黑或燃烧的树冠（8.x 焚毁，1.12 完好）",
    "白昼、雨雪、结冰的潭面",
]

