# 地狱石 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg698"
name_zh = "地狱石"
size_m = [200, 134]
px_per_m = 8.0
scale_src = "推定"
scale_note = "布局量自微型地下城图 ref/WorldMap-MicroDungeon-Teldrassil-FelRock.jpg（1002×668 px），按 1 px ≈ 0.2 m 换算（x_m = px × 0.2、y_m = px × 0.2）；比例本身无一手出处，按洞内通道宽 8–15 m、整洞约 150 × 110 m 推定"
# 世界树画面：幽影谷西侧的岩壁洞口，洞内岩石泛暗绿磷光，蝙蝠与蛛类在顶壁倒挂
# 洞形（地下城图）：洞口在东南角，一条朝北的入洞坑道通进东侧岔厅；主体是一圈环形通道，环内立着三块岩柱（西北大岩柱 / 东北岩柱 / 正中窄岩柱）与一块东侧小岩墩；四处低洼积着静水（西北角袋厅 / 东北 / 正中 / 西南最大一潭），两道细水沟连着它们
absent = [
    "任何人物、蝙蝠、蛛类与野兽（默认空洞，倒挂的活物属 shot 层）",
    "火、火把、火盆、灯笼与任何人工光源（唯一光源是岩石暗绿磷光）",
    "月光或天光照进洞厅（洞口在机位身后、光进不来）",
    "熔岩与岩浆",
    "人工砌筑的墙、门、台阶与祭坛",
    "晶簇状的发光水晶（发光的是岩面与苔，不是水晶）",
    "4.0.3a 后的任何改动",
]

