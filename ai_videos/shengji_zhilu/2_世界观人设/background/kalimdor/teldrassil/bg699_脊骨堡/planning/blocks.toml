# 脊骨堡 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg699"
name_zh = "脊骨堡"
size_m = [480, 360]
px_per_m = 3.2
scale_src = "地图量取"
scale_note = "场地中心 ＝ 坐标表 [43, 65.2]；区图 1 px ≈ 4.65 m（terrain.toml 换算），裁切图约放大 4 倍 → 裁切 1 px ≈ 1.16 m，丘带 / 巨枝 / 阶梯小潭的相对位置按此量取。营地本身（围栏直径约 60 m、帐篷 7 m）无一手尺寸，推定"
# 世界树画面：树冠西南尽头的熊怪营地，粗木尖桩围栏、兽皮帐篷与中央大篝火，地面踩成泥
# 区图：营地贴在东侧丘群西脚；西侧紧邻阶梯小潭群（bg701，地理页写「脊骨堡以北」，裁切图上在西—西南，按图）；西南角是树冠外缘巨枝；东南一道巨枝支脉；北面林丘
absent = [
    "任何人物、野兽人与野兽（默认空营）",
    "燃着的篝火、火把、灯笼与任何人工光源（中央火塘是冷灰余烬）",
    "石砌墙、木板屋与精灵式紫顶屋舍（营地只有尖桩围栏与兽皮帐篷）",
    "塔楼与瞭望台",
    "燃烧或焦黑的林冠（8.x 焚毁，1.12 完好）",
    "飞行点与飞行坐骑",
    "训练假人",
    "4.0.3a 后的任何改动",
]

