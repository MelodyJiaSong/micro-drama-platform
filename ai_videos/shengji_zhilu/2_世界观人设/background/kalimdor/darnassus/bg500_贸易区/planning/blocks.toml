# 贸易区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 量取：原版区图 WorldMap-Darnassus_c60.jpg（1002 × 668 px，0.966 m/px，同区级 terrain.toml），
#       本图原点 ＝ 区图像素 (505, 312)；场地 x = (px − 505) × 0.966，y = (py − 312) × 0.966。
# 区图上是淡紫色的建筑色块：十二座方形 / 长条货馆 + 两座圆形小馆，沿一条向东鼓出的弧形主道与几条向西南斜下的岔道排开；
# 各块「是什么铺子」区图不标，除拍卖大厅外一律只写形制；拍卖大厅是哪一座也是推定（写在 note）。

[meta]
bg = "bg500"
name_zh = "贸易区"
size_m = [260, 290]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "区图 967.7 × 645.3 m（AreaID 1657 的 WorldMapArea）按 0.966 m/px 量取；本场地框住区图像素 x 505–774、y 312–612 的东南货摊台地及其西缘湖岸"
absent = [
    "任何点亮的火 / 灯笼 / 烛火（白天默认态不点灯，货摊挂的灯是冷的）",
    "石砌城墙、城门楼与箭塔（台地外缘是树体崖沿与白石栏，不是城墙）",
    "车马、货车与车辙（城在树冠上，不走车）",
    "港口、码头与船（码头在树根下的村，不在城里）",
    "飞行点与角鹰兽栖架（在树根下的村）",
    "通别的大陆 / 位面的传送门（4.0.3a 之后才有）",
    "文字招牌、价目牌上的字（画面零文字；公告木牌是空白的）",
    "泥地、积水、垃圾与集市杂物堆",
    "红砖、灰瓦、茅草顶等人类式民居形制",
    "摊主、顾客、坐骑与任何动物（纯空间背景）",
]

