# 达纳苏斯全城 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/WorldMap-Darnassus_c60.jpg，1002 × 668 px）量取：山脊 [[ridge]]（poly 多边形）/ 水系 [[water]]（path 折线）/ 道路 [[road]]（path 折线），单位 m。
# 换算见 blocks.toml 头两行：x 0.966 m/px（9.677 m/% ÷ 10.02 px/%）、y 0.966 m/px（6.453 m/% ÷ 6.68 px/%），原点区图左上角，x 向东 y 向南。
# 要覆盖某个自动块，写 [[block]] 且带同一个 bg 键；要加没坐标的块，写 [[block]] 用 b9NN 的 id（带 bg 键则是世界树无坐标的 bg）。
# 本区是建在巨树冠层枝台上的城，区图上没有一条山脊；两条「城缘崖壁」是按游戏内城四周不可越的树体 / 崖沿推定的，不是量出来的。
# 中央浅湖用宽折线填成面（四段岸线 + 绕岛环水），湖心绿岛与银行树是 b999 块压在水面上。

[meta]
absent = [
    "山脊 / 裸岩山体（城建在巨树冠层的枝台上，四周是树体与崖沿，不是山）",
    "海与海岸线（海在树根下的码头村，不在本区图）",
    "石砌城墙与城门楼（只有东侧一道门廊，城的边界是树体与崖）",
    "农田 / 麦田 / 牧场",
    "针叶林与秋色（树冠是紫红与银灰，不是松杉，也不是枯黄）",
    "飞行点与角鹰兽（在树根下的码头村，城里没有）",
    "通别的大陆 / 别的位面的传送门（4.0.3a 之后才有；旧世只有一道去树下码头村的门）",
    "训练用的假人靶（4.0.3a 之后才有）",
    "任何火 / 篝火 / 灯笼常亮态（白天默认态不点灯，夜态另立 bg）",
]

