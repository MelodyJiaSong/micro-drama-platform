# 塞纳里奥区 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区图（WorldMap-Darnassus_c60.jpg，1002 px ＝ 967.7 m，0.966 m/px）像素 (290, 10)；m = (px − 290) × 0.966, (py − 10) × 0.966。
# 与区级图 bg495 的 b496 块一致：色块中心约区图 [39,13]，南麓圆台接北道。

[meta]
bg = "bg496"
name_zh = "塞纳里奥区"
size_m = [200, 200]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "按原版区图 0.966 m/px 量取（区图 1002 px ＝ 967.7 m，WorldMapArea 口径）；巨树位置按紫红树冠色块，树干粗细与平台层高推定"
# 世界树画面：城北高处的树冠平台群，多层木台由斜坡与藤桥串起，台上立着巨大的守护巨树
absent = [
    "后来为新入盟族群新建的大空心橡树厅（4.0.3a 之后才有）",
    "训练用的假人靶（4.0.3a 之后才有）",
    "角鹰兽栖架与飞行点（在树根下的码头村，城里没有）",
    "兽栏里的宠物与野兽（底图无动物，动物属 shot 层）",
    "任何火 / 篝火 / 灯笼常亮态（白天默认态不点灯）",
    "发光的树 / 发光的花 / 飘浮光点（夜态才有，另立 bg）",
    "山体与裸岩（台地是巨树枝台，不是山）",
    "城墙与城门（北、西两面是树体崖沿）",
    "第三道藤桥 / 蛛网状藤桥（只有两道）",
    "针叶林与秋色枯叶",
]

