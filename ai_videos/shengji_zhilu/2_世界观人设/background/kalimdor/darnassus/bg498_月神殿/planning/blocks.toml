# 月神殿 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区图（WorldMap-Darnassus_c60.jpg，1002 px ＝ 967.7 m，0.966 m/px）像素 (255, 395)；m = (px − 255) × 0.966, (py − 395) × 0.966。
# 与区级图 bg495 的 b498 / b906 / b907 块一致；区图上北半是湖（内湾与圆台），南半与东西两侧是城缘（羊皮底色），标题卷轴只遮住台地东南角。
# 两翼在区图上画的是与北阶台同样的阶纹 ＝ 宽石阶，不是偏殿。

[meta]
bg = "bg498"
name_zh = "月神殿"
size_m = [260, 260]
px_per_m = 6.0
scale_src = "地图量取"
scale_note = "按原版区图 0.966 m/px 量取（区图 1002 px ＝ 967.7 m，WorldMapArea 口径）；台基、阶台、门厅、穹顶大殿、两翼按区图描出，各体块高度与花圃位置推定"
# 世界树画面：城南隔水的一座独立台地，半球形白石穹顶压在成排立柱上，穹顶开口漏下一柱月光，落进殿心一池静水，柱间垂着银纱，周围是低矮花圃与两道跨湖长桥。
absent = [
    "4.0.3a 之后加进来的另一位大德鲁伊的位置与通往别的大陆 / 外域的传送门",
    "穹顶开口漏下的月柱（夜态，另立 bg；白天只有灰白天光铺在池面）",
    "烛火 / 灯笼 / 火盆（白天默认态零人工光源）",
    "发光的水 / 发光的花 / 飘浮光点",
    "大殿南侧的出口（南贴城缘树体崖，唯一正门在北）",
    "两翼的方形偏殿（区图两翼是阶纹，是宽石阶不是殿）",
    "台地四面环水（只有北半临湖，南半贴崖）",
    "城墙与城门（台地外缘是八角白石岸墙，北半落湖、南半贴崖）",
    "山体与裸岩",
    "人物与动物（底图全空）",
]

