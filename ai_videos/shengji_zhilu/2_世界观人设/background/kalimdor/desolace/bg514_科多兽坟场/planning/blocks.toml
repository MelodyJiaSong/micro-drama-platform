# 科多兽坟场 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg514"
name_zh = "科多兽坟场"
size_m = [640, 440]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "场地左上角 ＝ 区级平面图 (1830, 1400) m；三段矮脊与两条路按区级 terrain.toml 平移换算（区图 1 px ≈ 4.1 m，±40 m）。骨架与头骨的位置、尺寸无一手出处，按「两层楼高、十几步长的肋骨架」「马车大的头骨」推定"
# 世界树画面：满地都是巨大的科多兽白骨与半埋的头骨，肋骨拱成一座座天然的骨架棚，地面是灰白的骨屑
# 机位：北弧缺口土路上（x≈195, y≈85），略高于人眼，朝南俯看；碗底比脊脚低十来米
absent = [
    "任何人物与动物（活的巨兽、秃鹫都不入画）",
    "幽魂、鬼火、发光的骨头与任何飘浮光点（常态是死物静物）",
    "任何火、火塘与人工光源",
    "建筑、围栏、帐篷群（碗里没有人住；五帐小营在东北弧末端，属邻档）",
    "活草、灌木与绿色植被（只有几棵骨白枯树）",
    "水塘与流水（最近的死水塘在东南横路以南，场地外）",
    "完整站立的整具骨骼标本（骨架都是半埋、散架的）",
    "文字、路牌与部族旗纹",
    "返绿的荒原与新长的树（4.0.3a 之后的样子）",
]

