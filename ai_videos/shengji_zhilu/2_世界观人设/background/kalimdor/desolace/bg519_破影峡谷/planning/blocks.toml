# 破影峡谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg519"
name_zh = "破影峡谷"
size_m = [520, 300]
px_per_m = 3.0
scale_src = "推定"
scale_note = "区图裁切上峡谷是东墙山影里一条约 500 m 长、100 多米宽的淡紫谷地（区图精度约 ±60 m）；谷长取 480 m、谷底宽 110–140 m，外加两侧崖壁，520 × 300 m，无一手尺寸出处"
grid_m = 50
# 世界树画面：东南山中一条藏得很深的峡谷，谷里立着几丛巨型蘑菇与一圈拖着巨链的召唤法阵
# 区图：谷口朝西北正对污水塘村（约 300 m 外，出本图），谷身向东南扎进东墙山里；谷中两枚营地图标
# 图面按「谷轴 = 东西」摆（x 向谷深处），真实谷轴偏东南约 30°
absent = [
    "任何人物、邪教徒、恶魔、坐骑与动物（默认空营）",
    "召唤光效、发光的刻槽 / 铁链、地面发光法阵",
    "火、烛火、灯笼、熔岩（火坑冷透，本档零人工光源）",
    "谷口以外的出入口（东端崖壁封死，两侧崖壁无路）",
    "河流、水塘、泉水（谷里没有水）",
    "绿草、活树、返绿（1.12 凄凉之地是灰黄死地）",
    "石墙建筑、木屋（这里只有布帐）",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

