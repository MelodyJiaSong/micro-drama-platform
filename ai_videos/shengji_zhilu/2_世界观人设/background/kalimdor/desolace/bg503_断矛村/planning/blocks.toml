# 断矛村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 世界树条目为空壳、区图认不出位置，区级图（bg502）也没摆它——本图全部推定，只锁营地内部布局，不锁它在区里的方位。

[meta]
bg = "bg503"
name_zh = "断矛村"
size_m = [200, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "无坐标、无原典尺寸。营地土台约 64 × 56 m、五顶帐篷各约 9 m 直径，按兽皮圆帐常识推定；场地放大到 200 m 把西南断矛场与东南出路框进来"
# 世界树画面：荒原上一处被打烂的半人马营地，帐篷塌了一半，折断的长矛插在土里
absent = [
    "任何人物、坐骑与动物（营地已被遗弃）",
    "亮着的火、烟、烛火、灯笼与任何人工光源（火塘是冷灰）",
    "完整的旗帜、纹章与文字招牌",
    "石砌或木构房屋、望塔（只有兽皮帐与木桩寨栅）",
    "河流、水塘与任何水面",
    "活草、绿树与返绿的地面（1.12 是灰黄死地）",
    "高过帐篷的近景地物（天际线低平，只有远处山墙）",
    "4.0.3a 之后的新营地与新地名",
]

