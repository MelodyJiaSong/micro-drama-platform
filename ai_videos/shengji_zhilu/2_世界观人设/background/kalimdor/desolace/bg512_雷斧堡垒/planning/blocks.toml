# 雷斧堡垒 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg512"
name_zh = "雷斧堡垒"
size_m = [230, 185]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图上堡垒图标贴在西北山块东麓坡脚；幕墙院按「背山面东的方形堡」取 130 × 110 m，外加西侧山坡、东侧豁口乱石坡与东南机位土坎，230 × 185 m，无一手尺寸出处"
# 世界树画面：西北荒原上一座半塌的石砌堡垒，几处常燃的火堆在断墙间跳动，燃烧之刃的黑色刀旗插在垛口上
# 区图：堡垒图标在西北山块东麓，北口下山的南北主道在其东侧，区心往西岸的东西土路在其南侧两三百米外（出本图）
absent = [
    "任何人物、邪教徒、恶魔、坐骑与动物（默认空堡）",
    "召唤光效、发绿或发紫的异色火光、地面发光法阵",
    "烛火、灯笼、熔岩（三只铁火盆之外没有人工光源）",
    "北墙与西墙上的门洞（进出只有南门楼与东墙豁口）",
    "旗面上的文字、纹章以外的标识",
    "绿地、活树、水面（本区内陆零绿、无河）",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

