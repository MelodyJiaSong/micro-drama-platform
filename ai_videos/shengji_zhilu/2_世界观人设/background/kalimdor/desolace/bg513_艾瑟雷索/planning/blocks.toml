# 艾瑟雷索 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg513"
name_zh = "艾瑟雷索"
size_m = [360, 300]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上孤塔图标紧贴岸线、坐标 [41, 31] 落在其东南岸上；场地取外海近岸浅水 + 崖下窄滩 + 岸上台地 + 东北山块坡脚，360 × 300 m，无一手尺寸出处"
# 世界树画面：西北海边一片大半沉在水下的暗夜精灵废墟，只剩一座孤塔立在水上，一道小石桥通向塔那扇封死的门
# 区图：孤塔图标在岸线东侧稍北；岸线在此是一道带崖的弧线，东北是西北山块，东南一条土路进来
absent = [
    "任何人物、纳迦、驻员、船只上的人与动物（默认空无一人）",
    "火、烛火、灯笼与任何人工光源",
    "完好的塔门、敞开的门洞与可进入的塔内（门被整块石板封死）",
    "第二座立着的塔（只剩一座孤塔）",
    "码头、栈桥、帆船（唯一完整的船是崖下那条撞碎的小船）",
    "茂密绿地、棕榈树、热带海滩（草只是崖顶一线灰绿短草）",
    "河流与淡水（本区无河）",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

