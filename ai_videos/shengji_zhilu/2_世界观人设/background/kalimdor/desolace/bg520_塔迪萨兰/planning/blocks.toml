# 塔迪萨兰 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg520"
name_zh = "塔迪萨兰"
size_m = [360, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "区图上只有一枚废墟图标贴在西北山块东南坡脚（精度约 ±60 m）；废墟本体按「一串低矮断墙与倒柱」取沿山脚约 150 m 长，外加背后山坡与东侧荒原、土路，360 × 280 m，无一手尺寸出处"
# 世界树画面：北部荒原上一串低矮的暗夜精灵断墙与倒柱，没有任何人烟，只有野兽在废墟间穿行
# 区图：图标在西北山块东南坡脚；北口下山的南北主道在其东侧（本图东缘），雷斧堡垒在正南约 400 m（出本图）
absent = [
    "任何人物、动物（野兽属 shot 层）",
    "围墙、城门、完整的屋顶或成片街巷（只是一串残迹，比东北那片古城废墟小得多）",
    "火、烛火、灯笼或任何人工光源",
    "河流、水塘、泉水",
    "绿草、活树、返绿（只有枯白树与灰绿干地衣）",
    "帐篷、木屋、营地（废墟里没有人住）",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "西北山块东南坡（顶住废墟西、北两面）"
