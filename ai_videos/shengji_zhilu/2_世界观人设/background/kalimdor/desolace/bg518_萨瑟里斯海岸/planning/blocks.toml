# 萨瑟里斯海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg518"
name_zh = "萨瑟里斯海岸"
size_m = [360, 800]
px_per_m = 2.0
grid_m = 50
scale_src = "推定"
scale_note = "世界树无坐标；整条西岸约两公里多，本图只取中段背靠西岸山块西麓、南北走向的约 800 m（区图 x≈26%、y≈38–48% 一带，推定）；沙滩与草带宽度按区图岸线与山影间距估，无一手尺寸出处"
# 世界树画面：凄凉之地的整条西海岸，与内陆的灰枯相反，这里阳光充足、有成片的绿草铺到沙滩
# 区图：西侧海面与岸线之间一线斜线纹即浅水；本段东侧紧贴西岸中段山块
absent = [
    "任何人物与动物（海巨人、纳迦、龙虾人属 shot 层）",
    "道路、房屋、栈桥、码头（沙滩本身是南北通道）",
    "撞碎的小船（在艾瑟雷索崖下，属 bg513 画框）",
    "树林、绿坡、棕榈与热带海滩（绿只是一条贴沙的短草带，越过就是死土）",
    "悬崖（本段海岸是缓坡入水）",
    "火、烛火、灯笼或任何人工光源",
    "雨、雪、浓烈的热带艳阳",
    "4.0.3a 后的任何改动",
]

[[ridge]]
name = "西岸山块西麓（草带背后的灰褐山坡）"
