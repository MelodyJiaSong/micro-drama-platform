# 长矛谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级图 bg502 的世界坐标 (997, 1352) m；区图坐标 [33, 57] 落在本图 (360, 210)。
# 区级 terrain.toml：北山块南缘在本图 y≈84–125、南山块北缘在 y≈310–330；地下洞口 b901 在本图 (201, 367)。

[meta]
bg = "bg522"
name_zh = "长矛谷"
size_m = [720, 420]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "按区级 terrain.toml（区图 1002×668 px，1 px ≈ 4.1 m）换算：谷长取东口到西端山嘴约 700 m、谷底宽约 200 m；区图精度约 ±60 m，帐篷组与长杆林的范围是推定"
# 世界树画面：西部一条被石壁夹住的谷地，谷中插满半人马的图腾长矛与骨幡，帐篷沿谷壁一排排搭着
absent = [
    "任何人物、部族成员、坐骑与动物（默认空营）",
    "火、烛火、灯笼、火把（火塘冷透，本档零人工光源）",
    "洞内晶光、发光晶石、洞口透出的光（晶洞内景属洞内 bg）",
    "河流、水塘、泉水、瀑布（谷里没有水；瀑布在洞内）",
    "绿草、活树、返绿（1.12 凄凉之地是灰黄死地）",
    "石墙建筑、木屋、城墙（这里只有兽皮大帐）",
    "东口以外的车路入口（西端山嘴合拢，两侧崖壁无路）",
    "开阔海面（西端山嘴挡住，只透出海雾）",
    "雨、雪、晴朗蓝天",
    "飞行坐骑 / 训练假人 / 4.0.3a 后的任何改动",
]

