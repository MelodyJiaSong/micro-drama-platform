# 萨格隆 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg517"
name_zh = "萨格隆"
size_m = [520, 520]
px_per_m = 3.0
grid_m = 50
scale_src = "推定"
scale_note = "按区图裁切量取：区图 1 px ≈ 4.1 m，北面地名图标到东面山脚图标约 250 m、西侧土路到东山脚约 280 m，取 520 × 520 m 装下整片废墟与山脚；废墟内部布局无一手尺寸出处，全部推定"
# 世界树画面：东北一片倒塌的暗夜精灵城市废墟，紫白断柱斜插在灰土里，仇恨之刃萨特在残垣间游荡
# 区图：坐标 [74, 28] 在本图约 (260, 300)；北面地名图标 ≈ (280, 60)、东面山脚图标 ≈ (300, 260)；西侧土路自西南来、往北去
absent = [
    "任何人物、动物与恶魔族群（萨特属 shot 层）",
    "城墙、完整的城门或完整的屋顶（只剩南缘两座无顶门墩与半边弧顶）",
    "高塔或仍完整的建筑",
    "河流、水塘、泉水（圆池是干的）",
    "绿草、活树与任何返绿（只有枯白树与灰绿干地衣）",
    "火、烛火、灯笼或任何人工光源（广场边灰坑冷透不冒烟）",
    "邪能绿雾或发光法阵（那是玛诺洛克集会所 bg515 的样子）",
    "帐篷、营地、木屋",
    "雨、雪、晴朗蓝天",
    "4.0.3a 后的任何改动",
]

