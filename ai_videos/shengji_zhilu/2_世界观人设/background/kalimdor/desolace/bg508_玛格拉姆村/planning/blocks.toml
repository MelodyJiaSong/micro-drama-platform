# 玛格拉姆村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg508"
name_zh = "玛格拉姆村"
size_m = [480, 400]
px_per_m = 3.0
scale_src = "推定"
scale_note = "取 480 × 400 m：装得下区图上那片环岛主塘（约 200 m 见方，区级 terrain 量取 ±60 m）、北侧浅湾与西南水汊的起头、以及东岸外的山脚；帐篷与桥的尺寸无一手出处，按「兽皮大帐 + 原木桥」推定"
# 世界树画面：东南几汪发黄的污水塘与塘中小岛，粗糙的木桥把岛连起来，半人马的兽皮帐搭在岛上与岸边
# 区图（区图约 [72, 73]）：一片浅蓝水面环着塘心小岛（岛上是村落图标），西南拖出一条弯汊，东面紧贴东墙山影
absent = [
    "任何人物、坐骑与动物（默认空村）",
    "燃着的火与炊烟（火坑是冷灰）",
    "流水、瀑布、涌泉与清澈的水（塘是发黄的死水）",
    "围墙、寨墙、栅栏与石砌房屋（只有兽皮大帐与木桩）",
    "草地、灌木与任何绿色植被（只有岸边几棵枯白树）",
    "东岸的帐篷与道路（东岸是山脚乱石）",
    "4.0.3a 后取代本村的新营地与铁刺工事",
    "文字、招牌与带纹章的旗帜",
]

