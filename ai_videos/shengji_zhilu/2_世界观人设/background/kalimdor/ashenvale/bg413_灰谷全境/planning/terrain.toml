# 灰谷全境 · 区级平面图的地形层（作者拥有；blocks.toml 由生成器合并本文件后重写）
# 从原版区图（ref/WorldMap-Ashenvale_c60.jpg，1002 × 668 px）量取：山脊 [[ridge]]（poly 多边形）/ 水系 [[water]]（path 折线）/ 道路 [[road]]（path 折线），单位 m。
# 换算见 blocks.toml 头两行：x% → x × 52.730 m，y% → y × 35.147 m（1 px ≈ 5.26 m 两轴同值），原点区图左上角，x 向东 y 向南。
# 量法：区图放大 3 倍加 2% 网格逐点读百分比，再乘换算系数；每条的 note 记原图百分比。
# 要覆盖某个自动块，写 [[block]] 且带同一个 bg 键；要加没坐标的块，写 [[block]] 带 bg 键、id 用 b9NN。
# ridge 的 height_m 是相对林地地面的相对高度（推定）；湖与海用宽 width_m 的折线填成面。

