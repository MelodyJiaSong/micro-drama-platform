# 绿爪村 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg416"
name_zh = "绿爪村"
size_m = [200, 180]
px_per_m = 5.0
scale_src = "推定"
scale_note = "区图无图标、wiki 无坐标；只知「灰谷中部、林中树居以南」。区级图推定点位北距主干道约 200 m，故出村小径朝北。碗径 120 m、六座草棚按「圆顶草棚围中央火堆」推定"
# 世界树画面：林中熊怪的木棚村落，圆顶草棚围着中央火堆，木架上晾着兽皮
absent = [
    "兽人式兽皮帐篷、削尖拒马与挂兽头木桩（那是同区兽人营的形制）",
    "寨墙、瞭望塔与任何石砌建筑",
    "点着的火堆、火把与任何人工光源（火堆默认冷灰余烬）",
    "发光的腐化雾气、绿光与任何特效（腐化只写成枯黄植被与碎骨）",
    "河流与湖面（碗底只有泥窝积水）",
    "旅店、飞行点",
    "任何人物、熊怪与动物",
    "文字",
    "4.0.3a 后的任何改建",
]

