# 冥火岭 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：block / ridge / water / road 各表；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量法：ref/bg435_冥火岭_map_crop.png（区图约 3.85× 放大，1 裁切像素 ≈ 1.366 m）逐点量取。
# 坐标点 [80, 68]（裁切图红十字 ＝ 主路跨东支处）落在本场地 (150, 205)；场地原点 ＝ 裁切图 (252, 90)。
# 丘本身区图上没有画短线坡：按区级 terrain.toml「冥火岭」山丘 [81–92, 64–73] 推定在小潭以东，丘顶约 (630, 160)。
# 裁切图只覆盖到本场地 x ≈ 640 m，其东全部推定。

[meta]
bg = "bg435"
name_zh = "冥火岭"
size_m = [700, 450]
px_per_m = 2.0
grid_m = 50
scale_src = "地图量取"
scale_note = "东支、东汊、两汪潭、主路与峡谷小径、潭北林梁、东南山脊北麓按裁切图量取；丘的范围与高度、焦林分界、鬼火、焦坑、倒木位置推定"
# 世界树画面：东部的低矮山丘，地面燃着零星绿色鬼火，树木枯死成黑炭状
absent = [
    "暖色明火、火把、篝火、灯笼与任何人工光源（唯一的非天光光源是贴地冷绿鬼火）",
    "冒烟、带火星或发红的枯树（火已过去多年，全部冷透）",
    "熔岩、岩浆裂缝与火山",
    "传送门、符文法阵、祭坛与任何建筑",
    "4.0.3 之后才有的营地与哨站",
    "木寨、伐木营与伐木机（都在画外，另档）",
    "任何人物、恶魔与动物",
    "雪、冰面、沙漠与开阔草原",
]

