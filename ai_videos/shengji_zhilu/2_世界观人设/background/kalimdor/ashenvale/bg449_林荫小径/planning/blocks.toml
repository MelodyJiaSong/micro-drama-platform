# 林荫小径 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 场地原点 ＝ 区图 [58.98, 59.46]（区级 (3110, 2090) m）；凹底中心按区图短线朝内的弧形坡量在 [62.3, 62.5] ＝ 本场地 (175, 107)。
# 路与河按区图直接量取（区级 terrain.toml 这一段的主干道偏北，未沿用）。

[meta]
bg = "bg449"
name_zh = "林荫小径"
size_m = [360, 360]
px_per_m = 4.0
scale_src = "地图量取"
scale_note = "弧形坡的两端与外缘、路口、东南河段按区图（1 px ≈ 5.26 m）量取；凹底直径约 130 m、坡高四五米无一手出处，推定"
# 世界树画面：一处被高树完全遮蔽的小凹地，光线极暗，地上长满伞状蘑菇
absent = [
    "任何人物、动物、营地、帐篷与人造建筑（本档无任何人造物）",
    "墙基、石块、石阶与上古遗迹",
    "凹底的水面、溪流与水潭（凹底只有湿泥，浅沟是干的）",
    "直射阳光、光柱与光斑（林冠完全合拢）",
    "发光的蘑菇、苔与任何自发光植物",
    "火光、火堆、火把与任何人工光源",
    "开阔的天空与天际线",
    "雪、沙漠与草原",
]

