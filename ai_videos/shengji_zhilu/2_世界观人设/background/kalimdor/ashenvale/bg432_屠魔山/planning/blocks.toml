# 屠魔山 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (3960, 2506) m；与 bg431 同一套区级坐标：bg431 的西壁与死水小潭（区级约 (4322, 2792)）落在本场地东缘 (362, 286) 一带。

[meta]
bg = "bg432"
name_zh = "屠魔山"
size_m = [460, 400]
px_per_m = 3.4
scale_src = "推定"
scale_note = "位置取区级平面图 b923（按「屠魔峡谷西侧、上方的山脊」推定）；脊长约 400 m、脊顶宽 20–30 m、高出西坡林地一百余米无一手出处，按区图峡谷西侧的山纹推定。东缘接 bg431 谷底，两图共用区级坐标"
# 世界树画面：俯瞰峡谷的高脊，岩面赤褐，山脊上残留着被烧焦的树桩
absent = [
    "道路、建筑、营帐与任何人造物（脊上只有一条兽径）",
    "活的成片树林（脊顶全是焦桩，林子只在西坡脚）",
    "冒烟、发红或正在燃烧的树桩（烧痕早已冷透）",
    "鬼火、绿色火焰、熔岩与任何发光物",
    "纪念碑与谷底细节（属 bg431，从脊上看只是一道暗缝）",
    "河流与湖面（只有崖脚一汪死水）",
    "任何人物、动物与恶魔",
    "雪与冰",
]

