# 狼嚎谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (2440, 1000) m；坐标表点位 [52, 37] ＝ 区级 (2742, 1300) 落在本场地 (302, 300) 附近，洞口按区图图标贴在石山东南脚下。

[meta]
bg = "bg446"
name_zh = "狼嚎谷"
size_m = [640, 560]
px_per_m = 2.5
grid_m = 50
scale_src = "地图量取"
scale_note = "石山群轮廓、东侧土路按区级 terrain.toml（狼嚎谷山群 / 东北出路）平移换算；谷长约 300 m、谷宽与洞口尺寸无一手出处，推定"
# 世界树画面：谷地深处的洞窟，洞口垂着枯藤，洞内散落碎骨，夜里传出狼嚎回声
absent = [
    "狼与任何动物（狼嚎是声音层，默认画面无动物）",
    "任何人物、营地、帐篷与人造建筑",
    "谷底流水、溪流与水潭（谷底只有一道无水干沟）",
    "火光、火把、火堆与洞内发光物",
    "上古白石遗迹、石阶与雕像（本谷没有遗迹）",
    "谷内道路（土路在谷口以东两三百米外，不进谷）",
    "雪、沙漠与开阔草原",
]

