# 夜道谷 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 坐标原点在场地左上角，x 向东、y 向南，单位 m。场地左上角 ＝ 区级平面图 (3350, 1640)，即区图约 [63.5, 46.7]。
# 区图量取：西臂 [64.8,46]→[65.5,49.8]→[65,55.7]→[66.3,58] ＝ 本图 (64,-23)→(104,109)→(77,318)→(143,399)；
# 谷尖 [66.8,58.4] ＝ (170,411)；东臂 [68,57.2]→[69.8,54.6] ＝ (236,370)→(328,279)，约 y≈245 出东界。
# 坡脊外缘（齿朝外）按区图；两坡内缘、谷底宽窄、谷头豁口都是推定。区图谷中未注名小图标约 (188,283)，性质未核，不画。

