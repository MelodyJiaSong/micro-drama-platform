absent = [
    "河流与湖（弗伦河在东坡之外，谷内看不到）",
    "参天巨树与绕干木平台（在西坡之外，谷内看不到）",
    "伐木秃地、树桩群、原木堆（伐木营在更东的河东岸）",
    "兽人木栅、帐篷、瞭望塔",
    "任何建筑、桥、石构",
    "绿色鬼火与枯死成黑炭的树（那是东南的冥火岭）",
    "火堆、灰烬与任何人工光源",
    "直射阳光与硬影（默认阴天）",
]

