# 怒水河 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级平面图 (4610, 1950) m；区级块 b925（伐木营正东的河段）中心落在本场地 (250, 250)。
# 河道、东岸崖台、冥火岭矮丘、主干道与河畔支路的走向按区级 blocks.toml 的同名条目平移换算；桥与崖高是推定。
# 锚点机位：东岸崖顶 (335, 235)，高出水面约 30 m，朝北偏西（约 -12°）；西岸木石小堡在 -47°，不入画。

[meta]
bg = "bg444"
name_zh = "怒水河"
size_m = [500, 500]
px_per_m = 3.0
scale_src = "推定"
scale_note = "河宽 80 m 与走向取区级平面图（地图量取）；两岸崖高、桥长 110 m、桥墩数与桥位（主干道伸到河边处）均无一手出处，按世界树「两岸陡峭红土崖、河上一座长木桥」推定"
# 世界树画面：宽阔湍急的大河，水色浑黄，两岸是陡峭的红土崖壁，河上架着一座长木桥
absent = [
    "石桥、铁索吊桥与第二座桥（本段只有一座粗原木长桥）",
    "码头、渡船、船只与水车",
    "瀑布与大坝（本段是连续急流）",
    "林下密林贴岸（西岸坎顶是伐过的台地，东岸崖顶只有灌丛）",
    "伐木机械、锯木台、炉子与浓烟（属西边的伐木营地）",
    "绿色鬼火与枯成黑炭的树（属西南的矮丘）",
    "火光、火把、营火、灯笼",
    "旗帜、纹章与任何文字",
    "雪、冰面与沙漠",
    "任何人物与动物",
]

