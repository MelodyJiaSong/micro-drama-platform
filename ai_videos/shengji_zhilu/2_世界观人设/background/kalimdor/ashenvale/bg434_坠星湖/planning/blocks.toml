# 坠星湖 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：block / ridge / water / road 各表；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 量法：原版区图（1002 × 668 px，1 px ≈ 5.26 m）裁 (600,500)-(760,620) 放大 4×，1 放大像素 ≈ 1.316 m。
# 湖心 ＝ 区图约 (666, 547) px ＝ [66.4, 81.6]，落在本场地 (201, 200)；场地原点 ≈ 区级 (3303, 2677) m。

