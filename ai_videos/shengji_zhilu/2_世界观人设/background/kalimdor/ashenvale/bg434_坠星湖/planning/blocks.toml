bg = "bg434"
name_zh = "坠星湖"
size_m = [400, 400]
px_per_m = 3.0
scale_src = "地图量取"
scale_note = "水面大小、陡岸圈、湖心黑石、湖东的南出路及其东南岔口、西南山麓按区图 4× 放大量取；岩壁高度、塌口位置、巨石尺寸推定"
# 世界树画面：圆形陨坑积成的湖，湖岸陡直，水色幽深发蓝，湖心露出一块黑色巨石
absent = [
    "任何建筑、栈桥、码头、石阶、围栏与船只",
    "贴着湖岸的道路（南出路在湖东约 30 m 外，隔着一溜林子）",
    "4.0.3 之后才有的湖边营地与哨站",
    "发光的湖水、发光或冒烟的巨石、火光与任何人工光源",
    "缓坡沙滩与芦苇浅滩（湖岸是一整圈陡岩壁，只有东缘一处碎石坡）",
    "瀑布与入湖溪流",
    "任何人物与动物",
    "雪、冰面、沙漠与开阔草原",
]

