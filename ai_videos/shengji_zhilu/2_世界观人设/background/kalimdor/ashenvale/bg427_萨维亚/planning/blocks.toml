# 萨维亚 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地原点 ＝ 区级坐标 (3999.3, 1441.1)；区级 b909 [78.5, 44.7]（本身即推定落位）→ 本图 (140, 130)。
# 北侧山脚与南侧矮坡按区图影线量取（区级 terrain 的北墙 poly 是粗描、偏北约 200 m）；河源水面由 bg413 terrain 平移；废墟内落位全部推定。

[meta]
bg = "bg427"
name_zh = "萨维亚"
size_m = [280, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「古神殿废墟、残柱间吊兽皮帐幕、满地骨杖」；台基取约 60 × 40 m，场地 280 × 240 m 把北墙山脚、西缘河源水面与南侧矮坡一并框进来。废墟尺度无一手出处"
# 世界树画面：建在古神殿废墟上的萨特营地，残柱之间吊着兽皮帐幕，地面插满带刺骨杖
absent = [
    "任何人物与动物（萨特属 shot 层，不进底图）",
    "任何火光：火堆、火把、灯笼；鬼火、法阵光与魔法光",
    "道路（区图这里没有路，只有林间小径）",
    "新建房屋、木寨与寨墙",
    "暗紫布幡与地面血色符号（那是南边的萨提纳尔 bg420）",
    "4.0.3 之后在东北古遗址加的联盟哨站与飞行点",
    "完整的神殿屋顶与完好立柱",
    "文字与可辨认的纹章",
]

