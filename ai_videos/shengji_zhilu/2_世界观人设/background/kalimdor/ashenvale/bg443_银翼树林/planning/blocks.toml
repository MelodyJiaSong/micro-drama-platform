px_per_m = 6.0
scale_src = "推定"
scale_note = "位置取区级平面图 b920（推定）；场地 260 × 220 m、帐篷 / 光门 / 地坪尺寸均无一手出处，按世界树「林间紫顶帐篷 + 一道战场传送门」与营地常识推定"
# 世界树画面：南缘的哨兵林地，林间立着紫顶帐篷与一道发光的战场传送门
absent = [
    "围墙、栅栏、寨门与箭塔（箭塔属东北方另一处哨站）",
    "点燃的火堆、火把、烛火与灯笼（火塘是冷灰旧痕）",
    "水面、溪流与湖岸（坠星湖在走廊以东，不入本场地）",
    "红光传送门、兽人式尖木栅栏与红黑战旗（对方阵营入口在南邻区）",
    "石砌房屋与塔楼（本处只有帐篷）",
    "训练假人与靶场",
    "飞行坐骑、落地台与栖架",
    "任何人物与动物",
]

