# 碎木岗哨 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [74, 61.5]（区级 b907，地图量取）；南面主干道、北去萨特营的支路按 bg413 terrain 平移换算；弗伦河在场地西外约 200 m、东支在东外约 300 m，都不入本图。寨内落位全部推定。

[meta]
bg = "bg423"
name_zh = "碎木岗哨"
size_m = [360, 320]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「木栅要塞、瞭望塔、中央大帐、新伐木料」；方寨取约 100 × 95 m，场地放大到 360 × 320 m 把寨外秃地、南面主干道与北去支路框进来。寨内尺度无一手出处"
# 世界树画面：东部林中的兽人木栅要塞，削尖原木围墙、瞭望塔与中央大帐，地上堆着新伐的木料
absent = [
    "任何人物与双足飞龙（栖架上是空的；骑手、管理员属 shot 层）",
    "任何火光：火塘只剩冷灰、铁匠炉冷着，没有火把、火盆、灯笼，没有炉烟",
    "伐木机、机械锯与冒烟的炉口（那是东面伐木营地的景观，不在这里）",
    "石砌城墙、石塔与砖房（这里只有原木与兽皮）",
    "河流与湖面（两条河都在场地之外的林子里）",
    "东西两面的寨门（只有南正门与北小门）",
    "文字招牌与纹章旗帜",
    "4.0.3 之后的新建筑、扩建工事与战争机械",
]

