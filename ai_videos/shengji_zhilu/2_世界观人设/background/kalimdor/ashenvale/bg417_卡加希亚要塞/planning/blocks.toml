# 卡加希亚要塞 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

[meta]
bg = "bg417"
name_zh = "卡加希亚要塞"
size_m = [260, 200]
px_per_m = 5.0
scale_src = "地图量取"
scale_note = "本图原点 ＝ 区级平面图 (4702, 1945) m；堡位（区图约 [90.7, 58.2]）、怒水河中线与两条路按区级 terrain.toml 平移换算。堡内布局无一手出处，按「尖木高墙 + 瞭望塔 + 指挥所」推定"
# 世界树画面：东部河畔的兽人木石堡垒，尖木高墙与瞭望塔，墙头插着战歌氏族旗
absent = [
    "密林（堡子四周是伐尽的树桩秃地，林线在西北远处）",
    "精灵式木构、紫顶与石板路",
    "跨界河的桥（本档不画；河东是邻区崖台）",
    "点着的火盆、火把、火塘与任何人工光源（白天默认，火塘冷灰）",
    "伐木机、锯木台与炉口浓烟（属伐木营 bg426）",
    "旗面上的文字与可辨的氏族纹章",
    "任何人物、狼、坐骑与双足飞龙",
    "4.0.3a 后的任何改建",
]

