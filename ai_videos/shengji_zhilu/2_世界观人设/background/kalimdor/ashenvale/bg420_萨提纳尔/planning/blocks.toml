# 萨提纳尔 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [80.5, 49]（区级 b908，地图量取）；南侧林间路 = bg413 terrain「木寨—萨特营—东北古遗址路」、路南林丘 = 「东部丘陵」、西南角河 = 「弗伦河东支」，均平移换算；废墟内落位全部推定。

[meta]
bg = "bg420"
name_zh = "萨提纳尔"
size_m = [320, 280]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「废墟改成的聚落、断墙兽骨暗紫幡、地面血色符号」；半圆残墙取约 90 × 70 m，场地放大到 320 × 280 m 把南侧林间路、路南林丘与西南角河面框进来。废墟内尺度无一手出处"
# 世界树画面：废墟改成的萨特聚落，断墙上钉着兽骨与暗紫布幡，地面画着血色符号
absent = [
    "任何人物与动物（占据者属 shot 层；窝棚与广场都是空的）",
    "任何火光：火盆冷着，没有火把、篝火、烛火、灯笼",
    "发光的符号、法阵光雾与绿色鬼火（鬼火属东南的枯木丘）",
    "完好的精灵建筑、紫顶帐篷与哨兵营地（这里只剩被占据的废墟）",
    "木栅、兽人式大帐与原木塔（那是西南的木寨）",
    "湖面与瀑布（最近的水是西南角的河支流）",
    "文字招牌与纹章旗帜",
    "4.0.3 之后的新营地与新建筑",
]

