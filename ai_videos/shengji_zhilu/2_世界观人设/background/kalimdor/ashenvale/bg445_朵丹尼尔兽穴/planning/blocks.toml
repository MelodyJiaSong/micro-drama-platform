# 朵丹尼尔兽穴 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 (120, 120) ＝ 区级平面图 b928（推定点位，未核）。场内布局全部按世界树画面推定。
# 锚点机位：小空地上的倒落方石 (152, 142)，顺石阶轴线朝西北；林冠缺口在石阶正上方。

[meta]
bg = "bg445"
name_zh = "朵丹尼尔兽穴"
size_m = [240, 240]
px_per_m = 6.0
scale_src = "推定"
scale_note = "位置取区级平面图 b928（按「绿爪村东南、弗伦河西岸」推定，未核）；土丘 70 × 55 m、石阶 16 m、落差 5 m 均无一手出处，按世界树「树根缠绕的地下墓穴入口、向下的石阶两侧刻着精灵浮雕」推定"
# 世界树画面：树根缠绕的地下墓穴入口，向下的石阶两侧刻着精灵浮雕，洞内漂着淡绿雾气
absent = [
    "第二个入口、窗洞与地面上的石屋（丘外只有这一道门）",
    "水面、溪流与湖岸（河在场地东南三百多米外）",
    "开阔天空与天际线（四面密林，头顶只有一块林冠缺口）",
    "火把、火盆、烛火、灯笼与任何人工光源",
    "发光的雾、发光的毒液、鬼火与发光符文（淡绿雾不发光）",
    "骨堆、尸骸与血迹",
    "木栅、帐篷、草棚与营火（熊怪村与兽人营在西北、西南，另有其卡）",
    "任何人物与动物",
]

