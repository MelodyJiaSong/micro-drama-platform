# 银翼哨站 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [64.8, 75.3]（区级 b919，推定落位）；河与大路的走向从 bg413 terrain.toml 平移换算（地图量取），营内落位全部推定。

[meta]
bg = "bg422"
name_zh = "银翼哨站"
size_m = [360, 240]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「两顶帐篷与一座箭塔」；营地空地取约 60 × 50 m，场地放大到 360 × 240 m 把西侧河面与东侧大路一并框进来。营内尺度无一手出处"
# 世界树画面：林边的小型哨兵站，两顶帐篷与一座箭塔，塔上哨兵持弓远眺
absent = [
    "任何人物与坐骑（塔上的哨兵属 shot 层，不进底图）",
    "任何火光：篝火、火把、灯笼、烛火",
    "围墙、壕沟与石砌建筑（营地只靠林缘作屏障）",
    "飞行点与栖架（旧世灰谷唯一的联盟飞行点在湖心小镇）",
    "4.0.3 之后扩建的大型哨站与新建筑",
    "训练假人与箭靶",
    "文字招牌与纹章旗帜",
]

