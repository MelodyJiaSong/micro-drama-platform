# 银风避难所 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [50.2, 66.2]（区级 b914，地图量取）；南面湖 = bg413 terrain「密斯特拉湖」北岸、西头窄土路 = 「湖畔废墟支路」（区级本身即推定），均平移换算；石屋落位全部推定。

[meta]
bg = "bg421"
name_zh = "银风避难所"
size_m = [300, 260]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「湖畔一组半塌的精灵石屋、院内倾斜的月形石碑」；石屋群取约 110 m 一道弯弧，场地放大到 300 × 260 m 把南面湖面、西头土路与东南岬角框进来。尺度无一手出处"
# 世界树画面：湖畔一组半塌的精灵石屋，屋顶塌出洞口，院内立着倾斜的月形石碑
absent = [
    "木栅、兽皮帐篷、原木塔、红黑旗帜与任何部落前哨设施（4.0.3 之后才改写成前哨；旧世是无人废墟）",
    "任何人物与动物",
    "任何火光：篝火、火把、灯笼、烛火，屋内没有灯",
    "发光的井水与月亮井（本区两口井在别处）",
    "完好的屋顶与新修的建筑",
    "码头、船只与桥（石廊早已沉进湖底，只剩两根桩）",
    "文字招牌与纹章旗帜",
]

