# 佐拉姆海岸 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。

# 场地原点 ＝ 区图 [7, 7.5]（区级 (369.1, 263.6) m）；海岸线、两道湾、遗址图标 [15.9, 19.4] 按区图逐点量取，营寨坐标 [12, 35] 取自 bg428。

[meta]
bg = "bg452"
name_zh = "佐拉姆海岸"
size_m = [600, 1000]
px_per_m = 1.5
grid_m = 100
scale_src = "地图量取"
scale_note = "海岸线、两道浅水湾、东侧山体与湾东岸遗址按区图（1 px ≈ 5.26 m）量取；石柱个数与位置、湾内深水区、石台尺寸无一手出处，推定"
# 世界树画面：西北角的白沙海滩，浅水里立着半沉的上古石柱，纳迦从浪里爬上岸
absent = [
    "任何人物、动物与水族生灵（爬上岸的水族属 shot 层，默认画面空）",
    "海面上的船、停靠的大船与航线码头（旧世这里不是航线港口）",
    "灯塔、港口城镇与石砌码头",
    "发光的海水、幽蓝磷光与发光石柱（那是海底神殿内景）",
    "火光、火堆、火把与任何人工光源（营寨在机位身后，不入画）",
    "可骑乘的飞行坐骑",
    "第二处海岸线（全区只有这里临海）",
    "雪、冰面与热带椰林",
]

