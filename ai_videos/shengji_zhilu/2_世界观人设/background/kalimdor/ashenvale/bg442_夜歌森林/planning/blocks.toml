# 夜歌森林 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 代表林段：场地原点 ≈ 区级平面图 (3320, 1540)，即区级 b930 向西挪 ~130 m，把巨树环丘的东坡纳进西侧；
# 弗伦河按区级 terrain.toml 的折线换算后从东边 y≈370 进、南边 x≈420 出，只切东南角。

[meta]
bg = "bg442"
name_zh = "夜歌森林"
size_m = [480, 480]
px_per_m = 3.0
scale_src = "推定"
scale_note = "代表林段，边长 480 m 按「西侧环丘东坡 → 东南角河岸」量级推定；河与丘的走向从区级 terrain.toml 换算（区图 1 px ≈ 5.26 m），古树 / 倒木 / 兽径位置均为推定"
# 世界树画面：灰谷东半部的连片深林，树冠遮得几乎不见天，林下常年昏暗，苔藓覆盖一切
absent = [
    "天空与地平线（林冠在二三十米处几乎合拢，任何机位都看不见天）",
    "任何建筑、营寨、帐篷与石砌遗迹（萨特营、木寨、树居都是各自的 bg）",
    "道路、车辙、桥（只有一条兽径）",
    "树桩、斧痕、原木堆与伐木秃地（伐木营是另一个 bg）",
    "枯死成黑炭的树丘与绿色鬼火（冥火岭是另一个 bg）",
    "发光蘑菇、萤光、月井冷光与任何人工光源",
    "悬崖、岩壁与瀑布（西高东低全靠树根土棱缓降）",
    "雪、雨、夜景与秋季黄叶",
    "人物、动物与任何文字",
]

