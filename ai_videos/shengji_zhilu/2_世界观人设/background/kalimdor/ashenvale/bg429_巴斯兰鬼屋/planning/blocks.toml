    "完整的屋顶与完好的木屋",
    "石墙基埋在落叶里的石建筑遗址（那是南边三百米外的另一处）",
    "道路、营帐与近年人迹",
    "湖、河与溪流（只有石础间一汪积雨）",
    "开阔天际线（只有东面能看到山坡）",
]

