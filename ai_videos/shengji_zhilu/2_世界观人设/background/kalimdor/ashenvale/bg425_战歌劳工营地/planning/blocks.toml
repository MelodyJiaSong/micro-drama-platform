# 战歌劳工营地 · 场地平面图的几何唯一出处（rule 4k）。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
# 作者填：[[block]]（有 id / name / xy / size / h_m / src）、[[ridge]] / [[water]] / [[road]]；零个 block 合法（自然场景）。
# src 只许 原典方位 / 坐标表 / 地图量取 / 推定；推定的画虚线。坐标原点在场地左上角，x 向东、y 向南，单位 m。
# 场地中心 ≈ 区图 [71.8, 80.5]（区级 b921，本身即推定落位）；东南山脚与支路走向读自区图，营内落位全部推定。

[meta]
bg = "bg425"
name_zh = "战歌劳工营地"
size_m = [240, 200]
px_per_m = 4.0
scale_src = "推定"
scale_note = "世界画面只有「泥地工场、成堆原木与简易棚屋、深车辙」；工场取约 70 × 60 m，场地放大到 240 × 200 m 把东南山脚与西南来的支路一并框进来。营内尺度无一手出处"
# 世界树画面：林间空出的泥地工场，成堆原木与简易棚屋，地上是深深的车辙
absent = [
    "任何人物与牲口（苦力、运木的牲口属 shot 层）",
    "任何火光：燃着的火堆、火把、灯笼、炉火与炉烟",
    "寨墙、栅栏、瞭望塔与大帐（那是碎木岗哨与卡加希亚要塞）",
    "伐木机械、锯木台与熔炉（那是东北的大伐木营 bg426）",
    "湖面（坠星湖在西侧林子外约 280 m，营内看不见）",
    "飞行点与双足飞龙栖架",
    "旗帜纹章与文字招牌",
]

