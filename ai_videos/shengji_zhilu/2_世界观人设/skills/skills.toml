# 本剧技能库配置（tools/skills_lib.py；ai_video.md rule 45；follow-up 053）。
# 一个技能一处定义：每一镜只写「谁、何时、对谁、什么档、成没成」，施法的样子 / 手势 / 口令 / 音效 / 样片全从卡里来。
# 原典长什么样看 0_research/parts/w25_圣光视觉.md、w26_技能全表.md；本剧定稿写在各卡，偏离原典写 liberty。

# 职业位：键 k{位}{两位序号}（k201 ＝ 圣骑士第 01 号）
[class]
1 = "战士"
2 = "圣骑士"
3 = "牧师"
4 = "法师"
5 = "盗贼"
6 = "术士"
7 = "猎人"
9 = "怪物"

# 口令（用户 2026-09-30 定）：有读条的技能每次念同一句固定短句（不念技能名，守 G1「技能名不出口」）；
# 瞬发技能不念；战士的吼是一声固定吼声（归音效）。每个施法者一条定稿录音，后期原样用。
[call]
policy = "cast_only"

# 施法时长（用户 2026-10-01 follow-up 065「casting 的时间跟游戏一致，每个镜头都是同样的时间」）：每张卡 [timing] 写 [x, x, x] 锁死，
# 镜里不许写 dur；要拖时间就晚起光。还没锁的卡列在 unlocked（只减不增；ep02 重排时逐张锁）
[timing]
unlocked = ["k102", "k205", "k206", "k207", "k208", "k401"]

# 法系颜色语法：全季不变，同名法术谁放都一样（w26 共同结论 4）。卡里的锁定串只能用本系的颜色词。
# hue ＝ [色相 lo°, hi°, 饱和度下限, 亮度下限]（lo > hi 跨 0°）：出片回读量光、排程闸门判异色都读它；卡里写 hue 覆盖法系的。
# 数值按 colors 词估（judgment call，057），出片回读实测后校准。
[school."圣光"]
hue = [20, 38, 0.18, 0.6]          # 按 shot07 / shot08 旧版真片实测校准（55，2026-09-30）：光 22–35°、饱和度 0.17–0.25；暖灯光 26–31° 饱和度 0.14–0.15，靠饱和度下限分开
colors = ["暖金", "白芯金边", "白金", "淡金", "金色", "近乎纯白", "明黄"]
note = "光只在双手或落点；起手期间地面干净。圣光术自头顶罩下；牧师治疗从脚下往上冒；审判 / 惩击没有飞行物（w26 §C）"

[school."祝福"]
hue = [5, 55, 0.35, 0.5]
colors = ["黄转橙再转红", "白转橙", "银白偏淡蓝", "金光"]
note = "受祝者脚下旋起的光带按种类分色：力量 黄→橙→红；保护 白→橙＋银白偏淡蓝光壳（wow.skill.paladin.003）"

[school."火"]
hue = [8, 45, 0.45, 0.5]
colors = ["白热", "橙黄", "黄芯橙红", "火星"]
note = "白热芯 + 橙黄火舌；NPC 火球 3 s 读条、大号弹体（wow.skill.mage.008）"

[school."冰"]
hue = [190, 235, 0.25, 0.45]
colors = ["深蓝", "青白", "白蓝", "冷蓝"]
note = "深蓝旋涡 + 青白亮边"

[school."奥术"]
hue = [170, 205, 0.12, 0.65]
colors = ["淡青白"]
note = "法师奥术手光"

[school."暗影"]
hue = [265, 320, 0.3, 0.2]
colors = ["紫", "黑烟", "紫红"]
note = "术士影手、牧师暗言术：紫 + 黑烟"

[school."战技"]
hue = [340, 30, 0.4, 0.22]
colors = ["暗红", "白中泛蓝", "蓝白电火花", "红橙", "黄土"]
note = "战士按原典发光（用户 2026-09-30）：冲锋暗红拖光、雷霆一击蓝白电火花与冲击环、战斗怒吼红橙贴地月牙"
