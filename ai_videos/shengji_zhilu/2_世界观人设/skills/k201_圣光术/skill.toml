prompt = '''
k201_圣光术_样片
参考: `k201_起手.png(手势参考图·约第 1.2s)=>@`、`k201_聚光.png(手势参考图·约第 2.5s)=>@`、`k201_放光.png(手势参考图·约第 3.85s)=>@`

参考用法: 图1–3 是这一次施法的几个瞬间（约 1.2s 起手，约 2.5s 聚光，约 3.85s 放光），锁人物与场景的样子、机位、手和身体的位置姿态、光的形状颜色；视频在这几个时刻对上图里的样子，其余时间按 `动作:` 自然连贯地过渡。人要演成真人：呼吸带动肩膀，手由肩和胸口带起来，手指有细微的张合，整个身体是一个整体。

角色: 施法者＝二十岁左右的年轻男子，偏瘦、肩背结实，浅米色粗麻长袖布衣（袖口磨毛）、深褐色宽皮腰带、深色粗布裤、旧皮靴，短棕发微乱；全程只拍他的背和左后侧，脸始终不转向镜头。坐在地上的人＝三十岁上下的男人，灰褐色粗布衣，左肩洇着一块深色的湿痕（伤），背对镜头坐在石地上，两腿往前伸，右手撑着地，低着头；全程不露正脸。

人数: 画面里只有这两个人，任何时刻不多出第三个人。

情节: 绿幕棚里，年轻人站在受了伤、坐在地上的同伴身后；他两只手在腰侧拢起暖金色的光，左手随即抬到头侧，一高一低，低声吟唱；左手笔直举过头顶，一道分三层的光柱从上方落下罩住同伴，同伴抬起头；光柱一收就没了，什么光都不剩。

场景: 电影绿幕摄影棚：整面纯绿背景布从墙一直铺到地面，地上贴着几个白色十字定位胶带，四周是均匀柔和的白色棚拍灯光；画面里只有人和施法的光。

镜头: 中景，西南角 3/4 背后机位、齐胸偏高，0–7s 一条连续的缓慢推近（推近约半米），不切镜、不摇、不晃；景深浅，焦点始终落在施法者的手与坐着的人之间（情绪目的：屏住呼吸看光一点点聚起来，再被那一下照亮）。

镜内状态: 0–7s 两人始终原位：坐着的人在施法者身前半步、偏左；施法者手上只在 1.0–3.8s 有光，光柱只在 3.8–4.05s，一收就没了，4.05s 起谁身上都没有光。

走位: 两人都背对镜头朝北：坐在地上的人在画左，施法者站在他身后半步、偏右，在画右；全程两人不挪位置。画面里（按机位换算）：0–7s 施法者在画右、背影偏左后侧，坐着的人在画左、背影。

动作: 0–1s 施法者静静站着，低头看着身前的同伴，胸口随呼吸起伏；0.6–1s 他的膝盖微微一屈、重心沉到两脚，肩膀放松下来，两只手顺势垂到腰侧、掌心朝上慢慢张开；同伴低着头，肩膀微微起伏；1–3.5s 施法者两只手掌心各拢着一团暖金色的光，像捧着一盏灯：起手两手在腰侧，随即左手抬到头侧、右手留在腰侧，光跟着手走、只亮在手上，照亮手指与前臂；每团光有一粒刺眼的白色光核，外面裹着一层缓缓流动的暖金光晕，边缘柔和地散开，指缝和掌纹被从里往外透亮，手背一侧落在阴影里；1.5–1.9s 左手由肩膀带着抬到头侧、手肘向外张开，胸口跟着转向左手，眼睛追着那团光，右手仍托着光留在腰侧，两团光一高一低；他低头低声吟唱，肩膀随每个字轻轻起伏，光随呼吸一明一暗；3.35s 放光前他先往下一沉、吸一口气，左手的光收紧变亮；3.5s 施法者左手笔直举过头顶，掌中的光亮到最足，胸口随之打开、仰头看着那只手，掌心的光亮成一颗暖白的小太阳，右手仍托着光留在腰侧；3.8s 一道光柱从坐着那人的头顶笔直罩下、裹住全身：柱心近乎纯白，外一层明黄，最外一圈柔和的金色光晕，流着细细的竖直光纹；比坐着那人高出半个身子、约一个半肩宽，他的皮肤和衣料被照得发白；柱心过曝发白，明黄那层浓而透亮，最外的金色光晕边缘柔和，竖直光纹从上往下淌；光柱落地的一刹那，地面亮起一块椭圆，越往外越暗，绿幕上浮起暖色反光，施法者的背和头发被逆光勾出一道金边；同伴猛地抬起头，肩膀一松；4.05s 光柱一收就没了，同伴身上和周围干干净净，什么光都不剩；他左肩那块深色的湿痕淡了下去；4.6–5.4s 施法者的左手由肘先弯、从身前慢慢放下来，长出一口气，肩膀沉下去，头微微低下；5.4–7s 光都散了、只剩棚拍光，施法者站直，同伴的头慢慢垂回去。

技能: 暖金色的光和光柱只属于施法者这一次施法：手上的光只在 1–3.8s，光柱只在 3.8–4.05s、只落在坐着的人身上，一收就没了；其余时间两人身上都不发光。

光线: 主光是均匀柔和的白色棚拍顶光加侧前补光，人物带淡淡的影子，绿幕平整；1s 起手上的两团暖金光成为第二光源，一高一低，离光核越近越亮、越远越暗，照亮手、前臂、耳侧与同伴的后背；3.8s 光柱成为全场最亮的光源，从上往下打亮两人、绿幕和地面，被照到的地方有暖色反光和柔和的投影；光柱一收，立刻回到原来的棚拍光。每一处被照亮的地方都对得上这几个光源，亮度随距离自然衰减。

节奏: 静、重心沉下去（1s）→ 两手在腰侧起光（0.5s）→ 左手由肩带起到头侧、聚光（2s）→ 一沉一举（0.3s）→ 光柱一亮（0.25s）→ 光柱一收、什么都不剩（1.15s）→ 收手吐气（1.8s）

声音: 没有人说话；施法者的吟唱只是低低的气声，听不清字；聚光时一层很轻的嗡鸣渐强，光柱落下时一声明亮清脆的「叮」，之后只剩棚里的安静；不要任何音乐。

渲染样式: 影视级实拍质感，35mm 胶片颗粒，浅景深，真实皮肤与布料纹理，物理正确的材质反射，暗部保留细节，画面不烧字幕、不出现任何文字。

比例: 16:9

时长: 7s

负面词: 画面文字，字幕，水印，logo，人脸变形，五官漂移，多余手指，畸形肢体，塑料感材质，卡通渲染，三维动画感，游戏截图质感，平面贴图光效，光效硬边，卡通描边，机器人般僵硬的动作，任何音乐
'''

