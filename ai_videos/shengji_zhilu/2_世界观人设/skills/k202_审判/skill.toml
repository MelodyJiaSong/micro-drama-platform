# 样片的完整视频 prompt（设计稿规格、≤ 5000 字；follow-up 068 起参考手势参考图、不再用白模；用户手抄上传即梦）；资料包在 样片/
prompt = '''
k202_审判_样片
参考: `k202_一指.png(手势参考图·约第 1.6s)=>@`、`k202_炸开.png(手势参考图·约第 2.4s)=>@`

参考用法: 图1–2 是这一次施法的几个瞬间（约 1.6s 一指，约 2.4s 炸开），锁人物与场景的样子、机位、手和身体的位置姿态、光的形状颜色；视频在这几个时刻对上图里的样子，其余时间按 `动作:` 自然连贯地过渡。人要演成真人：呼吸带动肩膀，手由肩和胸口带起来，手指有细微的张合，整个身体是一个整体。

角色: 施法者＝二十岁左右的年轻男子，偏瘦、肩背结实，浅米色粗麻长袖布衣（袖口磨毛）、深褐色宽皮腰带、深色粗布裤、旧皮靴，短棕发微乱，右手提着一把木柄旧铁锤垂在身侧；全程只拍他的背和左后侧，脸始终不转向镜头。戴兜帽的人＝身形粗壮的男人，灰褐色粗布衣外罩一件旧斗篷，兜帽压得很低，脸在兜帽阴影里看不清，空着两手、步子带着敌意。

人数: 画面里只有这两个人，任何时刻不多出第三个人。

情节: 绿幕棚里，戴兜帽的人朝年轻人逼近两步；年轻人双手金光一闪，左手朝他往前一指，那人胸口原地炸开一团黄白的光、身子一顿，退了半步，低下头。

场景: 电影绿幕摄影棚：整面纯绿背景布从墙一直铺到地面，地上贴着几个白色十字定位胶带，四周是均匀柔和的白色棚拍灯光；画面里只有人和施法的光。

镜头: 中景，施法者左后方 3/4 背后机位、齐胸高，0–5s 一条连续的缓慢推近（推近约 0.4 米），不切镜、不摇、不晃；焦点在戴兜帽那人身上，施法者的背与指出去的左臂略虚（情绪目的：那一指之后，看清光落在哪里）。

镜内状态: 0–5s 施法者原地不动（1.5s 左脚上前半步）；戴兜帽的人 0–1.2s 走近、之后站在施法者前方四五步；光只在 1.2–2.2s 施法者手上一闪、2.2–2.6s 在那人胸口炸开，2.6s 起谁身上都没有光。

走位: 施法者在画右，背对镜头、朝向画面纵深偏左；戴兜帽的人在画左，从画面纵深朝镜头方向走来，1.2s 站住，2.6s 退半步。画面里（按机位换算）：0–5s 施法者在画右、背影偏左后侧，戴兜帽的人在画左、正面朝镜头但脸藏在兜帽阴影里。

动作: 0–1.2s 戴兜帽的人朝施法者走近两步，站住，两手空空垂在身侧；施法者站着不动，右手提锤垂在身侧，盯着他；1.2–2.2s 施法者双手金光一闪，左脚上前半步，左手朝那人往前一指；两只手上一闪而过一层明亮的金光，左手指尖最亮，像握住了一小团阳光；2.2–2.6s 那人胸口炸开一团耀眼的黄白的光，溅出几点火星，那人身子一顿；光团比他的胸膛还大，中心几乎纯白、外缘泛黄，就在他胸口原地炸开，把他的前襟和兜帽边缘照亮，几点火星向外溅开、落到地上就灭；2.6–5s 光散了，那人往后退半步、低下头，一只手按住胸口；施法者收回左手，右手的锤一直垂在身侧。

技能: 黄白的光只属于施法者这一次施法：手上的金光只在 1.2–2.2s，炸开的光只在 2.2–2.6s、就在戴兜帽那人的胸口原地炸开；其余时间两人身上都不发光。

光线: 主光是均匀柔和的白色棚拍顶光加侧前补光，人物带淡淡的影子，绿幕平整；1.2–2.2s 施法者手上那一闪短促地照亮他的手和袖口；2.2–2.6s 胸口炸开的那团光是全场最亮的光源，从那人身上往四周打亮地面和施法者的正面，一闪即灭；之后回到原来的棚拍光。

节奏: 逼近（1.2s）→ 一指（1.0s）→ 炸开（0.4s）→ 一顿、退半步（2.4s）

声音: 没有人说话；脚步声，出手时一声短促的嗡鸣，炸开那一下一声沉闷的「轰」，之后只剩棚里的安静；不要任何音乐。

渲染样式: 影视级实拍质感，35mm 胶片颗粒，浅景深，真实皮肤与布料纹理，物理正确的材质反射，绿幕棚拍光，画面不烧字幕、不出现任何文字。

比例: 16:9

时长: 5s

负面词: 画面文字，字幕，水印，logo，人脸变形，五官漂移，多余手指，畸形肢体，塑料感材质，卡通渲染，三维动画感，游戏截图质感，任何音乐
'''

