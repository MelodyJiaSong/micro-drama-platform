prompt = '''
k204_力量祝福_样片
参考: `k204_按手.png(手势参考图·约第 1.4s)=>@`、`k204_光带.png(手势参考图·约第 2.6s)=>@`

参考用法: 图1–2 是这一次施法的几个瞬间（约 1.4s 按手，约 2.6s 光带），锁人物与场景的样子、机位、手和身体的位置姿态、光的形状颜色；视频在这几个时刻对上图里的样子，其余时间按 `动作:` 自然连贯地过渡。人要演成真人：呼吸带动肩膀，手由肩和胸口带起来，手指有细微的张合，整个身体是一个整体。

角色: 握剑的人＝二十出头的壮实青年，宽肩，旧锁甲短背心套在灰白粗布衣外，深色布裤、旧皮靴，硬茬短发；右手握着一柄朴素的铁短剑，剑尖朝前下，左脚在前站着应战的架势；全程背对镜头，不露正脸。施法者＝二十岁左右的年轻男子，偏瘦，浅米色粗麻长袖布衣（袖口磨毛）、深褐色宽皮腰带、深色粗布裤、旧皮靴，短棕发微乱；站在握剑的人右后方半步，全程只拍背和右后侧，不露正脸。

人数: 画面里只有这两个人，任何时刻不多出第三个人。

情节: 绿幕棚里，握剑的人摆好架势盯着前方；施法者站在他右后方，双手金光一闪，左手按在他握剑的右前臂上；他脚下旋起一股黄转橙再转红的光带，绕着身子往上卷，一两秒就散了，他胳膊一紧，握剑的手更稳了。

场景: 电影绿幕摄影棚：整面纯绿背景布从墙一直铺到地面，地上贴着几个白色十字定位胶带，四周是均匀柔和的白色棚拍灯光；画面里只有人和施法的光。

镜头: 中景，两人身后偏西、齐腰偏高的机位，0–5s 一条连续的缓慢推近（推近约 0.4 米），不切镜、不摇、不晃；焦点在握剑的人身上（情绪目的：看着力量从脚下灌进他身体里）。

镜内状态: 0–5s 两人始终原位：握剑的人在画左偏中、背对镜头，施法者在画右、他右后方半步；施法者的左手只在 1.2–3.5s 按在他的右前臂上；光只在 1.0–1.8s 施法者手上一闪、1.8–3.7s 在握剑的人身周卷起，3.7s 起谁身上都没有光。

走位: 握剑的人背对镜头朝北，在画左偏中；施法者在他右后方半步、朝西北，在画右；全程两人不挪位置。画面里（按机位换算）：0–5s 握剑的人在画左偏中、背影，施法者在画右、背影偏右后侧。

动作: 0–1.0s 握剑的人左脚在前站稳，右手握剑垂在身前，肩膀微微起伏，盯着前方；施法者站在他右后方，看着他的背；1.0–1.8s 施法者双手金光一闪，左手按在握剑的人胳膊上——一层明亮的金光从他两只手上一闪而过，他上前一点，左手稳稳按在握剑那只右前臂上；1.8–3.7s 握剑的人脚下旋起一股黄转橙再转红的光带，绕着身子往上卷，一两秒就散了，握剑的人胳膊一紧、握兵器的手更稳；光带是一条半透明、亮边的宽光带，从他脚边的地面升起，绕着他的腿、腰、胸一圈一圈往上卷，颜色从下面的明黄过渡到中段的橙、再到上面的红，卷过肩头后化成细碎的红色光点散在空气里；光带经过的地方把他的锁甲映出一道道暖色反光；他右手的指节一紧，剑尖微微抬起，低头看了一眼自己的手；3.5–5s 施法者收回左手，退回原位；握剑的人重新抬头盯着前方，架势比刚才更稳。

技能: 黄转橙再转红的光带只属于施法者这一次施法、只绕在握剑的人身上：施法者手上的金光只在 1.0–1.8s，光带只在 1.8–3.7s；其余时间两人身上都不发光。

光线: 主光是均匀柔和的白色棚拍顶光加侧前补光，人物带淡淡的影子，绿幕平整；1.0–1.8s 施法者手上那一闪短促地照亮他的手和对方的袖子；1.8–3.7s 卷起的光带是第二光源，从下往上依次把握剑的人的腿、腰、锁甲和肩膀映成黄、橙、红，地上他的影子边缘也跟着泛起暖色；光带散尽后回到原来的棚拍光。

节奏: 架势（1s）→ 一按（0.8s）→ 光带卷上来（1.9s）→ 稳住（1.3s）

声音: 没有人说话；按上去时一声轻轻的嗡鸣，光带卷起时一阵由低到高、越来越紧的呼啸，散掉时一声短促的轻响，之后只剩棚里的安静；不要任何音乐。

渲染样式: 影视级实拍质感，35mm 胶片颗粒，浅景深，真实皮肤与布料纹理、锁甲金属反光，物理正确的材质反射，绿幕棚拍光，画面不烧字幕、不出现任何文字。

比例: 16:9

时长: 5s

负面词: 画面文字，字幕，水印，logo，人脸变形，五官漂移，多余手指，畸形肢体，塑料感材质，卡通渲染，三维动画感，游戏截图质感，任何音乐
'''

