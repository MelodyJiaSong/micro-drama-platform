how = "把这一段要观众跟着经历的心理台阶逐条列出来，对照分镜拍点与秒数：一个台阶少于约 2–3 秒、或两三个台阶挤在一拍里 → fail，加镜或加时长。只核对「片子有没有照分镜拍」查不出这个问题；要站在观众的位置，按 1 倍速从头看完再判断"
