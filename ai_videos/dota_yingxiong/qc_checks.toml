# 自检登记表 · **剧级（dota_yingxiong）** —— 只对本剧生效。与仓库级登记表
# `.agents/references/project/qc_checks.toml` 合并使用（id 两层不许重复）。
#
# 本剧的参考与声音原则（follow-up 257）：原版参考图 best effort——找得到就挂，找不到写「无原图」照常往下做；
# 错的参考比没有更糟，`ref_image.identity` 不过或拿不准的不当硬参考，单一来源只作软参考。
# 声音：原声 → 克隆 → 使用，原声对不上原台词、克隆声纹或转写对不上都不进下一步。
#
# 这些检查都产生于本剧的实战反馈；某一条在另一部剧也反复出现，再提议升到仓库级（须用户同意）。

# ── 剧级流程策略（2026-10-30 follow-up 295）──
# 用户：「在自主权下，生成了一个video跑完了有问题，不能再次提交，必须等我反馈」。
# 出片后（不论闸门过没过），该技能下一条提交前必须有用户对上一条的反馈记录（`skill_pack.py feedback`）；
# `skill_pack.py submit` 与 `skill_run.py` 都强制。自主授权（如 follow-up 284/285）也不越过这一条。
[policy]
wait_user_feedback_after_render = true
# 用户 2026-10-30：「一镜到底这个要求是对所有的英雄技能video生效的」（follow-up 295）——本剧技能视频一律按一镜到底查，
# 不再看规格里有没有写这四个字；`qc.py gate` 对 skills/ 下的出片自动带上「一镜到底」。
skill_video_onetake = true

[[check]]
id = "ref_image.identity"
stage = "ref_image"
kind = "review"
layer = "quality"
perspective = "fidelity"
gate = true
auto = false
desc = "参考图确实是这个英雄 / 技能 / 物件，与文字考据（形状、颜色、范围）对得上"
how = "只给审稿人参考图与考据原文，问「这是不是 X」；不是或拿不准 → 不当硬参考。错的参考比没有参考更糟"
sources = ["dota_yingxiong#257"]

[[check]]
id = "ref_image.version"
stage = "ref_image"
kind = "review"
layer = "spec"
perspective = "fidelity"
gate = false
auto = false
desc = "参考来自锚定版本（dota 为 6.83d），不是高清改模 / AI 重绘 / 同人"
how = "看来源与画风；可信度标 ✅多源一致 / ⚠单源（只作软参考）/ ❌冲突 / 无原图（best effort 照常往下做）"
sources = ["dota_yingxiong#257"]

# 用户 2026-11-01（follow-up 316）：「我们不要dota2 的任何图标和ref……我们做的是dota1，严格按照dota1来做」。
[[check]]
id = "ref_image.dota1_only"
stage = "ref_image"
kind = "review"
layer = "quality"
perspective = "fidelity"
