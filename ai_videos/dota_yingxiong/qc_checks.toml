kind = "review"
layer = "quality"
perspective = "character"
gate = true
auto = false
desc = "角色「发现 / 看见」某物的那一拍，规格按画面左右写清那件东西在哪，并写出他先把头和眼睛转向它、它在他的视线上，之后才有反应"
how = "逐拍找「看见、发现、注意到、察觉」：有没有写东西在画面哪一侧、他的头往哪转、转过去之后才惊讶 / 揉眼？只写「扭头看向左边」而不说画面哪边、或反应写在转头之前，判不过。还要写出用什么机位让人和物在同一条视线上：过肩 / 主观镜头（物在他头朝向的正前方）或反打（物在镜头方向、光照到他脸上、他看镜头旁边）；只靠「人在前景、物在背景」的单机位，模型常把物放到他身后，判不过（follow-up 343：g1 改了文字仍两次画成光在她背后）"
