auto = false
desc = "参考与造型依据只来自 DotA 1（6.83d 地图）/ 魔兽 3 原版：不含 Dota 2 的图标、截图、视频截帧、音频、wiki 图；卡里也没有借 Dota 2 补的造型、配色、构件或特效"
how = "看参考文件来源（URL、文件名、refs.md）与卡的「图标 / 真人化」依据：出现 Dota 2 / Steam CDN / dota2 wiki 来源，或写着「取自 / 参考 / 确认于 Dota 2」「两图一致」→ fail，删参考、改卡、重出。DotA 1 原图缺失时写「无原图 ⚠️ 创作」，不许拿 Dota 2 补"
sources = ["dota_yingxiong#316"]

