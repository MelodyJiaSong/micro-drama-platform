[[check]]
id = "video.timeline"
stage = "video"
kind = "review"
layer = "spec"
tolerance = "不要求精确到秒：某一拍提前或推迟不超过 2 秒（或不超过这一拍时长的一半，取较大者）算对上；缺拍、顺序颠倒、多出明显的动作，或偏差超出这个范围才判 fail"
perspective = "director"
gate = true
auto = false
desc = "时间轴每一行都发生了、先后顺序对、时刻大致对（大范围偏差才算错，不要求精确到秒）、没有多出来的明显动作"
how = "审稿人只看 4 fps 拼图与时间轴表，逐行判「发生 / 缺 / 错 / 顺序」并给出看到的秒数；时刻按容差判（用户 2026-11-14：不需要精确到秒，但大范围时间偏差还是要报错）"
sources = ["dota_yingxiong#141"]

[[check]]
id = "video.scale"
stage = "video"
kind = "review"
layer = "spec"
tolerance = "量的是画面里的相对高度，透视与姿态（弯腰、骑坐、四足、远近不同）会让读数偏差：同一深度、一眼看得出比例偏离卡上约三成以上（如该 4:1 实测 1.5:1）才判 fail；小偏差判 pass 并记下实测比；远近、姿态不同没法换算的记审不了·看不清"
perspective = "director"
gate = true
auto = false
desc = "体型比例符合卡（主体与小兵的相对高度）"
how = "拼图里量各角色占画面的相对高度，对照人物卡身高（tools/scale_table.py 派生的体型对照）；四足生物按肩高比"
sources = ["dota_yingxiong#070", "dota_yingxiong#245"]

[[check]]
id = "video.head_tail"
stage = "video"
kind = "review"
layer = "spec"
tolerance = "开头预备段里特效提前不到 1 秒、结尾余波稍长只记录；一开场就出特效、没有收势、结尾结果看不见才判 fail"
perspective = "director"
gate = true
auto = false
desc = "开头 1–2 s 只有预备动作不出特效；结尾结果可见、余波散尽、回站姿"
how = "看拼图首尾两段"
sources = ["dota_yingxiong#217", "dota_yingxiong#219"]

[[check]]
id = "cut.duration"
stage = "cut"
kind = "machine"
layer = "spec"
gate = true
auto = false
desc = "成片 ≥ 65 s，转场为不重叠的 0.4 s 渐黑渐亮，接缝无静音爆音"
how = "ffprobe 时长；音频接缝 RMS"
sources = ["dota_yingxiong#217"]

