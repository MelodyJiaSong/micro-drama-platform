# ── 2026-11-03 follow-up 342：违反物理与视线常识（用户抓到冰女 vlog s1 g1 / g2）──
# g1：蓝光在她身后左边，她的头从没转向那里就开始「揉眼确认」；g2：冰面一碎她就像被吸进去，没有任何让她掉下去的物理原因。
# 根因：规格只写「扭头看向左边」「她跟着往前栽进去」，没按画面左右写死东西在哪、她往哪转头，也没写掉落的受力原因。

[[check]]
id = "spec.notice_gaze"
