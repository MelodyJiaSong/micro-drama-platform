# 近卫中路一塔 · 场地平面图的几何唯一出处。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
#   blender -b --factory-startup --python tools/build_scene.py -- "<本目录>"
# 坐标原点在场地左上角（西北角），x 向东、y 向南，单位 m。src 只许 原典方位 / 坐标表 / 地图量取 / 推定。
#
# 几何回指 `../bg4_近卫中路一塔.md`「## 锁定描述符」字段 2：
#   中路土路从近处（西南）斜向远处（东北、河谷方向）；古树塔立在土路左侧（＝西北侧）近中景；路两侧草坡与阔叶林墙。
# 原典只给方位（d01 §3.1：近卫中一塔约在 WC3 (-1504,-1824)，中路西南—东北对角线）；**米数全部推定 ⚠**，
# 按锚点图 `bg4_近卫中路一塔.png`（35mm、一人高、路右半边望东北）反推：古树塔约 19 m 外、偏画左约 20°，树冠出画。
# 图上远端土路往画左（北）拐进河谷，本表照图把远段折向北 ⚠。
# 战场用法见 `../../../../../battlefield.md` §3.3。

[meta]
bg = "bg4"
name_zh = "近卫中路一塔"
size_m = [160, 160]
px_per_m = 4.0
slope_m = 0.0
scale_src = "推定"
scale_note = """
⚠ **尺度全部推定**：土路宽 10 m、古树塔约 12 m 高取自卡的锁定描述符；塔距锚点机位约 19 m、偏画左约 20° 由锚点图按 35 mm 视场反推。
场地 160 × 160 m，只覆盖塔前兵线交战需要的一段路。
`slope_m = 0`：本场实际是远端（东北）下坡通向河谷，引擎的底面只能北高南低，方向相反，所以压平，只用东南草坡（ridge）表达起伏。
"""
absent = [
    "人物、小兵与动物（默认态画面空无一人）",
    "队伍色：红色旗帜、布条、徽记（d01 §3.1 近卫默认队伍色是红，真人化不用）",
    "树上的人脸、卡通五官（古树塔靠躯干、肩、臂膀状的枝和腿状的根认出来）",
    "第二座塔、兵营古树、月亮井（都不在这一段路上）",
    "河道水面（河谷只在东北远景的亮光与水汽里）",
    "柏油路、石板路（是踩实的土黄夯土）",
]

