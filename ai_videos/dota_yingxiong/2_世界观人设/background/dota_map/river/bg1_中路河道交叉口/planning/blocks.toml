# 中路河道交叉口 · 场地平面图的几何唯一出处。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
#   blender -b --factory-startup --python tools/build_scene.py -- "<本目录>"
# 坐标原点在场地左上角（西北角），x 向东、y 向南，单位 m。src 只许 原典方位 / 坐标表 / 地图量取 / 推定。
#
# 几何回指 `../bg1_中路河道交叉口.md`「## 锁定描述符」字段 2：
#   河自西北流向东南、宽约 40 米、水浅；中路土路自西南岸斜下、涉浅滩、上东北岸；锚点视点在河心偏上游望东南，右岸近卫、左岸天灾。
# 原典方位（d01 §3.1）：河道西北→东南，中路西南→东北，两者在地图中心交叉——本图把交叉点放在场地中心 (120, 120)，
# 两条线互相垂直。**米数全部推定 ⚠**。两座一塔只是场外远景剪影，不建块。
# 战场用法见 `../../../../../battlefield.md` §3.4。

[meta]
bg = "bg1"
name_zh = "中路河道交叉口"
size_m = [240, 240]
px_per_m = 3.0
slope_m = 2.0
scale_src = "推定"
scale_note = """
⚠ **尺度全部推定**：河宽 40 m、水深及小腿取自卡；土路宽 10 m 与 bg4 / bg5 统一（卡未写）。
场地 240 × 240 m、交叉点居中。引擎水面＝河床上约 0.9 m，所以河道大部及膝；涉水口块写 shallow_m 抬成及小腿。
⚠ 锚点图读起来河更窄、更急（有浅滩激流），像 20–30 m 宽的山溪；平面图仍按卡的 40 m。
⚠ 锚点图机位读起来站在东北岸（天灾岸）水边的卵石上，不在河心；本表按图放在东北岸水边。
两座一塔：天灾塔在锚点图画左远景（约东方），近卫塔在画面中央偏右远景——实际地图里近卫中一塔在交叉口西南，与图上方位不合，按远景剪影的创作压缩处理，不建块。
"""
absent = [
    "人物、小兵与动物（默认态画面空无一人）",
    "队伍色旗帜、布条、徽记（近卫红 / 天灾绿都不用）",
    "桥（中路涉水过河）",
    "神符与神符石台（神符点在 bg6 / bg7，不在交叉口）",
    "近景防御塔（两座一塔只在远景，场外）",
    "厚积雪（天灾岸只有背阴薄霜）",
]

