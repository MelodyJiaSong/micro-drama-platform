# 天灾中路一塔 · 场地平面图的几何唯一出处。改布局 ＝ 改本文件重跑
#   python tools/build_floorplan.py "<本目录>"
#   blender -b --factory-startup --python tools/build_scene.py -- "<本目录>"
# 坐标原点在场地左上角（西北角），x 向东、y 向南，单位 m。src 只许 原典方位 / 坐标表 / 地图量取 / 推定。
#
# 几何回指 `../bg5_天灾中路一塔.md`「## 锁定描述符」字段 2：
#   中路土路从近处（东北）斜向远处（西南、河谷方向）；尖塔立在土路右侧（＝西北侧）近中景；路两侧荒坡与稀疏针叶松。
# 原典只给方位（d01 §3.1：中路是西南—东北对角线，天灾中一塔约在 WC3 (1056,-96)）；**米数全部推定 ⚠**，
# 按锚点图 `bg5_天灾中路一塔.png`（35mm、一人高、路左肩望西南）反推：塔约 38 m 外、偏画右约 21°。
# 战场用法（英雄站位、来兵方向、光、留痕）见 `../../../../../battlefield.md` §3.2。

[meta]
bg = "bg5"
name_zh = "天灾中路一塔"
size_m = [160, 160]
px_per_m = 4.0
slope_m = 5.0
scale_src = "推定"
scale_note = """
⚠ **尺度全部推定**：土路宽 10 m、尖塔约 10 m 高（光球顶约 11.5 m）取自卡的锁定描述符；
塔距锚点机位约 38 m、偏画右约 21° 由锚点图按 35 mm 视场反推。场地取 160 × 160 m，只覆盖塔前兵线交战需要的一段路。
`slope_m = 5`：引擎的底面自北向南缓降，借它表达「远端（西南）下坡通向河谷」——实际坡向是东北高、西南低，引擎只能按北高南低近似。
游戏里天灾中一塔离地图中心（河道交叉口）约 1060 WC3 单位、近卫中一塔约 2360（d01 §3.1 坐标算得）；本图不按游戏距离换算。
"""
absent = [
    "人物、小兵与动物（默认态画面空无一人）",
    "队伍色：绿色旗帜、布条、徽记（d01 §3.1 天灾默认队伍色是绿，真人化不用）",
    "第二座塔、兵营、通灵塔等其他天灾建筑（只有这一座一塔）",
    "金字塔、玛雅神庙式规整台阶（是粗凿黑玄武岩逐层收窄）",
    "厚积雪与雪原（只有背阴面薄霜、积水薄冰）",
    "晴天直射阳光与清晰硬投影（阴天漫射光；唯一点光源是塔顶光球）",
    "桥、河道水面（河谷只在西南远景雾里）",
]

