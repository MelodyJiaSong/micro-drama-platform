# 各 bg 主体在【全城俯视图】上的点位 —— `tools/shot_floorplan.py --city` 的输入。
#
# ⚠️ 这里**一个坐标都不写**。每条只声明「它挂在 W11 §2.8 的哪一条上」，
# 由脚本去 `0_research/parts/w11_city_layout.md` 解析并乘 CITY_SCALE。
# 理由：全城坐标的唯一出处是 W11（CLAUDE.md § AI video rules / rule 4i ①）；
# 在这里抄一份数，就等于开了第二个出处，**漂了不会报错、只会让图安静地骗人**。
#
# anchor.kind：
#   gate          —— W11 [[gate]] 的 name
#   landmark      —— W11 [[landmark]] 的 name
#   river_offset  —— 自某城门沿某条河上溯 N 米（与 build_bianjing.DERIVED_ANCHORS 同法）
#
# [[unplaced]] 是**故意没有点位**的主体：全城俯瞰、内景、或 W11 里确实没有对应条目。
# 列出来是为了让「这张图少标了几个 bg」这个问题有答案，而不是看着像漏了。

[[bg]]
key = "bg1"
name = "虹桥"
anchor = { kind = "landmark", name = "虹桥" }

[[bg]]
key = "bg2"
name = "东水门城门"
anchor = { kind = "gate", name = "东水门" }

