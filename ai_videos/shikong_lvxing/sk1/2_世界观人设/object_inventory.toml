# ── 第二批：场景/建筑原型库（2026-09-17 用户定调「scene 里的建筑也要出 3D，但绝不能调
#    Rodin 一百次；生成二十个反复用，能不花 API 微调就更好」）──────────────────────
#
# 成本结构：**付费的是原型，不是实例。** `build_bianjing.py` 的 `PROTOS` 已经是
# 「原型建一次、实例 link 反复用」，现在 14539 个街区单元 + 11111 关厢房 + 1369 村落房
# 全是同一批参数化原型的实例——缺的只是给原型配真网格。
#
# **付费原型出「一间」，不出「一栋」**（rule 4g ②「先定模数，构件按模数出」）：
# builder 实测在用的模数是**开间宽 3.3–4.2 m**、店铺 1–4 间 / 其余 1–3 间，
# 进深店铺 9–13 m、其余 5.5–8.5 m，单层檐高 4.3–6.2 m、两层 7.5–9.5 m、三层正店 11–13 m。
# 一间的模块脚本沿面宽重复 N 次就是任意面宽的房子——一次 Rodin 换出整条街。
#
# 免费变体（脚本侧，零 API）：开间数 N / 屋顶形制三选一 / 构件混搭 / 逐实例镜像·转角·非等比。
#
# ⚠️ 抬头那条「整栋建筑不走生成」仍然有效，本批**先只做构件**；
#    「一间店铺立面」这一档能不能走生成，由 p45 一次实测定（3 张图 + 1 次 Rodin），
#    渲出来看了再决定要不要往下铺。

