# sk1 物件清单 —— `tools/gen_object_cards.py` 的唯一输入（用户 2026-09-17 定的流程第 1 步）
#
# 这里登记的是**有界的物件**：能单独拿起来、有确定轮廓、image-to-3D 拿得住的东西。
# 判据是 `ai_video.md` rule 4g §B：
#   ✅ 器物 / 构件 / 车船 / 家具 / 动物 / 树 —— 有界、有机、拿得住
#   ❌ 环境（街、城、河岸、院子）        —— 生成式给不出直角、统一地平面与重复开间节奏
#   ❌ 整栋建筑                          —— 同上；建筑走 `build_bianjing.py` 脚本，
#                                          只有它身上**有机繁复的构件**（栏、窗、招牌、欢门）走生成
#   ❌ 整身着装人物                      —— 2026-09-05 实测塌成光滑坨（rule 4h §G1）
#
# 资产键 `pN` 与 `build_bianjing.py` 的 `resolve_asset` 同一套：白模落到
# `props/pN_{名}/whitemodel/pN_{名}.blend`，布局层的同尺寸替身自动换成它。
# p1–p11 是已有的卡，新物件从 p12 起。
#
# 尺寸 = [X宽, Y长, Z高]，米。判断值标在 desc 里；有 fact_id 依据的写进去。

# ── 第一批：一镜到底航线 + 虹桥 / 码头 / 城门三场地面戏用得到的 ───────────────

