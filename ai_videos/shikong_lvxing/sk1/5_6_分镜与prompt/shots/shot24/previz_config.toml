#       出城大路 x ±4.8、路面高 0.3、向 −Y 延伸到 −400；路口横路 y ±3；土坡 (34, 20) 44 × 30 × 6；
#       路旁垂柳 x ±8（y −390…−12，每 8 m）；大柳树 (−22, −150)；田埂与农舍在两侧田里）。
