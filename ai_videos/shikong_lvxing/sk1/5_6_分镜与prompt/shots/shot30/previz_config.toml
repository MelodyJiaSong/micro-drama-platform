# shot30 previz —— S 档（tools/previz_sk1.py；A 档镜内切镜升 S）：州桥南头往南夜市纵深 → 包子摊前侧面中景 → 包子与羊白肠微距
# 坐标：Place C 局部（+Y 沿御街向北；桥面 y −12…12；州桥南御街铺面在 x ±36、y −20 / −34；正店门首在 (37, −56)）。
# 夜市食摊用套景 `sets/夜市食摊.blend`（集合 SET_夜市食摊 / SET_包子摊 / SET_羊白肠摊；局部 −Y ＝ 顾客一侧）。
# 关键帧 t ＝ shot30.md `动作:` 时间窗；看 ＝ `林问开口与视线时间表`（14.5–17 s 正脸看镜头开口）。
# 判断：
#   ① 摊子沿街两溜排在铺面前 x ±28、每 10 m 一张，桥头往南到 y −124（Place C 足迹外接全城层街面）；
#      85 mm 视角只有 24°，机位贴东溜摊子站（x 24），灯火才排成向南收拢的一条；
#   ② 包子摊在东溜 y −44，羊白肠摊紧挨它南侧（两案一掌宽的缝）；
#   ③ 17–24 s 微距从包子笼屉横移到铁鏊，离食物约 30 cm、俯 30°；笼屉顶上放三个包子、铁鏊上三截羊白肠当对焦目标
#      （第一版机位离笼屉侧壁 0.3 m，画面只剩一片灰，已改）；0–7 s 长焦机位左移 2 m、看向东溜摊线，灯火排成向南收拢的一条。

