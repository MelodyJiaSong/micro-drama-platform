# shot02 previz —— S 档航拍（S02，30 s，**一镜到底、零切点、真无人机速度**）：承接 shot01 末帧 → 沿汴河西飞 → 相国寺桥转北 → 掠过相国寺大殿 → 出寺后低空续飞，御街中轴与远处的宣德楼进画（follow-up 014：取消末段爬升，全程无俯视）
# 2026-09-16 follow-up 011（用户定调「飞得太快 / 不要转弯，要流线型」）：
#   · 全程 45–60 m/s 水平 + 末段约 55 m/s 爬升（与水平同量级，看起来是一个连贯动作，不是时空压缩）；
#   · 航线是一条平缓的左旋弧：沿汴河往西 → 在相国寺桥处顺势北偏 → 掠过大殿 → 继续西北向边飞边升，全程没有 90° 转弯、没有折返；
#   · 州桥、御街与宫城不再飞过去，而是在最后爬升段随着俯角变大自然进画（follow-up 010 那条「回头跨御街」的折返已删）。
# t 与定稿 shot02.md 的 `镜头:` / `动作:` 逐拍对齐（rule 4h §B 1）：
#   0–12 s  汴河段（follow-up 012 压到 12 秒：这一段是平直河道、信息量最低，约 95 m/s 直线掠过，z 14→20）：两岸铺面与河街掠过，相国寺桥从画面深处长出来
#   12–18 s 顺势北偏（约 55 m/s，z 20→28）：过相国寺桥，寺院院墙与大三门进画
#   18–22 s 慢掠大殿（约 50 m/s，z 26）：青灰瓦正脊从镜头下方过去，两侧廊庑连成两条长灰带
#   22–30 s 低空续飞（follow-up 014：**取消末段爬升**）：出寺后继续往西北，高度 26→42 m、约 65 m/s，
#           御街中轴从画面左前方进画收拢成一条线，宣德楼在五百多米外的尽头压在空气里；**全程无俯视**
# 坐标写法同 shot01/previz_config.toml 抬头。本镜没有任何 "切" = true 的关键帧。

["全局"]
shot = "shot02"
fps = 25
total_sec = 30.0
"分辨率" = [1920, 1080]

[["机位"]]
t = 0.0
"位置" = ["承接", "shot01"]
"看向" = ["承接", "shot01"]
"焦距" = 24.0

