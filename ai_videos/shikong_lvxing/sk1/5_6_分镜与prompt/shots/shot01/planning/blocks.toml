# shot01 俯视图上的【建筑组示意块】—— 只为「一眼看懂航线途经什么」而画。
#
# ⚠️ 这不是几何真相。真几何在 `bianjing.blend`（由 `tools/build_bianjing.py` 从
# `city_plan.md` + W11 生成）。本文件是**沟通用的示意方块**，位置由下面这些真实
# 坐标推出来，尺寸是手给的、可随意改：
#   · 东水门 (1388, -1373)          —— W11 [[gate]]「东水门」
#   · 东水门拐子城 (1457.5, -1413)  —— W11 [[landmark]]
#   · 仓前码头 (1288.6, -1176.8)    —— 汴河中线自东水门上溯 220 m（Place E 的推导锚点，
#                                      与 build_bianjing.DERIVED_ANCHORS["E"] 同法）
#   · 关厢 / 河街的方块贴着汴河中线两侧偏置摆，偏置量即下面的 xy
#
# 改这里 → 重跑 `tools/shot_floorplan.py` 即可，方块跟着动。
# 字段：name 标注名；xy 中心（世界米，已是 CITY_SCALE 之后的值）；size 长×宽（米）；
#       rot 绕中心旋转（度，0 ＝ 长边朝东西）；kind 决定配色 house/wall/wharf/water；
#       bg  这块地方归哪个场景主体（`2_世界观人设/scenes/bianjing/bg{N}_*`）。
#           留空 ＝ **没有专属主体卡**，出图时只能借 bg0 全城航拍的长相，不是漏填。
#           2026-09-21 follow-up 028：关厢与河街已补卡（bg19 / bg20），这里跟着改了归属；
#           还留空的只剩「城内街区」一块，那是生成式城内肌理、不是一个主体。
#
# [[offmap]] 是画不进取景框、但与本镜有关的主体：只在图边画一个指向箭头 + 距离。

