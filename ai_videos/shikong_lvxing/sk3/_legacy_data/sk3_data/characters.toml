speech = "✅ 开口。**虚构人物 · 现代英语白话**——1666 年伦敦英语的句法与今日无异（`london1666.lang.*`），所以他说的是今天听得懂的英语，不是舞台古腔。**每一行台词在 shot 的 `refs:` 行标 `虚构人物·现代英语`**（生成器闸门：非旅行者的台词行缺标即 raise）。voice_id `en-m-porter-thames-01`（登记处 `casting.md` §1）；声线：三十余岁男声，胸腔厚、带喘（他一直在扛），伦敦口音，句子短。禁 `thee/thou`、`prithee/verily/forsooth`、`Goodman/Goody`（乡下词）、`your Worship`（查无真命中）、仿古拼写；称谓用 `Sir / Madam / Mistress / Mr. / pray you`。"
