  [[character.soul]]
  k = "年龄 / 当下处境"
  v = "十七岁，旧圣保罗教堂院里一家书商 / 印书铺的学徒，七年学徒期过了四年，吃住都在师傅家阁楼。"
  [[character.soul]]
  k = "前史（之前在干什么）"
  v = "赫特福德郡一个小教区牧师的第三个儿子，父亲拿不出让他上大学的钱，托人把他送进书商行会当学徒——「离书最近的一条便宜路」。"
  [[character.soul]]
  k = "为什么在做现在做的事（根因）"
  v = "他不是喜欢卖书，他喜欢的是**书怎么被做出来**：纸怎么码、版怎么排、墨要多稠。"
  [[character.soul]]
  k = "目标（短期 / 长期）"
  v = "短期＝天黑前把这摞新到的印张码进店里、别弄折角；长期＝满师以后开自己的一间铺子，头一本印自己想印的那本。"
  [[character.soul]]
  k = "需求（needs）"
  v = "被当成快要出师的人，不是跑腿的孩子。他最怕人喊他 boy。"
  [[character.soul]]
  k = "内心欲望（desire）"
  v = "有一天翻开一本书，扉页上是他自己的铺号。"
  [[character.soul]]
  k = "核心矛盾"
  v = "他全部的价值都押在**纸**上——最不禁火、最不禁水、最禁不起一次搬运的东西；而他这一行遇事的第一反应，恰恰就是把纸搬到「最安全的地方」去。"
  [[character.soul]]
  k = "恐惧"
  v = "把一摞纸掉在地上。（他真正该怕的那件事，他想不到。）"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "学徒第一年，他把师傅一整叠刚印好的纸放在窗下过了一夜，夜里下雨飘进来，半叠报废；师傅没打他，只让他一张一张摊开晾干、晾了三天。从那以后他搬纸永远纸面朝内、永远两只手。"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "先护纸，再护自己。任何时候先看这摞东西稳不稳。"
  [[character.soul]]
  k = "性格特点"
  v = "话多 · 手脚快 · 急于证明自己 · 紧张时语速更快还吞字——行为体现：妮娅一问，他会抢着先答、再想。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本站内不给弧。段六他说完盼头就抱着纸进店；段十一他只在远景里出现一次，跟着一串人把成捆的书往教堂地下搬，**不开口、不特写、不点名**。"


