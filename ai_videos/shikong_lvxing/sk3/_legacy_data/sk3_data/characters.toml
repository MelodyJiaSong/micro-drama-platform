  [[character.soul]]
  k = "年龄 / 当下处境"
  v = "五十多岁（生年本站未查，`待深化`）。布丁巷上自家窄门面的面包铺，前店后炉、楼上住家；同时是「Conduct of the King's Bakehouse」、给海军供饼干、还是教区执事（`london1666.people.001`，T2）。今天是星期六，明天是主日，他要在打烊前把当天的活收干净。"
  [[character.soul]]
  k = "前史（之前在干什么）"
  v = "学徒出身，1637 年入面包师行会，1649 年起在这个教区开铺——**在这条巷子里已经烤了十七年面包**（`london1666.people.001`，T2）。"
  [[character.soul]]
  k = "为什么在做现在做的事（根因）"
  v = "`待深化`。可确证的只有一条底色：他把生意做进了王室与海军的供货名单，还当上了教区执事——**这是一个一步一步把自己做成体面人的人**。"
  [[character.soul]]
  k = "目标（短期 / 长期）"
  v = "短期＝把今天的炉子收了、明天好好过主日；长期＝`待深化`。"
  [[character.soul]]
  k = "需求（needs）"
  v = "被当成靠谱的人。（给海军供饼干的合同，靠的就是这个。）"
  [[character.soul]]
  k = "内心欲望（desire）"
  v = "`待深化`。"
  [[character.soul]]
  k = "核心矛盾"
  v = "**他这一行的全部本事就是管住火**——什么时候旺、什么时候压、什么时候封。而本片架在一条 T2 的复原上（`timeline.003` ⚠️）。**片中绝不表现他疏忽、忘记或失职**：那是官方口径与后世推断，不是可考的当晚事实。他只是收摊。"
  [[character.soul]]
  k = "恐惧"
  v = "`待深化`。"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "`待深化`。（明天凌晨他会从楼上窗户爬到邻居家屋顶逃出去——**本片不拍，也不提前暗示**。）"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "先看货、再看火、最后关门。对门口一个不认识的外乡女人说的怪话，他的处理方式是**点头**——那不是同意，是打发。"
  [[character.soul]]
  k = "性格特点"
  v = "客气 · 忙 · 不多问——行为体现：他对妮娅点头的那一下，**手上的动作一秒都没停**。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本站内他没有弧，**这是本片最要紧的一个设计**：段三他忙，段八他点头，两次都不说话、两次都没有任何变化。她什么都没改。"


[[character]]
key = "c30"
name = "国王与约克公爵"
kind = "真实历史人物"
role = "查理二世与其弟约克公爵 James。本片**只在段十一（9/2 上午 · 白厅）出现一次，且只有远景**：皮普斯面奏之后，国王下令「不惜任何房屋，沿火头前方一律拆除」，约克公爵当场表示可以再拨士兵（`london1666.people.008`，T0）——但这是**皮普斯的间接转述**，所以片中只做**字卡**，两人**不开口、不对口型、不给特写**。他们在画面上的全部功能是一个落差：**最高一级的权力已经下令了，火还是没有停**（`london1666.people.007` 官方通告：本该拆房断火而未办）。"
speech = "❌ 不开口、不对口型、不特写（`casting.md` §2 ＋ §0 第三档：**间接转述不得改写成直接引语**）。**无 voice_id。**两人在片中只作远景剪影或中远景背影。合规（`proposal.md` E §2）：真实历史名人不说创作台词、不做任何演绎式表演。妮娅口播里的称谓用 `his Majesty / the King` 与 `the Duke of York`（`_series/glossary.md` §1.2 白名单），**禁 `Sire`**（法式奇幻用语）。"
tag = "远景两人，深色缎面短上衣与阔腿褶裤，及肩深褐长假发"
body = "两名三十多岁的英格兰贵族男子，并肩站在一处高窗前或廊下，**全部只作远景 / 中远景的背影或剪影，不给正脸、不给特写**；较高的一位微微侧身、一只手背在身后，另一位朝他侧过半个身子。两人都是 1666 年 9 月的复辟宫廷装，**不是一个月后才出现的那一套**：及腰短 doublet（细羊毛呢或缎面，一位暗酒红、一位深靛蓝，前襟一排包扣扣齐，袖上开细缝透出底下白亚麻衬衫，袖口一圈大褶边）；下身阔腿及膝褶裤（裤管极阔像短裙，腰侧与裤口成束的丝缎带环——宫廷这一档的缎带明显比街上多，但仍是成束的带环，不是从头挂到脚的流苏；膝下一圈从裤口垂下来盖在袜上的宽褶边）；颈上白亚麻领巾，在喉前打一个松蝴蝶结、两端垂胸（端头一道细蕾丝）；头上深褐色及肩长假发（做得像真发，浓密、自然卷，不是白色卷筒）；脚上方头皮鞋（黑，一枚小方形金属鞋扣）配白丝袜。**没有王冠、没有权杖、没有貂皮披风、没有绶带**——这是办公，不是加冕。背景是室内高窗的逆光，两个人是暗的。不是及膝长外套或三件套（**那要到 1666 年 10 月 7 日**，比本站晚五周，是本站头号时代错乱）、不是白色扑粉卷筒假发的 18 世纪宫廷、不是戴王冠的加冕像、不是穿盔甲的骑马像。"
todo = "⚠️ 本卡是**一张卡两个人**（`casting.md` §2 把 `c30` 登记为「查理二世 / 约克公爵」）——立绘只用来锁**远景轮廓与服装年代**，**不作为脸的参考**；两人一律不给正脸、不对口型。⚠️ 生卒年、性格、动机未在阶段 0 查证，`待深化` 的维度不得进字卡或口播。⚠️ 服装是按 w3 §3.0.1 / §3.0.2 的年代形制推的宫廷上档版本，**没有一手依据**说明 9/2 当天两人穿什么；**唯一写死的一条是「还没有长马甲」**。"
lines = [
  "**不开口。**国王的命令是皮普斯的**间接转述**（`london1666.people.008`，T0），只做**字卡**：the King commanded me to go to my Lord Mayor from him, and command him to spare no houses, but to pull down before the fire every way. The Duke of York bid me tell him that if he would have any more soldiers he shall。**把它改写成引号内的话放进国王嘴里就是伪造**（`casting.md` §0 第三档）。",
  "字卡素材（**不是台词**，⚠️ 角标）｜ 官方口径的国王与约克公爵连日奔走救火、约克公爵在圣殿区通宵督阵并用火药炸房断火（`london1666.people.009`——官方通告，有宣传成分，须标 ⚠️）。",
  "❌ 禁：任何台词、任何对口型、任何特写、任何原创的宫廷戏。",
]

