role = "伦敦市长 Sir Thomas Bludworth（亦拼 Bloodworth）。本片只在**段十一（9/2 上午–正午）**出现一次：坎宁街上，脖子上胡乱围着一条手帕、像个用尽了的人，对刚传完国王口谕的皮普斯说出全片唯一一句有一手记载的直接引语，然后转身走开。**9/1 全天他不出现**——「前一夜见到市长」这件事没有任何史料，不要为了结构方便把他提前。"
speech = "✅ **可以开口、可对口型——全片唯一一个**（`casting.md` §0 第一档：同时代人把他**说的话**记成直接引语，皮普斯 9/2 当场目击并用引号记下）。**只此一句、逐字**，不增不减、不改语序、不补前后句。voice_id `en-m-mayor-bludworth-01`（登记处 `casting.md` §1，本行是转录；改声音＝改 casting.md 重跑）；声线：五十余岁男声，疲惫沙哑，气不够、句子断，音量偏小。**那句人人会背的「Pish! A woman might piss it out」查无一手出处**（`london1666.people.005` / `.006`），绝不得进他嘴里——它只由妮娅在画外间接提及、并当场点明查无一手出处。"
tag = "炭灰细呢短上衣，脖上胡乱围一条白亚麻手帕，帽拿在手里"
body = "五十岁上下的英格兰男子，中等偏高、肩背厚实，此刻整个人是泄了气的站姿：重心塌在一条腿上，两手摊开半举在腰侧，肩塌下去，头微低。一身体面市民的衣服，但全部走形——及腰短 doublet（细羊毛呢，炭灰偏暖，前襟一排布包扣，最上面两颗没扣、衣襟歪着；袖上开细缝透出底下白亚麻衬衫，袖口的大褶边被汗压塌）；下身阔腿及膝褶裤（羊毛呢，深橄榄，裤管极阔像短裙，腰侧与裤口各三五束克制的丝缎带环，此刻散了两束、垂下来）；**脖子上不是领巾，而是胡乱围着的一条白亚麻手帕**，随手打了个结、一端搭在肩上——这是史料点名的那一处；矮冠宽檐软毡帽（黑褐，檐一侧上翻，帽上无扣）**没有戴，攥在左手里、被捏出褶**；深褐色及肩长假发被汗压塌、贴在颈侧；脚上方头低帮皮鞋（黑褐，一枚小方形金属鞋扣）配灰白细羊毛袜，鞋面与袜筒下缘沾满灰白色干灰与黑色污点；两只袖口与前襟有灰迹和几处暗褐色小烧斑，早已冷透。整身是好料子、裁剪合身，但脏、皱、歪，与街上劳动者的衣服此刻分不出干净程度。中景站姿。不是威严的市长袍与金链、不是镇定自若发号施令的官员、不是及膝长外套或三件套、不是高顶帽配方形帽扣。"
