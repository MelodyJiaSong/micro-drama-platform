  v = "被当成会算账的人，不是只有力气的人。他记得住每家库门后头堆的是什么，也记得住谁家的桶会渗。"
  [[character.soul]]
  k = "内心欲望（desire）"
  v = "有一天有人来问「这条街上东西该往哪儿放」，问的是他。"
  [[character.soul]]
  k = "核心矛盾"
  v = "他每天摸的就是最值钱也最要命的货（沥青、柏油、油、酒、白兰地），他比谁都清楚这些东西沾了火会怎样——**而他的盼头，正是多囤一点这样的东西**。"
  [[character.soul]]
  k = "恐惧"
  v = "摔坏一桶白兰地。那要赔他半年工钱。"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "瘟疫年（1665）他弟弟死在同一间租屋里，他在外头扛了一整天回来才知道。从那以后他不肯歇工——歇下来就会想。"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "先看桶、再看路、最后看天色。「今天够了吗」他只用一个标准：明早还起得来吗。"
  [[character.soul]]
  k = "性格特点"
  v = "话少 · 手快 · 爱算数 · 对陌生人客气但不热络——行为体现：妮娅问他一句，他先把手在围裙上擦两下，再回答。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本站内没有弧，这是**故意的**：他在段七说完盼头就出画，之后再不出现。那七个小时观众自己会算。"


[[character]]
key = "c23"
name = "比林斯盖特码头脚夫"
kind = "虚构人物"
role = "比林斯盖特（Billingsgate）码头按趟计酬的脚夫，四十余岁。本片在**段七（9/1 傍晚前 · 码头）**出现：石阶湿滑，木船靠岸，柳条筐里是鲜鱼、咸鱼与洋葱——这个港口的货种有 Stow 的一手记载（`london1666.people.011`：鲜鱼咸鱼、贝类、柑橘、洋葱、水果、块根、谷物）。妮娅问他河上运来些什么，再问他这趟卸完想干什么。**镜头拍他的脸。**他是四位「盼头」NPC 的第二位，用「明天」的短尺度。"
speech = "✅ 开口。**虚构人物 · 现代英语白话**（`london1666.lang.*`），每一行台词在 shot 的 `refs:` 行标 `虚构人物·现代英语`。voice_id `en-m-dockhand-billings-01`（登记处 `casting.md` §1）；声线：四十余岁男声，嗓子被河风吹哑，音量大（他每天要压过整个码头的喊价声）。禁 `thee/thou`、`prithee/verily/forsooth`、`Goodman/Goody`、`your Worship`、仿古拼写；称谓用 `Sir / Madam / Mistress / Mr. / pray you`。"
tag = "灰褐短上衣，裤管卷到膝，赤足，肩上一只湿柳条筐"
body = "四十余岁的码头脚夫，个子不高但扎实，背厚、小腿粗；站姿是刚把一筐货甩上肩、正在找平衡：一条腿踏在高一级的湿石阶上，右肩顶着筐底，左手反手扣住筐沿，上身向左侧压。及腰短 doublet（粗羊毛呢，灰褐偏冷，前襟布包扣缺了一颗、用一段麻绳临时系住，袖肘磨破露出里衬），下摆与裤腰之间露出一圈白亚麻衬衫（本白泛灰，下摆被水浸出一道深色边，两袖挽到肘上）；下身素面及膝褶裤（羊毛呢，茶褐，一根缎带也没有，**两只裤管都卷到膝盖以上**，膝下的布带松开垂着）；腰上横系一条窄皮带，挂一只磨秃了的铁手钩；**赤足**，脚背与小腿沾着湿泥与鱼鳞，脚趾张开抓住石阶；右肩上一只湿柳条筐，筐里是鲜鱼、咸鱼与洋葱，筐底滴水；头上一顶矮冠宽檐软毡帽（深褐，被河风与水汽泡得发软、檐往下塌、不上翻），或索性光头裹灰白布巾。**两只手掌与手指全是泡白又干裂的口子，指甲有黑边**；衣服前襟有一片洗不掉的深色鱼渍。全身色只在灰褐、茶褐、本白亚麻这几个洗旧了的柔和沉色里。不是及膝长外套、不是满身缎带的阔腿褶裤、不是穿胶靴戴手套的现代渔工、不是干净挺括的舞台工装。"
todo = "人是虚构的，港口货种有一手依据（`london1666.people.011`，Stow 经 British History Online 转载）。⚠️ 未查到 1660 年代码头脚夫的行会服制或臂章，**不要编制服**。⚠️ `casting.md` 与 w1 §12 把他的盼头写成「明天卖完这船」，而 9 月 2 日是**主日**；1666 年伦敦主日是否禁市未在阶段 0 查证（**待人工核**）——台词已按安全写法把「明天」落在**结账 / 收钱**而不是**摆摊开卖**上。"
lines = [
  "原创白话 · `虚构人物·现代英语` ｜ 回答「河上运来些什么」：Fish — fresh, salt. Oysters. Onions, oranges, whatever comes up the river. It all comes ashore here first, Madam.（中文轨：「鱼——鲜的、腌的。生蚝。洋葱、橘子，河上来什么就是什么。都是先在这儿上岸，夫人。」）",
  "原创白话 · `虚构人物·现代英语` ｜ 回答「今天还要卸多久」：One more boat and I'm done.（中文轨：「再来一船就收工。」）",
  "原创白话 · `虚构人物·现代英语` ｜ **盼头**（短尺度 · 说到闺女时音量**突然掉下来** · 镜头只拍他的脸）：Tomorrow I'm paid for this lot. Then my girl gets her cloth — she's been after a new dress since Easter.（中文轨：「明天这批货结了账，我就给我闺女扯块布——她从复活节就念叨着要件新衣裳。」）",
  "❌ 不得让他预感、暗示或听说明天会起火；❌ 不得让妮娅剧透。明天他闺女的主日是在逃命里过的，**这句话不能由片中任何人说出来**。",
]

