[[character]]
key = "c29"
name = "Farriner"
kind = "真实历史人物"
role = "Thomas Farriner（亦拼 Farynor / Faryner），布丁巷的面包师，五十多岁：1637 年入面包师行会，1649 年起在圣玛格丽特新鱼街教区开铺，1666 年时任「Conduct of the King's Bakehouse」并为海军供应饼干，本人还是教区执事（`london1666.people.001`，T2）。**他是本片任务的对象，也是全片最重要的那个不说话的人。**两次出现：**段三**（午前，妮娅第一次路过，铺子正忙，她没说出口）、**段八**（傍晚，铺子正在打烊，她说了那句「今晚把炉子扒干净」）——**他只是礼貌地点点头，继续收摊。**9/1 晚上他家里可考的有本人、成年女儿 Hannah、儿子 Thomas、帮工 Thomas Dagger，外加一名死于火中的女仆（`london1666.people.002`，T1）。"
speech = "❌ **一句话都没有。**不是「少说」，是**零台词、零口型**：妮娅说完那句话，他只是礼貌地点点头、继续收摊。**不给真实人物编一句回应**（concept 形态铁律 / `casting.md` §2）——这也让失败更冷：没有争辩、没有嘲笑、没有戏剧冲突，只有一个忙了一天的人对一个陌生人点了个头。**无 voice_id。**只远景或中景、不特写、不对口型。"
tag = "沾面粉的本白粗亚麻围裙，肝褐短上衣，两袖挽到肘"
body = "五十多岁的伦敦面包师，中等身高、上身厚实、肩背前倾（常年在低矮炉口前弯腰）；姿态是**收摊的动作中途**：一手端着一只空木托盘搭在腰侧，另一手扶着半掩的铺门，身体已经朝铺内转了一半，脸的方向给中景、**不给特写**。及腰短 doublet（粗羊毛呢，肝褐色，前襟一排布包扣、上面两颗不扣，袖肘磨得发亮，下摆短到肋下），下摆与裤腰之间露出一圈鼓起的白亚麻衬衫（本白泛灰，**两只袖子都挽到肘上**，前臂裸着）；下身素面及膝褶裤（羊毛呢，暗橄榄，一根缎带也没有，膝下布带扎住）；腰前系一条粗亚麻围裙（米白到灰白，**整片糊着一层干面粉的白雾，胸前与腹前有几块被手抹出来的深色印子，下摆边缘有几处暗褐色烤斑、早已干透变硬**）；头上一顶软布帽（本白粗亚麻，帽檐软塌、沾着面粉），或索性光头裹灰白布巾；脚上方头低帮皮鞋（深褐，鞋面开裂、整双沾着一层面粉与灰）配粗羊毛袜（本色灰）。**两只手背、前臂与指关节有多处深浅不一的旧烫疤，全部是早已长好的陈年痕迹、平整、不肿**；指甲缝里是面团的灰白，手背上有一层薄薄的干面粉。衣服有补丁，接缝处开线。全身色只在肝褐、暗橄榄、米白亚麻这几个洗旧了的柔和沉色里。不是穿白色现代厨师服戴高帽的面包师、不是年轻学徒、不是连锁店招牌下的店员、不是拿金属烤盘的现代烘焙师、不是及膝长外套。"
todo = "⚠️ 姓氏三拼（Farriner / Farynor / Faryner），本仓统一 **Farriner**。⚠️ `london1666.people.001` 全条是 **T2**（站点编者据行会记录与 L&M 注编纂）：生年、相貌、当晚行止均无一手。⚠️ 「晚八九点打烊、女儿午夜巡查」是 `london1666.timeline.003`，**全片 tier 最低的一条（T2 复原），而整集架在它上面**——concept 已把它列进片尾存疑口播。⚠️ 未查到 1660 年代面包行当的法定服色或行会服制（w3 §3.1 套 B 明注），**不要编行业制服**；行当只靠围裙、面粉、炉具与烫疤位置区分。"
lines = [
  "**一句话都没有。**段八她说完「今晚把炉子扒干净」，他礼貌地点点头、继续收摊——**不给真实人物编一句回应**（concept 形态铁律）。",
  "❌ 禁：任何台词、任何口型、任何「他愣了一下 / 皱眉 / 笑了笑 / 说了句什么」的反应戏。**允许的全部反应只有一个**：点头一次，手上的活一秒都不停。",
  "❌ 禁：任何暗示他疏忽或忘记的表演（叹气、抹汗回头看炉子、犹豫、欲言又止）。起火原因是后世口径与 T2 复原，不是当晚可考的事实；片中只拍他正常收摊。",
  "（旁白 / 字卡素材，**不是他的台词**）他的身份说法用皮普斯 9/2 的逐字 the King's baker（`_series/glossary.md` §1.2 白名单 / `london1666.lang.013-B`）。",
]

