# sk3 人物数据表 —— 人物卡的唯一出处（rule 4i ①）。
#
# 卡由 `python tools/gen_sk3_assets.py` 从本表生成，落在
# `ai_videos/shikong_lvxing/sk3/2_世界观人设/characters/{key}_{name}/`。
# **改卡＝改本表重跑**，手改卡会在下次 `--check` 时被 DRIFT 抓到。
# schema 的权威定义是 `tools/gen_sk3_assets.py` 的 `char_card()`。
#
# 上游权威：
#   · `2_世界观人设/casting.md` —— §0 真实人物能不能开口的四档判定表、§1 发声角色表、§2 沉默的真实面孔。
#     **键 / 名字 / voice_id / 能不能开口全部照它**；本表的 `speech` 字段是转录，改声音＝改 casting.md。
#   · `0_research/parts/w1_timeline_people.md` §12 —— 真实人物的可考行踪与原话、四位虚构人物的阶层锚点与盼头。
#   · `0_research/parts/w3_clothing_food.md` §3.1 —— 五套服装锁定串（套 A–E），本表逐条引用不改写。
#   · `_series/glossary.md` §1.2 —— 称谓白 / 黑名单。
#
# 三条贯穿本表的硬约束：
#   ① **绝不写五官**（2026-06-18 选角供脸）——`tag` 与 `body` 只写造型可辨项。
#   ② **零 hex**（rule 1b）——颜色只用自然中文色名。
#   ③ **服装避开本站三大时代错乱**——长马甲 vest 是 1666-10-07 才有的（晚五周）；
#      清教徒全黑装 + 方形帽扣是误传（帽扣纯属 19 世纪想象）；capotain 高顶帽已过时十几年。
#      实际是 "sadd colours"：赤褐 russet / 枯叶褐 / 茶褐 / 肝褐 / 法国绿。
#
# c5 妮娅不在本表——她是系列共用角色，卡只住 `_series/characters/c5_妮娅/`，本站放卡会撞键。
# 她的 1666 装是挂在系列卡下的站点装束变体（`c5-31` 立绘 / `c5-32` 建立视频），形制由物件表 `p11` 承载。


