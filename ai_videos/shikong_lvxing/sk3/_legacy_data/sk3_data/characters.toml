  [[character.soul]]
  k = "年龄 / 当下处境"
  v = "四十三岁，比林斯盖特码头按趟计酬的脚夫：一船到岸喊一次人，喊到谁是谁。住泰晤士街北边一条巷子的阁楼，妻子与两个孩子，大的是闺女、十一岁。"
  [[character.soul]]
  k = "前史（之前在干什么）"
  v = "埃塞克斯河口渔村出身，十四岁跟船，二十出头伤了腰不能再上远洋，转进城里搬岸上的货——「岸上的活稳，就是吵」。"
  [[character.soul]]
  k = "为什么在做现在做的事（根因）"
  v = "他一辈子挣的是**当天结清的钱**，所以他所有的盼头都只到明天为止。"
  [[character.soul]]
  k = "目标（短期 / 长期）"
  v = "短期＝把这船卸完、明天把账收了；长期＝闺女别嫁给一个也在码头上喊价的人。"
  [[character.soul]]
  k = "需求（needs）"
  v = "被听见。他的嗓子是被河风吹哑的，可他每天都要压过整个码头的喊声报数。"
  [[character.soul]]
  k = "内心欲望（desire）"
  v = "有一天买一块**整的**布，不是别人裁剩下的边角。"
  [[character.soul]]
  k = "核心矛盾"
  v = "他嗓门最大、力气最足，却是这条河上最容易被换掉的人——明天不来，今晚就有人顶上。"
  [[character.soul]]
  k = "恐惧"
  v = "再伤一次腰。"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "二十三岁那年在北海上被缆索抽中后腰，在船板上躺了两天才靠岸。从那以后他搬东西永远先侧身、用肩不用腰。"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "看潮水。潮一转，这船就得卸完——他所有的时间感都是潮水给的，不是钟给的。"
  [[character.soul]]
  k = "性格特点"
  v = "大嗓门 · 爽利 · 爱吹自己扛过多重 · 对小孩特别软——行为体现：说到闺女那句，他的音量会**突然掉下来**。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本站内不给弧。段七说完盼头就出画；段十一河上全是搬家的船时，**他不再出现**——观众自己补。"


[[character]]
key = "c24"
name = "泰晤士河船夫"
kind = "虚构人物"
role = "泰晤士河上摆渡的船夫（waterman），五十余岁，有自己一条两人座小船拴在水边石阶上。本片在**段七（9/1 傍晚前 · 河与燃料的收尾）**开口：妮娅想雇一条船，雇不到——1666 年船夫正被强征入海军（`london1666.transport.*`），皮普斯自己都雇不到船。她问他行情，再问他这阵子过去想干什么。**段十一（9/2）河上全是搬家的船时他只作远景回扣，不开口、不点名。**他是四位「盼头」NPC 的第三位，用「这阵子过去」的短尺度——明天他确实会赚到一生最多的一笔钱，而那是从邻居的绝望里赚的（`london1666.people.012`）。"
speech = "✅ 开口。**虚构人物 · 现代英语白话**（`london1666.lang.*`），每一行台词在 shot 的 `refs:` 行标 `虚构人物·现代英语`。voice_id `en-m-waterman-01`（登记处 `casting.md` §1）；声线：五十余岁男声，慢、稳、爱停顿，说话像在报价。禁 `thee/thou`、`prithee/verily/forsooth`、`Goodman/Goody`、`your Worship`、仿古拼写；称谓用 `Sir / Madam / Mistress / Mr. / pray you`。**台词里不出现具体船资数字**（见 `已知空白`）。"
tag = "暗橄榄短上衣，宽檐软毡帽压低，手里一支长桨"
body = "五十余岁的泰晤士河船夫，瘦而结实，肩背因常年划桨而前倾、两条前臂格外长；站姿是一只脚踩在船舷上、一手撑着立起来的长桨，身体的重心永远留着一点晃动的余量（他在岸上也像在船上）。及腰短 doublet（粗羊毛呢，暗橄榄，前襟一排布包扣，肩缝与肘部各打了一块颜色略深的补丁，下摆短到肋下），下摆与裤腰之间露出一圈白亚麻衬衫（本白泛灰，袖口宽大翻出，领口敞开，颈上随意绕一圈本白亚麻布条挡风）；下身素面及膝褶裤（羊毛呢，肝褐，一根缎带也没有，膝下用布带扎住，**右膝一块磨得发白的圆形磨痕**——那是他跪在船板上撑篙的地方）；腰间一条宽皮带，别一只对折的旧帆布钱袋；头戴矮冠宽檐软毡帽（深褐，檐往下压得很低、一侧被水汽泡皱，毡面起球）；脚上方头低帮皮鞋（深褐厚底，皮绳系死，鞋面常年湿、盐渍泛出一圈白痕）配粗羊毛袜（本色灰，卷到小腿肚）。**两只手掌整片是厚茧，虎口与指根各有一道深沟**；随身只有一支比他还高的长桨，桨面被磨成不对称的形状。全身色只在暗橄榄、肝褐、本白亚麻这几个洗旧了的柔和沉色里。不是及膝长外套、不是穿救生衣的现代船工、不是戴三角帽的 18 世纪水手、不是干净挺括的舞台工装。"
todo = "人是虚构的，河上撤离动线与船夫在那一夜的角色有一手依据（`london1666.people.012`）。⚠️ **1666 年泰晤士河摆渡的具体船资未在阶段 0 查证**（w1/w4 只给了面包、马车、工钱三组价）——台词里不出现任何船资数字，要用必须先查一手。⚠️ 未查到 1660 年代船夫是否佩行会臂章 / 号衣，**不要编制服**。"
lines = [
  "原创白话 · `虚构人物·现代英语` ｜ 回答「过河多少钱」（**不报数字**）：Across is one price, westward's another. Not my price to set, Madam.（中文轨：「过河一个价，往西又一个价。价不是我定的，夫人。」）",
  "原创白话 · `虚构人物·现代英语` ｜ 为什么雇不到船（`london1666.transport.*`）：Half the men off these stairs are gone to the fleet. Pressed. You'll wait a while for a boat these days.（中文轨：「这台阶上的人一半都被拉去海军了。硬拉走的。这阵子想雇条船，您得等。」）",
  "原创白话 · `虚构人物·现代英语` ｜ **盼头**（短尺度 · 段七 hero 句 · 镜头只拍他的脸）：When this business is over, I'll have a bigger boat. Six at a time instead of two.（中文轨：「等这阵子过去，我换条大的。一趟能坐六个，不是两个。」）",
  "❌ 不得让他预感、暗示或听说明天会起火；❌ 段十一河上那条超载的两人座小船**不点名、不给台词、不给特写**——是不是他，不写死。",
]

