  [[character.soul]]
  k = "年龄 / 当下处境"
  v = "五十岁上下（生年本站未查，`待深化`）。酒商出身的富商，1665–66 任伦敦市长——**任期最后两个月**。此刻是 9 月 2 日正午前后的坎宁街，他已经一整夜没睡。"
  [[character.soul]]
  k = "前史（之前在干什么）"
  v = "做生意发家，做过市议员，1665 年当选市长；瘟疫年刚过去，他接手的是一座刚死了几万人的城。⚠️ 详细前史本站未查，`待深化`。"
  [[character.soul]]
  k = "为什么在做现在做的事（根因）"
  v = "他做的是**商人的市长**：市政在他眼里是账与体面，不是消防指挥。拆房意味着赔偿，赔偿要人出钱，而没人授权他花那笔钱。"
