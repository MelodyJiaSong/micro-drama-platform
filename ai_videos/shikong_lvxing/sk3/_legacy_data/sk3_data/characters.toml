  [[character.soul]]
  k = "内心欲望（desire）"
  v = "既要体面，又什么都不想错过——今天他既躲了熟人，又看了木偶戏，又喝了酒，还赶回来写完日记。"
  [[character.soul]]
  k = "核心矛盾"
  v = "本片里他是**唯一一个把这一天完整留下来的人，也是唯一一个完全不知道明天会发生什么的人**。他打扫书房「为明天」，他家女仆熬夜备明天的席——他所有的准备都指向一个不会到来的日子。"
  [[character.soul]]
  k = "恐惧"
  v = "失去官位与财产。（明天凌晨他会先看一眼火、觉得还远、回去接着睡。）"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "⚠️ 1658 年的取石手术（无麻醉），他此后每年在同一天设宴纪念自己活了下来。**该事件不在本站阶段 0 的 fact 集里，只作表演理解，不进字卡、不进口播。**"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "先办公事、再找乐子、最后回家把账和日记记平。今天躲 Young Killigrew 一伙就是这套逻辑：不想被拉去喝酒，就绕开。"
  [[character.soul]]
  k = "性格特点"
  v = "好奇 · 爱热闹 · 爱记账 · 爱唱歌 · 会躲人——行为体现：他一路唱着歌回家（`london1666.timeline.*`），这是本片给他的**最后一个轻松镜头**。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本站内他是一条**不知情的平行线**：9/1 越轻松，9/2 越重。9/2 他上塔楼、下船、面奏国王、在坎宁街撞见崩溃的市长——同一个人、同一副衣服，一天之内换了一个世界。**本片不给他反应特写**，只让他在远景里越走越快。"


[[character]]
key = "c27"
name = "Evelyn"
kind = "真实历史人物"
role = "John Evelyn，四十多岁，有田产的绅士、皇家学会创始会员之一、日记作者。本片**不开口**，只在两处出现：① **段六 旧圣保罗**——六天前（8/27）他与雷恩等人在这里勘查、议定要给这座无尖顶的巨物加一个圆顶；**这件事不发生在 9 月 1 日**，所以片中只以妮娅画外转述＋字卡呈现，若入画一律作**无时间标记的远景背影**或明标「六天前」的回述镜。② **段十二 收尾**——他勘察废墟后写下的 `London was, but is no more.` 做**字卡**，不做台词。另外，航拍开场那句「旅人在许多英里之外先闻到、而不是先看到这座城」出自他抨击伦敦煤烟的小册子《Fumifugium》，由妮娅画外引述。"
speech = "❌ 不开口、不对口型（`casting.md` §0 第二档：他**自己写下来**的第一人称文字）。**无 voice_id。**只远景或中景、不特写（`proposal.md` E §2）。"
tag = "暗酒红呢短上衣，宽檐软毡帽，肩披短斗篷，手持折起的纸"
body = "四十多岁的英格兰绅士，中等身材、背挺、步子慢而稳；姿态是远景或中景的四分之三侧身 / 背影，**正在抬头看一面墙**（本片不给他正脸特写）。及腰短 doublet（细羊毛呢，暗酒红偏暗，前襟一排布包扣扣齐，袖上开细缝透出底下白亚麻衬衫，袖口一圈大褶边）；下身阔腿及膝褶裤（羊毛呢，炭灰偏冷，裤管极阔像短裙，腰侧与裤口各三五束克制的丝缎带环；膝下一圈从裤口垂下来盖在袜上的宽褶边）；颈上白亚麻领巾，在喉前打一个松蝴蝶结、两端垂胸（端头一道极细的素边）；肩上斜披一件短斗篷（深靛蓝羊毛，前面一枚素金属扣）；头戴矮冠宽檐软毡帽（黑褐，檐一侧上翻，**帽上无扣**），帽下是及肩的自然长发（深褐，**不戴假发**）；脚上方头低帮皮鞋（黑褐，一枚小方形金属鞋扣）配灰白丝袜。**左手拿着一张对折起来的纸，折缝朝外、字面完全朝里，画面上不出现任何可读文字**；右手抬起，食指指向画外上方某处（他在看墙、看脚手架，不是在指人）。衣服干净、料子好但不新，呢面有细绒。不是戴白色扑粉卷筒假发的 18 世纪绅士、不是及膝长外套或三件套、不是拉夫领、不是教士袍、不是穿长筒马靴在城里走路。"
todo = "⚠️ **伊夫林 9 月 1 日是否在伦敦城内，本站未考**——段六他若入画，只能是无时间标记的远景背影、或明标「六天前」的回述镜，**不得写成 9/1 当天在场**。⚠️ 生卒年、个人前史、性格未在阶段 0 查证，`人物灵魂` 中 `待深化` 的维度不得进字卡或口播。⚠️ `London was, but is no more.` 与 cupola 两句的 fact_id 待 w1/w5 回填（concept 与 casting 均已引用，本卡先按原文逐字登记）。⚠️ 服装按 w3 §3.1 套 C 的上档版本推，没有一手依据说明他当天穿什么。"
lines = [
  "**不开口**；其日记原文只作字卡与妮娅画外引述，见 `casting.md` §0。",
  "字卡素材（**不是台词，不对口型**）｜ 段十二 收尾：London was, but is no more.",
  "字卡 / 画外引述素材（**不是台词**）｜ 旧圣保罗加圆顶，出自**伊夫林日记**（记的是 8 月 27 日，不是 9 月 1 日）：a noble cupola, a form of church-building not as yet known in England。片中由妮娅画外转述，**不得让伊夫林或雷恩任何一方在画面上把它说出来**。",
  "画外引述素材（**不是台词**）｜ 航拍开场的煤烟：旅人在许多英里之外**先闻到、而不是先看到**这座城（《Fumifugium》）。由妮娅画外说，并标为引述。",
  "❌ 禁：任何原创台词、任何对口型、任何与妮娅或雷恩的画面对白。",
]

