  k = "需求（needs）"
  v = "**需要有人替他担这个责**——他要的不是命令，是授权。国王的口谕来了，他反而更慌：授权到了，人还是不听。"
  [[character.soul]]
  k = "内心欲望（desire）"
  v = "想回到昨天。"
  [[character.soul]]
  k = "核心矛盾"
  v = "**他有权下令拆房，却没有让人听命的力量。**他一夜都在拆，可火比人快；官方通告后来白纸黑字写「本该如此办而未办」（`london1666.people.007`）——这句话会跟他一辈子。"
  [[character.soul]]
  k = "恐惧"
  v = "被写进纸里。（他不知道自己已经被写进去了。）"
  [[character.soul]]
  k = "最大创伤 + 致伤事件"
  v = "⚠️ 无史料，`待深化`。片中可用的只有一处：他在坎宁街当街崩溃，被一个陌生人记了下来。"
  [[character.soul]]
  k = "此刻怎么 make decision"
  v = "不再决策。他已经用尽了，只剩下把话说出来——「人们不听我的」。这句既是陈述，也是推卸。"
  [[character.soul]]
  k = "性格特点"
  v = "体面 · 怕担责 · 压力下会当众泄气——行为体现：他不喊、不骂、不指挥，他**摊手**。"
  [[character.soul]]
  k = "成长 / 变化轨迹"
  v = "本片只给他一个瞬间，不给弧。他的「成长」在画外：三百多年里，他从一个来不及拆房的市长，变成一句他大概没说过的名言。"


[[character]]
