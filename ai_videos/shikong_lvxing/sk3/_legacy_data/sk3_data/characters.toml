[[character]]
key = "c26"
name = "Pepys"
kind = "真实历史人物"
role = "Samuel Pepys（TTS 读 PEEPS），三十三岁，海军署官员。**本片的叙事脊柱，但全程不开口。**妮娅远远跟着他过完这一天一夜：9/1 上午在办公室、回家吃饭（段一–段四背景），段五去 Moorfields 看木偶戏 Polichinelly、躲 Young Killigrew 一伙，傍晚在 Islington 吃喝、**一路唱着歌回家**，睡前写完日记；段十 字卡「约三点女仆 Jane 叫醒他，他看了一眼觉得还远，回去接着睡」；段十一 上塔楼、下船看全景、面奏国王、在坎宁街撞见崩溃的市长。**他不知道她在。**他把新书房打扫干净「为明天」，他家女仆们正熬夜准备明天宴客的东西——那场宴席永远没开成。"
speech = "❌ **不开口、不对口型**（`casting.md` §0 第二档：他**自己写下来**的第一人称文字，**是写的不是说的**）。他的每一句都只能走两条路：**字卡**（英文原文＋中文译）或**妮娅的画外引述**。**没有 voice_id**——本站不给他配任何声音。合规（`proposal.md` E §2）：只远景或中景、不特写。"
tag = "深靛蓝呢短上衣，白亚麻领巾，深褐长假发，手提角质灯"
body = "三十三岁的英格兰海军署官员，中等身材、略显发福、走路快而碎（一个整天在城里跑的人）；姿态是中景背影或四分之三侧身、**正在走**——本片不给他正脸停顿、不给特写。及腰短 doublet（细羊毛呢，深靛蓝，前襟一排布包扣扣齐，袖上开细缝透出底下白亚麻衬衫，袖口一圈大褶边）；下身阔腿及膝褶裤（羊毛呢，炭灰，裤管极阔像短裙，腰侧与裤口各三五束克制的丝缎带环——只三五束，不是几百码那种；膝下一圈从裤口垂下来盖在袜上的宽褶边）；颈上白亚麻领巾，在喉前打一个松蝴蝶结、两端垂在胸前（端头素边，没有蕾丝）；肩上斜披一件短斗篷（深灰褐羊毛，前面一枚素金属扣）；头戴矮冠宽檐软毡帽（黑褐，檐一侧上翻，**帽上无扣**），帽下是一顶深褐色及肩长假发（做得像真发，不是后来的白色卷筒）；脚上方头低帮皮鞋（黑褐，一枚小方形金属鞋扣）配灰白丝袜。**右手提一盏角质灯**（木框、四面薄角质片、里面一支蜡烛，光只照得到脚前一步），左手按着腰侧。衣服干净但不新，呢面有细绒，下摆与鞋面沾着街上的泥点。不是戴白色扑粉卷筒假发的晚年肖像、不是及膝长外套或三件套、不是拉夫领、不是现代公务员西装、不是穿长筒马靴在城里走路。"
todo = "⚠️ 本卡 `人物灵魂` 里凡未挂 fact_id 的条目（性格归纳、内心动机、取石手术）都是**表演用的理解框架，不是史实主张**，不得进字卡或口播。⚠️ 服装按 w3 §3.1 套 C（中等商人男性）＋ `london1666.dress.022`（1663 年起戴假发）推，**不是任何一幅肖像的复刻**；本站只写死一条——1666 年的他**不可能穿及膝长外套**（晚五周）。⚠️ 角质灯只用在夜镜（段九 / 段十）；白天的镜里不挂灯。"
