[[character]]
key = "c25"
name = "圣保罗旁书商学徒"
kind = "虚构人物"
role = "旧圣保罗教堂院里一家书商 / 印书铺的学徒，十七八岁。本片在**段六（9/1 下午 · 机构）**开口：柱廊下的书摊边，他抱着一摞新到的未装订印张往店里搬。妮娅问他学徒当了几年，再问他满师以后想干什么。**镜头拍他的脸。**他是四位「盼头」NPC 的第四位，也是唯一用**长尺度**（「满师以后」）托底整集余味的一位。**段十一（9/2）他只在远景里出现一次**：跟着一串人把成捆的书往教堂地下的圣福音堂搬——那批书随拱顶塌落全部烧毁、连烧一周（`london1666.people.013`，伊夫林日记）。他在那一镜**不开口、不给特写、不点名**。"
speech = "✅ 开口。**虚构人物 · 现代英语白话**（`london1666.lang.*`），每一行台词在 shot 的 `refs:` 行标 `虚构人物·现代英语`。voice_id `en-m-apprentice-01`（登记处 `casting.md` §1）；声线：十七八岁男声，清亮偏薄，语速快、句尾上扬，紧张时吞字。禁 `thee/thou`、`prithee/verily/forsooth`、`Goodman/Goody`、`your Worship`、仿古拼写；称谓用 `Sir / Madam / Mistress / Mr. / pray you`。"
tag = "本白衬衫外套茶褐呢短上衣，无假发，指尖沾印墨"
body = "十七八岁的书商学徒，瘦、个子已经窜起来但还没长开，肩窄；站姿是两手捧着一摞纸、上身微微后仰去配平那摞纸的重量，一只脚在前半步随时要走。及腰短 doublet（中等厚度羊毛呢，茶褐 tawney，前襟一排布包扣**全部扣到顶**——这是小学徒的规矩感；袖子略短、露出一截腕子，因为这件是去年的），下摆与裤腰之间露出一圈白亚麻衬衫（本白，比同街劳动者的干净，两只袖子各挽了一道、但挽得不齐）；下身素面及膝褶裤（羊毛呢，暗橄榄，一根缎带也没有，膝下布带扎紧）；腰上一条窄布带，别着一块对折的粗布擦手巾（沾着深色墨渍）；**没有假发、没有帽子**，一头自己的头发在颈后随便拢住；脚上方头低帮皮鞋（深褐，皮绳系结、鞋头翘起磨白）配粗羊毛袜（本色灰）。**两只手的指尖、指甲缝与右手虎口沾着洗不净的深色印墨**，右手食指侧面有一道压平的硬茧（常年捋纸边压出来的）。怀里捧着一摞未装订的散页印张，用两根麻绳十字捆住，**纸面一律朝内，只看得见纸边与纸纹；画面上不出现任何可读文字、不出现任何印刷字样**。全身色只在茶褐、暗橄榄、本白亚麻这几个洗旧了的柔和沉色里，零蕾丝、零缎带。不是戴假发的体面商人、不是穿及膝长外套的绅士、不是抄经的僧侣、不是背双肩包的现代学生。"
todo = "人是虚构的，Stationers 存书搬进圣福音堂地窖、随拱顶塌落全部烧毁并连烧一周有一手依据（`london1666.people.013`，伊夫林日记）。⚠️ 未查到 1660 年代伦敦学徒是否有专属服制（平顶软帽 / 统一颜色之类的说法流传很广，本站未查到一手）——**不要给他画制服**；「扣到顶、衣服小一号、没有假发」只是造型上的年龄与身份提示，不是史实主张。"
lines = [
  "原创白话 · `虚构人物·现代英语` ｜ 提醒别碰纸：Mind the sheets, Madam — they're not bound yet.（中文轨：「当心那摞纸，夫人——还没装订呢。」）",
  "原创白话 · `虚构人物·现代英语` ｜ 回答「学徒当了几年」：Seven years. Four gone, three to go.（中文轨：「七年。过去四年，还剩三年。」）",
  "原创白话 · `虚构人物·现代英语` ｜ **盼头**（**长尺度** · 全片最后一句盼头 · 托底整集余味 · 镜头只拍他的脸）：When I'm out of my time, I'll have a shop of my own. And the first thing I print is going to be mine.（中文轨：「等我满了师，我自己开一间铺子。头一本印的，得是我自己想印的那本。」）",
  "❌ 不得让他提明天、提火、提地窖；❌ 段十一他往地窖搬书那一镜**不给台词、不给特写、不点名**。他的盼头留到片尾由观众自己接上 `people.013`。",
