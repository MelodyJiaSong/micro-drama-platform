# p3 银先令与铜代币
# ══════════════════════════════════════════════════════════════════════════════
[[prop]]
key = "p3"
name = "银先令与铜代币"
three_view = false
hyper3d = false
purpose = """
「**出了这条街它就不是钱了**」这句口播的画面证据，也是「猜价格」卡与片尾总账单的道具。\
**分两堆**：左边银的（真钱，全城通行），右边铜的（私铸代币，**只能在发行的那家店兑**，\
`london1666.money.009`，T1）。城墙内 1648/9–1672 年发行过 **4,000 多种**代币\
（算上城外可能翻倍，`london1666.money.007`），所以右边那堆**每一枚的图案都不一样**。\
王室长期不管小面额，零钱缺口就这样被商人自己补上了（`london1666.money.005`）；\
1672 年查理二世下令取缔、改发王室铜币（`london1666.money.006`）。\
扁平小件、逐镜只在手里与桌面出现，**不建 3D**——网格给不出比贴图更多的东西。"""
not_x = """
**不是**成套的现代纪念币或整齐反光的收藏币；**不是**金币——**几尼 1666 年是要贴水的商品、不是钱**\
（皮普斯的金匠当年 11 月把升水从 18½ 便士提到 22 便士且「几乎买不到」，`london1666.money.002`）；\
**不是**纸币或票据（英格兰银行 1694 年才成立）；**不是**一镑硬币（£ 只是记账单位，市面上没有这枚币）。\
**币面绝不出现可读的字、年份或铭文**——真实铭文只在核对过时使用，本卡一律做成不可辨读的浅浮雕纹样。\
专属负向：`金币, 几尼, 纸币, 钞票, 收藏币盒, 亮如新铸, 可读年份, 可读铭文, 现代硬币, 一镑硬币`"""
light = "室内木桌面上的散射日光，从侧前方低角度进来；银币有一点冷白反光，铜代币几乎不反光"
reverse = "画面里没有任何火、没有任何暖色人造光源、天没有暗下来；桌上没有任何可读的字；空气里没有烟、没有落灰"
body = """
一张风化木褐的木桌面，上面摊着**两小堆钱，彼此分开约一掌**：\
左边一小堆银币，只有几枚，是先令与六便士——其中几枚轮廓正圆、边缘有规整的细密边齿、图案锐利；\
另外几枚轮廓不圆、边被剪掉过一角、图案偏移而且磨平了大半；银面发乌，只有凸起处磨出一点冷白；\
右边一大堆铜片，十几二十枚散着，薄得像指甲片，直径从一个指甲盖到一枚银币不等，\
边缘毛糙、厚薄不匀，表面的冲压图案浅而模糊、**每一枚都不一样**，暗黄铜与红铜褐里泛着一层暗绿锈；\
所有币面上的纹样都**辨不出是什么字**"""
todo = """
⚠️ **代币上具体的店名、图案与铭文未查**——4,000 多种各不相同，任一枚的具体铭文都需单独查证；\
本卡只锁「薄、小、花色各异、图案浅而模糊」，**不画任何具体店号、不编铭文**。\
⚠️ **银币的具体年份与君主头像版式未核**，画面一律做成不可辨读的浅浮雕，不作断言。\
⚠️ 代币的直径分档（farthing 约 14–16 mm / halfpenny 约 17–20 mm / penny 约 14–25 mm，\
`london1666.money.008`，T1）是**文字依据**，但画面里不标尺、不报数字，只做相对大小。"""

  [[prop.fields]]
  k = "类型 / 时代 / 室内外"
  v = "1666 年伦敦人口袋里的钱，摊在木桌面上的两小堆，室内"
