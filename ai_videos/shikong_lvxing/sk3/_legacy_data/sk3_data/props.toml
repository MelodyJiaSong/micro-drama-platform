# sk3 物件资产表 —— `tools/gen_sk3_assets.py` 的 props 数据源（rule 4i ①：一份东西只有一个出处）
#
# 改卡 ＝ 改本文件重跑 `python tools/gen_sk3_assets.py`。手改生成出来的 md 会在 `--check` 时被抓到。
# key/name 与 `ai_videos/shikong_lvxing/sk3/2_世界观人设/world.md` §5 清单一致。
# 零 hex（rule 1b）：颜色只用自然中文色名。负向词由生成器统一挂 style_guide.md §6 的负向块，
# 本文件只写**专属**负向（写进 not_x）。史实回指一律 `london1666.*`，查不到的写进 todo、不编。

# ══════════════════════════════════════════════════════════════════════════════
# p1 面包三档
# ══════════════════════════════════════════════════════════════════════════════
[[prop]]
key = "p1"
name = "面包三档"
three_view = false
hyper3d = false
purpose = """
吃段（`bg6` Cheapside 街摊）与「猜价格」停顿卡的画面证据，也是开场两个物价锚里**锚 A** 的全部内容：\
**一便士永远买一条，涨价的方式是把面包做小**（`london1666.food.007` / `london1666.price.001`）。\
三档同框是为了让观众一眼看出「贵的那只最小」——manchet 白面包 / cheat / maslin 粗面包（`london1666.food.006`）。\
1666 年伦敦只有**一个**面包师行会（黑白面包师 1645 年已合并，`london1666.food.009`），\
所以三档可以出自同一家铺子——包括布丁巷 Farriner 那家。"""
not_x = """
**不是**统一雪白的现代切片吐司、法棍、可颂或酸种乡村包；**不是**带价签、标价牌、条形码或按克标重的现代面包柜；\
**不是**崭新油亮的摆拍面包——三只都是当天现烤、已经放凉、表皮沾着薄面粉与炉底灰的手作面包。\
专属负向：`切片吐司, 法棍, 可颂, 贝果, 价签, 标价牌, 电子秤, 包装袋, 烘焙纸托, 蛋糕`"""
light = "白天的散射日光从侧前方来，光穿过煤烟带一点颗粒、不通透；面包顶面受光，摊板上留下柔和的短影"
reverse = "画面里没有任何火、没有任何暖色人造光源、天没有暗下来；空气里没有烟、没有落灰；画面里没有任何可读的字"
body = """
三只不同的面包并排摆在一块风化木褐的厚木摊板上，托着一张本白粗麻布：\
左边最小的一只又圆又矮、直径约一掌，表皮浅金匀净、几乎看不到麸点，掰开的切面细密近白；\
中间一只略大、圆而微扁，皮是米黄色、面上匀匀地布着细麸点，内里米色；\
右边最大的一只又大又扁、灰褐色，外皮硬、顶上裂开几道口子，掰口处露出粗大的气孔；\
三只都撒过一层薄面粉、底面沾着一层灰白的炉底灰，板上散着掰下来的碎块"""
todo = """
⚠️ **1666 年一便士面包的法定重量查不到**（`london1666.food.008`，dossier §14 / §7 锚 A）——\
最近的官方口径是伦敦市政记录 1618–19 年的 penny wheat loaf 13→17 盎司，Δ−47 年，**未内插**。\
本卡与口播一律**不报盎司数、不报克数**，只说「一便士的面包」与「丰年那只更大」。\
⚠️ 三只面包的**相对尺寸比例**是按精粗通例的推算，非史料，标 ⚠️。"""

  [[prop.fields]]
  k = "类型 / 时代 / 室内外"
  v = "1666 年伦敦街市上并排的三档日常面包，室外摊板（同一组形制也用于 bg2 面包铺内的木案）"
  [[prop.fields]]
  k = "形制 · manchet（最贵）"
  v = "小而圆、直径约一掌，表皮浅金匀净、几乎无麸点，内里近白，切面细密；白麦粉筛两三遍、贵，贵族与乡绅吃（`london1666.food.006`）"
  [[prop.fields]]
  k = "形制 · cheat（中档）"
  v = "比 manchet 略大、圆而微扁，皮米黄、面上匀布细麸点，内里米色；去掉最粗一层麸的麦粉，中等人家的日常（`london1666.food.006`）"
  [[prop.fields]]
  k = "形制 · maslin（最便宜）"
  v = "最大而扁、灰褐色，外皮硬、顶上有裂口，气孔粗；小麦掺黑麦，更黑更实，劳动者吃（`london1666.food.006`）"
  [[prop.fields]]
  k = "计价形制（锚 A 的画面）"
  v = "按「几便士的面包」叫卖、**不按重量**叫卖；价钱钉死、重量随小麦价浮动，同为一便士时丰年那只明显更大（`london1666.food.007` / `london1666.price.001`）"
  [[prop.fields]]
  k = "配色（自然色名）"
  v = "浅金（manchet 皮）、米黄带细麸褐点（cheat）、灰褐带焦边（maslin）；托底是风化木褐的摊板与本白粗麻布"
  [[prop.fields]]
  k = "做旧与手泽"
  v = "三只都撒过薄面粉、底面沾一层灰白炉底灰；有掰口露出内里，板上散着碎块；**痕迹都是冷的**，不冒热气、不发光"
  [[prop.fields]]
  k = "一句话锁定"
  v = "一浅金、一米黄、一灰褐，三只并排，最贵的那只最小"

# ══════════════════════════════════════════════════════════════════════════════
# p2 面包铺炉门与耙子
# ══════════════════════════════════════════════════════════════════════════════
[[prop]]
key = "p2"
name = "面包铺炉门与耙子"
three_view = true
hyper3d = true
purpose = """
**任务的物证。** 任务②（`bg13` 傍晚打烊）她说出那句话时，画面里就是这扇门；\
`london1666.timeline.003` 记 Farriner 晚 8–9 点打烊、耙拢炉煤，**整集架在这一条上**\
（⚠️ T2，Tinniswood 复原，全 dossier tier 最低）。**炉门开合的铁声是全片的声音锚之一。**\
它同时是 `bg2`（白天 · 炉门未亮）与 `bg13`（傍晚 · 炉门敞着有火）两个场景主体的共用器物——\
两边必须是同一扇门，所以形制在本卡锁死一次，两张场景卡都不各自改写。\
**三视图与网格只做铁炉门这一件**（有界刚体）；耙子与砖砌炉膛在第四张里给，\
炉膛属建筑不进 image-to-3D（rule 4g ①）。"""
not_x = """
**不是**现代烤箱的方门与玻璃观察窗、**不是**带温度表或旋钮的炉具、**不是**欧式壁炉的装饰铸铁花板；\
**不是**正在烧着的炉子——三视图里炉门是**关着的、冷的**，第四张里炉膛**是空的、冷的**\
（起火是次日凌晨的事，9/1 白天这扇门不许发光、不许发烫）。门面**不出现任何可读的字或铭文**。\
专属负向：`玻璃观察窗, 温度表, 旋钮, 电烤箱, 不锈钢, 炉门里透出光, 火星, 明火, 可读铭文`"""
light = "阴天均匀光，无方向性硬阴影，中性灰无缝背景"
reverse = "画面里没有任何火、没有任何暖色人造光源；铁门是关着的、冷的，不发光不发烫不冒烟；背景是空的中性灰，没有环境、没有人"
body = "（本卡用 views 逐张给，见下）"
todo = """
⚠️ **炉门的确切尺寸、铰链做法与耙头形制未查到 1666 年伦敦面包铺的一手图像或实物记载**——\
`london1666.food.005` 的 prompt_string 只给到「炉口砖砌、面粉袋、木揉槽、长柄木铲」这一级。\
本卡的尺寸、部件位置与铰链做法是按同期砖砌面包炉通例的推算，**标 ⚠️、不作形制断言、不报厘米数**。\
⚠️ 「打烊耙拢炉煤」这个动作出自 `london1666.timeline.003`（T2 复原，节选未标注据何史料），\
片中须打 ⚠️ 角标，或由用户回溯 Tinniswood 原书注释后升级。\
⚠️ Farriner 本人的铺子形制只能交叉核对（`london1666.food.005` 标注人工核证优先级最高：\
