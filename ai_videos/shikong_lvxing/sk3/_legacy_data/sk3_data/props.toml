能压住的是一张把正确形制写死了的正面参考图。伦敦城内**自 1189 年即禁茅草顶**，\
1212 年大火后规定新屋须瓦 / 木瓦 / 木板顶、旧茅草须抹泥；到 1666 年**绝大多数房子是瓦顶**，\
当时的记述指的是木构不是茅草（`london1666.myth.008`，T1，London Museum 策展人）。\
`bg0` 航拍那片「瓦顶之海」与所有街景的屋顶都按这一张的材质走。\
屋顶属建筑，**几何由建城脚本给、永不走 image-to-3D**（rule 4g ①②）。"""
not_x = """
**不是**茅草顶、麦秆顶、芦苇顶——**这是全片头号负向**（自 1189 年即禁，L01 / `london1666.myth.008`）；\
**不是**石板瓦顶、木瓦顶、金属屋面或沥青瓦；**不是**现代机制瓦（尺寸统一、颜色均匀、边缘锐利、排列齐整）；\
**不是**崭新金黄的屋面。瓦面是**硬的**，有明确的单片轮廓与阴影缝，不是毛糙连续的一层。\
专属负向：`茅草, 麦秆顶, 芦苇顶, 石板瓦, 木瓦, 金属屋面, 沥青瓦, 机制瓦, 尺寸统一颜色均匀的瓦, 崭新金黄`"""
light = "白天的漫射天光从斜上方落下，每一皮瓦的下缘投出一道细窄的横向阴影，瓦面的起伏因此看得见"
