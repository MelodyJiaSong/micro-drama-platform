  [[prop.fields]]
  k = "类型 / 时代 / 室内外"
  v = "1666 年伦敦面包铺的砖砌炉膛铁门与长柄铁耙，室内（临街敞开的板门之后）"
  [[prop.fields]]
  k = "炉门形制（网格主体）"
  v = "半圆拱形单扇铸铁门，宽约两掌半、高约两掌；左侧两只锻打铰链，右侧一只弯钩拉手与一根横插销；门面素平，无纹样、无铭文"
  [[prop.fields]]
