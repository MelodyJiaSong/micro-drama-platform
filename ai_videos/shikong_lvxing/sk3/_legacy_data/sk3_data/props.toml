一片片平板陶瓦密排叠压，单片约一掌宽、两掌长，微微向下弯，每一皮压住下一皮约三分之二，\
瓦背用木钉挂在挂瓦条上；瓦行大体平直**但并不齐整**——有一小片塌下去、有一角翘起来、\
