note = "本镜时长 28→30 s，台词按 dialogue.md §2 注③ 减词：script 原文 69 词、需 28.75 s，超 28 s 镜长的 80% 闸门。减掉的是虚词与重复限定（the part / called / whole look / hat buckle 的 hat / was invented in），**sad colour 四个色名、十九世纪帽扣、十月七号、五个星期、中间夹着一件大事全部保留**"
  [[shot.lines]]
