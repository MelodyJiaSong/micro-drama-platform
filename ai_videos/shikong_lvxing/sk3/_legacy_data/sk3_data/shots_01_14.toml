lens = "一个机位，连续跟、不切。0–7s 二层回廊客房门口近景，35mm，她的侧脸与半扇门在画面里；7–15s 机位随她横移到楼梯口并下到院里，视野逐步放开；15–22s 停在后院马厩敞棚前，24mm 低位全景，干草堆在画面中央偏左，木墙在其后，她站在画面右侧只占一小块"
blocking = "0–7s 她站在客房门口、侧身朝向门内（画面左），视线落在屋里；7–15s 她沿回廊走到楼梯口、下楼，背对镜头；15–22s 她走到马厩敞棚前停住，侧身朝向草堆（画面左），视线落在草堆上、不看镜头；马夫在敞棚深处给马添料，背对镜头、不说话；两匹马在马槽边低头吃料。**本镜她仍是现代装态**——深色运动上衣与工装裤、低帮徒步鞋，素色布质胸牌别在左胸，短话筒与麻布采访本随身；画面里不出现 1666 年的羊毛紧身上衣、羊毛裙、围裙或软帽（`参考:` 行上传的人物 entity 以本行为准）"
action = "0–3s 她推开矮门、探头往里看；3–7s 点了一下头，把门带上；7–11s 沿回廊走到楼梯口，手扶木栏下楼；11–15s 穿过院心往后院走；15–19s 停在草堆前，伸手从堆边抽出一小把草，在指间捻了一下，草屑落下去；19–22s 她把草放回堆上，抬眼看了看草堆上方那面木墙"
light = "9/1 上午：院口的斜光只照到院心与回廊上层，二层回廊的走道半明半暗；后院马厩敞棚朝北，棚下是天光反射的冷蓝漫射，草堆只有靠院心那一侧受一点侧光，枯黄的草面被照出一层细毛。干草堆是干的、冷的——**上面没有任何火星、没有任何烟、没有任何暖色光源照在它上面**；画面里没有任何火、没有任何暖色人造光源、天没有暗下来；院里没有任何路灯、没有任何公共照明装置，棚下吊着的角质提灯是没点的"
tempo = "推门看 → 下楼 → 穿院 → 停在草堆前 → 捻草 → 抬眼看木墙"
