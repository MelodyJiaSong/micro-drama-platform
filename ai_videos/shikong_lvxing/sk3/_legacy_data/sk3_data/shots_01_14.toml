plot = "回廊下，穿好全套 1666 平民装的妮娅站成全身正面：大家最容易弄错的是颜色——这一路叫 sad colour，赤褐、枯叶褐、肝褐、暗茶褐，不是那种一身黑、帽子上一枚大方扣的打扮，那枚帽扣是十九世纪的人想出来的，是同人创作。她再抬手在身前比划一下：没有长外套、没有马甲，那一整套三件式国王十月七号才宣布，离现在五个星期，中间还夹着一件挺大的事"
lens = "一个机位，连续运动。0–12s 回廊下正对她、眼平、35mm 全景，从软帽到鞋整个人在画面里，身后是回廊的木栏杆与院心；12–22s 机位只极轻地降半米、基本不推，把她转身的半圈完整留在画面里；22–30s 机位沿一道贴地缓弧向画左横移并跟进，随她走出回廊阴影到院心受光处，收成中景（膝以上）——**本镜后段全程在走弧线，与上一镜『锁死不动位＋正面直推』明确分开，两镜的机位行为不撞**"
blocking = "0–12s 她站在回廊下画面中央、正面朝镜头，双臂自然垂在身侧让整套衣服看清；12–20s 她转半圈让侧面与背面各过一遍，再转回正面；22–30s 她走到院心站定，身体四分之三侧对机位、脸转正朝镜头，视线落在镜头上；院里马夫与女仆各忙各的，不看镜头、不说话。**画面里不出现任何马甲、任何长外套、任何带方扣的高帽、任何全黑的清教徒装**——她说到这些东西时只是抬手在自己身前比一比又放下，那些东西不入画"
action = "0–5s 她摊开双手示意整身衣服；5–12s 用手背依次拂过上衣、裙子、围裙的布面，说到色名时手停在每一块颜色上；12–18s 转半圈、再转回来；18–22s 抬手在自己头顶上方虚虚地比了一个帽檐的形状，随即摇头把手放下；22–27s 走到院心，两手在身前上下比一个长外套的轮廓，同样摇头放下；27–30s 说完最后一句，看着镜头挑了一下眉"
light = "9/1 上午：她从回廊下的阴影走到院心的受光处——前半段是天光反射的冷蓝漫射，衣料的赤褐与枯叶褐显得沉；后半段日光从院子东南斜进来直接照在她身上，同一批色名在直射光下才露出赤褐与肝褐的差别。画面里没有任何火、没有任何暖色人造光源、天没有暗下来；院里没有任何路灯、没有任何公共照明装置，回廊下吊着的角质提灯是没点的"
tempo = "摊手 → 拂过布面（报色名）→ 转一圈 → 比帽檐摇头 → 走到院心 → 比长外套摇头 → 挑眉"
chars = ["c5"]
