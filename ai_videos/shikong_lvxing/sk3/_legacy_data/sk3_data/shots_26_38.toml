plot = "六天前，约翰·伊夫林和三十三岁的天文学家克里斯托弗·雷恩就站在这儿，一致认为旧塔不值得修了——他们想要的是一座英格兰还没见过的圆顶。九天后这座楼会烧一个星期。镜头最后落在墓地这边一个书商学徒的脸上，他正在码新到的印张。"
lens = "起幅是墓地一侧书商摊前的中景，妮娅在画面左侧、身后是教堂西墙与满墙脚手架；镜头随她转身走向摊子而横移，最后绕到摊后、停在学徒的正面近景上不动。"
blocking = "起幅妮娅在画面左缘、四分之三背向镜头，只见肩线与半张侧脸；书商摊横在画面中段，摊上摞着一叠叠新印张；学徒在摊后站着、身体正对镜头，两手还按在纸上；**他答话时视线落在镜头左侧画外妮娅站的位置（她就在镜头左边一步，画面里看不见她），眼神偏向画左、不直视镜头、不对着观众说话**。镜头绕到摊后之后，妮娅整个退到画框外——最后六秒画面里只有学徒一个人的脸（脸正对镜头、眼神偏向画左的她）。"
