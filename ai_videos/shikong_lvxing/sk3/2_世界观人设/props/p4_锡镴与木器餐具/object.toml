# p4_pewter_tankard 白模规格 + 验收清单（sk3 · 伦敦 1666）
#
# 这份文件是 tools/whitemodel_normalize.py 的输入：归一化按它做，验收按它验。
# 写一次，之后每一次重生成都过同一套验收 —— 换 Rodin、换 Hunyuan3D、换脚本补件，
# 标准不变（vendor 无关，rule 4h）。
#
# 区域坐标一律**归一化到包围盒 0..1**，与真实尺寸和摆放解耦。
# ⚠️ 尺寸是按行业通例与画面用途**推算**的，不是史料数字 —— dossier 里没有这些器物的
# 实测尺寸，标 ⚠️ 而不是编一个 fact_id。

["对象"]
"名称" = "p4_pewter_tankard"
"中文名" = "锡镴大杯"

["几何"]
"尺寸" = [0.13, 0.11, 0.17]        # X × Y × Z，米 ⚠️ 推算
"容差" = 0.10
"最多松散块" = 40000

# image-to-3D 的输出朝向随机；**拿到网格先渲一眼再改这里**（rule 4h：别拿没看过的网格往下做）。
# Rodin GLB 经 Blender 的 glTF 导入后通常已转 Z-up。
"源朝向" = { "前" = "-Z", "上" = "+Y" }   # 实测：本批 Rodin GLB 经 glTF 导入后是 Y-up，四件长轴全在 Y
"目标朝向" = { "前" = "+Y", "上" = "+Z" }

