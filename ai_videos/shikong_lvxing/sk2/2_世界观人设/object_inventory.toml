# sk2 物件清单 —— `tools/gen_object_cards.py` 的唯一输入
#
# 登记的是**有界的物件**：能单独拿起来、有确定轮廓、image-to-3D 拿得住的东西。
# 判据 `ai_video.md` rule 4g §B：
#   ✅ 器物 / 构件 / 车 / 家具 / 动物 / 树 —— 有界、有机、拿得住
#   ❌ 环境（街、城、运河、广场）        —— 生成式给不出直角、统一地平面与重复开间节奏
#   ❌ 整栋建筑                          —— 走 `tools/build_stormwind.py` 脚本
#   ❌ 整身着装人物                      —— 2026-09-05 实测塌成光滑坨（rule 4h §G1）
#
# 资产键 `pN` 与 `build_stormwind.py` 的 `resolve_asset` 同一套：白模落到
# `props/pN_{名}/whitemodel/pN_{名}.blend`，布局层的同尺寸替身自动换成它。
#
# 尺寸 = [X宽, Y长, Z高]，米。形制依据一律回指 `../0_research/look_from_images.md`（读图）
# 或 `parts/w*.md` 的 fact_id；**编不出依据的形制词不写**。
# 版本锚点：经典旧世 Vanilla。

