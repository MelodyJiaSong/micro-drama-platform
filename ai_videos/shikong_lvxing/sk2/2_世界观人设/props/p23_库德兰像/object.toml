# p23_库德兰像 白模规格 + 验收清单（`tools/whitemodel_normalize.py` 的输入）。
#
# 形制出处：`../../scenes/stormwind/_gate_research/gate_spec.md` §4 雕像清单。
# 尺寸 = 本体 15 m + 八角基座 4 m（本体高为两组独立量测，基座为估值）。
# 区域坐标一律归一化到包围盒 0..1。

["对象"]
"名称" = "p23_库德兰像"
"中文名" = "库德兰像"

["几何"]
"尺寸" = [6.0, 6.0, 19.0]        # X宽 × Y长 × Z高，米
"容差" = 0.12
"最多松散块" = 60000

# image-to-3D 的输出朝向随机；**拿到网格先渲一眼再改这里**（rule 4h §G）。
# 本批已渲过四视图预览，确认是**竖直站立**的（不是 text-only 那次的躺倒坨）。
"源朝向" = { "前" = "-Y", "上" = "+Z" }
"目标朝向" = { "前" = "+Y", "上" = "+Z" }

# ---- 占位探针：只判「这个部件在不在」，判不了表面质量与拓扑。
# ⚠️ 本批的**薄长件**（剑身 / 锤柄 / 弓）在 image-to-3D 里仍会退化成细杆，
#    阈值放宽到只验「有没有」，不验「像不像」——像不像由人眼在成片构图里判。

[["验收"]]
"名称" = "八角基座"
"类型" = "占位"
"区域" = { z = [0.00, 0.22] }
"最少顶点" = 3
"最少面积占比" = 0.002

[["验收"]]
"名称" = "躯干与长须"
"类型" = "占位"
"区域" = { z = [0.22, 0.72] }
"最少顶点" = 3
"最少面积占比" = 0.002

[["验收"]]
"名称" = "高举的战锤"
"类型" = "占位"
"区域" = { z = [0.72, 1.00] }
"最少顶点" = 3
"最少面积占比" = 0.002
