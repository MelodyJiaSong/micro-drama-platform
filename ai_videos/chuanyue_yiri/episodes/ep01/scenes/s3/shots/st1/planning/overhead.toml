# s3 st1（16 s）ep01 分镜 r2（第 2 轮 v5 双审后的修复）；坐标＝bg3 场地平面图（米，x 向东、y 向南）
# r3（ep01_20261108-185036_pregen_r3 / 185043_pregen_r2 审查后）便宜修复：见 SCRATCH/filming/s1-s4_r3_notes.md。
# follow-up 067（2026-11-14 出片前审查 r1 修复）：13 → 16 s；Felix 抬头先扫一眼她的裤子和靴子再 Salve，听她念错只微笑；她右手从左手心逐枚放钱、抬眼问够不够；Felix 一把拢钱进碗；收尾她手按胸口点头。
# follow-up 068（出片前审查 r2 修复）：机位挪到石台西南角外侧 (3.0,4.95)、40mm，两人离镜头差不多远（3.05 / 2.81 m），和首帧里两人一样大对上；Felix 6.3–6.7 秒竖一根手指应 Unum.，她掏钱放钱时他用右手掌扫台面的面粉、眼睛跟着她的手。
# follow-up 070（出片前审查 r3 最后一轮修复）：她不认得钱价，捏出四枚摊在手心递过去，Felix 从她手心拈走两枚放进碗、她把剩下两枚放回裤兜；Felix 抬头时左手搭在那摞面包上、4.2–5.4 秒轻拍一下，目光扫到她的腰带和长裤（他隔着石台看不到靴子）；Riley 3 秒起右手指尖搭在石台外沿。

