# follow-up 068（出片前审查 r2 修复）：机位挪到石台西南角外侧 (3.0,4.95)、40mm，与 st1 / st7 同一机位，两人离镜头差不多远；问 garum 改成右手在布包上方比划倒酱、两手一摊看街两头；独白末句改成 so I'm just gonna go left.；她左手朝西一摆时（约 15.6–16.4 秒）Felix 抬眼、顺着她的手往街上瞄一眼，又低头。
# follow-up 070（出片前审查 r3 最后一轮修复）：Felix 知道她听不懂，放慢说指路那句（6.5–9.2 秒），说到 dextram 手臂朝西推两下；她 9.3–10.2 秒转头确认；收尾她右手抬到胸前、Felix 带着笑，接 st8 第 0 秒。镜长不变。

