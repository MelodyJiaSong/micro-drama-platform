# 景别写在每个 [[camera]] 的 shot_size（量 Riley）：中景（她在画右前景、大腿以上，约 2.3 m）全程；固定机位，落幅路点同一位置。
# 按现行首帧定：镜头朝城的方向斜着拍（城门在画面偏左），海在画左（平面图 x 小的一侧）。35 mm、机高 1.5 m。
