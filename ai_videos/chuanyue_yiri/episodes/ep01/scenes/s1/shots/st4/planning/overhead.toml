# r3：年长渔夫比年轻的靠镜头约 0.65 m——照首帧，绳子从船头经过年轻渔夫手里，再斜着绷到年长渔夫手里。
# 背景城景照首帧：城门约在画面横向 28%、神庙脚手架约 51%（按本机位反算约 39% / 61%，以首帧为准）。
# 首帧船头只系着一根绳：两人一前一后攥着这同一根绳，四只手都在这一根绳上（r1-fix 2026-11-14 改正旧注释）。
# 0–2.5 秒拖船约 0.8 m（船头 36.7 → 37.5），两人边拉边往后（画右）倒退约 0.9 m（年轻 → 38.44、年长 → 39.02），
# 和船头的距离一直保持约 0.9 m（I2 / I3 / I7：船头不会顶到年轻渔夫的腿）。年长渔夫 2.5 秒约在画面 68%，仍在 Riley（73% 起）左边。
# 2.5–5.5 秒丢绳（绳头仍系在船头，整根绳落在他们刚才站的沙上），转身走回船边、弯腰：走 2.2–2.6 m，约 0.9 m/s。
# 5.5–8 秒在船靠镜头这一侧（y 54.7）抬筐：年轻 (35.9) 约画面 14%、年长 (36.9) 约 30%；抬过船舷后一起往画右横挪约 1.2 m，
# 筐放在 (37.6, 54.95)：两人 (37.1 / 38.1, 54.65) 中间、靠镜头 0.3 m，约画面横向 40%；绳子在他们身后的沙上。
# Riley (39.0, 57.3) 离镜头约 2.3 m，在画右前景、大腿以上（约 81%）。两条小木船 (40.6, 50.1) 在她身后约 10 m，被她挡住一部分。
# r1-fix（2026-11-14 follow-up 067，pregen r1 审稿 I1/I52/I53/I65/I98）：0–8 秒 Riley 的朝向点改到 (36.8, 56.5)，俯视图上是侧身（与首帧左侧脸一致）；
# 11.7–12 秒她先回头看一眼渔夫再转向镜头、压低声音；12.5–20.5 秒两个渔夫蹲在筐边拢鱼、拣海草、扔小螃蟹，约 13 秒年轻渔夫抬眼看她半秒。

# r2-fix（2026-11-14 follow-up 068，pregen r2 审稿 I8/I48/I125 与用户定的拆镜）：原 st4 拆成两镜。本镜只留 0–12 秒：拖船、丢绳、抬筐、和年轻渔夫对视点头；
# 她转向镜头小声说鱼露那句、渔夫在后面拢鱼，拆到新镜头 st6（同一地点，机位见 st6/planning/overhead.toml）。
# I48：抬筐横挪按本表实际距离写成「两步、约一米半」（筐 36.4,54.0 → 37.6,54.95，约 1.5 m）。I125：拖船时「咬着牙」改成「抿紧嘴、下巴绷着」。
