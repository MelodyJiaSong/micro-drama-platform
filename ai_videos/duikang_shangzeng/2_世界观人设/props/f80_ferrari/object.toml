# f80_ferrari 白模规格 + 验收清单。
#
# 这份文件是 tools/whitemodel_normalize.py 的输入：归一化按它做，验收按它验。
# 写一次，之后**每一次重生成**都自动过同一套验收——换 Rodin、换 Hunyuan3D、
# 换买来的高模、换脚本补件，验收标准不变。
#
# 区域坐标一律**归一化到包围盒 0..1**，与真实尺寸和摆放解耦：
#   x = 车宽方向（0=左 1=右）   y = 车长方向（0=车尾 1=车头）   z = 高（0=接地 1=车顶）

["对象"]
"名称" = "f80_ferrari"
"中文名" = "Ferrari F80"

["几何"]
"尺寸" = [2.06, 4.84, 1.14]        # X宽 × Y长 × Z高，米（真车包围盒）
"容差" = 0.06                       # 等比缩放下，非定标轴允许的相对偏差
"最多松散块" = 60000   # 按首个通过验收的网格校准（Rodin 1M 面实测 46575）。
                      # 生成网格每条缝、每片格栅都是独立壳，几万块是常态；
                      # 这条要抓的是"薄件被甩成碎渣"，不是块数本身

# image-to-3D 的输出朝向是随机的；拿到网格后先看一眼再改这里。
# glTF 系（Rodin / Tripo 多数）常见是 前 -Z / 上 +Y。
"源朝向" = { "前" = "-Y", "上" = "+Z" }   # Rodin GLB 实测：Blender 的 glTF 导入已转 Z-up，车头指向 -Y
"目标朝向" = { "前" = "+Y", "上" = "+Z" }

# ---------------------------------------------------------------- 验收清单
#
# 逐条对应「车头黑条位置在、前轮后竖开口是直的、后轮拱外鼓、泪滴座舱在、
# 尾翼与扩散器在」。薄结构（尾翼/扩散器）是 image-to-3D 最不稳的地方，
# 挂了不是闸门的错——是该重生成或脚本补件的信号。

[["验收"]]
"名称" = "尾翼"
"类型" = "占位"
"区域" = { y = [0.00, 0.20], z = [0.62, 1.00] }
"最少顶点" = 3
"最少面积占比" = 0.010

[["验收"]]
"名称" = "扩散器"
"类型" = "占位"
"区域" = { y = [0.00, 0.16], z = [0.00, 0.22] }
"最少顶点" = 3
"最少面积占比" = 0.008

[["验收"]]
"名称" = "车头黑条"
"类型" = "占位"
"区域" = { y = [0.90, 1.00], z = [0.28, 0.48] }
"最少顶点" = 3
"最少面积占比" = 0.004

[["验收"]]
"名称" = "前分流器"
"类型" = "占位"
"区域" = { y = [0.88, 1.00], z = [0.00, 0.14] }
"最少顶点" = 3
"最少面积占比" = 0.006

# 后轮拱必须鼓出车身中段——这是 F80 侧面剪影最强的识别特征，
# 也是占位探针测不到的那一类（没有硬边，是曲面的鼓）。
[["验收"]]
"名称" = "后轮拱外鼓"
"类型" = "截面对比"
"测量轴" = "x"
"分带轴" = "y"
"带A" = [0.12, 0.34]               # 后轮拱带
"带B" = [0.44, 0.62]               # 车身中段（座舱下方）
"限定" = [0.42, 0.70]              # 只量轮子上方、车顶以下的车身腰段；
                                   # 不限定的话两个带量到的都是外凸的轮子，车身自身的鼓凹被淹没
"关系" = "A > B"
"最小差" = 0.04                     # 米

# 座舱向上收窄成泪滴：车顶带的宽度必须明显小于腰线带。
# 现有脚本 blockout 正是挂在这一条上——它的座舱是个多面楔子。
[["验收"]]
"名称" = "泪滴座舱收窄"
"类型" = "截面对比"
"测量轴" = "x"
"分带轴" = "z"
"带A" = [0.86, 1.00]               # 车顶带
"带B" = [0.40, 0.55]               # 腰线带
"限定" = [0.30, 0.85]              # 沿车长只取座舱段，排除车头车尾
"关系" = "B > A"
"最小差" = 0.25                     # 米

# ---------------------------------------------------------------- 参考图 → 视角映射
#
# tools/whitemodel_generate.py 读这一段喂给多视角模型。键是 mv 模型认的视角名，
# 值是相对本文件的路径。缺哪个视角就不写——不要用近似视角硬填，
# 3/4 视角塞进 back 槽会让重建把车尾拧歪。
#
# f80_ferrari2.png（前左 3/4 锚点）**不参与重建**：mv 只认正交四视角，
# 3/4 没有对应槽位。它的职责是出片时的图 reference 与人眼验收基准。

["参考图"]
front = "f80_ferrari4.png"        # 正前
left  = "f80_ferrari1.png"        # 正侧（车头朝画右 = 看的是车的左舷）

# 轮拱必须包住轮子。这一条是肉眼在白模渲染里看出来的缺陷，占位探针测不到——
# 脚本 blockout 的轮子是四个外凸的圆柱贴在车身上，完全没有轮拱。
# 判法：轮心高度处的车宽，不应比轮子正上方（轮拱位置）的车宽大出多少；
# 大很多＝轮子探在车身外面。这是上界判据，不是下界。
[["验收"]]
"名称" = "轮拱包覆轮子"
"类型" = "截面对比"
"测量轴" = "x"
"分带轴" = "z"
"带A" = [0.18, 0.34]               # 轮心高度带
"带B" = [0.46, 0.58]               # 轮子正上方，轮拱应在的高度
"限定" = [0.10, 0.32]              # 沿车长只取后轮所在段
"关系" = "A > B"
"最大差" = 0.06                     # 米。超过即判定轮子外凸、无轮拱

# ---------------------------------------------------------------- 本清单测得到什么、测不到什么
#
# ⚠ **「全部通过」不等于「这是个好白模」。** 上面这些探针都是**体量测量**，
# 它们能判定的是：
#   · 包围盒 / 原点 / 材质      —— 归一化做没做对
#   · 占位（面积占比）          —— 某个结构**在不在**（有没有被生成整个丢掉）
#   · 截面对比                  —— 大尺度的**比例关系**（外鼓、收窄）
#
# 它们判定不了的是**表面质量与拓扑**：
#   · 轮子是嵌在轮拱里，还是与一块同样宽的车身面齐平——两者宽度读数完全相同
#   · 曲面是真的圆顺，还是若干个平面拼出来的多面体
#   · 型面走向对不对（前轮后竖开口是"直的"这种要求，体量测量无从判断）
#
# 现有脚本 blockout 能过完这份清单，但它的轮子是四个外凸的圆柱、座舱是多面楔子——
# **这些缺陷本清单抓不到，只能靠看白模渲染。**
#
# 阈值校准的正确方向：首个被人眼验收接受的网格落地后跑一遍闸门，
# 按那一版的实测值收紧阈值，那一版即成为此后所有重生成的回归基线。
# 当前这批阈值是按 blockout 定的**下限占位值**，只够检出"结构整个不见了"。

# 朝向判别（防 180° 掉头）。**包围盒抓不住掉头**——车掉个头包围盒一模一样，
# 而掉头会让上面所有按车长分带的探针整体量错另一端，且多半仍"通过"。
# 判据：车尾（有尾翼）比车头（低鼻）高。这是唯一能用体量测量抓住掉头的特征。
[["验收"]]
"名称" = "朝向·车尾高于车头"
"类型" = "截面对比"
"测量轴" = "z"
"分带轴" = "y"
"带A" = [0.00, 0.10]               # 车尾段（目标朝向下 y=0 是车尾）
"带B" = [0.90, 1.00]               # 车头段
"关系" = "A > B"
"最小差" = 0.20                     # 米。实测尾 1.06 / 头 0.63，差 0.43
