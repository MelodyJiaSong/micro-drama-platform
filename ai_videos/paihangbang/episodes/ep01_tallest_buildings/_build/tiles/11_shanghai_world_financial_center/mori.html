crumbs\":{\"ariaLabel\":\"Breadcrumb navigation\",\"top\":\"Top\",\"topics\":\"Topics\",\"information\":\"Information\",\"keywords\":\"KEYWORDS\"},\"sectionIndicator\":{\"ariaLabel\":\"Section navigation\",\"showButtonAriaLabel\":\"Show section navigation button\"},\"navigation\":{\"seeMore\":\"Learn more\",\"companyNavLabel\":\"Company Information Navigation\",\"topics\":\"Topics\",\"contact\":\"Contact\",\"company\":{\"title\":\"Company Information\",\"topMessage\":\"Message from Executive Management\",\"companyOverview\":\"Company Profile\",\"businessContent\":\"Our Businesses\",\"history\":\"History\",\"executives\":\"Board Members\",\"organization\":\"Corporate Organization Chart\",\"groupCompanies\":\"Group Companies\",\"advertising\":\"Ads \u0026 Publications\",\"multiStakeholder\":\"Multi-stakeholder Policy\",\"irInfo\":\"IR Information\",\"financial\":\"Financial Data\"},\"business\":{\"title\":\"Our Businesses\",\"developmentPlanning\":\"Development \u0026 Planning\",\"architecturalDesign\":\"Architectural Design\",\"townManagement\":\"Town Management\",\"office\":\"Office\",\"residential\":\"Residence\",\"retail\":\"Retail\",\"cultural\":\"Culture \u0026 Arts\",\"wellness\":\"Wellness\",\"hotel\":\"Hotel\",\"buildingManagement\":\"Building Management\",\"international\":\"International\",\"resort\":\"Golf \u0026 Resorts\",\"consulting\":\"Consulting\"},\"pressRoom\":{\"title\":\"Press Room\",\"newsRelease\":\"News Releases\"},\"recruitment\":{\"title\":\"採用情報\",\"recruitmentInfo\":\"採用情報\",\"internship\":\"インターン情報\"},\"sustainability\":{\"title\":\"Sustainability\",\"topMessage\":\"Message from Executive Management\",\"promotionSystem\":\"Sustainability-promotion System\",\"environment\":\"Environment\",\"social\":\"Social\",\"governance\":\"Governance\",\"editorialPolicy\":\"Editorial Policy\"}},\"topics\":{\"title\":\"Topics\",\"titleEn\":\"トピックス一覧\",\"description\":\"View topics from Mori Building\",\"relatedLink\":\"Related Link\",\"shareSNS\":\"Share this article on social media\",\"contact\":\"Please address inquires regarding this press release to\"},\"ourStory\":{\"seeDetails\":\"Learn More\",\"metaDescription\":\"Create Cities, Nurture Cities. Discover the story of Mori Building's approach to urban development to strengthen Tokyo's magnetism as a global city.\"},\"newsRelease\":{\"relatedDocuments\":\"Related Documents\",\"documentDetail\":\"For details, please refer to the PDF \"},\"notFound\":{\"title\":\"Not Found\",\"lead\":\"The page you're looking for may be moved, deleted, or temporary unavailable.\u003cbr /\u003ePlease return to the top page/site map to search for what you're looking for.\u003cbr /\u003eWe apologize for any inconvenience.\",\"pageTop\":\"Top Page\",\"siteMap\":\"Site Map\",\"titleCommon\":\"Error\"},\"hillsLife\":{\"title\":\"HILLS LIFE\",\"lead\":\"Cities inspired by the rhythms of daily life.\\nThe richness Hills seeks to realize.\",\"metaDescription\":\"Hills are cities created by Mori Building with human activity at their core. Explore the richness of \\\"HILLS LIFE\\\" where diverse urban functions converge.\",\"body\":\"Cities that give form to Mori Building’s ideals of urban development—that is Hills. The essence of cities lies in the people who live within them. Hills’ urban functions therefore spring from human activities: living and working, as well as learning, playing, connecting, and relaxing. Compact cities where diverse urban functions converge, where activities intertwine in complex, multifaceted ways to generate unique qualities and appeal never before seen. The richness of urban living embodied by Hills—that is Hills Life.\",\"info_title\":\"Facilities \u0026 Events\",\"information\":\"Information\",\"informationEn\":\"インフォメーション\",\"ui\":{\"reading\":\"Continue reading\",\"close\":\"Close\"},\"items\":{\"live\":{\"verb\":\"Live\",\"verbSub\":\"住む\",\"description\":\"Living in the forest\"},\"work\":{\"verb\":\"Work\",\"verbSub\":\"働く\",\"description\":\"Working in the forest\"},\"learn\":{\"verb\":\"Learn\",\"verbSub\":\"学ぶ\",\"description\":\"Learning in the forest\"},\"play\":{\"verb\":\"Play\",\"verbSub\":\"遊ぶ\",\"description\":\"Playing in the forest\"},\"connect\":{\"verb\":\"Connect\",\"verbSub\":\"交流する\",\"description\":\"Connecting in the forest\"},\"relax\":{\"verb\":\"Relax\",\"verbSub\":\"憩う\",\"description\":\"Relaxing in the forest\"}},\"live\":{\"cover\":{\"text\":[\"\u003cspan\u003eCity-enriched living.\u003c/span\u003e\",\"\u003cspan\u003eA wellness living environment where people and nature coexist.\u003c/span\u003e\"]},\"body\":{\"text\":\"Living is the foundation of everything. Hills considers residences a vital element, creating \u003cstrong\u003eworld-class homes\u003c/strong\u003e in central Tokyo. Work. Learn. Play. Connect. Relax. All within walking distance. To live at Hills is to \u003cstrong\u003emake the entire city your home\u003c/strong\u003e. Nature within the city. Peaceful moments with family. Always new encounters. \u003cstrong\u003eArt and culture woven into daily life\u003c/strong\u003e. Urban culture, freedom, convenience—all enriching life. Mori Building’s vision for urban living comes to life here.\"}},\"work\":{\"cover\":{\"text\":[\"\u003cspan\u003eWork in your own way,\u003c/span\u003e\u003cspan\u003etrue to yourself.\u003c/span\u003e\",\"\u003cspan\u003eCollaborate and co-create with others.\u003c/span\u003e\u003cspan\u003eA setting that expands creativity and possibility.\u003c/span\u003e\"]},\"body\":{\"text\":\"Work is a vital part of a rich life. Hills conceives every aspect of its work environment from a human-centered perspective. Learn. Think. Gather. Talk. Co-create. At Hills, work connects and overlaps with every other part of life in the city. \u003cstrong\u003eThe whole city becomes a workspace\u003c/strong\u003e. People \u003cstrong\u003emeet across corporate boundaries\u003c/strong\u003e. Dedicated \u003cstrong\u003eplaces and programs encourage innovation\u003c/strong\u003e. Creating something meaningful begins with \u003cstrong\u003egathering in person\u003c/strong\u003e. For Mori Building, this is the essence of living and working in the city.\"}},\"learn\":{\"cover\":{\"text\":[\"\u003cspan\u003eLearn to grow. \u003c/span\u003e\u003cspan\u003eBroaden your world.\u003c/span\u003e\",\"\u003cspan\u003eEncounters and discoveries enrich life.\u003c/span\u003e\"]},\"body\":{\"text\":\"Learning should be part of everyday life, not something apart from it. A city of constant discovery is one of the best places to learn. Hills offers \u003cstrong\u003emuseums, galleries\u003c/strong\u003e, and other cultural facilities, along with \u003cstrong\u003espaces full of intellectual stimulation\u003c/strong\u003e throughout the neighborhood. Perspectives expand in the \u003cstrong\u003ebusiness community\u003c/strong\u003e. Sensitivity and creativity take root in green, open spaces. Continuing to learn keeps life abundant. For Mori Building, these \u003cstrong\u003ediverse opportunities for learning\u003c/strong\u003e number among the greatest rewards of city living.\"}},\"play\":{\"cover\":{\"text\":[\"\u003cspan\u003eStep into the extraordinary.\u003c/span\u003e\u003cspan\u003eAwaken your senses.\u003c/span\u003e\",\"\u003cspan\u003eNew experiences bring energy for tomorrow.\u003c/span\u003e\"]},\"body\":{\"text\":\"Play is one of life’s essential colors—perhaps the most human of all activities. Hills offers a rich variety of \u003cstrong\u003erestaurants, shops, and other destinations\u003c/strong\u003e, where the \u003cstrong\u003epleasures of the extraordinary are seamlessly connected to everyday life\u003c/strong\u003e. Savor a meal with loved ones. \u003cstrong\u003eJoin an event\u003c/strong\u003e that widens your horizons. These vivid experiences are the very essence of city living, bringing energy for tomorrow. Hills presents many ways to enjoy free time to the fullest through play.\"}},\"connect\":{\"cover\":{\"text\":[\"\u003cspan\u003eConnect across borders and perspectives.\u003c/span\u003e\",\"\u003cspan\u003eEncounters open the door to new ideas and values.\u003c/span\u003e\"]},\"body\":{\"text\":\"The connections we make with others are among the deepest rewards of city life. At Hills, there are many opportunities to meet and engage with people from all walks of life. Welcome global guests in \u003cstrong\u003ewarm, hospitable spaces\u003c/strong\u003e. Gather in open plazas. Meet in \u003cstrong\u003ecoworking spaces and lounges\u003c/strong\u003e. Sometimes chance encounters lead to new cultures; other times, to \u003cstrong\u003enew ideas or innovations\u003c/strong\u003e. Mori Building sees connection as a vital source of energy for shaping the future.\"}},\"relax\":{\"cover\":{\"text\":[\"\u003cspan\u003ePause in the greenery. \u003c/span\u003e\u003cspan\u003eBreathe deeply.\u003c/span\u003e\",\"\u003cspan\u003eFind nature’s calm in the heart of the city.\u003c/span\u003e\"]},\"body\":{\"text\":\"Even in a dynamic, fast-paced city, time to pause and reflect is essential. Hills offers restful \u003cstrong\u003espaces with greenery and water features\u003c/strong\u003e woven throughout the neighborhoods. Rest on the lawn or in the shade, feeling the breeze. Relax at a café or bench overlooking a plaza. \u003cstrong\u003eNature in the city\u003c/strong\u003e brings comfort and renewal, creating space to \u003cstrong\u003erestore mind and body\u003c/strong\u003e between working, learning, and playing. Mori Building believes these moments of restoration are essential for a rich urban life.\"}}},\"projects\":{\"area\":{\"title\":\"Developments\",\"subtitle\":\"Distinctive Hills developments come together.\\nThey strengthen Tokyo's magnetic force.\",\"description\":\"Many of Mori Building's projects are located in the Minato Ward of Tokyo. Here, the heart of the capital meets lush greenery. More than half of all foreign embassies and a quarter of Japan's foreign-affiliated companies are based in this area. Hotels, cultural facilities, and international schools add to its exceptional potential as a global city. Mori Building has made this its strategic area, developing Hills with unique character: Roppongi Hills as \u003citalic\u003eCultural Heart\u003c/italic\u003e, Toranomon Hills as \u003citalic\u003eGlobal Business Center\u003c/italic\u003e, Azabudai Hills as \u003citalic\u003eGreen \u0026 Wellness\u003c/italic\u003e. Each Hills builds on its own identity while coordinating with each other, and together they form a single Hills Area. Several new projects are currently underway. We believe the urban magnetism created here will help drive Tokyo—and Japan—forward.\",\"spec\":{\"office\":\"Office\",\"officeValue\":\"982,000㎡\",\"residential\":\"Residential\",\"residentialValue\":\"4,440戸\"}},\"domestic\":{\"title\":\"Domestic Projects\",\"projects\":{\"azabudai\":\"Azabudai Hills\",\"toranomon\":\"Toranomon Hills\",\"roppongi\":\"Roppongi Hills\",\"ark\":\"ARK Hills\",\"atagoGreen\":\"Atago Green Hills\",\"omotesando\":\"Omotesando Hills\",\"motoazabu\":\"Motoazabu Hills\",\"laforet\":\"Laforet Harajuku\"},\"more\":\"主要ビル・施設一覧\"},\"overseas\":{\"title\":\"International Projects\",\"projects\":{\"shanghai\":\"Shanghai World Financial Center\",\"jakarta\":\"JAKARTA MORI TOWER\"},\"more\":\"主要ビル・施設一覧\"},\"map\":{\"title\":\"森ビルマップ\",\"description\":\"当社が主に開発・運営を手がける港区を中心に、通常の地図としての活用はもちろん、大規模開発予定地や都内に意外と多い緑地、そして身近にある文化施設についても掲載したオリジナルの地図です。\",\"linkText\":\"森ビルマップ2024年度版\",\"linkTextNote\":\"（2025年1月時点）（7.3MB）\",\"ongoing\":\"Project in Progrss\",\"existing\":\"Existing Projects\"}},\"pressrelease\":{\"press\":{\"title\":\"Press Room\",\"titleEn\":\"プレスルーム\",\"description\":\"Please check for media information, such as news releases and media inquiries.\",\"newsRelease\":\"News Release\",\"newsReleaseEn\":\"ニュースリリース\",\"newsTitle\":\"Corporate Information\",\"facilityEventInfo\":\"施設・イベント情報\\nニュースリリース\",\"latestNews\":\"最新のニュースリリース5件を表示しています。\",\"allNews 7d7203f0ab40b6a4fdf5fbf4620b0a/topics_260928_1.webp\",\"height\":1080,\"width\":1920},\"release\":[],\"copy\":\"Mariko Mori: All That Shines\",\"direct_link\":false,\"related_link\":[{\"fieldId\":\"related_link\",\"link_title\":\"Official Website\",\"link_url\":\"https://www.mori.art.museum/en/exhibitions/marikomori/index.html\",\"blank\":true}]}},{\"fieldId\":\"topics_selector\",\"topics_item\":{\"id\":\"jzw0qxwrt2ih\",\"createdAt\":\"2025-09-06T08:18:38.006Z\",\"updatedAt\":\"2025-09-17T06:14:54.593Z\",\"publishedAt\":\"2025-09-06T08:18:38.006Z\",\"revisedAt\":\"2025-09-17T06:14:54.593Z\",\"language\":[\"英語\"],\"img\":{\"url\":\"https://images.microcms-assets.io/assets/3f2dbd9a710d4daaaa8451a27e512959/0d781180b8f4475a9fcb8f5f7dd6b8de/topics_250918_04.jpg\",\"height\":1080,\"width\":1920},\"release\":null,\"copy\":\"Mori Building Brand Movie: “DESIGNING TOKYO”\",\"body\":\"The brand movie of Mori Building, which has been engaged in urban development to make Tokyo the best city in the world. Looking back at Mori Building’s numerous projects including Toranomon Hills and Azabudai Hills, the movie depicts a Tokyo that has robustly evolved together with its people, towards the future. This movie expresses the philosophy of Mori Building, which continues to seek throughout the ages how a city should be. The movie has won two of the Big Three global advertising awards, Cannes Lions and The One Show, as well as numerous other awards in Japan and abroad, including the New York ADC Award, ADFEST, and Galaxy Award. Please take a moment to  watch the movie, recognized from all over the world.\",\"direct_link\":false,\"related_link\":[{\"fieldId\":\"related_link\",\"link_title\":\"Topic Details Page\",\"link_url\":\"/topics/designing-tokyo/\",\"blank\":true},{\"fieldId\":\"related_link\",\"link_title\":\"Mori Building Brand Movie｜DESIGNING TOKYO (2023)\",\"link_url\":\"/company/ad/movies/2023-1/\",\"blank\":true}]}}],\"topics\":[{\"fieldId\":\"topics_selector\",\"topics_item\"
