  "朝向" = -120.0
  "姿态" = "行走"      # 转身退向画左房门

[["角色"]]
"名" = "缠头客商"
"色" = "蓝"
"身高" = 1.70
  [["角色"."关键帧"]]
  t = 0.0
  "位置" = [1.25, 1.30]
  "朝向" = -90.0      # 隔方桌面朝画左的青年；背朝画右木格窗
  "姿态" = "坐"
