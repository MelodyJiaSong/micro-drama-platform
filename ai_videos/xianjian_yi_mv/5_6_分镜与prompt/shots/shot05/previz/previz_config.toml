  "位置" = [-0.30, 0.30]
  "朝向" = 40.0
  "姿态" = "端物"      # 摆开余下三只碗
  [["角色"."关键帧"]]
  t = 5.4
  "位置" = [-0.15, 0.30]
  "朝向" = 55.0
  "姿态" = "伸手"      # 铜钱按进掌心 · 壶被推回
