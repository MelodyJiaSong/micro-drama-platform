  "朝向" = -90.0
  "姿态" = "伸手"      # 抬右手（银器反光那一拍——反光交 Seedance）
  [["角色"."关键帧"]]
  t = 7.0
  "位置" = [1.25, 1.30]
  "朝向" = -90.0
  "姿态" = "坐"

