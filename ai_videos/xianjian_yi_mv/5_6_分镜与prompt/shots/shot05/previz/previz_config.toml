# ============================================================================
# shot05 previz 配置（A 档 · 布局解算）
# ----------------------------------------------------------------------------
# 重跑（仓库根目录）：
#   blender -b --factory-startup --python tools/previz/build_previz.py -- \
#     "ai_videos/xianjian_yi_mv/5_6_分镜与prompt/shots/shot05/previz/previz_config.toml"
#
# 本文件是本镜 3D 层的唯一真相：机位几何 / 构图占比 / 站位朝向 / 尺度 / 时刻。
# 长相、材质、光色、表演质感、银器反光 → 全部交 Seedance，本文件一个字不提。
#
# 世界坐标约定：+X＝画右，-X＝画左，+Y＝画深处，Z＝高度（0＝地面）。
# 朝向：0＝面朝镜头，90＝面朝画右，-90＝面朝画左，180＝背对镜头。
# ============================================================================

["全局"]
shot = "shot05"
fps = 24
total_sec = 10.0

# 不挂场景主档：s1 的二层只有一块楼板与前墙窗、没有建出客房（同 shot02/03），
# 挂上去相机会站到楼板边缘朝外拍。本镜空间由下面的灰模摆件承载。
["机位"]
"俯角" = 0.0          # 与坐姿视平线齐高（prompt：机位与坐姿视平线齐高）
"焦距" = 35.0
"基准主体" = "李逍遥"
"占画高" = 0.5        # prompt：青年占画面高度约二分之一
"横向偏移" = -0.16   # 主体推到画左，给画右的客商留位（prompt：二人隔方桌分居画面左右）

# 单机位沿方桌一侧向画右匀速横移约一米五（prompt 镜头字段）
[["运镜"]]
"类型" = "横移"
"起" = 0.0
"止" = 7.0
"量" = 0.7

