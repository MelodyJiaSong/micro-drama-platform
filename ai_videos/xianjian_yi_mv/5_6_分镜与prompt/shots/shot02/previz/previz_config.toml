# previz 配置（A 档 · 布局解算）—— 本镜 3D 层的唯一真相：机位几何/构图占比/站位朝向/尺度/时刻。
# 长相·材质·光色·表演质感·特效 一律交 Seedance，本文件不提。
# 坐标：+X 画右，-X 画左，+Y 画深处，Z 高度。朝向：0 面朝镜头，90 面朝画右，-90 面朝画左。
# 重跑：blender -b --factory-startup --python tools/previz/build_previz.py -- <本文件>

["全局"]
shot = "shot02"
fps = 24
total_sec = 12.0

# 不挂场景主档：s1 的二层只有一块楼板与前墙窗、没有建出客房，挂上去相机必然
# 解算到隔断墙外或隔窗拍。本镜的空间信息由下面的灰模摆件自己承载。
["机位"]
"俯角" = 30.0                       # 落幅俯视床面
"基准主体" = "李逍遥"
"占画高" = 0.62   # 30° 俯角下竖向被压缩；0.62 才收得到「床占画面下三分之二」
"焦距" = 24.0
"横向偏移" = 0.10                   # 青年落在画右（prompt：青年在床上偏画右）
"起始俯仰偏移" = 100.0              # 起幅垂直仰拍房梁

[["运镜"]]
