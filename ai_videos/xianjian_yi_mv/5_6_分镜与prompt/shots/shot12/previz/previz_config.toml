# ============================================================
#  shot12 预演配置 —— 时长链：只填每个动作的 duration
# ------------------------------------------------------------
#  · 动作顺序固定，逐段首尾相接：每段的开始时刻 = 前面所有段
#    时长之和；整个 shot 的总长 = 所有 duration 相加（自动）。
#  · 改某段 duration，该段内部的细节节拍会等比伸缩，后面的段
#    自动顺延——你只需要在意每段多长。
#  · UI（webapp 打开本文件）：左侧点动作名切换面板，顶部时间轴
#    实时反映各段时长。改完 → 「🎬 Previz 出片」重渲。
#  · 没暴露的细节用脚本默认值；要调哪个细节告诉 Claude 按需加键。
#  · 本配置同时驱动 Blender 预演与 Seedance prompt 的对应数字。
# ============================================================

["总览"]
n_swords = 20       # 剑阵一共几把剑

["体型"]
# 酒剑仙的身形。写人话即可，脚本按实测标定表反查 MPFB 参数（rule 12.16 §0.2）。
body_height_m = 1.80     # 目标身高（米）
body_build = 0.60        # 体格：0 瘦 → 1 壮
body_age = 0.62          # 年龄档：**必须 ≥0.5**；低于 0.5 是儿童生长曲线，会把人压矮一截
body_gender = 1.0        # 1 男 / 0 女
body_proportions = 0.55  # 比例：0 敦实 → 1 修长

["机位"]
tilt_deg = 20.0     # 俯角（度）。调大＝更俯拍（太大庙会出画）；调小＝更平视
subj_frac = 0.22    # 人占画面高度的比例（0.22≈1/4.5）。调大＝人更大更清楚
pull_factor = 1.30  # 「齐冲天」那段机位拉远的倍数。1.0＝不拉远

# ─────────────── 第一幕 ───────────────

[["动作"]]
"名称" = "1 旋身斜落砸地"
dur_fall = 2.70     # 本段时长（秒）：从首帧空场到落地起身站定
fall_spins = 5      # 下落中绕体轴转几圈

[["动作"]]
"名称" = "2 饮酒与晃身"
dur_drink = 1.60    # 本段时长：抵唇灌酒 + 醉意一晃即稳

[["动作"]]
"名称" = "3 抛葫芦"
dur_gourd = 1.02    # 本段时长：甩腕抛出 + 葫芦落地翻滚停住

[["动作"]]
"名称" = "4 掐诀跺脚"
dur_seal = 0.88     # 本段时长：两手掐诀 + 右脚快跺
stomp_count = 3     # 右脚快跺几下
seal_elbow_flare = 40  # 掐诀时肘部朝向（度）：0=肘尖垂直垂在肩下贴身，越大越向外拐，负数=向身前里夹

[["动作"]]
"名称" = "5 剑自背后飞到身前"
dur_sword_in = 2.05 # 本段时长：出鞘、越过头顶、身前悬停（竖直剑尖朝下）

[["动作"]]
"名称" = "6 地面剑光圈外扩"
dur_rings = 1.55    # 本段时长：光环一圈圈外扩到最大定住
ring_count = 4      # 一共几圈光环

[["动作"]]
"名称" = "7 剑指弓步 → 剑绕身一圈（第一幕戏眼）"
dur_orbit = 2.30    # 本段时长：亮剑指、踩弓步、剑绕身
orbit_time = 1.10   # 其中绕身一圈的用时。越小越快越凌厉（须小于本段时长）
orbit_r = 2.10      # 绕身半径（米）。太小剑影会叠在人身上（建议不小于 1.5）
finger_elbow_flare = 40  # 剑指时横抱胸前那条手臂的肘部朝向（度）：0=贴身垂下，越大越向外拐，负数=向里夹

[["动作"]]
"名称" = "8 光柱裹身"
dur_pillar = 1.90   # 本段时长：光柱升起、到顶、自顶端散尽

[["动作"]]
"名称" = "9 剑归掌立定（第一幕收拍）"
dur_grip = 1.00     # 本段时长：剑落回右掌（全镜唯一一次手碰剑）、收势立定

# ─────────────── 第二幕 ───────────────

[["动作"]]
"名称" = "10 两剑斩出双沟"
dur_slash = 1.50    # 本段时长：两剑连斩，剑气犁开直沟与月牙沟

[["动作"]]
"名称" = "11 抛剑高悬 → 闭眼结印"
dur_throw = 1.50    # 本段时长：抛剑到高空停住 + 闭眼结印蓄势

[["动作"]]
"名称" = "12 一化多成环"
dur_split = 1.40    # 本段时长＝一变多的展开过程。要慢，给特效留戏

[["动作"]]
"名称" = "13 剑环慢转"
dur_spin = 2  # 本段时长＝转完全部圈数的用时。圈数不变时越小转得越快
spin_turns = 1      # 慢转几圈

[["动作"]]
"名称" = "14 齐冲夜空 + 机位拉远（全镜最大的一下）"
dur_rise = 0.70     # 本段时长：全部剑冲出画面上缘（机位同时拉远）

[["动作"]]
"名称" = "15 睁眼亮相 → 剑群插地成环"
dur_drop = 2.18     # 本段时长：亮相 + 一把接一把砸下插地围成剑环

[["动作"]]
"名称" = "16 单脚跳旋 → 踩剑悬空"
dur_jump = 1.14     # 本段时长：跳起转体、群剑归一到脚下、踩上震两下
air_spins = 2       # 空中绕体轴转几圈

[["动作"]]
"名称" = "17 跃开翻跟斗落地"
dur_flip = 0.73     # 本段时长：跃开、空翻、双脚落地
flip_count = 2      # 翻几个前空翻

[["动作"]]
"名称" = "18 剑归背鞘"
dur_sheath = 0.40   # 本段时长：剑冲天掉头、垂直落回插入背鞘（剑光灭）

[["动作"]]
"名称" = "19 仰头大笑（收拍定格）"
dur_laugh = 0.85    # 本段时长：大笑肩背起伏三下、定格收拍
