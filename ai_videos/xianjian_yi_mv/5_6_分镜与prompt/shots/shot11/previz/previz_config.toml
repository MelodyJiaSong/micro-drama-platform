# previz 配置（A 档 · 布局解算）—— 本镜 3D 层的唯一真相：机位几何/构图占比/站位朝向/尺度/时刻。
# 长相·材质·光色·表演质感·特效 一律交 Seedance，本文件不提。
# 坐标：+X 画右，-X 画左，+Y 画深处，Z 高度。朝向：0 面朝镜头，90 面朝画右，-90 面朝画左。
# 重跑：blender -b --factory-startup --python tools/previz/build_previz.py -- <本文件>

["全局"]
shot = "shot11"
fps = 24
total_sec = 20.0

# 不挂场景主档：s11 是起伏地形，而本镜人物要走 11 米——引擎目前只对「原点」贴地、
# 不对每个关键帧贴地，挂真场景会出现相机被地形埋住、人物陷进坡里。
# 已知缺口（见 changelog 055）：户外走位逐帧贴地。本镜先用灰模坡地承载调度。
["机位"]
"俯角" = -2.0                       # 机位压到草尖高度
"焦距" = 35.0
"基准主体" = "李逍遥"
"占画高" = 0.17                     # 大远景：他只占画面高度约六分之一
"横向偏移" = 0.0
"锁定主体" = true               # 他自 14m 外走到 2.6m，相机不盯着他就只剩空景

[["运镜"]]
"类型" = "后拉"
"起" = 0.0
"止" = 14.0
"量" = 9.0                          # 在人物正前方沿坡径匀速后退、越退越慢

[["角色"]]
"名" = "李逍遥"
"色" = "绿"
"身高" = 1.75
  [["角色"."关键帧"]]
  t = 0.0
  "位置" = [0.0, 14.0]              # 自画面深处逆风走向镜头
  "朝向" = 0.0
  "姿态" = "行走+伸手"              # 一手横在身前拨草
  [["角色"."关键帧"]]
  t = 9.0
  "位置" = [0.0, 5.20]
  "朝向" = 0.0
  "姿态" = "行走"
  [["角色"."关键帧"]]
  t = 12.0
  "位置" = [0.0, 2.60]
  "朝向" = 0.0
  "姿态" = "站"                     # 在石阶前停住
  [["角色"."关键帧"]]
  t = 14.0
  "位置" = [0.0, 2.60]
  "朝向" = -35.0
  "姿态" = "站"                     # 头转向坡下张望
  [["角色"."关键帧"]]
  t = 15.2
  "位置" = [0.0, 2.60]
  "朝向" = -35.0
  "姿态" = "站"                     # 忽然定住：换重心停在半途
  [["角色"."关键帧"]]
  t = 20.0
  "位置" = [0.0, 2.60]
  "朝向" = -35.0
  "姿态" = "站"

[["道具"]]
"名" = "三级石阶"                   # 落幅尺度参照：只到他腰
"形" = "box"
"尺寸" = [4.00, 1.40, 0.95]
"位置" = [0.0, 1.20, 0.0]
"色" = "灰"
[["道具"]]
"名" = "庙檐"                       # 落幅在画面上缘只露一角
"形" = "box"
"尺寸" = [5.20, 3.00, 0.45]
"位置" = [0.0, 2.60, 3.10]
"色" = "深灰"
[["道具"]]
"名" = "前景草穗"                   # 遮住画面左六分之一
"形" = "box"
"尺寸" = [0.55, 0.30, 0.75]
"位置" = [-1.30, -8.20, 0.0]
"色" = "黄"

[["道具"]]
"名" = "坡地"
"形" = "plane"
"尺寸" = [40.0, 46.0]
"位置" = [0.0, 8.0, 0.0]
"色" = "深灰"
