<script>const D=[{"id": "PL00", "name": "存在之链", "name_en": "The Great Chain of Being", "category": "宇宙与位面·宇宙结构", "function": "欧洲中世纪至文艺复兴的宇宙秩序观：一切存在从高到低排成一条链——神、天使、人、动物、植物、矿物。每一环有固定的位置，越级被视为僭越。本库用它统一位面与种族的上下关系。", "visual_signature": "可作为片头或设定图的竖向阶梯意象。", "xianxia": {"concept": "三界六道（参照）", "note": "差异：存在之链是「秩序与位格」的阶梯，不讲轮回；越级的冲动（人想成神、天使想做人）本身就是西方戏剧的核心冲突。"}, "familiarity": "中", "img": "entries/pl00/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "PL01", "name": "凡世", "name_en": "The Mortal Realm", "category": "宇宙与位面·诸界", "function": "凡人居住的世界：王国、森林、山脉与海洋。各界在这里交汇，所以所有存在都想进入或控制它。", "visual_signature": "写实的中世纪欧洲风景。", "xianxia": {"concept": "人间界（参照）"}, "familiarity": "高", "img": "entries/pl01/anchor_v1.png", "status": "reviewed"}, {"id": "PL02", "name": "天界", "name_en": "The Celestial Heavens", "category": "宇宙与位面·诸界", "function": "天使与圣光的居所：一层层向上的光之领域，越高越纯、越难以凡躯进入。只有圣徒的灵魂与被召见者能到达。", "visual_signature": "层层叠起的光之平台、白金色云海、巨大而简洁的建筑。", "xianxia": {"concept": "天庭 / 仙界（参照）"}, "familiarity": "高", "img": "entries/pl02/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "PL03", "name": "地狱", "name_en": "The Infernal Pit", "category": "宇宙与位面·诸界", "function": "恶魔的国度：一层层向下的环形深渊，每一层惩罚一种罪，由一位恶魔君王统治。灵魂是这里的货币。", "visual_signature": "漏斗状的巨大深坑、熔岩河、黑曜石城堡，最底层反而是冰。", "xianxia": {"concept": "魔界 / 地狱（参照）"}, "familiarity": "高", "img": "entries/pl03/anchor_v1.png", "status": "reviewed"}, {"id": "PL04", "name": "冥界", "name_en": "The Underworld", "category": "宇宙与位面·诸界", "function": "死者之地：灵魂渡过冥河，由冥界判官审判后去往安息之野、至福之地或深渊。本库默认死者安息、不轮回；未安息的亡灵就是没能渡河的灵魂。", "visual_signature": "灰色的河、雾、无色的平原与渡船。", "xianxia": {"concept": "幽冥地府（参照）", "note": "希腊冥界也有判官（米诺斯、拉达曼提斯、埃阿科斯）与分途；柏拉图厄尔神话里灵魂喝遗忘河水后转世，凯撒记载德鲁伊信灵魂转生——采用剧可打开「转生」模块。"}, "familiarity": "高", "img": "entries/pl04/anchor_v1.png", "status": "reviewed"}, {"id": "PL05", "name": "妖精国度", "name_en": "The Otherworld (Faerie)", "category": "宇宙与位面·诸界", "function": "与凡世并行的妖精之地：永恒的黄昏或盛夏、过于鲜艳的色彩。一夜等于凡世百年，吃了这里的食物就回不去。", "visual_signature": "饱和而柔和的色彩、发光的植物、永不落下的黄昏。", "xianxia": {"concept": "洞天福地 / 仙境（参照）", "note": "「山中方一日，世上已千年」在西方有完全对应的凯尔特传说。"}, "familiarity": "高", "img": "entries/pl05/anchor_v1.png", "status": "reviewed"}, {"id": "PL06", "name": "元素界", "name_en": "The Elemental Realms", "category": "宇宙与位面·诸界", "function": "火、水、土、风四大元素的本源之地，元素生灵的故乡。在边界处元素彼此交融（熔岩海、雷雨云、冰川）。", "visual_signature": "单一元素铺满整个视野的世界。", "xianxia": {"concept": "五行本源 / 元素秘境（参照）"}, "familiarity": "中", "img": "entries/pl06/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "PL07", "name": "以太之海", "name_en": "The Aether Sea", "category": "宇宙与位面·诸界", "function": "诸界之间的星光之海：以太构成，神与传说者的灵魂在此航行。法师灵魂出窍到极远处便会抵达这里。", "visual_signature": "深蓝与虹彩的星云之海，漂浮着岛屿般的遗迹。", "xianxia": {"concept": "虚空 / 星海（参照）"}, "familiarity": "中", "img": "entries/pl07/anchor_v1.png", "status": "reviewed"}, {"id": "PL08", "name": "外域虚空", "name_en": "The Outer Void", "category": "宇宙与位面·诸界", "function": "一切秩序之外的黑暗：没有元素、没有光、没有名字。那里的存在不属于存在之链，接触它们会使人疯狂。", "visual_signature": "绝对的黑暗中隐约可见难以名状的巨大轮廓。", "xianxia": {"concept": "域外天魔（参照）"}, "familiarity": "中", "img": "entries/pl08/anchor_v1.png", "status": "reviewed"}, {"id": "PL09", "name": "梦境", "name_en": "The Dreamlands", "category": "宇宙与位面·诸界", "function": "所有凡人梦境相连的地方：先知与汞阶以上者可以有意识地进入，进入他人的梦、在梦中会面或施加噩梦。", "visual_signature": "不合逻辑地拼接的场景、颠倒的楼梯、柔和失焦的光。", "xianxia": {"concept": "梦道 / 入梦之术（参照）"}, "familiarity": "中", "img": "entries/pl09/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "PL10", "name": "地脉与圣地", "name_en": "Ley Lines & Holy Places", "category": "宇宙与位面·诸界", "function": "大地之下流动的力量之脉，交汇处便是圣地：巨石圈、圣泉、古墓丘、大教堂都建在交汇点上。以太晶在这里生长，各界的门也在这里最薄。", "visual_signature": "地面隐约发光的线条汇向一圈立石。", "xianxia": {"concept": "灵脉 / 洞天福地（参照）"}, "familiarity": "中", "img": "entries/pl10/anchor_v1.png", "status": "reviewed"}, {"id": "PS01", "name": "奥术", "name_en": "Arcane", "category": "力量源与魔法·奥术", "function": "靠学习掌握的理性魔法：从地脉和空气中汲取魔力，用咒文、手势和法阵塑形。", "visual_signature": "冷紫到电蓝的光，几何法阵、悬浮符文环，粒子呈细砂状。", "xianxia": {"concept": "灵气 / 法修", "note": "都是「天地间有游离能量，凭方法引导」。差异：奥术是学术——靠公式、语言与知识积累，不讲心性与炼化入体；能承载多少魔力取决于灵魂的金属位阶（见位阶）。"}, "familiarity": "高", "img": "entries/ps01/anchor_v1.png", "status": "reviewed"}, {"id": "SC01", "name": "防护系", "name_en": "Abjuration", "category": "力量源与魔法·奥术", "function": "护盾、结界、驱散与封印：阻挡伤害、拆解别人的法术。", "visual_signature": "半透明六角蜂巢光盾，裂开时像冰面开裂。", "xianxia": {"concept": "防御法术 / 结界 / 禁制", "note": "对应护体灵光、结界阵和禁制；「驱散魔法」相当于破禁。"}, "familiarity": "中", "img": "entries/sc01/anchor_v1.png", "status": "reviewed"}, {"id": "SC02", "name": "咒法系", "name_en": "Conjuration", "category": "力量源与魔法·奥术", "function": "召唤生物与物品、传送：把东西从别处「拉」过来。", "visual_signature": "地面法阵中旋转的门洞，空气撕裂边缘的星光。", "xianxia": {"concept": "召唤术 / 传送阵 / 搬运术", "note": "召唤契约兽、挪移、乾坤袋式的空间术。"}, "familiarity": "高", "img": "entries/sc02/anchor_v1.png", "status": "reviewed"}, {"id": "SC03", "name": "预言系", "name_en": "Divination", "category": "力量源与魔法·奥术", "function": "看见远方、过去与未来，识破谎言与伪装。", "visual_signature": "水镜、水晶球、眼睛形状的光、星图。", "xianxia": {"concept": "推演天机 / 神识探查 / 卜算", "note": "对应推演、窥天机、神识扫视；同样有「天机反噬」式的代价。"}, "familiarity": "高", "img": "entries/sc03/anchor_v1.png", "status": "reviewed"}, {"id": "SC04", "name": "惑控系", "name_en": "Enchantment", "category": "力量源与魔法·奥术", "function": "影响心智：魅惑、催眠、恐惧、命令。", "visual_signature": "粉紫色丝线缠绕目标头部，目标瞳孔泛起同色光环。", "xianxia": {"concept": "魅术 / 摄魂术 / 迷魂", "note": "对应魅惑与摄魂；在西方短剧里常与爱情线结合（被魅惑的爱是不是真的）。"}, "familiarity": "高", "img": "entries/sc04/anchor_v1.png", "status": "reviewed"}, {"id": "SC05", "name": "塑能系", "name_en": "Evocation", "category": "力量源与魔法·奥术", "function": "直接释放能量：火球、闪电、冰锥——最「爽」的战斗魔法。", "visual_signature": "高亮度的能量弹与爆炸，形状简单、冲击感强。", "xianxia": {"concept": "攻击法术 / 五行术法", "note": "对应火球术、掌心雷之类直接输出的术法；与元素轴交叉（火系塑能 = 火球）。"}, "familiarity": "高", "img": "entries/sc05/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "SC06", "name": "幻术系", "name_en": "Illusion", "category": "力量源与魔法·奥术", "function": "欺骗感官：幻影、隐身、伪装、虚假的声音。", "visual_signature": "空气像热浪扭曲；幻影边缘有棱镜色散。", "xianxia": {"concept": "幻术 / 障眼法 / 易容", "note": "对应幻阵、障眼法、易容术。"}, "familiarity": "高", "img": "entries/sc06/anchor_v1.png", "status": "reviewed"}, {"id": "SC07", "name": "死灵系", "name_en": "Necromancy", "category": "力量源与魔法·奥术", "function": "操纵生与死：唤起亡者、吸取生命、与亡魂对话。", "visual_signature": "骨骼、黑雾、青绿鬼火，尸体眼中亮起同色光。", "xianxia": {"concept": "鬼道 / 驭尸 / 炼魂", "note": "见力量源「暗影与死亡」；学派层面是可学的技术。"}, "familiarity": "高", "img": "entries/sc07/anchor_v2.png", "status": "reviewed"}, {"id": "SC08", "name": "变化系", "name_en": "Transmutation", "category": "力量源与魔法·奥术", "function": "改变物质与形体：点石成金、变形、强化、加速。", "visual_signature": "物质表面像液体一样流动重组，金属光泽蔓延。", "xianxia": {"concept": "变化之术 / 点石成金 / 七十二变", "note": "对应变化术、点化与炼体增幅；与炼金术相通。"}, "familiarity": "高", "img": "entries/sc08/anchor_v1.png", "status": "reviewed"}, {"id": "EL07", "name": "光与星辰", "name_en": "Astromancy (Light & Stars)", "category": "力量源与魔法·奥术", "function": "借星辰与纯光：照明、致盲、星象预兆、坠星。", "visual_signature": "冷白星点、星座连线、银色光尘。", "xianxia": {"concept": "星辰之力 / 光系 / 观星", "note": "对应星辰法、观星术；与圣光区分——星光是冷的、理性的，不靠信仰。"}, "familiarity": "中", "img": "entries/el07/anchor_v1.png", "status": "reviewed"}, {"id": "EL08", "name": "时间与空间", "name_en": "Chronomancy", "category": "力量源与魔法·奥术", "function": "减速、加速、短暂回溯、空间折叠：最稀有、最危险。", "visual_signature": "钟表齿轮状光环、凝固的雨滴、残影。", "xianxia": {"concept": "时空法则（参照）", "note": "欧洲传统里几乎没有可操纵时间的魔法，属于现代奇幻；本库设为可选模块：回溯最多数秒（默认），不能改变已确定的大事件。"}, "familiarity": "中", "img": "entries/el08/anchor_v1.png", "status": "reviewed"}, {"id": "PS02", "name": "神圣 / 圣光", "name_en": "Holy Light (Divine)", "category": "力量源与魔法·神圣 / 圣光", "function": "来自信仰、誓言与神恩的力量：施术者把坚定的信念变成光，治愈、守护、审判邪物。", "visual_signature": "温暖的金白光，从内向外放射，光柱自天而降，羽毛状光粒，金色符环。", "xianxia": {"concept": "功德金光 / 愿力 / 浩然正气 / 佛光（参照）", "note": "本库默认形而上学：圣光由信念点燃；众多信者的信念汇聚成神（以太阶），神再回应信者。采用剧可改为「神赐予」或「无神，纯信念」（见神与信仰 GD）。誓言破了力量就熄灭。"}, "familiarity": "高", "img": "entries/ps02/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "HL01", "name": "圣愈", "name_en": "Restoration (Healing Light)", "category": "力量源与魔法·神圣 / 圣光", "function": "治愈伤口、净化毒与疾病、安抚灵魂；高阶可接断肢、救濒死。", "visual_signature": "金白柔光从手掌渗入伤口，伤口边缘光丝缝合。", "xianxia": {"concept": "疗伤术 / 回春 / 佛门度化", "note": "西方高阶治疗以「按手礼」（laying on of hands）为标志动作。"}, "familiarity": "高", "img": "entries/hl01/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "HL02", "name": "圣裁", "name_en": "Smite (Judgment)", "category": "力量源与魔法·神圣 / 圣光", "function": "把圣光灌进武器或从天而降，对邪物、亡灵、恶魔造成成倍伤害。", "visual_signature": "武器燃起金白圣焰，命中处炸开日轮形光爆。", "xianxia": {"concept": "雷法正法 / 降魔 / 天罚", "note": "像正道雷法专克邪祟；对人类的效果取决于对方的罪孽（叙事上可用来揭露伪善者）。"}, "familiarity": "高", "img": "entries/hl02/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "HL03", "name": "圣域", "name_en": "Consecration (Sanctuary)", "category": "力量源与魔法·神圣 / 圣光", "function": "把一块地方变成圣地：邪物不能进入，盟友得到庇护，持续数小时到数百年。", "visual_signature": "地面金色圆环纹样，空气中飘浮光尘，边界处邪物冒烟。", "xianxia": {"concept": "护山大阵 / 佛门结界 / 镇邪之地", "note": "教堂、修道院、圣井都是天然圣域，相当于福地与护宗阵。"}, "familiarity": "中", "img": "entries/hl03/anchor_v1.png", "status": "reviewed"}, {"id": "HL04", "name": "驱魔", "name_en": "Exorcism", "category": "力量源与魔法·神圣 / 圣光", "function": "把附身的恶魔或亡魂从人、物、地方中赶出去，送回原处。", "visual_signature": "被附身者身上冒出黑烟，被金光一点点逼出。", "xianxia": {"concept": "驱邪 / 镇魂 / 超度", "note": "对应道门驱邪与佛门超度；西方驱魔往往需要知道恶魔的真名。"}, "familiarity": "高", "img": "entries/hl04/anchor_v3.png", "status": "reviewed"}, {"id": "PS03", "name": "自然 / 原初", "name_en": "Primal (Nature)", "category": "力量源与魔法·自然 / 原初", "function": "与活着的世界缔约：森林、野兽、季节与大地的生命力，借给守护它们的人。", "visual_signature": "苔绿与琥珀，藤蔓和根须快速生长，花瓣、孢子与萤火虫状光点。", "xianxia": {"concept": "木灵之力 / 妖修本源 / 草木精气", "note": "力量不归施术者所有，是自然「借」的；破坏自然就会被收回，同妖修离不开本相与栖地。"}, "familiarity": "高", "img": "entries/ps03/anchor_v1.png", "status": "reviewed"}, {"id": "PR01", "name": "变形术", "name_en": "Shapeshifting", "category": "力量源与魔法·自然 / 原初", "function": "化身为兽：德鲁伊靠自然之力主动变形，狼人等则是血脉/诅咒被动变形。", "visual_signature": "骨骼扭曲、毛发蔓延，变形中的身体处于半人半兽。", "xianxia": {"concept": "化形（反向）/ 妖修本相", "note": "仙侠是妖化人形，西方多是人化兽形——方向相反，剧作上可做对照。"}, "familiarity": "高", "img": "entries/pr01/anchor_v1.png", "status": "reviewed"}, {"id": "PR02", "name": "赛兹与先灵", "name_en": "Seiðr (Spirit-calling)", "category": "力量源与魔法·自然 / 原初", "function": "北欧女先知的通灵术：坐上高座、手持饰铜头镶石的长杖，由一位女子独唱守护之歌（varðlokkur）、众女围成圈，歌声引来诸灵，女先知再向它们问询未来、请求庇佑。以祖墓、立石与圣井为锚点。", "visual_signature": "高座、饰铜头镶石的长杖、深蓝斗篷与白猫皮手套、围圈的女子与歌声，周围浮现半透明的祖先与土地之灵。", "xianxia": {"concept": "巫祝 / 请神（参照）", "note": "对应上古巫祝和请神上身；萨满是「中间人」，不拥有力量。"}, "familiarity": "中", "img": "entries/pr02/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "PS04", "name": "元素", "name_en": "Elemental", "category": "力量源与魔法·元素", "function": "火、水、土、风四大元素（及衍生的冰、雷）有自己的灵性；元素使不是计算元素，而是与元素之灵谈判。", "visual_signature": "每种元素各自的物质感：真火、真水、真石，不是抽象光。", "xianxia": {"concept": "五行 / 灵根属性", "note": "西方经典是四元素（火水土风）+ 第五元素以太，而非五行；本库加冰、雷两个衍生，凑出与仙侠「五行+风雷冰」相近的覆盖。元素亲和度 ≈ 灵根属性。"}, "familiarity": "高", "img": "entries/ps04/anchor_v1.png", "status": "reviewed"}, {"id": "EL01", "name": "火系", "name_en": "Pyromancy", "category": "力量源与魔法·元素", "function": "控火、爆燃、热浪：最常见的战斗元素。", "visual_signature": "真实火焰，核心发白。", "xianxia": {"concept": "火灵根 / 火系术法 / 丹火", "note": "同火灵根；西方没有「丹火」概念，炼金用普通炉火+火元素。"}, "familiarity": "高", "img": "entries/el01/anchor_v1.png", "status": "reviewed"}, {"id": "EL02", "name": "水系", "name_en": "Hydromancy", "category": "力量源与魔法·元素", "function": "控水、治疗、潮汐与水下呼吸。", "visual_signature": "悬浮的透明水流，折射光线。", "xianxia": {"concept": "水灵根 / 水系术法", "note": "同水灵根，兼有治疗。"}, "familiarity": "中", "img": "entries/el02/anchor_v1.png", "status": "reviewed"}, {"id": "EL03", "name": "土系", "name_en": "Geomancy", "category": "力量源与魔法·元素", "function": "控土石金属、造墙、地震、感知地脉。", "visual_signature": "岩石碎块悬浮、地面裂开，矿脉发光。", "xianxia": {"concept": "土灵根 / 金灵根（部分） / 地脉", "note": "西方土元素包含金属与矿物，覆盖仙侠的土与部分金。"}, "familiarity": "中", "img": "entries/el03/anchor_v1.png", "status": "reviewed"}, {"id": "EL04", "name": "风系", "name_en": "Aeromancy", "category": "力量源与魔法·元素", "function": "控风、飞行、加速、真空与声音。", "visual_signature": "可见的气流螺旋带着尘与叶。", "xianxia": {"concept": "风灵根（变异灵根）/ 御风", "note": "仙侠风为变异灵根，西方风是古典四元素之一，地位更基础。"}, "familiarity": "中", "img": "entries/el04/anchor_v1.png", "status": "reviewed"}, {"id": "EL05", "name": "冰系", "name_en": "Cryomancy", "category": "力量源与魔法·元素", "function": "冻结、冰甲、冰锥、寒冬：水与风的衍生。", "visual_signature": "白蓝冰晶迅速生长，霜纹蔓延，雪雾。", "xianxia": {"concept": "冰灵根（变异灵根）", "note": "同冰灵根；北方民族与冬季题材标配。"}, "familiarity": "高", "img": "entries/el05/anchor_v1.png", "status": "reviewed"}, {"id": "EL06", "name": "雷系", "name_en": "Storm (Electromancy)", "category": "力量源与魔法·元素", "function": "闪电、雷鸣、风暴：速度最快、破坏力最集中。", "visual_signature": "分叉的白紫闪电，空气电离的蓝光。", "xianxia": {"concept": "雷灵根 / 雷法", "note": "同雷灵根与雷法；西方雷电多与天空神（宙斯、托尔）相连，带「天罚」意味，可与圣光结合成审判之雷。"}, "familiarity": "高", "img": "entries/el06/anchor_v1.png", "status": "reviewed"}, {"id": "PS05", "name": "暗影与死亡", "name_en": "Shadow & Death", "category": "力量源与魔法·暗影与死亡", "function": "来自死者、灵魂与黑暗的能量：操纵亡魂、吸取生命、在影子里行走。不等于邪恶，但几乎总被禁止。", "visual_signature": "黑雾与苍白冷光（蓝绿色鬼火），骨质、灰烬、半透明魂影。", "xianxia": {"concept": "阴气 / 鬼修 / 尸修", "note": "对应阴气与鬼道：借死者之力、炼魂、驱尸。差异：西方死灵术常是「学派」（可学），仙侠鬼修多是「族类」（死后成鬼）。本库两者都有：死灵法师（职业）与亡灵（种族）。"}, "familiarity": "高", "img": "entries/ps05/anchor_v2.png", "status": "reviewed"}, {"id": "DK04", "name": "灵魂术", "name_en": "Soul Magic", "category": "力量源与魔法·暗影与死亡", "function": "抽取、封存、分裂、转移灵魂：做护命匣、灵魂宝石、附身他人。", "visual_signature": "从胸口抽出的发光灵魂（人形光雾），被吸入宝石。", "xianxia": {"concept": "元神之术 / 夺舍 / 分魂", "note": "直接对应夺舍与分魂寄托；巫妖护命匣 ≈ 本命魂器。"}, "familiarity": "中", "img": "entries/dk04/anchor_v2.png", "status": "reviewed"}, {"id": "DK03", "name": "巫术与诅咒", "name_en": "Hexcraft (Witchcraft & Curses)", "category": "力量源与魔法·暗影与死亡", "function": "民间魔法：草药、人偶、月相与诅咒。慢、隐蔽、难解。", "visual_signature": "草药、蜡烛、乌鸦羽、人偶，紫黑烟雾。", "xianxia": {"concept": "蛊术 / 厌胜 / 降头", "note": "像蛊与厌胜之术：人偶、头发、生辰。西方女巫题材是欧美观众最熟悉的魔法之一。"}, "familiarity": "高", "img": "entries/dk03/anchor_v2.png", "status": "reviewed"}, {"id": "PS06", "name": "深渊 / 地狱之力", "name_en": "Infernal (Abyssal)", "category": "力量源与魔法·深渊", "function": "恶魔的力量：通过契约、献祭或附身获得，强大而快速，但每一分力量都有利息。", "visual_signature": "暗红与熔岩橙的地狱火，焦黑裂纹，硫磺烟，火焰中带黑色。", "xianxia": {"concept": "魔气 / 魔修 / 魔功", "note": "最接近魔道：速成、吞噬、以代价换力量，并伴随心魔（恶魔低语）。差异：西方的核心机制是「契约」（白纸黑字、有漏洞可钻），仙侠魔功更多是功法。"}, "familiarity": "高", "img": "entries/ps06/anchor_v1.png", "status": "reviewed"}, {"id": "DK01", "name": "契约魔法", "name_en": "Pact Magic", "category": "力量源与魔法·深渊", "function": "向强大存在（恶魔、妖精王、古神、亡灵君主）借力，以条款换力量。", "visual_signature": "空中燃烧的契约羊皮纸，手腕上缠绕的黑色印记。", "xianxia": {"concept": "魔道契约 / 血契 / 以寿换力", "note": "西方独有的「法律化」魔法：契约有条款、期限、漏洞。剧作价值极高。"}, "familiarity": "高", "img": "entries/dk01/anchor_v1.png", "status": "reviewed"}, {"id": "PS07", "name": "血脉", "name_en": "Bloodline", "category": "力量源与魔法·血脉", "function": "与生俱来的力量：祖先中有龙、天使、恶魔或妖精，力量在血里，靠觉醒而非学习。", "visual_signature": "力量从血管透光：龙血金红、天使血金白、恶魔血暗红、妖精血银绿；瞳孔变化。", "xianxia": {"concept": "血脉 / 神体 / 先天灵根", "note": "几乎一一对应：血脉浓度、返祖、觉醒。西方血脉更常带「诅咒」一面（狼人、吸血鬼）。"}, "familiarity": "高", "img": "entries/ps07/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "DK02", "name": "血魔法", "name_en": "Blood Magic (Hemomancy)", "category": "力量源与魔法·血脉", "function": "以血为燃料与媒介：用自己或他人的血施法、操控他人体内的血。", "visual_signature": "悬空的血滴与血线，暗红光。", "xianxia": {"concept": "血道魔功 / 血遁 / 燃血秘术", "note": "对应燃血秘术和血道；用别人的血即入魔道。"}, "familiarity": "中", "img": "entries/dk02/anchor_v1.png", "status": "reviewed"}, {"id": "PS08", "name": "符文与工艺", "name_en": "Runecraft", "category": "力量源与魔法·符文与工艺", "function": "把力量刻进物质：符文、铭文和附魔让物品自己发挥作用，不需要施法者在场。", "visual_signature": "刻痕里流动的熔金或冰蓝光线，锻打火花，石与金属上的棱角形刻纹。", "xianxia": {"concept": "符箓 / 炼器 / 阵法", "note": "对应制符与炼器：力量「存」进载体。西方以北欧符文、矮人锻造、炼金为代表；刻错一笔会爆炸，同符箓失败。"}, "familiarity": "中", "img": "entries/ps08/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "PS09", "name": "勇武 / 英雄之光", "name_en": "Valor (Hero's Light)", "category": "力量源与魔法·勇武", "function": "战士与骑士的力量：在誓死一战的勇气中被点燃的生命之火。平时是锤炼到极致的体魄与技艺，危急关头身上会燃起可见的「英雄之光」。", "visual_signature": "从额头升起的白热光柱，像一根燃烧的磨刀石；周身热浪，武器边缘烧亮。", "xianxia": {"concept": "武道 / 炼体（参照）", "note": "不是真气或斗气：没有经脉运行和内力积蓄。欧洲传统里，英雄之力来自勇气、荣誉与狂怒——凯尔特英雄战斗时头顶升起「英雄之光」、北欧狂战士进入战狂。力量随勇气起落，怯懦即熄灭。"}, "familiarity": "中", "img": "entries/ps09/anchor_v1.png", "status": "reviewed"}, {"id": "AU01", "name": "燃剑", "name_en": "Kindled Blade", "category": "力量源与魔法·勇武", "function": "勇武或圣光灌注武器：剑刃燃起光焰，可斩断魔法造物与灵体。高阶者能让光焰脱刃飞出一击。", "visual_signature": "剑刃燃起金白火焰般的光，挥动留下光弧。", "xianxia": {"concept": "剑气（参照）", "note": "外观相近，来源不同：西方原型是守卫伊甸园的火焰之剑与传说圣剑的光芒，力量来自勇气或神恩，而非剑意修炼。"}, "familiarity": "高", "img": "entries/au01/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GD01", "name": "光", "name_en": "The Light (One Faith)", "category": "神与信仰·神学模式", "function": "默认模式：一个由无数信者的信念汇成的至高之光，被圣光教会侍奉。它不说话，通过圣迹、光痕者与天使回应。", "visual_signature": "无形象；以七芒太阳盘为标志。", "xianxia": {"concept": "天道 / 佛（参照）"}, "familiarity": "高", "img": "entries/gd01/anchor_v2.png", "status": "reviewed"}, {"id": "GD02", "name": "众神殿", "name_en": "Pantheon", "category": "神与信仰·神学模式", "function": "多神模式：一组各掌一域的神（战争、海、死亡、丰饶、智慧、锻造……），彼此有亲缘、争斗与婚姻；每位神有自己的祭司、圣地与圣武士。", "visual_signature": "每位神一个标志物与颜色。", "xianxia": {"concept": "天庭诸神（参照）"}, "familiarity": "高", "img": "entries/gd02/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GD03", "name": "古神与土地之灵", "name_en": "Old Gods & Land-spirits", "category": "神与信仰·神学模式", "function": "比教会更古老的神：一座山、一条河、一片林各有其灵，乡民在圣井与立石前供奉。它们力量局限于本地，但在本地极强。", "visual_signature": "以圣井、立石、古树为居所，显现时像天气或动物。", "xianxia": {"concept": "山神 / 土地 / 河伯（参照）"}, "familiarity": "中", "img": "entries/gd03/anchor_v1.png", "status": "reviewed"}, {"id": "GD04", "name": "被遗忘的神", "name_en": "Forgotten Gods", "category": "神与信仰·神学模式", "function": "失去信徒的神：力量衰减，有的沉睡在废墟里，有的为了重新被记住而与凡人立约。是契约师最危险也最慷慨的赞助者。", "visual_signature": "残破的神像、只剩一角的神殿。", "xianxia": {"concept": "陨落古神（参照）"}, "familiarity": "中", "img": "entries/gd04/anchor_v1.png", "status": "reviewed"}, {"id": "GD05", "name": "赞助者", "name_en": "Patrons", "category": "神与信仰·神学模式", "function": "能与凡人立约、但不是神的强大存在：妖精君主、恶魔亲王、巫妖王、外域之物。契约师的力量来自它们。", "visual_signature": "随赞助者类型。", "xianxia": {"concept": "魔头 / 大妖（参照）"}, "familiarity": "中", "img": "entries/gd05/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "TR00", "name": "原质", "name_en": "Unwrought (Prima Materia)", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "未觉醒的普通人。灵魂是混沌的原料，炼金术称为「原质」——人人都是，人人都有可能被炼成。", "visual_signature": "无灵魂光泽。", "xianxia": {"concept": "凡人", "note": "差异：炼金观念里凡人不是「没有资格」，而是「尚未被炼」，强调潜能而非门槛。"}, "familiarity": "高", "img": "entries/tr00/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "TR01", "name": "铅阶", "name_en": "Lead", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂苏醒：第一次感到力量的存在，能点燃微光、感应魔法与灵体，但储量极小，用一次就累。", "visual_signature": "暗沉的铅灰微光，像蒙尘的金属。", "xianxia": {"concept": "炼气（参照）", "note": "同为入门。差异：铅对应土星与忧郁，觉醒常伴随沉重与痛苦（大病、丧亲、濒死），而非打坐感气。"}, "familiarity": "高", "img": "entries/tr01/anchor_v2.png", "status": "reviewed"}, {"id": "TR02", "name": "锡阶", "name_en": "Tin", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "力量第一次「立住」：能稳定地储存和引导，能与一件施法器或一个誓言建立联系。大多数正式学徒、新骑士停在这里。", "visual_signature": "苍白的锡银光，比铅亮，但仍偏冷偏灰。", "xianxia": {"concept": "筑基（参照）", "note": "同为打基础。差异：西方的「基础」不在丹田，而在第一次缔结——绑定施法器、立誓、与使魔或土地建立联系。"}, "familiarity": "中", "img": "entries/tr02/anchor_v3.png", "status": "reviewed"}, {"id": "TR03", "name": "铜阶", "name_en": "Copper", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂变得「导电」：能把力量传给他人与物品——缔结使魔、把灵魂的一部分注入武器（让它认主）、以魅力和声音影响人心。", "visual_signature": "温暖的玫瑰铜光，带铜绿色的边缘流光，光会沿接触物传导。", "xianxia": {"concept": "筑基后期至结丹前（参照）", "note": "差异：铜对应金星与爱，这一阶的核心是「连结」——第一次把灵魂与器物、动物或他人联系起来（使魔、认主武器），而非凝结内核。"}, "familiarity": "中", "img": "entries/tr03/anchor_v1.png", "status": "reviewed"}, {"id": "TR04", "name": "铁阶", "name_en": "Iron", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂淬火变硬：力量全面强化肉体与意志，能承受真正的战争与连续施法。王国的元帅、骑士团长、学院讲席大师多在这一阶。", "visual_signature": "暗铁灰带火星红的光，像刚出炉的铁。", "xianxia": {"concept": "结丹（参照）", "note": "差异：铁对应火星与战争，标志是「淬火」——在一场真正的血战中把灵魂锻硬，西方叙事里这是职业强者的门槛。"}, "familiarity": "高", "img": "entries/tr04/anchor_v3.png", "status": "reviewed"}, {"id": "TR05", "name": "汞阶", "name_en": "Quicksilver", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂变成流动的水银：能短暂离开身体（灵魂出窍）、穿行梦境、看见并对话灵体、在形体间变化。王国的大法师、传奇骑士在这一阶。", "visual_signature": "液态镜面般的光，像水银在皮肤表面流动，反射周围。", "xianxia": {"concept": "元婴（参照）", "note": "同为「灵魂可离体」的分水岭。差异：西方原型是赫尔墨斯（墨丘利）——往返于生死与诸界的信使，强调穿行与沟通，而非孕育第二个自我。"}, "familiarity": "中", "img": "entries/tr05/anchor_v1.png", "status": "reviewed"}, {"id": "TR06", "name": "银阶", "name_en": "Silver", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂如月，能映照他人：活着的传奇。力量可覆盖一座城或一片战场；死后灵魂可在世间停留，以亡魂或预言者身份回来。", "visual_signature": "冷白月光般的银辉，柔和但覆盖范围极大，周围像有潮汐起伏。", "xianxia": {"concept": "化神（参照）", "note": "同为能影响一方天地。差异：月亮主梦、潮汐与反射——银阶的影响以「潮汐」形式出现（周期起落），并能以梦和预兆影响大众。"}, "familiarity": "高", "img": "entries/tr06/anchor_v1.png", "status": "reviewed"}, {"id": "TR07", "name": "金阶", "name_en": "Gold", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "凡人所能达到的完美：炼金术的终点。衰老几乎停止，灵魂发出太阳般的光，所在之处自成法则。百年未必出一位。", "visual_signature": "太阳般的纯金光，不刺眼却无法直视，周围的物体投下金色长影。", "xianxia": {"concept": "炼虚至大乘（参照）", "note": "同为凡间巅峰。差异：金阶是「完成」而非「积累」——炼金术里金不会再锈蚀，所以金阶的标志是不朽的稳定，而非更大的破坏力。"}, "familiarity": "高", "img": "entries/tr07/anchor_v1.png", "status": "reviewed"}, {"id": "TR08", "name": "贤者之石", "name_en": "The Red Stone (Rubedo)", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "神话阶：灵魂本身变成「贤者之石」——能把别人点化。可以赐予追随者力量、复活新死者、点石成金。只有通过「封神之试」的人能到达。", "visual_signature": "胸口一颗发光的深红宝石般的核心，全身光芒带红宝石色。", "xianxia": {"concept": "渡劫飞升 / 真仙（参照）", "note": "差异：贤者之石的本质是「能转化他人」，所以半神必然拥有追随者或子民；神话阶的人不离开凡间，而是成为凡间的一部分（圣地、信仰、王朝的源头）。"}, "familiarity": "高", "img": "entries/tr08/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "TR09", "name": "以太", "name_en": "Aether (Quintessence)", "category": "位阶：灵魂的大功业·七金属位阶与神话阶", "function": "灵魂溶入第五元素：不再需要身体，成为神或类神存在，被信仰、可以成为别人的力量源（圣光之源、契约的赞助者）。", "visual_signature": "无实体的星光与彩虹色以太，形象随观看者而变。", "xianxia": {"concept": "金仙及以上 / 神（参照）", "note": "差异：以太存在依赖与凡间的关系（信仰、契约），被遗忘会衰弱——西方神话中失去信徒的神会消亡。"}, "familiarity": "中", "img": "entries/tr09/anchor_v1.png", "status": "reviewed"}, {"id": "PH01", "name": "四相", "name_en": "The Four Phases (Nigredo · Albedo · Citrinitas · Rubedo)", "category": "位阶：灵魂的大功业·四相与突破", "function": "每一金属阶内的四个阶段：黑化（崩解，力量混乱）→ 白化（净化，掌控）→ 黄化（觉醒，新能力浮现）→ 红化（定形，可以冲击下一阶）。", "visual_signature": "灵魂光泽内依次呈现黑、白、黄、红的色调层。", "xianxia": {"concept": "初期 / 中期 / 后期 / 圆满（参照）", "note": "差异：第一相是「崩解」而不是「刚入门」——刚升阶的人反而最不稳定。本模块可关闭。"}, "familiarity": "低", "img": "entries/ph01/anchor_v1.png", "status": "reviewed"}, {"id": "EV01", "name": "觉醒", "name_en": "Awakening (the Kindling)", "category": "位阶：灵魂的大功业·四相与突破", "function": "从原质到铅阶：灵魂第一次被点燃。通常由极端经历触发——大病、濒死、丧亲、初次杀戮、第一次真心的祈祷。", "visual_signature": "胸口一闪，眼中第一次出现微光。", "xianxia": {"concept": "感气入门 / 灵根检测（参照）", "note": "差异：不是测出来的，而是「被生活点燃」的；常在剧情最低谷发生。"}, "familiarity": "高", "img": "entries/ev01/anchor_v1.png", "status": "reviewed"}, {"id": "EV02", "name": "灵魂的黑夜", "name_en": "The Dark Night (Transmutation)", "category": "位阶：灵魂的大功业·四相与突破", "function": "每一次升阶的必经危机：旧的自我必须死去。默认弧线是战胜本阶对应的一种恶（可选模块）；不用该模块时，黑夜的内容由采用剧决定。通过则金属转化，失败则灵魂留下「炉渣」。", "visual_signature": "角色被黑暗包裹，光泽熄灭，随后从内部燃起新金属的光。", "xianxia": {"concept": "突破瓶颈 / 心魔劫（参照）", "note": "差异：不是外来的天雷，而是内在的「死亡与重生」，源自基督教神秘主义的「灵魂的黑夜」与炼金术的黑化。外部可表现为高烧昏迷、幻象、几天几夜的独处。"}, "familiarity": "中", "img": "entries/ev02/anchor_v2.png", "status": "reviewed"}, {"id": "EV03", "name": "神判", "name_en": "The Ordeal", "category": "位阶：灵魂的大功业·四相与突破", "function": "中世纪用来判定有罪无罪的神判：烧红的铁、沸水、冷水、决斗。被告的伤口三日后验，愈合即无罪。本库用于审判（猎巫、异端、悬案），不用于晋升。", "visual_signature": "公众围观的仪式场：火盆、深水池、决斗场。", "xianxia": {"concept": "无直接对应", "note": "仙侠的「宗门大比」对应的是晋升仪式 EV05；神判是司法程序。"}, "familiarity": "中", "img": "entries/ev03/anchor_v1.png", "status": "reviewed"}, {"id": "EV05", "name": "晋升仪式", "name_en": "Rites of Investiture", "category": "位阶：灵魂的大功业·四相与突破", "function": "组织授予头衔的仪式，按路线不同：骑士守夜受封（vigil of arms + 授剑礼）、比武大会；行会提交杰作；大学公开答辩（disputatio）；教会按手授职；女巫会入会礼。证明的不是灵魂成色，而是技艺、品格与誓言。", "visual_signature": "教堂守夜的烛光、授剑礼的肩头轻触、答辩厅的长桌、比武场。", "xianxia": {"concept": "宗门大比 / 入门考核（参照）"}, "familiarity": "高", "img": "entries/ev05/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "EV04", "name": "封神之试", "name_en": "Apotheosis", "category": "位阶：灵魂的大功业·四相与突破", "function": "从金阶到贤者之石：凡人成为半神的终极试炼。通常是一桩传说级的功业（屠灭灾厄、拯救一国）加上灵魂的最后一次黑夜。", "visual_signature": "火焰中升起的身影，或被光柱接引。", "xianxia": {"concept": "渡劫飞升（参照）", "note": "差异：西方的封神来自功业（赫拉克勒斯的十二功业）与众人的传颂，不是天劫；半神仍留在世间，作为圣地或王朝之源。"}, "familiarity": "中", "img": "entries/ev04/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "FL01", "name": "炉渣", "name_en": "Slag (Cracked Soul)", "category": "位阶：灵魂的大功业·失败与堕落", "function": "突破失败或透支后，灵魂留下杂质与裂痕：位阶跌落或永久卡住，施法时伴随剧痛。", "visual_signature": "灵魂光泽里有黑色裂纹与灰斑，光断断续续。", "xianxia": {"concept": "根基受损 / 修为跌落（参照）"}, "familiarity": "低", "img": "entries/fl01/anchor_v1.png", "status": "reviewed"}, {"id": "FL02", "name": "腐化", "name_en": "Corruption", "category": "位阶：灵魂的大功业·失败与堕落", "function": "力量来源本身带毒：深渊之力、死亡之力或贪婪的魔法物品逐渐改变使用者的身体和人格，直至变成怪物。", "visual_signature": "黑色脉络从手部向上蔓延，瞳孔颜色改变。", "xianxia": {"concept": "入魔（参照）", "note": "差异：西方的腐化是「可见的、渐进的、身体性的」——长角、皮肤发灰、影子变形，观众可以逐集看到。"}, "familiarity": "高", "img": "entries/fl02/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "FL03", "name": "附身", "name_en": "Possession", "category": "位阶：灵魂的大功业·失败与堕落", "function": "另一个存在（恶魔、亡魂、妖精）占据了身体。弱者全面失控，强者与之争夺主导权，形成双重人格。", "visual_signature": "眼睛变色（全黑或发光），声音出现第二重音轨，动作不自然。", "xianxia": {"concept": "夺舍 / 心魔附体（参照）", "note": "差异：西方附身者是「另一个有名字的存在」，可以被谈判、被骗、被驱逐，戏剧冲突更具体。"}, "familiarity": "高", "img": "entries/fl03/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "FL04", "name": "失恩", "name_en": "Fall from Grace", "category": "位阶：灵魂的大功业·失败与堕落", "function": "违背誓言或信仰的人失去圣光或勇武：光会突然熄灭，有时反过来灼伤自己。背誓骑士在西方叙事里是固定的悲剧形象。", "visual_signature": "圣光像熄灭的蜡烛冒出一缕黑烟，盔甲上的圣徽变黑。", "xianxia": {"concept": "道心破碎（参照）", "note": "差异：西方的失恩是道德与契约性的——违背的是一句具体的誓言，因此可以通过赎罪任务（quest）重新获得。"}, "familiarity": "高", "img": "entries/fl04/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "TL01", "name": "奥术头衔", "name_en": "Arcane Ranks", "category": "位阶：灵魂的大功业·路线头衔", "function": "学徒 Apprentice → 熟手 Journeyman → 法师 Magus → 大师 Master → 大法师 Archmage。沿用中世纪行会的「学徒—熟手—大师」制度，出师要提交一件「杰作」（masterwork spell），升大师要公开答辩。", "visual_signature": "法袍滚边与胸针随头衔变化：学徒无饰，大法师佩金链。", "xianxia": {"concept": "外门 / 内门 / 真传 / 长老 / 宗主（参照）"}, "familiarity": "高", "img": "entries/tl01/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "TL02", "name": "骑士头衔", "name_en": "Chivalric Ranks", "category": "位阶：灵魂的大功业·路线头衔", "function": "侍童 Page → 侍从 Squire → 骑士 Knight → 旗骑士 Knight-Banneret → 王国重臣 Peer → 王之斗士 Champion。受封骑士需「授剑礼」（dubbing）；重臣是王国最高的十二骑士席位。", "visual_signature": "马刺与腰带：侍从银马刺，骑士金马刺；旗骑士的方旗。", "xianxia": {"concept": "剑宗弟子 → 护法 → 剑主（参照）", "note": "十二重臣取自查理曼十二圣骑士（Twelve Peers）——paladin 一词的本源。本库把 Paladin 留给信仰战士职业（观众最熟悉的用法），头衔用 Peer。"}, "familiarity": "高", "img": "entries/tl02/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "TL03", "name": "教会圣职", "name_en": "Holy Orders", "category": "位阶：灵魂的大功业·路线头衔", "function": "侍祭 Acolyte → 执事 Deacon → 神父/女祭司 Priest → 主教 Bishop → 大主教 Archbishop；「圣徒 Saint」不是职位，是死后或生前因神迹被追认。", "visual_signature": "圣带与权杖：主教持曲柄权杖、戴冠。", "xianxia": {"concept": "道观 / 佛门的僧阶（参照）", "note": "差异：圣职与位阶脱钩——主教可能只有锡阶（政治任命），乡村神父却可能是银阶。这个错位是天然的剧情矛盾。"}, "familiarity": "高", "img": "entries/tl03/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "TL04", "name": "德鲁伊阶层", "name_en": "Druidic Grades", "category": "位阶：灵魂的大功业·路线头衔", "function": "吟游者 Bard → 卜者 Ovate → 德鲁伊 Druid → 大德鲁伊 Archdruid。源自古代凯尔特的三级学者阶层：诗与记忆、占卜与医药、仪式与裁决。", "visual_signature": "袍色区分：蓝、绿、白；大德鲁伊持橡木杖与金镰。", "xianxia": {"concept": "隐世宗门的传承层级（参照）"}, "familiarity": "中", "img": "entries/tl04/anchor_v2.png", "status": "reviewed"}, {"id": "TL05", "name": "女巫阶层", "name_en": "Coven Degrees", "category": "位阶：灵魂的大功业·路线头衔", "function": "学徒 Novice → 女巫 Witch → 高阶女巫 High Witch（主持一个女巫会）→ 长老 Crone/Elder。以师承和女巫会（coven）为单位，不受教会与学院承认。", "visual_signature": "银戒、月相项链；高阶者有家族传承的黑曜石镜。", "xianxia": {"concept": "散修师门 / 旁门（参照）", "note": "差异：女巫在多数西幻世界是「非法」或灰色的，权力来自地下网络与血脉，这正是欧美短剧爱用的身份反差。"}, "familiarity": "高", "img": "entries/tl05/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "CL01", "name": "战士", "nam or_v1.png", "status": "reviewed_with_notes"}, {"id": "CL23", "name": "猎魔人", "name_en": "Monster Hunter", "category": "职业·自然与元素", "function": "以猎杀怪物为业的人：熟知民间克制之法（银、冷铁、盐、圣水、花楸），按委托清除吸血鬼、狼人、亡灵与妖精作祟。不靠变异，靠知识、装备与胆量；许多人是半吸血鬼或胎膜之子。", "visual_signature": "镀银军刀与手弩、皮甲、装满克制材料的腰包。", "xianxia": {"concept": "斩妖人（参照）", "note": "成长靠「异变试炼」：每升一阶都要喝下更毒的药剂，存活率低。"}, "familiarity": "中", "img": "entries/cl23/anchor_v1.png", "status": "reviewed"}, {"id": "CL15", "name": "死灵法师", "name_en": "Necromancer", "category": "职业·黑暗与禁忌", "function": "操纵死亡的施法者：唤起尸骨、与亡魂对话、吸取生命，终极目标常是成为巫妖。", "visual_signature": "黑灰长袍、骨饰、苍白皮肤、身旁鬼火与骷髅仆从。", "xianxia": {"concept": "鬼修 / 尸修 / 驭尸人（参照）"}, "familiarity": "高", "img": "entries/cl15/anchor_v2.png", "status": "reviewed"}, {"id": "CL16", "name": "契约师", "name_en": "Warlock (Pactbound)", "category": "职业·黑暗与禁忌", "function": "与强大存在立约换取力量的人：力量随叫随到，但赞助者随时可以收回或要价。", "visual_signature": "身上的契约印记、一只不像动物的使魔、带有赞助者风格的服饰。", "xianxia": {"concept": "魔修 / 与魔头立约者（参照）", "note": "关键不是功法而是「合同」：剧情可以围绕条款与漏洞展开。"}, "familiarity": "高", "img": "entries/cl16/anchor_v1.png", "status": "reviewed"}, {"id": "CL20", "name": "女巫", "name_en": "Witch", "category": "职业·黑暗与禁忌", "function": "民间的魔法传承者：草药、诅咒、占卜、月相与使魔。被教会追猎，在乡野被需要。", "visual_signature": "深色层叠衣物、草药与小瓶、黑猫或乌鸦、银饰。", "xianxia": {"concept": "蛊师 / 旁门散修（参照）", "note": "欧美短剧与流行文化中最高频的魔法身份之一；常与血脉、家族诅咒、女巫会结合。"}, "familiarity": "高", "img": "entries/cl20/anchor_v1.png", "status": "reviewed"}, {"id": "CL24", "name": "死亡骑士", "name_en": "Death Knight (Revenant Knight)", "category": "职业·黑暗与禁忌", "function": "死后被唤回的骑士：保留武艺与意志，力量来自死亡与未竟的执念。", "visual_signature": "锈黑残破的旧板甲、沾着墓土与枯叶，头盔阴影中两点暗红余烬般的眼光，缺口的旧剑。", "xianxia": {"concept": "尸将 / 鬼将（参照）", "note": "常由失恩的圣武士或战死的骑士转化，执念完成即可安息。"}, "familiarity": "高", "img": "entries/cl24/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "RC17", "name": "天使", "name_en": "Celestials (Angels)", "category": "种族与各族体系·天界存在", "function": "天界的使者与战士：由纯粹的光与秩序构成，奉命行事，不能违背其被造的职责。堕落者成为最可怕的恶魔。", "visual_signature": "高大的人形、光羽之翼、过于对称的面容、金白光；高位者形态非人（多翼、多眼）。", "xianxia": {"concept": "天兵天将 / 仙官（参照）", "note": "差异：天使不修炼，品级是被赋予的；它们最大的戏剧性在于「自由意志」——质疑命令即开始堕落。"}, "familiarity": "高", "img": "entries/rc17/anchor_v1.png", "status": "reviewed"}, {"id": "RC12", "name": "天恩之子", "name_en": "The Graced (Angel-born)", "category": "种族与各族体系·天界存在", "function": "凡人与天界存在的后代：身上有天光，力量源于圣光的血，传说注定要做出影响世界的选择。", "visual_signature": "过于明亮的眼睛、皮肤透出暖光，觉醒时背后浮现光翼。", "xianxia": {"concept": "仙凡之子 / 谪仙后裔（参照）", "note": "传统文献中的 nephilim 是巨人且多被视为可憎，本库不用其本义，只作别名。"}, "familiarity": "中", "img": "entries/rc12/anchor_v2.png", "status": "reviewed"}, {"id": "RC09", "name": "妖精", "name_en": "The Fae", "category": "种族与各族体系·妖精与长生种", "function": "来自彼岸妖精国度的存在：从微小的花精到美得令人窒息的宫廷贵族。力量来自幻魅、交易与真名，被铁、被誓言、被自己的规则所束缚。", "visual_signature": "过于完美的美貌带一点「不对劲」：瞳孔异形、耳尖、皮肤微光，衣饰取自花叶、霜、羽、骨。", "xianxia": {"concept": "山精野怪 / 洞天仙灵（参照）", "note": "差异：妖精最重要的是「规则」——不能说谎（但会误导）、交易必须对等、知道真名即可约束、吃了妖精的食物就回不去。剧作冲突几乎都来自这些规则。"}, "familiarity": "高", "img": "entries/rc09/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "RS04", "name": "光辉宫廷", "name_en": "Seelie Court (Summer Court)", "category": "种族与各族体系·妖精与长生种", "function": "较为「友善」的妖精宫廷：向凡人赐福、回报善意，但同样记仇、同样残酷，只是更讲礼。", "visual_signature": "花冠、金绿织物、夏日光斑。", "xianxia": {"concept": "正派仙灵（参照）"}, "familiarity": "中", "img": "entries/rs04/anchor_v1.png", "status": "reviewed"}, {"id": "RS05", "name": "幽暗宫廷", "name_en": "Unseelie Court (Winter Court)", "category": "种族与各族体系·妖精与长生种", "function": "黑暗而危险的妖精宫廷：猎捕凡人、喜好恐惧与恶作剧，但也守约守规，从不撒谎。", "visual_signature": "霜与黑羽、骨饰、苍白的皮肤与黑色眼白。", "xianxia": {"concept": "邪派精怪（参照）"}, "familiarity": "中", "img": "entries/rs05/anchor_v4.png", "status": "reviewed"}, {"id": "RC02", "name": "精灵", "name_en": "Elves", "category": "种族与各族体系·妖精与长生种", "function": "长生、优雅、与星辰或森林相连的古老种族。成长以世纪计，天生亲近奥术与自然，但人口稀少、繁衍极慢，正在缓慢衰退。用金属成色衡量其施法者。", "visual_signature": "尖耳、细长骨架、无瑕的皮肤、长发，服饰为流动的织物与叶脉纹金属。", "xianxia": {"concept": "仙裔 / 长生种（参照）", "note": "差异：精灵的长生带着「哀愁」——他们会厌倦世界并「褪去」（fade），离开凡世前往彼岸，这是西幻精灵的核心悲剧感。"}, "familiarity": "高", "img": "entries/rc02/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "RS01", "name": "高等精灵", "name_en": "High Elves", "category": "种族与各族体系·妖精与长生种", "function": "居住在白石城邦的精灵：奥术最精深的种族，以星辰为历法与魔力之源，文化高度仪式化。", "visual_signature": "白银与深蓝的长袍、星形银饰，发色浅金或银。", "xianxia": {"concept": "上古仙门世家（参照）"}, "familiarity": "高", "img": "entries/rs01/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "RS02", "name": "林地精灵", "name_en": "Wood Elves", "category": "种族与各族体系·妖精与长生种", "function": "住在古林中的精灵：游侠与德鲁伊之族，与森林的生死绑在一起，排外而警觉。", "visual_signature": "皮革与叶片织物的猎装、长弓、身上的木纹刺青。", "xianxia": {"concept": "隐世山林宗门（参照）"}, "familiarity": "高", "img": "entries/rs02/anchor_v2.png", "status": "reviewed"}, {"id": "RS03", "name": "影精灵", "name_en": "Shadow Elves", "category": "种族与各族体系·妖精与长生种", "function": "被同族放逐的精灵后裔：先祖拥抱了暗影与死亡魔法，被逐出精灵城邦，如今流落在森林边缘的暮光地带，以秘术和情报为生。", "visual_signature": "与其他精灵一样多样的肤色；特征在于影子——他们的影子比身体慢半拍，眼睛是暮色般的灰紫，常穿流放者的灰黑丧服。", "xianxia": {"concept": "被逐出宗门的魔道分支（参照）", "note": "本库原创：核心是「被放逐的同族」与「会动的影子」；不用地下城、畏光、深肤色等现有暗精灵设定。"}, "familiarity": "中", "img": "entries/rs03/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "RS10", "name": "半精灵", "name_en": "Half-elves", "category": "种族与各族体系·妖精与长生种", "function": "人类与精灵的孩子：寿命介于两者之间，两边都不完全接纳，常成为两族之间的使者、游侠或吟游诗人。", "visual_signature": "耳尖微尖、比人类更修长，眼睛颜色偏浅。", "xianxia": {"concept": "仙凡之子（参照）"}, "familiarity": "高", "img": "entries/rs10/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "RC01", "name": "人类", "name_en": "Humans", "category": "种族与各族体系·凡人诸族", "function": "寿命最短、觉醒最快、路线最广的种族：没有天生的魔法，却能学会一切，建立了大陆上最多的王国与教会。", "visual_signature": "多样的人种与服饰，按王国区分。", "xianxia": {"concept": "人族（参照）", "note": "同为主角种族。差异：西幻人类被长生种视为「年轻而贪婪」，优势是野心与变化，短命反而成为他们能改变命运的理由。"}, "familiarity": "高", "img": "entries/rc01/anchor_v2.png", "status": "reviewed"}, {"id": "RC19", "name": "半身人", "name_en": "Halflings", "category": "种族与各族体系·凡人诸族", "function": "身高约人类一半的安居小民：务农、开旅店、驾河船经商，重家族与好客，看似平凡，却有惊人的运气与韧性。", "visual_signature": "矮小匀称、穿靴子的旅人或船夫装束，圆耳。", "xianxia": {"concept": "无直接对应", "note": "通用类型词；避免托尔金式的光脚毛足、洞穴房屋与 hobbit 一词。"}, "familiarity": "高", "img": "entries/rc19/anchor_v3.png", "status": "revision_required"}, {"id": "RC03", "name": "矮人", "name_en": "Dwarves", "category": "种族与各族体系·凡人诸族", "function": "住在山中的匠人与战士之族：几乎不施法，却是最好的符文匠与铁匠；重誓言、重祖先、重手艺。", "visual_signature": "编辫长须、厚重的工作服与锁甲、符文刻纹的锤斧。", "xianxia": {"concept": "炼器世家 / 体修宗门（参照）"}, "familiarity": "高", "img": "entries/rc03/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "RC06", "name": "兽人", "name_en": "Orcs", "category": "种族与各族体系·凡人诸族", "function": "强壮的战士民族：重荣誉、血誓与先祖，以战功和誓约决定地位。常被其他种族视为野蛮，实则有严格的习惯法与血金（wergild）制度。", "visual_signature": "灰橄榄至褐色皮肤、下獠牙、编发、铁项圈与臂环、鳞甲与毛毡。", "xianxia": {"concept": "蛮族（参照）", "note": "取材于古代欧洲的战士社会（日耳曼部落、草原游牧），不是「天生邪恶」也不是「高贵野蛮人」。"}, "familiarity": "高", "img": "entries/rc06/anchor_v1.png", "status": "reviewed"}, {"id": "RC04", "name": "巨人", "name_en": "Giants", "category": "种族与各族体系·凡人诸族", "function": "比世界更古老的巨大种族，按元素分支（霜、火、石、风暴），曾统治大地，如今退守边疆。", "visual_signature": "巨大而粗犷的人形，皮肤带元素质感（霜、熔岩、岩石）。", "xianxia": {"concept": "巨灵族 / 上古遗族（参照）"}, "familiarity": "中", "img": "entries/rc04/anchor_v4.png", "status": "revision_required"}, {"id": "RC07", "name": "巨魔", "name_en": "Trolls", "category": "种族与各族体系·凡人诸族", "function": "北方山林中的大型人形生物：伤口能迅速再生，阳光会把它们变成石头。愚钝或狡诈，民间故事里常守着桥与宝藏。", "visual_signature": "苔藓般的粗糙皮肤、长鼻、石块状的指节。", "xianxia": {"concept": "山魈 / 石妖（参照）"}, "familiarity": "高", "img": "entries/rc07/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "RC05", "name": "哥布林", "name_en": "Goblins", "category": "种族与各族体系·凡人诸族", "function": "欧洲民间的小精怪：矮小、调皮、爱偷小东西、让牛奶变酸、在夜里敲门。有的住在人家里帮忙也捣乱（家精 hobgoblin），有的成群住在荒野与旧矿洞。", "visual_signature": "矮小精瘦、长尖耳、苔绿或灰褐皮肤、亮眼睛，穿着拼凑的旧衣与偷来的小饰物。", "xianxia": {"concept": "小妖 / 山精 / 家宅精怪（参照）"}, "familiarity": "高", "img": "entries/rc05/anchor_v1.png", "status": "reviewed"}, {"id": "RC08", "name": "人鱼", "name_en": "Merfolk", "category": "种族与各族体系·凡人诸族", "function": "海中的人形种族：上身似人、下身鱼尾，以歌声与潮汐魔法闻名。可在月夜短暂化腿上岸，代价各族不同。", "visual_signature": "鳞片沿颈与手臂延伸、鱼鳍状耳、湿发与珍珠贝饰。", "xianxia": {"concept": "鲛人（参照）"}, "familiarity": "高", "img": "entries/rc08/anchor_v1.png", "status": "reviewed"}, {"id": "RS06", "name": "海豹人", "name_en": "Selkies", "category": "种族与各族体系·凡人诸族", "function": "披上海豹皮就是海豹、脱下就是人的海民。谁偷走并藏起她的海豹皮，她就不得不留在陆地上——直到找回为止。", "visual_signature": "深色湿润的大眼睛，随身的灰色海豹皮斗篷。", "xianxia": {"concept": "羽衣仙女传说（参照）", "note": "与中国「天鹅处女/七仙女羽衣」是同型故事，凯尔特版本以海豹皮为核心。"}, "familiarity": "中", "img": "entries/rs06/anchor_v1.png", "status": "reviewed"}, {"id": "RC20", "name": "半人马", "name_en": "Centaurs", "category": "种族与各族体系·凡人诸族", "function": "上身为人、下身为马的草原与林地民族：善射、观星、通晓医药与预言，也有狂野好斗的部族。", "visual_signature": "马身强健、人身佩弓箭与星图护符。", "xianxia": {"concept": "无直接对应（希腊神话种族）"}, "familiarity": "高", "img": "entries/rc20/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "RC13", "name": "狼人", "name_en": "Werewolves (Lycans)", "category": "种族与各族体系·变形者与诅咒者", "function": "满月或情绪激动时化为巨狼的变形者：以狼群为单位生活，等级森严，靠嗅觉与「伴侣羁绊」认定命中之人。", "visual_signature": "人形时金或琥珀色眼睛、强壮体魄；狼形为巨大的狼，毛色延续人形发色。", "xianxia": {"concept": "妖族·狼妖部落（参照）", "note": "欧美短剧通行套路已形成完整体系：Alpha 统领狼群，其伴侣称 Luna；命定伴侣（mate）由月之女神指定，被「拒绝伴侣」是女性向的退婚流。"}, "familiarity": "高", "img": "entries/rc13/anchor_v2.png", "status": "reviewed"}, {"id": "RC15", "name": "吸血鬼", "name_en": "Vampires", "category": "种族与各族体系·变形者与诅咒者", "function": "以血为生的不死贵族：永生、俊美、力大无穷，惧阳光与圣物。按「血统」组成家族，越古老的血越强。", "visual_signature": "苍白无瑕的皮肤、饥饿时瞳孔变红、尖牙，偏爱旧式贵族服装。", "xianxia": {"concept": "血魔 / 尸修中的贵族（参照）"}, "familiarity": "高", "img": "entries/rc15/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "RS09", "name": "半吸血鬼", "name_en": "Dhampirs", "category": "种族与各族体系·变形者与诅咒者", "function": "吸血鬼与凡人的孩子：巴尔干民间相信他们天生能看见隐形的吸血鬼，是最好的吸血鬼猎人。不怕阳光，力量与感官超常，但血里有饥渴。", "visual_signature": "苍白但有血色，瞳孔偶尔泛红，尖牙不明显。", "xianxia": {"concept": "半魔混血（参照）"}, "familiarity": "中", "img": "entries/rs09/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "RC18", "name": "魔裔", "name_en": "Cambions (Half-Demons)", "category": "种族与各族体系·变形者与诅咒者", "function": "凡人与恶魔的后代：外貌带角、尾或异色瞳，天生能用深渊之力，被教会追猎、被恶魔觊觎。", "visual_signature": "小角（可被头发或帽子遮住）、深红或金色瞳、体温偏高。", "xianxia": {"concept": "半魔 / 魔族混血（参照）"}, "familiarity": "中", "img": "entries/rc18/anchor_v2.png", "status": "reviewed"}, {"id": "RC14", "name": "亡灵", "name_en": "The Undead", "category": "种族与各族体系·亡灵", "function": "死后仍未安息的存在：有的是被死灵术唤起的躯壳，有的是执念未了的亡魂，最强者是主动放弃生命以换不朽的巫妖。", "visual_signature": "从腐朽躯体到半透明魂影；巫妖为枯骨王者，眼窝燃冷火。", "xianxia": {"concept": "鬼族 / 尸族（参照）"}, "familiarity": "高", "img": "entries/rc14/anchor_v2.png", "status": "reviewed"}, {"id": "RC16", "name": "恶魔", "name_en": "Demons (Fiends)", "category": "种族与各族体系·深渊存在", "function": "深渊与地狱的居民：以灵魂为食、以契约为法，渴望进入凡世。它们不会创造，只能交易、诱惑与吞噬。", "visual_signature": "从小而丑陋的小鬼到俊美得危险的人形贵族；角、蝠翼、尾、熔岩裂纹、硫磺烟。", "xianxia": {"concept": "魔族（参照）", "note": "差异：西方恶魔的核心是「交易与真名」——被召唤者知道真名就能约束它；它们必须遵守契约字面意义，所以斗智是主线。"}, "familiarity": "高", "img": "entries/rc16/anchor_v1.png", "status": "reviewed"}, {"id": "RS07", "name": "堕落天使", "name_en": "Fallen Angels", "category": "种族与各族体系·深渊存在", "function": "质疑命令或爱上凡人而被逐出天界的天使：翅膀焦黑或被剪去，保留永生与部分力量，失去圣光与归途。在深渊里他们是最高位的恶魔贵族；在凡世他们隐姓埋名。", "visual_signature": "焦黑或残缺的羽翼、过于完美的面容带一道伤，眼中金光变为余烬。", "xianxia": {"concept": "堕仙 / 天魔（参照）"}, "familiarity": "高", "img": "entries/rs07/anchor_v1.png", "status": "reviewed"}, {"id": "RS08", "name": "梦魔", "name_en": "Incubi & Succubi", "category": "种族与各族体系·深渊存在", "function": "在梦中诱惑凡人、以其生命力与欲念为食的恶魔：男为 incubus，女为 succubus。能在梦境中自由出入，现实中需借召唤或附身显形。", "visual_signature": "现实中是俊美的人形，梦中显出角、尾与烟一样的双翼。", "xianxia": {"concept": "魅魔 / 采补魔修（参照）"}, "familiarity": "高", "img": "entries/rs08/anchor_v2.png", "status": "reviewed"}, {"id": "RC10", "name": "龙", "name_en": "Dragons", "category": "种族与各族体系·链外：龙与元素", "function": "最古老、最强大的生灵：会说话、会魔法、守着宝藏，随年岁不断变强。部分古龙能化为人形行走于世。", "visual_signature": "四足双翼、长颈长尾、鳞片如铠甲、熔金竖瞳。", "xianxia": {"concept": "龙族（参照）", "note": "差异：西方龙是贪婪与力量的象征，不是祥瑞；龙与宝藏绑定——宝藏越多越强，失去宝藏会暴怒。"}, "familiarity": "高", "img": "entries/rc10/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "RC11", "name": "元素生灵", "name_en": "Elementals", "category": "种族与各族体系·链外：龙与元素", "function": "火、水、土、风本身的灵性化身：从小小的火蜥蜴到能掀起山崩的元素领主。元素使与它们谈判、签约、借力。", "visual_signature": "由元素本身构成的形体，带人或兽的轮廓。", "xianxia": {"concept": "五行精灵（参照）"}, "familiarity": "中", "img": "entries/rc11/anchor_v1.png", "status": "reviewed"}, {"id": "GF01", "name": "天赋之火", "name_en": "The Gift (Spark)", "category": "天赋与成长·天赋与气质", "function": "先天力量的强弱：无火 Giftless（终生难以觉醒）→ 微火 Ember → 明火 Flame → 烈火 Blaze → 天火 Wildfire（百年一遇，觉醒即暴走）。决定升阶速度与上限，不决定当前位阶。", "visual_signature": "试金石上划出的痕迹亮度（见试金石 IT22）。", "xianxia": {"concept": "灵根资质（参照）", "note": "差异：只表强弱，不表属性（属性由气质决定）；且西方叙事更重「天赋不足靠意志与誓言弥补」。"}, "familiarity": "高", "img": "entries/gf01/anchor_v1.png", "status": "reviewed"}, {"id": "GF02", "name": "四种气质", "name_en": "The Four Temperaments", "category": "天赋与成长·天赋与气质", "function": "按中世纪体液说，每个人生来偏于一种气质，对应一种元素亲和：多血质 Sanguine—风，胆汁质 Choleric—火，抑郁质 Melancholic—土，黏液质 Phlegmatic—水。气质同时决定性格与擅长的魔法。", "visual_signature": "气质决定灵魂光泽之外的「底色」：风浅蓝、火赤、土褐、水青。", "xianxia": {"concept": "灵根属性（参照）", "note": "差异：西方气质同时是性格学——火系的人易怒、水系的人沉静，性格与能力天然一致。"}, "familiarity": "中", "img": "entries/gf02/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GF03", "name": "第七子之七子", "name_en": "Seventh Son of a Seventh Son", "category": "天赋与成长·天赋与气质", "function": "民间相信第七子的第七子能以触摸治病，尤其是瘰疬（「国王之疾」），爱尔兰传统还说他们能预言。本库定为罕见天赋：圣光与驱邪亲和极高，并且（本库设定）女巫与恶魔无法对其隐藏身份。", "visual_signature": "无外在记号；触碰病人时手掌微热发光。", "xianxia": {"concept": "天生道体 / 特殊体质（参照）"}, "familiarity": "中", "img": "entries/gf03/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GF04", "name": "胎膜之子", "name_en": "Caul-born", "category": "天赋与成长·天赋与气质", "function": "出生时头上覆着羊膜的人。欧洲民间普遍相信胎膜能防溺死，水手会买来作护身符；意大利弗留利的 benandanti 传统说胎膜之子夜里灵魂出窍、与巫师作战。本库定为：天生的通灵与预言天赋，常在梦中看见未来。", "visual_signature": "灰色雾状的瞳孔边缘，看灵体时瞳孔蒙上一层薄膜般的光。", "xianxia": {"concept": "天生灵眼 / 阴阳眼（参照）"}, "familiarity": "低", "img": "entries/gf04/anchor_v4.png", "status": "reviewed"}, {"id": "GF05", "name": "女巫印记", "name_en": "Witch's Mark", "category": "天赋与成长·天赋与气质", "function": "历史上的「女巫印记」（devil's mark）是猎巫者声称魔鬼立约时留下的记号，多在隐秘处、针刺不痛。本库改编为：女巫血统的天生胎记，标志着巫术天赋，也是被猎杀的理由。", "visual_signature": "新月或星形的暗红胎记，施法时微微发烫发光。", "xianxia": {"concept": "血脉印记（参照）", "note": "史料中是立约后的记号而非胎记；「天生胎记」是本库设定。"}, "familiarity": "中", "img": "entries/gf05/anchor_v1.png", "status": "reviewed"}, {"id": "GF06", "name": "光痕", "name_en": "Lightbrand", "category": "天赋与成长·天赋与气质", "function": "身上无故出现的发光烙痕，形状如本库的七芒太阳盘，被视为「光」的选民。本库定为：圣光天赋的最高记号，能直接施展神迹，但每次施展烙痕都会灼痛渗血。", "visual_signature": "锁骨下方一枚七芒形的烙痕，施展时透出金光。", "xianxia": {"concept": "佛骨 / 圣体（参照）", "note": "取「圣痕」的结构（神选的身体记号），形状与位置原创，不模仿真实宗教的受难伤痕。"}, "familiarity": "中", "img": "entries/gf06/anchor_v1.png", "status": "reviewed"}, {"id": "GF07", "name": "换生儿", "name_en": "Changeling", "category": "天赋与成长·天赋与气质", "function": "被妖精偷换到人类摇篮里的孩子（或被换走后又回来的孩子）。外表是人，但血里有妖精：天生的幻术、对铁的不适、说不了谎。", "visual_signature": "过于明亮或颜色怪异的眼睛、耳尖微尖。", "xianxia": {"concept": "妖胎 / 被调包的仙裔（参照）"}, "familiarity": "中", "img": "entries/gf07/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "GF08", "name": "冷铁之魂", "name_en": "Null (Ironsoul)", "category": "天赋与成长·天赋与气质", "function": "完全无法施法、也几乎不受魔法影响的人：法术打在身上会熄灭，护盾一碰就碎。被魔法社会视为残缺，却是一切法师的天敌。", "visual_signature": "力量爆发时周围的魔法光像被风吹灭的烛火。", "xianxia": {"concept": "废灵根 / 绝灵体（参照）", "note": "差异：西方民俗中冷铁破除魔法，本库把它做成一种人的灵魂特质。"}, "familiarity": "中", "img": "entries/gf08/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "GF09", "name": "预言之子", "name_en": "Prophecy-marked", "category": "天赋与成长·天赋与气质", "function": "被古老预言指名的人：出生时有天象（彗星、日食），身上有对应记号。预言给他们方向与追杀者，不直接给力量。", "visual_signature": "出生天象的记号（彗星形胎记、日食色的眼睛）。", "xianxia": {"concept": "天命之子 / 气运之子（参照）"}, "familiarity": "高", "img": "entries/gf09/anchor_v4.png", "status": "reviewed"}, {"id": "GR01", "name": "拜师学艺", "name_en": "Apprenticeship", "category": "天赋与成长·成长途径", "function": "欧洲最核心的传承方式：学徒跟随大师七年，以服侍换取知识；出师要提交杰作，大师对学徒的过失负连带责任。", "visual_signature": "学徒契约书、工坊、师傅的印章。", "xianxia": {"concept": "拜师入门（参照）", "note": "差异：西方师徒是契约关系（契约书、年限、可买断），不是终身父子名分。"}, "familiarity": "高", "img": "entries/gr01/anchor_v1.png", "status": "reviewed"}, {"id": "GR02", "name": "学院与考核", "name_en": "Academy & Examinations", "category": "天赋与成长·成长途径", "function": "系统化学习：入学、讲授、答辩、学位。最昂贵，学院决定谁能接触高阶知识。", "visual_signature": "长桌、钟楼、学院袍色区分年级。", "xianxia": {"concept": "宗门修行（参照）"}, "familiarity": "高", "img": "entries/gr02/anchor_v2.png", "status": "reviewed_with_notes"}, {"id": "GR03", "name": "誓言", "name_en": "Oath & Vow", "category": "天赋与成长·成长途径", "function": "以誓言换力量：骑士誓、圣武士誓、守护誓。守誓越久越难，力量越强；背誓则失恩。", "visual_signature": "誓言仪式：剑上起誓、手按圣物。", "xianxia": {"concept": "道心誓言（参照）"}, "familiarity": "高", "img": "entries/gr03/anchor_v1.png", "status": "reviewed"}, {"id": "GR12", "name": "禁誓", "name_en": "Geas", "category": "天赋与成长·成长途径", "function": "凯尔特传统中的个人禁忌：一个人被加上「不得做某事」的禁誓，守住就得到力量或好运，触犯则招来厄运乃至死亡。本库定为可主动承受的力量契约。", "visual_signature": "无外在标志；知情者会利用它设局。", "xianxia": {"concept": "禁制 / 誓约神通（参照）"}, "familiarity": "低", "img": "entries/gr12/anchor_v1.png", "status": "reviewed"}, {"id": "GR04", "name": "血脉觉醒", "name_en": "Bloodline Awakening", "category": "天赋与成长·成长途径", "function": "血里沉睡的祖先之力被唤醒：外形改变、力量骤增。由年龄、危机、月相或接触祖先遗物触发。", "visual_signature": "血管发光、瞳孔变化、角或翼的轮廓浮现。", "xianxia": {"concept": "血脉觉醒（参照）"}, "familiarity": "高", "img": "entries/gr04/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GR05", "name": "缔约", "name_en": "Pact", "category": "天赋与成长·成长途径", "function": "与恶魔、妖精、亡灵君主或古神交易：最快的变强方式，代价写在条款里。", "visual_signature": "契约书、契约印记。", "xianxia": {"concept": "魔道速成（参照）"}, "familiarity": "高", "img": "entries/gr05/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GR06", "name": "灵魂缔结", "name_en": "Soulbond", "category": "天赋与成长·成长途径", "function": "铜阶起可把灵魂与他者相连：使魔、战马、龙、命定伴侣。双方共享感知与力量，一方受伤另一方同痛。", "visual_signature": "两者之间一缕同色的光线；同时眨眼、同时皱眉。", "xianxia": {"concept": "契约灵兽 / 本命法宝 / 道侣（参照）"}, "familiarity": "高", "img": "entries/gr06/anchor_v1.png", "status": "reviewed"}, {"id": "GR07", "name": "功业与名声", "name_en": "Deeds & Renown", "category": "天赋与成长·成长途径", "function": "西方英雄的核心成长：完成被传颂的功业（屠龙、救城、取回圣物）。名声本身有力量——被越多人传颂，勇武与圣光越强。", "visual_signature": "歌谣、纹章上新增的记号、战利品。", "xianxia": {"concept": "历练 / 功德（参照）", "note": "差异：西方的功业需要「被看见与被讲述」，吟游诗人与歌谣是成长机制的一部分。"}, "familiarity": "高", "img": "entries/gr07/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GR08", "name": "圣物传承", "name_en": "Relic Inheritance", "category": "天赋与成长·成长途径", "function": "被一件古老之物选中：石中剑、先祖的戒指、圣徒的遗骨。器物认主即传下前主的部分力量与记忆。", "visual_signature": "器物在被选者手中第一次亮起。", "xianxia": {"concept": "传承 / 机缘 / 法宝认主（参照）"}, "familiarity": "高", "img": "entries/gr08/anchor_v1.png", "status": "reviewed"}, {"id": "GR09", "name": "炼金蜕变", "name_en": "Alchemical Transformation", "category": "天赋与成长·成长途径", "function": "饮下嬗变药剂改造身体：获得超常的力量或敏锐，代价是药力催生出「第二个自我」——它在夜里或失控时接管身体。源自十九世纪英国小说中喝药变身的医生原型。", "visual_signature": "药效发作时骨骼与面容扭曲，眼神换成另一个人。", "xianxia": {"concept": "洗髓伐骨 / 禁药（参照）"}, "familiarity": "中", "img": "entries/gr09/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GR10", "name": "吞噬", "name_en": "Devouring", "category": "天赋与成长·成长途径", "function": "吃下传说生物的心或血以获得其天赋：北欧英雄尝了龙心之血就听懂鸟语，龙血沐浴得刀枪不入。是一次性的传奇事件，不是可以反复吞服的修炼法；正道视为禁忌。", "visual_signature": "进食之后眼睛与皮肤出现被吞者的特征。", "xianxia": {"concept": "吞噬（参照）", "note": "差异：一生一次的传奇事件，获得的是一种具体天赋（鸟语、不坏之身），不是修为。"}, "familiarity": "中", "img": "entries/gr10/anchor_v1.png", "status": "reviewed_with_notes"}, {"id": "GR11", "name": "神恩", "name_en": "Grace (Divine Favor)", "category": "天赋与成长·成长途径", "function": "力量被直接赐予：天使显现、神迹降临、圣物祝福。无法强求，只能以信、以德、以牺牲回应。", "visual_signature": "光从高处落下，或梦中受召。", "xianxia": {"concept": "顿悟 / 天降机缘（参照）"}, "familiarity": "高", "img": "entries/gr11/anchor_v1.png", "status": "reviewed"}, {"id": "IR01", "name": "器物等第", "name_en": "Provenance Grades", "category": "道具与资源·品阶与制作", "function": "按来历分级而非掉落品质：凡品 Common（工坊量产）→ 名匠之作 Masterwork → 附魔器 Enchanted → 有名之器 Named（有名字和历史）→ 圣物 Hallowed（圣人或英雄遗留）→ 神造之器 God-wrought（世上唯一）。", "visual_signature": "六件同类器物按来历递进：从朴素凡品到神造之器，越往后越有名、越有灵性。", "xianxia": {"concept": "凡器 / 法器 / 灵器 / 宝器 / 仙器 / 神器（参照 ，适合作为信使或逃亡者的标志物。", "visual_signature": "旧皮长靴，鞋跟有风纹，走动时脚下留下风痕。", "xianxia": {"concept": "神行符 / 缩地成寸（参照）"}, "familiarity": "中", "img": "entries/it27/anchor_v1.png", "status": "reviewed"}, {"id": "IT28", "name": "隐身斗篷", "name_en": "Cloak of Invisibility", "category": "道具与资源·圣物与神器", "function": "披上即隐身的斗篷或帽子：北欧与日耳曼传说中的「隐身帽」（Tarnkappe）。", "visual_signature": "灰色旧斗篷，边缘像热浪般模糊。", "xianxia": {"concept": "隐身符 / 敛息法宝（参照）"}, "familiarity": "高", "img": "entries/it28/anchor_v3.png", "status": "reviewed"}, {"id": "IT29", "name": "王权器物", "name_en": "Regalia", "category": "道具与资源·圣物与神器", "function": "王冠、权杖与宝球：王权合法性的实物。古老的王权器物会「认」血统，冒名者佩戴时会出异象。", "visual_signature": "金冠、权杖、带小十字以外标志的宝球（本库用七芒太阳）。", "xianxia": {"concept": "传国玉玺（参照）"}, "familiarity": "高", "img": "entries/it29/anchor_v3.png", "status": "reviewed_with_notes"}, {"id": "IT30", "name": "女巫器具", "name_en": "Witch's Tools", "category": "道具与资源·圣物与神器", "function": "扫帚（飞行）、铁锅（熬药与占卜）、黑柄小刀（画圈与收割草药）、黑曜石镜。女巫的身份标志，也是猎巫人搜查的证物。", "visual_signature": "旧扫帚、黑铁锅、黑柄刀、草药束。", "xianxia": {"concept": "女修法器（参照）"}, "familiarity": "高", "img": "entries/it30/anchor_v2.png", "status": "reviewed"}, {"id": "MT01", "name": "以太晶", "name_en": "Aether Crystal", "category": "道具与资源·灵材", "function": "地脉交汇处生长的结晶：储存魔力，可为法阵与器物供能、为施法者补充魔力。稀有、被王国与教会垄断，是战略资源而不是货币——西幻的财富仍是金币、土地与圣物。", "visual_signature": "透明带淡紫与蓝的六棱晶簇，内部有缓慢流动的光。", "xianxia": {"concept": "灵石（参照）", "note": "差异：不当货币、不能批量开采；每一块大晶都有来历与主人。"}, "familiarity": "中", "img": "entries/mt01/anchor_v1.png", "status": "reviewed"}, {"id": "MT02", "name": "银", "name_en": "Silver", "category": "道具与资源·灵材", "function": "纯洁之金属：灼伤狼人、吸血鬼、亡灵与部分恶魔，银器可试毒。猎魔人与审判官的标配。", "visual_signature": "银剑、银弹、银粉、银链。", "xianxia": {"concept": "辟邪之物（参照）"}, "familiarity": "高", "img": "entries/mt02/anchor_v1.png", "status": "reviewed"}, {"id": "MT03", "name": "冷铁", "name_en": "Cold Iron", "category": "道具与资源·灵材", "function": "未经魔法熔炼的生铁或锻铁：灼伤妖精，打断魔法，马蹄铁挂门上可挡妖精。", "visual_signature": "粗糙黑铁、马蹄铁、铁钉。", "xianxia": {"concept": "破法之物（参照）"}, "familiarity": "中",
